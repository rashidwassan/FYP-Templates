<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sailab — Flood Preparedness & Relief Map</title>
<meta name="description" content="Map-first flood preparedness app for Pakistan: district alert levels computed from upstream river gauges and rainfall, FFD-style gauge dashboard, family evacuation planner with routes, relief-camp finder with registrations, camp supplies and volunteers, historical flood comparison, missing-person reunification board, notifications inbox, printable reports and a bilingual safety guide. Single-file FYP template.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens: emergency-operations slate, river blue, amber / red flood categories ---------- */
:root{
  --slate:#1e3a5f; --slate-deep:#142a47; --slate-soft:#e4ebf5; --river:#2f80ed; --river-soft:#e1edfc; --amber:#f2a900; --amber-soft:#fdf1cc; --amber-deep:#9a6a00;
  --red:#d7263d; --red-soft:#fbe0e4; --green:#2a9d5c; --green-soft:#e0f3e8; --orange:#e8711a; --orange-soft:#fde8d8; --maroon:#7a1b3a;
  --bg:#f3f6fa; --surface:#ffffff; --surface-2:#eaf0f7; --ink:#15233a; --muted:#5b6b80; --line:#d7e0ea;
  --radius:14px; --radius-sm:9px; --shadow:0 14px 40px -20px rgba(20,42,71,.45);
  --font:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif; --font-h:"Archivo","Source Sans 3",system-ui,sans-serif; --font-ur:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;
  --ease:cubic-bezier(.2,.8,.2,1); --dur:.35s; --top:58px;
}
html[data-text=large]{font-size:17px}
/* ---------- Motion kit ---------- */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
html[data-motion=reduced] *,html[data-motion=reduced] *::before,html[data-motion=reduced] *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes sheetIn{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
@keyframes ring{from{transform:scale(1);opacity:.75}to{transform:scale(2.6);opacity:0}}
@keyframes bellPulse{0%,100%{box-shadow:0 0 0 0 rgba(242,169,0,.55)}60%{box-shadow:0 0 0 8px rgba(242,169,0,0)}}
@keyframes confetti{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
@keyframes dash{to{stroke-dashoffset:-24}}
.enter{animation:fadeUp var(--dur) var(--ease) both}
.stagger>*{animation:fadeUp .45s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.btn{transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s,border-color .15s}
.btn:hover{transform:translateY(-1px)} .btn:active{transform:translateY(0) scale(.98)}
.card,.tile,.kpi{transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s}
.card:hover,.kpi:hover{transform:translateY(-2px);box-shadow:0 14px 34px -18px rgba(20,42,71,.4)}
.fill,.bar>i{transition:width .6s var(--ease)}
.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite}

/* ---------- Base ---------- */
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--river)}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.01em;font-family:var(--font-h)}
.ic{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.en{font-family:var(--font)!important;direction:ltr!important;text-align:left!important;line-height:1.45!important}
.muted{color:var(--muted)} .small{font-size:.82rem} .hidden{display:none!important} .num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ur,[lang=ur]{font-family:var(--font-ur);line-height:1.95;direction:rtl;text-align:right}
html[lang=ur] .txt,html[lang=ur] .lead,html[lang=ur] .note,html[lang=ur] .warn,html[lang=ur] .ok,html[lang=ur] .adv,html[lang=ur] .gcard p,html[lang=ur] .gcard li,html[lang=ur] .check span,html[lang=ur] .cl li,html[lang=ur] .notif .body,html[lang=ur] .setrow .d{font-family:var(--font-ur);line-height:1.9;direction:rtl;text-align:right}
html[lang=ur] .topnav a,html[lang=ur] .bottomnav a,html[lang=ur] .btn,html[lang=ur] .chip,html[lang=ur] .badge,html[lang=ur] .kpi .k,html[lang=ur] label.f,html[lang=ur] h2,html[lang=ur] h3,html[lang=ur] .phead h2,html[lang=ur] .seg button,html[lang=ur] .legend,html[lang=ur] .tab,html[lang=ur] .moregrid a{font-family:var(--font-ur);letter-spacing:0;line-height:1.7}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ---------- Top bar ---------- */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--top);z-index:40;background:linear-gradient(180deg,var(--slate-deep),var(--slate));color:#eef4fb;display:flex;align-items:center;gap:8px;padding:0 12px;box-shadow:0 4px 20px -8px rgba(0,0,0,.5)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:4px}
.brand .logo{width:36px;height:36px;border-radius:10px;background:var(--river);display:grid;place-items:center;color:#fff;flex:none}
.brand h1{font-size:1.05rem;font-weight:800;white-space:nowrap;letter-spacing:.01em}
.brand small{display:block;font-size:.7rem;opacity:.8;font-weight:500;font-family:var(--font);white-space:nowrap}
.topnav{display:flex;gap:1px}
.topnav a{color:#eef4fb;text-decoration:none;padding:8px 9px;border-radius:9px;font-weight:600;font-size:.84rem;opacity:.85;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;min-height:40px}
.topnav a:hover{background:rgba(255,255,255,.08);opacity:1}
.topnav a.active{background:var(--river);opacity:1}
.spacer{flex:1}
.mydist{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:3px 4px 3px 10px;min-width:0}
.mydist span{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.8;white-space:nowrap}
.mydist select{background:transparent;border:0;color:#fff;font-weight:700;outline:0;max-width:150px;padding:4px 2px;cursor:pointer;min-height:32px}
.mydist select option,.mydist select optgroup{color:var(--ink)}
.tbbtn{position:relative;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:10px;width:40px;height:40px;cursor:pointer;display:inline-grid;place-items:center;flex:none}
.tbbtn:hover{background:rgba(255,255,255,.18)}
.tbbtn .cnt{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--amber);color:var(--slate-deep);font-size:.68rem;font-weight:800;display:grid;place-items:center;padding:0 4px;animation:bellPulse 1.8s ease-out 3}
.lang{background:var(--amber);color:var(--slate-deep);border:0;border-radius:9px;padding:7px 10px;font-weight:800;cursor:pointer;min-height:40px;flex:none}

/* ---------- Map stage ---------- */
#stage{position:fixed;inset:var(--top) 0 0 0;background:#dbe5ef}
#map{position:absolute;inset:0;z-index:0;background:#dbe5ef}
#map svg.schem{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#map svg.schem:active{cursor:grabbing}
.leaflet-container{font-family:var(--font)}
.mk{background:none!important;border:0!important}
.mk .dot{display:block;position:relative;width:var(--s);height:var(--s);border-radius:50%;background:var(--c);border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35);transform:translate(-50%,-50%);transition:transform .2s var(--ease)}
.mk .dot.sq{border-radius:4px} .mk .dot.dia{border-radius:3px;transform:translate(-50%,-50%) rotate(45deg)}
.mk .dot.pulse::after{content:"";position:absolute;inset:-3px;border-radius:inherit;border:2px solid var(--c);animation:ring 1.6s ease-out infinite}
.mk .dot.sel{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--c),0 4px 10px rgba(0,0,0,.35);z-index:2}
.mk .dot.dim{opacity:.45}
.mk:hover .dot{transform:translate(-50%,-50%) scale(1.15)} .mk:hover .dot.dia{transform:translate(-50%,-50%) rotate(45deg) scale(1.15)}
.leaflet-tooltip{font-weight:700;font-size:.8rem;border-radius:8px;border-color:var(--line);color:var(--ink)}
.route-line{stroke-dasharray:10 8;animation:dash 1.2s linear infinite}
.schem .smk{cursor:pointer} .schem .smk circle,.schem .smk rect{stroke:#fff;stroke-width:2;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))} .schem .smk.dim{opacity:.45}
.schem .smk .rg{fill:none;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ring 1.6s ease-out infinite}
.schem .smk.sel circle,.schem .smk.sel rect{stroke-width:4}
.schem .river{fill:none;stroke:#5a9bea;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke} .schem .river.main{stroke-width:4} .schem .river.trib{stroke-width:2.2}
.schem .rl{font-size:13px;fill:#2a5fa8;font-weight:600;font-style:italic} .schem .pl{font-size:20px;fill:#6a7d96;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.6}
.schem .land{fill:#eef3f7;stroke:#9fb3c8;stroke-width:2;vector-effect:non-scaling-stroke} .schem .sea{fill:#c9dcef}
.schem .route{fill:none;stroke:#1e3a5f;stroke-width:3;vector-effect:non-scaling-stroke}
.mapctl{position:absolute;left:12px;top:12px;z-index:5;display:flex;flex-direction:column;gap:4px}
.mapctl button{width:40px;height:40px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15);color:var(--ink)}
.mapstatus{position:absolute;left:12px;bottom:12px;z-index:5;display:flex;flex-direction:column;gap:6px;align-items:flex-start;max-width:calc(100% - 520px)}
.mapstatus .pill{background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:.78rem;font-weight:700;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 10px rgba(0,0,0,.12);color:var(--ink)}
.mapstatus .pill.sim{color:var(--amber-deep);background:var(--amber-soft);border-color:#ead49a}
.legend{display:flex;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.76rem;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.legend i.sq{border-radius:2px} .legend i.dia{border-radius:2px;transform:rotate(45deg)} .legend i.ln{width:16px;height:3px;border-radius:2px;vertical-align:2px}

/* ---------- Floating panel / bottom sheet ---------- */
.panel{position:absolute;top:14px;right:14px;bottom:14px;width:min(480px,calc(100vw - 28px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;z-index:6;animation:slideIn .45s var(--ease) both}
.handle{display:none;padding:8px 0 4px;cursor:grab;touch-action:none;flex:none}
.handle span{display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.phead{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;border-bottom:1px solid var(--line);flex:none}
.phead h2{font-size:1.15rem;display:flex;align-items:center;gap:8px;min-width:0}
.phead h2 .ic{color:var(--river)}
.phead .pactions{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pbody{padding:14px 18px 22px;overflow:auto;flex:1;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.pbody>*+*{margin-top:12px}
.lead{margin:0;color:var(--muted);font-size:.92rem}

/* ---------- Generic components ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;position:relative}
.card.flat:hover{transform:none;box-shadow:none}
.card.soft{background:var(--surface-2)}
.card h3{font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;background:var(--slate);color:#fff;display:inline-flex;align-items:center;gap:7px;min-height:40px;text-decoration:none;font-size:.9rem;white-space:nowrap}
.btn.river{background:var(--river)} .btn.amber{background:var(--amber);color:var(--slate-deep)} .btn.danger{background:var(--red-soft);color:var(--red)} .btn.green{background:var(--green)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:.82rem;border-radius:8px;min-height:36px} .btn.block{width:100%;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.iconbtn{background:var(--surface-2);border:1px solid var(--line);color:var(--ink);border-radius:9px;width:40px;height:40px;cursor:pointer;display:inline-grid;place-items:center}
.iconbtn.on{background:var(--slate);color:#fff;border-color:var(--slate)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 11px;font-size:.82rem;font-weight:700;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:5px;min-height:34px}
.chip.on{background:var(--slate);border-color:var(--slate);color:#fff}
.chip.need{background:var(--amber-soft);border-color:#ead49a;color:var(--amber-deep);cursor:default;min-height:28px;padding:3px 9px;font-size:.76rem}
.chip.skill{background:var(--river-soft);border-color:#bcd4f5;color:var(--slate);cursor:default;min-height:26px;padding:2px 8px;font-size:.72rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:none;padding:8px 12px;cursor:pointer;font-weight:700;font-size:.85rem;min-height:40px;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--slate);color:#fff}
.seg.wide{display:flex} .seg.wide button{flex:1;justify-content:center}
select,input[type=number],input[type=text],input[type=tel],input[type=search],input[type=date],textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;outline:0;min-height:40px}
select:focus,input:focus,textarea:focus{border-color:var(--river);box-shadow:0 0 0 3px var(--river-soft)}
textarea{resize:vertical;min-height:70px}
label.f{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin:10px 0 5px}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px} .cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:var(--surface-2);width:40px;height:40px;cursor:pointer;display:grid;place-items:center}
.stepper output{flex:1;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:600;font-size:.88rem;min-height:40px}
.toggle input{width:18px;height:18px;accent-color:var(--slate);margin:0}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:7px;padding:2px 8px;font-size:.72rem;font-weight:800;background:var(--surface-2);color:var(--muted);white-space:nowrap;letter-spacing:.02em}
.badge.c{background:color-mix(in srgb,var(--c) 15%,#fff);color:var(--c)}
.badge.solid{background:var(--c);color:#fff}
.bar{height:8px;background:var(--surface-2);border-radius:5px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;width:0;background:var(--c,var(--river));border-radius:5px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{border:1px solid var(--line);border-radius:12px;padding:10px 10px 8px;background:var(--surface);cursor:pointer;text-align:left;border-top:4px solid var(--c)}
.kpi.on{background:color-mix(in srgb,var(--c) 10%,#fff);border-color:var(--c)}
.kpi.static{cursor:default}
.kpi .k{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-size:1.5rem;font-weight:800;font-family:var(--font-h);color:var(--c);line-height:1.1;margin-top:2px}
.kpi .s{font-size:.72rem;color:var(--muted);margin-top:2px}
.note{background:var(--river-soft);border-left:4px solid var(--river);padding:9px 12px;border-radius:8px;font-size:.88rem}
.warn{background:var(--amber-soft);border-left:4px solid var(--amber);padding:9px 12px;border-radius:8px;font-size:.88rem}
.danger-note{background:var(--red-soft);border-left:4px solid var(--red);padding:9px 12px;border-radius:8px;font-size:.88rem}
.ok{background:var(--green-soft);border-left:4px solid var(--green);padding:9px 12px;border-radius:8px;font-size:.88rem}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar .search{flex:1;min-width:140px;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--surface)}
.toolbar .search input{border:0;padding:8px 0;min-height:38px} .toolbar .search input:focus{box-shadow:none}
.empty{text-align:center;color:var(--muted);padding:26px 12px;border:1px dashed var(--line);border-radius:12px}
.empty .ic{width:2em;height:2em;display:block;margin:0 auto 8px;color:var(--river)}
.todo{border:1px dashed var(--slate);border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.todo h4{margin:0 0 5px;font-size:.95rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.todo .stars{color:var(--amber-deep);font-size:.8rem;letter-spacing:.1em}
.todo code,.kbd{font-size:.78rem;background:#fff;border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.kbd{font-family:ui-monospace,Menlo,monospace;border-bottom-width:2px}
.spark{width:96px;height:30px;display:block}
.rainbars{display:inline-flex;gap:2px;align-items:flex-end;height:16px;vertical-align:middle;margin-left:4px}
.rainbars i{width:4px;background:var(--river);border-radius:1px;display:block;min-height:1px}
.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:12px}

/* ---------- Alerts ---------- */
.dcard{border-left:5px solid var(--c);cursor:pointer}
.dcard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.dcard .name{font-weight:800;font-size:1.02rem;font-family:var(--font-h)}
.dcard .sub{font-size:.78rem;color:var(--muted)}
.dcard .score{font-family:var(--font-h);font-weight:800;font-size:1.35rem;color:var(--c);line-height:1}
.dcard .meta{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:8px;align-items:center}
.dcard .meta b{color:var(--ink)}
.dcard .adv{display:none;margin-top:10px;font-size:.88rem;border-top:1px solid var(--line);padding-top:10px}
.dcard.open .adv{display:block;animation:fadeIn .3s}
.dcard.mine{box-shadow:0 0 0 2px var(--river-soft),var(--shadow)}
.mine-tag{background:var(--river);color:#fff;border-radius:6px;padding:2px 7px;font-size:.68rem;font-weight:800}

/* ---------- Gauges / charts ---------- */
.station{cursor:pointer;border-left:5px solid var(--c)}
.station .top{display:flex;align-items:center;gap:10px}
.station .nm{font-weight:800;font-family:var(--font-h)} .station .rv{font-size:.76rem;color:var(--muted)}
.station .cur{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.station .cur b{font-family:var(--font-h);font-size:1.05rem}
.station.sel{background:color-mix(in srgb,var(--c) 7%,#fff);border-color:var(--c)}
.gbar{position:relative;height:12px;background:var(--surface-2);border-radius:6px;margin-top:8px;overflow:visible}
.gbar .fill{position:absolute;left:0;top:0;height:100%;width:0;border-radius:6px;background:var(--c)}
.gbar .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.gbar .tick::after{content:attr(data-l);position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:.6rem;font-weight:800;color:var(--muted);margin-top:2px}
.chart{position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:6px}
.chart svg{width:100%;height:230px;display:block;overflow:visible}
.chart.short svg{height:170px}
.chart .tip{position:absolute;pointer-events:none;background:var(--slate-deep);color:#fff;border-radius:8px;padding:6px 9px;font-size:.76rem;transform:translate(-50%,-112%);white-space:nowrap;display:none;z-index:2;font-variant-numeric:tabular-nums}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;margin-top:6px}
.lg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.lg i.dash{background:repeating-linear-gradient(90deg,currentColor 0 3px,transparent 3px 6px)}
.lg i.box{width:10px;height:10px;border-radius:2px}

/* ---------- Plan ---------- */
.ringwrap{display:flex;align-items:center;gap:14px}
.ring{width:72px;height:72px;flex:none} .ring circle{fill:none;stroke-width:8} .ring .trk{stroke:var(--surface-2)} .ring .val{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset .7s var(--ease);transform:rotate(-90deg);transform-origin:center}
.ring text{font-family:var(--font-h);font-weight:800;font-size:17px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.check{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;background:var(--surface);min-height:44px}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--green);flex:none}
.check.done span{text-decoration:line-through;color:var(--muted)}
.cl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.cl li{display:flex;gap:9px;align-items:flex-start;border-radius:10px;padding:8px 10px;background:var(--surface-2);font-size:.9rem}
.cl li .p{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:.7rem;font-weight:800;color:#fff;background:var(--c);font-family:var(--font-h)}
.leave{border-radius:14px;padding:14px 16px;color:#fff;background:var(--c)}
.leave h3{color:#fff;font-size:1.1rem} .leave p{margin:6px 0 0;opacity:.95;font-size:.9rem}
.eta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.eta button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:700;min-height:60px}
.eta button b{font-family:var(--font-h);font-size:.95rem}
.eta button.on{border-color:var(--slate);background:var(--slate-soft)}

/* ---------- Camps / supplies ---------- */
.camp .top{display:flex;gap:10px;align-items:flex-start} .camp .nm{font-weight:800;font-family:var(--font-h)} .camp .sub{font-size:.78rem;color:var(--muted)}
.camp .ico{width:40px;height:40px;border-radius:10px;background:var(--slate-soft);display:grid;place-items:center;color:var(--slate);flex:none}
.fac{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.fac span{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;border-radius:7px;padding:3px 7px;background:var(--green-soft);color:var(--green)}
.fac span.no{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.occ{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.8rem} .occ .bar{flex:1}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.inv{display:grid;grid-template-columns:minmax(0,1fr) 92px 64px;gap:4px 10px;align-items:center;font-size:.85rem}
.inv .h{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.inv .nm{display:flex;align-items:center;gap:6px;min-width:0} .inv .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inv .q{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.days{font-family:var(--font-h);font-weight:800;text-align:right;white-space:nowrap}
.days.bad{color:var(--red)} .days.warn{color:var(--amber-deep)} .days.ok{color:var(--green)}
.vol{display:flex;align-items:center;gap:10px}
.vol .av{width:36px;height:36px;border-radius:50%;background:var(--slate-soft);color:var(--slate);display:grid;place-items:center;font-weight:800;font-family:var(--font-h);flex:none}
.vol select{min-height:34px;padding:4px 8px;font-size:.82rem;width:auto;max-width:150px}

/* ---------- Missing ---------- */
.post{display:flex;gap:12px;align-items:flex-start;border-left:5px solid var(--c)}
.post .photo{width:72px;height:72px;border-radius:10px;object-fit:cover;background:var(--surface-2);flex:none;display:grid;place-items:center;color:var(--muted)}
.post .photo .ic{width:1.8em;height:1.8em}
.post .nm{font-weight:800;font-family:var(--font-h);font-size:1rem}
.post .info{font-size:.82rem;color:var(--muted);margin-top:2px}
.post .body{flex:1;min-width:0}
.match{margin-top:8px;border:1px dashed var(--amber);background:var(--amber-soft);border-radius:10px;padding:8px 10px;font-size:.82rem}
.match b.sc{font-family:var(--font-h);color:var(--amber-deep)}
.photo-pick{display:flex;gap:10px;align-items:center}
.photo-pick img{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--surface-2)}

/* ---------- Guide / history ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow:auto}
.tab{border:0;background:none;padding:9px 12px;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:6px;min-height:40px;white-space:nowrap}
.tab.on{color:var(--slate);border-color:var(--river)}
.gcard{border-left:5px solid var(--c)} .gcard h3{font-size:.98rem} .gcard h3 .ic{color:var(--c)} .gcard p{margin:6px 0 0;font-size:.9rem}
.sos{background:var(--slate-deep);color:#eef4fb;border-radius:14px;padding:14px 16px}
.sos h3{color:#fff} .sos textarea{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.2);font-size:.88rem;min-height:120px}
.sos .btn.ghost{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}
.sos input[type=text]{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.2)}
.sos label.f{color:#cfe0f5}
.help{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.help input{min-height:36px;padding:6px 9px}
.tl{border-left:3px solid var(--line);margin-left:9px;padding-left:16px;display:flex;flex-direction:column;gap:12px}
.tl .ev{position:relative}
.tl .ev::before{content:"";position:absolute;left:-24px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--c,var(--river));border:2px solid #fff;box-shadow:0 0 0 2px var(--line)}
.tl .yr{font-family:var(--font-h);font-weight:800;color:var(--c,var(--river))}
.tl .ev p{margin:2px 0 0;font-size:.86rem}

/* ---------- Inbox / settings ---------- */
.notif{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);cursor:pointer}
.notif.unread{background:var(--river-soft);border-color:#bcd4f5}
.notif .ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;background:var(--c);flex:none}
.notif .body{flex:1;min-width:0} .notif .ttl{font-weight:800;font-size:.92rem} .notif .tx{font-size:.84rem;color:var(--muted);margin-top:2px}
.notif .when{font-size:.72rem;color:var(--muted);white-space:nowrap}
.act{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.act .ic{color:var(--river)} .act .when{margin-left:auto;font-size:.72rem;color:var(--muted);white-space:nowrap}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .l{font-weight:700;font-size:.92rem} .setrow .d{font-size:.78rem;color:var(--muted)}
.setrow .seg button{min-height:36px;padding:6px 10px;font-size:.8rem}
.setrow select{width:auto;max-width:200px;min-height:36px;padding:6px 9px}
.switch{position:relative;width:46px;height:26px;border-radius:13px;background:var(--line);border:0;cursor:pointer;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s var(--ease)}
.switch.on{background:var(--green)} .switch.on::after{transform:translateX(20px)}

/* ---------- Modal / search / tour / more menu ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,42,71,.45);backdrop-filter:blur(2px);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
body.modal-open .scrim{opacity:1;pointer-events:auto}
.modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:16px}
body.modal-open .modal{display:flex}
.modal .box{background:var(--surface);border-radius:16px;width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:var(--shadow);animation:pop .25s var(--ease) both}
.modal .box header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal .box header h2{font-size:1.1rem;flex:1}
.modal .box .mbody{padding:14px 18px 20px}
.srch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--surface-2)}
.srch input{border:0;background:none;min-height:46px;font-size:1rem} .srch input:focus{box-shadow:none}
.sres{margin-top:10px;display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow:auto}
.sres .grp{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800;margin:8px 0 2px}
.sres a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.9rem}
.sres a:hover,.sres a.on{background:var(--river-soft)} .sres a .ic{color:var(--river)} .sres a small{margin-left:auto;color:var(--muted);font-weight:500;white-space:nowrap}
.moregrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.moregrid a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);font-weight:700;font-size:.78rem;text-align:center;position:relative}
.moregrid a .ic{width:1.5em;height:1.5em;color:var(--river)} .moregrid a.active{background:var(--river-soft);border-color:var(--river)}
.moregrid a .cnt{position:absolute;top:6px;right:8px;background:var(--amber);color:var(--slate-deep);border-radius:8px;font-size:.66rem;padding:0 5px;font-weight:800}
.tour{position:fixed;inset:0;z-index:85}
.tour .spot{position:absolute;border-radius:12px;box-shadow:0 0 0 9999px rgba(20,42,71,.6);transition:all .35s var(--ease);pointer-events:none}
.tourbox{position:absolute;background:var(--surface);border-radius:14px;padding:16px;width:min(340px,calc(100vw - 32px));box-shadow:var(--shadow);animation:pop .3s var(--ease) both}
.tourbox h3{font-size:1.05rem} .tourbox p{margin:6px 0 10px;font-size:.9rem;color:var(--muted)}
.tourbox .dots{display:flex;gap:5px;align-items:center;margin-right:auto} .tourbox .dots i{width:7px;height:7px;border-radius:50%;background:var(--line)} .tourbox .dots i.on{background:var(--river)}
.tourbox .foot{display:flex;gap:6px;align-items:center}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:90;pointer-events:none}
.toast{background:var(--slate-deep);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:toastIn .3s var(--ease) both,toastOut .3s ease-in 2.8s forwards;display:flex;align-items:center;gap:8px;max-width:min(92vw,520px)}
.toast.ok{background:var(--green)} .toast.bad{background:var(--red)} .toast.amber{background:var(--amber);color:var(--slate-deep)}
.bottomnav{display:none;position:fixed;left:0;right:0;bottom:0;height:56px;background:var(--surface);border-top:1px solid var(--line);z-index:45;padding:0 2px}
.bottomnav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:.62rem;font-weight:700;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;position:relative;border:0;background:none;cursor:pointer}
.bottomnav a .ic{width:1.35em;height:1.35em}
.bottomnav a.active{color:var(--river)}
.bottomnav a .cnt{position:absolute;top:2px;right:calc(50% - 20px);background:var(--amber);color:var(--slate-deep);border-radius:8px;font-size:.6rem;padding:0 4px;font-weight:800}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.confetti i{position:absolute;left:50%;top:45%;width:10px;height:14px;border-radius:2px;animation:confetti 1.1s var(--ease) forwards}
#printArea{display:none}

@media (max-width:1240px){ .topnav a .lbl{display:none} .topnav a{padding:8px 10px} .brand small{display:none} }
@media (max-width:900px){
  .topnav,#searchBtn,#settingsBtn{display:none}
  .brand h1{font-size:1rem}
  .mydist span{display:none} .mydist select{max-width:130px}
  #stage{bottom:56px}
  .bottomnav{display:flex}
  .panel{top:auto;left:0;right:0;bottom:0;width:auto;border-radius:18px 18px 0 0;height:54vh;transition:height .3s var(--ease);animation:sheetIn .4s var(--ease) both;box-shadow:0 -10px 40px -16px rgba(20,42,71,.5)}
  .panel.dragging{transition:none}
  .panel[data-state=peek]{height:118px} .panel[data-state=full]{height:calc(100% - 10px)}
  .handle{display:block}
  .phead{padding:4px 16px 10px}
  .pbody{padding:12px 14px 20px}
  .mapstatus{max-width:calc(100% - 24px);bottom:auto;top:12px;left:60px;flex-direction:row;flex-wrap:wrap}
  .legend{font-size:.7rem;gap:7px}
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr))} .kpi .v{font-size:1.25rem} .kpi .k{font-size:.6rem}
  .cols3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .inv{grid-template-columns:minmax(0,1fr) 80px 56px}
  #toasts{bottom:72px}
}
@media (max-width:420px){ .mydist select{max-width:110px;font-size:.85rem} .lang{padding:7px 9px} }
@media print{
  body{overflow:visible;height:auto;background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;font-family:var(--font);color:#000;padding:10mm}
  #printArea .pc{border:2px solid #1e3a5f;border-radius:10px;padding:14px 18px;max-width:760px;margin:0 auto}
  #printArea h1{font-size:1.4rem;font-family:var(--font-h)} #printArea h2{font-size:1rem;margin-top:14px;border-bottom:1px solid #999;padding-bottom:4px}
  #printArea table{width:100%;border-collapse:collapse;font-size:.86rem} #printArea td,#printArea th{padding:5px 6px;border-bottom:1px solid #ddd;vertical-align:top;text-align:left} #printArea th{font-size:.72rem;text-transform:uppercase;color:#555}
  #printArea .ur{font-family:var(--font-ur);direction:rtl;text-align:right}
  #printArea .meta{font-size:.8rem;color:#555}
  #printArea .lvl{display:inline-block;padding:1px 6px;border-radius:4px;color:#fff;font-size:.72rem;font-weight:700}
}

<script>
'use strict';
/* =====================================================================
   Sailab — Flood Preparedness & Relief Map (single-file FYP template)

   Sections
     1. utils                 helpers, storage, formatting, motion kit
     2. i18n                  English / Urdu dictionary
     3. seed data             stations, districts, camps, inventory items,
                              volunteers, guide, helplines, go-bag, posts,
                              flood history
     4. flood engine          gauge series, FFD categories, district risk
     5. map adapter           Leaflet (lazy) → SVG Indus-basin schematic
     6. view helpers          panel header, badges, charts, modal
     7. alerts                district cards + situation report
     8. gauges                station list + 14-day chart
     9. plan                  household, checklist, go-bag, route, camps
    10. camps                 finder, updates, family registration
    11. supplies              camp inventory, stock log, volunteers
    12. missing               reunification board + matching
    13. guide                 before/during/after, helplines, SOS
    14. history               past floods compare, rainfall
    15. inbox                 notifications + activity log
    16. settings              preferences, data export/import/reset
    17. about                 problem, method, student TODO list
    18. reports               printable sitrep / plan card / registers
    19. search, tour          global search, onboarding spotlight tour
    20. sheet, router, boot   bottom sheet, navigation, start-up

   Student extension points are marked with  TODO(student)
   ===================================================================== */

// =====================================================================
// 1. utils
// =====================================================================
const NS = 'sailab:';
const $ = (selector, root = document) => root.querySelector(selector);
const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

// Namespaced localStorage wrapper. Every key below is documented in the README module map.
const store = {
  get(key, fallback) {
    try {
      const raw = localStorage.getItem(NS + key);
      return raw == null ? fallback : JSON.parse(raw);
    } catch {
      return fallback;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(NS + key, JSON.stringify(value));
      return true;
    } catch {
      return false;
    }
  },
  del(key) {
    try {
      localStorage.removeItem(NS + key);
    } catch {
      /* storage unavailable */
    }
  }
};

const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const uid = () => Math.random().toString(36).slice(2, 9);
const ic = (name, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const nf = new Intl.NumberFormat('en-PK', { maximumFractionDigits: 0 });
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
const sum = list => list.reduce((acc, v) => acc + v, 0);

// Short number: 552500 → "553k", 92000 → "92k", 640 → "640"
function kfmt(n) {
  if (n >= 100000) return Math.round(n / 1000) + 'k';
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
  return String(Math.round(n));
}

// FNV-1a string hash → 32-bit unsigned integer (seeds the RNG)
function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

// Mulberry32 seeded PRNG → function returning [0, 1)
function rng(seed) {
  return () => {
    seed |= 0;
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// Great-circle distance in km between two {lat, lng} points
function haversine(a, b) {
  const R = 6371;
  const rad = x => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat);
  const dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

const today = new Date();
today.setHours(0, 0, 0, 0);
const asOf = new Date(today);
asOf.setHours(6, 0, 0, 0);

function dateOf(index, length) {
  const d = new Date(today);
  d.setDate(d.getDate() - (length - 1 - index));
  return d;
}

const locale = () => (lang === 'ur' ? 'ur-PK' : 'en-PK');
const dLabel = d => d.toLocaleDateString(locale(), { day: 'numeric', month: 'short' });
const stamp = d => d.toLocaleString(locale(), { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

function timeAgo(ts) {
  const minutes = Math.max(1, Math.round((Date.now() - ts) / 60000));
  if (minutes < 60) return minutes + ' ' + t('ago_m');
  const hours = Math.round(minutes / 60);
  if (hours < 24) return hours + ' ' + t('ago_h');
  return Math.round(hours / 24) + ' ' + t('ago_d');
}

function toast(message, type = '', icon = 'info') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = ic(icon) + '<span></span>';
  el.lastChild.textContent = message;
  $('#toasts').append(el);
  setTimeout(() => el.remove(), 3200);
}

// ---- motion kit helpers ----
function animateIn(root) {
  root.classList.remove('enter');
  void root.offsetWidth;
  root.classList.add('enter');
  staggerChildren(root);
}

function staggerChildren(root) {
  $$('.stagger', root).forEach(group => {
    [...group.children].forEach((el, i) => el.style.setProperty('--i', i));
  });
}

function countUp(el, to, { dur = 700, fmt = v => Math.round(v).toLocaleString('en-PK') } = {}) {
  const start = performance.now();
  const step = now => {
    const p = Math.min(1, (now - start) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(to * eased);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function drawPath(path) {
  const length = path.getTotalLength();
  path.style.strokeDasharray = length;
  path.style.strokeDashoffset = length;
  path.getBoundingClientRect();
  path.style.transition = 'stroke-dashoffset .9s var(--ease)';
  path.style.strokeDashoffset = 0;
}

function animateBars(root) {
  requestAnimationFrame(() => {
    $$('[data-w]', root).forEach(el => {
      el.style.width = el.dataset.w + '%';
    });
  });
}

function download(filename, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 500);
}

const DAYS = 14;
const seriesCache = new Map();

/** 14-day inflow / outflow series (cusecs) for a station. Deterministic per station id — a simulated flood wave. */
function series(id) {
  if (seriesCache.has(id)) return seriesCache.get(id);
  const s = SM[id];
  const r = rng(hash('flow|' + id));
  const inflow = [];
  const outflow = [];

  for (let i = 0; i < DAYS; i++) {
    const wave = s.sc.base + s.sc.peak * Math.exp(-(((i - s.sc.tPeak) / s.sc.w) ** 2));
    const noisy = wave * (1 + (r() - .5) * .05);
    inflow.push(Math.round(noisy / 500) * 500);
  }

  // Dams attenuate the wave (store part of it); barrages pass roughly 94% after canal withdrawals, one day later.
  for (let i = 0; i < DAYS; i++) {
    const prev = inflow[Math.max(0, i - 1)];
    const released = s.kind === 'dam' ? s.sc.base * .85 + (prev - s.sc.base) * .6 : prev * .94;
    outflow.push(Math.round(released / 500) * 500);
  }

  const out = { inflow, outflow };
  seriesCache.set(id, out);
  return out;
}

const level = id => series(id).inflow[DAYS - 1];

/** FFD category index 0..5 for a discharge against the station thresholds. */
function gcat(id, value = level(id)) {
  const th = SM[id].th;
  let k = 0;
  while (k < 5 && value >= th[k]) k++;
  return k;
}
const gcatMeta = k => ({ key: GCATS[k][0], c: GCATS[k][1] });

/** Position of the current discharge on the flood-category ladder, 0..1 (0.2 per band). */
function gaugeFrac(id) {
  const th = SM[id].th;
  const v = level(id);
  if (v < th[0]) return .2 * v / th[0];
  for (let k = 0; k < 4; k++) {
    if (v < th[k + 1]) return .2 * (k + 1) + .2 * (v - th[k]) / (th[k + 1] - th[k]);
  }
  return 1;
}

/** Seeded 7-day rainfall (mm per day) for a district. */
function rain7(d) {
  const r = rng(hash('rain|' + d.id));
  return Array.from({ length: 7 }, () => Math.round(d.rs * 45 * (.3 + r() * 1.4)));
}

/** District risk 0–100 and alert level. See the About page for the formula. */
function risk(d) {
  const rain = sum(rain7(d));
  const rainFrac = clamp(rain / 250, 0, 1);
  const score = d.gauge
    ? .55 * gaugeFrac(d.gauge) + .30 * rainFrac + .15 * d.vuln
    : .70 * rainFrac + .30 * d.vuln;
  const s = Math.round(score * 100);
  const lv = s >= 70 ? 'severe' : s >= 50 ? 'warning' : s >= 30 ? 'watch' : 'normal';
  return { score: s, lv, rain, c: LEVELS[lv].c };
}

const riskCache = new Map();
function R(d) {
  if (!riskCache.has(d.id)) riskCache.set(d.id, risk(d));
  return riskCache.get(d.id);
}

function trend(id) {
  const a = series(id).inflow;
  const delta = (a[DAYS - 1] - a[DAYS - 2]) / a[DAYS - 2] * 100;
  const key = delta > 1.5 ? 'g_up' : delta < -1.5 ? 'g_down' : 'g_flat';
  const icon = delta > 1.5 ? 'trending-up' : delta < -1.5 ? 'trending-down' : 'activity';
  return { dlt: delta, key, icon };
}

// ---- camps: seeded occupancy + local updates + registered families ----
const getRegistrations = () => store.get('registrations', []);

function campData(c) {
  const update = store.get('campUpdates', {})[c.id];
  const since = update ? update.ts : 0;
  const registered = getRegistrations()
    .filter(reg => reg.camp === c.id && reg.ts > since)
    .reduce((acc, reg) => acc + reg.members, 0);
  const base = update ? update.occ : c.occ;
  return { ...c, occ: base + registered, needs: update ? update.needs : c.needs, updated: update ? update.ts : null };
}

const occColor = c => {
  const f = c.occ / c.cap;
  if (f >= .95) return LEVELS.severe.c;
  if (f >= .7) return LEVELS.warning.c;
  return LEVELS.normal.c;
};

function nearestCamps(from, n = 3) {
  return CAMPS
    .map(c => ({ c: campData(c), km: haversine(from, c) }))
    .sort((a, b) => a.km - b.km)
    .slice(0, n);
}

// ---- supplies: seeded stock per camp with local overrides ----
function inventorySeed(c) {
  const r = rng(hash('inv|' + c.id));
  const occ = Math.max(50, c.occ);
  const stock = {};
  ITEMS.forEach(it => {
    const shortNeed = c.needs.some(n => NEED_ITEM[n.trim()] === it.id);
    if (it.kind === 'daily') {
      const days = shortNeed ? .6 + r() * .9 : 2 + r() * 5;
      stock[it.id] = Math.round(occ * it.rate * days);
    } else {
      const coverage = shortNeed ? .35 + r() * .2 : .7 + r() * .5;
      stock[it.id] = Math.round(occ / it.rate * coverage);
    }
  });
  return stock;
}

function stockOf(campId) {
  const overrides = store.get('inventory', {})[campId];
  return Object.assign(inventorySeed(CM[campId]), overrides || {});
}

/** Days of supply (daily items) or coverage ratio (stock items) for one camp + item. */
function supplyStatus(c, it, qty) {
  const occ = Math.max(1, c.occ);
  if (it.kind === 'daily') {
    const days = qty / (occ * it.rate);
    return { days, ratio: Math.min(1, days / 7), bad: days < 1, warn: days < 2 };
  }
  const coverage = qty * it.rate / occ;
  return { coverage, ratio: Math.min(1, coverage), bad: coverage < .4, warn: coverage < .6 };
}

function shortages() {
  const rows = [];
  CAMPS.map(campData).forEach(c => {
    const stock = stockOf(c.id);
    ITEMS.forEach(it => {
      const st = supplyStatus(c, it, stock[it.id]);
      if (st.warn) rows.push({ c, it, qty: stock[it.id], st });
    });
  });
  const severity = row => (row.st.days ?? row.st.coverage * 3);
  return rows.sort((a, b) => severity(a) - severity(b));
}

// ---- notifications derived from the scenario (deterministic ids so read state survives reloads) ----
function buildNotifications() {
  const list = [];
  const push = (id, type, c, icon, title, body, hoursAgo, go) => {
    list.push({ id, type, c, icon, title, body, ts: asOf.getTime() - hoursAgo * 3600000, go });
  };
  const mine = DM[myDistrict];
  const mineRisk = R(mine);

  push('sys', 'system', '#6b8cae', 'info', t('i_system'), `${t('g_asof')} ${stamp(asOf)} PKT`, 0, '#about');
  push('mine:' + mine.id, 'alert', mineRisk.c, 'siren', `${name(mine)}: ${t('lv_' + mineRisk.lv)} · ${t('al_risk')} ${mineRisk.score}`, t('adv_' + mineRisk.lv), 1, '#alerts/' + mine.id);

  STATIONS.filter(s => gcat(s.id) >= 3).forEach((s, i) => {
    const m = gcatMeta(gcat(s.id));
    push('gauge:' + s.id, 'gauge', m.c, 'gauge', `${name(s)} ${t('i_crossed')} ${t('gc_' + m.key)}`, `${flowFull(level(s.id))} ${flowUnit()} · ${t(trend(s.id).key)}`, 2 + i, '#gauges/' + s.id);
  });

  DISTRICTS.filter(d => R(d).lv === 'severe' && d.id !== mine.id).slice(0, 3).forEach((d, i) => {
    push('sev:' + d.id, 'alert', LEVELS.severe.c, 'alert', `${t('lv_severe')}: ${name(d)} (${R(d).score})`, bi(d.note, d.noteUr), 5 + i, '#alerts/' + d.id);
  });

  nearestCamps(mine, 6).filter(({ c }) => c.occ / c.cap >= .9).forEach(({ c, km }, i) => {
    push('camp:' + c.id, 'camp', LEVELS.warning.c, 'tent', `${c.en} ${t('i_full')}`, `${Math.round(c.occ / c.cap * 100)}% · ${km.toFixed(0)} ${t('p_km')}`, 8 + i, '#camps/' + c.id);
  });

  const posts = getPosts();
  posts.filter(p => p.status === 'missing').forEach(p => {
    const best = matches(p, posts)[0];
    if (best) push('match:' + p.id, 'match', LEVELS.normal.c, 'sparkles', `${t('i_match')} ${p.name}`, `${best.o.name} · ${Math.round(best.s * 100)}%`, 12, '#missing');
  });

  return list.sort((a, b) => b.ts - a.ts);
}

const noMapFlag = () => /nomap=1/.test(location.search + location.hash);

function loadScript(src, ms = 8000) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error('load ' + src));
    document.head.append(s);
    setTimeout(() => reject(new Error('timeout ' + src)), ms);
  });
}

function loadStyle(href, ms = 8000) {
  return new Promise((resolve, reject) => {
    const l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = href;
    l.onload = resolve;
    l.onerror = () => reject(new Error('load ' + href));
    document.head.append(l);
    setTimeout(() => reject(new Error('timeout ' + href)), ms);
  });
}

const MapCtl = {
  mode: null,
  map: null,
  layer: null,
  routeLayer: null,
  items: [],
  route: null,
  svg: null,
  g: null,
  vb: { x: 0, y: 0, w: 1000, h: 940 },
  tileOk: 0,
  tileErr: 0,
  first: true,
  last: null,
  pending: { focus: null, fit: null },
  legendItems: [],

  /** Equirectangular projection into the 1000-unit-wide schematic. */
  proj(lat, lng) {
    return [(lng - 60.4) * 58.82, (37.3 - lat) * 68.3];
  },

  /** Visible-area padding in px: the floating panel (desktop) or the bottom sheet (mobile) covers part of the map. */
  pads() {
    const pr = $('#panel').getBoundingClientRect();
    if (window.innerWidth <= 900) return { tl: [12, 110], br: [12, pr.height + 12] };
    return { tl: [60, 20], br: [pr.width + 36, 60] };
  },

  async init() {
    // TODO(student): offline map tiles + PWA. Cache OSM tiles for the user's district in a service worker (or bundle MBTiles) so the real map works offline.
    if (!noMapFlag() && navigator.onLine) {
      try {
        await Promise.all([
          loadStyle('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'),
          loadScript('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js')
        ]);
        this.initLeaflet();
        return;
      } catch {
        /* fall through to the schematic */
      }
    }
    this.initSvg();
  },

  initLeaflet() {
    this.mode = 'leaflet';
    this.first = true;
    this.map = L.map('map', { zoomControl: true, attributionControl: true, zoomSnap: .5 });
    if (!this.pending.fit && !this.pending.focus) {
      this.map.setView([28.6, 69.0], 6);
      this.first = false;
    }
    const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '&copy; OpenStreetMap contributors' });
    tiles.addTo(this.map);
    tiles.on('tileload', () => this.tileOk++);
    tiles.on('tileerror', () => this.onTileError());
    this.layer = L.layerGroup().addTo(this.map);
    this.routeLayer = L.layerGroup().addTo(this.map);
    this.updateStatus();
  },

  // If no tile ever loads, the device is offline: switch to the schematic so the app stays usable.
  onTileError() {
    this.tileErr++;
    if (this.tileOk || this.tileErr < 4 || this.mode !== 'leaflet') return;
    this.map.remove();
    this.map = null;
    $('#map').innerHTML = '';
    this.initSvg();
    toast(t('map_tiles'), 'amber', 'map');
    this.setMarkers(this.items);
    this.setRoute(this.route);
  },

  // TODO(student): satellite inundation layer. Add a Sentinel-1 flood-extent WMS/XYZ overlay (Copernicus EMS / UN-SPIDER recipes) with a date slider.
  addOverlay() {
    return false;
  },

  initSvg() {
    this.mode = 'svg';
    const P = this.proj.bind(this);
    const poly = pts => pts.map(p => P(p[0], p[1]).map(v => v.toFixed(1)).join(',')).join(' ');
    let svg = `<svg class="schem" viewBox="0 0 1000 940" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schematic map of the Indus basin">`;
    svg += `<rect class="sea" x="-2000" y="-2000" width="5000" height="5000"/><polygon class="land" points="${poly(BORDER)}"/>`;

    REGION_LABELS.forEach(([label, lat, lng]) => {
      const [x, y] = P(lat, lng);
      svg += `<g class="lbl" data-x="${x.toFixed(1)}" data-y="${y.toFixed(1)}"><text class="pl" text-anchor="middle">${label}</text></g>`;
    });
    RIVERS.forEach(([label, cls, pts]) => {
      svg += `<polyline class="river ${cls}" points="${poly(pts)}"/>`;
      const anchor = pts[Math.max(1, Math.floor(pts.length / 3))];
      const [x, y] = P(anchor[0], anchor[1]);
      svg += `<g class="lbl" data-x="${(x + 8).toFixed(1)}" data-y="${(y - 6).toFixed(1)}"><text class="rl">${label}</text></g>`;
    });
    svg += '<g id="svgRoute"></g><g id="svgMarkers"></g></svg>';

    $('#map').innerHTML = svg;
    this.svg = $('svg.schem');
    this.g = $('#svgMarkers');
    const aspect = this.svg.clientHeight / this.svg.clientWidth || .94;
    this.vb = { x: 0, y: 0, w: 1000, h: 1000 * aspect };
    this.first = true;
    this.applyVb();
    this.bindSvgInteraction();
    this.updateStatus();
  },

  bindSvgInteraction() {
    let drag = null;
    this.svg.addEventListener('pointerdown', e => {
      drag = { x: e.clientX, y: e.clientY, vx: this.vb.x, vy: this.vb.y };
      this.svg.setPointerCapture(e.pointerId);
    });
    this.svg.addEventListener('pointermove', e => {
      if (!drag) return;
      const k = this.vb.w / this.svg.clientWidth;
      this.vb.x = drag.vx - (e.clientX - drag.x) * k;
      this.vb.y = drag.vy - (e.clientY - drag.y) * k;
      this.applyVb();
    });
    const stop = () => { drag = null; };
    this.svg.addEventListener('pointerup', stop);
    this.svg.addEventListener('pointercancel', stop);
    this.svg.addEventListener('wheel', e => {
      e.preventDefault();
      this.zoomBy(e.deltaY > 0 ? 1.2 : 1 / 1.2);
    }, { passive: false });

    const ctl = $('#svgCtl');
    ctl.classList.remove('hidden');
    ctl.innerHTML = `<button aria-label="Zoom in" data-z="in">${ic('plus')}</button><button aria-label="Zoom out" data-z="out">${ic('minus')}</button><button aria-label="${t('map_fit')}" data-z="fit">${ic('maximize')}</button>`;
    $$('button', ctl).forEach(b => {
      b.onclick = () => {
        if (b.dataset.z === 'fit') this.fit();
        else this.zoomBy(b.dataset.z === 'in' ? 1 / 1.3 : 1.3);
      };
    });
  },

  /** Marker / label scale so they keep a constant pixel size whatever the viewBox zoom. */
  svgScale() {
    return this.vb.w / 1300;
  },

  applyVb() {
    this.svg.setAttribute('viewBox', `${this.vb.x} ${this.vb.y} ${this.vb.w} ${this.vb.h}`);
    const s = this.svgScale().toFixed(4);
    $$('.smk, .lbl', this.svg).forEach(el => {
      el.setAttribute('transform', `translate(${el.dataset.x},${el.dataset.y}) scale(${s})`);
    });
  },

  zoomBy(factor) {
    const cx = this.vb.x + this.vb.w / 2;
    const cy = this.vb.y + this.vb.h / 2;
    const w = clamp(this.vb.w * factor, 60, 1800);
    this.tweenVb({ w, h: w * this.vb.h / this.vb.w }, cx, cy);
  },

  tweenVb(size, cx, cy, instant = false) {
    const from = { ...this.vb };
    const to = { x: cx - size.w / 2, y: cy - size.h / 2, w: size.w, h: size.h };
    if (instant) {
      Object.assign(this.vb, to);
      this.applyVb();
      return;
    }
    const start = performance.now();
    const step = now => {
      const p = Math.min(1, (now - start) / 380);
      const eased = 1 - Math.pow(1 - p, 3);
      for (const k of 'xywh') this.vb[k] = from[k] + (to[k] - from[k]) * eased;
      this.applyVb();
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  },

  updateStatus() {
    const schematic = this.mode === 'svg' ? `<span class="pill">${ic('map')}${t('map_schem')}</span>` : '';
    $('#mapStatus').innerHTML = `<span class="pill sim">${ic('alert-circle')}${t('map_sim')} · ${t('g_asof')} ${stamp(asOf)} PKT</span>${schematic}<div class="legend" id="legend"></div>`;
    this.legend(this.legendItems);
  },

  legend(items) {
    this.legendItems = items;
    const el = $('#legend');
    if (!el) return;
    el.innerHTML = items.map(([c, label, shape]) => `<span><i class="${shape || ''}" style="background:${c}"></i>${label}</span>`).join('');
  },

  /** items: [{id, lat, lng, r, color, shape:'circle'|'sq'|'dia', pulse, sel, dim, title, onClick}] */
  setMarkers(items) {
    this.items = items;
    if (this.mode === 'leaflet') this.renderLeafletMarkers(items);
    else if (this.mode === 'svg') this.renderSvgMarkers(items);
  },

  renderLeafletMarkers(items) {
    this.layer.clearLayers();
    items.forEach(it => {
      const classes = ['dot', it.shape || '', it.pulse ? 'pulse' : '', it.sel ? 'sel' : '', it.dim ? 'dim' : ''].join(' ');
      const icon = L.divIcon({ className: 'mk', iconSize: [0, 0], html: `<span class="${classes}" style="--c:${it.color};--s:${it.r * 2}px"></span>` });
      const zIndexOffset = it.sel ? 1000 : it.dim ? -100 : 0;
      const m = L.marker([it.lat, it.lng], { icon, zIndexOffset, keyboard: false }).addTo(this.layer);
      m.bindTooltip(esc(it.title), { direction: 'top', offset: [0, -it.r - 2] });
      if (it.onClick) m.on('click', () => it.onClick(it));
    });
  },

  renderSvgMarkers(items) {
    const s = this.svgScale().toFixed(4);
    this.g.innerHTML = items.map(it => {
      const [x, y] = this.proj(it.lat, it.lng);
      const r = it.r * 1.15;
      let shape = `<circle r="${r}" fill="${it.color}"/>`;
      if (it.shape === 'sq') shape = `<rect x="${-r}" y="${-r}" width="${2 * r}" height="${2 * r}" rx="3" fill="${it.color}"/>`;
      if (it.shape === 'dia') shape = `<rect x="${-r}" y="${-r}" width="${2 * r}" height="${2 * r}" rx="2" transform="rotate(45)" fill="${it.color}"/>`;
      const ringEl = it.pulse ? `<circle class="rg" r="${r + 2}" stroke="${it.color}"/>` : '';
      const cls = ['smk', it.sel ? 'sel' : '', it.dim ? 'dim' : ''].join(' ');
      return `<g class="${cls}" data-id="${esc(it.id)}" data-x="${x.toFixed(1)}" data-y="${y.toFixed(1)}" transform="translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${s})" tabindex="0" role="button" aria-label="${esc(it.title)}">${ringEl}${shape}<title>${esc(it.title)}</title></g>`;
    }).join('');

    $$('.smk', this.g).forEach(el => {
      const it = items.find(i => i.id === el.dataset.id);
      const go = () => it && it.onClick && it.onClick(it);
      el.onclick = go;
      el.onkeydown = e => { if (e.key === 'Enter') go(); };
    });
  },

  /** route: null or {from:{lat,lng}, to:{lat,lng}, color} — a straight evacuation line. */
  setRoute(route) {
    this.route = route;
    if (this.mode === 'leaflet') {
      this.routeLayer.clearLayers();
      if (route) L.polyline([[route.from.lat, route.from.lng], [route.to.lat, route.to.lng]], { color: route.color || '#1e3a5f', weight: 4, className: 'route-line' }).addTo(this.routeLayer);
    } else if (this.mode === 'svg') {
      const g = $('#svgRoute');
      if (!g) return;
      if (!route) { g.innerHTML = ''; return; }
      const a = this.proj(route.from.lat, route.from.lng);
      const b = this.proj(route.to.lat, route.to.lng);
      g.innerHTML = `<line class="route route-line" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${route.color || '#1e3a5f'}"/>`;
    }
  },

  /** Re-run the last fit / focus (after the sheet or viewport changes size). */
  refit() {
    if (!this.mode || !this.last) return;
    this.first = true;
    this[this.last.type](...this.last.args);
  },

  focus(lat, lng, zoom = 8) {
    this.last = { type: 'focus', args: [lat, lng, zoom] };
    const pad = this.pads();
    const dx = (pad.br[0] - pad.tl[0]) / 2;
    const dy = (pad.br[1] - pad.tl[1]) / 2;

    if (this.mode === 'leaflet') {
      const pt = this.map.project([lat, lng], zoom);
      pt.x += dx;
      pt.y += dy;
      const center = this.map.unproject(pt, zoom);
      if (this.first) this.map.setView(center, zoom, { animate: false });
      else this.map.flyTo(center, zoom, { duration: .7 });
    } else if (this.mode === 'svg') {
      const [x, y] = this.proj(lat, lng);
      const sw = this.svg.clientWidth || 1000;
      const sh = this.svg.clientHeight || 940;
      const w = zoom >= 11 ? 70 : zoom >= 10 ? 120 : zoom >= 9 ? 220 : zoom >= 8 ? 440 : 700;
      const k = w / sw;
      this.tweenVb({ w, h: sh * k }, x + dx * k, y + dy * k, this.first);
    }
    this.first = false;
  },

  fit(items = this.items) {
    if (!items.length) return;
    this.last = { type: 'fit', args: [items] };
    const pad = this.pads();

    if (this.mode === 'leaflet') {
      const bounds = L.latLngBounds(items.map(i => [i.lat, i.lng])).pad(.08);
      const opts = { paddingTopLeft: pad.tl, paddingBottomRight: pad.br, maxZoom: 9 };
      if (this.first) this.map.fitBounds(bounds, opts);
      else this.map.flyToBounds(bounds, { ...opts, duration: .7 });
    } else if (this.mode === 'svg') {
      this.fitSvg(items, pad);
    }
    this.first = false;
  },

  fitSvg(items, pad) {
    const pts = items.map(i => this.proj(i.lat, i.lng));
    const xs = pts.map(p => p[0]);
    const ys = pts.map(p => p[1]);
    const sw = this.svg.clientWidth || 1000;
    const sh = this.svg.clientHeight || 940;
    const visW = Math.max(80, sw - pad.tl[0] - pad.br[0]);
    const visH = Math.max(80, sh - pad.tl[1] - pad.br[1]);
    const bw = Math.max(60, Math.max(...xs) - Math.min(...xs)) * 1.3;
    const bh = Math.max(60, Math.max(...ys) - Math.min(...ys)) * 1.3;
    const k = Math.min(1300 / sw, Math.max(bw / visW, bh / visH));
    const bcx = (Math.min(...xs) + Math.max(...xs)) / 2;
    const bcy = (Math.min(...ys) + Math.max(...ys)) / 2;
    const cx = bcx + (sw / 2 - pad.tl[0] - visW / 2) * k;
    const cy = bcy + (sh / 2 - pad.tl[1] - visH / 2) * k;
    this.tweenVb({ w: sw * k, h: sh * k }, cx, cy, this.first);
  }
};

// =====================================================================
// 6. view helpers
// =====================================================================
function setHead(icon, title, actions = '') {
  $('#ptitle').innerHTML = ic(icon) + '<span></span>';
  $('#ptitle span').textContent = title;
  $('#pactions').innerHTML = actions;
}

const lvBadge = (lv, solid) => `<span class="badge ${solid ? 'solid' : 'c'}" style="--c:${LEVELS[lv].c}">${t('lv_' + lv)}</span>`;

function catBadge(k) {
  const m = gcatMeta(k);
  return `<span class="badge c" style="--c:${m.c}">${t('gc_' + m.key)}</span>`;
}

function provChips(current) {
  const chips = ['all', ...PROVS].map(p => {
    const label = p === 'all' ? t('prov_all') : t(p);
    return `<button class="chip ${current === p ? 'on' : ''}" data-p="${p}">${label}</button>`;
  });
  return `<div class="chips" data-prov>${chips.join('')}</div>`;
}

function sparkline(values, color) {
  const w = 96;
  const h = 30;
  const min = Math.min(...values);
  const max = Math.max(...values);
  const span = max - min || 1;
  const pts = values.map((v, i) => [i / (values.length - 1) * w, h - 3 - (v - min) / span * (h - 6)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d} L${w} ${h} L0 ${h}Z" fill="${color}" opacity=".14"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/></svg>`;
}

/** Tiny 7-bar rainfall glyph used in district cards. */
function rainBars(days) {
  const max = Math.max(1, ...days);
  const bars = days.map(v => `<i style="height:${Math.max(1, Math.round(v / max * 16))}px" title="${v} mm"></i>`);
  return `<span class="rainbars" aria-hidden="true">${bars.join('')}</span>`;
}

function modal(title, body, mount) {
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = body;
  document.body.classList.add('modal-open');
  if (mount) mount($('#modalBody'));
  const first = $('input,select,textarea,button', $('#modalBody'));
  if (first) first.focus();
}

function closeModal() {
  document.body.classList.remove('modal-open');
  $('#modalBody').innerHTML = '';
}
$('#modalClose').onclick = closeModal;
$('#scrim').onclick = closeModal;

function celebrate() {
  const wrap = document.createElement('div');
  wrap.className = 'confetti';
  const colors = ['#2f80ed', '#f2a900', '#2a9d5c', '#d7263d', '#1e3a5f'];
  wrap.innerHTML = Array.from({ length: 28 }, (_, i) => {
    const dx = (Math.random() - .5) * 600;
    const dy = -100 - Math.random() * 400;
    return `<i style="--dx:${dx}px;--dy:${dy}px;background:${colors[i % 5]};animation-delay:${Math.random() * .15}s"></i>`;
  }).join('');
  document.body.append(wrap);
  setTimeout(() => wrap.remove(), 1400);
}

const mapsLink = (lat, lng) => `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;

function sheetUp() {
  if (window.innerWidth <= 900 && $('#panel').dataset.state === 'peek') setSheet('half');
}

function scrollToCard(selector, highlight = false) {
  const el = $(selector);
  if (!el) return;
  sheetUp();
  el.scrollIntoView({ block: 'start', behavior: 'smooth' });
  if (!highlight) return;
  el.style.boxShadow = '0 0 0 3px var(--river-soft)';
  setTimeout(() => { el.style.boxShadow = ''; }, 1500);
}

// =====================================================================
// 7. alerts
// =====================================================================
function filteredDistricts() {
  return DISTRICTS
    .filter(d => state.prov === 'all' || d.prov === state.prov)
    .filter(d => state.lvl === 'all' || R(d).lv === state.lvl)
    .sort((a, b) => R(b).score - R(a).score);
}

function districtMarkers(list) {
  const shown = new Set(list.map(d => d.id));
  return DISTRICTS.map(d => {
    const r = R(d);
    return {
      id: d.id,
      lat: d.lat,
      lng: d.lng,
      r: 6 + r.score / 9,
      color: r.c,
      pulse: r.lv === 'severe' || (r.lv === 'warning' && d.id === myDistrict),
      sel: state.openCard === d.id,
      dim: !shown.has(d.id),
      title: `${name(d)} · ${t('lv_' + r.lv)} ${r.score}`,
      onClick: it => openDistrict(it.id)
    };
  });
}

function districtCard(d) {
  const r = R(d);
  const g = d.gauge ? SM[d.gauge] : null;
  const mine = d.id === myDistrict;
  const open = state.openCard === d.id;
  const gaugeMeta = g ? `<span>${ic('gauge')} <b>${flowShort(level(g.id))}</b> ${flowUnit()} · ${t('gc_' + gcatMeta(gcat(g.id)).key)}</span>` : '';
  const otherLangAdvisory = lang === 'ur' ? TXT.en['adv_' + r.lv] : TXT.ur['adv_' + r.lv];
  const setMineBtn = mine ? '' : `<button class="btn sm ghost" data-act="mine">${ic('home')}${t('al_setmine')}</button>`;

  return `<article class="card dcard ${open ? 'open' : ''} ${mine ? 'mine' : ''}" data-d="${d.id}" style="--c:${r.c}" tabindex="0" role="button" aria-expanded="${open}">
    <div class="top">
      <div>
        <div class="name">${esc(name(d))} ${mine ? `<span class="mine-tag">${t('al_mine')}</span>` : ''}</div>
        <div class="sub">${t(d.prov)} · ${g ? `${t('al_upstream')}: ${esc(name(g))}` : t('al_hill')}</div>
      </div>
      <div style="text-align:right;flex:none"><div class="score num">${r.score}</div>${lvBadge(r.lv)}</div>
    </div>
    <div class="bar" style="margin-top:8px;--c:${r.c}"><i data-w="${r.score}"></i></div>
    <div class="meta">${gaugeMeta}<span>${ic('cloud-rain')} <b>${r.rain} mm</b> ${t('al_rain7')}${rainBars(rain7(d))}</span></div>
    <div class="adv">
      <div class="txt" style="font-weight:600">${t('adv_' + r.lv)}</div>
      <div class="${lang === 'ur' ? 'en muted' : 'ur muted'}" style="margin-top:4px;font-size:.86rem">${otherLangAdvisory}</div>
      <div class="small muted txt" style="margin-top:8px">${ic('info')} ${esc(bi(d.note, d.noteUr))}</div>
      <div class="actions">
        <button class="btn sm river" data-act="map">${ic('map-pin')}${t('al_focus')}</button>
        <a class="btn sm ghost" href="#plan">${ic('bag')}${t('al_plan')}</a>
        <a class="btn sm ghost" href="#guide/sos">${ic('siren')}${t('al_sos')}</a>
        ${setMineBtn}
      </div>
    </div>
  </article>`;
}

function renderAlerts(param) {
  if (param && DM[param]) state.openCard = param;
  const counts = {};
  Object.keys(LEVELS).forEach(k => { counts[k] = DISTRICTS.filter(d => R(d).lv === k).length; });
  const list = filteredDistricts();
  const mine = DM[myDistrict];
  const rest = list.filter(d => d.id !== myDistrict);

  setHead('siren', t('al_title'), `<button class="btn sm ghost" id="sitrepBtn">${ic('printer')}<span class="lbl">${t('al_sitrep')}</span></button><span class="badge">${list.length} ${t('al_districts')}</span>`);
  const kpis = Object.keys(LEVELS).reverse().map(k => `<button class="kpi ${state.lvl === k ? 'on' : ''}" data-lvl="${k}" style="--c:${LEVELS[k].c}"><div class="k">${t('lv_' + k)}</div><div class="v num" data-n="${counts[k]}">0</div></button>`);
  const emptyMsg = list.length ? '' : `<div class="empty">${ic('filter')}${t('al_none')}</div>`;

  view.innerHTML = `<p class="lead txt">${t('al_lead')}</p>
    <div class="kpis stagger">${kpis.join('')}</div>
    ${provChips(state.prov)}
    <div class="list stagger" id="dlist">${districtCard(mine)}${rest.map(districtCard).join('')}${emptyMsg}</div>`;

  $$('.kpi .v', view).forEach(el => countUp(el, +el.dataset.n, { dur: 600 }));
  animateBars(view);
  bindAlerts();
  MapCtl.legend(Object.keys(LEVELS).map(k => [LEVELS[k].c, t('lv_' + k)]));
  MapCtl.setRoute(null);
  MapCtl.setMarkers(districtMarkers(list));

  if (state.openCard && DM[state.openCard]) {
    const d = DM[state.openCard];
    MapCtl.focus(d.lat, d.lng, 8);
    setTimeout(() => scrollToCard(`.dcard[data-d="${d.id}"]`), 350);
  } else {
    MapCtl.fit(districtMarkers(list).filter(m => !m.dim));
  }
}

function bindAlerts() {
  $('#sitrepBtn').onclick = () => printReport('sitrep');
  $$('[data-lvl]', view).forEach(b => {
    b.onclick = () => {
      state.lvl = state.lvl === b.dataset.lvl ? 'all' : b.dataset.lvl;
      saveUI();
      renderAlerts();
    };
  });
  $$('[data-prov] .chip', view).forEach(b => {
    b.onclick = () => {
      state.prov = b.dataset.p;
      saveUI();
      renderAlerts();
    };
  });
  $$('.dcard', view).forEach(card => {
    const id = card.dataset.d;
    card.addEventListener('click', e => {
      if (e.target.closest('a')) return;
      const act = e.target.closest('[data-act]');
      if (!act) { toggleDistrict(id); return; }
      e.stopPropagation();
      if (act.dataset.act === 'map') MapCtl.focus(DM[id].lat, DM[id].lng, 9);
      else setMyDistrict(id);
    });
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.target === card) toggleDistrict(id);
    });
  });
}

function toggleDistrict(id) {
  state.openCard = state.openCard === id ? null : id;
  $$('.dcard').forEach(c => {
    const on = c.dataset.d === state.openCard;
    c.classList.toggle('open', on);
    c.setAttribute('aria-expanded', on);
  });
  MapCtl.setMarkers(districtMarkers(filteredDistricts()));
  if (state.openCard) MapCtl.focus(DM[id].lat, DM[id].lng, 8);
}

function openDistrict(id) {
  if (page !== 'alerts') {
    state.openCard = id;
    location.hash = 'alerts/' + id;
    return;
  }
  if (state.openCard !== id) toggleDistrict(id);
  scrollToCard(`.dcard[data-d="${id}"]`);
}

function setMyDistrict(id) {
  myDistrict = id;
  store.set('district', id);
  $('#myDistrict').value = id;
  logActivity('act_district', name(DM[id]), 'home');
  toast(`${t('al_mine_set')}: ${name(DM[id])}`, 'ok', 'home');
  updateInboxBadge();
  route(false);
}

// =====================================================================
// 8. gauges
// =====================================================================
function flowChart(el, s) {
  const { inflow, outflow } = series(s.id);
  const W = 440;
  const H = 230;
  const P = { l: 44, r: 30, t: 10, b: 24 };
  const th = s.th;
  const ymax = Math.max(th[4] * 1.06, Math.max(...inflow) * 1.1);
  const x = i => P.l + i / (DAYS - 1) * (W - P.l - P.r);
  const y = v => P.t + (1 - v / ymax) * (H - P.t - P.b);
  let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="${esc(t('g_14d'))}">`;

  // flood-category bands and dashed threshold lines
  const bands = [0, ...th, ymax];
  const labels = ['', 'L', 'M', 'H', 'VH', 'EH'];
  for (let k = 0; k < 6; k++) {
    const a = Math.min(bands[k], ymax);
    const b = Math.min(bands[k + 1], ymax);
    if (b <= a) continue;
    svg += `<rect x="${P.l}" y="${y(b)}" width="${W - P.l - P.r}" height="${y(a) - y(b)}" fill="${GCATS[k][1]}" opacity="${k ? .13 : .05}"/>`;
    if (k) svg += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(a)}" y2="${y(a)}" stroke="${GCATS[k][1]}" stroke-dasharray="4 4" opacity=".7"/><text x="${W - P.r + 4}" y="${y(a) + 4}" font-size="11" font-weight="800" fill="${GCATS[k][1]}">${labels[k]}</text>`;
  }
  [0, .25, .5, .75, 1].forEach(f => {
    svg += `<text x="${P.l - 6}" y="${y(ymax * f) + 4}" font-size="11" text-anchor="end" fill="#5b6b80">${flowShort(ymax * f)}</text>`;
  });
  [0, 4, 9, 13].forEach(i => {
    svg += `<text x="${x(i)}" y="${H - 8}" font-size="11" text-anchor="middle" fill="#5b6b80">${dLabel(dateOf(i, DAYS))}</text>`;
  });

  const path = arr => arr.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  svg += `<path class="ln" d="${path(outflow)}" fill="none" stroke="#1e3a5f" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>`;
  svg += `<path class="ln" d="${path(inflow)}" fill="none" stroke="#2f80ed" stroke-width="3" stroke-linejoin="round"/>`;
  svg += `<line id="gcur" x1="0" x2="0" y1="${P.t}" y2="${H - P.b}" stroke="#15233a" stroke-dasharray="3 3" style="display:none"/>`;
  svg += `<circle id="gd1" r="4.5" fill="#2f80ed" stroke="#fff" stroke-width="2" style="display:none"/><circle id="gd2" r="4" fill="#1e3a5f" stroke="#fff" stroke-width="2" style="display:none"/></svg><div class="tip"></div>`;
  el.innerHTML = svg;

  $$('.ln', el).forEach(p => {
    const dash = p.getAttribute('stroke-dasharray');
    drawPath(p);
    if (dash) setTimeout(() => { p.style.strokeDasharray = dash; p.style.transition = ''; }, 950);
  });
  bindChartHover(el, { W, H, P, x, y, inflow, outflow });
}

function bindChartHover(el, ctx) {
  const svgEl = $('svg', el);
  const tip = $('.tip', el);
  const cursor = $('#gcur', el);
  const dot1 = $('#gd1', el);
  const dot2 = $('#gd2', el);

  const show = ev => {
    const rect = svgEl.getBoundingClientRect();
    const px = (ev.clientX - rect.left) / rect.width * ctx.W;
    const i = clamp(Math.round((px - ctx.P.l) / (ctx.W - ctx.P.l - ctx.P.r) * (DAYS - 1)), 0, DAYS - 1);
    const cx = ctx.x(i);
    cursor.setAttribute('x1', cx);
    cursor.setAttribute('x2', cx);
    cursor.style.display = '';
    dot1.setAttribute('cx', cx);
    dot1.setAttribute('cy', ctx.y(ctx.inflow[i]));
    dot1.style.display = '';
    dot2.setAttribute('cx', cx);
    dot2.setAttribute('cy', ctx.y(ctx.outflow[i]));
    dot2.style.display = '';
    tip.style.display = 'block';
    tip.style.left = (cx / ctx.W * rect.width) + 'px';
    tip.style.top = (ctx.y(ctx.inflow[i]) / ctx.H * rect.height) + 'px';
    tip.innerHTML = `<b>${dLabel(dateOf(i, DAYS))}</b><br>${t('g_inflow')}: ${flowFull(ctx.inflow[i])}<br>${t('g_outflow')}: ${flowFull(ctx.outflow[i])}`;
  };
  const hide = () => {
    tip.style.display = 'none';
    cursor.style.display = 'none';
    dot1.style.display = 'none';
    dot2.style.display = 'none';
  };
  svgEl.addEventListener('mousemove', show);
  svgEl.addEventListener('touchmove', e => { show(e.touches[0]); e.preventDefault(); }, { passive: false });
  svgEl.addEventListener('mouseleave', hide);
}

function stationRow(s) {
  const k = gcat(s.id);
  const m = gcatMeta(k);
  const v = level(s.id);
  const top = s.th[4] * 1.06;
  const tr = trend(s.id);
  const ticks = s.th.map((th, i) => `<span class="tick" style="left:${(th / top * 100).toFixed(1)}%" data-l="${['L', 'M', 'H', 'VH', 'EH'][i]}"></span>`).join('');
  const kind = s.kind === 'dam' ? bi('Dam', 'ڈیم') : bi('Barrage', 'بیراج');

  return `<article class="card station ${state.station === s.id ? 'sel' : ''}" data-s="${s.id}" style="--c:${m.c}" tabindex="0" role="button">
    <div class="top">
      <div style="min-width:0"><div class="nm">${esc(name(s))}</div><div class="rv">${bi(s.river, s.riverUr)} · ${kind}</div></div>
      ${sparkline(series(s.id).inflow, m.c)}
      <div class="cur"><b>${flowShort(v)}</b><div class="small muted">${flowUnit()}</div></div>
    </div>
    <div class="gbar">${ticks}<div class="fill" data-w="${Math.min(100, v / top * 100).toFixed(1)}"></div></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:.78rem;gap:8px">${catBadge(k)}<span class="muted num">${ic(tr.icon)} ${t(tr.key)} · ${tr.dlt > 0 ? '+' : ''}${tr.dlt.toFixed(1)}% ${t('g_vs')}</span></div>
  </article>`;
}

function renderGauges(param) {
  if (param && SM[param]) state.station = param;
  const s = SM[state.station] || STATIONS[0];

function gaugeMarkers(selectedId) {
  const districts = DISTRICTS.map(d => ({ id: 'd:' + d.id, lat: d.lat, lng: d.lng, r: 4, color: R(d).c, dim: true, title: name(d), onClick: () => openDistrict(d.id) }));
  const stations = STATIONS.map(st => {
    const m = gcatMeta(gcat(st.id));
    return {
      id: st.id,
      lat: st.lat,
      lng: st.lng,
      r: 9,
      shape: 'dia',

      pulse: gcat(st.id) >= 3,
