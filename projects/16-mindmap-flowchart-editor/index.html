// ---------- image nodes ----------
// Images are downscaled to <= 320px and stored as data URLs inside the document.
function shrinkImage(file, cb) {
  const r = new FileReader();
  r.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 320 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * scale));
      c.height = Math.max(1, Math.round(img.height * scale));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const type = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
      cb(c.toDataURL(type, 0.82), c.width / c.height);
    };
    img.onerror = () => toast('Could not read image', 'x');
    img.src = ev.target.result;
  };
  r.readAsDataURL(file);
}
// TODO(student): attachments — store large images and files in IndexedDB (or the cloud) and keep only a reference in the document.

function addImageNode(file, at) {
  shrinkImage(file, (url, ratio) => {
    const w = 200;
    const h = Math.round(clamp(w / ratio, 90, 240)) + 36;
    const name = file.name.replace(/\.[^.]+$/, '') || 'Image';
    const pos = at || toWorld(wrap.getBoundingClientRect().left + wrap.clientWidth / 2, wrap.getBoundingClientRect().top + wrap.clientHeight / 2);
    const n = mkNode(pos.x - w / 2, pos.y - h / 2, name, { w, h, shape: 'rect', color: '#e5e7eb', image: url });
    doc.nodes.push(n);
    sel = new Set([n.id]);
    selEdge = null;
    snapshot();
    render();
    log(`Added image "${name}"`, 'image');
  });
}

let imageTarget = null;
function pickImageFor(n) {
  imageTarget = n;
  $('#imgFile').click();
}

$('#imgBtn').onclick = () => {
  imageTarget = null;
  $('#imgFile').click();
};

$('#imgFile').onchange = e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  if (!imageTarget) {
    addImageNode(f);
    return;
  }
  const n = imageTarget;
  imageTarget = null;
  shrinkImage(f, (url, ratio) => {
    n.image = url;
    if (n.h < 120) n.h = Math.round(clamp(n.w / ratio, 90, 240)) + 36;
    snapshot();
    render();
  });
};

// ---------- side panel: outline · comments · history · activity ----------
const side = { open: false, tab: 'outline', raf: 0, editing: null, dragId: null };

function toggleSide(force) {
  const was = side.open;
  side.open = force == null ? !side.open : !!force;
  // on desktop the canvas narrows by the panel width; shift the view to keep the map centred
  if (was !== side.open && innerWidth > 900 && doc) {
    view.x += side.open ? -140 : 140;
    applyView();
  }
  $('#work').classList.toggle('side-open', side.open);
  $('#sideBtn').classList.toggle('on', side.open);
  settings.sideOpen = side.open;
  saveSettings();
  if (side.open) renderSide(true);
  // the canvas changes width with the panel; refresh the minimap once it settles
  setTimeout(renderMinimap, 320);
}

function setSideTab(tab) {
  side.tab = tab;
  settings.sideTab = tab;
  saveSettings();
  renderSide(true);
}

function renderSideSoon() {
  if (side.raf) return;
  side.raf = requestAnimationFrame(() => {
    side.raf = 0;
    renderSide();
  });
}

function renderSide(animate = false) {
  updateBadge();
  if (!side.open || side.editing) return;
  $$('#sideTabs [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === side.tab));
  const body = $('#sideBody');
  const views = { outline: outlineView, comments: commentsView, history: historyView, activity: activityView };
  const active = document.activeElement;
  const focusId = active && active.closest && body.contains(active) ? (active.closest('.orow') || {}).dataset?.oid : null;
  body.innerHTML = views[side.tab]();
  if (focusId) {
    const row = body.querySelector(`[data-oid="${focusId}"]`);
    if (row) row.focus({ preventScroll: true });
  }
  if (animate) {
    body.classList.add('anim');
    setTimeout(() => body.classList.remove('anim'), 450);
  }
}

// Badge on the side-panel button: number of open comments in this document.
function updateBadge() {
  const open = doc ? doc.comments.filter(c => !c.resolved).length : 0;
  $('#sideBadge').textContent = open ? String(Math.min(open, 99)) : '';
}

$('#sideBtn').onclick = () => toggleSide();
$$('#sideTabs [data-tab]').forEach(b => (b.onclick = () => setSideTab(b.dataset.tab)));
$('#sideClose').onclick = () => toggleSide(false);

// -- outline (editable tree synced with the canvas) --
function outlineView() {
  if (!doc.nodes.length) return `<p class="empty">The outline lists every node as a tree. Add a node to begin.</p>`;
  const map = childMap();
  const rows = [];
  const walk = (n, depth) => {
    rows.push(outlineRow(n, depth, (map.get(n.id) || []).length));
    if (!n.collapsed) (map.get(n.id) || []).forEach(c => walk(c, depth + 1));
  };
  const top = roots().slice().sort((a, b) => a.y - b.y || a.x - b.x);
  top.forEach(r => walk(r, 0));
  const hint = doc.mode === 'flow' ? 'Flowchart steps are listed top to bottom; nest them to group.' : 'Drag rows to re-parent. Alt+Right / Alt+Left indent and outdent.';
  return `<div class="side-head"><span>${doc.nodes.length} nodes</span><button class="btn light sm" data-oaddroot>${ic('plus')} Root</button></div>
    <div id="outline" role="tree" aria-label="Outline">${rows.join('')}</div>
    <p class="empty" style="font-size:.76rem;margin-top:8px">${hint}</p>`;
}

function outlineRow(n, depth, kids) {
  const toggle = kids
    ? `<button class="tog" data-otog="${n.id}" aria-label="${n.collapsed ? 'Expand' : 'Collapse'}">${ic(n.collapsed ? 'chevron-right' : 'chevron-down')}</button>`
    : `<span class="tog dot"></span>`;
  const icon = n.icon ? ic(n.icon) : '';
  const count = n.collapsed && kids ? ` <span class="tag">${kids}</span>` : '';
  return `<div class="orow ${sel.has(n.id) ? 'sel' : ''}" data-oid="${n.id}" role="treeitem" tabindex="0" draggable="true" style="padding-left:${4 + depth * 14}px" aria-level="${depth + 1}">
    ${toggle}${icon}<span class="otext">${esc(n.text)}</span>${count}
    <button class="mini" data-oadd="${n.id}" aria-label="Add child">${ic('plus')}</button>
    <button class="mini" data-odel="${n.id}" aria-label="Delete">${ic('trash')}</button>
  </div>`;
}

function outlineRename(row) {
  const n = N(row.dataset.oid);
  const span = row.querySelector('.otext');
  if (!n || !span) return;
  const input = document.createElement('input');
  input.value = n.text;
  input.setAttribute('aria-label', 'Rename node');
  span.replaceWith(input);
  side.editing = n.id;
  input.focus();
  input.select();
  const done = commit => {
    if (side.editing !== n.id) return;
    side.editing = null;
    const v = input.value.trim();
    if (commit && v && v !== n.text) {
      n.text = v;
      snapshot();
    }
    render();
    renderSide();
    const again = $(`[data-oid="${n.id}"]`);
    if (again) again.focus();
  };
  input.onkeydown = ev => {
    ev.stopPropagation();
    if (ev.key === 'Enter') done(true);
    if (ev.key === 'Escape') done(false);
  };
  input.onblur = () => done(true);
}

// Re-parent with cycle protection; the tree edge follows the new parent.
function reparent(id, pid) {
  const n = N(id);
  if (!n || id === pid) return false;
  if (pid && descendants(id).includes(pid)) {
    toast('Cannot move a node into its own branch', 'alert');
    return false;
  }
  const old = n.parent;
  if (old === pid) return false;
  if (old) doc.edges = doc.edges.filter(e => !(e.from === old && e.to === id));
  n.parent = pid || null;
  if (pid && !doc.edges.some(e => e.from === pid && e.to === id)) doc.edges.push(mkEdge(pid, id));
  return true;
}

function indent(n) {
  const sibs = n.parent ? children(n.parent) : roots();
  const i = sibs.findIndex(s => s.id === n.id);
  if (i <= 0) return;
  if (reparent(n.id, sibs[i - 1].id)) commitOutline(n.id);
}

function outdent(n) {
  if (!n.parent) return;
  const p = N(n.parent);
  if (reparent(n.id, p ? p.parent : null)) commitOutline(n.id);
}

function commitOutline(focusId) {
  snapshot();
  if (doc.mode === 'mind') autoLayout();
  else render();
  renderSide();
  const row = $(`[data-oid="${focusId}"]`);
  if (row) row.focus();
}

const sideBody = $('#sideBody');
sideBody.addEventListener('click', e => {
  const t = e.target.closest('button,[data-oid],[data-goto]');
  if (!t) return;
  if (t.dataset.oaddroot !== undefined) {
    const top = doc.nodes.length ? bounds(doc.nodes).y : 0;
    const r = addNodeAt({ x: 0, y: top - 120 });
    if (doc.mode === 'mind') autoLayout();
    selectNode(r.id);
    return;
  }
  if (t.dataset.otog) return toggleCollapse(t.dataset.otog);
  if (t.dataset.oadd) return addChild(N(t.dataset.oadd), false);
  if (t.dataset.odel) {
    sel = new Set([t.dataset.odel]);
    deleteSel();
    return;
  }
  if (t.dataset.goto) {
    const n = N(t.dataset.goto);
    if (n) {
      selectNode(n.id);
      centerOn(n, true);
    }
    return;
  }
  if (t.dataset.oid) {
    selectNode(t.dataset.oid);
    centerOn(N(t.dataset.oid), true);
  }
  sideActions(t);
});

sideBody.addEventListener('dblclick', e => {
  const row = e.target.closest('[data-oid]');
  if (row) outlineRename(row);
});

sideBody.addEventListener('keydown', e => {
  const row = e.target.closest('.orow');
  if (!row || e.target.tagName === 'INPUT') return;
  const n = N(row.dataset.oid);
  const rows = $$('.orow', sideBody);
  const i = rows.indexOf(row);
  const keys = {
    ArrowDown: () => focusRow(rows[i + 1]),
    ArrowUp: () => focusRow(rows[i - 1]),
    ArrowRight: () => (e.altKey ? indent(n) : n.collapsed && toggleCollapse(n.id)),
    ArrowLeft: () => (e.altKey ? outdent(n) : !n.collapsed && children(n.id).length && toggleCollapse(n.id)),
    Enter: () => outlineRename(row),
    F2: () => outlineRename(row),
    Insert: () => addChild(n, false),
    Delete: () => {
      sel = new Set([n.id]);
      deleteSel();
    },
    ' ': () => {
      selectNode(n.id);
      centerOn(n, true);
    },
  };
  if (!keys[e.key]) return;
  e.preventDefault();
  e.stopPropagation();
  keys[e.key]();
});

// Moving focus in the outline also moves the canvas selection.
function focusRow(row) {
  if (!row) return;
  row.focus();
  sel = new Set([row.dataset.oid]);
  selEdge = null;
  selSticky = null;
  render();
}

// drag a row onto another row to re-parent it (drop on the panel background = make root)
sideBody.addEventListener('dragstart', e => {
  const row = e.target.closest('.orow');
  if (!row) return;
  side.dragId = row.dataset.oid;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', side.dragId);
});
sideBody.addEventListener('dragover', e => {
  if (!side.dragId) return;
  e.preventDefault();
  $$('.orow', sideBody).forEach(r => (r.style.outline = ''));
  const row = e.target.closest('.orow');
  if (row) row.style.outline = '2px dashed var(--sel)';
});
sideBody.addEventListener('drop', e => {
  if (!side.dragId) return;
  e.preventDefault();
  e.stopPropagation();
  const row = e.target.closest('.orow');
  const id = side.dragId;
  side.dragId = null;
  if (reparent(id, row ? row.dataset.oid : null)) commitOutline(id);
  else renderSide();
});
sideBody.addEventListener('dragend', () => (side.dragId = null));

// -- comments (all threads of the document) --
function commentsView() {
  const showAll = store.get('cmtAll', false);
  const list = doc.comments.filter(c => showAll || !c.resolved).sort((a, b) => b.at - a.at);
  const items = list
    .map(c => {
      const n = N(c.nodeId);
      return `<div class="cmt ${c.resolved ? 'resolved' : ''}">
        <div class="who"><b>${esc(c.author)}</b><span>${ago(c.at)}</span></div>
        <div>${esc(c.text)}</div>
        <div class="who"><span class="on" data-goto="${c.nodeId}">${ic('map-pin')} ${esc(n ? n.text : 'deleted node')}</span>
        <button class="btn light sm" data-cres="${c.id}">${ic(c.resolved ? 'refresh' : 'check')}</button></div>
      </div>`;
    })
    .join('');
  return `<div class="side-head"><span>${doc.comments.filter(c => !c.resolved).length} open · ${doc.comments.filter(c => c.resolved).length} resolved</span>
    <label class="chk" style="font-size:.76rem"><input type="checkbox" data-cmtall ${showAll ? 'checked' : ''}> Show resolved</label></div>
    ${items || `<p class="empty">No comments. Select a node and use the Comments box in the inspector, or press <kbd>Shift</kbd>+<kbd>C</kbd>.</p>`}`;
}

// -- version history --
const MAX_VERSIONS = 30;

function listVersions(id = doc && doc.id) {
  return id ? store.get('ver:' + id, []) : [];
}

function saveVersion(label = 'Manual', announceIt = false) {
  const list = listVersions();
  const v = {
    id: uid(),
    at: Date.now(),
    label,
    nodes: doc.nodes,
    edges: doc.edges,
    stickies: doc.stickies,
    comments: doc.comments,
  };
  list.unshift(v);
  const ok = store.set('ver:' + doc.id, list.slice(0, MAX_VERSIONS));
  if (announceIt) toast(ok ? 'Version saved' : 'Storage full, version not saved', ok ? 'save' : 'alert');
  log(`Saved version "${label}"`, 'history');
  if (side.open && side.tab === 'history') renderSide();
  if (!sel.size && !selEdge && !selSticky) renderInspector();
  return v;
}

function restoreVersion(vid) {
  const v = listVersions().find(x => x.id === vid);
  if (!v) return false;
  saveVersion('Before restore');
  doc.nodes = JSON.parse(JSON.stringify(v.nodes));
  doc.edges = JSON.parse(JSON.stringify(v.edges));
  doc.stickies = JSON.parse(JSON.stringify(v.stickies || []));
  doc.comments = JSON.parse(JSON.stringify(v.comments || []));
  normalizeDoc(doc);
  clearSelection();
  snapshot();
  render();
  fit();
  log(`Restored version from ${fmtTime(v.at)}`, 'refresh');
  toast('Version restored', 'refresh');
  return true;
}

function versionDiff(v) {
  const dn = doc.nodes.length - v.nodes.length;
  const de = doc.edges.length - v.edges.length;
  const sign = x => (x > 0 ? '+' + x : String(x));
  return dn || de ? `now ${sign(dn)} nodes, ${sign(de)} edges` : 'same size as now';
}

// ---------- find & replace ----------
const find = { open: false, q: '', r: '', cs: false, word: false, notes: true, idx: -1, hits: [] };

function findRegex() {
  if (!find.q) return null;
  let src = escapeRe(find.q);
  if (find.word) src = `\\b${src}\\b`;
  return new RegExp(src, find.cs ? 'g' : 'gi');
}

// Every field that can hold text, in reading order.
function searchableFields() {
  const out = [];
  const byPos = (a, b) => a.y - b.y || a.x - b.x;
  doc.nodes.slice().sort(byPos).forEach(n => {
    out.push({ kind: 'node', id: n.id, field: 'text', obj: n });
    if (find.notes && n.notes) out.push({ kind: 'node', id: n.id, field: 'notes', obj: n });
  });
  doc.edges.forEach(e => {
    if (e.label) out.push({ kind: 'edge', id: e.id, field: 'label', obj: e });
  });
  doc.stickies.forEach(s => out.push({ kind: 'sticky', id: s.id, field: 'text', obj: s }));
  return out;
}

function computeHits() {
  const re = findRegex();
  find.hits = [];
  if (re) {
    searchableFields().forEach(f => {
      const m = String(f.obj[f.field]).match(re);
      if (m) find.hits.push({ ...f, count: m.length });
    });
  }
  findIds = new Set(find.hits.filter(h => h.kind !== 'sticky').map(h => h.id));
  if (find.idx >= find.hits.length) find.idx = find.hits.length - 1;
  return find.hits;
}

function openFind(prefill) {
  find.open = true;
  if (typeof prefill === 'string' && prefill) find.q = prefill;
  const bar = $('#findbar');
  bar.innerHTML = `<div class="frow"><input type="text" id="fQ" placeholder="Find in nodes, notes, labels" aria-label="Find" value="${esc(find.q)}">
      <span class="count" id="fCount"></span>
      <button class="tb" id="fPrev" aria-label="Previous match">${ic('chevron-up')}</button>
      <button class="tb" id="fNext" aria-label="Next match">${ic('chevron-down')}</button>
      <button class="tb" id="fClose" aria-label="Close find">${ic('x')}</button></div>
    <div class="frow"><input type="text" id="fR" placeholder="Replace with" aria-label="Replace with" value="${esc(find.r)}">
      <button class="btn light sm" id="fOne">Replace</button><button class="btn sm" id="fAll">All</button></div>
    <div class="frow" style="flex-wrap:wrap;gap:10px">
      <label><input type="checkbox" id="fCs" ${find.cs ? 'checked' : ''}> Match case</label>
      <label><input type="checkbox" id="fWord" ${find.word ? 'checked' : ''}> Whole word</label>
      <label><input type="checkbox" id="fNotes" ${find.notes ? 'checked' : ''}> Notes</label></div>`;
  bar.classList.add('on');
  bindFind();
  refreshFind();
  $('#fQ').focus();
  $('#fQ').select();
}

function bindFind() {
  $('#fQ').oninput = e => {
    find.q = e.target.value;
    find.idx = -1;
    refreshFind();
  };
  $('#fR').oninput = e => (find.r = e.target.value);
  $('#fQ').onkeydown = e => {
    if (e.key === 'Enter') gotoHit(e.shiftKey ? -1 : 1);
    if (e.key === 'Escape') closeFind();
  };
  $('#fR').onkeydown = e => {
    if (e.key === 'Enter') replaceCurrent();
    if (e.key === 'Escape') closeFind();
  };
  $('#fPrev').onclick = () => gotoHit(-1);
  $('#fNext').onclick = () => gotoHit(1);
  $('#fClose').onclick = closeFind;
  $('#fOne').onclick = replaceCurrent;
  $('#fAll').onclick = () => replaceAll(find.q, find.r);
  const opt = (id, key) => ($(id).onchange = e => {
    find[key] = e.target.checked;
    refreshFind();
  });
  opt('#fCs', 'cs');
  opt('#fWord', 'word');
  opt('#fNotes', 'notes');
}

function refreshFind() {
  computeHits();
  const total = find.hits.reduce((a, h) => a + h.count, 0);
  const el = $('#fCount');
  if (el) el.textContent = find.q ? (find.hits.length ? `${Math.max(find.idx + 1, 0)}/${find.hits.length}` : 'none') : '';
  if (el) el.title = `${total} occurrences`;
  render();
}

function closeFind() {
  find.open = false;
  findIds = new Set();
  $('#findbar').classList.remove('on');
  render();
}

function gotoHit(dir) {
  if (!find.hits.length) return;
  find.idx = (find.idx + dir + find.hits.length) % find.hits.length;
  const h = find.hits[find.idx];
  if (h.kind === 'node') {
    revealNode(h.id);
    sel = new Set([h.id]);
    selEdge = null;
    selSticky = null;
  } else if (h.kind === 'edge') {
    sel.clear();
    selEdge = h.id;
  } else {
    sel.clear();
    selSticky = h.id;
  }
  refreshFind();
  const target = h.kind === 'node' ? N(h.id) : h.kind === 'sticky' ? S(h.id) : N(E(h.id).from);
  if (target) centerOn(target, true);
}

// Expand collapsed ancestors so a match inside a folded branch becomes visible.
function revealNode(id) {
  let n = N(id);
  let changed = false;
  while (n && n.parent) {
    const p = N(n.parent);
    if (p && p.collapsed) {
      p.collapsed = false;
      changed = true;
    }
    n = p;
  }
  if (changed) render();
}

function replaceCurrent() {
  if (find.idx < 0) {
    gotoHit(1);
    return;
  }
  const h = find.hits[find.idx];
  const re = findRegex();
  if (!h || !re) return;
  h.obj[h.field] = String(h.obj[h.field]).replace(re, () => find.r);
  snapshot();
  find.idx--;
  refreshFind();
  gotoHit(1);
}

function replaceAll(q, r, opts = {}) {
  Object.assign(find, { q, r }, opts);
  const hits = computeHits();
  const re = findRegex();
  if (!re || !hits.length) {
    toast('No matches', 'info');
    return 0;
  }
  let count = 0;
  hits.forEach(h => {
    count += h.count;
    h.obj[h.field] = String(h.obj[h.field]).replace(re, () => r);
  });
  snapshot();
  find.idx = -1;
  computeHits();
  if (find.open) refreshFind();
  else render();
  toast(`Replaced ${count} in ${hits.length} item${hits.length > 1 ? 's' : ''}`, 'replace');
  log(`Replaced "${q}" with "${r}" (${count})`, 'replace');
  return count;
}

// ---------- documents & templates ----------
// Template builders work on a detached doc `d`, so they never touch the open one.
function add(d, x, y, text, o = {}) {
  const n = {
    id: uid(),
    x,
    y,
    w: o.w || 150,
    h: o.h || 56,
    text,
    shape: o.shape || (d.mode === 'mind' ? 'round' : 'rect'),
    color: o.color || COLORS[0],
    parent: o.parent || null,
    collapsed: false,
    fs: o.fs || 14,
    url: o.url || '',
    notes: o.notes || '',
    icon: o.icon || '',
    image: '',
  };
  d.nodes.push(n);
  return n;
}

function mkEdgeD(d, from, to, o = {}) {
  return {
    id: uid(),
    from,
    to,
    label: o.label || '',
    type: o.type || (d.mode === 'mind' ? 'curve' : 'ortho'),
    arrow: o.arrow ?? (d.mode === 'mind' ? 'none' : 'end'),
    dash: !!o.dash,
  };
}

// Mind-map helper: root plus [branch, [leaves]] pairs, colours per branch.
function branchTree(d, rootText, branches, o = {}) {
  const r = add(d, 0, 0, rootText, { color: o.rootColor || '#fed7aa', w: 170, icon: o.rootIcon || '' });
  const made = [];
  branches.forEach(([t, kids, icon], i) => {
    const color = COLORS[i % COLORS.length];
    const b = add(d, 0, 0, t, { parent: r.id, color, icon: icon || '' });
    d.edges.push(mkEdgeD(d, r.id, b.id));
    kids.forEach(k => {
      const c = add(d, 0, 0, k, { parent: b.id, color, w: 140, h: 44, fs: 13 });
      d.edges.push(mkEdgeD(d, b.id, c.id));
    });
    made.push(b);
  });
  return { root: r, branches: made };
}

// Flowchart helper: chain of [from, to, label?, dashed?] using ortho arrows.
function linkAll(d, pairs) {
  pairs.forEach(([a, b, label, dash]) => d.edges.push(mkEdgeD(d, a.id, b.id, { type: 'ortho', arrow: 'end', label: label || '', dash: !!dash })));
}

function stickyD(d, x, y, text, color = STICKY_COLORS[0]) {
  d.stickies = d.stickies || [];
  d.stickies.push({ id: uid(), x, y, w: 180, h: 110, text, color });
}

function commentD(d, node, text, author = 'Supervisor') {
  d.comments = d.comments || [];
  d.comments.push({ id: uid(), nodeId: node.id, text, author, at: Date.now() - 3600 * 1000 * 5, resolved: false });
}

function thumb(d) {
  if (!d.nodes.length) return `<svg viewBox="0 0 160 110"><text x="80" y="60" text-anchor="middle" font-size="12" fill="#94a3b8">empty</text></svg>`;
  const bb = bounds(d.nodes);
  const p = 30;
  const byId = new Map(d.nodes.map(n => [n.id, n]));
  const lines = d.edges
    .map(e => {
      const a = byId.get(e.from);
      const b = byId.get(e.to);
      if (!a || !b) return '';
      return `<line x1="${a.x + a.w / 2}" y1="${a.y + a.h / 2}" x2="${b.x + b.w / 2}" y2="${b.y + b.h / 2}" stroke="#94a3b8" stroke-width="${Math.max(2, bb.w / 120)}"/>`;
    })
    .join('');
  const rects = d.nodes.map(n => `<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="10" fill="${n.color}"/>`).join('');
  return `<svg viewBox="${bb.x - p} ${bb.y - p} ${bb.w + 2 * p} ${bb.h + 2 * p}" preserveAspectRatio="xMidYMid meet">${lines}${rects}</svg>`;
}

// ---------- Mermaid export ----------
const mmText = s => String(s).replace(/\s+/g, ' ').trim().replace(/"/g, '#quot;');
const MM_FLOW_SHAPE = {
  rect: ['[', ']'],
  round: ['(', ')'],
  pill: ['([', '])'],
  diamond: ['{', '}'],
  para: ['[/', '/]'],
  doc: ['[', ']'],
  db: ['[(', ')]'],
  circle: ['((', '))'],
  note: ['>', ']'],
};

function toMermaid(d = doc) {
  const ids = new Map(d.nodes.map((n, i) => [n.id, 'n' + (i + 1)]));
  if (d.mode === 'mind') return mermaidMindmap(d, ids);
  const dir = settings.flowDir === 'LR' ? 'LR' : 'TD';
  const lines = [`flowchart ${dir}`];
  d.nodes.forEach(n => {
    const [a, b] = MM_FLOW_SHAPE[n.shape] || MM_FLOW_SHAPE.rect;
    lines.push(`  ${ids.get(n.id)}${a}"${mmText(n.text)}"${b}`);
  });
  d.edges.forEach(e => {
    if (!ids.has(e.from) || !ids.has(e.to)) return;
    lines.push(`  ${ids.get(e.from)} ${mermaidArrow(e)} ${ids.get(e.to)}`);
  });
  return lines.join('\n') + '\n';
}

function mermaidArrow(e) {
  let op;
  if (e.dash) op = e.arrow === 'none' ? '-.-' : '-.->';
  else op = e.arrow === 'none' ? '---' : '-->';
  if (e.arrow === 'both') op = '<' + op;
  return e.label ? `${op}|"${mmText(e.label)}"|` : op;
}

function mermaidMindmap(d, ids) {
  const lines = ['mindmap'];
  const byParent = new Map();
  d.nodes.forEach(n => {
    const p = n.parent && d.nodes.some(x => x.id === n.parent) ? n.parent : '';
    if (!byParent.has(p)) byParent.set(p, []);
    byParent.get(p).push(n);
  });
  const shape = n => (n.shape === 'circle' ? ['((', '))'] : n.shape === 'rect' ? ['[', ']'] : ['(', ')']);
  const walk = (n, depth) => {
    const [a, b] = shape(n);
    lines.push(`${'  '.repeat(depth)}${ids.get(n.id)}${a}"${mmText(n.text)}"${b}`);
    (byParent.get(n.id) || []).forEach(c => walk(c, depth + 1));
  };
  const top = byParent.get('') || [];
  // Mermaid mind maps have exactly one root; extra roots hang off a synthetic one.
  if (top.length === 1) walk(top[0], 1);
  else {
    lines.push(`  root(("${mmText(d.name)}"))`);
    top.forEach(r => walk(r, 2));
  }
  return lines.join('\n') + '\n';
}

// ---------- Mermaid import ----------
const MM_SHAPES = [
  ['circle', /\(\(\(("[^"]*"|.*?)\)\)\)/y],
  ['circle', /\(\(("[^"]*"|.*?)\)\)/y],
  ['pill', /\(\[("[^"]*"|.*?)\]\)/y],
  ['db', /\[\(("[^"]*"|.*?)\)\]/y],
  ['rect', /\[\[("[^"]*"|.*?)\]\]/y],
  ['para', /\[[/\\]("[^"]*"|.*?)[/\\]\]/y],
  ['rect', /\{\{("[^"]*"|.*?)\}\}/y],
  ['diamond', /\{("[^"]*"|.*?)\}/y],
  ['circle', /\)\)("[^"]*"|.*?)\(\(/y],
  ['round', /\)("[^"]*"|.*?)\(/y],
  ['note', />("[^"]*"|.*?)\]/y],
  ['round', /\(("[^"]*"|.*?)\)/y],
  ['rect', /\[("[^"]*"|.*?)\]/y],
];
const MM_ID = /\s*([\p{L}\p{N}_]+)/uy;
const MM_EDGE = /\s*(<)?(-{2,}>|-{3,}|-\.+->|-\.+-|={2,}>|={3,}|--[ox]|~~~)(?:\|([^|]*)\|)?/y;
const MM_EDGE_TXT = /\s*(<)?(--|-\.|==)\s*([^\-=.>|\s][^>|]*?)\s*(-{2,}>|-{3,}|\.-+>|\.-+|={2,}>|={3,})/y;
const MM_SKIP = /^(subgraph|end|classDef|class|style|linkStyle|click|direction|accTitle|accDescr|title)\b/;

const mmDecode = s => {
  let t = String(s).trim();
  if (t.startsWith('"') && t.endsWith('"') && t.length > 1) t = t.slice(1, -1);
  return t.replace(/#quot;/g, '"').replace(/<br\s*\/?>/gi, ' ').replace(/`/g, '').trim();
};

function mmMatch(re, s, i) {
  re.lastIndex = i;
  const m = re.exec(s);
  return m ? { m, end: re.lastIndex } : null;
}

// Reads `id`, `id[text]`, `id((text))` … and returns the node reference.
function mmNode(s, i) {
  const idm = mmMatch(MM_ID, s, i);
  if (!idm) return null;
  const ref = { id: idm.m[1], end: idm.end };
  for (const [shape, re] of MM_SHAPES) {
    const sm = mmMatch(re, s, idm.end);
    if (sm) {
      ref.shape = shape;
      ref.text = mmDecode(sm.m[1]);
      ref.end = sm.end;
      break;
    }
  }
  const cls = mmMatch(/:::[\w-]+/y, s, ref.end);
  if (cls) ref.end = cls.end;
  return ref;
}

// `A & B` groups on either side of an arrow.
function mmGroup(s, i) {
  const out = [];
  let pos = i;
  for (;;) {
    const n = mmNode(s, pos);
    if (!n) break;
    out.push(n);
    pos = n.end;
    const amp = mmMatch(/\s*&/y, s, pos);
    if (!amp) break;
    pos = amp.end;
  }
  return out.length ? { refs: out, end: pos } : null;
}

function mmEdgeOp(s, i) {
  const plain = mmMatch(MM_EDGE, s, i);
  const txt = plain ? null : mmMatch(MM_EDGE_TXT, s, i);
  const hit = plain || txt;
  if (!hit) return null;
  const m = hit.m;
  const op = plain ? m[2] : m[2] + m[4];
  const label = plain ? m[3] || '' : m[3] || '';
  const head = op.endsWith('>') || /--[ox]$/.test(op);
  return {
    end: hit.end,
    label: mmDecode(label),
    dash: op.includes('.'),
    arrow: head ? (m[1] ? 'both' : 'end') : 'none',
  };
}

function parseFlowchart(lines) {
  const nodes = new Map();
  const edges = [];
  const touch = ref => {
    const cur = nodes.get(ref.id) || { id: ref.id, text: ref.id, shape: 'rect' };
    if (ref.text != null) {
      cur.text = ref.text || ref.id;
      cur.shape = ref.shape;
    }
    nodes.set(ref.id, cur);
  };
  lines.forEach(line => {
    line.split(';').forEach(stmt => {
      const s = stmt.trim();
      if (!s || MM_SKIP.test(s)) return;
      let left = mmGroup(s, 0);
      if (!left) return;
      left.refs.forEach(touch);
      let pos = left.end;
      for (;;) {
        const op = mmEdgeOp(s, pos);
        if (!op) break;
        const right = mmGroup(s, op.end);
        if (!right) break;
        right.refs.forEach(touch);
        left.refs.forEach(a => right.refs.forEach(b => edges.push({ from: a.id, to: b.id, label: op.label, dash: op.dash, arrow: op.arrow })));
        left = right;
        pos = right.end;
      }
    });
  });
  return { nodes: [...nodes.values()], edges };
}

function parseMindmap(lines) {
  const nodes = [];
  const stack = [];
  lines.forEach(raw => {
    if (!raw.trim() || /^\s*(::icon|:::)/.test(raw)) return;
    const indent = raw.match(/^\s*/)[0].replace(/\t/g, '  ').length;
    const body = raw.trim();
    const ref = mmNode(body, 0);
    const whole = ref && ref.text != null && ref.end >= body.replace(/:::.*$/, '').length;
    const node = { id: 'm' + nodes.length, text: whole ? ref.text : mmDecode(body), shape: whole ? ref.shape : 'round', parent: null };
    while (stack.length && stack[stack.length - 1].indent >= indent) stack.pop();
    if (stack.length) node.parent = stack[stack.length - 1].id;
    stack.push({ indent, id: node.id });
    nodes.push(node);
  });
  return { nodes, edges: nodes.filter(n => n.parent).map(n => ({ from: n.parent, to: n.id, label: '', dash: false, arrow: 'none' })) };
}

function parseMermaid(src) {
  const lines = String(src)
    .replace(/%%.*$/gm, '')
    .split(/\r?\n/)
    .filter(l => l.trim());
  if (!lines.length) throw new Error('empty');
  const head = lines[0].trim();
  if (/^mindmap\b/i.test(head)) return { mode: 'mind', dir: 'TB', ...parseMindmap(lines.slice(1)) };
  const fm = head.match(/^(flowchart|graph)\s*(TB|TD|BT|LR|RL)?/i);
  if (!fm) throw new Error('Only "flowchart"/"graph" and "mindmap" diagrams are supported');
  const dir = /LR|RL/i.test(fm[2] || '') ? 'LR' : 'TB';
  return { mode: 'flow', dir, ...parseFlowchart(lines.slice(1)) };
}

function importMermaid(src, name = 'Mermaid import') {
  let parsed;
  try {
    parsed = parseMermaid(src);
  } catch (err) {
    toast(err.message || 'Could not read Mermaid', 'x');
    return null;
  }
  if (!parsed.nodes.length) {
    toast('No nodes found', 'x');
    return null;
  }
  if (parsed.mode === 'flow') {
    settings.flowDir = parsed.dir;
    saveSettings();
  }
  openNew(name, parsed.mode, d => buildFromParsed(d, parsed));
  autoLayout();
  log(`Imported ${parsed.nodes.length} nodes from Mermaid`, 'code');
  return { nodes: doc.nodes.length, edges: doc.edges.length };
}

function buildFromParsed(d, parsed) {
  const map = new Map();
  parsed.nodes.forEach((p, i) => {
    const shape = d.mode === 'mind' && p.shape === 'rect' ? 'rect' : p.shape;
    const isDiamond = shape === 'diamond';
    const n = add(d, (i % 6) * 190, Math.floor(i / 6) * 130, p.text, {
      shape,
      color: d.mode === 'mind' ? COLORS[i % COLORS.length] : isDiamond ? '#fbcfe8' : COLORS[2],
      w: isDiamond ? 160 : Math.max(120, Math.min(220, p.text.length * 8 + 30)),
      h: isDiamond ? 90 : shape === 'circle' ? 90 : 56,
    });
    map.set(p.id, n);
  });
  parsed.nodes.forEach(p => {
    if (p.parent && map.has(p.parent)) map.get(p.id).parent = map.get(p.parent).id;
  });
  parsed.edges.forEach(e => {
    if (!map.has(e.from) || !map.has(e.to)) return;
    d.edges.push(mkEdgeD(d, map.get(e.from).id, map.get(e.to).id, { label: e.label, dash: e.dash, arrow: e.arrow }));
  });
}

function dl(name, blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function svgString() {
  const items = doc.nodes.concat(doc.stickies);
  const bb = bounds(items);
  const p = 40;
  const clone = $('#world').cloneNode(true);
  clone.setAttribute('transform', '');
  clone.querySelectorAll('.port,.handle,.shandle,.hit,.collapse,.cbadge').forEach(el => el.remove());
  clone.querySelectorAll('.node,.edge,.sticky').forEach(el => el.classList.remove('sel', 'hit', 'dim'));
  // inline the sprite symbols that node icons reference so the file stands alone
  const used = new Set([...clone.querySelectorAll('use')].map(u => u.getAttribute('href')));
  const symbols = [...used].map(h => $(h)).filter(Boolean).map(s => s.outerHTML).join('');
  const defs = $('#board defs').outerHTML.replace('</defs>', symbols + '</defs>');
  const style = `<style>text{font-family:Instrument Sans,system-ui,sans-serif}.edge .line{fill:none;stroke:#64748b;stroke-width:2}.edge text{font-size:12px;fill:#0f172a;paint-order:stroke;stroke:#fff;stroke-width:4px}.nicon{stroke:#0f172a;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style>`;
  const vb = `${bb.x - p} ${bb.y - p} ${bb.w + 2 * p} ${bb.h + 2 * p}`;
  return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="${vb}" width="${bb.w + 2 * p}" height="${bb.h + 2 * p}"><rect x="${bb.x - p}" y="${bb.y - p}" width="${bb.w + 2 * p}" height="${bb.h + 2 * p}" fill="#ffffff"/>${defs}${style}${clone.outerHTML}</svg>`;
}

function exportSVG() {
  if (!doc.nodes.length) return toast('Nothing to export', 'info');
  dl(doc.name + '.svg', new Blob([svgString()], { type: 'image/svg+xml' }));

  log('Exported SVG', 'image');
}

function exportPNG() {
  if (!doc.nodes.length) return toast('Nothing to export', 'info');
  const s = svgString();
  const img = new Image();
  const url = URL.createObjectURL(new Blob([s], { type: 'image/svg+xml;charset=utf-8' }));
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = img.width * 2;
    c.height = img.height * 2;
    const x = c.getContext('2d');
    x.scale(2, 2);
    x.drawImage(img, 0, 0);
    c.toBlob(b => {
      dl(doc.name + '.png', b);
      URL.revokeObjectURL(url);
      toast('PNG exported');
      log('Exported PNG', 'image');
    }, 'image/png');
  };
  img.src = url;
}

function markdownOutline() {
  const lines = [];
  const walk = (n, d) => {
    lines.push(`${'  '.repeat(d)}- ${n.text}${n.notes ? ` — ${n.notes}` : ''}`);
    children(n.id).forEach(c => walk(c, d + 1));
  };
  roots().forEach(r => walk(r, 0));
  const notes = doc.stickies.length ? `\n## Sticky notes\n\n${doc.stickies.map(s => `> ${s.text}`).join('\n\n')}\n` : '';
  return `# ${doc.name}\n\n${lines.join('\n')}\n${notes}`;
}

// ---------- presentation mode (branch-by-branch zoom) ----------
const present = { active: false, steps: [], i: 0, focus: new Set(), saved: null };

// Mind maps: overview, then each root with its branches, then each branch subtree.
function mindSteps() {
  const hidden = hiddenIds();
  const map = childMap();
  const visible = id => !hidden.has(id);
  const steps = [{ title: doc.name, ids: doc.nodes.filter(n => visible(n.id)).map(n => n.id) }];
  roots().forEach(r => {
    const kids = (map.get(r.id) || []).filter(k => visible(k.id));
    if (!kids.length) return;
    steps.push({ title: r.text, ids: [r.id, ...kids.map(k => k.id)] });
    kids.forEach(k => {
      const sub = descendants(k.id, map).filter(visible);
      steps.push({ title: k.text, ids: [k.id, ...sub], context: r.id });
    });
  });
  return steps;
}

// Flowcharts: overview, then every node with its outgoing neighbours in reading order.
function flowSteps() {
  const steps = [{ title: doc.name, ids: doc.nodes.map(n => n.id) }];
  const vertical = settings.flowDir !== 'LR';
  const order = doc.nodes.slice().sort((a, b) => (vertical ? a.y - b.y || a.x - b.x : a.x - b.x || a.y - b.y));
  order.forEach(n => {
    const next = doc.edges.filter(e => e.from === n.id).map(e => e.to).filter(id => N(id));
    steps.push({ title: n.text, ids: [n.id, ...next] });
  });
  return steps;
}

function startPresent(at = 0) {
  if (!doc.nodes.length) {
    toast('Add some nodes first', 'info');
    return;
  }
  endEdit();
  closeFind();
  present.steps = doc.mode === 'mind' ? mindSteps() : flowSteps();
  present.saved = { ...view };
  present.active = true;
  clearSelection();
  $('#app').classList.add('presenting');
  $('#presentBar').style.display = 'flex';
  const el = document.documentElement;
  if (settings.fullscreen && el.requestFullscreen) el.requestFullscreen().catch(() => {});
  log(`Presented "${doc.name}"`, 'play');
  // wait one frame so the canvas has its full-screen size before framing
  requestAnimationFrame(() => gotoStep(at));
}

function gotoStep(i) {
  if (!present.active) return;
  present.i = clamp(i, 0, present.steps.length - 1);
  const step = present.steps[present.i];
  present.focus = new Set(step.ids);
  if (step.context) present.focus.add(step.context);
  render();
  const items = step.ids.map(N).filter(Boolean);
  if (items.length) animateView(viewFor(items, 140, 1.8), 700);
  renderPresentBar(step);
  announce(`Slide ${present.i + 1} of ${present.steps.length}: ${step.title}`);
}

function renderPresentBar(step) {
  const pct = ((present.i + 1) / present.steps.length) * 100;
  $('#presentBar').innerHTML = `
    <button class="tb" id="pvPrev" aria-label="Previous">${ic('chevron-left')}</button>
    <span class="count">${present.i + 1} / ${present.steps.length}</span>
    <span class="title">${esc(step.title)}</span>
    <button class="tb" id="pvNext" aria-label="Next">${ic('chevron-right')}</button>
    <button class="tb" id="pvExit" aria-label="Exit presentation">${ic('x')}</button>
    <div class="prog"><i style="width:${pct}%"></i></div>`;
  $('#pvPrev').onclick = () => gotoStep(present.i - 1);
  $('#pvNext').onclick = () => gotoStep(present.i + 1);
  $('#pvExit').onclick = endPresent;
}

function endPresent() {
  if (!present.active) return;
  present.active = false;
  present.focus = new Set();
  $('#app').classList.remove('presenting');
  $('#presentBar').style.display = 'none';
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
  render();
  requestAnimationFrame(() => animateView(present.saved || view, 400));
}

function presentKeys(e) {
  const next = ['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'];
  const prev = ['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'];
  if (next.includes(e.key)) gotoStep(present.i + 1);
  else if (prev.includes(e.key)) gotoStep(present.i - 1);
  else if (e.key === 'Home') gotoStep(0);
  else if (e.key === 'End') gotoStep(present.steps.length - 1);
  else if (e.key === 'Escape') endPresent();
  else return;
  e.preventDefault();
}

// a click anywhere on the canvas advances to the next slide
wrap.addEventListener('click', e => {

  gotoStep(present.i + 1);
});

function storageSummary() {
  let bytes = 0;
  store.keys().forEach(k => (bytes += (localStorage.getItem(NS + k) || '').length * 2));
  const docs = store.get('docs', []).length;
  const versions = store.keys().filter(k => k.startsWith('ver:')).reduce((a, k) => a + store.get(k, []).length, 0);
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  return `${plural(docs, 'document')} · ${plural(versions, 'saved version')} · ${(bytes / 1024).toFixed(1)} KB used of about 5 MB (browser limit).`;
}

function exportBackup() {
  const data = { app: 'nuqta', version: 2, exportedAt: new Date().toISOString(), settings, docs: savedDocs(), versions: {}, log: store.get('log', []) };
  data.docs.forEach(d => (data.versions[d.id] = listVersions(d.id)));
  dl(`nuqta-backup-${new Date().toISOString().slice(0, 10)}.json`, new Blob([JSON.stringify(data)], { type: 'application/json' }));
  toast('Backup downloaded', 'download');
  log('Downloaded a full backup', 'download');
}

function importBackup(txt) {
  try {
    const data = JSON.parse(txt);
    if (data.app !== 'nuqta' || !Array.isArray(data.docs)) throw new Error('bad');
    const idx = store.get('docs', []);
    data.docs.forEach(d => {
      normalizeDoc(d);
      store.set('doc:' + d.id, d);
      if (!idx.includes(d.id)) idx.push(d.id);
      if (data.versions && data.versions[d.id]) store.set('ver:' + d.id, data.versions[d.id]);
    });
    store.set('docs', idx);
    if (data.settings) {
      settings = Object.assign({}, DEFAULTS, data.settings);
      saveSettings();
      applySettings();
      setTheme(settings.theme);
    }
    toast(`Restored ${data.docs.length} documents`, 'upload');
    log(`Restored a backup (${data.docs.length} documents)`, 'upload');
    closeModal();
    openDocs();
  } catch {
    toast('Not a Nuqta backup file', 'x');
  }
}

function resetAll() {
  if (!confirm('Delete every document, version, comment and setting on this device?')) return;
  store.keys().forEach(k => store.del(k));
  settings = Object.assign({}, DEFAULTS);
  applySettings();
  setTheme('');
  closeModal();
  openTemplate(TEMPLATES[0]);
  toast('Everything reset', 'refresh');
}

function visibleTarget(step) {
  const el = $(step.sel);
  if (!el) return null;
  const r = el.getBoundingClientRect();
  const onScreen = r.bottom > 0 && r.top < innerHeight && r.right > 0 && r.left < innerWidth;
  return r.width && r.height && onScreen ? el : null;
}

function showTourStep(i) {
  // skip targets hidden at this screen size (e.g. inspector on phones)
  while (i < TOUR.length && !visibleTarget(TOUR[i])) i++;
  if (i >= TOUR.length || i < 0) {
    endTour();
    return;
  }
  tourState.i = i;
  const step = TOUR[i];
  const el = visibleTarget(step);
  if (el.closest('.bar')) el.scrollIntoView({ inline: 'center', block: 'nearest' });
  const r = el.getBoundingClientRect();
  const pad = 6;
  Object.assign($('#tourSpot').style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + pad * 2 + 'px', height: r.height + pad * 2 + 'px' });
  const card = $('#tourCard');
  card.innerHTML = `<h4>${ic(step.icon)} ${esc(step.title)}</h4><p>${esc(step.body)}</p>
    <div class="foot"><span class="step">${i + 1} of ${TOUR.length}</span>
    <button class="btn light sm" id="tSkip">Skip</button><button class="btn sm" id="tNext">${i === TOUR.length - 1 ? 'Done' : 'Next'} ${ic('arrow-right')}</button></div>`;
  placeTourCard(card, r);
  $('#tNext').onclick = () => showTourStep(i + 1);
  $('#tSkip').onclick = endTour;
  $('#tNext').focus();
}

function placeTourCard(card, r) {
  const cw = card.offsetWidth;
  const ch = card.offsetHeight;
  let top = r.bottom + 14;
  if (top + ch > innerHeight - 10) top = r.top - ch - 14;
  if (top < 10) top = clamp(r.top + 20, 10, innerHeight - ch - 10);
  card.style.top = top + 'px';
  card.style.left = clamp(r.left + r.width / 2 - cw / 2, 12, innerWidth - cw - 12) + 'px';
}

function endTour() {
  tourState.active = false;
  $('#tour').hidden = true;
  store.set('tourDone', true);
}

  importMermaid,
  replaceAll,
  openFind,
  addComment,
  addSticky: (text, x = 0, y = 0) => {
    const s = mkSticky(x, y, text);
    doc.stickies.push(s);
    snapshot();
    render();
    return s;
  },
  saveVersion,
  listVersions,
  restoreVersion,
  startPresent,
  endPresent,
  next: () => gotoStep(present.i + 1),
  get presentation() {
    return { active: present.active, i: present.i, steps: present.steps.map(s => s.title) };
  },
  toggleSide,
  setSideTab,
  setTheme,
  openSettings,
  openDocs,
  openExport,
  openHelp,
  startTour,
  svgString,
  markdownOutline,
  log,
};
</script>
</body>
</html>
