<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeBuddy — Code Mentor for Kids | FYP Template</title>
<meta name="description" content="CodeBuddy: 24 guided coding lessons and 5 mini projects in JavaScript and Python for kids and beginners in Pakistan. Editor, turtle graphics, step-through visualiser, blocks to code, bilingual error explanations and a friendly robot mentor. Single-file FYP template.">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ---------- tokens: friendly classroom ---------- */
:root {
  --paper: #fbf7ee;
  --paper-2: #f3ecdb;
  --card: #ffffff;
  --card-2: #fffaf0;
  --ink: #1d2b3a;
  --ink-2: #3a4a5c;
  --muted: #687384;
  --line: #e9e0cd;
  --line-2: #d8cbb0;
  --sky: #1f8ad8;
  --sky-deep: #14619e;
  --sky-soft: #e1f0fc;
  --sun: #ffc83d;
  --sun-deep: #a87700;
  --sun-soft: #fff3cf;
  --mint: #2bbf94;
  --mint-deep: #0f7a5b;
  --mint-soft: #daf5ec;
  --coral: #ef5f4e;
  --coral-deep: #c23d2f;
  --coral-soft: #ffe5e1;
  --ed-bg: #fffdf8;
  --ed-gutter: #f6f0e2;
  --ed-cur: #fff6dc;
  --tk-kw: #c8402f;
  --tk-str: #0f7a5b;
  --tk-num: #946000;
  --tk-fn: #14619e;
  --tk-com: #8a94a3;
  --tk-op: #556273;
  --shadow: 0 2px 0 rgba(29, 43, 58, .05), 0 16px 32px -22px rgba(29, 43, 58, .45);
  --radius: 18px;
  --radius-sm: 12px;
  --top-h: 64px;
  --font: "Lexend", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --font-ur: "Noto Nastaliq Urdu", "Lexend", serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --dur: .35s;
}
html.dark {
  --paper: #142130;
  --paper-2: #1a2a3a;
  --card: #1d2d3e;
  --card-2: #213447;
  --ink: #eef4f9;
  --ink-2: #c9d5e0;
  --muted: #93a4b6;
  --line: #2c4155;
  --line-2: #3b546b;
  --sky: #4aa8ee;
  --sky-deep: #9fd2f8;
  --sky-soft: #1c3a54;
  --sun: #ffd25e;
  --sun-deep: #ffd25e;
  --sun-soft: #3b3420;
  --mint: #3fd0a4;
  --mint-deep: #79e2c2;
  --mint-soft: #173e35;
  --coral: #ff8576;
  --coral-deep: #ffa497;
  --coral-soft: #46292b;
  --ed-bg: #16232f;
  --ed-gutter: #1a2936;
  --ed-cur: #22374a;
  --tk-kw: #ff9b8f;
  --tk-str: #7fe3c2;
  --tk-num: #ffd25e;
  --tk-fn: #8ccbf7;
  --tk-com: #7d8fa1;
  --tk-op: #b8c6d3;
  --shadow: 0 2px 0 rgba(0, 0, 0, .2), 0 16px 32px -22px rgba(0, 0, 0, .8);
}
html.large { font-size: 17.5px; }

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper) radial-gradient(var(--line) 1.1px, transparent 1.3px) 0 0 / 22px 22px;
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.55;
  min-height: 100vh;
  overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; font-weight: 700; }
p { margin: 0 0 10px; }
a { color: var(--sky-deep); }
code, kbd, .mono { font-family: var(--mono); }
code { background: var(--paper-2); border-radius: 6px; padding: 1px 6px; font-size: .88em; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.hidden, [hidden] { display: none !important; }
.spacer { flex: 1; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.stack > * + * { margin-top: 12px; }
.tnum { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; border-radius: 8px; }
.skip { position: absolute; inset-inline-start: 8px; top: -80px; background: var(--ink); color: var(--paper); padding: 8px 12px; border-radius: 10px; z-index: 100; }
.skip:focus { top: 8px; }
.ic { width: 1.1em; height: 1.1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; flex: none; }
.ic.lg { width: 1.5em; height: 1.5em; }
.ic.xl { width: 2.2em; height: 2.2em; }

/* Urdu: Nastaliq for prose, Lexend kept for numbers, code and chips */
html.ur body { font-family: var(--font-ur); line-height: 2.05; }
html.ur .mono, html.ur code, html.ur .editor, html.ur .console, html.ur .kbd, html.ur .vtable td:nth-child(2) { font-family: var(--mono); line-height: 1.55; }
html.ur .num-bubble, html.ur .kpi .v { font-family: var(--font); line-height: 1.2; }
html.ur .console .c-sys { font-family: var(--font-ur), var(--font); line-height: 2; display: block; direction: rtl; text-align: right; }
html.ur .btn, html.ur .chip, html.ur .seg button, html.ur .tabs button { line-height: 1.7; }
html.ur h1, html.ur h2, html.ur h3, html.ur h4 { line-height: 1.9; }
.ltr { direction: ltr; text-align: left; }
[dir=rtl] .flip { transform: scaleX(-1); }

/* ---------- top bar ---------- */
.top {
  position: sticky;
  top: 0;
  z-index: 30;
  height: var(--top-h);
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 18px;
  background: color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 2px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); flex: none; }
.brand .logo { width: 42px; height: 42px; display: grid; place-items: center; }
.brand b { font-size: 1.15rem; font-weight: 800; letter-spacing: -.01em; display: block; line-height: 1.1; }
.brand small { display: block; font-size: .72rem; color: var(--muted); line-height: 1.3; }
html.ur .brand small { line-height: 1.8; }
.nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; }
.nav::-webkit-scrollbar { display: none; }
.nav a {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  color: var(--ink-2);
  text-decoration: none;
  font-weight: 600;
  font-size: .9rem;
  white-space: nowrap;
  min-height: 40px;
  transition: background .2s var(--ease), color .2s;
}
.nav a:hover { background: var(--paper-2); }
.nav a.on { background: var(--sky-soft); color: var(--sky-deep); }
.top-actions { display: flex; gap: 6px; align-items: center; flex: none; }
.iconbtn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  border: 2px solid var(--line);
  background: var(--card);
  display: inline-grid;
  place-items: center;
  cursor: pointer;
  position: relative;
  color: var(--ink-2);
  transition: transform .15s var(--ease), border-color .15s, background .15s;
}
.iconbtn:hover { border-color: var(--line-2); transform: translateY(-1px); }
.iconbtn.on { background: var(--sun-soft); border-color: var(--sun); }
.iconbtn .dot {
  position: absolute;
  top: -6px;
  right: -6px;
  min-width: 19px;
  height: 19px;
  border-radius: 99px;
  background: var(--coral);
  color: #fff;
  font-size: .68rem;
  font-weight: 700;
  display: grid;
  place-items: center;
  padding: 0 5px;
  font-family: var(--font);
  line-height: 1;
}
.avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: inline-grid;
  place-items: center;
  font-weight: 700;
  color: #fff;
  flex: none;
  font-family: var(--font);
  border: 0;
  cursor: pointer;
}
.langbtn { min-width: 64px; padding: 0 12px; width: auto; font-family: var(--font-ur), var(--font); font-weight: 700; }
html.ur .langbtn { font-family: var(--font); }

/* ---------- buttons, fields, chips ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 0;
  border-radius: 14px;
  padding: 9px 16px;
  min-height: 42px;
  font-weight: 600;
  cursor: pointer;
  background: var(--sky);
  color: #fff;
  box-shadow: 0 3px 0 var(--sky-deep);
  white-space: nowrap;
  text-decoration: none;
  transition: transform .15s var(--ease), box-shadow .15s var(--ease), background .15s, filter .15s;
}
.btn:hover { transform: translateY(-1px); filter: brightness(1.04); }
.btn:active { transform: translateY(2px) scale(.98); box-shadow: 0 1px 0 var(--sky-deep); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn.mint { background: var(--mint); color: #08392b; box-shadow: 0 3px 0 var(--mint-deep); }
.btn.sun { background: var(--sun); color: #3d2c00; box-shadow: 0 3px 0 var(--sun-deep); }
.btn.coral { background: var(--coral); color: #fff; box-shadow: 0 3px 0 var(--coral-deep); }
.btn.ghost { background: var(--card); color: var(--ink); box-shadow: 0 3px 0 var(--line-2); border: 2px solid var(--line); }
.btn.flat { background: transparent; color: var(--ink-2); box-shadow: none; border: 2px solid transparent; }
.btn.flat:hover { background: var(--paper-2); }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: .86rem; border-radius: 11px; }
.btn.xs { min-height: 30px; padding: 3px 9px; font-size: .78rem; border-radius: 9px; box-shadow: 0 2px 0 var(--line-2); }
html.dark .btn.mint, html.dark .btn.sun { color: #10202c; }
label.f { display: block; font-weight: 600; font-size: .86rem; margin: 10px 0 5px; color: var(--ink-2); }
input[type=text], input[type=password], input[type=number], input[type=search], select, textarea.field {
  width: 100%;
  min-height: 42px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  padding: 8px 12px;
  outline: 0;
  transition: border-color .15s, box-shadow .15s;
}
textarea.field { min-height: 80px; resize: vertical; font-family: var(--mono); font-size: .88rem; }
input:focus, select:focus, textarea.field:focus { border-color: var(--sky); box-shadow: 0 0 0 4px var(--sky-soft); }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 99px;
  padding: 3px 10px;
  font-size: .78rem;
  font-weight: 600;
  background: var(--paper-2);
  color: var(--ink-2);
  white-space: nowrap;
}
.chip.sky { background: var(--sky-soft); color: var(--sky-deep); }
.chip.sun { background: var(--sun-soft); color: var(--sun-deep); }
.chip.mint { background: var(--mint-soft); color: var(--mint-deep); }
.chip.coral { background: var(--coral-soft); color: var(--coral-deep); }
button.chip { border: 0; cursor: pointer; min-height: 34px; padding: 4px 12px; }
.seg { display: inline-flex; background: var(--paper-2); border-radius: 13px; padding: 3px; gap: 2px; }
.seg button {
  border: 0;
  background: transparent;
  border-radius: 10px;
  padding: 6px 12px;
  font-weight: 600;
  font-size: .86rem;
  cursor: pointer;
  min-height: 36px;
  color: var(--ink-2);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: background .2s var(--ease), color .2s;
}
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 2px 0 var(--line-2); }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.switch { position: relative; width: 48px; height: 28px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 99px; background: var(--line-2); transition: background .2s; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s var(--ease); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.switch input:checked + i { background: var(--mint); }
.switch input:checked + i::after { transform: translateX(20px); }
.switch input:focus-visible + i { outline: 3px solid var(--sun); outline-offset: 2px; }
.card {
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.card h3 { font-size: 1.02rem; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.page { max-width: 1240px; margin: 0 auto; padding: 22px 18px 60px; }
.page-head { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 18px; }
.page-head h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; display: flex; align-items: center; gap: 10px; }
.page-head p { margin: 4px 0 0; color: var(--muted); max-width: 640px; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.cols-2 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 16px; }
.kpi { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; gap: 12px; align-items: center; }
.kpi .ico { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none; }
.kpi .v { font-size: 1.5rem; font-weight: 800; line-height: 1.1; font-family: var(--font); }
.kpi .l { font-size: .8rem; color: var(--muted); }
.bar { height: 10px; border-radius: 99px; background: var(--paper-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--mint); width: 0; }
.empty { text-align: center; padding: 30px 16px; color: var(--muted); }
.empty .ic { width: 2.4em; height: 2.4em; margin-bottom: 8px; color: var(--line-2); }
.kbd { display: inline-block; min-width: 26px; padding: 2px 7px; border-radius: 7px; border: 2px solid var(--line); border-bottom-width: 3px; background: var(--card); font-family: var(--mono); font-size: .8rem; text-align: center; }
.note { border-radius: 14px; padding: 10px 12px; background: var(--sun-soft); color: var(--ink); font-size: .86rem; display: flex; gap: 10px; align-items: flex-start; }
.note.sky { background: var(--sky-soft); }
.note.coral { background: var(--coral-soft); }
.note.mint { background: var(--mint-soft); }
.note .ic { margin-top: 3px; }

/* ---------- Buddy the robot ---------- */
.buddy { display: block; overflow: visible; }
.buddy .b-ink { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.buddy .b-head { fill: var(--sky); stroke: var(--ink); stroke-width: 3; }
.buddy .b-face { fill: #fdfcf7; }
.buddy .b-ear { fill: var(--coral); stroke: var(--ink); stroke-width: 3; }
.buddy .b-body { fill: var(--mint); stroke: var(--ink); stroke-width: 3; }
.buddy .b-bulb { fill: var(--sun); stroke: var(--ink); stroke-width: 3; }
.buddy .b-eye { fill: #1d2b3a; }
.buddy .b-line { fill: none; stroke: #1d2b3a; stroke-width: 3; stroke-linecap: round; }
.buddy .b-cheek { fill: var(--coral); opacity: .45; }
.buddy .b-heart { fill: var(--sun); stroke: var(--ink); stroke-width: 2.5; }
.buddy .b-bob { animation: bob 3.2s var(--ease) infinite; transform-origin: 60px 70px; }
.buddy .b-bulb { animation: blink 2.4s steps(1) infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes blink { 0%, 70%, 100% { opacity: 1; } 80% { opacity: .45; } }
.buddy.cheer .b-bob { animation: cheer .6s var(--ease) 2; }
@keyframes cheer { 0%, 100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-8px) rotate(-6deg); } 60% { transform: translateY(-4px) rotate(5deg); } }

/* ---------- IDE: lesson rail · editor · output ---------- */
.ide-wrap { height: calc(100vh - var(--top-h)); display: flex; flex-direction: column; }
.ide {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 290px minmax(0, 1fr) 400px;
  gap: 14px;
  padding: 14px;
}
.rail, .center, .side { min-height: 0; min-width: 0; display: flex; flex-direction: column; }
.rail { overflow-y: auto; gap: 12px; padding-bottom: 8px; scrollbar-width: thin; }
.rail > * { flex-shrink: 0; }
.ide-switch { display: none; }
.lesson-card { position: relative; }
.lesson-card .crumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.lesson-card h2 { font-size: 1.18rem; font-weight: 800; letter-spacing: -.01em; margin-bottom: 6px; }
.lesson-card .explain { font-size: .9rem; color: var(--ink-2); }
.lesson-card .explain code { white-space: nowrap; }
.lesson-card .peek { float: right; margin: -4px -4px 4px 8px; }
[dir=rtl] .lesson-card .peek { float: left; margin: -4px 8px 4px -4px; }
.goals { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
.goals li { display: flex; gap: 9px; align-items: flex-start; font-size: .88rem; padding: 7px 9px; border-radius: 12px; background: var(--paper-2); transition: background .3s var(--ease); }
.goals li .tick { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-2); display: grid; place-items: center; flex: none; background: var(--card); color: transparent; transition: background .25s var(--ease), border-color .25s, color .25s; }
.goals li.ok { background: var(--mint-soft); }
.goals li.ok .tick { background: var(--mint); border-color: var(--mint); color: #fff; animation: pop .35s var(--ease); }
.goals li.fail .tick { border-color: var(--coral); }
.hints { margin-top: 10px; display: grid; gap: 6px; }
.hint { font-size: .86rem; padding: 8px 10px; border-radius: 12px; background: var(--sun-soft); border-inline-start: 4px solid var(--sun); animation: fadeUp .3s var(--ease) both; }
.lesson-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.unit { border: 2px solid var(--line); border-radius: var(--radius); background: var(--card); overflow: hidden; }
.unit > button {
  width: 100%;
  border: 0;
  background: transparent;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  cursor: pointer;
  text-align: start;
  font-weight: 700;
  min-height: 48px;
}
.unit > button .ico { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.unit > button .meta { font-size: .74rem; color: var(--muted); font-weight: 500; display: block; }
.unit > button .ic.chev { margin-inline-start: auto; transition: transform .2s var(--ease); }
.unit.open > button .ic.chev { transform: rotate(180deg); }
.unit .lessons { display: none; padding: 0 8px 8px; }
.unit.open .lessons { display: grid; gap: 3px; }
.lrow {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 8px;
  border-radius: 11px;
  text-decoration: none;
  color: var(--ink);
  font-size: .87rem;
  min-height: 40px;
  transition: background .15s;
}
.lrow:hover { background: var(--paper-2); }
.lrow.on { background: var(--sky-soft); color: var(--sky-deep); font-weight: 600; }
.num-bubble { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .74rem; font-weight: 700; background: var(--paper-2); color: var(--ink-2); flex: none; font-family: var(--font); }
.lrow.done .num-bubble { background: var(--mint); color: #fff; }
.lrow .st { margin-inline-start: auto; color: var(--mint-deep); }
.u-sky { background: var(--sky-soft); color: var(--sky-deep); }
.u-sun { background: var(--sun-soft); color: var(--sun-deep); }
.u-mint { background: var(--mint-soft); color: var(--mint-deep); }
.u-coral { background: var(--coral-soft); color: var(--coral-deep); }

.center { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.edbar { display: flex; gap: 8px; align-items: center; padding: 10px 12px; flex-wrap: wrap; }
.edbar .iconbtn { width: 38px; height: 38px; }
.edbar .doc-title { font-weight: 700; font-size: .92rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
@media (max-width: 1500px) { .edbar .doc-title { display: none; } }
.findbar { display: flex; gap: 6px; align-items: center; padding: 8px 12px; border-top: 2px solid var(--line); background: var(--sun-soft); flex-wrap: wrap; animation: fadeIn .2s var(--ease); }
.findbar input { max-width: 200px; min-height: 36px; }
.findbar .count { font-size: .8rem; color: var(--ink-2); min-width: 64px; }

/* editor: transparent textarea over a highlighted <pre> */
.editor {
  position: relative;
  flex: 1;
  min-height: 260px;
  display: flex;
  background: var(--ed-bg);
  border-top: 2px solid var(--line);
  font-family: var(--mono);
  font-size: var(--ed-fs, 15px);
  line-height: var(--ed-lh, 24px);
  direction: ltr;
  overflow: hidden;
}
.ed-gutter { flex: none; width: 50px; background: var(--ed-gutter); color: var(--muted); text-align: right; overflow: hidden; user-select: none; position: relative; font-size: .86em; }
.ed-gutter .in { padding: 12px 10px 40px 0; will-change: transform; }
.gl { display: block; height: var(--ed-lh, 24px); position: relative; }
.gl.cur { color: var(--ink); font-weight: 700; }
.gl.err { color: var(--coral-deep); font-weight: 700; }
.gl.err::before { content: ""; position: absolute; left: 6px; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%; background: var(--coral); }
.gl.step { color: var(--ink); font-weight: 700; }
.gl.step::before { content: ""; position: absolute; left: 4px; top: 50%; margin-top: -6px; border: 6px solid transparent; border-left: 9px solid var(--sun-deep); }
.ed-main { position: relative; flex: 1; min-width: 0; }
.ed-hl, .ed-ta {
  position: absolute;
  inset: 0;
  margin: 0;
  padding: 12px 14px 40px;
  font: inherit;
  line-height: inherit;
  white-space: pre;
  tab-size: 4;
  letter-spacing: 0;
  border: 0;
  word-wrap: normal;
  overflow-wrap: normal;
}
.ed-hl { pointer-events: none; overflow: hidden; color: var(--ink); }
.ed-hl .in { width: max-content; min-width: 100%; will-change: transform; }
.ed-ta { background: transparent; color: transparent; caret-color: var(--ink); resize: none; outline: none; overflow: auto; z-index: 1; -webkit-text-fill-color: transparent; }
.ed-ta::selection { background: rgba(31, 138, 216, .28); }
.ln { display: block; height: var(--ed-lh, 24px); margin: 0 -14px; padding: 0 14px; }
.ln.cur { background: var(--ed-cur); }
.ln.err { background: var(--coral-soft); box-shadow: inset 4px 0 0 var(--coral); }
.ln.step { background: var(--sun-soft); box-shadow: inset 4px 0 0 var(--sun); animation: stepIn .3s var(--ease); }
@keyframes stepIn { from { background: var(--sun); } to { background: var(--sun-soft); } }
.t-kw { color: var(--tk-kw); font-weight: 700; }
.t-str, .t-tpl, .t-fstr { color: var(--tk-str); }
.t-num { color: var(--tk-num); }
.t-com { color: var(--tk-com); font-style: italic; }
.t-fn, .t-bi { color: var(--tk-fn); }
.t-bi { font-weight: 500; }
.t-op { color: var(--tk-op); }
.t-bad { text-decoration: wavy underline var(--coral); }
.d-find { background: rgba(255, 200, 61, .45); border-radius: 3px; }
.d-cur { background: var(--sun); border-radius: 3px; }
.d-br { box-shadow: inset 0 0 0 1.5px var(--sky); border-radius: 3px; background: var(--sky-soft); }
.inputs { border-top: 2px solid var(--line); }
.inputs summary { padding: 8px 12px; cursor: pointer; font-size: .84rem; font-weight: 600; color: var(--ink-2); display: flex; align-items: center; gap: 8px; list-style: none; min-height: 40px; }
.inputs summary::-webkit-details-marker { display: none; }
.inputs .body { padding: 0 12px 10px; }
.inputs textarea { min-height: 64px; }
.statusbar { display: flex; gap: 10px; align-items: center; padding: 7px 12px; border-top: 2px solid var(--line); font-size: .76rem; color: var(--muted); flex-wrap: wrap; background: var(--card-2); }
.statusbar .chip { font-size: .72rem; }

.side { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.tabs { display: flex; gap: 4px; padding: 8px; border-bottom: 2px solid var(--line); background: var(--card-2); }
.tabs button {
  flex: 1;
  border: 0;
  background: transparent;
  border-radius: 11px;
  min-height: 40px;
  font-weight: 600;
  color: var(--ink-2);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  font-size: .88rem;
  position: relative;
  transition: background .2s var(--ease), color .2s;
}
.tabs button.on { background: var(--card); color: var(--ink); box-shadow: 0 2px 0 var(--line-2); }
.tabs button .pip { width: 8px; height: 8px; border-radius: 50%; background: var(--coral); }
.pane { flex: 1; overflow-y: auto; padding: 12px; display: none; scrollbar-width: thin; }
.pane.on { display: block; animation: fadeIn .25s var(--ease); }
.turtle-card { border: 2px solid var(--line); border-radius: 16px; overflow: hidden; margin-bottom: 12px; background: var(--ed-bg); }
.turtle-card .bar-top { display: flex; gap: 6px; align-items: center; padding: 6px 8px; border-bottom: 2px solid var(--line); background: var(--card-2); flex-wrap: wrap; }
.turtle-card .bar-top b { font-size: .84rem; display: flex; gap: 6px; align-items: center; }
.turtle-card canvas { display: block; width: 100%; aspect-ratio: 1; touch-action: none; }
.turtle-card select { min-height: 32px; padding: 2px 8px; width: auto; font-size: .8rem; border-radius: 9px; }
.console {
  font-family: var(--mono);
  font-size: .88rem;
  line-height: 1.6;
  background: var(--ed-bg);
  border: 2px solid var(--line);
  border-radius: 16px;
  padding: 10px 12px;
  min-height: 120px;
  white-space: pre-wrap;
  word-break: break-word;
  direction: ltr;
  text-align: left;
}
.console .c-in { color: var(--sky-deep); font-weight: 700; }
.console .c-err { color: var(--coral-deep); font-weight: 600; }
.console .c-sys { color: var(--muted); font-style: italic; }
.console .c-new { animation: fadeIn .25s var(--ease); }
.console-head { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; font-size: .84rem; font-weight: 700; color: var(--ink-2); }
.err-card { margin-top: 12px; border-radius: 16px; background: var(--coral-soft); border: 2px solid color-mix(in srgb, var(--coral) 45%, transparent); padding: 12px; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; animation: pop .3s var(--ease); }
.err-card h4 { font-size: .98rem; margin-bottom: 4px; }
.err-card .raw { font-family: var(--mono); font-size: .76rem; color: var(--coral-deep); margin-bottom: 6px; direction: ltr; text-align: left; word-break: break-word; }
.err-card .fix { margin-top: 8px; background: var(--card); border-radius: 12px; padding: 8px 10px; font-size: .86rem; }
.err-card pre { margin: 6px 0 0; font-family: var(--mono); font-size: .8rem; background: var(--ed-bg); border-radius: 10px; padding: 8px; overflow-x: auto; direction: ltr; text-align: left; }
.err-card .other { margin-top: 8px; padding-top: 8px; border-top: 2px dashed color-mix(in srgb, var(--coral) 35%, transparent); font-size: .86rem; }
.result-card { margin-top: 12px; border-radius: 16px; border: 2px solid var(--line); padding: 12px; background: var(--card-2); }
.result-card.win { background: var(--mint-soft); border-color: color-mix(in srgb, var(--mint) 55%, transparent); }
.result-card h4 { display: flex; gap: 8px; align-items: center; font-size: .95rem; margin-bottom: 6px; }
.offline-card { margin-top: 12px; }

/* ---------- step-through visualiser ---------- */
.vis-controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.vis-controls input[type=range] { flex: 1; min-width: 120px; accent-color: var(--sun-deep); }
.vis-status { font-size: .82rem; color: var(--ink-2); margin-bottom: 8px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.vis-event { border-radius: 14px; background: var(--sun-soft); padding: 9px 12px; font-size: .88rem; margin-bottom: 12px; border-inline-start: 4px solid var(--sun); min-height: 44px; }
.vis-event code { background: var(--card); }
.vis-block { margin-bottom: 12px; }
.vis-block h4 { font-size: .82rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
html.ur .vis-block h4 { text-transform: none; letter-spacing: 0; }
.vtable { width: 100%; border-collapse: separate; border-spacing: 0 4px; font-size: .86rem; }
.vtable th { text-align: start; font-size: .74rem; color: var(--muted); font-weight: 600; padding: 0 8px; }
.vtable td { background: var(--paper-2); padding: 6px 8px; }
.vtable td:first-child { border-radius: 10px 0 0 10px; font-weight: 700; font-family: var(--mono); }
.vtable td:last-child { border-radius: 0 10px 10px 0; color: var(--muted); font-size: .76rem; }
[dir=rtl] .vtable td:first-child { border-radius: 0 10px 10px 0; }
[dir=rtl] .vtable td:last-child { border-radius: 10px 0 0 10px; }
.vtable td:nth-child(2) { font-family: var(--mono); direction: ltr; word-break: break-all; }
.vtable tr.changed td { background: var(--sun-soft); animation: flash .6s var(--ease); }
.vtable tr.added td { animation: fadeUp .35s var(--ease) both; background: var(--mint-soft); }
@keyframes flash { 0% { background: var(--sun); } 100% { background: var(--sun-soft); } }
.frames { display: flex; flex-direction: column; gap: 6px; }
.frame { border: 2px solid var(--line); border-radius: 12px; padding: 7px 10px; display: flex; gap: 8px; align-items: center; font-size: .86rem; background: var(--card); animation: fadeUp .3s var(--ease) both; }
.frame.now { border-color: var(--sky); background: var(--sky-soft); }
.frame b { font-family: var(--mono); }
.loops { display: grid; gap: 6px; }
.loop { border-radius: 12px; padding: 7px 10px; background: var(--mint-soft); font-size: .86rem; }
.loop .bar { margin-top: 5px; height: 7px; background: var(--card); }
.vis-out { font-family: var(--mono); font-size: .82rem; white-space: pre-wrap; background: var(--ed-bg); border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; min-height: 44px; max-height: 160px; overflow: auto; direction: ltr; text-align: left; }

/* ---------- Buddy mentor chat ---------- */
.chat { display: flex; flex-direction: column; gap: 10px; }
.msg { display: flex; gap: 8px; align-items: flex-end; animation: fadeUp .3s var(--ease) both; }
.msg .bubble { border-radius: 16px; padding: 9px 12px; font-size: .9rem; max-width: 88%; background: var(--paper-2); white-space: pre-wrap; word-break: break-word; }
.msg.me { flex-direction: row-reverse; }
.msg.me .bubble { background: var(--sky); color: #fff; border-end-end-radius: 4px; }
.msg.bot .bubble { border-end-start-radius: 4px; }
.msg .bubble code { background: var(--card); color: var(--ink); }
.msg .bubble pre { margin: 6px 0 0; font-family: var(--mono); font-size: .8rem; background: var(--ed-bg); color: var(--ink); border-radius: 10px; padding: 8px; overflow-x: auto; white-space: pre; direction: ltr; text-align: left; }
.msg .who { width: 34px; flex: none; }
.msg .src { display: block; font-size: .7rem; color: var(--muted); margin-top: 4px; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
.chat-form { display: flex; gap: 8px; margin-top: 10px; position: sticky; bottom: -12px; background: var(--card); padding: 8px 0 12px; }
.typing { display: inline-flex; gap: 4px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; }
.typing i:nth-child(3) { animation-delay: .4s; }

/* ---------- blocks ---------- */
.blocks-layout { display: grid; grid-template-columns: 230px minmax(0, 1fr) minmax(0, 380px); gap: 14px; align-items: start; }
.palette { display: grid; gap: 7px; position: sticky; top: calc(var(--top-h) + 14px); }
.palette h3 { grid-column: 1 / -1; margin-bottom: 4px; }
.pblock, .blk-head {
  display: flex;
  align-items: center;
  gap: 8px;
  border-radius: 12px;
  padding: 8px 10px;
  font-weight: 600;
  font-size: .86rem;
  color: #12202c;
  border: 0;
  cursor: grab;
  min-height: 42px;
  text-align: start;
  box-shadow: 0 3px 0 rgba(0, 0, 0, .14);
  transition: transform .15s var(--ease), box-shadow .15s;
}
.pblock:hover { transform: translateX(3px); }
[dir=rtl] .pblock:hover { transform: translateX(-3px); }
.b-move { background: #7cc4f3; }
.b-turn { background: #a6d8f8; }
.b-pen { background: #c9e7fb; }
.b-repeat { background: #ffd66b; }
.b-if { background: #ffe39b; }
.b-var { background: #7fdcbc; }
.b-print { background: #ff9d90; }
.b-ask { background: #ffbcb2; }
.workspace { min-height: 420px; border: 2px dashed var(--line-2); border-radius: var(--radius); padding: 12px; background: var(--card-2); }
.blk { margin: 0; }
.blk-head { cursor: default; flex-wrap: wrap; box-shadow: 0 3px 0 rgba(0, 0, 0, .12); }
.blk-head input, .blk-head select {
  min-height: 32px;
  width: auto;
  max-width: 130px;
  padding: 2px 8px;
  border-radius: 9px;
  border: 0;
  background: rgba(255, 255, 255, .8);
  font-family: var(--mono);
  font-size: .82rem;
  color: #12202c;
}
.blk-head input.num { max-width: 64px; }
.blk-head .ops { margin-inline-start: auto; display: flex; gap: 3px; }
.blk-head .ops button { width: 30px; height: 30px; border-radius: 8px; border: 0; background: rgba(255, 255, 255, .55); cursor: pointer; display: grid; place-items: center; color: #12202c; }
.blk-body { margin-inline-start: 22px; border-inline-start: 6px solid; padding: 6px 0 6px 8px; border-color: inherit; }
.blk.c-repeat { border-color: #ffd66b; }
.blk.c-if { border-color: #ffe39b; }
.blk-foot { width: 90px; height: 12px; border-radius: 0 0 10px 10px; margin-bottom: 6px; }
.slot { height: 10px; border-radius: 6px; margin: 2px 0; transition: height .15s var(--ease), background .15s; cursor: pointer; }
.slot:hover { background: var(--line); }
.slot.on { height: 14px; background: var(--sun); }
.slot.drag { height: 22px; background: var(--sky-soft); outline: 2px dashed var(--sky); }
.blk.dragging { opacity: .45; }
.code-view { font-family: var(--mono); font-size: .84rem; line-height: 1.6; background: var(--ed-bg); border-radius: 14px; padding: 12px; white-space: pre; overflow-x: auto; border: 2px solid var(--line); direction: ltr; text-align: left; min-height: 120px; }

/* ---------- projects, progress, teacher ---------- */
.proj { display: flex; flex-direction: column; gap: 10px; }
.proj .art { height: 120px; border-radius: 14px; display: grid; place-items: center; overflow: hidden; }
.proj .art svg { width: 100%; height: 100%; }
.proj h3 { margin: 0; }
.proj .steps { margin: 0; padding-inline-start: 18px; font-size: .86rem; color: var(--ink-2); }
.badges { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.badge { text-align: center; padding: 14px 10px; border-radius: var(--radius); border: 2px solid var(--line); background: var(--card); }
.badge .medal { width: 64px; height: 64px; margin: 0 auto 8px; border-radius: 50%; display: grid; place-items: center; border: 4px solid; }
.badge.locked { opacity: .55; filter: grayscale(.8); }
.badge b { display: block; font-size: .88rem; }
.badge span { font-size: .74rem; color: var(--muted); }
.heat { display: grid; grid-template-rows: repeat(7, 14px); grid-auto-flow: column; grid-auto-columns: 14px; gap: 4px; overflow-x: auto; padding-bottom: 4px; direction: ltr; }
.heat i { border-radius: 4px; background: var(--paper-2); }
.heat i.l1 { background: color-mix(in srgb, var(--mint) 40%, var(--paper-2)); }
.heat i.l2 { background: color-mix(in srgb, var(--mint) 70%, var(--paper-2)); }
.heat i.l3 { background: var(--mint); }
.unit-bars { display: grid; gap: 10px; }
.unit-bars .between span { font-size: .84rem; }
.table-wrap { overflow-x: auto; border-radius: var(--radius); border: 2px solid var(--line); background: var(--card); }
table.data { width: 100%; border-collapse: collapse; font-size: .86rem; min-width: 640px; }
table.data th, table.data td { padding: 9px 10px; text-align: start; border-bottom: 2px solid var(--line); white-space: nowrap; }
table.data th { font-size: .76rem; color: var(--muted); background: var(--card-2); font-weight: 600; }
table.data tr:last-child td { border-bottom: 0; }
.mini-bar { width: 70px; height: 8px; border-radius: 99px; background: var(--paper-2); display: inline-block; vertical-align: middle; overflow: hidden; margin-inline-end: 6px; }
.mini-bar i { display: block; height: 100%; background: var(--sky); border-radius: 99px; }
.profile-row { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 14px; border: 2px solid var(--line); }
.profile-row.on { border-color: var(--sky); background: var(--sky-soft); }

/* ---------- error dictionary, inbox, settings, about ---------- */
.err-entry { display: grid; gap: 6px; }
.err-entry .raw { font-family: var(--mono); font-size: .78rem; color: var(--coral-deep); direction: ltr; text-align: left; }
.inbox-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); transition: transform .2s var(--ease), border-color .2s; }
.inbox-item.unread { border-color: var(--sky); background: color-mix(in srgb, var(--sky-soft) 60%, var(--card)); }
.inbox-item .ico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.inbox-item .when { font-size: .74rem; color: var(--muted); }
.list { display: grid; gap: 8px; }
.setrow { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 2px dashed var(--line); }
.setrow:last-child { border-bottom: 0; }
.setrow .lbl b { display: block; font-size: .92rem; }
.setrow .lbl span { font-size: .8rem; color: var(--muted); }
.setrow select { max-width: 200px; }
.warn-box { border-radius: 14px; border: 2px solid var(--coral); background: var(--coral-soft); padding: 10px 12px; font-size: .84rem; }
.todo { border: 2px solid var(--line); border-radius: 16px; padding: 12px; background: var(--card); }
.todo h4 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .95rem; margin-bottom: 4px; }

/* ---------- modal, toast, tour, search ---------- */
#scrim { position: fixed; inset: 0; background: rgba(20, 30, 40, .45); opacity: 0; pointer-events: none; transition: opacity .25s var(--ease); z-index: 60; }
#scrim.open { opacity: 1; pointer-events: auto; }
.modal { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; pointer-events: none; z-index: 61; }
.modal .box {
  width: min(560px, 100%);
  max-height: calc(100vh - 32px);
  overflow-y: auto;
  background: var(--card);
  border-radius: 22px;
  border: 2px solid var(--line);
  box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .45);
  padding: 18px;
  opacity: 0;
  transform: scale(.96) translateY(8px);
  transition: opacity .25s var(--ease), transform .25s var(--ease);
}
.modal.wide .box { width: min(860px, 100%); }
.modal.open { pointer-events: auto; }
.modal.open .box { opacity: 1; transform: none; }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.modal-head h2 { font-size: 1.15rem; display: flex; gap: 8px; align-items: center; }
#toasts { position: fixed; bottom: 18px; inset-inline-end: 18px; display: grid; gap: 8px; z-index: 80; max-width: min(360px, calc(100vw - 36px)); }
.toast { display: flex; gap: 10px; align-items: center; background: var(--ink); color: var(--paper); padding: 11px 14px; border-radius: 14px; box-shadow: 0 14px 30px -14px rgba(0, 0, 0, .5); font-size: .9rem; animation: toastIn .3s var(--ease) both; }
.toast.ok .ic { color: var(--mint); }
.toast.bad .ic { color: var(--coral); }
.toast.out { animation: toastOut .3s var(--ease) forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(10px); } }
#tour { position: fixed; inset: 0; z-index: 90; display: none; }
#tour.on { display: block; }
#tourSpot { position: fixed; border-radius: 16px; box-shadow: 0 0 0 9999px rgba(20, 30, 40, .55); transition: all .3s var(--ease); pointer-events: none; border: 3px solid var(--sun); }
#tourTip { position: fixed; width: min(340px, calc(100vw - 32px)); background: var(--card); border-radius: 18px; padding: 14px; box-shadow: 0 20px 50px -18px rgba(0, 0, 0, .55); border: 2px solid var(--line); transition: top .3s var(--ease), left .3s var(--ease); }
#tourTip h4 { font-size: 1rem; margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
#tourTip p { font-size: .88rem; color: var(--ink-2); }
.dots { display: flex; gap: 5px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); }
.dots i.on { background: var(--sky); width: 20px; border-radius: 99px; }
.search-results { display: grid; gap: 4px; margin-top: 10px; max-height: 50vh; overflow-y: auto; }
.sres { display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 12px; cursor: pointer; border: 0; background: transparent; text-align: start; width: 100%; min-height: 44px; }
.sres:hover, .sres.on { background: var(--sky-soft); }
.sres .k { font-size: .72rem; color: var(--muted); margin-inline-start: auto; }

/* ---------- certificate ---------- */
.cert {
  position: relative;
  background: #fffdf6;
  color: #1d2b3a;
  border-radius: 18px;
  padding: 34px 30px;
  text-align: center;
  border: 10px solid #ffc83d;
  outline: 3px solid #1f8ad8;
  outline-offset: -20px;
  font-family: var(--font);
}
.cert h2 { font-size: 1.7rem; font-weight: 800; letter-spacing: -.01em; }
.cert .who { font-size: 2rem; font-weight: 800; color: #14619e; margin: 10px 0; border-bottom: 3px dotted #d8cbb0; display: inline-block; padding: 0 18px 4px; }
.cert .sub { color: #3a4a5c; }
.cert .sig { display: flex; justify-content: space-between; gap: 20px; margin-top: 26px; font-size: .84rem; color: #3a4a5c; }
.cert .sig span { border-top: 2px solid #1d2b3a; padding-top: 4px; min-width: 150px; }
.cert .ur-line { font-family: var(--font-ur); line-height: 2; color: #3a4a5c; }
.cert .medals { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }

/* ---------- motion kit ---------- */
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
html.rm *, html.rm *::before, html.rm *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
@keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }
.enter { animation: fadeUp var(--dur) var(--ease) both; }
.stagger > * { animation: fadeUp .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
.card, .tile { transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s; }
.card.lift:hover { transform: translateY(-2px); }
.fill, .bar > i, .mini-bar > i { transition: width .6s var(--ease); }
.skeleton { background: linear-gradient(90deg, var(--paper-2) 25%, var(--card) 50%, var(--paper-2) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 10px; min-height: 18px; }

/* ---------- responsive ---------- */
@media (max-width: 1240px) {
  .ide { grid-template-columns: 260px minmax(0, 1fr) 360px; gap: 10px; padding: 10px; }
  .blocks-layout { grid-template-columns: 200px minmax(0, 1fr); }
  .blocks-layout > .code-col { grid-column: 1 / -1; }
  .brand small { display: none; }
}
@media (max-width: 920px) {
  :root { --top-h: 108px; }
  .top { flex-wrap: wrap; height: auto; min-height: var(--top-h); padding: 8px 12px; row-gap: 6px; }
  .nav { order: 3; flex-basis: 100%; }
  .brand { flex: 1; min-width: 0; }
  .ide-wrap { height: auto; }
  .ide-switch { display: flex; gap: 4px; margin: 10px 10px 0; background: var(--paper-2); border-radius: 14px; padding: 4px; }
  .ide-switch button { flex: 1; border: 0; background: transparent; border-radius: 11px; min-height: 42px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; justify-content: center; cursor: pointer; color: var(--ink-2); }
  .ide-switch button.on { background: var(--card); color: var(--ink); box-shadow: 0 2px 0 var(--line-2); }
  .ide { display: block; padding: 10px; }
  .ide > * { display: none; }
  .ide > .on-mobile { display: flex; }
  .rail { overflow: visible; }
  .center { min-height: 0; }
  .editor { flex: none; height: 52vh; min-height: 300px; }
  .side { min-height: 70vh; }
  .pane { overflow: visible; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cols-2, .blocks-layout { grid-template-columns: minmax(0, 1fr); }
  .palette { position: static; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .page { padding: 16px 12px 70px; }
  .page-head h1 { font-size: 1.35rem; }
  .err-card { grid-template-columns: minmax(0, 1fr); }
  .err-card .bd-wrap { display: none; }
  .edbar .doc-title { display: none; }
}
@media (max-width: 420px) {
  .btn { padding: 8px 12px; }
  .edbar { gap: 6px; padding: 8px; }
  .top-actions { gap: 4px; }
  .top-actions .iconbtn { width: 38px; height: 38px; }
  .top-actions .langbtn { width: auto; }
  #settingsBtn { display: none; }
  .langbtn { min-width: 52px; padding: 0 8px; }
  .brand .logo { width: 36px; height: 36px; }
  .brand b { font-size: 1rem; }
  .cert { padding: 22px 14px; border-width: 7px; }
  .cert .who { font-size: 1.5rem; }
}

/* ---------- print ---------- */
#printArea { display: none; }
@media print {
  body { background: #fff; color: #000; }
  body.printing > *:not(#printArea) { display: none !important; }
  body.printing #printArea { display: block; }
  #printArea .cert { break-inside: avoid; margin: 0 0 20px; }
  #printArea table.data { min-width: 0; font-size: 11px; }
  #printArea table.data th, #printArea table.data td { border-bottom: 1px solid #bbb; padding: 4px 6px; color: #000; background: #fff; }
  #printArea .print-head { margin-bottom: 12px; }
  .page-break { break-after: page; }
}
</style>

<script>
'use strict';
/* =====================================================================
   CodeBuddy — Code Mentor for Kids and Beginners (single file)
   utils · i18n · content (lessons, projects, glossary, error catalogue)
   language core (lexer · parser · mini interpreter · builtins)
   editor · turtle canvas · runners (JS worker, Pyodide, mini) · goals
   explain-error · lint · IDE · visualiser · mentor · live AI adapter
   blocks · projects · progress · teacher · inbox · search · settings
   tour · shortcuts · about · router/boot
   Student hooks: search for TODO(student)

// =====================================================================
// Utilities: DOM, storage, escaping, toasts, modal, motion helpers
// =====================================================================
const NS = 'cb:';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const store = {
  get(k, d) {
    try {
      const v = localStorage.getItem(NS + k);
      return v == null ? d : JSON.parse(v);
    } catch {
      return d;
    }
  },
  set(k, v) {
    try {
      localStorage.setItem(NS + k, JSON.stringify(v));
      return true;
    } catch {
      return false;
    }
  },
  remove(k) {
    try {
      localStorage.removeItem(NS + k);
    } catch {
      /* storage blocked */
    }
  },
  keys() {
    const out = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(NS)) out.push(k.slice(NS.length));
      }
    } catch {
      /* storage blocked */
    }
    return out;
  },
};

// Session-only storage (the Live AI key lives here unless the user opts in).
const session = {
  get(k) {
    try {
      return sessionStorage.getItem(NS + k);
    } catch {
      return null;
    }
  },
  set(k, v) {
    try {
      if (v == null) sessionStorage.removeItem(NS + k);
      else sessionStorage.setItem(NS + k, v);
    } catch {
      /* storage blocked */
    }
  },
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const DAY = 864e5;
const isoDay = ts => {
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};
const todayIso = () => isoDay(Date.now());
const fmtDate = ts => new Date(ts).toLocaleDateString(lang === 'ur' ? 'ur-PK' : 'en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const initials = n => String(n || '?').split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();

function ago(ts) {
  const mins = Math.round((Date.now() - ts) / 6e4);
  if (mins < 1) return t('justNow');
  if (mins < 60) return t('minAgo', { n: mins });
  const hours = Math.round(mins / 60);
  if (hours < 24) return t('hAgo', { n: hours });
  const days = Math.round(hours / 24);
  if (days === 1) return t('yesterday');
  if (days < 30) return t('daysAgo', { n: days });
  return fmtDate(ts);
}

function debounce(fn, ms) {
  let timer = null;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), ms);
  };
}

function announce(text) {
  const live = $('#liveRegion');
  if (!live) return;
  live.textContent = '';
  setTimeout(() => (live.textContent = text), 30);
}

function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icon = type === 'ok' ? 'check-circle' : type === 'bad' ? 'alert-circle' : 'info';
  el.innerHTML = ic(icon) + '<span></span>';
  el.lastChild.textContent = msg;
  $('#toasts').append(el);
  setTimeout(() => el.classList.add('out'), 3000);
  setTimeout(() => el.remove(), 3400);
}

function downloadText(name, text, mime = 'application/json') {
  const url = URL.createObjectURL(new Blob([text], { type: mime }));
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function pickFile(accept) {
  return new Promise(resolve => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = accept;
    input.onchange = () => resolve(input.files[0] || null);
    input.click();
  });
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast(t('copied'), 'ok');
  } catch {
    toast(t('copyFailed'), 'bad');
  }
}

// ---------- motion kit helpers ----------
function animateIn(root) {
  if (!root) return;
  root.classList.remove('enter');
  void root.offsetWidth;
  root.classList.add('enter');
  $$('.stagger', root).forEach(g => [...g.children].forEach((el, i) => el.style.setProperty('--i', Math.min(i, 16))));
}

function countUp(el, to, fmt = v => Math.round(v).toLocaleString('en-PK')) {
  if (!el) return;
  const t0 = performance.now();
  const dur = 700;
  const step = nowTs => {
    const p = Math.min(1, (nowTs - t0) / dur);
    el.textContent = fmt(to * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function growBars(root) {
  requestAnimationFrame(() => $$('[data-w]', root).forEach(el => (el.style.width = el.dataset.w + '%')));
}

function drawPath(p) {
  const len = p.getTotalLength();
  p.style.strokeDasharray = len;
  p.style.strokeDashoffset = len;
  p.getBoundingClientRect();
  p.style.transition = 'stroke-dashoffset .9s var(--ease)';
  p.style.strokeDashoffset = 0;
}

// ---------- modal ----------
let modalClose = null;
let modalReturnFocus = null;

function openModal(html, { wide = false, onClose = null } = {}) {
  modalReturnFocus = document.activeElement;
  const box = $('#modal .box');
  box.innerHTML = html;
  $('#modal').className = 'modal open' + (wide ? ' wide' : '');
  $('#scrim').classList.add('open');
  modalClose = onClose;
  $$('[data-close]', box).forEach(b => (b.onclick = closeModal));
  const first = box.querySelector('input:not([type=hidden]),select,textarea,button:not([data-close])');
  setTimeout(() => (first || box).focus(), 40);
}

function closeModal() {
  if (!$('#modal').classList.contains('open')) return;
  $('#modal').className = 'modal';
  $('#scrim').classList.remove('open');
  setTimeout(() => {
    if (!$('#modal').classList.contains('open')) $('#modal .box').innerHTML = '';
  }, 260);
  const cb = modalClose;
  modalClose = null;
  if (cb) cb();
  if (modalReturnFocus && modalReturnFocus.focus) modalReturnFocus.focus();
}

function modalHead(title, icon = '') {
  return `<div class="modal-head"><h2 id="modalTitle">${icon ? ic(icon) : ''}${title}</h2><button type="button" class="iconbtn" data-close aria-label="${esc(t('close'))}">${ic('x')}</button></div>`;
}

function confirmModal({ title, body, ok, danger = false }) {
  return new Promise(resolve => {
    let answer = false;
    openModal(`${modalHead(esc(title), danger ? 'alert' : 'help')}<p>${body}</p>
      <div class="row" style="justify-content:flex-end;margin-top:14px">
        <button type="button" class="btn ghost" data-close>${t('cancel')}</button>
        <button type="button" class="btn ${danger ? 'coral' : ''}" id="cfOk">${esc(ok || t('ok'))}</button>
      </div>`, { onClose: () => resolve(answer) });
    $('#cfOk').onclick = () => {
      answer = true;
      closeModal();
    };
  });
}

function printHTML(html) {
  $('#printArea').innerHTML = html;
  document.body.classList.add('printing');
  const done = () => {
    document.body.classList.remove('printing');
    window.removeEventListener('afterprint', done);
  };
  window.addEventListener('afterprint', done);
  setTimeout(() => window.print(), 80);
}

// =====================================================================
// Language core — shared vocabulary for highlighter, parser and runners
// =====================================================================
const KEYWORDS = {
  js: new Set(['let', 'const', 'var', 'function', 'return', 'if', 'else', 'for', 'while', 'do', 'break', 'continue', 'of', 'in', 'new', 'true', 'false', 'null', 'undefined', 'typeof', 'switch', 'case', 'default', 'class', 'try', 'catch', 'finally', 'throw', 'this']),
  py: new Set(['def', 'return', 'if', 'elif', 'else', 'for', 'while', 'in', 'not', 'and', 'or', 'True', 'False', 'None', 'break', 'continue', 'pass', 'import', 'from', 'as', 'global', 'class', 'try', 'except', 'finally', 'raise', 'lambda', 'is', 'with', 'del', 'nonlocal', 'yield', 'assert']),
};

// Every turtle spelling we accept, mapped to one short command code.
const TURTLE_ALIASES = {
  forward: 'fd', fd: 'fd', back: 'bk', backward: 'bk', bk: 'bk',
  left: 'lt', lt: 'lt', right: 'rt', rt: 'rt',
  penup: 'pu', pu: 'pu', up: 'pu', penUp: 'pu',
  pendown: 'pd', pd: 'pd', down: 'pd', penDown: 'pd',
  color: 'color', pencolor: 'color', penColor: 'color', fillcolor: 'fill', fillColor: 'fill',
  pensize: 'size', width: 'size', penSize: 'size',
  goto: 'goto', goTo: 'goto', setpos: 'goto', setposition: 'goto',
  setheading: 'seth', seth: 'seth', setHeading: 'seth',
  circle: 'circle', dot: 'dot', home: 'home', write: 'write',
  begin_fill: 'bfill', beginFill: 'bfill', end_fill: 'efill', endFill: 'efill',
  bgcolor: 'bg', bgColor: 'bg', hideturtle: 'hide', ht: 'hide', hideTurtle: 'hide',
  showturtle: 'show', st: 'show', showTurtle: 'show', clear: 'clear', reset: 'reset',
  speed: 'noop', done: 'noop', mainloop: 'noop', exitonclick: 'noop', shape: 'noop',
};
// Short or generic names stay out of the JavaScript global scope so kids can use them as variables.
const TURTLE_JS_SKIP = new Set(['up', 'down', 'width', 'clear', 'reset', 'done', 'shape', 'mainloop', 'exitonclick', 'pu', 'pd', 'ht', 'st', 'seth', 'setpos', 'setposition', 'fd', 'bk', 'lt', 'rt']);
const TURTLE_JS_NAMES = Object.keys(TURTLE_ALIASES).filter(n => !TURTLE_JS_SKIP.has(n) && !n.includes('_'));

const BUILTIN_NAMES = {
  js: new Set(['console', 'Math', 'Number', 'String', 'parseInt', 'parseFloat', 'ask', 'prompt', 'alert', 'turtle', ...TURTLE_JS_NAMES]),
  py: new Set(['print', 'input', 'int', 'float', 'str', 'len', 'range', 'abs', 'min', 'max', 'sum', 'round', 'list', 'sorted', 'bool', 'type', 'enumerate', 'random', 'math', 'turtle', 'time']),
};

const MULTI_OPS = ['===', '!==', '**=', '//=', '==', '!=', '<=', '>=', '&&', '||', '++', '--', '+=', '-=', '*=', '/=', '%=', '**', '//', '=>', '->'];
const SINGLE_OPS = '+-*/%=<>!()[]{},.:;?&|^~@';
const ID_START = /[\p{L}_$]/u;
const ID_PART = /[\p{L}\p{N}_$]/u;

// =====================================================================
// Lexer — tolerant scanner; never throws, flags bad strings instead
// =====================================================================
function scanCode(src, lang) {
  const py = lang === 'py';
  const toks = [];
  let i = 0;
  let line = 1;
  let col = 1;
  const advance = n => {
    for (let k = 0; k < n && i < src.length; k++) {
      if (src[i] === '\n') {
        line++;
        col = 1;
      } else {
        col++;
      }
      i++;
    }
  };
  while (i < src.length) {
    const start = i;
    const startLine = line;
    const startCol = col;
    const tok = (t, extra = {}) => toks.push({ t, v: src.slice(start, i), start, end: i, line: startLine, col: startCol, ...extra });
    const c = src[i];
    if (c === '\n') {
      advance(1);
      tok('nl');
    } else if (c === ' ' || c === '\t' || c === '\r') {
      while (i < src.length && /[ \t\r]/.test(src[i])) advance(1);
      tok('ws');
    } else if ((py && c === '#') || (!py && c === '/' && src[i + 1] === '/')) {
      while (i < src.length && src[i] !== '\n') advance(1);
      tok('comment');
    } else if (!py && c === '/' && src[i + 1] === '*') {
      const close = src.indexOf('*/', i + 2);
      advance(close < 0 ? src.length - i : close + 2 - i);
      tok('comment');
    } else if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(src[i + 1] || ''))) {
      scanNumber(src, i, advance);
      tok('num');
    } else if (stringStart(src, i, py)) {
      const info = scanString(src, i, py, advance);
      tok(info.kind, { bad: info.bad, prefix: info.prefix, quote: info.quote, triple: info.triple });
    } else if (ID_START.test(c)) {
      while (i < src.length && ID_PART.test(src[i])) advance(1);
      const word = src.slice(start, i);
      tok(KEYWORDS[lang].has(word) ? 'kw' : 'name');
    } else {
      const op = MULTI_OPS.find(o => src.startsWith(o, i) && (py || o !== '//') && (py || o !== '//='));
      advance(op ? op.length : 1);
      tok(op || SINGLE_OPS.includes(c) ? 'op' : 'bad');
    }
  }
  return toks;
}

function scanNumber(src, i0, advance) {
  let i = i0;
  const step = () => {
    advance(1);
    i++;
  };
  while (/[0-9_]/.test(src[i] || '')) step();
  if (src[i] === '.' && /[0-9]/.test(src[i + 1] || '')) {
    step();
    while (/[0-9_]/.test(src[i] || '')) step();
  } else if (src[i] === '.' && !/[A-Za-z_.]/.test(src[i + 1] || '')) {
    step();
  }
  if (/[eE]/.test(src[i] || '') && /[0-9+-]/.test(src[i + 1] || '')) {
    step();
    step();
    while (/[0-9]/.test(src[i] || '')) step();
  }
}

// Python allows f/r/b prefixes; JavaScript adds `template literals`.
function stringStart(src, i, py) {
  const c = src[i];
  if (c === '"' || c === "'") return true;
  if (!py) return c === '`';
  const m = /^(?:[fFrRbB]|[fF][rR]|[rR][fF]|[bB][rR]|[rR][bB])["']/.exec(src.slice(i, i + 3));
  return !!m;
}

function scanString(src, i0, py, advance) {
  let i = i0;
  let prefix = '';
  while (/[fFrRbB]/.test(src[i])) {
    prefix += src[i].toLowerCase();
    advance(1);
    i++;
  }
  const quote = src[i];
  const triple = py && src.startsWith(quote.repeat(3), i);
  const kind = quote === '`' ? 'tpl' : prefix.includes('f') ? 'fstr' : 'str';
  const open = triple ? 3 : 1;
  advance(open);
  i += open;
  const multiline = triple || quote === '`';
  while (i < src.length) {
    if (src[i] === '\\' && !prefix.includes('r')) {
      advance(2);
      i += 2;
      continue;
    }
    if (src[i] === '\n' && !multiline) return { kind, bad: true, prefix, quote, triple };
    if (triple ? src.startsWith(quote.repeat(3), i) : src[i] === quote) {
      advance(open);
      return { kind, bad: false, prefix, quote, triple };
    }
    advance(1);
    i++;
  }
  return { kind, bad: true, prefix, quote, triple };
}

// Decode escapes and strip quotes from a string token.
function stringValue(tok) {
  const p = (tok.prefix || '').length;
  const q = tok.triple ? 3 : 1;
  const body = tok.v.slice(p + q, tok.bad ? undefined : tok.v.length - q);
  return decodeEscapes(body, (tok.prefix || '').includes('r'));
}

function decodeEscapes(body, raw = false) {
  if (raw) return body;
  const map = { n: '\n', t: '\t', r: '\r', '\\': '\\', "'": "'", '"': '"', '`': '`', '0': '\0' };
  return body.replace(/\\(u\{[0-9a-fA-F]+\}|u[0-9a-fA-F]{4}|x[0-9a-fA-F]{2}|\n|.)/g, (m, e) => {
    if (e === '\n') return '';
    if (e.length > 1) return String.fromCodePoint(parseInt(e.replace(/[ux{}]/g, ''), 16));
    return map[e] ?? m;
  });
}

// =====================================================================
// Parser — beginner subset of JavaScript and Python into one AST
// =====================================================================
class MiniError extends Error {
  constructor(type, message, line, extra = {}) {
    super(message);
    this.type = type;
    this.line = line || 0;
    Object.assign(this, extra);
  }
}

const langName = lang => (lang === 'py' ? 'Python' : 'JavaScript');
const unsupported = (what, line, lang) => new MiniError('Unsupported', `${what} is not part of Buddy's mini-${langName(lang)} yet`, line);
const ASSIGN_OPS = new Set(['=', '+=', '-=', '*=', '/=', '%=', '**=', '//=']);
const COMPARE_OPS = new Set(['==', '!=', '===', '!==', '<', '>', '<=', '>=']);
const PY_UNSUPPORTED = new Set(['class', 'try', 'except', 'finally', 'with', 'lambda', 'raise', 'del', 'assert', 'yield', 'nonlocal']);
const JS_UNSUPPORTED = new Set(['class', 'switch', 'case', 'try', 'catch', 'finally', 'throw', 'new', 'this']);
const CLOSERS = { '(': ')', '[': ']', '{': '}' };

// Python: turn raw tokens into logical lines with indent/dedent markers.
function pyTokens(src) {
  const raw = scanCode(src, 'py');
  const out = [];
  const indents = [0];
  const brackets = [];
  let lineStart = true;
  let width = 0;
  for (const tk of raw) {
    if (tk.t === 'comment') continue;
    if (tk.t === 'ws') {
      if (lineStart) width = indentWidth(tk.v);
      continue;
    }
    if (tk.t === 'nl') {
      if (brackets.length) continue;
      if (!lineStart) out.push({ t: 'nl', v: '\n', line: tk.line, col: tk.col });
      lineStart = true;
      width = 0;
      continue;
    }
    if (tk.bad) throw pyBadToken(tk);
    if (lineStart && !brackets.length) {
      pushIndent(out, indents, width, tk);
      lineStart = false;
    }
    trackBracket(brackets, tk);
    out.push(tk);
  }
  if (brackets.length) throw new MiniError('SyntaxError', `'${brackets[brackets.length - 1].v}' was never closed`, brackets[brackets.length - 1].line);
  const last = out.length ? out[out.length - 1].line : 1;
  if (!lineStart) out.push({ t: 'nl', v: '\n', line: last });
  while (indents.length > 1) {
    indents.pop();
    out.push({ t: 'dedent', v: '', line: last });
  }
  out.push({ t: 'eof', v: '', line: last });
  return out;
}

function indentWidth(ws) {
  let w = 0;
  for (const ch of ws) w = ch === '\t' ? w + 8 - (w % 8) : w + 1;
  return w;
}

function pushIndent(out, indents, width, tk) {
  const top = indents[indents.length - 1];
  if (width > top) {
    indents.push(width);
    out.push({ t: 'indent', v: '', line: tk.line });
    return;
  }
  while (width < indents[indents.length - 1]) {
    indents.pop();
    out.push({ t: 'dedent', v: '', line: tk.line });
  }
  if (width !== indents[indents.length - 1]) {
    throw new MiniError('IndentationError', 'unindent does not match any outer indentation level', tk.line);
  }
}

function trackBracket(stack, tk) {
  if (tk.t !== 'op') return;
  if (CLOSERS[tk.v]) {
    stack.push(tk);
    return;
  }
  if (!')]}'.includes(tk.v)) return;
  const open = stack.pop();
  if (!open) throw new MiniError('SyntaxError', `unmatched '${tk.v}'`, tk.line);
  if (CLOSERS[open.v] !== tk.v) {
    throw new MiniError('SyntaxError', `closing parenthesis '${tk.v}' does not match opening parenthesis '${open.v}'`, tk.line);
  }
}

function pyBadToken(tk) {
  if (tk.t === 'bad') return new MiniError('SyntaxError', `invalid character '${tk.v}'`, tk.line);
  if (tk.triple) return new MiniError('SyntaxError', 'unterminated triple-quoted string literal', tk.line);
  return new MiniError('SyntaxError', `unterminated string literal (detected at line ${tk.line})`, tk.line);
}

// JavaScript: drop whitespace but remember which tokens start a new line.
function jsTokens(src) {
  const out = [];
  let nl = false;
  for (const tk of scanCode(src, 'js')) {
    if (tk.t === 'nl') nl = true;
    if (tk.t === 'ws' || tk.t === 'comment') {
      if (tk.v.includes('\n')) nl = true;
      continue;
    }
    if (tk.t === 'nl') continue;
    if (tk.bad || tk.t === 'bad') throw new MiniError('SyntaxError', 'Invalid or unexpected token', tk.line);
    out.push({ ...tk, nlBefore: nl });
    nl = false;
  }
  const last = out.length ? out[out.length - 1].line : 1;
  out.push({ t: 'eof', v: '', line: last, nlBefore: true });
  return out;
}

class Parser {
  constructor(src, lang, lineOffset = 0) {
    this.lang = lang;
    this.py = lang === 'py';
    this.toks = this.py ? pyTokens(src) : jsTokens(src);
    if (lineOffset) this.toks.forEach(t => (t.line += lineOffset));
    this.i = 0;
  }

  get cur() {
    return this.toks[this.i];
  }

  peek(n = 1) {
    return this.toks[Math.min(this.i + n, this.toks.length - 1)];
  }

  prev() {
    return this.toks[Math.max(0, this.i - 1)];
  }

  next() {
    const t = this.toks[this.i];
    if (this.i < this.toks.length - 1) this.i++;
    return t;
  }

  is(v) {
    const c = this.cur;
    return c.v === v && (c.t === 'op' || c.t === 'kw');
  }

  isKw(v) {
    return this.cur.t === 'kw' && this.cur.v === v;
  }

  eat(v) {
    if (!this.is(v)) return false;
    this.next();
    return true;
  }

  expect(v, msg) {
    if (this.is(v)) return this.next();
    throw this.err(msg || this.unexpectedMsg());
  }

  err(msg, tok = this.cur, type = 'SyntaxError') {
    return new MiniError(type, msg, tok.line);
  }

  unexpectedMsg(tok = this.cur) {
    if (this.py) return tok.t === 'indent' ? 'unexpected indent' : 'invalid syntax';
    if (tok.t === 'eof') return 'Unexpected end of input';
    if (tok.t === 'str' || tok.t === 'tpl') return 'Unexpected string';
    if (tok.t === 'num') return 'Unexpected number';
    if (tok.t === 'name') return `Unexpected identifier '${tok.v}'`;
    return `Unexpected token '${tok.v}'`;
  }

  nameTok() {
    if (this.cur.t !== 'name') throw this.err(this.unexpectedMsg());
    return this.next();
  }

  program() {
    const body = [];
    while (this.cur.t !== 'eof') {
      if (this.py && this.cur.t === 'nl') {
        this.next();
        continue;
      }
      body.push(...this.statements());
    }
    return { k: 'prog', body, lang: this.lang };
  }

  statements() {
    const s = this.py ? this.pyStatement() : this.jsStatement();
    return s == null ? [] : [].concat(s);
  }

  // Assignment or expression statement (shared by both languages).
  simple() {
    const line = this.cur.line;
    const target = this.expr();
    if (this.cur.t === 'op' && ASSIGN_OPS.has(this.cur.v)) {
      const opTok = this.next();
      this.checkTarget(target, opTok);
      const value = this.expr();
      if (this.py && this.is(',')) throw unsupported('Tuple assignment (a, b = ...)', line, 'py');
      return { k: 'assign', target, op: opTok.v, value, decl: null, line };
    }
    if (this.py && this.is(',')) throw unsupported('Tuple values (a, b)', line, 'py');
    return { k: 'expr', e: target, line };
  }

  checkTarget(target, opTok) {
    if (['name', 'index', 'member'].includes(target.k)) return;
    if (this.py) throw this.err("cannot assign to expression here. Maybe you meant '==' instead of '='?", opTok);
    throw this.err('Invalid left-hand side in assignment', opTok);
  }
}

// ---------- parser: Python statements ----------
Object.assign(Parser.prototype, {
  pyStatement() {
    const t = this.cur;
    if (t.t === 'indent') throw new MiniError('IndentationError', 'unexpected indent', t.line);
    if (t.t === 'kw') {
      if (PY_UNSUPPORTED.has(t.v)) throw unsupported(`'${t.v}'`, t.line, 'py');
      const handler = {
        def: 'pyDef', if: 'pyIf', while: 'pyWhile', for: 'pyFor', import: 'pyImport', from: 'pyImport',
        return: 'pyReturn', global: 'pyGlobal', break: 'pyJump', continue: 'pyJump', pass: 'pyJump',
      }[t.v];
      if (handler) return this[handler]();
      if (t.v === 'elif' || t.v === 'else') throw this.err('invalid syntax');
    }
    const s = this.simple();
    this.pyEndLine();
    return s;
  },

  atLineEnd() {
    return this.cur.t === 'nl' || this.cur.t === 'eof' || this.cur.t === 'dedent' || this.is(';');
  },

  pyEndLine() {
    if (this.eat(';')) return;
    if (this.cur.t === 'nl') {
      this.next();
      return;
    }
    if (this.cur.t === 'eof' || this.cur.t === 'dedent') return;
    const prev = this.prev();
    if (prev.v === 'print' && this.toks[this.i - 2]?.t !== 'op') throw this.err("Missing parentheses in call to 'print'. Did you mean print(...)?");
    if (prev.t === 'name' && this.cur.t === 'str') throw this.err('invalid syntax. Perhaps you forgot a comma?');
    throw this.err('invalid syntax');
  },

  // `:` then either an indented block or one simple statement on the same line.
  pySuite(head) {
    if (this.is('=')) throw this.err("invalid syntax. Maybe you meant '==' or ':=' instead of '='?");
    this.expect(':', "expected ':'");
    if (this.cur.t !== 'nl') {
      const body = [];
      const line = this.cur.line;
      while (this.cur.line === line && !['nl', 'eof', 'dedent'].includes(this.cur.t)) body.push(...this.statements());
      return body;
    }
    this.next();
    if (this.cur.t !== 'indent') {
      const what = head.v === 'def' ? 'function definition' : `'${head.v}' statement`;
      throw new MiniError('IndentationError', `expected an indented block after ${what} on line ${head.line}`, this.cur.line);
    }
    this.next();
    const body = [];
    while (this.cur.t !== 'dedent' && this.cur.t !== 'eof') {
      if (this.cur.t === 'nl') {
        this.next();
        continue;
      }
      body.push(...this.statements());
    }
    this.next();
    return body;
  },

  pyDef() {
    const head = this.next();
    const name = this.nameTok().v;
    const open = this.expect('(', "expected '('");
    const params = [];
    while (!this.is(')')) {
      const p = this.nameTok().v;
      const def = this.eat('=') ? this.expr() : null;
      params.push({ name: p, def });
      if (!this.eat(',')) break;
    }
    if (!this.is(')')) throw this.err(`'${open.v}' was never closed`, open);
    this.next();
    const body = this.pySuite(head);
    return { k: 'func', name, params, body, line: head.line };
  },

  pyIf() {
    const head = this.next();
    const test = this.expr();
    const body = this.pySuite(head);
    let orelse = [];
    if (this.isKw('elif')) {
      orelse = [this.pyIf()];
    } else if (this.isKw('else')) {
      const elseTok = this.next();
      orelse = this.pySuite(elseTok);
    }
    return { k: 'if', test, body, orelse, line: head.line };
  },

  pyWhile() {
    const head = this.next();
    const test = this.expr();
    const body = this.pySuite(head);
    return { k: 'while', test, body, line: head.line };
  },

  pyFor() {
    const head = this.next();
    const targets = [this.nameTok().v];
    while (this.eat(',')) targets.push(this.nameTok().v);
    if (!this.isKw('in')) throw this.err('invalid syntax');
    this.next();
    const iter = this.expr();
    const body = this.pySuite(head);
    return { k: 'foreach', targets, iter, body, line: head.line };
  },

  pyReturn() {
    const head = this.next();
    const value = this.atLineEnd() ? null : this.expr();
    this.pyEndLine();
    return { k: 'return', value, line: head.line };
  },

  pyJump() {
    const head = this.next();
    this.pyEndLine();
    return { k: head.v, line: head.line };
  },

  pyGlobal() {
    const head = this.next();
    const names = [this.nameTok().v];
    while (this.eat(',')) names.push(this.nameTok().v);
    this.pyEndLine();
    return { k: 'global', names, line: head.line };
  },

  // import a [as b] | from a import x [as y], ... | from a import *
  pyImport() {
    const head = this.next();
    const mod = this.nameTok().v;
    const node = { k: 'import', mod, alias: mod, names: null, line: head.line };
    if (head.v === 'import') {
      if (this.isKw('as')) {
        this.next();
        node.alias = this.nameTok().v;
      }
    } else {
      if (!this.isKw('import')) throw this.err('invalid syntax');
      this.next();
      node.names = this.eat('*') ? '*' : this.pyImportNames();
    }
    this.pyEndLine();
    return node;
  },

  pyImportNames() {
    const names = [];
    do {
      const n = this.nameTok().v;
      let alias = n;
      if (this.isKw('as')) {
        this.next();
        alias = this.nameTok().v;
      }
      names.push([n, alias]);
    } while (this.eat(','));
    return names;
  },
});

// ---------- parser: JavaScript statements ----------
Object.assign(Parser.prototype, {
  jsStatement() {
    const t = this.cur;
    if (t.t === 'op' && t.v === '{') {
      this.next();
      return { k: 'block', body: this.jsBlockBody(), line: t.line };
    }
    if (t.t === 'op' && t.v === ';') {
      this.next();
      return null;
    }
    if (t.t === 'kw') {
      if (JS_UNSUPPORTED.has(t.v)) throw unsupported(`'${t.v}'`, t.line, 'js');
      const handler = {
        let: 'jsDeclStmt', const: 'jsDeclStmt', var: 'jsDeclStmt', function: 'jsFunction', if: 'jsIf',
        while: 'jsWhile', do: 'jsDoWhile', for: 'jsFor', return: 'jsReturn', break: 'jsJump', continue: 'jsJump',
      }[t.v];
      if (handler) return this[handler]();
      if (t.v === 'else') throw this.err("Unexpected token 'else'");
    }
    const s = this.simple();
    this.jsEnd();
    return s;
  },

  jsEnd() {
    if (this.eat(';')) return;
    const c = this.cur;
    if (c.t === 'eof' || this.is('}') || c.nlBefore) return;
    throw this.err(this.unexpectedMsg());
  },

  jsBlockBody() {
    const body = [];
    while (!this.is('}')) {
      if (this.cur.t === 'eof') throw this.err('Unexpected end of input');
      body.push(...this.statements());
    }
    this.next();
    return body;
  },

  jsBody() {
    if (this.is('{')) {
      this.next();
      return this.jsBlockBody();
    }
    return this.statements();
  },

  jsDeclStmt() {
    const decls = this.jsDecl();
    this.jsEnd();
    return decls;
  },

  jsDecl() {
    const kind = this.next().v;
    const decls = [];
    do {
      const nameTok = this.nameTok();
      const line = nameTok.line;
      let value = { k: 'undef', line };
      if (this.eat('=')) value = this.expr();
      else if (kind === 'const') throw this.err('Missing initializer in const declaration');
      decls.push({ k: 'assign', target: { k: 'name', id: nameTok.v, line }, op: '=', value, decl: kind, line });
    } while (this.eat(','));
    return decls;
  },

  jsFunction() {
    const head = this.next();
    if (this.cur.t !== 'name') throw unsupported('A function without a name', head.line, 'js');
    const name = this.next().v;
    this.expect('(');
    const params = [];
    while (!this.is(')')) {
      const p = this.nameTok().v;
      const def = this.eat('=') ? this.expr() : null;
      params.push({ name: p, def });
      if (!this.eat(',')) break;
    }
    this.expect(')');
    this.expect('{');
    return { k: 'func', name, params, body: this.jsBlockBody(), line: head.line };
  },

  jsCond() {
    this.expect('(');
    const test = this.expr();
    if (this.is('=')) throw unsupported("Assignment inside a condition (use '===' to compare)", this.cur.line, 'js');
    this.expect(')');
    return test;
  },

  jsIf() {
    const head = this.next();
    const test = this.jsCond();
    const body = this.jsBody();
    let orelse = [];
    if (this.isKw('else')) {
      this.next();
      orelse = this.jsBody();
    }
    return { k: 'if', test, body, orelse, line: head.line };
  },

  jsWhile() {
    const head = this.next();
    const test = this.jsCond();
    return { k: 'while', test, body: this.jsBody(), line: head.line };
  },

  jsDoWhile() {
    const head = this.next();
    const body = this.jsBody();
    if (!this.isKw('while')) throw this.err(this.unexpectedMsg());
    this.next();
    const test = this.jsCond();
    this.jsEnd();
    return { k: 'while', test, body, line: head.line, doFirst: true };
  },

  jsFor() {
    const head = this.next();
    this.expect('(');
    const declared = ['let', 'const', 'var'].includes(this.cur.v) && this.cur.t === 'kw';
    const nameAt = declared ? 1 : 0;
    if (this.peek(nameAt).t === 'name' && this.peek(nameAt + 1).v === 'of') return this.jsForOf(head, declared);
    if (this.peek(nameAt).t === 'name' && this.peek(nameAt + 1).v === 'in') throw unsupported("'for...in' loops", head.line, 'js');
    let init = [];
    if (!this.is(';')) init = [].concat(declared ? this.jsDecl() : this.simple());
    this.expect(';');
    const test = this.is(';') ? null : this.expr();
    this.expect(';');
    const update = this.is(')') ? null : this.simple();
    this.expect(')');
    const body = this.jsBody();
    return { k: 'for', init, test, update, body, line: head.line };
  },

  jsForOf(head, declared) {
    const decl = declared ? this.next().v : null;
    const name = this.nameTok().v;
    this.next();
    const iter = this.expr();
    this.expect(')');
    const body = this.jsBody();
    return { k: 'foreach', targets: [name], decl, iter, body, line: head.line };
  },

  jsReturn() {
    const head = this.next();
    const bare = this.is(';') || this.is('}') || this.cur.t === 'eof' || this.cur.nlBefore;
    const value = bare ? null : this.expr();
    this.jsEnd();
    return { k: 'return', value, line: head.line };
  },

  jsJump() {
    const head = this.next();
    this.jsEnd();
    return { k: head.v, line: head.line };
  },
});

// ---------- parser: expressions (precedence climbing) ----------
Object.assign(Parser.prototype, {
  expr() {
    if (!this.py) return this.jsTernary();
    const a = this.orExpr();
    if (!this.isKw('if') || this.cur.nlBefore) return a;
    this.next();
    const test = this.orExpr();
    if (!this.isKw('else')) throw this.err("expected 'else' after 'if' expression");
    this.next();
    return { k: 'cond', test, a, b: this.expr(), line: a.line };
  },

  jsTernary() {
    const test = this.orExpr();
    if (!this.is('?')) return test;
    this.next();
    const a = this.expr();
    this.expect(':');
    return { k: 'cond', test, a, b: this.expr(), line: test.line };
  },

  orExpr() {
    let l = this.andExpr();
    while (this.is('||') || this.isKw('or')) {
      this.next();
      l = { k: 'logic', op: 'or', l, r: this.andExpr(), line: l.line };
    }
    return l;
  },

  andExpr() {
    let l = this.notExpr();
    while (this.is('&&') || this.isKw('and')) {
      this.next();
      l = { k: 'logic', op: 'and', l, r: this.notExpr(), line: l.line };
    }
    return l;
  },
