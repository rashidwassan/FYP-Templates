    build: () => graphFrom(
      [[150, 60], [150, 170], [150, 280], [150, 390], [480, 60], [480, 170], [480, 280], [480, 390]],
      [[0, 4, 2], [0, 5, 7], [1, 5, 3], [1, 6, 8], [2, 4, 5], [2, 7, 1], [3, 6, 4], [3, 7, 6], [0, 7, 9]])
  }
};

function presetGraph(kind) {
  const preset = GRAPH_PRESETS[kind] || GRAPH_PRESETS.weighted;
  return preset.build();
}

let GR = store.get('graph', null) || presetGraph('weighted');
const GV = { ox: 0, oy: 0, scale: 1, panned: false, selN: -1, selE: -1, rubber: null };
const saveGraph = () => store.set('graph', GR);

function adjOf(u) {
  const out = [];
  GR.edges.forEach((E, e) => {
    if (E.u === u) out.push({ v: E.v, w: E.w, e });
    else if (!GR.directed && E.v === u) out.push({ v: E.u, w: E.w, e });
  });
  return out;
}

function adjAll(u) {
  const out = [];
  GR.edges.forEach((E, e) => {
    if (E.u === u) out.push({ v: E.v, w: E.w, e });
    else if (E.v === u) out.push({ v: E.u, w: E.w, e });
  });
  return out;
}

const ES = { ACTIVE: 1, TREE: 2, REJECT: 3 };
const ge = (e, s, line, note) => ({ type: 'edge', e, s, line, note });

// ---------- algorithms ----------
function* grBfs(src) {
  const N = GR.nodes.length;
  if (!N) return;
  const seen = new Set([src]);
  const queue = [src];
  const tree = new Set();
  yield { type: 'frontier', n: src, line: 0, note: `Start at ${L(src)}` };
  while (queue.length) {
    const u = queue.shift();
    yield { type: 'visit', n: u, line: 2, note: `Visit ${L(u)}` };
    yield { type: 'order', n: u, line: 2, note: `Output ${L(u)}` };
    for (const { v, e } of adjOf(u)) {
      yield ge(e, ES.ACTIVE, 3, `Look along ${L(u)}–${L(v)}`);
      if (seen.has(v)) {
        yield ge(e, tree.has(e) ? ES.TREE : ES.REJECT, 4, `${L(v)} already seen`);
        continue;
      }
      seen.add(v);
      queue.push(v);
      tree.add(e);
      yield ge(e, ES.TREE, 4, `${L(v)} discovered via ${L(u)}`);
      yield { type: 'frontier', n: v, line: 4, note: `Enqueue ${L(v)}` };
    }
  }
  yield { type: 'done', line: 4, note: `BFS visited ${seen.size} of ${N} vertices` };
}

function* grDfs(src) {
  const N = GR.nodes.length;
  if (!N) return;
  const seen = new Set();
  const tree = new Set();
  function* dfs(u) {
    seen.add(u);
    yield { type: 'visit', n: u, line: 1, note: `Visit ${L(u)}` };
    yield { type: 'order', n: u, line: 1, note: `Output ${L(u)}` };
    for (const { v, e } of adjOf(u)) {
      yield ge(e, ES.ACTIVE, 2, `Try ${L(u)}–${L(v)}`);
      if (seen.has(v)) {
        yield ge(e, tree.has(e) ? ES.TREE : ES.REJECT, 3, `${L(v)} already visited`);
        continue;
      }
      tree.add(e);
      yield ge(e, ES.TREE, 3, `Recurse into ${L(v)}`);
      yield* dfs(v);
    }
  }
  yield* dfs(src);
  yield { type: 'done', line: 3, note: `DFS reached ${seen.size} of ${N} vertices` };
}

function* grDijkstra(src) {
  const N = GR.nodes.length;
  if (!N) return;
  const dist = Array(N).fill(Infinity);
  const settled = new Set();
  const tree = new Map();
  const pq = new PQ();
  dist[src] = 0;
  pq.push(0, src);
  yield { type: 'dist', n: src, v: 0, line: 0, note: `dist[${L(src)}] = 0` };
  while (pq.size) {
    const [d, u] = pq.pop();
    if (settled.has(u)) continue;
    settled.add(u);
    yield { type: 'visit', n: u, line: 2, note: `Settle ${L(u)} at distance ${d}` };
    for (const { v, w, e } of adjOf(u)) {
      if (settled.has(v)) continue;
      const old = dist[v] === Infinity ? '∞' : dist[v];
      yield ge(e, ES.ACTIVE, 3, `Relax ${L(u)}→${L(v)} (w = ${w}): ${d} + ${w} vs ${old}`);
      if (d + w >= dist[v]) {
        yield ge(e, ES.REJECT, 4, 'No improvement');
        continue;
      }
      const previousEdge = tree.get(v);
      if (previousEdge != null) yield ge(previousEdge, ES.REJECT, 5, `Old route to ${L(v)} dropped`);
      dist[v] = d + w;
      tree.set(v, e);
      pq.push(dist[v], v);
      yield { type: 'dist', n: v, v: dist[v], line: 5, note: `dist[${L(v)}] = ${dist[v]}` };
      yield ge(e, ES.TREE, 5, `parent[${L(v)}] = ${L(u)}`);
      yield { type: 'frontier', n: v, line: 5, note: `Push ${L(v)}` };
    }
  }
  yield { type: 'done', line: 5, note: `Shortest distances from ${L(src)} settled for ${settled.size} vertices` };
}

function* grPrim(src) {
  const N = GR.nodes.length;
  if (!N) return;
  const inTree = new Set([src]);
  const pq = new PQ();
  let total = 0;
  const pushEdges = u => {
    for (const { v, w, e } of adjAll(u)) if (!inTree.has(v)) pq.push(w, e);
  };
  yield { type: 'visit', n: src, line: 0, note: `Grow the tree from ${L(src)}` };
  pushEdges(src);
  for (const { v } of adjAll(src)) yield { type: 'frontier', n: v, line: 0, note: `${L(v)} is reachable` };
  while (pq.size && inTree.size < N) {
    const [w, e] = pq.pop();
    const E = GR.edges[e];
    yield ge(e, ES.ACTIVE, 2, `Cheapest crossing edge ${L(E.u)}–${L(E.v)} (w = ${w})`);
    if (inTree.has(E.u) && inTree.has(E.v)) {
      yield ge(e, ES.REJECT, 3, 'Both ends already in the tree — skip');
      continue;
    }
    const v = inTree.has(E.u) ? E.v : E.u;
    inTree.add(v);
    total += w;
    yield ge(e, ES.TREE, 4, `Add ${L(E.u)}–${L(E.v)} · MST weight ${total}`);
    yield { type: 'visit', n: v, line: 4, note: `${L(v)} joins the tree` };
    pushEdges(v);
    for (const { v: x } of adjAll(v)) {
      if (!inTree.has(x)) yield { type: 'frontier', n: x, line: 5, note: `${L(x)} now reachable` };
    }
  }
  const suffix = inTree.size < N ? ' — graph is disconnected (spanning forest)' : '';
  yield { type: 'done', line: 5, note: `MST weight ${total}${suffix}` };
}

function* grKruskal() {
  const N = GR.nodes.length;
  if (!N) return;
  const parent = Array.from({ length: N }, (_, i) => i);
  const find = x => {
    while (parent[x] !== x) x = parent[x];
    return x;
  };
  const order = GR.edges.map((_, e) => e).sort((a, b) => GR.edges[a].w - GR.edges[b].w);
  yield { type: 'line', line: 0, note: `Edges by weight: ${order.map(e => GR.edges[e].w).join(', ')}` };
  yield { type: 'line', line: 1, note: 'Every vertex is its own set' };
  let total = 0;
  let count = 0;
  for (const e of order) {
    const E = GR.edges[e];
    yield ge(e, ES.ACTIVE, 2, `Edge ${L(E.u)}–${L(E.v)} (w = ${E.w})`);
    const ru = find(E.u);
    const rv = find(E.v);
    if (ru === rv) {
      yield ge(e, ES.REJECT, 5, `find(${L(E.u)}) = find(${L(E.v)}) = ${L(ru)} → cycle, reject`);
      continue;
    }
    parent[ru] = rv;
    total += E.w;
    count++;
    yield { type: 'uf', n: ru, p: rv, line: 4, note: `union: parent[${L(ru)}] = ${L(rv)}` };
    yield ge(e, ES.TREE, 4, `Accept · MST weight ${total}`);
    yield { type: 'visit', n: E.u, line: 4, note: `${L(E.u)} in the forest` };
    yield { type: 'visit', n: E.v, line: 4, note: `${L(E.v)} in the forest` };
  }
  yield { type: 'done', line: 5, note: `MST weight ${total} with ${count} edges` };
}

function* grKahn() {
  const N = GR.nodes.length;
  if (!N) return;
  if (!GR.directed) {
    yield { type: 'line', line: 0, note: 'Topological order needs a directed graph — switch on "Directed" or load the DAG preset' };
    return;
  }
  const indeg = Array(N).fill(0);
  GR.edges.forEach(E => indeg[E.v]++);
  for (let i = 0; i < N; i++) yield { type: 'dist', n: i, v: indeg[i], line: 0, note: `indeg[${L(i)}] = ${indeg[i]}` };
  const queue = [];
  for (let i = 0; i < N; i++) {
    if (indeg[i]) continue;
    queue.push(i);
    yield { type: 'frontier', n: i, line: 1, note: `${L(i)} has no incoming edges` };
  }
  let count = 0;
  while (queue.length) {
    const u = queue.shift();
    count++;
    yield { type: 'visit', n: u, line: 3, note: `Output ${L(u)}` };
    yield { type: 'order', n: u, line: 3, note: `Order so far: ${count} vertices` };
    for (const { v, e } of adjOf(u)) {
      indeg[v]--;
      yield ge(e, ES.TREE, 4, `Remove ${L(u)} → ${L(v)}`);
      yield { type: 'dist', n: v, v: indeg[v], line: 4, note: `indeg[${L(v)}] = ${indeg[v]}` };
      if (indeg[v]) continue;
      queue.push(v);
      yield { type: 'frontier', n: v, line: 5, note: `${L(v)} is now free` };
    }
  }
  const note = count < N ? `Cycle detected — only ${count} of ${N} vertices could be ordered` : 'Topological order complete';
  yield { type: 'done', line: 6, note };
}

function* grComponents() {
  const N = GR.nodes.length;
  if (!N) return;
  const comp = Array(N).fill(0);
  let k = 0;
  for (let s = 0; s < N; s++) {
    if (comp[s]) continue;
    k++;
    comp[s] = k;
    yield { type: 'comp', n: s, k, line: 2, note: `New component ${k} starting at ${L(s)}` };
    const queue = [s];
    while (queue.length) {
      const u = queue.shift();
      yield { type: 'visit', n: u, line: 3, note: `Visit ${L(u)}` };
      for (const { v, e } of adjAll(u)) {
        if (comp[v]) continue;
        comp[v] = k;
        queue.push(v);
        yield ge(e, ES.TREE, 3, `${L(v)} joins component ${k}`);
        yield { type: 'comp', n: v, k, line: 3, note: `label[${L(v)}] = ${k}` };
      }
    }
  }
  yield { type: 'done', line: 3, note: `${k} component${k === 1 ? '' : 's'}` };
}

const GR_ALGOS = {
  bfs: { name: 'Breadth-first search', run: grBfs, table: 'order', cx: ['O(V + E)', 'queue'], code: ['queue = [s]; visited = {s}', 'while queue not empty:', '  u = queue.shift(); output u', '  for each neighbour v of u:', '    if v not visited: visited.add(v); queue.push(v)'] },
  dfs: { name: 'Depth-first search', run: grDfs, table: 'order', cx: ['O(V + E)', 'recursion'], code: ['dfs(u):', '  mark u visited; output u', '  for each neighbour v of u:', '    if v not visited: dfs(v)'] },
  dijkstra: { name: 'Dijkstra', run: grDijkstra, table: 'dist', cx: ['O((V + E) log V)', 'no negative weights'], code: ['dist[s] = 0; all others ∞; pq = {(0, s)}', 'while pq not empty:', '  u = pq.popMin(); skip if settled', '  for each edge (u, v, w):', '    if dist[u] + w < dist[v]:', '      dist[v] = dist[u] + w; parent[v] = u; pq.push(v)'] },
  prim: { name: "Prim's MST", run: grPrim, table: 'mst', cx: ['O(E log V)', 'undirected'], code: ['inTree = {s}; pq = edges leaving s', 'while pq not empty and tree incomplete:', '  (w, u, v) = pq.popMin()', '  if v already in tree: skip   // would form a cycle', '  add edge (u, v) to the MST; inTree.add(v)', '  push every edge leaving v'] },
  kruskal: { name: "Kruskal's MST", run: grKruskal, table: 'uf', cx: ['O(E log E)', 'union-find'], code: ['sort edges by weight ascending', 'parent[v] = v for every vertex   // union-find', 'for each edge (u, v, w) in order:', '  if find(u) ≠ find(v):', '    union(u, v); add the edge to the MST', '  else: reject   // u and v already connected'] },
  kahn: { name: 'Topological sort (Kahn)', run: grKahn, table: 'indeg', cx: ['O(V + E)', 'DAG only'], code: ['indeg[v] = number of incoming edges', 'queue = every v with indeg 0', 'while queue not empty:', '  u = queue.shift(); output u', '  for each edge u → v: indeg[v] -= 1', '    if indeg[v] == 0: queue.push(v)', 'if fewer than |V| vertices were output: the graph has a cycle'] },
  comp: { name: 'Connected components', run: grComponents, table: 'comp', cx: ['O(V + E)', 'undirected'], code: ['k = 0', 'for each vertex v:', '  if v has no label: k += 1', '    BFS from v, labelling every reached vertex with k'] }
};
// TODO(student): Bellman-Ford (negative weights), Floyd–Warshall matrix, Tarjan SCC, max-flow — same generator contract.

// ---------- model ----------
function grModel() {
  const N = GR.nodes.length;
  return {
    ns: new Uint8Array(N), es: new Uint8Array(GR.edges.length), dist: Array(N).fill(null),
    par: Array.from({ length: N }, (_, i) => i), order: [], comp: Array(N).fill(0), done: null
  };
}

function grApply(m, s) {
  switch (s.type) {
    case 'visit':
      s.prev = m.ns[s.n];
      m.ns[s.n] = 2;
      break;
    case 'frontier':
      s.prev = m.ns[s.n];
      if (!s.prev) m.ns[s.n] = 1;
      break;
    case 'edge':
      s.prev = m.es[s.e];
      m.es[s.e] = s.s;
      break;
    case 'dist':
      s.prev = m.dist[s.n];
      m.dist[s.n] = s.v;
      break;
    case 'uf':
      s.prev = m.par[s.n];
      m.par[s.n] = s.p;
      break;
    case 'order':
      m.order.push(s.n);
      break;
    case 'comp':
      s.prev = m.comp[s.n];
      m.comp[s.n] = s.k;
      break;
    case 'done':
      s.prev = m.done;
      m.done = s;
      break;
  }
}

function grUndo(m, s) {
  switch (s.type) {
    case 'visit':
    case 'frontier':
      m.ns[s.n] = s.prev;
      break;
    case 'edge':
      m.es[s.e] = s.prev;
      break;
    case 'dist':
      m.dist[s.n] = s.prev;
      break;
    case 'uf':
      m.par[s.n] = s.prev;
      break;
    case 'order':
      m.order.pop();
      break;
    case 'comp':
      m.comp[s.n] = s.prev;
      break;
    case 'done':
      m.done = s.prev;
      break;
  }
}

// ---------- renderer ----------
const COMP_COLS = [COL.piv, COL.srt, COL.cmp, COL.swp, '#7fb069', '#f0a0c0', '#5ab0cc'];
const compColor = k => COMP_COLS[(k - 1) % COMP_COLS.length];
const NR = 17;

function fitGraph(W, H) {
  if (GV.panned || !GR.nodes.length) return;
  const xs = GR.nodes.map(n => n.x);
  const ys = GR.nodes.map(n => n.y);
  const x0 = Math.min(...xs);
  const x1 = Math.max(...xs);
  const y0 = Math.min(...ys);
  const y1 = Math.max(...ys);
  GV.scale = Math.min(1, (W - 60) / Math.max(1, x1 - x0), (H - 110) / Math.max(1, y1 - y0));
  GV.ox = (W - (x0 + x1) * GV.scale) / 2;
  GV.oy = 44 + (H - 70 - (y0 + y1) * GV.scale) / 2;
}

function edgeColor(state, e) {
  if (state === ES.TREE) return COL.srt;
  if (state === ES.ACTIVE) return COL.cmp;
  if (state === ES.REJECT) return 'rgba(235,111,146,.45)';
  return e === GV.selE ? COL.piv : '#4a4566';
}

function drawEdge(ctx, E, e, state) {
  const a = GR.nodes[E.u];
  const b = GR.nodes[E.v];
  const color = edgeColor(state, e);
  ctx.strokeStyle = color;
  ctx.lineWidth = state === ES.TREE ? 3.5 : state === ES.ACTIVE ? 3 : 2;
  if (state === ES.ACTIVE) {
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
  }
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len;
  const uy = dy / len;
  const trim = GR.directed ? NR + 2 : 0;
  const ex = b.x - ux * trim;
  const ey = b.y - uy * trim;
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(ex, ey);
  ctx.stroke();
  ctx.shadowBlur = 0;
  if (GR.directed) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(ex, ey);
    ctx.lineTo(ex - ux * 10 - uy * 5, ey - uy * 10 + ux * 5);
    ctx.lineTo(ex - ux * 10 + uy * 5, ey - uy * 10 - ux * 5);
    ctx.fill();
  }
  const mx = (a.x + b.x) / 2;
  const my = (a.y + b.y) / 2;
  ctx.fillStyle = e === GV.selE ? COL.piv : COL.panel2;
  if (ctx.roundRect) {
    ctx.beginPath();
    ctx.roundRect(mx - 11, my - 8, 22, 16, 5);
    ctx.fill();
  } else {
    ctx.fillRect(mx - 11, my - 8, 22, 16);
  }
  ctx.fillStyle = e === GV.selE ? '#13111c' : COL.ink;
  ctx.fillText(E.w, mx, my + .5);
}

function drawNode(ctx, n, i, m, cur) {
  const state = m.ns[i];
  const k = m.comp[i];
  let fill = COL.panel2;
  let stroke = '#5a5577';
  let text = COL.ink;
  if (state === 1) stroke = COL.cmp;
  if (state === 2) {
    fill = COL.vis;
    stroke = COL.vis;
  }
  if (k) {
    fill = compColor(k);
    stroke = fill;
    text = '#13111c';
  }
  if (i === S.gr.src) stroke = COL.srt;
  if (i === GV.selN) stroke = COL.piv;
  const isCurrent = cur && cur.n === i && cur.type !== 'order';
  if (isCurrent) {
    ctx.shadowColor = COL.cmp;
    ctx.shadowBlur = 16;
  }
  ctx.fillStyle = fill;
  ctx.strokeStyle = stroke;
  ctx.lineWidth = i === S.gr.src || i === GV.selN ? 3 : 2;
  ctx.beginPath();
  ctx.arc(n.x, n.y, NR, 0, 7);
  ctx.fill();
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = text;
  ctx.fillText(L(i), n.x, n.y + 1);
  if (m.dist[i] != null) {
    ctx.font = '600 10px "Fira Code", monospace';
    ctx.fillStyle = COL.cmp;
    ctx.fillText(m.dist[i] === Infinity ? '∞' : m.dist[i], n.x, n.y - NR - 8);
    ctx.font = '700 13px Manrope, sans-serif';
  }
}

function drawGraph(track) {
  const canvas = $('#grCv');
  if (!canvas) return;
  const { ctx, W, H } = fitCanvas(canvas);
  const m = track ? track.model : grModel();
  const cur = track ? P.cur(track) : null;
  fitGraph(W, H);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(GV.ox, GV.oy);
  ctx.scale(GV.scale, GV.scale);
  ctx.font = '600 11px "Fira Code", monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  GR.edges.forEach((E, e) => drawEdge(ctx, E, e, m.es[e]));
  if (GV.rubber) {
    ctx.strokeStyle = COL.piv;
    ctx.setLineDash([5, 5]);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(GR.nodes[GV.rubber.u].x, GR.nodes[GV.rubber.u].y);
    ctx.lineTo(GV.rubber.x, GV.rubber.y);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.font = '700 13px Manrope, sans-serif';
  GR.nodes.forEach((n, i) => drawNode(ctx, n, i, m, cur));
  ctx.restore();
}

// ---------- live table (varies by algorithm) ----------
function tableHtml(headers, rows) {
  const head = headers.map(h => `<th>${h}</th>`).join('');
  return `<div class="twrap"><table class="t"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function grTable(m, algo) {
  const N = GR.nodes.length;
  if (!N) return '<p class="muted" style="margin:0;font-size:.82rem">Click the canvas to add nodes.</p>';
  const nodes = GR.nodes.map((_, i) => i);
  switch (algo.table) {
    case 'dist':
      return tableHtml(['Node', 'Distance', 'State'], nodes.map(i =>
        `<tr class="${m.ns[i] === 2 ? 'hl' : ''}"><td>${L(i)}</td><td class="n">${m.dist[i] == null ? '∞' : m.dist[i]}</td><td>${['unseen', 'in queue', 'settled'][m.ns[i]]}</td></tr>`).join(''));
    case 'indeg': {
      const rows = nodes.map(i =>
        `<tr class="${m.ns[i] === 2 ? 'hl' : ''}"><td>${L(i)}</td><td class="n">${m.dist[i] == null ? '—' : m.dist[i]}</td><td>${['waiting', 'ready', 'output'][m.ns[i]]}</td></tr>`).join('');
      const order = m.order.length ? `<p class="mono" style="margin:8px 0 0;font-size:.8rem;color:var(--srt)">${m.order.map(L).join(' → ')}</p>` : '';
      return tableHtml(['Node', 'In-degree', 'State'], rows) + order;
    }
    case 'uf':
      return tableHtml(['Node', 'parent[]', 'root'], nodes.map(i => {
        let root = i;
        while (m.par[root] !== root) root = m.par[root];
        return `<tr><td>${L(i)}</td><td class="n">${L(m.par[i])}</td><td class="n" style="color:${COMP_COLS[root % COMP_COLS.length]}">${L(root)}</td></tr>`;
      }).join(''));
    case 'comp':
      return tableHtml(['Node', 'Component'], nodes.map(i =>
        `<tr><td>${L(i)}</td><td class="n" style="color:${m.comp[i] ? compColor(m.comp[i]) : 'inherit'}">${m.comp[i] || '—'}</td></tr>`).join(''));
    case 'mst': {
      const tree = GR.edges.map((E, e) => ({ E, e })).filter(x => m.es[x.e] === ES.TREE);
      const total = tree.reduce((sum, x) => sum + x.E.w, 0);
      const rows = tree.map(({ E }) => `<tr><td>${L(E.u)}–${L(E.v)}</td><td class="n">${E.w}</td></tr>`).join('');
      return tableHtml(['Edge', 'Weight'], rows + `<tr><td><b>Total</b></td><td class="n"><b>${total}</b></td></tr>`);
    }
    default: {
      const order = m.order.length ? m.order.map(L).join(' → ') : '<span class="muted">visiting order appears here</span>';
      return `<p class="mono" style="margin:0;font-size:.84rem;line-height:1.8;color:var(--srt)">${order}</p>`;
    }
  }
}

function adjacencyHtml() {
  if (!GR.nodes.length) return '<span class="muted">empty graph</span>';
  return GR.nodes.map((_, u) => {
    const list = adjOf(u).map(({ v, w }) => `${L(v)}<span class="muted">(${w})</span>`).join(' ');
    return `<b>${L(u)}</b> → ${list || '<span class="muted">∅</span>'}`;
  }).join('\n');
}

// ---------- graph view ----------
function grPane(track) {
  const algo = track.algo;
  const m = track.model;
  const cur = P.cur(track);
  const hasSource = ['bfs', 'dfs', 'dijkstra', 'prim'].includes(S.gr.algo);
  showCode({
    title: algo.name,
    sub: `${GR.nodes.length} nodes · ${GR.edges.length} edges · ${GR.directed ? 'directed' : 'undirected'}${hasSource ? ' · source ' + L(S.gr.src) : ''}`,
    code: algo.code,
    line: cur ? cur.line : -1,
    note: cur ? cur.note : '',
    noteKind: cur ? kindOf(cur.type) : '',
    badges: algo.cx.map(v => ({ v })),
    stats: [
      { k: 'visited', v: nf([...m.ns].filter(x => x === 2).length) },
      { k: 'tree edges', v: nf([...m.es].filter(x => x === ES.TREE).length), cls: 'srt' },
      { k: 'steps', v: `${nf(track.pos)} / ${nf(track.steps.length)}`, cls: 'piv' }
    ]
  });
}

function grRebuild() {
  const algo = GR_ALGOS[S.gr.algo];
  S.gr.src = clamp(S.gr.src, 0, Math.max(0, GR.nodes.length - 1));
  const track = { algo, steps: record(algo.run(S.gr.src)), model: grModel(), apply: grApply, undo: grUndo };
  P.load([track], () => {
    drawGraph(track);
    grPane(track);
    $('#grTable').innerHTML = grTable(track.model, algo);
    $('#grAdj').innerHTML = adjacencyHtml();
    const done = track.model.done;
    $('#grBanner').innerHTML = done ? `<div class="banner win">${ic('check-circle')} ${esc(done.note)}</div>` : '';
  }, () => {
    const done = track.model.done;
    if (done) notify('ok', `${algo.name} finished`, `${done.note} on ${GR.nodes.length} nodes and ${GR.edges.length} edges.`, location.hash);
  });
}

function graphControlsHtml() {
  const selectedEdge = GV.selE >= 0 ? GR.edges[GV.selE] : null;
  const algoOptions = Object.entries(GR_ALGOS)
    .map(([key, algo]) => `<option value="${key}" ${key === S.gr.algo ? 'selected' : ''}>${algo.name}</option>`)
    .join('');
  const sourceOptions = GR.nodes.map((_, i) => `<option value="${i}" ${i === S.gr.src ? 'selected' : ''}>${L(i)}</option>`).join('');
  const presetOptions = Object.entries(GRAPH_PRESETS)
    .map(([key, preset]) => `<option value="${key}" ${key === S.gr.preset ? 'selected' : ''}>${preset.name}</option>`)
    .join('');
  const edgeEditor = selectedEdge
    ? `<label style="color:var(--piv)">Edge ${L(selectedEdge.u)}–${L(selectedEdge.v)} <input type="number" id="gEW" min="1" max="99" value="${selectedEdge.w}" style="width:70px"></label>
       <button class="btn sm danger" id="gDelE">${ic('trash')} Edge</button>`
    : '';
  const nodeEditor = GV.selN >= 0 ? `<button class="btn sm danger" id="gDelN">${ic('trash')} Node ${L(GV.selN)}</button>` : '';
  return `
    <label>Algorithm <select id="gAlgo">${algoOptions}</select></label>
    <label>Source <select id="gSrc" ${GR.nodes.length ? '' : 'disabled'}>${sourceOptions}</select></label>
    <label class="sw"><input type="checkbox" id="gDir" ${GR.directed ? 'checked' : ''}> Directed</label>
    <div class="seg" role="group" aria-label="Drag behaviour">
      <button data-mode="edge" class="${S.gr.mode === 'edge' ? 'on' : ''}">${ic('link')} Drag = edge</button>
      <button data-mode="move" class="${S.gr.mode === 'move' ? 'on' : ''}">${ic('move')} Drag = move</button>
    </div>
    <label>New weight <input type="number" id="gW" min="1" max="99" value="${S.gr.w}" style="width:70px"></label>
    ${edgeEditor}${nodeEditor}
    <span class="spacer"></span>
    <label>Preset <select id="gPreset">${presetOptions}</select></label>
    <button class="btn sm" id="gLoad">${ic('folder')} Load</button>
    <button class="btn sm ghost" id="gClear">${ic('trash')} Clear</button>`;
}

function deleteNode(n) {
  GR.nodes.splice(n, 1);
  GR.edges = GR.edges
    .filter(E => E.u !== n && E.v !== n)
    .map(E => ({ u: E.u > n ? E.u - 1 : E.u, v: E.v > n ? E.v - 1 : E.v, w: E.w }));
  GV.selN = -1;
  S.gr.src = clamp(S.gr.src, 0, Math.max(0, GR.nodes.length - 1));
  saveGraph();
}

function loadPreset(key) {
  GR = presetGraph(key);
  S.gr.preset = key;
  S.gr.src = 0;
  GV.selN = -1;
  GV.selE = -1;
  GV.panned = false;
  saveGraph();
  saveS();
  renderGraphCtrl();
  grRebuild();
  syncHash();
  const preset = GRAPH_PRESETS[key];
  if (preset) toast(preset.hint);
}

function bindGraphControls() {
  $('#gAlgo').onchange = e => {
    S.gr.algo = e.target.value;
    saveS();
    grRebuild();
    syncHash();
  };
  $('#gSrc').onchange = e => {
    S.gr.src = +e.target.value;
    saveS();
    grRebuild();
  };
  $('#gDir').onchange = e => {
    GR.directed = e.target.checked;
    saveGraph();
    grRebuild();
  };
  $$('#grCtrl [data-mode]').forEach(btn => {
    btn.onclick = () => {
      S.gr.mode = btn.dataset.mode;
      saveS();
      renderGraphCtrl();
    };
  });
  $('#gW').onchange = e => {
    S.gr.w = clamp(+e.target.value || 1, 1, 99);
    saveS();
  };
  const weightInput = $('#gEW');
  if (weightInput) {
    weightInput.onchange = e => {
      GR.edges[GV.selE].w = clamp(+e.target.value || 1, 1, 99);
      saveGraph();
      grRebuild();
    };
  }
  const deleteEdge = $('#gDelE');
  if (deleteEdge) {
    deleteEdge.onclick = () => {
      GR.edges.splice(GV.selE, 1);
      GV.selE = -1;
      saveGraph();
      renderGraphCtrl();
      grRebuild();
    };
  }
  const deleteNodeBtn = $('#gDelN');
  if (deleteNodeBtn) {
    deleteNodeBtn.onclick = () => {
      deleteNode(GV.selN);
      renderGraphCtrl();
      grRebuild();
    };
  }
  $('#gLoad').onclick = () => loadPreset($('#gPreset').value);
  $('#gClear').onclick = () => {
    GR = { directed: GR.directed, nodes: [], edges: [] };
    GV.selN = -1;
    GV.selE = -1;
    saveGraph();
    renderGraphCtrl();
    grRebuild();
    toast('Graph cleared — click the canvas to add nodes');
  };
}

function renderGraphCtrl() {
  $('#grCtrl').innerHTML = graphControlsHtml();
  bindGraphControls();
}

function edgeExists(u, v) {
  return GR.edges.some(E => (E.u === u && E.v === v) || (!GR.directed && E.u === v && E.v === u));
}

function bindGraphEditing(canvas) {
  let drag = null;
  const toGraph = e => {
    const box = canvas.getBoundingClientRect();
    return { x: (e.clientX - box.left - GV.ox) / GV.scale, y: (e.clientY - box.top - GV.oy) / GV.scale };
  };
  const nodeAt = p => GR.nodes.findIndex(n => Math.hypot(n.x - p.x, n.y - p.y) <= NR + 4);
  const edgeAt = p => GR.edges.findIndex(E => {
    const a = GR.nodes[E.u];
    const b = GR.nodes[E.v];
    return Math.hypot((a.x + b.x) / 2 - p.x, (a.y + b.y) / 2 - p.y) <= 14;
  });

  canvas.onpointerdown = e => {
    const p = toGraph(e);
    const n = nodeAt(p);
    canvas.setPointerCapture(e.pointerId);
    P.pause();
    if (n >= 0) {
      drag = S.gr.mode === 'move' ? { kind: 'move', n } : { kind: 'edge', u: n };
    } else {
      const edge = edgeAt(p);
      if (edge >= 0) {
        GV.selE = edge;
        GV.selN = -1;
        renderGraphCtrl();
        drawGraph(P.tracks[0]);
        return;
      }
      drag = { kind: 'pan', x0: e.clientX, y0: e.clientY, ox0: GV.ox, oy0: GV.oy };
    }
    drag.moved = false;
    drag.sx = e.clientX;
    drag.sy = e.clientY;
  };

  canvas.onpointermove = e => {
    if (!drag) return;
    if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 4) drag.moved = true;
    const p = toGraph(e);
    if (drag.kind === 'pan') {
      GV.panned = true;
      GV.ox = drag.ox0 + e.clientX - drag.x0;
      GV.oy = drag.oy0 + e.clientY - drag.y0;
    } else if (drag.kind === 'edge') {
      GV.rubber = { u: drag.u, x: p.x, y: p.y };
    } else if (drag.kind === 'move') {
      GR.nodes[drag.n].x = p.x;
      GR.nodes[drag.n].y = p.y;
    }
    drawGraph(P.tracks[0]);
  };

  canvas.onpointerup = canvas.onpointercancel = e => {
    if (!drag) return;
    const p = toGraph(e);
    const d = drag;
    drag = null;
    GV.rubber = null;
    const changed = finishGraphDrag(d, p, nodeAt(p));
    if (changed) {
      renderGraphCtrl();
      grRebuild();
    } else {
      drawGraph(P.tracks[0]);
    }
  };
}

// Returns true when the graph or selection changed and the run must be rebuilt.
function finishGraphDrag(d, p, target) {
  if (d.kind === 'edge') {
    if (!d.moved) {
      selectNode(d.u);
      return true;
    }
    if (target >= 0 && target !== d.u && !edgeExists(d.u, target)) {
      GR.edges.push({ u: d.u, v: target, w: clamp(S.gr.w, 1, 99) });
      saveGraph();
      toast(`Edge ${L(d.u)}–${L(target)} added`);
      if (GR.edges.length >= 20) unlock('architect', 'Architect', 'You built a graph with twenty edges.');
      return true;
    }
    return false;
  }
  if (d.kind === 'move') {
    if (d.moved) saveGraph();
    else selectNode(d.n);
    return true;
  }
  if (d.kind === 'pan' && !d.moved) {
    GR.nodes.push({ x: Math.round(p.x), y: Math.round(p.y) });
    GV.selN = GR.nodes.length - 1;
    GV.selE = -1;
    saveGraph();
    return true;
  }
  return false;
}

function selectNode(n) {
  S.gr.src = n;
  GV.selN = n;
  GV.selE = -1;
  saveS();
}

function renderGraph() {
  P.pause();
  const stage = $('#stage');
  GV.selN = -1;
  GV.selE = -1;
  GV.rubber = null;
  GV.panned = false;
  stage.innerHTML = `
    <div class="ctrl" id="grCtrl"></div>
    <div class="cv">
      <canvas id="grCv" aria-label="Graph canvas — click to add a node, drag between nodes to add an edge, drag empty space to pan"></canvas>
      <div id="grBanner"></div>
      <div class="hint">Click empty space: add node · drag node → node: add edge · drag empty space: pan · click node: set source</div>
    </div>
    <div class="two">
      <div class="panel"><h3>${ic('list')} Adjacency list</h3><div class="adj" id="grAdj"></div></div>
      <div class="panel"><h3>${ic('table')} Live table</h3><div id="grTable"></div></div>
    </div>`;
  animateIn(stage);
  renderGraphCtrl();
  bindGraphEditing($('#grCv'));
  grRebuild();
  syncHash();
  addHistory(runLabel(), location.hash);
  if (S.prefs.autoplay) P.play();
}

/* =====================================================================
   DATA STRUCTURES — operations are generators too; `mini` auto-plays them
   (one-directional: structure mutations happen inside step.act()).
   ===================================================================== */
const mini = {
  gen: null,
  timer: 0,
  playing: false,
  onStep: null,
  onEnd: null,

  run(gen, onStep, onEnd) {
    this.stop();
    this.gen = gen;
    this.onStep = onStep;
    this.onEnd = onEnd;
    this.playing = true;
    updateTransport();
    this.tick();
  },

  delay() {
    return clamp(1000 - S.speed * 90, 80, 1000);
  },

  tick() {
    if (!this.gen) return;
    const { value, done } = this.gen.next();
    if (done) {
      this.gen = null;
      this.playing = false;
      if (this.onEnd) this.onEnd();
      updateTransport();
      return;
    }
    this.onStep(value);
    if (this.playing) this.timer = setTimeout(() => this.tick(), this.delay());
  },

  toggle() {
    if (!this.gen) return;
    this.playing = !this.playing;
    clearTimeout(this.timer);
    if (this.playing) this.tick();
    updateTransport();
  },

  stepOnce() {
    if (!this.gen) return;
    this.playing = false;
    clearTimeout(this.timer);
    this.tick();
    updateTransport();
  },

  stop() {
    clearTimeout(this.timer);
    this.gen = null;
    this.playing = false;
  }
};

const DS_TABS = [['stack', 'layers', 'Stack'], ['queue', 'arrow-right', 'Queue'], ['bst', 'git-branch', 'Binary search tree'], ['bsearch', 'search', 'Binary search'], ['heap', 'trending-up', 'Min-heap']];
const DS_CAP = 8;
let DS = null;
let dsSeed = 11;
const randVal = () => 1 + Math.floor(Math.random() * 99);

function uniqueValues(r, count, lo, hi) {
  const set = new Set();
  while (set.size < count) set.add(lo + Math.floor(r() * (hi - lo)));
  return [...set];
}

function bstInsertSync(k) {
  if (!DS.bst.root) {
    DS.bst.root = { k };
    return;
  }
  let cur = DS.bst.root;
  for (;;) {
    if (k === cur.k) return;
    const side = k < cur.k ? 'l' : 'r';
    if (!cur[side]) {
      cur[side] = { k };
      return;
    }
    cur = cur[side];
  }
}

function heapSwap(i, j) {
  const h = DS.heap;
  [h.a[i], h.a[j]] = [h.a[j], h.a[i]];
  [h.ids[i], h.ids[j]] = [h.ids[j], h.ids[i]];
}

function heapInsertSync(x) {
  const h = DS.heap;
  h.a.push(x);
  h.ids.push(h.next++);
  let i = h.a.length - 1;
  while (i > 0 && h.a[(i - 1) >> 1] > h.a[i]) {
    heapSwap(i, (i - 1) >> 1);
    i = (i - 1) >> 1;
  }
}

function dsReset(reseed) {
  if (reseed) dsSeed = newSeed();
  const r = rng(dsSeed);
  DS = {
    stack: uniqueValues(r, 4, 1, 99),
    queue: uniqueValues(r, 5, 1, 99),
    bst: { root: null },
    heap: { a: [], ids: [], next: 1 },
    bs: { a: uniqueValues(r, 15, 1, 99).sort((x, y) => x - y), t: 0 },
    hl: null,
    order: null
  };
  uniqueValues(r, 9, 1, 99).forEach(bstInsertSync);
  uniqueValues(r, 7, 1, 99).forEach(heapInsertSync);
  DS.bs.t = DS.bs.a[Math.floor(r() * 15)];
  if (S.cat === 'ds' && $('#dsView')) dsTab();
}

// Shared runner: applies step.act(), redraws, and syncs the code pane.
function dsRun(gen, info, draw) {
  mini.run(gen, step => {
    if (step.leave != null) {
      const el = $(`[data-i="${step.leave}"]`, $('#dsView'));
      if (el) el.classList.add('leave');
      setTimeout(() => {
        if (step.act) step.act();
        draw();
      }, 280);
    } else {
      if (step.act) step.act();
      draw(step.hl);
    }
    showCode({ ...info(), line: step.line, note: step.note, noteKind: step.bad ? 'swap' : 'visit' });
  });
}

function renderDS() {
  P.load([]);
  if (!DS) dsReset(false);
  const stage = $('#stage');
  const tabs = DS_TABS
    .map(([key, icon, label]) => `<button role="tab" data-tab="${key}" class="${S.ds.tab === key ? 'on' : ''}" aria-selected="${S.ds.tab === key}">${ic(icon)} ${label}</button>`)
    .join('');
  stage.innerHTML = `
    <div class="ctrl"><div class="seg" id="dsTabs" role="tablist">${tabs}</div></div>
    <div class="ctrl ds-ctrl" id="dsCtrl"></div>
    <div class="ds-view" id="dsView"></div>`;
  animateIn(stage);
  $$('#dsTabs button').forEach(btn => {
    btn.onclick = () => {
      S.ds.tab = btn.dataset.tab;
      saveS();
      mini.stop();
      DS.hl = null;
      DS.order = null;
      renderDS();
    };
  });
  dsTab();
  syncHash();
}

function dsTab() {
  mini.stop();
  const views = { stack: dsStack, queue: dsQueue, bst: dsBST, bsearch: dsBSearch, heap: dsHeap };
  (views[S.ds.tab] || dsStack)();
}

// ---------- stack ----------
const STACK_CODE = ['push(x):', '  if top == capacity - 1: overflow', '  top = top + 1; a[top] = x', 'pop():', '  if top < 0: underflow', '  x = a[top]; top = top - 1; return x'];

function stackInfo() {
  return {
    title: 'Stack', sub: 'array-backed · LIFO', code: STACK_CODE,
    badges: [{ v: 'push O(1)' }, { v: 'pop O(1)' }, { v: 'LIFO' }],
    stats: [{ k: 'size', v: `${DS.stack.length} / ${DS_CAP}` }, { k: 'top', v: DS.stack.length ? DS.stack[DS.stack.length - 1] : '—', cls: 'cmp' }]
  };
}

function drawStack(hl) {
  const cells = DS.stack.map((v, i) => {
    const cls = hl && hl.i === i ? hl.cls : '';
    const tag = i === DS.stack.length - 1 ? '<span class="tag">← top</span>' : '';
    return `<div class="cell ${cls}" data-i="${i}">${v}${tag}</div>`;
  }).join('');
  $('#dsView').innerHTML = `
    <div style="display:flex;gap:32px;align-items:flex-end;flex-wrap:wrap">
      <div><div class="ptr" style="margin-bottom:6px">top = ${DS.stack.length - 1}</div><div class="stack-col">${cells}</div></div>
      <div class="muted" style="font-size:.84rem;max-width:380px">
        <p style="margin:0 0 8px">A stack grows and shrinks at one end only. Function calls, undo history and depth-first search all use one.</p>
        <p style="margin:0">Push and pop are O(1): nothing shifts, only the <span class="mono">top</span> index moves.</p>
      </div>
    </div>`;
}

function* stackPush(x) {
  yield { line: 1, note: `top = ${DS.stack.length - 1}, capacity ${DS_CAP}` };
  if (DS.stack.length >= DS_CAP) {
    yield { line: 1, note: 'Overflow — the stack is full', bad: true };
    return;
  }
  const n = DS.stack.length;
  yield { line: 2, note: `top becomes ${n}; a[${n}] = ${x}`, act: () => DS.stack.push(x), hl: { i: n, cls: 'found enter' } };
}

function* stackPop() {
  yield { line: 4, note: `top = ${DS.stack.length - 1}` };
  if (!DS.stack.length) {
    yield { line: 4, note: 'Underflow — nothing to pop', bad: true };
    return;
  }
  const i = DS.stack.length - 1;
  const v = DS.stack[i];
  yield { line: 5, note: `x = a[${i}] = ${v}`, hl: { i, cls: 'hi' } };
  yield { line: 5, note: `Returned ${v}; top = ${i - 1}`, leave: i, act: () => DS.stack.pop() };
}

function dsStack() {
  $('#dsCtrl').innerHTML = `
    <label>Value <input type="number" id="dsVal" min="0" max="999" value="${randVal()}"></label>
    <button class="btn primary" id="dsPush">${ic('arrow-down')} Push</button>
    <button class="btn" id="dsPop">${ic('arrow-up')} Pop</button>
    <span class="muted" style="font-size:.78rem">Last in, first out · capacity ${DS_CAP}</span>`;
  drawStack();
  showCode({ ...stackInfo(), note: 'Push a value or pop the top element.' });
  $('#dsPush').onclick = () => {
    const x = +$('#dsVal').value;
    $('#dsVal').value = randVal();
    dsRun(stackPush(x), stackInfo, drawStack);
  };
  $('#dsPop').onclick = () => dsRun(stackPop(), stackInfo, drawStack);
}

// ---------- queue ----------
const QUEUE_CODE = ['enqueue(x):', '  if size == capacity: overflow', '  rear = (rear + 1) mod capacity; a[rear] = x; size++', 'dequeue():', '  if size == 0: underflow', '  x = a[front]; front = (front + 1) mod capacity; size--; return x'];

function queueInfo() {
  return {
    title: 'Queue', sub: 'circular array · FIFO', code: QUEUE_CODE,
    badges: [{ v: 'enqueue O(1)' }, { v: 'dequeue O(1)' }, { v: 'FIFO' }],
    stats: [{ k: 'size', v: `${DS.queue.length} / ${DS_CAP}` }, { k: 'front', v: DS.queue.length ? DS.queue[0] : '—', cls: 'cmp' }]
  };
}

function drawQueue(hl) {
  const cells = DS.queue.map((v, i) => {
    const cls = hl && hl.i === i ? hl.cls : '';
    const front = i === 0 ? '<span class="tag">front</span>' : '';
    const rear = i === DS.queue.length - 1 ? '<span class="tag" style="top:auto;bottom:-16px">rear</span>' : '';
    return `<div class="cell ${cls}" data-i="${i}">${v}${front}${rear}</div>`;
  }).join('');
  $('#dsView').innerHTML = `
    <div class="ptr" style="margin:14px 0 22px">front → rear</div>
    <div class="queue-row">${cells || '<span class="muted">empty</span>'}</div>
    <p class="muted" style="font-size:.84rem;max-width:520px;margin-top:26px">Breadth-first search, print spoolers and task schedulers are queues. A circular array avoids shifting everything on each dequeue.</p>`;
}

function* queueEnqueue(x) {
  yield { line: 1, note: `size = ${DS.queue.length}` };
  if (DS.queue.length >= DS_CAP) {
    yield { line: 1, note: 'Overflow — the queue is full', bad: true };
    return;
  }
  const n = DS.queue.length;
  yield { line: 2, note: `a[rear] = ${x}; size = ${n + 1}`, act: () => DS.queue.push(x), hl: { i: n, cls: 'found enter' } };
}

function* queueDequeue() {
  yield { line: 4, note: `size = ${DS.queue.length}` };
  if (!DS.queue.length) {
    yield { line: 4, note: 'Underflow — queue is empty', bad: true };
    return;
  }
  const v = DS.queue[0];
  yield { line: 5, note: `x = a[front] = ${v}`, hl: { i: 0, cls: 'hi' } };
  yield { line: 5, note: `Returned ${v}; front moves on`, leave: 0, act: () => DS.queue.shift() };
}

function dsQueue() {
  $('#dsCtrl').innerHTML = `
    <label>Value <input type="number" id="dsVal" min="0" max="999" value="${randVal()}"></label>
    <button class="btn primary" id="dsEnq">${ic('arrow-right')} Enqueue</button>
    <button class="btn" id="dsDeq">${ic('arrow-right')} Dequeue</button>
    <span class="muted" style="font-size:.78rem">First in, first out · capacity ${DS_CAP}</span>`;
  drawQueue();
  showCode({ ...queueInfo(), note: 'Enqueue at the rear, dequeue from the front.' });
  $('#dsEnq').onclick = () => {
    const x = +$('#dsVal').value;
    $('#dsVal').value = randVal();
    dsRun(queueEnqueue(x), queueInfo, drawQueue);
  };
  $('#dsDeq').onclick = () => dsRun(queueDequeue(), queueInfo, drawQueue);
}

// ---------- binary search tree ----------
const BST_CODE = {
  insert: ['insert(node, k):', '  if node is null: return new Node(k)', '  if k < node.key: node.left = insert(node.left, k)', '  else if k > node.key: node.right = insert(node.right, k)', '  else: duplicate — ignore', '  return node'],
  search: ['search(node, k):', '  if k < node.key: search(node.left, k)', '  else if k > node.key: search(node.right, k)', '  else: found', 'reached null → not found'],
  delete: ['delete(node, k):', '  if node is null: not found', '  if k < key: go left; else if k > key: go right', '  else (found):', '    no child → remove; one child → replace with it', '    two children → copy in-order successor, delete it'],
  in: ['inorder(n): if n: inorder(n.left); visit(n); inorder(n.right)   // sorted order'],
  pre: ['preorder(n): if n: visit(n); preorder(n.left); preorder(n.right)   // copies a tree'],
  post: ['postorder(n): if n: postorder(n.left); postorder(n.right); visit(n)   // frees a tree']
};
let bstOp = 'insert';

const bstCount = n => (n ? 1 + bstCount(n.l) + bstCount(n.r) : 0);
const bstHeight = n => (n ? 1 + Math.max(bstHeight(n.l), bstHeight(n.r)) : 0);

function bstInfo() {
  return {
    title: 'Binary search tree', sub: `${bstCount(DS.bst.root)} keys · height ${bstHeight(DS.bst.root)}`, code: BST_CODE[bstOp],
    badges: [{ v: 'avg O(log n)', cls: 'good' }, { v: 'worst O(n) when skewed', cls: 'bad' }],
    stats: [{ k: 'keys', v: bstCount(DS.bst.root) }, { k: 'height', v: bstHeight(DS.bst.root), cls: 'piv' }]
  };
}

function bstLayout() {
  const pos = new Map();
  let index = 0;
  let maxDepth = 0;
  const walk = (n, depth) => {
    if (!n) return;
    walk(n.l, depth + 1);
    pos.set(n.k, { x: index++, d: depth });
    maxDepth = Math.max(maxDepth, depth);
    walk(n.r, depth + 1);
  };
  walk(DS.bst.root, 0);
  return { pos, count: index, maxDepth };
}

function drawBST() {
  const { pos, count, maxDepth } = bstLayout();
  if (!count) {
    $('#dsView').innerHTML = '<p class="muted">Tree is empty — insert a value.</p>';
    return;
  }
  const gx = 54;
  const gy = 64;
  const W = Math.max(320, (count + 1) * gx);
  const H = (maxDepth + 1) * gy + 30;
  const xy = k => {
    const p = pos.get(k);
    return [(p.x + 1) * gx, 30 + p.d * gy];
  };
  let lines = '';
  let nodes = '';
  const walk = n => {
    if (!n) return;
    const [x, y] = xy(n.k);
    for (const child of [n.l, n.r]) {
      if (!child) continue;
      const [cx, cy] = xy(child.k);
      lines += `<line x1="${x}" y1="${y}" x2="${cx}" y2="${cy}"/>`;
    }
    const hl = DS.hl && DS.hl.k === n.k ? DS.hl.cls : '';
    const orderIndex = DS.order ? DS.order.indexOf(n.k) : -1;
    const orderLabel = orderIndex >= 0 ? `<text class="ord" y="-27">${orderIndex + 1}</text>` : '';
    nodes += `<g class="node ${hl} ${orderIndex >= 0 ? 'order' : ''}" style="transform:translate(${x}px,${y}px)"><circle r="18"/><text>${n.k}</text>${orderLabel}</g>`;
    walk(n.l);
    walk(n.r);
  };
  walk(DS.bst.root);
  $('#dsView').innerHTML = `<svg class="tree" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMin meet" aria-label="Binary search tree">${lines}${nodes}</svg>`;
}

function* bstInsertGen(k) {
  if (!DS.bst.root) {
    yield { line: 1, note: `Tree empty — ${k} becomes the root`, act: () => { DS.bst.root = { k }; }, hl: { k, cls: 'new' } };
    return;
  }
  let cur = DS.bst.root;
  for (;;) {
    if (k === cur.k) {
      yield { line: 4, note: `${k} already exists — ignored`, hl: { k, cls: 'del' }, bad: true };
      return;
    }
    const goLeft = k < cur.k;
    yield { line: goLeft ? 2 : 3, note: `${k} ${goLeft ? '<' : '>'} ${cur.k} → go ${goLeft ? 'left' : 'right'}`, hl: { k: cur.k, cls: 'visit' } };
    const side = goLeft ? 'l' : 'r';
    if (!cur[side]) {
      const parent = cur;
      yield { line: 1, note: `Attach ${k} as the ${goLeft ? 'left' : 'right'} child of ${parent.k}`, act: () => { parent[side] = { k }; }, hl: { k, cls: 'new' } };
      return;
    }
    cur = cur[side];
  }
}

function* bstSearchGen(k) {
  let cur = DS.bst.root;
  let depth = 0;
  while (cur) {
    depth++;
    if (k === cur.k) {
      yield { line: 3, note: `Found ${k} after ${depth} comparison${depth > 1 ? 's' : ''}`, hl: { k, cls: 'found' } };
      return;
    }
    const goLeft = k < cur.k;
    yield { line: goLeft ? 1 : 2, note: `${k} ${goLeft ? '<' : '>'} ${cur.k} → ${goLeft ? 'left' : 'right'}`, hl: { k: cur.k, cls: 'visit' } };
    cur = goLeft ? cur.l : cur.r;
  }
  yield { line: 4, note: `${k} is not in the tree (${depth} comparisons)`, bad: true };
}

function* bstDeleteGen(k) {
  let cur = DS.bst.root;
  let parent = null;
  while (cur && cur.k !== k) {
    const goLeft = k < cur.k;
    yield { line: 2, note: `${k} ${goLeft ? '<' : '>'} ${cur.k} → ${goLeft ? 'left' : 'right'}`, hl: { k: cur.k, cls: 'visit' } };
    parent = cur;
    cur = goLeft ? cur.l : cur.r;
  }
  if (!cur) {
    yield { line: 1, note: `${k} not found`, bad: true };
    return;
  }
  yield { line: 3, note: `Found ${k}`, hl: { k, cls: 'del' } };
  const replace = node => {
    if (!parent) DS.bst.root = node;
    else if (parent.l === cur) parent.l = node;
    else parent.r = node;
  };
  if (!cur.l || !cur.r) {
    const child = cur.l || cur.r;
    const note = child ? `One child (${child.k}) takes its place` : 'Leaf — simply unlink it';
    yield { line: 4, note, act: () => replace(child), hl: child ? { k: child.k, cls: 'new' } : null };
    return;
  }
  let successorParent = cur;
  let successor = cur.r;
  yield { line: 5, note: 'Two children — find the in-order successor (leftmost of the right subtree)', hl: { k: successor.k, cls: 'visit' } };
  while (successor.l) {
    successorParent = successor;
    successor = successor.l;
    yield { line: 5, note: `Go left to ${successor.k}`, hl: { k: successor.k, cls: 'visit' } };
  }
  const sk = successor.k;
  yield {
    line: 5, note: `Successor is ${sk}: copy it over ${k} and unlink the successor node`, hl: { k: sk, cls: 'found' },
    act: () => {
      cur.k = sk;
      if (successorParent === cur) successorParent.r = successor.r;
      else successorParent.l = successor.r;
    }
  };
}

function* bstTraverseGen(kind) {
  const out = [];
  const visit = n => ({ line: 0, note: `Visit ${n.k} (#${out.length})`, act: () => { DS.order = [...out]; }, hl: { k: n.k, cls: 'visit' } });
  function* walk(n) {
    if (!n) return;
    if (kind === 'pre') {
      out.push(n.k);
      yield visit(n);
    }
    yield* walk(n.l);
    if (kind === 'in') {
      out.push(n.k);
      yield visit(n);
    }
    yield* walk(n.r);
    if (kind === 'post') {
      out.push(n.k);
      yield visit(n);
    }
  }
  yield* walk(DS.bst.root);
  yield { line: 0, note: `${kind}-order: ${out.join(', ') || 'empty'}`, hl: null };
}

function dsBST() {
  $('#dsCtrl').innerHTML = `
    <label>Key <input type="number" id="dsVal" min="0" max="999" value="${randVal()}"></label>
    <button class="btn primary" id="bIns">${ic('plus')} Insert</button>
    <button class="btn" id="bSrc">${ic('search')} Search</button>
    <button class="btn" id="bDel">${ic('minus')} Delete</button>
    <span class="f">Traverse</span>
    <div class="seg sm"><button data-tr="in">in-order</button><button data-tr="pre">pre-order</button><button data-tr="post">post-order</button></div>
    <button class="btn sm ghost" id="bRand">${ic('dice')} Random tree</button>`;
  const draw = hl => {
    if (hl !== undefined) DS.hl = hl;
    drawBST();
  };
  DS.hl = null;
  DS.order = null;
  draw();
  showCode({ ...bstInfo(), note: 'Insert, search or delete a key, or run a traversal.' });
  const go = (kind, gen) => {
    bstOp = kind;
    DS.order = null;
    DS.hl = null;
    dsRun(gen, bstInfo, draw);
  };
  $('#bIns').onclick = () => {
    const k = +$('#dsVal').value;
    $('#dsVal').value = randVal();
    go('insert', bstInsertGen(k));
  };
  $('#bSrc').onclick = () => go('search', bstSearchGen(+$('#dsVal').value));
  $('#bDel').onclick = () => go('delete', bstDeleteGen(+$('#dsVal').value));
  $$('[data-tr]').forEach(btn => {
    btn.onclick = () => go(btn.dataset.tr, bstTraverseGen(btn.dataset.tr));
  });
  $('#bRand').onclick = () => {
    mini.stop();
    DS.bst = { root: null };
    uniqueValues(rng(newSeed()), 9, 1, 99).forEach(bstInsertSync);
    DS.order = null;
    draw(null);
    showCode({ ...bstInfo(), note: 'New random tree' });
  };
}

// ---------- binary search ----------
const BS_CODE = ['lo = 0; hi = n - 1', 'while lo ≤ hi:', '  mid = (lo + hi) / 2', '  if a[mid] == target: return mid', '  else if a[mid] < target: lo = mid + 1', '  else: hi = mid - 1', 'return not found'];

function bsInfo() {
  const n = DS.bs.a.length;
  return {
    title: 'Binary search', sub: `sorted array of ${n} · target ${DS.bs.t}`, code: BS_CODE,
    badges: [{ v: 'O(log n)', cls: 'good' }, { v: 'needs sorted input' }],
    stats: [{ k: 'n', v: n }, { k: 'max probes', v: Math.ceil(Math.log2(n + 1)), cls: 'cmp' }]
  };
}

function bsCellClass(hl, i) {
  if (!hl) return '';
  const classes = [];
  if (i < hl.lo || i > hl.hi) classes.push('dead');
  if (hl.found === i) classes.push('found');
  else if (hl.mid === i) classes.push('mid');
  else if (hl.lo === i) classes.push('lo');
  else if (hl.hi === i) classes.push('hi');
  return classes.join(' ');
}

function drawBSearch(hl) {
  const cells = DS.bs.a.map((v, i) => {
    const tags = hl ? [hl.lo === i ? 'lo' : '', hl.mid === i ? 'mid' : '', hl.hi === i ? 'hi' : ''].filter(Boolean).join(' ') : '';
    const tagHtml = tags ? `<span class="tag">${tags}</span>` : '';
    return `<div class="cell ${bsCellClass(hl, i)}">${v}${tagHtml}<span class="tag" style="top:auto;bottom:-16px;color:var(--dim)">${i}</span></div>`;
  }).join('');
  $('#dsView').innerHTML = `
    <div class="cells">${cells}</div>
    <p class="muted" style="font-size:.84rem;max-width:560px;margin-top:34px">Each probe halves the search range, so a billion sorted items need at most 30 probes. The trade-off: the array must already be sorted.</p>`;
}

function* bsGen(t) {
  const a = DS.bs.a;
  let lo = 0;
  let hi = a.length - 1;
  let probes = 0;
  yield { line: 0, note: `Search for ${t} in ${a.length} sorted values`, hl: { lo, hi } };
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    probes++;
    yield { line: 2, note: `mid = ${mid}, a[mid] = ${a[mid]}`, hl: { lo, hi, mid } };
    if (a[mid] === t) {
      yield { line: 3, note: `Found ${t} at index ${mid} after ${probes} probe${probes > 1 ? 's' : ''}`, hl: { lo, hi, mid, found: mid } };
      return;
    }
    if (a[mid] < t) {
      lo = mid + 1;
      yield { line: 4, note: `${a[mid]} < ${t} → discard the left half`, hl: { lo, hi } };
    } else {
      hi = mid - 1;
      yield { line: 5, note: `${a[mid]} > ${t} → discard the right half`, hl: { lo, hi } };
    }
  }
  yield { line: 6, note: `${t} is not in the array (${probes} probes)`, bad: true, hl: { lo: -1, hi: -1 } };
}

function dsBSearch() {
  const n = DS.bs.a.length;
  $('#dsCtrl').innerHTML = `

// ---------- min-heap ----------
const HEAP_CODE = ['insert(x):', '  a.push(x); i = last index', '  while i > 0 and a[parent(i)] > a[i]:', '    swap(a[i], a[parent(i)]); i = parent(i)', 'extractMin():', '  min = a[0]; move the last element to the root', '  i = 0', '  while a[i] has a child smaller than it:', '    c = smaller child; swap(a[i], a[c]); i = c', '  return min'];
const HEAP_MAX = 15;

function heapInfo() {
  return {
    title: 'Min-heap', sub: 'complete binary tree stored in an array', code: HEAP_CODE,
    badges: [{ v: 'insert O(log n)' }, { v: 'extract O(log n)' }, { v: 'peek O(1)', cls: 'good' }],
    stats: [{ k: 'size', v: DS.heap.a.length }, { k: 'min', v: DS.heap.a.length ? DS.heap.a[0] : '—', cls: 'cmp' }]
  };
}

function heapXY(i, W, gy) {
  const depth = Math.floor(Math.log2(i + 1));
  const offset = i - (2 ** depth - 1);
  return [(offset + .5) / 2 ** depth * W, 30 + depth * gy];
}

function heapClass(hl, i) {
  if (!hl) return '';
  if (hl.swap && hl.swap.includes(i)) return 'found';
  if (hl.cmp && hl.cmp.includes(i)) return 'visit';
  if (hl.hl && hl.hl.includes(i)) return 'new';
  return '';
}

function drawHeap(hl) {
  const a = DS.heap.a;
  const levels = a.length ? Math.floor(Math.log2(a.length)) + 1 : 1;
  const W = 640;
  const gy = 66;
  const H = levels * gy + 30;
  let svg = $('#heapSvg');
  if (!svg) {
    $('#dsView').innerHTML = `
      <svg class="tree" id="heapSvg" preserveAspectRatio="xMidYMin meet" aria-label="Min-heap as a tree"><g id="hLines"></g><g id="hNodes"></g></svg>
      <div class="ptr" style="margin:10px 0 6px">array view (index below)</div>
      <div class="cells" id="heapRow"></div>`;
    svg = $('#heapSvg');
  }
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  $('#hLines').innerHTML = a.map((_, i) => {
    if (!i) return '';
    const [x, y] = heapXY(i, W, gy);
    const [px, py] = heapXY((i - 1) >> 1, W, gy);
    return `<line x1="${px}" y1="${py}" x2="${x}" y2="${y}"/>`;
  }).join('');

  // Nodes keep their identity (data-id) so swaps glide between fixed slots.
  const nodesG = $('#hNodes');
  const seen = new Set();
  a.forEach((v, i) => {
    const id = DS.heap.ids[i];
    seen.add(id);
    let g = nodesG.querySelector(`[data-id="${id}"]`);
    if (!g) {
      g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('data-id', id);
      g.innerHTML = '<circle r="18"/><text></text>';
      nodesG.append(g);
    }
    const [x, y] = heapXY(i, W, gy);
    g.setAttribute('class', 'node ' + heapClass(hl, i));
    g.style.transform = `translate(${x}px,${y}px)`;
    g.querySelector('text').textContent = v;
  });
  [...nodesG.children].forEach(g => {
    if (!seen.has(+g.dataset.id)) g.remove();
  });

  const rowClass = i => ({ found: 'found', visit: 'mid', new: 'lo' }[heapClass(hl, i)] || '');
  $('#heapRow').innerHTML = a.map((v, i) =>
    `<div class="cell ${rowClass(i)}" style="width:40px;height:40px;margin-top:4px">${v}<span class="tag" style="top:auto;bottom:-16px;color:var(--dim)">${i}</span></div>`
  ).join('') || '<span class="muted">empty</span>';
}

function* heapInsertGen(x) {
  const a = DS.heap.a;
  const n = a.length;
  if (n >= HEAP_MAX) {
    yield { line: 1, note: `Demo heap is full (${HEAP_MAX}) — extract first`, bad: true };
    return;
  }
  yield { line: 1, note: `Append ${x} at index ${n}`, act: () => { a.push(x); DS.heap.ids.push(DS.heap.next++); }, hl: { hl: [n] } };
  let i = n;
  while (i > 0) {
    const p = (i - 1) >> 1;
    yield { line: 2, note: `Compare ${a[i]} with parent ${a[p]}`, hl: { cmp: [i, p] } };
    if (a[p] <= a[i]) {
      yield { line: 2, note: `${a[p]} ≤ ${a[i]} — heap property holds`, hl: { hl: [i] } };
      return;
    }
    yield { line: 3, note: `${a[i]} < ${a[p]} → swap up`, act: () => heapSwap(i, p), hl: { swap: [i, p] } };
    i = p;
  }
  yield { line: 3, note: `${x} is the new minimum at the root`, hl: { hl: [0] } };
}

function* heapExtractGen() {
  const a = DS.heap.a;
  if (!a.length) {
    yield { line: 4, note: 'Heap is empty', bad: true };
    return;
  }
  const min = a[0];
  yield { line: 5, note: `Min is ${min} at the root`, hl: { hl: [0] } };
  const last = a.length - 1;
  if (last === 0) {
    yield { line: 9, note: `Return ${min} — heap is now empty`, act: () => { a.pop(); DS.heap.ids.pop(); } };
    return;
  }
  yield { line: 5, note: `Move last element ${a[last]} to the root, drop ${min}`, act: () => { heapSwap(0, last); a.pop(); DS.heap.ids.pop(); }, hl: { swap: [0, last] } };
  let i = 0;
  for (;;) {
    const l = 2 * i + 1;
    const r = l + 1;
    if (l >= a.length) {
      yield { line: 9, note: `No children — return ${min}`, hl: { hl: [i] } };
      return;
    }
    let c = l;
    if (r < a.length) {
      yield { line: 7, note: `Smaller child of ${a[i]}: ${a[l]} or ${a[r]}?`, hl: { cmp: [l, r] } };
      if (a[r] < a[l]) c = r;
    }
    yield { line: 7, note: `Compare ${a[i]} with child ${a[c]}`, hl: { cmp: [i, c] } };
    if (a[i] <= a[c]) {
      yield { line: 9, note: `${a[i]} ≤ ${a[c]} — heap restored, return ${min}`, hl: { hl: [i] } };
      return;
    }
    yield { line: 8, note: `Swap ${a[i]} ↓ with ${a[c]}`, act: () => heapSwap(i, c), hl: { swap: [i, c] } };
    i = c;
  }
}

function dsHeap() {
  $('#dsCtrl').innerHTML = `
    <label>Value <input type="number" id="dsVal" min="0" max="999" value="${randVal()}"></label>
    <button class="btn primary" id="hIns">${ic('plus')} Insert</button>

  $('#dsView').innerHTML = '';

   COMPARE — benchmark every sort across input sizes without animation
   ===================================================================== */
const BENCH_SIZES = [16, 32, 64, 128, 256, 512];
const BENCH_METRICS = { cmp: 'Comparisons', moves: 'Swaps + writes', steps: 'Total steps' };
let benchResults = null;

function benchCount(algoKey, input) {
  const counts = { cmp: 0, swp: 0, wr: 0, steps: 0 };
  for (const step of SORTS[algoKey].run(input.slice())) {
    counts.steps++;
    if (step.type === 'compare') counts.cmp++;
    else if (step.type === 'swap') counts.swp++;
    else if (step.type === 'set') counts.wr++;
  }
  counts.moves = counts.swp + counts.wr;
  return counts;
}

function benchSelection() {
  const sizes = S.bench.sizes.split(',').map(Number).filter(n => BENCH_SIZES.includes(n));
  const algos = S.bench.algos.split(',').filter(key => SORTS[key]);
  return { sizes: sizes.length ? sizes : [16, 64, 256], algos: algos.length ? algos : Object.keys(SORTS) };
}

function runBenchmark() {
  const { sizes, algos } = benchSelection();
  const seed = 2026;
  const rows = algos.map(key => ({
    key,
    name: SORTS[key].name,
    cells: sizes.map(size => benchCount(key, inputFor({ size, dist: S.bench.dist, seed, custom: '' })))
  }));
  benchResults = { sizes, dist: S.bench.dist, rows, ts: Date.now() };
  return benchResults;
}

// Growth ratio between the two largest sizes, labelled against common classes.
function growthLabel(row, metric, sizes) {
  if (sizes.length < 2) return '—';
  const a = row.cells[sizes.length - 2][metric];
  const b = row.cells[sizes.length - 1][metric];
  if (!a) return '—';
  const ratio = b / a;
  const nRatio = sizes[sizes.length - 1] / sizes[sizes.length - 2];
  let label = 'sub-linear';
  if (ratio > nRatio * nRatio * .8) label = 'quadratic';
  else if (ratio > nRatio * 1.35) label = 'n log n-ish';
  else if (ratio > nRatio * .8) label = 'linear';
  return `${ratio.toFixed(2)}× · ${label}`;
}

function benchControlsHtml() {
  const { sizes, algos } = benchSelection();
  const distOptions = Object.entries(DISTS)
    .filter(([key]) => key !== 'custom')
    .map(([key, label]) => `<option value="${key}" ${key === S.bench.dist ? 'selected' : ''}>${label}</option>`)
    .join('');

  const algoChips = Object.entries(SORTS)
    .map(([key, algo]) => `<button class="chip ${algos.includes(key) ? 'on' : ''}" data-algo="${key}" aria-pressed="${algos.includes(key)}">${esc(algo.name.split(' (')[0])}</button>`)
    .join('');
  const metricSeg = Object.entries(BENCH_METRICS)
    .map(([key, label]) => `<button data-metric="${key}" class="${S.bench.metric === key ? 'on' : ''}">${label}</button>`)
    .join('');
  return `
    <div class="panel">

      <div class="ctrl" style="margin-bottom:10px">

        <button class="btn" id="bPrint" ${benchResults ? '' : 'disabled'}>${ic('printer')} Report</button>
      </div>
    </div>`;
}

function benchTableHtml(results, metric) {
  const head = results.sizes.map(n => `<th class="n">n = ${n}</th>`).join('');
  const maxValue = Math.max(1, ...results.rows.flatMap(row => row.cells.map(c => c[metric])));
  const body = results.rows.map(row => {
    const cells = row.cells.map(c => {
      const width = Math.max(2, Math.round(c[metric] / maxValue * 60));
      return `<td class="n"><span class="mini" style="width:${width}px"></span>${nf(c[metric])}</td>`;
    }).join('');
    return `<tr><td>${esc(row.name)}</td>${cells}<td class="muted">${growthLabel(row, metric, results.sizes)}</td></tr>`;
  }).join('');
  return `<div class="twrap tall"><table class="t"><thead><tr><th>Algorithm</th>${head}<th>Growth (last step)</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

const BENCH_COLS = ['#9ccfd8', '#c4a7e7', '#f6c177', '#eb6f92', '#7fb069', '#f0a0c0', '#5ab0cc', '#e0def4'];

function benchChartHtml(results, metric) {
  const W = Math.max(320, ($('#stage').clientWidth || 800) - 70);
  const H = W < 520 ? 280 : 360;
  const pl = 56;
  const pr = 16;
  const pt = 16;
  const pb = 40;
  const sizes = results.sizes;
  const values = results.rows.flatMap(row => row.cells.map(c => Math.max(1, c[metric])));
  const yMax = Math.log10(Math.max(10, ...values) * 1.5);
  const X = i => pl + i / Math.max(1, sizes.length - 1) * (W - pl - pr);
  const Y = v => pt + (H - pt - pb) * (1 - Math.log10(Math.max(1, v)) / yMax);
  const gridLines = [];
  for (let p = 0; p <= Math.floor(yMax); p++) {
    gridLines.push(`<line x1="${pl}" x2="${W - pr}" y1="${Y(10 ** p)}" y2="${Y(10 ** p)}" stroke="${COL.line}" stroke-dasharray="3 4"/>`);
    gridLines.push(`<text x="${pl - 8}" y="${Y(10 ** p) + 4}" fill="${COL.muted}" font-size="11" text-anchor="end" font-family="Fira Code,monospace">${nf(10 ** p)}</text>`);
  }
  const xLabels = sizes.map((n, i) => `<text x="${X(i)}" y="${H - pb + 18}" fill="${COL.muted}" font-size="11" text-anchor="middle" font-family="Fira Code,monospace">${n}</text>`).join('');
  const base = results.rows.length ? results.rows.reduce((sum, row) => sum + Math.max(1, row.cells[0][metric]), 0) / results.rows.length : 1;
  const refs = [['n log n', n => n * Math.log2(n)], ['n²', n => n * n]].map(([label, f]) => {
    const points = sizes.map((n, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(base * f(n) / f(sizes[0])).toFixed(1)}`).join(' ');
    return `<path d="${points}" fill="none" stroke="${COL.muted}" stroke-width="1.5" stroke-dasharray="6 5"/><text x="${X(sizes.length - 1) - 4}" y="${Y(base * f(sizes[sizes.length - 1]) / f(sizes[0])) - 6}" fill="${COL.muted}" font-size="10" text-anchor="end" font-family="Fira Code,monospace">${label}</text>`;
  }).join('');
  const lines = results.rows.map((row, r) => {
    const points = row.cells.map((c, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(c[metric]).toFixed(1)}`).join(' ');
    const dots = row.cells.map((c, i) => `<circle cx="${X(i)}" cy="${Y(c[metric])}" r="3.5" fill="${BENCH_COLS[r % BENCH_COLS.length]}"/>`).join('');
    return `<path data-row="${r}" d="${points}" fill="none" stroke="${BENCH_COLS[r % BENCH_COLS.length]}" stroke-width="2.5" stroke-linejoin="round"/>${dots}`;
  }).join('');
  const legend = results.rows.map((row, r) => `<span><i style="background:${BENCH_COLS[r % BENCH_COLS.length]}"></i>${esc(row.name)}</span>`).join('');
  return `
    <div class="legend" style="margin-bottom:8px">${legend}<span><i style="background:${COL.muted}"></i>dashed: n log n and n² scaled to the first size</span></div>
    <div class="chart"><svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="${BENCH_METRICS[metric]} against input size, log scale">${gridLines.join('')}${xLabels}<text x="${(pl + W - pr) / 2}" y="${H - 4}" fill="${COL.muted}" font-size="11" text-anchor="middle" font-family="Manrope">n (input size) — y axis is logarithmic</text>${refs}${lines}</svg></div>`;
}

function benchCsv(results) {
  const header = ['algorithm', 'size', 'comparisons', 'swaps', 'writes', 'steps'].join(',');
  const lines = results.rows.flatMap(row => row.cells.map((c, i) => [row.name, results.sizes[i], c.cmp, c.swp, c.wr, c.steps].join(',')));
  return [header, ...lines].join('\n');
}

function toggleCsv(list, value) {
  const items = list.split(',').filter(Boolean);
  const index = items.indexOf(value);
  if (index >= 0) items.splice(index, 1);
  else items.push(value);
  return items.join(',');
}

    chip.onclick = () => {

}

  { q: 'Which traversal of a binary search tree visits the keys in sorted order?', o: ['Pre-order', 'In-order', 'Post-order', 'Level-order'], a: 1, why: 'In-order visits left subtree, node, right subtree — exactly ascending key order for a BST.' },
  { q: 'A browser\'s back button history is best modelled by a…', o: ['Queue', 'Min-heap', 'Stack', 'Binary search tree'], a: 2, why: 'The most recently visited page is the first one you go back to — last in, first out.' },
  { q: 'You repeatedly need the smallest pending task and insert new ones as they arrive.', o: ['Sorted array', 'Min-heap', 'Stack', 'Adjacency list'], a: 1, why: 'A min-heap gives O(1) peek-min and O(log n) insert / extract; a sorted array costs O(n) per insert.' },
  { q: 'Printer jobs must be served in the order they arrived.', o: ['Stack', 'Queue', 'Heap', 'Tree'], a: 1, why: 'First in, first out — a queue.' },
  { q: 'Sorting a huge linked list where random access is slow.', o: ['Quick sort', 'Heap sort', 'Merge sort', 'Binary search'], a: 2, why: 'Merge sort only needs sequential access and merges lists without extra arrays.' },
  { q: 'Records are already sorted by first name; now sort them by surname so people with the same surname keep first-name order.', o: ['Selection sort', 'Heap sort', 'Quick sort', 'Merge sort'], a: 3, why: 'That needs a stable sort. Of these only merge sort is stable.' },
  { q: 'Dijkstra\'s algorithm can give wrong answers when the graph has…', o: ['Many edges', 'Negative edge weights', 'More than 1000 nodes', 'Undirected edges'], a: 1, why: 'Dijkstra assumes a settled vertex can never improve, which fails when negative edges exist. Use Bellman-Ford instead.' },
  { q: 'What does A* add to greedy best-first search?', o: ['A random restart', 'The cost already paid, g(n)', 'A bigger heuristic', 'Depth limits'], a: 1, why: 'Greedy orders by h(n) alone; A* orders by f = g + h, which restores optimality.' },
  { q: 'For an unweighted maze, which visits fewer cells to find the shortest path?', o: ['BFS from the start', 'Bidirectional BFS', 'DFS', 'They always visit the same number'], a: 1, why: 'Two frontiers each grow to about half the depth: b^(d/2) + b^(d/2) is far smaller than b^d.' },

  { q: 'About how many probes does binary search need on 1,000,000 sorted items?', o: ['10', '20', '1,000', '500,000'], a: 1, why: 'log₂ 1,000,000 ≈ 19.9, so at most 20 probes.' },
  { q: 'Insertion sort on an input that is sorted in reverse order takes…', o: ['O(n)', 'O(n log n)', 'O(n²)', 'O(1)'], a: 2, why: 'Every key has to be shifted past every earlier key: 1 + 2 + … + (n − 1) comparisons.' }
];
const QUIZ_LEN = 10;
// TODO(student): auto-graded exercises — "predict the next swap" / "which line runs next?" drills scored against the recorded step list.

const GLOSSARY = [
  ['Adjacency list', 'For every vertex, the list of its neighbours (and edge weights). Compact for sparse graphs; the Graphs lab shows it live.'],
  ['Admissible heuristic', 'An estimate h(n) that never overestimates the true remaining cost. A* is optimal only with an admissible heuristic.'],
  ['Amortised cost', 'Average cost per operation over a long sequence, even if a single operation is occasionally expensive.'],
  ['Asymptotic', 'Describes behaviour as n grows very large, ignoring constants and lower-order terms.'],
  ['Big-O notation', 'An upper bound on growth: O(n log n) means the work grows at most proportionally to n log n for large n.'],
  ['Breadth-first search', 'Explores a graph layer by layer with a queue; finds shortest paths in moves on unweighted graphs.'],
  ['Comparison sort', 'Any sort that only learns about the data by comparing pairs. Such sorts need Ω(n log n) comparisons in the worst case.'],
  ['Complete (search)', 'A search algorithm is complete when it is guaranteed to find a solution if one exists.'],
  ['DAG', 'Directed acyclic graph — directed edges and no cycles. Exactly the graphs that admit a topological order.'],
  ['Depth-first search', 'Explores as deep as possible before backtracking, using a stack or recursion. Not shortest-path.'],
  ['Divide and conquer', 'Split the problem, solve the parts recursively, combine. Merge sort and quick sort are the classic examples.'],
  ['Frontier', 'The set of discovered but not yet expanded cells or vertices — the queue, stack or priority queue contents.'],
  ['Generator', 'A JavaScript function* that pauses at each yield. Every algorithm here yields its steps so the player can record and replay them.'],
  ['Greedy algorithm', 'Always takes the locally best choice. Prim and Kruskal are greedy and correct; greedy best-first search is greedy and not optimal.'],
  ['Heap', 'A complete binary tree stored in an array where every parent is ≤ (min-heap) its children. Peek O(1), insert and extract O(log n).'],
  ['Heuristic', 'A cheap estimate of remaining cost used to steer a search, e.g. Manhattan distance on a grid.'],
  ['In-place', 'Uses only O(1) extra memory beyond the input array. Heap sort and insertion sort are in-place; merge sort is not.'],
  ['Invariant', 'A property that stays true throughout an algorithm, e.g. "a[0..i] is sorted" in insertion sort.'],
  ['Lomuto partition', 'Quick sort partition scheme that uses the last element as pivot and sweeps one index through the array.'],
  ['Manhattan distance', '|Δrow| + |Δcol| — the number of 4-directional moves on a grid with no walls.'],
  ['Minimum spanning tree', 'A subset of edges connecting all vertices with the smallest total weight and no cycles.'],
  ['Optimal (search)', 'Returns the lowest-cost solution. Dijkstra and A* (with an admissible heuristic) are optimal; DFS and greedy are not.'],
  ['Pivot', 'The element quick sort partitions around; everything smaller goes left, everything larger goes right.'],
  ['Priority queue', 'A collection that always hands out the smallest key first — usually implemented as a binary heap.'],
  ['Recursion', 'A function that calls itself on smaller inputs. The call stack is literally a stack data structure.'],
  ['Relaxation', 'Updating dist[v] when a shorter route via u is found: dist[v] = min(dist[v], dist[u] + w).'],
  ['Stable sort', 'Equal keys keep their original relative order. Merge, insertion, bubble, counting and radix sort are stable.'],
  ['Topological order', 'A linear ordering of a DAG where every edge points forward. Used for build systems and course plans.'],
  ['Union-find', 'Disjoint-set structure with find(x) (which set?) and union(a, b). Kruskal uses it to reject cycle-forming edges.'],
  ['Weighted graph', 'Each edge carries a cost. Shortest paths then minimise total weight rather than number of edges.'],
  ['Worst case', 'The input that makes an algorithm slowest. Quick sort\'s is already-sorted input with a last-element pivot.']
];

const ALGO_CARDS = [
  { lab: '#sorting/bubble', family: 'Sorting', name: 'Bubble sort', who: 'folklore, 1950s', idea: 'Repeatedly swap adjacent out-of-order pairs; the largest value bubbles to the end each pass.', use: 'Teaching, detecting an already-sorted list in one pass.', pitfall: 'O(n²) even on average; never use it in production.' },

  { lab: '#sorting/selection', family: 'Sorting', name: 'Selection sort', who: 'folklore', idea: 'Find the minimum of the rest and swap it into place.', use: 'When writes are expensive — it does at most n − 1 swaps.', pitfall: 'Always O(n²) comparisons, not stable.' },
  { lab: '#sorting/merge', family: 'Sorting', name: 'Merge sort', who: 'John von Neumann, 1945', idea: 'Split in half, sort each half, merge the two sorted runs.', use: 'Stable sorting, linked lists, external sorting of huge files.', pitfall: 'Needs O(n) extra memory.' },
  { lab: '#sorting/quick', family: 'Sorting', name: 'Quick sort', who: 'Tony Hoare, 1959', idea: 'Partition around a pivot, then sort both sides recursively.', use: 'General-purpose in-memory sorting; cache friendly.', pitfall: 'O(n²) with poor pivots; not stable.' },
  { lab: '#sorting/heap', family: 'Sorting', name: 'Heap sort', who: 'J. W. J. Williams, 1964', idea: 'Build a max-heap, then repeatedly move the root to the back.', use: 'Guaranteed O(n log n) with O(1) extra memory.', pitfall: 'Poor cache behaviour; usually slower than quick sort in practice.' },

  { lab: '#path/astar', family: 'Pathfinding', name: 'A*', who: 'Hart, Nilsson & Raphael, 1968', idea: 'Dijkstra plus a heuristic: order by f = g + h.', use: 'Games, robotics, GPS navigation.', pitfall: 'Optimal only with an admissible, consistent heuristic.' },
  { lab: '#path/greedy', family: 'Pathfinding', name: 'Greedy best-first', who: 'Judea Pearl, 1984 (named)', idea: 'Order by h alone — run straight at the goal.', use: 'When speed matters more than optimality.', pitfall: 'Easily lured into dead ends by walls.' },

// ---------- quiz ----------
function quizStore() {
  return store.get('quiz', { best: 0, attempts: [] });
}

function newQuiz() {
  const r = rng(newSeed());
  const order = QUIZ.map((_, i) => i).sort(() => r() - .5).slice(0, QUIZ_LEN);
  return { order, i: 0, score: 0, picked: null, done: false };
}

function finishQuiz() {
  QZ.done = true;
  const saved = quizStore();
  saved.best = Math.max(saved.best, QZ.score);
  saved.attempts.push({ date: new Date().toISOString().slice(0, 10), score: QZ.score, total: QUIZ_LEN });
  saved.attempts = saved.attempts.slice(-20);
  store.set('quiz', saved);
  toast(`Quiz finished: ${QZ.score} / ${QUIZ_LEN}`, 'ok');
  notify(QZ.score === QUIZ_LEN ? 'win' : 'ok', `Quiz result ${QZ.score} / ${QUIZ_LEN}`, `Best so far ${saved.best}. ${saved.attempts.length} attempt${saved.attempts.length === 1 ? '' : 's'} saved.`, '#learn/quiz');
  if (QZ.score === QUIZ_LEN) unlock('quiz10', 'Grandmaster', 'A perfect score on the quiz.');
  if (saved.attempts.length >= 3) unlock('scholar', 'Scholar', 'Three quiz attempts completed.');
}

function quizResultHtml(saved) {
  const attempts = saved.attempts.slice(-5).reverse()
    .map(a => `<tr><td>${esc(a.date)}</td><td class="n">${a.score} / ${a.total || QUIZ_LEN}</td></tr>`)
    .join('');
  return `
    <div class="panel quiz enter" style="max-width:640px">
      <h3>${ic('trophy')} Result</h3>
      <div class="score" id="qScore">0</div>
      <p class="muted" style="margin:4px 0 14px">out of ${QUIZ_LEN} · best so far <b class="mono" style="color:var(--ink)">${saved.best}</b> · ${saved.attempts.length} attempt${saved.attempts.length === 1 ? '' : 's'} saved</p>
      <div class="bar"><i id="qBar"></i></div>
      <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
        <button class="btn primary" id="qAgain">${ic('rotate')} Try again</button>
        <button class="btn" id="qPrint">${ic('printer')} Print certificate</button>
        <a class="btn" href="#learn/table">${ic('table')} Review the table</a>
      </div>
      ${attempts ? `<h3 style="margin-top:18px">${ic('list')} Recent attempts</h3><table class="t"><tbody>${attempts}</tbody></table>` : ''}
    </div>`;
}

function quizQuestionHtml(q) {
  const options = q.o.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('');
  const nextLabel = QZ.i === QUIZ_LEN - 1 ? 'See result' : 'Next';
  return `
    <div class="panel quiz enter" style="max-width:720px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <h3 style="margin:0">${ic('lightbulb')} Question ${QZ.i + 1} of ${QUIZ_LEN}</h3>
        <span class="mono muted" style="font-size:.8rem">score ${QZ.score} · best ${quizStore().best}</span>
      </div>
      <div class="bar" style="margin:10px 0 14px"><i style="width:${QZ.i / QUIZ_LEN * 100}%"></i></div>
      <p style="font-size:1.02rem;font-weight:600;margin:0 0 6px">${esc(q.q)}</p>
      <div id="qOpts">${options}</div>
      <div id="qWhy" class="cp-note hidden" style="margin:12px 0 0"></div>
      <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn primary hidden" id="qNext">${nextLabel} ${ic('arrow-right')}</button></div>
    </div>`;
}

function learnQuiz() {
  if (!QZ) QZ = newQuiz();
  const body = $('#lBody');
  if (QZ.done) {
    const saved = quizStore();
    body.innerHTML = quizResultHtml(saved);
    countUp($('#qScore'), QZ.score, { dur: 900 });
    requestAnimationFrame(() => {
      const bar = $('#qBar');
      if (bar) bar.style.width = (QZ.score / QUIZ_LEN * 100) + '%';
    });
    $('#qAgain').onclick = () => {
      QZ = null;
      learnQuiz();
    };
    $('#qPrint').onclick = () => openReport('quiz');
    return;
  }
  const q = QUIZ[QZ.order[QZ.i]];
  body.innerHTML = quizQuestionHtml(q);
  $$('#qOpts .opt').forEach(btn => {
    btn.onclick = () => answerQuiz(q, +btn.dataset.i);
  });
  $('#qNext').onclick = () => {
    QZ.i++;
    QZ.picked = null;
    if (QZ.i >= QUIZ_LEN) finishQuiz();
    learnQuiz();
  };
}

function answerQuiz(q, picked) {
  if (QZ.picked != null) return;
  QZ.picked = picked;
  const correct = picked === q.a;
  if (correct) QZ.score++;
  $$('#qOpts .opt').forEach(opt => {
    const i = +opt.dataset.i;
    opt.classList.toggle('right', i === q.a);
    opt.classList.toggle('wrong', i === picked && !correct);
    opt.disabled = true;
  });
  const why = $('#qWhy');
  why.classList.remove('hidden');
  why.className = 'cp-note ' + (correct ? 'sorted' : 'swap');
  why.innerHTML = `<b>${correct ? 'Correct.' : 'Not quite.'}</b> ${esc(q.why)}`;
  $('#qNext').classList.remove('hidden');
}

const GROWTH_FN = [
  ['n', n => n, '#9ccfd8'], ['log₂ n', n => Math.max(1, Math.log2(n)), '#c4a7e7'], ['n log₂ n', n => Math.max(1, n * Math.log2(n)), '#f6c177'],
