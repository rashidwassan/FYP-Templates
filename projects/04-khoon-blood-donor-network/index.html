<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khoon — Blood Donor Network</title>
<meta name="description" content="Find compatible blood donors in Pakistani cities, post emergency requests, register as a donor with eligibility tracking, and browse blood banks. Single-file FYP template.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7f5;--surface:#fff;--surface-2:#fdeeea;--ink:#2a1215;--muted:#8a6a6e;--line:#f1d6d0;
  --crimson:#b3122e;--crimson-deep:#8c0d24;--crimson-soft:#fde2e6;--rose:#e85d75;--gold:#d9a441;--gold-soft:#fbf1dc;--green:#2e8b57;--green-soft:#e2f3ea;--slate:#536075;--slate-soft:#eef1f5;
  --radius:18px;--radius-sm:12px;--shadow:0 16px 40px -28px rgba(140,13,36,.45);
  --font:"Nunito",system-ui,sans-serif;--font-ur:"Noto Nastaliq Urdu",serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.15}
.ur{font-family:var(--font-ur);line-height:1.9}
.muted{color:var(--muted)} .hidden{display:none!important}
/* hero */
.hero{background:radial-gradient(120% 140% at 100% 0%,#e03a57 0%,var(--crimson) 45%,var(--crimson-deep) 100%);color:#fff;padding:18px 20px 26px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:320px;height:320px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero .in{max-width:1180px;margin:0 auto;position:relative}
.top{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand .drop{width:40px;height:40px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#fff;display:grid;place-items:center}
.brand .drop span{transform:rotate(45deg);color:var(--crimson);font-weight:900;font-size:1.05rem}
.brand h1{font-size:1.25rem;font-weight:900;letter-spacing:-.01em} .brand small{display:block;font-size:.74rem;opacity:.85}
.spacer{flex:1}
.lang{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:7px 12px;font-weight:800;cursor:pointer}
.hero h2{font-size:clamp(1.5rem,3.4vw,2.3rem);font-weight:900;margin-top:22px;letter-spacing:-.02em;max-width:720px}
.hero p.sub{margin:6px 0 0;opacity:.9;max-width:640px}
.searchbar{margin-top:18px;background:#fff;border-radius:16px;padding:10px;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) auto;gap:8px;box-shadow:0 20px 50px -20px rgba(0,0,0,.5);color:var(--ink)}
.groups{display:flex;gap:6px;flex-wrap:wrap}
.g{border:2px solid var(--line);background:var(--surface);border-radius:10px;min-width:48px;padding:6px 8px;font-weight:900;cursor:pointer;color:var(--crimson);text-align:center;font-size:.95rem}
.g.on{background:var(--crimson);border-color:var(--crimson);color:#fff}
.g.any{color:var(--slate)} .g.any.on{background:var(--slate);border-color:var(--slate);color:#fff}
select,input[type=text],input[type=tel],input[type=number],input[type=date],textarea{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;outline:0}
select:focus,input:focus,textarea:focus{border-color:var(--rose);box-shadow:0 0 0 3px var(--crimson-soft)}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:800;cursor:pointer;background:var(--crimson);color:#fff;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.gold{background:var(--gold);color:#3b2a08} .btn.green{background:var(--green)} .btn.ghost{background:var(--surface-2);color:var(--ink)} .btn.outline{background:transparent;border:2px solid var(--line);color:var(--ink)} .btn.sm{padding:7px 11px;font-size:.84rem;border-radius:10px} .btn:disabled{opacity:.5;cursor:not-allowed}
/* tabs */
.tabs{max-width:1180px;margin:-18px auto 0;padding:0 20px;position:relative;z-index:2}
.tabs .in{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;overflow:auto;box-shadow:var(--shadow);scrollbar-width:none}
.tabs button{flex:1;border:0;background:none;padding:12px 14px;font-weight:800;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
.tabs button.on{color:var(--crimson);border-bottom-color:var(--crimson)}
.tabs button .n{display:inline-block;background:var(--crimson-soft);color:var(--crimson);border-radius:999px;padding:0 7px;font-size:.72rem;margin-left:6px}
main{max-width:1180px;margin:0 auto;padding:22px 20px 70px}
section[data-page]{display:none} section[data-page].on{display:block}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.card h3{font-size:1.1rem;font-weight:900;margin-bottom:8px}
label.f{display:block;font-size:.76rem;font-weight:800;color:var(--muted);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.07em}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 14px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:18px;align-items:start}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px}
.toggle input{accent-color:var(--crimson);width:16px;height:16px}
/* donor grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.donor{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;position:relative}
.donor .head{display:flex;gap:12px;align-items:center}
.avatar{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--rose),var(--crimson));flex:none}
.donor .name{font-weight:900} .donor .meta{font-size:.84rem;color:var(--muted)}
.bg{margin-left:auto;background:var(--crimson);color:#fff;border-radius:10px;padding:6px 9px;font-weight:900;font-size:1rem;letter-spacing:.02em}
.bg.compat{background:var(--slate)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:.76rem;font-weight:800;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--green-soft);color:var(--green)} .pill.wait{background:var(--gold-soft);color:#8a6100} .pill.gold{background:var(--gold-soft);color:#8a6100} .pill.red{background:var(--crimson-soft);color:var(--crimson)}
.donor .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.phone{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:.03em}
/* requests */
.req{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--u,var(--rose));border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start}
.req.fulfilled{opacity:.65;--u:var(--green)}
.req .big{font-size:1.6rem;font-weight:900;color:var(--crimson);line-height:1;background:var(--crimson-soft);border-radius:14px;width:64px;height:64px;display:grid;place-items:center}
.req .big small{display:block;font-size:.65rem;font-weight:800;color:var(--muted)}
.req h4{font-size:1.05rem;font-weight:900} .req .meta{font-size:.86rem;color:var(--muted);margin-top:2px}
.req .acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.u-critical{--u:#b3122e} .u-urgent{--u:#e8882e} .u-routine{--u:#536075}
.resp{font-size:.82rem;background:var(--surface-2);border-radius:10px;padding:8px 10px;margin-top:8px}
/* my card */
.dcard{background:linear-gradient(135deg,var(--crimson),var(--crimson-deep));color:#fff;border-radius:22px;padding:22px;position:relative;overflow:hidden;box-shadow:0 30px 60px -30px rgba(140,13,36,.7)}
.dcard::before{content:"";position:absolute;right:-40px;bottom:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.dcard .grp{font-size:3rem;font-weight:900;line-height:1;letter-spacing:-.03em}
.dcard .row{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:.85rem;opacity:.95}
.ring{width:96px;height:96px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.badge{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--surface);font-size:.84rem;font-weight:800}
.badge.locked{opacity:.45;filter:grayscale(1)}
.badge .icw{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--gold-soft);color:#8a6100} .badge .icw .ic{width:16px;height:16px}
/* banks */
.bank{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.bank h4{font-weight:900;font-size:1rem} .bank .meta{font-size:.84rem;color:var(--muted);margin:4px 0 8px}
.tags{display:flex;gap:5px;flex-wrap:wrap}
/* stats */
.stat{display:grid;grid-template-columns:52px 1fr 60px;gap:10px;align-items:center;margin:6px 0;font-weight:800;font-size:.9rem}
.stat .track{height:14px;background:var(--surface-2);border-radius:999px;overflow:hidden} .stat .fill{height:100%;background:var(--crimson);border-radius:999px}
.stat .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800} .kpi .v{font-size:1.7rem;font-weight:900;letter-spacing:-.02em;color:var(--crimson)} .kpi .s{font-size:.8rem;color:var(--muted)}
.matrix{border-collapse:collapse;width:100%;font-size:.82rem} .matrix th,.matrix td{border:1px solid var(--line);padding:5px;text-align:center} .matrix th{background:var(--surface-2)} .matrix td.y{background:var(--green-soft);color:var(--green);font-weight:900} .matrix td.me{outline:2px solid var(--crimson)}
.note{background:var(--gold-soft);border-left:4px solid var(--gold);border-radius:10px;padding:10px 12px;font-size:.88rem}
.warn{background:var(--crimson-soft);border-left:4px solid var(--crimson);border-radius:10px;padding:10px 12px;font-size:.88rem}
.todo{border:1px dashed var(--crimson);border-radius:12px;padding:12px 14px;background:var(--surface)}
.todo h4{font-size:.95rem;display:flex;gap:8px;align-items:center;margin-bottom:4px} .tag{font-size:.68rem;background:var(--crimson);color:#fff;border-radius:6px;padding:2px 6px;font-weight:800}
.list{display:grid;gap:10px}
.empty{padding:30px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius)}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(42,18,21,.5);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.scrim.on{display:flex}
.modal{background:var(--surface);border-radius:20px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:22px}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:grid;gap:8px;z-index:60}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;animation:pop .25s}
.toast.ok{background:var(--green)} .toast.bad{background:var(--crimson)}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
@media (max-width:860px){.searchbar{grid-template-columns:1fr}.two{grid-template-columns:minmax(0,1fr)}.req{grid-template-columns:auto minmax(0,1fr)}.req .acts{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;align-items:center}.hero h2{margin-top:14px}}
@media print{.hero,.tabs,#toasts{display:none}}

/* ---------- icon + motion kit ---------- */
.ic{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
:root{--ease:cubic-bezier(.2,.8,.2,1);--dur:.35s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@keyframes kFadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.enter{animation:kFadeUp var(--dur) var(--ease) both}
.stagger>*{animation:kFadeUp .45s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
.btn{transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .2s}
.btn:hover{transform:translateY(-1px)} .btn:active{transform:translateY(0) scale(.98)}
</style>
</head>

<header class="hero"><div class="in">
  <div class="top"><div class="brand"><div class="drop"><span>K</span></div><div><h1>Khoon</h1><small data-i18n="tagline">Blood Donor Network · Pakistan</small></div></div><div class="spacer"></div><button class="lang" id="langBtn">اردو</button></div>
  <h2 data-i18n="hero">Find a compatible donor in minutes, not in a WhatsApp storm.</h2>
  <p class="sub" data-i18n="heroSub">Search donors by blood group and city, post an emergency request, or register and track when you can donate next.</p>
  <div class="searchbar"><div class="groups" id="hGroups"></div><select id="hCity"></select><button class="btn" id="hGo" data-i18n="search">Search donors</button></div>
</div></header>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<main>
  <section data-page="find" class="on"><div class="toolbar" id="findBar"></div><div id="compat" class="card hidden" style="margin-bottom:14px"></div><div class="grid" id="donors"></div></section>
  <section data-page="requests"><div class="two"><div class="card" id="reqForm"></div><div><div class="toolbar" id="reqBar"></div><div class="list" id="reqList"></div></div></div></section>
  <section data-page="register"><div class="two" id="register"></div></section>
  <section data-page="banks"><div class="toolbar" id="bankBar"></div><div class="grid" id="banks"></div></section>
  <section data-page="stats"><div class="kpis" id="skpis"></div><div class="two" id="stats"></div></section>
  <section data-page="about"><div class="two" id="about"></div></section>
</main>

<script>
'use strict';
/* =====================================================================
   Khoon — Blood Donor Network (single file)
   utils · i18n · domain (groups, compatibility, eligibility) · seed data ·
   find · requests · register (my card, badges, donation log) · banks · stats · about
   Student hooks: TODO(student)
   ===================================================================== */
const NS = 'khoon:';
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const store = { get(k, d) { try { const v = localStorage.getItem(NS + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(NS + k, JSON.stringify(v)); return true; } catch { return false; } } };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toast = (m, type = '') => { const t = document.createElement('div'); t.className = 'toast ' + type; t.textContent = m; $('#toasts').append(t); setTimeout(() => t.remove(), 3200); };
const uid = () => Math.random().toString(36).slice(2, 9);

const ic = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const animateIn = root => { if (!root) return; root.classList.remove('enter'); void root.offsetWidth; root.classList.add('enter'); root.querySelectorAll('.grid,.list,.kpis,.tiles,.facts,.hist,.path,.badges,.checks,.steps,.docs').forEach(g => { g.classList.add('stagger'); [...g.children].forEach((el, i) => el.style.setProperty('--i', Math.min(i, 14))); }); };
const drawPaths = root => root && root.querySelectorAll('.series').forEach(p => { try { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; p.getBoundingClientRect(); p.style.transition = 'stroke-dashoffset .9s var(--ease)'; p.style.strokeDashoffset = 0; } catch {} });
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const DAY = 864e5, now = Date.now();
const daysAgo = ts => Math.floor((now - ts) / DAY);
const ago = ts => { const d = daysAgo(ts); if (d === 0) { const h = Math.floor((now - ts) / 36e5); return h <= 0 ? 'just now' : h + ' h ago'; } return d === 1 ? 'yesterday' : d < 30 ? d + ' days ago' : d < 365 ? Math.floor(d / 30) + ' mo ago' : Math.floor(d / 365) + ' y ago'; };
const dateStr = ts => new Date(ts).toLocaleDateString('en-PK', { day: 'numeric', month: 'short', year: 'numeric' });
const initials = n => n.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
const maskPhone = p => p.slice(0, 4) + '-***-**' + p.slice(-2);
const wa = (phone, text) => `https://wa.me/92${phone.replace(/\D/g, '').slice(1)}?text=${encodeURIComponent(text)}`;

// ---------- i18n ----------

function drawDonors() {

  $('#fCount').textContent = `${list.length} ${t('found')}`;

// ---------- stats ----------
function renderStats() {
  const donors = allDonors(), reqs = requests(); const byG = Object.fromEntries(GROUPS.map(g => [g, 0])); donors.forEach(d => byG[d.group]++);
  const byC = Object.fromEntries(CITY_LIST.map(c => [c, { n: 0, e: 0 }])); donors.forEach(d => { byC[d.city].n++; if (eligibleIn(d) === 0) byC[d.city].e++; });
  const elig = donors.filter(d => eligibleIn(d) === 0).length, rare = GROUPS.reduce((a, g) => byG[g] < byG[a] ? g : a, GROUPS[0]);
  const kpi = (k, v, s) => `<div class="kpi"><div class="k">${t(k)}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  $('#skpis').innerHTML = kpi('k_donors', donors.length, CITY_LIST.length + ' cities') + kpi('k_eligible', elig, Math.round(elig / donors.length * 100) + '%') + kpi('k_open', reqs.filter(r => r.status === 'open').length, reqs.filter(r => r.status === 'open' && r.urgency === 'critical').length + ' ' + t('critical').toLowerCase()) + kpi('k_full', reqs.filter(r => r.status === 'fulfilled').length, '') + kpi('k_rare', rare, byG[rare] + ' ' + t('donations').replace(/.*/, 'donors'));
  const maxG = Math.max(...Object.values(byG)), maxC = Math.max(...Object.values(byC).map(x => x.n));
  const R = 56, C = 2 * Math.PI * R; let off = 0; const cols = ['#b3122e', '#e85d75', '#d9a441', '#536075', '#2e8b57', '#8c0d24', '#f0a3b2', '#9aa6b8'];
  const donut = GROUPS.map((g, i) => { const f = byG[g] / donors.length; const seg = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${cols[i]}" stroke-width="22" stroke-dasharray="${C * f} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`; off += C * f; return seg; }).join('');
  $('#stats').innerHTML = `<div class="card"><h3>${t('s_byGroup')}</h3><div style="display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:center"><svg viewBox="0 0 140 140" width="140" height="140">${donut}<text x="70" y="75" text-anchor="middle" font-weight="900" font-size="20" fill="#2a1215">${donors.length}</text></svg><div>${GROUPS.map((g, i) => `<div class="stat"><span style="color:${cols[i]}">${g}</span><div class="track"><div class="fill" style="width:${byG[g] / maxG * 100}%;background:${cols[i]}"></div></div><span class="n">${byG[g]} · ${Math.round(byG[g] / donors.length * 100)}%</span></div>`).join('')}</div></div><div class="note" style="margin-top:12px">${t('s_insight')}</div></div>
    <div class="card"><h3>${t('s_byCity')}</h3>${CITY_LIST.map(c => `<div class="stat" style="grid-template-columns:92px 1fr 70px"><span>${c}</span><div class="track"><div class="fill" style="width:${byC[c].n / maxC * 100}%;background:linear-gradient(90deg,var(--crimson) ${byC[c].e / Math.max(1, byC[c].n) * 100}%,var(--rose) 0)"></div></div><span class="n">${byC[c].e}/${byC[c].n}</span></div>`).join('')}<p class="muted" style="font-size:.8rem;margin:10px 0 0">eligible / registered</p>
    <h3 style="margin-top:18px">${t('compatFor')}</h3><table class="matrix"><tr><th>↓ recipient · donor →</th>${GROUPS.map(g => `<th>${g}</th>`).join('')}</tr>${GROUPS.map(r => `<tr><th>${r}</th>${GROUPS.map(d => `<td class="${CAN_RECEIVE[r].includes(d) ? 'y' : ''}">${CAN_RECEIVE[r].includes(d) ? '✓' : ''}</td>`).join('')}</tr>`).join('')}</table></div>`;
}

// ---------- about ----------
const TODOS = [
  ['Backend + real-time', 'Move donors and requests to a database (Firebase/Supabase/Node) so a request posted in Karachi reaches every compatible donor instantly; keep this file as the client.', 'backend'],
  ['OTP verification', 'Verify phone numbers on registration and request posting; block spam and fake requests; mark donors verified by partner blood banks.', 'auth'],
  ['Notifications', 'Push/SMS to compatible, eligible donors within the city when a request is posted; reminders when a donor becomes eligible again.', 'notifications'],
  ['Nearest donors', 'Use GPS and a distance sort instead of city/area text; show a map of anonymised donor density.', 'maps'],
  ['Privacy controls', 'Relay calls/SMS so numbers are never shown; let donors set quiet hours and max contacts per month; audit who revealed what.', 'privacy'],
  ['Hospital integration', 'Allow blood banks to post stock levels and confirm fulfilled requests; auto-close requests after the needed-by date.', 'product'],
  ['Thalassemia link', 'Recurring monthly requests for thalassemia patients with a donor rota, integrated with the Thalassemia Care Companion project.', 'product'],
];
function renderAbout() { $('#about').innerHTML = `<div class="card"><h3>${t('a_title')}</h3><p class="muted">When someone needs blood in Pakistan, families broadcast on WhatsApp and hope. Thalassemia children need transfusions every few weeks for life. Khoon turns that into a searchable, compatibility-aware donor network with an emergency request board and donor eligibility tracking.</p><p class="muted">Compatibility follows ABO/Rh red-cell rules. Eligibility intervals are 90 days (men) and 120 days (women) for whole blood, 18–60 years and ≥ 50 kg; final screening is always the blood bank's. Seed donors, requests and bank phone numbers are illustrative.</p><p class="muted" style="font-size:.85rem">Stack: one HTML file, vanilla JS, SVG charts, localStorage.</p></div><div><h3 style="margin:0 0 10px">${t('a_todo')}</h3><div class="list">${TODOS.map(([h, b, tag]) => `<div class="todo"><h4>${esc(h)} <span class="tag">${tag}</span></h4><div class="muted" style="font-size:.9rem">${esc(b)}</div></div>`).join('')}</div></div>`; }

// ---------- nav / boot ----------
const PAGES = ['find', 'requests', 'register', 'banks', 'stats', 'about']; let cur = 'find';
function renderTabs() { const open = requests().filter(r => r.status === 'open').length; $('#tabs').innerHTML = PAGES.map(p => `<button data-p="${p}" class="${cur === p ? 'on' : ''}">${t('nav_' + p)}${p === 'requests' && open ? `<span class="n">${open}</span>` : ''}${p === 'register' && store.get('me', null) ? ' ' + ic('check') : ''}</button>`).join(''); $$('#tabs button').forEach(b => b.onclick = () => go(b.dataset.p)); }
function go(page) { if (!PAGES.includes(page)) page = 'find'; cur = page; $$('section[data-page]').forEach(s => s.classList.toggle('on', s.dataset.page === page)); renderTabs(); ({ find: renderFind, requests: renderRequests, register: () => renderRegister(), banks: renderBanks, stats: renderStats, about: renderAbout })[page](); animateIn($(`section[data-page="${page}"]`)); if (location.hash !== '#' + page) history.replaceState(null, '', '#' + page); }
function applyLang() { document.documentElement.lang = lang; store.set('lang', lang); $$('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n)); $('#langBtn').textContent = lang === 'en' ? 'اردو' : 'English'; renderHeroSearch(); go((location.hash || '#find').slice(1)); }
$('#langBtn').onclick = () => { lang = lang === 'en' ? 'ur' : 'en'; applyLang(); };
window.addEventListener('hashchange', () => go(location.hash.slice(1)));
applyLang();
</script>
</body>
</html>
