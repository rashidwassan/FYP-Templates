/* ---------- motion kit ---------- */

}

.switch { position: relative; display: inline-block; width: 46px; height: 26px; flex: none; }

.switch i { position: absolute; inset: 0; border-radius: 99px; background: var(--panel-3); border: 1px solid var(--line-2); transition: background .2s; pointer-events: none; }

.list { display: flex; flex-direction: column; }

.kv dt { color: var(--muted); }

/* ---------- shell: channel-selector nav · peers/channels rail · conversation · mesh panel; bottom tabs on phones ---------- */
.skip { position: fixed; top: -60px; inset-inline-start: 12px; z-index: 90; }
.skip:focus { top: 10px; }
.app { display: grid; grid-template-columns: var(--nav-w) var(--rail-w) minmax(0, 1fr) var(--mesh-w); min-height: 100vh; }

.nav { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; background: var(--bg); border-inline-end: 1px solid var(--line); z-index: 20; }

.navlist a:hover { color: var(--ink); background: var(--panel); }

.navlist .cnt { position: absolute; top: 3px; inset-inline-end: 8px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 99px; background: var(--orange); color: var(--orange-ink); font-size: .64rem; font-weight: 700; display: grid; place-items: center; font-family: var(--mono); line-height: 1; }
.nav-sos { padding-top: 8px; }
.rail { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--bg-2); border-inline-end: 1px solid var(--line); padding: 12px 10px 20px; }
.main { min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
.top { position: sticky; top: 0; z-index: 15; height: var(--top-h); display: flex; align-items: center; gap: 10px; padding: 0 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .title { min-width: 0; flex: 1; display: flex; flex-direction: column; justify-content: center; }
.top h1 { font-size: 1.05rem; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.top #pageSub { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ticker { flex: 0 1 300px; min-width: 0; overflow: hidden; white-space: nowrap; font-size: .7rem; color: var(--muted); mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); direction: ltr; }
.ticker span { display: inline-block; margin-inline-end: 14px; animation: fadeIn .4s; }
.ticker .in { color: var(--green); }
.ticker .out { color: var(--orange-2); }
.top-actions { display: flex; align-items: center; gap: 4px; }
.tbtn { position: relative; min-width: 40px; height: 40px; padding: 0 9px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; border: 1px solid transparent; background: transparent; cursor: pointer; color: var(--ink-2); }
.tbtn:hover { background: var(--panel); color: var(--ink); }
.tbtn.lang { font-family: var(--font-ur); font-size: .86rem; border-color: var(--line); }
html[lang="ur"] .tbtn.lang { font-family: var(--font); }
.badge { position: absolute; top: 4px; inset-inline-end: 4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: var(--orange); color: var(--orange-ink); font-size: .62rem; font-weight: 700; display: grid; place-items: center; font-family: var(--mono); line-height: 1; }
.linkstat { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); font-size: .74rem; color: var(--ink-2); white-space: nowrap; font-family: var(--mono); text-decoration: none; }
#view { flex: 1; padding: 20px 22px 40px; min-width: 0; outline: none; }
#view.chatview { padding: 0; display: flex; flex-direction: column; min-height: 0; }
body.chatopen .main { height: 100vh; height: 100dvh; min-height: 0; }
.backbtn { display: none; }
.meshpanel { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--bg-2); border-inline-start: 1px solid var(--line); padding: 14px 14px 24px; }
.tabs { display: none; }
.sos-fab { display: none; }
#banner:empty { display: none; }
.strip { display: flex; align-items: center; gap: 10px; padding: 9px 16px; background: var(--orange); color: var(--orange-ink); font-weight: 600; font-size: .9rem; background-image: repeating-linear-gradient(-45deg, transparent 0 10px, rgba(0, 0, 0, .08) 10px 20px); background-size: 28px 28px; animation: hazard 1.2s linear infinite; }
.strip .btn { background: var(--orange-ink); color: var(--orange); border-color: transparent; min-height: 32px; }
.strip.calm { background: var(--panel-2); color: var(--ink); animation: none; background-image: none; border-bottom: 1px solid var(--line); }
.strip.calm .btn { background: var(--panel-3); color: var(--ink); }

/* ---------- SOS hold button (nav on desktop, floating on phones) ---------- */
.sos-hold { position: relative; width: 58px; height: 58px; border-radius: 50%; border: 0; cursor: pointer; background: var(--orange); color: var(--orange-ink); font-family: var(--mono); font-weight: 700; font-size: .8rem; display: grid; place-items: center; box-shadow: 0 0 0 4px var(--orange-soft), 0 10px 24px -10px rgba(255, 122, 26, .9); touch-action: none; user-select: none; -webkit-user-select: none; }
.sos-hold svg.ring { position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px); transform: rotate(-90deg); pointer-events: none; }
.sos-hold svg.ring circle { fill: none; stroke: var(--ink); stroke-width: 3.5; stroke-linecap: round; }
.sos-hold .face { display: flex; flex-direction: column; align-items: center; line-height: 1.05; pointer-events: none; }
.sos-hold .face small { font-family: var(--font); font-size: .52rem; font-weight: 600; opacity: .8; }
html[lang="ur"] .sos-hold .face small { font-family: var(--font-ur); font-size: .5rem; line-height: 1.4; }
.sos-hold.holding { transform: scale(.96); }
.sos-hold::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--orange); animation: beacon 2.4s var(--ease) infinite; pointer-events: none; }
html.calm .sos-hold::after { display: none; }

/* ---------- rail: my node, channels, direct chats ---------- */
.mynode { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); margin-bottom: 12px; text-decoration: none; color: inherit; }
.mynode .grow b { display: block; font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mynode .grow small { display: block; font-family: var(--mono); font-size: .68rem; color: var(--muted); }
.railh { display: flex; align-items: center; justify-content: space-between; margin: 14px 6px 6px; font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
html[lang="ur"] .railh { letter-spacing: 0; font-size: .74rem; }
.chan { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 8px; border-radius: 10px; border: 0; background: transparent; color: var(--ink-2); text-decoration: none; cursor: pointer; text-align: start; min-width: 0; }
.chan:hover { background: var(--panel); color: var(--ink); }
.chan.on { background: var(--panel-2); color: var(--ink); }
.chan .hash { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--panel-3); color: var(--ink-2); flex: none; }
.chan .hash.sosh { background: var(--orange-soft); color: var(--orange); }
.chan .grow b { display: block; font-weight: 600; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chan.wrap .grow b, .chan.wrap .grow small { white-space: normal; }
.chan .grow small { display: block; font-size: .76rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chan .unread { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--green); color: var(--green-ink); font-family: var(--mono); font-size: .68rem; font-weight: 700; display: grid; place-items: center; }
.chan .unread.sos { background: var(--orange); color: var(--orange-ink); }

/* ---------- conversation ---------- */
.convhead { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--bg-2); flex-wrap: wrap; }
.convhead .grow b { font-size: 1rem; }
.convhead .grow small { display: block; color: var(--muted); font-size: .78rem; }
.msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 4px; background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 22px 22px; background-position: -11px -11px; }
html[data-theme="sand"] .msgs { background-image: radial-gradient(rgba(60, 45, 20, .13) 1px, transparent 1px); }
.daysep { align-self: center; margin: 10px 0 6px; padding: 2px 12px; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--line); font-size: .72rem; color: var(--muted); font-family: var(--mono); }
.bub { position: relative; max-width: min(560px, 82%); align-self: flex-start; padding: 8px 12px 6px; border-radius: 4px 14px 14px 14px; background: var(--panel); border: 1px solid var(--line); animation: pop .25s var(--ease) both; }
html[dir="rtl"] .bub { border-radius: 14px 4px 14px 14px; }
.bub.mine { align-self: flex-end; background: var(--panel-3); border-color: var(--line-2); border-radius: 14px 4px 14px 14px; }
html[dir="rtl"] .bub.mine { border-radius: 4px 14px 14px 14px; }
.bub.sosb { background: var(--orange-soft); border: 1.5px solid var(--orange); }
.bub.safeb { border-color: var(--green); background: var(--green-soft); }
.bub .who { display: flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 650; margin-bottom: 2px; color: var(--av, var(--sand)); flex-wrap: wrap; }
html[data-theme="sand"] .bub .who { color: color-mix(in srgb, var(--av, var(--sand)) 45%, #1b1d20); }
.bub .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.bub .meta { display: flex; justify-content: flex-end; align-items: center; gap: 6px; margin-top: 3px; font-family: var(--mono); font-size: .66rem; color: var(--muted); flex-wrap: wrap; }
.bub .meta .ic { width: 13px; height: 13px; }
.bub .meta .ok { color: var(--green); }
.bub .meta .bad { color: var(--red); }
.bub .hopbtn { border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; padding: 0; text-decoration: underline dotted; }
.bub img.photo { display: block; max-width: 100%; width: 260px; border-radius: 8px; margin: 4px 0; }
.bub audio { width: 240px; max-width: 100%; height: 36px; margin-top: 4px; }
.loccard { display: flex; gap: 10px; align-items: center; padding: 8px; margin: 4px 0; border-radius: 8px; background: var(--bg-2); border: 1px solid var(--line); }
.loccard .compassn { width: 44px; height: 44px; flex: none; }
.sosdetail { display: grid; grid-template-columns: repeat(3, auto); gap: 4px 14px; margin: 6px 0; font-size: .82rem; }
.sosdetail b { font-family: var(--mono); font-size: 1.05rem; display: block; }
.composer { border-top: 1px solid var(--line); background: var(--bg-2); padding: 10px 14px 12px; }
.composer .tools { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
.composer .cphint { margin-top: 6px; }
.composer .inrow { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; min-height: 44px; max-height: 140px; resize: none; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); }
.composer textarea:focus { outline: none; border-color: var(--green); }
.tplrow { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.tplrow .chip { flex: none; }
.recbar { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--red-soft); margin-bottom: 8px; font-family: var(--mono); font-size: .85rem; }

/* ---------- mesh panel and live mesh graph ---------- */
.meshhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.meshhead h3 { font-size: .95rem; display: flex; gap: 8px; align-items: center; }
.grille { height: 6px; border-radius: 3px; margin: 2px 0 12px; background: repeating-linear-gradient(90deg, var(--line-2) 0 2px, transparent 2px 6px); opacity: .7; }
.meshsvg { width: 100%; height: auto; display: block; border-radius: var(--radius); background: radial-gradient(circle at 50% 50%, var(--panel) 0, var(--bg-2) 72%); border: 1px solid var(--line); }
.meshsvg .ringg { fill: none; stroke: var(--line); stroke-dasharray: 2 5; }
.meshsvg .edge { stroke: var(--line-2); stroke-width: 1.4; stroke-dasharray: 4 4; fill: none; }
.meshsvg .edge.live { stroke: var(--green); stroke-dasharray: 6 6; stroke-width: 2.2; animation: dash .8s linear infinite; }
.meshsvg .nodec { fill: var(--panel-3); stroke: var(--line-2); stroke-width: 1.5; }
.meshsvg .nodec.live { stroke: var(--green); stroke-width: 2.5; }
.meshsvg .nodec.me { fill: var(--orange); stroke: var(--orange-2); }
.meshsvg .nodec.sos { stroke: var(--orange); stroke-width: 3; }
.meshsvg text { font-family: var(--mono); font-size: 9px; fill: var(--ink-2); text-anchor: middle; }
.meshsvg .pulse { fill: var(--green); }
.evlog { font-family: var(--mono); font-size: .72rem; color: var(--ink-2); max-height: 220px; overflow-y: auto; }
.evlog div { padding: 4px 0; border-bottom: 1px dashed var(--line); display: flex; gap: 8px; }
.evlog time { color: var(--muted); flex: none; }
.peerrow { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.peerrow:last-child { border-bottom: 0; }
.peerrow .grow b { display: block; font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.peerrow .grow small { display: block; font-size: .7rem; color: var(--muted); font-family: var(--mono); }

/* ---------- boards: sand paper cards ---------- */
.boardgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.paper { position: relative; background: var(--paper); color: var(--paper-ink); border-radius: 6px; padding: 16px 14px 12px; box-shadow: 0 1px 0 rgba(0, 0, 0, .05), 0 12px 24px -16px rgba(0, 0, 0, .7); background-image: linear-gradient(transparent 27px, var(--paper-line) 28px); background-size: 100% 28px; background-position: 0 6px; border-top: 5px solid var(--sand); }
.paper::before { content: ""; position: absolute; top: -9px; inset-inline-start: 50%; width: 12px; height: 12px; border-radius: 50%; background: var(--orange); box-shadow: 0 2px 3px rgba(0, 0, 0, .4); }
.paper h4 { font-size: 1.02rem; margin-bottom: 4px; color: var(--paper-ink); }
.paper .pmeta { font-size: .8rem; color: #5b5244; }
.paper .tag { background: rgba(42, 37, 29, .1); color: var(--paper-ink); }
.paper .tag.bad { background: #b3261e; color: #fff; }
.paper .tag.ok { background: #1d6b3d; color: #fff; }
.paper .tag.warn { background: #8a6200; color: #fff; }
.paper .btn { background: rgba(42, 37, 29, .08); border-color: rgba(42, 37, 29, .2); color: var(--paper-ink); }
.paper.status-found, .paper.status-met, .paper.status-gone { opacity: .78; }
.paper .stamp { font-family: var(--mono); font-size: .64rem; color: #6e6352; margin-top: 8px; overflow-wrap: anywhere; }
.paper.conf { border-top-color: var(--orange); }
.conflict { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; background: var(--panel); }
.conflict .vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin-top: 6px; font-size: .85rem; }
.conflict .vs > div { padding: 6px 8px; border-radius: 6px; background: var(--bg-2); min-width: 0; overflow-wrap: anywhere; }
.conflict .vs .win { outline: 1.5px solid var(--green); }
.replica { border: 1px dashed var(--line-2); border-radius: var(--radius); padding: 12px; }

/* ---------- community SOS: incidents, triage, coordinator, roll call ---------- */
.tri { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border-radius: 6px; font-size: .74rem; font-weight: 700; color: #fff; white-space: nowrap; }
.tri.immediate { background: #d32f2f; }
.tri.delayed { background: #e0a800; color: #1d1600; }
.tri.minor { background: #2e8b47; }
.tri.deceased { background: #111; border: 1px solid #555; }
.tri.unknown { background: var(--panel-3); color: var(--ink-2); }
.inc { display: flex; gap: 12px; padding: 12px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); border-inline-start: 5px solid var(--tc, var(--line-2)); cursor: pointer; text-align: start; width: 100%; color: inherit; }
.inc:hover { border-color: var(--line-2); }
.inc.sel { box-shadow: 0 0 0 2px var(--orange); }
.inc .grow b { display: block; }
.life { display: flex; gap: 4px; align-items: center; margin-top: 6px; }
.life i { flex: 1; height: 5px; border-radius: 3px; background: var(--panel-3); }
.life i.on { background: var(--green); }
.life.res i.on { background: var(--muted); }
.ackrow { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: .86rem; }
.rollgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.rollp { display: flex; flex-direction: column; gap: 8px; align-items: stretch; padding: 10px; border-radius: var(--radius-sm); background: var(--panel); border: 1px solid var(--line); border-inline-start: 4px solid var(--rc, var(--line-2)); }
.rollp .grow b { display: block; font-size: .9rem; }
.rollp .grow small { color: var(--muted); font-size: .74rem; }
.rollp select { width: 100%; min-height: 34px; }
.skillset { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- maps, charts, simulator ---------- */
.mapsvg { width: 100%; height: auto; display: block; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); touch-action: none; }
.mapsvg .grid { stroke: var(--line); stroke-width: 1; }
.mapsvg .ring { fill: none; stroke: var(--line-2); stroke-dasharray: 3 5; }
.mapsvg text { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
.mapsvg .lbl { fill: var(--ink); font-size: 11px; }
.chart { width: 100%; height: auto; display: block; }
.chart .axis { stroke: var(--line-2); stroke-width: 1; }
.chart .gridl { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
.chart text { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
.chart .val { fill: var(--ink); font-size: 11px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .78rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 12px; height: 4px; border-radius: 2px; margin-inline-end: 5px; vertical-align: middle; }
.simcanvas { width: 100%; aspect-ratio: 1; display: block; border-radius: var(--radius); background: var(--bg-2); border: 1px solid var(--line); }
.paramgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 14px; }
.range { display: flex; flex-direction: column; gap: 2px; font-size: .8rem; }
.range span { display: flex; justify-content: space-between; color: var(--muted); }
.range b { font-family: var(--mono); color: var(--ink); font-weight: 700; }
input[type="range"] { width: 100%; accent-color: var(--orange); min-height: 28px; }
.prog { height: 4px; border-radius: 2px; background: var(--panel-3); overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--orange); transition: width .2s; }

/* ---------- connect, sound, radio, identity, diagnostics ---------- */
.qrbox { background: #fff; border-radius: 10px; padding: 8px; width: min(100%, 280px); margin: 0 auto; }
.qrbox svg { display: block; width: 100%; height: auto; }
.codebox { font-family: var(--mono); font-size: .78rem; padding: 10px; border-radius: var(--radius-sm); background: var(--bg-2); border: 1px dashed var(--line-2); overflow-wrap: anywhere; word-break: break-all; user-select: all; direction: ltr; text-align: left; }
.steps { counter-reset: st; display: flex; flex-direction: column; gap: 10px; }
.steps > div { display: flex; gap: 10px; }
.steps > div::before { counter-increment: st; content: counter(st); width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--panel-3); font-family: var(--mono); font-size: .8rem; font-weight: 700; }
.steps > div.done::before { background: var(--green); color: var(--green-ink); }
.connrow { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.statepill { font-family: var(--mono); font-size: .7rem; padding: 2px 8px; border-radius: 99px; background: var(--panel-3); }
.statepill.connected { background: var(--green-soft); color: var(--green); }
.statepill.failed, .statepill.closed { background: var(--red-soft); color: var(--red); }
.statepill.waiting, .statepill.connecting, .statepill.gathering { background: var(--amber-soft); color: var(--amber); }
.logbox { font-family: var(--mono); font-size: .72rem; line-height: 1.6; max-height: 260px; overflow: auto; padding: 8px 10px; border-radius: var(--radius-sm); background: var(--bg-2); border: 1px solid var(--line); direction: ltr; text-align: left; white-space: pre-wrap; overflow-wrap: anywhere; }
.logbox .in { color: var(--green); }
.logbox .out { color: var(--orange-2); }
.logbox .err { color: var(--red); }
.wave { width: 100%; height: 150px; display: block; border-radius: var(--radius-sm); background: #0d0f10; border: 1px solid var(--line); }
.pbtree { font-family: var(--mono); font-size: .74rem; line-height: 1.6; direction: ltr; text-align: left; }
.pbtree ul { list-style: none; margin: 0; padding-left: 16px; border-left: 1px dashed var(--line-2); }
.pbtree > ul { padding-left: 0; border-left: 0; }
.pbtree .fno { color: var(--orange-2); }
.pbtree .wt { color: var(--blue); }
.pbtree .str { color: var(--green); }
.hexdump { font-family: var(--mono); font-size: .7rem; color: var(--ink-2); overflow-wrap: anywhere; direction: ltr; text-align: left; }
.frame { padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--panel); cursor: pointer; text-align: start; width: 100%; color: inherit; display: flex; gap: 8px; align-items: center; }
.frame.on { border-color: var(--orange); }
.fpwords { display: flex; flex-wrap: wrap; gap: 6px; }
.fpwords span { padding: 4px 10px; border-radius: 6px; background: var(--panel-3); font-weight: 600; font-size: .92rem; }
.fpwords span:nth-child(4n) { margin-inline-end: 8px; }
.trust { display: inline-flex; align-items: center; gap: 4px; font-size: .74rem; font-weight: 600; }
.trust.t0 { color: var(--muted); }
.trust.t1 { color: var(--blue); }
.trust.t2 { color: var(--green); }
.trust.t3 { color: var(--red); }
.hops { display: flex; flex-direction: column; gap: 0; }
.hop { display: flex; gap: 12px; align-items: flex-start; position: relative; padding-bottom: 14px; }
.hop::before { content: ""; position: absolute; inset-inline-start: 15px; top: 30px; bottom: 0; width: 2px; background: var(--line-2); }
.hop:last-child::before { display: none; }

/* ---------- sheets, palette, tour, toasts, SOS alert ---------- */
#scrim { position: fixed; inset: 0; background: rgba(5, 6, 7, .62); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 60; }
#scrim.on { opacity: 1; pointer-events: auto; }
#modal { position: fixed; inset: 0; display: grid; place-items: center; z-index: 61; pointer-events: none; padding: 16px; }
#modal.on { pointer-events: auto; }
.sheet { width: min(560px, 100%); max-height: calc(100vh - 40px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line-2); border-radius: 16px; padding: 18px; box-shadow: var(--shadow-lg); opacity: 0; transform: scale(.96) translateY(8px); transition: opacity .22s var(--ease), transform .25s var(--ease); }
.sheet.wide { width: min(820px, 100%); }
#modal.on .sheet { opacity: 1; transform: none; }
.sheet .grab { display: none; }
.shead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.shead h3 { display: flex; gap: 8px; align-items: center; font-size: 1.08rem; }
.shead h3 .ic { color: var(--orange); }
.sfoot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.sheet.sossheet { border: 2px solid var(--orange); }
.palette { position: fixed; inset: 0; z-index: 70; display: none; place-items: start center; padding: 80px 16px 16px; background: rgba(5, 6, 7, .55); }
.palette.on { display: grid; animation: fadeIn .18s; }
.palbox { width: min(620px, 100%); background: var(--panel); border: 1px solid var(--line-2); border-radius: 14px; box-shadow: var(--shadow-lg); overflow: hidden; animation: pop .2s var(--ease); }
.palbox .inp { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; min-height: 52px; font-size: 1rem; background: transparent; }
.palres { max-height: 52vh; overflow-y: auto; padding: 6px; }
.palres .pg { font-size: .7rem; color: var(--muted); padding: 8px 10px 4px; text-transform: uppercase; letter-spacing: .06em; }
.palres button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; text-align: start; color: var(--ink); }
.palres button span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palres button small { color: var(--muted); font-size: .76rem; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palres button.on { background: var(--panel-3); }
.palhint { padding: 8px 12px; font-size: .74rem; color: var(--muted); border-top: 1px solid var(--line); }
#tour { position: fixed; inset: 0; z-index: 80; display: none; }
#tour.on { display: block; }
#tourSpot { position: fixed; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(5, 6, 7, .66); outline: 2px solid var(--orange); transition: all .35s var(--ease); pointer-events: none; }
#tourTip { position: fixed; width: min(340px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line-2); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow-lg); transition: top .35s var(--ease), left .35s var(--ease); animation: pop .25s var(--ease); }
#tourTip h4 { margin: 6px 0 4px; }
#tourTip p { font-size: .9rem; color: var(--ink-2); }
#tourTip .dots { display: flex; gap: 4px; }
#tourTip .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line-2); }
#tourTip .dots i.on { background: var(--orange); width: 16px; border-radius: 3px; }
#toasts { position: fixed; z-index: 90; bottom: 18px; inset-inline-end: 18px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 9px; max-width: min(380px, calc(100vw - 32px)); padding: 10px 14px; border-radius: 10px; background: var(--ink); color: var(--bg); font-size: .9rem; box-shadow: var(--shadow-lg); animation: fadeUp .3s var(--ease); transition: opacity .35s, transform .35s; }
.toast.ok .ic { color: var(--green); }
html[data-theme="field"] .toast.ok .ic { color: #0f7a40; }
.toast.bad .ic { color: var(--red); }
.toast.sos { background: var(--orange); color: var(--orange-ink); }
.toast.out { opacity: 0; transform: translateY(8px); }
#sosAlert { position: fixed; inset: 0; z-index: 75; display: none; place-items: center; padding: 16px; background: rgba(28, 12, 2, .7); }
#sosAlert.on { display: grid; animation: fadeIn .2s; }
.sosbox { width: min(460px, 100%); background: var(--panel); border-radius: 16px; overflow: hidden; border: 2px solid var(--orange); box-shadow: var(--shadow-lg); animation: pop .25s var(--ease); }
.sosbox .hz { height: 14px; background: repeating-linear-gradient(-45deg, var(--orange) 0 10px, var(--orange-ink) 10px 20px); background-size: 28px 28px; animation: hazard 1s linear infinite; }
.sosbox .in { padding: 16px 18px; }
.countdown { font-family: var(--mono); font-size: 2.6rem; font-weight: 700; color: var(--orange); text-align: center; line-height: 1.2; }
#printArea { display: none; }

/* ---------- responsive ---------- */
@media (max-width: 1499px) {
  .app[data-route="chats"] .ticker { display: none; }
}
@media (max-width: 1279px) {
  .app[data-route="chats"] { grid-template-columns: var(--nav-w) var(--rail-w) minmax(0, 1fr); }
  .app[data-route="chats"] .meshpanel { display: none; }
  .ticker { display: none; }
}
@media (max-width: 999px) {
  .app[data-route="chats"] { grid-template-columns: var(--nav-w) minmax(0, 1fr); }
  .app[data-route="chats"] .rail { display: none; }
  .cols, .cols.even { grid-template-columns: minmax(0, 1fr); }
  .backbtn.show { display: inline-grid; }
}
@media (max-width: 759px) {
  .app, .app:not([data-route="chats"]), .app[data-route="chats"] { grid-template-columns: minmax(0, 1fr); padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom)); }
  .nav { display: none; }
  .top { padding: 0 8px 0 12px; gap: 4px; }
  .linkstat { display: none; }
  #view { padding: 14px 14px 30px; }
  body.chatopen .main { height: calc(100vh - var(--tab-h) - env(safe-area-inset-bottom)); height: calc(100dvh - var(--tab-h) - env(safe-area-inset-bottom)); }
  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; height: calc(var(--tab-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--bg); border-top: 1px solid var(--line); }
  .tabs a, .tabs button { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; background: transparent; color: var(--muted); text-decoration: none; font-size: .68rem; font-weight: 600; cursor: pointer; }
  html[lang="ur"] .tabs a, html[lang="ur"] .tabs button { font-size: .64rem; line-height: 1.6; }
  .tabs .ic { width: 22px; height: 22px; }
  .tabs .on { color: var(--ink); }
  .tabs .on .ic { color: var(--orange); }
  .tabs .tdot { position: absolute; top: 6px; inset-inline-start: calc(50% + 6px); min-width: 16px; height: 16px; border-radius: 99px; background: var(--orange); color: var(--orange-ink); font-size: .6rem; font-family: var(--mono); display: grid; place-items: center; padding: 0 3px; }
  .sos-fab { display: block; position: fixed; z-index: 31; inset-inline-end: 14px; bottom: calc(var(--tab-h) + 14px + env(safe-area-inset-bottom)); }
  .sos-fab .sos-hold { width: 60px; height: 60px; }
  .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; max-height: 90vh; border-radius: 18px 18px 0 0; transform: translateY(30px); padding: 14px 16px 22px; }
  .sheet.wide { width: 100%; }
  .sheet .grab { display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--line-2); margin: 0 auto 10px; }
  #modal { padding: 0; place-items: end stretch; }
  #toasts { bottom: calc(var(--tab-h) + 86px); inset-inline-end: 12px; left: 12px; align-items: stretch; }
  .bub { max-width: 90%; }
  .pagehead h2 { font-size: 1.22rem; }
  .tile b { font-size: 1.25rem; }
  .boardgrid { grid-template-columns: minmax(0, 1fr); }
  .convhead { padding: 8px 12px; }
  .msgs { padding: 10px 10px 14px; }
  .composer { padding: 8px 10px 10px; }
  .composer .tools .lbl, .convhead .lbl, .composer .cphint, .convhead .tag { display: none; }
  .convhead .grow small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .composer .tools .btn { padding: 5px 9px; }
  body.chatopen .sos-fab { bottom: calc(var(--tab-h) + 150px + env(safe-area-inset-bottom)); }
}

/* ---------- print: situation report and evaluation report ---------- */
@media print {
  @page { size: A4; margin: 14mm; }
  body { background: #fff; color: #000; }
  .app, .sos-fab, #toasts, #tour, #modal, #scrim, .palette, #sosAlert, .skip { display: none !important; }
  #printArea { display: block; font-family: var(--font); color: #000; }
  #printArea h1 { font-size: 20pt; margin-bottom: 4pt; }
  #printArea h2 { font-size: 13pt; margin: 14pt 0 6pt; border-bottom: 1.5pt solid #000; padding-bottom: 3pt; }
  #printArea table { width: 100%; border-collapse: collapse; font-size: 9pt; }
  #printArea th, #printArea td { border: .6pt solid #777; padding: 3pt 5pt; text-align: start; vertical-align: top; }
  #printArea th { background: #eee; }
  #printArea .tri { color: #000 !important; background: none !important; border: 1pt solid #000; }
  #printArea .meta { font-size: 9pt; color: #333; }
  #printArea .chart text { fill: #000; }
  #printArea svg { max-width: 100%; }
}
</style>

'use strict';
/* =====================================================================
   Rabta — messaging when the network is down (single file, no build)
   utils · QR encoder (shared kit) · i18n · content · byte codecs ·
   identity (ECDSA P-256 signatures, ECDH → HKDF → AES-GCM) · CRDTs
   (HLC, OR-set, LWW and lifecycle registers) · store-and-forward
   routing (summary vectors, Bloom filters, four strategies) · mesh
   simulator · sync protocol · serverless WebRTC with compressed SDP
   codes · BroadcastChannel tabs and loopback self-test · FSK sound
   modem · protobuf / Meshtastic / LoRa wire formats · state, seed and
   demo village · views (chats, community SOS, boards, mesh, connect,
   sound, radio, map, identity, diagnostics, inbox, settings, about) ·
   search, tour, shortcuts, router and boot.
   Honest limits: no internet, no server. Phones must share a Wi-Fi or
   hotspot for WebRTC; demo peers are simulated in this page. Student
   extension points are listed on the About page.
   ===================================================================== */
/* ============================================================
   QR CODE ENCODER — shared FYP-templates kit (offline, no deps)
   ISO/IEC 18004 model 2: numeric, alphanumeric and byte (UTF-8)
   modes, versions 1–40, error correction L / M / Q / H,
   automatic mask selection by the standard penalty rules.
   Usage:
     const qr = QR.encode('hello', { ecc: 'M' });
     el.innerHTML = QR.toSvg(qr, { border: 4, label: 'Share code' });
   ============================================================ */
const QR = (() => {
  // Error correction levels: index into the tables and the 2-bit format value
  const ECL = {
    L: { idx: 0, bits: 1 },
    M: { idx: 1, bits: 0 },
    Q: { idx: 2, bits: 3 },
    H: { idx: 3, bits: 2 },
  };

  // Error correction codewords per block, by level then version (index 0 unused)
  const ECC_PER_BLOCK = [
    [-1, 7, 10, 15, 20, 26, 18, 20, 24, 30, 18, 20, 24, 26, 30, 22, 24, 28, 30, 28, 28, 28, 28, 30, 30, 26, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
    [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28],
    [-1, 13, 22, 18, 26, 18, 24, 18, 22, 20, 24, 28, 26, 24, 20, 30, 24, 28, 28, 26, 30, 28, 30, 30, 30, 30, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
    [-1, 17, 28, 22, 16, 22, 28, 26, 26, 24, 28, 24, 28, 22, 24, 24, 30, 28, 28, 26, 28, 30, 24, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
  ];

  // Number of error correction blocks, by level then version (index 0 unused)
  const NUM_BLOCKS = [
    [-1, 1, 1, 1, 1, 1, 2, 2, 2, 2, 4, 4, 4, 4, 4, 6, 6, 6, 6, 7, 8, 8, 9, 9, 10, 12, 12, 12, 13, 14, 15, 16, 17, 18, 19, 19, 20, 21, 22, 24, 25],
    [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49],
    [-1, 1, 1, 2, 2, 4, 4, 6, 6, 8, 8, 8, 10, 12, 16, 12, 17, 16, 18, 21, 20, 23, 23, 25, 27, 29, 34, 34, 35, 38, 40, 43, 45, 48, 51, 53, 56, 59, 62, 65, 68],
    [-1, 1, 1, 2, 4, 4, 4, 5, 6, 8, 8, 11, 11, 16, 16, 18, 16, 19, 21, 25, 25, 25, 34, 30, 32, 35, 37, 40, 42, 45, 48, 51, 54, 57, 60, 63, 66, 70, 74, 77, 81],
  ];

  const ALNUM_CHARSET = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:';

  // Mode indicator and character-count bit widths for versions 1–9, 10–26, 27–40
  const MODES = {
    numeric: { indicator: 0x1, countBits: [10, 12, 14] },
    alphanumeric: { indicator: 0x2, countBits: [9, 11, 13] },
    byte: { indicator: 0x4, countBits: [8, 16, 16] },
  };

  /* ---------- bit helpers ---------- */

  const getBit = (value, i) => ((value >>> i) & 1) !== 0;

  function appendBits(buffer, value, length) {
    for (let i = length - 1; i >= 0; i--) {
      buffer.push((value >>> i) & 1);
    }
  }

  function countBitsFor(mode, version) {
    const band = version <= 9 ? 0 : version <= 26 ? 1 : 2;
    return MODES[mode].countBits[band];
  }

  /* ---------- capacity ---------- */

  // Modules available for data + ECC after function patterns are removed
  function rawDataModules(version) {
    let result = (16 * version + 128) * version + 64;
    if (version >= 2) {
      const numAlign = Math.floor(version / 7) + 2;
      result -= (25 * numAlign - 10) * numAlign - 55;
      if (version >= 7) {
        result -= 36;
      }
    }
    return result;
  }

  function dataCodewords(version, ecl) {
    const total = Math.floor(rawDataModules(version) / 8);
    return total - ECC_PER_BLOCK[ecl.idx][version] * NUM_BLOCKS[ecl.idx][version];
  }

  /* ---------- segment encoding ---------- */

  function chooseMode(text) {
    if (/^[0-9]*$/.test(text)) {
      return 'numeric';
    }
    if ([...text].every(ch => ALNUM_CHARSET.includes(ch))) {
      return 'alphanumeric';
    }
    return 'byte';

  // Returns { mode, count, bits } where bits excludes mode and count headers
  function encodeSegment(text) {
    const mode = chooseMode(text);
    const bits = [];
    if (mode === 'numeric') {
      for (let i = 0; i < text.length; i += 3) {
        const chunk = text.slice(i, i + 3);
        appendBits(bits, parseInt(chunk, 10), chunk.length * 3 + 1);
      }
      return { mode, count: text.length, bits };
    }
    if (mode === 'alphanumeric') {
      for (let i = 0; i + 1 < text.length; i += 2) {
        const pair = ALNUM_CHARSET.indexOf(text[i]) * 45 + ALNUM_CHARSET.indexOf(text[i + 1]);
        appendBits(bits, pair, 11);
      }
      if (text.length % 2 === 1) {
        appendBits(bits, ALNUM_CHARSET.indexOf(text[text.length - 1]), 6);
      }
      return { mode, count: text.length, bits };
    }
    const bytes = new TextEncoder().encode(text);
    bytes.forEach(b => appendBits(bits, b, 8));
    return { mode, count: bytes.length, bits };
  }

  function segmentBitLength(segment, version) {
    const countBits = countBitsFor(segment.mode, version);
    if (segment.count >= (1 << countBits)) {
      return Infinity;
    }
    return 4 + countBits + segment.bits.length;
  }

  /* ---------- Reed–Solomon over GF(256), polynomial 0x11D ---------- */

  function gfMultiply(x, y) {
    let z = 0;
    for (let i = 7; i >= 0; i--) {
      z = (z << 1) ^ ((z >>> 7) * 0x11d);
      z ^= ((y >>> i) & 1) * x;
    }
    return z;
  }

  function rsDivisor(degree) {
    const result = new Array(degree - 1).fill(0);
    result.push(1);
    let root = 1;
    for (let i = 0; i < degree; i++) {
      for (let j = 0; j < result.length; j++) {
        result[j] = gfMultiply(result[j], root);
        if (j + 1 < result.length) {
          result[j] ^= result[j + 1];
        }
      }
      root = gfMultiply(root, 0x02);
    }
    return result;
  }

  function rsRemainder(data, divisor) {
    const result = divisor.map(() => 0);
    for (const b of data) {
      const factor = b ^ result.shift();
      result.push(0);
      divisor.forEach((coef, i) => {
        result[i] ^= gfMultiply(coef, factor);
      });
    }
    return result;
  }

  // Split data into blocks, append ECC to each, then interleave
  function addEccAndInterleave(data, version, ecl) {
    const numBlocks = NUM_BLOCKS[ecl.idx][version];
    const eccLen = ECC_PER_BLOCK[ecl.idx][version];
    const rawCodewords = Math.floor(rawDataModules(version) / 8);
    const numShortBlocks = numBlocks - (rawCodewords % numBlocks);
    const shortBlockLen = Math.floor(rawCodewords / numBlocks);
    const divisor = rsDivisor(eccLen);
    const blocks = [];
    for (let i = 0, k = 0; i < numBlocks; i++) {
      const dataLen = shortBlockLen - eccLen + (i < numShortBlocks ? 0 : 1);
      const block = data.slice(k, k + dataLen);
      k += dataLen;
      const ecc = rsRemainder(block, divisor);
      if (i < numShortBlocks) {
        block.push(0);
      }
      blocks.push(block.concat(ecc));
    }
    const result = [];
    for (let i = 0; i < blocks[0].length; i++) {
      blocks.forEach((block, j) => {
        // Skip the padding byte of short blocks
        if (i !== shortBlockLen - eccLen || j >= numShortBlocks) {
          result.push(block[i]);
        }
      });
    }
    return result;
  }

  /* ---------- matrix construction ---------- */

  function makeGrid(size) {
    return {
      size,
      modules: Array.from({ length: size }, () => new Array(size).fill(false)),
      isFunction: Array.from({ length: size }, () => new Array(size).fill(false)),
    };
  }

  function setFunction(grid, x, y, dark) {
    grid.modules[y][x] = dark;
    grid.isFunction[y][x] = true;
  }

  function alignmentPositions(version) {
    if (version === 1) {
      return [];
    }
    const size = version * 4 + 17;
    const numAlign = Math.floor(version / 7) + 2;
    const step = Math.floor((version * 8 + numAlign * 3 + 5) / (numAlign * 4 - 4)) * 2;
    const result = [6];
    for (let pos = size - 7; result.length < numAlign; pos -= step) {
      result.splice(1, 0, pos);
    }
    return result;
  }

  function drawFinder(grid, cx, cy) {
    for (let dy = -4; dy <= 4; dy++) {
      for (let dx = -4; dx <= 4; dx++) {
        const x = cx + dx;
        const y = cy + dy;
        if (x < 0 || y < 0 || x >= grid.size || y >= grid.size) {
          continue;
        }
        const dist = Math.max(Math.abs(dx), Math.abs(dy));
        setFunction(grid, x, y, dist !== 2 && dist !== 4);
      }
    }
  }

  function drawAlignment(grid, cx, cy) {
    for (let dy = -2; dy <= 2; dy++) {
      for (let dx = -2; dx <= 2; dx++) {
        setFunction(grid, cx + dx, cy + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
      }
    }
  }

  function drawFormatBits(grid, ecl, mask) {
    const data = (ecl.bits << 3) | mask;
    let rem = data;
    for (let i = 0; i < 10; i++) {
      rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
    }
    const bits = ((data << 10) | rem) ^ 0x5412;
    const size = grid.size;
    // Copy 1, around the top-left finder
    for (let i = 0; i <= 5; i++) {
      setFunction(grid, 8, i, getBit(bits, i));
    }
    setFunction(grid, 8, 7, getBit(bits, 6));
    setFunction(grid, 8, 8, getBit(bits, 7));
    setFunction(grid, 7, 8, getBit(bits, 8));
    for (let i = 9; i < 15; i++) {
      setFunction(grid, 14 - i, 8, getBit(bits, i));
    }
    // Copy 2, split between the top-right and bottom-left finders
    for (let i = 0; i < 8; i++) {
      setFunction(grid, size - 1 - i, 8, getBit(bits, i));
    }
    for (let i = 8; i < 15; i++) {
      setFunction(grid, 8, size - 15 + i, getBit(bits, i));
    }
    // The always-dark module
    setFunction(grid, 8, size - 8, true);
  }

  function drawVersionBits(grid, version) {
    if (version < 7) {
      return;
    }
    let rem = version;
    for (let i = 0; i < 12; i++) {
      rem = (rem << 1) ^ ((rem >>> 11) * 0x1f25);
    }
    const bits = (version << 12) | rem;
    for (let i = 0; i < 18; i++) {
      const dark = getBit(bits, i);
      const a = grid.size - 11 + (i % 3);
      const b = Math.floor(i / 3);
      setFunction(grid, a, b, dark);
      setFunction(grid, b, a, dark);
    }
  }

  function drawFunctionPatterns(grid, version, ecl) {
    const size = grid.size;
    for (let i = 0; i < size; i++) {
      setFunction(grid, 6, i, i % 2 === 0);
      setFunction(grid, i, 6, i % 2 === 0);
    }
    drawFinder(grid, 3, 3);
    drawFinder(grid, size - 4, 3);
    drawFinder(grid, 3, size - 4);
    const positions = alignmentPositions(version);
    const last = positions.length - 1;
    positions.forEach((py, i) => {
      positions.forEach((px, j) => {
        const overlapsFinder = (i === 0 && j === 0) || (i === 0 && j === last) || (i === last && j === 0);
        if (!overlapsFinder) {
          drawAlignment(grid, px, py);
        }
      });
    });
    // Reserve format areas now; real bits are drawn once the mask is chosen
    drawFormatBits(grid, ecl, 0);
    drawVersionBits(grid, version);
  }

  // Zig-zag placement of codeword bits, two columns at a time, right to left
  function drawCodewords(grid, codewords) {
    const size = grid.size;
    let i = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) {
        right = 5;
      }
      for (let vert = 0; vert < size; vert++) {
        for (let j = 0; j < 2; j++) {
          const x = right - j;
          const upward = ((right + 1) & 2) === 0;
          const y = upward ? size - 1 - vert : vert;
          if (!grid.isFunction[y][x] && i < codewords.length * 8) {
            grid.modules[y][x] = getBit(codewords[i >>> 3], 7 - (i & 7));
            i++;
          }
        }
      }
    }
  }

  const MASKS = [
    (x, y) => (x + y) % 2 === 0,
    (x, y) => y % 2 === 0,
    (x, y) => x % 3 === 0,
    (x, y) => (x + y) % 3 === 0,
    (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,
    (x, y) => ((x * y) % 2) + ((x * y) % 3) === 0,
    (x, y) => (((x * y) % 2) + ((x * y) % 3)) % 2 === 0,
    (x, y) => (((x + y) % 2) + ((x * y) % 3)) % 2 === 0,
  ];

  // XOR is its own inverse, so applying the same mask twice removes it
  function applyMask(grid, mask) {
    const test = MASKS[mask];
    for (let y = 0; y < grid.size; y++) {
      for (let x = 0; x < grid.size; x++) {
        if (!grid.isFunction[y][x] && test(x, y)) {
          grid.modules[y][x] = !grid.modules[y][x];
        }
      }
    }
  }

  /* ---------- mask penalty (rules N1–N4) ---------- */

  function linePenalty(line) {
    let score = 0;
    let runColor = line[0];
    let runLen = 1;
    for (let i = 1; i <= line.length; i++) {
      if (i < line.length && line[i] === runColor) {
        runLen++;
        continue;
      }
      if (runLen >= 5) {
        score += 3 + (runLen - 5);
      }
      runColor = line[i];
      runLen = 1;
    }
    // Finder-like 1:1:3:1:1 with four light modules on one side
    const s = line.map(v => (v ? '1' : '0')).join('');
    const patterns = ['10111010000', '00001011101'];
    patterns.forEach(p => {
      for (let at = s.indexOf(p); at !== -1; at = s.indexOf(p, at + 1)) {
        score += 40;
      }
    });
    return score;
  }

  function penaltyScore(grid) {
    const { size, modules } = grid;
    let score = 0;
    let dark = 0;
    for (let y = 0; y < size; y++) {
      score += linePenalty(modules[y]);
      score += linePenalty(modules.map(row => row[y]));
    }
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        if (modules[y][x]) {
          dark++;
        }
        if (x + 1 < size && y + 1 < size) {
          const c = modules[y][x];
          if (c === modules[y][x + 1] && c === modules[y + 1][x] && c === modules[y + 1][x + 1]) {
            score += 3;
          }
        }
      }
    }
    const percent = (dark * 100) / (size * size);
    score += Math.floor(Math.abs(percent - 50) / 5) * 10;
    return score;
  }

  /* ---------- public: encode ---------- */

  function pickVersion(segment, ecl, minVersion, maxVersion) {
    for (let v = minVersion; v <= maxVersion; v++) {
      if (segmentBitLength(segment, v) <= dataCodewords(v, ecl) * 8) {
        return v;
      }
    }
    throw new RangeError('QR: data too long for the allowed versions');
  }

  function buildCodewords(segment, version, ecl) {
    const capacityBits = dataCodewords(version, ecl) * 8;
    const bits = [];
    appendBits(bits, MODES[segment.mode].indicator, 4);
    appendBits(bits, segment.count, countBitsFor(segment.mode, version));
    segment.bits.forEach(b => bits.push(b));
    appendBits(bits, 0, Math.min(4, capacityBits - bits.length));
    appendBits(bits, 0, (8 - (bits.length % 8)) % 8);
    for (let pad = 0xec; bits.length < capacityBits; pad ^= 0xec ^ 0x11) {
      appendBits(bits, pad, 8);
    }
    const bytes = [];
    for (let i = 0; i < bits.length; i += 8) {
      bytes.push(bits.slice(i, i + 8).reduce((acc, b) => (acc << 1) | b, 0));
    }
    return bytes;
  }

  function encode(text, options = {}) {
    const { ecc = 'M', minVersion = 1, maxVersion = 40, mask = -1, boostEcc = true } = options;
    let ecl = ECL[ecc] || ECL.M;
    const segment = encodeSegment(String(text));
    const version = pickVersion(segment, ecl, minVersion, maxVersion);
    // Use a stronger level when it fits in the same version
    if (boostEcc) {
      ['M', 'Q', 'H'].forEach(name => {
        const candidate = ECL[name];
        if (candidate.idx > ecl.idx && segmentBitLength(segment, version) <= dataCodewords(version, candidate) * 8) {
          ecl = candidate;
        }
      });
    }
    const codewords = addEccAndInterleave(buildCodewords(segment, version, ecl), version, ecl);
    const grid = makeGrid(version * 4 + 17);
    drawFunctionPatterns(grid, version, ecl);
    drawCodewords(grid, codewords);
    let chosen = mask;
    if (chosen < 0) {
      let best = Infinity;
      for (let m = 0; m < 8; m++) {
        applyMask(grid, m);
        drawFormatBits(grid, ecl, m);
        const score = penaltyScore(grid);
        if (score < best) {
          best = score;
          chosen = m;
        }
        applyMask(grid, m);
      }
    }
    applyMask(grid, chosen);
    drawFormatBits(grid, ecl, chosen);
    const eccName = Object.keys(ECL).find(k => ECL[k] === ecl);
    return { version, size: grid.size, ecc: eccName, mask: chosen, mode: segment.mode, modules: grid.modules };
  }

  /* ---------- public: render ---------- */

  // One SVG path for all dark modules; scales cleanly and prints sharply
  function toSvg(input, options = {}) {
    const qr = typeof input === 'string' ? encode(input, options) : input;
    const { border = 4, dark = '#000', light = '#fff', label = 'QR code' } = options;
    const dim = qr.size + border * 2;
    const parts = [];
    for (let y = 0; y < qr.size; y++) {
      for (let x = 0; x < qr.size; x++) {
        if (qr.modules[y][x]) {
          parts.push(`M${x + border},${y + border}h1v1h-1z`);
        }
      }
    }
    const safeLabel = String(label).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${dim} ${dim}" role="img" aria-label="${safeLabel}" shape-rendering="crispEdges">`
      + `<rect width="100%" height="100%" fill="${light}"/>`
      + `<path d="${parts.join('')}" fill="${dark}"/></svg>`;
  }

  // Draw onto a canvas (for PNG download or printing at a fixed size)
  function toCanvas(input, canvas, options = {}) {
    const qr = typeof input === 'string' ? encode(input, options) : input;
    const { border = 4, scale = 8, dark = '#000', light = '#fff' } = options;
    const dim = (qr.size + border * 2) * scale;
    canvas.width = dim;
    canvas.height = dim;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = light;
    ctx.fillRect(0, 0, dim, dim);
    ctx.fillStyle = dark;
    for (let y = 0; y < qr.size; y++) {
      for (let x = 0; x < qr.size; x++) {
        if (qr.modules[y][x]) {
          ctx.fillRect((x + border) * scale, (y + border) * scale, scale, scale);
        }
      }
    }
    return canvas;
  }

  return { encode, toSvg, toCanvas };
})();

// ---------- node slot and namespaced storage ----------
// Every tab is one node. ?node=B (C, D, E) opens a second node on the same device with its own identity
// and store under rabta.B. so two tabs can talk over BroadcastChannel.
const SLOT = (/[?&]node=([A-E])/i.exec(location.search) || [])[1]?.toUpperCase() || 'A';
const NS = SLOT === 'A' ? 'rabta.' : `rabta.${SLOT}.`;
const OTHER_SLOT_RE = /^rabta\.[A-E]\./;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const store = {
  get(k, d) {
    try {
      const v = localStorage.getItem(NS + k);
      return v == null ? d : JSON.parse(v);
    } catch {
      return d;
    }
  },
  set(k, v) {
    try {
      localStorage.setItem(NS + k, JSON.stringify(v));
      return true;
    } catch {
      return false;
    }
  },
  keys() {
    const out = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith(NS) && (SLOT !== 'A' || !OTHER_SLOT_RE.test(k))) out.push(k.slice(NS.length));
      }
    } catch {
      /* storage blocked */
    }
    return out;
  },
  bytes() {
    let n = 0;
    for (const k of this.keys()) n += k.length + (localStorage.getItem(NS + k) || '').length;
    return n * 2;
  },
  clear() {
    for (const k of this.keys()) localStorage.removeItem(NS + k);
  },
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = (p = '') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const now = () => Date.now();
const later = fn => setTimeout(fn, 0);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const initials = n => String(n || '?').replace(/[^\p{L}\p{N}\s]/gu, ' ').trim().split(/\s+/).map(w => w[0] || '').slice(0, 2).join('').toUpperCase() || '?';

function debounce(fn, ms = 180) {
  let h = 0;
  return (...a) => {
    clearTimeout(h);
    h = setTimeout(() => fn(...a), ms);
  };
}

// Deterministic PRNG (mulberry32): seeded simulator runs and demo data look the same everywhere.
function rng(seed) {
  return () => {
    seed |= 0;
    seed = (seed + 0x6d2b79f5) | 0;
    let x = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

const MIN = 60000;

const fmtDT = ts => `${fmtDate(ts)} · ${fmtTime(ts)}`;

const hhmm = ts => `${pad2(new Date(ts).getHours())}:${pad2(new Date(ts).getMinutes())}`;

function ago(ts) {
  const s = Math.round((now() - ts) / 1000);
  if (s < 45) return t('justNow');
  if (s < 3600) return t('minAgo', { n: Math.max(1, Math.round(s / 60)) });

// ---------- geo maths: distance and bearing between peers ----------
const toRad = d => (d * Math.PI) / 180;
const toDeg = r => (r * 180) / Math.PI;

/** Great-circle distance in metres (haversine, mean Earth radius 6,371 km). */
function haversine(a, b) {
  const dLat = toRad(b.lat - a.lat);
  const dLng = toRad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * 6371000 * Math.asin(Math.min(1, Math.sqrt(h)));
}

/** Initial bearing from a to b in degrees clockwise from north. */
function bearing(a, b) {
  const y = Math.sin(toRad(b.lng - a.lng)) * Math.cos(toRad(b.lat));
  const x = Math.cos(toRad(a.lat)) * Math.sin(toRad(b.lat)) - Math.sin(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.cos(toRad(b.lng - a.lng));
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}
const COMPASS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
const compass = deg => t('cmp_' + COMPASS[Math.round(deg / 45) % 8]);
const fmtDist = m => (m < 1000 ? t('distM', { n: Math.round(m) }) : t('distKm', { n: (m / 1000).toFixed(m < 10000 ? 1 : 0) }));

function toast(msg, type = '') {

  el.className = 'toast ' + type;
  el.setAttribute('role', 'status');
  el.innerHTML = ic(type === 'ok' ? 'check-circle' : type === 'bad' ? 'alert-circle' : type === 'sos' ? 'siren' : 'radio') + '<span></span>';
  el.lastChild.textContent = msg;

const announce = msg => {

const calm = () => document.documentElement.classList.contains('calm') || matchMedia('(prefers-reduced-motion: reduce)').matches;

function animateIn(root) {
  if (!root) return;
  root.classList.remove('enter');
  void root.offsetWidth;
  root.classList.add('enter');
  $$('.stagger', root).forEach(g => [...g.children].forEach((el, i) => el.style.setProperty('--i', Math.min(i, 14))));
  settle(root, true);
}

// Bars, counters and chart lines animate on first render; re-renders snap to the final state.
function settle(root, animate = false) {
  requestAnimationFrame(() => $$('.bar > i[data-w]', root).forEach(b => (b.style.width = b.dataset.w + '%')));
  $$('[data-count]', root).forEach(el => (animate ? countUp(el, Number(el.dataset.count), el.dataset.dec) : (el.textContent = fmtNum(el.dataset.count, Number(el.dataset.dec || 0)))));
  if (animate) $$('path[data-draw], polyline[data-draw]', root).forEach(drawPath);
}

function countUp(el, to, dec = 0) {
  const d = Number(dec || 0);
  if (calm()) {
    el.textContent = fmtNum(to, d);
    return;
  }
  const t0 = performance.now();
  const step = ts => {
    const p = Math.min(1, (ts - t0) / 700);
    el.textContent = fmtNum(to * (1 - Math.pow(1 - p, 3)), d);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function drawPath(p) {
  if (calm() || !p.getTotalLength) return;
  const L = p.getTotalLength();
  p.style.strokeDasharray = L;
  p.style.strokeDashoffset = L;
  p.getBoundingClientRect();
  p.style.transition = 'stroke-dashoffset .9s var(--ease)';
  p.style.strokeDashoffset = 0;
}

function askConfirm(msg, { okText = t('confirm'), danger = false, icon = 'help', typed = '' } = {}) {
  return new Promise(resolve => {
    let answered = false;
    const finish = v => {
      if (answered) return;
      answered = true;
      resolve(v);
    };
    const typedHtml = typed ? `<label class="field mt"><span>${t('typeToConfirm', { w: typed })}</span><input id="cfTyped" autocomplete="off" class="mono"></label>` : '';
    const sh = openModal(`${sheetHead(t('areYouSure'), icon)}<p>${msg}</p>${typedHtml}
      <div class="sfoot"><button class="btn ghost" type="button" data-close>${t('cancel')}</button>
      <button class="btn ${danger ? 'sos' : 'go'}" type="button" id="cfOk">${okText}</button></div>`, { onClose: () => finish(false) });
    $('#cfOk', sh).onclick = () => {
      if (typed && $('#cfTyped', sh).value.trim().toUpperCase() !== typed) {
        $('#cfTyped', sh).closest('.field').classList.add('bad');
        return;
      }
      finish(true);
      closeModal();
    };
  });
}

function printDoc(html) {

  window.print();

function downloadFile(name, text, mime = 'application/json') {
  const url = URL.createObjectURL(new Blob([text], { type: mime }));
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function pickFile(accept, cb, asText = true) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = accept;
  inp.onchange = () => inp.files[0] && (asText ? inp.files[0].text().then(cb) : cb(inp.files[0]));
  inp.click();
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast(t('copied'), 'ok');
  } catch {
    toast(t('copyFailed'), 'bad');
  }
}

/** Shrink a photo to a small JPEG data URL (mesh links are slow; every kilobyte is copied hop by hop). */
function compressImage(file, maxSide = 360, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => reject(new Error('image'));
    img.src = url;
  });
}

// ---------- byte codecs: UTF-8, hex, base64url, base32, CRC-16, byte reader/writer ----------
const UTF8_ENC = new TextEncoder();
const UTF8_DEC = new TextDecoder();
const utf8 = s => UTF8_ENC.encode(String(s));
const fromUtf8 = b => UTF8_DEC.decode(b);
const byteLen = s => utf8(s).length;
const toHex = b => Array.from(b, x => x.toString(16).padStart(2, '0')).join('');

function fromHex(h) {
  const clean = String(h).replace(/[^0-9a-f]/gi, '');
  const out = new Uint8Array(clean.length >> 1);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(clean.substr(i * 2, 2), 16);
  return out;
}

function randomBytes(n) {
  const b = new Uint8Array(n);
  crypto.getRandomValues(b);
  return b;
}
const randomHex = n => toHex(randomBytes(n));

function b64u(bytes) {
  let s = '';
  for (const b of bytes) s += String.fromCharCode(b);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function fromB64u(str) {
  const s = String(str).replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(s + '='.repeat((4 - (s.length % 4)) % 4));
  return Uint8Array.from(bin, c => c.charCodeAt(0));
}

function concatBytes(...parts) {
  const out = new Uint8Array(parts.reduce((n, p) => n + p.length, 0));
  let o = 0;
  for (const p of parts) {
    out.set(p, o);
    o += p.length;
  }
  return out;
}

// RFC 4648 base32: only A–Z and 2–7, so a code survives being read aloud, retyped in
// lower case or pasted into a chat app, and fits the QR alphanumeric mode (5.5 bits a char).
const B32 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';

function base32(bytes) {
  let out = '';
  let acc = 0;
  let bits = 0;
  for (const b of bytes) {
    acc = (acc << 8) | b;
    bits += 8;
    while (bits >= 5) {
      out += B32[(acc >>> (bits - 5)) & 31];
      bits -= 5;
    }
  }
  if (bits > 0) out += B32[(acc << (5 - bits)) & 31];
  return out;
}

// Lenient decoder: ignores spaces and hyphens, accepts lower case, maps 0/1/8 typos to O/I/B.
function fromBase32(str) {
  const clean = String(str).toUpperCase().replace(/0/g, 'O').replace(/1/g, 'I').replace(/8/g, 'B').replace(/[^A-Z2-7]/g, '');
  const out = [];
  let acc = 0;
  let bits = 0;
  for (const ch of clean) {
    acc = ((acc << 5) | B32.indexOf(ch)) & 0xffff;
    bits += 5;
    if (bits >= 8) {
      out.push((acc >>> (bits - 8)) & 255);
      bits -= 8;
    }
  }
  return Uint8Array.from(out);
}
const groupCode = (s, n = 4) => s.match(new RegExp(`.{1,${n}}`, 'g')).join('-');

// CRC-16/CCITT-FALSE (poly 0x1021, init 0xFFFF): used by connection codes and the sound modem.
function crc16(bytes) {
  let crc = 0xffff;
  for (const b of bytes) {
    crc ^= b << 8;

// Growable big-endian byte writer for compact wire formats (SDP codes, LoRa frames).
class ByteWriter {
  constructor() {
    this.a = [];

  u8(v) {
    this.a.push(v & 255);
    return this;
  }
  u16(v) {
    return this.u8(v >>> 8).u8(v);
  }
  u32(v) {
    return this.u16(v >>> 16).u16(v & 0xffff);
  }
  bytes(b) {
    for (const x of b) this.a.push(x);
    return this;
  }
  str(s) {
    const b = utf8(s).slice(0, 255);
    return this.u8(b.length).bytes(b);
  }
  out() {
    return Uint8Array.from(this.a);
  }
}

class ByteReader {
  constructor(bytes) {
    this.b = bytes;
    this.p = 0;
  }
  need(n) {
    if (this.p + n > this.b.length) throw new Error('short');
  }
  u8() {
    this.need(1);
    return this.b[this.p++];
  }
  u16() {
    return (this.u8() << 8) | this.u8();
  }
  u32() {
    return ((this.u16() << 16) | this.u16()) >>> 0;
  }
  bytes(n) {
    this.need(n);
    const out = this.b.slice(this.p, this.p + n);
    this.p += n;
    return out;
  }
  str() {
    return fromUtf8(this.bytes(this.u8()));
  }
  get left() {
    return this.b.length - this.p;
  }

/** Canonical JSON: object keys sorted, so equal states serialise identically (CRDT tests, digests). */

  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
  return JSON.stringify(v ?? null);
}

async function sha256(bytes) {

// ---------- identity and security: ECDSA P-256 signatures, ECDH → HKDF → AES-GCM for direct chats ----------
const HAS_CRYPTO = !!(window.crypto && crypto.subtle);

// P-256 curve constants for SEC1 point compression (33-byte public keys instead of 65).
const P256_P = 0xffffffff00000001000000000000000000000000ffffffffffffffffffffffffn;
const P256_B = 0x5ac635d8aa3a93e7b3ebbd55769886bc651d06b0cc53b0f63bce3c3e27d2604bn;

function modPow(base, exp, mod) {
  let r = 1n;
  let b = base % mod;
  let e = exp;
  while (e > 0n) {
    if (e & 1n) r = (r * b) % mod;
    b = (b * b) % mod;
    e >>= 1n;
  }
  return r;
}

const bigToBytes = (n, len = 32) => fromHex(n.toString(16).padStart(len * 2, '0'));

function compressPoint(raw) {
  const out = new Uint8Array(33);
  out[0] = raw[64] & 1 ? 3 : 2;
  out.set(raw.slice(1, 33), 1);
  return out;
}

// y² = x³ − 3x + b (mod p); p ≡ 3 (mod 4) so √a = a^((p+1)/4).
function decompressPoint(c) {
  const x = bytesToBig(c.slice(1));
  const rhs = (((x * x * x - 3n * x + P256_B) % P256_P) + P256_P) % P256_P;
  let y = modPow(rhs, (P256_P + 1n) / 4n, P256_P);
  if ((y & 1n) !== BigInt(c[0] & 1)) y = P256_P - y;
  return concatBytes(Uint8Array.of(4), bigToBytes(x), bigToBytes(y));
}

// TODO(student): keep the private keys as non-extractable CryptoKeys in IndexedDB instead of JWK in

async function newIdentity(name) {

const PUB_CACHE = new Map();

async function importPub(b64, alg = ECDSA) {

// The signed bytes: every field a relay cannot change. The hop path is added per copy and is not signed.
const SIGNED_FIELDS = ['v', 'id', 'kind', 'ch', 'from', 'name', 'to', 'ts', 'exp', 'hl', 'prio', 'body', 'enc'];
const signedBytes = m => utf8(JSON.stringify(SIGNED_FIELDS.map(f => m[f] ?? null)));

async function signMsg(m, keys) {

  m.sig = b64u(new Uint8Array(sig));
  return m;
}

/** 'ok' | 'bad' (forged, altered or key does not match the sender id) | 'none' (unsigned). */
async function verifyMsg(m) {
  if (!m.sig || !m.pk) return 'none';
  try {
    if ((await idFromPub(m.pk)) !== m.from) return 'bad';
    const key = await importPub(m.pk);
    return (await crypto.subtle.verify(SIG_ALG, key, fromB64u(m.sig), signedBytes(m))) ? 'ok' : 'bad';
  } catch {
    return 'bad';
  }
}

// ---------- end-to-end encryption for direct chats ----------
// Static ECDH between the two devices' keys, then HKDF-SHA-256 with the message id as salt, so
// every message gets its own AES-GCM key.
// TODO(student): add forward secrecy (ephemeral keys per session or a Double Ratchet), so a stolen
// phone cannot decrypt old traffic captured by a relay.
const SHARED_CACHE = new Map();

async function sharedSecret(keys, theirDh) {
  if (!SHARED_CACHE.has(theirDh)) {
    const pub = await importPub(theirDh, ECDH);
    const bits = await crypto.subtle.deriveBits({ name: 'ECDH', public: pub }, keys.dh, 256);
    SHARED_CACHE.set(theirDh, await crypto.subtle.importKey('raw', bits, 'HKDF', false, ['deriveKey']));
  }
  return SHARED_CACHE.get(theirDh);
}

async function dmKey(keys, theirDh, msgId) {
  const base = await sharedSecret(keys, theirDh);
  const params = { name: 'HKDF', hash: 'SHA-256', salt: utf8(msgId), info: utf8('rabta-dm-v1') };
  return crypto.subtle.deriveKey(params, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}

async function encryptBody(body, keys, theirDh, msgId) {
  const iv = randomBytes(12);
  const key = await dmKey(keys, theirDh, msgId);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, utf8(JSON.stringify(body)));
  return { iv: b64u(iv), ct: b64u(new Uint8Array(ct)) };
}

async function decryptBody(enc, keys, theirDh, msgId) {
  const key = await dmKey(keys, theirDh, msgId);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64u(enc.iv) }, key, fromB64u(enc.ct));
  return JSON.parse(fromUtf8(new Uint8Array(pt)));
}

// ---------- CRDTs for the shared boards: hybrid logical clock, OR-set, LWW registers ----------
// HLC timestamp string "lllllllll.cccc.node": wall-clock ms in base 36 (9 chars), a counter (4 chars)
// and the node id. Plain string comparison orders events; the node id breaks ties deterministically.
const HLC_MAX_DRIFT = 36e5;
const hlcPack = (l, c, n) => l.toString(36).padStart(9, '0') + '.' + c.toString(36).padStart(4, '0') + '.' + n;

function hlcParse(s) {

  return { l: parseInt(l, 36) || 0, c: parseInt(c, 36) || 0, n: n || '' };
}

class Hlc {
  constructor(node, last = '') {
    const p = last ? hlcParse(last) : { l: 0, c: 0 };
    this.node = node;
    this.l = p.l;
    this.c = p.c;
  }
  // Local event or send: physical time if it moved forward, otherwise bump the counter.
  now(wall = Date.now()) {
    if (wall > this.l) {
      this.l = wall;
      this.c = 0;
    } else {
      this.c++;
    }
    return this.pack();
  }
  // Receive: never go backwards, and stay ahead of the remote stamp. Remote clocks more than an hour
  // in the future are ignored so one phone with a wrong date cannot drag every replica forward.
  recv(remote, wall = Date.now()) {
    const r = hlcParse(remote);
    if (r.l - wall > HLC_MAX_DRIFT) return this.now(wall);
    const l = Math.max(this.l, r.l, wall);
    if (l === this.l && l === r.l) this.c = Math.max(this.c, r.c) + 1;
    else if (l === this.l) this.c++;
    else if (l === r.l) this.c = r.c + 1;
    else this.c = 0;
    this.l = l;
    return this.pack();
  }
  pack() {
    return hlcPack(this.l, this.c, this.node);
  }
}

// ---------- observed-remove set: { a: { elem: { tag: 1 } }, r: { tag: 1 } } ----------
// Every add carries a unique tag; a remove tombstones only the tags it has seen, so a concurrent
// add of the same element survives (add wins).
const orNew = () => ({ a: {}, r: {} });
const orLive = (set, elem) => Object.keys(set.a[elem] || {}).filter(tag => !set.r[tag]);
const orHas = (set, elem) => orLive(set, elem).length > 0;

const orAddDelta = (elem, tag) => ({ a: { [elem]: { [tag]: 1 } }, r: {} });

function orRemoveDelta(set, elem) {
  const r = {};
  for (const tag of orLive(set, elem)) r[tag] = 1;
  return { a: {}, r };
}

function orMerge(x, y) {
  const a = {};
  for (const src of [x.a, y.a]) {
    for (const e of Object.keys(src)) a[e] = Object.assign(a[e] || {}, src[e]);
  }
  return { a, r: Object.assign({}, x.r, y.r) };
}

// ---------- last-writer-wins register: { v, t, h, o } ----------
// t is the HLC of the write; h lists the stamps it overwrote (up to 6), so the inspector can tell a
// later edit (sequential) from two edits made without seeing each other (concurrent).
// o is an optional order key compared before t: the SOS lifecycle uses it so that "resolved" can never
// be undone by a late "acknowledged" (a max-register over epoch.rank; reopening starts a new epoch).
const lwwWrite = (prev, v, t) => ({ v, t, h: prev ? [prev.t, ...(prev.h || [])].slice(0, 6) : [] });
const regKey = r => (r.o || '') + '|' + r.t;

function lwwMerge(x, y) {
  if (!x) return y;
  if (!y) return x;
  return regKey(y) > regKey(x) ? y : x;
}
const lwwConcurrent = (x, y) => x.t !== y.t && !(y.h || []).includes(x.t) && !(x.h || []).includes(y.t);

const LIFECYCLE = ['open', 'acknowledged', 'enroute', 'resolved'];

/** Lifecycle write: moves forward within an epoch; reopen=true starts the next epoch at "open". */
function lifecycleWrite(prev, status, t, reopen = false) {
  const epoch = (prev ? parseInt(String(prev.o).split('.')[0], 36) || 0 : 0) + (reopen ? 1 : 0);
  const reg = lwwWrite(prev, status, t);
  reg.o = epoch.toString(36).padStart(4, '0') + '.' + LIFECYCLE.indexOf(status);
  return reg;
}

// ---------- board document = OR-set of item ids + an LWW register per field ----------
const boardNew = () => ({ items: orNew(), f: {} });

function mergeFields(fx, fy, item, conflicts) {
  const out = {};
  for (const k of new Set([...Object.keys(fx), ...Object.keys(fy)])) {
    const a = fx[k];
    const b = fy[k];
    const win = lwwMerge(a, b);
    if (conflicts && a && b && lwwConcurrent(a, b) && canon(a.v) !== canon(b.v)) {
      conflicts.push({ item, field: k, win, lose: win === a ? b : a });
    }
    out[k] = win;
  }
  return out;
}

/** Join of two board states: commutative, associative and idempotent (checked by the behaviour test). */
function boardMerge(x, y, conflicts = null) {
  const f = {};
  for (const id of new Set([...Object.keys(x.f), ...Object.keys(y.f)])) {
    f[id] = mergeFields(x.f[id] || {}, y.f[id] || {}, id, conflicts);
  }
  return { items: orMerge(x.items, y.items), f };
}

// Local edits return a delta (a small state); applying a delta is just a merge, so deltas can travel
// through store-and-forward in any order, any number of times.
function boardAddDelta(board, clock, id, fields) {
  const delta = { items: orAddDelta(id, clock.now()), f: { [id]: {} } };
  for (const [k, v] of Object.entries(fields)) delta.f[id][k] = lwwWrite(board.f[id]?.[k], v, clock.now());
  return delta;
}

function boardSetDelta(board, clock, id, fields) {
  const delta = { items: orNew(), f: { [id]: {} } };
  for (const [k, v] of Object.entries(fields)) delta.f[id][k] = lwwWrite(board.f[id]?.[k], v, clock.now());
  return delta;
}

// Incidents keep their lifecycle in the "life" field (a max-register), separate from ordinary LWW fields.
function boardLifeDelta(board, clock, id, status, reopen = false) {
  return { items: orNew(), f: { [id]: { life: lifecycleWrite(board.f[id]?.life, status, clock.now(), reopen) } } };
}
const boardRemoveDelta = (board, id) => ({ items: orRemoveDelta(board.items, id), f: {} });

function boardItems(board) {
  return orValues(board.items).map(id => {
    const item = { id, _t: {}, _by: {} };
    for (const [k, reg] of Object.entries(board.f[id] || {})) {
      item[k] = reg.v;
      item._t[k] = reg.t;
      item._by[k] = hlcParse(reg.t).n;
    }
    return item;

const boardDigest = board => fnv1a(canon(board)).toString(36);
const latestStamp = board => Object.values(board.f).flatMap(fs => Object.values(fs).map(r => r.t)).sort().pop() || '';

// ---------- store-and-forward routing (shared by real nodes, the demo village and the simulator) ----------
// node:  { id, store: Map(msgId → entry), seen: Map(msgId → until), cap, keepExpired, stats, sentTo: Map(peerId → Set(msgId)) }
// entry: { m: message, path: [origin, …, this node], rx: time stored, copies: spray-and-wait budget }
// ver counts store changes: if neither side changed since two nodes last synced, there is nothing to send.
const PRIO_SOS = 2;
const SV_LIST_MAX = 200;

function newNode(id, { cap = 2000, keepExpired = true } = {}) {
  return { id, store: new Map(), seen: new Map(), cap, keepExpired, ver: 0, sentTo: new Map(), stats: { stored: 0, dup: 0, expired: 0, hop: 0, evicted: 0 } };
}

const isExpired = (m, at) => !!m.exp && at > m.exp;

/** Accept one copy into a node's store. Duplicates are refused by id, so a message is never stored twice. */
function storeAccept(node, m, path, at, copies = 1) {
  if (node.store.has(m.id) || node.seen.has(m.id)) {
    node.stats.dup++;
    return 'dup';
  }
  if (isExpired(m, at)) {
    node.stats.expired++;
    return 'expired';
  }
  if (path.length - 1 > m.hl) {
    node.stats.hop++;
    return 'hoplimit';
  }
  node.store.set(m.id, { m, path, rx: at, copies });
  node.stats.stored++;
  node.ver++;
  if (node.store.size > node.cap) evictOne(node, at);
  return 'stored';
}

// Buffer full: drop the lowest-priority, oldest message (never an SOS while another candidate exists).
function evictOne(node, at) {
  let worst = null;
  for (const e of node.store.values()) {
    if (!worst || e.m.prio < worst.m.prio || (e.m.prio === worst.m.prio && e.m.ts < worst.m.ts)) worst = e;
  }
  node.store.delete(worst.m.id);
  node.seen.set(worst.m.id, worst.m.exp || at + 864e5);
  node.ver++;
  node.stats.evicted++;

// Expired copies stop travelling. The simulator drops them; a phone keeps them as chat history.
function storePurge(node, at) {
  for (const [id, e] of node.store) {
    if (!isExpired(e.m, at) || node.keepExpired) continue;
    node.store.delete(id);
    node.seen.set(id, at + 864e5);
    node.ver++;
  }
  for (const [id, until] of node.seen) if (until < at) node.seen.delete(id);

// ---------- Bloom filter summary vectors (for stores larger than SV_LIST_MAX ids) ----------
// m = −n·ln p / (ln 2)², k = (m / n)·ln 2. A fresh salt per exchange means a false positive that hides a
// message from one encounter is unlikely to hide it again at the next.
function bloomFor(ids, fp = 0.01, salt = (Math.random() * 2 ** 31) | 0) {
  const n = Math.max(1, ids.length);
  const m = Math.ceil((-n * Math.log(fp)) / Math.LN2 ** 2);
  const bf = { m, k: Math.max(1, Math.round((m / n) * Math.LN2)), s: salt, bits: new Uint8Array(Math.ceil(m / 8)) };
  ids.forEach(id => bloomAdd(bf, id));
  return bf;
}

function bloomPositions(bf, id) {
  const h1 = fnv1a(id, 0x811c9dc5 ^ bf.s);
  const h2 = (fnv1a(id, 0x01000193 ^ bf.s) | 1) >>> 0;
  const out = [];
  for (let i = 0; i < bf.k; i++) out.push((h1 + i * h2) % bf.m);
  return out;
}

  for (const p of bloomPositions(bf, id)) bf.bits[p >> 3] |= 1 << (p & 7);

/** What a node advertises when it meets a peer: the ids it holds or refuses, as a list or a Bloom filter. */
function summaryOf(node) {
  const ids = [...node.store.keys(), ...node.seen.keys()];
  return ids.length <= SV_LIST_MAX ? { ids } : { bloom: bloomWire(bloomFor(ids)) };

function peerView(id, summary) {
  const view = { id, has: new Set(summary?.ids || []), bloom: null };
  if (summary?.bloom) view.bloom = bloomUnwire(summary.bloom);
  return view;
}
