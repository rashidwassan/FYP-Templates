// ---------- signal maths: Goertzel tone detection, levels, image sharpness, IMEI checks (pure, testable) ----------

/** Goertzel power of one frequency in a block of samples, with a Hann window to limit leakage. */
function goertzelPower(samples, freq, fs) {
  const n = samples.length;
  const w = (2 * Math.PI * freq) / fs;
  const coeff = 2 * Math.cos(w);
  let s1 = 0;
  let s2 = 0;
  for (let i = 0; i < n; i++) {
    const win = 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (n - 1));
    const s0 = samples[i] * win + coeff * s1 - s2;
    s2 = s1;
    s1 = s0;
  }
  return (s1 * s1 + s2 * s2 - coeff * s1 * s2) / (n * n);
}

/** Tone-to-neighbour ratio in dB: target bin against bins 300–500 Hz either side. */
function toneSnrDb(samples, freq, fs) {
  const target = goertzelPower(samples, freq, fs);
  const refs = [-500, -380, 380, 500].map(d => goertzelPower(samples, freq + d, fs));
  const noise = sum(refs) / refs.length + 1e-14;
  return 10 * Math.log10(target / noise + 1e-12);
}

const rmsDb = samples => {
  let s = 0;
  for (let i = 0; i < samples.length; i++) s += samples[i] * samples[i];
  return 20 * Math.log10(Math.sqrt(s / samples.length) + 1e-9);
};

const peakDb = samples => {
  let p = 0;
  for (let i = 0; i < samples.length; i++) p = Math.max(p, Math.abs(samples[i]));
  return 20 * Math.log10(p + 1e-9);
};

/** Synthetic test signal: sine of freq Hz + white noise (deterministic), used by the offline loopback self-test. */
function synthTone(freq, fs, n, { amp = 0.3, noise = 0.05, seed = 7 } = {}) {
  const r = rng(seed);
  const out = new Float32Array(n);
  for (let i = 0; i < n; i++) out[i] = amp * Math.sin((2 * Math.PI * freq * i) / fs) + noise * (r() * 2 - 1);
  return out;
}

/** Decide whether a tone was heard: enough frames above the SNR threshold during the tone, few before it. */
function loopbackVerdict(frames, { threshold = 12, minHits = 3 } = {}) {
  const during = frames.filter(f => f.phase === 'tone');
  const before = frames.filter(f => f.phase === 'quiet');
  const hits = during.filter(f => f.snr >= threshold).length;
  const falseHits = before.filter(f => f.snr >= threshold).length;
  const best = during.length ? Math.max(...during.map(f => f.snr)) : -99;
  return { heard: hits >= minHits && falseHits < Math.max(2, before.length / 3), hits, falseHits, best };
}

// ---------- images: grey conversion, variance of the Laplacian (sharpness), exposure ----------
function toGray(data, w, h) {
  const g = new Float32Array(w * h);
  for (let i = 0, p = 0; i < g.length; i++, p += 4) g[i] = 0.299 * data[p] + 0.587 * data[p + 1] + 0.114 * data[p + 2];
  return g;
}

/** Variance of the 4-neighbour Laplacian: high for crisp edges, low for blur, smudged lenses or a failed focus motor. */
function laplacianVariance(gray, w, h) {
  let s = 0;
  let s2 = 0;
  let n = 0;
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      const lap = gray[i - w] + gray[i + w] + gray[i - 1] + gray[i + 1] - 4 * gray[i];
      s += lap;
      s2 += lap * lap;
      n++;
    }
  }
  if (!n) return 0;
  const mean = s / n;
  return s2 / n - mean * mean;
}

/** Mean brightness, clipped shadows / highlights, a 32-bin histogram and the average colour cast. */
function exposureStats(data) {
  const hist = new Array(32).fill(0);
  let lum = 0;
  let lo = 0;
  let hi = 0;
  const rgb = [0, 0, 0];
  const n = data.length / 4;
  for (let p = 0; p < data.length; p += 4) {
    const y = 0.299 * data[p] + 0.587 * data[p + 1] + 0.114 * data[p + 2];
    lum += y;
    hist[Math.min(31, y >> 3)]++;
    if (y < 12) lo++;
    if (y > 243) hi++;
    rgb[0] += data[p];
    rgb[1] += data[p + 1];
    rgb[2] += data[p + 2];
  }
  const m = rgb.map(v => v / n);
  const avg = (m[0] + m[1] + m[2]) / 3;
  return { mean: lum / n, clipLow: (lo / n) * 100, clipHigh: (hi / n) * 100, hist, cast: m.map(v => v - avg) };
}

/** Frame-interval list (ms) → refresh rate, snapped to the common panel rates. */
function refreshFromIntervals(intervals) {
  const ok = intervals.filter(d => d > 2 && d < 60);
  if (ok.length < 10) return 0;
  const hz = 1000 / median(ok);
  const rates = [30, 48, 60, 75, 90, 100, 120, 144, 165, 240];
  const snap = rates.reduce((b, r) => (Math.abs(r - hz) < Math.abs(b - hz) ? r : b), 60);
  return Math.abs(snap - hz) / snap < 0.08 ? snap : Math.round(hz);
}

// ---------- IMEI: Luhn check digit, TAC and reporting body ----------
function luhnCheckDigit(body) {
  let s = 0;
  for (let i = 0; i < body.length; i++) {
    let d = Number(body[body.length - 1 - i]);
    if (i % 2 === 0) {
      d *= 2;
      if (d > 9) d -= 9;
    }
    s += d;
  }
  return (10 - (s % 10)) % 10;
}

const luhnValid = imei => /^\d{15}$/.test(imei) && luhnCheckDigit(imei.slice(0, 14)) === Number(imei[14]);

function imeiInfo(raw) {
  const imei = String(raw || '').replace(/[\s-]/g, '');
  const info = { imei, digits: /^\d+$/.test(imei) ? imei.length : 0, ok15: /^\d{15}$/.test(imei), luhn: false, expected: null, tac: '', rbi: '', rbiName: null, tacEntry: null };
  if (/^\d{14,15}$/.test(imei)) info.expected = luhnCheckDigit(imei.slice(0, 14));
  if (info.ok15) info.luhn = luhnValid(imei);
  if (imei.length >= 8) {
    info.tac = imei.slice(0, 8);
    info.tacEntry = TAC_TABLE[info.tac] || null;
  }
  if (imei.length >= 2) {
    info.rbi = imei.slice(0, 2);
    info.rbiName = RBI[info.rbi] || null;
  }
  return info;
}

/** Dual-SIM phones usually have IMEI 2 = IMEI 1 with a small serial offset and the same TAC. */
function imeiPairNote(a, b) {
  if (!luhnValid(a) || !luhnValid(b)) return '';
  if (a === b) return 'same';
  if (a.slice(0, 8) !== b.slice(0, 8)) return 'diffTac';
  const d = Math.abs(Number(a.slice(8, 14)) - Number(b.slice(8, 14)));
  return d <= 10 ? 'close' : 'far';
}

// ---------- benchmarks: CPU in Web Workers (hashing, sorting, matrix maths) and a WebGL fill-rate test ----------
// The worker source is a plain string so it runs from a Blob URL (works from file://). The same code runs on the
// main thread when workers are blocked.
const WORKER_SRC = `
function hashTask(passes) {
  const buf = new Uint8Array(1 << 20);
  for (let i = 0; i < buf.length; i++) buf[i] = (Math.imul(i, 2654435761) >>> 24) & 255;
  let h = 0x811c9dc5;
  for (let r = 0; r < passes; r++) {
    for (let i = 0; i < buf.length; i++) {
      h ^= buf[i];
      h = Math.imul(h, 16777619);
    }
    buf[r & 1023] ^= h & 255;
  }
  return h >>> 0;
}
function sortTask(n) {
  let s = 12345;
  const a = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    s = (Math.imul(s, 1103515245) + 12345) | 0;
    a[i] = s;
  }
  a.sort();
  return a[n >> 1];
}
function matTask(n, reps) {
  const A = new Float64Array(n * n);
  const B = new Float64Array(n * n);
  const C = new Float64Array(n * n);
  for (let i = 0; i < n * n; i++) {
    A[i] = (i % 7) * 0.5;
    B[i] = (i % 5) * 0.25;
  }
  for (let r = 0; r < reps; r++) {
    for (let i = 0; i < n; i++) {
      for (let k = 0; k < n; k++) {
        const aik = A[i * n + k];
        for (let j = 0; j < n; j++) C[i * n + j] += aik * B[k * n + j];
      }
    }
  }
  return C[0];
}
function runAll(w) {
  const out = {};
  let t = performance.now();
  hashTask(w.hash);
  out.hash = performance.now() - t;
  t = performance.now();
  sortTask(w.sort);
  out.sort = performance.now() - t;
  t = performance.now();
  matTask(w.mat, w.matReps);
  out.mat = performance.now() - t;
  return out;
}
if (typeof WorkerGlobalScope !== 'undefined') self.onmessage = e => self.postMessage(runAll(e.data));
`;

// Workload and the reference time (ms) that scores 1000 points per task (calibrated as "a typical mid-range phone").
const BENCH_WORK = { hash: 24, sort: 400000, mat: 160, matReps: 3 };
const BENCH_BASE_MS = { hash: 150, sort: 210, mat: 95 };

let mainThreadBench = null;

function benchScore(times) {
  const parts = Object.keys(BENCH_BASE_MS).map(k => BENCH_BASE_MS[k] / Math.max(times[k], 0.5));
  return Math.round(1000 * Math.pow(parts.reduce((a, b) => a * b, 1), 1 / parts.length));
}

function spawnWorker() {
  const url = URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' }));
  const w = new Worker(url);
  w.cleanup = () => {
    w.terminate();
    URL.revokeObjectURL(url);
  };
  return w;
}

function workerRun(w) {
  return new Promise((resolve, reject) => {
    w.onmessage = e => resolve(e.data);
    w.onerror = e => reject(e);
    w.postMessage(BENCH_WORK);
  });
}

async function runOnMain() {
  if (!mainThreadBench) mainThreadBench = new Function(WORKER_SRC + '; return runAll;')();
  await sleep(20);
  return mainThreadBench(BENCH_WORK);
}

/** Single-thread score (best of rounds), then all cores in parallel. Reports progress 0..1. */
async function runCpuBench({ rounds = 3, onProgress = () => {} } = {}) {
  const threads = clamp(navigator.hardwareConcurrency || 4, 1, 8);
  let useWorkers = typeof Worker !== 'undefined';
  let best = null;
  for (let r = 0; r < rounds; r++) {
    let times;
    try {
      if (!useWorkers) throw new Error('no workers');
      const w = spawnWorker();
      times = await workerRun(w);
      w.cleanup();
    } catch {
      useWorkers = false;
      times = await runOnMain();
    }
    if (!best || benchScore(times) > benchScore(best)) best = times;
    onProgress((r + 1) / (rounds + 1));
  }
  const single = benchScore(best);
  let multi = single;
  if (useWorkers && threads > 1) {
    const pool = Array.from({ length: threads }, spawnWorker);
    const all = await Promise.all(pool.map(workerRun));
    pool.forEach(w => w.cleanup());
    multi = sum(all.map(benchScore));
  }
  onProgress(1);
  return { single, multi, threads: useWorkers ? threads : 1, workers: useWorkers, times: best };
}

// ---------- WebGL: shade a 512×512 target with a heavy fragment shader, synchronising with readPixels ----------
const GL_VS = 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }';
const GL_FS = `precision mediump float; uniform float u;
void main(){ vec2 q = gl_FragCoord.xy / 512.0; float a = 0.0;
for (int i = 0; i < 48; i++) { a += sin(q.x * 13.0 + float(i) * 0.7 + u) * cos(q.y * 11.0 - float(i) * 0.3); q = q.yx * 1.01 + 0.002; }
gl_FragColor = vec4(fract(a), q, 1.0); }`;

function glProgram(gl) {
  const sh = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, GL_VS));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, GL_FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return null;
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  return prog;
}

function glInfo(gl) {
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  return {
    renderer: String(dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)),
    vendor: String(dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR)),
    maxTex: gl.getParameter(gl.MAX_TEXTURE_SIZE),
  };
}

async function runGpuBench({ ms = 1400, onProgress = () => {} } = {}) {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const gl = c.getContext('webgl', { antialias: false, powerPreference: 'high-performance' }) || c.getContext('experimental-webgl');
  if (!gl) return { ok: false };
  const info = glInfo(gl);
  const prog = glProgram(gl);
  if (!prog) return { ok: false, ...info };
  const uLoc = gl.getUniformLocation(prog, 'u');
  const px = new Uint8Array(4);
  const t0 = performance.now();
  let draws = 0;
  while (performance.now() - t0 < ms) {
    for (let k = 0; k < 4; k++) {
      gl.uniform1f(uLoc, draws * 0.01);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      draws++;
    }
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    onProgress((performance.now() - t0) / ms);
    await sleep(0);
  }
  const elapsed = performance.now() - t0;
  const mpixPerSec = (draws * 512 * 512) / elapsed / 1000;
  gl.getExtension('WEBGL_lose_context')?.loseContext();
  // 1000 points ≈ 600 Mpix/s of this shader (illustrative calibration).
  return { ok: true, ...info, draws, elapsed, mpix: mpixPerSec, score: Math.round((mpixPerSec / 600) * 1000) };
}

// ---------- spec comparison against the claimed model ----------
const GPU_FAMILIES = [['adreno', 'adreno'], ['mali', 'mali'], ['immortalis', 'mali'], ['powervr', 'powervr'], ['apple', 'apple'],
  ['xclipse', 'xclipse'], ['intel', 'desktop'], ['nvidia', 'desktop'], ['geforce', 'desktop'], ['radeon', 'desktop'], ['swiftshader', 'software'], ['llvmpipe', 'software']];
const gpuFamily = s => (GPU_FAMILIES.find(([k]) => String(s || '').toLowerCase().includes(k)) || [null, null])[1];

function ratioStatus(r) {
  if (r == null || !isFinite(r)) return 'unknown';
  if (r >= 0.6) return 'match';
  return r >= 0.35 ? 'warn' : 'mismatch';
}

/** Compare what this browser measured with the reference row of the claimed model. */
function compareSpecs(m, rd) {
  if (!m) return [];
  // TODO(student): replace the illustrative cpuRef / gpuRef with medians and spreads crowd-sourced from known-good phones.
  const rows = [];
  const add = (k, claimed, measured, st) => rows.push({ k, claimed, measured, st });
  const cores = rd.cores;
  add('sp_cores', m.cores, cores ?? '—', !cores ? 'unknown' : cores === m.cores ? 'match' : cores < m.cores / 1.5 ? 'mismatch' : 'warn');
  const want = Math.min(8, 2 ** Math.floor(Math.log2(Math.max(...m.ram))));
  const mem = rd.memory;
  add('sp_ram', `${m.ram.join('/')} GB`, mem ? `≈ ${mem} GB` : '—', !mem ? 'unknown' : mem >= want / 2 ? 'match' : 'mismatch');
  const shortSide = rd.screenPx ? Math.min(...rd.screenPx) : 0;
  const sr = shortSide / m.res[0];
  add('sp_screen', `${m.res[0]} × ${m.res[1]}`, rd.screenPx ? rd.screenPx.join(' × ') : '—', !shortSide ? 'unknown' : sr > 0.97 && sr < 1.03 ? 'match' : sr >= 0.7 ? 'warn' : 'mismatch');
  add('sp_refresh', `${m.hz} Hz`, rd.refresh ? `${rd.refresh} Hz` : '—', !rd.refresh ? 'unknown' : rd.refresh >= m.hz - 5 ? 'match' : 'warn');
  const fam = gpuFamily(rd.renderer);
  add('sp_gpu', m.gpu, rd.renderer || '—', !fam ? 'unknown' : fam === gpuFamily(m.gpu) ? 'match' : 'mismatch');
  add('sp_cpu', fmtNum(m.cpuRef), rd.cpu ? fmtNum(rd.cpu.single) : '—', ratioStatus(rd.cpu ? rd.cpu.single / m.cpuRef : null));
  add('sp_gpuScore', fmtNum(m.gpuRef), rd.gpu?.ok ? fmtNum(rd.gpu.score) : '—', ratioStatus(rd.gpu?.ok ? rd.gpu.score / m.gpuRef : null));
  const code = rd.uaModel;
  add('sp_code', m.codes.join(', '), code || '—', !code ? 'unknown' : m.codes.some(c => code.toUpperCase().startsWith(c.toUpperCase())) ? 'match' : 'mismatch');
  return rows;
}

/** Strong signals of a clone or wrong model: GPU family, core count, panel resolution, CPU score, model code. */
function specVerdict(rows) {
  const strong = ['sp_gpu', 'sp_cores', 'sp_screen', 'sp_cpu', 'sp_code'];
  const known = rows.filter(r => r.st !== 'unknown');
  if (!known.length) return { status: 'skip', strong: 0 };
  const bad = rows.filter(r => strong.includes(r.k) && r.st === 'mismatch').length;
  return { status: bad >= 2 ? 'fail' : bad === 1 || rows.some(r => r.st === 'warn') ? 'warn' : 'pass', strong: bad };
}

// ---------- diagnostic steps, weighted checks, grading and valuation (pure functions) ----------
const STEPS = [
  { id: 'identify', icon: 'smartphone', apis: ['UA-CH', 'Screen'] },
  { id: 'display', icon: 'monitor', apis: ['Fullscreen', 'rAF'] },
  { id: 'touch', icon: 'touch', apis: ['Pointer Events'] },
  { id: 'audio', icon: 'volume', apis: ['Web Audio', 'getUserMedia', 'MediaRecorder'] },
  { id: 'camera', icon: 'camera', apis: ['getUserMedia', 'ImageCapture'] },
  { id: 'sensors', icon: 'compass', apis: ['DeviceMotion', 'DeviceOrientation'] },
  { id: 'hardware', icon: 'battery-charging', apis: ['Vibration', 'Battery', 'Geolocation', 'Storage'] },
  { id: 'performance', icon: 'zap', apis: ['Web Worker', 'WebGL'] },
  { id: 'physical', icon: 'screwdriver', apis: ['manual'] },
  { id: 'imei', icon: 'barcode', apis: ['manual'] },
  { id: 'summary', icon: 'seal', apis: ['WebCrypto'] },
];
const stepIndex = id => STEPS.findIndex(s => s.id === id);

// w = weight in the score; crit = the worst grade allowed when this check fails.
const CHECKS = {
  uaMatch: { step: 'identify', w: 1 },
  deadPixels: { step: 'display', w: 4, crit: 'C' },
  banding: { step: 'display', w: 2 },
  burnIn: { step: 'display', w: 3 },
  uniformity: { step: 'display', w: 2 },
  refresh: { step: 'display', w: 1 },
  coverage: { step: 'touch', w: 5, crit: 'C' },
  edges: { step: 'touch', w: 3 },
  multitouch: { step: 'touch', w: 2 },
  latency: { step: 'touch', w: 1 },
  speakerL: { step: 'audio', w: 2 },
  speakerR: { step: 'audio', w: 2 },
  sweep: { step: 'audio', w: 1 },
  mic: { step: 'audio', w: 3 },
  loopback: { step: 'audio', w: 2 },
  camRear: { step: 'camera', w: 4 },
  camFront: { step: 'camera', w: 3 },
  torch: { step: 'camera', w: 1 },
  accel: { step: 'sensors', w: 2 },
  gyro: { step: 'sensors', w: 1 },
  tilt: { step: 'sensors', w: 2 },
  compass: { step: 'sensors', w: 1 },
  vibration: { step: 'hardware', w: 2 },
  charging: { step: 'hardware', w: 3, crit: 'C' },
  batteryHealth: { step: 'hardware', w: 3 },
  gps: { step: 'hardware', w: 2 },
  network: { step: 'hardware', w: 2 },
  cpu: { step: 'performance', w: 2 },
  gpu: { step: 'performance', w: 2 },
  specMatch: { step: 'performance', w: 4, crit: 'D' },
  buttons: { step: 'physical', w: 4 },
  ports: { step: 'physical', w: 3 },
  body: { step: 'physical', w: 5 },
  lens: { step: 'physical', w: 2 },
  lci: { step: 'physical', w: 2 },
  biometrics: { step: 'physical', w: 2 },
  luhn: { step: 'imei', w: 4, crit: 'D' },
  tacBrand: { step: 'imei', w: 2 },
  boxMatch: { step: 'imei', w: 2 },
  pta: { step: 'imei', w: 2, crit: 'D' },
  locks: { step: 'imei', w: 4, crit: 'D' },
};
const checksOf = step => Object.keys(CHECKS).filter(k => CHECKS[k].step === step);
const STATUS_SCORE = { pass: 1, warn: 0.5, fail: 0 };
const GRADES = ['A', 'B', 'C', 'D'];
const worse = (a, b) => (GRADES.indexOf(a) >= GRADES.indexOf(b) ? a : b);
const checkStatus = (sess, id) => sess.checks[id]?.s || 'pending';

/** Status of a whole step: any fail → fail, any minor → warn, all pass → pass, otherwise pending / partial. */
function stepStatus(sess, step) {
  const ids = checksOf(step);
  if (!ids.length) return 'pending';
  const st = ids.map(id => checkStatus(sess, id));
  if (st.includes('fail')) return 'fail';
  if (st.includes('warn')) return 'warn';
  if (st.every(s => s === 'pass' || s === 'skip') && st.includes('pass')) return 'pass';
  if (st.every(s => s === 'skip')) return 'skip';
  return 'pending';
}

function sessionProgress(sess) {
  const ids = Object.keys(CHECKS);
  const done = ids.filter(id => checkStatus(sess, id) !== 'pending').length;
  return { done, total: ids.length, frac: done / ids.length };
}

/** Weighted score → grade with caps from critical failures, body condition and unverified tests. */
function computeGrade(sess) {
  const ids = Object.keys(CHECKS);
  const counts = { pass: 0, warn: 0, fail: 0, skip: 0, pending: 0 };
  let got = 0;
  let max = 0;
  let unverifiedW = 0;
  const totalW = sum(ids.map(id => CHECKS[id].w));
  const caps = [];
  for (const id of ids) {
    const s = checkStatus(sess, id);
    counts[s]++;
    if (s === 'skip' || s === 'pending') {
      unverifiedW += CHECKS[id].w;
      continue;
    }
    got += CHECKS[id].w * STATUS_SCORE[s];
    max += CHECKS[id].w;
    if (s === 'fail' && CHECKS[id].crit) caps.push({ id, grade: CHECKS[id].crit });
  }
  const score = max ? Math.round((got / max) * 100) : 0;
  let grade = score >= 88 ? 'A' : score >= 74 ? 'B' : score >= 55 ? 'C' : 'D';
  for (const c of caps) grade = worse(grade, c.grade);
  if (sess.physical.body === 'D') grade = worse(grade, 'C');
  const unverifiedPct = Math.round((unverifiedW / totalW) * 100);
  if (unverifiedPct > 30) grade = worse(grade, 'B');
  if (!max) grade = 'D';
  return { score, grade, counts, caps, unverifiedPct, reasons: gradeReasons(sess, caps, unverifiedPct, counts) };
}

function gradeReasons(sess, caps, unverifiedPct, counts) {
  const out = [];
  for (const c of caps) out.push({ tone: 'fail', k: 'gr_cap', vars: { check: t('ck_' + c.id), grade: c.grade } });
  for (const id of Object.keys(CHECKS)) {
    const s = checkStatus(sess, id);
    if (s === 'fail' && !CHECKS[id].crit) out.push({ tone: 'fail', k: 'gr_failed', vars: { check: t('ck_' + id) } });
    if (s === 'warn') out.push({ tone: 'warn', k: 'gr_minor', vars: { check: t('ck_' + id) } });
  }
  if (sess.physical.body === 'D') out.push({ tone: 'fail', k: 'gr_bodyD', vars: {} });
  if (unverifiedPct > 30) out.push({ tone: 'warn', k: 'gr_unverified', vars: { n: unverifiedPct } });
  if (counts.pass && !counts.fail) out.push({ tone: 'pass', k: 'gr_allPass', vars: { n: counts.pass } });
  return out;
}

// ---------- valuation: price table × condition, PTA status, battery health, storage, box and accessories ----------
const GRADE_MULT = { A: 1.08, B: 1, C: 0.84, D: 0.58 };
const PTA_STATES = ['approved', 'nonpta', 'blocked', 'unchecked'];

function batteryMult(h) {
  if (!h) return 1;
  if (h >= 90) return 1;
  if (h >= 85) return 0.97;
  return h >= 80 ? 0.93 : 0.86;
}

/**
 * value({modelId, storage, grade, pta, battery, box, charger, warranty, clone}) → { factors, mid, lo, hi }.
 * Every factor is listed so the UI can show how the number was built.
 */
function valueEstimate(o) {
  const m = modelById(o.modelId);
  if (!m) return null;
  // TODO(student): feed m.price from live marketplace listings (median of recent ads per model and storage) with a last-updated stamp.
  const f = [];
  const add = (k, mult, vars = {}) => f.push({ k, mult, vars });
  const step = Math.max(0, m.storage.indexOf(Number(o.storage)));
  add('vf_grade', GRADE_MULT[o.grade] || 1, { g: o.grade });
  if (step) add('vf_storage', 1 + 0.07 * step, { gb: o.storage });
  if (o.pta === 'nonpta') add('vf_nonpta', m.ptaGap || 0.75);
  if (o.pta === 'blocked') add('vf_blocked', 0.3);
  const bm = batteryMult(Number(o.battery));
  if (bm !== 1) add('vf_battery', bm, { h: o.battery });
  if (o.box) add('vf_box', 1.03);
  if (o.charger) add('vf_charger', 1.02);
  if (Number(o.warranty) > 0) add('vf_warranty', 1.04, { n: o.warranty });
  if (o.clone) add('vf_clone', 0.18);
  const mid = f.reduce((v, x) => v * x.mult, m.price);
  const spread = o.pta === 'unchecked' ? 0.1 : 0.06;
  return { model: m, base: m.price, factors: f, mid: roundTo(mid, 500), lo: roundTo(mid * (1 - spread), 500), hi: roundTo(mid * (1 + spread), 500) };
}

// ---------- repair estimate: parts by tier, original or copy, labour; repair-vs-replace verdict ----------
function repairEstimate({ modelId, tier, items }) {
  const m = modelById(modelId);
  const ti = TIERS.indexOf(m ? m.tier : tier);
  const lines = items.map(({ part, grade }) => {
    const P = PARTS[part];
    const [lo, hi] = P[grade === 'copy' ? 'copy' : 'orig'][ti];
    return { part, grade, lo, hi, labour: P.labour[ti], hours: P.hours, co2: P.co2 };
  });
  const lo = sum(lines.map(l => l.lo + l.labour));
  const hi = sum(lines.map(l => l.hi + l.labour));
  const hours = sum(lines.map(l => l.hours));
  const co2Parts = sum(lines.map(l => l.co2)) + CO2.transportPerRepair;
  return { model: m, tier: TIERS[ti], lines, lo, hi, mid: (lo + hi) / 2, hours, co2Saved: Math.max(0, CO2.newPhone - co2Parts) };
}

/** Repair pays when the value it adds beats its cost; otherwise compare with the value of a working phone. */
function repairVerdict(est, valueAsIs, valueAfter) {
  const gain = valueAfter - valueAsIs;
  if (!est.lines.length) return { k: 'none', gain };
  if (gain >= est.mid) return { k: 'repair', gain };
  if (est.mid <= valueAfter * 0.45) return { k: 'maybe', gain };
  return { k: 'replace', gain };
}

// ---------- diagnostic wizard shell: progress ring, step rail, live stage, results list ----------
const WZ = { step: 'identify' };
// Each step registers { html(), bind() }; html() fills the stage, bind() wires buttons and starts nothing until asked.
const STEP_UI = {};

const sessModel = () => modelById(S.session.claimed.modelId);
const sessName = (sess = S.session) => {
  const m = modelById(sess.claimed.modelId);
  return m ? `${m.brand} ${m.name}` : t('wz_noModel');
};

function renderWizard(arg) {
  const step = STEPS.some(s => s.id === arg) ? arg : WZ.step;
  WZ.step = step;
  const def = STEPS[stepIndex(step)];
  const hasChecks = checksOf(step).length > 0;
  $('#view').innerHTML = `<div class="wiz">
    <aside class="wiz-side" id="wizSide">${wizSide(step)}</aside>
    <section class="wiz-main">
      ${!isSecureContext ? `<div class="notice fail mb">${ic('lock')}<span>${t('wz_secureWarn')}</span></div>` : ''}
      ${S.session.demo ? `<div class="notice copper mb">${ic('info')}<span>${t('wz_demoNote')}</span></div>` : ''}
      <div class="stephead"><div class="eyebrow">${ic(def.icon)} ${t('wz_stepXofY', { x: stepIndex(step) + 1, y: STEPS.length })}</div>
        <h2>${t('st_' + step)}</h2><p>${t('sd_' + step)}</p><div class="apis">${apiChips(def)}</div></div>
      <div id="stageWrap">${STEP_UI[step].html()}</div>
      ${hasChecks ? `<div class="between mt"><h3 class="small">${ic('list')} ${t('wz_checks')}</h3><span class="tiny muted">${t('wz_override')}</span></div>
      <div class="checks" id="checkList">${checkRows(step)}</div>` : ''}
      ${wizNav(step)}
    </section></div>`;
  STEP_UI[step].bind();
  bindChecks();
  // Phone layout: keep the current step chip in view inside the horizontal step strip.
  if (matchMedia('(max-width: 1000px)').matches) $('.steps a.on')?.scrollIntoView({ block: 'nearest', inline: 'center' });
}

function wizSide(step) {
  const prog = sessionProgress(S.session);
  const job = S.session.jobId ? S.jobs.find(j => j.id === S.session.jobId) : null;
  return `<div class="card wring"><div class="ringbox">${ringSvg(prog.frac, { size: 100, r: 42, cls: 'cyan' })}
      <div class="mid"><b class="num">${prog.done}/${prog.total}</b><small>${t('wz_progress')}</small></div></div>
    <div class="grow"><div class="tiny muted">${t('wz_device')}</div><b>${esc(sessName())}</b>
      ${job ? `<div class="tiny c-copper">${ic('kanban')} ${t('wz_jobLink', { id: esc(job.id) })}</div>` : ''}
      <button type="button" class="btn ghost xs mt-s" id="wzNew">${ic('refresh')} ${t('wz_newSession')}</button></div></div>
    <ol class="steps" aria-label="${t('nav_diagnose')}">${STEPS.map((s, i) => stepLink(s, i, step)).join('')}</ol>`;
}

function stepLink(s, i, cur) {
  const st = s.id === 'summary' ? '' : stepStatus(S.session, s.id);
  const cls = [s.id === cur ? 'on' : '', st ? 's-' + st : ''].join(' ');
  const dot = st && st !== 'pending' ? `<span class="dot ${st === 'skip' ? '' : st} st" title="${t('s_' + st)}"></span>` : '';
  return `<li><a href="#diagnose/${s.id}" class="${cls}" ${s.id === cur ? 'aria-current="step"' : ''}><span class="n">${i + 1}</span><span class="lbl">${t('st_' + s.id)}</span>${dot}</a></li>`;
}

function apiChips(def) {
  return def.apis.map(a => {
    if (a === 'manual') return `<span class="chip copper">${ic('hand')} ${t('manual')}</span>`;
    const ok = apiAvailable(a);
    return `<span class="chip ${ok ? 'cyan' : 'warn'}">${ic(ok ? 'check' : 'alert')} ${t(ok ? 'wz_apiYes' : 'wz_apiNo', { api: a })}</span>`;
  }).join('');
}

function wizNav(step) {
  const i = stepIndex(step);
  const prev = STEPS[i - 1];
  const next = STEPS[i + 1];
  return `<div class="wiz-nav">${prev ? `<a class="btn ghost" href="#diagnose/${prev.id}">${ic('chevron-left', 'flip')} ${t('wz_prev')}</a>` : '<span></span>'}
    ${next ? `<a class="btn" href="#diagnose/${next.id}" id="wzNext">${t('wz_next')}: ${t('st_' + next.id)} ${ic('chevron-right', 'flip')}</a>` : ''}</div>`;
}

// ---------- check rows (pass / minor / fail / skip with evidence) ----------
function checkRows(step) {
  return checksOf(step).map(id => {
    const c = S.session.checks[id] || {};
    const s = c.s || 'pending';
    const mode = c.mode ? `<span class="chip ${c.mode === 'auto' ? 'cyan' : c.mode === 'simulated' ? 'warn' : ''}">${t(c.mode)}</span>` : '';
    return `<div class="check s-${s}" data-check="${id}"><div><div class="nm">${t('ck_' + id)} ${mode}</div>
      <div class="ev">${c.ev ? esc(c.ev) : s === 'pending' ? t('s_pending') : t('wz_byHand')}</div></div>
      <div class="seg status" role="group" aria-label="${t('ck_' + id)}">${['pass', 'warn', 'fail', 'skip'].map(v => `<button type="button" data-v="${v}" class="${s === v ? 'on' : ''}" aria-pressed="${s === v}">${t('s_' + v)}</button>`).join('')}</div></div>`;
  }).join('');
}

function bindChecks() {
  $$('#checkList [data-check]').forEach(row => {
    $$('.seg button', row).forEach(b => (b.onclick = () => {
      const id = row.dataset.check;
      setCheck(id, b.dataset.v, S.session.checks[id]?.ev || '', 'manual');
    }));
  });
  const nw = $('#wzNew');
  if (nw) nw.onclick = startNewSession;
}

/** Record a result. Live stages keep running: only the results list and the progress rail are redrawn. */
function setCheck(id, s, ev = '', mode = 'auto') {
  if (!CHECKS[id]) return;
  S.session.checks[id] = { s, ev: String(ev || ''), mode, at: now() };
  persist('session');
  refreshWizardChrome();
  announce(`${t('ck_' + id)}: ${t('s_' + s)}`);
}

function setReading(k, v) {
  S.session.readings[k] = v;
  persist('session');
}

function refreshWizardChrome() {
  if (curRoute !== 'diagnose') return;
  const list = $('#checkList');
  if (list) {
    list.innerHTML = checkRows(WZ.step);
    bindChecks();
  }
  const side = $('#wizSide');
  if (side) {
    side.innerHTML = wizSide(WZ.step);
    settle(side);
    bindChecks();
  }
}

async function startNewSession(extra = {}) {
  if (!(await askConfirm(t('wz_newConfirm'), { okText: t('wz_newSession'), icon: 'refresh' }))) return;
  LIVE.stopAll();
  S.session = newSession(extra);
  persist('session');
  logEvent('lg_sessionNew', {}, 'diagnose');
  WZ.step = 'identify';
  go('diagnose/identify');
}

// ---------- feature detection used by the chips, the bench capability matrix and every step ----------
const FEATURES = {
  'UA-CH': () => !!navigator.userAgentData?.getHighEntropyValues,
  Screen: () => !!window.screen,
  Fullscreen: () => !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen),
  rAF: () => 'requestAnimationFrame' in window,
  'Pointer Events': () => 'PointerEvent' in window,
  'Web Audio': () => !!(window.AudioContext || window.webkitAudioContext),
  getUserMedia: () => !!navigator.mediaDevices?.getUserMedia,
  MediaRecorder: () => 'MediaRecorder' in window,
  ImageCapture: () => 'ImageCapture' in window,
  DeviceMotion: () => 'DeviceMotionEvent' in window,
  DeviceOrientation: () => 'DeviceOrientationEvent' in window,
  Vibration: () => 'vibrate' in navigator,
  Battery: () => 'getBattery' in navigator,
  Geolocation: () => 'geolocation' in navigator,
  Storage: () => !!navigator.storage?.estimate,
  'Web Worker': () => 'Worker' in window,
  // Presence of the API only: creating a context here would wake the GPU on every page view.
  WebGL: () => 'WebGLRenderingContext' in window,
  WebCrypto: hasCrypto,
  BarcodeDetector: () => 'BarcodeDetector' in window,
  'Network Info': () => 'connection' in navigator,
};
const featureCache = {};
const apiAvailable = a => (a in featureCache ? featureCache[a] : (featureCache[a] = !!FEATURES[a]?.()));

// ---------- browser identity readings ----------
async function collectBrowserInfo() {
  const info = { cssPx: [screen.width, screen.height], dpr: window.devicePixelRatio || 1, cores: navigator.hardwareConcurrency || null,
    memory: navigator.deviceMemory || null, touch: navigator.maxTouchPoints || 0, platform: navigator.platform || '', uaModel: '' };
  info.screenPx = info.cssPx.map(v => Math.round(v * info.dpr)).sort((a, b) => a - b);
  info.gamut = ['rec2020', 'p3', 'srgb'].find(g => matchMedia(`(color-gamut: ${g})`).matches) || 'srgb';
  info.hdr = matchMedia('(dynamic-range: high)').matches;
  try {
    if (navigator.userAgentData?.getHighEntropyValues) {
      const h = await navigator.userAgentData.getHighEntropyValues(['model', 'platformVersion']);
      info.uaModel = h.model || '';
      info.platform = `${h.platform || info.platform} ${h.platformVersion || ''}`.trim();
    }
  } catch {
    /* UA-CH refused */
  }
  if (!info.uaModel) {
    const m = navigator.userAgent.match(/Android [\d.]+; ([^;)]+)[;)]/);
    if (m && m[1] !== 'K') info.uaModel = m[1].trim();
  }
  return info;
}

function evaluateUaMatch(force = false) {
  const m = sessModel();
  const r = S.session.readings;
  const cur = S.session.checks.uaMatch;
  if (!m || (cur?.mode === 'manual' && !force)) return;
  if (!r.uaModel) return setCheck('uaMatch', 'skip', t('id_uaNone'), 'auto');
  const ok = m.codes.some(c => r.uaModel.toUpperCase().startsWith(c.toUpperCase()));
  setCheck('uaMatch', ok ? 'pass' : 'warn', t(ok ? 'id_uaMatch' : 'id_uaMismatch', { code: r.uaModel, model: m.name, want: m.codes.join(' / ') }), 'auto');
}

function clearCheck(id) {

  delete S.session.checks[id];

/** Turn the IMEI inputs into check results (each one stays overridable by hand). */
function evaluateImeiChecks() {
  const im = S.session.imei;
  const i = imeiInfo(im.imei1);
  const m = sessModel();
  if (!i.imei) clearCheck('luhn');
  else if (!i.ok15) setCheck('luhn', 'fail', t('ev_len', { n: i.imei.length }), 'auto');
  else setCheck('luhn', i.luhn ? 'pass' : 'fail', t(i.luhn ? 'ev_luhnOk' : 'ev_luhnBad', { d: i.expected, tac: i.tac }), 'auto');
  if (i.tacEntry && m && i.tac !== '49015420') {
    const ok = i.tacEntry.brand === m.brand;
    setCheck('tacBrand', ok ? 'pass' : 'fail', t(ok ? 'ev_tacOk' : 'ev_tacBad', { brand: i.tacEntry.brand, hint: i.tacEntry.hint, claimed: m.brand }), 'auto');
  } else if (i.ok15) setCheck('tacBrand', 'skip', t('im_tacUnknown'), 'auto');
  const map = (id, v, table) => (v && table[v] ? setCheck(id, table[v][0], t(table[v][1]), 'manual') : clearCheck(id));
  map('boxMatch', im.box, { match: ['pass', 'im_box_match'], mismatch: ['fail', 'im_box_mismatch'], nobox: ['warn', 'im_box_nobox'] });
  map('locks', im.locks, { removed: ['pass', 'locks_removed'], signed: ['fail', 'locks_signed'] });
  map('pta', im.pta, { approved: ['pass', 'pta_approved'], nonpta: ['warn', 'pta_nonpta'], blocked: ['fail', 'pta_blocked'] });
}

// ---------- full-screen layer shared by the display and touch tests ----------
const FS = { on: false, onKey: null, onClose: null };

async function openFs(onClose) {
  const el = $('#fs');
  el.innerHTML = '';
  el.style.background = '#000';
  el.classList.add('on');
  FS.on = true;
  FS.onClose = onClose;
  try {
    if (el.requestFullscreen) await el.requestFullscreen({ navigationUI: 'hide' });
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } catch {
    /* not allowed: the fixed layer still covers the window */
  }
  return el;
}

function closeFs() {
  if (!FS.on) return;
  FS.on = false;
  const el = $('#fs');
  el.classList.remove('on');
  el.innerHTML = '';
  el.onpointerdown = el.onpointermove = el.onpointerup = el.onpointercancel = el.onclick = null;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else if (document.webkitFullscreenElement) document.webkitExitFullscreen?.();
  const cb = FS.onClose;
  FS.onClose = null;
  FS.onKey = null;
  if (cb) cb();
}
document.addEventListener('fullscreenchange', () => !document.fullscreenElement && FS.on && closeFs());

function fsHud(text, fade = true) {
  let hud = $('#fs .hud');
  if (!hud) {
    hud = document.createElement('div');
    hud.className = 'hud';
    $('#fs').append(hud);
  }
  hud.textContent = text;
  hud.classList.remove('fade');
  clearTimeout(hud._t);
  if (fade) hud._t = setTimeout(() => hud.classList.add('fade'), 2200);
}

async function runDisplayPatterns() {
  // TODO(student): photograph each pattern with a second phone and detect stuck pixels or burn-in automatically (registration + outliers).
  let i = 0;
  const el = await openFs(() => {
    for (const id of ['deadPixels', 'banding', 'burnIn', 'uniformity']) {
      const c = S.session.checks[id];
      if (!c || !c.ev) S.session.checks[id] = { s: c?.s || 'pending', mode: c?.mode || '', ev: t('dp_viewed', { n: i + 1 }), at: now() };

    toast(t('dp_after'), 'ok');

    if (list) list.scrollIntoView({ behavior: calm() ? 'auto' : 'smooth', block: 'start' });
  });
  const show = () => {
    const [id, css] = PATTERNS[i];
    el.style.background = css;
    fsHud(t('dp_hud', { i: i + 1, n: PATTERNS.length, name: t('dp_' + id) }));
  };
  const step = d => {
    i += d;
    if (i >= PATTERNS.length) {
      i = PATTERNS.length - 1;
      return closeFs();
    }
    i = Math.max(0, i);
    show();
  };
  el.onclick = () => step(1);
  FS.onKey = e => {
    if ([' ', 'Enter', 'ArrowRight', 'ArrowDown'].includes(e.key)) step(1);
    if (['ArrowLeft', 'ArrowUp'].includes(e.key)) step(-1);
  };
  show();
}

/** Sample requestAnimationFrame intervals for ~1.2 s and snap to a panel rate. */
function measureRefresh(ms = 1200) {
  return new Promise(resolve => {
    const deltas = [];
    let last = 0;
    const t0 = performance.now();
    const tick = ts => {
      if (last) deltas.push(ts - last);
      last = ts;
      if (ts - t0 < ms) requestAnimationFrame(tick);
      else resolve(refreshFromIntervals(deltas));
    };
    requestAnimationFrame(tick);
  });
}

async function runRefresh() {
  const out = $('#dpHz');
  if (out) out.innerHTML = `<span class="dot live"></span>`;
  const hz = await measureRefresh();
  if (!hz) return;
  setReading('refresh', hz);
  if ($('#dpHz')) $('#dpHz').innerHTML = `${hz}<small>Hz</small>`;
  const m = sessModel();
  const want = m ? m.hz : 60;
  setCheck('refresh', hz >= want - 5 ? 'pass' : 'warn', t(hz >= want - 5 ? 'dp_refreshEv' : 'dp_refreshLow', { hz, want }), 'auto');
}

// ---------- touch grid ----------
function touchGridSize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const cols = clamp(Math.round(w / 56), 5, 24);
  const rows = clamp(Math.round(h / 56), 8, 18);
  return { cols, rows };
}

async function runTouchGrid() {
  const { cols, rows } = touchGridSize();
  const total = cols * rows;
  const seen = new Uint8Array(total);
  const isEdge = i => i < cols || i >= total - cols || i % cols === 0 || i % cols === cols - 1;
  const edgeTotal = [...seen.keys()].filter(isEdge).length;
  const st = { lat: [], max: 0, active: new Map(), last: new Map() };
  const el = await openFs(() => finishTouch(seen, total, edgeTotal, isEdge, st));
  el.innerHTML = `<div class="tgrid" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr)">${[...seen].map((_, i) => `<i class="${isEdge(i) ? 'edge' : ''}"></i>`).join('')}</div>
    <div class="fsbar"><button type="button" class="btn" id="tcDone">${ic('check')} ${t('tc_done')}</button></div>`;
  const cells = $$('.tgrid i', el);
  const mark = (x, y) => {
    const i = Math.min(rows - 1, Math.floor((y / window.innerHeight) * rows)) * cols + Math.min(cols - 1, Math.floor((x / window.innerWidth) * cols));
    if (i >= 0 && i < total && !seen[i]) {
      seen[i] = 1;
      cells[i].classList.add('on');
    }
  };
  bindTouchPointers(el, st, mark);
  const hud = () => fsHud(t('tc_hud', { p: Math.round((sum(seen) / total) * 100), e: [...seen].filter((v, i) => v && isEdge(i)).length, et: edgeTotal }), false);
  hud();
  st.hudTimer = setInterval(hud, 250);
  $('#tcDone').onclick = e => {
    e.stopPropagation();
    closeFs();
  };
}

/** Pointer handling: coalesced events plus interpolation so fast swipes do not skip cells; latency to the next frame. */
function bindTouchPointers(el, st, mark) {
  el.onpointerdown = e => {
    if (e.target.closest('.fsbar')) return;
    st.active.set(e.pointerId, true);
    st.max = Math.max(st.max, st.active.size);
    st.last.set(e.pointerId, [e.clientX, e.clientY]);
    mark(e.clientX, e.clientY);
  };
  el.onpointermove = e => {
    if (!st.active.has(e.pointerId)) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of evs.length ? evs : [e]) {
      const [lx, ly] = st.last.get(e.pointerId) || [ev.clientX, ev.clientY];
      const steps = Math.ceil(Math.hypot(ev.clientX - lx, ev.clientY - ly) / 12);
      for (let k = 1; k <= steps; k++) mark(lx + ((ev.clientX - lx) * k) / steps, ly + ((ev.clientY - ly) * k) / steps);
      mark(ev.clientX, ev.clientY);
      st.last.set(e.pointerId, [ev.clientX, ev.clientY]);
    }
    const ts = e.timeStamp;
    requestAnimationFrame(f => st.lat.length < 400 && f - ts > 0 && f - ts < 500 && st.lat.push(f - ts));
  };
  el.onpointerup = el.onpointercancel = e => {
    st.active.delete(e.pointerId);
    st.last.delete(e.pointerId);
  };
}

function finishTouch(seen, total, edgeTotal, isEdge, st) {
  clearInterval(st.hudTimer);
  const pct = Math.round((sum(seen) / total) * 1000) / 10;
  const edges = [...seen].filter((v, i) => v && isEdge(i)).length;
  const touch = navigator.maxTouchPoints > 0;
  setReading('touch', { pct, edges, edgeTotal, max: st.max, lat: Math.round(median(st.lat)) });
  setCheck('coverage', pct >= 98 ? 'pass' : pct >= 90 ? 'warn' : 'fail', t('tc_evCover', { p: pct, n: total }) + (touch ? '' : ' · ' + t('tc_mouse')), 'auto');
  setCheck('edges', edges === edgeTotal ? 'pass' : edges >= edgeTotal * 0.9 ? 'warn' : 'fail', t('tc_evEdges', { e: edges, et: edgeTotal }), 'auto');
  if (st.lat.length > 5) {
    const ms = Math.round(median(st.lat));
    setCheck('latency', ms <= 60 ? 'pass' : 'warn', t('tc_evLat', { ms }), 'auto');
  }
  if (touch && st.max > 1) recordMultitouch(st.max);
  if (curRoute === 'diagnose') rerender();
}

function recordMultitouch(n) {
  const prev = S.session.readings.touch?.max || 0;
  setReading('touchMax', Math.max(n, S.session.readings.touchMax || 0, prev));
  const best = S.session.readings.touchMax;
  setCheck('multitouch', best >= 5 ? 'pass' : best >= 2 ? 'warn' : 'fail', t('tc_evMulti', { n: best }), 'auto');
}

function bindMultiPad() {
  const pad = $('#mtPad');
  const pts = new Map();
  const draw = () => {
    $$('.tp', pad).forEach(x => x.remove());
    for (const [id, [x, y]] of pts) pad.insertAdjacentHTML('beforeend', `<span class="tp" style="left:${x}px;top:${y}px">${[...pts.keys()].indexOf(id) + 1}</span>`);
    $('#mtMax').textContent = Math.max(Number($('#mtMax').textContent) || 0, pts.size);
  };
  const pos = e => {
    const r = pad.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  };
  pad.onpointerdown = e => {
    pad.setPointerCapture?.(e.pointerId);
    pts.set(e.pointerId, pos(e));
    draw();
    if (pts.size > 1) recordMultitouch(pts.size);
  };
  pad.onpointermove = e => pts.has(e.pointerId) && (pts.set(e.pointerId, pos(e)), draw());
  pad.onpointerup = pad.onpointercancel = e => (pts.delete(e.pointerId), draw());
}

const AUD = { stream: null, src: null, an: null, timer: 0, peakHold: -90, loud: 0 };
const LOOP_FREQS = [1000, 2750, 4100];

/** One tone: oscillator → gain envelope → StereoPanner (or a ChannelMerger fallback) → destination. */
function playTone({ freq = 440, pan = 0, dur = 1, sweep = null, gain = 0.25, dest = null } = {}) {
  const ac = audioCtx();
  if (!ac) return Promise.resolve(false);
  const o = ac.createOscillator();
  const g = ac.createGain();
  const t0 = ac.currentTime + 0.02;
  o.frequency.setValueAtTime(sweep ? sweep[0] : freq, t0);
  if (sweep) o.frequency.exponentialRampToValueAtTime(sweep[1], t0 + dur);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.03);
  g.gain.setValueAtTime(gain, t0 + dur - 0.05);
  g.gain.linearRampToValueAtTime(0, t0 + dur);
  o.connect(g);
  if (dest) g.connect(dest);
  else if (ac.createStereoPanner) {
    const p = ac.createStereoPanner();
    p.pan.value = pan;
    g.connect(p).connect(ac.destination);
  } else {
    const m = ac.createChannelMerger(2);
    if (pan <= 0) g.connect(m, 0, 0);
    if (pan >= 0) g.connect(m, 0, 1);
    m.connect(ac.destination);
  }
  o.start(t0);
  o.stop(t0 + dur + 0.05);
  return new Promise(r => (o.onended = () => r(true)));
}

function askHeard(check, key) {

// ---------- microphone: level meter, spectrum and voice detection ----------
async function startMic() {
  if (AUD.stream) return true;
  if (!apiAvailable('getUserMedia') || !audioCtx()) {
    toast(t('au_noMic'), 'bad');
    return false;
  }
  try {
    AUD.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  } catch (e) {
    toast(t(e.name === 'NotAllowedError' ? 'err_perm' : 'err_generic', { m: e.message }), 'bad');
    return false;
  }
  const ac = audioCtx();
  AUD.src = ac.createMediaStreamSource(AUD.stream);
  AUD.an = ac.createAnalyser();
  AUD.an.fftSize = 2048;
  AUD.an.smoothingTimeConstant = 0.55;
  AUD.src.connect(AUD.an);
  AUD.peakHold = -90;
  AUD.loud = 0;
  AUD.timer = setInterval(drawMic, 50);
  LIVE.add(stopMic);
  updateMicButtons();
  return true;
}

function stopMic() {
  clearInterval(AUD.timer);
  stopStream(AUD.stream);
  try {
    AUD.src?.disconnect();
  } catch {
    /* already disconnected */
  }
  Object.assign(AUD, { stream: null, src: null, an: null, timer: 0 });
  LIVE.stops.delete(stopMic);
  updateMicButtons();
}

function updateMicButtons() {
  const b = $('#auMic');
  if (!b) return;
  b.innerHTML = AUD.stream ? `${ic('mic-off')} ${t('au_micStop')}` : `${ic('mic')} ${t('au_micStart')}`;
  $('#auRec').disabled = !AUD.stream || !apiAvailable('MediaRecorder');
}

function drawMic() {
  const an = AUD.an;
  const cv = $('#auCanvas');
  if (!an || !cv) return;
  const td = new Float32Array(an.fftSize);
  an.getFloatTimeDomainData(td);
  const lvl = rmsDb(td);
  const pk = peakDb(td);
  AUD.peakHold = Math.max(pk, AUD.peakHold - 0.6);
  $('#auLvl').style.width = clamp((lvl + 70) / 70, 0, 1) * 100 + '%';
  $('#auPk').style.insetInlineStart = clamp((AUD.peakHold + 70) / 70, 0, 1) * 100 + '%';
  $('#auDb').textContent = `${lvl.toFixed(1)} / ${pk.toFixed(1)}`;
  AUD.loud = pk > -30 ? AUD.loud + 1 : 0;
  const c = S.session.checks.mic;
  if (AUD.loud === 6 && (!c || c.mode !== 'manual')) setCheck('mic', 'pass', t('au_voice', { db: pk.toFixed(1) }), 'auto');
  drawSpectrum(cv, an);
}

/** Log-spaced spectrum bars (60 Hz – 16 kHz). */
function drawSpectrum(cv, an) {
  const fd = new Uint8Array(an.frequencyBinCount);
  an.getByteFrequencyData(fd);
  const ctx = cv.getContext('2d');
  const W = cv.width;
  const H = cv.height;
  ctx.clearRect(0, 0, W, H);
  const bars = 56;
  const nyq = audioCtx().sampleRate / 2;
  const bw = W / bars;
  for (let b = 0; b < bars; b++) {
    const f0 = 60 * Math.pow(16000 / 60, b / bars);
    const f1 = 60 * Math.pow(16000 / 60, (b + 1) / bars);
    const i0 = Math.floor((f0 / nyq) * fd.length);
    const i1 = Math.max(i0 + 1, Math.floor((f1 / nyq) * fd.length));
    let v = 0;
    for (let i = i0; i < i1; i++) v = Math.max(v, fd[i]);
    const h = (v / 255) * (H - 14);
    ctx.fillStyle = `hsl(${185 - b * 1.6}, 85%, ${45 + (v / 255) * 20}%)`;
    ctx.fillRect(b * bw + 1, H - h - 12, bw - 2, h);
  }
  ctx.fillStyle = '#7fa0a6';
  ctx.font = '10px "Azeret Mono", monospace';
  [100, 1000, 10000].forEach(f => ctx.fillText(f >= 1000 ? f / 1000 + 'k' : f, (Math.log(f / 60) / Math.log(16000 / 60)) * W, H - 1));
}

async function recordMic() {
  if (!AUD.stream || !apiAvailable('MediaRecorder')) return;
  const rec = new MediaRecorder(AUD.stream);
  const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    const url = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType }));
    const box = $('#auPlay');
    if (box) box.innerHTML = `<p class="small">${t('au_playback')}</p><audio controls src="${url}" style="width:100%"></audio>`;
  };
  $('#auRec').innerHTML = `${ic('mic')} ${t('au_recording')}`;
  rec.start();
  await sleep(4000);
  if (rec.state === 'recording') rec.stop();
  if ($('#auRec')) $('#auRec').innerHTML = `${ic('mic')} ${t('au_record')}`;
}

// ---------- loopback: play tones, listen with Goertzel, compare against a quiet window ----------
async function collectFrames(an, freq, phase, ms, frames) {
  const buf = new Float32Array(an.fftSize);
  const fs = audioCtx().sampleRate;
  const t0 = performance.now();
  while (performance.now() - t0 < ms) {
    an.getFloatTimeDomainData(buf);
    frames.push({ phase, snr: toneSnrDb(buf, freq, fs) });
    await sleep(30);
  }
}

/** A simulated room: tones and white noise mixed straight into an analyser (proves the detector, not the hardware). */
function simulatedPath() {
  const ac = audioCtx();
  const an = ac.createAnalyser();
  an.fftSize = 2048;
  const mix = ac.createGain();
  mix.connect(an);
  const noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const r = rng(11);
  noise.getChannelData(0).forEach((_, i, a) => (a[i] = r() * 2 - 1));
  const ns = ac.createBufferSource();
  ns.buffer = noise;
  ns.loop = true;
  const ng = ac.createGain();
  ng.gain.value = 0.04;
  ns.connect(ng).connect(mix);
  ns.start();
  return { an, mix, stop: () => ns.stop() };
}

async function runLoopback(simulate = false) {
  const ac = audioCtx();
  if (!ac) return toast(t('au_noAudio'), 'bad');
  if (!simulate && !(await startMic())) return;
  const sim = simulate ? simulatedPath() : null;
  const an = sim ? sim.an : AUD.an;
  const results = [];
  $('#auLoopRes').innerHTML = `<div class="skeleton" style="height:70px"></div>`;
  for (const f of LOOP_FREQS) {
    const frames = [];
    await collectFrames(an, f, 'quiet', 350, frames);
    const tone = playTone({ freq: f, dur: 0.7, gain: 0.5, dest: sim ? sim.mix : null });
    await collectFrames(an, f, 'tone', 650, frames);
    await tone;
    results.push({ f, ...loopbackVerdict(frames) });
  }
  if (sim) sim.stop();
  showLoopResults(results, simulate);
  return results;
}

function showLoopResults(results, simulate) {
  const heard = results.filter(r => r.heard).length;
  const best = Math.max(...results.map(r => r.best));
  const box = $('#auLoopRes');
  if (box) box.innerHTML = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${t('au_tone')}</th><th>${t('au_heard')}</th><th class="num">${t('au_best')}</th></tr></thead><tbody>
    ${results.map(r => `<tr><td class="mono">${r.f} Hz</td><td>${r.heard ? `<span class="chip pass">${ic('check')} ${t('yes')}</span>` : `<span class="chip fail">${ic('x')} ${t('no')}</span>`}</td><td class="num mono">${r.best.toFixed(1)} dB</td></tr>`).join('')}
    </tbody></table></div>${simulate ? `<p class="small c-warn mt-s">${t('au_simDone', { n: heard })}</p>` : ''}`;
  if (simulate) return;
  setReading('loopback', { heard, best: Math.round(best) });
  const ev = heard ? t('au_loopEv', { n: heard, db: best.toFixed(1) }) : t('au_loopFail');
  setCheck('loopback', heard >= 2 ? 'pass' : heard === 1 ? 'warn' : 'fail', ev, 'auto');
  if (heard >= 2 && S.session.checks.mic?.mode !== 'manual') setCheck('mic', 'pass', t('au_micEv'), 'auto');
}

/** Offline check that the Goertzel detector separates a tone from noise (also used by the behaviour tests). */
function dspSelfTest() {
  const fs = 48000;
  const tone = synthTone(2750, fs, 2048, { amp: 0.2, noise: 0.2 });
  const noise = synthTone(2750, fs, 2048, { amp: 0, noise: 0.2, seed: 9 });
  const a = toneSnrDb(tone, 2750, fs);
  const b = toneSnrDb(noise, 2750, fs);
  return { tone: a, noise: b, pass: a > 12 && b < 8 };
}

const CAM = { devices: [], stream: null, track: null, facing: '', torch: false, photoTo: 'camRear' };

function facingOf(track, label, index) {
  const f = track?.getSettings?.().facingMode;
  if (f === 'environment') return 'camRear';
  if (f === 'user') return 'camFront';
  if (/back|rear|environment|world/i.test(label)) return 'camRear';
  if (/front|user|face|selfie/i.test(label)) return 'camFront';
  return index === 0 ? 'camRear' : 'camFront';
}

async function listCameras() {
  if (!apiAvailable('getUserMedia')) return toast(t('cm_noApi'), 'bad');
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: true });
    stopStream(s);
    CAM.devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  } catch (e) {
    return toast(t(e.name === 'NotAllowedError' ? 'err_perm' : 'err_generic', { m: e.message }), 'bad');
  }
  setReading('cameraCount', CAM.devices.length);
  renderCamList();
  if (CAM.devices[0]) openCamera(0);
}

function renderCamList() {
  const box = $('#cmList');
  if (!box) return;
  box.innerHTML = CAM.devices.length ? CAM.devices.map((d, i) => `<button type="button" data-cam="${i}" class="${CAM.index === i ? 'on' : ''}">${ic('camera')}<span>${esc(d.label || t('cm_camN', { n: i + 1 }))}</span></button>`).join('') : `<p class="small muted">${t('cm_none')}</p>`;
  $$('[data-cam]', box).forEach(b => (b.onclick = () => openCamera(Number(b.dataset.cam))));
}

async function openCamera(i) {
  stopCamera();
  const d = CAM.devices[i];
  try {
    CAM.stream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: d.deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } } });
  } catch (e) {
    return toast(t('err_generic', { m: e.message }), 'bad');
  }
  CAM.index = i;
  CAM.track = CAM.stream.getVideoTracks()[0];
  CAM.facing = facingOf(CAM.track, d.label, i);
  CAM.torch = false;
  LIVE.add(stopCamera);
  $('#cmView').innerHTML = `<video id="cmVideo" playsinline muted autoplay></video><div class="reticle"></div><span class="tag">${t(CAM.facing === 'camRear' ? 'cm_rear' : 'cm_front')}</span>`;
  const v = $('#cmVideo');
  v.srcObject = CAM.stream;
  await v.play().catch(() => {});
  renderCamList();
  $('#cmCap').disabled = false;
  $('#cmTorch').disabled = false;
}

function stopCamera() {
  stopStream(CAM.stream);
  CAM.stream = null;
  CAM.track = null;
  LIVE.stops.delete(stopCamera);
}

/** Downscale a source (video, image or canvas) to 480 px wide and compute sharpness and exposure. */
function analyseFrame(src, w0, h0) {
  const w = 480;
  const h = Math.round((h0 / w0) * w);
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(src, 0, 0, w, h);
  const img = ctx.getImageData(0, 0, w, h);
  const sharp = laplacianVariance(toGray(img.data, w, h), w, h);
  const ex = exposureStats(img.data);
  const tc = document.createElement('canvas');
  tc.width = 160;
  tc.height = Math.round((h / w) * 160);
  tc.getContext('2d').drawImage(c, 0, 0, tc.width, tc.height);
  return { sharp: Math.round(sharp), ...ex, thumb: tc.toDataURL('image/jpeg', 0.6), canvas: c };
}

const sharpStatus = v => (v >= 120 ? 'pass' : v >= 50 ? 'warn' : 'fail');

function showCamResult(r, check, mode) {
  $('#cmView').innerHTML = '';
  $('#cmView').append(r.canvas);
  $('#cmView').insertAdjacentHTML('beforeend', `<span class="tag">${mode === 'simulated' ? t('simulated') : t(check === 'camRear' ? 'cm_rear' : 'cm_front')}</span>`);
  const cell = (k, v) => `<div><div class="lbl">${t(k)}</div><div class="readout">${v}</div></div>`;
  const hist = r.hist.map(v => `<i style="height:${Math.max(2, (v / Math.max(...r.hist)) * 100)}%"></i>`).join('');
  $('#cmRes').innerHTML = `<div class="readouts">${cell('cm_sharp', `<span class="c-${sharpStatus(r.sharp)}">${fmtNum(r.sharp)}</span>`)}${cell('cm_mean', Math.round(r.mean))}
    ${cell('cm_clip', `${r.clipLow.toFixed(1)}/${r.clipHigh.toFixed(1)}<small>%</small>`)}${cell('cm_cast', r.cast.map(v => (v > 0 ? '+' : '') + Math.round(v)).join(' '))}</div>
    <div class="hist mt" aria-hidden="true">${hist}</div>`;
  const ev = t('cm_ev', { v: fmtNum(r.sharp), m: Math.round(r.mean), lo: r.clipLow.toFixed(1), hi: r.clipHigh.toFixed(1) });
  if (mode === 'simulated') return;
  const cams = { ...(S.session.readings.cams || {}) };
  cams[check] = { sharp: r.sharp, mean: Math.round(r.mean), thumb: r.thumb };
  setReading('cams', cams);
  const exposureOk = r.mean > 35 && r.mean < 220;
  setCheck(check, exposureOk ? sharpStatus(r.sharp) : 'warn', ev, mode);
}

function captureCamera() {
  const v = $('#cmVideo');
  if (!v || !v.videoWidth) return;
  showCamResult(analyseFrame(v, v.videoWidth, v.videoHeight), CAM.facing, 'auto');

/** A synthetic test chart (text, lines, a star) — sharp or blurred — to demonstrate the metric without a camera. */
function demoChart(blur) {
  const c = document.createElement('canvas');
  c.width = 960;
  c.height = 720;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#f4f1ea';
  ctx.fillRect(0, 0, 960, 720);
  ctx.filter = blur ? 'blur(3px)' : 'none';
  ctx.fillStyle = '#111';
  ctx.font = 'bold 44px serif';
  ctx.fillText('MARAMMAT TEST CHART 31', 60, 90);
  ctx.font = '26px serif';
  for (let i = 0; i < 9; i++) ctx.fillText('The quick brown fox jumps over the lazy dog 0123456789', 60, 160 + i * 34);
  for (let k = 0; k < 36; k++) {
    ctx.beginPath();
    ctx.moveTo(760, 560);
    ctx.arc(760, 560, 130, (k * Math.PI) / 18, ((k + 0.5) * Math.PI) / 18);
    ctx.fill();
  }
  for (let x = 60; x < 560; x += 8) ctx.fillRect(x, 520, 3, 140);
  return c;
}

const SENS = { on: false, sim: false, n: 0, t0: 0, still: [], rotMax: 0, gyro: false, trace: [], beta: 0, gamma: 0, heading: null, bins: new Set(),
  ball: { x: 0.5, y: 0.5, vx: 0, vy: 0 }, targets: [false, false, false, false], raf: 0, simTilt: { x: 0, y: 0 } };

async function enableSensors() {
  try {
    if (typeof DeviceMotionEvent !== 'undefined' && DeviceMotionEvent.requestPermission) await DeviceMotionEvent.requestPermission();
    if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) await DeviceOrientationEvent.requestPermission();
  } catch {
    toast(t('err_perm'), 'bad');
  }
  startSensors(false);
  setTimeout(() => {
    if (SENS.on && !SENS.sim && !SENS.n && $('#snMsg')) $('#snMsg').innerHTML = `<div class="notice warn">${ic('alert')}<span>${t('sn_noData')}</span></div>`;
  }, 2500);
}

function startSensors(sim) {
  stopSensors();
  Object.assign(SENS, { on: true, sim, n: 0, t0: performance.now(), still: [], rotMax: 0, gyro: false, trace: [], bins: new Set(), heading: null,
    ball: { x: 0.5, y: 0.5, vx: 0, vy: 0 }, targets: [false, false, false, false] });
  if (!sim) {
    window.addEventListener('devicemotion', onMotion);
    window.addEventListener('deviceorientation', onOrient);
    window.addEventListener('deviceorientationabsolute', onOrientAbs);
  } else if ($('#snMsg')) $('#snMsg').innerHTML = `<div class="notice warn">${ic('cpu')}<span>${t('sn_simOn')}</span></div>`;
  SENS.raf = requestAnimationFrame(sensorFrame);
  LIVE.add(stopSensors);
}

function stopSensors() {
  window.removeEventListener('devicemotion', onMotion);
  window.removeEventListener('deviceorientation', onOrient);
  window.removeEventListener('deviceorientationabsolute', onOrientAbs);
  cancelAnimationFrame(SENS.raf);
  SENS.on = false;
  LIVE.stops.delete(stopSensors);
}

function onMotion(e) {
  const a = e.accelerationIncludingGravity;
  if (!a || a.x == null) return;
  SENS.n++;
  const g = Math.hypot(a.x, a.y, a.z);
  SENS.last = { x: a.x, y: a.y, z: a.z, g };
  SENS.trace.push([a.x, a.y, a.z]);
  if (SENS.trace.length > 160) SENS.trace.shift();
  const r = e.rotationRate;
  if (r && r.alpha != null) {
    SENS.gyro = true;
    SENS.rot = r;
    SENS.rotMax = Math.max(SENS.rotMax, Math.hypot(r.alpha, r.beta, r.gamma));
    if (Math.hypot(r.alpha, r.beta, r.gamma) < 3) SENS.still.push(g);
  } else SENS.still.push(g);
  if (SENS.still.length > 200) SENS.still.shift();
}

function onOrient(e) {
  if (e.beta == null) return;
  SENS.beta = e.beta;
  SENS.gamma = e.gamma;
  if (e.webkitCompassHeading != null) trackHeading(e.webkitCompassHeading);
}

function onOrientAbs(e) {
  if (e.alpha != null) trackHeading((360 - e.alpha) % 360);
}

function trackHeading(h) {
  SENS.heading = h;
  SENS.bins.add(Math.floor(h / 30) % 12);
}

/** One animation frame: move the ball, draw the trace and compass, and evaluate results. */
function sensorFrame() {
  if (!SENS.on) return;
  const tilt = SENS.sim ? SENS.simTilt : { x: clamp(SENS.gamma / 35, -1, 1), y: clamp(SENS.beta / 35, -1, 1) };
  const b = SENS.ball;
  b.vx = (b.vx + tilt.x * 0.0016) * 0.96;
  b.vy = (b.vy + tilt.y * 0.0016) * 0.96;
  b.x = clamp(b.x + b.vx, 0.06, 0.94);
  b.y = clamp(b.y + b.vy, 0.06, 0.94);
  [[0.1, 0.1], [0.9, 0.1], [0.1, 0.9], [0.9, 0.9]].forEach(([tx, ty], i) => {
    if (Math.hypot(b.x - tx, b.y - ty) < 0.09) SENS.targets[i] = true;
  });
  drawTilt();
  drawMotion();
  drawCompass();
  evaluateSensors();
  SENS.raf = requestAnimationFrame(sensorFrame);
}

function drawTilt() {
  const cv = $('#snTilt');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const W = cv.width;
  ctx.clearRect(0, 0, W, W);
  [[0.1, 0.1], [0.9, 0.1], [0.1, 0.9], [0.9, 0.9]].forEach(([x, y], i) => {
    ctx.beginPath();
    ctx.arc(x * W, y * W, W * 0.07, 0, Math.PI * 2);
    ctx.fillStyle = SENS.targets[i] ? 'rgba(63,217,138,.55)' : 'rgba(217,139,95,.18)';
    ctx.strokeStyle = SENS.targets[i] ? '#3fd98a' : '#d98b5f';
    ctx.lineWidth = 2;
    ctx.fill();
    ctx.stroke();
  });
  ctx.beginPath();
  ctx.arc(SENS.ball.x * W, SENS.ball.y * W, W * 0.045, 0, Math.PI * 2);
  ctx.fillStyle = '#33e1ed';
  ctx.shadowColor = '#33e1ed';
  ctx.shadowBlur = 16;
  ctx.fill();
  ctx.shadowBlur = 0;
  const n = SENS.targets.filter(Boolean).length;
  if ($('#snTargets')) $('#snTargets').textContent = t('sn_targets', { n });
}

function drawMotion() {
  const l = SENS.last;
  if (l && $('#snAcc')) {
    $('#snAcc').textContent = `${l.x.toFixed(2)} ${l.y.toFixed(2)} ${l.z.toFixed(2)}`;
    $('#snG').textContent = l.g.toFixed(2);
    const secs = (performance.now() - SENS.t0) / 1000;
    $('#snRate').textContent = Math.round(SENS.n / Math.max(secs, 0.1)) + ' Hz';
  }
  if (SENS.rot && $('#snRot')) $('#snRot').textContent = [SENS.rot.alpha, SENS.rot.beta, SENS.rot.gamma].map(v => v.toFixed(0)).join(' ');
  const cv = $('#snTrace');
  if (!cv || !SENS.trace.length) return;
  const ctx = cv.getContext('2d');
  const W = cv.width;
  const H = cv.height;
  ctx.clearRect(0, 0, W, H);
  ['#ff6b6b', '#3fd98a', '#33e1ed'].forEach((col, k) => {
    ctx.beginPath();
    SENS.trace.forEach((p, i) => ctx[i ? 'lineTo' : 'moveTo']((i / 159) * W, H / 2 - (p[k] / 20) * (H / 2)));
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });
}

function drawCompass() {
  const rose = $('#snRose');
  if (!rose) return;
  if (SENS.heading != null) {
    rose.style.transform = `rotate(${-SENS.heading}deg)`;
    $('#snHead').textContent = Math.round(SENS.heading) + '°';
  }
  $$('#snBins path').forEach((p, i) => p.setAttribute('fill', SENS.bins.has(i) ? 'rgba(63,217,138,.5)' : 'rgba(255,255,255,.04)'));
}

function evaluateSensors() {
  if (SENS.sim) return;
  const c = S.session.checks;
  const auto = id => !c[id] || c[id].mode !== 'manual';
  if (SENS.n > 60 && SENS.still.length > 20 && auto('accel') && !c.accel) {
    const g = median(SENS.still);
    const hz = Math.round(SENS.n / ((performance.now() - SENS.t0) / 1000));
    setCheck('accel', g > 8.8 && g < 10.8 ? 'pass' : 'fail', t(g > 8.8 && g < 10.8 ? 'sn_evAccel' : 'sn_evAccelBad', { n: SENS.n, hz, g: g.toFixed(2) }), 'auto');
  }
  if (SENS.n > 60 && !SENS.gyro && auto('gyro') && !c.gyro) setCheck('gyro', 'skip', t('sn_evGyroNone'), 'auto');
  if (SENS.rotMax > 90 && auto('gyro') && c.gyro?.s !== 'pass') setCheck('gyro', 'pass', t('sn_evGyro', { r: Math.round(SENS.rotMax) }), 'auto');
  if (SENS.targets.every(Boolean) && auto('tilt') && c.tilt?.s !== 'pass') setCheck('tilt', 'pass', t('sn_evTilt'), 'auto');
  if (SENS.bins.size === 12 && auto('compass') && c.compass?.s !== 'pass') setCheck('compass', 'pass', t('sn_evCompass', { h: Math.round(SENS.heading) }), 'auto');
}

function bindTiltSim() {
  const cv = $('#snTilt');
  const fromPointer = e => {
    if (!SENS.sim || !(e.buttons || e.pointerType === 'touch')) return;
    const r = cv.getBoundingClientRect();
    SENS.simTilt = { x: clamp(((e.clientX - r.left) / r.width - SENS.ball.x) * 4, -1, 1), y: clamp(((e.clientY - r.top) / r.height - SENS.ball.y) * 4, -1, 1) };
  };
  cv.onpointerdown = cv.onpointermove = fromPointer;
  cv.onpointerup = () => (SENS.simTilt = { x: 0, y: 0 });
  cv.onkeydown = e => {
    const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (!d) return;
    e.preventDefault();
    if (!SENS.sim) startSensors(true);
    SENS.simTilt = { x: d[0], y: d[1] };
    setTimeout(() => (SENS.simTilt = { x: 0, y: 0 }), 180);
  };
}

function compassSvg() {
  const bins = Array.from({ length: 12 }, (_, i) => {
    const a0 = ((i * 30 - 90) * Math.PI) / 180;
    const a1 = (((i + 1) * 30 - 90) * Math.PI) / 180;
    return `<path d="M100 100 L${100 + 92 * Math.cos(a0)} ${100 + 92 * Math.sin(a0)} A92 92 0 0 1 ${100 + 92 * Math.cos(a1)} ${100 + 92 * Math.sin(a1)}Z"/>`;
  }).join('');
  return `<svg class="compass" viewBox="0 0 200 200" aria-hidden="true"><g id="snBins" stroke="#23313a">${bins}</g>
    <g id="snRose" class="rose"><circle cx="100" cy="100" r="70" fill="none" stroke="#2f414c" stroke-width="2"/>
    <path d="M100 38 L110 100 L100 92 L90 100Z" fill="#ff6b6b"/><path d="M100 162 L110 100 L100 108 L90 100Z" fill="#7fa0a6"/>
    <text x="100" y="30" text-anchor="middle" fill="#d9f9fb" font-size="14" font-family="Azeret Mono">N</text></g></svg>`;
}

  setTimeout(() => {

    box.innerHTML = `<span class="grow">${t('hw_vibAsk')}</span> <button type="button" class="btn pass xs" data-a="pass">${t('yes')}</button> <button type="button" class="btn fail xs" data-a="fail">${t('no')}</button>`;

// ---------- battery: live level and charge-state change ----------
const fmtSecs = s => (!isFinite(s) || s <= 0 ? '—' : s >= 3600 ? `${Math.floor(s / 3600)} h ${Math.round((s % 3600) / 60)} min` : `${Math.round(s / 60)} min`);

async function showBattery() {
  const box = $('#hwBat');
  if (!box || !apiAvailable('Battery')) return;
  try {
    const b = await navigator.getBattery();
    const draw = () => {
      if (!$('#hwBat')) return;
      const cell = (k, v) => `<div><div class="lbl">${t(k)}</div><div class="readout">${v}</div></div>`;
      $('#hwBat').innerHTML = `<div class="readouts">${cell('hw_level', Math.round(b.level * 100) + '<small>%</small>')}${cell('hw_charging', b.charging ? t('yes') : t('no'))}
        ${cell('hw_toFull', fmtSecs(b.chargingTime))}${cell('hw_toEmpty', fmtSecs(b.dischargingTime))}</div>`;
    };
    draw();
    b.onlevelchange = draw;
    HW.battery = b;
    HW.drawBattery = draw;
    LIVE.add(() => (b.onlevelchange = b.onchargingchange = null));
  } catch {
    box.innerHTML = `<p class="small c-warn">${t('hw_noBattery')}</p>`;
  }
}

const HW = { battery: null, drawBattery: null };

function watchCharger() {
  const b = HW.battery;
  if (!b) return toast(t('hw_noBattery'), 'bad');
  const start = b.charging;
  $('#hwPlugMsg').innerHTML = `<span class="dot live"></span> ${t('hw_plugWait')}`;
  b.onchargingchange = () => {
    HW.drawBattery?.();
    if (b.charging === start) return;
    const msg = t('hw_plugOk', { s: b.charging ? t('hw_charging') : t('no') + ' ' + t('hw_charging').toLowerCase() });
    $('#hwPlugMsg').textContent = msg;
    setCheck('charging', 'pass', msg, 'auto');
  };
}

function saveHealth() {
  const bt = S.session.battery;
  bt.health = $('#hwHealth').value === '' ? '' : clamp(Number($('#hwHealth').value), 0, 100);
  bt.cycles = $('#hwCycles').value;
  bt.source = $('#hwSrc').value;
  persist('session');
  if (bt.health === '') return;
  const h = Number(bt.health);
  setCheck('batteryHealth', h >= 85 ? 'pass' : h >= 80 ? 'warn' : 'fail', t('hw_healthEv', { h, src: t('src_' + bt.source) }), 'manual');
}

// ---------- GPS: time to first fix and accuracy (position itself is not stored) ----------
function runGps() {
  if (!apiAvailable('Geolocation')) return toast(t('hw_gpsNo'), 'bad');
  const t0 = performance.now();
  $('#hwGps').innerHTML = `<p class="small"><span class="dot live"></span> ${t('hw_gpsWait')}</p>`;
  navigator.geolocation.getCurrentPosition(p => {
    const s = ((performance.now() - t0) / 1000).toFixed(1);
    const a = Math.round(p.coords.accuracy);
    setReading('gps', { s: Number(s), acc: a });
    drawGps();
    setCheck('gps', a <= 50 ? 'pass' : a <= 200 ? 'warn' : 'fail', t('hw_gpsEv', { s, a }), 'auto');
  }, e => {
    $('#hwGps').innerHTML = `<p class="small c-warn">${esc(e.code === 1 ? t('err_perm') : t('err_generic', { m: e.message }))}</p>`;
  }, { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 });
}

function drawGps() {
  const g = S.session.readings.gps;
  const box = $('#hwGps');
  if (!box || !g) return;
  box.innerHTML = `<div class="readouts"><div><div class="lbl">${t('hw_ttff')}</div><div class="readout">${g.s}<small>s</small></div></div>
    <div><div class="lbl">${t('hw_acc')}</div><div class="readout">±${g.acc}<small>m</small></div></div></div>`;
}

function saveRadios() {

  setReading('radios', r);
  const n = Object.values(r).filter(Boolean).length;

async function showStorage() {
  const box = $('#hwStore');
  if (!box) return;
  const cell = (k, v) => `<div><div class="lbl">${t(k)}</div><div class="readout">${v}</div></div>`;
  let quota = 0;
  try {
    quota = (await navigator.storage?.estimate?.())?.quota || 0;
  } catch {
    quota = 0;
  }
  const disk = quota ? quota / 0.6 : 0;
  setReading('quota', quota);
  const claimed = Number(S.session.claimed.storage) || 0;
  box.innerHTML = `<div class="readouts">${cell('hw_quota', quota ? fmtBytes(quota) : '—')}${cell('hw_disk', disk ? '≈ ' + fmtBytes(disk) : '—')}
    ${cell('hw_mem', navigator.deviceMemory ? '≈ ' + navigator.deviceMemory + ' GB' : '—')}${cell('id_cores', navigator.hardwareConcurrency || '—')}</div>
    ${claimed && disk && disk < claimed * 1e9 * 0.35 ? `<div class="notice warn mt">${ic('alert')}<span>${t('hw_diskWarn', { gb: claimed })}</span></div>` : ''}`;
}

function benchRow(label, value, max, cls = 'cyan') {
  return `<div class="bench-row"><span class="small">${label}</span><div class="bar ${cls}"><i data-w="${clamp((value / max) * 100, 2, 100).toFixed(1)}"></i></div><b class="mono small" style="text-align:end">${fmtNum(value)}</b></div>`;
}

function cpuPanel() {
  const r = S.session.readings.cpu;
  const m = sessModel();
  if (!r) return `<p class="small muted">${t('pf_keepCool')}</p>`;
  const max = Math.max(r.multi, (m?.cpuRef || 1000) * 8);
  return `${benchRow(t('pf_single'), r.single, Math.max(r.single, m?.cpuRef || 1000) * 1.25)}${benchRow(`${t('pf_multi')} · ${r.threads}`, r.multi, max)}
    ${r.times ? `<p class="tiny mono muted">${t('pf_tasks')}: ${['hash', 'sort', 'mat'].map(k => r.times[k].toFixed(0)).join(' · ')}</p>` : ''}
    ${r.workers ? '' : `<p class="tiny c-warn">${t('pf_noWorker')}</p>`}`;
}

function gpuPanel() {
  const g = S.session.readings.gpu;
  if (!g) return '';
  if (!g.ok) return `<p class="small c-warn">${t('pf_noGl')}</p>`;
  const m = sessModel();
  return `${benchRow(t('pf_score'), g.score, Math.max(g.score, m?.gpuRef || 1000) * 1.25)}
    <p class="tiny mono muted">${t('pf_renderer')}: ${esc(g.renderer || S.session.readings.renderer || '—')}${g.mpix ? ` · ${g.mpix.toFixed(0)} Mpix/s` : ''}</p>`;
}

function specTable() {
  const m = sessModel();
  if (!m) return `<p class="small muted">${t('pf_pickModel')}</p>`;
  const rows = compareSpecs(m, S.session.readings);
  const v = specVerdict(rows);
  const chip = st => `<span class="chip ${{ match: 'pass', warn: 'warn', mismatch: 'fail', unknown: 'skip' }[st]}">${t('st_' + st)}</span>`;
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th></th><th>${t('pf_claimed')}</th><th>${t('pf_measured')}</th><th>${t('status')}</th></tr></thead>
    <tbody>${rows.map(r => `<tr><td>${t(r.k)}</td><td class="mono small">${esc(r.claimed)}</td><td class="mono small" style="overflow-wrap:anywhere">${esc(r.measured)}</td><td>${chip(r.st)}</td></tr>`).join('')}</tbody></table></div>
    <div class="notice ${v.status === 'fail' ? 'fail' : v.status === 'warn' ? 'warn' : ''} mt">${ic(v.status === 'pass' ? 'check-circle' : 'alert')}<span>${t('pf_verdict_' + v.status)}</span></div>`;
}

function evaluatePerf() {
  const m = sessModel();
  const r = S.session.readings;
  if (r.cpu && m) {
    const ratio = r.cpu.single / m.cpuRef;
    setCheck('cpu', ratio >= 0.6 ? 'pass' : ratio >= 0.35 ? 'warn' : 'fail', t('pf_evCpu', { s: r.cpu.single, m: r.cpu.multi, r: Math.round(ratio * 100) }), 'auto');
  }
  if (r.gpu?.ok && m) {
    const ratio = r.gpu.score / m.gpuRef;
    setCheck('gpu', ratio >= 0.6 ? 'pass' : ratio >= 0.35 ? 'warn' : 'fail', t('pf_evGpu', { s: r.gpu.score, mp: r.gpu.mpix?.toFixed(0) || '—', r: Math.round(ratio * 100) }), 'auto');
  }
  if (!m) return;
  const v = specVerdict(compareSpecs(m, r));
  if (v.status !== 'skip') setCheck('specMatch', v.status, t('pf_evSpec', { n: v.strong }) + ' · ' + t('pf_verdict_' + v.status), 'auto');
}

async function runCpu() {
  const btn = $('#pfCpu');
  btn.disabled = true;
  $('#pfCpuBox').innerHTML = `<div class="bar cyan"><i id="pfCpuBar" style="width:2%"></i></div>`;
  const r = await runCpuBench({ onProgress: p => $('#pfCpuBar') && ($('#pfCpuBar').style.width = Math.round(p * 100) + '%') });
  const rd = S.session.readings;
  delete rd.demo;
  setReading('cpu', { single: r.single, multi: r.multi, threads: r.threads, workers: r.workers, times: r.times });
  setReading('cores', navigator.hardwareConcurrency || null);
  setReading('memory', navigator.deviceMemory || null);
  if ($('#pfCpuBox')) $('#pfCpuBox').innerHTML = cpuPanel();
  settle($('#pfCpuBox'));
  btn.disabled = false;
  evaluatePerf();
  refreshSpec();
}

async function runGpu() {
  const btn = $('#pfGpu');
  btn.disabled = true;
  $('#pfGpuBox').innerHTML = `<div class="bar cyan"><i id="pfGpuBar" style="width:2%"></i></div>`;
  const g = await runGpuBench({ onProgress: p => $('#pfGpuBar') && ($('#pfGpuBar').style.width = Math.round(clamp(p, 0, 1) * 100) + '%') });
  delete S.session.readings.demo;
  setReading('gpu', g.ok ? { ok: true, score: g.score, mpix: g.mpix, renderer: g.renderer } : { ok: false });
  if (g.renderer) setReading('renderer', g.renderer);
  if ($('#pfGpuBox')) $('#pfGpuBox').innerHTML = gpuPanel();
  settle($('#pfGpuBox'));
  btn.disabled = false;
  evaluatePerf();
  refreshSpec();
}

function refreshSpec() {
  const box = $('#pfSpec');
  if (box) box.innerHTML = specTable();
}

function physRow(item) {
  const v = S.session.physical.items[item] || '';
  return `<div class="setrow"><span class="small">${t('pi_' + item)}</span><div class="seg status" data-item="${item}">
    ${[['ok', 'pass', 'ph_ok'], ['issue', 'fail', 'ph_issue'], ['na', 'skip', 'ph_na']].map(([val, cls, k]) => `<button type="button" data-v="${cls}" data-val="${val}" class="${v === val ? 'on' : ''}">${t(k)}</button>`).join('')}</div></div>`;
}

/** Derive the check results from the item states and the body grade. */
function evaluatePhysical() {
  const p = S.session.physical;
  for (const [check, items] of Object.entries(PHYS)) {
    const vals = items.map(i => p.items[i]).filter(Boolean);
    if (!vals.length) continue;
    const ok = vals.filter(v => v === 'ok').length;
    const bad = vals.filter(v => v === 'issue').length;
    const ev = t('ph_evItems', { ok, bad });
    if (bad) setCheck(check, check === 'lens' ? 'warn' : 'fail', ev, 'manual');
    else if (ok) setCheck(check, 'pass', ev, 'manual');
    else setCheck(check, 'skip', ev, 'manual');
  }
  if (p.body) setCheck('body', { A: 'pass', B: 'pass', C: 'warn', D: 'fail' }[p.body], t('bd_' + p.body), 'manual');
}

function photosHtml() {
  const ph = S.session.physical.photos;
  return `<div class="grid g3" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr))">${ph.map(x => `<figure style="margin:0" class="card flat" data-photo="${x.id}">
      <img src="${x.data}" alt="${esc(t('pl_' + x.label))}" style="width:100%;border-radius:8px;aspect-ratio:3/4;object-fit:cover">
      <figcaption class="between tiny mt-s"><span>${t('pl_' + x.label)}</span><button type="button" class="ibtn sm" data-del-photo="${x.id}" aria-label="${t('delete')}">${ic('trash')}</button></figcaption>
      <code class="tiny">${esc(x.hash)}</code></figure>`).join('')}</div>`;
}

async function addPhoto(label) {
  if (S.session.physical.photos.length >= 6) return toast(t('ph_max'), 'bad');
  pickFile('image/*', async f => {
    const data = await resizeImage(f);
    const hash = hasCrypto() ? hex(await sha256(data)).slice(0, 12) : '';
    S.session.physical.photos.push({ id: uid('ph'), label, data, hash, at: now() });
    if (!persist('session')) S.session.physical.photos.pop();
    $('#phPhotos').innerHTML = photosHtml();
    bindPhotoDeletes();
  }, { asText: false, capture: 'environment' });
}

function bindPhotoDeletes() {
  $$('[data-del-photo]').forEach(b => (b.onclick = () => {
    S.session.physical.photos = S.session.physical.photos.filter(x => x.id !== b.dataset.delPhoto);
    persist('session');
    $('#phPhotos').innerHTML = photosHtml();
    bindPhotoDeletes();
  }));
}
