  printFooter: ['Generated by FraudShield (FYP template). Guidance only, not a guarantee; all contacts illustrative — verify on the official site.', 'فراڈ شیلڈ (ایف وائی پی ٹیمپلیٹ) سے تیار کردہ۔ صرف رہنمائی، ضمانت نہیں؛ تمام رابطے مثالی — سرکاری ویب سائٹ پر تصدیق کریں۔'],
  flag: ['Flag', 'نشانی'],
  evidence: ['Evidence', 'ثبوت'],
  summary: ['Summary', 'خلاصہ'],
  metric: ['Metric', 'پیمائش'],
  value: ['Value', 'قدر'],
});

// ---------- text normalisation, script detection and tokenisation ----------
// normalizeWithMap keeps an index map back to the original string so rule matches found on the
// normalised text can be highlighted in the text the user typed.
const URDU_VARIANTS = { 'ي': 'ی', 'ى': 'ی', 'ك': 'ک', 'ه': 'ہ', 'ة': 'ہ', 'ۃ': 'ہ', 'ۂ': 'ہ', 'ۓ': 'ے', 'أ': 'ا', 'إ': 'ا' };
const DROP_CHARS = /[\u064B-\u065F\u0670\u06D6-\u06ED\u0640\u200B\u200D-\u200F\u202A-\u202E\u2066-\u2069\uFEFF]/;
const ARABIC_RX = /[\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF]/;

function normChar(ch) {
  const code = ch.charCodeAt(0);
  if (code >= 0x06f0 && code <= 0x06f9) return String(code - 0x06f0);
  if (code >= 0x0660 && code <= 0x0669) return String(code - 0x0660);
  if (URDU_VARIANTS[ch]) return URDU_VARIANTS[ch];
  if (ch === '\u200C') return ' ';
  return ch.toLowerCase().charAt(0) || ch;
}

function normalizeWithMap(input) {
  const text = String(input || '').normalize('NFC');
  let norm = '';
  const map = [];
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (DROP_CHARS.test(ch)) continue;
    const out = normChar(ch);
    // Collapse a Latin letter repeated three or more times ("urgenttt" -> "urgent").
    if (/[a-z]/.test(out) && norm.endsWith(out + out)) continue;
    norm += out;
    map.push(i);
  }
  map.push(text.length);
  return { text, norm, map };
}

const normalizeText = s => normalizeWithMap(s).norm;

// Detect English, Urdu (Arabic script) or Roman Urdu (Urdu written in Latin letters).
function detectScript(input) {
  const s = normalizeText(input);
  const arabic = (s.match(new RegExp(ARABIC_RX.source, 'g')) || []).length;
  const latin = (s.match(/[a-z]/g) || []).length;
  if (!arabic && !latin) return 'en';
  if (arabic >= latin) return latin > arabic * 0.4 ? 'mixed' : 'ur';
  const words = s.match(/[a-z]+/g) || [];
  const roman = words.filter(w => ROMAN_MARKERS.has(ROMAN_VARIANTS[w] || w)).length;
  if (arabic > latin * 0.25) return 'mixed';
  return roman >= 2 && roman / words.length >= 0.1 ? 'ru' : 'en';
}

// ---------- extractors ----------
const TLDS = 'com|pk|net|org|xyz|top|click|live|online|site|info|gov|edu|io|ly|me|co|app|shop|link|icu|buzz|tk|ml|ga|cf|gq|work|support|loan|win|biz|store|club|vip|cc|pw';
const URL_RX = new RegExp(String.raw`(?:https?:\/\/|www\.)[^\s<>"'\u060C\u06D4]+|(?<![@\w.-])(?:[a-z0-9\u00A1-\u05FF\u0750-\uFFFD-]+\.)+(?:${TLDS})(?:\.[a-z]{2})?(?::\d+)?(?:\/[^\s<>"'\u060C\u06D4]*)?`, 'giu');
const MOBILE_RX = /(?:(?:\+|00)92[\s-]?3\d{2}|(?<!\d)03\d{2})[\s-]?\d{7}(?!\d)/g;
const FOREIGN_RX = /(?<![\d+])\+(?!92)\d{1,3}[\s-]?\d[\d\s-]{6,13}\d/g;

function extractUrls(text) {
  const out = [];
  for (const m of String(text).matchAll(URL_RX)) {
    const raw = m[0].replace(/[.,!?)\]]+$/, '');
    if (raw.length < 4) continue;
    out.push({ raw, s: m.index, e: m.index + raw.length });
  }
  return out;
}

function extractMatches(text, rx) {
  rx.lastIndex = 0;
  return [...String(text).matchAll(rx)].map(m => ({ raw: m[0], s: m.index, e: m.index + m[0].length }));
}

// ---------- tokeniser for the classifiers ----------
const SPECIAL_TOKENS = { xxurl: ['[link]', '[لنک]'], xxphone: ['[mobile no.]', '[موبائل نمبر]'], xxintl: ['[foreign no.]', '[غیر ملکی نمبر]'], xxnum: ['[number]', '[عدد]'] };

function mlTokens(input, bigrams = true) {
  let s = normalizeText(input);
  s = s.replace(URL_RX, ' xxurl ').replace(MOBILE_RX, ' xxphone ').replace(FOREIGN_RX, ' xxintl ');
  s = s.replace(/\d[\d,.]*/g, ' xxnum ');
  const words = s.match(/[\p{L}\p{M}]+/gu) || [];
  const toks = words.map(w => ROMAN_VARIANTS[w] || w).filter(w => w.length > 1 || ARABIC_RX.test(w));
  if (!bigrams) return toks;
  const out = toks.slice();
  for (let i = 0; i + 1 < toks.length; i++) out.push(toks[i] + ' ' + toks[i + 1]);
  return out;
}

function displayToken(tok) {
  if (tok.startsWith('rule:')) return L(['rule', 'اصول']) + ': ' + L(FLAG_INDEX[tok.slice(5)].title);
  return tok
    .split(' ')
    .map(w => (SPECIAL_TOKENS[w] ? L(SPECIAL_TOKENS[w]) : w))
    .join(' ');
}

// ---------- message analyser: rule engine ----------
// Each flag's patterns are compiled into one Unicode regex with letter-aware boundaries
// (\b does not work for Urdu script), run on the normalised text and mapped back to the original.
const BOUND_L = String.raw`(?<![\p{L}\p{M}\p{N}_])`;
const BOUND_R = String.raw`(?![\p{L}\p{M}\p{N}_])`;
const COMPILED_FLAGS = FLAG_DEFS.map(def => ({
  ...def,
  re: new RegExp(def.rx.map(src => `${BOUND_L}(?:${src})${BOUND_R}`).join('|'), 'giu'),
}));
const FLAG_INDEX = Object.fromEntries([...FLAG_DEFS.map(d => [d.id, d]), ...Object.entries(CONTEXT_FLAGS).map(([id, d]) => [id, { id, ...d }])]);
const CONTACT_RX = /call|contact|whatsapp|rabta|raabta|رابطہ|کال|واٹس ?ایپ|is number|اس نمبر/iu;
const OFFICIAL_SHORTCODES = ['8171', '3737', '8558', '9000', '8222', '1991'];

function findPatternFlags(norm, map) {
  const found = {};
  for (const def of COMPILED_FLAGS) {
    def.re.lastIndex = 0;
    for (const m of norm.matchAll(def.re)) {
      if (!m[0].trim()) continue;
      const s = map[m.index];
      const e = map[m.index + m[0].length - 1] + 1;
      (found[def.id] = found[def.id] || []).push({ s, e });
    }
  }
  return found;
}

// Drop matches that sit inside protective wording ("never share your OTP").
function applySuppression(found) {
  const shields = found.protective || [];
  for (const id of ['secrecy', 'credentials']) {
    if (!found[id]) continue;
    found[id] = found[id].filter(m => !shields.some(p => m.s < p.e && p.s < m.e));
    if (!found[id].length) delete found[id];
  }
  return found;
}

function senderKind(sender) {
  const s = String(sender || '').trim();
  if (!s) return 'unknown';
  const digits = s.replace(/[\s-]/g, '');
  if (/^(?:\+92|0092|92)?0?3\d{9}$/.test(digits) || /^03\d{9}$/.test(digits)) return 'mobile';
  if (/^\+\d{7,}$/.test(digits)) return 'intl';
  if (/^\d{3,6}$/.test(digits)) return 'shortcode';
  if (/[a-z]/i.test(s)) return 'alpha';
  return 'unknown';
}

function isTrustedSenderName(sender) {
  const key = String(sender || '').toLowerCase().replace(/[^a-z]/g, '');
  if (!key) return false;
  return trustedDomains().some(d => d.keys.includes(key) || d.brand.toLowerCase().replace(/[^a-z]/g, '') === key);
}

function addContext(found, id, spans = []) {
  found[id] = spans.length ? spans : [{ s: -1, e: -1 }];
}

// Flags that depend on the sender, phone numbers and links rather than on words.
function contextFlags(text, found, sender, links) {
  const kind = senderKind(sender);
  const mobiles = extractMatches(text, MOBILE_RX);
  const foreign = extractMatches(text, FOREIGN_RX);
  const claimsOrg = found.brand || found.govt || found.account;
  if (mobiles.length && (claimsOrg || found.prize || found.transfer || CONTACT_RX.test(text))) addContext(found, 'mobileNumber', mobiles);
  if (foreign.length) addContext(found, 'foreignNumber', foreign);
  if ((kind === 'mobile' || kind === 'intl') && claimsOrg) addContext(found, 'spoofSender');
  const risky = links.filter(l => l.res.level !== 'low');
  if (risky.length) addContext(found, 'badLink', risky.map(l => ({ s: l.s, e: l.e })));
  else if (links.length) addContext(found, 'link', links.map(l => ({ s: l.s, e: l.e })));
  const from8171 = String(sender || '').replace(/\D/g, '') === '8171';
  if (found.govt && !from8171 && (found.mobileNumber || found.link || found.badLink || found.transfer || found.credentials)) addContext(found, 'govtSender');
  const officialName = (kind === 'shortcode' && OFFICIAL_SHORTCODES.includes(sender.trim())) || (kind === 'alpha' && isTrustedSenderName(sender));
  if (officialName && !found.badLink && !found.credentials && !found.govtSender) addContext(found, 'officialSender');
  const bangs = /!{3,}/.test(text);
  const letters = text.match(/[A-Za-z]/g) || [];
  const caps = letters.filter(c => c >= 'A' && c <= 'Z').length;
  if (bangs || (letters.length >= 16 && caps / letters.length > 0.45)) addContext(found, 'shouting');
}

function comboHits(found) {
  const has = need => (Array.isArray(need) ? need.some(n => found[n]) : !!found[need]);
  return COMBOS.filter(c => c.needs.every(has));
}

function levelFor(score, sensitivity = SETTINGS.sensitivity || 0) {
  if (score >= 55 - sensitivity) return 'high';
  if (score >= 25 - sensitivity) return 'med';
  return 'low';
}

const scoreFromRaw = raw => Math.round(100 * (1 - Math.exp(-Math.max(0, raw) / 45)));

// Main entry: analyse one message. Returns flags with spans, score 0–100, verdict level and advice.
function analyseMessage(input, { sender = '', channel = 'sms' } = {}) {
  const { text, norm, map } = normalizeWithMap(input);
  const found = applySuppression(findPatternFlags(norm, map));
  const links = extractUrls(text).map(u => ({ ...u, res: analyseUrl(u.raw) }));
  contextFlags(text, found, sender, links);
  const flags = Object.entries(found).map(([id, matches]) => {
    const def = FLAG_INDEX[id];
    const extra = def.w > 0 ? Math.min(2, matches.length - 1) * def.w * 0.15 : 0;
    const linkBoost = id === 'badLink' ? Math.max(...links.map(l => l.res.score)) / 5 : 0;
    const pts = Math.round(def.w + extra + linkBoost);
    return { id, def, sev: def.sev, pts, matches: matches.filter(m => m.s >= 0) };
  });
  flags.sort((a, b) => b.pts - a.pts);
  const combos = comboHits(found);
  const raw = sum(flags.map(f => f.pts)) + sum(combos.map(c => c.w));
  const score = scoreFromRaw(raw);
  return { text, norm, sender, channel, script: detectScript(text), flags, combos, links, raw, score, level: levelFor(score) };
}

// Advice: the most severe flags first, de-duplicated, ending with the general steps.
function adviceFor(result) {
  const out = [];
  for (const f of result.flags) {
    const a = L(f.def.advice);
    if (a && !out.includes(a)) out.push(a);
  }
  if (result.level !== 'low') out.push(t('adviceReport'));
  out.push(t('adviceGeneral'));
  return out.slice(0, 6);
}

// Merge overlapping flag spans into segments for highlighting.
function highlightSegments(result) {
  const spans = [];
  result.flags.forEach(f => f.matches.forEach(m => spans.push({ ...m, id: f.id, sev: f.sev })));
  const cuts = new Set([0, result.text.length]);
  spans.forEach(s => {
    cuts.add(s.s);
    cuts.add(s.e);
  });
  const points = [...cuts].sort((a, b) => a - b);
  const segs = [];
  for (let i = 0; i + 1 < points.length; i++) {
    const a = points[i];
    const b = points[i + 1];
    const cover = spans.filter(s => s.s <= a && s.e >= b);
    segs.push({ text: result.text.slice(a, b), ids: [...new Set(cover.map(c => c.id))], sev: cover.map(c => c.sev) });
  }
  return segs;
}

function highlightHTML(result) {
  return highlightSegments(result)
    .map(seg => {
      if (!seg.ids.length) return bidiText(seg.text);
      const sev = seg.sev.includes('high') ? 'sev-high' : seg.sev.every(s => s === 'good') ? 'sev-good' : seg.sev.every(s => s === 'low') ? 'sev-low' : '';
      const tip = seg.ids.map(id => esc(L(FLAG_INDEX[id].title))).join('<br>');
      return `<mark class="${sev}" data-flag="${seg.ids[0]}" data-tip="${tip}">${bidiText(seg.text)}</mark>`;
    })
    .join('');
}

// ---------- trainable classifiers: multinomial naive Bayes + logistic regression ----------
// Labels: 1 = scam, 0 = legitimate. Tokens are unigrams (+ optional bigrams) from mlTokens().

// Seed messages merged with the user's additions, relabels and removals.
function allExamples() {
  const st = datasetState();
  const seed = DATASET_SEED.map((r, i) => {
    const id = 'd' + String(i + 1).padStart(3, '0');
    return { id, label: st.relabels[id] || r[0], orig: r[0], script: r[1], text: r[2], src: 'seed' };
  });
  const added = st.added.map(a => ({ ...a, label: st.relabels[a.id] || a.label, orig: a.label, src: 'user' }));
  return [...seed, ...added].filter(e => !st.removed.includes(e.id));
}

// Stratified split: shuffle each class with a seeded PRNG, then take the same share of each.
function stratifiedSplit(examples, testRatio, seed) {
  const rand = rng(seed);
  const train = [];
  const test = [];
  for (const lab of ['s', 'h']) {
    const group = shuffle(examples.filter(e => e.label === lab), rand);
    const nTest = Math.round(group.length * testRatio);
    test.push(...group.slice(0, nTest));
    train.push(...group.slice(nTest));
  }
  return { train, test };
}

function buildVocab(docs) {
  const df = new Map();
  docs.forEach(toks => new Set(toks).forEach(tk => df.set(tk, (df.get(tk) || 0) + 1)));
  // Bigrams must appear in two documents to enter the vocabulary; unigrams in one.
  const vocab = [...df.entries()].filter(([tk, n]) => n >= (tk.includes(' ') ? 2 : 1)).map(([tk]) => tk);
  vocab.sort();
  return { list: vocab, index: new Map(vocab.map((tk, i) => [tk, i])) };
}

// ---------- naive Bayes ----------
function trainNB(docs, ys, vocab, alpha) {
  const V = vocab.list.length;
  const counts = [new Float64Array(V), new Float64Array(V)];
  const totals = [0, 0];
  const nClass = [0, 0];
  docs.forEach((toks, i) => {
    const y = ys[i];
    nClass[y]++;
    toks.forEach(tk => {
      const j = vocab.index.get(tk);
      if (j === undefined) return;
      counts[y][j]++;
      totals[y]++;
    });
  });
  const logPrior = nClass.map(n => Math.log((n + 1) / (docs.length + 2)));
  const logLik = [0, 1].map(c => Array.from(counts[c], n => Math.log((n + alpha) / (totals[c] + alpha * V))));
  return { logPrior, logLik };
}

function nbParts(nb, vocab, toks) {
  const scores = [nb.logPrior[0], nb.logPrior[1]];
  const contrib = new Map();
  toks.forEach(tk => {
    const j = vocab.index.get(tk);
    if (j === undefined) return;
    scores[0] += nb.logLik[0][j];
    scores[1] += nb.logLik[1][j];
    contrib.set(tk, (contrib.get(tk) || 0) + nb.logLik[1][j] - nb.logLik[0][j]);
  });
  return { p: sigmoid(scores[1] - scores[0]), contrib };
}

// ---------- logistic regression ----------
// Binary bag-of-words features, L2-normalised per message; full-batch gradient descent with L2 penalty.
function lrFeatures(toks, vocab) {
  const idx = [...new Set(toks.map(tk => vocab.index.get(tk)).filter(j => j !== undefined))];
  const v = idx.length ? 1 / Math.sqrt(idx.length) : 0;
  return { idx, v };
}

function lrLoss(w, b, feats, ys, l2) {
  let loss = 0;
  feats.forEach((f, i) => {
    let z = b;
    f.idx.forEach(j => (z += w[j] * f.v));
    const p = clamp(sigmoid(z), 1e-9, 1 - 1e-9);
    loss -= ys[i] ? Math.log(p) : Math.log(1 - p);
  });
  let reg = 0;
  for (let j = 0; j < w.length; j++) reg += w[j] * w[j];
  return loss / Math.max(1, feats.length) + (l2 / 2) * reg;
}

function trainLR(feats, ys, V, { lr, epochs, l2 }, testFeats, testYs) {
  const w = new Float64Array(V);
  let b = 0;
  const curve = [];
  const n = Math.max(1, feats.length);
  for (let ep = 1; ep <= epochs; ep++) {
    const gw = new Float64Array(V);
    let gb = 0;
    feats.forEach((f, i) => {
      let z = b;
      f.idx.forEach(j => (z += w[j] * f.v));
      const g = sigmoid(z) - ys[i];
      f.idx.forEach(j => (gw[j] += g * f.v));
      gb += g;
    });
    for (let j = 0; j < V; j++) w[j] -= lr * (gw[j] / n + l2 * w[j]);
    b -= lr * (gb / n);
    if (ep === 1 || ep % 10 === 0) curve.push({ ep, train: lrLoss(w, b, feats, ys, l2), test: testFeats.length ? lrLoss(w, b, testFeats, testYs, 0) : null });
  }
  return { w: Array.from(w), b, curve };
}

function lrParts(lrm, vocab, toks) {
  const f = lrFeatures(toks, vocab);
  let z = lrm.b;
  const contrib = new Map();
  f.idx.forEach(j => {
    const c = lrm.w[j] * f.v;
    z += c;
    contrib.set(vocab.list[j], c);
  });
  return { p: sigmoid(z), contrib };
}

// ---------- metrics ----------
function confusion(probs, ys, thr) {
  const m = { tp: 0, fp: 0, fn: 0, tn: 0 };
  probs.forEach((p, i) => {
    const pred = p >= thr ? 1 : 0;
    if (pred && ys[i]) m.tp++;
    else if (pred && !ys[i]) m.fp++;
    else if (!pred && ys[i]) m.fn++;
    else m.tn++;
  });
  const n = probs.length || 1;
  m.acc = (m.tp + m.tn) / n;
  m.prec = m.tp + m.fp ? m.tp / (m.tp + m.fp) : 0;
  m.rec = m.tp + m.fn ? m.tp / (m.tp + m.fn) : 0;
  m.f1 = m.prec + m.rec ? (2 * m.prec * m.rec) / (m.prec + m.rec) : 0;
  m.spec = m.tn + m.fp ? m.tn / (m.tn + m.fp) : 0;
  return m;
}

// Area under the ROC curve via the rank-sum (Mann–Whitney) formulation; ties count half.
function aucScore(scores, ys) {
  const pos = [];
  const neg = [];
  scores.forEach((s, i) => (ys[i] ? pos : neg).push(s));
  if (!pos.length || !neg.length) return NaN;
  let wins = 0;
  pos.forEach(p => neg.forEach(q => (wins += p > q ? 1 : p === q ? 0.5 : 0)));
  return wins / (pos.length * neg.length);
}

// Majority-class baseline: always predict the class that is most common in the training split.
function baselineFor(trainYs, testYs) {
  const scamShare = mean(trainYs);
  const majority = scamShare > 0.5 ? 1 : 0;
  const acc = mean(testYs.map(y => (y === majority ? 1 : 0)));
  return { majority, acc, f1: majority ? (2 * mean(testYs)) / (1 + mean(testYs)) : 0 };
}

// ---------- features ----------
// Words (+ bigrams) and, in hybrid mode, one "rule:<flag>" token per red flag the rule engine raised.
function docTokens(text, opts) {
  const toks = mlTokens(text, opts.bigrams);
  if (!opts.rules) return toks;
  const flags = analyseMessage(text).flags.map(f => 'rule:' + f.id);
  return toks.concat(flags);
}

// ---------- training pipeline ----------
function trainModels(opts = mlOpts(), examples = allExamples()) {
  const t0 = performance.now();
  const { train, test } = stratifiedSplit(examples, opts.test, opts.seed);
  const tok = e => docTokens(e.text, opts);
  const trainDocs = train.map(tok);
  const testDocs = test.map(tok);
  const yTrain = train.map(e => (e.label === 's' ? 1 : 0));
  const yTest = test.map(e => (e.label === 's' ? 1 : 0));
  const vocab = buildVocab(trainDocs);
  const nb = trainNB(trainDocs, yTrain, vocab, opts.alpha);
  const trF = trainDocs.map(d => lrFeatures(d, vocab));
  const teF = testDocs.map(d => lrFeatures(d, vocab));
  const lrm = trainLR(trF, yTrain, vocab.list.length, opts, teF, yTest);
  const model = { format: 'fraudshield-model', version: 1, source: 'trained', trainedAt: nowISO(), opts, vocab: vocab.list, nb, lr: { w: lrm.w, b: lrm.b }, curve: lrm.curve };
  attachVocab(model);
  model.eval = evaluateModel(model, test, train);
  model.ms = Math.round(performance.now() - t0);
  return model;
}

function attachVocab(model) {
  Object.defineProperty(model, 'vocabIndex', { value: new Map(model.vocab.map((tk, i) => [tk, i])), enumerable: false, configurable: true });
  return model;
}

const vocabOf = model => ({ list: model.vocab, index: model.vocabIndex });

function predict(model, text) {
  const toks = docTokens(text, model.opts);
  const vocab = vocabOf(model);
  return { nb: nbParts(model.nb, vocab, toks), lr: lrParts(model.lr, vocab, toks), tokens: toks };
}

function evaluateModel(model, test, train = []) {
  const ys = test.map(e => (e.label === 's' ? 1 : 0));
  const preds = test.map(e => predict(model, e.text));
  const pNB = preds.map(p => p.nb.p);
  const pLR = preds.map(p => p.lr.p);
  const thr = model.opts.threshold;
  const perScript = {};
  for (const sc of ['en', 'ur', 'ru']) {
    const ix = test.map((e, i) => (e.script === sc ? i : -1)).filter(i => i >= 0);
    perScript[sc] = { n: ix.length, nb: confusion(ix.map(i => pNB[i]), ix.map(i => ys[i]), thr).acc, lr: confusion(ix.map(i => pLR[i]), ix.map(i => ys[i]), thr).acc };
  }
  return {
    testIds: test.map(e => e.id),
    ys,
    pNB,
    pLR,
    nTrain: train.length,
    nTest: test.length,
    baseline: baselineFor(train.length ? train.map(e => (e.label === 's' ? 1 : 0)) : ys, ys),
    auc: { nb: aucScore(pNB, ys), lr: aucScore(pLR, ys) },
    perScript,
  };
}

// k-fold cross-validation (stratified by shuffling each class and dealing round-robin).
function crossValidate(k = 5, opts = mlOpts()) {
  const examples = allExamples();
  const rand = rng(opts.seed + 7);
  const folds = Array.from({ length: k }, () => []);
  for (const lab of ['s', 'h']) shuffle(examples.filter(e => e.label === lab), rand).forEach((e, i) => folds[i % k].push(e));
  const rows = folds.map((fold, i) => {
    const train = folds.filter((_, j) => j !== i).flat();
    const m = trainModels({ ...opts, test: 0 }, train);
    const ev = evaluateModel(m, fold, train);
    return { nb: confusion(ev.pNB, ev.ys, opts.threshold), lr: confusion(ev.pLR, ev.ys, opts.threshold), base: ev.baseline.acc };
  });
  const stat = (key, metric) => {
    const vals = rows.map(r => r[key][metric]);
    const mu = mean(vals);
    return { mean: mu, sd: Math.sqrt(mean(vals.map(v => (v - mu) ** 2))) };
  };
  return { k, rows, nb: { acc: stat('nb', 'acc'), f1: stat('nb', 'f1') }, lr: { acc: stat('lr', 'acc'), f1: stat('lr', 'f1') }, base: mean(rows.map(r => r.base)) };
}

// Top tokens toward each class for the whole model (LR weights or NB log-likelihood ratios).
function globalTopTokens(model, which, n = 10) {
  const scores = which === 'nb' ? model.vocab.map((tk, j) => model.nb.logLik[1][j] - model.nb.logLik[0][j]) : model.lr.w;
  const ranked = model.vocab.map((tk, j) => ({ tk, v: scores[j] })).filter(r => Number.isFinite(r.v));
  ranked.sort((a, b) => b.v - a.v);
  return { scam: ranked.slice(0, n), legit: ranked.slice(-n).reverse() };
}

function topContrib(contrib, n = 8) {
  return [...contrib.entries()]
    .map(([tk, v]) => ({ tk, v }))
    .sort((a, b) => Math.abs(b.v) - Math.abs(a.v))
    .slice(0, n);
}

// ---------- export / import ----------
function exportModelJSON(model) {
  const r5 = v => Math.round(v * 1e5) / 1e5;
  const out = { format: model.format, version: model.version, exportedAt: nowISO(), trainedAt: model.trainedAt, opts: model.opts, vocab: model.vocab, nb: { logPrior: model.nb.logPrior.map(r5), logLik: model.nb.logLik.map(row => row.map(r5)) }, lr: { w: model.lr.w.map(r5), b: r5(model.lr.b) } };
  return JSON.stringify(out);
}

function importModelJSON(text) {
  const m = JSON.parse(text);
  const V = Array.isArray(m.vocab) ? m.vocab.length : -1;
  const okNB = m.nb && Array.isArray(m.nb.logLik) && m.nb.logLik.length === 2 && m.nb.logLik.every(r => r.length === V);
  const okLR = m.lr && Array.isArray(m.lr.w) && m.lr.w.length === V && Number.isFinite(m.lr.b);
  if (m.format !== 'fraudshield-model' || V < 1 || !okNB || !okLR) throw new Error('not a FraudShield model');
  const model = { ...m, source: 'import', opts: { ...DEFAULT_ML_OPTS, ...m.opts }, curve: [] };
  attachVocab(model);
  const examples = allExamples();
  model.eval = evaluateModel(model, examples, []);
  return model;
}

// ---------- link checker: punycode, homoglyphs, lookalikes, shorteners, IPs, TLDs, path tricks ----------
const SHORTENERS = ['bit.ly', 'tinyurl.com', 't.co', 'goo.gl', 'is.gd', 'cutt.ly', 'rb.gy', 'ow.ly', 'shorturl.at', 'tiny.cc', 's.id', 'rebrand.ly', 'bl.ink', 'buff.ly', 't.ly', 'v.gd'];
const RISKY_TLDS = ['xyz', 'top', 'click', 'live', 'icu', 'buzz', 'rest', 'online', 'site', 'info', 'tk', 'ml', 'ga', 'cf', 'gq', 'work', 'support', 'loan', 'win', 'vip', 'club', 'pw', 'cc', 'link', 'shop', 'store'];
const MULTI_SUFFIX = ['com.pk', 'net.pk', 'org.pk', 'gov.pk', 'edu.pk', 'web.pk', 'gop.pk', 'fam.pk', 'biz.pk', 'co.uk', 'org.uk', 'ac.uk', 'com.au', 'co.in', 'com.sa', 'co.ae', 'com.cn'];
const PHISH_WORDS = ['login', 'verify', 'verification', 'secure', 'update', 'account', 'bonus', 'reward', 'claim', 'kyc', 'unlock', 'refund', 'support', 'helpdesk', 'confirm', 'wallet', 'free'];

// Characters from other alphabets (and digits) that look like Latin letters.
const CONFUSABLES = {
  'а': 'a', 'е': 'e', 'о': 'o', 'р': 'p', 'с': 'c', 'у': 'y', 'х': 'x', 'һ': 'h', 'і': 'i', 'ј': 'j', 'ԁ': 'd', 'ӏ': 'l', 'ѕ': 's', 'ԛ': 'q', 'ԝ': 'w', 'к': 'k', 'м': 'm', 'н': 'h', 'т': 't', 'в': 'b',
  'α': 'a', 'ο': 'o', 'ν': 'v', 'ρ': 'p', 'ε': 'e', 'ι': 'i', 'κ': 'k', 'τ': 't', 'υ': 'u', 'χ': 'x',
  'ɡ': 'g', 'ı': 'i', 'ł': 'l', 'ß': 'b',
  '0': 'o', '1': 'l', '3': 'e', '4': 'a', '5': 's', '7': 't', '@': 'a', '$': 's',
};

// RFC 3492 punycode decoder for "xn--" labels.
function punyDecode(input) {
  const base = 36;
  const adapt = (delta, numPoints, first) => {
    let d = first ? Math.floor(delta / 700) : delta >> 1;
    d += Math.floor(d / numPoints);
    let k = 0;
    while (d > 455) {
      d = Math.floor(d / 35);
      k += base;
    }
    return k + Math.floor((36 * d) / (d + 38));
  };
  const digit = c => (c - 48 < 10 ? c - 22 : c - 65 < 26 ? c - 65 : c - 97 < 26 ? c - 97 : base);
  const out = [];
  const basic = Math.max(0, input.lastIndexOf('-'));
  for (let j = 0; j < basic; j++) out.push(input.charCodeAt(j));
  let n = 128;
  let bias = 72;
  let i = 0;
  for (let idx = basic > 0 ? basic + 1 : 0; idx < input.length; ) {
    const oldi = i;
    for (let w = 1, k = base; ; k += base) {
      if (idx >= input.length) throw new Error('bad punycode');
      const dg = digit(input.charCodeAt(idx++));
      if (dg >= base) throw new Error('bad punycode');
      i += dg * w;
      const t = k <= bias ? 1 : k >= bias + 26 ? 26 : k - bias;
      if (dg < t) break;
      w *= base - t;
    }
    bias = adapt(i - oldi, out.length + 1, oldi === 0);
    n += Math.floor(i / (out.length + 1));
    i %= out.length + 1;
    out.splice(i++, 0, n);
  }
  return String.fromCodePoint(...out);
}

function hostToUnicode(host) {
  return host
    .split('.')
    .map(label => {
      if (!label.startsWith('xn--')) return label;
      try {
        return punyDecode(label.slice(4));
      } catch {
        return label;
      }
    })
    .join('.');
}

function hostToAscii(host) {
  try {
    return new URL('http://' + host).hostname;
  } catch {
    return host.toLowerCase();
  }
}

// Map a string to its visual skeleton so "һbl" and "hbl" compare equal.
function skeleton(str) {
  const folded = [...str.normalize('NFKD').replace(/[\u0300-\u036F]/g, '').toLowerCase()].map(c => CONFUSABLES[c] || c).join('');
  return folded.replace(/rn/g, 'm').replace(/vv/g, 'w');
}

// Optimal string alignment distance (Levenshtein + adjacent transpositions).
function damerau(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
    }
  }
  return d[a.length][b.length];
}

function registrable(host) {
  const labels = host.split('.').filter(Boolean);
  const suffix = MULTI_SUFFIX.find(sf => host === sf || host.endsWith('.' + sf));
  const take = suffix ? suffix.split('.').length + 1 : 2;
  const reg = labels.slice(-take).join('.');
  const tld = suffix || labels[labels.length - 1] || '';
  return { reg, tld, label: labels.length >= take ? labels[labels.length - take] : labels[0] || '', subs: labels.slice(0, Math.max(0, labels.length - take)) };
}

// Split a raw link into parts without trusting the browser to normalise the host first.
function parseLink(raw) {
  const s = String(raw).trim();
  const m = s.match(/^(?:([a-z][a-z0-9+.-]*):)?(?:\/\/)?(?:([^@/?#]*)@)?([^/?#:]*)(?::(\d+))?([^?#]*)(\?[^#]*)?(#.*)?$/i);
  if (!m || !m[3]) return null;
  const rawHost = m[3].replace(/\.$/, '');
  const ascii = hostToAscii(rawHost);
  return { raw: s, scheme: (m[1] || '').toLowerCase(), userinfo: m[2] || '', rawHost, host: ascii, unicode: hostToUnicode(ascii), port: m[4] || '', path: m[5] || '', query: m[6] || '', fragment: m[7] || '' };
}

function ipKind(host) {
  if (/^\d{1,3}(?:\.\d{1,3}){3}$/.test(host)) return 'IPv4';
  if (/^\[?[0-9a-f:]+\]?$/i.test(host) && host.includes(':')) return 'IPv6';
  if (/^(?:0x[0-9a-f]+|\d{8,10})$/i.test(host)) return 'encoded';
  return '';
}

const scriptsIn = str => {
  const set = new Set();
  for (const ch of str) {
    if (/[a-z0-9-]/i.test(ch)) set.add('Latin');
    else if (/[\u0400-\u04FF]/.test(ch)) set.add('Cyrillic');
    else if (/[\u0370-\u03FF]/.test(ch)) set.add('Greek');
    else if (/[\u0600-\u06FF]/.test(ch)) set.add('Arabic');
    else if (ch !== '.') set.add('Other');
  }
  return [...set];
};

// Compare the registrable label (and hyphen-separated pieces of the whole host) with trusted brands.
function brandChecks(p, reg, trusted) {
  const findings = [];
  const official = trusted.find(d => reg.reg === d.domain || p.host.endsWith('.' + d.domain));
  if (official) return { official, findings };
  const skel = skeleton(p.unicode.split('.').slice(0, -1).join('.'));
  const pieces = skel.split(/[.-]/).filter(x => x.length >= 3);
  for (const d of trusted) {
    const brandLabel = registrable(d.domain).label;
    const regSkel = skeleton(registrable(p.unicode).label);
    if (regSkel === brandLabel && p.unicode !== p.host) findings.push({ id: 'homoglyph', brand: d });
    else if (regSkel !== brandLabel && brandLabel.length >= 4 && damerau(regSkel, brandLabel) <= (brandLabel.length >= 8 ? 2 : 1)) findings.push({ id: 'typosquat', brand: d });
    else if (d.keys.some(k => pieces.includes(k) || (k.length >= 5 && pieces.some(pc => pc.includes(k))))) findings.push({ id: 'brandSub', brand: d });
    else if (d.keys.some(k => k.length >= 3 && p.path.toLowerCase().includes(k))) findings.push({ id: 'brandPath', brand: d });
  }
  const order = ['homoglyph', 'typosquat', 'brandSub', 'brandPath'];
  findings.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
  return { official: null, findings: findings.slice(0, 1) };
}

function structureChecks(p, reg, isTrusted) {
  const out = [];
  const add = (id, vars = {}) => out.push({ id, ...vars });
  if (/[\u202A-\u202E\u2066-\u2069\u200B-\u200F]/.test(p.raw)) add('bidi');
  if (p.userinfo) add('userinfo', { shown: p.userinfo });
  const ip = ipKind(p.host);
  if (ip) add('rawIp', { kind: ip });
  if (p.host.split('.').some(l => l.startsWith('xn--'))) add('punycode', { shown: p.unicode });
  if (scriptsIn(p.unicode).length > 1 && !ip) add('mixedScript', { shown: scriptsIn(p.unicode).join(' + ') });
  if (SHORTENERS.includes(reg.reg) || SHORTENERS.includes(p.host)) add('shortener');
  if (!ip && RISKY_TLDS.includes(reg.tld)) add('badTld', { shown: '.' + reg.tld });
  if (/gov[-_]?pk|govpk|gov-pk/.test(p.host) && !p.host.endsWith('.gov.pk')) add('govLook');
  if (/\.(apk|exe|scr|bat|msi|jar)(?:$|[?#])/i.test(p.path + p.query)) add('apk', { shown: (p.path.match(/[^/]+$/) || [''])[0] });
  if (/(?:url|redirect|next|to|goto|dest)=https?/i.test(p.query) || /https?:\/\//i.test(p.path)) add('redirect');
  if (/%[0-9a-f]{2}/i.test(p.rawHost) || (p.path.match(/%[0-9a-f]{2}/gi) || []).length > 3) add('encoded');
  if (p.scheme === 'http' || !p.scheme) add('noTls');
  if (p.port && !['80', '443'].includes(p.port)) add('port', { shown: p.port });
  if (reg.subs.length >= 3) add('manySub', { shown: reg.subs.length });
  if ((registrable(p.unicode).reg.match(/-/g) || []).length >= 2) add('hyphens');
  if (p.host.length > 40) add('longHost');
  const words = PHISH_WORDS.filter(w => (p.host + p.path).toLowerCase().includes(w));
  if (words.length && !isTrusted) add('keywords', { shown: words.slice(0, 3).join(', ') });
  return out;
}

const LINK_POINTS = { bidi: 45, userinfo: 40, homoglyph: 45, rawIp: 30, typosquat: 40, brandSub: 32, apk: 30, govLook: 28, mixedScript: 25, shortener: 18, badTld: 16, punycode: 14, brandPath: 12, redirect: 12, encoded: 10, port: 10, keywords: 8, manySub: 8, noTls: 6, hyphens: 6, longHost: 6, trusted: -25 };

function analyseUrl(raw, trusted = trustedDomains()) {
  const p = parseLink(raw);
  if (!p) return { raw, valid: false, score: 0, level: 'low', findings: [{ id: 'invalid', pts: 0 }] };
  const reg = registrable(p.host);
  const brand = brandChecks(p, reg, trusted);
  const findings = [...brand.findings.map(f => ({ id: f.id, brand: f.brand.brand, domain: f.brand.domain })), ...structureChecks(p, reg, !!brand.official)];
  if (brand.official) findings.push({ id: 'trusted', brand: brand.official.brand, domain: brand.official.domain });
  findings.forEach(f => (f.pts = LINK_POINTS[f.id] || 0));
  findings.sort((a, b) => b.pts - a.pts);
  const score = clamp(sum(findings.map(f => f.pts)), 0, 100);
  const level = score >= 45 ? 'high' : score >= 18 ? 'med' : 'low';
  return { raw, valid: true, parts: p, reg, official: brand.official, findings, score, level, reputation: lookupDomainReputation(reg.reg) };
}

// Read a salary out of the field or the text and convert it to a monthly figure.
function parseSalary(ad) {
  const field = parseFloat(String(ad.salary || '').replace(/[^\d.]/g, ''));
  const text = ad.text || '';
  const m = text.match(/(?:rs\.?|pkr)?\s*([\d,]{3,})\s*(?:rs|pkr|rupees|روپے)?\s*(?:\/|per|a|daily|weekly|monthly|rozana|mahana|روزانہ|ماہانہ)?\s*(day|daily|week|weekly|month|monthly|rozana|mahana|روزانہ|ماہانہ)?/i);
  const lakh = text.match(/(\d+(?:\.\d+)?)\s*(?:lakh|lac|لاکھ)/i);
  let amount = Number.isFinite(field) && field > 0 ? field : 0;
  let period = ad.period || 'month';
  if (!amount && m) {
    amount = parseFloat(m[1].replace(/,/g, ''));
    const unit = (m[2] || '').toLowerCase();
    if (/day|daily|rozana|روزانہ/.test(unit)) period = 'day';
    else if (/week/.test(unit)) period = 'week';
  }
  if (!amount && lakh) amount = parseFloat(lakh[1]) * 100000;
  if (/per day|daily|rozana|روزانہ|a day/i.test(text) && !ad.salary) period = 'day';
  const monthly = period === 'day' ? amount * 26 : period === 'week' ? amount * 4.3 : amount;
  return { amount, period, monthly };
}

function scoreJob(ad) {
  const text = [ad.text, ad.role, ad.company].filter(Boolean).join(' \n ');
  const hits = [];
  const add = (id, detail = '') => hits.push({ id, ...JOB_FLAGS[id], detail });
  if (JOB_RX.fee.test(text)) add('fee');
  if (JOB_RX.task.test(text)) add('task');
  if (JOB_RX.noInterview.test(text)) add('noInterview');
  if (JOB_RX.documents.test(text)) add('documents');
  if (JOB_RX.overseas.test(text) && (JOB_RX.fee.test(text) || /visa (?:fee|charges|cost)|ticket (?:fee|charges)|protector/i.test(text))) add('overseas');
  const sal = parseSalary(ad);
  const easy = JOB_RX.easy.test(text);
  if ((easy && sal.monthly > 150000) || sal.monthly > 400000 || (sal.period === 'day' && sal.amount >= 3000 && easy)) add('pay', fmtPKR(sal.monthly) + ' / ' + t('month'));
  const email = String(ad.email || (text.match(/[\w.+-]+@([\w-]+\.)+[a-z]{2,}/i) || [''])[0]).toLowerCase();
  const domain = email.split('@')[1] || '';
  if (domain && FREE_MAIL.includes(domain)) add('personalEmail', email);
  const hasReg = JOB_RX.registration.test(text) || !!String(ad.regNo || '').trim();
  const hasAddr = JOB_RX.address.test(text) || !!String(ad.address || '').trim();
  const hasSite = !!String(ad.website || '').trim() || (domain && !FREE_MAIL.includes(domain));
  if (JOB_RX.chatOnly.test(text) && !hasAddr) add('chatOnly');
  if (!hasReg && !hasAddr && !hasSite) add('noRegistration');
  if (JOB_RX.urgency.test(text)) add('urgency');
  if (!JOB_RX.duties.test(text) && (ad.text || '').split(/\s+/).length < 60) add('vague');
  const letters = (ad.text || '').match(/[A-Za-z]/g) || [];
  if (/!{2,}/.test(ad.text || '') || (letters.length > 30 && letters.filter(c => c <= 'Z').length / letters.length > 0.4)) add('shouting');
  if (hasReg && hasAddr && hasSite && !hits.some(h => h.id === 'personalEmail')) add('verifiable');
  hits.sort((a, b) => b.pts - a.pts);
  const score = clamp(sum(hits.map(h => h.pts)), 0, 100);
  const level = score >= 45 ? 'high' : score >= 20 ? 'med' : 'low';
  return { hits, score, level, salary: sal, email };
}

// ---------- transaction anomaly lab: synthetic data, features, isolation forest, rules ----------
const TXN_TYPES = [
  { id: 'p2p', w: 34, mult: 1, newBenP: 0.06, out: true },
  { id: 'bill', w: 16, mult: 0.8, newBenP: 0.02, out: false },
  { id: 'merchant', w: 24, mult: 0.6, newBenP: 0.12, out: false },
  { id: 'topup', w: 14, mult: 0.15, newBenP: 0.03, out: false },
  { id: 'ibft', w: 8, mult: 2.2, newBenP: 0.08, out: true },
  { id: 'cashout', w: 4, mult: 1.6, newBenP: 0, out: true },
];
const TXN_TYPE = Object.fromEntries(TXN_TYPES.map(x => [x.id, x]));
const CITIES = ['Lahore', 'Karachi', 'Islamabad', 'Rawalpindi', 'Faisalabad', 'Multan', 'Peshawar', 'Quetta', 'Hyderabad', 'Sialkot', 'Gujranwala', 'Bahawalpur'];
const FIRST_NAMES = ['Ali', 'Ayesha', 'Bilal', 'Fatima', 'Hamza', 'Hina', 'Imran', 'Iqra', 'Junaid', 'Kiran', 'Usman', 'Mahnoor', 'Nadia', 'Omar', 'Rabia', 'Saad', 'Sana', 'Tariq', 'Uzma', 'Waqas', 'Zainab', 'Asad', 'Bushra', 'Danish', 'Erum', 'Faisal', 'Ghazala', 'Haris', 'Javeria', 'Kamran'];
const LAST_NAMES = ['Khan', 'Ahmed', 'Malik', 'Butt', 'Sheikh', 'Qureshi', 'Chaudhry', 'Raza', 'Hussain', 'Siddiqui', 'Mirza', 'Abbasi', 'Baloch', 'Shah', 'Iqbal'];
const SCHEMES = ['ato', 'burst', 'simswap', 'testcharge'];
const FEATURE_NAMES = ['logAmount', 'amountZ', 'hourRarity', 'velocity1h', 'velocity24h', 'newDevice', 'newBeneficiary', 'cityChange', 'quickGap'];

function weightedPick(items, rand) {
  const total = sum(items.map(x => x.w));
  let r = rand() * total;
  for (const it of items) {
    r -= it.w;
    if (r <= 0) return it;
  }
  return items[items.length - 1];
}

function makeAccounts(cfg, rand) {
  return Array.from({ length: cfg.accounts }, (_, i) => {
    const hStart = 8 + Math.floor(rand() * 4);
    const nightOwl = rand() < 0.08;
    return {
      id: 'AC-' + (1001 + i),
      name: pick(FIRST_NAMES, rand) + ' ' + pick(LAST_NAMES, rand),
      city: pick(CITIES, rand),
      kind: rand() < 0.55 ? 'wallet' : 'bank',
      base: clamp(Math.round(Math.exp(Math.log(2500) + 0.75 * gauss(rand)) / 10) * 10, 300, 40000),
      hStart,
      hEnd: nightOwl ? 25 : 19 + Math.floor(rand() * 4),
      rate: 0.35 + rand() * 1.1,
      devices: ['DV-' + (hashStr('d' + i + cfg.seed) % 90000 + 10000)],
      bens: Array.from({ length: 3 + Math.floor(rand() * 5) }, (_, k) => 'BN-' + (hashStr('b' + i + k + cfg.seed) % 90000 + 10000)),
    };
  });
}

// Ordinary behaviour: each account transacts at its own rhythm, amounts and counterparties.
function normalTxns(acc, cfg, start, rand) {
  const out = [];
  for (let day = 0; day < cfg.days; day++) {
    let n = 0;
    for (let r = rand(); r < acc.rate / 2 && n < 4; r += rand()) n++;
    for (let k = 0; k < n; k++) {
      const type = weightedPick(TXN_TYPES, rand);
      const hour = acc.hStart + rand() * (acc.hEnd - acc.hStart);
      const ts = start + day * DAY + hour * 3600e3;
      let amount = acc.base * type.mult * Math.exp(0.55 * gauss(rand));
      if (rand() < 0.012) amount *= 5;
      if (type.id === 'topup') amount = clamp(amount, 50, 1500);
      const newBen = rand() < type.newBenP;
      const ben = newBen ? 'BN-' + (hashStr(acc.id + ts) % 90000 + 10000) : acc.bens[Math.floor(Math.pow(rand(), 1.6) * acc.bens.length)];
      if (newBen && type.out) acc.bens.push(ben);
      const phoneChange = rand() < 0.004;
      if (phoneChange) acc.devices.unshift('DV-' + (hashStr(acc.id + 'new' + ts) % 90000 + 10000));
      const city = rand() < 0.03 ? pick(CITIES, rand) : acc.city;
      out.push({ ts, acc: acc.id, type: type.id, amount: Math.max(20, Math.round(amount / 10) * 10), ben, device: acc.devices[0], city, fraud: false });
    }
  }
  return out;
}

// Injected fraud: account takeover, velocity bursts, SIM swap and "test charge then drain".
function fraudBurst(acc, scheme, start, cfg, rand, mules) {
  const day = Math.floor(rand() * cfg.days);
  const dev = 'DV-X' + (hashStr(acc.id + scheme + day) % 9000 + 1000);
  const mule = pick(mules, rand);
  const base = acc.base;
  const mk = (ts, amount, extra = {}) => ({ ts, acc: acc.id, type: 'p2p', amount: Math.round(amount / 10) * 10, ben: mule, device: dev, city: acc.city, fraud: true, scheme, ...extra });
  if (scheme === 'ato') {
    const t0 = start + day * DAY + (1 + rand() * 3) * 3600e3;
    return Array.from({ length: 1 + Math.floor(rand() * 3) }, (_, k) => mk(t0 + k * (4 + rand() * 8) * 60e3, base * (4 + rand() * 8), { type: k ? 'ibft' : 'p2p' }));
  }
  if (scheme === 'burst') {
    const t0 = start + day * DAY + (acc.hStart + rand() * 6) * 3600e3;
    return Array.from({ length: 4 + Math.floor(rand() * 3) }, (_, k) => mk(t0 + k * (3 + rand() * 6) * 60e3, base * (1.5 + rand() * 1.5), { ben: pick(mules, rand), device: rand() < 0.5 ? dev : acc.devices[0] }));
  }
  if (scheme === 'simswap') {
    const t0 = start + day * DAY + (10 + rand() * 8) * 3600e3;
    const city = pick(CITIES.filter(c => c !== acc.city), rand);
    return Array.from({ length: 1 + Math.floor(rand() * 2) }, (_, k) => mk(t0 + k * 15 * 60e3, clamp(base * (8 + rand() * 7), 25000, 250000), { type: 'ibft', city }));
  }
  const t0 = start + day * DAY + (22 + rand() * 3) * 3600e3;
  return [mk(t0, 10 + rand() * 20), mk(t0 + (3 + rand() * 7) * 60e3, base * (5 + rand() * 5))];
}

function generateTransactions(cfg = txnCfg()) {
  const rand = rng(cfg.seed);
  const accounts = makeAccounts(cfg, rand);
  const end = new Date(2026, 9, 15, 23, 59).getTime();
  const start = end - cfg.days * DAY + 60e3;
  let txns = accounts.flatMap(a => normalTxns(a, cfg, start, rand));
  const target = Math.round((txns.length * cfg.rate) / (1 - cfg.rate));
  const mules = Array.from({ length: 8 }, (_, i) => 'BN-M' + String(i + 1).padStart(2, '0'));
  let injected = [];
  while (injected.length < target) injected = injected.concat(fraudBurst(pick(accounts, rand), pick(SCHEMES, rand), start, cfg, rand, mules));
  txns = txns.concat(injected).filter(x => x.ts <= end);
  txns.sort((a, b) => a.ts - b.ts);
  txns.forEach((x, i) => (x.id = 'TX-' + (100001 + i)));
  computeFeatures(txns, accounts);
  return { accounts, txns, start, end, cfg };
}

// Features use only each account's past, as a live system would.
function computeFeatures(txns, accounts) {
  const prior = { mu: Math.log(2500), var: 0.8 * 0.8, k: 3 };
  const st = Object.fromEntries(accounts.map(a => [a.id, { n: 0, sum: 0, sq: 0, times: [], devs: new Set(), bens: new Set(), hours: new Array(24).fill(0), last: 0, home: a.city }]));
  for (const x of txns) {
    const s = st[x.acc];
    const la = Math.log(x.amount);
    const mu = (s.sum + prior.k * prior.mu) / (s.n + prior.k);
    const varr = (s.sq - s.n * (s.n ? (s.sum / s.n) ** 2 : 0) + prior.k * prior.var) / (s.n + prior.k);
    const hour = new Date(x.ts).getHours();
    const near = s.hours[(hour + 23) % 24] + s.hours[hour] + s.hours[(hour + 1) % 24];
    const v1 = s.times.filter(tm => x.ts - tm <= 3600e3).length;
    const v24 = s.times.filter(tm => x.ts - tm <= DAY).length;
    const gapMin = s.last ? (x.ts - s.last) / 60e3 : 14400;
    x.f = {
      logAmount: la,
      amountZ: (la - mu) / Math.max(0.3, Math.sqrt(Math.max(varr, 0))),
      hourRarity: 1 - (near + 0.5) / (s.n + 3),
      velocity1h: v1,
      velocity24h: v24,
      newDevice: s.n > 0 && !s.devs.has(x.device) ? 1 : 0,
      newBeneficiary: TXN_TYPE[x.type].out && !s.bens.has(x.ben) ? 1 : 0,
      cityChange: x.city !== s.home ? 1 : 0,
      quickGap: -Math.log1p(Math.min(gapMin, 14400)),
      hour,
    };
    s.n++;
    s.sum += la;
    s.sq += la * la;
    s.times.push(x.ts);
    if (s.times.length > 40) s.times.shift();
    s.devs.add(x.device);
    s.bens.add(x.ben);
    s.hours[hour]++;
    s.last = x.ts;
  }
}

// ---------- isolation forest (Liu, Ting & Zhou 2008) ----------
const EULER = 0.5772156649;
const cFactor = n => (n <= 1 ? 0 : n === 2 ? 1 : 2 * (Math.log(n - 1) + EULER) - (2 * (n - 1)) / n);

function buildITree(X, idx, depth, limit, rand) {
  if (depth >= limit || idx.length <= 1) return { size: idx.length };
  const dims = shuffle([...Array(X[0].length).keys()], rand);
  for (const q of dims) {
    let lo = Infinity;
    let hi = -Infinity;
    idx.forEach(i => {
      lo = Math.min(lo, X[i][q]);
      hi = Math.max(hi, X[i][q]);
    });
    if (hi <= lo) continue;
    const p = lo + rand() * (hi - lo);
    const left = idx.filter(i => X[i][q] < p);
    const right = idx.filter(i => X[i][q] >= p);
    return { q, p, l: buildITree(X, left, depth + 1, limit, rand), r: buildITree(X, right, depth + 1, limit, rand) };
  }
  return { size: idx.length };
}

function buildForest(X, { trees = 100, sample = 256, seed = 7 } = {}) {
  const rand = rng(seed);
  const psi = Math.min(sample, X.length);
  const limit = Math.ceil(Math.log2(Math.max(2, psi)));
  const forest = [];
  for (let t = 0; t < trees; t++) {
    const idx = shuffle([...X.keys()], rand).slice(0, psi);
    forest.push(buildITree(X, idx, 0, limit, rand));
  }
  return { forest, psi, c: cFactor(psi) };
}

// Path length plus the features used on the way (shallow splits isolate more, so they weigh more).
function isoPath(tree, x) {
  let node = tree;
  let depth = 0;
  const used = [];
  while (node.q !== undefined) {
    used.push({ q: node.q, depth });
    node = x[node.q] < node.p ? node.l : node.r;
    depth++;
  }
  return { h: depth + cFactor(node.size), used };
}

function isoScore(model, x, explain = false) {
  let total = 0;
  const attr = new Array(x.length).fill(0);
  for (const tree of model.forest) {
    const { h, used } = isoPath(tree, x);
    total += h;
    if (explain) used.forEach(u => (attr[u.q] += 1 / (u.depth + 1)));
  }
  const avg = total / model.forest.length;
  return { score: Math.pow(2, -avg / model.c), avgPath: avg, attr };
}

const featureVector = f => FEATURE_NAMES.map(n => f[n]);

// ---------- rule scores ----------
const TXN_RULES = [
  { id: 'velocity', test: f => f.velocity1h >= 3, pts: f => (f.velocity1h >= 5 ? 35 : 25) },
  { id: 'newDevice', test: f => f.newDevice === 1, pts: () => 20 },
  { id: 'oddHour', test: f => f.hour < 6 && f.hourRarity > 0.8, pts: () => 15 },
  { id: 'newBen', test: f => f.newBeneficiary === 1, pts: () => 14 },
  { id: 'amountZ', test: f => f.amountZ >= 2, pts: f => (f.amountZ >= 3 ? 25 : 12) },
  { id: 'cityChange', test: f => f.cityChange === 1, pts: () => 10 },
  { id: 'combo', test: f => f.newDevice && f.newBeneficiary && f.amountZ >= 1.5, pts: () => 15 },
];

function ruleScore(f, weights) {
  const hits = TXN_RULES.filter(r => r.test(f)).map(r => ({ id: r.id, pts: Math.round(r.pts(f) * (weights[r.id] ?? 1)) }));
  return { score: clamp(sum(hits.map(h => h.pts)), 0, 100), hits };
}

// Score every transaction with the forest and the rules, then blend them.
function scoreTransactions(data, cfg = data.cfg) {
  const X = data.txns.map(x => featureVector(x.f));
  const model = buildForest(X, { trees: cfg.trees, sample: cfg.sample, seed: cfg.seed + 11 });
  const iso = X.map(x => isoScore(model, x).score);
  const lo = Math.min(...iso);
  const hi = Math.max(...iso);
  data.txns.forEach((x, i) => {
    const rs = ruleScore(x.f, cfg.weights);
    x.iso = iso[i];
    x.isoN = hi > lo ? ((iso[i] - lo) / (hi - lo)) * 100 : 0;
    x.rule = rs.score;
    x.hits = rs.hits;
    x.combined = cfg.blend * x.isoN + (1 - cfg.blend) * x.rule;
  });
  data.model = model;
  return data;
}

// Precision at k for a scorer, against seeded truth or the analyst's labels.
function precisionAtK(txns, key, ks, labelOf = x => x.fraud) {
  const ranked = txns.slice().sort((a, b) => b[key] - a[key]);
  return ks.map(k => {
    const top = ranked.slice(0, k);
    const labelled = top.map(labelOf).filter(v => v !== null && v !== undefined);
    return { k, p: labelled.length ? labelled.filter(Boolean).length / labelled.length : null, n: labelled.length };
  });
}

// TODO(student): Streaming scoring — keep a sliding window of recent transactions per account, update the features
//   incrementally as each new transaction arrives (e.g. from a WebSocket or a Kafka topic behind a small server),
//   rebuild one tree of the forest at a time on the window, and push alerts into the review queue in real time.
function scoreStream(event) {
  return { status: 'batch-only', id: event && event.id };
}

// TODO(student): Mule-network graph — build a graph of accounts, devices and beneficiaries from the transactions,
//   find connected components that share a device or beneficiary (union-find), rank nodes with PageRank, and draw the
//   suspicious component as an SVG force layout. This starter only counts fan-in: beneficiaries that receive money
//   from three or more different accounts.
function muleGraph(txns, minSenders = 3) {
  const senders = {};
  txns.forEach(x => {
    if (!TXN_TYPE[x.type].out) return;
    (senders[x.ben] = senders[x.ben] || new Set()).add(x.acc);
  });
  return Object.entries(senders)
    .filter(([, accs]) => accs.size >= minSenders)
    .map(([ben, accs]) => ({ ben, accounts: [...accs] }))
    .sort((a, b) => b.accounts.length - a.accounts.length);
}

// ---------- shared caches: trained model and scored transactions ----------
let MODEL = null;
let TXN = null;
let TXN_KEY = '';

function getModel() {
  if (MODEL) return MODEL;
  const saved = store.get('model', null);
  if (saved) {
    try {
      MODEL = importModelJSON(JSON.stringify(saved));
      return MODEL;
    } catch {
      store.remove('model');
    }
  }
  MODEL = trainModels(mlOpts());
  MODEL.dsv = datasetState().version || 0;
  return MODEL;
}

function getTxn() {
  const cfg = txnCfg();
  const key = JSON.stringify(cfg);
  if (TXN && key === TXN_KEY) return TXN;
  TXN = scoreTransactions(generateTransactions(cfg), cfg);
  TXN_KEY = key;
  return TXN;
}

// Combined verdict for a message: rules blended with the selected classifier's probability.
function fullAnalysis(text, opts = {}) {
  const rules = analyseMessage(text, opts);
  const pred = predict(getModel(), text);
  const which = SETTINGS.model === 'nb' ? 'nb' : 'lr';
  const p = pred[which].p;
  const beta = SETTINGS.blend;
  const score = Math.round((1 - beta) * rules.score + beta * 100 * p);
  return { ...rules, ml: pred, which, p, ruleScore: rules.score, score, level: levelFor(score) };
}

function parseHash() {
  const [id, ...args] = decodeURIComponent(location.hash.replace(/^#\/?/, '')).split('/');

};

function navCount(id) {
  if (id === 'inbox') return unreadCount();
  if (id === 'review') return reviewQueue().length;

}

function renderNav() {
  const groups = Object.keys(GROUPS).map(g => {
    const links = ROUTES.filter(r => r.group === g)
      .map(r => {
        const n = navCount(r.id);
        const cls = r.id === 'review' ? 'count amber' : 'count';
        return `<a href="#${r.id}" data-route="${r.id}">${ic(r.icon)}<span>${t(r.title)}</span><span class="${cls}${n ? '' : ' hidden'}">${n}</span></a>`;

function route() {
  const { route: r, args } = parseHash();
  closeModal(true);
  closeDrawer(true);
  openRail(false);
  const main = $('#main');

  const page = document.createElement('div');

  main.appendChild(page);
  (RENDERERS[r.id] || RENDERERS.home)(page, args);
  $('#crumbGroup').textContent = t(GROUPS[r.group]);
  $('#crumbTitle').textContent = t(r.title);

  animateIn(page);
  animateNumbers(page);

// ---------- SVG chart helpers (hand-drawn, with a shared hover tooltip) ----------
function niceTicks(max, n = 4) {
  const step = Math.pow(10, Math.floor(Math.log10(max / n || 1)));
  const err = max / n / step;
  const mult = err >= 7 ? 10 : err >= 3 ? 5 : err >= 1.5 ? 2 : 1;
  const s = mult * step;
  return Array.from({ length: Math.ceil(max / s) + 1 }, (_, i) => i * s);
}

function lineChart({ series, w = 560, h = 230, xMin, xMax, yMax = 1, yFmt = v => v, xFmt = v => v, xLabel = '', yLabel = '', tip }) {
  const pad = { l: 44, r: 14, t: 12, b: 34 };
  const X = v => pad.l + ((v - xMin) / (xMax - xMin || 1)) * (w - pad.l - pad.r);
  const Y = v => h - pad.b - (v / yMax) * (h - pad.t - pad.b);
  const yt = [0, 0.25, 0.5, 0.75, 1].map(f => f * yMax);
  const grid = yt.map(v => `<line class="gl" x1="${pad.l}" x2="${w - pad.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${pad.l - 6}" y="${Y(v) + 3}" text-anchor="end">${yFmt(v)}</text>`).join('');
  const xs = [...new Set(series.flatMap(s => s.points.map(p => p.x)))].sort((a, b) => a - b);
  const xStep = Math.max(1, Math.ceil(xs.length / 7));
  const xt = xs.filter((_, i) => i % xStep === 0).map(v => `<text class="ax" x="${X(v)}" y="${h - pad.b + 14}" text-anchor="middle">${xFmt(v)}</text>`).join('');
  const paths = series.map(s => {
    const pts = s.points.filter(p => p.y !== null && Number.isFinite(p.y));
    const d = pts.map((p, i) => (i ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
    const dots = s.dots ? pts.map(p => `<circle class="dot" cx="${X(p.x)}" cy="${Y(p.y)}" r="3.5" fill="currentColor"/>`).join('') : '';
    return `<g class="${s.cls}" style="color:var(--${s.color || 'muted'})"><path class="line ${s.dash ? 'base' : 'draw'} ${s.cls}" d="${d}"/>${dots}</g>`;
  });
  const hits = xs.map(x => {
    const tipHtml = tip ? tip(x) : series.map(s => `${esc(s.name)}: <b>${yFmt((s.points.find(p => p.x === x) || {}).y ?? 0)}</b>`).join('<br>');
    const bw = (w - pad.l - pad.r) / Math.max(1, xs.length);
    return `<rect class="hit" x="${X(x) - bw / 2}" y="${pad.t}" width="${bw}" height="${h - pad.t - pad.b}" data-tip="${esc(xFmt(x))}<br>${tipHtml.replace(/"/g, '&quot;')}"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(yLabel)}">${grid}${xt}
    <text class="ax" x="${(w + pad.l) / 2}" y="${h - 4}" text-anchor="middle">${esc(xLabel)}</text>${paths.join('')}${hits.join('')}</svg>`;
}

function legend(items) {
  return `<div class="legend">${items.map(it => `<span><i class="${it.kind || ''}" style="${it.kind === 'dash' ? '' : `background:var(--${it.color})`}"></i>${esc(it.label)}</span>`).join('')}</div>`;
}

function histogram({ bins, w = 560, h = 200, thrX = null, xFmt = v => v, cls = () => 'bar-n', tip }) {
  const pad = { l: 40, r: 10, t: 10, b: 28 };
  const maxY = Math.max(1, ...bins.map(b => b.n));
  const bw = (w - pad.l - pad.r) / bins.length;
  const Y = v => h - pad.b - (v / maxY) * (h - pad.t - pad.b);
  const ticks = niceTicks(maxY, 3).filter(v => v <= maxY * 1.05);
  const grid = ticks.map(v => `<line class="gl" x1="${pad.l}" x2="${w - pad.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${pad.l - 6}" y="${Y(v) + 3}" text-anchor="end">${v}</text>`).join('');
  const bars = bins.map((b, i) => {
    const x = pad.l + i * bw + 1;
    const y = Y(b.n);
    return `<rect class="${cls(b)}" x="${x}" y="${y}" width="${Math.max(1, bw - 2)}" height="${Math.max(0, h - pad.b - y)}" rx="2" data-tip="${tip ? tip(b) : esc(xFmt(b.x0)) + ': <b>' + b.n + '</b>'}"/>`;
  });
  const labels = bins.filter((_, i) => i % Math.ceil(bins.length / 6) === 0).map(b => `<text class="ax" x="${pad.l + bins.indexOf(b) * bw}" y="${h - pad.b + 14}">${xFmt(b.x0)}</text>`);
  const thr = thrX === null ? '' : `<line class="thr" x1="${pad.l + thrX * (w - pad.l - pad.r)}" x2="${pad.l + thrX * (w - pad.l - pad.r)}" y1="${pad.t}" y2="${h - pad.b}"/>`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">${grid}${bars.join('')}${labels.join('')}${thr}</svg>`;
}

function tokenBars(items, max) {
  const m = max || Math.max(0.0001, ...items.map(i => Math.abs(i.v)));
  return `<div class="tokbars">${items
    .map(it => {
      const wPct = Math.min(50, (Math.abs(it.v) / m) * 50).toFixed(1) + '%';
      const ur = ARABIC_RX.test(it.tk) ? ' ur' : '';
      return `<div class="tokbar"><span class="tk${ur}" title="${esc(displayToken(it.tk))}">${esc(displayToken(it.tk))}</span><span class="axis"><i class="${it.v >= 0 ? 'pos' : 'neg'}" data-w="${wPct}" style="width:0"></i></span><span class="num">${it.v >= 0 ? '+' : ''}${it.v.toFixed(2)}</span></div>`;
    })
    .join('')}</div>`;
}

function flagCard(f) {

function recordHistory(r) {
  const last = coll.all('history')[0];
  if (last && last.text === r.text && last.sender === r.sender) return last;
  const rec = { id: uid('h'), at: nowISO(), text: r.text, sender: r.sender, channel: r.channel, script: r.script, score: r.score, ruleScore: r.ruleScore, p: r.p, level: r.level, flags: r.flags.map(f => f.id) };
  coll.add('history', rec, 200);
  logEvent('logAnalysed', { score: r.score }, 'message');
  if (r.level === 'high') notify('noteHighRisk', { score: r.score }, { icon: 'shield-alert', level: 'high', route: '#analyse/' + rec.id });
  return rec;
}

function runAnalysis(page, save = true) {
  const text = $('#anText', page).value;
  if (!text.trim()) {
    toast(t('pasteFirst'), 'warn');
    return;
  }
  const sender = $('#anSender', page).value.trim();
  const channel = $('#anChannel .on', page).dataset.ch;
  setDraft({ text, sender, channel });
  const r = fullAnalysis(text, { sender, channel });
  LAST_RESULT = r;
  r.hist = save ? recordHistory(r) : null;
  const out = $('#anResult', page);
  out.innerHTML = resultHTML(r);
  bindResult(page, r);
  animateGauge(out);
  animateNumbers(out);
  announce(t('announceVerdict', { verdict: t('verdict_' + r.level), score: r.score }));
  renderHistoryList(page);
  renderNavCounts();
  if (window.innerWidth <= 1020) setTimeout(() => out.scrollIntoView({ block: 'start' }), 60);
}

function addToDataset(r, label) {
  const st = datasetState();
  st.added.push({ id: uid('u'), label, script: r.script === 'mixed' ? 'ru' : r.script, text: r.text, at: nowISO() });
  markDatasetChanged(st);
  logEvent('logDatasetAdd', { label: t(label === 's' ? 'labelScam' : 'labelLegit') }, 'database');
  toast(t('addedToDataset'));
}

function saveMessageEvidence(r) {
  const title = r.text.replace(/\s+/g, ' ').slice(0, 70);
  const id = uid('e');
  coll.add('evidence', { id, at: nowISO(), kind: 'message', title, detail: r.text, sender: r.sender, channel: r.channel, score: r.score, level: r.level, flags: r.flags.filter(f => f.pts > 0).map(f => f.id), note: '' });
  logEvent('logEvidence', { title }, 'folder');
  toast(t('savedEvidence'));
  return id;
}

function summaryText(r) {
  const flags = r.flags.filter(f => f.pts > 0).map(f => '- ' + L(f.def.title)).join('\n');
  return `FraudShield — ${t('verdict_' + r.level)} (${r.score}/100)\n${t('sender')}: ${r.sender || '—'}\n\n${r.text}\n\n${t('redFlags')}:\n${flags || '-'}\n\n${t('disclaimerShort')}`;
}

function bindResult(page, r) {
  $('#anSave', page).onclick = () => saveMessageEvidence(r);

async function handlePaste(e, page) {
  const file = [...(e.clipboardData ? e.clipboardData.files : [])].find(f => f.type.startsWith('image/'));
  if (!file) return;
  e.preventDefault();
  const text = await ocrScreenshot(file);
  if (text) $('#anText', page).value = text;
  else toast(t('ocrMissing'), 'info');
}

function bindAnalyserForm(page) {
  const ta = $('#anText', page);
  const info = () => ($('#scriptInfo', page).innerHTML = scriptInfoHTML(ta.value));
  ta.addEventListener('input', debounce(info, 150));
  ta.addEventListener('paste', e => handlePaste(e, page));
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) runAnalysis(page);
  });
  info();
  $('#anSample', page).onchange = e => {
    const s = MSG_SAMPLES.find(x => x.id === e.target.value);
    if (!s) return;
    ta.value = s.text;
    $('#anSender', page).value = s.sender;
    $$('#anChannel button', page).forEach(b => b.classList.toggle('on', b.dataset.ch === s.channel));
    info();
    runAnalysis(page);
  };
  $$('#anChannel button', page).forEach(b => (b.onclick = () => $$('#anChannel button', page).forEach(x => x.classList.toggle('on', x === b))));
  $('#anGo', page).onclick = () => runAnalysis(page);
  $('#anClear', page).onclick = () => {
    ta.value = '';
    $('#anSender', page).value = '';
    setDraft({ text: '', sender: '' });
    $('#anResult', page).innerHTML = emptyResultHTML();
    info();
    ta.focus();
  };
}

const MODEL_TABS = ['evaluate', 'dataset', 'explain', 'export'];
let CV_RESULT = null;
const DS_VIEW = { script: 'all', label: 'all', src: 'all', q: '', page: 0 };

function retrain(opts = mlOpts()) {
  store.set('mlopts', opts);
  store.remove('model');
  MODEL = trainModels(opts);
  MODEL.dsv = datasetState().version || 0;
  CV_RESULT = null;
  const f1 = confusion(MODEL.eval.pLR, MODEL.eval.ys, opts.threshold).f1;
  logEvent('logTrained', { f1: f1.toFixed(2), n: MODEL.eval.nTrain }, 'brain');
  notify('noteTrained', { f1: f1.toFixed(2), ms: MODEL.ms }, { icon: 'brain', route: '#model' });
  renderRailFoot();
  return MODEL;
}

function markDatasetChanged(st) {
  st.version = (st.version || 0) + 1;
  saveDatasetState(st);
}

function relabel(id) {
  const st = datasetState();
  const ex = allExamples().find(e => e.id === id);
  if (!ex) return;
  const next = ex.label === 's' ? 'h' : 's';
  if (next === ex.orig) delete st.relabels[id];
  else st.relabels[id] = next;
  markDatasetChanged(st);
  logEvent('logRelabel', { id, label: t(next === 's' ? 'labelScam' : 'labelLegit') }, 'tag');
}

const labelPill = (lab, id) => `<button class="badge lab-pill ${lab === 's' ? 'scam' : 'legit'}" data-relabel="${id}" title="${t('clickRelabel')}">${ic(lab === 's' ? 'alert' : 'check')}${t(lab === 's' ? 'labelScam' : 'labelLegit')}</button>`;

function metricBlock(m, auc) {
  return `<div class="metric-row">
    <div class="metric"><b data-count="${(m.acc * 100).toFixed(1)}" data-dec="1" data-suffix="%">0</b><span>${t('accuracy')}</span></div>
    <div class="metric"><b data-count="${(m.prec * 100).toFixed(1)}" data-dec="1" data-suffix="%">0</b><span>${t('precision')}</span></div>
    <div class="metric"><b data-count="${(m.rec * 100).toFixed(1)}" data-dec="1" data-suffix="%">0</b><span>${t('recall')}</span></div>
    <div class="metric"><b data-count="${m.f1.toFixed(3)}" data-dec="3">0</b><span>F1 · AUC ${Number.isFinite(auc) ? auc.toFixed(3) : '—'}</span></div></div>`;
}

function confusionGrid(m) {
  const n = m.tp + m.fp + m.fn + m.tn || 1;
  const cell = (cls, v, key) => `<div class="c ${cls}" style="--a:${Math.round(10 + (v / n) * 70)}%" data-tip="${t(key)}: <b>${v}</b>"><b>${v}</b><span>${t(key)}</span></div>`;
  return `<div class="cm" role="table" aria-label="${t('confusion')}">
    <span></span><span class="h">${t('predScam')}</span><span class="h">${t('predLegit')}</span>
    <span class="h">${t('actualScam')}</span>${cell('tp', m.tp, 'tp')}${cell('fn', m.fn, 'fn')}
    <span class="h">${t('actualLegit')}</span>${cell('fp', m.fp, 'fp')}${cell('tn', m.tn, 'tn')}</div>`;
}

function modelCard(key, ev, thr) {
  const probs = key === 'nb' ? ev.pNB : ev.pLR;
  const m = confusion(probs, ev.ys, thr);
  const lift = (m.acc - ev.baseline.acc) * 100;
  return `<section class="panel model-card"><header class="ph"><span class="num">${key === 'nb' ? 'NB' : 'LR'}</span><h3>${t('model_' + key)}</h3>
      <span class="meta"><span class="badge ${lift > 0 ? 'ok' : 'high'}">${ic(lift > 0 ? 'trending-up' : 'trending-down')}${lift >= 0 ? '+' : ''}${lift.toFixed(1)} ${t('ptsVsBaseline')}</span></span></header>
    <div class="pb stack">${metricBlock(m, ev.auc[key])}${confusionGrid(m)}</div></section>`;
}

function lossChart(model) {
  if (!model.curve || !model.curve.length) return `<p class="muted small">${t('noCurve')}</p>`;
  const maxY = Math.max(...model.curve.map(c => Math.max(c.train, c.test || 0))) * 1.05;
  const series = [{ name: t('trainLoss'), cls: 's1', color: 'series-1', points: model.curve.map(c => ({ x: c.ep, y: c.train })) }];
  if (model.curve[0].test !== null) series.push({ name: t('testLoss'), cls: 's2', color: 'series-2', points: model.curve.map(c => ({ x: c.ep, y: c.test })) });
  return lineChart({ series, xMin: 1, xMax: model.curve[model.curve.length - 1].ep, yMax: maxY, yFmt: v => v.toFixed(2), xLabel: t('epoch'), yLabel: t('lossCurve') }) + legend(series.map(s => ({ color: s.color, label: s.name })));
}

function perScriptTable(ev) {
  const rows = ['en', 'ur', 'ru'].map(sc => {
    const r = ev.perScript[sc];
    return `<tr><td>${t('script_' + sc)}</td><td class="num">${r.n}</td>
      <td><div class="meter-row"><span class="mono">NB</span><div class="bar blue"><i data-w="${(r.nb * 100).toFixed(0)}%"></i></div><span class="num">${pct(r.nb)}</span></div>
      <div class="meter-row"><span class="mono">LR</span><div class="bar"><i data-w="${(r.lr * 100).toFixed(0)}%"></i></div><span class="num">${pct(r.lr)}</span></div></td></tr>`;
  });
  return `<div class="table-wrap"><table class="data"><thead><tr><th>${t('script')}</th><th class="num">${t('testN')}</th><th>${t('accuracy')}</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}

function misclassified(ev, thr) {
  const ex = Object.fromEntries(allExamples().map(e => [e.id, e]));
  const rows = ev.testIds
    .map((id, i) => ({ e: ex[id], y: ev.ys[i], nb: ev.pNB[i], lr: ev.pLR[i] }))
    .filter(r => r.e && ((r.lr >= thr ? 1 : 0) !== r.y || (r.nb >= thr ? 1 : 0) !== r.y));
  if (!rows.length) return `<div class="empty">${ic('check-circle')}<span>${t('noMistakes')}</span></div>`;
  return `<div class="table-wrap"><table class="data"><thead><tr><th>${t('message')}</th><th>${t('label')}</th><th class="num">NB</th><th class="num">LR</th></tr></thead><tbody>${rows
    .map(r => `<tr><td><span class="clip msg-text" dir="auto">${esc(r.e.text)}</span>${scriptTag(r.e.script)}</td><td>${labelPill(r.e.label, r.e.id)}</td><td class="num">${pct(r.nb)}</td><td class="num">${pct(r.lr)}</td></tr>`)
    .join('')}</tbody></table></div>`;
}

function trainControls(o) {
  const num = (id, label, v, step, min, max) => `<label class="field"><span>${label}</span><input type="number" id="${id}" value="${v}" step="${step}" min="${min}" max="${max}"></label>`;
  return `<section class="panel"><header class="ph"><span class="num">01</span><h3>${t('trainSettings')}</h3></header><div class="pb stack">
    <div class="slider-row"><span>${t('testSplit')}</span><input type="range" id="mlTest" min="0.1" max="0.4" step="0.05" value="${o.test}"><output>${pct(o.test)}</output></div>
    <div class="form-grid">${num('mlSeed', t('splitSeed'), o.seed, 1, 1, 9999)}${num('mlAlpha', t('nbAlpha'), o.alpha, 0.1, 0.01, 5)}${num('mlLr', t('lrRate'), o.lr, 0.5, 0.1, 50)}${num('mlEpochs', t('lrEpochs'), o.epochs, 50, 50, 3000)}${num('mlL2', t('lrL2'), o.l2, 0.0001, 0, 0.1)}</div>
    <label class="switch"><input type="checkbox" id="mlBigrams" ${o.bigrams ? 'checked' : ''}><span>${t('useBigrams')}</span></label>
    <label class="switch"><input type="checkbox" id="mlRules" ${o.rules ? 'checked' : ''}><span>${t('useRuleFeatures')}</span></label>
    <div class="row"><button class="btn primary" id="mlTrain">${ic('brain')}${t('trainBoth')}</button><button class="btn" id="mlCV">${ic('layers')}${t('runCV')}</button><button class="btn ghost" id="mlReset">${ic('undo')}${t('defaults')}</button></div>
  </div></section>`;
}

function cvBox() {
  if (!CV_RESULT) return '';
  const c = CV_RESULT;
  const f = s => `${(s.mean * 100).toFixed(1)}% ± ${(s.sd * 100).toFixed(1)}`;
  return `<div class="baseline cv-box mt">${ic('layers')}<span>${t('cvResult', { k: c.k })}: NB ${f(c.nb.acc)} · LR ${f(c.lr.acc)} · ${t('baseline')} ${pct(c.base, 1)}</span></div>`;
}

function evaluateTab(page) {
  const m = getModel();
  const o = mlOpts();
  const ev = m.eval;
  const thr = o.threshold;
  const stale = (datasetState().version || 0) !== (m.dsv || 0) && m.source === 'trained';
  return `<div class="split">
      <div class="stack">${trainControls(o)}
        <section class="panel"><header class="ph"><span class="num">02</span><h3>${t('threshold')}</h3><span class="meta"><output class="mono" id="thrOut">${thr.toFixed(2)}</output></span></header>
          <div class="pb"><input type="range" id="mlThr" min="0.1" max="0.9" step="0.05" value="${thr}" aria-label="${t('threshold')}"><p class="muted small mt">${t('thresholdHelp')}</p></div></section>
      </div>
      <div class="stack">
        ${stale ? `<div class="baseline">${ic('alert')}<span>${t('staleModel')}</span><button class="btn sm primary" id="mlRetrain2">${t('retrainNow')}</button></div>` : ''}
        <div class="baseline">${ic('scale')}<span>${t('baselineLine', { acc: pct(ev.baseline.acc, 1), cls: t(ev.baseline.majority ? 'labelScam' : 'labelLegit'), n: ev.nTest, tr: ev.nTrain })}</span></div>
        ${cvBox()}
        <div class="grid g2">${modelCard('nb', ev, thr)}${modelCard('lr', ev, thr)}</div>
        <section class="panel"><header class="ph"><span class="num">03</span><h3>${t('lossCurve')}</h3><span class="meta tiny muted">${t('trainedIn', { ms: m.ms || 0 })}</span></header><div class="pb">${lossChart(m)}</div></section>
        <section class="panel"><header class="ph"><span class="num">04</span><h3>${t('perScript')}</h3></header><div class="pb">${perScriptTable(ev)}</div></section>
        <section class="panel"><header class="ph"><span class="num">05</span><h3>${t('mistakes')}</h3><span class="meta tiny muted">${t('relabelHint')}</span></header><div class="pb">${misclassified(ev, thr)}</div></section>
      </div></div>`;
}

function readControls(page) {
  const v = id => parseFloat($('#' + id, page).value);
  return { ...mlOpts(), test: v('mlTest'), seed: Math.round(v('mlSeed')) || 42, alpha: v('mlAlpha') || 0.5, lr: v('mlLr') || 4, epochs: clamp(Math.round(v('mlEpochs')) || 500, 50, 3000), l2: Math.max(0, v('mlL2') || 0), bigrams: $('#mlBigrams', page).checked, rules: $('#mlRules', page).checked };
}

function bindEvaluate(page) {
  const out = $('#mlTest', page).nextElementSibling;
  $('#mlTest', page).oninput = e => (out.textContent = pct(+e.target.value));
  const train = () => {
    retrain(readControls(page));
    toast(t('trainedToast'));
    refresh();
  };
  $('#mlTrain', page).onclick = train;
  if ($('#mlRetrain2', page)) $('#mlRetrain2', page).onclick = train;
  $('#mlReset', page).onclick = () => {
    retrain({ ...DEFAULT_ML_OPTS });
    refresh();
  };
  $('#mlCV', page).onclick = () => {
    CV_RESULT = crossValidate(5, readControls(page));
    logEvent('logCV', { acc: (CV_RESULT.lr.acc.mean * 100).toFixed(1) }, 'layers');
    refresh();
  };
  $('#mlThr', page).oninput = e => ($('#thrOut', page).textContent = (+e.target.value).toFixed(2));
  $('#mlThr', page).onchange = e => {
    store.set('mlopts', { ...mlOpts(), threshold: +e.target.value });
    getModel().opts.threshold = +e.target.value;
    refresh();
  };
}

// ---------- classifier lab: dataset, explain and export tabs ----------
function filteredExamples() {
  const q = DS_VIEW.q.trim().toLowerCase();
  return allExamples().filter(e => (DS_VIEW.script === 'all' || e.script === DS_VIEW.script) && (DS_VIEW.label === 'all' || e.label === DS_VIEW.label) && (DS_VIEW.src === 'all' || e.src === DS_VIEW.src || (DS_VIEW.src === 'relabelled' && e.label !== e.orig)) && (!q || e.text.toLowerCase().includes(q) || e.id === q));
}

function datasetSummary() {
  const ex = allExamples();
  const cell = (sc, lab) => ex.filter(e => e.script === sc && e.label === lab).length;
  const rows = ['en', 'ur', 'ru'].map(sc => `<tr><td>${t('script_' + sc)}</td><td class="num">${cell(sc, 's')}</td><td class="num">${cell(sc, 'h')}</td><td class="num">${cell(sc, 's') + cell(sc, 'h')}</td></tr>`);
  const st = datasetState();
  return `<div class="table-wrap"><table class="data"><thead><tr><th>${t('script')}</th><th class="num">${t('labelScam')}</th><th class="num">${t('labelLegit')}</th><th class="num">${t('total')}</th></tr></thead>
    <tbody>${rows.join('')}<tr><td><b>${t('total')}</b></td><td class="num"><b>${ex.filter(e => e.label === 's').length}</b></td><td class="num"><b>${ex.filter(e => e.label === 'h').length}</b></td><td class="num"><b>${ex.length}</b></td></tr></tbody></table></div>
    <p class="muted small mt">${t('dsCounts', { added: st.added.length, relabelled: Object.keys(st.relabels).length, removed: st.removed.length })}</p>`;
}

function chipRow(key, values) {
  return `<div class="chips" role="group">${values.map(v => `<button class="chip ${DS_VIEW[key] === v ? 'on' : ''}" data-dsf="${key}" data-v="${v}">${t(key === 'script' && v !== 'all' ? 'script_' + v : 'dsf_' + v)}</button>`).join('')}</div>`;
}

function datasetTab() {
  const rows = filteredExamples();
