// ---------- text analysis ----------
const countWords = text => (String(text || '').trim().match(/\S+/g) || []).length;
const splitParas = text => String(text || '').split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
const splitSentences = text => String(text || '').replace(/\n+/g, ' ').split(/(?<=[.!?۔؟])\s+/).map(s => s.trim()).filter(s => /\w/.test(s));
const isMostlyUrdu = text => (String(text).match(/[؀-ۿ]/g) || []).length > String(text).length * 0.3;

function syllables(word) {
  let w = word.toLowerCase().replace(/[^a-z]/g, '');
  if (!w) return 0;
  if (w.length <= 3) return 1;
  w = w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, '').replace(/^y/, '');
  const groups = w.match(/[aeiouy]{1,2}/g);
  return Math.max(1, groups ? groups.length : 1);
}

const FILLERS = ['very', 'really', 'basically', 'actually', 'just', 'things', 'stuff', 'a lot', 'kind of', 'sort of', 'extremely', 'literally'];
const CLICHES = ['since childhood', 'since my childhood', 'from a young age', 'passion for', 'dream come true', 'ever since i was', 'in today\'s world', 'in this modern era', 'hard-working', 'i have always been fascinated', 'think outside the box'];
const STOP = new Set('the a an and or but of to in on for with at by from as is are was were be been being this that these those it its i my me we our you your they their he she his her them not no so if then than also into about which who whom what when where how all any can will would should could have has had do does did more most such only own same other just very'.split(' '));

function readability(text) {
  // TODO(student): AI feedback on essays — add a "Get feedback" action that strips names, CNIC and contact details,
  //   sends the essay through your own server proxy to a language model, and returns structure suggestions that the
  //   writer can accept or reject next to these readability numbers. Never call a model API key from the browser.
  const words = String(text).match(/[A-Za-z][A-Za-z'’-]*/g) || [];
  const sentences = splitSentences(text);
  const lower = String(text).toLowerCase();
  const syl = sum(words.map(syllables));
  const wps = sentences.length ? words.length / sentences.length : 0;
  const spw = words.length ? syl / words.length : 0;
  const flesch = Math.round(206.835 - 1.015 * wps - 84.6 * spw);
  const grade = Math.max(0, Math.round((0.39 * wps + 11.8 * spw - 15.59) * 10) / 10);
  const passive = (String(text).match(/\b(am|is|are|was|were|be|been|being)\s+(\w+ly\s+)?\w+(ed|en)\b/gi) || []).length;
  const fillers = FILLERS.filter(f => new RegExp(`\\b${f}\\b`, 'i').test(lower));
  const cliches = CLICHES.filter(c => lower.includes(c));
  const freq = {};
  words.map(w => w.toLowerCase()).filter(w => w.length > 3 && !STOP.has(w)).forEach(w => (freq[w] = (freq[w] || 0) + 1));
  const repeats = Object.entries(freq).filter(([, n]) => n >= 3).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const long = sentences.filter(s => countWords(s) > 30).length;
  return { words: words.length, sentences: sentences.length, flesch: clamp(flesch, 0, 100), grade, wps: Math.round(wps * 10) / 10, long, passive, fillers, cliches, repeats };
}

const fleschBand = f => (f >= 60 ? 'easy' : f >= 40 ? 'ok' : f >= 25 ? 'hard' : 'vhard');

// Structure checklist: automatic heuristics that the writer can override with a manual tick.
const STRUCTURE = [
  { id: 'hook', test: (txt, paras) => paras.length > 0 && !/^(my name is|i am writing|"|“|i am applying)/i.test(paras[0]) && countWords(splitSentences(paras[0])[0] || '') <= 35 },
  { id: 'motivation', test: txt => /\b(because|motivat|inspir|passion|why i|matters? to me|shaped|realis|realiz)/i.test(txt) },
  { id: 'academic', test: txt => /\b(degree|bs |bsc|cgpa|gpa|course|thesis|research|final year project|university|semester)/i.test(txt) },
  { id: 'evidence', test: txt => (txt.match(/\b\d[\d,.]*\s*(%|percent|people|students|volunteers|users|requests|images|months|years)?/gi) || []).length >= 2 },
  { id: 'goals', test: txt => /\b(goal|aim|plan|aspire|future|career|long[- ]term|short[- ]term|want to)\b/i.test(txt) },
  { id: 'fit', test: (txt, paras, e) => /\b(this programme|this program|your programme|modules?|course on|supervisor|scholarship|university of)\b/i.test(txt) || (e && e.app && appById(e.app) && txt.toLowerCase().includes(appSch(appById(e.app)).id.split('-')[0])) },
  { id: 'return', test: txt => /\b(pakistan|return|back home|my country|community|province)\b/i.test(txt) },
  { id: 'close', test: (txt, paras) => paras.length >= 3 && /\b(will|look forward|ultimately|therefore|confident|in conclusion|after (the|my) (programme|program|studies|graduat))/i.test(paras[paras.length - 1]) },
];

function structureState(e) {
  const paras = splitParas(e.text);
  return STRUCTURE.map(s => {
    const auto = !!s.test(e.text || '', paras, e);
    const manual = e.checks ? e.checks[s.id] : undefined;
    return { id: s.id, auto, done: manual === undefined ? auto : manual, manual: manual !== undefined };
  });
}

// Word-level diff (LCS); very long pairs fall back to a whole-text replacement to bound the table size.
// TODO(student): essay reuse detector — build 5-word shingles for every essay and bank paragraph, compute Jaccard
//   similarity between essays sent to competing scholarships and flag near-identical paragraphs before submission.
function diffWords(a, b) {
  const A = String(a).split(/(\s+)/).filter(x => x !== '');
  const B = String(b).split(/(\s+)/).filter(x => x !== '');
  if (A.length * B.length > 4e6) return [{ op: 'del', text: a }, { op: 'add', text: b }];
  const n = A.length;
  const m = B.length;
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  }
  const out = [];
  const push = (op, text) => (out.length && out[out.length - 1].op === op ? (out[out.length - 1].text += text) : out.push({ op, text }));
  let i = 0;
  let j = 0;
  while (i < n && j < m) {
    if (A[i] === B[j]) {
      push('eq', A[i]);
      i++;
      j++;
    } else if (dp[i + 1][j] >= dp[i][j + 1]) push('del', A[i++]);
    else push('add', B[j++]);
  }
  while (i < n) push('del', A[i++]);
  while (j < m) push('add', B[j++]);
  return out;
}

// ---------- essays list + paragraph bank ----------
const essayLimitInfo = e => {
  const used = e.limitType === 'chars' ? (e.text || '').length : countWords(e.text);
  return { used, limit: e.limit || 0, pct: e.limit ? Math.round((used / e.limit) * 100) : 0, over: e.limit ? used > e.limit : false };
};

function essayCard(e) {
  const li = essayLimitInfo(e);
  const a = e.app ? appById(e.app) : null;
  const r = isMostlyUrdu(e.text) ? null : readability(e.text);
  const done = structureState(e).filter(s => s.done).length;
  return `<article class="ecard card lift"><a class="cover" href="#essay/${e.id}" aria-label="${esc(e.title)}"></a>
    <div class="tag">${a ? esc(appName(a)) : t('es_noApp')}</div>
    <h3>${esc(e.title)}</h3>
    <p class="excerpt">${esc((e.text || '').slice(0, 150))}${(e.text || '').length > 150 ? '…' : ''}</p>
    <div class="between tiny"><span class="tnum ${li.over ? 'red-t' : ''}">${li.used} / ${li.limit} ${e.limitType === 'chars' ? t('es_charsLc') : t('es_wordsLc')}</span><span class="muted">${t('es_updated', { when: relDays(Math.round((startOfDay(e.updated) - TODAY) / DAY)) })}</span></div>
    <div class="bar ${li.over ? 'red' : li.pct >= 85 ? 'green' : 'navy'}"><i data-w="${Math.min(100, li.pct)}"></i></div>
    <div class="row tiny mt-s"><span class="chip">${ic('list-checks')} ${done}/${STRUCTURE.length}</span>${r && r.words > 20 ? `<span class="chip">${ic('gauge')} ${r.flesch}</span>` : ''}<span class="chip">${ic('history')} ${e.versions.length}</span></div>
  </article>`;
}

function bankItem(b, insert = false) {
  return `<li class="bankitem"><div class="between"><b>${esc(b.title)}</b><span class="chip gold">${t('bank_' + (b.tag || 'other'))}</span></div>
    <p class="small">${esc(b.text)}</p><div class="row">
    ${insert ? `<button class="btn sm" data-binsert="${b.id}">${ic('plus')} ${t('es_insert')}</button>` : ''}
    <button class="btn ghost sm" data-bcopy="${b.id}">${ic('copy')} ${t('copy')}</button>
    <button class="btn ghost sm icon" data-bedit="${b.id}" aria-label="${t('edit')}">${ic('edit')}</button>
    <button class="btn ghost sm icon" data-bdel="${b.id}" aria-label="${t('del')}">${ic('trash')}</button></div></li>`;
}

const BANK_TAGS = ['leadership', 'research', 'career', 'return', 'community', 'challenge', 'other'];
let bankTag = '';

function renderEssays(view) {
  const rows = essays().sort((a, b) => b.updated - a.updated);
  const items = bank().filter(b => !bankTag || b.tag === bankTag);
  view.innerHTML = `<header class="pagehead"><div><div class="kicker">${ic('feather')} ${t('es_kicker')}</div><h1>${t('es_title')}</h1><p class="dek">${t('es_dek')}</p></div>
      <div class="actions"><button class="btn" id="esNew">${ic('plus')} ${t('es_new')}</button></div></header>
    ${rows.length ? `<div class="egrid stagger">${rows.map(essayCard).join('')}</div>` : `<div class="empty card">${ic('feather')}${t('es_none')}</div>`}
    <section class="mt2"><div class="pagehead slim"><div><div class="kicker">${ic('layers')} ${t('es_bank')}</div><p class="dek">${t('es_bankDek')}</p></div><div class="actions"><button class="btn ghost" id="bkAdd">${ic('plus')} ${t('es_addPara')}</button></div></div>
      <div class="chips mb">${['', ...BANK_TAGS].map(tg => `<button class="chip ${bankTag === tg ? 'on' : ''}" data-btag="${tg}">${tg ? t('bank_' + tg) : t('all')}</button>`).join('')}</div>
      <ul class="bankgrid stagger">${items.map(b => bankItem(b)).join('')}</ul></section>`;
  $('#esNew').onclick = () => openNewEssay('');
  $('#bkAdd').onclick = () => openBankItem(null, '', () => renderEssays(view));
  $$('[data-btag]', view).forEach(b => (b.onclick = () => {
    bankTag = b.dataset.btag;
    renderEssays(view);
    animateIn(view);
  }));
  bindBank(view, () => renderEssays(view), null);
}

function bindBank(root, rerender, onInsert) {
  $$('[data-bcopy]', root).forEach(b => (b.onclick = () => copyText((list('bank').find(x => x.id === b.dataset.bcopy) || {}).text || '')));
  $$('[data-bedit]', root).forEach(b => (b.onclick = () => openBankItem(b.dataset.bedit, '', rerender)));
  $$('[data-bdel]', root).forEach(b => (b.onclick = () => confirmBox(t('del') + '?', () => {
    removeFrom('bank', b.dataset.bdel);
    rerender();
  })));
  if (onInsert) $$('[data-binsert]', root).forEach(b => (b.onclick = () => onInsert(list('bank').find(x => x.id === b.dataset.binsert))));
}

function openBankItem(id, text, after) {
  const b = id ? list('bank').find(x => x.id === id) : { title: '', tag: 'other', text };
  openModal(`<h3>${ic('layers')} ${t('es_bank')}</h3>
    <div class="grid2"><label class="field">${t('title')}<input type="text" id="bkTitle" value="${esc(b.title)}"></label>
    <label class="field">${t('es_tag')}<select id="bkTag">${BANK_TAGS.map(tg => `<option value="${tg}" ${b.tag === tg ? 'selected' : ''}>${t('bank_' + tg)}</option>`).join('')}</select></label></div>
    <label class="field mt">${t('es_text')}<textarea id="bkText" rows="6">${esc(b.text)}</textarea></label>
    <div class="row mt"><span class="spacer"></span><button class="btn" id="bkSave">${ic('save')} ${t('save')}</button></div>`);
  $('#bkSave').onclick = () => {
    const rec = { title: $('#bkTitle').value.trim() || $('#bkText').value.trim().slice(0, 40), tag: $('#bkTag').value, text: $('#bkText').value.trim() };
    if (!rec.text) return;
    if (id) mutateIn('bank', id, x => Object.assign(x, rec));
    else saveList('bank', [...list('bank'), { id: 'b-' + uid(), ...rec }]);
    toast(t('saved'), 'ok');
    closeModal(true);
    after();
  };
}

  openModal(`<h3>${ic('feather')} ${t('es_new')}</h3>
    <label class="field">${t('title')}<input type="text" id="neTitle" placeholder="${t('es_defaultTitle')}"></label>
    <label class="field mt">${t('es_app')}<select id="neApp"><option value="">${t('es_noApp')}</option>${appOpts}</select></label>
    <label class="field mt">${t('es_prompt')}<textarea id="nePrompt" rows="3"></textarea></label>
    <div class="grid2 mt"><label class="field">${t('es_limitType')}<select id="neType"><option value="words">${t('es_words')}</option><option value="chars">${t('es_chars')}</option></select></label>
    <label class="field">${t('es_limit')}<input type="number" id="neLimit" min="50" step="50" value="500"></label></div>
    <label class="check mt"><input type="checkbox" id="neOutline" checked> ${t('es_outline')}</label>
    <div class="row mt"><span class="spacer"></span><button class="btn" id="neSave">${ic('save')} ${t('save')}</button></div>`);

    const app = $('#neApp').value;
    const title = $('#neTitle').value.trim() || (app ? `${appName(appById(app))} — ${t('es_defaultTitle')}` : t('es_defaultTitle'));
    const e = { id: 'e-' + uid(), title, app, prompt: $('#nePrompt').value.trim(), limitType: $('#neType').value, limit: Math.max(50, +$('#neLimit').value || 500), text: $('#neOutline').checked ? OUTLINE : '', checks: {}, versions: [], updated: Date.now() };
    saveList('essays', [...list('essays'), e]);
    closeModal(true);
    location.hash = '#essay/' + e.id;
  };
}

// ---------- essay editor ----------
let edPanel = 'structure';

const essayPrintHtml = e => `<h1>${esc(e.title)}</h1>${e.prompt ? `<p class="prompt-print"><i>${esc(e.prompt)}</i></p>` : ''}${splitParas(e.text).map(p => `<p>${esc(p)}</p>`).join('')}<p class="tiny">${countWords(e.text)} ${t('es_wordsLc')} · ${(e.text || '').length} ${t('es_charsLc')}</p>`;

function meterHtml(e) {
  const li = essayLimitInfo(e);
  const left = li.limit - li.used;
  const unit = e.limitType === 'chars' ? t('es_charsLc') : t('es_wordsLc');
  const status = li.over ? t('es_over', { n: -left }) : t('es_left', { n: left });
  const cls = li.over ? 'red' : li.pct >= 85 ? 'green' : 'navy';
  return `<div class="between"><span class="tnum"><b>${li.used}</b> / ${li.limit} ${unit}</span><span class="tnum small ${li.over ? 'red-t' : 'muted'}">${status}</span></div>
    <div class="bar ${cls}"><i style="width:${Math.min(100, li.pct)}%"></i></div>
    <div class="tiny muted tnum">${countWords(e.text)} ${t('es_wordsLc')} · ${(e.text || '').length} ${t('es_charsLc')} · ${splitParas(e.text).length} ${t('es_paras')} · ${splitSentences(e.text).length} ${t('es_sentences')}</div>`;
}

function structurePanel(e) {
  return `<ul class="structure">${structureState(e).map(s => `<li class="${s.done ? 'done' : ''}">
    <label class="check"><input type="checkbox" data-sc="${s.id}" ${s.done ? 'checked' : ''}><span><b>${t('sc_' + s.id)}</b><span class="tiny muted">${t('sc_' + s.id + '_h')}</span></span></label>
    <span class="chip tiny ${s.manual ? 'gold' : ''}">${s.manual ? t('es_manual') : t('es_auto')}</span></li>`).join('')}</ul>`;
}

function gauge(score) {
  const ang = Math.PI * (1 - score / 100);
  const x = 60 + 46 * Math.cos(ang);
  const y = 60 - 46 * Math.sin(ang);
  return `<svg class="gauge chart" viewBox="0 0 120 70" role="img" aria-label="${score}"><path d="M14 60 A46 46 0 0 1 106 60" class="track"/><path d="M14 60 A46 46 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)}" class="val"/><text x="60" y="58" text-anchor="middle">${score}</text></svg>`;
}

function readabilityPanel(e) {
  if (isMostlyUrdu(e.text)) return `<p class="small muted">${t('es_englishOnly')}</p>`;
  const r = readability(e.text);
  if (r.words < 25) return `<p class="small muted">${t('es_tooShort')}</p>`;
  const stat = (k, v, bad = false) => `<div class="statrow ${bad ? 'bad' : ''}"><span>${t(k)}</span><b class="tnum">${v}</b></div>`;
  return `<div class="center">${gauge(r.flesch)}<div><b>${t('es_band_' + fleschBand(r.flesch))}</b></div><p class="tiny muted">${t('es_target')}</p></div>
    ${stat('es_flesch', r.flesch)}${stat('es_grade', r.grade)}${stat('es_avgSent', r.wps, r.wps > 25)}${stat('es_longSent', r.long, r.long > 0)}${stat('es_passive', r.passive, r.passive > 3)}
    ${r.fillers.length ? `<div class="mt-s"><div class="tiny muted">${t('es_fillers')}</div><div class="chips">${r.fillers.map(f => `<span class="chip amber">${esc(f)}</span>`).join('')}</div></div>` : ''}
    ${r.cliches.length ? `<div class="mt-s"><div class="tiny muted">${t('es_cliches')}</div><div class="chips">${r.cliches.map(f => `<span class="chip red">${esc(f)}</span>`).join('')}</div></div>` : ''}
    ${r.repeats.length ? `<div class="mt-s"><div class="tiny muted">${t('es_repeats')}</div><div class="chips">${r.repeats.map(([w, n]) => `<span class="chip">${esc(w)} <b class="tnum">${n}</b></span>`).join('')}</div></div>` : ''}`;
}

function versionsPanel(e) {
  const rows = [...e.versions].reverse();
  return `<button class="btn sm" id="edSaveV">${ic('save')} ${t('es_saveVersion')}</button>
    ${rows.length ? `<ul class="versions">${rows.map((v, i) => {
      const idx = e.versions.length - 1 - i;
      return `<li><div><b>${esc(v.label)}</b><div class="tiny muted tnum">${fmtDate(new Date(v.ts))} · ${countWords(v.text)} ${t('es_wordsLc')}</div></div>
        <div class="row"><button class="btn ghost sm" data-vdiff="${idx}">${ic('git-branch')} ${t('es_compare')}</button><button class="btn ghost sm" data-vrest="${idx}">${ic('undo')} ${t('es_restore')}</button></div></li>`;
    }).join('')}</ul>` : `<p class="small muted mt">${t('es_noVersions')}</p>`}`;
}

function bankPanel() {
  return `<ul class="banklist">${bank().map(b => bankItem(b, true)).join('')}</ul><button class="btn ghost sm" id="edBankNew">${ic('plus')} ${t('es_addPara')}</button>`;
}

function renderEssayEditor(view, id) {
  const e = essayById(id);
  if (!e) {
    view.innerHTML = `<div class="empty card">${ic('alert')}<p>${t('emptyHere')}</p><a class="btn" href="#essays">${t('nav_essays')}</a></div>`;
    return;
  }
  const a = e.app ? appById(e.app) : null;
  view.innerHTML = `<header class="pagehead noprint"><div><div class="kicker">${ic('feather')} ${a ? `<a href="#app/${a.id}">${esc(appName(a))}</a>` : t('es_kicker')}</div><h1>${esc(e.title)}</h1></div>
      <div class="actions"><a class="btn ghost" href="#essays">${ic('arrow-left')} ${t('nav_essays')}</a><button class="btn ghost" id="edSettings">${ic('sliders')} ${t('es_settings')}</button>
      <button class="btn ghost" onclick="window.print()">${ic('printer')} ${t('print')}</button><button class="btn danger" id="edDel">${ic('trash')} ${t('del')}</button></div></header>
    <div class="editor">
      <section class="ed-main">
        ${e.prompt ? `<details class="prompt" open><summary>${t('es_prompt')}</summary><p>${esc(e.prompt)}</p></details>` : ''}
        <div class="ed-tools"><button class="btn ghost sm" id="edVQuick">${ic('history')} ${t('es_saveVersion')}</button><button class="btn ghost sm" id="edToBank">${ic('layers')} ${t('es_toBank')}</button><span class="spacer"></span><span class="saved tiny muted" id="edSaved">${ic('check')} ${t('es_savedAuto')}</span></div>
        <label class="sr-only" for="edText">${esc(e.title)}</label>
        <textarea id="edText" class="paper" spellcheck="true" dir="auto">${esc(e.text)}</textarea>
        <div class="meter" id="edMeter">${meterHtml(e)}</div>
      </section>
      <aside class="ed-side">
        <div class="seg full" id="edTabs">${['structure', 'readability', 'versions', 'bank'].map(k => `<button data-ep="${k}" class="${edPanel === k ? 'on' : ''}">${t(k === 'bank' ? 'es_bankShort' : 'es_' + k)}</button>`).join('')}</div>
        <div id="edPanel" class="mt"></div>
      </aside>
    </div>
    <div class="printonly essay-print" id="edPrint">${essayPrintHtml(e)}</div>`;
  drawEdPanel(id);
  bindEditor(view, id);
}

function drawEdPanel(id) {
  const e = essayById(id);
  const html = { structure: structurePanel, readability: readabilityPanel, versions: versionsPanel, bank: bankPanel }[edPanel](e);
  const box = $('#edPanel');
  box.innerHTML = html;
  box.classList.remove('enter');
  void box.offsetWidth;
  box.classList.add('enter');
  bindEdPanel(id);
}

function bindEdPanel(id) {
  const box = $('#edPanel');
  $$('[data-sc]', box).forEach(cb => (cb.onchange = () => {
    mutateIn('essays', id, x => {
      x.checks = x.checks || {};
      x.checks[cb.dataset.sc] = cb.checked;
    });
    drawEdPanel(id);
  }));
  if ($('#edSaveV')) $('#edSaveV').onclick = () => saveVersionPrompt(id);
  $$('[data-vdiff]', box).forEach(b => (b.onclick = () => openDiff(id, +b.dataset.vdiff)));
  $$('[data-vrest]', box).forEach(b => (b.onclick = () => restoreVersion(id, +b.dataset.vrest)));
  if ($('#edBankNew')) $('#edBankNew').onclick = () => openBankItem(null, '', () => drawEdPanel(id));
  bindBank(box, () => drawEdPanel(id), b => insertAtCursor(b.text));
}

function bindEditor(view, id) {
  const ta = $('#edText');
  const persist = debounce(() => {
    const e = mutateIn('essays', id, x => {
      x.text = ta.value;
      x.updated = Date.now();
    });
    // The editor may have been left before the debounce fired: only touch the DOM if it is still there.
    if (!$('#edSaved') || $('#edText') !== ta) return;
    $('#edSaved').innerHTML = `${ic('check')} ${t('es_savedAuto')}`;
    $('#edPrint').innerHTML = essayPrintHtml(e);
    if (edPanel !== 'bank' && edPanel !== 'versions') drawEdPanel(id);
  }, 500);
  let wasOver = essayLimitInfo(essayById(id)).over;
  ta.oninput = () => {
    $('#edSaved').textContent = t('es_saving');
    const e = { ...essayById(id), text: ta.value };
    $('#edMeter').innerHTML = meterHtml(e);
    const over = essayLimitInfo(e).over;
    if (over !== wasOver) announce(over ? t('es_over', { n: essayLimitInfo(e).used - e.limit }) : t('es_left', { n: e.limit - essayLimitInfo(e).used }));
    wasOver = over;
    persist();
  };
  $$('#edTabs button').forEach(b => (b.onclick = () => {
    edPanel = b.dataset.ep;
    $$('#edTabs button').forEach(x => x.classList.toggle('on', x === b));
    drawEdPanel(id);
  }));
  $('#edVQuick').onclick = () => saveVersionPrompt(id);
  $('#edToBank').onclick = () => {
    const sel = ta.value.slice(ta.selectionStart, ta.selectionEnd).trim();
    if (!sel) return toast(t('es_selectFirst'), 'bad');
    openBankItem(null, sel, () => edPanel === 'bank' && drawEdPanel(id));
  };
  $('#edSettings').onclick = () => openEssaySettings(id, view);
  $('#edDel').onclick = () => confirmBox(t('es_deleteQ'), () => {
    removeFrom('essays', id);
    toast(t('deleted'), 'ok');
    location.hash = '#essays';
  });
}

function insertAtCursor(text) {
  const ta = $('#edText');
  if (!ta) return;
  const start = ta.selectionStart;
  const before = ta.value.slice(0, start).replace(/\s*$/, '');
  const after = ta.value.slice(ta.selectionEnd).replace(/^\s*/, '');
  ta.value = [before, text, after].filter(Boolean).join('\n\n');
  ta.focus();
  ta.selectionStart = ta.selectionEnd = (before ? before.length + 2 : 0) + text.length;
  ta.dispatchEvent(new Event('input'));
}

function saveVersionPrompt(id) {
  const e = essayById(id);
  openModal(`<h3>${ic('history')} ${t('es_saveVersion')}</h3><label class="field">${t('es_versionLabel')}<input type="text" id="vLabel" value="${t('es_draftN', { n: e.versions.length + 1 })}"></label>
    <div class="row mt"><span class="spacer"></span><button class="btn" id="vSave">${ic('save')} ${t('save')}</button></div>`);
  $('#vSave').onclick = () => {
    const text = $('#edText') ? $('#edText').value : e.text;
    mutateIn('essays', id, x => {
      x.text = text;
      x.versions.push({ ts: Date.now(), label: $('#vLabel').value.trim() || t('es_draftN', { n: x.versions.length + 1 }), text });
    });
    logActivity('act_version', { e: e.title });
    toast(t('saved'), 'ok');
    closeModal(true);
    edPanel = 'versions';
    renderEssayEditor($('#view'), id);
  };
}

function openDiff(id, idx) {
  const e = essayById(id);
  const v = e.versions[idx];
  const parts = diffWords(v.text, $('#edText') ? $('#edText').value : e.text);
  const html = parts.map(p => (p.op === 'eq' ? esc(p.text) : `<${p.op === 'add' ? 'ins' : 'del'}>${esc(p.text)}</${p.op === 'add' ? 'ins' : 'del'}>`)).join('');
  openModal(`<h3>${ic('git-branch')} ${t('es_diffTitle', { v: esc(v.label) })}</h3><p class="tiny muted">${t('es_diffLegend')}</p><div class="diff">${html}</div>`, { wide: true });
}

function restoreVersion(id, idx) {
  confirmBox(t('es_restoreQ'), () => {
    const current = $('#edText') ? $('#edText').value : essayById(id).text;
    mutateIn('essays', id, x => {
      x.versions.push({ ts: Date.now(), label: t('es_beforeRestore'), text: current });
      x.text = x.versions[idx].text;
      x.updated = Date.now();
    });
    toast(t('es_restored'), 'ok');
    renderEssayEditor($('#view'), id);
  }, { yesLabel: t('es_restore') });
}

function openEssaySettings(id, view) {
  const e = essayById(id);
  const appOpts = apps().map(a => `<option value="${a.id}" ${a.id === e.app ? 'selected' : ''}>${esc(appName(a))}</option>`).join('');
  openModal(`<h3>${ic('sliders')} ${t('es_settings')}</h3>
    <label class="field">${t('title')}<input type="text" id="esTitle" value="${esc(e.title)}"></label>
    <label class="field mt">${t('es_app')}<select id="esApp"><option value="">${t('es_noApp')}</option>${appOpts}</select></label>
    <label class="field mt">${t('es_prompt')}<textarea id="esPrompt" rows="3">${esc(e.prompt || '')}</textarea></label>
    <div class="grid2 mt"><label class="field">${t('es_limitType')}<select id="esType"><option value="words" ${e.limitType === 'words' ? 'selected' : ''}>${t('es_words')}</option><option value="chars" ${e.limitType === 'chars' ? 'selected' : ''}>${t('es_chars')}</option></select></label>
    <label class="field">${t('es_limit')}<input type="number" id="esLimit" min="50" step="50" value="${e.limit}"></label></div>
    <div class="row mt"><span class="spacer"></span><button class="btn" id="esSave">${ic('save')} ${t('save')}</button></div>`);
  $('#esSave').onclick = () => {
    const text = $('#edText').value;
    mutateIn('essays', id, x => Object.assign(x, { title: $('#esTitle').value.trim() || x.title, app: $('#esApp').value, prompt: $('#esPrompt').value.trim(), limitType: $('#esType').value, limit: Math.max(50, +$('#esLimit').value || x.limit), text, updated: Date.now() }));
    logActivity('act_essay', { e: $('#esTitle').value.trim() || e.title });
    toast(t('saved'), 'ok');
    closeModal(true);
    renderEssayEditor(view, id);
  };
}

    ur: 'موضوع: شکریہ — {scholarship}\n\nمحترم {referee}،\n\nمیری {scholarship} کی درخواست کے لیے سفارشی خط لکھنے کا بہت بہت شکریہ۔ آپ نے جو وقت اور توجہ دی، میں اس کی دل سے قدر {karta} ہوں۔\n\nنتیجہ آتے ہی میں آپ کو آگاہ {karunga}۔\n\nاحسان مندی کے ساتھ،\n{me}',
  },
};

function urduForms() {
  const g = (profile() || {}).gender;
  const pick = (m, f) => (g === 'female' ? f : g === 'male' ? m : `${m}/${f}`);
  return { rha: pick('رہا', 'رہی'), hoon: pick('ہوں گا', 'ہوں گی'), sakta: pick('سکتا', 'سکتی'), janta: pick('جانتا', 'جانتی'), karta: pick('کرتا', 'کرتی'), karunga: pick('کروں گا', 'کروں گی') };
}

function fillTemplate(kind, tl, r, q) {
  const a = appById(q.app);
  const n = daysUntil(q.due);
  const name = a ? appSch(a).n[tl === 'ur' ? 1 : 0] : '';
  const vars = {
    ...urduForms(), referee: r.name, scholarship: name, relation: r.relation || (tl === 'ur' ? 'استاد' : 'my teacher'),
    due: q.due ? fmtDateIn(tl, q.due) : '—', when: n == null ? '' : tIn(tl, n < 0 ? 'daysAgo' : n === 0 ? 'today' : 'inDays', { n: Math.abs(n) }),
    me: (profile() || {}).name || (tl === 'ur' ? 'آپ کا شاگرد' : 'Your student'),
  };
  return REF_TEMPLATES[kind][tl].replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
}

function fmtDateIn(l, s) {
  const prev = lang;
  lang = l;
  try {
    return fmtDate(s, true);
  } finally {
    lang = prev;
  }
}

function refRequestRow(r, q, showReferee = false) {
  const a = appById(q.app);
  const n = daysUntil(q.due);
  const label = showReferee ? esc(r.name) : a ? `<a href="#app/${a.id}/refs">${esc(appName(a))}</a>` : '—';
  const open = ['asked', 'agreed'].includes(q.status);
  return `<div class="refreq" data-ref="${r.id}" data-req="${q.id}">
    <div class="grow"><div class="small"><b>${label}</b></div>
      <div class="tiny muted">${t('rf_due')} <span class="tnum">${q.due ? fmtDate(q.due) : '—'}</span> ${q.due && open ? `<span class="chip ${urgency(n)}">${relDays(n)}</span>` : ''} · ${q.lastReminded ? t('rf_lastRem', { when: relDays(daysUntil(q.lastReminded)) }) : t('rf_never')}</div></div>
    <select class="inline st-${q.status}" data-rqst aria-label="${t('status')}">${REF_STATUS.map(s => `<option value="${s}" ${q.status === s ? 'selected' : ''}>${t('rs_' + s)}</option>`).join('')}</select>
    <div class="row">${q.status === 'toask' ? `<button class="btn ghost sm" data-tpl="ask">${ic('mail')} ${t('rf_ask')}</button>` : ''}${open ? `<button class="btn ghost sm" data-tpl="remind">${ic('bell')} ${t('rf_remind')}</button>` : ''}${q.status === 'submitted' ? `<button class="btn ghost sm" data-tpl="thanks">${ic('heart')} ${t('rf_thank')}</button>` : ''}
      <button class="btn ghost sm icon" data-rqdel aria-label="${t('del')}">${ic('x')}</button></div>
  </div>`;
}

function bindRefRows(root, rerender) {
  $$('.refreq', root).forEach(row => {
    const rid = row.dataset.ref;
    const qid = row.dataset.req;
    const setReq = fn => mutateIn('referees', rid, r => fn(r.requests.find(q => q.id === qid), r));
    $('[data-rqst]', row).onchange = e => {
      setReq(q => (q.status = e.target.value));
      logActivity('act_ref', { r: (list('referees').find(x => x.id === rid) || {}).name + ' — ' + t('rs_' + e.target.value) });
      refreshChrome();
      rerender();
    };
    $$('[data-tpl]', row).forEach(b => (b.onclick = () => openRefTemplate(rid, qid, b.dataset.tpl, rerender)));
    $('[data-rqdel]', row).onclick = () => {
      mutateIn('referees', rid, r => (r.requests = r.requests.filter(q => q.id !== qid)));
      rerender();
    };
  });
}

function openRefTemplate(rid, qid, kind, after) {
  const r = list('referees').find(x => x.id === rid);
  const q = r.requests.find(x => x.id === qid);
  let tl = lang;
  const html = () => `<h3>${ic('mail')} ${t('rf_template')} — ${t(kind === 'ask' ? 'rf_ask' : kind === 'remind' ? 'rf_remind' : 'rf_thank')}</h3>
    <div class="between"><span class="small muted">${esc(r.name)} · ${esc(r.email || '')}</span><div class="seg" id="tplLang"><button data-tl="en" class="${tl === 'en' ? 'on' : ''}">English</button><button data-tl="ur" class="${tl === 'ur' ? 'on' : ''}">اردو</button></div></div>
    <textarea id="tplText" rows="14" class="mt ${tl === 'ur' ? 'ur-text' : ''}" dir="${tl === 'ur' ? 'rtl' : 'ltr'}" aria-label="${t('rf_template')}">${esc(fillTemplate(kind, tl, r, q))}</textarea>
    <div class="row mt"><button class="btn ghost" id="tplCopy">${ic('copy')} ${t('copy')}</button><a class="btn ghost" id="tplMail" href="#">${ic('send')} ${t('rf_email_open')}</a><span class="spacer"></span>
      ${kind !== 'thanks' ? `<button class="btn" id="tplLog">${ic('check')} ${kind === 'ask' ? t('rf_markAsked') : t('rf_markRem')}</button>` : ''}</div>`;
  const draw = () => {
    const m = $('#overlay .modal');
    m.innerHTML = `<button class="btn ghost sm icon mclose" aria-label="${t('close')}">${ic('x')}</button>` + html();
    $('.mclose', m).onclick = () => closeModal();
    bindTemplate();
  };
  const bindTemplate = () => {
    $$('#tplLang button').forEach(b => (b.onclick = () => {
      tl = b.dataset.tl;
      draw();
    }));
    $('#tplCopy').onclick = () => copyText($('#tplText').value);
    $('#tplMail').onclick = e => {
      e.preventDefault();
      const text = $('#tplText').value;
      const subject = (text.match(/^(Subject|موضوع):\s*(.+)$/m) || [])[2] || '';
      const body = text.replace(/^(Subject|موضوع):.*\n+/, '');
      location.href = `mailto:${encodeURIComponent(r.email || '')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    };
    if ($('#tplLog')) $('#tplLog').onclick = () => {
      mutateIn('referees', rid, x => {
        const req = x.requests.find(y => y.id === qid);
        if (kind === 'ask' && req.status === 'toask') req.status = 'asked';
        if (kind === 'remind') {
          req.lastReminded = iso(TODAY);
          req.reminders = (req.reminders || 0) + 1;
        }
      });
      logActivity(kind === 'remind' ? 'act_remind' : 'act_ref', { r: r.name });
      toast(t('rf_marked'), 'ok');
      closeModal(true);
      after();
    };
  };
  openModal(html(), { wide: true });
  bindTemplate();
}

function refKpis() {
  const reqs = referees().flatMap(r => r.requests).filter(q => q.status !== 'declined');
  const pending = reqs.filter(q => ['asked', 'agreed'].includes(q.status));
  const late = pending.filter(q => daysUntil(q.due) != null && daysUntil(q.due) <= 7).length;
  const kpi = (k, icon, v) => `<div class="kpi"><div class="k">${ic(icon)} ${t(k)}</div><div class="v" data-count="${v}">0</div></div>`;
  return `<div class="kpis stagger">${kpi('rf_needed', 'quote', reqs.length)}${kpi('rf_in', 'check-circle', reqs.filter(q => q.status === 'submitted').length)}${kpi('rf_pending', 'clock', pending.length)}${kpi('rf_late', 'alert', late)}</div>`;
}

function refereeCard(r) {
  return `<article class="card refcard"><div class="between"><div><h3>${ic('user-check')} ${esc(r.name)}</h3><div class="small muted">${esc(r.role)} · ${esc(r.org)}</div></div>
      <div class="row"><button class="btn ghost sm icon" data-redit="${r.id}" aria-label="${t('edit')}">${ic('edit')}</button><button class="btn ghost sm icon" data-rdel="${r.id}" aria-label="${t('del')}">${ic('trash')}</button></div></div>
    <div class="tiny muted mt-s">${ic('mail')} ${r.email ? `<a href="mailto:${esc(r.email)}">${esc(r.email)}</a>` : '—'} · ${esc(r.relation || '')}</div>
    <div class="reqs">${r.requests.map(q => refRequestRow(r, q)).join('')}</div>
    <button class="btn ghost sm" data-rreq="${r.id}">${ic('plus')} ${t('rf_request')}</button></article>`;
}

function renderReferees(view) {
  const rows = referees();
  view.innerHTML = `<header class="pagehead"><div><div class="kicker">${ic('quote')} ${t('rf_kicker')}</div><h1>${t('rf_title')}</h1><p class="dek">${t('rf_dek')}</p></div>
      <div class="actions"><button class="btn" id="rfAdd">${ic('plus')} ${t('rf_add')}</button></div></header>
    ${refKpis()}
    <div class="ref-layout mt2"><div class="refgrid stagger">${rows.length ? rows.map(refereeCard).join('') : `<div class="empty card">${ic('quote')}${t('rf_none')}</div>`}</div>
      <aside class="panel"><h3>${ic('lightbulb')} ${t('rf_tips')}</h3><ol class="tips">${['rf_tip1', 'rf_tip2', 'rf_tip3', 'rf_tip4'].map(k => `<li>${t(k)}</li>`).join('')}</ol><a class="small" href="#guide/refs">${ic('book')} ${tr(GUIDE_BY_ID.refs.title)}</a></aside></div>`;
  const rerender = () => {
    renderReferees(view);
    animateMetrics(view);
  };
  $('#rfAdd').onclick = () => openReferee(null, rerender);
  $$('[data-redit]', view).forEach(b => (b.onclick = () => openReferee(b.dataset.redit, rerender)));
  $$('[data-rdel]', view).forEach(b => (b.onclick = () => confirmBox(t('rf_deleteQ'), () => {
    removeFrom('referees', b.dataset.rdel);
    rerender();
  })));
  $$('[data-rreq]', view).forEach(b => (b.onclick = () => openLetterRequest(b.dataset.rreq, null, rerender)));
  bindRefRows(view, rerender);
  animateMetrics(view);
}

function openReferee(id, after) {
  const r = id ? list('referees').find(x => x.id === id) : { name: '', role: '', org: '', email: '', phone: '', relation: '', notes: '' };
  const f = (key, label, type = 'text') => `<label class="field">${label}<input type="${type}" id="rf_${key}" value="${esc(r[key] || '')}"></label>`;
  openModal(`<h3>${ic('user-check')} ${id ? t('rf_edit') : t('rf_add')}</h3>
    <div class="grid2">${f('name', t('name'))}${f('role', t('rf_role'))}${f('org', t('rf_org'))}${f('email', t('rf_email'), 'email')}${f('phone', t('rf_phone'))}${f('relation', t('rf_relation'))}</div>
    <div class="row mt"><span class="spacer"></span><button class="btn" id="rfSave">${ic('save')} ${t('save')}</button></div>`);
  $('#rfSave').onclick = () => {
    const rec = Object.fromEntries(['name', 'role', 'org', 'email', 'phone', 'relation'].map(k => [k, $('#rf_' + k).value.trim()]));
    if (!rec.name) return toast(t('cu_required'), 'bad');
    if (id) mutateIn('referees', id, x => Object.assign(x, rec));
    else saveList('referees', [...list('referees'), { id: 'r-' + uid(), ...rec, notes: '', requests: [] }]);
    logActivity('act_ref', { r: rec.name });
    toast(t('saved'), 'ok');
    closeModal(true);
    after();
  };
}

function openLetterRequest(refId, appId, after) {
  const refs = referees();
  if (!refs.length) {
    toast(t('rf_noRefs'), 'bad');
    return;
  }
  const appRows = apps().filter(a => a.stage !== 'result');
  openModal(`<h3>${ic('quote')} ${t('rf_request')}</h3>
    <label class="field">${t('rf_referee')}<select id="lrRef">${refs.map(r => `<option value="${r.id}" ${r.id === refId ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}</select></label>
    <label class="field mt">${t('es_app')}<select id="lrApp">${appRows.map(a => `<option value="${a.id}" ${a.id === appId ? 'selected' : ''}>${esc(appName(a))}</option>`).join('')}</select></label>
    <label class="field mt">${t('rf_due')}<input type="date" id="lrDue"></label>
    <div class="row mt"><span class="spacer"></span><button class="btn" id="lrSave">${ic('save')} ${t('save')}</button></div>`);
  const syncDue = () => {
    const a = appById($('#lrApp').value);
    const dl = a ? parseISO(appDeadline(a)) : null;
    $('#lrDue').value = dl ? iso(addDays(dl, -7)) : isoIn(21);
  };
  syncDue();
  $('#lrApp').onchange = syncDue;
  $('#lrSave').onclick = () => {
    if (!$('#lrApp').value) return;
    mutateIn('referees', $('#lrRef').value, r => r.requests.push({ id: uid(), app: $('#lrApp').value, status: 'toask', due: $('#lrDue').value, lastReminded: '', reminders: 0 }));
    toast(t('saved'), 'ok');
    closeModal(true);
    after();
  };
}

const EVENT_KINDS = ['deadline', 'estimate', 'interview', 'expiry', 'referee', 'custom', 'test'];
const KIND_ICON = { deadline: 'flag', estimate: 'clock', interview: 'mic', expiry: 'timer', referee: 'quote', custom: 'calendar', test: 'target' };
let calMonth = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
let calDay = iso(TODAY);
let calKinds = store.get('calKinds', EVENT_KINDS);

function calendarEvents() {
  const out = [];
  apps().filter(a => a.stage !== 'result').forEach(a => {
    const dl = appDeadline(a);
    if (dl) out.push({ id: 'dl-' + a.id, date: dl, kind: 'deadline', title: t('ev_deadline', { s: appName(a) }), link: '#app/' + a.id, alarm: 7 });
    if (a.interview) out.push({ id: 'iv-' + a.id, date: a.interview, kind: 'interview', title: t('ev_interview', { s: appName(a) }), link: '#app/' + a.id, alarm: 2 });
  });
  const inPipe = new Set(apps().map(a => a.sch));
  shortlist().filter(id => !inPipe.has(id) && schById(id)).forEach(id => {
    const s = schById(id);
    const dl = typicalDeadline(s);
    if (dl) out.push({ id: 'es-' + id, date: dl, kind: 'estimate', title: t('ev_estimate', { s: tr(s.n) }), link: '#database', note: t('verify') });
  });
  vault().filter(d => d.expiry).forEach(d => out.push({ id: 'ex-' + d.id, date: d.expiry, kind: 'expiry', title: t('ev_expiry', { s: d.title }), link: '#documents/vault', alarm: 30 }));
  referees().forEach(r => r.requests.filter(q => q.due && !['submitted', 'declined'].includes(q.status)).forEach(q => {
    const a = appById(q.app);
    if (a) out.push({ id: 'rf-' + q.id, date: q.due, kind: 'referee', title: t('ev_referee', { r: r.name, s: appName(a) }), link: '#referees', alarm: 3 });
  }));
  events().forEach(e => out.push({ id: e.id, date: e.date, kind: e.kind || 'custom', title: e.title, note: e.note, custom: true, link: '#calendar', alarm: 1 }));
  return out.filter(e => calKinds.includes(e.kind)).sort((a, b) => a.date.localeCompare(b.date));
}

function eventPill(e) {
  return `<a class="pill k-${e.kind}" href="${e.link}" title="${esc(e.title)}">${ic(KIND_ICON[e.kind])}<span>${esc(e.title)}</span></a>`;
}

function monthGrid(evs) {
  const y = calMonth.getFullYear();
  const m = calMonth.getMonth();
  const pad = (new Date(y, m, 1).getDay() + 6) % 7;
  const days = lastDayOfMonth(y, m + 1);
  const byDay = {};
  evs.forEach(e => (byDay[e.date] = byDay[e.date] || []).push(e));
  const cells = [];
  for (let i = 0; i < pad; i++) cells.push('<div class="cell empty" aria-hidden="true"></div>');
  for (let d = 1; d <= days; d++) {
    const key = iso(new Date(y, m, d));
    const list3 = byDay[key] || [];
    const cls = [key === iso(TODAY) ? 'today' : '', key === calDay ? 'sel' : '', list3.length ? 'has' : ''].join(' ');
    cells.push(`<div class="cell ${cls}" role="gridcell"><button class="dn" data-day="${key}" aria-label="${fmtDate(key, true)}${list3.length ? ' · ' + list3.length : ''}">${d}</button>
      <div class="pills">${list3.slice(0, 2).map(eventPill).join('')}${list3.length > 2 ? `<button class="more tiny" data-day="${key}">${t('ca_more', { n: list3.length - 2 })}</button>` : ''}</div>
      <div class="dots">${list3.slice(0, 4).map(e => `<i class="k-${e.kind}"></i>`).join('')}</div></div>`);
  }
  return `<div class="cal" role="grid"><div class="cal-head">${WEEKDAYS[lang].map(w => `<div>${w}</div>`).join('')}</div><div class="cal-body">${cells.join('')}</div></div>`;
}

function agendaHtml(evs) {
  const sel = evs.filter(e => e.date === calDay);
  const soon = evs.filter(e => daysUntil(e.date) >= 0 && daysUntil(e.date) <= 60);
  const groups = {};
  soon.forEach(e => (groups[e.date] = groups[e.date] || []).push(e));
  const row = e => `<li class="agrow k-${e.kind}"><span class="agic">${ic(KIND_ICON[e.kind])}</span><div class="grow"><a href="${e.link}">${esc(e.title)}</a><div class="tiny muted">${t('k_' + e.kind)}${e.note ? ' · ' + esc(e.note) : ''}</div></div>
    <button class="btn ghost sm icon" data-ics1="${e.id}" aria-label="${t('ca_icsOne')}">${ic('download')}</button>${e.custom ? `<button class="btn ghost sm icon" data-evdel="${e.id}" aria-label="${t('del')}">${ic('trash')}</button>` : ''}</li>`;
  return `<div class="panel"><h3>${ic('calendar')} ${t('ca_dayTitle', { d: fmtDate(calDay, true) })}</h3>${sel.length ? `<ul class="agenda">${sel.map(row).join('')}</ul>` : `<p class="small muted">${t('ca_noEvents')}</p>`}</div>
    <div class="panel mt2"><h3>${ic('list')} ${t('ca_agenda')}</h3>${Object.keys(groups).length ? Object.entries(groups).map(([d, items]) => `<div class="agday"><div class="agdate"><b class="tnum">${fmtDate(d)}</b> <span class="tiny muted">${relDays(daysUntil(d))}</span></div><ul class="agenda">${items.map(row).join('')}</ul></div>`).join('') : `<p class="small muted">${t('ca_noEvents')}</p>`}</div>`;
}

// Gantt-style strip of typical windows for the next 12 months.
function windowPlanner() {
  const ids = [...new Set([...apps().filter(a => a.stage !== 'result').map(a => a.sch), ...shortlist()])].filter(id => schById(id) && schById(id).w);
  if (!ids.length) return `<p class="small muted">${t('ca_plannerEmpty')}</p>`;
  const start = TODAY.getMonth();
  const months = Array.from({ length: 12 }, (_, i) => (start + i) % 12);
  const head = months.map(m => `<div class="wm tnum">${monthShort(m)}</div>`).join('');

// ---------- iCalendar (RFC 5545) ----------
const icsEscape = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
const icsDate = s => s.replace(/-/g, '');

// Fold lines longer than 75 octets (UTF-8 aware) with CRLF + space.
function foldLine(line) {
  const enc = new TextEncoder();
  const out = [];
  let cur = '';
  for (const ch of line) {
    if (enc.encode(cur + ch).length > (out.length ? 74 : 75)) {
      out.push(cur);
      cur = ch;
    } else cur += ch;
  }
  out.push(cur);
  return out.join('\r\n ');
}

function buildIcs(evs) {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//ScholarTrack//FYP Template//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:ScholarTrack'];
  evs.forEach(e => {
    const next = iso(addDays(parseISO(e.date), 1));
    lines.push('BEGIN:VEVENT', `UID:${e.id}-${icsDate(e.date)}@scholartrack.local`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${icsDate(e.date)}`, `DTEND;VALUE=DATE:${icsDate(next)}`);
    lines.push(`SUMMARY:${icsEscape(e.title)}`, `DESCRIPTION:${icsEscape([t('k_' + e.kind), e.note, t('verify')].filter(Boolean).join(' — '))}`, `CATEGORIES:${e.kind.toUpperCase()}`, 'TRANSP:TRANSPARENT');
    if (e.alarm) lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEscape(e.title)}`, `TRIGGER:-P${e.alarm}D`, 'END:VALARM');
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.map(foldLine).join('\r\n') + '\r\n';
}

function exportIcs(evs, name = 'scholartrack-deadlines.ics') {
  downloadText(name, buildIcs(evs), 'text/calendar');
  logActivity('act_ics', { n: evs.length });
  toast(t('ca_exported', { n: evs.length }), 'ok');
}

function stageReached(a) {
  const idx = STAGES.indexOf(a.stage);
  const hist = a.timeline.map(x => STAGES.indexOf(x.stage));
  return Math.max(idx, ...hist);
}

function funnelChart(rows) {
  const counts = STAGES.map((_, i) => rows.filter(a => stageReached(a) >= i).length);
  const max = Math.max(1, counts[0]);
  return `<div class="funnel">${STAGES.map((st, i) => `<div class="frow"><span class="flabel">${ic(STAGE_ICON[st])} ${t('st_' + st)}</span><div class="bar navy fbar"><i data-w="${pct(counts[i], max)}"></i></div><b class="tnum">${counts[i]}</b></div>`).join('')}</div>`;
}

function donut(parts) {
  const total = sum(parts.map(p => p.v));
  const r = 42;
  const c = 2 * Math.PI * r;
  let offset = 0;
  const arcs = parts.filter(p => p.v).map(p => {
    const len = (p.v / total) * c;
    const arc = `<circle cx="60" cy="60" r="${r}" class="seg-${p.cls}" stroke-dasharray="${len.toFixed(2)} ${(c - len).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 60 60)"/>`;
    offset += len;
    return arc;
  }).join('');
  const legend = parts.map(p => `<li><i class="sw seg-${p.cls}"></i>${p.label} <b class="tnum">${p.v}</b></li>`).join('');
  return `<div class="donutwrap"><svg class="donut chart" viewBox="0 0 120 120" role="img" aria-label="${parts.map(p => `${p.label} ${p.v}`).join(', ')}"><circle cx="60" cy="60" r="${r}" class="track"/>${arcs}<text x="60" y="66" text-anchor="middle">${total}</text></svg><ul class="legend">${legend}</ul></div>`;
}

function hbars(rows) {
  const max = Math.max(1, ...rows.map(r => r.v));
  return `<div class="hbars">${rows.map(r => `<div class="hrow"><span class="hlabel">${esc(r.label)}</span><div class="bar ${r.cls || ''}"><i data-w="${pct(r.v, max)}"></i></div><b class="tnum">${r.text ?? r.v}</b></div>`).join('')}</div>`;
}

// Monthly line chart for the last 12 months (submissions from timelines).
function lineChart(rows) {
  const months = Array.from({ length: 12 }, (_, i) => {
    const d = new Date(TODAY.getFullYear(), TODAY.getMonth() - 11 + i, 1);
    return { key: iso(d).slice(0, 7), m: d.getMonth() };
  });
  const counts = months.map(mo => sum(rows.map(a => a.timeline.filter(x => x.stage === 'submitted' && iso(new Date(x.ts)).slice(0, 7) === mo.key).length)));
  const W = 560;
  const H = 180;
  const P = 28;
  const max = Math.max(2, ...counts);
  const x = i => P + (i * (W - 2 * P)) / 11;
  const y = v => H - P - (v / max) * (H - 2 * P);
  const d = counts.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const grid = [0, Math.ceil(max / 2), max].map(v => `<line x1="${P}" x2="${W - P}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${P - 6}" y="${y(v) + 4}" text-anchor="end" class="axis">${v}</text>`).join('');
  const labels = months.map((mo, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" class="axis">${monthShort(mo.m)}</text>`).join('');
  const dots = counts.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3.5" class="dot"><title>${monthShort(months[i].m)}: ${v}</title></circle>`).join('');
  return `<svg class="line chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('sx_timeline')}">${grid}<path d="${d} L${x(11)} ${H - P} L${x(0)} ${H - P} Z" class="area"/><path d="${d}" class="draw stroke"/>${dots}${labels}</svg>`;
}

const RATES = { PKR: 1, GBP: 375, EUR: 325, USD: 280, SEK: 29, HUF: 0.8, JPY: 1.9, KRW: 0.2, CNY: 39, TRY: 7, AUD: 185 };
const COUNTRY_CITY = { PK: 'lahore', US: 'boston', UK: 'london', DE: 'berlin', EU: 'berlin', HU: 'budapest', SE: 'stockholm', NL: 'amsterdam', FR: 'paris', IE: 'dublin', TR: 'istanbul', JP: 'tokyo', CN: 'beijing', KR: 'seoul', SA: 'boston', AU: 'sydney', MULTI: 'london' };
// Typical monthly stipend by country in local currency (illustrative).
const STIPEND_TYPICAL = { PK: 6000, US: 2200, UK: 1400, DE: 934, EU: 1100, HU: 43700, SE: 12000, NL: 0, FR: 1200, IE: 1000, TR: 6500, JP: 145000, CN: 3000, KR: 1000000, SA: 2000, AU: 2800, MULTI: 1200 };

function fundingPreset(schId, cityKey) {
  const s = schId ? schById(schId) : null;
  const city = cityKey || (s ? COUNTRY_CITY[s.c] : 'london');
  const cov = s ? s.cov || '' : '';
  const local = CITIES[city];
  // Typical stipends are stored in the award country's currency; convert them to the chosen city's currency.
  const homeCur = s ? CITIES[COUNTRY_CITY[s.c]].cur : local.cur;
  return {
    sch: schId || '', city, months: s ? Math.max(6, Math.round((s.d || 1) * 12)) : 12,
    tuitionCover: /T/.test(cov) ? 100 : /t/.test(cov) ? 50 : 0,
    stipend: /S/.test(cov) && s ? Math.round((STIPEND_TYPICAL[s.c] * RATES[homeCur]) / RATES[local.cur]) : 0,
    settle: /B/.test(cov) ? Math.round(local.setup * 0.5) : 0,
    airfare: /A/.test(cov), health: /H/.test(cov), partTime: 0, savings: 300000,
    costs: { ...local }, rate: RATES[local.cur],
  };
}

let fund = store.get('funding', null) || fundingPreset('chevening');

function computeFunding(f) {
  const c = f.costs;
  const monthlyCost = c.rent + c.food + c.transport + (f.health ? 0 : c.health) + c.misc;
  const monthlyIncome = f.stipend + f.partTime;
  const monthlyNet = monthlyIncome - monthlyCost;
  const uncoveredTuition = Math.round(c.tuition * (1 - f.tuitionCover / 100) * (f.months / 12));
  const oneOff = Math.max(0, c.setup + (f.airfare ? 0 : c.flight * 2) - f.settle);
  const totalLocal = monthlyNet * f.months - uncoveredTuition - oneOff;
  const totalPkr = Math.round(totalLocal * f.rate + f.savings);
  return { monthlyCost, monthlyIncome, monthlyNet, uncoveredTuition, oneOff, totalLocal, totalPkr };
}

function stackBar(parts, max) {
  return `<div class="stackbar">${parts.filter(p => p.v > 0).map(p => `<i class="${p.cls}" style="width:${((p.v / max) * 100).toFixed(1)}%" title="${esc(p.label)}: ${fmtNum(p.v)}"></i>`).join('')}</div>`;
}

function renderFunding(view) {
  view.innerHTML = `<header class="pagehead"><div><div class="kicker">${ic('wallet')} ${t('fu_kicker')}</div><h1>${t('fu_title')}</h1><p class="dek">${t('fu_dek')}</p></div></header>

  bindFunding(view);
}

function bindFunding(view) {
  const save = () => {
    store.set('funding', fund);
    $('#fuResult').innerHTML = fundingResult(fund);
  };
  $$('[data-f]', view).forEach(inp => (inp.oninput = () => {
    const v = Math.max(0, +inp.value || 0);
    const key = inp.dataset.f;
    if (key.startsWith('c.')) fund.costs[key.slice(2)] = v;
    else fund[key] = key === 'tuitionCover' ? clamp(v, 0, 100) : v;
    save();
  }));
  $$('[data-fb]', view).forEach(cb => (cb.onchange = () => {
    fund[cb.dataset.fb] = cb.checked;
    save();
  }));
  const reload = next => {
    fund = next;
    store.set('funding', fund);
    renderFunding(view);
    animateIn(view);
  };
  $('#fuSch').onchange = e => reload(fundingPreset(e.target.value, e.target.value ? null : fund.city));
  $('#fuCity').onchange = e => reload({ ...fundingPreset(fund.sch, e.target.value), savings: fund.savings, partTime: fund.partTime });
  $('#fuReset').onclick = () => reload(fundingPreset(fund.sch, fund.city));
}

  const ready = docs.filter(d => ['ready', 'submitted'].includes(d.status)).length;
  const awards = rows.filter(a => a.stage === 'result' && a.outcome === 'awarded').length;
  const kpi = (k, icon, v, s = '', fmt = '') => `<div class="kpi"><div class="k">${ic(icon)} ${t(k)}</div><div class="v" data-count="${v}" ${fmt ? `data-fmt="${fmt}"` : ''}>0</div><div class="s">${s}</div></div>`;
  return `<div class="kpis col stagger">${kpi('hm_active', 'columns', active.length)}${kpi('hm_due30', 'clock', due30)}${kpi('hm_docs', 'paperclip', pct(ready, docs.length), `${ready}/${docs.length}`, 'pct')}${kpi('hm_awards', 'award', awards)}</div>`;
}

function fortnight() {
  const evs = calendarEvents().filter(e => daysUntil(e.date) >= 0 && daysUntil(e.date) <= 14).slice(0, 7);
  if (!evs.length) return `<p class="small muted">${t('ca_noEvents')}</p>`;
  return `<ul class="agenda compact">${evs.map(e => `<li class="agrow k-${e.kind}"><span class="agdate2"><b class="tnum">${parseISO(e.date).getDate()}</b><span class="tiny">${monthShort(parseISO(e.date).getMonth())}</span></span><div><a href="${e.link}">${esc(e.title)}</a><div class="tiny muted">${relDays(daysUntil(e.date))}</div></div></li>`).join('')}</ul>`;
}

function topMatches() {
  if (!profile()) return `<p class="small muted">${t('noProfile')}</p><a class="btn ghost sm" href="#quiz">${ic('target')} ${t('takeQuiz')}</a>`;
  const inPipe = new Set(apps().map(a => a.sch));
  const top = matchAll().filter(m => m.eligible && !inPipe.has(m.id)).slice(0, 5);
  return `<ol class="matches">${top.map(m => `<li><button class="rowlink" data-open="${m.id}">${esc(tr(schById(m.id).n))}</button><span class="tnum chip ${m.score >= 75 ? 'green' : 'navy'}">${m.score}%</span></li>`).join('')}</ol><a class="small" href="#quiz">${t('hm_viewAll')} ${ic('arrow-right')}</a>`;
}

function glance() {
  const rows = apps();
  const max = Math.max(1, ...STAGES.map(s => rows.filter(a => a.stage === s).length));
  return `<div class="glance">${STAGES.map(s => {
    const n = rows.filter(a => a.stage === s).length;
    return `<a class="gcol" href="#pipeline"><span class="gv tnum">${n}</span><span class="gbar"><i style="height:${Math.max(6, pct(n, max))}%"></i></span><span class="tiny">${t('st_' + s)}</span></a>`;
  }).join('')}</div>`;
}

function openingSoon() {
  const m = TODAY.getMonth() + 1;

function ago(ts) {
  const h = Math.floor((Date.now() - ts) / 36e5);
  if (h < 1) return t('ib_justNow');
  if (h < 24) return t('ib_hours', { n: h });
  return relDays(-Math.floor((Date.now() - ts) / DAY));
}

  $$('[data-ndel]', view).forEach(b => (b.onclick = () => setBox(all => all.filter(n => n.id !== b.dataset.ndel))));

    store.set('inbox', store.get('inbox', []).map(n => (n.id === a.dataset.read ? { ...n, read: true } : n)));
    refreshChrome();
  }));
}

function searchIndex() {
  const pages = NAV.concat(['compare', 'inbox', 'report', 'about']).map(p => ({ g: 'ps_pages', icon: PAGE_ICON[p], label: t('nav_' + p), hay: [STR['nav_' + p][0], STR['nav_' + p][1]].join(' '), href: '#' + p }));

  const ap = apps().map(a => ({ g: 'ps_apps', icon: 'columns', label: appName(a), sub: t('st_' + a.stage), hay: appSch(a).n.join(' ') + ' ' + a.sch, href: '#app/' + a.id }));
  const es = essays().map(e => ({ g: 'ps_essays', icon: 'feather', label: e.title, sub: `${countWords(e.text)} ${t('es_wordsLc')}`, hay: e.title + ' ' + (e.text || '').slice(0, 400), href: '#essay/' + e.id }));
  const gu = GUIDES.map(g => ({ g: 'ps_guides', icon: g.icon, label: tr(g.title), hay: g.title.join(' ') + ' ' + g.dek.join(' '), href: '#guide/' + g.id }));
  const rf = referees().map(r => ({ g: 'ps_people', icon: 'user-check', label: r.name, sub: r.org, hay: [r.name, r.org, r.role, r.email].join(' '), href: '#referees' }));
  const dv = vault().map(d => ({ g: 'ps_docs', icon: DOC_TYPES[d.type].icon, label: d.title, sub: tr(DOC_TYPES[d.type].n), hay: d.title + ' ' + DOC_TYPES[d.type].n.join(' '), href: '#documents/vault' }));
  return [...pages, ...ap, ...sch, ...es, ...gu, ...rf, ...dv];
}

function searchResults(q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const idx = searchIndex();
  if (!words.length) return idx.filter(x => x.g === 'ps_pages' || x.g === 'ps_apps').slice(0, 14);
  const scored = idx.map(x => {
    const hay = (x.label + ' ' + x.hay).toLowerCase();
    if (!words.every(w => hay.includes(w))) return null;
    return { ...x, score: (x.label.toLowerCase().startsWith(words[0]) ? 3 : 0) + (x.label.toLowerCase().includes(words[0]) ? 2 : 0) };
  }).filter(Boolean);
  return scored.sort((a, b) => b.score - a.score).slice(0, 24);
}

let psSel = 0;

function openPalette() {
  openModal(`<div class="palette"><label class="inputicon big">${ic('search')}<span class="sr-only">${t('search')}</span><input type="search" id="psQ" placeholder="${t('ps_placeholder')}" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="psList"></label>
    <ul id="psList" class="pslist" role="listbox"></ul><p class="tiny muted">${t('ps_hint')}</p></div>`, { wide: true });
  const draw = () => {
    const rows = searchResults($('#psQ').value);
    psSel = clamp(psSel, 0, Math.max(0, rows.length - 1));
    let lastGroup = '';
    $('#psList').innerHTML = rows.length ? rows.map((r, i) => {
      const head = r.g !== lastGroup ? `<li class="psgroup" role="presentation">${t(r.g)}</li>` : '';
      lastGroup = r.g;
      return `${head}<li role="option" id="ps-${i}" class="psitem ${i === psSel ? 'on' : ''}" aria-selected="${i === psSel}" data-i="${i}">${ic(r.icon || 'file')}<span class="grow">${esc(r.label)}</span>${r.sub ? `<span class="tiny muted">${esc(r.sub)}</span>` : ''}</li>`;
    }).join('') : `<li class="muted small">${t('ps_none')}</li>`;
    $('#psQ').setAttribute('aria-activedescendant', rows.length ? 'ps-' + psSel : '');
    $$('.psitem').forEach(li => (li.onclick = () => choose(rows[+li.dataset.i])));
    const on = $('.psitem.on');
    if (on) on.scrollIntoView({ block: 'nearest' });
    return rows;
  };
  const choose = r => {
    if (!r) return;
    closeModal(true);
    if (r.open) openScholarship(r.open);
    else location.hash = r.href;
  };
  let rows = draw();
  $('#psQ').oninput = () => {
    psSel = 0;
    rows = draw();
  };
  $('#psQ').onkeydown = e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      psSel += e.key === 'ArrowDown' ? 1 : -1;
      rows = draw();
    }
    if (e.key === 'Enter') choose(rows[psSel]);
  };
}

const BACKUP_KEYS = ['settings', 'profile', 'apps', 'vault', 'essays', 'bank', 'referees', 'events', 'inbox', 'activity', 'shortlist', 'compare', 'schEdits', 'customSch', 'funding', 'dbView', 'calKinds', 'guideChecks', 'guideBoth', 'seeded', 'lang'];

function storageBytes() {
  let n = 0;
  store.keys().forEach(k => (n += (localStorage.getItem(NS + k) || '').length * 2));
  return n;
}

function exportData() {
  const data = Object.fromEntries(BACKUP_KEYS.map(k => [k, store.get(k, null)]).filter(([, v]) => v !== null));
  downloadText(`scholartrack-backup-${iso(TODAY)}.json`, JSON.stringify({ app: 'ScholarTrack', version: SEED_VERSION, exported: new Date().toISOString(), data }, null, 2));
}

function importData(text) {
  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch {
    parsed = null;
  }
  if (!parsed || parsed.app !== 'ScholarTrack' || typeof parsed.data !== 'object') {
    toast(t('se_badFile'), 'bad');
    return false;
  }
  Object.entries(parsed.data).filter(([k]) => BACKUP_KEYS.includes(k)).forEach(([k, v]) => store.set(k, v));
  logActivity('act_import');
  toast(t('se_imported'), 'ok');
  lang = store.get('lang', 'en') === 'ur' ? 'ur' : 'en';
  applySettings();
  applyLang();
  return true;
}

function settingRow(label, control, hint = '') {
  return `<div class="setrow"><div><div class="sl">${label}</div>${hint ? `<div class="tiny muted">${hint}</div>` : ''}</div><div>${control}</div></div>`;
}

function renderSettings(view) {
  const s = settings();
  const seg = (key, opts, cur) => `<div class="seg">${opts.map(([v, l]) => `<button data-set="${key}" data-v="${v}" class="${String(cur) === String(v) ? 'on' : ''}" aria-pressed="${String(cur) === String(v)}">${l}</button>`).join('')}</div>`;
  const sw = (key, on, label) => `<label class="switch"><input type="checkbox" data-sw="${key}" ${on ? 'checked' : ''} aria-label="${label}"><span></span></label>`;
  view.innerHTML = `<header class="pagehead"><div><div class="kicker">${ic('settings')} ${t('se_kicker')}</div><h1>${t('se_title')}</h1><p class="dek">${t('se_dek')}</p></div></header>
    <div class="settings">
      <section class="panel"><h3>${ic('palette')} ${t('se_appearance')}</h3>
        ${settingRow(t('se_lang'), `<div class="seg"><button data-lang="en" class="${lang === 'en' ? 'on' : ''}">English</button><button data-lang="ur" class="${lang === 'ur' ? 'on' : ''}">اردو</button></div>`)}
        ${settingRow(t('se_theme'), seg('theme', [['light', t('se_day')], ['dark', t('se_night')]], s.theme))}
        ${settingRow(t('se_size'), seg('size', [['sm', t('se_small')], ['md', t('se_medium')], ['lg', t('se_large')]], s.size))}
        ${settingRow(t('se_rm'), sw('rm', s.rm, t('se_rm')), t('se_rmHint'))}</section>
      <section class="panel"><h3>${ic('bell')} ${t('se_reminders')}</h3>
        ${settingRow(t('se_remindDays'), `<input type="number" class="inline num" id="seRemind" min="3" max="60" value="${s.remindDays}" aria-label="${t('se_remindDays')}">`)}
        ${settingRow(t('dc_leadDays'), `<input type="number" class="inline num" id="seExpiry" min="7" max="180" value="${s.expiryDays}" aria-label="${t('dc_leadDays')}">`)}</section>
      <section class="panel"><h3>${ic('folder')} ${t('se_data')}</h3>
        ${settingRow(t('se_demo'), sw('demo', s.demo, t('se_demo')), t('se_demoHint'))}
        <div class="row mt"><button class="btn ghost" id="seExport">${ic('download')} ${t('se_export')}</button><button class="btn ghost" id="seImport">${ic('upload')} ${t('se_import')}</button><button class="btn ghost" id="seQuiz">${ic('target')} ${t('se_resetQuiz')}</button><button class="btn danger" id="seReset">${ic('trash')} ${t('se_reset')}</button></div>
        <p class="tiny muted mt">${t('se_storage')}: <span class="tnum">${(storageBytes() / 1024).toFixed(1)} KB</span></p></section>
      <section class="panel"><h3>${ic('help')} ${t('se_help')}</h3><div class="row"><button class="btn ghost" id="seTour">${ic('sparkles')} ${t('se_tour')}</button><button class="btn ghost" id="seKeys">${ic('keyboard')} ${t('shortcuts')}</button><a class="btn ghost" href="#about">${ic('info')} ${t('nav_about')}</a></div></section>
    </div>`;
  bindSettings(view);
}

function bindSettings(view) {
  const rerender = () => renderSettings(view);
  $$('[data-lang]', view).forEach(b => (b.onclick = () => setLang(b.dataset.lang)));
  $$('[data-set]', view).forEach(b => (b.onclick = () => {
    setSetting(b.dataset.set, b.dataset.v);
    applySettings();
    rerender();
  }));
  $$('[data-sw]', view).forEach(cb => (cb.onchange = () => {
    setSetting(cb.dataset.sw, cb.checked);
    applySettings();
    if (cb.dataset.sw === 'demo') refreshChrome();
  }));
  $('#seRemind').onchange = e => setSetting('remindDays', clamp(+e.target.value || 14, 3, 60));
  $('#seExpiry').onchange = e => setSetting('expiryDays', clamp(+e.target.value || 60, 7, 180));
  $('#seExport').onclick = exportData;
  $('#seImport').onclick = () => pickFile('application/json,.json', text => importData(text) && rerender());
  $('#seQuiz').onclick = () => {
    store.remove('profile');
    toast(t('se_quizCleared'), 'ok');
  };
  $('#seReset').onclick = () => confirmBox(t('se_resetQ'), () => {
    store.keys().forEach(k => store.remove(k));
    seedIfNeeded(true);
    lang = 'en';
    applySettings();
    applyLang();
    toast(t('se_resetDone'), 'ok');
  }, { typed: 'RESET', yesLabel: t('se_reset') });
  $('#seTour').onclick = startTour;
  $('#seKeys').onclick = openShortcuts;
}

const TOUR_STEPS = [
  { el: ['.lead', '#view'], key: 'tour_1' },
  { el: ['#nav', '#menuBtn'], key: 'tour_2' },
  { el: ['#searchBtn'], key: 'tour_3' },
  { el: ['#langBtn'], key: 'tour_4' },
  { el: ['#bellBtn'], key: 'tour_5' },
  { el: ['.lead .verify', '.colophon'], key: 'tour_6' },
];
let tourStep = -1;

function startTour() {
  closeModal(true);
  if (currentRoute().page !== 'home') location.hash = '#home';
  tourStep = 0;
  $('#tour').classList.add('on');
  setTimeout(showTourStep, 60);
}

function endTour() {
  tourStep = -1;
  $('#tour').classList.remove('on');
  setSetting('tourDone', true);
}

const visibleEl = sels => sels.map(s => $(s)).find(el => el && el.getClientRects().length && getComputedStyle(el).visibility !== 'hidden');

function positionTip(rect) {
  const tip = $('#tourTip');
  const spot = $('#tourSpot');
  const pad = 6;
  const top = Math.max(4, rect.top - pad);
  const h = Math.min(rect.height + pad * 2, window.innerHeight - top - 4);
  Object.assign(spot.style, { left: rect.left - pad + 'px', top: top + 'px', width: rect.width + pad * 2 + 'px', height: h + 'px' });
  const tw = Math.min(360, window.innerWidth - 32);
  tip.style.width = tw + 'px';
  const below = rect.top + h + 14;
  const fits = below + tip.offsetHeight + 12 < window.innerHeight;
  tip.style.top = (fits ? below : Math.max(12, Math.min(rect.top - 14 - tip.offsetHeight, window.innerHeight - tip.offsetHeight - 12))) + 'px';
  tip.style.left = clamp(rect.left + rect.width / 2 - tw / 2, 16, window.innerWidth - tw - 16) + 'px';
}

function showTourStep() {
  const step = TOUR_STEPS[tourStep];
  if (!step) return endTour();
  const el = visibleEl(step.el);
  if (!el) {
    tourStep++;
    return showTourStep();
  }
  el.scrollIntoView({ block: 'center', behavior: 'instant' });
  const last = tourStep === TOUR_STEPS.length - 1;
  $('#tourTip').innerHTML = `<div class="tag">${t('tour_step', { n: tourStep + 1, t: TOUR_STEPS.length })}</div><h4>${t(step.key + 't')}</h4><p>${t(step.key + 'b')}</p>
    <div class="between"><button class="linkbtn tiny" id="tourSkip">${t('tour_skip')}</button><div class="row">
      ${tourStep > 0 ? `<button class="btn ghost sm" id="tourBack">${t('tour_back')}</button>` : ''}
      <button class="btn sm" id="tourNext">${last ? t('tour_done') : t('tour_next')} ${ic(last ? 'check' : document.dir === 'rtl' ? 'chevron-left' : 'chevron-right')}</button></div></div>`;
  positionTip(el.getBoundingClientRect());
  $('#tourSkip').onclick = endTour;
  $('#tourNext').onclick = () => {
    tourStep++;
    showTourStep();
  };
  if ($('#tourBack')) $('#tourBack').onclick = () => {
    tourStep--;
    showTourStep();
  };
  $('#tourNext').focus();
}

window.addEventListener('resize', debounce(() => tourStep >= 0 && showTourStep(), 120));

function openShortcuts() {

    ${row(['L'], 'ks_lang')}${row(['T'], 'ks_theme')}${row(['I'], 'ks_inbox')}${row(['Alt', 'Left', 'Right'], 'ks_move')}${row(['?'], 'ks_help')}${row(['Esc'], 'ks_close')}`);
}

function onGlobalKey(e) {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = ['input', 'textarea', 'select'].includes(tag) || e.target.isContentEditable;
  if (e.key === 'Escape') {
    if (tourStep >= 0) endTour();
    else closeModal();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    openPalette();
    return;
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || isOverlayOpen()) return;
  const k = e.key.toLowerCase();
  if (e.key === '?') openShortcuts();
  else if (e.key === '/') {
    e.preventDefault();
    openPalette();
  } else if (k === 'l') setLang(lang === 'en' ? 'ur' : 'en');
  else if (k === 't') toggleTheme();
  else if (k === 'i') location.hash = '#inbox';
  else if (k === 'n') openNewApplication();
  else if (/^[0-9]$/.test(e.key)) {
    const page = NAV[e.key === '0' ? 9 : +e.key - 1];
    if (page) location.hash = '#' + page;
  }
}

document.addEventListener('keydown', onGlobalKey);

  [['Official grade conversion tables', 'گریڈ تبدیلی کے سرکاری جدول'], 'Easy', 'cgpaToPct()', ['Replace the linear CGPA-to-percentage approximation with per-university or HEC conversion tables selected in the quiz.', 'سی جی پی اے سے فیصد کے خطی اندازے کو جامعات یا ایچ ای سی کے جدولوں سے بدلیں جو کوئز میں منتخب ہوں۔']],
];

function renderAbout(view) {
  view.innerHTML = `<header class="pagehead"><div><div class="kicker">${ic('info')} ${t('ab_kicker')}</div><h1>${t('ab_title')}</h1><p class="dek">${t('ab_counts', { s: allScholarships().length, g: GUIDES.length, m: 20 })}</p></div>
      <div class="actions"><button class="btn ghost" id="abTour">${ic('sparkles')} ${t('se_tour')}</button><button class="btn ghost" id="abKeys">${ic('keyboard')} ${t('shortcuts')}</button></div></header>
    <div class="about"><section class="gtext"><p class="dropcap">${t('ab_p1')}</p><p>${t('ab_p2')}</p><p class="small muted">${t('ab_stack')}</p>
      <div class="notice">${ic('alert')}<span>${t('foot1')}</span></div></section>
      <section class="panel"><h3>${ic('graduation')} ${t('ab_todo')}</h3><p class="small muted">${t('ab_todoDek')}</p>
        <ol class="todos stagger">${STUDENT_TODOS.map(([title, diff, where, body]) => `<li><div class="between"><b>${esc(tr(title))}</b><span class="chip ${diff === 'Hard' ? 'red' : diff === 'Medium' ? 'amber' : 'green'}">${t('diff_' + diff)}</span></div><p class="small">${esc(tr(body))}</p><div class="tiny muted">${ic('arrow-right')} <code>${esc(where)}</code></div></li>`).join('')}</ol></section></div>`;
  $('#abTour').onclick = startTour;
  $('#abKeys').onclick = openShortcuts;
}

// ---------- navigation chrome ----------
const NAV = ['home', 'database', 'quiz', 'pipeline', 'documents', 'essays', 'referees', 'calendar', 'stats', 'funding', 'guides', 'settings'];
const MORE = ['compare', 'inbox', 'report', 'about'];
const BOTTOM = ['home', 'database', 'pipeline', 'calendar'];
const PAGE_ICON = { home: 'newspaper', database: 'book', compare: 'scale', quiz: 'target', pipeline: 'columns', documents: 'paperclip', essays: 'feather', referees: 'quote', calendar: 'calendar', stats: 'bar-chart', funding: 'wallet', guides: 'lightbulb', inbox: 'inbox', report: 'printer', settings: 'settings', about: 'info' };
const NAV_OF = { app: 'pipeline', essay: 'essays', guide: 'guides', compare: 'database' };

function navBadge(page) {
  const s = settings();
  if (page === 'pipeline') {
    const n = apps().filter(a => ['eligible', 'documents'].includes(a.stage) && daysUntil(appDeadline(a)) >= 0 && daysUntil(appDeadline(a)) <= s.remindDays).length;
    return n ? `<span class="n" title="${n}">${n}</span>` : '';
  }
  if (page === 'documents') {
    const n = vault().filter(d => d.expiry && daysUntil(d.expiry) <= s.expiryDays).length;
    return n ? `<span class="n">${n}</span>` : '';
  }
  return '';
}

function renderNav(active) {
  $('#nav').setAttribute('aria-label', t('sectionsMenu'));
  $('#nav').innerHTML = NAV.map(p => `<a href="#${p}" class="${p === active ? 'on' : ''}" ${p === active ? 'aria-current="page"' : ''}>${t('nav_' + p)}${navBadge(p)}</a>`).join('');
  $('#bottombar').setAttribute('aria-label', t('sectionsMenu'));
  $('#bottombar').innerHTML = BOTTOM.map(p => `<a href="#${p}" class="${p === active ? 'on' : ''}" ${p === active ? 'aria-current="page"' : ''}>${ic(PAGE_ICON[p])}<span>${t('nav_' + p)}</span>${navBadge(p)}</a>`).join('')
    + `<button id="menuBtn" class="${BOTTOM.includes(active) ? '' : 'on'}" aria-haspopup="dialog">${ic('menu')}<span>${t('more')}</span></button>`;
  $('#menuBtn').onclick = openMenu;
}

function openMenu() {
  const active = NAV_OF[currentRoute().page] || currentRoute().page;
  const html = `<nav class="menu-list">${[...NAV, ...MORE].map(p => `<a href="#${p}" class="${p === active ? 'on' : ''}">${ic(PAGE_ICON[p])}<span class="grow">${t('nav_' + p)}</span>${navBadge(p)}</a>`).join('')}</nav>`;
  openDrawer(t('sectionsMenu'), html, { side: 'start' });
  $$('#overlay .menu-list a').forEach(a => (a.onclick = () => closeModal(true)));
}

function renderColophon() {
  $('#colophon').innerHTML = `<p>${t('foot1')}</p><p>${t('foot2')}</p>
    <p class="row">${MORE.concat('settings').map(p => `<a href="#${p}">${t('nav_' + p)}</a>`).join(' · ')} · <button class="linkbtn" id="footKeys">${t('shortcuts')}</button></p>`;
  $('#footKeys').onclick = openShortcuts;
}

function refreshChrome() {
  syncReminders();
  const n = unreadCount();
  const dot = $('#bellDot');
  dot.textContent = n > 9 ? '9+' : n;
  dot.classList.toggle('hidden', !n);
  $('#bellBtn').setAttribute('aria-label', `${t('nav_inbox')}${n ? ` (${n})` : ''}`);
  const active = NAV_OF[currentRoute().page] || currentRoute().page;
  renderNav(active);
}

// ---------- settings, theme, language ----------
function applySettings() {
  const s = settings();
  const root = document.documentElement;
  root.dataset.theme = s.theme === 'dark' ? 'dark' : 'light';
  root.dataset.size = s.size;
  root.classList.toggle('rm', !!s.rm);
  $('#themeBtn').innerHTML = ic(s.theme === 'dark' ? 'sun' : 'moon');
  $('#themeBtn').setAttribute('aria-label', s.theme === 'dark' ? t('themeLight') : t('themeDark'));
  $('meta[name="theme-color"]').setAttribute('content', s.theme === 'dark' ? '#0e1424' : '#152a4e');
}

function toggleTheme() {
  setSetting('theme', settings().theme === 'dark' ? 'light' : 'dark');
  applySettings();
  if (currentRoute().page === 'settings') route();
}

function applyLang() {
  const root = document.documentElement;
  root.lang = lang;
  root.dir = lang === 'ur' ? 'rtl' : 'ltr';
  root.classList.toggle('ur', lang === 'ur');
  $$('[data-i18n]').forEach(el => (el.textContent = t(el.dataset.i18n)));
  $('#skipLink').textContent = t('skip');
  $('#langLbl').textContent = t('langName');
  $('#langBtn').setAttribute('lang', lang === 'en' ? 'ur' : 'en');
  $('#searchBtn').setAttribute('aria-label', t('search'));
  $('#helpBtn').setAttribute('aria-label', t('shortcuts'));
  $('#dateline').textContent = fmtDateLong(TODAY);
  $('#edition').textContent = t('edition');
  applySettings();
  renderColophon();
  refreshChrome();
  route();
}

function setLang(l) {
  lang = l === 'ur' ? 'ur' : 'en';
  store.set('lang', lang);
  applyLang();
  announce(lang === 'ur' ? 'اردو' : 'English');
}

// ---------- router ----------
function currentRoute() {
  const raw = decodeURIComponent(location.hash.slice(1)) || 'home';
  const [page, ...parts] = raw.split('/');
  return { page, parts };
}

const ROUTES = {
  home: v => renderHome(v),
  database: v => renderDatabase(v),
  compare: v => renderCompare(v),
  quiz: (v, p) => renderQuiz(v, p[0]),
  pipeline: v => renderPipeline(v),
  app: (v, p) => renderApp(v, p[0], p[1]),
  documents: (v, p) => renderDocuments(v, p[0]),
  essays: v => renderEssays(v),
  essay: (v, p) => renderEssayEditor(v, p[0]),
  referees: v => renderReferees(v),
  calendar: v => renderCalendar(v),
  stats: v => renderStats(v),
  funding: v => renderFunding(v),
  guides: v => renderGuides(v),
  guide: (v, p) => renderGuide(v, p[0]),
  inbox: (v, p) => renderInbox(v, p[0]),
  report: v => renderReport(v),
  settings: v => renderSettings(v),
  about: v => renderAbout(v),
};
let lastPage = '';

function route() {
  let { page, parts } = currentRoute();
  if (!ROUTES[page]) page = 'home';
  const view = $('#view');
  const key = page + '/' + parts.join('/');
  if (tourStep < 0) closeModal(true);
  ROUTES[page](view, parts);
  animateIn(view);
  const navPage = NAV_OF[page] || page;
  renderNav(navPage);
  document.title = `${t('nav_' + navPage)} · ScholarTrack`;
  if (key !== lastPage) window.scrollTo(0, 0);
  lastPage = key;
}

// ---------- boot ----------
function bindChrome() {
  $('#langBtn').onclick = () => setLang(lang === 'en' ? 'ur' : 'en');
  $('#themeBtn').onclick = toggleTheme;
  $('#bellBtn').onclick = () => (location.hash = '#inbox');
  $('#helpBtn').onclick = openShortcuts;
  $('#searchBtn').onclick = openPalette;
  window.addEventListener('hashchange', route);
}

function boot() {
  const fresh = !store.get('seeded', 0);
  seedIfNeeded();
  if (fresh) notify('welcome', 'welcome', both('ib_welcome'), both('ib_welcomeBody'), '#quiz');
  syncReminders();
  bindChrome();
  applyLang();
  if (!settings().tourDone && !location.hash) setTimeout(startTour, 700);
}

// Small test seam for behaviour scripts and student experiments (pure functions only).
window.ScholarTrack = { matchScholarship, matchAll, typicalDeadline, inWindow, buildIcs, foldLine, diffWords, readability, structureState, computeFunding, fundingPreset, reminders, cgpaToPct, pctToCgpa, allScholarships, CATALOGUE, GUIDES };

boot();
</script>
