let palSel = 0;

function paletteIndex() {
  const items = [];
  const add = (group, icon, label, sub, run) => items.push({ group, icon, label, sub, run });
  Object.keys(ROUTES).forEach(r => add('sg_pages', ROUTES[r].icon, t('nav_' + r), '', () => go(r)));
  add('sg_actions', 'play', t('rd_start'), '', () => (curRoute === 'ride' ? startRide() : go('ride')));
  add('sg_actions', 'siren', t('eng_practice'), '', () => startCountdown({ practice: true, src: 'practice' }));
  add('sg_actions', 'record', t('rec_start'), '', () => go('lab/rec'));
  add('sg_actions', 'roc', t('lab_roc'), '', () => go('lab/eval'));
  add('sg_actions', 'printer', t('md_printCard'), '', printCard);
  add('sg_actions', 'map-pin', t('hz_add'), '', () => go('hazards'));
  add('sg_actions', 'fuel', t('gr_addFill'), '', () => go('garage/fuel'));
  add('sg_actions', 'help', t('qz_title'), '', () => go('learn/quiz'));
  S.trips.slice(0, 40).forEach(tr => add('sg_trips', 'route', tripTitle(tr), `${fmtDate(tr.start)} · ${fmtN(tr.km, 1)} km · ${tr.score}`, () => go('trips/' + tr.id)));
  S.hazards.forEach(h => add('sg_hazards', hazardType(h.type).icon, t('hz_' + h.type), [L(h.note), L(CITIES[h.city].name), ago(h.ts)].filter(Boolean).join(' · '), () => {
    HZ.city = h.city;
    HZ.sel = h.id;
    go('hazards');
  }));
  LESSONS.forEach(l => {
    add('sg_learn', l.icon, L(l.title), '', () => go('learn/' + l.id));
    l.points.forEach(p => add('sg_learn', 'book', L(p).slice(0, 70), L(l.title), () => go('learn/' + l.id)));
  });
  S.riders.forEach(r => add('sg_fleet', 'user', r.name, L(r.zone), () => {
    go('fleet');
    later(() => openRider(r.id));
  }));
  return items;
}

function openPalette() {
  closeModal();
  const p = $('#palette');
  p.innerHTML = `<div class="palbox">
      <input class="inp" id="palIn" type="search" placeholder="${t('searchAll')}" aria-label="${t('searchAll')}" autocomplete="off" dir="auto">
      <div class="palres" id="palRes" role="listbox"></div><div class="palhint">${t('palHint')}</div></div>`;
  p.classList.add('on');
  const index = paletteIndex();
  const draw = () => {
    const q = $('#palIn').value.trim().toLowerCase();
    palItems = (q ? index.filter(i => (i.label + ' ' + i.sub).toLowerCase().includes(q)) : index.filter(i => i.group === 'sg_pages' || i.group === 'sg_actions')).slice(0, 40);
    palSel = 0;
    let lastGroup = '';
    $('#palRes').innerHTML = palItems.map((it, i) => {
      const head = it.group !== lastGroup ? `<div class="pg">${t(it.group)}</div>` : '';
      lastGroup = it.group;
      return `${head}<button type="button" role="option" data-i="${i}" class="${i === 0 ? 'on' : ''}">${ic(it.icon)}<span dir="auto">${esc(it.label)}</span>
          <small dir="auto">${esc(it.sub)}</small></button>`;
    }).join('') || `<div class="empty">${t('sg_none')}</div>`;
    $$('#palRes [data-i]').forEach(b => (b.onclick = () => runPal(Number(b.dataset.i))));
    if (q) announce(t('sg_count', { n: palItems.length }));
  };
  $('#palIn').oninput = draw;
  $('#palIn').onkeydown = palKeys;
  p.onclick = e => e.target === p && closePalette();
  draw();
  $('#palIn').focus();
}

function palKeys(e) {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    palSel = clamp(palSel + (e.key === 'ArrowDown' ? 1 : -1), 0, palItems.length - 1);
    $$('#palRes [data-i]').forEach(b => b.classList.toggle('on', Number(b.dataset.i) === palSel));
    const on = $('#palRes .on');
    if (on) on.scrollIntoView({ block: 'nearest' });
  }
  if (e.key === 'Enter' && palItems[palSel]) runPal(palSel);
}

function runPal(i) {
  const it = palItems[i];
  closePalette();
  if (it) it.run();
}

function closePalette() {
  const p = $('#palette');
  if (!p.classList.contains('on')) return;
  p.classList.remove('on');
  p.innerHTML = '';
}

// ---------- onboarding spotlight tour ----------
const TOUR = [
  { sel: '#pkRider', k: 'tour1' },
  { sel: '#startRide', k: 'tour2' },
  { sel: '[data-nav="engine"], #tabMore', k: 'tour3' },
  { sel: '[data-nav="lab"]', k: 'tour4' },
  { sel: '[data-nav="medical"], #tabMore', k: 'tour5' },
  { sel: '#searchBtn', k: 'tour6' },
  { sel: '#langBtn', k: 'tour7' },
];
let tourStep = -1;
const visibleEl = sel => $$(sel).find(el => el.getClientRects().length && getComputedStyle(el).visibility !== 'hidden');

function startTour() {
  closeModal();
  closePalette();
  if (curRoute !== 'ride') go('ride');
  tourStep = 0;
  $('#tour').classList.add('on');
  setTimeout(showTourStep, 380);
}

function endTour() {
  tourStep = -1;
  $('#tour').classList.remove('on');
  S.settings.tourDone = true;
  persist('settings');
}

function placeTip(el) {
  const rect = el.getBoundingClientRect();
  const tip = $('#tourTip');
  const p = 6;
  Object.assign($('#tourSpot').style, { left: rect.left - p + 'px', top: rect.top - p + 'px', width: rect.width + p * 2 + 'px', height: rect.height + p * 2 + 'px' });
  const tw = Math.min(340, window.innerWidth - 32);
  const below = rect.bottom + 16;
  const top = below + tip.offsetHeight + 12 < window.innerHeight ? below : Math.max(12, rect.top - 16 - tip.offsetHeight);
  const left = clamp(rect.left + rect.width / 2 - tw / 2, 16, window.innerWidth - tw - 16);
  Object.assign(tip.style, { top: top + 'px', left: left + 'px' });
}

function showTourStep() {
  const step = TOUR[tourStep];
  if (!step) return endTour();
  const el = visibleEl(step.sel);
  if (!el) {
    tourStep++;
    return showTourStep();
  }
  if (!el.closest('.tabs, .rail, .top')) el.scrollIntoView({ block: 'center', behavior: 'instant' });
  const last = tourStep === TOUR.length - 1;
  $('#tourTip').innerHTML = `<span class="chip y">${t('stepXofY', { x: tourStep + 1, y: TOUR.length })}</span><h4>${t(step.k + 't')}</h4><p>${t(step.k + 'b')}</p>
    <div class="between"><div class="dots">${TOUR.map((_, i) => `<i class="${i === tourStep ? 'on' : ''}"></i>`).join('')}</div>
    <div class="row">
        <button type="button" class="btn ghost sm" id="tourSkip">${t('skip')}</button>${tourStep ? `<button type="button" class="btn ghost sm" id="tourBack" aria-label="${t('back')}">${ic('chevron-left', 'flip')}</button>` : ''}
    <button type="button" class="btn sm y" id="tourNext">${last ? t('done') : t('next')} ${ic(last ? 'check' : 'chevron-right', last ? '' : 'flip')}</button>
        </div></div>`;
  placeTip(el);
  $('#tourSkip').onclick = endTour;
  $('#tourNext').onclick = () => {
    tourStep++;
    showTourStep();
  };
  if ($('#tourBack')) $('#tourBack').onclick = () => {
    tourStep--;
    showTourStep();
  };
  $('#tourNext').focus({ preventScroll: true });
}

// ---------- keyboard shortcuts ----------
const KEYMAP = { r: 'ride', e: 'engine', l: 'lab', c: 'coach', t: 'trips', m: 'medical', g: 'garage', f: 'fleet', h: 'hazards', n: 'learn', i: 'inbox', s: 'settings' };

function openShortcuts() {
  const rows = [['/', t('kb_search')], ['?', t('kb_help')], ['d', t('kb_theme')], ['u', t('kb_lang')], ['Space', t('kb_pause')], ['o', t('kb_ok')], ['Esc', t('kb_close')]];
  Object.entries(KEYMAP).forEach(([k, r]) => rows.push([k, t('nav_' + r)]));
  openModal(`${sheetHead(t('shortcuts'), 'keyboard')}<div class="keys">${rows.map(([k, d]) => `<div><kbd>${k}</kbd><span>${d}</span></div>`).join('')}</div>`);
}

function onKey(e) {
  const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.target.isContentEditable;
  if (e.key === 'Escape') return onEscape();
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (ALARM.phase === 'count' && (e.key === 'o' || e.key === 'O')) return imOk();
  if (ALARM.phase !== 'idle' || modalOpen() || $('#palette').classList.contains('on')) return;
  if (e.key === ' ' && RIDE.on && $('#hud.on') && !e.target.closest('button')) {
    e.preventDefault();
    togglePause();
    return;
  }
  if (e.key === '/') {
    e.preventDefault();
    openPalette();
  } else if (e.key === '?') openShortcuts();
  else if (e.key === 'd') setPref('theme', S.settings.theme === 'dark' ? 'light' : 'dark', false);
  else if (e.key === 'u') setLang(lang === 'ur' ? 'en' : 'ur');
  else if (KEYMAP[e.key] && !(RIDE.on && $('#hud.on'))) go(KEYMAP[e.key]);
}

function onEscape() {
  if (tourStep >= 0) return endTour();
  if ($('#palette').classList.contains('on')) return closePalette();
  if (modalOpen()) return closeModal();
}

// =====================================================================
// ABOUT — what Sawaar is (and is not), the student extension points.
// =====================================================================
const STUDENT_TODOS = [
  { k: 'td_sms', fn: 'sendAlertViaServer()', level: 'Hard' },
  { k: 'td_ml', fn: 'trainLearnedClassifier()', level: 'Hard' },
  { k: 'td_bg', fn: 'requestBackgroundMode()', level: 'Hard' },
  { k: 'td_ble', fn: 'connectHelmetSensor()', level: 'Hard' },
  { k: 'td_fleet', fn: 'syncFleet()', level: 'Medium' },
  { k: 'td_limit', fn: 'fetchRoadSpeedLimit()', level: 'Medium' },
  { k: 'td_hazard', fn: 'shareHazardsCommunity()', level: 'Hard' },
  { k: 'td_voice', fn: 'listenForImOk()', level: 'Medium' },
];

function renderAbout() {
  $('#view').innerHTML = `<section class="card about-hero"><div class="row"><span class="mark big">${$('.rail .brand').innerHTML}</span>
      <div class="grow"><h2>${t('appName')} — ${t('tagline')}</h2><p>${t('ab_pitch')}</p></div></div></section>
    <div class="note r mt">${ic('alert')}<span>${t('ab_notCertified')}</span></div>
    <div class="grid2 mt"><section class="card"><h2>${ic('check-circle')} ${t('ab_does')}</h2>
        <ul class="ticks">${['ab_d1', 'ab_d2', 'ab_d3', 'ab_d4', 'ab_d5'].map(k => `<li>${ic('check')} ${t(k)}</li>`).join('')}</ul></section>
      <section class="card"><h2>${ic('x')} ${t('ab_cannot')}</h2>
          <ul class="ticks no">${['ab_c1', 'ab_c2', 'ab_c3', 'ab_c4'].map(k => `<li>${ic('x')} ${t(k)}</li>`).join('')}</ul></section></div>
    <section class="card mt"><h2>${ic('code')} ${t('ab_students')}</h2><p class="small muted">${t('ab_studentsSub')}</p><div class="tbl-wrap">
        <table class="tbl"><thead><tr><th>${t('ab_ext')}</th><th>${t('ab_level')}</th><th>${t('ab_start')}</th></tr></thead>
      <tbody>${STUDENT_TODOS.map(x => `<tr><td><b>${t(x.k)}</b><small class="blk muted">${t(x.k + 'H')}</small></td><td>
          <span class="chip ${x.level === 'Hard' ? 'r' : 'y'}">${t('lvl_' + x.level)}</span></td><td><code>${x.fn}</code></td></tr>`).join('')}</tbody></table>
          </div></section>
    <section class="card mt"><h2>${ic('info')} ${t('ab_data')}</h2><p class="small">${t('ab_dataBody')}</p><p class="small">${t('ab_credits')}</p></section>`;
}

// =====================================================================
// ROUTER, NAVIGATION, BANNER, PREFERENCES, BOOT
// =====================================================================
const ROUTES = {
  ride: { r: renderRide, icon: 'bike' },
  engine: { r: renderEngine, icon: 'crash' },
  lab: { r: renderLab, icon: 'activity' },
  coach: { r: renderCoach, icon: 'award' },
  trips: { r: renderTrips, icon: 'route' },
  medical: { r: renderMedical, icon: 'medical' },
  garage: { r: renderGarage, icon: 'wrench' },
  fleet: { r: renderFleet, icon: 'users' },
  hazards: { r: renderHazards, icon: 'pothole' },
  learn: { r: renderLearn, icon: 'book' },
  inbox: { r: renderInbox, icon: 'bell' },
  settings: { r: renderSettings, icon: 'settings' },
  about: { r: renderAbout, icon: 'info' },
};
const RAIL = ['ride', 'engine', 'lab', 'coach', 'trips', '|', 'medical', 'garage', 'hazards', 'fleet', 'learn', '|', 'inbox', 'settings', 'about'];
const TABS = ['ride', 'trips', 'lab', 'coach'];
const MORE = ['engine', 'medical', 'garage', 'hazards', 'fleet', 'learn', 'inbox', 'settings', 'about'];
let curRoute = '';
let curArg = '';

function renderNav() {
  const unread = unreadCount();
  const aria = r => (r === curRoute ? 'aria-current="page"' : '');
  $('#railNav').innerHTML = RAIL.map(r => (r === '|' ? '<div class="sep"></div>' : `<a href="#${r}" data-nav="${r}" class="${r === curRoute ? 'on' : ''}" ${aria(r)}>${ic(ROUTES[r].icon)}<span>${t('nav_' + r)}</span>${r === 'inbox' && unread ? `<span class="cnt">${unread}</span>` : ''}</a>`)).join('');
  const tab = r => `<a href="#${r}" data-nav="${r}" ${aria(r)} class="${r === 'ride' ? 'ride-tab' : ''} ${r === curRoute ? 'on' : ''}">${ic(ROUTES[r].icon)}<span>${t('tab_' + r)}</span>${r === 'ride' && RIDE.on ? '<span class="tdot live" aria-hidden="true"></span>' : ''}</a>`;
  $('#tabs').innerHTML = TABS.map(tab).join('') + `<button type="button" id="tabMore" class="${MORE.includes(curRoute) ? 'on' : ''}" aria-label="${t('more')}">${ic('menu')}<span>${t('more')}</span>${unread ? `<span class="tdot">${unread}</span>` : ''}</button>`;
  $('#tabMore').onclick = openMoreSheet;
  $('#rail').setAttribute('aria-label', t('mainNav'));
  $('#tabs').setAttribute('aria-label', t('mainNav'));
}

function openMoreSheet() {
  const sh = openModal(`${sheetHead(t('more'), 'menu')}<div class="more-grid">${MORE.map(r => `<a href="#${r}" data-close>${ic(ROUTES[r].icon, 'lg')}<span>${t('nav_' + r)}</span>
      </a>`).join('')}</div>
    <div class="row mt"><button type="button" class="btn ghost sm" id="mSearch">${ic('search')} ${t('search')}</button>
        <button type="button" class="btn ghost sm" id="mTour">${ic('sparkles')} ${t('replayTour')}</button>
        <button type="button" class="btn ghost sm" id="mKeys">${ic('keyboard')} ${t('shortcuts')}</button></div>`);
  $$('[data-close]', sh).forEach(a => (a.onclick = closeModal));
  $('#mSearch', sh).onclick = openPalette;
  $('#mTour', sh).onclick = startTour;
  $('#mKeys', sh).onclick = openShortcuts;
}

function renderBanner() {
  const b = $('#banner');
  if (!b) return;
  b.innerHTML = RIDE.on && RIDE.minimized ? `<div class="strip">${ic('bike')}<span class="grow">${t('bn_ride', { km: fmtN(RIDE.stats.km, 1), t: clock(RIDE.tNow) })}</span>
      <button type="button" class="btn sm" id="bnHud">${ic('maximize')} ${t('rd_backToHud')}</button></div>` : '';
  if ($('#bnHud')) $('#bnHud').onclick = restoreHud;
}

function go(path) {
  if (location.hash.slice(1) === path) route();
  else location.hash = path;
}

function route() {
  const [name, ...rest] = (location.hash.slice(1) || 'ride').split('/');
  const r = ROUTES[name] ? name : 'ride';
  renderRoute(r, decodeURIComponent(rest.join('/')));
}

function renderRoute(r, arg) {
  const same = r === curRoute && arg === curArg;
  if (TRIPS.lmap && !(r === 'trips' && same)) {
    TRIPS.lmap.remove();
    TRIPS.lmap = null;
  }
  curRoute = r;
  curArg = arg;
  closePalette();
  if (!same) closeModal();
  ROUTES[r].r(arg);
  $('#pageTitle').textContent = t('nav_' + r);
  $('#pageKicker').textContent = t('kick_' + r);
  document.title = r === 'ride' ? `${t('appName')} — ${t('tagline')} | FYP Template` : `${t('nav_' + r)} — ${t('appName')} | FYP Template`;
  renderNav();
  updateBadges();
  renderBanner();
  if (!same) {
    window.scrollTo(0, 0);
    animateIn($('#view'));
  } else settle($('#view'));
}

function rerender() {
  if (!curRoute) return;
  const y = window.scrollY;
  renderRoute(curRoute, curArg);
  window.scrollTo(0, y);
}

function updateBadges() {
  const n = unreadCount();
  $('#bellBadge').textContent = n > 99 ? '99+' : n;
  $('#bellBadge').classList.toggle('hidden', !n);
  $('#bellBtn').setAttribute('aria-label', t('notificationsN', { n }));
}

function applyPrefs() {
  const h = document.documentElement;
  const s = S.settings;
  h.lang = lang;
  h.dir = lang === 'ur' ? 'rtl' : 'ltr';
  h.dataset.theme = s.theme;
  h.dataset.size = s.size;
  h.classList.toggle('calm', !!s.calm);
  $$('[data-i18n]').forEach(el => (el.textContent = t(el.dataset.i18n)));
  $('#langBtn').textContent = lang === 'ur' ? 'EN' : 'اردو';
  $('#langBtn').setAttribute('aria-label', t('switchLang'));
  $('#searchBtn').setAttribute('aria-label', t('searchAll'));
  $('#themeBtn').setAttribute('aria-label', t('switchTheme'));
  $('#themeBtn').innerHTML = ic(s.theme === 'dark' ? 'sun' : 'moon');
  $('#skipLink').textContent = t('skipToContent');
  $('meta[name="theme-color"]').content = s.theme === 'dark' ? '#0b0d10' : '#e3e2dd';
}

function setLang(l) {
  lang = l;
  store.set('lang', l);
  applyPrefs();
  rerender();
  if (RIDE.on && !RIDE.minimized) showHud();
  if (ALARM.phase !== 'idle') renderAlarm();
  if (tourStep >= 0) showTourStep();
}

// Canvases are drawn at the size they have, so redraw them when the window changes.
function onResize() {
  if (curRoute === 'hazards') drawHazardMap();
  if (curRoute === 'trips' && curArg && !TRIPS.lmap) {
    const tr = S.trips.find(x => x.id === curArg);
    if (tr) drawTripMap(tr);
  }
}

function bindShell() {
  $('#searchBtn').onclick = openPalette;
  $('#bellBtn').onclick = () => go('inbox');
  $('#langBtn').onclick = () => setLang(lang === 'ur' ? 'en' : 'ur');
  $('#themeBtn').onclick = () => {
    setPref('theme', S.settings.theme === 'dark' ? 'light' : 'dark', false);
    onResize();
    if (curRoute === 'trips' || curRoute === 'hazards') rerender();
  };
  $('#scrim').onclick = () => {
    closePalette();
    closeModal();
  };
  $('#modal').addEventListener('click', e => e.target === $('#modal') && closeModal());
  $('#hud').addEventListener('pointerdown', onRideTouch, { passive: true });
  document.addEventListener('keydown', onKey);
  document.addEventListener('visibilitychange', () => !document.hidden && RIDE.on && keepAwake(true));
  window.addEventListener('hashchange', route);
  window.addEventListener('resize', debounce(onResize, 200));
}

function boot() {
  lang = store.get('lang', 'en') === 'ur' ? 'ur' : 'en';
  S = loadState();
  if (!S) seedApp();
  detectSensors();
  applyPrefs();
  bindShell();
  route();
  // The first-run tour starts only when the app opens on the Ride page, never over a deep link.
  if (!S.settings.tourDone && curRoute === 'ride') setTimeout(startTour, 900);
}

boot();
</script>
