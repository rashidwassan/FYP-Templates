<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATS-Friendly Resume Builder</title>
<meta name="description" content="Build a resume that applicant-tracking systems can parse: live A4 preview, four ATS-safe templates, keyword match against a job description, rule-based bullet improver, cover letter and PDF/TXT/Markdown export. Single-file FYP template.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lora:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens: editorial warm white / charcoal ---------- */
:root{
  --bg:#fcfbf8; --surface:#ffffff; --surface-2:#f3f1ec; --surface-3:#ebe8e1; --ink:#232323; --muted:#6c6a66; --line:#e6e2da; --line-2:#d6d1c7;
  --accent:#1f3a5f; --accent-soft:#e9eef5; --paper-bg:#ece9e2;
  --ok:#1f7a3a; --ok-soft:#e4f3e8; --warn:#9a6a12; --warn-soft:#fbf0d6; --bad:#b23a2f; --bad-soft:#fbe6e3;
  --radius:12px; --radius-sm:8px; --shadow:0 10px 30px -18px rgba(35,35,35,.35);
  --ui:"Karla",system-ui,-apple-system,"Segoe UI",sans-serif; --serif:"Lora",Georgia,"Times New Roman",serif;
  --ease:cubic-bezier(.2,.8,.2,1); --dur:.35s; --top:56px;
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes chipIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
.enter{animation:fadeUp var(--dur) var(--ease) both}
.stagger>*{animation:fadeUp .45s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45}
body{overflow:hidden;height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.2}
a{color:var(--accent)}
.muted{color:var(--muted)} .hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Buttons / inputs ---------- */
.btn{border:1px solid transparent;border-radius:9px;padding:8px 13px;font-weight:600;cursor:pointer;background:var(--ink);color:#fff;display:inline-flex;align-items:center;gap:7px;min-height:40px;white-space:nowrap;transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px -10px rgba(0,0,0,.4)} .btn:active{transform:translateY(0) scale(.98)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.btn.soft{background:var(--surface-2);color:var(--ink)}
.btn.acc{background:var(--accent);color:#fff}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:.85rem;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.ib{background:none;border:0;border-radius:8px;width:40px;height:40px;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted);flex:none;transition:background .15s,color .15s}
.ib:hover{background:var(--surface-2);color:var(--ink)}
.ib.sm{width:36px;height:36px}
input[type=text],input[type=email],input[type=tel],input[type=url],input[type=month],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 10px;outline:0;font-size:.92rem;min-height:40px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;line-height:1.4}
textarea.grow{resize:none;overflow:hidden;min-height:40px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.f.full{grid-column:1/-1}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 10px}
.chk{display:flex;align-items:center;gap:8px;font-size:.9rem;min-height:40px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface-2);padding:2px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.85rem;border-radius:8px;min-height:34px;color:var(--muted);transition:background .2s,color .2s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.note{background:var(--accent-soft);border-left:3px solid var(--accent);padding:9px 12px;border-radius:8px;font-size:.86rem;margin-top:10px}
.note.warn{background:var(--warn-soft);border-color:var(--warn)}
.tag{font-size:.7rem;background:var(--ink);color:#fff;border-radius:6px;padding:2px 7px;font-weight:700;letter-spacing:.03em}

/* ---------- Top bar ---------- */
.topbar{height:var(--top);display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:none}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--ink);color:#fcfbf8;display:grid;place-items:center;flex:none}
.brand h1{font-family:var(--serif);font-size:1.02rem;font-weight:600;white-space:nowrap;letter-spacing:-.01em}
.brand small{display:block;font-size:.7rem;color:var(--muted);font-weight:500;margin-top:-2px}
.vbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:6px 10px;min-height:40px;cursor:pointer;max-width:240px;font-weight:600;font-size:.88rem}
.vbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 12px 4px 6px;min-height:40px;cursor:pointer;font-weight:700;transition:transform .15s var(--ease)}
.pill:hover{transform:translateY(-1px)}
.pill .ring{width:28px;height:28px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.5;stroke-linecap:round}
.ring .bg{stroke:var(--surface-3)} .ring .fg{stroke:currentColor;transition:stroke-dashoffset .8s var(--ease)}
.s-bad{color:var(--bad)} .s-mid{color:var(--warn)} .s-good{color:var(--ok)}
.pill .lbl{font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.mobilebar{display:none;align-items:center;gap:8px;height:54px;padding:7px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.mobilebar select{min-height:38px;width:auto;flex:1}

/* ---------- Popover / menu ---------- */
.pop{position:absolute;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 50px -20px rgba(0,0,0,.35);padding:6px;min-width:240px;z-index:40;display:none;animation:pop .2s var(--ease)}
.pop.open{display:block}
.pop .mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:500;min-height:40px}
.pop .mi:hover{background:var(--surface-2)} .pop .mi .hint{margin-left:auto;font-size:.72rem;color:var(--muted)}
.pop hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.pop .vrow{display:flex;align-items:center;gap:4px;padding:4px 4px 4px 10px;border-radius:8px}
.pop .vrow.cur{background:var(--accent-soft)}
.pop .vrow .vn{flex:1;min-width:0;cursor:pointer;line-height:1.25} .pop .vrow .vn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem} .pop .vrow .vn small{color:var(--muted);font-size:.72rem}

/* ---------- Layout ---------- */
#view{height:calc(100vh - var(--top));position:relative}
.app{display:grid;grid-template-columns:450px minmax(0,1fr);height:100%}
.editor{overflow:auto;border-right:1px solid var(--line);background:var(--bg);padding:14px 14px 60px;scroll-behavior:smooth}
.ehead{display:flex;align-items:center;gap:8px;margin:0 2px 10px}
.ehead h2{font-family:var(--serif);font-size:1.15rem;font-weight:600;flex:1}
.ehead .saved{font-size:.75rem;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.preview{position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--paper-bg)}
.pvbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.pvbar .zoom{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);overflow:hidden}
.pvbar .zoom button{border:0;background:none;min-width:40px;height:40px;cursor:pointer;font-weight:700;font-size:.85rem;display:grid;place-items:center}
.pvbar .zoom button:hover{background:var(--surface-2)}
.pvbar .pages{font-size:.8rem;color:var(--muted);font-weight:600;white-space:nowrap}
.pvbar .pages.over{color:var(--warn)}
.swatches{display:inline-flex;gap:6px;align-items:center}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 0 0 2px var(--surface);transition:transform .15s}
.sw:hover{transform:scale(1.1)} .sw.on{border-color:var(--ink)}
.fscale{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);font-weight:700}
.fscale input{width:90px;accent-color:var(--accent);min-height:0;padding:0;border:0;box-shadow:none}
.pvbar select{width:auto;min-height:36px;padding:4px 8px;font-size:.85rem}
.pvscroll{flex:1;overflow:auto;padding:24px}
.sheetwrap{margin:0 auto;position:relative}
.sheet{transform-origin:0 0;position:relative}
.sheet.fadein{animation:fadeIn .4s var(--ease)}
.pbreak{position:absolute;left:-14px;right:-14px;border-top:2px dashed var(--bad);pointer-events:none}
.pbreak span{position:absolute;right:0;top:-11px;background:var(--bad);color:#fff;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.03em}

/* ---------- Editor: accordion sections ---------- */
.sec{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin:0 0 10px;box-shadow:var(--shadow);transition:box-shadow .2s,opacity .2s}
.sec.dragging,.item.dragging,.bul.dragging{opacity:.45}
.sec.hid .sh .ttl{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-2)}
.sh{display:flex;align-items:center;gap:4px;padding:6px 8px 6px 4px;cursor:pointer;user-select:none;min-height:48px}
.sh .ttl{flex:1;font-weight:700;font-size:.95rem;display:flex;align-items:center;gap:8px;min-width:0}
.sh .ttl .ic{color:var(--accent)}
.sh .cnt{font-size:.72rem;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:2px 8px;font-weight:700}
.sh .chev{transition:transform var(--dur) var(--ease);display:grid;place-items:center;width:32px;color:var(--muted)}
.sec.open .sh .chev{transform:rotate(180deg)}
.sb{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--dur) var(--ease)}
.sec.open .sb{grid-template-rows:1fr}
.sb>div{overflow:hidden;min-height:0}
.sb .inner{padding:2px 14px 14px}
.handle{cursor:grab;color:var(--line-2);background:none;border:0;width:30px;height:40px;display:grid;place-items:center;border-radius:6px;flex:none;touch-action:none}
.handle:hover{color:var(--muted);background:var(--surface-2)} .handle:active{cursor:grabbing}
.item{border:1px solid var(--line);border-radius:10px;padding:8px 10px 10px 4px;margin-top:10px;background:var(--bg);display:grid;grid-template-columns:30px minmax(0,1fr);gap:2px 6px;transition:border-color .2s}
.item:hover{border-color:var(--line-2)}
.item .ih{grid-column:1/-1;display:flex;align-items:center;gap:4px;min-height:36px}
.item .il{flex:1;font-weight:700;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.item .ibody{grid-column:2}
.mv{display:none}
@media (pointer:coarse){.mv{display:inline-grid}}
.bl{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.bul{display:flex;gap:2px;align-items:flex-start}
.bul .handle{height:40px}
.bul .ib{width:36px}
.bul textarea{flex:1;padding:9px 10px;font-size:.88rem}
.bul .ib{margin-top:2px}
.addrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:2px 3px 2px 11px;font-size:.84rem;font-weight:600;animation:chipIn .25s var(--ease) both;min-height:34px}
.chip .ib{width:30px;height:30px;border-radius:50%}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.miss{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.miss .ib{color:var(--bad)} .chip.miss .ib:hover{background:var(--bad);color:#fff}
.chipin{flex:1;min-width:140px;border-style:dashed!important;min-height:32px!important;padding:5px 10px!important;font-size:.85rem!important}
.gname{font-weight:700!important;min-height:36px!important;padding:5px 9px!important}
.photo-prev{width:56px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}

/* ---------- Resume page (A4 / Letter) ---------- */
.page{--fs:1;--acc:#1f3a5f;background:#fff;color:#1a1a1a;width:210mm;min-height:297mm;padding:16mm;font-family:var(--ui);font-size:calc(10.5pt*var(--fs));line-height:1.38;box-shadow:0 24px 60px -30px rgba(0,0,0,.45);position:relative;overflow-wrap:anywhere}
.page.letter{width:8.5in;min-height:11in}
.page a{color:inherit;text-decoration:none}
.page h1{font-size:2em;font-weight:700;letter-spacing:-.01em;line-height:1.1;color:var(--acc)}
.page .hl{margin:3px 0 0;font-size:1.05em;font-weight:600;color:#333}
.page .ct{margin:4px 0 0;font-size:.92em;color:#444}
.page .ct .sep{color:#999;margin:0 .35em}
.page .rh .ct .cb{white-space:nowrap}
.page h2{font-size:.98em;text-transform:uppercase;letter-spacing:.1em;color:var(--acc);border-bottom:1.5px solid var(--acc);padding-bottom:2px;margin:11px 0 6px;font-weight:700;break-after:avoid}
.page p{margin:0}
.page .ent{margin:0 0 6px;break-inside:avoid}
.page .ent .r1{display:flex;justify-content:space-between;gap:12px;font-weight:700}
.page .ent .r1 .rt{font-weight:500;color:#555;white-space:nowrap;font-size:.95em}
.page .ent .r2{display:flex;justify-content:space-between;gap:12px;color:#444;font-style:italic;font-size:.97em}
.page .ent .meta{color:#444;font-size:.95em}
.page ul{margin:3px 0 0;padding-left:1.15em} .page li{margin:1px 0;break-inside:avoid}
.page .sk{margin:0 0 3px} .page .sk b{font-weight:700}
.page .inl{color:#333}
.page .photo{width:28mm;height:28mm;object-fit:cover;border-radius:4px;float:right;margin:0 0 6px 10px}
.page .pers{font-size:.9em;color:#555;margin-top:2px}
/* Classic + Academic: Lora headings, centred header */
.page.classic .rh,.page.academic .rh{text-align:center;border-bottom:2px solid var(--acc);padding-bottom:8px;margin-bottom:4px}
.page.classic h1,.page.classic h2,.page.academic h1,.page.academic h2,.page.classic .hl,.page.academic .hl{font-family:var(--serif)}
.page.classic h2,.page.academic h2{border-bottom-color:#bbb;letter-spacing:.08em}
.page.academic{padding:18mm;line-height:1.42}
.page.academic h1{font-size:1.75em;letter-spacing:.02em}
.page.academic h2{text-transform:none;font-size:1.12em;letter-spacing:0;border-bottom:1px solid var(--acc)}
.page.academic ol{margin:3px 0 0;padding-left:1.4em}
/* Modern: two columns, linear DOM (main then sidebar) */
.page.modern{padding:14mm}
.page.modern .rh{border-left:6px solid var(--acc);padding-left:10px;margin-bottom:8px}
.page.modern .body{display:grid;grid-template-columns:minmax(0,1fr) 58mm;gap:0 8mm;align-items:start}
.page.modern .side{background:color-mix(in srgb,var(--acc) 7%,#fff);padding:4mm 5mm;border-radius:3px}
.page.modern .side h2{border-bottom:0;font-size:.85em;margin-top:9px}
.page.modern .side h2:first-child{margin-top:0}
.page.modern .side .sk{font-size:.95em;margin-bottom:5px} .page.modern .side .sk b{display:block;color:#333}
.page.modern .side .ct{margin:0 0 4px;font-size:.92em;color:#333}
.page.modern .side .ct .sep{display:none}
.page.modern .side .ct a{display:block}
/* Compact: dense one-pager */
.page.compact{padding:12mm;font-size:calc(9.6pt*var(--fs));line-height:1.3}
.page.compact h1{font-size:1.7em} .page.compact h2{margin:7px 0 3px;font-size:.9em}
.page.compact .ent{margin-bottom:3px} .page.compact ul{margin-top:1px} .page.compact .rh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2px solid var(--acc);padding-bottom:5px}
.page.compact .rh .ct{text-align:right;max-width:46%}
.page.compact .rh .ct .sep{display:block;height:0;overflow:hidden}

/* ---------- Drawer (ATS) ---------- */
.scrim{position:fixed;inset:0;background:rgba(35,35,35,.35);backdrop-filter:blur(2px);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100vw);background:var(--bg);z-index:50;transform:translateX(102%);transition:transform .3s var(--ease);box-shadow:-20px 0 60px -30px rgba(0,0,0,.5);display:flex;flex-direction:column}
body.drawer-open .scrim{opacity:1;pointer-events:auto} body.drawer-open .drawer{transform:none}
.drawer header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.drawer header h2{font-family:var(--serif);font-size:1.15rem;font-weight:600;flex:1}
.drawer .body{padding:16px;overflow:auto;flex:1}
.scorecard{display:grid;grid-template-columns:140px minmax(0,1fr);gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.bigring{width:140px;height:140px;position:relative}
.bigring svg{width:100%;height:100%;transform:rotate(-90deg)}
.bigring circle{fill:none;stroke-width:9;stroke-linecap:round} .bigring .bg{stroke:var(--surface-3)} .bigring .fg{stroke:currentColor;transition:stroke-dashoffset .9s var(--ease)}
.bigring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:2.1rem;font-weight:700;letter-spacing:-.02em;font-family:var(--serif)}
.verdict{font-family:var(--serif);font-size:1.2rem;font-weight:600}
.sub{display:flex;flex-direction:column;gap:5px;margin-top:8px;font-size:.85rem}
.bar{height:8px;background:var(--surface-3);border-radius:999px;overflow:hidden} .bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .6s var(--ease)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.panel h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:6px}
.panel h3 .ic{color:var(--accent)}
.panel+.panel,.panel+.scorecard,.scorecard+.panel{margin-top:12px}
.fix{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.fix:first-of-type{border-top:0}
.fix .st{display:grid;place-items:center;margin-top:1px}
.fix.pass .st{color:var(--ok)} .fix.warn .st{color:var(--warn)} .fix.fail .st{color:var(--bad)}
.fix b{font-size:.92rem} .fix .d{font-size:.84rem;color:var(--muted);grid-column:2;margin-top:2px}
.fix .pts{font-size:.78rem;font-weight:700;color:var(--muted);white-space:nowrap;background:var(--surface-2);padding:2px 8px;border-radius:999px}
.fix .go{grid-column:2;margin-top:6px}

/* ---------- Modal ---------- */
.mscrim{position:fixed;inset:0;background:rgba(35,35,35,.4);z-index:60;display:none;place-items:center;padding:16px;animation:fadeIn .2s}
.mscrim.open{display:grid}
.modal{background:var(--surface);border-radius:16px;width:min(620px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 80px -30px rgba(0,0,0,.5);animation:pop .25s var(--ease);padding:18px 20px 20px}
.modal h2{font-family:var(--serif);font-size:1.25rem;font-weight:600;display:flex;align-items:center;gap:10px}
.modal h2 .ib{margin-left:auto}
.sug{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;background:var(--bg)}
.sug .lab{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);font-weight:700}
.sug p{margin:4px 0 8px;font-size:.92rem}
.orig{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:.9rem;margin-top:10px;color:var(--muted)}
.mactions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.todo{border:1px dashed var(--line-2);border-radius:12px;padding:10px 12px;background:var(--surface)}
.todo h4{margin:0 0 4px;font-size:.92rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.todo code{font-size:.78rem;background:var(--surface-2);padding:1px 6px;border-radius:5px}

/* ---------- Cover letter + About pages ---------- */
.cover{display:grid;grid-template-columns:450px minmax(0,1fr);height:100%}
.cover .form{overflow:auto;padding:14px;border-right:1px solid var(--line)}
.cover .form .fields{margin-top:6px}
.cover .pv{background:var(--paper-bg);overflow:auto;padding:24px;display:flex;flex-direction:column;align-items:center}
.letter{--acc:#1f3a5f;background:#fff;width:210mm;min-height:297mm;padding:22mm 20mm;font-size:11pt;line-height:1.55;color:#1a1a1a;box-shadow:0 24px 60px -30px rgba(0,0,0,.45)}
.letter.letterpaper{width:8.5in;min-height:11in}
.letter .lh{border-bottom:2px solid var(--acc);padding-bottom:8px;margin-bottom:18px}
.letter .lh b{font-family:var(--serif);font-size:1.5em;color:var(--acc)}
.letter .lh div{color:#444;font-size:.92em}
.letter p{margin:0 0 12px;white-space:pre-wrap}
.letter .sig{margin-top:22px}
.about{height:100%;overflow:auto;padding:22px 18px 80px}
.about .wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
.about h2{font-family:var(--serif);font-size:1.35rem;font-weight:600;margin-bottom:6px}
.about h3{font-size:1rem;margin:14px 0 4px}
.about p{margin:0;color:var(--muted)}
.about table{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:8px}
.about th,.about td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.about th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);font-size:.88rem;padding:8px 0;display:flex;align-items:center;gap:8px}

/* ---------- Toasts ---------- */
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:toastIn .3s var(--ease),toastOut .3s var(--ease) 2.9s both;display:flex;align-items:center;gap:8px;max-width:min(92vw,520px)}
.toast.ok{background:var(--ok)} .toast.bad{background:var(--bad)}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .brand small{display:none}
  .pvbar .fscale{display:none}
}
@media (max-width:900px){
  .topbar{gap:6px;padding:0 10px}
  .brand h1,.topbar .seg,.topbar .btn span.t{display:none}
  .topbar .btn{padding:8px 10px}
  .vbtn{max-width:104px;padding:6px 8px;min-width:0}
  .pill{padding:4px 10px 4px 5px;gap:6px} .pill .lbl{display:none}
  .topbar .btn{padding:8px 9px}
  .mobilebar{display:flex}
  #view{height:calc(100vh - var(--top) - 54px)}
  .app,.cover{grid-template-columns:minmax(0,1fr)}
  body[data-mview=preview] .editor,body[data-mview=preview] .cover .form{display:none}
  body[data-mview=editor] .cover .pv{display:none}
  /* keep the hidden preview laid out (off-screen) so page count and ATS length check stay correct */
  body[data-mview=editor] .preview{position:absolute;left:-200vw;top:0;width:100%;height:100%;visibility:hidden;pointer-events:none}
  .editor{border-right:0}
  .pvscroll{padding:14px}
  .pvbar{gap:6px;padding:6px 10px} .pvbar .fscale{display:none}
  .fields{grid-template-columns:minmax(0,1fr)}
  .about .wrap{grid-template-columns:minmax(0,1fr)}
  .scorecard{grid-template-columns:110px minmax(0,1fr)} .bigring{width:110px;height:110px} .bigring .num{font-size:1.7rem}
  .drawer .body{padding:12px}
}
@media (max-width:420px){
  .pvbar .swatches{display:none}
}

/* ---------- Print: only the resume (or letter) page, real page size ---------- */
@media print{
  html,body{overflow:visible;height:auto;background:#fff}
  .topbar,.mobilebar,.pvbar,.editor,.drawer,.scrim,#toasts,.mscrim,.pop,.cover .form,.pbreak,.about{display:none!important}
  #view{height:auto}
  .app,.cover{display:block;height:auto}
  .preview,.cover .pv{display:block!important;overflow:visible;background:none;padding:0;height:auto}
  .preview{position:static!important;left:auto!important;width:auto!important;visibility:visible!important}
  .pvscroll{padding:0;overflow:visible}
  .sheetwrap{width:auto!important;height:auto!important;margin:0}
  .sheet{transform:none!important}
  .page,.letter{width:auto!important;min-height:0!important;padding:0!important;box-shadow:none;margin:0}
  .page.modern .side{background:#f3f3f3!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  a[href]::after{content:none!important}
}
</style>

<script>
'use strict';
/* =====================================================================
   ATS-Friendly Resume Builder — single-file app
   Sections: utils · constants · sample data · state · editor · preview
             · ATS engine · bullet improver · cover letter · export · router
   Student extension points are marked with  TODO(student)
   ===================================================================== */

// ---------- utils ----------
const NS = 'cvb:';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const store = {
  get(k, d) { try { const v = localStorage.getItem(NS + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(NS + k, JSON.stringify(v)); } catch {} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const ic = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const getPath = (o, p) => p.split('.').reduce((c, k) => c?.[k], o);
const setPath = (o, p, v) => { const ks = p.split('.'); let c = o; for (let i = 0; i < ks.length - 1; i++) c = c[ks[i]]; c[ks.at(-1)] = v; };
const clone = o => JSON.parse(JSON.stringify(o));
const toast = (msg, type = '') => { const t = document.createElement('div'); t.className = 'toast ' + type; t.innerHTML = ic(type === 'bad' ? 'alert-circle' : 'check-circle') + esc(msg); $('#toasts').append(t); setTimeout(() => t.remove(), 3300); };
const animateIn = root => { root.classList.remove('enter'); void root.offsetWidth; root.classList.add('enter'); $$('.stagger', root).forEach(g => [...g.children].forEach((el, i) => el.style.setProperty('--i', i))); };
const countUp = (el, to, { dur = 700, fmt = v => Math.round(v) } = {}) => { const t0 = performance.now(); const step = now => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = fmt(to * e); if (p < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); };
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmtD = v => { const m = /^(\d{4})-(\d{2})$/.exec(v || ''); return m ? `${MONTHS[+m[2] - 1] || '?'} ${m[1]}` : (v || ''); };
const range = e => { const a = fmtD(e.start), b = e.present ? 'Present' : fmtD(e.end); return [a, b].filter(Boolean).join(' – '); };
const words = s => (s || '').trim().split(/\s+/).filter(Boolean);
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const TODAY = new Date(2026, 9, 16);

// ---------- constants ----------
const TEMPLATES = {
  classic: { name: 'Classic', margin: 16, hint: 'Single column, serif headings. Safest choice for every portal.' },
  modern: { name: 'Modern', margin: 14, hint: 'Main column + sidebar for contact and skills. DOM stays linear.' },
  compact: { name: 'Compact', margin: 12, hint: 'Dense one-pager for internships and graduate roles.' },

// ---------- ATS engine: keywords + rule checks ----------
const normTok = t => t.replace(/\./g, '').replace(/s$/, '');
function tokens(text) { return text.toLowerCase().replace(/[^a-z0-9+#.\s/-]/g, ' ').split(/[\s/]+/).map(t => t.replace(/^[.\-]+|[.\-]+$/g, '')).filter(Boolean); }
function extractKeywords(jd) {
  const toks = tokens(jd), ok = t => t.length > 1 && !STOP.has(t) && !/^\d+$/.test(t), uni = new Map(), bi = new Map();
  toks.forEach((t, i) => { if (ok(t)) uni.set(t, (uni.get(t) || 0) + 1); if (i < toks.length - 1 && ok(t) && ok(toks[i + 1])) { const k = t + ' ' + toks[i + 1]; bi.set(k, (bi.get(k) || 0) + 1); } });
  const kept = [...bi].filter(([, f]) => f >= 2);
  kept.forEach(([k, f]) => k.split(' ').forEach(w => uni.set(w, (uni.get(w) || 0) - f)));
  return [...kept.map(([k, f]) => ({ k, f, w: 1.5 * Math.min(f, 4) })), ...[...uni].filter(([, f]) => f > 0).map(([k, f]) => ({ k, f, w: Math.min(f, 4) }))].sort((a, b) => b.w - a.w || a.k.localeCompare(b.k)).slice(0, 40);
}
// TODO(student): synonym-aware matching — run tokens through a stemmer (Porter) and a tech-synonym table (js→javascript, postgres→postgresql, k8s→kubernetes) before comparing, so "Node" matches "Node.js".
function keywordMatch(jd, r = R) {
  const kws = extractKeywords(jd); const rt = tokens(toTXT(r)).map(normTok); const set = new Set(rt); rt.forEach((t, i) => { if (i < rt.length - 1) set.add(t + ' ' + rt[i + 1]); });
  const has = k => set.has(k.split(' ').map(normTok).join(' '));
  const matched = kws.filter(x => has(x.k)), missing = kws.filter(x => !has(x.k)), tot = kws.reduce((s, x) => s + x.w, 0);
  return { kws, matched, missing, pct: tot ? Math.round(100 * matched.reduce((s, x) => s + x.w, 0) / tot) : 0 };
}
const allBullets = (r = R) => [...r.experience, ...r.projects, ...r.custom.items].flatMap(e => e.bullets || []).map(b => b.trim()).filter(Boolean);
const firstWord = b => (b.replace(/^[-•*\s]+/, '').split(/\s+/)[0] || '').toLowerCase().replace(/[^a-z]/g, '');
const weakStart = b => WEAK.find(([w]) => b.trim().toLowerCase().startsWith(w));
const monthsBetween = (a, b) => { const p = v => { const m = /^(\d{4})-(\d{2})/.exec(v || ''); return m ? +m[1] * 12 + +m[2] : null; }; const x = p(a), y = b === 'now' ? TODAY.getFullYear() * 12 + TODAY.getMonth() + 1 : p(b); return x != null && y != null ? Math.max(0, y - x) : 0; };
const yearsExp = (r = R) => r.experience.reduce((s, e) => s + monthsBetween(e.start, e.present ? 'now' : e.end), 0) / 12;
function analyse(r = R) {
  const c = r.contact, checks = [], bl = allBullets(r), txt = toTXT(r);
  const add = (id, title, max, pts, detail, target, fix) => checks.push({ id, title, max, pts: Math.max(0, Math.min(max, Math.round(pts))), status: pts >= max - .01 ? 'pass' : pts > 0 ? 'warn' : 'fail', detail, target, fix });
  // 1 contact
  const miss = [['name', c.name], ['email', c.email], ['phone', c.phone], ['city', c.city], ['LinkedIn', c.linkedin]].filter(([, v]) => !v.trim()).map(([k]) => k);
  add('contact', 'Contact block complete', 10, 10 - 2 * miss.length, miss.length ? `Missing: ${miss.join(', ')}.` : 'Name, email, phone, city and LinkedIn present.', 'contact', 'Recruiters search by city; portals auto-fill from email and phone.');
  // 2 headline
  add('headline', 'Headline names the target role', 5, c.headline.trim() ? 5 : 0, c.headline.trim() ? `“${c.headline}”` : 'Add a one-line headline such as “Software Engineer · React, Node.js”.', 'contact', 'Headlines are matched against the job title first.');
  // 3 summary
  const sw = words(r.summary).length, sv = r.sections.find(s => s.type === 'summary')?.visible;
  add('summary', 'Summary length (40–90 words)', 8, !sv || !sw ? 0 : sw < 25 ? 3 : sw > 120 ? 4 : sw <= 90 && sw >= 40 ? 8 : 6, sv && sw ? `${sw} words.` : 'No visible summary. Three lines that mirror the job title and top skills lift keyword matches.', 'summary', 'Keep it to 2–4 lines with the job title and 3–4 core skills.');
  // 4 action verbs
  const weak = bl.filter(b => weakStart(b)), strong = bl.filter(b => STRONG.has(firstWord(b)));
  add('verbs', 'Bullets start with strong action verbs', 12, bl.length ? 12 * (strong.length / bl.length) - 2 * weak.length : 0, bl.length ? `${strong.length}/${bl.length} start with a strong verb${weak.length ? `; ${weak.length} start weakly (“${weakStart(weak[0])[0]}”…)` : ''}.` : 'No bullets found.', 'experience', 'Use the sparkle button on a bullet for a verb upgrade.');
  // 5 quantified
  const q = bl.filter(b => /\d/.test(b));
  add('metrics', 'Bullets are quantified (numbers, %, Rs, time)', 10, bl.length ? 10 * Math.min(1, (q.length / bl.length) / .6) : 0, bl.length ? `${q.length}/${bl.length} bullets include a number (target ≥ 60 %).` : 'No bullets found.', 'experience', 'Add scale: users, %, Rs, hours saved, team size, marks.');
  // 6 bullet length
  const long = bl.filter(b => words(b).length > 34), short = bl.filter(b => words(b).length < 6);
  add('length', 'Bullets are 1–2 lines (6–34 words)', 6, bl.length ? 6 - 1.5 * (long.length + short.length) : 0, long.length + short.length ? `${long.length} too long, ${short.length} too short.` : 'All bullets are a readable length.', 'experience', 'Split long bullets into two; expand one-liners with what, how and result.');
  // 7 dates
  let dIss = 0; [...r.experience, ...r.education].forEach(e => { if (!e.start) dIss++; if (!e.present && !e.end) dIss++; if (e.start && e.end && !e.present && monthsBetween(e.start, e.end) === 0 && e.start !== e.end) dIss++; if (e.start && !/^\d{4}-\d{2}$/.test(e.start)) dIss++; if (e.end && !/^\d{4}-\d{2}$/.test(e.end)) dIss++; });
  add('dates', 'Dates complete and consistent (Mon YYYY)', 6, 6 - 2 * dIss, dIss ? `${dIss} date issue${dIss > 1 ? 's' : ''} in experience or education.` : 'Every entry has a parseable start and end (or “Present”).', 'experience', 'ATS parsers compute tenure from dates — gaps and typos lower rankings.');

  add('personal', 'No photo, CNIC, age or marital status', 12, 12 - 6 * pd.length, pd.length ? `Found: ${pd.join(', ')}. Common on Pakistani CVs, but ATS cannot parse images and many employers screen out personal data.` : 'No personal identifiers detected.', 'contact', 'Leave photo and CNIC off unless a specific employer asks.');
  // 9 headings
  const hIss = []; r.sections.filter(s => s.visible).forEach(s => { if (s.type === 'custom' && !STD_HEADINGS.has((r.custom.title || '').toLowerCase().trim())) hIss.push(`“${r.custom.title}” is a non-standard heading`); const n = +sectionCountFor(r, s.type); if (!n) hIss.push(`${SECTIONS[s.type].title} is visible but empty`); });
  add('headings', 'Standard section headings, no empty sections', 6, 6 - 3 * hIss.length, hIss.length ? hIss.join('; ') + '.' : 'All visible headings are ones parsers recognise.', 'sections', 'Parsers map headings like Experience, Education, Skills, Projects. Hide empty sections.');
  // 10 page length
  const yrs = yearsExp(r), ideal = yrs < 5 ? 1 : 2;
  add('pages', `Length: ${pages} page${pages > 1 ? 's' : ''} for ${yrs < 1 ? '< 1' : yrs.toFixed(1)} yrs experience`, 8, pages <= ideal ? 8 : pages === ideal + 1 ? 4 : 0, pages <= ideal ? `Fits the ${ideal}-page guideline.` : `Aim for ${ideal} page${ideal > 1 ? 's' : ''}: trim older bullets, switch to Compact, or lower the font scale.`, 'preview', 'Under 5 years of experience → one page.');
  // 11 keywords
  let kw = null; const jd = (ui.jd || '').trim();
  if (jd.length > 40) { kw = keywordMatch(jd, r); add('keywords', `Job-description keyword match ${kw.pct} %`, 17, 17 * kw.pct / 100, `${kw.matched.length} of ${kw.kws.length} extracted keywords appear in your resume.`, 'skills', 'Add missing keywords you genuinely have — to Skills, the summary or a bullet.'); }
  const max = checks.reduce((s, x) => s + x.max, 0), got = checks.reduce((s, x) => s + x.pts, 0);
  const score = Math.round(100 * got / max);
  return { checks, score, kw, hasJD: !!kw, got, max, verdict: score >= 80 ? 'Strong — ready to submit' : score >= 60 ? 'Good — a few quick fixes' : score >= 40 ? 'Needs work before applying' : 'Likely filtered out by an ATS' };
}
function sectionCountFor(r, type) { if (type === 'summary') return words(r.summary).length ? 1 : 0; if (type === 'skills') return r.skills.reduce((n, g) => n + g.items.length, 0); if (type === 'custom') return r.custom.items.length; return r[type].length; }

    <div><div class="verdict">${a.verdict}</div><div class="sub"><span>Structure &amp; content <b>${sg}/${sm}</b></span><div class="bar"><i id="barS"></i></div><span>Keyword match <b>${a.hasJD ? a.kw.pct + ' %' : 'paste a job description'}</b></span><div class="bar"><i id="barK"></i></div></div>

// ---------- bullet improver (rule-based) ----------
function pastOf(w) { // gerund or base verb → past tense
  const lw = w.toLowerCase(); let stem = lw.endsWith('ing') ? lw.slice(0, -3) : lw;
  if (IRREG[stem]) return IRREG[stem]; if (IRREG[stem + 'e']) return IRREG[stem + 'e'];
  if (/[^aeiou]y$/.test(stem)) return stem.slice(0, -1) + 'ied'; if (stem.endsWith('e')) return stem + 'd'; return stem + 'ed';
}
function suggestBullet(text) {
  const out = []; let s = text.trim().replace(/^[-•*]\s*/, '').replace(/\s+/g, ' ');
  if (!s) return out;
  const low = s.toLowerCase(), fw = firstWord(s), weak = weakStart(s);
  let up = null; // the sentence after the verb upgrade (drives the other suggestions)
  if (weak) { up = s; for (let pass = 0, wk = weak; pass < 2 && wk; pass++, wk = weakStart(up)) { let rest = up.slice(wk[0].length).trim(); let inf = / to$/.test(wk[0]); if (/^to\s/i.test(rest)) { rest = rest.slice(3); inf = true; } const w0 = rest.split(' ')[0] || ''; up = inf || /ing$/i.test(w0) ? cap(pastOf(w0)) + rest.slice(w0.length) : `${wk[1]} ${rest}`; }
    out.push(['Stronger opening verb', up, `“${weak[0]}” tells the parser nothing — lead with what you did.`]); }
  else if (UPGRADE[fw]) { up = UPGRADE[fw] + s.slice(s.indexOf(' ')); out.push(['Stronger opening verb', up, `“${cap(fw)}” is weak; “${UPGRADE[fw]}” reads as ownership.`]); }
  else if (!STRONG.has(fw) && !/^\d/.test(s)) { up = `Delivered ${s[0].toLowerCase()}${s.slice(1)}`; out.push(['Start with an action verb', up, 'Bullets that open with a verb are easier to parse and skim.']); }
  const core = (up || s).replace(/[.;]\s*$/, '');
  if (!/\d/.test(s)) { const metric = /reduc|cut|decreas|lower|fix|resolv|debug/i.test(s) ? 'reducing [errors/time] by X %' : /improv|increas|boost|grow|speed|optimi/i.test(s) ? 'improving [metric] by X %' : /user|customer|student|client|farmer|team|people/i.test(s) ? 'used by N+ [people]' : 'saving X hours per week'; out.push(['Add a measurable result', `${core}, ${metric}`, 'Replace X/N with a real number — ranges and estimates are fine.']); }
  const already = STRONG.has(fw) && /\d/.test(s) && words(s).length >= 8;
  if (!already) { const cw = core.split(' ')[0]; out.push(['STAR rewrite', `${cw} ${core.slice(cw.length + 1)} for [team/client], to [goal], achieving [result with a number]`, 'Situation → Task → Action → Result in one line; delete the brackets you cannot fill.']); }
  if (/\b(i|my|me|we|our|myself)\b/i.test(s)) out.push(['Remove first person', cap(s.replace(/\b(i|my|me|we|our|myself)\b\s*/gi, '').replace(/\s+/g, ' ').trim()), 'Resumes are written in implied first person — no “I” or “we”.']);
  if (words(s).length > 30) { const cut = Math.max(s.lastIndexOf('; '), s.lastIndexOf(', and '), s.lastIndexOf(' and ')); if (cut > 20) out.push(['Split into two bullets', s.slice(0, cut).trim() + '\n' + cap(s.slice(cut).replace(/^[;,]?\s*and\s*/, '').trim()), 'Long bullets wrap to three lines and get skimmed past.']); }
  if (s[0] !== s[0].toUpperCase() || /\s[.]$/.test(s) || /\.\s*$/.test(s) !== /\.\s*$/.test(allBullets()[0] || '.')) out.push(['Tidy capitalisation & punctuation', cap(s).replace(/\s+([.,;])/g, '$1').replace(/\.\s*$/, ''), 'Consistent casing and no trailing full stops across all bullets.']);
  return out;
}
function openImprover(path, i) {
  const list = getPath(R, path), text = list[i] || '', sug = suggestBullet(text);
  modalOpen(`<h2>${ic('sparkles')} Improve bullet <button class="ib" data-close aria-label="Close">${ic('x')}</button></h2>
    <div class="orig">${text ? esc(text) : '<i>Empty bullet — type something first.</i>'}</div>
    ${sug.map(([lab, t, note], k) => `<div class="sug"><div class="lab">${esc(lab)}</div><p>${esc(t).replace(/\n/g, '<br>')}</p><div class="muted" style="font-size:.8rem;margin-bottom:8px">${esc(note)}</div><button class="btn sm acc" data-apply="${k}">${ic('check')} Apply</button></div>`).join('') || (text ? `<div class="note" style="margin-top:12px">${ic('check-circle')} This bullet already starts with a strong verb, includes a number and is a good length.</div>` : '')}
    <div class="todo" style="margin-top:14px"><h4>${ic('lightbulb')} Rewrite with AI <span class="tag">student extension</span></h4><div class="muted" style="font-size:.85rem">Bring-your-own-API-key adapter: send the bullet + job title to an LLM and show 3 variants here. Stub: <code>aiRewrite()</code>.</div><button class="btn sm ghost" style="margin-top:8px" data-ai>${ic('sparkles')} Rewrite with AI</button></div>`);
  $('#modal').onclick = e => {
    const ap = e.target.closest('[data-apply]'); if (ap) { const t = sug[+ap.dataset.apply][1]; const parts = t.split('\n'); list.splice(i, 1, ...parts); changed(); renderEditor(`[data-b="${path}.${i}"]`); modalClose(); toast('Bullet updated', 'ok'); }
    if (e.target.closest('[data-ai]')) aiRewrite(text);
  };
}

// ---------- modals ----------
function modalOpen(html) { $('#modal').innerHTML = html; $('#mscrim').classList.add('open'); setTimeout(() => ($('#modal input,#modal textarea,#modal button') || {}).focus?.(), 30); }
function modalClose() { $('#mscrim').classList.remove('open'); $('#modal').onclick = null; }
$('#mscrim').addEventListener('click', e => { if (e.target === e.currentTarget || e.target.closest('[data-close]')) modalClose(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#mscrim').classList.contains('open')) modalClose(); else if (document.body.classList.contains('drawer-open')) location.hash = '#edit'; $$('.pop').forEach(p => p.classList.remove('open')); } });
function confirmModal(title, body, onOk) { modalOpen(`<h2>${ic('alert-circle')} ${esc(title)}</h2><p class="muted" style="margin:10px 0 0">${esc(body)}</p><div class="mactions"><button class="btn ghost" data-close>Cancel</button><button class="btn danger" id="mOk">Confirm</button></div>`); $('#mOk').onclick = () => { modalClose(); onOk(); }; }
function promptModal(title, val, onOk) { modalOpen(`<h2>${ic('edit')} ${esc(title)}</h2><input type="text" id="mIn" value="${esc(val)}" style="margin-top:12px" aria-label="${esc(title)}"><div class="mactions"><button class="btn ghost" data-close>Cancel</button><button class="btn acc" id="mOk">Save</button></div>`); const ok = () => { modalClose(); onOk($('#mIn').value); }; $('#mOk').onclick = ok; $('#mIn').onkeydown = e => { if (e.key === 'Enter') ok(); }; }
function textModal(title, text) { modalOpen(`<h2>${ic('copy')} ${esc(title)} <button class="ib" data-close aria-label="Close">${ic('x')}</button></h2><p class="muted" style="margin:8px 0">Clipboard access was blocked — select all and copy manually.</p><textarea rows="14" style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem">${esc(text)}</textarea>`); const t = $('#modal textarea'); t.focus(); t.select(); }

// ---------- cover letter ----------
const lcFirst = s => s ? s[0].toLowerCase() + s.slice(1) : s;
function genLetter(cl) {
  const c = R.contact, edu = R.education[0], exp = R.experience[0], proj = R.projects[0], skills = R.skills.flatMap(g => /soft/i.test(g.group) ? [] : g.items), kw = analysis?.kw?.matched?.slice(0, 4).map(k => k.k) || [];
  const job = cl.job || '[job title]', co = cl.company || '[company]';
  const p = [`Dear ${cl.manager || 'Hiring Manager'},`,
    `I am writing to apply for the ${job} position at ${co}${cl.source ? `, which I found on ${cl.source}` : ''}. ${edu ? `I ${/present|20[3-9]\d|2026-(0[7-9]|1\d)/.test(edu.end) && !edu.present ? 'am completing' : 'recently completed'} a ${edu.degree || '[degree]'} at ${edu.institute || '[institute]'}${edu.grade ? ` (${edu.grade})` : ''}, and I` : 'I'} bring hands-on experience in ${skills.slice(0, 4).join(', ') || '[your core skills]'}.`,
    exp ? `Most recently, as ${exp.role} at ${exp.company}, I ${lcFirst((exp.bullets || []).find(Boolean) || '[your main achievement]').replace(/\.?\s*$/, '')}.${(exp.bullets || []).filter(Boolean)[1] ? ` I also ${lcFirst(exp.bullets.filter(Boolean)[1]).replace(/\.?\s*$/, '')}.` : ''}` : null,
    proj ? `For my final year project, ${proj.name.replace(/\s*—.*$/, '')}${proj.stack ? ` (${proj.stack})` : ''}, I ${lcFirst((proj.bullets || []).find(Boolean) || '[what you built and its impact]').replace(/\.?\s*$/, '')}. That experience of shipping something real for real users is what I want to bring to ${co}.` : null,
    `What draws me to ${co} is [one specific sentence about the company, team or product — edit me]. The role's emphasis on ${(kw.length ? kw : skills.slice(4, 6)).join(', ') || '[two skills from the job ad]'} matches the work I enjoy most, and I learn quickly in collaborative, code-reviewed teams.`,
    `I would welcome the chance to discuss how I can contribute to ${co}. Thank you for your time and consideration.`,
    `Sincerely,\n${c.name || '[Your name]'}\n${[c.phone, c.email].filter(Boolean).join(' · ')}`].filter(Boolean);
  return p.join('\n\n');
}
function renderCover() {
  const cl = R.cover || (R.cover = { job: '', company: '', manager: '', source: '', body: '' }); if (!cl.body) cl.body = genLetter(cl);
  const v = $('#view-cover');
  v.innerHTML = `<div class="form"><div class="ehead"><h2>Cover letter</h2><span class="saved muted" style="font-size:.78rem">filled from “${esc(R.name)}”</span></div>
    <div class="panel"><div class="fields">${fieldHTML('cover.job', 'Job title', cl.job)}${fieldHTML('cover.company', 'Company', cl.company)}${fieldHTML('cover.manager', 'Hiring manager (optional)', cl.manager)}${fieldHTML('cover.source', 'Where you saw the ad', cl.source)}</div>
    <div class="addrow"><button class="btn acc" id="clGen">${ic('refresh')} Regenerate from resume</button><button class="btn ghost" id="clPrint">${ic('printer')} Print / PDF</button><button class="btn ghost" id="clCopy">${ic('copy')} Copy</button></div>
    <div class="note" style="margin-top:12px">Placeholders in <b>[brackets]</b> need your own words — especially the sentence about why this company. Keep it under one page; Pakistani employers increasingly read letters in the email body, so the Copy button gives plain text.</div></div>
    <div class="panel" style="margin-top:12px"><div class="f"><label for="clBody">Letter body (editable)</label><textarea id="clBody" class="grow" rows="16" data-cl="body">${esc(cl.body)}</textarea></div></div></div>
    <div class="pv"><article class="letter ${R.paper === 'letter' ? 'letterpaper' : ''}" id="letter" style="--acc:${ACCENTS[R.accent]}"></article></div>`;
  renderLetter(); animateIn($('.form', v)); $$('textarea.grow', v).forEach(autoGrow);
  v.addEventListener('input', e => { const el = e.target; if (el.dataset.b) { setPath(R, el.dataset.b, el.value); saveSoon(); } if (el.dataset.cl) { cl.body = el.value; saveSoon(); } if (el.classList.contains('grow')) autoGrow(el); renderLetter(); });
  $('#clGen').onclick = () => { cl.body = genLetter(cl); $('#clBody').value = cl.body; autoGrow($('#clBody')); saveSoon(); renderLetter(); toast('Letter regenerated from your resume', 'ok'); };
  $('#clPrint').onclick = () => printPage('cover');
  $('#clCopy').onclick = () => copyText(cl.body, 'Cover letter');
}
function renderLetter() {
  const c = R.contact, cl = R.cover, paras = cl.body.split(/\n{2,}/);
  $('#letter').innerHTML = `<div class="lh"><b>${esc(c.name) || 'Your Name'}</b><div>${contactBits(c).map(esc).join(' · ')}</div></div>
    <p>${TODAY.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}</p>
    <p>${[cl.manager, cl.company ? `${esc(cl.company)}` : '', cl.job ? `Re: ${esc(cl.job)}` : ''].filter(Boolean).map(esc).join('\n')}</p>
    ${paras.map((p, i) => `<p class="${i === paras.length - 1 ? 'sig' : ''}">${esc(p)}</p>`).join('')}`;
}

  ['AI bullet rewriting (bring-your-own API key)', 'AI', 'Adapter in aiRewrite(): send bullet + job title, render 3 variants as suggestion cards; keep the rule engine as offline fallback.', '★★'],
  ['DOCX export with real Word heading styles', 'export', 'exportDocx(): generate document.xml from blocks() and zip it; ATS parsers read Word styles better than PDF text runs.', '★★★'],
  ['LinkedIn / JSON Resume import', 'import', 'importJsonResume(): map basics/work/education/skills; parse the LinkedIn data-export ZIP.', '★★'],
  ['Backend accounts with sharing links', 'backend', 'shareLink(): REST API + auth, signed read-only URLs that render the same resumeHTML() server-side.', '★★★'],
  ['Recruiter view with annotations', 'collab', 'A read-only route (#r/<id>) where a mentor highlights text and leaves comments stored against bullet ids.', '★★'],
  ['Urdu / bilingual CV mode', 'i18n', 'renderResume(): mirror headings in Nastaliq, RTL blocks, bilingual template for public-sector and NGO jobs.', '★★'],
  ['Synonym-aware keyword matching', 'ATS', 'keywordMatch(): stemming (Porter), a tech-synonym table (JS ↔ JavaScript, Postgres ↔ PostgreSQL) or small embeddings.', '★★']
];
function renderAbout() {
  $('#view-about').innerHTML = `<div class="wrap"><div>
    <div class="panel"><h2>About this project</h2><p>Fresh graduates in Pakistan apply with designer templates full of tables, icons and photos that applicant-tracking systems (ATS) cannot parse, add a CNIC number and marital status, and never tailor keywords to the job ad — so strong candidates are filtered out before a human reads the CV.</p>
      <h3>How it works</h3><p>Everything is one HTML file with vanilla JavaScript. The resume is a plain JSON model; <code>blocks()</code> shapes it once and three renderers produce the A4 preview (HTML), the plain-text export and Markdown. Four templates are ATS-safe by construction: real headings, a single linear DOM, no tables or text-in-images, print CSS with <code>@page</code> margins. The ATS score runs ${analysis ? analysis.checks.length : 10}+ rule checks plus a keyword match: the job description is tokenised, stop-words removed, 1- and 2-grams counted by frequency and compared with the resume text (plural-insensitive).</p>
      <h3>Pakistani context</h3><p>Local CV habits that hurt in ATS pipelines — photo, CNIC, father's name, date of birth, religion, marital status — are flagged explicitly; phone is pre-formatted +92; sample data mirrors a FAST/NUST/UET-style degree with an FYP and an internship; the cover letter has a copy-as-text path because many local employers read letters in the email body.</p>
      <h3>ATS checks and weights</h3><table><tr><th>Check</th><th>Points</th></tr>${(analysis || analyse()).checks.map(c => `<tr><td>${esc(c.title.replace(/ \d+ %$/, '').replace(/^Length:.*/, 'Length vs years of experience'))}</td><td>${c.max}</td></tr>`).join('')}${(analysis || {}).hasJD ? '' : '<tr><td>Job-description keyword match (after pasting an ad)</td><td>17</td></tr>'}</table>
      <h3>Data &amp; privacy</h3><p>All resumes live in this browser's <code>localStorage</code> under the <code>cvb:</code> prefix — nothing is uploaded anywhere. Export JSON to move between devices. The sample person is fictional.</p></div></div>
    <div><h3 style="margin:4px 0 10px;font-family:var(--serif);font-size:1.2rem;font-weight:600">Left for students to build</h3><div class="list stagger">${TODOS.map(([h, tag, hint, d]) => `<div class="todo"><h4>${esc(h)} <span class="tag">${tag}</span><span class="muted" style="font-size:.8rem">${d}</span></h4><div class="muted" style="font-size:.86rem">${esc(hint)}</div></div>`).join('')}</div>
    <div class="note" style="margin-top:14px">Search the source for <code>TODO(student)</code> to find the exact stub points.</div></div></div>`;
  animateIn($('#view-about'));
}

// ---------- router ----------
function route() {
  const page = (location.hash.slice(1) || 'edit').split('?')[0];
  if (page.startsWith('r/')) return recruiterView(page.slice(2));
  const p = ['edit', 'ats', 'cover', 'about'].includes(page) ? page : 'edit';
  document.body.dataset.page = p;
  $('#view-edit').classList.toggle('hidden', !(p === 'edit' || p === 'ats'));
  $('#view-cover').classList.toggle('hidden', p !== 'cover');
  $('#view-about').classList.toggle('hidden', p !== 'about');
  $('#coverLink').href = p === 'cover' ? '#edit' : '#cover';
  $('#coverLink').innerHTML = p === 'cover' ? `${ic('edit')}<span class="t">Back to editor</span>` : `${ic('mail')}<span class="t">Cover letter</span>`;
  if (p === 'ats') openDrawer(); else closeDrawer();
  if (p === 'cover') renderCover();
  if (p === 'about') renderAbout();
  if (p === 'edit' || p === 'ats') applyZoom();
}
