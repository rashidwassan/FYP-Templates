<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board Exam Revision Planner</title>
<meta name="description" content="Week-by-week revision planner for Matric and FSc board exams: past-paper weightage heatmaps per board, an interleaving planner, Pomodoro timer, spaced-repetition reviews, flashcards, mock exams, a datesheet with exam-day checklist, printable reports and a readiness score. Single-file FYP template.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens: indigo / violet on warm off-white ---------- */
:root{
  --bg:#faf9ff; --surface:#ffffff; --surface-2:#f3f2fb; --ink:#1e1b3a; --muted:#6b6a85; --line:#e6e4f2;
  --p:#4f46e5; --p2:#7c3aed; --p-soft:#eef2ff; --p-deep:#3730a3; --p-line:#c7d2fe; --grad:linear-gradient(135deg,#4f46e5,#7c3aed);
  --ok:#0f9d6e; --ok-soft:#e3f6ee; --warn:#d97706; --warn-soft:#fdf1dc; --bad:#dc2626; --bad-soft:#fde8e8; --vio-soft:#f3e8ff;
  --appbar:rgba(250,249,255,.9); --toast:#1e1b3a; --toast-ink:#fff; --tile-ink:#1e1b3a;
  --radius:16px; --radius-sm:10px; --shadow:0 12px 32px -20px rgba(30,27,58,.35);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --font-ur:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;
  --ease:cubic-bezier(.2,.8,.2,1); --dur:.35s;
}
html[data-theme=dark]{
  --bg:#0f0e1c; --surface:#181733; --surface-2:#211f40; --ink:#ebe9fb; --muted:#a09eba; --line:#2f2c52;
  --p-soft:#262456; --p-deep:#c7d2fe; --p-line:#4c4a8a; --ok-soft:#113425; --warn-soft:#3a2a10; --bad-soft:#3a1a1a; --vio-soft:#2d1f4a;
  --appbar:rgba(15,14,28,.88); --toast:#ebe9fb; --toast-ink:#1e1b3a; --shadow:0 12px 32px -20px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
body{transition:background .3s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.01em}
a{color:var(--p)}
code{font-size:.85em;background:var(--surface-2);padding:1px 5px;border-radius:5px}
.muted{color:var(--muted)} .hidden{display:none!important} .sm{font-size:.85rem} .spacer{flex:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ur,[lang=ur]{font-family:var(--font-ur);line-height:1.9}
html[lang=ur] .i18n{font-family:var(--font-ur);line-height:1.9;font-size:1.05em}
html[lang=ur] .rtl{direction:rtl;text-align:right}
.ic{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px;border-radius:6px}

/* ---------- Motion kit ---------- */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
html[data-motion=off] *,html[data-motion=off] *::before,html[data-motion=off] *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(79,70,229,.45)}70%{box-shadow:0 0 0 10px rgba(79,70,229,0)}}
.enter{animation:fadeUp var(--dur) var(--ease) both}
.stagger>*{animation:fadeUp .45s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.btn{transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s,border-color .15s}
.btn:hover{transform:translateY(-1px)} .btn:active{transform:translateY(0) scale(.98)}
.card,.tile,.sess{transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.fill,.bar>i{transition:width .6s var(--ease)}
.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite}

/* ---------- App bar ---------- */
.appbar{position:sticky;top:0;z-index:30;background:var(--appbar);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.appbar .row1{display:flex;align-items:center;gap:12px;padding:10px 20px;max-width:1440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}
.brand .mark{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 8px 18px -8px rgba(79,70,229,.7)}
.brand .mark svg{width:22px;height:22px}
.brand h1{font-size:1.05rem;font-weight:800;white-space:nowrap}
.brand .sub{font-size:.72rem;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.countdown{display:inline-flex;align-items:center;gap:8px;background:var(--grad);color:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:.9rem;box-shadow:0 10px 24px -12px rgba(79,70,229,.8);white-space:nowrap;text-decoration:none}
.countdown b{font-size:1.1rem;font-variant-numeric:tabular-nums}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;color:var(--ink);position:relative;flex:none;text-decoration:none}
.iconbtn:hover{border-color:var(--p-line);background:var(--p-soft)}
.iconbtn .badge,.seg .badge{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;font-size:.68rem;font-weight:800;min-width:18px;height:18px;border-radius:999px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.langbtn{height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:700;flex:none}
.langbtn .ur{font-size:1rem;line-height:1}
.row2{max-width:1440px;margin:0 auto;padding:0 20px 10px;display:flex;align-items:center;gap:10px}
.segwrap{overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.segwrap::-webkit-scrollbar{display:none}
.seg{display:inline-flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:2px;border:1px solid var(--line)}
.seg a{position:relative;display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.9rem;white-space:nowrap;min-height:40px;transition:background .2s,color .2s,box-shadow .2s}
.seg a:hover{color:var(--ink)}
.seg a.on{background:var(--surface);color:var(--p-deep);box-shadow:0 4px 12px -6px rgba(30,27,58,.3)}
.seg .badge{top:2px;right:2px}

/* ---------- Layout ---------- */
main{max-width:1440px;margin:0 auto;padding:18px 20px 60px}
.plan-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:0 1px 2px rgba(30,27,58,.04);min-width:0}
.panel h2{font-size:1.05rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h2 .ic{color:var(--p)}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;gap:12px;align-items:center;min-width:0}
.kpi .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--p-soft);color:var(--p);flex:none}
.kpi .ico .ic{width:1.3em;height:1.3em}
.kpi .v{font-size:1.45rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.78rem;color:var(--muted);font-weight:600}
.kpi.ok .ico{background:var(--ok-soft);color:var(--ok)} .kpi.warn .ico{background:var(--warn-soft);color:var(--warn)} .kpi.vio .ico{background:var(--vio-soft);color:var(--p2)} .kpi.bad .ico{background:var(--bad-soft);color:var(--bad)}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start}
.two.even{grid-template-columns:1fr 1fr}
.two>*{min-width:0}
.stack>*+*{margin-top:14px}
.tabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-weight:700;color:var(--muted);cursor:pointer;min-height:36px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tabs button.on{background:var(--surface);color:var(--p-deep);box-shadow:0 3px 10px -6px rgba(30,27,58,.3)}

/* ---------- Buttons & forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:.9rem;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--p-line);background:var(--p-soft)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 10px 22px -12px rgba(79,70,229,.9)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ok{background:var(--ok);color:#fff;border-color:transparent} .btn.danger{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)} .btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{min-height:34px;padding:0 10px;font-size:.82rem;border-radius:10px}
.btn.icon{width:40px;padding:0} .btn.icon.sm{width:34px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.78rem;font-weight:700;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;min-height:40px;border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:var(--surface);transition:border-color .15s,box-shadow .15s;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
input[type=range]{width:100%;accent-color:var(--p);min-height:40px}
textarea{resize:vertical;min-height:80px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px} .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px} .grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.8rem;font-weight:600;cursor:pointer;min-height:32px;transition:background .15s,border-color .15s;color:var(--ink)}
.chip.on{background:var(--p-soft);border-color:var(--p-line);color:var(--p-deep)}
.chip.static{cursor:default;background:var(--surface-2)}
.dayoffs{display:flex;gap:6px;flex-wrap:wrap}
.dayoffs .chip{min-width:44px;justify-content:center}
.switch{position:relative;width:46px;height:26px;border-radius:999px;background:var(--line);border:0;cursor:pointer;transition:background .2s;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch[aria-checked=true]{background:var(--p)} .switch[aria-checked=true]::after{transform:translateX(20px)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .t>b{display:block;font-size:.92rem} .setrow .t span{font-size:.8rem;color:var(--muted)}
.setrow select{width:auto;min-width:130px}
.kbd{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 7px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:var(--surface-2);font-family:inherit}

/* ---------- Week grid ---------- */
.weekbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.weekbar .title{font-weight:800;font-size:1.05rem;margin:0 6px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--surface-2);border:1px dashed var(--line);border-radius:14px;min-height:260px;padding:8px;display:flex;flex-direction:column;gap:7px;transition:background .15s,border-color .15s;min-width:0}
.day.today{background:var(--p-soft);border-color:var(--p-line)}
.day.off{background:repeating-linear-gradient(135deg,var(--surface-2) 0 8px,var(--line) 8px 16px)}
.day.past{opacity:.78}
.day.over{background:var(--p-soft);border-color:var(--p);border-style:solid}
.day .dh{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:2px 4px 6px}
.day .dh b{font-size:.9rem} .day.today .dh b{color:var(--p-deep)}
.day .dh .d{font-size:.75rem;color:var(--muted);font-weight:600}
.day .mins{font-size:.72rem;color:var(--muted);font-weight:700;text-align:center;padding-top:4px;margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:4px}
.day .mins .btn{min-height:28px;width:28px;border-radius:8px}
.sess{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sc,var(--p));border-radius:10px;padding:8px 9px;cursor:grab;position:relative;user-select:none;font-size:.82rem;line-height:1.3}
.sess:hover{transform:translateY(-2px);box-shadow:0 10px 20px -14px rgba(30,27,58,.5);border-color:var(--p-line);border-left-color:var(--sc,var(--p))}
.sess:active{cursor:grabbing}
.sess.dragging{opacity:.45}
.sess .s{font-size:.7rem;font-weight:800;color:var(--sc,var(--p));text-transform:uppercase;letter-spacing:.03em;display:flex;justify-content:space-between;gap:4px}
.sess .c{font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin:2px 0}
.sess .m{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:4px;justify-content:space-between}
.sess.done{background:var(--ok-soft)} .sess.done .c{text-decoration:line-through;color:var(--muted)}
.sess.skipped{opacity:.5} .sess.partial{background:var(--warn-soft)}
.sess.revision{border-left-style:double;border-left-width:6px}
.sess .tp{font-size:.62rem;font-weight:800;padding:1px 6px;border-radius:999px;background:var(--surface-2);color:var(--muted);text-transform:uppercase}
.sess .tp.extra{background:var(--warn-soft);color:var(--warn)} .sess .tp.revision{background:var(--vio-soft);color:var(--p2)} .sess .tp.custom{background:var(--ok-soft);color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:.9rem}
.empty .ic{width:2em;height:2em;color:var(--p-line);display:block;margin:0 auto 8px}

/* ---------- Today panel & timer ---------- */
.today .tdate{font-size:.8rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.timer{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0 6px}
.ring{position:relative;width:180px;height:180px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .bg{stroke:var(--surface-2)}
.ring .fg{stroke:url(#gradRing);transition:stroke-dashoffset .9s linear}
.ring .fg.brk{stroke:var(--ok)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .lbl b{font-size:2.1rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;display:block;line-height:1}
.ring .lbl span{font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.ring.running{animation:pulse 2s infinite;border-radius:50%}
.tctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tsess{font-size:.85rem;text-align:center;color:var(--muted);min-height:1.3em}
.tlist{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.trow .dot{width:10px;height:10px;border-radius:50%;background:var(--sc,var(--p));flex:none}
.trow .t{flex:1;min-width:0} .trow .t>b{display:block;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .t span{font-size:.75rem;color:var(--muted)}
.trow .tm{font-size:.72rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.trow.done{opacity:.6}
.miniring{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;background:var(--surface-2);margin-top:12px}
.miniring svg{width:54px;height:54px;transform:rotate(-90deg);flex:none}
.miniring circle{fill:none;stroke-width:6} .miniring .bg{stroke:var(--line)} .miniring .fg{stroke:var(--p);transition:stroke-dashoffset .9s var(--ease)}

/* ---------- Subjects, heatmap, rings ---------- */
.rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-bottom:16px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 8px;text-align:center}
.rcard svg{width:92px;height:92px;transform:rotate(-90deg)}
.rcard circle{fill:none;stroke-width:9} .rcard .bg{stroke:var(--surface-2)} .rcard .fg{transition:stroke-dashoffset 1s var(--ease)}
.rcard .wrap{position:relative;display:inline-block}
.rcard .num{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:1.1rem;font-variant-numeric:tabular-nums}
.rcard .nm{font-size:.8rem;font-weight:700;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard.all{background:var(--grad);color:#fff;border-color:transparent} .rcard.all .bg{stroke:rgba(255,255,255,.25)} .rcard.all .fg{stroke:#fff}
.subj{margin-bottom:14px}
.subj .sh{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.subj .sh .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;background:var(--sc)}
.subj .sh h3{font-size:1rem;flex:1;min-width:120px}
.bar{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;width:100%}
.bar>i{display:block;height:100%;background:var(--sc,var(--p));border-radius:999px;width:0}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.tile{border-radius:10px;padding:8px 9px;cursor:pointer;border:1px solid transparent;min-height:64px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;color:var(--tile-ink);text-align:left;background:var(--surface-2);font:inherit}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tile .muted{color:rgba(30,27,58,.6)}
.tile.dark{color:#fff} .tile.dark .muted{color:rgba(255,255,255,.75)}
.tile .n{font-size:.78rem;font-weight:600;line-height:1.25}
.tile .f{display:flex;justify-content:space-between;align-items:center;font-size:.7rem;font-weight:700}
.tile .ms{display:flex;gap:2px} .tile .ms i{width:7px;height:7px;border-radius:2px;background:currentColor;opacity:.25} .tile .ms i.on{opacity:1}
.legend{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);font-weight:600;flex-wrap:wrap}
.legend .sw{width:60px;height:8px;border-radius:4px;background:linear-gradient(90deg,#eef2ff,#4f46e5)}
.whatif{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.whatif .big{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.matrix{overflow-x:auto}
.matrix table{font-size:.8rem;min-width:520px}
.matrix td.c{text-align:center;font-weight:700;min-width:46px;color:var(--tile-ink)}
.matrix td.c.dark{color:#fff}
.matrix th.y{text-align:center}

/* ---------- Lists, charts, tables ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.row .t{flex:1;min-width:0} .row .t>b{display:block} .row .t span{font-size:.8rem;color:var(--muted)}
.row.overdue{border-color:#fecaca;background:var(--bad-soft)}
.rate{display:flex;gap:4px}
.rate button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:800;cursor:pointer;transition:background .15s,transform .15s;color:var(--ink)}
.rate button:hover{background:var(--p-soft);border-color:var(--p-line);transform:translateY(-1px)}
.rate button.on{background:var(--grad);color:#fff;border-color:transparent}
.chart{position:relative;width:100%}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--toast);color:var(--toast-ink);font-size:.75rem;padding:6px 9px;border-radius:8px;transform:translate(-50%,-115%);white-space:nowrap;display:none}
.chart rect.grow{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);transition:transform .7s var(--ease)}
.chart rect.grow.in{transform:scaleY(1)}
.hbar{display:grid;grid-template-columns:minmax(90px,160px) 1fr auto;gap:8px;align-items:center;font-size:.82rem;padding:3px 0}
.hbar .bar{height:10px}
.hbar .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)} th{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tag{display:inline-block;font-size:.68rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--p-soft);color:var(--p-deep);text-transform:uppercase;letter-spacing:.03em;vertical-align:middle}
.tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.vio{background:var(--vio-soft);color:var(--p2)}
.todo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.todo h4{font-size:.92rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.streak{display:flex;gap:4px;flex-wrap:wrap} .streak i{width:14px;height:14px;border-radius:4px;background:var(--surface-2)} .streak i.on{background:var(--p)} .streak i.hi{background:var(--p2)}
.scrollx{overflow-x:auto}

/* ---------- Flashcards ---------- */
.deck{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.deck:hover{border-color:var(--p-line);background:var(--p-soft)}
.deck.on{border-color:var(--p);background:var(--p-soft)}
.deck .t{flex:1;min-width:0} .deck .t>b{display:block;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .deck .t span{font-size:.75rem;color:var(--muted)}
.fcard{perspective:1200px;cursor:pointer;outline-offset:4px}
.fcard .inner{position:relative;width:100%;height:240px;transition:transform .5s var(--ease);transform-style:preserve-3d}
.fcard.flipped .inner{transform:rotateY(180deg)}
.fcard .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:34px 22px 22px;display:grid;place-items:center;text-align:center;font-size:1.05rem;font-weight:600;border:1px solid var(--line);background:var(--surface);overflow:auto}
.fcard .face.back{transform:rotateY(180deg);background:var(--p-soft);color:var(--p-deep)}
.fcard .face small{position:absolute;top:12px;left:16px;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.boxes{display:flex;gap:4px} .boxes i{flex:1;height:6px;border-radius:3px;background:var(--surface-2)} .boxes i.on{background:var(--p)}
.cardrow{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.cardrow .t{flex:1;min-width:0} .cardrow .t>b{display:block;font-size:.9rem} .cardrow .t span{font-size:.82rem;color:var(--muted)}

/* ---------- Mock exam ---------- */
.mockhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--p-soft);border:1px solid var(--p-line);margin-bottom:12px}
.bigtime{font-size:1.9rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--p-deep)}
.bigtime.low{color:var(--bad)}
.qsec{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 6px}
.qrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.qrow .qn{font-weight:800;color:var(--p-deep);background:var(--p-soft);border-radius:10px;height:36px;display:grid;place-items:center;font-size:.85rem}
.qrow .t{min-width:0} .qrow .t>b{display:block;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .qrow .t span{font-size:.75rem;color:var(--muted)}
.qrow .mk{display:flex;gap:4px;align-items:center}
.qrow .mk button{min-width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;color:var(--ink);font-size:.8rem;padding:0 8px}
.qrow .mk button.on{background:var(--grad);color:#fff;border-color:transparent}
.qrow .mk button.on.zero{background:var(--bad)}
.scorebig{font-size:2.4rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}

/* ---------- Datesheet & checklist ---------- */
.ds{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.ds.next{border-color:var(--p-line);background:var(--p-soft)}
.ds .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff}
.ds input[type=date]{width:auto;min-width:148px}
.ds .left{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;min-width:52px}
.ds .t{min-width:0} .ds .t>b{display:block;font-size:.9rem} .ds .t span{font-size:.75rem;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.check.done{opacity:.6} .check.done .lbl{text-decoration:line-through}
.check input{width:20px;height:20px;accent-color:var(--p);flex:none;margin:0}
.check .lbl{flex:1;min-width:0;font-size:.9rem}

/* ---------- Inbox & activity ---------- */
.note{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);align-items:flex-start}
.note.unread{border-color:var(--p-line);background:var(--p-soft)}
.note .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--p);flex:none}
.note.unread .ico{background:var(--surface)}
.note .t{flex:1;min-width:0} .note .t>b{display:block;font-size:.92rem} .note .t p{margin:2px 0 0;color:var(--muted);font-size:.86rem}
.note .when{font-size:.72rem;color:var(--muted);white-space:nowrap}
.actline{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.actline:last-child{border-bottom:0}
.actline .dot{width:10px;height:10px;border-radius:50%;background:var(--sc,var(--p));flex:none}
.actline .mins{margin-left:auto;font-weight:700;color:var(--muted);white-space:nowrap}
.dayhead{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 4px}

/* ---------- Reports ---------- */
.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;min-width:0}
.report .rh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--p);padding-bottom:12px;margin-bottom:14px}
.report .rh h2{font-size:1.25rem}
.report h3{font-size:.95rem;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.report h3 .ic{color:var(--p)}
.report .chart{max-width:880px}
.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.stat .v{font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums} .stat .l{font-size:.75rem;color:var(--muted);font-weight:600}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:34px}
.sign div{border-top:1px solid var(--ink);padding-top:6px;font-size:.8rem;color:var(--muted)}

/* ---------- Search, tour ---------- */
.search input{font-size:1.05rem;min-height:46px}
.sres{display:flex;flex-direction:column;gap:4px;margin-top:10px;max-height:52vh;overflow:auto}
.sres button{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;min-height:42px;color:inherit;font:inherit;width:100%}
.sres button:hover,.sres button:focus{background:var(--p-soft);border-color:var(--p-line)}
.sres .t{flex:1;min-width:0} .sres .t>b{display:block;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .sres .t span{font-size:.75rem;color:var(--muted)}
.spot{position:fixed;z-index:70;border-radius:14px;box-shadow:0 0 0 9999px rgba(30,27,58,.62);pointer-events:none;transition:top .3s var(--ease),left .3s var(--ease),width .3s var(--ease),height .3s var(--ease)}
.tourtip{position:fixed;z-index:71;background:var(--surface);color:var(--ink);border-radius:16px;padding:16px;width:min(340px,calc(100vw - 32px));box-shadow:0 30px 60px -20px rgba(0,0,0,.5);animation:pop .25s var(--ease);border:1px solid var(--line)}
.tourtip h3{font-size:1rem;margin-bottom:6px;display:flex;align-items:center;gap:8px} .tourtip h3 .ic{color:var(--p)}
.tourtip p{margin:0 0 12px;color:var(--muted);font-size:.9rem}
.tourtip .tf{display:flex;align-items:center;gap:8px}
.tourtip .dots{display:flex;gap:5px;flex:1} .tourtip .dots i{width:7px;height:7px;border-radius:50%;background:var(--line)} .tourtip .dots i.on{background:var(--p)}

/* ---------- Modal, toasts ---------- */
.scrim{position:fixed;inset:0;background:rgba(30,27,58,.45);z-index:60;display:none;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s}
.scrim.open{display:flex}
.modal{background:var(--surface);border-radius:20px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:20px;box-shadow:0 40px 80px -30px rgba(30,27,58,.6);animation:pop .25s var(--ease)}
.modal.wide{width:min(760px,100%)}
.modal .mh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.modal h2{font-size:1.15rem}
.modal .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--toast);color:var(--toast-ink);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:fadeUp .3s var(--ease),toastOut .4s ease 2.9s both;display:flex;align-items:center;gap:8px;max-width:100%}
.toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast.ok{background:var(--ok);color:#fff} .toast.bad{background:var(--bad);color:#fff}

/* ---------- Responsive ---------- */
@media (max-width:1100px){.plan-layout{grid-template-columns:minmax(0,1fr) 300px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.two.even{grid-template-columns:1fr}.statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid4{grid-template-columns:1fr 1fr}}
@media (max-width:860px){
  .appbar .row1{padding:10px 16px;gap:8px} .row2{padding:0 16px 10px} main{padding:14px 16px 70px}
  .brand h1{font-size:.95rem} .brand .sub{display:none} .countdown{padding:6px 11px;font-size:.8rem} .countdown b{font-size:1rem}
  .plan-layout{grid-template-columns:1fr} .today{order:-1}
  .week{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding-bottom:8px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:thin}
  .day{flex:0 0 82vw;scroll-snap-align:start;min-height:200px}
  .grid3{grid-template-columns:1fr 1fr} .whatif{grid-template-columns:1fr}
  .heat{grid-template-columns:repeat(2,minmax(0,1fr))} .rings{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hbar{grid-template-columns:minmax(70px,110px) 1fr auto}
  .ds{grid-template-columns:auto minmax(0,1fr) auto} .ds .left{grid-column:3} .ds input[type=date]{grid-column:2/4}
  .qrow{grid-template-columns:38px 1fr;row-gap:6px} .qrow .mk{grid-column:1/3;justify-content:flex-end}
  .report{padding:16px} .sign{gap:16px}
}
@media (max-width:480px){
  .grid2,.grid3,.grid4{grid-template-columns:1fr} .kpis{gap:8px} .kpi{padding:10px 12px} .kpi .v{font-size:1.2rem} .rings{grid-template-columns:repeat(2,minmax(0,1fr))}
  .countdown span.i18n{display:none} .brand h1{font-size:.9rem} .appbar .row1{gap:6px}
  .statgrid{grid-template-columns:1fr 1fr} .fcard .inner{height:220px} .rate button{width:36px;height:36px}
}
@media print{
  .appbar,.today,.kpis,.weekbar .btn,#toasts,.scrim,.noprint,.spot,.tourtip{display:none!important}
  body{background:#fff;color:#000} main{padding:0;max-width:none} .plan-layout,.two{display:block}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:0;padding:0} .day{min-height:0;break-inside:avoid;border:1px solid #bbb;background:#fff!important;flex:none}
  .sess{box-shadow:none;border:1px solid #ccc;border-left:4px solid var(--sc,#444);font-size:.72rem}
  .panel,.report{border:none;box-shadow:none;padding:0;break-inside:avoid}
  .report .rh{border-bottom:2px solid #000}
  .printonly{display:block!important}
  .stat,.day,.qrow,.ds,.row,.note{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.printonly{display:none}
</style>

<script>
'use strict';
/* =====================================================================
   Board Exam Revision Planner — single-file app
   Sections: utils · i18n · syllabus seed · boards & paper bank · flashcard seed ·
             state & demo seed · planner algorithm · spaced repetition · readiness ·
             inbox · modal · Pomodoro timer · session modals · Plan view · Subjects view ·
             Revise view · Cards view · Mock exam · Papers view · Exams (datesheet) ·
             Reports · Inbox view · Settings · About · tour · search · router
   Student extension points are marked with  TODO(student)
   ===================================================================== */

// ---------- utils ----------
const NS = 'berp:';
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

// Namespaced localStorage wrapper. Every key is prefixed with NS so the app
// never collides with other templates opened from the same origin.
const store = {
  get(key, fallback) {
    try {
      const raw = localStorage.getItem(NS + key);
      return raw == null ? fallback : JSON.parse(raw);
    } catch {
      return fallback;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(NS + key, JSON.stringify(value));
    } catch {
      /* quota exceeded or storage disabled: the app keeps working in memory */
    }
  },
  del(key) {
    try {
      localStorage.removeItem(NS + key);
    } catch {
      /* ignore */
    }
  },
  keys() {
    const out = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(NS)) out.push(k.slice(NS.length));
      }
    } catch {
      /* ignore */
    }
    return out;
  },
  bytes() {
    let n = 0;
    this.keys().forEach(k => {
      n += (localStorage.getItem(NS + k) || '').length + k.length;
    });
    return n;
  }
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const ic = (name, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const r1 = v => Math.round(v * 10) / 10;
const pad2 = n => String(n).padStart(2, '0');
const sum = arr => arr.reduce((a, b) => a + b, 0);
const fill = (str, params = {}) => String(str).replace(/\{(\w+)\}/g, (_, k) => (params[k] ?? ''));

// Deterministic helpers: a string hash and a tiny seeded PRNG (mulberry32) so the
// seeded paper bank and mock papers are reproducible from a seed.
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Dates are handled as ISO strings (YYYY-MM-DD) in local time.
const iso = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const fromIso = s => {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
};
const addDays = (s, n) => {
  const d = fromIso(s);
  d.setDate(d.getDate() + n);
  return iso(d);
};
const todayIso = () => iso(new Date());
const daysBetween = (a, b) => Math.round((fromIso(b) - fromIso(a)) / 864e5);
const dow = s => fromIso(s).getDay(); // 0 = Sunday
const mondayOf = s => addDays(s, -((dow(s) + 6) % 7));
const DAYN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DAYN_UR = ['اتوار', 'پیر', 'منگل', 'بدھ', 'جمعرات', 'جمعہ', 'ہفتہ'];
const dayName = s => (lang === 'ur' ? DAYN_UR : DAYN)[dow(s)];
const fmtD = (s, opts = { day: 'numeric', month: 'short' }) => fromIso(s).toLocaleDateString(lang === 'ur' ? 'ur-PK' : 'en-PK', opts);
const fmtDT = ms => new Date(ms).toLocaleString(lang === 'ur' ? 'ur-PK' : 'en-PK', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const fmtMin = m => (m >= 60 ? `${Math.floor(m / 60)}h${m % 60 ? ' ' + (m % 60) + 'm' : ''}` : `${m}m`);
const fmtClock = mins => `${pad2(Math.floor(mins / 60) % 24)}:${pad2(mins % 60)}`;
const fmtT = s => `${pad2(Math.floor(s / 60))}:${pad2(s % 60)}`;

// Toasts
function toast(msg, type = '', icon) {
  const iconName = icon || (type === 'ok' ? 'check-circle' : type === 'bad' ? 'alert-circle' : 'info');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = ic(iconName) + '<span></span>';
  $('span', el).textContent = msg;
  $('#toasts').append(el);
  setTimeout(() => el.remove(), 3400);
}

// Motion helpers (see KIT.md)
const animateIn = root => {
  root.classList.remove('enter');
  void root.offsetWidth;
  root.classList.add('enter');
  $$('.stagger', root).forEach(group => [...group.children].forEach((el, i) => el.style.setProperty('--i', i)));
};
function countUp(el, to, { dur = 700, fmt = v => Math.round(v).toLocaleString('en-PK') } = {}) {
  if (!el) return;
  const t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(to * eased);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function drawPath(p) {
  if (!p) return;
  const L = p.getTotalLength();
  p.style.strokeDasharray = L;
  p.style.strokeDashoffset = L;
  p.getBoundingClientRect();
  p.style.transition = 'stroke-dashoffset .9s var(--ease)';
  p.style.strokeDashoffset = 0;
}
function ringSet(el, frac) {
  if (!el) return;
  const C = 2 * Math.PI * +el.getAttribute('r');
  el.style.strokeDasharray = C;
  el.getBoundingClientRect();
  el.style.strokeDashoffset = C * (1 - clamp(frac, 0, 1));
}
function growBars(root) {
  requestAnimationFrame(() => {
    $$('[data-w]', root).forEach(el => {
      if (el.tagName === 'I') el.style.width = el.dataset.w + '%';
    });
    $$('rect.grow', root).forEach(r => r.classList.add('in'));
  });
}
function download(name, text, type = 'text/plain') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---------- seeded past-paper bank ----------
// Five years of "tagged" papers per subject and board. Each paper distributes the theory
// total across chapters: base weightage x a province emphasis (stable per province) x a
// yearly jitter (stable per board + year). Everything derives from hashes, so the bank is
// identical on every device without storing it. bankWeight() is the default heatmap value.
const BANK_YEARS = [2021, 2022, 2023, 2024, 2025];
const bankCache = new Map();
const subjClass = id => +(id.match(/\d+$/) || [10])[0];
const isScienceSubj = id => /^(phy|chem|bio|cs|gsci)/.test(id);
function paperTotal(subjId) {
  const cls = subjClass(subjId);
  if (isScienceSubj(subjId)) return cls >= 11 ? 85 : 60;
  if (/^(math|gmath|bmath|stat)/.test(subjId)) return cls >= 11 ? 100 : 75;
  return cls >= 11 ? 100 : 75;
}
function hashUnit(key) {
  return hashStr(key) / 4294967295; // 0..1
}
function distributeMarks(subj, boardId, year) {
  const prov = boardById(boardId).prov;
  const total = paperTotal(subj.id);
  const raw = subj.ch.map(c => {
    const emphasis = 0.85 + 0.3 * hashUnit(prov + '|' + c.id);
    const jitter = 0.8 + 0.4 * hashUnit(boardId + '|' + year + '|' + c.id);
    return c.w * emphasis * jitter;
  });
  const rawSum = sum(raw) || 1;
  const marks = raw.map(v => Math.max(1, Math.round((v / rawSum) * total)));
  // fix rounding so the paper adds up to the theory total
  let diff = total - sum(marks);
  let i = 0;
  while (diff !== 0 && i < 500) {
    const idx = i % marks.length;
    if (diff > 0) {
      marks[idx]++;
      diff--;
    } else if (marks[idx] > 1) {
      marks[idx]--;
      diff++;
    }
    i++;
  }
  const byCh = {};
  subj.ch.forEach((c, k) => {
    byCh[c.id] = marks[k];
  });
  return { year, total, marks: byCh };
}
function paperBank(subjId, boardId) {
  const key = subjId + '|' + boardId;
  if (bankCache.has(key)) return bankCache.get(key);
  const subj = SUBJ[subjId];
  const papers = subj ? BANK_YEARS.map(y => distributeMarks(subj, boardId, y)) : [];
  bankCache.set(key, papers);
  return papers;
}
function bankWeight(c) {
  const bank = paperBank(c.subj || c.id.split(':')[0], settings.board);
  if (!bank.length) return c.w;
  const shares = bank.map(p => (p.marks[c.id] / p.total) * 100);
  return Math.round(sum(shares) / shares.length);
}

// ---------- derived accessors ----------
const subjects = () => (COMBOS[`${settings.cls}-${settings.stream}`] || COMBOS['12-premed']).map(id => SUBJ[id]);
const subjById = id => SUBJ[id] || subjects()[0];
const subjName = s => (lang === 'ur' ? s.ur : s.name);
const chapters = () => subjects().flatMap(s => s.ch.map(c => ({ ...c, subj: s.id, sname: s.name, color: s.color })));
function chById(id) {
  const sid = String(id).split(':')[0];
  const s = SUBJ[sid];
  if (!s) return null;
  const c = s.ch.find(x => x.id === id);
  return c ? { ...c, subj: sid, sname: s.name, color: s.color } : null;
}
const W = c => overrides[c.id]?.w ?? bankWeight(c); // weightage % for the selected board (editable)
const D = c => overrides[c.id]?.d ?? c.d; // difficulty 1-5 (editable)
const M = c => mastery[c.id] ?? 0; // mastery 0-5
const setMastery = (id, v) => {
  mastery[id] = clamp(r1(v), 0, 5);
};
const weakCount = id => papers.reduce((n, p) => n + (p.weak.includes(id) ? 1 : 0), 0);
const sessLen = () => settings.pomo * 2; // one planner session = 2 pomodoros
const isWeekend = d => [0, 6].includes(dow(d));
const capacity = d => (settings.daysOff.includes(dow(d)) ? 0 : (isWeekend(d) ? settings.hrsWe : settings.hrsWd) * 60);
const sessionsOn = d => plan.sessions.filter(s => s.date === d);

// ---------- planner algorithm ----------
// priority = weightage x difficulty x (1 - mastery/5) x weak-chapter boost from logged papers
const priority = c => W(c) * D(c) * (1 - M(c) / 5) * (1 + 0.25 * weakCount(c.id));

function buildDays(today, exam) {
  const total = daysBetween(today, exam);
  const len = sessLen();
  return Array.from({ length: Math.max(0, total) }, (_, i) => {
    const date = addDays(today, i);
    return { date, slots: Math.floor(capacity(date) / len), revision: total - i <= 7 };
  });
}

// Share the study slots between chapters by priority and build one queue per subject.
// Chapters are pushed round-robin so a heavy chapter recurs instead of being crammed together.
function buildQueues(slotCount) {
  const scored = chapters().map(c => ({ c, p: priority(c) }));
  const sumP = sum(scored.map(x => x.p)) || 1;
  scored.forEach(x => {
    x.n = x.p > 0 ? Math.max(1, Math.round((slotCount * x.p) / sumP)) : 0;
  });
  scored.sort((a, b) => b.p - a.p);
  const queues = Object.fromEntries(subjects().map(s => [s.id, []]));
  const rounds = Math.max(0, ...scored.map(x => x.n));
  for (let r = 0; r < rounds; r++) {
    scored.forEach(x => {
      if (x.n > r) queues[x.c.subj].push(x.c);
    });
  }
  return queues;
}

const makeSession = (date, c, type, mins) => ({ id: uid(), date, subj: c.subj, ch: c.id, mins, type, status: 'todo', conf: null });

// Fill each study day: pick the subject with the most remaining demand, at most two sessions
// of one subject per day. The first session of a paper-flagged weak chapter is tagged "extra".
function fillStudyDays(studyDays, queues) {
  const out = [];
  const weakSeen = new Set();
  const len = sessLen();
  studyDays.forEach(day => {
    const used = {};
    for (let k = 0; k < day.slots; k++) {
      const cands = Object.keys(queues).filter(id => queues[id].length && (used[id] || 0) < 2);
      if (!cands.length) break;
      cands.sort((a, b) => queues[b].length - queues[a].length);
      const c = queues[cands[0]].shift();
      used[c.subj] = (used[c.subj] || 0) + 1;
      let type = 'study';
      if (weakCount(c.id) && !weakSeen.has(c.id)) {
        type = 'extra';
        weakSeen.add(c.id);
      }
      out.push(makeSession(day.date, c, type, len));
    }
  });
  return out;
}

// Last 7 days: revision only, highest weightage first, still interleaved across subjects.
function fillRevisionDays(revDays) {
  const out = [];
  const len = sessLen();
  const order = [...chapters()].sort((a, b) => W(b) * (1 - M(b) / 6) - W(a) * (1 - M(a) / 6));
  if (!order.length) return out;
  let ri = 0;
  revDays.forEach(day => {
    const used = {};
    for (let k = 0; k < day.slots; k++) {
      let tries = 0;
      let c;
      do {
        c = order[ri % order.length];
        ri++;
        tries++;
      } while ((used[c.subj] || 0) >= 2 && tries < order.length);
      used[c.subj] = (used[c.subj] || 0) + 1;
      out.push(makeSession(day.date, c, 'revision', len));
    }
  });
  return out;
}

function generatePlan() {
  const today = todayIso();
  // keep what already happened (and custom sessions the student added by hand)
  const history = plan.sessions.filter(s => s.status !== 'todo' || s.date < today || s.type === 'custom');
  const days = buildDays(today, settings.examDate);
  const studyDays = days.filter(d => !d.revision);
  const queues = buildQueues(sum(studyDays.map(d => d.slots)));
  const fresh = [...fillStudyDays(studyDays, queues), ...fillRevisionDays(days.filter(d => d.revision))];
  plan = { generated: Date.now(), sessions: [...history, ...fresh] };
  saveAll();
  return fresh.length;
}

// Start times for a day's sessions, from the configured study start and the break length.
function sessionTimes(date) {
  const [h, m] = (isWeekend(date) ? settings.startWe : settings.startWd).split(':').map(Number);
  let cur = h * 60 + m;
  const out = {};
  sessionsOn(date).forEach(s => {
    out[s.id] = { start: cur, end: cur + s.mins };
    cur += s.mins + settings.brk;
  });
  return out;
}

function addSession({ date, ch, mins, type = 'custom' }) {
  const c = chById(ch);
  if (!c || !date) return null;
  const s = makeSession(date, c, type, mins);
  plan.sessions.push(s);
  saveAll();
  return s;
}

function moveSession(id, date) {
  const s = plan.sessions.find(x => x.id === id);
  if (!s || !date || s.date === date) return false;
  s.date = date;
  s.moved = true;
  saveAll();
  return true;
}

function completeSession(id, status, conf) {
  const s = plan.sessions.find(x => x.id === id);
  if (!s) return;
  s.status = status;
  s.conf = conf ?? null;
  s.doneAt = todayIso();
  if (status !== 'skipped') {
    const mins = status === 'partial' ? Math.round(s.mins / 2) : s.mins;
    log.push({ date: todayIso(), mins, subj: s.subj, ch: s.ch });
    const c = chById(s.ch);
    if (conf && c) setMastery(s.ch, M(c) + (conf - M(c)) * 0.5);
    scheduleReview(s.ch, conf);
    if (c) pushInbox({ k: 'session_logged', p: { c: c.name, s: c.sname, q: conf || '-', m: M(chById(s.ch)) }, icon: 'check-circle', route: 'plan', key: 'sess:' + id });
  }
  saveAll();
}

// ---------- spaced repetition (SM-2-lite) ----------
// Ladder +1, +3, +7, +14, +30 days. A rating <= 2 resets to +1; 3 shortens the next step
// (x0.8), 4 keeps it (x1.1), 5 lengthens it (x1.3).
const LADDER = [1, 3, 7, 14, 30];
function scheduleReview(chId, q) {
  const r = reviews.find(x => x.ch === chId);
  const today = todayIso();
  if (!r) {
    reviews.push({ id: uid(), ch: chId, reps: 0, interval: 1, due: addDays(today, 1), last: today, hist: [] });
  } else if (r.due < today && q) {
    rateReview(r.id, q, true); // an overdue review is cleared by studying the chapter again
  }
}
function rateReview(id, q, silent) {
  const r = reviews.find(x => x.id === id);
  if (!r) return;
  const today = todayIso();
  if (q <= 2) {
    r.reps = 0;
    r.interval = 1;
  } else {
    r.reps = Math.min(r.reps + 1, LADDER.length - 1);
    const factor = q === 5 ? 1.3 : q === 4 ? 1.1 : 0.8;
    r.interval = Math.max(1, Math.round(LADDER[r.reps] * factor));
  }
  r.due = addDays(today, r.interval);
  r.last = today;
  r.hist = [...(r.hist || []), q].slice(-10);
  const c = chById(r.ch);
  if (c) setMastery(r.ch, M(c) + (q - M(c)) * 0.3);
  if (!silent) {
    log.push({ date: today, mins: 5, subj: r.ch.split(':')[0], ch: r.ch, review: true });
    saveAll();
  }
}
const dueReviews = () => reviews.filter(r => r.due <= todayIso()).sort((a, b) => a.due.localeCompare(b.due));
const overdueCount = () => reviews.filter(r => r.due < todayIso()).length;

// ---------- readiness & statistics ----------
const subjReadiness = s => {
  const totalW = sum(s.ch.map(W)) || 1;
  return (sum(s.ch.map(c => (W(c) * M(c)) / 5)) / totalW) * 100;
};
const overallReadiness = () => {
  const ss = subjects();
  return sum(ss.map(subjReadiness)) / (ss.length || 1);
};
const MIN_PER_UNIT = 25; // minutes per (difficulty x missing mastery point): the what-if model's one tunable
function projection(hrsPerDay) {
  const today = todayIso();
  const total = Math.max(0, daysBetween(today, settings.examDate));
  let avail = 0;
  for (let i = 0; i < total; i++) {
    if (!settings.daysOff.includes(dow(addDays(today, i)))) avail += hrsPerDay * 60;
  }
  const need = sum(chapters().map(c => (5 - M(c)) * D(c) * MIN_PER_UNIT)) || 1;
  const cov = clamp(avail / need, 0, 1);
  const cur = overallReadiness();
  return { coverage: cov * 100, projected: cur + (100 - cur) * cov * 0.9, need: Math.round(need / 60), avail: Math.round(avail / 60) };
}
function streak() {
  const days = new Set(log.map(l => l.date));
  let n = 0;
  let d = todayIso();
  if (!days.has(d)) d = addDays(d, -1);
  while (days.has(d)) {
    n++;
    d = addDays(d, -1);
  }
  return n;
}
const focusedTotal = () => sum(log.map(l => l.mins));
const logBetween = (from, to) => log.filter(l => l.date >= from && l.date <= to);
const minutesOn = d => sum(log.filter(l => l.date === d).map(l => l.mins));
function minutesBySubject(from, to) {
  const out = {};
  logBetween(from, to).forEach(l => {
    out[l.subj] = (out[l.subj] || 0) + l.mins;
  });
  return out;
}
function sessionsPerSubject() {
  const out = {};
  plan.sessions.filter(s => s.status === 'done' || s.status === 'partial').forEach(s => {
    out[s.subj] = (out[s.subj] || 0) + 1;
  });
  return out;
}
// Chapters worth a final look in one subject: highest weightage x lowest mastery.
const focusChapters = (s, n = 3) => [...s.ch].sort((a, b) => W(b) * (1 - M(b) / 5) - W(a) * (1 - M(a) / 5)).slice(0, n);

// ---------- datesheet & exam-day checklist ----------
// Default datesheet: one paper every second day from the first exam date, skipping Sundays.
function ensureDatesheet() {
  let d = settings.examDate;
  subjects().forEach(s => {
    if (!datesheet[s.id]) {
      datesheet[s.id] = d;
    }
    d = addDays(d, 2);
    if (dow(d) === 0) d = addDays(d, 1);
  });
  Object.keys(datesheet).forEach(id => {
    if (!subjects().some(s => s.id === id)) delete datesheet[id];
  });
}
const firstExamDate = () => Object.values(datesheet).sort()[0] || settings.examDate;
const CHECK_KEYS = ['ck_rollno', 'ck_pens', 'ck_pencil', 'ck_geometry', 'ck_calc', 'ck_water', 'ck_watch', 'ck_route', 'ck_sleep', 'ck_uniform'];

// ---------- inbox (in-app notifications with read state) ----------
// Each item stores an i18n key + params so it renders in whichever language is active.
function pushInbox({ k, p = {}, icon = 'bell', route = '', key }) {
  const dedupe = key || `${k}:${todayIso()}`;
  if (inbox.some(n => n.key === dedupe)) return false;
  inbox.unshift({ id: uid(), key: dedupe, k, p, icon, route, at: Date.now(), read: false });
  inbox = inbox.slice(0, 200);
  store.set('inbox', inbox);
  if (typeof updateNavBadges === 'function' && $('#nav')) updateNavBadges();
  return true;
}
const inboxUnread = () => inbox.filter(n => !n.read).length;

// Reminders generated once per day on app open.
function dailyNotices() {
  const today = todayIso();
  const due = dueReviews().length;
  if (due) pushInbox({ k: 'n_reviews_due', p: { n: due, od: overdueCount() }, icon: 'brain', route: 'revise', key: 'reviews:' + today });
  const left = daysBetween(today, firstExamDate());
  if ([30, 14, 7, 3, 1].includes(left)) {
    pushInbox({ k: 'exam_in', p: { n: left, r: Math.round(overallReadiness()) }, icon: 'calendar', route: 'exams', key: 'exam:' + left });
  }
  subjects().forEach(s => {
    const gap = daysBetween(today, datesheet[s.id] || settings.examDate);
    if (gap >= 0 && gap <= 3) {
      pushInbox({ k: 'next_paper_soon', p: { s: s.name, n: gap }, icon: 'graduation', route: 'exams', key: `paper:${s.id}:${datesheet[s.id]}` });
    }
  });
  const st = streak();
  if ([3, 7, 14, 21, 30, 60].includes(st)) pushInbox({ k: 'streak_hit', p: { n: st }, icon: 'flame', route: 'reports', key: 'streak:' + st + ':' + today });
  const left0 = plan.sessions.filter(s => s.status === 'todo' && s.date < today).length;
  if (left0) pushInbox({ k: 'unfinished', p: { n: left0 }, icon: 'alert-circle', route: 'plan', key: 'unfinished:' + today });
}

  modal.className = 'modal' + (wide ? ' wide' : '');
  modal.innerHTML = `<div class="mh"><h2 id="modalTitle">${title}</h2><button class="btn icon ghost" id="mClose" aria-label="${esc(t('close'))}">${ic('x')}</button></div>${body}`;
  scrim.classList.add('open');
  document.body.style.overflow = 'hidden';
  $('#mClose').onclick = closeModal;
  const first = modal.querySelector('input,select,textarea,button:not(#mClose)') || $('#mClose');
  first.focus();
}
function closeModal() {
  scrim.classList.remove('open');
  document.body.style.overflow = '';
}
scrim.addEventListener('click', e => {
  if (e.target === scrim) closeModal();
});

// ---------- Pomodoro timer (global so it keeps running across routes) ----------
const timer = { sid: null, mode: 'work', block: 0, blocks: 2, total: 0, remaining: 0, endAt: 0, running: false, iv: null };
function beep() {
  if (!prefs.sound) return;
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.0001, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.2, ac.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.6);
    osc.start();
    osc.stop(ac.currentTime + 0.65);
  } catch {
    /* no audio context available */
  }
}
function askNotify() {
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {});
}
function notify(title, body) {
  try {
    if ('Notification' in window && Notification.permission === 'granted') new Notification(title, { body });
  } catch {
    /* notifications blocked */
  }
}
// TODO(student): push notifications that fire when the tab is closed need a service worker +
// a push backend (Web Push / FCM). Register the worker here and post the reminder schedule
// (session start times from sessionTimes() and review due dates) to your server.
function timerStart(sid) {
  const s = plan.sessions.find(x => x.id === sid);
  if (!s) return;
  Object.assign(timer, { sid, mode: 'work', block: 0, blocks: Math.max(1, Math.round(s.mins / settings.pomo)), total: settings.pomo * 60 });
  timer.remaining = timer.total;
  askNotify();
  timerResume();
}
function timerResume() {
  timer.running = true;
  timer.endAt = Date.now() + timer.remaining * 1000;
  clearInterval(timer.iv);
  timer.iv = setInterval(tick, 500);
  renderTimer();
}
function timerPause() {
  timer.running = false;
  timer.remaining = Math.max(0, Math.round((timer.endAt - Date.now()) / 1000));
  clearInterval(timer.iv);
  renderTimer();
}
function timerReset() {
  clearInterval(timer.iv);
  Object.assign(timer, { sid: null, mode: 'work', block: 0, total: 0, remaining: 0, running: false });
  renderTimer();
}
function tick() {
  timer.remaining = Math.max(0, Math.round((timer.endAt - Date.now()) / 1000));
  renderTimer();
  if (timer.remaining <= 0) timerEnd();
}
function timerEnd() {
  clearInterval(timer.iv);
  timer.running = false;
  beep();
  const s = plan.sessions.find(x => x.id === timer.sid);
  const c = s && chById(s.ch);
  if (timer.mode === 'work') {
    timer.block++;
    if (timer.block >= timer.blocks) {
      notify('Session complete', c ? `${c.sname} - ${c.name}` : 'Rate your confidence');
      toast(t('session_done'), 'ok', 'award');
      const sid = timer.sid;
      timerReset();
      openRating(sid, 'done');
      return;
    }
    notify('Break time', `${settings.brk} minutes`);
    toast(`${t('brk')}: ${settings.brk} min`, 'ok', 'coffee');
    Object.assign(timer, { mode: 'break', total: settings.brk * 60 });
  } else {
    notify('Back to focus', c ? c.name : '');
    toast(t('work'), '', 'zap');
    Object.assign(timer, { mode: 'work', total: settings.pomo * 60 });
  }
  timer.remaining = timer.total;
  timerResume();
}
function renderTimer() {
  const el = $('#tTime');
  if (!el) return;
  const s = timer.sid && plan.sessions.find(x => x.id === timer.sid);
  const c = s && chById(s.ch);
  const active = !!timer.sid;
  el.textContent = active ? fmtT(timer.remaining) : fmtT(settings.pomo * 60);
  $('#tMode').textContent = active ? (timer.mode === 'work' ? `${t('work')} ${timer.block + 1}/${timer.blocks}` : t('brk')) : t('work');
  const fg = $('#tRingFg');
  fg.classList.toggle('brk', timer.mode === 'break');
  ringSet(fg, active ? timer.remaining / timer.total : 1);
  $('.ring').classList.toggle('running', timer.running);
  $('#tSess').textContent = c ? `${c.sname} - ${c.name}` : t('pick_session');
  const label = timer.running ? t('pause') : active ? t('resume') : t('start');
  $('#tPlay').innerHTML = (timer.running ? ic('pause') : ic('play')) + `<span>${label}</span>`;
  $('#tPlay').disabled = !active;
  $('#tSkipBrk').classList.toggle('hidden', !(active && timer.mode === 'break'));
  $('#tFinish').classList.toggle('hidden', !active);
}

// ---------- session, rating and add-session modals ----------
const STATUS_IC = { done: 'check-circle', partial: 'activity', skipped: 'skip' };
const CONF = ['Lost', 'Shaky', 'Okay', 'Good', 'Solid'];
const CONF_UR = ['بھول گیا', 'کمزور', 'ٹھیک', 'اچھا', 'پکا'];
const confLabel = q => (lang === 'ur' ? CONF_UR : CONF)[q - 1];

function sessionChips(s, c, sb) {
  const status = s.status !== 'todo' ? `<span class="chip static">${ic(STATUS_IC[s.status])} ${t(s.status)}${s.conf ? ' - ' + s.conf + '/5' : ''}</span>` : '';
  return `<div class="chips" style="margin-bottom:12px">
    <span class="chip static" style="color:${sb.color}">${ic(sb.icon)} ${esc(subjName(sb))}</span>
    <span class="chip static">${ic('calendar')} ${esc(fmtD(s.date, { weekday: 'short', day: 'numeric', month: 'short' }))}</span>
    <span class="chip static">${ic('clock')} ${s.mins} ${t('minutes')}</span>
    <span class="chip static">${ic('layers')} ${T(s.type)}</span>${status}</div>
  <div class="grid3" style="margin-bottom:12px">
    <div class="kpi"><div><div class="v">${W(c)}%</div><div class="l">${T('weightage')}</div></div></div>
    <div class="kpi"><div><div class="v">${D(c)}/5</div><div class="l">${T('difficulty')}</div></div></div>
    <div class="kpi"><div><div class="v">${M(c)}/5</div><div class="l">${T('mastery')}</div></div></div>
  </div>`;
}

function openSession(id) {
  const s = plan.sessions.find(x => x.id === id);
  if (!s) return;
  const c = chById(s.ch);
  const sb = subjById(s.subj);
  const today = todayIso();
  const todoActions = `<div class="actions">
      <button class="btn primary" id="sStart">${ic('play')} ${T('start')} Pomodoro</button>
      <button class="btn ok" id="sDone">${ic('check')} ${T('done')}</button>
      <button class="btn" id="sPart">${ic('activity')} ${T('partial')}</button>
      <button class="btn ghost" id="sSkip">${ic('skip')} ${T('skip')}</button></div>
    <div class="grid2" style="margin-top:14px;align-items:end">
      <div class="field"><label for="sMove">${T('move_to')}</label><input type="date" id="sMove" value="${s.date}" min="${today}"></div>
      <button class="btn" id="sMoveBtn">${ic('move')} ${T('move')}</button></div>`;
  const doneActions = `<div class="actions"><button class="btn" id="sReopen">${ic('rotate')} ${T('reopen')}</button></div>`;
  openModal({
    title: esc(c.name),
    body: `${sessionChips(s, c, sb)}${s.status === 'todo' ? todoActions : doneActions}
      <div class="actions"><button class="btn danger sm" id="sDel">${ic('trash')} ${T('delete')}</button></div>`
  });
  const refresh = () => {
    closeModal();
    route();
  };
  $('#sStart')?.addEventListener('click', () => {
    closeModal();
    timerStart(id);
    if (!location.hash.startsWith('#plan')) location.hash = 'plan';
    else renderTimer();
    $('#tTime')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  $('#sDone')?.addEventListener('click', () => openRating(id, 'done'));
  $('#sPart')?.addEventListener('click', () => openRating(id, 'partial'));
  $('#sSkip')?.addEventListener('click', () => {
    completeSession(id, 'skipped');
    toast(t('session_skipped'));
    refresh();
  });
  $('#sMoveBtn')?.addEventListener('click', () => {
    const date = $('#sMove').value;
    if (moveSession(id, date)) {
      toast(t('moved'), 'ok', 'move');
      weekStart = mondayOf(date);
    }
    refresh();
  });
  $('#sReopen')?.addEventListener('click', () => {
    s.status = 'todo';
    s.conf = null;
    saveAll();
    refresh();
  });
  $('#sDel').onclick = () => {
    plan.sessions = plan.sessions.filter(x => x.id !== id);
    saveAll();
    toast(t('session_removed'));
    refresh();
  };
}

function openRating(id, status) {
  const s = plan.sessions.find(x => x.id === id);
  if (!s) return;
  const c = chById(s.ch);
  const buttons = [1, 2, 3, 4, 5].map(q => `<button data-q="${q}" aria-label="${esc(confLabel(q))}" style="width:56px;height:56px;display:grid;place-items:center;line-height:1">
      <span>${q}</span><small class="i18n" style="font-size:.6rem;font-weight:600;color:var(--muted)">${esc(confLabel(q))}</small></button>`).join('');
  openModal({
    title: `${t(status === 'partial' ? 'session_partial' : 'session_done')} - ${esc(c.name)}`,
    body: `<p class="muted i18n" style="margin:0 0 12px">${t('confidence')}</p>
      <div class="rate" id="confRate" style="justify-content:center;gap:8px">${buttons}</div>
      <p class="muted sm i18n" style="text-align:center;margin:12px 0 0">${t('conf_note')}</p>`
  });
  $$('#confRate button').forEach(b => {
    b.onclick = () => {
      completeSession(id, status, +b.dataset.q);
      closeModal();
      toast(`${t('saved')} - ${t('mastery')} ${M(chById(s.ch))}/5`, 'ok', 'award');
      route();
    };
  });
}

// Manual "custom" session for the daily planner (any chapter, any future day).
function openAddSession(date) {
  const ss = subjects();
  const subjOpts = ss.map(s => `<option value="${s.id}">${esc(subjName(s))}</option>`).join('');
  openModal({
    title: `${ic('plus')} ${t('add_session')}`,
    body: `<div class="grid2">
      <div class="field"><label for="aSubj">${T('subject')}</label><select id="aSubj">${subjOpts}</select></div>
      <div class="field"><label for="aCh">${T('chapter')}</label><select id="aCh"></select></div>
      <div class="field"><label for="aDate">${T('date')}</label><input type="date" id="aDate" value="${date || todayIso()}" min="${todayIso()}"></div>
      <div class="field"><label for="aMins">${T('minutes')}</label><select id="aMins">${[25, 50, 75, 100].map(m => `<option ${m === sessLen() ? 'selected' : ''}>${m}</option>`).join('')}</select></div>
    </div>
    <div class="actions"><button class="btn primary" id="aSave">${ic('check')} ${T('add')}</button><button class="btn ghost" id="aCancel">${T('cancel')}</button></div>`
  });
  const fillChapters = () => {
    $('#aCh').innerHTML = subjById($('#aSubj').value).ch.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  };
  $('#aSubj').onchange = fillChapters;
  fillChapters();
  $('#aCancel').onclick = closeModal;
  $('#aSave').onclick = () => {
    const s = addSession({ date: $('#aDate').value, ch: $('#aCh').value, mins: +$('#aMins').value });
    if (!s) return;
    closeModal();
    weekStart = mondayOf(s.date);
    toast(t('session_added'), 'ok', 'plus');
    route();
  };
}
