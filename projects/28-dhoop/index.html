// ---------- solar model: position → clear sky → clouds → Erbs → plane of array → PV ----------
const DEG = Math.PI / 180;
const SOLAR_CONST = 1367;

/**
 * Sun position for local standard time `hour` (decimal hours, PKT = UTC+5) on day-of-year n.
 * Spencer (1971) Fourier series for declination and equation of time, as used by NOAA.
 * Azimuth is measured clockwise from north (90 = east, 180 = south).
 */
function sunPosition(n, hour, lat, lon, tz = PKT) {
  const g = ((2 * Math.PI) / 365) * (n - 1 + (hour - 12) / 24);
  const eot = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  const decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g)
    + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
  // True solar time in minutes, then hour angle (negative in the morning).
  const tst = hour * 60 + eot + 4 * lon - 60 * tz;
  const ha = (tst / 4 - 180) * DEG;
  const phi = lat * DEG;
  const cosZ = Math.sin(phi) * Math.sin(decl) + Math.cos(phi) * Math.cos(decl) * Math.cos(ha);
  const zen = Math.acos(clamp(cosZ, -1, 1));
  const az = Math.atan2(Math.sin(ha), Math.cos(ha) * Math.sin(phi) - Math.tan(decl) * Math.cos(phi)) / DEG + 180;
  return { decl: decl / DEG, eot, ha: ha / DEG, zenith: zen / DEG, elevation: 90 - zen / DEG, azimuth: (az + 360) % 360, cosZ };
}

/** Sunrise, solar noon and sunset (local hours) with the standard 0.833° refraction allowance. */
function sunTimes(iso, lat, lon) {
  const n = dayOfYear(iso);
  const p = sunPosition(n, 12, lat, lon);
  const phi = lat * DEG;
  const d = p.decl * DEG;
  const cosW = Math.cos(90.833 * DEG) / (Math.cos(phi) * Math.cos(d)) - Math.tan(phi) * Math.tan(d);
  const w = Math.acos(clamp(cosW, -1, 1)) / DEG;
  const noon = (720 - 4 * lon - p.eot + 60 * PKT) / 60;
  return { rise: noon - (4 * w) / 60, noon, set: noon + (4 * w) / 60, dayLength: (8 * w) / 60, noonElev: 90 - Math.abs(lat - p.decl) };
}

/** Extraterrestrial normal irradiance (W/m²) with the eccentricity correction. */
const extraterrestrial = n => SOLAR_CONST * (1 + 0.033 * Math.cos((2 * Math.PI * n) / 365));

/** Haurwitz (1945) clear-sky global horizontal irradiance, W/m². */
const haurwitzGhi = cosZ => (cosZ > 0.01 ? 1098 * cosZ * Math.exp(-0.059 / cosZ) : 0);

/** Kasten–Czeplak (1980) cloud attenuation: GHI_cloudy = GHI_clear × (1 − 0.75 C^3.4), C = cloud fraction. */
const cloudFactor = cloudPct => 1 - 0.75 * Math.pow(clamp(cloudPct, 0, 100) / 100, 3.4);

/** Erbs et al. (1982): diffuse fraction from the clearness index, then beam normal irradiance. */
function erbs(ghi, cosZ, n) {
  if (ghi <= 0 || cosZ <= 0.01) return { dni: 0, dhi: Math.max(0, ghi), kt: 0, kd: 1 };
  const kt = clamp(ghi / (extraterrestrial(n) * cosZ), 0, 1);
  let kd;
  if (kt <= 0.22) kd = 1 - 0.09 * kt;
  else if (kt <= 0.8) kd = 0.9511 - 0.1604 * kt + 4.388 * kt ** 2 - 16.638 * kt ** 3 + 12.336 * kt ** 4;
  else kd = 0.165;
  const dhi = kd * ghi;
  // Near the horizon cos Z → 0; cap the divisor (Z ≈ 86°) so beam stays finite.
  const dni = (ghi - dhi) / Math.max(cosZ, 0.065);
  return { dni, dhi, kt, kd };
}

/**
 * Plane-of-array irradiance with the isotropic sky (Liu–Jordan) model: beam × cos(incidence)
 * + diffuse × (1 + cos β)/2 + ground-reflected GHI × albedo × (1 − cos β)/2.
 * TODO(student): add the Perez (1990) anisotropic sky model (circumsolar + horizon brightening) as an option and
 * compare both against measured plane-of-array data from an inverter log; isotropic underestimates clear days.
 */
function poaIrradiance(irr, sun, tilt, azimuth, albedo = 0.2) {
  const b = tilt * DEG;
  const z = sun.zenith * DEG;
  const cosInc = Math.cos(z) * Math.cos(b) + Math.sin(z) * Math.sin(b) * Math.cos((sun.azimuth - azimuth) * DEG);
  const beam = sun.cosZ > 0.01 ? irr.dni * Math.max(0, cosInc) : 0;
  const diffuse = (irr.dhi * (1 + Math.cos(b))) / 2;
  const ground = (irr.ghi * albedo * (1 - Math.cos(b))) / 2;
  return { poa: beam + diffuse + ground, beam, diffuse, ground, cosInc };
}

/** Cell temperature from the NOCT model, then DC output with the temperature coefficient and system losses. */
function pvOutput(poa, tAmb, pv) {
  const tCell = tAmb + (poa / 800) * ((pv.noct || 45) - 20);
  const derate = 1 + (pv.tempCoef / 100) * (tCell - 25);
  const dc = Math.max(0, pv.kwp * (poa / 1000) * derate * (1 - pv.losses / 100));
  return { dc, ac: Math.min(dc, pv.invKw), tCell, derate };
}

// ---------- weather: seeded per city, or live from Open-Meteo ----------
/** Expand a city's 7-day seed into hourly cloud % and temperature (deterministic jitter). */
function seedWeather(city, startIso) {
  const r = rng(hashStr(city.id));
  const cloud = [];
  const temp = [];
  city.wx.forEach(([cm, tmax, tmin]) => {
    for (let h = 0; h < 24; h++) {
      temp.push(round(tmin + (tmax - tmin) * diurnalShape(h) + (r() - 0.5) * 0.8, 1));
      const build = h >= 11 && h <= 18 ? Math.sin((Math.PI * (h - 11)) / 7) * cm * 0.35 : 0;
      cloud.push(Math.round(clamp(cm + build + (r() - 0.5) * cm * 0.6, 0, 100)));
    }
  });
  return { start: startIso, cloud, temp, ghi: null, source: 'seed', syncedAt: 0 };
}

/** 0 at the 06:00 minimum, 1 at the 15:00 maximum, cosine segments in between. */
function diurnalShape(h) {
  if (h >= 6 && h <= 15) return 0.5 - 0.5 * Math.cos((Math.PI * (h - 6)) / 9);
  const x = h < 6 ? h + 24 : h;
  return 0.5 + 0.5 * Math.cos((Math.PI * (x - 15)) / 15);
}

/** Weather for the active city: live data while it still covers today, otherwise the seed. */
function weatherFor(cityId = S.system.city) {
  const live = S.weather[cityId];
  const today = isoDate();
  if (live && live.start && addDays(live.start, Math.floor(live.cloud.length / 24) - 1) >= today) return live;
  return seedWeather(cityById(cityId), today);
}

/** Hourly sample (cloud, temp, optional measured GHI) for a date and hour; repeats the last day past the end. */
function wxAt(wx, iso, hour) {
  const len = wx.cloud.length;
  let idx = Math.round((dateTs(iso) - dateTs(wx.start)) / DAY) * 24 + Math.floor(hour);
  if (idx >= len) idx = len - 24 + (Math.floor(hour) % 24);
  idx = clamp(idx, 0, len - 1);
  return { cloud: wx.cloud[idx], temp: wx.temp[idx], ghi: wx.ghi ? wx.ghi[idx] : null };
}

/**
 * PV forecast for `steps` steps of `dt` hours from 00:00 on `iso`. Each step averages 15-minute samples.
 * opts.clear = true ignores clouds (clear-sky reference); opts.wx overrides the weather source.
 */
function forecastSeries(sys, iso, steps, dt, opts = {}) {
  const city = { lat: sys.lat, lon: sys.lon, haze: cityById(sys.city).haze };
  const wx = opts.wx || weatherFor(sys.city);
  const sub = Math.max(1, Math.round(dt * 4));
  const out = [];
  for (let k = 0; k < steps; k++) {
    const acc = { ac: 0, ghi: 0, clear: 0, poa: 0, dni: 0, dhi: 0, tCell: 0 };
    const t0 = k * dt;
    const dIso = addDays(iso, Math.floor(t0 / 24));
    const n = dayOfYear(dIso);
    let w = null;
    for (let s = 0; s < sub; s++) {
      const hod = (t0 + ((s + 0.5) * dt) / sub) % 24;
      const sun = sunPosition(n, hod, city.lat, city.lon);
      w = wxAt(wx, dIso, hod);
      const clear = haurwitzGhi(sun.cosZ) * city.haze;
      const ghi = opts.clear ? clear : w.ghi != null ? w.ghi : clear * cloudFactor(w.cloud);
      const comp = erbs(ghi, sun.cosZ, n);
      const poa = poaIrradiance({ ghi, dni: comp.dni, dhi: comp.dhi }, sun, sys.pv.tilt, sys.pv.azimuth);
      const p = pvOutput(poa.poa, w.temp, sys.pv);
      acc.ac += p.ac / sub;
      acc.ghi += ghi / sub;
      acc.clear += clear / sub;
      acc.poa += poa.poa / sub;
      acc.dni += comp.dni / sub;
      acc.dhi += comp.dhi / sub;
      acc.tCell += (poa.poa > 5 ? p.tCell : w.temp) / sub;
    }
    const mid = sunPosition(n, (t0 + dt / 2) % 24, city.lat, city.lon);
    out.push({ h: t0, kw: acc.ac, kwh: acc.ac * dt, ghi: acc.ghi, clear: acc.clear, poa: acc.poa, dni: acc.dni, dhi: acc.dhi,
      tCell: acc.tCell, cloud: w.cloud, temp: w.temp, elev: mid.elevation, az: mid.azimuth });
  }
  return out;
}

/** Daily totals for the 7-day outlook. */
function weekOutlook(sys) {
  const today = isoDate();
  return Array.from({ length: 7 }, (_, d) => {
    const iso = addDays(today, d);
    const f = forecastSeries(sys, iso, 24, 1);
    const c = forecastSeries(sys, iso, 24, 1, { clear: true });
    const day = f.filter(r => r.elev > 0);
    return { iso, kwh: sum(f.map(r => r.kwh)), clearKwh: sum(c.map(r => r.kwh)), cloud: mean(day.map(r => r.cloud)),
      tmax: Math.max(...f.map(r => r.temp)), tmin: Math.min(...f.map(r => r.temp)), peak: Math.max(...f.map(r => r.kw)) };
  });
}

/** Fetch 7 days of hourly cloud, temperature and shortwave radiation from Open-Meteo (button only, never on load). */
async function fetchLiveWeather(sys) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${sys.lat.toFixed(4)}&longitude=${sys.lon.toFixed(4)}`
    + '&hourly=cloud_cover,temperature_2m,shortwave_radiation&timezone=Asia%2FKarachi';
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 12000);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return parseOpenMeteo(await res.json());
  } finally {
    clearTimeout(timer);
  }
}

/** Open-Meteo radiation is the mean of the preceding hour, so value at hh:00 belongs to the step (hh−1)..hh. */
function parseOpenMeteo(j) {
  const h = j && j.hourly;
  if (!h || !Array.isArray(h.time) || !h.time.length) throw new Error('bad payload');
  const start = h.time[0].slice(0, 10);
  const n = Math.floor(h.time.length / 24) * 24;
  const pick = (arr, i, d) => (arr && Number.isFinite(arr[i]) ? arr[i] : d);
  const cloud = [];
  const temp = [];
  const ghi = [];
  for (let i = 0; i < n; i++) {
    cloud.push(pick(h.cloud_cover, i, 0));
    temp.push(pick(h.temperature_2m, i, 25));
    ghi.push(pick(h.shortwave_radiation, Math.min(i + 1, n - 1), 0));
  }
  return { start, cloud, temp, ghi, source: 'live', syncedAt: now() };
}

// ---------- day-ahead optimizer: dynamic programming over battery SOC × time ----------
// State: SOC index i on a 1 % grid of usable capacity. Decision: next index j. The same stepFlows() and
// flowCost() price every path, so the DP, both baselines and the plan-vs-actual replay are comparable.
const DP_LEVELS = 100;
const EPS = 1e-9;

/** Everything a plan needs, collected from state (or from overrides for what-if and replay). */
function planContext(o = {}) {
  const sys = o.sys || S.system;
  const set = S.settings;
  const dt = (o.res || set.res) / 60;
  const days = o.days || set.horizon / 24;
  const steps = Math.round((days * 24) / dt);
  const iso = o.iso || addDays(isoDate(), set.planDay || 0);
  const pv = o.pv || forecastSeries(sys, iso, steps, dt).map(r => r.kwh);
  const loads = o.loads || S.loads;
  return {
    sys, iso, dt, steps, days, pv,
    tariff: o.tariff || S.tariff,
    regime: o.regime || sys.grid.regime,
    base: o.base || fixedProfile(loads, steps, dt),
    outage: o.outage || outageMask(iso, steps, dt),
    vars: o.noFlex ? [] : flexVars(loads, days, dt),
    soc0: o.soc0 ?? sys.batt.soc0,
    reserveSoc: set.reserveSoc,
    reservePenalty: set.reservePenalty,
    voll: set.voll,
  };
}

/** Grid outage per step from the weekly load-shedding schedule (and the off-grid regime). */
function outageMask(iso, steps, dt) {
  return Array.from({ length: steps }, (_, k) => {
    const t0 = k * dt;
    const d = addDays(iso, Math.floor(t0 / 24));
    const hod = t0 % 24;
    return (S.outages[weekday(d)] || []).some(([a, b]) => hod + EPS >= a && hod < b - EPS);
  });
}

/** The per-step arrays and limits shared by the DP, the policies and the evaluator. */
function buildProblem(ctx, load) {
  const { sys, tariff, regime, dt, steps } = ctx;
  const b = sys.batt;
  const eta = Math.sqrt(clamp(b.rte, 50, 100) / 100);
  const impRate = [];
  const expRate = [];
  const gridOn = [];
  const reserveAt = [];
  for (let k = 0; k < steps; k++) {
    const hod = (k * dt) % 24;
    impRate.push(importRate(tariff, hod));
    expRate.push(exportRate(tariff, regime, hod, impRate[k]));
    gridOn.push(regime !== 'offgrid' && !ctx.outage[k]);
    reserveAt.push(ctx.outage[k] && (k === 0 || !ctx.outage[k - 1]));
  }
  const wear = b.price / (b.cycles * b.kwh * 2);
  const unmetCost = sys.gen.on ? genCostPerKWh(sys.gen) : ctx.voll;
  const i0 = clamp(Math.round(ctx.soc0), 0, DP_LEVELS);
  const carry = regime === 'offgrid' ? unmetCost * 0.5 : Math.min(...impRate);
  return {
    K: steps, dt, N: DP_LEVELS, unit: b.kwh / DP_LEVELS, etaC: eta, etaD: eta,
    chgMax: b.chgKw * dt, disMax: b.disKw * dt, inv: sys.pv.invKw * dt, sanction: sys.grid.sanctioned * dt,
    expMax: canExportIn(regime) ? sys.grid.exportLimit * dt : 0, gridCharge: !!sys.grid.gridCharge,
    pv: ctx.pv, load, impRate, expRate, gridOn, reserveAt, wear, unmetCost,
    reserveIdx: ctx.reserveSoc, reservePen: ctx.reservePenalty,
    minIdx: Math.min(Math.ceil(b.minSoc), i0), i0,
    termRate: Math.max(0, eta * carry - wear),
  };
}

/** Energy flows (kWh) for moving SOC index i → j in step k. Returns false when a limit is broken. */
function stepFlows(P, k, i, j, f) {
  const dE = (j - i) * P.unit;
  const pv = P.pv[k];
  const load = P.load[k];
  let chg = 0;
  let dis = 0;
  if (dE > 0) {
    chg = dE / P.etaC;
    if (chg > P.chgMax + EPS) return false;
    // Without grid charging (or during an outage) the battery may only take the solar surplus.
    if ((!P.gridCharge || !P.gridOn[k]) && chg > Math.max(0, pv - load) + EPS) return false;
  } else if (dE < 0) {
    dis = -dE * P.etaD;
    if (dis > P.disMax + EPS) return false;
    // Inverter AC output = solar + battery must stay within the inverter rating.
    if (dis > Math.max(0, P.inv - pv) + EPS) return false;
  }
  const net = load + chg - dis - pv;
  f.chg = chg;
  f.dis = dis;
  f.dE = dE;
  f.imp = 0;
  f.exp = 0;
  f.curt = 0;
  f.unmet = 0;
  if (net > 0) {
    f.imp = P.gridOn[k] ? Math.min(net, P.sanction) : 0;
    f.unmet = net - f.imp;
  } else if (net < 0) {
    f.exp = P.gridOn[k] ? Math.min(-net, P.expMax) : 0;
    f.curt = -net - f.exp;
  }
  return true;
}

/** Rupee cost of the energy flows of a step: import − export + battery wear + unserved energy. */
const moneyCost = (P, k, f) => f.imp * P.impRate[k] - f.exp * P.expRate[k] + Math.abs(f.dE) * P.wear + f.unmet * P.unmetCost;

/** Soft constraint: shortfall below the reserve SOC at the start of a load-shedding window. */
const reserveCost = (P, k, i) => (P.reserveAt[k] && i < P.reserveIdx ? (P.reserveIdx - i) * P.unit * P.reservePen : 0);

const flowCost = (P, k, i, f) => moneyCost(P, k, f) + reserveCost(P, k, i);

/** Value of energy left in the battery at the horizon (negative cost), relative to the start. */
const terminalCost = (P, i) => -(i - P.i0) * P.unit * P.termRate;

/** Flows depend only on the SOC change d = j − i, so each step's moves are priced once (Infinity = infeasible). */
function moveCostTable(P, k, up, down) {
  const f = {};
  const tbl = new Float64Array(up + down + 1).fill(Infinity);
  for (let d = -down; d <= up; d++) if (stepFlows(P, k, 0, d, f)) tbl[d + down] = moneyCost(P, k, f);
  return tbl;
}

/**
 * Backward induction over all SOC states; returns the optimal cost-to-go from i0 and the SOC path.
 * Ties in rupees (within 1e-6) are broken lexicographically by the higher sum of future SOC, so the
 * battery fills first and exports later when both cost the same.
 */
function solveDP(P) {
  const S1 = P.N + 1;
  const choice = new Int16Array(P.K * S1);
  const up = Math.floor((P.chgMax * P.etaC) / P.unit + 1e-6);
  const down = Math.floor(P.disMax / P.etaD / P.unit + 1e-6);
  let V = new Float64Array(S1);
  let W = new Float64Array(S1);
  for (let i = 0; i < S1; i++) V[i] = i < P.minIdx ? Infinity : terminalCost(P, i);
  for (let k = P.K - 1; k >= 0; k--) {
    const tbl = moveCostTable(P, k, up, down);
    const NV = new Float64Array(S1).fill(Infinity);
    const NW = new Float64Array(S1);
    for (let i = P.minIdx; i < S1; i++) {
      let best = Infinity;
      let bestW = -1;
      let arg = i;
      const hi = Math.min(P.N, i + up);
      for (let j = Math.max(P.minIdx, i - down); j <= hi; j++) {
        const c = tbl[j - i + down];
        if (c === Infinity || V[j] === Infinity) continue;
        const v = c + V[j];
        if (v < best - 1e-6 || (v <= best + 1e-6 && W[j] > bestW)) {
          best = v;
          bestW = W[j];
          arg = j;
        }
      }
      NV[i] = best + reserveCost(P, k, i);
      NW[i] = bestW + arg;
      choice[k * S1 + i] = arg;
    }
    V = NV;
    W = NW;
  }
  const path = [P.i0];
  for (let k = 0, i = P.i0; k < P.K; k++) {
    i = choice[k * S1 + i];
    path.push(i);
  }
  return { cost: V[P.i0], path };
}

/** Price a SOC path step by step (shared by the DP result, the baselines and replays). */
function evaluatePath(P, path) {
  const rows = [];
  const tot = { pv: 0, load: 0, imp: 0, exp: 0, chg: 0, dis: 0, curt: 0, unmet: 0, impRs: 0, expRs: 0, wearRs: 0, unmetRs: 0, penRs: 0, cost: 0 };
  for (let k = 0; k < P.K; k++) {
    const f = {};
    if (!stepFlows(P, k, path[k], path[k + 1], f)) return { infeasible: k, rows, total: Infinity, tot };
    const cost = flowCost(P, k, path[k], f);
    const row = { k, h: k * P.dt, pv: P.pv[k], load: P.load[k], soc: path[k + 1], soc0: path[k], ...f, cost,
      impRs: f.imp * P.impRate[k], expRs: f.exp * P.expRate[k], wearRs: Math.abs(f.dE) * P.wear, unmetRs: f.unmet * P.unmetCost };
    row.penRs = cost - row.impRs + row.expRs - row.wearRs - row.unmetRs;
    rows.push(row);
    for (const key of Object.keys(tot)) tot[key] += row[key] || 0;
  }
  const terminal = terminalCost(P, path[P.K]);
  return { rows, tot, terminal, total: tot.cost + terminal, path };
}

// ---------- baselines: greedy policies walked on the same SOC grid ----------
function nearestFeasible(P, k, i, want) {
  const f = {};
  const target = clamp(Math.round(want), P.minIdx, P.N);
  const dir = target > i ? -1 : 1;
  for (let j = target; j !== i; j += dir) if (stepFlows(P, k, i, j, f)) return j;
  return i;
}

function policyPath(P, wantFn) {
  const path = [P.i0];
  let i = P.i0;
  for (let k = 0; k < P.K; k++) {
    i = nearestFeasible(P, k, i, wantFn(P, k, i));
    path.push(i);
  }
  return path;
}

/** Discharge just enough to cover the deficit (inverter and battery limits respected). */
function deficitTarget(P, k, i) {
  const def = Math.max(0, P.load[k] - P.pv[k]);
  const out = Math.min(def, P.disMax, Math.max(0, P.inv - P.pv[k]));
  return i - Math.floor(out / P.etaD / P.unit + 1e-6);
}

/** Inverter default ("solar first, battery at night"): surplus charges, deficits discharge, no grid charging. */
function sbuWant(P, k, i) {
  const sur = P.pv[k] - P.load[k];
  if (sur >= 0) return i + Math.floor((Math.min(sur, P.chgMax) * P.etaC) / P.unit + 1e-6);
  return deficitTarget(P, k, i);
}

/** Naive baseline: battery is backup only — kept full (grid charging if allowed), used only during outages. */
function backupWant(P, k, i) {
  if (!P.gridOn[k]) return sbuWant(P, k, i);
  const room = (P.N - i) * P.unit;
  const fromPv = Math.min(Math.max(0, P.pv[k] - P.load[k]), P.chgMax) * P.etaC;
  const add = P.gridCharge ? Math.min(room, P.chgMax * P.etaC) : Math.min(room, fromPv);
  return i + Math.floor(add / P.unit + 1e-6);
}

// ---------- loads: fixed profile + flexible (shiftable / comfort) variables ----------
const itemKw = it => ((it.w || appById(it.app).w) * (it.qty || 1)) / 1000;

/** Fixed appliances (hours[] = fraction of each hour running, × duty cycle) plus the misc base profile. */
function fixedProfile(loads, steps, dt) {
  const out = new Array(steps).fill(0);
  for (let k = 0; k < steps; k++) {
    const h = Math.floor((k * dt) % 24);
    let w = loads.misc ? loads.misc[h] || 0 : 0;
    for (const it of loads.items) {
      if (it.cls !== 'fixed') continue;
      w += (it.w || appById(it.app).w) * (it.qty || 1) * (it.duty ?? appById(it.app).duty ?? 1) * (it.hours[h] || 0);
    }
    out[k] = (w / 1000) * dt;
  }
  return out;
}

/** One decision variable per flexible appliance per day of the horizon. */
function flexVars(loads, days, dt) {
  const vars = [];
  for (let d = 0; d < days; d++) {
    for (const it of loads.items) {
      const o = d * 24;
      if (it.cls === 'shift') {
        const dur = it.dur / 60;
        const lo = o + it.earliest;
        const hi = Math.max(lo, o + it.latest - dur);
        const pref = clamp(o + it.pref, lo, hi);
        vars.push({ id: it.id + '@' + d, item: it, day: d, kind: 'shift', kw: itemKw(it), dur, lo, hi, pref: snap(pref, dt) });
      } else if (it.cls === 'comfort') {
        const win = [];
        for (let h = it.from; h < it.to; h++) win.push(o + h);
        const pref = (it.prefHours || []).map(h => o + h).filter(h => win.includes(h)).slice(0, it.want);
        while (pref.length < Math.min(it.want, win.length)) pref.push(win.filter(h => !pref.includes(h)).pop());
        vars.push({ id: it.id + '@' + d, item: it, day: d, kind: 'comfort', kw: itemKw(it), win, pref: pref.sort((a, b) => a - b) });
      }
    }
  }
  return vars;
}
const snap = (h, dt) => Math.round(h / dt) * dt;

/** Add `kw` for [start, start + dur) hours onto a per-step kWh array. */
function addBlock(arr, start, dur, kw, dt) {
  const end = start + dur;
  for (let k = Math.max(0, Math.floor(start / dt)); k < arr.length && k * dt < end; k++) {
    const overlap = Math.min(end, (k + 1) * dt) - Math.max(start, k * dt);
    if (overlap > 0) arr[k] += kw * overlap;
  }
}

/** Per-variable load arrays for a placement (shift = start hour, comfort = list of hours). */
function flexArrays(vars, place, steps, dt) {
  return vars.map((v, vi) => {
    const arr = new Array(steps).fill(0);
    if (v.kind === 'shift') addBlock(arr, place[vi], v.dur, v.kw, dt);
    else place[vi].forEach(h => addBlock(arr, h, 1, v.kw, dt));
    return arr;
  });
}

function totalLoad(ctx, place) {
  const out = ctx.base.slice();
  flexArrays(ctx.vars, place, ctx.steps, ctx.dt).forEach(a => a.forEach((v, k) => (out[k] += v)));
  return out;
}

/** Pruning: a placement whose load exceeds what grid + inverter (or the inverter alone in an outage) can supply. */
function powerOk(ctx, load) {
  const s = ctx.sys;
  return load.every((e, k) => e / ctx.dt <= (ctx.outage[k] || ctx.regime === 'offgrid' ? s.pv.invKw : s.pv.invKw + s.grid.sanctioned) + 1e-6);
}

function candidates(v, cur, dt) {
  if (v.kind === 'shift') {
    const out = [];
    for (let s = v.lo; s <= v.hi + 1e-6; s += dt) if (Math.abs(s - cur) > 1e-6) out.push(round(s, 4));
    return out;
  }
  const out = [];
  for (const h of cur) for (const n of v.win) if (!cur.includes(n)) out.push(cur.map(x => (x === h ? n : x)).sort((a, b) => a - b));
  return out;
}

// ---------- joint optimisation: coordinate descent over load placements, DP inside ----------
async function optimisePlan(ctx, { onProgress = null, maxPasses = 3 } = {}) {
  const stats = { runs: 0, pruned: 0, passes: 0, cands: 0, ms: 0 };
  const t00 = performance.now();
  const evalPlace = (pl, force = false) => {
    const load = totalLoad(ctx, pl);
    if (!force && !powerOk(ctx, load)) return null;
    const P = buildProblem(ctx, load);
    stats.runs++;
    return { P, dp: solveDP(P), place: pl };
  };
  const pref = evalPlace(ctx.vars.map(v => v.pref), true);
  let best = pref;
  let tick = performance.now();
  for (let pass = 0; pass < maxPasses && ctx.vars.length; pass++) {
    stats.passes++;
    let improved = false;
    for (let vi = 0; vi < ctx.vars.length; vi++) {
      for (const cand of candidates(ctx.vars[vi], best.place[vi], ctx.dt)) {
        stats.cands++;
        const trial = best.place.slice();
        trial[vi] = cand;
        const e = evalPlace(trial);
        if (!e) stats.pruned++;
        else if (e.dp.cost < best.dp.cost - 0.01) {
          best = e;
          improved = true;
        }
        if (performance.now() - tick > 40) {
          if (onProgress) onProgress(stats);
          await nextFrame();
          tick = performance.now();
        }
      }
    }
    if (!improved) break;
  }
  stats.ms = performance.now() - t00;
  return finishPlan(ctx, pref, best, stats, evalPlace);
}

/** Price the optimum, the baselines and each moved load's own saving. */
function finishPlan(ctx, pref, best, stats, evalPlace) {
  const plan = evaluatePath(best.P, best.dp.path);
  const naive = evaluatePath(pref.P, policyPath(pref.P, backupWant));
  const inverter = evaluatePath(pref.P, policyPath(pref.P, sbuWant));
  const batteryOnly = evaluatePath(pref.P, pref.dp.path);
  const savings = ctx.vars.map((v, vi) => {
    if (JSON.stringify(best.place[vi]) === JSON.stringify(v.pref)) return 0;
    const back = best.place.slice();
    back[vi] = v.pref;
    const e = evalPlace(back, true);
    return Math.max(0, e.dp.cost - best.dp.cost);
  });
  const flex = flexArrays(ctx.vars, best.place, ctx.steps, ctx.dt);
  return { ctx, P: best.P, place: best.place, plan, naive, inverter, batteryOnly, flex, savings, stats, dpCost: best.dp.cost };
}

/** Constraint audit of an evaluated plan (shown in the UI and asserted by the behaviour test). */
function checkPlan(P, ev) {
  const bad = [];
  const tol = 1e-6;
  ev.rows.forEach(r => {
    const k = r.k;
    if (r.soc < P.minIdx || r.soc > P.N) bad.push([k, 'soc']);
    if (r.chg > P.chgMax + tol || r.dis > P.disMax + tol) bad.push([k, 'power']);
    if (r.dis > Math.max(0, P.inv - r.pv) + tol) bad.push([k, 'inverter']);
    if (!P.gridOn[k] && (r.imp > tol || r.exp > tol)) bad.push([k, 'outage']);
    if (r.exp > P.expMax + tol || r.imp > P.sanction + tol) bad.push([k, 'grid']);
    if ((!P.gridCharge || !P.gridOn[k]) && r.chg > Math.max(0, r.pv - r.load) + tol) bad.push([k, 'gridCharge']);
    const balance = r.pv + r.dis + r.imp + r.unmet - (r.load + r.chg + r.exp + r.curt);
    if (Math.abs(balance) > 1e-6) bad.push([k, 'balance']);
  });
  return { ok: !bad.length, bad };
}

// ---------- plain-language reasons ----------
function stepAction(r, P) {
  if (r.chg > 1e-6) return r.chg - Math.max(0, r.pv - r.load) > 0.02 ? 'chgGrid' : 'chgSolar';
  if (r.dis > 1e-6) return P.gridOn[r.k] ? 'dis' : 'disOut';
  return 'hold';
}

/** Consecutive steps with the same battery action → blocks {kind, a, b, kwh, socEnd}. */
function actionBlocks(P, rows) {
  const blocks = [];
  rows.forEach(r => {
    const kind = stepAction(r, P);
    const last = blocks[blocks.length - 1];
    if (last && last.kind === kind) {
      last.b = r.k + 1;
      last.kwh += Math.abs(r.dE);
      last.socEnd = r.soc;
      last.rate = Math.max(last.rate, P.impRate[r.k]);
    } else blocks.push({ kind, a: r.k, b: r.k + 1, kwh: Math.abs(r.dE), socEnd: r.soc, rate: P.impRate[r.k] });
  });
  return blocks;
}

/** Group steps where pred(row) holds into [a, b) windows. */
function windows(rows, pred) {
  const out = [];
  rows.forEach(r => {
    if (!pred(r)) return;
    const last = out[out.length - 1];
    if (last && last.b === r.k) last.b = r.k + 1;
    else out.push({ a: r.k, b: r.k + 1 });
  });
  return out;
}

function planReasons(res) {
  const { P, plan, ctx } = res;
  const dt = ctx.dt;
  const hk = k => hhmm(k * dt);
  const out = [];
  ctx.vars.forEach((v, vi) => out.push(flexReason(res, v, vi)));
  const outages = windows(plan.rows, r => !P.gridOn[r.k] && ctx.regime !== 'offgrid');
  actionBlocks(P, plan.rows).forEach(b => {
    const v = { from: hk(b.a), to: hk(b.b), kwh: nf(b.kwh, 1), soc: b.socEnd, rate: nf(b.rate, 1) };
    if (b.kind === 'chgSolar' && b.kwh > 0.1) out.push({ k: b.a, icon: 'battery-charging', tone: 'batt', text: t('rs_chgSolar', v) });
    if (b.kind === 'chgGrid' && b.kwh > 0.1) out.push({ k: b.a, icon: 'pylon', tone: 'grid', text: t('rs_chgGrid', v) });
    if (b.kind === 'dis' && b.kwh > 0.1) out.push({ k: b.a, icon: 'battery', tone: 'batt', text: t('rs_dis', v) });
    if (b.kind === 'disOut' && b.kwh > 0.1) out.push({ k: b.a, icon: 'plug-off', tone: 'imp', text: t('rs_disOut', v) });
    const next = outages.find(o => o.a >= b.b && o.a - b.b <= 6 / dt);
    if (b.kind === 'hold' && next && b.socEnd >= ctx.reserveSoc && b.b - b.a >= 2) {
      out.push({ k: b.a, icon: 'shield', tone: 'batt', text: t('rs_hold', { ...v, out: hk(next.a) }) });
    }
  });
  windows(plan.rows, r => r.exp > 0.02).forEach(w => {
    const rows = plan.rows.slice(w.a, w.b);
    const kwh = sum(rows.map(r => r.exp));
    if (kwh > 0.2) out.push({ k: w.a, icon: 'arrow-up-right', tone: 'exp', text: t('rs_export', { from: hk(w.a), to: hk(w.b), kwh: nf(kwh, 1), rs: nf(sum(rows.map(r => r.expRs))) }) });
  });
  const curt = plan.rows.filter(r => r.curt > 0.02);
  if (sum(curt.map(r => r.curt)) > 0.3) {
    const peak = curt.reduce((a, r) => (r.curt > a.curt ? r : a));
    out.push({ k: peak.k, icon: 'sun', tone: 'sun', text: t('rs_curtail', { kwh: nf(sum(curt.map(r => r.curt)), 1), time: hk(peak.k) }) });
  }
  windows(plan.rows, r => r.unmet > 0.01).forEach(w => {
    const kwh = sum(plan.rows.slice(w.a, w.b).map(r => r.unmet));
    out.push({ k: w.a, icon: 'alert', tone: 'imp', text: t(ctx.sys.gen.on ? 'rs_gen' : 'rs_unmet', { from: hk(w.a), to: hk(w.b), kwh: nf(kwh, 1) }) });
  });
  return out.sort((a, b) => a.k - b.k).map(r => ({ ...r, h: r.k * dt }));
}

function flexReason(res, v, vi) {
  const { P, ctx, place } = res;
  const name = L(appById(v.item.app).name);
  const k0 = Math.floor((v.kind === 'shift' ? place[vi] : place[vi][0]) / ctx.dt);
  const own = res.flex[vi];
  const saved = res.savings[vi] > 0.5 ? ' · ' + t('rs_saves', { rs: nf(res.savings[vi]) }) : '';
  if (v.kind === 'comfort') {
    const solar = sum(own.map((e, k) => Math.min(e, Math.max(0, P.pv[k] - (P.load[k] - e)))));
    const pct = Math.round((100 * solar) / Math.max(1e-6, sum(own)));
    return { k: k0, icon: appById(v.item.app).icon, tone: 'load', text: t('rs_comfort', { name, ranges: hourRanges(place[vi]), pct }) + saved };
  }
  const time = hhmm(place[vi] % 24);
  const surplus = (P.pv[k0] - (P.load[k0] - own[k0])) / ctx.dt;
  let text;
  if (surplus > 0.3) text = t('rs_shift', { name, time, kw: nf(surplus, 1) });
  else if (P.gridOn[k0] && P.impRate[k0] <= Math.min(...P.impRate) + 0.01) text = t('rs_shiftCheap', { name, time, rate: nf(P.impRate[k0], 1) });
  else text = t('rs_shiftBatt', { name, time });
  const moved = Math.abs(place[vi] - v.pref) > 1e-6 ? ' · ' + t('rs_moved', { from: hhmm(v.pref % 24) }) : '';
  return { k: k0, icon: appById(v.item.app).icon, tone: 'load', text: text + moved + saved };
}

/** [12,13,14,20,21] → "12:00–15:00, 20:00–22:00". */
function hourRanges(hours) {
  const out = [];
  [...hours].sort((a, b) => a - b).forEach(h => {
    const last = out[out.length - 1];
    if (last && last[1] === h) last[1] = h + 1;
    else out.push([h, h + 1]);
  });
  return out.map(([a, b]) => `${hhmm(a % 24)}–${hhmm(b % 24 || 24)}`).join(t('sep'));
}

// ---------- tariff: rates by hour, regimes, monthly bill with slabs, payback and NPV (all illustrative) ----------
function defaultTariff() {
  return {
    tou: true,
    peak: 50.5,
    offpeak: 44,
    peakFrom: 18,
    peakTo: 22,
    protected: false,
    slabs: [[100, 22.44], [200, 28.91], [300, 33.1], [400, 37.99], [500, 40.22], [600, 41.62], [700, 42.76], [0, 47.69]],
    protSlabs: [[100, 10.54], [200, 13.01]],
    typicalUnits: 450,
    fpa: 1.5,
    gst: 18,
    ed: 1.5,
    fixed: 1000,
    tvFee: 35,
    legacyBuyback: 26,
    netBill: 11,
    touExport: 20,
    touFrom: 17,
    touTo: 22,
    pvCostKw: 75000,
    invCost: 210000,
    escal: 8,
    disc: 12,
    years: 5,
    degr: 0.5,
  };
}

/** Is hour-of-day h inside [from, to)? Windows may wrap past midnight. */
const inWindow = (h, from, to) => (from <= to ? h >= from && h < to : h >= from || h < to);

/** Marginal slab rate for a monthly consumption (the rate of the slab the last unit falls in). */
function slabMarginal(tar, units) {
  const slabs = tar.protected && units <= 200 ? tar.protSlabs : tar.slabs;
  const hit = slabs.find(([lim]) => lim === 0 || units <= lim);
  return (hit || slabs[slabs.length - 1])[1];
}

/** Telescopic slab charge: each block of units at its own slab rate. */
function slabCharge(tar, units) {
  const slabs = tar.protected && units <= 200 ? tar.protSlabs : tar.slabs;
  let left = units;
  let prev = 0;
  let rs = 0;
  for (const [lim, rate] of slabs) {
    const cap = lim === 0 ? Infinity : lim - prev;
    const take = Math.min(left, cap);
    rs += take * rate;
    left -= take;
    prev = lim;
    if (left <= 0) break;
  }
  return rs;
}

/** All-in marginal import price for an hour: (energy rate + fuel adjustment) × (1 + GST + duty). */
function importRate(tar, hod) {
  const base = tar.tou ? (inWindow(hod, tar.peakFrom, tar.peakTo) ? tar.peak : tar.offpeak) : slabMarginal(tar, tar.typicalUnits);
  return (base + tar.fpa) * (1 + (tar.gst + tar.ed) / 100);
}

/** Value of one exported kWh under each regime. Legacy net metering nets unit for unit at the import price. */
function exportRate(tar, regime, hod, impRate) {
  if (regime === 'netmeter') return impRate;
  if (regime === 'netbill') return tar.netBill;
  if (regime === 'touexp') return inWindow(hod, tar.touFrom, tar.touTo) ? tar.touExport : tar.netBill;
  return 0;
}

/** Generator running cost per kWh at rated output (fuel litres per hour × price ÷ kW). */
const genCostPerKWh = g => (g.lph * g.price) / Math.max(0.5, g.kw);

/**
 * Monthly bill for imported / exported kWh split into peak and off-peak bands.
 * m = { impPeak, impOff, expPeak, expOff, expEve } (expEve = export inside the proposed evening window).
 */
function monthlyBill(tar, regime, m) {
  if (regime === 'offgrid') return { units: 0, energy: 0, fpa: 0, fixed: 0, ed: 0, gst: 0, tv: 0, credit: 0, excess: 0, total: 0 };
  let peak = m.impPeak;
  let off = m.impOff;
  let credit = 0;
  let excess = 0;
  if (regime === 'netmeter') {
    const n = netUnits(peak, off, m.expPeak, m.expOff);
    peak = n.peak;
    off = n.off;
    excess = n.excess;
    credit = excess * tar.legacyBuyback;
  } else if (regime === 'netbill') credit = (m.expPeak + m.expOff) * tar.netBill;
  else if (regime === 'touexp') credit = m.expEve * tar.touExport + Math.max(0, m.expPeak + m.expOff - m.expEve) * tar.netBill;
  const units = peak + off;
  const energy = tar.tou ? peak * tar.peak + off * tar.offpeak : slabCharge(tar, units);
  const fpa = units * tar.fpa;
  const ed = ((energy + fpa) * tar.ed) / 100;
  const gst = ((energy + fpa + tar.fixed) * tar.gst) / 100;
  const total = energy + fpa + tar.fixed + ed + gst + tar.tvFee - credit;
  return { units, energy, fpa, fixed: tar.fixed, ed, gst, tv: tar.tvFee, credit, excess, total };
}

/** Net metering: exports cancel imports in the same band first, then the other band; the rest is excess. */
function netUnits(peak, off, ep, eo) {
  const a = Math.min(peak, ep);
  const b = Math.min(off, eo);
  peak -= a;
  ep -= a;
  off -= b;
  eo -= b;
  const c = Math.min(off, ep);
  off -= c;
  ep -= c;
  const d = Math.min(peak, eo);
  peak -= d;
  eo -= d;
  return { peak, off, excess: ep + eo };
}

/** Split hourly rows into the bill's bands and scale to a 30-day month. */
function monthBands(rows, dt, days, tar) {
  const m = { impPeak: 0, impOff: 0, expPeak: 0, expOff: 0, expEve: 0, loadPeak: 0, loadOff: 0, unmet: 0, pv: 0 };
  rows.forEach(r => {
    const h = (r.k * dt) % 24;
    const pk = tar.tou && inWindow(h, tar.peakFrom, tar.peakTo);
    m[pk ? 'impPeak' : 'impOff'] += r.imp;
    m[pk ? 'expPeak' : 'expOff'] += r.exp;
    m[pk ? 'loadPeak' : 'loadOff'] += r.load;
    if (inWindow(h, tar.touFrom, tar.touTo)) m.expEve += r.exp;
    m.unmet += r.unmet;
    m.pv += r.pv;
  });
  for (const k of Object.keys(m)) m[k] *= 30 / days;
  return m;
}

/**
 * Run the battery DP (loads at their wanted times) for each forecast day under one regime, chaining SOC,
 * and turn the result into a monthly bill. Used by the regime comparison.
 */
function regimeMonth(regime, days = 7, sys = S.system) {
  const tar = S.tariff;
  let soc = sys.batt.soc0;
  const rows = [];
  for (let d = 0; d < days; d++) {
    const ctx = planContext({ sys, iso: addDays(isoDate(), d), days: 1, res: 60, regime, soc0: soc });
    const P = buildProblem(ctx, totalLoad(ctx, ctx.vars.map(v => v.pref)));
    const ev = evaluatePath(P, solveDP(P).path);
    ev.rows.forEach(r => rows.push({ ...r, k: r.k + d * 24 }));
    soc = ev.path[ev.path.length - 1];
  }
  const m = monthBands(rows, 1, days, tar);
  const bill = monthlyBill(tar, regime, m);
  const noSolar = monthlyBill(tar, 'netbill', { impPeak: m.loadPeak, impOff: m.loadOff, expPeak: 0, expOff: 0, expEve: 0 });
  const genRs = sys.gen.on ? m.unmet * genCostPerKWh(sys.gen) : 0;
  // Without a generator, unserved energy is priced at the value of lost load so off-grid is not "free".
  const unmetRs = sys.gen.on ? 0 : m.unmet * S.settings.voll;
  return { regime, m, bill, noSolar, genRs, unmetRs, saving: noSolar.total - bill.total - genRs - unmetRs };
}

/** Up-front cost of the installed system (panels per kWp, inverter, battery). */
const investment = (sys, tar) => sys.pv.kwp * tar.pvCostKw + tar.invCost + sys.batt.price;

/** Discounted cash flows: savings escalate with tariffs and shrink with panel degradation. */
function cashflows(capex, annual, tar, years = 10) {
  const out = [{ y: 0, cum: -capex, disc: -capex }];
  for (let y = 1; y <= years; y++) {
    const cf = annual * (1 + tar.escal / 100) ** (y - 1) * (1 - tar.degr / 100) ** (y - 1);
    const prev = out[y - 1];
    out.push({ y, cf, cum: prev.cum + cf, disc: prev.disc + cf / (1 + tar.disc / 100) ** y });
  }
  return out;
}

/** NPV over the contract years; simple payback ignores escalation and discounting. */
function npvOver(capex, annual, tar) {
  return cashflows(capex, annual, tar, tar.years)[tar.years].disc;
}
const simplePayback = (capex, annual) => (annual > 0 ? capex / annual : Infinity);

// ---------- logs: 60 seeded days, CSV import with a column mapper, KPIs ----------
// A log day: { d: 'YYYY-MM-DD', pv, load, grid, batt, soc (24 hourly means; W, W, +import/−export W,
// +discharge/−charge W, %), out: [outage hours], s0: SOC at 00:00 }.

/** Seeded history: synthetic weather (monsoon cloud in Jul–Sep, clear October), soiling between rains,
 *  a noisy household load and the inverter's default "solar first" battery behaviour. */
function synthLogs(sys, loads, endIso, n = 60) {
  const r = rng(hashStr('logs-' + sys.city));
  const city = cityById(sys.city);
  const monthCloud = [20, 25, 20, 15, 12, 25, 55, 50, 30, 10, 8, 15];
  const days = [];
  let soc = 62;
  let dusty = 0;
  for (let d = n; d >= 1; d--) {
    const iso = addDays(endIso, -d);
    const m = Number(iso.slice(5, 7)) - 1;
    const dayCloud = clamp(monthCloud[m] * (0.25 + 1.5 * r()), 0, 95);
    dusty = dayCloud > 60 ? 0 : dusty + 1;
    const wx = synthDayWeather(iso, dayCloud, city.tm[m], r);
    const soil = 1 - Math.min(0.12, 0.0016 * dusty);
    const pv = forecastSeries(sys, iso, 24, 1, { wx }).map(x => x.kwh * soil * (0.95 + r() * 0.05));
    const load = synthDayLoad(loads, r, city.tm[m]);
    const outage = outageMask(iso, 24, 1).map((o, h) => o || (r() < 0.012 && h > 8));
    const ctx = planContext({ sys, iso, days: 1, res: 60, pv, base: load, outage, soc0: soc, noFlex: true });
    const P = buildProblem(ctx, load);
    const ev = evaluatePath(P, policyPath(P, sbuWant));
    days.push(logDayFromRows(iso, ev.rows, outage, soc));
    soc = ev.path[24];
  }
  return { days, source: 'seed', importedAt: 0 };
}

function synthDayWeather(iso, dayCloud, tMean, r) {
  const cloud = [];
  const temp = [];
  for (let h = 0; h < 24; h++) {
    cloud.push(Math.round(clamp(dayCloud + (r() - 0.5) * 24, 0, 100)));
    temp.push(round(tMean - 6 + 12 * diurnalShape(h) + (r() - 0.5), 1));
  }
  return { start: iso, cloud, temp, ghi: null };
}

/** Household load with ±10 % noise, shiftable loads near their usual time, AC use scaled by temperature. */
function synthDayLoad(loads, r, tMean) {
  const out = fixedProfile(loads, 24, 1).map(v => v * (0.9 + 0.2 * r()));
  for (const it of loads.items) {
    if (it.cls === 'shift') {
      if (r() < 0.12) continue;
      const start = clamp(it.pref + Math.round((r() - 0.5) * 2), it.earliest, Math.max(it.earliest, it.latest - it.dur / 60));
      addBlock(out, start, it.dur / 60, itemKw(it), 1);
    } else if (it.cls === 'comfort') {
      const want = Math.round(clamp(it.want * (tMean - 18) / 12, 0, it.want + 2));
      (it.prefHours || []).slice(-want).forEach(h => addBlock(out, h, 1, itemKw(it) * (0.8 + 0.3 * r()), 1));
    }
  }
  return out;
}

function logDayFromRows(iso, rows, outage, s0) {
  const w = v => Math.round(v * 1000);
  return {
    d: iso,
    pv: rows.map(x => w(x.pv)),
    load: rows.map(x => w(x.load)),
    grid: rows.map(x => w(x.imp - x.exp)),
    batt: rows.map(x => w(x.dis - x.chg)),
    soc: rows.map(x => x.soc),
    out: outage.map((o, h) => (o ? h : -1)).filter(h => h >= 0),
    s0,
  };
}

// ---------- CSV parsing and column mapping ----------
/** RFC-4180-ish parser: quoted fields, doubled quotes, comma / semicolon / tab detected from the header. */
function parseCsv(text) {
  const first = text.split(/\r?\n/, 1)[0] || '';
  const delim = [',', ';', '\t'].sort((a, b) => first.split(b).length - first.split(a).length)[0];
  const rows = [];
  let row = [];
  let cell = '';
  let q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') {
        cell += '"';
        i++;
      } else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === delim) {
      row.push(cell.trim());
      cell = '';
    } else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell.trim());
      if (row.some(x => x !== '')) rows.push(row);
      row = [];
      cell = '';
    } else cell += c;
  }
  row.push(cell.trim());
  if (row.some(x => x !== '')) rows.push(row);
  return { delim, header: rows[0] || [], rows: rows.slice(1) };
}

const CSV_FIELDS = ['time', 'pv_w', 'load_w', 'grid_w', 'battery_w', 'soc'];
const CSV_GUESS = {
  time: /time|date|stamp|datetime/i,
  pv_w: /pv|solar|panel|ppv/i,
  load_w: /load|consum|home|output/i,
  grid_w: /grid|meter|utility|import/i,
  battery_w: /bat(t|tery)?.*(w|power|kw)|bat_p|battery$/i,
  soc: /soc|state.?of.?charge|capacity|%/i,
};

/** Best-guess header → field mapping; each column is used at most once. */
function guessMapping(header) {
  const used = new Set();
  const map = {};
  for (const f of CSV_FIELDS) {
    const idx = header.findIndex((h, i) => !used.has(i) && CSV_GUESS[f].test(h));
    map[f] = idx;
    if (idx >= 0) used.add(idx);
  }
  return map;
}

/** Timestamps: ISO "2026-10-01 13:15", "01/10/2026 13:15" (day first) or Unix seconds / milliseconds. */
function parseStamp(s) {
  const v = String(s).trim();
  if (/^\d{10,13}$/.test(v)) return new Date(Number(v) * (v.length === 10 ? 1000 : 1));
  let m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})[T ](\d{1,2}):(\d{2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]);
  m = v.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{4})[ T](\d{1,2}):(\d{2})/);
  if (m) return new Date(+m[3], +m[2] - 1, +m[1], +m[4], +m[5]);
  return null;
}

/**
 * Turn mapped CSV rows into hourly log days. opts: { kw: values are kW, gridSign: 1 if import is positive,
 * battSign: 1 if discharge is positive }. Rows at any interval are averaged per hour.
 */
function csvToDays(parsed, map, opts) {
  const k = opts.kw ? 1000 : 1;
  const acc = new Map();
  let bad = 0;
  for (const row of parsed.rows) {
    const ts = parseStamp(row[map.time]);
    if (!ts || isNaN(ts)) {
      bad++;
      continue;
    }
    const iso = isoDate(ts.getTime());
    const h = ts.getHours();
    if (!acc.has(iso)) acc.set(iso, Array.from({ length: 24 }, () => ({ n: 0, pv: 0, load: 0, grid: 0, batt: 0, soc: 0 })));
    const cell = acc.get(iso)[h];
    const num = f => (map[f] >= 0 ? parseFloat(row[map[f]]) || 0 : 0);
    cell.n++;
    cell.pv += num('pv_w') * k;
    cell.load += num('load_w') * k;
    cell.grid += num('grid_w') * k * opts.gridSign;
    cell.batt += num('battery_w') * k * opts.battSign;
    cell.soc += num('soc');
  }
  const days = [...acc.entries()].sort().map(([d, hours]) => {
    const avg = f => hours.map(c => (c.n ? Math.round(c[f] / c.n) : 0));
    const first = hours.find(c => c.n);
    return { d, pv: avg('pv'), load: avg('load'), grid: avg('grid'), batt: avg('batt'), soc: avg('soc'), out: [], s0: first ? Math.round(first.soc / first.n) : 50 };
  });
  return { days, bad, rows: parsed.rows.length };
}

/** A sample export in a typical inverter-app shape (kW, battery charge positive) for trying the mapper. */
function sampleCsv(days) {
  const lines = ['Date Time;PV Power(kW);Load Power(kW);Grid Power(kW);Battery Power(kW);Battery SOC(%)'];
  days.slice(-2).forEach(day => {
    for (let h = 0; h < 24; h++) {
      for (const mm of ['00', '30']) {
        const f = v => (v / 1000).toFixed(3);
        lines.push(`${day.d} ${pad2(h)}:${mm};${f(day.pv[h])};${f(day.load[h])};${f(day.grid[h])};${f(-day.batt[h])};${day.soc[h]}`);
      }
    }
  });
  return lines.join('\n');
}

// ---------- KPIs over log days ----------
function logKpis(days, tar = S.tariff, regime = S.system.grid.regime) {
  const k = { pv: 0, load: 0, imp: 0, exp: 0, chg: 0, dis: 0, costNo: 0, cost: 0 };
  days.forEach(day => {
    for (let h = 0; h < 24; h++) {
      const rate = importRate(tar, h);
      const imp = Math.max(0, day.grid[h]) / 1000;
      const exp = Math.max(0, -day.grid[h]) / 1000;
      k.pv += day.pv[h] / 1000;
      k.load += day.load[h] / 1000;
      k.imp += imp;
      k.exp += exp;
      k.dis += Math.max(0, day.batt[h]) / 1000;
      k.chg += Math.max(0, -day.batt[h]) / 1000;
      k.costNo += (day.load[h] / 1000) * rate;
      k.cost += imp * rate - exp * exportRate(tar, regime, h, rate);
    }
  });
  k.selfCons = k.pv > 0 ? clamp((k.pv - k.exp) / k.pv, 0, 1) * 100 : 0;
  k.selfSuff = k.load > 0 ? clamp((k.load - k.imp) / k.load, 0, 1) * 100 : 0;
  k.savings = k.costNo - k.cost;
  k.days = days.length;
  return k;
}

const LOG_METRICS = {
  pv: d => d.pv.map(v => v / 1000),
  load: d => d.load.map(v => v / 1000),
  imp: d => d.grid.map(v => Math.max(0, v) / 1000),
  exp: d => d.grid.map(v => Math.max(0, -v) / 1000),
  soc: d => d.soc,
};

/** Replay a logged day: the optimum with perfect foresight vs what actually happened, priced the same way. */
function replayDay(day, prevSoc) {
  const out = Array.from({ length: 24 }, (_, h) => day.out.includes(h));
  const pv = day.pv.map(v => v / 1000);
  const load = day.load.map(v => v / 1000);
  const ctx = planContext({ iso: day.d, days: 1, res: 60, pv, base: load, outage: out, soc0: prevSoc ?? day.s0, noFlex: true });
  const P = buildProblem(ctx, load);
  const best = evaluatePath(P, solveDP(P).path);
  let actual = 0;
  for (let h = 0; h < 24; h++) {
    const imp = Math.max(0, day.grid[h]) / 1000;
    const exp = Math.max(0, -day.grid[h]) / 1000;
    actual += imp * P.impRate[h] - exp * P.expRate[h] + (Math.abs(day.batt[h]) / 1000) * P.wear;
  }
  return { P, best, actual, optimal: best.tot.impRs - best.tot.expRs + best.tot.wearRs, soc: day.soc };
}

// ---------- battery health: rainflow cycle counting (ASTM E1049-85) and ageing ----------
/** Turning points of a series (plateaus collapsed). */
function reversals(series) {
  const out = [];
  for (const v of series) {
    if (out.length && v === out[out.length - 1]) continue;
    if (out.length >= 2) {
      const a = out[out.length - 2];
      const b = out[out.length - 1];
      if ((b - a) * (v - b) > 0) out.pop();
    }
    out.push(v);
  }
  return out;
}

/** Three-point rainflow: returns cycles {range, mean, count} with count 1 (full) or 0.5 (half). */
function rainflow(series) {
  const stack = [];
  const cycles = [];
  for (const p of reversals(series)) {
    stack.push(p);
    while (stack.length >= 3) {
      const n = stack.length;
      const x = Math.abs(stack[n - 1] - stack[n - 2]);
      const y = Math.abs(stack[n - 2] - stack[n - 3]);
      if (x < y) break;
      if (n === 3) {
        cycles.push({ range: y, mean: (stack[0] + stack[1]) / 2, count: 0.5 });
        stack.shift();
      } else {
        cycles.push({ range: y, mean: (stack[n - 2] + stack[n - 3]) / 2, count: 1 });
        const last = stack.pop();
        stack.splice(n - 3, 2);
        stack.push(last);
      }
    }
  }
  for (let i = 0; i + 1 < stack.length; i++) cycles.push({ range: Math.abs(stack[i + 1] - stack[i]), mean: (stack[i] + stack[i + 1]) / 2, count: 0.5 });
  return cycles;
}

/** Wöhler-type cycle life: rated cycles at 80 % DoD, scaled by (0.8 / DoD)^k for other depths. */
const cyclesToFailure = (chem, dod) => chem.cycles * Math.pow(0.8 / Math.max(dod, 0.02), chem.k);

/** Calendar loss (% capacity) over months in service: rate at 25 °C doubled every +10 °C (battery room = ambient + 3 °C). */
function calendarLoss(chem, city, fromIso, toIso) {
  let loss = 0;
  for (let d = dateTs(fromIso); d < dateTs(toIso); d += 30.44 * DAY) {
    const m = new Date(d).getMonth();
    loss += (chem.cal25 / 12) * 2 ** ((city.tm[m] + 3 - 25) / 10);
  }
  return loss;
}

/** Health summary from logged SOC: cycles, equivalent full cycles, DoD histogram, SOH estimate and projection. */
function batteryHealth(sys, days, cityId = sys.city) {
  const chem = CHEMS[sys.batt.chem];
  const city = cityById(cityId);
  const socSeries = days.flatMap(d => d.soc);
  const cycles = rainflow(socSeries);
  const efc = sum(cycles.map(c => (c.count * c.range) / 100));
  const thru = sum(days.flatMap(d => d.batt.map(v => Math.max(0, v) / 1000))) / Math.max(0.1, sys.batt.kwh);
  const hist = Array(10).fill(0);
  cycles.forEach(c => (hist[Math.min(9, Math.floor(c.range / 10))] += c.count));
  const dmg = sum(cycles.map(c => c.count / cyclesToFailure(chem, c.range / 100)));
  const perDay = dmg / Math.max(1, days.length);
  const today = isoDate();
  const served = Math.max(0, (dateTs(today) - dateTs(sys.batt.installed)) / DAY);
  const cycleLoss = perDay * served * 20;
  const calLoss = calendarLoss(chem, city, sys.batt.installed, today);
  const soh = clamp(100 - cycleLoss - calLoss, 0, 100);
  const proj = Array.from({ length: 16 }, (_, y) => {
    const to = addDays(sys.batt.installed, Math.round(y * 365.25));
    return { y, soh: clamp(100 - perDay * y * 365.25 * 20 - calendarLoss(chem, city, sys.batt.installed, to), 0, 100) };
  });
  const eol = proj.find(p => p.soh <= 80);
  return { cycles, efc, thru, hist, dmg, perDay, served, cycleLoss, calLoss, soh, proj, eolYears: eol ? eol.y : null,
    efcPerDay: efc / Math.max(1, days.length), meanSoc: mean(socSeries), highHours: socSeries.filter(v => v >= 95).length, chem, city };
}

/** Rule-based advice from the health numbers (approximate, educational). */
function healthAdvice(h, sys) {
  const out = [];
  const hot = Math.max(...h.city.tm);
  if (hot >= 32) out.push({ icon: 'thermo-high', key: 'ha_heat', vars: { t: hot + 3 } });
  if (sys.batt.chem !== 'lfp' && h.hist.slice(5).reduce((a, b) => a + b, 0) > 3) out.push({ icon: 'gauge', key: 'ha_deepLead' });
  if (sys.batt.minSoc < h.chem.minSoc) out.push({ icon: 'alert', key: 'ha_minSoc', vars: { a: sys.batt.minSoc, b: h.chem.minSoc } });
  if (sys.batt.chem === 'lfp' && h.highHours > h.cycles.length * 2) out.push({ icon: 'battery', key: 'ha_full' });
  if (h.efcPerDay > 1.1) out.push({ icon: 'cycle', key: 'ha_busy', vars: { n: nf(h.efcPerDay, 2) } });
  if (h.efcPerDay < 0.3) out.push({ icon: 'info', key: 'ha_idle' });
  if (sys.batt.chem !== 'lfp') out.push({ icon: 'droplet', key: 'ha_water' });
  out.push({ icon: 'shield-check', key: 'ha_bms' });
  return out;
}

/** Render draw(width) into el now and whenever el is resized; after() runs after each redraw. */
function mountChart(el, draw, after = null) {
  if (!el) return;
  const run = () => {
    const w = Math.max(220, Math.round(el.clientWidth));
    if (el._w === w && el._draw === draw) return;
    el._w = w;
    el._draw = draw;
    const out = draw(w);
    el.innerHTML = out.svg || out;
    el._tips = out.tips || null;
    if (el._tips) bindTips(el);
    if (after) after();
  };
  chartDraw.set(el, run);
  run();
  if (chartRO) chartRO.observe(el);
}

function bindTips(el) {
  const svg = el.querySelector('svg');
  const tip = $('#ctip');
  const guide = svg.querySelector('.guide');
  svg.onpointermove = e => {
    const hit = e.target.closest && e.target.closest('[data-i]');
    if (!hit) return hideTip();
    const i = Number(hit.dataset.i);
    tip.innerHTML = el._tips(i);
    tip.classList.add('on');
    const x = clamp(e.clientX + 14, 8, window.innerWidth - tip.offsetWidth - 8);
    const y = e.clientY - tip.offsetHeight - 12 < 8 ? e.clientY + 18 : e.clientY - tip.offsetHeight - 12;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
    if (guide) {
      const cx = Number(hit.getAttribute('x')) + Number(hit.getAttribute('width')) / 2;
      guide.setAttribute('x1', cx);
      guide.setAttribute('x2', cx);
      guide.style.opacity = 0.6;
    }
  };
  svg.onpointerleave = () => {
    hideTip();
    if (guide) guide.style.opacity = 0;
  };
}
