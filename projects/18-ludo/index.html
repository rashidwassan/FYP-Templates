<!doctype html>
<html lang="en" data-theme="classic" data-frame="walnut">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ludo — لڈو</title>
<meta name="description" content="Classic Pakistani/Indian Ludo for 2–4 players: pass-and-play, four AI levels (expectimax expert), tournaments, replays, achievements, statistics, tutorial, custom colours, Urdu toggle. Single-file FYP template.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens: cream felt · walnut chrome · four player colours ---------- */
:root{
  --bg:#f6efe3; --felt-dot:rgba(74,47,33,.07); --surface:#fffaf2; --surface-2:#f1e8d8; --ink:#2b1d14; --muted:#7b6657; --line:#e3d6c2;
  --walnut:#4a2f21; --walnut-deep:#35211a; --walnut-soft:#6b4a38; --gold:#d9a441; --gold-soft:#f8ead0; --cream:#f6efe3;
  --red:#d64545; --green:#2e9e5b; --yellow:#f2b705; --blue:#2f6fcf;
  --red-soft:#f9dcdc; --green-soft:#d6f0e0; --yellow-soft:#fdeeb5; --blue-soft:#d9e6f9;
  --red-deep:#a93131; --green-deep:#1f7442; --yellow-deep:#b98a00; --blue-deep:#1f4f9a;
  --pip:#2b1d14; --face:#fffdf8; --face-edge:#e4dccf;
  --frame-a:var(--walnut-soft); --frame-b:var(--walnut-deep);
  --chart-a:#1f4f9a; --chart-b:#b7791a;                       /* validated: CVD-safe, >=3:1 on the surface */
  --pl1:#64400e; --pl2:#94631c; --pl3:#bb8433; --pl4:#d9a95a;  /* ordinal ramp for finishing places */
  --radius:16px; --radius-sm:10px; --shadow:0 12px 32px -18px rgba(43,29,20,.45);
  --font:"Quicksand",system-ui,-apple-system,"Segoe UI",sans-serif; --font-d:"Baloo 2","Quicksand",system-ui,sans-serif; --font-ur:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;
  --ease:cubic-bezier(.2,.8,.2,1); --dur:.35s;
}
html[data-theme=dark]{
  --bg:#1c1511; --felt-dot:rgba(255,255,255,.035); --surface:#2a211b; --surface-2:#352a23; --ink:#f3e9dc; --muted:#b5a090; --line:#4a3b31;
  --walnut:#160f0c; --walnut-deep:#0e0907; --walnut-soft:#3a2a22; --gold:#e0ad4f; --gold-soft:#4a3920; --cream:#f3e9dc;
  --red-soft:#4d2626; --green-soft:#1f3d2c; --yellow-soft:#4a3d14; --blue-soft:#20314f;
  --pip:#2b1d14; --face:#f6efe3; --face-edge:#cfc3b2; --shadow:0 12px 32px -18px rgba(0,0,0,.8);
  --chart-a:#5580c8; --chart-b:#b98428;
  --pl1:#ecc77e; --pl2:#c99640; --pl3:#9a6a26; --pl4:#6f4a1c;
}
html[data-theme=pastel]{
  --bg:#f7f2fb; --felt-dot:rgba(90,74,107,.07); --surface:#fffdff; --surface-2:#f0e9f6; --ink:#2f2638; --muted:#7a6e88; --line:#e2d8ec;
  --walnut:#5a4a6b; --walnut-deep:#45375a; --walnut-soft:#7a6a8d; --gold:#e8a7c3; --gold-soft:#fbe6ef; --cream:#fff;
  --red:#e57373; --green:#5fbf86; --yellow:#f3cf5a; --blue:#6f9ee8;
  --red-soft:#fbe0e0; --green-soft:#dcf3e5; --yellow-soft:#fdf2c4; --blue-soft:#dfe9fb;
  --red-deep:#c35353; --green-deep:#3f9566; --yellow-deep:#c7a62f; --blue-deep:#4e7fcb;
}
/* Board frame presets (custom board module) */
html[data-frame=teak]{--frame-a:#9a6a3c;--frame-b:#5a3a1c}
html[data-frame=ebony]{--frame-a:#3a3230;--frame-b:#120e0d}
html[data-frame=slate]{--frame-a:#5a6b7a;--frame-b:#2c3742}
html[data-frame=ivory]{--frame-a:#e9dcc3;--frame-b:#b9a383}
html[data-frame=emerald]{--frame-a:#2f7a5a;--frame-b:#163f2d}
html[data-stars=off] .board .star{opacity:.18}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg) radial-gradient(var(--felt-dot) 1px,transparent 1px);background-size:14px 14px;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;font-weight:500}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.2}
.display,h1,h2{font-family:var(--font-d);font-weight:800;letter-spacing:-.01em}
.muted{color:var(--muted)} .hidden{display:none!important} .spacer{flex:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ur,[lang=ur]{font-family:var(--font-ur);line-height:1.9}
html[lang=ur] body,html[lang=ur] button,html[lang=ur] input,html[lang=ur] select{font-family:var(--font-ur);line-height:1.9}
html[lang=ur] .display,html[lang=ur] h1,html[lang=ur] h2{font-family:var(--font-ur);letter-spacing:0;line-height:1.7}
html[lang=ur] .rtl{direction:rtl;text-align:right}
.ic{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- Motion kit ---------- */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
html.reduce *,html.reduce *::before,html.reduce *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
.enter{animation:fadeUp var(--dur) var(--ease) both}
.stagger>*{animation:fadeUp .45s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.btn{transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s}
.btn:hover{transform:translateY(-1px)} .btn:active{transform:translateY(0) scale(.98)}
.card,.tile{transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s}
.card:hover{transform:translateY(-2px)}
.fill,.bar>i{transition:width .6s var(--ease)}

/* ---------- Buttons / controls ---------- */
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--walnut);color:var(--cream);display:inline-flex;align-items:center;gap:8px;min-height:40px;font-family:var(--font-d);font-size:1rem;text-decoration:none}
html[lang=ur] .btn{font-family:var(--font-ur)}
.btn.gold{background:var(--gold);color:var(--walnut-deep)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--red-soft);color:var(--red-deep)}
.btn.big{padding:14px 26px;font-size:1.15rem;border-radius:14px}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.9rem;border-radius:10px}
.btn.icon{width:40px;height:40px;padding:0;justify-content:center;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface-2);flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 12px;cursor:pointer;font-weight:700;font-size:.88rem;display:inline-flex;align-items:center;gap:6px;min-height:40px;flex:1;justify-content:center;color:var(--ink)}
.seg button.on{background:var(--walnut);color:var(--cream)}
.seg.c button.on{background:var(--c);color:#fff}
.seat .seg.c button{padding:8px 6px}
.seat.yellow .seg.c button.on{color:var(--walnut-deep)}
input[type=text],input[type=number],select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;outline:0;min-height:40px}
input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
select{appearance:auto;cursor:pointer}
.sw{display:flex;align-items:flex-start;gap:12px;padding:10px 0;cursor:pointer;border-bottom:1px dashed var(--line)}
.sw:last-child{border-bottom:0}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw i{flex:none;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .2s;margin-top:2px}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s var(--ease)}
.sw input:checked+i{background:var(--green)} .sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:3px solid var(--gold);outline-offset:2px}
.sw span b{display:block;font-weight:700} .sw span small{color:var(--muted);display:block;font-size:.8rem}
html[lang=ur] .sw span small{font-size:.75rem}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.8rem;font-weight:700;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:700}
.chip .sw-dot,.field .sw-dot,.check .sw-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.chip .ic{width:.95em;height:.95em}
.small{font-size:.82rem}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks .check{flex:1 1 200px;align-items:flex-start}
.subhead{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 0 0;font-weight:800}
html[lang=ur] .subhead{letter-spacing:0;text-transform:none;font-size:.85rem}
details.card>summary{cursor:pointer;list-style:none;margin:0}
details.card>summary::-webkit-details-marker{display:none}
details.card:hover{transform:none}
.check{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface)}
.check input{width:18px;height:18px;accent-color:var(--walnut);margin:0}
.check.on{border-color:var(--gold);background:var(--gold-soft)}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--walnut-deep),var(--walnut));color:var(--cream);display:flex;align-items:center;gap:10px;padding:8px 16px;box-shadow:0 6px 24px -10px rgba(0,0,0,.5)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}
.brand .logo{width:40px;height:40px;border-radius:12px;background:var(--gold);display:grid;place-items:center;color:var(--walnut-deep);flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.brand h1{font-size:1.25rem;line-height:1;white-space:nowrap}
.brand small{display:block;font-size:.72rem;opacity:.8;font-family:var(--font-ur);line-height:1.4;direction:rtl}
.topnav{display:flex;gap:2px;margin-left:8px}
.topnav a{color:var(--cream);text-decoration:none;padding:8px 12px;border-radius:10px;font-weight:700;font-size:.9rem;opacity:.85;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.topnav a:hover{background:rgba(255,255,255,.08);opacity:1}
.topnav a.active{background:var(--gold);color:var(--walnut-deep);opacity:1}
.tb{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:var(--cream);border-radius:11px;min-width:40px;height:40px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;transition:background .15s,transform .15s;position:relative}
.tb:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
.tb.lang{background:var(--gold);color:var(--walnut-deep);border-color:transparent;font-family:var(--font-ur);font-size:1rem;line-height:1}
.tb .lbl{font-size:.88rem}
.tb .badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:.7rem;font-weight:800;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px var(--walnut-deep)}

/* ---------- Views ---------- */
main{min-height:calc(100vh - 56px)}
.view{display:none} .view.on{display:block}
.page{max-width:1060px;margin:0 auto;padding:22px 16px 60px}
.page.wide{max-width:1200px}
.hero{display:flex;align-items:center;gap:18px;margin-bottom:18px;flex-wrap:wrap}
.hero .logo-big .ic{width:36px;height:36px}
.hero .logo-big{width:72px;height:72px;border-radius:20px;background:var(--walnut);display:grid;place-items:center;color:var(--gold);flex:none;box-shadow:var(--shadow)}
.hero>div:not(.logo-big){flex:1;min-width:200px}
.hero h2{font-size:2rem} .hero p{margin:4px 0 0}
.hero .hero-acts{display:flex;gap:8px;flex-wrap:wrap;flex:none}
.sec{font-size:1.05rem;font-weight:800;display:flex;align-items:center;gap:8px;margin:18px 0 10px;font-family:var(--font-d)}
.sec .spacer{flex:1}
html[lang=ur] .sec{font-family:var(--font-ur)}
.card>.sec:first-child,.card>.chart-head:first-child .sec{margin-top:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-width:0}
.card.flat:hover{transform:none}
.page>.card+.card{margin-top:14px}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 12px;color:var(--muted);text-align:center}
.empty .ic{width:34px;height:34px;opacity:.6}

/* ---------- Setup ---------- */
.seats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.seat{--c:var(--red);--cs:var(--red-soft);border-top:6px solid var(--c);display:flex;flex-direction:column;gap:10px;padding-top:14px}
.seat.green{--c:var(--green);--cs:var(--green-soft)} .seat.yellow{--c:var(--yellow);--cs:var(--yellow-soft)} .seat.blue{--c:var(--blue);--cs:var(--blue-soft)}
.seat-head{display:flex;align-items:center;gap:10px}
.seat-head>div:last-child{flex:1;min-width:0}
.seat-colour{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--c)}
html[lang=ur] .seat-colour{letter-spacing:0;text-transform:none;font-size:.9rem}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--font-d);font-weight:800;font-size:1.1rem;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);flex:none;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.resume{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;border-color:var(--gold);background:var(--gold-soft);margin-bottom:6px}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.two .sec{margin-top:0}
.two>div>.card+.card,.replay>div>.card+.card{margin-top:14px}
.rlist{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--surface-2)}
.rrow .avatar{width:34px;height:34px;font-size:.9rem}
.rrow .rmeta{font-size:.8rem;color:var(--muted)}
.rrow .spacer{flex:1}
.actions{display:flex;justify-content:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.hintline{font-size:.85rem;color:var(--muted);text-align:center;margin-top:10px}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}
.quick .card{display:flex;gap:12px;align-items:center;padding:12px 14px}
.quick .qicon{width:44px;height:44px;border-radius:14px;background:var(--gold-soft);color:var(--walnut);display:grid;place-items:center;flex:none}
.quick .qicon .ic{width:22px;height:22px}
.quick b{display:block} .quick small{color:var(--muted);display:block;font-size:.8rem}
.qcard{text-align:left;cursor:pointer;color:var(--ink);font:inherit;width:100%}
.qcard:hover{border-color:var(--gold)}
html[lang=ur] .qcard{text-align:right}
.seg.lv{display:grid;grid-template-columns:1fr 1fr}
.seg.lv button{flex-direction:column;gap:2px;padding:6px 6px;font-size:.82rem}
.seg.lv .stars .ic{width:.75em;height:.75em}

/* ---------- Game layout ---------- */
.game{display:grid;grid-template-columns:minmax(200px,236px) minmax(0,1fr) minmax(200px,236px);grid-template-rows:1fr 1fr;grid-template-areas:"p0 board p1" "p3 board p2";gap:14px;max-width:1260px;margin:0 auto;padding:14px 16px 30px;align-items:stretch}
#pp0{grid-area:p0;align-self:start} #pp1{grid-area:p1;align-self:start} #pp2{grid-area:p2;align-self:end} #pp3{grid-area:p3;align-self:end}
.pp{min-height:150px}
.boardwrap{grid-area:board;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.board{width:100%;max-width:min(640px,calc(100vh - 215px));aspect-ratio:1;border-radius:20px;background:linear-gradient(160deg,var(--frame-a),var(--frame-b));padding:10px;box-shadow:0 24px 50px -24px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.15)}
.board svg{width:100%;height:100%;display:block;border-radius:10px;overflow:visible}
.board .bg{fill:var(--surface)}
.board .sq{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.board .sq.red{fill:var(--red)} .board .sq.green{fill:var(--green)} .board .sq.yellow{fill:var(--yellow)} .board .sq.blue{fill:var(--blue)}
.board .sq.col{opacity:.9}
.board .base.red{fill:var(--red)} .board .base.green{fill:var(--green)} .board .base.yellow{fill:var(--yellow)} .board .base.blue{fill:var(--blue)}
.board .inner{fill:var(--surface);stroke:rgba(0,0,0,.12);stroke-width:1.5}
.board .slot.red{fill:var(--red-soft);stroke:var(--red)} .board .slot.green{fill:var(--green-soft);stroke:var(--green)} .board .slot.yellow{fill:var(--yellow-soft);stroke:var(--yellow)} .board .slot.blue{fill:var(--blue-soft);stroke:var(--blue)}
.board .slot{stroke-width:2;stroke-dasharray:3 3}
.board .tri.red{fill:var(--red)} .board .tri.green{fill:var(--green)} .board .tri.yellow{fill:var(--yellow)} .board .tri.blue{fill:var(--blue)}
.board .tri{stroke:var(--surface);stroke-width:1.5}
.board .star{fill:none;stroke:var(--muted);stroke-width:1.6;opacity:.75}
.board .arrow{stroke:#fff}
.board .arrow{fill:none;stroke-width:2.2;opacity:.9}
.board .sqn{font-size:9px;fill:var(--muted);opacity:.55;pointer-events:none;font-weight:700}
.tok .body{stroke-width:2}
.tok.red .body{fill:var(--red);stroke:var(--red-deep)} .tok.green .body{fill:var(--green);stroke:var(--green-deep)} .tok.yellow .body{fill:var(--yellow);stroke:var(--yellow-deep)} .tok.blue .body{fill:var(--blue);stroke:var(--blue-deep)}
.tok.red .ring{stroke:var(--red)} .tok.green .ring{stroke:var(--green)} .tok.yellow .ring{stroke:var(--yellow)} .tok.blue .ring{stroke:var(--blue)}
.tok .ring{opacity:0;fill:none;stroke-width:3;transform-box:fill-box;transform-origin:center}
.tok.legal{cursor:pointer}
.tok.legal .ring{animation:ringPulse 1.1s var(--ease) infinite}
.tok.legal .body{filter:drop-shadow(0 0 4px rgba(0,0,0,.35))}
.tok.hint .hintstar{display:block;animation:bob 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.tok .hintstar{display:none;fill:var(--gold);stroke:var(--walnut-deep);stroke-width:1}
.tok.last .body{stroke:var(--gold);stroke-width:3}
.tok:focus{outline:none}
.tok:focus-visible .body{stroke:var(--gold);stroke-width:4}
.tok:focus-visible .ring{opacity:1}
/* tutorial highlights */
@keyframes tutGlow{0%,100%{opacity:1}50%{opacity:.45}}
.board.tut-safe .star{stroke:var(--gold);stroke-width:3;opacity:1;animation:tutGlow 1.2s ease-in-out infinite}
.board.tut-safe .sq:is(.red,.green,.yellow,.blue):not(.col),.board.tut-home .sq.col.red{stroke:var(--gold);stroke-width:4;animation:tutGlow 1.2s ease-in-out infinite}
@keyframes ringPulse{0%{transform:scale(.8);opacity:.95}100%{transform:scale(1.5);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.hl{fill:none;stroke-width:3;stroke-dasharray:5 4;cursor:pointer;animation:hlPulse 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.hl.red{stroke:var(--red)} .hl.green{stroke:var(--green)} .hl.yellow{stroke:var(--yellow-deep)} .hl.blue{stroke:var(--blue)}
@keyframes hlPulse{0%,100%{opacity:.5;transform:scale(.95)}50%{opacity:1;transform:scale(1.05)}}

/* ---------- Player panels ---------- */
.pp{--c:var(--red);--cs:var(--red-soft);--cd:var(--red-deep);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px 12px 18px;box-shadow:var(--shadow);position:relative;display:flex;flex-direction:column;gap:10px;justify-content:space-between;transition:box-shadow .25s,transform .25s,border-color .25s,opacity .25s;min-width:0}
.pp.green{--c:var(--green);--cs:var(--green-soft);--cd:var(--green-deep)} .pp.yellow{--c:var(--yellow);--cs:var(--yellow-soft);--cd:var(--yellow-deep)} .pp.blue{--c:var(--blue);--cs:var(--blue-soft);--cd:var(--blue-deep)}
.pp::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:6px;border-radius:0 4px 4px 0;background:var(--c)}
.pp.active{border-color:var(--c);box-shadow:0 0 0 3px var(--cs),var(--shadow);transform:translateY(-2px)}
.pp.off{opacity:.5} .pp.off .avatar{background:var(--line);color:var(--muted);box-shadow:none}
.pp.done .avatar::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--gold)}
.pp .avatar{position:relative}
.pp-head{display:flex;align-items:center;gap:10px;min-width:0}
.who{flex:1;min-width:0} .nm{font-weight:800;font-family:var(--font-d);font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang=ur] .nm{font-family:var(--font-ur)}
.kind{font-size:.76rem;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.turnDot{width:12px;height:12px;border-radius:50%;background:var(--line);flex:none;transition:background .2s}
.pp.active .turnDot{background:var(--c);box-shadow:0 0 0 0 var(--c);animation:dotPulse 1.4s ease-out infinite}
@keyframes dotPulse{0%{box-shadow:0 0 0 0 var(--cs)}100%{box-shadow:0 0 0 8px transparent}}
.pp-mid{display:flex;align-items:center;justify-content:space-between;gap:10px}
.toks{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.toks i{width:16px;height:16px;border-radius:50%;border:2px solid var(--c);background:var(--surface);display:inline-block;position:relative;transition:background .3s}
.toks i.on{background:var(--c)}
.toks i.fin{background:var(--c);box-shadow:0 0 0 2px var(--cs)}
.toks i.fin::after{content:"";position:absolute;inset:4px;border-radius:50%;background:#fff}
.toks b{font-size:.8rem;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.pp-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted);min-height:22px}
.pst{display:flex;gap:10px;align-items:center;font-variant-numeric:tabular-nums} .pst span{display:inline-flex;align-items:center;gap:3px}
.pst .place{color:var(--gold);font-weight:800}
.think{display:none;align-items:center;gap:6px;color:var(--c);font-weight:700}
.think.on{display:inline-flex} .think.on::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}

/* ---------- Dice (3D cube) ---------- */
.dice{--sz:54px;width:var(--sz);height:var(--sz);perspective:280px;transition:opacity .3s;background:none;border:0;padding:0;cursor:default;position:relative;flex:none;border-radius:14px}
.dice.canroll{cursor:pointer}
.dice.canroll::after{content:"";position:absolute;inset:-7px;border-radius:16px;border:2px dashed var(--c);animation:spinRing 8s linear infinite;pointer-events:none}
@keyframes spinRing{to{transform:rotate(360deg)}}
.dice.idle{opacity:.45}
.dice.rolling{animation:shake .85s var(--ease)}
@keyframes shake{0%{transform:translate(0,0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(2px,3px)}100%{transform:translate(0,0)}}
.cube{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .85s var(--ease);transform:rotateX(0) rotateY(0)}
.face{position:absolute;inset:0;background:var(--face);border-radius:22%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:15%;gap:5%;box-shadow:inset 0 0 0 2px var(--face-edge),0 2px 6px rgba(0,0,0,.15)}
.face i{border-radius:50%;background:var(--pip);display:block}
.pp .face i{background:var(--c)}
.face.f1{transform:translateZ(calc(var(--sz)/2))} .face.f6{transform:rotateY(180deg) translateZ(calc(var(--sz)/2))}
.face.f3{transform:rotateY(90deg) translateZ(calc(var(--sz)/2))} .face.f4{transform:rotateY(-90deg) translateZ(calc(var(--sz)/2))}
.face.f5{transform:rotateX(90deg) translateZ(calc(var(--sz)/2))} .face.f2{transform:rotateX(-90deg) translateZ(calc(var(--sz)/2))}

/* ---------- Status bar / meta / coach ---------- */
.statusbar{display:flex;align-items:center;gap:10px;background:var(--walnut);color:var(--cream);border-radius:14px;padding:8px 12px;width:100%;max-width:min(640px,calc(100vh - 215px));flex-wrap:wrap;box-shadow:var(--shadow)}
.statusbar .dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.15)}
.dot.red{background:var(--red)} .dot.green{background:var(--green)} .dot.yellow{background:var(--yellow)} .dot.blue{background:var(--blue)}
.statusbar .msg{flex:1 1 180px;font-weight:700;min-width:0;font-size:.95rem}
.statusbar .acts{display:flex;gap:6px;align-items:center}
.statusbar .tb{height:36px;min-width:36px;border-radius:10px}
.statusbar .btn.gold{min-height:38px;padding:6px 16px}
.meta{display:flex;gap:14px;align-items:center;font-size:.82rem;color:var(--muted);width:100%;max-width:min(640px,calc(100vh - 215px));flex-wrap:wrap;padding:0 4px}
.meta span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.meta .last{flex:1 1 160px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .keys{display:none}
.meta .tn{color:var(--gold-deep,var(--walnut));font-weight:700}
.coach{width:100%;max-width:min(640px,calc(100vh - 215px));background:var(--gold-soft);border:1px solid var(--gold);border-radius:14px;padding:12px 14px;display:none;gap:12px;align-items:flex-start;animation:pop .3s var(--ease) both}
.coach.on{display:flex}
.coach .cicon{width:40px;height:40px;border-radius:12px;background:var(--gold);color:var(--walnut-deep);display:grid;place-items:center;flex:none}
.coach .cbody{flex:1;min-width:0} .coach b{display:block;font-family:var(--font-d);font-size:1.05rem}
html[lang=ur] .coach b{font-family:var(--font-ur)}
.coach p{margin:2px 0 8px;font-size:.9rem}
.coach .cacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.coach .steps{font-size:.75rem;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
body.coaching .board,body.coaching .statusbar,body.coaching .meta,body.coaching .coach{max-width:min(640px,calc(100vh - 330px))}

/* ---------- Drawer / modal / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(43,29,20,.45);backdrop-filter:blur(2px);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
body.drawer-open .scrim{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);background:var(--surface);z-index:50;transform:translateX(102%);transition:transform .3s var(--ease);box-shadow:-20px 0 60px -30px rgba(0,0,0,.5);display:flex;flex-direction:column}
body.drawer-open .drawer{transform:none}
.drawer header{display:flex;align-items:center;gap:10px;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.drawer header h2{font-size:1.3rem;flex:1}
.drawer .body{padding:12px 18px 30px;overflow:auto}
.drawer h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 8px}
html[lang=ur] .drawer h3{letter-spacing:0;text-transform:none;font-size:.95rem}
.drawer .seg{display:flex;width:100%}
.drawer .row{display:flex;gap:8px;flex-wrap:wrap}
.close{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:auto;min-width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);cursor:pointer;display:inline-flex;align-items:center;gap:3px;padding:0 8px}
.swatch i{width:12px;height:12px;border-radius:50%;display:inline-block}
.swatch.on{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.swatch.frame{background:linear-gradient(160deg,var(--fa),var(--fb));min-width:48px}
.swatch .lbl{font-size:.75rem;font-weight:700;margin-left:4px;color:var(--ink)}
.pickers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.picker{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:4px 10px 4px 4px;font-weight:700;font-size:.85rem;cursor:pointer;min-height:44px}
.picker input{width:40px;height:34px;border:0;padding:0;background:none;cursor:pointer}
.inbox-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.inbox-list li{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.inbox-list li.unread{border-color:var(--gold);background:var(--gold-soft)}
.inbox-list .iicon{width:34px;height:34px;border-radius:10px;background:var(--surface);display:grid;place-items:center;color:var(--walnut);flex:none}
.inbox-list .itext{flex:1;min-width:0;font-size:.9rem} .inbox-list .itime{font-size:.75rem;color:var(--muted);display:block;margin-top:2px}
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(43,29,20,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s}
.modal.open{opacity:1;pointer-events:auto}
.modal .box{background:var(--surface);border-radius:20px;padding:22px 24px;width:min(560px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px -30px rgba(0,0,0,.6);transform:scale(.96);transition:transform .25s var(--ease);position:relative}
.modal.open .box{transform:none}
.modal h2{font-size:1.6rem;display:flex;align-items:center;gap:10px;padding-right:44px}
.modal .x{position:absolute;top:14px;right:14px}
.modal .btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:16px 0 6px}
.pod{--c:var(--red);display:flex;flex-direction:column;align-items:center;gap:6px;width:120px;min-width:0}
.pod.green{--c:var(--green)} .pod.yellow{--c:var(--yellow)} .pod.blue{--c:var(--blue)}
.pod .pn{font-weight:800;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pod .col{width:100%;border-radius:12px 12px 0 0;background:var(--c);display:grid;place-items:end center;color:#fff;font-family:var(--font-d);font-weight:800;font-size:1.3rem;padding-bottom:6px;animation:grow .7s var(--ease) both;transform-origin:bottom;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.pod.r1 .col{height:118px} .pod.r2 .col{height:84px;animation-delay:.1s} .pod.r3 .col{height:58px;animation-delay:.2s}
.pod .avatar{width:48px;height:48px;font-size:1.2rem}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
table.stats{width:100%;border-collapse:collapse;margin-top:12px;font-size:.9rem}
table.stats th,table.stats td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line)}
table.stats td:first-child{white-space:nowrap}
table.stats th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
html[lang=ur] table.stats th{letter-spacing:0;text-transform:none;font-size:.85rem}
table.stats td.num,table.stats th.num{text-align:right;font-variant-numeric:tabular-nums}
table.stats .sw-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
table.stats tr.me td{background:var(--gold-soft)}
.tablewrap{overflow-x:auto;max-width:100%}
.loglist{list-style:none;margin:10px 0 0;padding:0;max-height:220px;overflow:auto;font-size:.86rem}
.loglist li{padding:6px 8px;border-bottom:1px dashed var(--line);display:flex;gap:8px;align-items:center}
.loglist li .dot{width:10px;height:10px;border-radius:50%;flex:none}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:70;pointer-events:none;max-width:calc(100vw - 32px)}
.toast{background:var(--walnut-deep);color:var(--cream);padding:10px 16px;border-radius:12px;font-weight:700;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);display:flex;align-items:center;gap:8px;transition:opacity .35s,transform .35s var(--ease);animation:fadeUp .3s var(--ease) both}
.toast.ok{background:var(--green-deep)} .toast.bad{background:var(--red-deep)} .toast.gold{background:var(--gold);color:var(--walnut-deep)}
.toast.out{opacity:0;transform:translateY(8px)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:65;display:none}
#confetti.on{display:block}

/* ---------- Onboarding tour (spotlight) ---------- */
.tour{position:fixed;inset:0;z-index:80;display:none}
.tour.on{display:block}
.tour-hole{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgba(43,29,20,.55);transition:all .3s var(--ease);pointer-events:none;border:2px solid var(--gold)}
.tour-card{position:fixed;width:min(340px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border-radius:16px;padding:16px 18px;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);animation:pop .3s var(--ease) both}
.tour-card b{display:block;font-family:var(--font-d);font-size:1.1rem;margin-bottom:4px}
html[lang=ur] .tour-card b{font-family:var(--font-ur)}
.tour-card p{margin:0 0 12px;font-size:.9rem}
.tour-card .tacts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tour-card .tstep{font-size:.78rem;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}

/* ---------- Stats page: KPI tiles + charts ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .kl{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .kv{font-family:var(--font-d);font-weight:800;font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
html[lang=ur] .kpi .kv{font-family:var(--font-ur)}
.kpi .kh{font-size:.75rem;color:var(--muted)}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:11px;font-weight:600}
.chart .lbl{fill:var(--ink);font-size:11px;font-weight:700}
.chart .lbl.light{fill:#fff}
.chart .halo{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.block{display:block}
.chart .ref{stroke:var(--muted);stroke-width:1}
.chart .line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{stroke:var(--surface);stroke-width:2}
.chart .mark{cursor:pointer}
.chart .mark:hover{opacity:.85}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:6px 0 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend i.ln{height:3px;border-radius:2px;width:16px}
.tip{position:fixed;z-index:90;background:var(--walnut-deep);color:var(--cream);padding:6px 10px;border-radius:8px;font-size:.8rem;font-weight:700;pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap;box-shadow:0 8px 24px -10px rgba(0,0,0,.5)}
.tip.on{opacity:1}
.chart-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chart-head .sec{margin:0;flex:1}
.chart-head select{width:auto;min-width:120px;padding:6px 10px;min-height:36px}

/* ---------- Achievements ---------- */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ach{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.ach .aicon{width:44px;height:44px;border-radius:14px;background:var(--gold);color:var(--walnut-deep);display:grid;place-items:center;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.ach .aicon .ic{width:22px;height:22px}
.ach.locked{opacity:.6} .ach.locked .aicon{background:var(--surface-2);color:var(--muted);box-shadow:none}
.ach b{display:block;font-size:.95rem} .ach small{display:block;color:var(--muted);font-size:.8rem}
.ach .bar{height:6px;border-radius:3px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.ach .bar>i{display:block;height:100%;background:var(--gold);border-radius:3px}
.ach .adate{font-size:.72rem;color:var(--muted);margin-top:4px;display:block}

/* ---------- Tournament ---------- */
.progress{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin:8px 0}
.progress>i{display:block;height:100%;background:var(--gold);border-radius:5px}
.matches{display:flex;flex-direction:column;gap:8px}
.match{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface-2);flex-wrap:wrap}
.match.live{border-color:var(--gold);background:var(--gold-soft)}
.match .mno{font-size:.75rem;color:var(--muted);font-weight:800;min-width:64px}
.match .mplayers{flex:1;display:flex;gap:6px;flex-wrap:wrap;min-width:0;align-items:center}
.match .mres{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.match .macts{display:flex;gap:6px}
.rank{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--surface-2);font-weight:800;font-size:.8rem}
.rank.r1{background:var(--gold);color:var(--walnut-deep)}
.plist{display:flex;flex-direction:column;gap:8px}

/* ---------- Replay ---------- */
.replay{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,320px);gap:16px;align-items:start}
.replay .board{max-width:min(560px,calc(100vh - 180px));margin:0 auto}
.rp-ctrl{display:flex;flex-direction:column;gap:12px}
.rp-ctrl .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rp-ctrl .row .spacer{flex:1}
input[type=range]{width:100%;accent-color:var(--walnut);height:40px;margin:0}
.rp-desc{min-height:52px;background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:.9rem;display:flex;gap:8px;align-items:center}
.rp-desc .dot{width:12px;height:12px;border-radius:50%;flex:none}
.rp-list{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow:auto}
.rp-list .rrow{cursor:pointer} .rp-list .rrow.on{border-color:var(--gold);background:var(--gold-soft)}

/* ---------- Report (printable) ---------- */
.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px 30px;box-shadow:var(--shadow)}
.report h2{font-size:1.6rem} .report .rhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;border-bottom:2px solid var(--walnut);padding-bottom:12px;margin-bottom:14px}
.report h3{font-size:1rem;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.report .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.report .movelist{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.report table.stats{margin-top:0}
.report .rules-chips{display:flex;gap:6px;flex-wrap:wrap}
.report .rstamp{text-align:right}
.pname{display:inline-flex;align-items:center;gap:8px}

/* ---------- About ---------- */
.about ol,.about ul{padding-left:20px;margin:6px 0} .about li{margin:5px 0}
html[lang=ur] .about ol,html[lang=ur] .about ul{padding-left:0;padding-right:22px}
.todo{border:1px dashed var(--walnut);border-radius:12px;padding:12px 14px;background:var(--surface-2);margin-bottom:10px}
.todo h4{margin:0 0 4px;font-size:.95rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.todo .tag{font-size:.7rem;background:var(--walnut);color:var(--cream);border-radius:6px;padding:2px 7px;font-weight:800;letter-spacing:.03em}
.stars{display:inline-flex;gap:2px;color:var(--gold)}
.stars .ic{width:.9em;height:.9em} .stars .ic.on{fill:var(--gold)}
.kbd .ic{width:.9em;height:.9em;vertical-align:-.15em}

<script>
'use strict';
/* =====================================================================
   Ludo — single-file game (FYP template #18)
   Sections: utils · i18n · prefs · geometry · engine (pure) · AI (heuristic +
   expectimax) · sound · board SVG · animations · rendering · turn flow ·
   results (player stats, replays, achievements, inbox) · modal/stats/win ·
   setup · settings drawer · inbox · tournament · replay viewer · statistics
   page + charts · tutorial · onboarding tour · printable report · about ·
   topbar/keyboard/router · public API + self-test · init
   Student extension points are marked with  TODO(student)
   ===================================================================== */

// ---------- utils ----------
const NS = 'ludo:';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

/** Namespaced localStorage wrapper; every read/write is guarded. */
const store = {
  get(k, d) {
    try {
      const v = localStorage.getItem(NS + k);
      return v == null ? d : JSON.parse(v);
    } catch {
      return d;
    }
  },
  set(k, v) {
    try {
      localStorage.setItem(NS + k, JSON.stringify(v));
    } catch {
      /* quota or private mode — the game keeps working in memory */
    }
  },
  del(k) {
    try {
      localStorage.removeItem(NS + k);
    } catch {
      /* ignore */
    }
  }
};

const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ESC_MAP[c]);
const ic = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const uid = () => Math.random().toString(36).slice(2, 9);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = arr => arr.reduce((a, b) => a + b, 0);
const today = () => new Date().toISOString().slice(0, 10);

/** Uniform random in [0,1) from the CSPRNG. */
const rnd = () => {
  const a = new Uint32Array(1);
  crypto.getRandomValues(a);
  return a[0] / 4294967296;
};

/** Fair die: crypto randomness with rejection sampling (no modulo bias). */
const rollDie = () => {
  const a = new Uint32Array(1);
  do {
    crypto.getRandomValues(a);
  } while (a[0] >= 4294967292);
  return (a[0] % 6) + 1;
};

const pad2 = n => String(n).padStart(2, '0');
const fmtTime = ms => {
  const s = Math.floor(ms / 1000);
  const hours = s >= 3600 ? Math.floor(s / 3600) + ':' : '';
  return hours + pad2(Math.floor(s / 60) % 60) + ':' + pad2(s % 60);
};
const fmtDate = iso => {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return String(iso || '');
  return d.toLocaleDateString(lang === 'ur' ? 'ur-PK' : 'en-PK', { day: 'numeric', month: 'short', year: 'numeric' });
};
const fmtPct = v => Math.round(v * 100) + '%';

const reducedOS = matchMedia('(prefers-reduced-motion: reduce)').matches;
/** True when motion should be skipped (OS setting or the accessibility toggle). */
const motionOff = () => reducedOS || !!(prefs.a11y && prefs.a11y.reduceMotion);

const toast = (msg, type = '', icon = 'info') => {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = ic(icon) + '<span></span>';
  el.lastChild.textContent = msg;
  $('#toasts').append(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 380);
  }, 2600);
};

/** Page-enter animation + stagger indices (motion kit). */
const animateIn = root => {
  root.classList.remove('enter');
  void root.offsetWidth;
  root.classList.add('enter');
  $$('.stagger', root).forEach(g => [...g.children].forEach((el, i) => el.style.setProperty('--i', i)));
};

/** Animated number for KPI tiles. */
const countUp = (el, to, { dur = 700, fmt = v => Math.round(v).toLocaleString('en-PK') } = {}) => {
  if (motionOff()) {
    el.textContent = fmt(to);
    return;
  }
  const t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(to * e);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
};

/** SVG path draw-in for chart lines. */
const drawPath = p => {
  if (motionOff()) return;
  const len = p.getTotalLength();
  p.style.strokeDasharray = len;
  p.style.strokeDashoffset = len;
  p.getBoundingClientRect();
  p.style.transition = 'stroke-dashoffset .9s var(--ease)';
  p.style.strokeDashoffset = 0;
};

/** Polite live region for status text. */
const announce = msg => {
  $('#live').textContent = msg;
};

/** Download a JSON object as a file. */
function downloadJSON(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/** Shared tooltip for chart marks: elements with data-tip show it on hover/focus. */
function bindTips(root) {
  const tip = $('#tip');
  const show = e => {
    const el = e.target.closest('[data-tip]');
    if (!el) return;
    tip.textContent = el.dataset.tip;
    tip.classList.add('on');
    const r = el.getBoundingClientRect();
    const x = clamp(r.left + r.width / 2 - tip.offsetWidth / 2, 8, innerWidth - tip.offsetWidth - 8);
    tip.style.left = x + 'px';
    tip.style.top = Math.max(8, r.top - tip.offsetHeight - 8) + 'px';
  };
  const hide = () => tip.classList.remove('on');
  root.addEventListener('mouseover', show);
  root.addEventListener('focusin', show);
  root.addEventListener('mouseout', hide);
  root.addEventListener('focusout', hide);
}

/** Face counts for a seed game: the recorded sixes, the other rolls spread over 1–5 with a small wobble. */
function seedFaces(rows, k) {
  const rolls = rows.reduce((a, r) => a + r[8], 0);
  const sixes = rows.reduce((a, r) => a + r[7], 0);
  const rest = rolls - sixes;
  const wobble = [2, -1, 1, -2, 0];
  const faces = wobble.map((_, f) => Math.floor(rest / 5) + wobble[(f + k) % 5]);
  faces[4] += rest - faces.reduce((a, b) => a + b, 0);
  return [...faces, sixes];
}

/** Expand the compact seed rows into history records. */
function seedHistory() {
  return SEED_HISTORY_ROWS.map(([date, turns, time, rows], k) => ({
    id: 'seed' + k,
    date,

    players: rows.map(([name, seat, type, level, place, caps, lost, sixes, rolls, home]) => ({ name, seat, type, level, place, caps, lost, sixes, rolls, home }))
  }));
}

// ---------- board geometry (15×15 grid, 40px cells) ----------
const CELL = 40;
const BW = CELL * 15;
const FINISH = 56;
const SEATS = ['red', 'green', 'yellow', 'blue'];       // clockwise: TL, TR, BR, BL
const OFFSET = [0, 13, 26, 39];                          // each colour's start index on the 52-square loop
const STARS = [8, 21, 34, 47];
const SAFE = new Set([0, 8, 13, 21, 26, 34, 39, 47]);    // 4 start squares + 4 stars (default rules)

/** Is absolute loop square `abs` safe under the current rules? */
const isSafe = abs => OFFSET.includes(abs) || (prefs.rules.safeStars && STARS.includes(abs));

/** Absolute loop, index 0 = red start square, running clockwise. */
const TRACK = (() => {
  const p = [];
  const add = (r, c) => p.push([r, c]);
  for (let c = 1; c <= 5; c++) add(6, c);
  for (let r = 5; r >= 0; r--) add(r, 6);
  add(0, 7);
  for (let r = 0; r <= 5; r++) add(r, 8);
  for (let c = 9; c <= 14; c++) add(6, c);
  add(7, 14);
  for (let c = 14; c >= 9; c--) add(8, c);
  for (let r = 9; r <= 14; r++) add(r, 8);
  add(14, 7);
  for (let r = 14; r >= 9; r--) add(r, 6);
  for (let c = 5; c >= 0; c--) add(8, c);
  add(7, 0);
  add(6, 0);
  return p;
})();

const HOMECOL = [
  [1, 2, 3, 4, 5].map(c => [7, c]),
  [1, 2, 3, 4, 5].map(r => [r, 7]),
  [13, 12, 11, 10, 9].map(c => [7, c]),
  [13, 12, 11, 10, 9].map(r => [r, 7])
];
const BASE_ORIGIN = [[0, 0], [0, 9], [9, 9], [9, 0]];             // [row,col] of each 6×6 base
const SLOT = [[1.9, 1.9], [4.1, 1.9], [1.9, 4.1], [4.1, 4.1]];     // token slots inside a base (cell units, x then y)
const TRI_CENTRE = [[6.55, 7.5], [7.5, 6.55], [8.45, 7.5], [7.5, 8.45]];

const absOf = (p, rel) => (OFFSET[p] + rel) % 52;
const cellXY = (r, c) => [(c + 0.5) * CELL, (r + 0.5) * CELL];

/** Pixel centre of a token: pos -1 = base slot, 0..50 = loop, 51..55 = home column, 56 = centre triangle. */
function posPoint(p, pos, i) {
  if (pos === -1) {
    const [br, bc] = BASE_ORIGIN[p];
    const [sx, sy] = SLOT[i];
    return [(bc + sx) * CELL, (br + sy) * CELL];
  }
  if (pos <= 50) {
    const [r, c] = TRACK[absOf(p, pos)];
    return cellXY(r, c);
  }
  if (pos < FINISH) {
    const [r, c] = HOMECOL[p][pos - 51];
    return cellXY(r, c);
  }
  const [cx, cy] = TRI_CENTRE[p];
  const k = (i - 1.5) * 0.34;
  return p % 2 === 0 ? [cx * CELL, (cy + k) * CELL] : [(cx + k) * CELL, cy * CELL];
}

/** Key shared by every token standing on the same visual square (used for stacking). */
function cellKey(p, pos, i) {
  if (pos === -1) return `b${p}${i}`;
  if (pos === FINISH) return `f${p}${i}`;
  if (pos <= 50) return `t${absOf(p, pos)}`;
  return `h${p}${pos}`;
}

/** Scale and offsets for 1–4 tokens sharing a square. */
const STACK = [
  { s: 1, off: [[0, 0]] },
  { s: 0.78, off: [[-8, 0], [8, 0]] },
  { s: 0.66, off: [[-8, -7], [8, -7], [0, 7]] },
  { s: 0.6, off: [[-8, -8], [8, -8], [-8, 8], [8, 8]] }
];

// ---------- engine (pure functions over a game object G) ----------
function newGame(seats) {
  const players = seats.map((s, p) => ({
    type: s.type,
    level: s.level || 'medium',
    name: (s.name || '').trim() || L.en[SEATS[p]]
  }));
  const active = players.map((pl, p) => (pl.type !== 'off' ? p : -1)).filter(p => p >= 0);
  const G = {
    v: 1,
    id: uid(),
    players,
    tokens: players.map(() => [-1, -1, -1, -1]),
    turn: active[0] ?? 0,
    phase: 'roll',
    dice: null,
    sixes: 0,
    legal: null,
    turnNo: 1,
    elapsed: 0,
    winOrder: [],
    log: [],
    history: [],
    faces: [0, 0, 0, 0, 0, 0],
    startedAt: Date.now(),
    stats: players.map(() => ({ rolls: 0, sixes: 0, captures: 0, lost: 0, turns: 0 }))
  };
  G.stats[G.turn].turns = 1;
  gameLog(G, 'ev_start', G.turn);
  return G;
}

const activeSeats = G => G.players.map((pl, p) => (pl.type !== 'off' ? p : -1)).filter(p => p >= 0);
const allHome = (G, p) => G.tokens[p].every(x => x === FINISH);
const homeCount = (G, p) => G.tokens[p].filter(x => x === FINISH).length;

function gameLog(G, k, p, extra = {}) {
  G.log.unshift({ k, p, ...extra, n: G.turnNo });
  if (G.log.length > 60) G.log.length = 60;
}

/** Every token (of any colour) standing on absolute loop square `abs`. */
function occupantsAbs(G, abs) {
  const out = [];
  G.tokens.forEach((tk, q) => {
    tk.forEach((pos, i) => {
      if (pos >= 0 && pos <= 50 && absOf(q, pos) === abs) out.push({ p: q, i, pos });
    });
  });
  return out;
}

/** All legal moves for player p with die d. Each move: {p,i,from,to,capture:[{p,i,pos}],finish,safe}. */
function legalMoves(G, p, d) {
  const out = [];
  const R = prefs.rules;
  G.tokens[p].forEach((pos, i) => {
    if (pos === FINISH) return;
    let to;
    if (pos === -1) {
      if (d !== 6) return;
      to = 0;
    } else {
      to = pos + d;
      if (to > FINISH) {
        if (R.exactFinish) return;
        to = FINISH;
      }
    }
    const mv = { p, i, from: pos, to, capture: [], finish: to === FINISH, safe: false };
    if (to <= 50) {
      const abs = absOf(p, to);
      mv.safe = isSafe(abs);
      const opp = occupantsAbs(G, abs).filter(o => o.p !== p);
      if (opp.length && !mv.safe) {
        const byOwner = {};
        opp.forEach(o => { byOwner[o.p] = (byOwner[o.p] || 0) + 1; });
        if (R.blocks && Object.values(byOwner).some(n => n >= 2)) return;   // cannot land on a block
        mv.capture = opp;
      }
    }
    out.push(mv);
  });
  return out;
}

/** Mutates G: moves the token, sends captured tokens home, records finishes/wins. */
function applyMove(G, mv) {
  const p = mv.p;
  G.tokens[p][mv.i] = mv.to;
  if (mv.from === -1) gameLog(G, 'ev_out', p);
  mv.capture.forEach(c => {
    G.tokens[c.p][c.i] = -1;
    G.stats[p].captures++;
    G.stats[c.p].lost++;
    gameLog(G, 'ev_capture', p, { v: c.p });
  });
  if (mv.finish) {
    gameLog(G, 'ev_finish', p);
    if (allHome(G, p) && !G.winOrder.includes(p)) {
      G.winOrder.push(p);
      gameLog(G, 'ev_win', p, { place: G.winOrder.length });
    }
  }
  return { captured: mv.capture, finished: mv.finish };
}

/** Decides who rolls next after a move (extra roll on 6 / capture / finish bonus) and detects game over. */
function afterMove(G, mv, d) {
  const p = mv.p;
  const active = activeSeats(G);
  const R = prefs.rules;
  if (active.length > 1 && G.winOrder.length >= active.length - 1) {
    active.filter(q => !G.winOrder.includes(q)).forEach(q => G.winOrder.push(q));
    G.phase = 'over';
    G.legal = null;
    return;
  }
  const extra = d === 6 || (mv.capture.length > 0 && R.captureBonus) || (mv.finish && R.finishBonus);
  if (extra && !allHome(G, p)) {
    G.phase = 'roll';
    G.legal = null;
    G.dice = null;
  } else {
    nextTurn(G);
  }
}

function nextTurn(G) {
  G.sixes = 0;
  G.dice = null;
  G.legal = null;
  let q = G.turn;
  for (let k = 0; k < 4; k++) {
    q = (q + 1) % 4;
    if (G.players[q].type !== 'off' && !allHome(G, q)) break;
  }
  G.turn = q;
  G.phase = 'roll';
  G.turnNo++;
  G.stats[q].turns++;
}

/** Applies a die value to the current player: returns {forfeit} | {none, six} | {moves}. */
function resolveRoll(G, d) {
  const p = G.turn;
  G.dice = d;
  G.stats[p].rolls++;
  if (d === 6) G.stats[p].sixes++;
  (G.faces ??= [0, 0, 0, 0, 0, 0])[d - 1]++;
  G.sixes = d === 6 ? G.sixes + 1 : 0;
  if (prefs.rules.threeSixes && G.sixes >= 3) {
    gameLog(G, 'ev_forfeit', p);
    return { forfeit: true };
  }
  const moves = legalMoves(G, p, d);
  if (!moves.length) {
    gameLog(G, 'ev_nomove', p, { d });
    return { none: true, six: d === 6 };
  }
  return { moves };
}

/** Light copy of G for search and simulation: no log/history, fresh stats. */
function cloneForSearch(G) {
  return {
    players: G.players,
    tokens: G.tokens.map(tk => tk.slice()),
    turn: G.turn,
    phase: G.phase,
    dice: G.dice,
    sixes: G.sixes,
    legal: null,
    turnNo: G.turnNo,
    winOrder: G.winOrder.slice(),
    log: [],
    history: [],
    faces: [0, 0, 0, 0, 0, 0],
    stats: G.players.map(() => ({ rolls: 0, sixes: 0, captures: 0, lost: 0, turns: 0 }))
  };
}


// ---------- AI: heuristic scorer (easy / medium / hard) ----------
/** Opponent tokens 1–6 squares behind relative square `rel` of player p that could land on it next roll. */
function threats(G, p, rel) {
  if (rel < 0 || rel > 50) return [];
  const abs = absOf(p, rel);
  if (isSafe(abs)) return [];
  const out = [];
  G.tokens.forEach((tk, q) => {
    if (q === p || G.players[q].type === 'off') return;
    tk.forEach(pos => {
      if (pos < 0 || pos > 50) return;
      const dist = (abs - absOf(q, pos) + 52) % 52;
      if (dist >= 1 && dist <= 6 && pos + dist <= 50) out.push({ q, dist });
    });
  });
  return out;
}
const threatProb = (G, p, rel) => Math.min(1, threats(G, p, rel).length / 6);

/** Heuristic score of a move; `hard` adds a one-ply look-ahead on capture probability. */
function scoreMove(G, p, mv, level) {
  let s = 0;
  if (mv.finish) s += 100;
  if (mv.capture.length) s += 60 + mv.capture.reduce((a, c) => a + Math.max(0, c.pos), 0);
  if (mv.from === -1) s += 25;
  if (mv.from >= 0 && threats(G, p, mv.from).length) s += 30;               // escaping danger
  if (mv.to <= 50 && mv.safe) s += 20;
  if (mv.to >= 51 && mv.to < FINISH) s += 15;                              // home column is untouchable
  s += mv.to * 0.5;                                                        // progress
  if (mv.to <= 50 && !mv.safe) {
    const th = threats(G, p, mv.to);
    if (th.length) s -= 25;
    if (level === 'hard') s -= threatProb(G, p, mv.to) * (mv.to + 15);     // expected loss
  }
  return s;
}

/** Deterministic best move by the hard heuristic (used as the opponent model). */
function greedyMove(G, p, moves) {
  let best = moves[0];
  let bs = -Infinity;
  moves.forEach(mv => {
    const sc = scoreMove(G, p, mv, 'hard');
    if (sc > bs) {
      bs = sc;
      best = mv;
    }
  });
  return best;
}

// ---------- AI: expert = expectimax with one roll of lookahead ----------
/** Value of a single token position: progress, with a premium for the untouchable home column. */
function progressValue(pos) {
  if (pos === -1) return 0;
  if (pos === FINISH) return 100;
  if (pos >= 51) return 72 + (pos - 51) * 4;
  return 12 + pos;
}

/** Static evaluation of a position from player p's point of view (higher is better). */
function evalPosition(G, p) {
  const mine = sum(G.tokens[p].map(progressValue));
  let risk = 0;
  G.tokens[p].forEach(pos => {
    if (pos >= 0 && pos <= 50) risk += threatProb(G, p, pos) * (pos + 12);
  });
  let bestOpp = 0;
  let oppTotal = 0;
  let n = 0;
  activeSeats(G).forEach(q => {
    if (q === p) return;
    const v = sum(G.tokens[q].map(progressValue));
    bestOpp = Math.max(bestOpp, v);
    oppTotal += v;
    n++;
  });
  const place = G.winOrder.indexOf(p);
  const winBonus = place >= 0 ? 300 - 100 * place : 0;
  return mine - risk - 0.5 * bestOpp - 0.25 * (n ? oppTotal / n : 0) + winBonus;
}

/** Max node for player p: the move whose resulting position evaluates best. */
function bestByEval(G, p, moves) {
  let best = moves[0];
  let bv = -Infinity;
  moves.forEach(mv => {
    const g = cloneForSearch(G);
    applyMove(g, mv);
    const v = evalPosition(g, p);
    if (v > bv) {
      bv = v;
      best = mv;
    }
  });
  return best;
}

/**
 * Chance node: average over the six die values of whoever rolls next.
 * The next roller is p itself after an extra roll (it then maximises its own evaluation),
 * otherwise an opponent answering with the hard heuristic's choice.
 */
function expectNextRoll(after, p) {
  if (after.phase === 'over') return evalPosition(after, p);
  let total = 0;
  for (let d = 1; d <= 6; d++) {
    const g = cloneForSearch(after);
    const q = g.turn;
    const r = resolveRoll(g, d);
    if (r.moves) {
      const reply = q === p ? bestByEval(g, p, r.moves) : greedyMove(g, q, r.moves);
      applyMove(g, reply);
    }
    total += evalPosition(g, p);
  }
  return total / 6;
}

/** Expectimax root: apply each candidate to a copy, resolve the turn order, average the next roll. */
function expertChoose(G, p, moves) {
  const d = G.dice || 6;
  let best = moves[0];
  let bv = -Infinity;
  moves.forEach(mv => {
    const g = cloneForSearch(G);
    applyMove(g, mv);
    afterMove(g, mv, d);
    const v = expectNextRoll(g, p) + scoreMove(G, p, mv, 'hard') * 0.05 + rnd() * 0.001;
    if (v > bv) {
      bv = v;
      best = mv;
    }
  });
  return best;
}

/** Picks a move for an AI seat at the given level. */
function aiChoose(G, p, moves, level = 'medium') {
  // TODO(student): Monte-Carlo level — add a fifth level that plays N random rollouts per candidate move from cloneForSearch(G) and picks the best average finishing place; compare it with Expert in the AI arena.
  if (!moves.length) return null;
  if (level === 'easy' && rnd() < 0.4) return moves[Math.floor(rnd() * moves.length)];
  if (level === 'expert') return expertChoose(G, p, moves);
  let best = null;
  let bs = -Infinity;
  moves.forEach(mv => {
    const sc = scoreMove(G, p, mv, level) + rnd() * 0.01;
    if (sc > bs) {
      bs = sc;
      best = mv;
    }
  });
  return best;
}


// ---------- sound (WebAudio synth, created only after a real user gesture) ----------
const Snd = {
  ctx: null,
  init() {
    if (this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    } catch {
      this.ctx = null;
    }
  },
  ready() {
    return prefs.sound && this.ctx && this.ctx.state === 'running';
  },
  tone(f, dur, type = 'sine', gain = 0.12, at = 0, slideTo) {
    if (!this.ready()) return;
    const c = this.ctx;
    const o = c.createOscillator();
    const g = c.createGain();
    const t0 = c.currentTime + at;
    o.type = type;
    o.frequency.setValueAtTime(f, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.02);
  },
  noise(dur, gain, at = 0) {
    if (!this.ready()) return;
    const c = this.ctx;
    const b = c.createBuffer(1, c.sampleRate * dur, c.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const s = c.createBufferSource();
    const g = c.createGain();
    const f = c.createBiquadFilter();
    f.type = 'highpass';
    f.frequency.value = 1200;
    s.buffer = b;
    g.gain.value = gain;
    s.connect(f).connect(g).connect(c.destination);
    s.start(c.currentTime + at);
  },
  dice() { [0, 0.12, 0.26, 0.42, 0.6].forEach((at, i) => this.noise(0.06, 0.25 - i * 0.03, at)); },
  hop() { this.tone(540, 0.07, 'triangle', 0.07); },
  six() {
    this.tone(660, 0.12, 'square', 0.06);
    this.tone(990, 0.16, 'square', 0.06, 0.1);
  },
  capture() {
    this.tone(620, 0.35, 'sawtooth', 0.1, 0, 140);
    this.noise(0.2, 0.15, 0.05);
  },
  finish() { [523, 659, 784].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.1, i * 0.09)); },
  win() { [523, 659, 784, 1046, 784, 1046].forEach((f, i) => this.tone(f, 0.25, 'triangle', 0.11, i * 0.13)); },
  unlock() { [784, 988, 1175].forEach((f, i) => this.tone(f, 0.16, 'sine', 0.09, i * 0.08)); }
};
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => {
  Snd.init();
  if (Snd.ctx && Snd.ctx.state === 'suspended') Snd.ctx.resume();
}, { passive: true }));

const PALETTES = {

  sunset: { red: '#e4572e', green: '#5c9e48', yellow: '#f5a623', blue: '#3d5a99' },
  ocean: { red: '#e5646b', green: '#1b998b', yellow: '#f4d35e', blue: '#2d6a9f' },
  garden: { red: '#c8553d', green: '#588b4a', yellow: '#e9b44c', blue: '#4c6e9e' },
  contrast: { red: '#d55e00', green: '#009e73', yellow: '#f0e442', blue: '#0072b2' }
};
const FRAMES = {
  walnut: ['#6b4a38', '#35211a'],
  teak: ['#9a6a3c', '#5a3a1c'],
  ebony: ['#3a3230', '#120e0d'],
  slate: ['#5a6b7a', '#2c3742'],
  ivory: ['#e9dcc3', '#b9a383'],
  emerald: ['#2f7a5a', '#163f2d']
};

/** Darken a #rrggbb colour by factor k (0..1). */
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const ch = s => Math.round(((n >> s) & 255) * (1 - k));
  return '#' + [16, 8, 0].map(s => ch(s).toString(16).padStart(2, '0')).join('');
}

/** Colours in force for the current palette (custom = the four pickers in Settings). */
const paletteColours = () => (prefs.palette === 'custom' ? prefs.custom : PALETTES[prefs.palette] || PALETTES.standard);

/** Writes the palette as CSS variables; "standard" falls back to the theme's own colours. */
function applyPalette() {
  const root = document.documentElement.style;
  const cols = paletteColours();
  SEATS.forEach(c => {
    if (prefs.palette === 'standard') {
      ['', '-soft', '-deep'].forEach(s => root.removeProperty(`--${c}${s}`));
      return;
    }
    root.setProperty(`--${c}`, cols[c]);
    root.setProperty(`--${c}-deep`, shade(cols[c], 0.3));
    root.setProperty(`--${c}-soft`, `color-mix(in srgb, ${cols[c]} 22%, var(--surface))`);
  });
  document.documentElement.dataset.frame = prefs.frame;
  document.documentElement.dataset.stars = prefs.rules.safeStars ? 'on' : 'off';
}

// ---------- board SVG ----------
/** Rect with one rounded corner: 'tl' | 'tr' | 'br' | 'bl'. */
function cornerRect(x, y, w, h, r, corner) {
  if (corner === 'tl') return `M${x + r} ${y}H${x + w}V${y + h}H${x}V${y + r}A${r} ${r} 0 0 1 ${x + r} ${y}Z`;
  if (corner === 'tr') return `M${x} ${y}H${x + w - r}A${r} ${r} 0 0 1 ${x + w} ${y + r}V${y + h}H${x}Z`;
  if (corner === 'br') return `M${x} ${y}H${x + w}V${y + h - r}A${r} ${r} 0 0 1 ${x + w - r} ${y + h}H${x}Z`;
  return `M${x} ${y}H${x + w}V${y + h}H${x + r}A${r} ${r} 0 0 1 ${x} ${y + h - r}Z`;
}

function starPath(cx, cy, r) {
  let d = '';
  for (let k = 0; k < 10; k++) {
    const a = -Math.PI / 2 + (k * Math.PI) / 5;
    const rr = k % 2 ? r * 0.45 : r;
    d += (k ? 'L' : 'M') + (cx + Math.cos(a) * rr).toFixed(1) + ' ' + (cy + Math.sin(a) * rr).toFixed(1);
  }
  return d + 'Z';
}

const START_ARROWS = ['M-9 0H9M3 -6l6 6-6 6', 'M0 -9V9M-6 3l6 6 6-6', 'M9 0H-9M-3 -6l-6 6 6 6', 'M0 9V-9M-6 -3l6-6 6 6'];

function boardBases() {
  const corners = ['tl', 'tr', 'br', 'bl'];
  let s = '';
  SEATS.forEach((c, p) => {
    const [br, bc] = BASE_ORIGIN[p];
    const x = bc * CELL;
    const y = br * CELL;
    s += `<path class="base ${c}" d="${cornerRect(x, y, 6 * CELL, 6 * CELL, 10, corners[p])}"/>`;
    s += `<rect class="inner" x="${x + CELL}" y="${y + CELL}" width="${4 * CELL}" height="${4 * CELL}" rx="16"/>`;
    SLOT.forEach(([sx, sy]) => {
      s += `<circle class="slot ${c}" cx="${x + sx * CELL}" cy="${y + sy * CELL}" r="${CELL * 0.5}"/>`;
    });
  });
  return s;
}

function boardTrack() {
  let s = '';
  TRACK.forEach(([r, c], idx) => {
    const p = OFFSET.indexOf(idx);
    const col = p >= 0 ? SEATS[p] : '';
    s += `<rect class="sq ${col}" data-abs="${idx}" x="${c * CELL}" y="${r * CELL}" width="${CELL}" height="${CELL}"/>`;
    const [cx, cy] = cellXY(r, c);
    if (STARS.includes(idx)) s += `<path class="star" d="${starPath(cx, cy, 13)}"/>`;
    if (p >= 0) s += `<path class="arrow" transform="translate(${cx} ${cy})" d="${START_ARROWS[p]}"/>`;
    if (prefs.a11y.numbers) s += `<text class="sqn" x="${c * CELL + 3}" y="${r * CELL + 11}">${idx + 1}</text>`;
  });
  HOMECOL.forEach((cells, p) => cells.forEach(([r, c]) => {
    s += `<rect class="sq col ${SEATS[p]}" x="${c * CELL}" y="${r * CELL}" width="${CELL}" height="${CELL}"/>`;
  }));
  return s;
}

function boardCentre() {
  const m = 6 * CELL;
  const M = 9 * CELL;
  const cx = 7.5 * CELL;
  const cy = 7.5 * CELL;
  return `<path class="tri red" d="M${m} ${m}L${cx} ${cy}L${m} ${M}Z"/>`
    + `<path class="tri green" d="M${m} ${m}L${M} ${m}L${cx} ${cy}Z"/>`
    + `<path class="tri yellow" d="M${M} ${m}L${M} ${M}L${cx} ${cy}Z"/>`
    + `<path class="tri blue" d="M${m} ${M}L${cx} ${cy}L${M} ${M}Z"/>`;
}

/** Full board SVG; `prefix` keeps element ids unique when a second board (replay) is on the page. */
function buildBoard(prefix = '') {
  // TODO(student): token skins — let tokenSVG() draw a chosen shape (pawn, coin, crown or an uploaded image) from a prefs.skin value, with a picker next to the palette in Settings.
  return `<svg viewBox="0 0 ${BW} ${BW}" role="img" aria-label="Ludo board"><rect class="bg" width="${BW}" height="${BW}" rx="10"/>`
    + boardBases()
    + boardTrack()
    + boardCentre()
    + `<g id="${prefix}hl"></g><g id="${prefix}tokens"></g></svg>`;
}

function tokenSVG(p, i, x, y, sc, cls, label, idp = 'tok') {
  const focus = cls.includes('legal') ? '0' : '-1';
  return `<g class="tok ${SEATS[p]} ${cls}" id="${idp}-${p}-${i}" data-p="${p}" data-i="${i}" data-x="${x}" data-y="${y}" transform="translate(${x} ${y}) scale(${sc})" role="button" tabindex="${focus}" aria-label="${esc(label)}">
    <circle class="ring" r="16"/><ellipse class="shd" cy="3" rx="13" ry="11.5" fill="rgba(0,0,0,.28)"/><circle class="body" r="13"/>
    <circle cx="-4.5" cy="-5" r="4.5" fill="#fff" opacity=".5"/><text y="4.5" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" style="pointer-events:none">${i + 1}</text>
    <path class="hintstar" transform="translate(0 -20) scale(.55)" d="${starPath(0, 0, 10)}"/></g>`;
}

function setTok(el, x, y, sc = 1, rot = 0) {
  el.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot}) scale(${sc})`);
  el.dataset.x = x;
  el.dataset.y = y;
}
const tokXY = el => [+el.dataset.x, +el.dataset.y];

/** Token markup for a whole position, stacking tokens that share a square. */
function tokensMarkup(players, tokens, opts = {}) {
  const cells = {};
  players.forEach((pl, p) => {
    if (pl.type === 'off') return;
    tokens[p].forEach((pos, i) => {
      (cells[cellKey(p, pos, i)] ??= []).push({ p, i, pos });
    });
  });
  let html = '';
  Object.values(cells).forEach(list => {
    const lay = STACK[Math.min(list.length, 4) - 1];
    list.forEach((tk, k) => {
      const [x, y] = posPoint(tk.p, tk.pos, tk.i);
      const o = lay.off[Math.min(k, 3)];
      const sc = tk.pos === FINISH ? 0.45 : lay.s;
      const cls = opts.cls ? opts.cls(tk) : '';
      html += tokenSVG(tk.p, tk.i, x + o[0] * lay.s, y + o[1] * lay.s, sc, cls, `${t(SEATS[tk.p])} ${tk.i + 1}`, opts.idp || 'tok');
    });
  });
  return html;
}
