function bindHud(h) {
  $('#hPause', h).onclick = togglePause;
  $('#hMin', h).onclick = minimizeHud;
  bindHold($('#hEnd', h), 1200, endRide);
  bindHold($('#hSos', h), 1200, () => openManualSos());
  $$('[data-inj]', h).forEach(b => (b.onclick = () => {
    RIDE.sim.inject(b.dataset.inj);
    hudMsg(t('hud_injected', { k: t('inj_' + b.dataset.inj) }), 'c');
  }));
  const ff = $('[data-ff]', h);
  if (ff) ff.onclick = () => advanceSim(10);
}

/** Press-and-hold: a fill runs for `ms`; releasing early cancels. Keyboard: hold Enter or Space. */
function bindHold(el, ms, fn) {
  let t0 = 0;
  let raf = 0;
  const stop = () => {
    cancelAnimationFrame(raf);
    t0 = 0;
    el.style.setProperty('--p', 0);
  };
  const tick = ts => {
    const p = Math.min(1, (ts - t0) / ms);
    el.style.setProperty('--p', p);
    if (p >= 1) {
      stop();
      fn();
    } else raf = requestAnimationFrame(tick);
  };
  const start = () => {
    if (t0) return;
    t0 = performance.now();
    raf = requestAnimationFrame(tick);
  };
  el.addEventListener('pointerdown', start);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, stop));
  el.addEventListener('keydown', e => (e.key === 'Enter' || e.key === ' ') && (e.preventDefault(), start()));
  el.addEventListener('keyup', stop);
}

function hudFrame(force = false) {
  if (!RIDE.on || (!RIDE.dirty && !force) || !$('#hud.on')) return;
  RIDE.dirty = false;
  const f = RIDE.f || { kmh: 0, lean: 0, lin: 0 };
  const kmh = Math.max(0, f.kmh ?? 0);
  const lim = currentLimit();
  setText('hSpd', Math.round(kmh));
  $('#hArc').setAttribute('stroke-dasharray', `${((clamp(kmh, 0, SPD_MAX) / SPD_MAX) * 100).toFixed(1)} 200`);
  $('#hud').classList.toggle('over', kmh > lim * 1.1);
  $('#hud').classList.toggle('paused', !!RIDE.paused);
  hudGauges(f);
  hudStats();
  hudStatus();
}

function hudGauges(f) {
  const c = RIDE.coach;
  const g = Math.hypot(c.gLat, c.gLong);
  const xy = ([lat, lon]) => `${(110 + clamp(lat, -1.1, 1.1) * 95).toFixed(1)},${(110 - clamp(lon, -1.1, 1.1) * 95).toFixed(1)}`;
  const [dx, dy] = xy([c.gLat, c.gLong]).split(',');
  $('#hDot').setAttribute('cx', dx);
  $('#hDot').setAttribute('cy', dy);
  $('#hTrail').setAttribute('points', RIDE.trail.map(xy).join(' ') || '110,110');
  setText('hGv', fmtN(g, 2));
  $('#hImp').style.height = clamp((RIDE.linPeak / 4) * 100, 0, 100) + '%';
  $('#hImp').classList.toggle('hot', RIDE.linPeak >= S.engine.impactG);
  $('#hNeedle').setAttribute('transform', `rotate(${clamp(f.lean, -70, 70).toFixed(1)} 120 125)`);
  $('#hMaxL').setAttribute('transform', `rotate(${-Math.min(70, RIDE.stats.leanL).toFixed(1)} 120 125)`);
  $('#hMaxR').setAttribute('transform', `rotate(${Math.min(70, RIDE.stats.leanR).toFixed(1)} 120 125)`);
  setText('hLean', Math.round(Math.abs(f.lean)) + '°');
  const stage = ALARM.phase !== 'idle' ? 4 : RIDE.engine ? RIDE.engine.stage() : 0;
  $$('#hStages li').forEach(li => {
    const i = Number(li.dataset.i);
    li.className = i < stage ? 'on' : i === stage ? 'cur' : '';
  });
}

function hudStats() {
  const st = RIDE.stats;
  setText('hKm', fmtN(st.km, 2));
  setText('hTime', clock(RIDE.tNow));
  setText('hAvg', fmtN(st.movingS ? st.km / (st.movingS / 3600) : 0, 0));
  setText('hMax', Math.round(st.maxKmh));
  setText('hEv', RIDE.events.length);
  setText('hScore', rideScore({ km: st.km, events: RIDE.events, helmet: RIDE.helmet, pillion: RIDE.pillion, night: false }).score);
  setText('hClock', fmtTime(now()));
}

function hudStatus() {
  const g = RIDE.gps;
  const head = g && g.heading != null ? g.heading : LIVE.compass;
  const he = $('#hHead');
  if (he) he.lastChild.textContent = head == null ? ' —' : ` ${cardinal(head)} ${Math.round(head)}°`;
  const arrow = he && he.querySelector('svg');
  if (arrow && head != null) arrow.style.transform = `rotate(${head}deg)`;
  setHtml('hGps', `${ic('locate')} ${g ? 'GPS ±' + Math.round(g.acc) + ' m' : t('ss_' + SENS.geo)}`, 'hchip ' + (g ? 'ok' : 'bad'));
  setHtml('hWake', `${ic('sun')} ${t(SENS.wake === 'on' ? 'hud_wakeOn' : 'hud_wakeOff')}`, 'hchip ' + (SENS.wake === 'on' ? 'ok' : 'warn'));

function hudMsg(text, cls = '') {
  const el = $('#hMsg');
  if (!el) return;
  el.textContent = text;
  el.className = 'hud-msg on ' + cls;
  clearTimeout(RIDE.msgTimer);

function hudWarn(text) {
  const el = $('#hWarn');
  if (!el) return;
  el.innerHTML = `${ic('alert')} <span>${esc(text)}</span>`;
  el.classList.add('on');
  clearTimeout(RIDE.warnTimer);
  RIDE.warnTimer = setTimeout(() => el.classList.remove('on'), 6000);

// =====================================================================
// CRASH ALARM — 30-second countdown with siren, vibration and a huge
// "I am OK" button, then an alert screen with prefilled SMS / WhatsApp
// messages and a Rescue 1122 call button. The page cannot send anything
// by itself: every button opens the phone's own app with the text ready.
// =====================================================================
const ALARM = { phase: 'idle', left: 0, total: 30, timer: 0, practice: false, manual: false, muted: false, details: null, loc: null, msgLang: 'en', msg: '' };

function startCountdown({ practice = false, details = {}, src = 'sim', seconds = S.engine.countdown } = {}) {
  if (ALARM.phase !== 'idle') return;
  Object.assign(ALARM, { phase: 'count', left: seconds, total: seconds, practice, manual: false, muted: practice, details, src, startedAt: now(), loc: currentLocation(), msgLang: lang });
  renderAlarm();
  ALARM.timer = setInterval(alarmTick, 1000);
  if (!practice) {
    startSiren(0.6);
    vibrate([500, 200, 500]);
  }
  announce(t('al_aria', { n: seconds }));
  logEvent(practice ? 'lg_practice' : 'lg_countdown', {}, 'siren');
  refreshLocation();
}

/** Manual SOS from the HUD (press and hold): straight to the alert screen. */
function openManualSos() {
  if (ALARM.phase !== 'idle') return;
  Object.assign(ALARM, { phase: 'alert', practice: false, manual: true, muted: false, details: {}, src: RIDE.src || 'manual', startedAt: now(), loc: currentLocation(), msgLang: lang, left: 0, total: 0 });
  startSiren(1);
  recordCrash('manual', 0);
  renderAlarm();
  refreshLocation();
}

function alarmTick() {
  ALARM.left--;
  if (ALARM.left <= 0) {
    toAlert();
    return;
  }
  setText('alNum', ALARM.left);
  setText('alLeft', ALARM.left);
  const ring = $('#alRing');
  if (ring) ring.setAttribute('stroke-dasharray', `${((ALARM.left / ALARM.total) * 100).toFixed(1)} 100`);
  if (ALARM.practice || ALARM.muted) beep(1000, 60, 0.2);
  else setSirenLevel(ALARM.left <= 10 ? 1 : 0.6);
  if (!ALARM.practice && ALARM.left % 3 === 0) vibrate([300, 150, 300]);
  if (ALARM.left === 10) announce(t('al_aria', { n: 10 }));
}

function toAlert() {
  clearInterval(ALARM.timer);
  ALARM.phase = 'alert';
  if (!ALARM.practice && !ALARM.muted) startSiren(1);
  recordCrash(ALARM.practice ? 'practice' : 'alert', ALARM.total);
  if (!ALARM.practice) notify('n_crash', {}, { icon: 'siren', route: 'engine', level: 'r' });
  renderAlarm();
  announce(t('al_readyAria'));
  sendAlertViaServer(alertMessage(ALARM.msgLang));
}

/** "I am OK": cancel, log how long it took, re-arm the engine and let the simulated rider get up. */
function imOk() {
  const waited = ALARM.phase === 'count' ? ALARM.total - ALARM.left : ALARM.total;
  const wasCount = ALARM.phase === 'count';
  const practice = ALARM.practice;
  if (wasCount) recordCrash(practice ? 'practice' : 'cancelled', waited);
  stopAlarm();
  if (RIDE.on && RIDE.engine) RIDE.engine.ack(10);
  if (RIDE.on && RIDE.sim) RIDE.sim.recover();
  toast(wasCount ? t('al_cancelled', { s: waited }) : t('al_closed'), 'ok');
  logEvent('lg_cancel', { s: waited }, 'shield-check');
  if (wasCount && !practice && RIDE.on && RIDE.buf.length > 200) later(offerFalseAlarmTrace);
}

function stopAlarm() {
  clearInterval(ALARM.timer);
  stopSiren();
  ALARM.phase = 'idle';
  $('#alarm').classList.remove('on');
  $('#alarm').innerHTML = '';
  if (RIDE.on) hudFrame(true);
}

function recordCrash(kind, waited) {
  const d = ALARM.details || {};
  const l = ALARM.loc;
  S.crashLog.unshift({ id: uid('x'), ts: now(), kind, src: ALARM.src || 'manual', waited, peak: d.peak ? round(d.peak, 1) : null, rot: d.rot ? Math.round(d.rot) : null, lat: l ? round(l.lat, 5) : null, lng: l ? round(l.lng, 5) : null });
  S.crashLog.length = Math.min(S.crashLog.length, 100);
  persist('crashLog');
}

/** Best position we have right now: the ride's last fix (real or simulated) or the last live fix. */
function currentLocation() {
  if (RIDE.on && RIDE.gps) return { ...RIDE.gps };
  if (gpsFresh()) return { ...LIVE.gps };
  return null;
}

// With real sensors, ask for one more accurate fix while the countdown runs.
function refreshLocation() {
  if (!RIDE.on || RIDE.src !== 'sensors' || !navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    ALARM.loc = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy, t: now() };
    if (ALARM.phase === 'alert') renderAlarm();
  }, () => {}, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
}

// TODO(student): automatic alerts through a server SMS gateway (e.g. a small Node service with an SMS API),
// sent only after the countdown, with delivery receipts and a retry queue. Never send without the countdown.
function sendAlertViaServer(message) {
  return { sent: false, reason: 'no-server', length: message.length };
}

// TODO(student): hands-free cancel: listen for "I am OK" / "میں ٹھیک ہوں" with the Web Speech API (en-PK and
// ur-PK) during the countdown, with a confidence threshold and the transcript shown on screen.
function listenForImOk() {
  toast(t('al_voiceTodo'));
}

// ---------- messages ----------
function alertMessage(lng) {
  const p = S.profile;
  const l = ALARM.loc;
  const time = new Date(ALARM.startedAt || now()).toLocaleTimeString(lng === 'ur' ? 'ur-PK-u-nu-latn' : 'en-PK', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  const where = l ? tIn(lng, 'msg_where', { map: mapLink(l), acc: Math.round(l.acc || 0) }) : tIn(lng, 'msg_noLoc');
  const key = ALARM.manual ? 'msg_sos' : 'msg_alert';
  return tIn(lng, key, { name: p.name || tIn(lng, 'msg_rider'), time, where, blood: p.blood || '?', allergies: p.allergies || '-', conditions: p.conditions || '-', bike: S.bike.reg || '-' });
}

const realContacts = () => S.contacts.filter(c => !c.demo && phoneOk(c.phone));
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent);

function smsHref(phones, body) {
  const list = phones.map(phoneDial).join(',');
  return isIOS() ? `sms:/open?addresses=${list}&body=${encodeURIComponent(body)}` : `sms:${list}?body=${encodeURIComponent(body)}`;
}
const waHref = (phone, body) => `https://wa.me/${phoneIntl(phone)}?text=${encodeURIComponent(body)}`;

// ---------- rendering ----------
function renderAlarm() {
  const el = $('#alarm');
  el.className = 'on ' + ALARM.phase + (ALARM.practice ? ' practice' : '');
  el.innerHTML = ALARM.phase === 'count' ? countdownHtml() : alertHtml();
  bindAlarm(el);
  const focus = $('#alOk', el) || $('#alCall', el);
  if (focus) setTimeout(() => focus.focus({ preventScroll: true }), 60);
}

function countdownHtml() {
  const d = ALARM.details || {};

    <div class="al-ring"><svg viewBox="0 0 220 220" aria-hidden="true"><circle class="trk" cx="110" cy="110" r="96"/>
        <circle class="val" id="alRing" cx="110" cy="110" r="96" pathLength="100" stroke-dasharray="100 100"/></svg><b id="alNum" class="num">${ALARM.left}</b>
        </div>
    <button type="button" class="okbtn" id="alOk">${ic('check-circle')}<span>${t('al_ok')}</span><small>${t('al_okSub')}</small></button>

    <button type="button" class="btn ghost lg" id="alMute">${ic(ALARM.muted ? 'volume-x' : 'volume')} ${t(ALARM.muted ? 'al_unmute' : 'al_mute')}</button>
    ${'SpeechRecognition' in window || 'webkitSpeechRecognition' in window ? `<button type="button" class="btn ghost lg" id="alVoice">${ic('mic')} ${t('al_voice')}</button>` : ''}</div>
    <p class="tiny al-facts">${facts}</p></div>`;
}

function alertHtml() {
  const prac = ALARM.practice;

        <div class="al-contacts">${contacts}</div></div>
      <div class="stack"><div class="between"><b>${t('al_message')}</b><div class="seg" id="alLang">
          <button type="button" data-l="en" class="${ALARM.msgLang === 'en' ? 'on' : ''}">English</button>
          <button type="button" data-l="ur" class="${ALARM.msgLang === 'ur' ? 'on' : ''}">اردو</button></div></div>

function contactRow(c, prac) {
  const ok = !c.demo && phoneOk(c.phone) && !prac;
  const dis = ok ? '' : 'aria-disabled="true" tabindex="-1"';
  return `<div class="al-c"><span class="grow"><b>${esc(c.name)}</b><small class="ltr">${esc(c.phone)}${c.demo ? ' · ' + t('demoContact') : ''}</small></span>

const fmtParam = (p, v) => `${fmtN(v, p.dp)} ${p.unit}`;

function paramSliders(cfg, prefix) {
  return ENGINE_PARAMS.map(p => `<div class="range">
      <label for="${prefix}${p.k}">${t('p_' + p.k)}</label><output id="${prefix}${p.k}o">${fmtParam(p, cfg[p.k])}</output>
      <input type="range" id="${prefix}${p.k}" data-k="${p.k}" min="${p.min}" max="${p.max}" step="${p.step}" value="${cfg[p.k]}">
      <small>${t('h_' + p.k)}</small></div>`).join('');
}

function bindParamSliders(root, cfg, prefix, onChange) {
  ENGINE_PARAMS.forEach(p => {
    const inp = $('#' + prefix + p.k, root);
    if (!inp) return;
    inp.oninput = () => {
      cfg[p.k] = Number(inp.value);
      $('#' + prefix + p.k + 'o', root).textContent = fmtParam(p, cfg[p.k]);
      onChange(p.k);
    };
  });
}

// Max-decimation per pixel column keeps short spikes visible however long the trace is.
function decimate(t, v, x0, w, tMax, mode = 'max') {
  const cols = new Array(w).fill(null);
  for (let i = 0; i < t.length; i++) {
    const c = Math.min(w - 1, Math.floor((t[i] / tMax) * w));
    const val = v[i];
    if (Number.isNaN(val)) continue;
    if (cols[c] === null) cols[c] = val;
    else cols[c] = mode === 'max' ? Math.max(cols[c], val) : (cols[c] + val) / 2;
  }
  return cols.map((y, i) => (y === null ? null : [x0 + i, y]));
}

function lanePath(pts, y0, h, max) {
  return pts.filter(Boolean).map(([x, v], i) => `${i ? 'L' : 'M'}${x.toFixed(1)} ${(y0 + h - (clamp(v, 0, max) / max) * h).toFixed(1)}`).join('');
}

/** Three stacked lanes (impact g, rotation °/s, speed km/h) with thresholds, stage windows and events. */
function tracePlot(tr, res, cfg) {
  const F = traceFeatures(tr, cfg.gravityHz);
  const W = 720;
  const x0 = 44;
  const pw = W - x0 - 10;
  const tMax = Math.max(1, F.t[F.n - 1]);
  const X = sec => x0 + (sec / tMax) * pw;
  const kmhMax = Math.max(40, Math.ceil(Math.max(...Array.from(F.kmh).filter(v => !Number.isNaN(v)), 0) / 20) * 20);
  const lanes = [
    { key: 'lin', max: 4, thr: cfg.impactG, unit: 'g', cls: 'l1', label: t('pl_impact') },
    { key: 'rot', max: 600, thr: cfg.rotDps, unit: '°/s', cls: 'l2', label: t('pl_rot') },
    { key: 'kmh', max: kmhMax, thr: cfg.stopKmh, unit: 'km/h', cls: 'l3', label: t('pl_speed'), mode: 'mean' },
  ];
  let svg = '';
  lanes.forEach((ln, i) => {
    const y0 = 10 + i * 78;
    const yT = y0 + 64 - (clamp(ln.thr, 0, ln.max) / ln.max) * 64;
    svg += `<rect class="lane-bg" x="${x0}" y="${y0}" width="${pw}" height="64"/>
      <text class="ax" x="${x0 - 6}" y="${y0 + 10}" text-anchor="end">${fmtN(ln.max)}</text><text class="ax" x="${x0 - 6}" y="${y0 + 64}" text-anchor="end">0</text>
      <text class="lane-l" x="${x0 + 6}" y="${y0 + 13}">${ln.label} (${ln.unit})</text>
      <line class="thr" x1="${x0}" x2="${x0 + pw}" y1="${yT.toFixed(1)}" y2="${yT.toFixed(1)}"/>
      <path class="sig ${ln.cls}" d="${lanePath(decimate(F.t, F[ln.key], x0, pw, tMax, ln.mode || 'max'), y0, 64, ln.max)}"/>`;
  });
  svg += stageWindows(res.events, cfg, X, tMax);
  if (tr.eventT != null) svg += `<line class="mark" x1="${X(tr.eventT).toFixed(1)}" x2="${X(tr.eventT).toFixed(1)}" y1="6" y2="238"/>
      <text class="mark-l" x="${(X(tr.eventT) + 4).toFixed(1)}" y="250">${t('kind_' + tr.kind)}</text>`;
  for (let s = 0; s <= tMax; s += tMax > 30 ? 10 : 4) svg += `<text class="ax" x="${X(s).toFixed(1)}" y="262" text-anchor="middle">${s}s</text>`;
  return `<svg class="tplot" viewBox="0 0 ${W} 266" role="img" aria-label="${t('pl_aria')}">${svg}</svg>`;
}

function stageWindows(events, cfg, X, tMax) {
  let out = '';
  let cand = null;
  let still = null;
  events.forEach(e => {
    if (e.type === 'candidate') cand = e.t;
    if (e.type === 'reject' && cand != null) {
      out += `<rect class="win w1" x="${X(cand).toFixed(1)}" y="6" width="${Math.max(2, X(e.t) - X(cand)).toFixed(1)}" height="232"/>`;
      out += `<line class="rej" x1="${X(e.t).toFixed(1)}" x2="${X(e.t).toFixed(1)}" y1="6" y2="238"/>
          <text class="rej-l" x="${(X(e.t) + 3).toFixed(1)}" y="${e.reason === 'drop' ? 30 : 18}">${t('rjs_' + e.reason)}</text>`;
      cand = null;
      still = null;
    }
    if (e.type === 'tumble') still = Math.min(tMax, (cand ?? e.t) + cfg.tumbleS);
    if (e.type === 'confirm') {
      const c0 = cand ?? e.t;
      out += `<rect class="win w1" x="${X(c0).toFixed(1)}" y="6" width="${(X(still ?? c0) - X(c0)).toFixed(1)}" height="232"/>`;
      out += `<rect class="win w2" x="${X(still ?? c0).toFixed(1)}" y="6" width="${Math.max(2, X(e.t) - X(still ?? c0)).toFixed(1)}" height="232"/>`;
      out += `<line class="conf" x1="${X(e.t).toFixed(1)}" x2="${X(e.t).toFixed(1)}" y1="4" y2="240"/>
          <text class="conf-l" x="${(X(e.t) - 3).toFixed(1)}" y="16" text-anchor="end">${t('pl_alert')}</text>`;
      cand = null;
      still = null;
    }
  });
  return out;
}

/** Plain-language decision log for one trace. */
function explainTrace(tr, res, cfg) {
  const F = traceFeatures(tr, cfg.gravityHz);
  const peak = Math.max(...F.lin);
  const items = [`<li>${ic(kindInfo(tr.kind).icon)} ${t('ex_label', { k: t('kind_' + tr.kind), c: t(tr.label ? 'ex_crash' : 'ex_notCrash'), s: tr.eventT != null ? fmtN(tr.eventT, 1) : '—' })}</li>`];
  res.events.forEach(e => {
    const at = `<b class="num">${fmtN(e.t, 2)} s</b>`;
    if (e.type === 'candidate') items.push(`<li class="y">${at} ${t('ex_cand', { g: fmtN(e.peak, 1), j: Math.round(e.jerk), m: t(e.moving ? 'ex_moving' : 'ex_parked') })}</li>`);
    if (e.type === 'tumble') items.push(`<li class="c">${at} ${t('ex_tumble', { r: Math.round(e.rot), d: Math.round(e.tilt) })}</li>`);
    if (e.type === 'reject') items.push(`<li>${at} ${t('ex_reject', { why: t('rj_' + e.reason) })}</li>`);
    if (e.type === 'confirm') items.push(`<li class="r">${at} ${t('ex_confirm', { s: fmtN(cfg.stillS, 1), lat: fmtN(e.latency, 1) })}</li>`);
  });
  if (!res.events.length) items.push(`<li>${t('ex_none', { g: fmtN(peak, 2), thr: fmtN(cfg.impactG, 1) })}</li>`);
  if (tr.recovered && !res.detected) items.push(`<li class="c">${t('ex_recovered')}</li>`);
  if (tr.pocket) items.push(`<li>${t('ex_pocket')}</li>`);
  return `<ol class="explain">${items.join('')}</ol>`;
}

function outcomeOf(tr, res) {
  return tr.label ? (res.detected ? 'tp' : 'fn') : res.detected ? 'fp' : 'tn';
}
const OUT_CLS = { tp: 'g', tn: 'g', fp: 'r', fn: 'o' };

function confusionHtml(cm) {
  const tot = Math.max(1, cm.tp + cm.fp + cm.tn + cm.fn);
  const cell = (k, good) => `<div class="cm-c ${good ? 'good' : 'bad'}" style="--a:${(0.12 + (cm[k] / tot) * 1.6).toFixed(2)}">
      <b class="num">${cm[k]}</b><small>${t('cm_' + k)}</small></div>`;
  return `<div class="cm" role="table" aria-label="${t('lab_cm')}">
    <div></div><div class="cm-h">${t('cm_predCrash')}</div><div class="cm-h">${t('cm_predOk')}</div>
    <div class="cm-h side">${t('cm_actCrash')}</div>${cell('tp', true)}${cell('fn', false)}
    <div class="cm-h side">${t('cm_actOk')}</div>${cell('fp', false)}${cell('tn', true)}</div>`;
}

/** ROC: each dot is one value of the swept threshold; the yellow ring is the current setting. */
function rocSvg(roc, param, cur) {
  const S0 = 30;
  const Wd = 220;
  const X = f => S0 + f * Wd;
  const Y = r => 10 + (1 - r) * Wd;
  const path = roc.curve.map((p, i) => `${i ? 'L' : 'M'}${X(p.fpr).toFixed(1)} ${Y(p.tpr).toFixed(1)}`).join('');
  const dots = roc.pts.map(p => `<circle class="${p.v === cur ? 'cur' : 'pt'}" cx="${X(p.fpr).toFixed(1)}" cy="${Y(p.tpr).toFixed(1)}" r="${p.v === cur ? 7 : 3.5}">
      <title>${t('p_' + param)} ${p.v}: TPR ${fmtN(p.tpr, 2)}, FPR ${fmtN(p.fpr, 2)}</title></circle>`).join('');
  const grid = [0, 0.25, 0.5, 0.75, 1].map(f => `<line class="gl" x1="${X(f)}" x2="${X(f)}" y1="10" y2="${10 + Wd}"/>
      <line class="gl" x1="${S0}" x2="${S0 + Wd}" y1="${Y(f)}" y2="${Y(f)}"/><text class="ax" x="${X(f)}" y="${Wd + 24}" text-anchor="middle">${f}</text>
      <text class="ax" x="${S0 - 5}" y="${Y(f) + 4}" text-anchor="end">${f}</text>`).join('');
  return `<svg class="roc" viewBox="0 0 260 270" role="img" aria-label="${t('lab_roc')} AUC ${fmtN(roc.auc, 3)}">${grid}
    <line class="diag" x1="${X(0)}" y1="${Y(0)}" x2="${X(1)}" y2="${Y(1)}"/><path class="curve" d="${path}" data-draw/>${dots}
    <text class="ax" x="${S0 + Wd / 2}" y="${Wd + 40}" text-anchor="middle">${t('lab_fpr')}</text>
    <text class="ax" x="10" y="${10 + Wd / 2}" transform="rotate(-90 10 ${10 + Wd / 2})" text-anchor="middle">${t('lab_tpr')}</text></svg>`;
}

/** Per-scenario rate: detection for crash kinds (higher is better), false alarms for the rest. */
function perKindTable(per) {
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${t('lab_kind')}</th><th>${t('lab_truth')}</th><th class="n">${t('lab_detected')}</th>
      <th>${t('lab_rate')}</th></tr></thead><tbody>
    ${TRACE_KINDS.filter(k => per[k.id]).map(k => {
      const p = per[k.id];
      const rate = p.n ? p.det / p.n : 0;
      const good = k.crash ? rate >= 0.8 : rate === 0;
      return `<tr><td>${ic(k.icon)} ${t('kind_' + k.id)}</td><td><span class="chip ${k.crash ? 'r' : 'c'}">${t(k.crash ? 'ex_crash' : 'ex_notCrash')}</span></td>
        <td class="n">${p.det}/${p.n}</td><td style="min-width:120px"><div class="bar ${good ? 'g' : k.crash ? 'o' : 'r'}">
            <i data-w="${Math.max(2, rate * 100)}"></i></div></td></tr>`;
    }).join('')}</tbody></table></div>`;
}

/** The detector as a diagram: stages left to right, reject paths back to Riding along the bottom. */
function machineSvg(c) {
  const nodes = [['st_ride', 'bike'], ['st_impact', 'crash'], ['st_tumble', 'rotate'], ['st_still', 'pause'], ['st_alert', 'siren']];
  const cur = RIDE.on ? (ALARM.phase !== 'idle' ? 4 : RIDE.engine.stage()) : -1;
  const xs = [10, 140, 270, 400, 530];
  const go = [t('mc_impact', { g: fmtN(c.impactG, 1), j: c.jerkG }), t('mc_tumble', { r: c.rotDps, d: c.tiltDeg, s: c.tumbleS }), t('mc_still', { s: c.stillS }), t('mc_alert', { sd: fmtN(c.stillStdG, 3), k: c.stopKmh })];
  const back = [t('mc_rjDrop', { ms: c.freefallMs }), t('mc_rjBump'), t('mc_rjStill', { k: c.continueKmh, s: c.stillTimeoutS }), t('mc_rjOk')];
  let s = '<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>';
  nodes.forEach(([k], i) => {
    s += `<g class="mn ${i === cur ? 'cur' : ''} ${i === 4 ? 'alert' : ''}" data-node="${i}"><rect x="${xs[i]}" y="96" width="100" height="52" rx="12"/>
        <text x="${xs[i] + 50}" y="127" text-anchor="middle">${t(k)}</text></g>`;
  });
  go.forEach((txt, i) => {
    s += `<line class="ma" x1="${xs[i] + 102}" y1="122" x2="${xs[i + 1] - 4}" y2="122" marker-end="url(#arw)"/>`;
    s += `<foreignObject x="${xs[i] + 52}" y="18" width="126" height="74"><div class="mlbl" xmlns="http://www.w3.org/1999/xhtml">${txt}</div></foreignObject>`;
  });
  back.forEach((txt, i) => {
    const x = xs[i + 1] + 50;
    const y = 172 + i * 18;
    s += `<path class="mb ${i === 3 ? 'ok' : ''}" d="M${x} 150 V${y} H60 V152" marker-end="url(#arw)"/>
        <circle class="mnum ${i === 3 ? 'ok' : ''}" cx="${x}" cy="${y}" r="9"/><text class="mnum-t" x="${x}" y="${y + 4}">${i + 1}</text>`;
  });
  const legend = back.map((txt, i) => `<li class="${i === 3 ? 'ok' : ''}"><b>${i + 1}</b> ${txt}</li>`).join('');
  return `<svg class="machine" viewBox="0 0 640 240" role="img" aria-label="${t('eng_machine')}">${s}</svg><ol class="mrej">${legend}</ol>`;
}

// SIGNAL LAB — the FYP evaluation: labelled synthetic traces plus your
// own recordings, detector run on the whole set, confusion matrix,
// precision / recall / F1, live parametric ROC, trace viewer with the
// decision log, dataset export, and a recorder for real sensor traces.
// =====================================================================
const LAB = { set: null, key: '', ev: null, roc: null, tab: 'eval', sel: null, filter: 'all', rocBusy: false };
const REC = { on: false, fromRide: false, cols: null, t0: null, lastT: -1, kind: 'normal', own: null, timer: 0 };

function labKey() {
  const l = S.lab;
  return [l.seed, l.per, l.noise, l.pocket, l.includeRec, S.recordings.filter(r => r.include).map(r => r.id).join(',')].join('|');
}

function ensureDataset() {
  if (LAB.set && LAB.key === labKey()) return;
  const l = S.lab;
  LAB.set = makeDataset({ seed: l.seed, per: l.per, noise: l.noise, pocket: l.pocket });
  if (l.includeRec) S.recordings.filter(r => r.include).forEach(r => LAB.set.push(recToTrace(r)));
  LAB.key = labKey();
  LAB.ev = null;
  LAB.roc = null;
}

function recToTrace(rec) {
  const cols = {};
  Object.keys(rec.cols).forEach(k => (cols[k] = Float32Array.from(rec.cols[k], v => (v == null ? NaN : v))));
  return { id: rec.id, kind: rec.kind, label: kindInfo(rec.kind).crash ? 1 : 0, seed: 0, hz: rec.hz || 50, cols, marks: [], eventT: null, rec: true, name: rec.name };
}

function runEvaluation() {
  ensureDataset();
  LAB.ev = evaluate(LAB.set, S.lab.cfg);
  const e = LAB.ev;
  S.lab.last = { f1: e.f1, precision: e.precision, recall: e.recall, fpr: e.fpr, n: LAB.set.length, ts: now() };
  persist('lab');
}

// The ROC re-runs the detector a dozen times, so it is computed after the sliders settle.
const scheduleRoc = debounce(() => {
  if (curRoute !== 'lab' || LAB.tab !== 'eval') return;
  LAB.roc = rocCurve(LAB.set, S.lab.cfg, S.lab.sweep);
  const box = $('#rocBox');

    box.innerHTML = rocInner();

}, 220);

/** Record from the running ride, the phone's sensors, or (when they are absent) the simulator. */
async function startRecording() {
  Object.assign(REC, { on: true, cols: { t: [], ax: [], ay: [], az: [], rx: [], ry: [], rz: [], kmh: [] }, t0: null, lastT: -1, fromRide: RIDE.on, own: null });
  if (!RIDE.on) {
    const useSensors = S.settings.source !== 'sim' && SENS.motion !== 'absent' && (await askMotionPermission());
    REC.own = { sim: null, raf: 0, clock: 0, last: 0 };
    if (useSensors) {
      startSensors(recordSample);
      startGps(() => {});
      setTimeout(() => REC.on && !LIVE.samples && recFallbackToSim(), 2500);
    } else recFallbackToSim();
  }
  REC.timer = setInterval(() => {
    const n = REC.cols.t.length;
    setText('recDur', fmtN(n ? REC.cols.t[n - 1] : 0, 1) + ' s');
    setText('recN', n);
  }, 250);
  refreshRecorder();
}

function recFallbackToSim() {
  stopSensors();
  REC.own.sim = new SimRide('commute', (now() % 9999) + 1);
  const loop = ts => {
    if (!REC.on) return;
    const dt = REC.own.last ? Math.min(0.25, (ts - REC.own.last) / 1000) : 0;
    REC.own.last = ts;
    REC.own.clock += dt;
    REC.own.sim.pull(REC.own.clock, recordSample);
    REC.own.raf = requestAnimationFrame(loop);
  };
  REC.own.raf = requestAnimationFrame(loop);
  refreshRecorder();
}

/** Downsample to ≤ 50 Hz, round, and stop automatically after 60 s. */
function recordSample(s) {
  if (!REC.on) return;
  if (REC.t0 === null) REC.t0 = s.t;
  const tt = s.t - REC.t0;
  if (tt - REC.lastT < 0.018) return;
  REC.lastT = tt;
  const c = REC.cols;
  c.t.push(round(tt, 3));
  c.ax.push(round(s.ax, 2));
  c.ay.push(round(s.ay, 2));
  c.az.push(round(s.az, 2));
  c.rx.push(round(s.rx, 1));
  c.ry.push(round(s.ry, 1));
  c.rz.push(round(s.rz, 1));
  c.kmh.push(s.kmh == null ? null : round(s.kmh, 1));
  if (tt >= 60) stopRecording(true);
}

function stopRecording(save) {
  if (!REC.on) return;
  REC.on = false;
  clearInterval(REC.timer);
  if (REC.own) {
    cancelAnimationFrame(REC.own.raf);
    if (!REC.own.sim) stopSensors();
  }
  const src = REC.fromRide ? RIDE.src : REC.own && REC.own.sim ? 'sim' : 'sensors';
  if (save && REC.cols.t.length > 50) addRecording(REC.cols, REC.kind, src);
  else if (save) toast(t('rec_tooShort'), 'bad');
  REC.own = null;
  if (curRoute === 'lab') renderLabBody();
}

function addRecording(cols, kind, src, name = null) {
  const rec = { id: uid('rec'), name: name || t('rec_name', { d: fmtDT(now()) }), kind, src, ts: now(), hz: 50, cols, include: true };
  S.recordings.unshift(rec);
  while (S.recordings.length > 12) S.recordings.pop();
  if (!persist('recordings')) {
    S.recordings.shift();
    return null;
  }
  logEvent('lg_record', { k: kind }, 'record');
  toast(t('rec_saved'), 'ok');
  return rec;
}

/** False-alarm feedback: the last ~40 s of the ride buffer becomes a labelled recording. */
function saveBufferAsRecording(kind, src) {
  const buf = RIDE.buf;
  const cols = { t: [], ax: [], ay: [], az: [], rx: [], ry: [], rz: [], kmh: [] };
  const t0 = buf[0].t;
  let last = -1;
  buf.forEach(s => {
    if (s.t - t0 - last < 0.018) return;
    last = s.t - t0;
    cols.t.push(round(last, 3));
    ['ax', 'ay', 'az'].forEach(k => cols[k].push(round(s[k], 2)));
    ['rx', 'ry', 'rz'].forEach(k => cols[k].push(round(s[k], 1)));
    cols.kmh.push(s.kmh == null ? null : round(s.kmh, 1));
  });
  return addRecording(cols, kind, src, t('rec_falseName', { d: fmtDT(now()) }));
}

function importRecordingCsv(text) {
  const parsed = csvToCols(text);
  if (!parsed) {
    toast(t('rec_badCsv'), 'bad');
    return;
  }
  const kind = TRACE_KINDS.some(k => k.id === parsed.label) ? parsed.label : 'normal';

}

// =====================================================================
// RIDE COACH — explainable per-ride score, trends, badges, helmet
// streaks and a printable weekly summary.
//   score = 100 − Σ wₖ·nₖ·(10 / max(km, 2)) − night 5 − no helmet 20
//           − pillion without helmet 10, clamped to 0…100
// =====================================================================
function rideScore(trip) {
  const per10 = 10 / Math.max(trip.km || 0, 2);
  const counts = Object.fromEntries(COACH_KINDS.map(k => [k, 0]));
  (trip.events || []).forEach(e => {
    if (counts[e.kind] != null) counts[e.kind]++;
  });
  const parts = COACH_KINDS.map(k => ({ k, n: counts[k], pts: counts[k] * COACH_W[k] * per10 }));
  const extra = [];
  if (trip.night) extra.push({ k: 'night', pts: 5 });
  if (trip.helmet && trip.helmet.rider === false) extra.push({ k: 'noHelmet', pts: 20 });
  if (trip.pillion && trip.helmet && trip.helmet.pillion === false) extra.push({ k: 'noPillion', pts: 10 });
  const pen = sum(parts.map(p => p.pts)) + sum(extra.map(e => e.pts));
  return { score: clamp(Math.round(100 - pen), 0, 100), parts, extra, counts };
}

function scoreExplain(sc) {
  const bits = sc.parts.filter(p => p.n).map(p => t('sx_part', { k: t('ev_' + p.k), n: p.n, pts: fmtN(p.pts, 1) }));
  sc.extra.forEach(e => bits.push(t('sx_' + e.k, { pts: e.pts })));
  return bits.length ? t('sx_intro') + ' ' + bits.join(' · ') : t('sx_clean');
}

const scoreCls = s => (s >= 85 ? 'g' : s >= 65 ? 'y' : 'r');
const tripsAsc = () => [...S.trips].sort((a, b) => a.start - b.start);

/** Current and best run of rides where the rider confirmed a helmet. */
function helmetStreak(trips = tripsAsc()) {
  let cur = 0;
  let best = 0;
  trips.forEach(tr => {
    cur = tr.helmet && tr.helmet.rider ? cur + 1 : 0;
    best = Math.max(best, cur);
  });
  return { current: cur, best };
}

// Length of the most recent run of trips that satisfy a test.
function recentRun(trips, test) {
  let n = 0;
  for (let i = trips.length - 1; i >= 0 && test(trips[i]); i--) n++;
  return n;
}

function badgeStatus() {
  const tr = tripsAsc();
  const week = tr.filter(x => x.start > now() - 7 * DAY);
  const pill = tr.filter(x => x.pillion).slice(-3);
  const rules = {
    helmet10: () => helmetStreak(tr).current / 10,
    smooth5: () => recentRun(tr, x => x.score >= 90) / 5,
    limit10: () => recentRun(tr, x => !x.events.some(e => e.kind === 'speed')) / 10,
    handsoff: () => recentRun(tr, x => !x.events.some(e => e.kind === 'touch')) / 10,
    pillion: () => (pill.length < 3 ? pill.length / 3 / 2 : pill.every(x => x.helmet.pillion) ? 1 : 0.5),
    century: () => sum(week.map(x => x.km)) / 100,
    clean: () => (tr.some(x => x.km >= 10 && !x.events.length) ? 1 : Math.max(0, ...tr.filter(x => !x.events.length).map(x => x.km / 10))),
    daylight: () => (week.some(x => x.night) ? 0 : Math.min(1, week.length / 3)),
  };
  return BADGES.map(b => {
    const prog = clamp(rules[b.id](), 0, 1);
    return { ...b, prog, earned: prog >= 1 };
  });
}

/** This week vs the week before: rides, km, average score and harsh events per 100 km. */
function weekSummary(offset = 0) {
  const end = now() - offset * 7 * DAY;
  const list = S.trips.filter(x => x.start <= end && x.start > end - 7 * DAY);
  const km = sum(list.map(x => x.km));
  const ev = sum(list.map(x => x.events.length));
  return { rides: list.length, km, score: list.length ? mean(list.map(x => x.score)) : null, per100: km ? (ev / km) * 100 : 0, list };
}

function topEventKind(trips) {
  const c = Object.fromEntries(COACH_KINDS.map(k => [k, 0]));
  trips.forEach(tr => tr.events.forEach(e => c[e.kind] != null && c[e.kind]++));
  const best = COACH_KINDS.reduce((a, b) => (c[b] > c[a] ? b : a));
  return c[best] ? best : null;
}

// MAP CANVAS (schematic, offline) and TRIPS — ride list, ride detail
// with the route coloured by speed, events on a timeline, GPX export,
// printable trip report and an optional Leaflet street map when online.
// =====================================================================
const TRIPS = { city: 'all', sort: 'new', q: '', lmap: null };

/** Fit an equirectangular projection (longitude scaled by cos φ) of `bounds` into a canvas. */
function mapView(canvas, bounds, pad = 26) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 600;
  const h = canvas.clientHeight || 340;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const k = Math.cos(toRad((bounds.s + bounds.n) / 2));
  const sx = (w - pad * 2) / Math.max(1e-6, (bounds.e - bounds.w) * k);
  const sy = (h - pad * 2) / Math.max(1e-6, bounds.n - bounds.s);
  const s = Math.min(sx, sy);
  const ox = (w - (bounds.e - bounds.w) * k * s) / 2;
  const oy = (h - (bounds.n - bounds.s) * s) / 2;
  return {
    ctx, w, h,
    X: lng => ox + (lng - bounds.w) * k * s,
    Y: lat => oy + (bounds.n - lat) * s,
    inv: (x, y) => ({ lng: bounds.w + (x - ox) / (k * s), lat: bounds.n - (y - oy) / s }),
    mPerPx: 111320 / s,
  };
}

function boundsOf(points, minSpan = 0.01) {
  const lats = points.map(p => p[0]);
  const lngs = points.map(p => p[1]);
  const b = { s: Math.min(...lats), n: Math.max(...lats), w: Math.min(...lngs), e: Math.max(...lngs) };
  const padLat = Math.max(minSpan - (b.n - b.s), 0) / 2 + (b.n - b.s) * 0.08;
  const padLng = Math.max(minSpan - (b.e - b.w), 0) / 2 + (b.e - b.w) * 0.08;
  return { s: b.s - padLat, n: b.n + padLat, w: b.w - padLng, e: b.e + padLng };
}

const cityBounds = id => boundsOf([...CITIES[id].places.map(p => [p.lat, p.lng]), ...CITIES[id].roads.flatMap(r => r.pts)], 0.05);

/** Background: grid, coast, schematic roads and neighbourhood labels. */
function drawBase(v, cityId, { labels = true } = {}) {
  const { ctx } = v;
  const col = { bg: cssVar('--bg-2'), line: cssVar('--line'), road: cssVar('--line-2'), muted: cssVar('--muted'), cyan: cssVar('--cyan') };
  ctx.fillStyle = col.bg;
  ctx.fillRect(0, 0, v.w, v.h);
  ctx.strokeStyle = col.line;
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.55;
  ctx.beginPath();
  for (let x = 0.5; x < v.w; x += 40) {
    ctx.moveTo(x, 0);
    ctx.lineTo(x, v.h);
  }
  for (let y = 0.5; y < v.h; y += 40) {
    ctx.moveTo(0, y);
    ctx.lineTo(v.w, y);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
  CITIES[cityId].roads.forEach(r => {
    ctx.beginPath();
    r.pts.forEach(([la, ln], i) => (i ? ctx.lineTo(v.X(ln), v.Y(la)) : ctx.moveTo(v.X(ln), v.Y(la))));
    ctx.strokeStyle = r.water ? col.cyan : col.road;
    ctx.globalAlpha = r.water ? 0.45 : 1;
    ctx.lineWidth = r.water ? 6 : r.ring ? 5 : 3.5;
    ctx.setLineDash(r.ring ? [10, 6] : []);
    ctx.stroke();
  });
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
  if (!labels) return;
  ctx.font = `600 11px ${lang === 'ur' ? 'Noto Nastaliq Urdu' : 'Barlow'}, sans-serif`;
  ctx.fillStyle = col.muted;
  ctx.textAlign = 'center';
  CITIES[cityId].places.forEach(p => ctx.fillText(L(p.n), v.X(p.lng), v.Y(p.lat) - 6));
}

const speedColor = (kmh, limit) => (kmh > limit * 1.1 ? cssVar('--red') : kmh > limit * 0.7 ? cssVar('--yellow') : cssVar('--cyan'));

function drawRoute(v, tr, { width = 5, bySpeed = true, alpha = 1 } = {}) {
  const { ctx } = v;
  const lim = roadType(tr.road).limit;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.globalAlpha = alpha;
  ctx.lineWidth = width;
  for (let i = 1; i < tr.pts.length; i++) {
    const a = tr.pts[i - 1];
    const b = tr.pts[i];
    ctx.strokeStyle = bySpeed ? speedColor(b[2], lim) : cssVar('--yellow');
    ctx.beginPath();
    ctx.moveTo(v.X(a[1]), v.Y(a[0]));
    ctx.lineTo(v.X(b[1]), v.Y(b[0]));
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawPin(v, lat, lng, color, r = 6, ring = false) {
  const { ctx } = v;
  ctx.beginPath();
  ctx.arc(v.X(lng), v.Y(lat), r, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.lineWidth = ring ? 3 : 2;
  ctx.strokeStyle = ring ? cssVar('--ink') : cssVar('--bg');
  ctx.stroke();
}

const EVENT_COLORS = { brake: '--red', accel: '--orange', corner: '--yellow', speed: '--red', touch: '--cyan' };

function filteredTrips() {
  const q = TRIPS.q.trim().toLowerCase();
  const list = S.trips.filter(x => (TRIPS.city === 'all' || x.city === TRIPS.city) && (!q || tripTitle(x).toLowerCase().includes(q)));
  const by = { new: (a, b) => b.start - a.start, score: (a, b) => b.score - a.score, low: (a, b) => a.score - b.score, km: (a, b) => b.km - a.km }[TRIPS.sort];
  return list.sort(by);
}

const tripTitle = tr => (tr.from ? `${L(tr.from)} → ${L(tr.to)}` : t('tr_ride', { c: L(CITIES[tr.city].name) }));

/** Route shape as a tiny SVG so the list needs no canvas. */
function routeThumb(tr) {
  if (tr.pts.length < 2) return `<div class="thumb empty-thumb">${ic('route')}</div>`;
  const b = boundsOf(tr.pts, 0.002);
  const k = Math.cos(toRad(b.s));
  const sc = Math.min(96 / ((b.e - b.w) * k), 56 / (b.n - b.s));
  const pts = tr.pts.map(p => `${(4 + (p[1] - b.w) * k * sc).toFixed(1)},${(4 + (b.n - p[0]) * sc).toFixed(1)}`).join(' ');
  return `<svg class="thumb" viewBox="0 0 104 64" aria-hidden="true"><polyline points="${pts}"/></svg>`;
}

function tripCard(tr) {
  return `<a class="card trip lift" href="#trips/${tr.id}">${routeThumb(tr)}<div class="grow">
    <div class="between"><b class="tt">${esc(tripTitle(tr))}</b><span class="chip ${scoreCls(tr.score)} num">${tr.score}</span></div>
    <small class="muted">${fmtDT(tr.start)}</small>
    <div class="row tiny mt-s"><span>${ic('route')} ${fmtN(tr.km, 1)} km</span><span>${ic('clock')} ${durMin(tr.durS)}</span><span>${ic('gauge')} ${tr.maxKmh} km/h</span>
    ${tr.night ? `<span class="chip">${ic('moon')}</span>` : ''}${tr.pillion ? `<span class="chip ${tr.helmet.pillion ? 'g' : 'r'}">${ic('users')}</span>` : ''}${tr.src === 'sim' ? `<span class="chip c">${t('src_sim')}</span>` : ''}</div>
        </div></a>`;
}

function eventRow(e) {

      <small>${clock(e.t)} · ${fmtN(e.val, 1)} ${unit}</small></span></div>`;
}

function drawTripMap(tr) {
  const c = $('#tdMap');
  if (!c || tr.pts.length < 2) return;
  const v = mapView(c, boundsOf(tr.pts, 0.012));
  drawBase(v, tr.city);
  drawRoute(v, tr, { width: 9, bySpeed: false, alpha: 0.18 });
  drawRoute(v, tr);
  S.hazards.filter(h => h.status === 'open').forEach(h => drawPin(v, h.lat, h.lng, cssVar('--orange'), 5));
  tr.events.forEach(e => e.lat != null && drawPin(v, e.lat, e.lng, cssVar(EVENT_COLORS[e.kind]), 5));
  const a = tr.pts[0];
  const b = tr.pts[tr.pts.length - 1];
  drawPin(v, a[0], a[1], cssVar('--green'), 8, true);
  drawPin(v, b[0], b[1], cssVar('--ink'), 8, true);
}

/** Speed over time with event markers. */
function timelineSvg(tr) {
  const W = 720;
  const H = 120;
  const dur = Math.max(1, tr.durS);
  const maxV = Math.max(40, tr.maxKmh + 10);
  const X = s => 30 + (s / dur) * (W - 40);
  const Y = v => H - 18 - (v / maxV) * (H - 30);
  const line = tr.pts.map((p, i) => `${i ? 'L' : 'M'}${X(p[3]).toFixed(1)} ${Y(p[2]).toFixed(1)}`).join('');
  const lim = roadType(tr.road).limit;
  const marks = tr.events.map(e => `<g class="evm ${e.kind}"><line x1="${X(e.t).toFixed(1)}" x2="${X(e.t).toFixed(1)}" y1="8" y2="${H - 18}"/>
      <circle cx="${X(e.t).toFixed(1)}" cy="10" r="4"><title>${t('ev_' + e.kind)} ${clock(e.t)}</title></circle></g>`).join('');
  return `<svg class="chart tl" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('tr_timeline')}">
      <line class="refl" x1="30" x2="${W - 10}" y1="${Y(lim)}" y2="${Y(lim)}"/>
    <text class="ax" x="26" y="${Y(lim) + 4}" text-anchor="end">${lim}</text>${marks}<path class="ln c" d="${line}" data-draw/>
    <text class="ax" x="30" y="${H - 3}">0:00</text><text class="ax" x="${W - 10}" y="${H - 3}" text-anchor="end">${clock(dur)}</text></svg>`;
}

function tripGpx(tr) {
  const pts = tr.pts.map(p => `<trkpt lat="${p[0]}" lon="${p[1]}"><time>${new Date(tr.start + p[3] * 1000).toISOString()}</time><extensions>
      <speed>${(p[2] / 3.6).toFixed(2)}</speed></extensions></trkpt>`).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Sawaar FYP template" xmlns="http://www.topografix.com/GPX/1/1"><trk>
      <name>${esc(tripTitle(tr))}</name><trkseg>\n${pts}\n</trkseg></trk></gpx>`;
}

function printTrip(tr, sc) {
  const rows = tr.events.map(e => `<tr><td>${clock(e.t)}</td><td>${t('ev_' + e.kind)}</td><td>${fmtN(e.val, 1)}</td></tr>`).join('');
  printDoc(`<div class="pdoc"><h1>${t('appName')} — ${esc(tripTitle(tr))}</h1>
      <p>${fmtDT(tr.start)} · ${fmtN(tr.km, 2)} km · ${clock(tr.durS)} · ${t('k_avg')} ${fmtN(tr.avgKmh, 0)} km/h · ${t('k_max')} ${tr.maxKmh} km/h</p>
    <p><b>${t('k_score')}: ${sc.score}/100</b> — ${scoreExplain(sc)}</p>${timelineSvg(tr)}
    <table class="tbl"><thead><tr><th>${t('k_time')}</th><th>${t('tr_event')}</th><th>${t('tr_value')}</th></tr></thead><tbody>${rows || `<tr>
        <td colspan="3">${t('tr_noEvents')}</td></tr>`}</tbody></table></div>`);

// ---------- optional street map (Leaflet 1.9.4, loaded only on request; schematic canvas otherwise) ----------
function loadLeaflet() {
  if (window.leaflet) return Promise.resolve(window.leaflet);
  return new Promise((resolve, reject) => {
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    css.integrity = 'sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=';
    css.crossOrigin = '';
    document.head.append(css);
    const js = document.createElement('script');
    js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    js.integrity = 'sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=';
    js.crossOrigin = '';
    js.onload = () => (window.leaflet ? resolve(window.leaflet) : reject(new Error('leaflet')));
    js.onerror = () => reject(new Error('offline'));
    document.head.append(js);
    setTimeout(() => reject(new Error('timeout')), 12000);
  });
}

async function showStreetMap(tr) {
  if (!navigator.onLine) {
    toast(t('tr_offline'), 'bad');
    return;
  }
  toast(t('tr_loadingMap'));
  try {
    const Lf = await loadLeaflet();
    const box = $('#tdLeaflet');
    if (!box) return;
    box.classList.remove('hidden');
    $('#tdMap').classList.add('hidden');
    if (TRIPS.lmap) TRIPS.lmap.remove();
    TRIPS.lmap = Lf.map(box);
    Lf.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(TRIPS.lmap);
    const line = Lf.polyline(tr.pts.map(p => [p[0], p[1]]), { color: cssVar('--yellow'), weight: 5 }).addTo(TRIPS.lmap);
    TRIPS.lmap.fitBounds(line.getBounds(), { padding: [20, 20] });
    toast(t('tr_tilesNote'));
  } catch {
    toast(t('tr_mapFailed'), 'bad');
  }
}

function qrPayload() {
  const p = S.profile;
  const ice = S.contacts.slice(0, 2).map(c => `${c.name} ${c.phone}`).join('; ');
  return [
    'SAWAAR EMERGENCY CARD',
    `Name: ${p.name || '-'}`,
    `Blood: ${p.blood || '-'}`,
    `Allergies: ${p.allergies || '-'}`,
    `Conditions: ${p.conditions || '-'}`,
    `Medication: ${p.meds || '-'}`,
    `ICE: ${ice || '-'}`,
    S.bike.reg ? `Bike: ${S.bike.reg}` : '',

  ].filter(Boolean).join('\n').slice(0, 600);
}

function qrSvg(label) {

/** Last 35 days: green when every ride had a helmet (rider and pillion), red when one did not. */
function helmetCalendar() {
  const today = dayStart(now());
  const cells = [];
  for (let d = 34; d >= 0; d--) {
    const day = today - d * DAY;
    const rides = S.trips.filter(x => x.start >= day && x.start < day + DAY);
    const miss = rides.some(x => !x.helmet.rider || (x.pillion && x.helmet.pillion === false));
    const cls = !rides.length ? '' : miss ? 'miss' : 'ok';
    cells.push(`<span class="cal ${cls}" title="${fmtDay(day)}: ${t('co_rides', { n: rides.length })}">${new Date(day).getDate()}</span>`);
  }
  return `<div class="calgrid">${cells.join('')}</div>`;
}

/** Full-to-full method: distance between fills ÷ quantity added at the later fill. */
function fuelStats() {
  const asc = [...S.fuel].sort((a, b) => a.odo - b.odo);
  return asc.map((f, i) => {
    const prev = asc[i - 1];
    const dist = prev && prev.full && f.full ? f.odo - prev.odo : null;
    return { ...f, dist, eff: dist ? dist / f.qty : null, rsKm: dist ? (f.qty * f.price) / dist : null };
  });
}

    trend: weeklyScores(), helmetPct: tr.length ? Math.round((tr.filter(x => x.helmet.rider).length / tr.length) * 100) : 0,
    incidents: S.crashLog.filter(x => x.kind === 'alert' && x.ts > now() - 30 * DAY).length, harsh, lastActive: S.trips[0] ? S.trips[0].start : 0,

/** Harsh events binned on a 16 × 11 grid over the city; colour runs cyan → yellow → red with the count. */
function hotspotGrid(cityId, kind) {
  const b = cityBounds(cityId);
  const cols = 16;
  const rowsN = 11;
  const grid = Array.from({ length: rowsN }, () => new Array(cols).fill(0));
  const add = (lat, lng) => {
    const c = Math.floor(((lng - b.w) / (b.e - b.w)) * cols);
    const r = Math.floor(((b.n - lat) / (b.n - b.s)) * rowsN);
    if (c >= 0 && c < cols && r >= 0 && r < rowsN) grid[r][c]++;
  };
  S.fleetEvents.forEach(([lat, lng, k]) => (kind === 'all' || k === kind) && add(lat, lng));
  S.trips.filter(x => x.city === cityId).forEach(x => x.events.forEach(e => e.lat != null && (kind === 'all' || e.kind === kind) && add(e.lat, e.lng)));
  return { grid, cols, rowsN, b };
}

/** The heatmap itself (SVG, top hotspots, note) for one city: used on screen and in the printed report. */
function heatSvgHtml(cityId, kind) {
  const { grid, cols, rowsN, b } = hotspotGrid(cityId, kind);
  const max = Math.max(1, ...grid.flat());
  const cw = 640 / cols;
  const ch = 400 / rowsN;
  const color = f => (f < 0.5 ? `color-mix(in srgb, var(--cyan) ${Math.round(30 + f * 120)}%, transparent)` : `color-mix(in srgb, var(--red) ${Math.round((f - 0.5) * 200)}%, var(--yellow))`);
  const cells = grid.flatMap((row, r) => row.map((n, c) => (n ? `<rect x="${(c * cw).toFixed(1)}" y="${(r * ch).toFixed(1)}" width="${(cw - 2).toFixed(1)}" height="${(ch - 2).toFixed(1)}" rx="4" style="fill:${color(n / max)}">
      <title>${n}</title></rect>` : ''))).join('');
  const labels = CITIES[cityId].places.map(p => `<text class="hm-l" x="${(((p.lng - b.w) / (b.e - b.w)) * 640).toFixed(1)}" y="${(((b.n - p.lat) / (b.n - b.s)) * 400).toFixed(1)}">${esc(L(p.n))}</text>`).join('');
  const top = topHotspots(cityId, grid, cols, rowsN, b);
  return `<svg class="heat" viewBox="0 0 640 400" role="img" aria-label="${t('fl_hotspots')} ${esc(L(CITIES[cityId].name))}">
      <rect class="hm-bg" width="640" height="400" rx="10"/>${cells}${labels}</svg>
    <ol class="small mt">${top.map(h => `<li>${t('fl_hotItem', { n: h.n, p: L(h.place.n) })}</li>`).join('')}</ol><p class="tiny muted">${t('fl_heatNote')}</p>`;
}

function heatCardHtml() {
  return `<div class="between"><h2>${ic('flame')} ${t('fl_hotspots')}</h2><div class="row">
      <div class="seg" id="flCity">${['lhr', 'khi'].map(c => `<button type="button" data-c="${c}" class="${FLEET.city === c ? 'on' : ''}">${L(CITIES[c].name)}</button>`).join('')}</div>
    <select class="inp sel-sm" id="flKind" aria-label="${t('fl_kind')}">
        <option value="all">${t('all')}</option>${COACH_KINDS.map(k => `<option value="${k}" ${FLEET.kind === k ? 'selected' : ''}>${t('ev_' + k)}</option>`).join('')}</select>

/** Cells are credited to their nearest neighbourhood, then the three busiest neighbourhoods are listed. */
function topHotspots(cityId, grid, cols, rowsN, b) {
  const places = CITIES[cityId].places;
  const byPlace = new Map();
  grid.forEach((row, r) => row.forEach((n, c) => {
    if (!n) return;
    const at = { lat: b.n - ((r + 0.5) / rowsN) * (b.n - b.s), lng: b.w + ((c + 0.5) / cols) * (b.e - b.w) };
    const place = places.reduce((best, p) => (haversine(p, at) < haversine(best, at) ? p : best));
    byPlace.set(place, (byPlace.get(place) || 0) + n);
  }));
  return [...byPlace].sort((x, y) => y[1] - x[1]).slice(0, 3).map(([place, n]) => ({ place, n }));
}

const HZ = { city: 'lhr', type: 'all', status: 'open', sel: null, view: null };

/** Distance from a point to the nearest segment of any of your rides in this city (metres). */
function distToRoutes(h) {
  let best = Infinity;
  const k = Math.cos(toRad(h.lat)) * 111320;
  S.trips.filter(x => x.city === h.city).forEach(tr => {
    for (let i = 1; i < tr.pts.length; i++) {
      const ax = (tr.pts[i - 1][1] - h.lng) * k;
      const ay = (tr.pts[i - 1][0] - h.lat) * 111320;
      const bx = (tr.pts[i][1] - h.lng) * k;
      const by = (tr.pts[i][0] - h.lat) * 111320;
      const dx = bx - ax;
      const dy = by - ay;
      const u = clamp(-(ax * dx + ay * dy) / (dx * dx + dy * dy || 1), 0, 1);
      best = Math.min(best, Math.hypot(ax + u * dx, ay + u * dy));
    }
  });
  return best;
}

function hazardList() {
  return S.hazards.filter(h => h.city === HZ.city && (HZ.type === 'all' || h.type === HZ.type) && (HZ.status === 'all' || h.status === HZ.status));
}

// Tap the map: select a nearby pin, otherwise add a new one at that spot.
function onHazardMapClick(e) {
  const v = HZ.view;
  const rect = e.currentTarget.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const near = hazardList().find(h => Math.hypot(v.X(h.lng) - x, v.Y(h.lat) - y) < 12);
  if (near) {
    HZ.sel = near.id;
    refreshHazards();
    return;
  }
  openHazardForm(v.inv(x, y));
}

      <svg viewBox="0 0 100 100" role="img" aria-label="${t(s.k)}">${s.svg}</svg><figcaption>${t(s.k)}</figcaption></figure>`).join('')}</div>
      <p class="tiny muted">${t('sg_note')}</p>` : '';
  $('#view').innerHTML = `<a class="btn ghost sm mb" href="#learn">${ic('arrow-left', 'flip')} ${t('ln_all')}</a>
    <article class="card lesson-view ${id === 'firstaid' ? 'firstaid' : ''}"><h2>${ic(l.icon)} ${esc(L(l.title))}</h2><div class="lane"></div>
        <p class="lead">${esc(L(l.intro))}</p>
    ${id === 'firstaid' ? `<a class="btn r lg" href="tel:1122">${ic('phone')} ${t('al_call1122')}</a>` : ''}

    <div class="between mt">
        <a class="btn ghost" href="#learn/quiz">${ic('help')} ${t('qz_title')}</a>${next ? `<a class="btn y" href="#learn/${next.id}">${esc(L(next.title))} ${ic('arrow-right', 'flip')}</a>` : ''}</div>`;
}

function renderQuiz() {
  if (QZ.done) return renderQuizResult();
  const q = QUIZ[QZ.i];
  const picked = QZ.picks[QZ.i];
  const answered = picked != null;
  $('#view').innerHTML = `<a class="btn ghost sm mb" href="#learn">${ic('arrow-left', 'flip')} ${t('ln_all')}</a>
    <section class="card quiz"><div class="between"><span class="chip y">${t('qz_q', { i: QZ.i + 1, n: QUIZ.length })}</span><div class="bar grow qbar">
        <i data-w="${((QZ.i + (answered ? 1 : 0)) / QUIZ.length) * 100}"></i></div></div>
    <h2 class="qtext">${esc(L(q.q))}</h2><div class="opts">${q.opts.map((o, i) => {
      const cls = !answered ? '' : i === q.a ? 'right' : i === picked ? 'wrong' : '';
      return `<button type="button" class="opt ${cls}" data-o="${i}" ${answered ? 'disabled' : ''}>${ic(cls === 'right' ? 'check-circle' : cls === 'wrong' ? 'x' : 'circle')} ${esc(L(o))}</button>`;
    }).join('')}</div>
    <div aria-live="polite">${answered ? `<div class="note ${picked === q.a ? '' : 'y'} mt">${ic(picked === q.a ? 'check-circle' : 'info')}<span>
        <b>${t(picked === q.a ? 'qz_right' : 'qz_wrong')}</b> ${esc(L(q.why))}</span></div>
      <button type="button" class="btn y mt" id="qzNext">${QZ.i === QUIZ.length - 1 ? t('qz_finish') : t('next')} ${ic('arrow-right', 'flip')}</button>` : ''}</div>
          </section>`;
  $$('.opt[data-o]').forEach(b => (b.onclick = () => {
    QZ.picks[QZ.i] = Number(b.dataset.o);
    rerender();
  }));
  const nx = $('#qzNext');
  if (nx) {
    nx.onclick = () => {
      if (QZ.i === QUIZ.length - 1) finishQuiz();
      else QZ.i++;
      rerender();
    };
    nx.focus({ preventScroll: true });
  }
}

function finishQuiz() {
  const score = QZ.picks.filter((p, i) => p === QUIZ[i].a).length;
  QZ.done = true;
  S.quiz.attempts.unshift({ ts: now(), score });
  S.quiz.attempts.length = Math.min(S.quiz.attempts.length, 20);
  S.quiz.best = Math.max(S.quiz.best ?? 0, score);
  persist('quiz');
  logEvent('lg_quiz', { s: score, n: QUIZ.length }, 'help');
}

function renderQuizResult() {
  const score = QZ.picks.filter((p, i) => p === QUIZ[i].a).length;
  const missed = QUIZ.map((q, i) => ({ q, i })).filter(x => QZ.picks[x.i] !== x.q.a);
  $('#view').innerHTML = `<section class="card quiz-res"><div class="row"><div class="ring">${ringSvg(score / QUIZ.length)}<b class="num">${score}</b></div>
    <div class="grow"><h2>${t('qz_done', { s: score, n: QUIZ.length })}</h2>
        <p class="muted small">${t(score >= 10 ? 'qz_great' : score >= 7 ? 'qz_good' : 'qz_try')}</p></div></div>
    ${missed.length ? `<h3 class="mt">${t('qz_review')}</h3><ol class="steps">${missed.map(x => `<li><b>${esc(L(x.q.q))}</b><br>
        <span class="small">${esc(L(x.q.opts[x.q.a]))} — ${esc(L(x.q.why))}</span></li>`).join('')}</ol>` : ''}
    <h3 class="mt">${t('qz_history')}</h3>
        <div class="row">${S.quiz.attempts.slice(0, 8).map(a => `<span class="chip">${fmtDate(a.ts, { day: 'numeric', month: 'short' })}: ${a.score}/${QUIZ.length}</span>`).join('')}</div>
    <div class="row mt"><button type="button" class="btn y" id="qzAgain">${ic('refresh')} ${t('qz_again')}</button>
        <a class="btn ghost" href="#learn">${t('ln_all')}</a></div></section>`;
  $('#qzAgain').onclick = () => {
    Object.assign(QZ, { i: 0, picks: [], done: false });
    rerender();
  };
}

let inboxTab = 'inbox';

// Translate stored ids inside notification / log variables into the current language.
function localVars(v = {}) {
  const out = { ...v };
  if (v.item) out.item = t('sv_' + v.item);
  if (v.badge) out.badge = t('bd_' + v.badge);
  if (v.type) out.type = t('hz_' + v.type);
  if (v.src) out.src = t('src_' + v.src);
  if (v.k) out.k = t('kind_' + v.k);
  return out;
}

function renderInbox(arg) {
  if (arg === 'log') inboxTab = 'log';
  else if (arg === 'inbox') inboxTab = 'inbox';
  const unread = unreadCount();
  $('#view').innerHTML = `<div class="between mb"><div class="seg" role="tablist">
      <button type="button" role="tab" data-tab="inbox" class="${inboxTab === 'inbox' ? 'on' : ''}" aria-selected="${inboxTab === 'inbox'}">${ic('bell')} ${t('ib_inbox')} ${unread ? `<span class="chip r">${unread}</span>` : ''}</button>
      <button type="button" role="tab" data-tab="log" class="${inboxTab === 'log' ? 'on' : ''}" aria-selected="${inboxTab === 'log'}">${ic('list')} ${t('ib_log')}</button>
          </div>
      <div class="row">${inboxTab === 'inbox' ? `<button type="button" class="btn ghost sm" id="ibAll">${ic('check')} ${t('ib_markAll')}</button>
          <button type="button" class="btn ghost sm" id="ibClear">${ic('trash')} ${t('ib_clear')}</button>` : `<button type="button" class="btn ghost sm" id="lgCsv">${ic('download')} CSV</button>
          <button type="button" class="btn ghost sm" id="lgPrint">${ic('printer')} ${t('print')}</button>`}</div></div>
    <section class="card">${inboxTab === 'inbox' ? notificationsHtml() : logHtml()}</section>`;
  $$('[data-tab]').forEach(b => (b.onclick = () => go('inbox/' + b.dataset.tab)));
  if (inboxTab === 'inbox') bindNotifications();

function notificationsHtml() {
  if (!S.inbox.length) return `<div class="empty">${ic('bell')}${t('ib_empty')}</div>`;
  return `<div class="list stagger">${S.inbox.map(n => `<button type="button" class="li ${n.read ? '' : 'unread'}" data-n="${n.id}">
      <span class="ico ${n.level || 'c'}">${ic(n.icon)}</span>
    <span class="grow"><b>${t(n.key + 't', localVars(n.vars))}</b><small>${t(n.key + 'b', localVars(n.vars))} · ${ago(n.ts)}</small>
        </span>${n.read ? '' : '<span class="dot-new" aria-hidden="true"></span>'}</button>`).join('')}</div>`;
}

function bindNotifications() {
  $$('[data-n]').forEach(b => (b.onclick = () => {
    const n = S.inbox.find(x => x.id === b.dataset.n);
    n.read = true;
    persist('inbox');
    updateBadges();
    if (n.route) go(n.route);
    else rerender();
  }));
  $('#ibAll').onclick = () => {
    S.inbox.forEach(n => (n.read = true));
    persist('inbox');
    updateBadges();
    rerender();
  };
  $('#ibClear').onclick = async () => {
    if (!(await askConfirm(t('ib_clearQ'), { danger: true, okText: t('ib_clear') }))) return;
    S.inbox = [];
    persist('inbox');
    updateBadges();
    rerender();

function logHtml() {
  if (!S.log.length) return `<div class="empty">${ic('list')}${t('ib_logEmpty')}</div>`;
  const groups = {};
  S.log.forEach(l => (groups[isoDay(l.ts)] = groups[isoDay(l.ts)] || []).push(l));
  return Object.entries(groups).map(([day, items]) => `<h3 class="day">${fmtDay(new Date(day + 'T12:00').getTime())}</h3>
      <div class="list">${items.map(l => `<div class="li"><span class="ico">${ic(l.icon)}</span><span class="grow">${t(l.key, localVars(l.vars))}</span>
      <small class="muted num">${fmtTime(l.ts)}</small></div>`).join('')}</div>`).join('');
}

function bindLog() {
  $('#lgCsv').onclick = () => {
    const rows = ['time,event', ...S.log.map(l => `${new Date(l.ts).toISOString()},"${tIn('en', l.key, l.vars).replace(/"/g, '""')}"`)];

}

function bindSettings() {
  const segBind = (id, fn) => $$(`#${id} button`).forEach(b => (b.onclick = () => fn(b.dataset.v)));

  segBind('stTheme', v => setPref('theme', v));
  segBind('stSize', v => setPref('size', v));
  const swBind = (id, key) => ($('#' + id).onchange = e => setPref(key, e.target.checked, false));
  swBind('stCalm', 'calm');
  swBind('stSound', 'sound');
  swBind('stVib', 'vibrate');
  swBind('stHaz', 'hazardWarn');
  $('#stVol').oninput = e => {
    S.settings.volume = Number(e.target.value);
    e.target.previousElementSibling.textContent = Math.round(S.settings.volume * 100) + '%';
    persist('settings');
  };
  $('#stTest').onclick = () => {
    startSiren(0.6);
    setTimeout(stopSiren, 1500);
  };
  $('#stMotion').onclick = async () => toast((await askMotionPermission()) ? t('st_motionOk') : t('rd_motionDenied'));
  $('#stGeo').onclick = testGeo;
  $('#stBle').onclick = connectHelmetSensor;
  $('#stBg').onclick = requestBackgroundMode;
  $('#stDemo').onchange = e => {
    setDemo(e.target.checked);
    applyPrefs();
    rerender();
  };
  $('#stExport').onclick = exportData;
  $('#stImport').onclick = () => pickFile('.json,application/json', importData);
  $('#stReset').onclick = resetDemo;
  $('#stWipe').onclick = wipeAll;
  $('#stTour').onclick = startTour;
  $('#stKeys').onclick = openShortcuts;
}

function setPref(key, value, rerenderNow = true) {
  S.settings[key] = value;
  persist('settings');
  applyPrefs();
  logEvent('lg_setting', { what: key }, 'settings');
  if (rerenderNow) rerender();
}

function testGeo() {
  if (!navigator.geolocation) {
    toast(t('ss_absent'), 'bad');
    return;
  }
  navigator.geolocation.getCurrentPosition(p => {
    SENS.geo = 'ok';
    toast(t('st_geoOk', { acc: Math.round(p.coords.accuracy) }), 'ok');
    rerender();
  }, e => {
    SENS.geo = e.code === 1 ? 'denied' : 'error';
    toast(t('st_geoFail'), 'bad');
    rerender();
  }, { enableHighAccuracy: true, timeout: 12000 });
}

function exportData() {
  const data = {};
  KEYS.forEach(k => (data[k] = S[k]));

  persist('meta');
  downloadFile(`sawaar-backup-${isoDay(now())}.json`, JSON.stringify({ app: 'sawaar', version: 1, exported: new Date().toISOString(), data }, null, 1));

function importData(text) {
  let obj;
  try {
    obj = JSON.parse(text);
  } catch {
    obj = null;
  }
  if (!obj || obj.app !== 'sawaar' || typeof obj.data !== 'object') {
    toast(t('st_importBad'), 'bad');
    return;
  }
  KEYS.forEach(k => {
    if (obj.data[k] !== undefined) S[k] = obj.data[k];
  });
  S.settings = { ...DEFAULT_SETTINGS, ...S.settings };
  S.engine = { ...ENGINE_DEFAULTS, ...S.engine };
  persistAll();
  LAB.set = null;
  logEvent('lg_import', {}, 'upload');
  applyPrefs();
  toast(t('st_imported'), 'ok');
  rerender();
}
