<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Algorithm Visualizer | FYP Template</title>
<meta name="description" content="Offline, single-file visual lab for sorting, pathfinding, graph and data-structure algorithms. Every algorithm is a JavaScript generator; a generic player records steps so you can scrub, step back, race two algorithms, benchmark them and print lab reports. FYP template.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens: IDE purple-black + syntax palette ---------- */
:root{
  --bg:#13111c; --panel:#1b1826; --panel-2:#221e30; --panel-3:#2a2640; --line:#2a2640; --line-2:#3a3554;
  --ink:#e0def4; --muted:#908caa; --dim:#6e6a86; --bar:#5b5775;
  --cmp:#f6c177; --swp:#eb6f92; --srt:#9ccfd8; --piv:#c4a7e7; --vis:#31748f; --pth:#f6c177; --fro:#9ccfd8;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Fira Code",ui-monospace,Menlo,Consolas,monospace;
  --radius:12px; --radius-sm:8px; --ease:cubic-bezier(.2,.8,.2,1); --dur:.35s; --code-size:.76rem;
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
html[data-motion=off] *,html[data-motion=off] *::before,html[data-motion=off] *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes ring{0%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}100%{transform:rotate(0)}}
.enter{animation:fadeUp var(--dur) var(--ease) both}
.stagger>*{animation:fadeUp .45s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.btn{transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s,border-color .15s}
.btn:hover{transform:translateY(-1px)} .btn:active{transform:translateY(0) scale(.98)}
.card,.tile{transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s}
.card:hover{transform:translateY(-2px);border-color:var(--line-2)}
.fill,.bar>i{transition:width .6s var(--ease)}
.skeleton{background:linear-gradient(90deg,var(--panel-2) 25%,var(--panel) 50%,var(--panel-2) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:10px;min-height:120px}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
html[data-text=large]{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.01em}
a{color:var(--srt)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.hidden{display:none!important}
.sr{position:absolute;top:0;left:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
:focus-visible{outline:2px solid var(--piv);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:8px} ::-webkit-scrollbar-track{background:transparent}
kbd{font-family:var(--mono);background:var(--panel-2);border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;color:var(--muted);font-size:.8em}

/* ---------- App frame ---------- */
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:0 16px;height:56px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;min-width:0}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--piv),var(--srt));display:grid;place-items:center;color:#13111c;flex:none}
.brand .logo svg{width:20px;height:20px;stroke:#13111c;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.brand h1{font-size:.98rem;font-weight:800;white-space:nowrap}
.brand small{display:block;font-size:.7rem;color:var(--muted);font-weight:600;letter-spacing:.04em}
.tabs{display:flex;gap:2px;position:relative;margin-left:6px;height:56px;align-items:stretch}
.tabs a{display:flex;align-items:center;gap:7px;padding:0 11px;color:var(--muted);text-decoration:none;font-weight:700;font-size:.86rem;white-space:nowrap;transition:color .2s}
.tabs a:hover{color:var(--ink)} .tabs a.active{color:var(--ink)}
.tabs .inkbar{position:absolute;bottom:-1px;height:2px;background:var(--piv);border-radius:2px;transition:left .3s var(--ease),width .3s var(--ease);box-shadow:0 0 12px var(--piv)}
.spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);display:grid;place-items:center;cursor:pointer;position:relative;flex:none}
.iconbtn:hover{color:var(--ink);border-color:var(--line-2)}
.iconbtn .dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--swp);color:#13111c;font-size:.66rem;font-weight:800;display:grid;place-items:center;padding:0 4px;font-family:var(--mono)}
.iconbtn.ringing .ic{animation:ring .6s var(--ease)}
.search{position:relative;display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:0 10px;height:40px;min-width:0;color:var(--muted)}
.search input{background:none;border:0;outline:0;color:var(--ink);width:190px;max-width:30vw;min-height:36px}
.search input::placeholder{color:var(--dim)}
.search kbd{font-size:.68rem}
.qres{position:absolute;top:46px;right:0;width:360px;max-width:92vw;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 20px 50px -20px rgba(0,0,0,.8);z-index:40;overflow:hidden;animation:pop .2s var(--ease)}
.qres button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px;cursor:pointer;color:var(--ink)}
.qres button:last-child{border-bottom:0}
.qres button:hover,.qres button.sel{background:var(--panel-2)}
.qres .k{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--piv);font-weight:800;min-width:64px}
.qres .t{font-weight:700;font-size:.86rem}
.qres .s{font-size:.76rem;color:var(--muted)}
.qres .empty{padding:14px;color:var(--muted);font-size:.84rem}
.work{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
.stage{padding:14px 18px 14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.codepane{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-width:0}
.cp-toggle{display:none}
.cp-body{display:flex;flex-direction:column;min-height:0;flex:1}
.cp-head{padding:14px 14px 8px;border-bottom:1px solid var(--line)}
.cp-head h2{font-size:.98rem;font-weight:800;display:flex;align-items:center;gap:8px}
.cp-head .sub{font-size:.76rem;color:var(--muted);margin-top:2px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.badge{font-family:var(--mono);font-size:.68rem;padding:3px 7px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.badge b{color:var(--ink);font-weight:600}
.badge.good{border-color:rgba(156,207,216,.5);color:var(--srt)} .badge.bad{border-color:rgba(235,111,146,.5);color:var(--swp)}
.code{list-style:none;margin:0;padding:8px 0;font-family:var(--mono);font-size:var(--code-size);line-height:1.6;counter-reset:ln;overflow:auto;flex:0 1 auto;min-height:90px}
.code li{display:flex;gap:10px;padding:1px 12px 1px 0;border-left:3px solid transparent;transition:background .2s,border-color .2s}
.code li .src{white-space:pre;min-width:0}
.code li::before{counter-increment:ln;content:counter(ln);width:2em;text-align:right;color:var(--dim);flex:none;padding-left:6px}
.code li.on{background:rgba(196,167,231,.14);border-left-color:var(--piv)}
.code li.on::before{color:var(--piv)}
.kw{color:var(--piv)} .num{color:var(--cmp)} .fn{color:var(--srt)} .cm{color:var(--dim);font-style:italic}
.cp-note{margin:10px 12px;padding:10px 12px;background:var(--panel-2);border-left:3px solid var(--cmp);border-radius:8px;font-size:.85rem;min-height:3.4em;transition:border-color .2s}
.cp-note.swap{border-left-color:var(--swp)} .cp-note.sorted{border-left-color:var(--srt)} .cp-note.pivot{border-left-color:var(--piv)} .cp-note.visit{border-left-color:var(--vis)} .cp-note.path{border-left-color:var(--pth)}
.cp-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:0 12px 12px}
.stat{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.stat .k{font-size:.64rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--mono);font-size:1rem;font-weight:600}
.stat.cmp .v{color:var(--cmp)} .stat.swp .v{color:var(--swp)} .stat.srt .v{color:var(--srt)} .stat.piv .v{color:var(--piv)}

/* ---------- Controls ---------- */
.ctrl{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.ctrl label,.f{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);font-weight:700}
select,input[type=text],input[type=number],textarea{background:var(--panel-2);border:1px solid var(--line-2);color:var(--ink);border-radius:8px;padding:7px 9px;min-height:40px;outline:0}
textarea{width:100%;min-height:90px;font-family:var(--mono);font-size:.8rem;resize:vertical}
select:focus,input:focus,textarea:focus{border-color:var(--piv);box-shadow:0 0 0 3px rgba(196,167,231,.18)}
input[type=range]{accent-color:var(--piv);height:40px;margin:0}
.btn{border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);border-radius:9px;padding:0 12px;min-height:40px;font-weight:700;font-size:.84rem;cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
.btn.primary{background:var(--piv);color:#13111c;border-color:var(--piv)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--swp);border-color:rgba(235,111,146,.4)}
.btn.sm{min-height:34px;padding:0 10px;font-size:.78rem}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn[aria-pressed=true]{background:rgba(196,167,231,.18);border-color:var(--piv);color:var(--piv)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--panel-2);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;padding:0 12px;min-height:40px;cursor:pointer;font-weight:700;font-size:.82rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.seg button.on{background:var(--panel-3);color:var(--ink)}
.seg.sm button{min-height:34px;padding:0 10px;font-size:.76rem}
.sw{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:.78rem;color:var(--muted);font-weight:700;min-height:40px}
.sw input{appearance:none;width:36px;height:20px;border-radius:999px;background:var(--panel-3);position:relative;margin:0;cursor:pointer;transition:background .2s;flex:none}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .2s var(--ease),background .2s}
.sw input:checked{background:var(--piv)} .sw input:checked::after{transform:translateX(16px);background:#13111c}
.chip{border:1px solid var(--line-2);background:var(--panel-2);border-radius:999px;padding:0 12px;min-height:36px;font-size:.8rem;font-weight:700;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:rgba(196,167,231,.18);border-color:var(--piv);color:var(--piv)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- Stage pieces ---------- */
.cv{position:relative;flex:1;min-height:280px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.cv .hint{position:absolute;left:12px;bottom:6px;font-size:.72rem;color:var(--dim);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 24px)}
html[data-hints=off] .cv .hint{display:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.74rem;color:var(--muted);font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.tile .k{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;white-space:nowrap}
.tile .v{font-family:var(--mono);font-size:1.15rem;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.cmp .v{color:var(--cmp)} .tile.swp .v{color:var(--swp)} .tile.srt .v{color:var(--srt)} .tile.piv .v{color:var(--piv)} .tile.vis .v{color:#5ab0cc}
.race{display:grid;grid-template-rows:1fr 1fr;gap:10px;flex:1;min-height:0}
.racer{display:flex;flex-direction:column;min-height:0;gap:6px}
.racer .rh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.8rem}
.racer .rh b{font-size:.9rem}
.racer .rh .c{font-family:var(--mono);color:var(--muted)} .racer .rh .c span{color:var(--ink)}
.racer .cv{min-height:150px}
.banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--piv);color:var(--ink);padding:8px 14px;border-radius:10px;font-weight:700;font-size:.85rem;display:flex;align-items:center;gap:8px;animation:pop .3s var(--ease);box-shadow:0 10px 30px -10px rgba(0,0,0,.6);max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner.win{border-color:var(--cmp);color:var(--cmp)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;min-width:0}
.panel h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.panel p{margin:0 0 8px;font-size:.88rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.adj{font-family:var(--mono);font-size:.76rem;line-height:1.7;max-height:150px;overflow:auto;white-space:pre}
.adj b{color:var(--piv);font-weight:600}
table.t{width:100%;border-collapse:collapse;font-size:.8rem}
table.t th,table.t td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
table.t td.n{font-family:var(--mono);text-align:right}
table.t tr.hl td{background:rgba(246,193,119,.1)}
table.t td .mini{display:inline-block;height:6px;border-radius:3px;background:var(--piv);vertical-align:middle;margin-right:6px}
.twrap{overflow:auto;max-height:150px}
.twrap.tall{max-height:none}
.empty{text-align:center;padding:26px 12px;color:var(--muted);font-size:.86rem}
.empty .ic{width:30px;height:30px;display:block;margin:0 auto 8px;color:var(--dim)}

/* ---------- Data structures ---------- */
.ds-view{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-height:320px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.cells{display:flex;gap:30px 6px;align-items:flex-end;flex-wrap:wrap;padding-top:18px}
.cell{width:46px;height:46px;border-radius:9px;background:var(--panel-3);border:1px solid var(--line-2);display:grid;place-items:center;font-family:var(--mono);font-weight:600;transition:transform .3s var(--ease),opacity .3s,background .2s,border-color .2s;position:relative}
.cell.enter{animation:fadeUp .3s var(--ease) both}
.cell.leave{opacity:0;transform:translateY(-14px) scale(.9)}
.cell.lo{border-color:var(--srt);color:var(--srt)} .cell.hi{border-color:var(--swp);color:var(--swp)} .cell.mid{background:var(--cmp);color:#13111c;border-color:var(--cmp)} .cell.found{background:var(--srt);color:#13111c} .cell.dead{opacity:.3}
.cell .tag{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:.62rem;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.stack-col{display:flex;flex-direction:column-reverse;gap:6px;width:120px;min-height:260px;justify-content:flex-start;border:1px dashed var(--line-2);border-top:0;border-radius:0 0 10px 10px;padding:8px}
.stack-col .cell{width:100%;height:38px}
.stack-col .cell .tag{top:50%;left:auto;right:-36px;transform:translateY(-50%)}
.queue-row{display:flex;gap:6px;min-height:60px;align-items:center;border:1px dashed var(--line-2);border-left:0;border-right:0;padding:26px 8px;overflow-x:auto}
.ptr{font-size:.7rem;color:var(--muted);font-family:var(--mono)}
svg.tree{width:100%;height:auto;max-height:520px;display:block}
svg.tree .node{transition:transform .45s var(--ease)}
svg.tree .node circle{fill:var(--panel-3);stroke:var(--line-2);stroke-width:2;transition:fill .25s,stroke .25s}
svg.tree .node text{fill:var(--ink);font-family:var(--mono);font-size:13px;font-weight:600;text-anchor:middle;dominant-baseline:central}
svg.tree .node.visit circle{stroke:var(--cmp);fill:rgba(246,193,119,.18)}
svg.tree .node.found circle{fill:var(--srt);stroke:var(--srt)} svg.tree .node.found text{fill:#13111c}
svg.tree .node.new circle{fill:var(--piv);stroke:var(--piv)} svg.tree .node.new text{fill:#13111c}
svg.tree .node.del circle{fill:var(--swp);stroke:var(--swp)} svg.tree .node.del text{fill:#13111c}
svg.tree .node.order circle{fill:var(--vis);stroke:var(--vis)}
svg.tree .node .ord{font-size:10px;fill:var(--cmp)}
svg.tree line{stroke:var(--line-2);stroke-width:2}
.ds-ctrl input[type=number]{width:90px}

/* ---------- Learn / Compare ---------- */
.learn{display:flex;flex-direction:column;gap:12px}
.quiz .opt{display:block;width:100%;text-align:left;margin-top:8px;padding:12px 14px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line-2);cursor:pointer;font-weight:600}
.quiz .opt:hover{border-color:var(--piv)}
.quiz .opt.right{border-color:var(--srt);background:rgba(156,207,216,.14)} .quiz .opt.wrong{border-color:var(--swp);background:rgba(235,111,146,.14)}
.bar{height:8px;background:var(--panel-3);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--piv);width:0}
.score{font-family:var(--mono);font-size:2.4rem;font-weight:600;color:var(--cmp)}
.chart{position:relative}
.chart svg.plot{width:100%;height:auto;display:block}
.chart .tip{position:absolute;pointer-events:none;background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:.72rem;line-height:1.6;white-space:nowrap;box-shadow:0 10px 30px -10px rgba(0,0,0,.6);z-index:2}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;min-width:0}
.card h4{font-size:.95rem;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.card .meta{font-size:.72rem;color:var(--muted);font-family:var(--mono);margin-bottom:6px}
.card p{margin:0 0 6px;font-size:.84rem;color:var(--muted)}
.card p b{color:var(--ink)}
.card.hit{border-color:var(--cmp);box-shadow:0 0 0 3px rgba(246,193,119,.15)}
.term{border-bottom:1px solid var(--line);padding:10px 0}
.term:last-child{border-bottom:0}
.term b{display:block;font-size:.9rem}
.term span{font-size:.84rem;color:var(--muted)}
.term.hit{background:rgba(246,193,119,.08);border-radius:8px;padding:10px}
.alpha{display:flex;flex-wrap:wrap;gap:4px}
.alpha button{min-width:30px;min-height:30px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);font-size:.74rem;font-weight:700;cursor:pointer}
.alpha button.on{border-color:var(--piv);color:var(--piv)}

/* ---------- Settings ---------- */
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field .l{font-size:.86rem;font-weight:700}
.field .l small{display:block;font-weight:500;color:var(--muted);font-size:.76rem}
.field select,.field input[type=text]{min-width:150px}
.storage{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.78rem;font-family:var(--mono)}
.storage span:nth-child(even){text-align:right;color:var(--muted)}

/* ---------- Transport ---------- */
.transport{display:flex;align-items:center;gap:14px;padding:8px 16px;border-top:1px solid var(--line);background:var(--panel);position:sticky;bottom:0;z-index:20;flex-wrap:wrap}
.t-btns{display:flex;gap:6px}
.tb{width:40px;height:40px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);display:grid;place-items:center;cursor:pointer;font-size:1.05rem}
.tb.primary{background:var(--piv);color:#13111c;border-color:var(--piv);width:48px}
.tb[aria-pressed=true]{background:rgba(235,111,146,.18);border-color:var(--swp);color:var(--swp)}
.tb:disabled{opacity:.4;cursor:not-allowed;transform:none}
.t-scrub{flex:1;display:flex;align-items:center;gap:10px;min-width:180px}
.t-scrub input{flex:1;min-width:0}
.t-scrub span{font-family:var(--mono);font-size:.74rem;color:var(--muted);white-space:nowrap;min-width:9ch;text-align:right}
.t-slider{display:flex;align-items:center;gap:7px;font-size:.76rem;color:var(--muted);font-weight:700;white-space:nowrap}
.t-slider input{width:110px}
.t-slider span{font-family:var(--mono);color:var(--ink);min-width:4ch}
body[data-cat=learn] .transport,body[data-cat=learn] .codepane,body[data-cat=settings] .transport,body[data-cat=settings] .codepane,body[data-cat=bench] .transport,body[data-cat=bench] .codepane{display:none}
body[data-cat=learn] .work,body[data-cat=settings] .work,body[data-cat=bench] .work{grid-template-columns:minmax(0,1fr)}
body:not([data-cat=sorting]) #tRace,body:not([data-cat=sorting]):not([data-cat=path]) #tSizeWrap{display:none}

/* ---------- Drawer (inbox · saved runs · history) ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:100vw;background:var(--panel);border-left:1px solid var(--line-2);z-index:45;display:flex;flex-direction:column;animation:slideIn .3s var(--ease);box-shadow:-20px 0 60px -30px rgba(0,0,0,.8)}
.drawer[hidden]{display:none}
.drawer header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.drawer header h2{font-size:1rem;flex:1;display:flex;align-items:center;gap:8px}
.drawer .tabsrow{display:flex;gap:4px;padding:10px 14px 0}
.drawer .body{flex:1;overflow:auto;padding:10px 14px 14px}
.drawer footer{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.msg{display:flex;gap:10px;padding:10px;border-radius:10px;border:1px solid var(--line);margin-top:8px;background:var(--panel-2);cursor:pointer;position:relative}
.msg.unread{border-color:rgba(196,167,231,.5)}
.msg.unread::before{content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--piv)}
.msg .mi{width:34px;height:34px;border-radius:9px;background:var(--panel-3);display:grid;place-items:center;color:var(--piv);flex:none}
.msg .mi.ok{color:var(--srt)} .msg .mi.win{color:var(--cmp)} .msg .mi.bad{color:var(--swp)}
.msg .mt{font-weight:700;font-size:.86rem}
.msg .mb{font-size:.78rem;color:var(--muted);margin-top:2px}
.msg .md{font-size:.68rem;color:var(--dim);font-family:var(--mono);margin-top:4px}
.msg .x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:7px;border:0;background:none;color:var(--dim);cursor:pointer;display:grid;place-items:center}
.msg .x:hover{color:var(--swp);background:var(--panel-3)}
.msg input.name{background:none;border:0;border-bottom:1px dashed var(--line-2);color:var(--ink);font-weight:700;font-size:.86rem;padding:0;min-height:0;border-radius:0;width:100%}
.scrim{position:fixed;inset:0;background:rgba(5,4,10,.45);z-index:44;animation:fadeIn .2s}
.scrim[hidden]{display:none}

/* ---------- Tour ---------- */
.tour{position:fixed;inset:0;z-index:70}
.tour[hidden]{display:none}
.spot{position:absolute;border-radius:12px;box-shadow:0 0 0 9999px rgba(5,4,10,.7),0 0 0 3px var(--piv);transition:all .35s var(--ease);pointer-events:none}
.tour-card{position:absolute;width:320px;max-width:calc(100vw - 24px);background:var(--panel);border:1px solid var(--line-2);border-radius:14px;padding:16px;box-shadow:0 30px 80px -30px rgba(0,0,0,.9);animation:pop .3s var(--ease)}
.tour-card h3{font-size:1rem;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.tour-card p{margin:0 0 12px;font-size:.86rem;color:var(--muted)}
.tour-card .dots{display:flex;gap:5px;flex:1;align-items:center}
.tour-card .dots i{width:7px;height:7px;border-radius:50%;background:var(--panel-3)}
.tour-card .dots i.on{background:var(--piv)}
.tour-card .row{display:flex;gap:8px;align-items:center}

/* ---------- Modal / toasts / report ---------- */
.modal{position:fixed;inset:0;background:rgba(5,4,10,.6);display:grid;place-items:center;z-index:50;animation:fadeIn .2s;padding:16px}
.modal[hidden]{display:none}
.modal .box{background:var(--panel);border:1px solid var(--line-2);border-radius:16px;max-width:780px;width:100%;max-height:88vh;overflow:auto;padding:20px 22px;animation:pop .25s var(--ease);box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
.modal .box.wide{max-width:900px}
.modal h2{font-size:1.15rem;display:flex;align-items:center;gap:8px}
.modal .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.todo{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;background:var(--panel-2)}
.todo h4{font-size:.9rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.todo .tag{font-family:var(--mono);font-size:.64rem;padding:2px 6px;border-radius:5px;background:rgba(196,167,231,.15);color:var(--piv)}
.todo p{margin:4px 0 0;font-size:.82rem;color:var(--muted)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;font-size:.88rem}
.keys kbd{font-size:.8rem;padding:3px 8px}
.report{background:#fff;color:#111;border-radius:10px;padding:26px 30px;font-family:var(--font);line-height:1.4}
.report h1{font-size:1.4rem;margin-bottom:2px}
.report h2{font-size:1rem;margin:18px 0 6px;color:#333;border-bottom:1px solid #ddd;padding-bottom:4px}
.report .sub{color:#666;font-size:.82rem}
.report table{width:100%;border-collapse:collapse;font-size:.82rem}
.report th,.report td{text-align:left;padding:4px 6px;border-bottom:1px solid #e5e5e5;vertical-align:top}
.report td.n,.report th.n{text-align:right;font-family:var(--mono)}
.report .mono{font-family:var(--mono);font-size:.78rem;word-break:break-word;white-space:pre-wrap;background:#f6f6f6;padding:8px;border-radius:6px}
.report ol.code{color:#222;counter-reset:ln;padding:0;font-size:.78rem}
.report ol.code li{border-left:0;padding:0}
.report ol.code li::before{color:#999}
.report .kw{color:#7c3aed} .report .num{color:#b45309} .report .fn{color:#0e7490} .report .cm{color:#888}
.report svg{display:block;max-width:100%;height:auto;border:1px solid #e5e5e5;border-radius:6px}
.report .foot{margin-top:18px;font-size:.74rem;color:#777;border-top:1px solid #ddd;padding-top:8px}
.report .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:8px 0}
.report .kpi{border:1px solid #e5e5e5;border-radius:8px;padding:8px 10px}
.report .kpi .k{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:#777}
.report .kpi .v{font-family:var(--mono);font-size:1.1rem;font-weight:600}
#toasts{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;pointer-events:none}
.toast{background:var(--panel-3);color:var(--ink);border:1px solid var(--line-2);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.86rem;box-shadow:0 10px 30px -10px rgba(0,0,0,.7);animation:toastIn .3s var(--ease),toastOut .3s var(--ease) 2.8s forwards;display:flex;align-items:center;gap:8px}
.toast.ok{border-color:var(--srt);color:var(--srt)} .toast.bad{border-color:var(--swp);color:var(--swp)}

/* ---------- Responsive ---------- */
@media (min-width:901px){
  .app{height:100vh}
  .work{overflow:hidden}
  .stage{overflow:auto}
  .codepane{overflow:hidden}
  .cp-body{overflow:hidden}
  #searchBtn{display:none}
}
@media (max-width:1250px){.search input{width:130px}.tabs a span{display:none}.tabs a{padding:0 10px}.tabs a.active span{display:inline}}
@media (max-width:1100px){.work{grid-template-columns:minmax(0,1fr) 310px}}
@media (max-width:900px){
  .work{display:block}
  .topbar{gap:6px;padding:0 10px;height:auto;flex-wrap:wrap;padding-bottom:0}
  .brand{padding:8px 0;margin-right:auto} .brand small{display:none}
  .topbar .iconbtn{width:36px;height:36px}
  #saveBtn,#aboutBtn{display:none}
  .search{display:none;order:4;flex-basis:100%;margin:0 0 8px}
  .search.open{display:flex} .search input{width:100%;max-width:none;flex:1}
  .search kbd{display:none}
  .qres{left:0;right:auto;width:100%}
  .tabs{order:5;flex-basis:100%;margin-left:0;height:44px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tabs a{padding:0 10px;font-size:.8rem} .tabs a span{display:inline}
  .stage{padding:12px}
  .cv{min-height:300px;height:300px;flex:none}
  .race{grid-template-rows:none;grid-template-columns:1fr;flex:none}
  .race .cv{height:190px;min-height:190px}
  .two,.three{grid-template-columns:1fr}
  .codepane{border-left:0;border-top:1px solid var(--line)}
  .cp-toggle{display:flex;width:100%;align-items:center;gap:8px;padding:12px 14px;background:none;border:0;color:var(--ink);font-weight:800;cursor:pointer;text-align:left}
  .cp-toggle .ic:last-child{margin-left:auto;transition:transform .3s}
  .codepane.open .cp-toggle .ic:last-child{transform:rotate(180deg)}
  .codepane:not(.open) .cp-body{display:none}
  .code{max-height:260px}
  .transport{gap:8px 12px;padding:8px 10px}
  .t-scrub{order:3;flex-basis:100%}
  .t-slider input{width:80px}
  .ds-view{min-height:260px}
  .drawer{width:100vw}
  .settings{grid-template-columns:1fr}
  .field{flex-direction:column;align-items:flex-start}
  .field select,.field input[type=text]{width:100%}
}
@media print{
  body.report-open .app,body.report-open #toasts,body.report-open .drawer,body.report-open .scrim{display:none!important}
  body.report-open{background:#fff}
  #reportModal{position:static;display:block;background:none;padding:0}
  #reportModal .box{max-width:none;max-height:none;overflow:visible;border:0;box-shadow:none;padding:0;background:none}
  #reportModal .head,#reportModal .noprint{display:none}
  .report{border-radius:0;padding:0}
  .topbar,.transport,.codepane{display:none}
}
</style>

<script>
'use strict';
/* =====================================================================
   Algorithm Visualizer — single-file app
   Sections: utils · palette · state · player · code pane · transport
             inbox / library / history · sorting · pathfinding · graphs
             data structures · benchmark · learn · reports · settings
             search · tour · about · router · boot

   Extension pattern: an algorithm is a generator that yields step objects
   { type, i, j, line, note, … }. record() stores the steps in an array,
   the player applies / undoes them on a model, and the renderer draws
   the model — so scrubbing, stepping back and racing all come for free.
   Student extension points are marked with  TODO(student)
   ===================================================================== */

// ---------- utils ----------
const NS = 'algoviz:';
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

const store = {
  get(key, fallback) {
    try {
      const raw = localStorage.getItem(NS + key);
      return raw == null ? fallback : JSON.parse(raw);
    } catch {
      return fallback;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(NS + key, JSON.stringify(value));
    } catch {
      /* storage full or blocked — the app keeps working in memory */
    }
  },
  remove(key) {
    try {
      localStorage.removeItem(NS + key);
    } catch {
      /* ignore */
    }
  }
};

const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ESC_MAP[ch]);
const ic = (name, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const nf = value => Number(value).toLocaleString('en-US');
const clamp = (value, lo, hi) => Math.max(lo, Math.min(hi, value));
const uid = () => Math.random().toString(36).slice(2, 9);
const fmt1 = value => Number.isInteger(value) ? String(value) : value.toFixed(1);

function toast(message, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icon = type === 'bad' ? 'alert' : type === 'ok' ? 'check-circle' : 'info';
  el.innerHTML = ic(icon) + esc(message);
  $('#toasts').append(el);
  setTimeout(() => el.remove(), 3200);
}

// Deterministic PRNG (mulberry32) so a seed in the URL reproduces an input exactly.
function rng(seed) {
  return () => {
    seed |= 0;
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const newSeed = () => Math.floor(Math.random() * 9e5) + 1000;

function timeAgo(ts) {
  const diff = Math.max(0, Date.now() - ts);
  const minutes = Math.round(diff / 60000);
  if (minutes < 1) return 'just now';
  if (minutes < 60) return `${minutes} min ago`;
  const hours = Math.round(minutes / 60);
  if (hours < 24) return `${hours} h ago`;
  const days = Math.round(hours / 24);
  return days === 1 ? 'yesterday' : `${days} days ago`;
}

function downloadText(filename, text, mime = 'application/json') {
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 500);
}

// Motion kit helpers
function animateIn(root) {
  root.classList.remove('enter');
  void root.offsetWidth;
  root.classList.add('enter');
  $$('.stagger', root).forEach(group => {
    [...group.children].forEach((el, i) => el.style.setProperty('--i', i));
  });
}

function countUp(el, to, { dur = 700, fmt = v => nf(Math.round(v)) } = {}) {
  const t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(to * eased);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function drawPath(path) {
  const length = path.getTotalLength();
  path.style.strokeDasharray = length;
  path.style.strokeDashoffset = length;
  path.getBoundingClientRect();
  path.style.transition = 'stroke-dashoffset .9s var(--ease)';
  path.style.strokeDashoffset = 0;
}

// Size a canvas to its CSS box at device-pixel resolution and return a scaled context.
function fitCanvas(canvas) {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const width = Math.max(1, Math.round(rect.width * dpr));
  const height = Math.max(1, Math.round(rect.height * dpr));
  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, W: rect.width, H: rect.height };
}

// Binary min-heap keyed on a number — used by Dijkstra, A*, greedy and Prim.
class PQ {
  constructor() {
    this.h = [];
  }
  get size() {
    return this.h.length;
  }
  push(priority, value) {
    const h = this.h;
    h.push([priority, value]);
    let i = h.length - 1;
    while (i > 0) {
      const parent = (i - 1) >> 1;
      if (h[parent][0] <= h[i][0]) break;
      [h[parent], h[i]] = [h[i], h[parent]];
      i = parent;
    }
  }
  pop() {
    const h = this.h;
    const top = h[0];
    const last = h.pop();
    if (h.length) {
      h[0] = last;
      this.siftDown(0);
    }
    return top;
  }
  siftDown(i) {
    const h = this.h;
    for (;;) {
      const l = 2 * i + 1;
      const r = l + 1;
      let m = i;
      if (l < h.length && h[l][0] < h[m][0]) m = l;
      if (r < h.length && h[r][0] < h[m][0]) m = r;
      if (m === i) return;
      [h[m], h[i]] = [h[i], h[m]];
      i = m;
    }
  }
}

// ---------- palette (default · colour-blind safe) ----------
const PALETTES = {
  default: { cmp: '#f6c177', swp: '#eb6f92', srt: '#9ccfd8', piv: '#c4a7e7', vis: '#31748f', pth: '#f6c177', fro: '#9ccfd8' },
  colorblind: { cmp: '#e69f00', swp: '#56b4e9', srt: '#009e73', piv: '#cc79a7', vis: '#0072b2', pth: '#f0e442', fro: '#56b4e9' }
};
const COL = {
  bar: '#5b5775', wall: '#443e60', mud: '#4d3d30', ink: '#e0def4', muted: '#908caa',
  panel: '#1b1826', panel2: '#221e30', line: '#2a2640', ...PALETTES.default
};

function applyPalette(name) {
  const pal = PALETTES[name] || PALETTES.default;
  Object.assign(COL, pal);
  for (const [key, value] of Object.entries(pal)) {
    document.documentElement.style.setProperty('--' + key, value);
  }
}

// ---------- app state ----------
const DEFAULTS = {
  cat: 'sorting',
  speed: 5,
  sort: { algo: 'quick', algoB: 'merge', size: 40, dist: 'random', seed: 4242, custom: '12, 5, 31, 8, 20, 3, 27, 15', race: false, focus: 0 },
  pf: { algo: 'astar', h: 'manhattan', diag: false, tool: 'wall', size: 1, seed: 77, maze: 'division' },
  gr: { algo: 'dijkstra', preset: 'weighted', mode: 'edge', src: 0, w: 4 },
  ds: { tab: 'stack' },
  learn: { tab: 'table', letter: '' },
  bench: { dist: 'random', sizes: '16,32,64,128,256', algos: 'bubble,insertion,selection,merge,quick,heap,counting,radix', metric: 'cmp' },
  prefs: { labels: 'auto', palette: 'default', motion: 'auto', announce: false, hints: true, text: 'normal', codeSize: 'normal', autoplay: false, runToasts: true },
  seen: {}
};

function loadState() {
  const saved = store.get('settings', {});
  const state = {};
  for (const [key, value] of Object.entries(DEFAULTS)) {
    if (value && typeof value === 'object') {
      state[key] = { ...value, ...(saved[key] || {}) };
    } else {
      state[key] = saved[key] ?? value;
    }
  }
  return state;
}
const S = loadState();

function saveS() {
  const snapshot = { ...S, pf: { ...S.pf } };
  store.set('settings', snapshot);
}

// ---------- generic player: records generator steps, applies / undoes them on a model ----------
const SPS = [1, 2, 4, 8, 15, 30, 60, 120, 250, 500];
const sps = () => SPS[clamp(S.speed, 1, 10) - 1];
const STEP_CAP = 150000;

function record(gen, cap = STEP_CAP) {
  const steps = [];
  for (const step of gen) {
    steps.push(step);
    if (steps.length >= cap) {
      steps.push({ type: 'done', line: -1, note: 'Step limit reached — recording truncated' });
      break;
    }
  }
  return steps;
}

const P = {
  tracks: [],
  idx: 0,
  playing: false,
  raf: 0,
  acc: 0,
  last: 0,
  onDone: null,
  onRender: null,

  load(tracks, onRender, onDone) {
    this.pause();
    this.tracks = tracks;
    this.onRender = onRender;
    this.onDone = onDone;
    this.idx = 0;
    tracks.forEach(track => { track.pos = 0; });
    this.render();
  },

  total() {
    if (!this.tracks.length) return 0;
    return Math.max(...this.tracks.map(track => track.steps.length));
  },

  // Move every track to step index i by applying or undoing steps.
  seek(i) {
    i = clamp(i, 0, this.total());
    for (const track of this.tracks) {
      const target = Math.min(i, track.steps.length);
      while (track.pos < target) track.apply(track.model, track.steps[track.pos++]);
      while (track.pos > target) track.undo(track.model, track.steps[--track.pos]);
    }
    this.idx = i;
    this.render();
  },

  cur(track) {
    return track.steps[track.pos - 1] || null;
  },

  render() {
    if (this.onRender) this.onRender();
    updateTransport();
  },

  play() {
    if (this.playing || !this.tracks.length) return;
    if (this.idx >= this.total()) this.seek(0);
    this.playing = true;
    this.last = performance.now();
    this.acc = 0;
    this.raf = requestAnimationFrame(ts => this.loop(ts));
    updateTransport();
  },

  pause() {
    this.playing = false;
    cancelAnimationFrame(this.raf);
    updateTransport();
  },

  toggle() {
    if (this.playing) this.pause();
    else this.play();
  },

  step(delta) {
    this.pause();
    this.seek(this.idx + delta);
  },

  // rAF loop: advance by (elapsed seconds × steps per second), rendering once per frame.
  loop(ts) {
    if (!this.playing) return;
    const dt = Math.min(.1, (ts - this.last) / 1000);
    this.last = ts;
    this.acc += dt * sps();
    const n = Math.floor(this.acc);
    if (n > 0) {
      this.acc -= n;
      this.seek(this.idx + n);
    }
    if (this.idx >= this.total()) {
      this.pause();
      if (this.onDone) this.onDone();
    } else {
      this.raf = requestAnimationFrame(t => this.loop(t));
    }
  }
};

// ---------- code pane ----------
const KEYWORDS = /\b(for|while|if|else|return|in|and|or|not|break|continue|skip|output|mark|swap|push|pop|shift|add|popMin|reconstruct|copy|sort|union|find|dfs|BFS|queue|stack|pq|open)\b/g;

function hlLine(source) {
  let text = esc(source);
  let comment = '';
  const commentAt = text.indexOf('//');
  if (commentAt >= 0) {
    comment = `<span class="cm">${text.slice(commentAt)}</span>`;
    text = text.slice(0, commentAt);
  }
  text = text.replace(/\b(\d+(\.\d+)?)\b/g, '<span class="num">$1</span>');
  text = text.replace(KEYWORDS, '<span class="kw">$1</span>');
  text = text.replace(/\b([a-zA-Z_]\w*)(?=\()/g, '<span class="fn">$1</span>');
  return text + comment;
}

let codeKey = '';
let lastAnnounce = 0;

function announce(text) {
  if (!S.prefs.announce || !text) return;
  const now = performance.now();
  if (now - lastAnnounce < 400) return;
  lastAnnounce = now;
  $('#live').textContent = text;
}

function showCode({ title = '', sub = '', badges = [], code = [], line = -1, note = '', noteKind = '', stats = [] }) {
  $('#cpTitle').innerHTML = ic('code') + esc(title);
  $('#cpSub').textContent = sub;
  $('#cpBadges').innerHTML = badges.map(badgeHtml).join('');

  const key = title + '|' + code.join('\n');
  if (key !== codeKey) {
    codeKey = key;
    $('#cpCode').innerHTML = code.map(l => `<li><span class="src">${hlLine(l)}</span></li>`).join('');
  }
  $$('#cpCode li').forEach((li, i) => li.classList.toggle('on', i === line));
  keepLineVisible();

  const noteEl = $('#cpNote');
  noteEl.textContent = note || 'Press play or step forward to begin.';
  noteEl.className = 'cp-note ' + noteKind;
  announce(note);
  $('#cpStats').innerHTML = stats.map(statHtml).join('');
}

function badgeHtml(badge) {
  const body = badge.k ? `${esc(badge.k)} <b>${esc(badge.v)}</b>` : esc(badge.v);
  return `<span class="badge ${badge.cls || ''}">${body}</span>`;
}

function statHtml(stat) {
  return `<div class="stat ${stat.cls || ''}"><div class="k">${esc(stat.k)}</div><div class="v">${esc(stat.v)}</div></div>`;
}

function keepLineVisible() {
  const on = $('#cpCode li.on');
  const box = $('#cpCode');
  if (!on) return;
  const above = on.offsetTop < box.scrollTop;
  const below = on.offsetTop + on.offsetHeight > box.scrollTop + box.clientHeight;
  if (above || below) box.scrollTop = on.offsetTop - box.clientHeight / 2;
}

const NOTE_KINDS = {
  compare: '', swap: 'swap', set: 'swap', sorted: 'sorted', pivot: 'pivot', visit: 'visit', frontier: 'visit',
  path: 'path', done: 'sorted', edge: 'pivot', dist: 'visit', uf: 'pivot', order: 'sorted', comp: 'sorted', range: 'pivot'
};
const kindOf = type => NOTE_KINDS[type] || '';

// ---------- transport ----------
const PLAYER_CATS = ['sorting', 'path', 'graph'];

function updateTransport() {
  const total = P.total();
  const playing = S.cat === 'ds' ? mini.playing : P.playing;
  const scrub = $('#tScrub');
  scrub.max = total;
  scrub.value = P.idx;
  $('#tStep').textContent = `${nf(P.idx)} / ${nf(total)}`;

  $('#tPlay').innerHTML = ic(playing ? 'pause' : 'play');
  $('#tPlay').setAttribute('aria-label', playing ? 'Pause' : 'Play');
  $('#tSpeedV').textContent = sps() + '/s';
  $('#tSpeed').value = S.speed;
  $('#tRace').setAttribute('aria-pressed', String(!!S.sort.race));

  const hasTracks = P.tracks.length > 0 && PLAYER_CATS.includes(S.cat);
  $('#tBack').disabled = !hasTracks;
  $('#tScrub').disabled = !hasTracks;
  $('#tFwd').disabled = !hasTracks && S.cat !== 'ds';
  $('#tShuffle').disabled = S.cat === 'graph';
  $('#tPrint').disabled = !hasTracks;
  updateSizeSlider();
}

function updateSizeSlider() {
  const slider = $('#tSize');
  if (S.cat === 'sorting') {
    slider.min = 10;
    slider.max = 200;
    slider.value = S.sort.size;
    $('#tSizeV').textContent = S.sort.size;
  } else if (S.cat === 'path') {
    slider.min = 0;
    slider.max = 3;
    slider.value = S.pf.size;
    const dims = gridDims(S.pf.size);
    $('#tSizeV').textContent = `${dims.rows}×${dims.cols}`;
  }
}

function bindTransport() {
  $('#tPlay').onclick = () => (S.cat === 'ds' ? mini.toggle() : P.toggle());
  $('#tBack').onclick = () => P.step(-1);
  $('#tFwd').onclick = () => (S.cat === 'ds' ? mini.stepOnce() : P.step(1));
  $('#tReset').onclick = resetCurrent;
  $('#tShuffle').onclick = shuffleCurrent;
  $('#tPrint').onclick = () => openReport();
  $('#tRace').onclick = () => {
    S.sort.race = !S.sort.race;
    saveS();
    renderSorting();
    if (S.sort.race) unlock('race', 'Head to head', 'You started your first race.');
  };
  $('#tScrub').addEventListener('input', e => {
    P.pause();
    P.seek(+e.target.value);
  });
  $('#tSpeed').addEventListener('input', e => {
    S.speed = +e.target.value;
    saveS();
    updateTransport();
    if (S.speed === 10) unlock('speed', 'Speed demon', 'You ran a lab at 500 steps per second.');
  });
  $('#tSize').addEventListener('input', e => previewSize(+e.target.value));
  $('#tSize').addEventListener('change', e => commitSize(+e.target.value));
}

function previewSize(value) {
  if (S.cat === 'sorting') {
    $('#tSizeV').textContent = value;
  } else if (S.cat === 'path') {
    const dims = gridDims(value);
    $('#tSizeV').textContent = `${dims.rows}×${dims.cols}`;
  }
}

function commitSize(value) {
  if (S.cat === 'sorting') {
    S.sort.size = value;
    if (S.sort.dist === 'custom') S.sort.dist = 'random';
    saveS();
    renderSorting();
  } else if (S.cat === 'path') {
    S.pf.size = value;
    saveS();
    buildGrid(true);
    renderPath();
  }
}

function resetCurrent() {
  if (S.cat === 'ds') {
    mini.stop();
    dsReset(false);
    return;
  }
  P.pause();
  P.seek(0);
}

function shuffleCurrent() {
  if (S.cat === 'sorting') {
    S.sort.seed = newSeed();
    if (S.sort.dist === 'custom') S.sort.dist = 'random';
    saveS();
    renderSorting();
    toast('New input generated');
  } else if (S.cat === 'path') {
    S.pf.seed = newSeed();
    saveS();
    buildGrid(true);
    renderPath();
    toast('New maze generated');
  } else if (S.cat === 'ds') {
    dsReset(true);
  }
}

/* =====================================================================
   SORTING — every algorithm is a generator over a working copy `a`.
   Step types: compare(i,j) · swap(i,j) · set(i,v) · visit(i) · pivot(i) · range(lo,hi) · sorted(i | lo,hi)
   ===================================================================== */
function* bubbleSort(a) {
  const n = a.length;
  for (let i = 0; i < n; i++) {
    let swapped = false;
    for (let j = 0; j < n - i - 1; j++) {
      yield { type: 'compare', i: j, j: j + 1, line: 3, note: `Compare ${a[j]} and ${a[j + 1]}` };
      if (a[j] > a[j + 1]) {
        [a[j], a[j + 1]] = [a[j + 1], a[j]];
        swapped = true;
        yield { type: 'swap', i: j, j: j + 1, line: 4, note: `${a[j + 1]} > ${a[j]} → swap them` };
      }
    }
    yield { type: 'sorted', i: n - 1 - i, line: 6, note: `${a[n - 1 - i]} bubbled to its final place` };
    if (!swapped) {
      yield { type: 'sorted', lo: 0, hi: n - 1 - i, line: 6, note: 'No swaps in this pass — the rest is already sorted' };
      break;
    }
  }
}

function* insertionSort(a) {
  const n = a.length;
  yield { type: 'sorted', i: 0, line: 0, note: 'A single element is trivially sorted' };
  for (let i = 1; i < n; i++) {
    const key = a[i];
    let j = i - 1;
    yield { type: 'pivot', i, line: 1, note: `Take key ${key} out of position ${i}` };
    while (j >= 0) {
      yield { type: 'compare', i: j, j: j + 1, line: 2, note: `Is ${a[j]} > key ${key}?` };
      if (a[j] <= key) break;
      a[j + 1] = a[j];
      yield { type: 'set', i: j + 1, v: a[j], line: 3, note: `Shift ${a[j]} one place right` };
      j--;
    }
    a[j + 1] = key;
    yield { type: 'set', i: j + 1, v: key, line: 4, note: `Drop key ${key} into position ${j + 1}` };
    yield { type: 'sorted', lo: 0, hi: i, line: 4, note: `Prefix 0..${i} is sorted` };
  }
}

function* selectionSort(a) {
  const n = a.length;
  for (let i = 0; i < n - 1; i++) {
    let m = i;
    yield { type: 'pivot', i: m, line: 1, note: `Assume ${a[m]} is the minimum of the rest` };
    for (let j = i + 1; j < n; j++) {
      yield { type: 'compare', i: j, j: m, line: 3, note: `Compare ${a[j]} with current min ${a[m]}` };
      if (a[j] < a[m]) {
        m = j;
        yield { type: 'pivot', i: m, line: 3, note: `New minimum ${a[m]}` };
      }
    }
    if (m !== i) {
      [a[i], a[m]] = [a[m], a[i]];
      yield { type: 'swap', i, j: m, line: 4, note: `Swap min ${a[i]} into position ${i}` };
    }
    yield { type: 'sorted', i, line: 4, note: `${a[i]} is final` };
  }
  yield { type: 'sorted', i: n - 1, line: 4, note: 'Last element is in place' };
}

function* mergeSort(a) {
  function* merge(lo, mid, hi) {
    const aux = a.slice(lo, hi + 1);
    const L = mid - lo;
    const R = hi - lo;
    let i = 0;
    let j = L + 1;
    for (let k = lo; k <= hi; k++) {
      if (i <= L && j <= R) {
        yield { type: 'compare', i: lo + i, j: lo + j, line: 6, note: `Compare ${aux[i]} and ${aux[j]}` };
      }
      const takeLeft = j > R || (i <= L && aux[i] <= aux[j]);
      if (takeLeft) {
        a[k] = aux[i++];
        yield { type: 'set', i: k, v: a[k], line: 6, note: `Write ${a[k]} from the left run` };
      } else {
        a[k] = aux[j++];
        yield { type: 'set', i: k, v: a[k], line: 7, note: `Write ${a[k]} from the right run` };
      }
    }
  }
  function* sort(lo, hi) {
    if (lo >= hi) {
      yield { type: 'range', lo, hi, line: 1, note: `Single element ${a[lo]} — nothing to do` };
      return;
    }
    const mid = (lo + hi) >> 1;
    yield { type: 'range', lo, hi, line: 2, note: `Split ${lo}..${hi} at ${mid}` };
    yield* sort(lo, mid);
    yield* sort(mid + 1, hi);
    yield { type: 'range', lo, hi, line: 4, note: `Merge ${lo}..${mid} with ${mid + 1}..${hi}` };
    yield* merge(lo, mid, hi);
  }
  yield* sort(0, a.length - 1);
  yield { type: 'sorted', lo: 0, hi: a.length - 1, line: 0, note: 'Final merge complete' };
}

function* quickSort(a) {
  function* partition(lo, hi) {
    const pivot = a[hi];
    yield { type: 'range', lo, hi, line: 2, note: `Partition ${lo}..${hi}` };
    yield { type: 'pivot', i: hi, line: 2, note: `Pivot = ${pivot} (last element)` };
    let i = lo;
    for (let j = lo; j < hi; j++) {
      yield { type: 'compare', i: j, j: hi, line: 4, note: `Is ${a[j]} < pivot ${pivot}?` };
      if (a[j] < pivot) {
        if (i !== j) {
          [a[i], a[j]] = [a[j], a[i]];
          yield { type: 'swap', i, j, line: 5, note: `${a[i]} < ${pivot} → move it to the left part` };
        }
        i++;
      }
    }
    if (i !== hi) {
      [a[i], a[hi]] = [a[hi], a[i]];
      yield { type: 'swap', i, j: hi, line: 6, note: `Place pivot ${pivot} at index ${i}` };
    }
    yield { type: 'sorted', i, line: 6, note: `Pivot ${pivot} is final at ${i}` };
    return i;
  }
  function* sort(lo, hi) {
    if (lo > hi) return;
    if (lo === hi) {
      yield { type: 'sorted', i: lo, line: 1, note: `${a[lo]} alone — already in place` };
      return;
    }
    const p = yield* partition(lo, hi);
    yield* sort(lo, p - 1);
    yield* sort(p + 1, hi);
  }
  yield* sort(0, a.length - 1);
}

function* heapSort(a) {
  const n = a.length;
  function* siftDown(i, size) {
    while (2 * i + 1 < size) {
      let child = 2 * i + 1;
      if (child + 1 < size) {
        yield { type: 'compare', i: child, j: child + 1, line: 6, note: `Larger child: ${a[child]} or ${a[child + 1]}?` };
        if (a[child + 1] > a[child]) child++;
      }
      yield { type: 'compare', i, j: child, line: 7, note: `Parent ${a[i]} vs child ${a[child]}` };
      if (a[i] >= a[child]) return;
      [a[i], a[child]] = [a[child], a[i]];
      yield { type: 'swap', i, j: child, line: 8, note: `Sift ${a[child]} down` };
      i = child;
    }
  }
  for (let i = (n >> 1) - 1; i >= 0; i--) {
    yield { type: 'range', lo: 0, hi: n - 1, line: 0, note: `Heapify subtree rooted at ${i}` };
    yield* siftDown(i, n);
  }
  for (let end = n - 1; end > 0; end--) {
    [a[0], a[end]] = [a[end], a[0]];
    yield { type: 'swap', i: 0, j: end, line: 2, note: `Move max ${a[end]} to position ${end}` };
    yield { type: 'sorted', i: end, line: 2, note: `${a[end]} is final` };
    yield { type: 'range', lo: 0, hi: end - 1, line: 3, note: `Restore the heap on 0..${end - 1}` };
    yield* siftDown(0, end);
  }
  yield { type: 'sorted', i: 0, line: 3, note: 'Heap exhausted — sorted' };
}

function* countingSort(a) {
  const n = a.length;
  const k = Math.max(...a);
  const count = new Array(k + 1).fill(0);
  for (let i = 0; i < n; i++) {
    count[a[i]]++;
    yield { type: 'visit', i, line: 1, note: `count[${a[i]}] = ${count[a[i]]}` };
  }
  for (let v = 1; v <= k; v++) count[v] += count[v - 1];
  yield { type: 'range', lo: 0, hi: n - 1, line: 2, note: `Prefix sums over ${k + 1} buckets` };
  const out = new Array(n);
  for (let i = n - 1; i >= 0; i--) {
    out[--count[a[i]]] = a[i];
    yield { type: 'visit', i, line: 4, note: `${a[i]} goes to output slot ${count[a[i]]}` };
  }
  for (let i = 0; i < n; i++) {
    a[i] = out[i];
    yield { type: 'set', i, v: out[i], line: 5, note: `a[${i}] = ${out[i]}` };
  }
  yield { type: 'sorted', lo: 0, hi: n - 1, line: 5, note: 'Copied back — zero comparisons used' };
}

function* radixSort(a) {
  const n = a.length;
  const max = Math.max(...a);
  const passName = exp => (exp === 1 ? 'ones' : exp === 10 ? 'tens' : 'hundreds');
  for (let exp = 1; Math.floor(max / exp) > 0; exp *= 10) {
    const digit = v => Math.floor(v / exp) % 10;
    const count = new Array(10).fill(0);
    yield { type: 'range', lo: 0, hi: n - 1, line: 0, note: `Pass on the ${passName(exp)} digit` };
    for (let i = 0; i < n; i++) {
      count[digit(a[i])]++;
      yield { type: 'visit', i, line: 2, note: `digit of ${a[i]} is ${digit(a[i])}` };
    }
    for (let v = 1; v < 10; v++) count[v] += count[v - 1];
    const out = new Array(n);
    for (let i = n - 1; i >= 0; i--) out[--count[digit(a[i])]] = a[i];
    for (let i = 0; i < n; i++) {
      a[i] = out[i];
      yield { type: 'set', i, v: out[i], line: 5, note: `a[${i}] = ${out[i]} (bucket ${digit(out[i])})` };
    }
  }
  yield { type: 'sorted', lo: 0, hi: n - 1, line: 5, note: 'All digit passes done' };
}

// cx = [best, average, worst, space, stable]
const SORTS = {
  bubble: {
    name: 'Bubble sort', cx: ['n', 'n²', 'n²', '1', true], run: bubbleSort,
    code: ['for i in 0 .. n-1:', '  swapped = false', '  for j in 0 .. n-i-2:', '    if a[j] > a[j+1]:', '      swap(a[j], a[j+1])', '      swapped = true', '  if not swapped: break   // already sorted']
  },
  insertion: {
    name: 'Insertion sort', cx: ['n', 'n²', 'n²', '1', true], run: insertionSort,
    code: ['for i in 1 .. n-1:', '  key = a[i]; j = i - 1', '  while j ≥ 0 and a[j] > key:', '    a[j+1] = a[j]; j = j - 1   // shift right', '  a[j+1] = key']
  },
  selection: {
    name: 'Selection sort', cx: ['n²', 'n²', 'n²', '1', false], run: selectionSort,
    code: ['for i in 0 .. n-2:', '  min = i', '  for j in i+1 .. n-1:', '    if a[j] < a[min]: min = j', '  swap(a[i], a[min])']
  },
  merge: {
    name: 'Merge sort', cx: ['n log n', 'n log n', 'n log n', 'n', true], run: mergeSort,
    code: ['mergeSort(lo, hi):', '  if lo ≥ hi: return', '  mid = (lo + hi) / 2', '  mergeSort(lo, mid); mergeSort(mid+1, hi)', '  aux = copy of a[lo..hi]; i = lo; j = mid+1', '  for k in lo .. hi:', '    if aux[i] ≤ aux[j]: a[k] = aux[i]; i++', '    else: a[k] = aux[j]; j++']
  },
  quick: {
    name: 'Quick sort (Lomuto)', cx: ['n log n', 'n log n', 'n²', 'log n', false], run: quickSort,
    code: ['quickSort(lo, hi):', '  if lo ≥ hi: return   // 0 or 1 element', '  pivot = a[hi]; i = lo', '  for j in lo .. hi-1:', '    if a[j] < pivot:', '      swap(a[i], a[j]); i = i + 1', '  swap(a[i], a[hi])   // pivot lands at i', '  quickSort(lo, i-1); quickSort(i+1, hi)']
  },
  heap: {
    name: 'Heap sort', cx: ['n log n', 'n log n', 'n log n', '1', false], run: heapSort,
    code: ['for i in n/2-1 .. 0: siftDown(i, n)   // build max-heap', 'for end in n-1 .. 1:', '  swap(a[0], a[end])   // largest to the back', '  siftDown(0, end)', 'siftDown(i, size):', '  while 2i+1 < size:', '    c = larger of the two children', '    if a[i] ≥ a[c]: return', '    swap(a[i], a[c]); i = c']
  },
  counting: {
    name: 'Counting sort', cx: ['n + k', 'n + k', 'n + k', 'n + k', true], run: countingSort,
    code: ['k = max(a)', 'count[v] += 1 for every v in a', 'count[v] += count[v-1]   // prefix sums', 'for i in n-1 .. 0:', '  out[count[a[i]] - 1] = a[i]; count[a[i]] -= 1', 'copy out back into a']
  },
  radix: {
    name: 'Radix sort (LSD, base 10)', cx: ['n·d', 'n·d', 'n·d', 'n + 10', true], run: radixSort,
    code: ['for exp in 1, 10, 100 … while max / exp ≥ 1:', '  digit(v) = (v / exp) mod 10', '  count[digit(a[i])] += 1 for every i', '  prefix sums over the 10 buckets', '  for i in n-1 .. 0: out[--count[digit(a[i])]] = a[i]', '  copy out back into a   // stable per digit']
  }
};
