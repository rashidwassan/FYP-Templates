<style>
/* ---------- tokens: repair bench — graphite and steel, electric cyan for live tests, solder copper ---------- */

  --fail: #ff6b6b;

  --radius-sm: 9px;
  --font: "Rethink Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Azeret Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

/* ---------- motion kit ---------- */
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
html.calm *, html.calm *::before, html.calm *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
@keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
@keyframes scan { from { transform: translateY(-100%); } to { transform: translateY(100%); } }
@keyframes spin { to { transform: rotate(360deg); } }
.enter { animation: fadeUp var(--dur) var(--ease) both; }
.stagger > * { animation: fadeUp .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
.btn { transition: transform .15s var(--ease), box-shadow .15s var(--ease), background .15s, border-color .15s; }

.card, .tile { transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s; }
.card.hov:hover, .tile:hover { transform: translateY(-2px); }
.fill, .bar > i { transition: width .6s var(--ease); }
.skeleton { background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { font-size: var(--fs); -webkit-text-size-adjust: 100%; }
body {

.muted { color: var(--muted); }
.small { font-size: .86rem; }
.tiny { font-size: .75rem; }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 14px; }
.mt { margin-top: 14px; }
.mt-s { margin-top: 8px; }
.mb { margin-bottom: 14px; }
.nowrap { white-space: nowrap; }
.ltr { direction: ltr; unicode-bidi: isolate; }
.c-pass { color: var(--pass); }
.c-fail { color: var(--fail); }
.c-warn { color: var(--warn); }
.c-cyan { color: var(--cyan); }
.c-copper { color: var(--copper); }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; border-radius: 6px; }
.skiplink { position: absolute; inset-inline-start: 12px; top: -60px; z-index: 90; }
.skiplink:focus { top: 10px; }
html[dir="rtl"] .flip { transform: scaleX(-1); }

/* ---------- icons ---------- */
.ic { width: 1.1em; height: 1.1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; flex: none; }
.ic.lg { width: 1.5em; height: 1.5em; }
.ic.xl { width: 2.2em; height: 2.2em; }

/* ---------- shell: rail (desktop), top bar, view, bottom tabs (phone) ---------- */
.app { min-height: 100vh; }
.rail {
  position: fixed;
  inset-block: 0;
  inset-inline-start: 0;
  width: var(--rail-w);
  background: var(--bg-2);
  border-inline-end: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  z-index: 30;
}
.brand { display: flex; align-items: center; gap: 11px; padding: 16px 18px 12px; color: var(--ink); text-decoration: none; }
.brand .mark { width: 38px; height: 38px; flex: none; }
.brand b { display: block; font-size: 1.12rem; font-weight: 800; letter-spacing: -.01em; }
.brand small { display: block; color: var(--muted); font-size: .74rem; line-height: 1.3; }
html[lang="ur"] .brand small { line-height: 1.9; }
.rnav { flex: 1; overflow-y: auto; padding: 4px 10px 12px; }
.rnav .grp { font-size: .7rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); padding: 14px 10px 5px; }
html[lang="ur"] .rnav .grp { letter-spacing: 0; font-size: .78rem; }
.rnav a {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 8px 10px;
  border-radius: 10px;
  color: var(--ink-2);
  text-decoration: none;
  font-weight: 560;
  position: relative;
  transition: background .15s, color .15s;
}
.rnav a:hover { background: var(--surface-2); color: var(--ink); }
.rnav a.on { background: var(--copper-soft); color: var(--ink); }
.rnav a.on::before { content: ""; position: absolute; inset-inline-start: -10px; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: var(--copper); }

.rail-foot { padding: 12px 16px 16px; border-top: 1px solid var(--line); font-size: .74rem; color: var(--muted); }
.rail-foot .dut { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; color: var(--ink-2); font-size: .8rem; }
.main { margin-inline-start: var(--rail-w); min-height: 100vh; display: flex; flex-direction: column; }
.top {
  position: sticky;
  top: 0;
  z-index: 25;
  height: var(--top-h);
  display: flex;
  align-items: center;
  gap: 12px;

.top .title { flex: 1; min-width: 0; }
.top h1 { font-size: 1.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { display: flex; gap: 6px; align-items: center; }
.tbtn {
  height: 40px;
  min-width: 40px;
  border-radius: 11px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);

  justify-content: center;

  cursor: pointer;
  position: relative;
}

.tbtn.lang { font-weight: 700; font-size: .86rem; }
.tbtn .badge { position: absolute; top: -5px; inset-inline-end: -5px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--copper); color: var(--copper-ink); font: 700 .66rem/18px var(--mono); padding: 0 4px; }
#view { flex: 1; padding: 22px 26px 60px; max-width: 1320px; width: 100%; outline: none; }
.tabs { display: none; }
#banner:empty { display: none; }
.strip { display: flex; align-items: center; gap: 10px; padding: 9px 22px; background: var(--cyan-soft); border-bottom: 1px solid var(--line); font-size: .88rem; }

/* ---------- page heading ---------- */
.phead { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.phead h2 { font-size: 1.6rem; }
.phead p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.eyebrow { font: 600 .72rem var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--copper); display: flex; gap: 8px; align-items: center; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 42px;
  padding: 0 16px;
  border-radius: 11px;
  border: 1px solid transparent;
  background: var(--copper);
  color: var(--copper-ink);
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
}
.btn:hover { box-shadow: 0 8px 18px -10px var(--copper); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: .88rem; border-radius: 10px; }
.btn.xs { min-height: 30px; padding: 0 9px; font-size: .8rem; border-radius: 8px; gap: 5px; }
.btn.lg { min-height: 52px; padding: 0 24px; font-size: 1.05rem; border-radius: 14px; }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--line-2); box-shadow: none; }
.btn.live { background: var(--cyan-soft); color: var(--cyan); border-color: color-mix(in srgb, var(--cyan) 45%, transparent); }
.btn.live:hover { box-shadow: 0 0 0 3px var(--cyan-soft); }
.btn.pass { background: var(--pass); color: #04170c; }
.btn.fail { background: var(--fail); color: #200404; }
.btn.danger { background: var(--fail-soft); color: var(--fail); border-color: color-mix(in srgb, var(--fail) 40%, transparent); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
html[data-theme="workshop"] .btn.pass { color: #fff; }
html[data-theme="workshop"] .btn.fail { color: #fff; }
.ibtn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
.ibtn:hover { color: var(--ink); border-color: var(--line-2); }
.ibtn.sm { width: 32px; height: 32px; border-radius: 8px; }

/* ---------- cards, tiles, chips ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card > h3, .card .ch { font-size: 1.02rem; display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
.card > h3 .ic, .card .ch .ic { color: var(--copper); }
.card.flat { box-shadow: none; }
.card.inset { background: var(--surface-2); box-shadow: none; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.cols { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: start; }
.cols.half { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .k { font-size: .78rem; color: var(--muted); display: flex; align-items: center; gap: 7px; }
.tile .k .ic { color: var(--copper); }
.tile .v { font: 600 1.55rem var(--mono); letter-spacing: -.03em; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .s { font-size: .78rem; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: .76rem; font-weight: 650; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
html[lang="ur"] .chip { line-height: 1.9; }
.chip.pass { background: var(--pass-soft); color: var(--pass); border-color: transparent; }
.chip.fail { background: var(--fail-soft); color: var(--fail); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.cyan { background: var(--cyan-soft); color: var(--cyan); border-color: transparent; }
.chip.copper { background: var(--copper-soft); color: var(--copper); border-color: transparent; }
.chip.skip { color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--skip); display: inline-block; flex: none; }
.dot.pass { background: var(--pass); }
.dot.fail { background: var(--fail); }
.dot.warn { background: var(--warn); }
.dot.live { background: var(--cyan); animation: pulse 1.2s infinite; }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 11px 13px; border-radius: 11px; background: var(--cyan-soft); color: var(--ink-2); font-size: .88rem; border: 1px solid color-mix(in srgb, var(--cyan) 22%, transparent); }
.notice > .ic { color: var(--cyan); margin-top: 3px; }
.notice.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.notice.warn > .ic { color: var(--warn); }
.notice.fail { background: var(--fail-soft); border-color: color-mix(in srgb, var(--fail) 30%, transparent); }
.notice.fail > .ic { color: var(--fail); }
.notice.copper { background: var(--copper-soft); border-color: color-mix(in srgb, var(--copper) 30%, transparent); }
.notice.copper > .ic { color: var(--copper); }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; }
.empty .ic { width: 2.4em; height: 2.4em; color: var(--line-2); display: block; margin: 0 auto 8px; }
.bar { height: 8px; border-radius: 9px; background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--copper); }
.bar.cyan > i { background: var(--cyan); }
.bar.pass > i { background: var(--pass); }
.bar.fail > i { background: var(--fail); }
.bar.warn > i { background: var(--warn); }
.kbd { display: inline-block; min-width: 26px; text-align: center; padding: 2px 7px; border-radius: 7px; border: 1px solid var(--line-2); border-bottom-width: 2px; background: var(--surface-2); font-size: .8rem; }
.ring .track { fill: none; stroke: var(--surface-3); stroke-width: 9; }
.ring .val { fill: none; stroke: var(--copper); stroke-width: 9; stroke-linecap: round; transform: rotate(-90deg); transform-origin: center; transition: stroke-dashoffset .8s var(--ease); }
.ring.cyan .val { stroke: var(--cyan); }
.ring.pass .val { stroke: var(--pass); }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: .82rem; font-weight: 650; color: var(--ink-2); }
.field small { color: var(--muted); font-size: .76rem; }
.inp, .field input, .field select, .field textarea {
  width: 100%;
  min-height: 42px;
  padding: 9px 12px;
  border-radius: 10px;
  border: 1px solid var(--line-2);
  background: var(--surface-2);
  color: var(--ink);
  outline: none;
}
.field textarea { min-height: 84px; resize: vertical; }
.inp:focus, .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px var(--cyan-soft); }
.field.bad input, .field.bad select { border-color: var(--fail); }
.field .err { color: var(--fail); font-size: .78rem; }
.fgrid { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.fgrid .full { grid-column: 1 / -1; }
.fgrid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 3px; padding: 3px; border-radius: 11px; background: var(--surface-3); border: 1px solid var(--line); }
.seg button { border: 0; background: none; padding: 6px 11px; border-radius: 8px; cursor: pointer; color: var(--ink-2); font-weight: 600; font-size: .86rem; min-height: 32px; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .25); }

.seg.status button.on[data-v="fail"] { background: var(--fail); color: #200404; }

html[data-theme="workshop"] .seg.status button.on[data-v="pass"], html[data-theme="workshop"] .seg.status button.on[data-v="fail"] { color: #fff; }
.switch { position: relative; width: 46px; height: 26px; flex: none; display: inline-block; }
.switch input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 99px; background: var(--line-2); transition: background .2s; }
.switch i::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s var(--ease); }
.switch input:checked + i { background: var(--copper); }
.switch input:checked + i::after { transform: translateX(20px); }
html[dir="rtl"] .switch input:checked + i::after { transform: translateX(-20px); }
.switch input:focus-visible + i { outline: 3px solid var(--cyan); outline-offset: 2px; }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px dashed var(--line); }
.setrow:last-child { border-bottom: 0; }
.setrow > .seg { flex: none; flex-wrap: nowrap; }
.setrow > span { flex: 1; min-width: 0; }
.setrow small { display: block; color: var(--muted); font-size: .78rem; }
.tick { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px dashed var(--line); cursor: pointer; }
.tick input { width: 20px; height: 20px; accent-color: var(--copper); margin-top: 2px; flex: none; }
.tick.inline { border: 0; padding: 4px 12px 4px 0; }
input[type="range"], input[type="checkbox"], input[type="radio"] { accent-color: var(--copper); }
input[type="range"] { width: 100%; }

/* ---------- tables ---------- */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: .88rem; }
.tbl th, .tbl td { padding: 9px 12px; text-align: start; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl th { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--surface-2); font-weight: 700; white-space: nowrap; }
html[lang="ur"] .tbl th { letter-spacing: 0; font-size: .8rem; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.num, .tbl th.num { text-align: end; white-space: nowrap; }
.tbl tr.sel td { background: var(--copper-soft); }

/* ---------- modal sheet, toasts, palette, tour ---------- */
#scrim { position: fixed; inset: 0; background: rgba(5, 7, 9, .62); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 60; }
#scrim.on { opacity: 1; pointer-events: auto; }
#modal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 61; pointer-events: none; }
#modal .sheet { pointer-events: auto; width: min(560px, 100%); max-height: min(88vh, 900px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line-2); border-radius: 18px; padding: 18px 20px 20px; box-shadow: var(--shadow-lg); opacity: 0; transform: scale(.96) translateY(8px); transition: opacity .22s var(--ease), transform .26s var(--ease); visibility: hidden; }
#modal .sheet.wide { width: min(860px, 100%); }
#modal.on .sheet { opacity: 1; transform: none; visibility: visible; }
.sheet .grab { display: none; }
.shead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.shead h3 { display: flex; gap: 9px; align-items: center; font-size: 1.12rem; }
.shead h3 .ic { color: var(--copper); }
.sfoot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 18px; }
#toasts { position: fixed; bottom: 22px; inset-inline-end: 22px; display: flex; flex-direction: column; gap: 8px; z-index: 80; max-width: min(380px, calc(100vw - 32px)); }
.toast { display: flex; gap: 10px; align-items: center; padding: 11px 14px; border-radius: 12px; background: var(--surface-3); color: var(--ink); border: 1px solid var(--line-2); box-shadow: var(--shadow-lg); animation: fadeUp .3s var(--ease) both; transition: opacity .3s, transform .3s; }
.toast.ok .ic { color: var(--pass); }
.toast.bad .ic { color: var(--fail); }
.toast.out { opacity: 0; transform: translateY(8px); }
.palette { position: fixed; inset: 0; z-index: 70; display: none; align-items: flex-start; justify-content: center; padding: 12vh 16px 16px; background: rgba(5, 7, 9, .55); }
.palette.on { display: flex; animation: fadeIn .18s both; }
.palbox { width: min(620px, 100%); background: var(--surface); border: 1px solid var(--line-2); border-radius: 16px; box-shadow: var(--shadow-lg); overflow: hidden; animation: pop .22s var(--ease) both; }
.palbox .inp { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; min-height: 54px; font-size: 1.05rem; background: var(--surface); box-shadow: none; }
.palres { max-height: 52vh; overflow-y: auto; padding: 6px; }
.palres .pg { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 8px 10px 4px; }
.palres button { width: 100%; display: flex; gap: 10px; align-items: center; text-align: start; padding: 9px 10px; border: 0; background: none; border-radius: 9px; cursor: pointer; }
.palres button small { margin-inline-start: auto; color: var(--muted); font-size: .76rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
.palres button.on { background: var(--copper-soft); }
.palhint { padding: 8px 14px; font-size: .74rem; color: var(--muted); border-top: 1px solid var(--line); }
#tour { position: fixed; inset: 0; z-index: 75; display: none; }
#tour.on { display: block; }
#tourSpot { position: fixed; border-radius: 14px; box-shadow: 0 0 0 9999px rgba(4, 6, 8, .66); outline: 2px solid var(--cyan); transition: all .35s var(--ease); pointer-events: none; }
#tourTip { position: fixed; width: min(340px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow-lg); animation: pop .25s var(--ease) both; }
#tourTip h4 { font-size: 1.02rem; margin: 6px 0 4px; }
#tourTip p { font-size: .88rem; color: var(--ink-2); }
#tourTip .tag { font: 600 .7rem var(--mono); color: var(--cyan); }
.dots { display: flex; gap: 5px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); }
.dots i.on { background: var(--cyan); width: 18px; border-radius: 4px; }

/* ---------- responsive shell ---------- */
@media (max-width: 1100px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cols { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  .rail { display: none; }
  .main { margin-inline-start: 0; }
  .top { padding: 0 12px; gap: 8px; }
  .top .brand { display: flex; }
  .top .brand span:not(.mark) { display: none; }
  .top .brand .mark { width: 34px; height: 34px; }
  #view { padding: 16px 16px calc(var(--tab-h) + 30px); }
  .tabs {
    display: flex;
    position: fixed;
    inset-inline: 0;
    bottom: 0;
    height: calc(var(--tab-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--bg-2);
    border-top: 1px solid var(--line);
    z-index: 30;
  }
  .tabs a, .tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); text-decoration: none; font-size: .7rem; font-weight: 650; background: none; border: 0; cursor: pointer; position: relative; min-width: 0; }
  html[lang="ur"] .tabs a, html[lang="ur"] .tabs button { font-size: .72rem; line-height: 1.6; }
  .tabs .ic { width: 1.35em; height: 1.35em; }
  .tabs .on { color: var(--copper); }
  .tabs .on::before { content: ""; position: absolute; top: 0; width: 30px; height: 3px; border-radius: 0 0 3px 3px; background: var(--copper); }
  .tabs .tdot { position: absolute; top: 8px; inset-inline-start: calc(50% + 6px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--copper); color: var(--copper-ink); font: 700 .6rem/16px var(--mono); }
  #toasts { bottom: calc(var(--tab-h) + 14px); inset-inline: 16px; max-width: none; }
  #modal { align-items: flex-end; padding: 0; }
  #modal .sheet, #modal .sheet.wide { width: 100%; border-radius: 20px 20px 0 0; max-height: 92vh; transform: translateY(40px); padding: 10px 16px calc(18px + env(safe-area-inset-bottom)); }
  .sheet .grab { display: block; width: 44px; height: 5px; border-radius: 3px; background: var(--line-2); margin: 0 auto 10px; }
  .phead h2 { font-size: 1.32rem; }
  .g3 { grid-template-columns: minmax(0, 1fr); }
  .cols.half { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .g2, .fgrid, .fgrid.three { grid-template-columns: minmax(0, 1fr); }
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .top h1 { font-size: 1.02rem; }
  .tbtn.hide-s { display: none; }
  .card { padding: 15px; }
  .tile .v { font-size: 1.25rem; }
}

/* ---------- bench home ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
.dut-card { position: relative; overflow: hidden; background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%); }
.dut-card::after { content: ""; position: absolute; inset-inline-end: -40px; top: -40px; width: 180px; height: 180px; border-radius: 50%; border: 1px dashed var(--line-2); opacity: .6; pointer-events: none; }
.dut { display: flex; gap: 18px; align-items: center; }
.dut .ringbox { position: relative; width: 116px; height: 116px; flex: none; }
.dut .ringbox svg { width: 100%; height: 100%; }
.ringbox .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ringbox .mid b { font: 600 1.5rem var(--mono); }
.ringbox .mid small { font-size: .7rem; color: var(--muted); }
.qa { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.qa .tile { padding: 12px; }
.caps { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 7px; }
.cap { display: flex; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); font-size: .8rem; min-width: 0; }
.cap span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-rows > a, .list-rows > div.lr { display: flex; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; min-width: 0; }
.list-rows > :last-child { border-bottom: 0; }
.list-rows .t { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-rows .sub { font-size: .78rem; color: var(--muted); }
.mini-seal { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font: 700 1.05rem var(--mono); border: 2px solid currentColor; flex: none; }
.g-A { color: var(--pass); }
.g-B { color: var(--cyan); }
.g-C { color: var(--warn); }
.g-D { color: var(--fail); }
.honest li { margin-bottom: 6px; }
.honest { padding-inline-start: 1.1em; margin: 0; font-size: .88rem; color: var(--ink-2); }

/* ---------- diagnostic wizard ---------- */
.wiz { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 18px; align-items: start; }
.wiz-side { position: sticky; top: calc(var(--top-h) + 14px); }
.wring { display: flex; gap: 14px; align-items: center; padding: 14px; }
.wring .ringbox { width: 92px; height: 92px; position: relative; flex: none; }
.wring .ringbox svg { width: 100%; height: 100%; }
.wring .ringbox .mid b { font-size: 1.15rem; }
.steps { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.steps a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; color: var(--ink-2); text-decoration: none; font-weight: 580; font-size: .92rem; border: 1px solid transparent; }
.steps a:hover { background: var(--surface-2); }
.steps a.on { background: var(--surface); border-color: var(--line-2); color: var(--ink); box-shadow: var(--shadow); }
.steps .n { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-3); color: var(--muted); font: 600 .74rem var(--mono); flex: none; }
.steps a.on .n { background: var(--cyan-soft); color: var(--cyan); }
.steps .st { margin-inline-start: auto; }
.steps a.s-pass .n { background: var(--pass-soft); color: var(--pass); }
.steps a.s-fail .n { background: var(--fail-soft); color: var(--fail); }
.steps a.s-warn .n { background: var(--warn-soft); color: var(--warn); }
.stephead { margin-bottom: 14px; }
.stephead h2 { font-size: 1.5rem; display: flex; gap: 10px; align-items: center; }
.stephead h2 .ic { color: var(--cyan); }
.stephead p { color: var(--ink-2); margin: 6px 0 0; max-width: 75ch; }
.apis { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.wiz-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

/* the live test stage: an instrument screen, dark in both themes */
.stage {
  position: relative;
  background-color: var(--stage);
  background-image: linear-gradient(var(--stage-grid) 1px, transparent 1px), linear-gradient(90deg, var(--stage-grid) 1px, transparent 1px);
  background-size: 24px 24px;
  border: 1px solid #1c2a31;
  border-radius: 16px;
  padding: 18px;
  color: var(--stage-ink);
  overflow: hidden;
  min-width: 0;
  --cyan: #33e1ed;
  --cyan-soft: rgba(51, 225, 237, .12);
  --line: #23313a;
  --line-2: #2f414c;
  --surface: #121a20;
  --surface-2: #101820;
  --surface-3: #1a252d;
  --ink: #e4fbfd;
  --ink-2: #b5d6da;
  --muted: #7fa0a6;
  --pass: #3fd98a;
  --fail: #ff6b6b;
  --warn: #f2b545;
}
.stage + .stage, .grid + .stage, .stage + .grid { margin-top: 12px; }
.grid > .stage { margin-top: 0 !important; }
.stage .st-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.stage .st-h h3 { font-size: .98rem; display: flex; gap: 8px; align-items: center; color: var(--ink); }
.stage .st-h h3 .ic { color: var(--cyan); }
.stage .lbl { font: 500 .68rem var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
html[lang="ur"] .stage .lbl { font-family: var(--font-ur); letter-spacing: 0; font-size: .74rem; text-transform: none; }
.stage .readout { font: 600 1.6rem var(--mono); color: var(--cyan); letter-spacing: -.03em; line-height: 1.2; white-space: nowrap; }
.stage .readout small { font-size: .7rem; color: var(--muted); margin-inline-start: 4px; }
.stage .readouts { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.stage .readouts > div { background: rgba(255, 255, 255, .025); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.stage .readouts .readout { font-size: 1.15rem; overflow: hidden; text-overflow: ellipsis; }
.stage canvas { display: block; width: 100%; border-radius: 10px; background: rgba(0, 0, 0, .35); border: 1px solid var(--line); }
.stage .scanline { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(transparent 0, rgba(51, 225, 237, .06) 50%, transparent 100%); height: 40%; animation: scan 3.2s linear infinite; }
.stage .live-dot { display: inline-flex; gap: 6px; align-items: center; font: 600 .7rem var(--mono); color: var(--cyan); text-transform: uppercase; letter-spacing: .08em; }
.stage .notice { background: rgba(51, 225, 237, .07); color: var(--ink-2); }
.stage .btn.ghost { background: #121a20; color: var(--ink); border-color: #2f414c; }
.stage .seg { background: #1a252d; border-color: #23313a; }
.stage .seg button { color: var(--ink-2); }
.stage .seg button.on { background: #22323c; color: #fff; }
.stage .field input, .stage .field select { background: #101820; border-color: #2f414c; color: var(--ink); }
.swatches { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 6px; margin: 12px 0; }
.swatches i { aspect-ratio: 1; border-radius: 7px; border: 1px solid #2f414c; }
.meter { height: 16px; border-radius: 8px; background: #101820; border: 1px solid var(--line); overflow: hidden; position: relative; }
.meter > i { position: absolute; inset-block: 0; inset-inline-start: 0; width: 0; background: linear-gradient(90deg, #1fb8c3, #33e1ed 60%, #f2b545 85%, #ff6b6b); transition: width .08s linear; }
.meter > b { position: absolute; inset-block: 0; width: 2px; background: #fff; opacity: .8; transition: inset-inline-start .2s; }
.mtpad { position: relative; height: 220px; border-radius: 12px; border: 1px dashed #2f414c; touch-action: none; overflow: hidden; display: grid; place-items: center; color: var(--muted); user-select: none; -webkit-user-select: none; }
.mtpad .tp { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; border: 2px solid var(--cyan); background: rgba(51, 225, 237, .15); pointer-events: none; display: grid; place-items: center; font: 600 .8rem var(--mono); color: var(--cyan); }
.tiltwrap { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 14px; align-items: start; }
.compass { width: 180px; height: 180px; margin: 0 auto; display: block; }
.compass .rose { transition: transform .15s linear; transform-origin: 100px 100px; }
.camgrid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 14px; }
.camview { position: relative; border-radius: 12px; overflow: hidden; background: #000; aspect-ratio: 4 / 3; border: 1px solid var(--line); }
.camview video, .camview canvas, .camview img { width: 100%; height: 100%; object-fit: cover; display: block; border: 0; border-radius: 0; }
.camview .reticle { position: absolute; inset: 22% 26%; border: 2px solid rgba(51, 225, 237, .7); border-radius: 10px; pointer-events: none; }
.camview .tag { position: absolute; top: 8px; inset-inline-start: 8px; font: 600 .68rem var(--mono); background: rgba(0, 0, 0, .6); color: var(--cyan); padding: 2px 7px; border-radius: 6px; }
.camlist { display: flex; flex-direction: column; gap: 6px; }
.camlist button { display: flex; gap: 8px; align-items: center; text-align: start; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: #101820; color: var(--ink-2); cursor: pointer; min-width: 0; }
.camlist button.on { border-color: var(--cyan); color: var(--ink); }
.camlist button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist { display: flex; align-items: flex-end; gap: 1px; height: 54px; }
.hist i { flex: 1; background: var(--cyan); opacity: .75; min-height: 1px; border-radius: 1px 1px 0 0; }
.bench-row { display: grid; grid-template-columns: 110px minmax(0, 1fr) 76px; gap: 10px; align-items: center; font-size: .84rem; margin: 6px 0; }
.bench-row .bar { height: 10px; background: #101820; }

/* checks list under the stage */
.checks { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.check { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; align-items: center; padding: 11px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); border-inline-start: 4px solid var(--line-2); }
.check.s-pass { border-inline-start-color: var(--pass); }
.check.s-fail { border-inline-start-color: var(--fail); }
.check.s-warn { border-inline-start-color: var(--warn); }
.check.s-skip { border-inline-start-color: var(--skip); }
.check .nm { font-weight: 680; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.check .ev { font: 500 .78rem var(--mono); color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
html[lang="ur"] .check .ev { font-family: var(--font-ur); font-size: .8rem; }
.check .seg button { padding: 5px 9px; font-size: .78rem; min-height: 30px; }

/* full-screen test layer (display patterns and the touch grid) */
#fs { position: fixed; inset: 0; z-index: 95; display: none; background: #000; touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair; }
#fs.on { display: block; }
#fs .hud { position: absolute; top: max(12px, env(safe-area-inset-top)); inset-inline: 0; margin: 0 auto; width: fit-content; max-width: calc(100% - 24px); padding: 6px 14px; border-radius: 99px; background: rgba(10, 13, 16, .78); color: #d9f9fb; font: 500 .8rem var(--mono); text-align: center; transition: opacity .5s; pointer-events: none; }
#fs .hud.fade { opacity: 0; }
#fs .fsbar { position: absolute; bottom: max(14px, env(safe-area-inset-bottom)); inset-inline: 0; display: flex; justify-content: center; gap: 8px; pointer-events: none; }
#fs .fsbar .btn { pointer-events: auto; }
.tgrid { position: absolute; inset: 0; display: grid; }
.tgrid i { border: 1px solid rgba(51, 225, 237, .14); background: transparent; transition: background .12s; }
.tgrid i.edge { border-color: rgba(217, 139, 95, .55); }
.tgrid i.on { background: rgba(51, 225, 237, .5); }
.tgrid i.on.edge { background: rgba(63, 217, 138, .6); }
.tdots { position: absolute; inset: 0; pointer-events: none; }
.tdots b { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; border: 2px solid #fff; }

/* ---------- grade, valuation ---------- */
.gseal { width: 150px; height: 150px; flex: none; }
.gseal text { font-family: var(--mono); }
.reasons { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 7px; }
.reasons li { display: flex; gap: 9px; align-items: flex-start; font-size: .9rem; }
.reasons .ic { margin-top: 3px; }
.waterfall { width: 100%; height: auto; display: block; }
.waterfall text { font-size: 11px; fill: var(--muted); font-family: var(--mono); }
.waterfall .lbl { fill: var(--ink-2); font-family: var(--font); }
html[lang="ur"] .waterfall .lbl { font-family: var(--font-ur); }
.price { font: 600 1.9rem var(--mono); letter-spacing: -.03em; color: var(--ink); }
.price small { font-size: .9rem; color: var(--muted); }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-size: 11px; fill: var(--muted); font-family: var(--mono); }
.chart .gl { stroke: var(--line); stroke-dasharray: 3 4; }

/* ---------- certificate document (paper in both themes) ---------- */
.certwrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
.cert {
  --c-ink: #1d232b;
  --c-muted: #5d6672;
  --c-line: #d9cfbf;
  --c-copper: #a35426;
  --c-pass: #15703a;
  --c-fail: #b42323;
  --c-warn: #8f5b00;
  position: relative;
  background: var(--paper);
  color: var(--c-ink);
  border-radius: 6px;
  padding: 34px 38px 28px;
  box-shadow: 0 30px 60px -30px rgba(0, 0, 0, .7), 0 0 0 1px rgba(0, 0, 0, .06);
  overflow: hidden;
  font-size: .9rem;
}
.cert::before { content: ""; position: absolute; inset: 12px; border: 1.5px solid var(--c-copper); border-radius: 3px; pointer-events: none; }
.cert::after { content: ""; position: absolute; inset: 17px; border: .6px solid var(--c-copper); border-radius: 2px; pointer-events: none; opacity: .6; }
.cert .guil { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: .5; }
.cert > *:not(.guil) { position: relative; }
.cert-head { display: flex; gap: 18px; align-items: flex-start; justify-content: space-between; border-bottom: 1px solid var(--c-line); padding-bottom: 14px; }
.cert-head .ttl small { display: block; font: 600 .66rem var(--mono); letter-spacing: .16em; color: var(--c-copper); text-transform: uppercase; }
.cert-head h2 { font-size: 1.55rem; letter-spacing: -.01em; margin: 3px 0 2px; color: var(--c-ink); }
.cert-head .ur { font-family: var(--font-ur); font-size: 1.02rem; color: var(--c-muted); line-height: 2; direction: rtl; }
.cert-head .en { font-size: .9rem; color: var(--c-muted); direction: ltr; margin: 4px 0; }
html[lang="ur"] .cert-head .ttl small { font-family: var(--font-ur); letter-spacing: 0; font-size: .78rem; text-transform: none; }
.cert .mono, .stage .readout, .keycard, .price { unicode-bidi: isolate; direction: ltr; }
html[dir="rtl"] .cert-meta .mono, html[dir="rtl"] .price { display: inline-block; }
.cert .seal { width: 112px; height: 112px; flex: none; }
.cert .seal .gseal { width: 100%; height: 100%; }
.cert-meta { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 16px; margin: 16px 0; }
.cert-meta div { min-width: 0; }
.cert-meta small { display: block; font: 600 .62rem var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--c-muted); }
html[lang="ur"] .cert-meta small { font-family: var(--font-ur); letter-spacing: 0; font-size: .7rem; text-transform: none; }
.cert-meta b { font-weight: 650; overflow-wrap: anywhere; }
.cert-meta .mono { font-size: .84rem; }
.cert-body { display: grid; grid-template-columns: minmax(0, 1fr) 170px; gap: 18px; }
.cert table { width: 100%; border-collapse: collapse; font-size: .82rem; }
.cert th, .cert td { text-align: start; padding: 5px 6px; border-bottom: 1px solid var(--c-line); }
.cert th { font: 600 .62rem var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--c-muted); }
html[lang="ur"] .cert th { font-family: var(--font-ur); letter-spacing: 0; text-transform: none; font-size: .72rem; }
.cert .res { display: inline-flex; gap: 5px; align-items: center; font-weight: 650; }
.cert .res.pass { color: var(--c-pass); }
.cert .res.fail { color: var(--c-fail); }
.cert .res.warn { color: var(--c-warn); }
.cert .res.skip { color: var(--c-muted); }
.cert-qr { text-align: center; }
.cert-qr svg { width: 100%; height: auto; display: block; border: 1px solid var(--c-line); border-radius: 4px; }
.cert-qr .code { font: 600 .8rem var(--mono); margin-top: 6px; letter-spacing: .04em; }
.cert-qr small { display: block; font-size: .68rem; color: var(--c-muted); line-height: 1.35; }
.cert-value { margin-top: 14px; padding: 12px 14px; border: 1px dashed var(--c-copper); border-radius: 6px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.cert-value b { font: 600 1.15rem var(--mono); }
.cert-foot { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin-top: 18px; align-items: end; }
.cert .sigline { border-top: 1px solid var(--c-ink); padding-top: 4px; font-size: .76rem; color: var(--c-muted); }
.cert .sig { font: 500 .62rem var(--mono); color: var(--c-muted); overflow-wrap: anywhere; line-height: 1.45; }
.cert .fine { font-size: .68rem; color: var(--c-muted); margin-top: 12px; line-height: 1.45; }
.cert.stamp-void::before { border-color: var(--c-fail); }
.cert .void { position: absolute; top: 42%; inset-inline: 0; text-align: center; font: 800 3.4rem var(--mono); color: rgba(180, 35, 35, .16); transform: rotate(-14deg); letter-spacing: .1em; pointer-events: none; }

/* ---------- verify ---------- */
.vres { display: flex; gap: 16px; align-items: center; padding: 18px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); }
.vres .big { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; flex: none; }
.vres .big .ic { width: 34px; height: 34px; }
.vres.ok { border-color: color-mix(in srgb, var(--pass) 45%, transparent); background: var(--pass-soft); }
.vres.ok .big { background: var(--pass); color: #04170c; }
.vres.bad { border-color: color-mix(in srgb, var(--fail) 45%, transparent); background: var(--fail-soft); }
.vres.bad .big { background: var(--fail); color: #200404; }
.vres.warn { border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: var(--warn-soft); }
.vres.warn .big { background: var(--warn); color: #241600; }
.vres h3 { font-size: 1.3rem; }
.vlist { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-direction: column; gap: 6px; }
.vlist li { display: flex; gap: 10px; align-items: flex-start; font-size: .9rem; }
.vlist li .ic { margin-top: 3px; }
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 7px; }
.groups span { display: flex; gap: 6px; align-items: center; padding: 7px 10px; border-radius: 9px; font-size: .8rem; font-weight: 650; background: var(--pass-soft); color: var(--pass); }
.groups span.bad { background: var(--fail-soft); color: var(--fail); animation: pop .3s var(--ease) both; }
.groups span.na { background: var(--surface-2); color: var(--muted); }
.field.changed input, .field.changed select { border-color: var(--fail); background: var(--fail-soft); }
.scanbox { position: relative; border-radius: 14px; overflow: hidden; background: #000; aspect-ratio: 1; max-width: 340px; }
.scanbox video { width: 100%; height: 100%; object-fit: cover; }
.scanbox .reticle { position: absolute; inset: 18%; border: 3px solid var(--cyan); border-radius: 16px; box-shadow: 0 0 0 999px rgba(0, 0, 0, .35); }
.keycard { font: 500 .74rem var(--mono); overflow-wrap: anywhere; background: var(--surface-2); padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line); }
textarea.mono { font-family: var(--mono); font-size: .8rem; }

/* ---------- shop: kanban, job detail, invoice ---------- */
.subtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.subtabs a { display: inline-flex; gap: 7px; align-items: center; padding: 8px 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: .9rem; }
.subtabs a.on { border-color: var(--copper); color: var(--ink); background: var(--copper-soft); }
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.kcol { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 10px; min-height: 160px; }
.kcol > h4 { display: flex; justify-content: space-between; align-items: center; font-size: .86rem; padding: 2px 4px 9px; color: var(--ink-2); }
.kcol > h4 .chip { font-family: var(--mono); }
.job { display: block; width: 100%; text-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 10px 11px; margin-bottom: 8px; cursor: pointer; color: inherit; }
.job:hover { border-color: var(--copper); }
.job b { display: block; font-size: .9rem; }
.job .sub { font-size: .76rem; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 3px; }
.tl { list-style: none; padding: 0; margin: 0; border-inline-start: 2px solid var(--line-2); }
.tl li { position: relative; padding: 0 0 12px 16px; font-size: .86rem; }
html[dir="rtl"] .tl li { padding: 0 16px 12px 0; }
.tl li::before { content: ""; position: absolute; inset-inline-start: -6px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--copper); }
.tl li small { color: var(--muted); display: block; }
.pipeline { display: flex; gap: 4px; flex-wrap: wrap; }
.pipeline span { flex: 1; min-width: 70px; text-align: center; font-size: .7rem; padding: 5px 4px; border-radius: 7px; background: var(--surface-3); color: var(--muted); font-weight: 650; }
.pipeline span.done { background: var(--copper-soft); color: var(--copper); }
.pipeline span.cur { background: var(--copper); color: var(--copper-ink); }
.stock-low { color: var(--fail); font-weight: 700; }

/* ---------- repair estimator ---------- */
.issues { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.issue { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; }
.issue input { width: 18px; height: 18px; accent-color: var(--copper); }
.issue.on { border-color: var(--copper); background: var(--copper-soft); }
.verdict { display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: 14px; }
.verdict.repair { background: var(--pass-soft); }
.verdict.maybe { background: var(--warn-soft); }
.verdict.replace { background: var(--fail-soft); }
.verdict .ic { width: 2em; height: 2em; }

/* ---------- passport, safety, about ---------- */
.ppl { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.ppl > .card { display: flex; flex-direction: column; justify-content: flex-start; gap: 4px; }
.spark { width: 100%; height: 46px; display: block; }
.ol { counter-reset: s; list-style: none; padding: 0; margin: 0; }
.ol li { counter-increment: s; position: relative; padding: 6px 0 10px; padding-inline-start: 38px; border-bottom: 1px dashed var(--line); }
.ol li::before { content: counter(s); position: absolute; inset-inline-start: 0; top: 6px; width: 26px; height: 26px; border-radius: 8px; background: var(--copper-soft); color: var(--copper); font: 600 .78rem/26px var(--mono); text-align: center; }
.scam { border-inline-start: 4px solid var(--fail); }
.todo-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.todo { padding: 12px 14px; border-radius: 12px; background: var(--surface-2); border: 1px dashed var(--line-2); }
.todo b { display: block; margin-bottom: 3px; }
.todo code { font-size: .74rem; }
.quiz-opt { display: block; width: 100%; text-align: start; padding: 10px 12px; margin-top: 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; }

/* ---------- responsive modules ---------- */
@media (max-width: 1180px) {
  .certwrap { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 1000px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .wiz { grid-template-columns: minmax(0, 1fr); }
  .wiz-side { position: static; }
  .steps { flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; scrollbar-width: thin; }
  .steps a { white-space: nowrap; flex: none; padding: 7px 10px; }
  .steps a .lbl { display: none; }
  .steps a.on .lbl { display: inline; }
  .steps .st { display: none; }
  .tiltwrap, .camgrid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 700px) {
  .cert { padding: 26px 20px 22px; font-size: .84rem; }
  .cert-meta { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cert-body { grid-template-columns: minmax(0, 1fr); }
  .cert-qr { max-width: 190px; margin: 0 auto; }
  .cert-head { flex-wrap: wrap; }
  .cert .seal { width: 84px; height: 84px; }
  .cert-foot { grid-template-columns: minmax(0, 1fr); }
  .check { grid-template-columns: minmax(0, 1fr); }
  .swatches { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .stage { padding: 14px; }
  .stage .readout { font-size: 1.3rem; }
  .bench-row { grid-template-columns: 84px minmax(0, 1fr) 64px; }
  .dut { flex-direction: column; align-items: flex-start; }
  .vres { flex-direction: column; align-items: flex-start; }
  .gseal { width: 120px; height: 120px; }
}

/* ---------- print: A4 certificate, invoices, reports ---------- */
#printArea { display: none; }
@media print {
  @page { size: A4; margin: 10mm; }
  body { background: #fff !important; color: #000; }
  body > *:not(#printArea) { display: none !important; }
  #printArea { display: block !important; }
  #printArea .cert { box-shadow: none; border-radius: 0; width: 100%; padding: 12mm 12mm 10mm; font-size: 10.5pt; break-inside: avoid; }
  #printArea .cert::before { inset: 3mm; }
  #printArea .cert::after { inset: 4.5mm; }
  .pdoc { font-family: var(--font); color: #111; font-size: 10.5pt; }
  .pdoc h1 { font-size: 17pt; margin-bottom: 4pt; }
  .pdoc h2 { font-size: 12pt; margin: 12pt 0 5pt; }
  .pdoc table { width: 100%; border-collapse: collapse; }
  .pdoc th, .pdoc td { border: 1px solid #bbb; padding: 4pt 6pt; text-align: start; font-size: 9.5pt; }
  .pdoc .muted { color: #555; }
  .pdoc .tot td { font-weight: 700; }
  html[lang="ur"] .pdoc { font-family: var(--font-ur); }
}
</style>

// ---------- DOM + storage helpers ----------
const NS = 'mrmt.';

const store = {
  get(k, d) {
    try {
      const v = localStorage.getItem(NS + k);
      return v == null ? d : JSON.parse(v);
    } catch {
      return d;
    }
  },
  set(k, v) {
    try {
      localStorage.setItem(NS + k, JSON.stringify(v));
      return true;
    } catch {
      return false;
    }
  },
  del(k) {
    try {
      localStorage.removeItem(NS + k);
    } catch {
      /* storage blocked */
    }
  },
  keys() {
    const out = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith(NS)) out.push(k.slice(NS.length));
      }
    } catch {
      /* storage blocked */
    }
    return out;
  },
  bytes() {
    let n = 0;
    for (const k of this.keys()) n += k.length + (localStorage.getItem(NS + k) || '').length;
    return n * 2;
  },
};

// Deterministic PRNG (mulberry32) so seeded data and benchmark inputs are the same on every machine.
function rng(seed) {
  return () => {
    seed |= 0;
    seed = (seed + 0x6d2b79f5) | 0;
    let x = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- feedback: toast, aria-live, motion ----------
function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.setAttribute('role', 'status');
  el.innerHTML = ic(type === 'ok' ? 'check-circle' : type === 'bad' ? 'alert-circle' : 'info') + '<span></span>';
  el.lastChild.textContent = msg;
  $('#toasts').append(el);
  setTimeout(() => el.classList.add('out'), 2800);
  setTimeout(() => el.remove(), 3150);
}

const announce = msg => {
  $('#live').textContent = '';
  setTimeout(() => ($('#live').textContent = msg), 30);
};
const calm = () => document.documentElement.classList.contains('calm') || matchMedia('(prefers-reduced-motion: reduce)').matches;

function animateIn(root) {
  if (!root) return;
  root.classList.remove('enter');
  void root.offsetWidth;
  root.classList.add('enter');
  $$('.stagger', root).forEach(g => [...g.children].forEach((el, i) => el.style.setProperty('--i', Math.min(i, 14))));
  requestAnimationFrame(() => $$('.bar > i[data-w]', root).forEach(b => (b.style.width = b.dataset.w + '%')));
  $$('[data-count]', root).forEach(el => countUp(el, Number(el.dataset.count), { fmt: countFmt(el) }));
  $$('path[data-draw], polyline[data-draw]', root).forEach(drawPath);
  $$('circle[data-ring]', root).forEach(fillRing);
}

// Same-route re-renders skip the entrance animation but still need rings, bars and numbers in place.
function settle(root) {
  if (!root) return;
  $$('.bar > i[data-w]', root).forEach(b => (b.style.width = b.dataset.w + '%'));
  $$('[data-count]', root).forEach(el => (el.textContent = countFmt(el)(Number(el.dataset.count))));
  $$('circle[data-ring]', root).forEach(c => {
    const L = 2 * Math.PI * Number(c.getAttribute('r'));
    c.style.transition = 'none';
    c.style.strokeDasharray = L;
    c.style.strokeDashoffset = L * (1 - Number(c.dataset.ring));
  });
}

const countFmt = el => (el.dataset.fmt === 'rs' ? v => rs(v) : v => fmtNum(v, Number(el.dataset.dec || 0)));

function countUp(el, to, { dur: ms = 700, fmt = v => fmtNum(v) } = {}) {
  if (calm()) {
    el.textContent = fmt(to);
    return;
  }
  const t0 = performance.now();
  const step = ts => {
    const p = Math.min(1, (ts - t0) / ms);
    el.textContent = fmt(to * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function drawPath(p) {
  const L = p.getTotalLength();
  p.style.strokeDasharray = L;
  p.style.strokeDashoffset = L;
  p.getBoundingClientRect();
  p.style.transition = 'stroke-dashoffset .9s var(--ease)';
  p.style.strokeDashoffset = 0;
}

function fillRing(c) {
  const L = 2 * Math.PI * Number(c.getAttribute('r'));
  c.style.strokeDasharray = L;
  c.style.strokeDashoffset = L;
  c.getBoundingClientRect();
  c.style.strokeDashoffset = L * (1 - Number(c.dataset.ring));
}

function ringSvg(frac, { size = 112, r = 46, cls = '' } = {}) {
  const c = size / 2;
  return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true" class="ring ${cls}"><circle class="track" cx="${c}" cy="${c}" r="${r}"/><circle class="val" cx="${c}" cy="${c}" r="${r}" data-ring="${clamp(frac, 0, 1)}"/></svg>`;
}

function openModal(html, { wide = false, onClose = null } = {}) {
  if (!$('#modal').classList.contains('on')) modalReturn = document.activeElement;
  const sh = $('#sheet');
  sh.className = 'sheet' + (wide ? ' wide' : '');
  sh.innerHTML = '<div class="grab"></div>' + html;
  sh.scrollTop = 0;
  $('#scrim').classList.add('on');
  $('#modal').classList.add('on');
  modalOnClose = onClose;
  $$('[data-close]', sh).forEach(b => (b.onclick = closeModal));
  const first = sh.querySelector('[autofocus], input:not([type=hidden]):not([type=checkbox]):not([type=file]):not([readonly]), select, textarea');
  setTimeout(() => (first || sh.querySelector('.shead [data-close]') || sh).focus({ preventScroll: true }), 80);
  return sh;
}

function closeModal() {
  if (!$('#modal').classList.contains('on')) return;
  $('#modal').classList.remove('on');
  $('#scrim').classList.remove('on');
  const cb = modalOnClose;
  modalOnClose = null;
  if (cb) cb();
  if (modalReturn && document.contains(modalReturn)) modalReturn.focus({ preventScroll: true });
}
const modalOpen = () => $('#modal').classList.contains('on');

function askConfirm(msg, { okText = t('confirm'), danger = false, icon = 'help', typed = '' } = {}) {
  return new Promise(resolve => {
    let answered = false;
    const finish = v => {
      if (answered) return;
      answered = true;
      resolve(v);
    };
    const typedHtml = typed ? `<label class="field mt"><span>${t('typeToConfirm', { w: typed })}</span><input id="cfTyped" autocomplete="off" class="ltr"></label>` : '';
    const sh = openModal(`${sheetHead(t('areYouSure'), icon)}<p>${msg}</p>${typedHtml}
      <div class="sfoot"><button class="btn ghost" type="button" data-close>${t('cancel')}</button>
      <button class="btn ${danger ? 'danger' : ''}" type="button" id="cfOk">${okText}</button></div>`, { onClose: () => finish(false) });
    $('#cfOk', sh).onclick = () => {
      if (typed && $('#cfTyped', sh).value.trim().toUpperCase() !== typed) {
        $('#cfTyped', sh).closest('.field').classList.add('bad');
        return;
      }
      finish(true);
      closeModal();
    };
  });
}

function printDoc(html) {

function downloadFile(name, data, mime = 'application/json') {
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function pickFile(accept, cb, { asText = true, capture = '' } = {}) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = accept;
  if (capture) inp.setAttribute('capture', capture);
  inp.onchange = () => {
    const f = inp.files[0];
    if (!f) return;
    if (asText) f.text().then(cb);
    else cb(f);
  };
  inp.click();
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast(t('copied'), 'ok');
  } catch {
    toast(t('copyFailed'), 'bad');
  }
}

/** Load an image file or URL into an <img>, resolved when decoded. */
function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('image'));
    img.src = src;
  });
}

/** Resize an image file to a small JPEG data URL (photo evidence must fit in localStorage). */
async function resizeImage(file, maxSide = 420, quality = 0.62) {
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImage(url);
    const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * scale);
    c.height = Math.round(img.height * scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', quality);
  } finally {
    URL.revokeObjectURL(url);
  }
}

// ---------- live hardware registry: every stream, sensor listener and timer registers a stop function ----------
const LIVE = {
  stops: new Set(),
  add(fn) {
    this.stops.add(fn);
    return fn;
  },
  run(fn) {
    if (!this.stops.has(fn)) return;
    this.stops.delete(fn);
    try {
      fn();
    } catch {
      /* already stopped */
    }
  },
  stopAll() {
    for (const fn of [...this.stops]) this.run(fn);
  },
};

function stopStream(stream) {
  if (stream) stream.getTracks().forEach(tr => tr.stop());
}

/** Idle state for an instrument canvas: a faint baseline and a caption until live data arrives. */
function idleCanvas(cv, text) {
  if (!cv) return;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = 'rgba(51, 225, 237, .25)';
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  ctx.moveTo(0, cv.height / 2);
  ctx.lineTo(cv.width, cv.height / 2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#7fa0a6';
  ctx.font = '13px "Rethink Sans", "Noto Nastaliq Urdu", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(text, cv.width / 2, cv.height / 2 - 10);
}

  if (AC.state === 'suspended') AC.resume();
  return AC;
}

    [-1, 1, 1, 1, 1, 1, 2, 2, 2, 2, 4, 4, 4, 4, 4, 6, 6, 6, 6, 7, 8, 8, 9, 9, 10, 12, 12, 12, 13, 14, 15, 16, 17, 18, 19, 19, 20, 21, 22, 24, 25],

  function gfMultiply(x, y) {

      result.splice(1, 0, pos);

  function drawFinder(grid, cx, cy) {
    for (let dy = -4; dy <= 4; dy++) {
      for (let dx = -4; dx <= 4; dx++) {
        const x = cx + dx;
        const y = cy + dy;
        if (x < 0 || y < 0 || x >= grid.size || y >= grid.size) {

      score += linePenalty(modules.map(row => row[y]));

    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        if (modules[y][x]) {
          dark++;
        }
        if (x + 1 < size && y + 1 < size) {
          const c = modules[y][x];
          if (c === modules[y][x + 1] && c === modules[y + 1][x] && c === modules[y + 1][x + 1]) {
            score += 3;
          }
        }

        }
      });
    }
    const codewords = addEccAndInterleave(buildCodewords(segment, version, ecl), version, ecl);
    const grid = makeGrid(version * 4 + 17);
    drawFunctionPatterns(grid, version, ecl);
    drawCodewords(grid, codewords);
    let chosen = mask;
    if (chosen < 0) {
      let best = Infinity;
      for (let m = 0; m < 8; m++) {
        applyMask(grid, m);
        drawFormatBits(grid, ecl, m);
        const score = penaltyScore(grid);
        if (score < best) {
          best = score;
          chosen = m;
        }
        applyMask(grid, m);
      }
    }
    applyMask(grid, chosen);
    drawFormatBits(grid, ecl, chosen);
    const eccName = Object.keys(ECL).find(k => ECL[k] === ecl);
    return { version, size: grid.size, ecc: eccName, mask: chosen, mode: segment.mode, modules: grid.modules };
  }

  /* ---------- public: render ---------- */

  // One SVG path for all dark modules; scales cleanly and prints sharply
  function toSvg(input, options = {}) {
    const qr = typeof input === 'string' ? encode(input, options) : input;
    const { border = 4, dark = '#000', light = '#fff', label = 'QR code' } = options;
    const dim = qr.size + border * 2;
    const parts = [];
    for (let y = 0; y < qr.size; y++) {
      for (let x = 0; x < qr.size; x++) {
        if (qr.modules[y][x]) {
          parts.push(`M${x + border},${y + border}h1v1h-1z`);
        }
      }
    }
    const safeLabel = String(label).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${dim} ${dim}" role="img" aria-label="${safeLabel}" shape-rendering="crispEdges">`
      + `<rect width="100%" height="100%" fill="${light}"/>`
      + `<path d="${parts.join('')}" fill="${dark}"/></svg>`;
  }

  // Draw onto a canvas (for PNG download or printing at a fixed size)
  function toCanvas(input, canvas, options = {}) {
    const qr = typeof input === 'string' ? encode(input, options) : input;
    const { border = 4, scale = 8, dark = '#000', light = '#fff' } = options;
    const dim = (qr.size + border * 2) * scale;
    canvas.width = dim;
    canvas.height = dim;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = light;
    ctx.fillRect(0, 0, dim, dim);
    ctx.fillStyle = dark;
    for (let y = 0; y < qr.size; y++) {
      for (let x = 0; x < qr.size; x++) {
        if (qr.modules[y][x]) {
          ctx.fillRect((x + border) * scale, (y + border) * scale, scale, scale);
        }
      }
    }
    return canvas;
  }

  return { encode, toSvg, toCanvas };
})();

// ---------- crypto: ECDSA P-256 signed certificates, field digests, salted IMEI hashes ----------
const hasCrypto = () => !!(window.crypto && crypto.subtle);
const enc = new TextEncoder();
const dec = new TextDecoder();

function b64u(bytes) {
  let s = '';
  const b = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
  for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function unb64u(s) {
  const clean = String(s).replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(clean + '==='.slice((clean.length + 3) % 4));
  return Uint8Array.from(bin, c => c.charCodeAt(0));
}
const hex = bytes => [...new Uint8Array(bytes)].map(b => b.toString(16).padStart(2, '0')).join('');

async function sha256(data) {
  const bytes = typeof data === 'string' ? enc.encode(data) : data;
  return new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
}

/** Deterministic JSON: object keys sorted at every level, so the same certificate always hashes the same. */
function canon(v) {
  if (v === null || typeof v !== 'object') return JSON.stringify(v ?? null);
  if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  return '{' + Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
}

// ---------- shop keys ----------
const EC = { name: 'ECDSA', namedCurve: 'P-256' };
const SIG = { name: 'ECDSA', hash: 'SHA-256' };

async function kidOf(rawPub) {
  return hex(await sha256(rawPub)).slice(0, 16);
}

/** New signing key for this shop. The private key is kept as a JWK in localStorage (see the TODO below). */
async function generateShopKey() {
  const pair = await crypto.subtle.generateKey(EC, true, ['sign', 'verify']);
  const raw = new Uint8Array(await crypto.subtle.exportKey('raw', pair.publicKey));
  // TODO(student): keep the private key non-extractable in IndexedDB (or behind a passkey / hardware token) instead of a JWK in localStorage.
  const jwk = await crypto.subtle.exportKey('jwk', pair.privateKey);
  return { kid: await kidOf(raw), pub: b64u(raw), jwk, created: now() };
}

const keyCache = new Map();

async function importPub(pubB64) {
  if (!keyCache.has(pubB64)) keyCache.set(pubB64, await crypto.subtle.importKey('raw', unb64u(pubB64), EC, false, ['verify']));
  return keyCache.get(pubB64);
}

async function importPriv(jwk) {
  return crypto.subtle.importKey('jwk', jwk, EC, false, ['sign']);
}

async function signText(text, jwk) {
  const sig = await crypto.subtle.sign(SIG, await importPriv(jwk), enc.encode(text));
  return b64u(new Uint8Array(sig));
}

async function verifyText(text, sigB64, pubB64) {
  try {
    return await crypto.subtle.verify(SIG, await importPub(pubB64), unb64u(sigB64), enc.encode(text));
  } catch {
    return false;
  }
}

// ---------- certificate digests ----------
// Field groups: each gets a 2-byte digest in the QR, so a verifier can point at WHICH part was edited.
const FIELD_GROUPS = [
  ['id', ['v', 'serial']],
  ['dates', ['issued', 'expires']],
  ['issuer', ['shop', 'tester']],
  ['device', ['device']],
  ['imei', ['imei']],
  ['tests', ['tests', 'counts', 'evidence']],
  ['battery', ['battery']],
  ['grade', ['grade', 'score']],
  ['value', ['value']],
  ['notes', ['notes']],
];
const pick = (o, keys) => Object.fromEntries(keys.map(k => [k, o[k] ?? null]));

async function groupDigests(doc) {
  const out = [];
  for (const [, keys] of FIELD_GROUPS) out.push(hex(await sha256(canon(pick(doc, keys)))).slice(0, 4));
  return out.join('');
}

async function docHash(doc) {
  return b64u(await sha256(canon(doc)));
}

/** Short human share code from the document hash: MR-XXXX-XXXX in Crockford base32. */
function shareCode(hashB64) {
  const bytes = unb64u(hashB64);
  const alphabet = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
  let bits = 0;
  let acc = 0;
  let out = '';
  for (let i = 0; out.length < 8 && i < bytes.length; i++) {
    acc = (acc << 8) | bytes[i];
    bits += 8;
    while (bits >= 5 && out.length < 8) {
      out += alphabet[(acc >> (bits - 5)) & 31];
      bits -= 5;
    }
  }
  return `MR-${out.slice(0, 4)}-${out.slice(4)}`;
}

// ---------- QR payload: MRMT1|serial|kid|docHash|groupDigests|signature (signature covers everything before it) ----------
async function buildManifest(doc) {
  return ['MRMT1', doc.serial, doc.shop.kid, await docHash(doc), await groupDigests(doc)].join('|');
}

async function signCertificate(doc, shopKey) {
  const manifest = await buildManifest(doc);
  const sig = await signText(manifest, shopKey.jwk);
  return manifest + '|' + sig;
}

function parsePayload(text) {
  const p = String(text || '').trim().split('|');
  if (p.length !== 6 || p[0] !== 'MRMT1') return null;
  const [, serial, kid, hash, digests, sig] = p;
  if (!/^[0-9a-f]{16}$/.test(kid) || !/^[0-9a-f]{40}$/.test(digests) || hash.length !== 43 || sig.length < 80) return null;
  return { serial, kid, hash, digests, sig, manifest: p.slice(0, 5).join('|') };
}

/**
 * Verify a QR payload against the trusted directory and, when available, the certificate document.
 * Returns every check separately so the UI can explain the verdict.
 */
async function verifyCertificate(payloadText, doc = null) {
  const p = parsePayload(payloadText);
  const r = { format: !!p, serial: p?.serial, kid: p?.kid, issuer: null, sigOk: false, trusted: false, revoked: false,
    hashOk: null, groups: [], docMatchesQr: null, expired: false, verdict: 'invalid' };
  if (!p) return r;
  r.issuer = S.trust.find(k => k.kid === p.kid) || null;
  r.trusted = !!r.issuer && r.issuer.status !== 'revoked';
  r.revoked = r.issuer?.status === 'revoked' || S.revoked.some(x => x.serial === p.serial && x.kid === p.kid);
  if (r.issuer) r.sigOk = await verifyText(p.manifest, p.sig, r.issuer.pub);
  if (doc) await compareDoc(r, p, doc);
  r.verdict = verdictOf(r, doc);
  return r;
}

async function compareDoc(r, p, doc) {
  r.hashOk = (await docHash(doc)) === p.hash;
  r.docMatchesQr = doc.serial === p.serial && doc.shop?.kid === p.kid;
  const got = await groupDigests(doc);
  r.groups = FIELD_GROUPS.map(([id], i) => ({ id, ok: got.slice(i * 4, i * 4 + 4) === p.digests.slice(i * 4, i * 4 + 4) }));
  r.expired = Date.parse(doc.expires) < now();
}

function verdictOf(r, doc) {
  if (!r.format) return 'invalid';
  if (!r.issuer) return 'untrusted';
  if (!r.sigOk) return 'forged';
  if (r.revoked) return 'revoked';
  if (doc && (!r.hashOk || !r.docMatchesQr)) return 'tampered';
  if (!doc) return 'qronly';
  if (r.expired) return 'expired';
  return 'valid';
}

// ---------- share bundle: the document and its QR payload as one pasteable text ----------
const bundleOf = cert => 'MRMT1B.' + b64u(enc.encode(JSON.stringify({ doc: cert.doc, qr: cert.qr })));

function parseBundle(text) {
  const s = String(text || '').trim();
  try {
    if (s.startsWith('MRMT1B.')) return JSON.parse(dec.decode(unb64u(s.slice(7))));
    if (s.startsWith('{')) {
      const o = JSON.parse(s);
      if (o.doc && o.qr) return { doc: o.doc, qr: o.qr };
    }
  } catch {
    return null;
  }
  return null;
}

// ---------- trusted shop key cards: MRMTKEY1|name|city|publicKey ----------
const keyCardOf = k => ['MRMTKEY1', k.name, k.city, k.pub].join('|');

async function parseKeyCard(text) {
  const p = String(text || '').trim().split('|');
  if (p.length !== 4 || p[0] !== 'MRMTKEY1') return null;
  try {
    await importPub(p[3]);
  } catch {
    return null;
  }
  return { name: p[1], city: p[2], pub: p[3], kid: await kidOf(unb64u(p[3])) };
}

// ---------- device passport key: salted, slow hash of the IMEI (never store the IMEI itself) ----------
const PASSPORT_SALT = 'marammat-passport-v1';
const imeiHashCache = new Map();

async function imeiHash(imei) {
  const digits = String(imei).replace(/\D/g, '');
  if (imeiHashCache.has(digits)) return imeiHashCache.get(digits);
  const base = await crypto.subtle.importKey('raw', enc.encode(digits), 'PBKDF2', false, ['deriveBits']);
  // TODO(student): IMEIs are only ~10^6 per TAC, so a public salt can be brute-forced; use a per-shop secret (HMAC) or a server-side pepper.
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(PASSPORT_SALT), iterations: 60000, hash: 'SHA-256' }, base, 128);
  const h = hex(bits);
  imeiHashCache.set(digits, h);
  return h;
}
const maskImei = imei => (imei && imei.length >= 6 ? imei.slice(0, 2) + 'x'.repeat(imei.length - 6) + imei.slice(-4) : '');

function seedSessionFrom(spec, imei) {
  const m = modelById(spec.model);
  const s = newSession({ demo: true });
  for (const id of Object.keys(CHECKS)) s.checks[id] = { s: spec.set?.[id] || 'pass', mode: 'manual', at: now() };
  s.claimed = { brand: m.brand, modelId: m.id, storage: spec.gb, ram: spec.ram, colour: spec.colour, os: m.brand === 'Apple' ? 'iOS 18' : 'Android 14' };
  s.imei = { imei1: imei, imei2: '', box: spec.box ? 'match' : 'nobox', pta: spec.pta, locks: 'removed' };
  s.physical.body = spec.body;
  s.battery = { health: spec.bat || '', cycles: '', source: spec.bat ? 'settings' : 'unknown' };

  s.extras = { box: !!spec.box, charger: !!spec.charger, cable: !!spec.charger, warranty: 0, notes: spec.notes || '' };

}

async function seedCertificates(keys) {
  const certs = [];
  const revoked = [];
  // Serial numbers follow issue order, oldest first.
  const ordered = [...SEED_CERTS].sort((a, b) => b.days - a.days);
  for (const [seq, spec] of ordered.entries()) {
    const imei = makeImei(spec.tac, spec.sn);
    const sess = seedSessionFrom(spec, imei);
    const key = spec.shop === 'mine' ? keys.mine : keys[spec.shop];
    const issued = now() - spec.days * DAY - (seq % 5) * 37 * MIN;
    const doc = await buildCertDoc(sess, { serial: serialFor(issued, 41 + seq), issued, shop: key.shop, kid: key.kid });
    const qr = await signCertificate(doc, key);
    certs.push({ id: spec.id, doc, qr, issuedAt: issued, mine: spec.shop === 'mine', demo: true });
    if (spec.revoked) revoked.push({ id: 'r-' + spec.id, serial: doc.serial, kid: key.kid, at: issued + 2 * DAY, reason: 'Re-issued after the vibration motor was replaced', demo: true });
  }
  return { certs: certs.reverse(), revoked };
}

  }
  return { keys, trust, shopKey: mine };
}
