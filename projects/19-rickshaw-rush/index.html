// polyline chart with area fill; the path draws itself in via drawPath()
function svgLine(values, color = '#2ed3f0') {
  const w = 320;
  const h = 120;
  const pad = 8;
  if (values.length < 2) return `<svg viewBox="0 0 ${w} ${h}"><text x="${w / 2}" y="${h / 2}" fill="#c9b7e4" font-size="12" text-anchor="middle">${t('noRuns')}</text></svg>`;
  const max = Math.max(...values, 1);
  const pts = values.map((v, i) => [pad + (w - pad * 2) * i / (values.length - 1), h - pad - (h - pad * 2) * v / max]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = `${d} L${pts[pts.length - 1][0].toFixed(1)} ${h - pad} L${pad} ${h - pad} Z`;
  const grid = [0, .5, 1].map(f => `<line x1="${pad}" x2="${w - pad}" y1="${h - pad - (h - pad * 2) * f}" y2="${h - pad - (h - pad * 2) * f}" stroke="#4a2a78" stroke-dasharray="3 4"/>`).join('');
  const dots = pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="${color}"/>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" role="img">${grid}<path d="${area}" fill="${color}" opacity=".12"/><path class="line" d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}
    <text x="${pad}" y="${pad + 2}" fill="#c9b7e4" font-size="10">${nf.format(max)}</text></svg>`;
}

function svgBars(values, labels, color = '#ffd23f') {
  const w = 320;
  const h = 120;
  const pad = 8;
  if (!values.length) return `<svg viewBox="0 0 ${w} ${h}"><text x="${w / 2}" y="${h / 2}" fill="#c9b7e4" font-size="12" text-anchor="middle">${t('noRuns')}</text></svg>`;
  const max = Math.max(...values, 1);
  const bw = (w - pad * 2) / values.length;
  const bars = values.map((v, i) => {
    const bh = (h - pad * 2 - 14) * v / max;
    const x = pad + i * bw + bw * .15;
    return `<rect class="fill" x="${x.toFixed(1)}" y="${(h - pad - 14 - bh).toFixed(1)}" width="${(bw * .7).toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${color}"/>
      <text x="${(x + bw * .35).toFixed(1)}" y="${h - 2}" fill="#c9b7e4" font-size="9" text-anchor="middle">${labels[i]}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" role="img">${bars}<text x="${pad}" y="${pad + 2}" fill="#c9b7e4" font-size="10">${km(max)}</text></svg>`;
}

function svgDonut(parts) {
  const total = parts.reduce((a, p) => a + p.v, 0);
  if (!total) return `<svg viewBox="0 0 120 120"><text x="60" y="64" fill="#c9b7e4" font-size="11" text-anchor="middle">${t('noRuns')}</text></svg>`;
  const r = 44;
  const circ = 2 * Math.PI * r;
  let offset = 0;
  const arcs = parts.map(p => {
    const len = circ * p.v / total;
    const el = `<circle cx="60" cy="60" r="${r}" fill="none" stroke="${p.c}" stroke-width="18" stroke-dasharray="${len.toFixed(1)} ${(circ - len).toFixed(1)}" stroke-dashoffset="${(-offset).toFixed(1)}" transform="rotate(-90 60 60)"/>`;
    offset += len;
    return el;
  }).join('');
  return `<svg viewBox="0 0 120 120" role="img" style="max-width:150px;margin:0 auto">${arcs}<text x="60" y="64" fill="#fff3dc" font-size="16" font-family="Righteous" text-anchor="middle">${total}</text></svg>`;
}

const CAUSE_COLORS = { bus: '#ff2e88', car: '#2ed3f0', pickup: '#ffd23f', bike: '#3ddc84', cart: '#c9a23b', cow: '#f1ebe0', barrier: '#ff7a1a', fuel: '#ff5c5c' };

function causeLabel(run) {
  if (run.reason === 'fuel') return t('fuelOut');
  const n = NAMES[run.crashType];
  return n ? (lang === 'ur' ? n[1] : n[0]) : run.reason;
}

function runRow(r) {
  const mode = `<span class="pillmode ${r.mode === 'daily' ? 'daily' : ''}">${r.mode === 'daily' ? t('dailyTab') : t('endless')}</span>`;
  const sample = r.seed ? ` <span class="pillmode">${t('sample')}</span>` : '';
  return `<tr class="${r.seed ? 'seed' : ''}"><td class="dt">${esc(r.date)}${sample}</td><td>${mode}</td><td class="num">${nf.format(r.score)}</td><td class="num">${km(r.dist)}</td><td class="num">${r.fares}</td><td class="num dt">${fmtDuration(r.dur)}</td><td>${esc(causeLabel(r))}</td></tr>`;
}

function runsTable(list, limit) {
  const rows = list.slice(0, limit).map(runRow).join('');
  return `<div class="tblwrap"><table class="tbl">
    <thead><tr><th class="dt">${t('dateCol')}</th><th>${t('mode')}</th><th class="num">${t('score')}</th><th class="num">${t('distance')}</th><th class="num">${t('fares')}</th><th class="num dt">${t('duration')}</th><th>${t('cause')}</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="7" class="muted" style="text-align:center;padding:18px">${t('noRuns')}</td></tr>`}</tbody></table></div>`;
}

function tripCharts(list) {
  const chrono = [...list].sort((a, b) => a.ts - b.ts);
  const last20 = chrono.slice(-20);
  const last12 = chrono.slice(-12);
  const causes = {};
  for (const r of list) {
    const key = r.reason === 'fuel' ? 'fuel' : r.crashType;
    causes[key] = (causes[key] || 0) + 1;
  }
  const parts = Object.entries(causes).map(([k, v]) => ({ k, v, c: CAUSE_COLORS[k] || '#c9b7e4' })).sort((a, b) => b.v - a.v);
  const legend = parts.map(p => `<span><i style="background:${p.c}"></i>${esc(causeLabel({ reason: p.k === 'fuel' ? 'fuel' : 'crash', crashType: p.k }))} · ${p.v}</span>`).join('');
  const laneSum = [0, 0, 0];
  for (const r of list) {
    (r.lanes || [1 / 3, 1 / 3, 1 / 3]).forEach((v, i) => { laneSum[i] += v; });
  }
  const laneTotal = laneSum.reduce((a, b) => a + b, 0) || 1;
  const laneRows = [t('left'), t('centre'), t('right')].map((name, i) => {
    const pct = Math.round(laneSum[i] / laneTotal * 100);
    return `<span>${name}</span><div class="bar"><i class="fill" style="width:${pct}%"></i></div><span>${pct}%</span>`;
  }).join('');
  return `<div class="charts">
    <div class="chartbox"><h4>${t('scoreTrend')}</h4>${svgLine(last20.map(r => r.score))}</div>
    <div class="chartbox"><h4>${t('distPerRun')}</h4>${svgBars(last12.map(r => r.dist), last12.map(r => r.date.slice(8)))}</div>
    <div class="chartbox"><h4>${t('crashCauses')}</h4>${svgDonut(parts)}<div class="legend">${legend}</div></div>
    <div class="chartbox"><h4>${t('laneUsage')}</h4><div class="lanebars">${laneRows}</div></div>
  </div>`;
}

function renderTrips() {
  const list = visibleRows(RUNS);
  const avg = list.length ? Math.round(list.reduce((a, r) => a + r.score, 0) / list.length) : 0;
  const total = list.reduce((a, r) => a + r.dist, 0);

  const actions = `<span class="rowc"><a class="btn ghost sm" href="#report">${ic('printer')}${t('printReport')}</a><button class="btn ghost sm" id="clearRuns" ${list.length ? '' : 'disabled'}>${ic('trash')}${t('clearHistory')}</button></span>`;
  $('#tripsBody').innerHTML = `${head(t('trips'), actions)}<p class="lead">${t('tripsLead')}</p>
    <div class="kpis four stagger" style="margin-top:12px">
      ${kpiTile(t('runs'), list.length, 'tripRuns')}${kpiTile(t('totalDist'), km(total))}${kpiTile(t('avgScore'), nf.format(avg), 'tripAvg')}${kpiTile(t('best'), nf.format(best), 'tripBest')}
    </div>
    <div class="sect" style="margin-top:14px">${t('stats')}</div>${tripCharts(list)}
    <div class="sect">${t('recentRuns')}</div>${runsTable(list, 15)}`;
  countUp($('#tripRuns'), list.length);
  countUp($('#tripAvg'), avg);

  $('#clearRuns').onclick = () => {

}

// ===================================================================
// 10. modules — onboarding tour (spotlight steps over the menu)
// ===================================================================
const TOUR_STEPS = [
  { sel: '#menuPlay', k: 1 }, { sel: '#menuDaily', k: 2 }, { sel: '#menuPractice', k: 3 }, { sel: '#menuGarage', k: 4 },
  { sel: '#menuGoalsBtn', k: 5 }, { sel: '#menuInbox', k: 6 }, { sel: '#langBtn', k: 7 },
];
let tourStep = -1;

function positionTour() {
  const stepDef = TOUR_STEPS[tourStep];
  const target = $(stepDef.sel);
  if (!target) return endTour();
  target.scrollIntoView({ block: 'center', behavior: 'instant' });
  const r = target.getBoundingClientRect();
  const spot = $('#tourSpot');
  spot.style.left = (r.left - 6) + 'px';
  spot.style.top = (r.top - 6) + 'px';
  spot.style.width = (r.width + 12) + 'px';
  spot.style.height = (r.height + 12) + 'px';

  const tip = $('#tourTip');
  const tipH = tip.offsetHeight || 150;
  const below = r.bottom + 14 + tipH < innerHeight;
  tip.style.top = (below ? r.bottom + 14 : Math.max(10, r.top - tipH - 14)) + 'px';
  tip.style.left = clamp(r.left + r.width / 2 - tip.offsetWidth / 2, 12, innerWidth - tip.offsetWidth - 12) + 'px';
}

function showTourStep(i) {
  tourStep = i;
  const k = TOUR_STEPS[i].k;
  $('#tourTitle').textContent = t('tourT' + k);
  $('#tourText').textContent = t('tourB' + k);
  $('#tourSteps').textContent = t('stepOf', `${i + 1} / ${TOUR_STEPS.length}`);
  $('#tourBack').textContent = t('prev');
  $('#tourSkip').textContent = t('skip');
  $('#tourNext').textContent = i === TOUR_STEPS.length - 1 ? t('finish') : t('next');
  $('#tourBack').style.visibility = i === 0 ? 'hidden' : 'visible';
  positionTour();
  $('#tourNext').focus();
}

function startTour() {
  if (location.hash && location.hash !== '#menu') return;
  $('#tour').classList.add('on');
  showTourStep(0);
}

function endTour() {
  $('#tour').classList.remove('on');
  tourStep = -1;
  store.set('tourDone', true);
}

$('#tourNext').onclick = () => (tourStep >= TOUR_STEPS.length - 1 ? endTour() : showTourStep(tourStep + 1));
$('#tourBack').onclick = () => showTourStep(Math.max(0, tourStep - 1));
$('#tourSkip').onclick = endTour;
addEventListener('resize', () => { if (tourStep >= 0) positionTour(); });

// 11. input & run control
// ===================================================================
function startRun(daily, practice = false) {
  resetRun(daily, practice);
  G.mode = 'play';
  G.paused = false;
  resetHUD();
  $('#hud').classList.remove('hidden');
  $('#hint').innerHTML = ic('hand') + ' ' + (touchDevice() ? t('hint') : t('hintKb'));
  $('#hint').style.opacity = 1;
  $('#hint').classList.remove('hidden');
  show(null);
  if (tourStep >= 0) endTour();
  audioInit();
  engineOn(true);
  last = 0;
}

function pause() {
  if (G.mode !== 'play' || G.paused) return;
  G.paused = true;
  $('#pauseSound').checked = P.settings.sound;
  $('#s-pause').classList.add('on');
  animateIn($('#s-pause .panel'));
  engineOn(false);
  $('#btnResume').focus();
}

function resume() {
  if (!G.paused) return;
  G.paused = false;
  $('#s-pause').classList.remove('on');
  last = 0;
  engineOn(true);
}

function leavePlay() {
  G.mode = 'attract';
  G.paused = false;
  G.practice = false;
  G.objs = [];
  G.timeScale = 1;
  G.shake = 0;
  engineOn(false);
  $('#hud').classList.add('hidden');
  $('#hint').classList.add('hidden');
  $('#s-over').classList.remove('on');
  $('#s-pause').classList.remove('on');
}

function moveLane(dir) {
  if (G.mode !== 'play' || G.paused) return;
  G.lane = clamp(G.lane + dir, 0, 2);
}

$('#btnResume').onclick = resume;
$('#btnRestart').onclick = () => startRun(G.daily, G.practice);
$('#btnQuit').onclick = () => { location.hash = '#menu'; };
$('#pauseSound').onchange = e => {
  P.settings.sound = e.target.checked;
  saveP();
  if (e.target.checked) audioInit();
};
$('#hPause').onclick = pause;

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;
  const k = e.key.toLowerCase();
  audioInit();
  if (tourStep >= 0) {
    if (k === 'escape') endTour();
    return;
  }
  if (k === 'arrowleft' || k === 'a') {
    moveLane(-1);
    e.preventDefault();
  } else if (k === 'arrowright' || k === 'd') {
    moveLane(1);
    e.preventDefault();
  } else if (k === 'arrowup' || k === 'w' || k === ' ') {
    if (G.mode === 'play') {
      honk();
      e.preventDefault();
    }
  } else if (k === 'p' || k === 'escape') {
    if (G.mode === 'play') G.paused ? resume() : pause();
  } else if (k === '?' && G.mode !== 'play') {
    location.hash = '#settings';
  }
  if (G.mode === 'play' && !engine) engineOn(true);
});

// touch / mouse: swipe to change lane, tap a half (if enabled), tap the top band to honk
let pointerDown = null;
frame.addEventListener('pointerdown', e => {
  if (e.target.closest('.pause')) return;
  pointerDown = { x: e.clientX, y: e.clientY };
  audioInit();
  if (G.mode === 'play' && !engine) engineOn(true);
});
frame.addEventListener('pointerup', e => {
  if (!pointerDown) return;
  const dx = e.clientX - pointerDown.x;
  const dy = e.clientY - pointerDown.y;
  pointerDown = null;
  if (G.mode !== 'play' || G.paused) return;
  const r = frame.getBoundingClientRect();
  if (Math.abs(dx) > 28 && Math.abs(dx) > Math.abs(dy)) return moveLane(Math.sign(dx));
  if (Math.abs(dy) > 40) return honk();
  if (e.clientY - r.top < r.height * .28) return honk();
  if (P.settings.controls === 'swipe') return;
  moveLane(e.clientX - r.left < r.width / 2 ? -1 : 1);
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
addEventListener('resize', resize);

// ===================================================================
// 11. loop — fixed-timestep physics (120 Hz), rAF render
// ===================================================================
const STEP = 1 / 120;
let last = 0;
let acc = 0;

function loop(now) {
  requestAnimationFrame(loop);
  if (!last) last = now;
  const elapsed = Math.min(.1, (now - last) / 1000);
  last = now;
  RDT = elapsed || 1 / 60;
  acc += elapsed;
  let n = 0;
  while (acc >= STEP && n < 12) {
    step(STEP * G.timeScale, STEP);
    acc -= STEP;
    n++;
  }
  if (n === 12) acc = 0;
  engineTick();
  render();
  updateHUD();
}

// ===================================================================
// 11. router, preferences, language
// ===================================================================
const RENDERERS = { menu: renderMenu, garage: renderGarage, board: renderBoard, daily: renderDaily, goals: renderGoals, inbox: renderInbox, trips: renderTrips, report: renderReport, settings: renderSettings, about: renderAbout };

function route() {
  const h = location.hash.slice(1) || 'menu';
  if (h === 'play' || h === 'play-daily' || h === 'play-practice') {
    return startRun(h === 'play-daily', h === 'play-practice');
  }
  if (G.mode !== 'attract') leavePlay();
  if (tourStep >= 0 && h !== 'menu') endTour();
  const name = SCREENS.includes(h) ? h : 'menu';
  RENDERERS[name]();
  show(name);
}

function applyPrefs() {
  document.documentElement.classList.toggle('reduce', P.settings.reduce);
  $('#hud').classList.toggle('large', P.settings.hud === 'large');
}

function setLang(l) {
  lang = l;
  P.settings.lang = l;
  saveP();
  document.documentElement.lang = l;
  $$('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $('#langBtn span').textContent = l === 'en' ? 'اردو' : 'English';
  resetHUD();
  route();
  if (tourStep >= 0) showTourStep(tourStep);
}

$('#langBtn').onclick = () => setLang(lang === 'en' ? 'ur' : 'en');
addEventListener('hashchange', route);

// ---------- boot ----------
resize();
applyPrefs();
resetRun(false);
G.mode = 'attract';
G.speed = 13;
ensureInbox();
ensureDailyNotice();
setLang(lang);
requestAnimationFrame(loop);
if (!store.get('tourDone', false) && (location.hash === '' || location.hash === '#menu')) {
  setTimeout(() => { if (G.mode === 'attract') startTour(); }, 900);
}

// ===================================================================
// 11. test hooks (used by the Playwright harness; harmless in production)
// ===================================================================
window.game = {
  G, P, step, render, start: startRun, pause, resume, spawnWave, moveLane, honk, startTour, endTour, notify, updateGoals, runSummary,

  // three waves of traffic placed close to the player, for screenshots
  demoTraffic() {
    for (const z of [70, 170, 280]) {
      const n = G.objs.length;
      spawnWave();
      for (let i = n; i < G.objs.length; i++) {
        G.objs[i].z -= (FAR - PD) - z;
      }
    }
    render();
  },

  forceGameOver(reason = 'crash') {
    if (G.mode !== 'play') startRun(false);
    G.score = Math.max(G.score, 1234);
    G.dist = Math.max(G.dist, 870);
    G.coins += 12;
    G.fareRs += 240;
    G.fares += 2;
    G.near += 3;
    if (reason === 'fuel') endFuel();
    else crash(G.objs.find(o => o.crash) || add('bus', 1, 0, 0));
    G.timeScale = 1;
    finishRun();
  },

  // Headless stress check: fixed-step simulation with random lane changes and honks.
  simulate(seconds = 60, o = {}) {
    const dt = o.dt || STEP;
    const n = Math.round(seconds / dt);
    const t0 = performance.now();
    const errors = [];
    let crashes = 0, maxStep = 0, maxRender = 0, physMs = 0, lanes = 0, honks = 0, totalDist = 0;
    if (G.mode !== 'play') startRun(!!o.daily, !!o.practice);
    for (let i = 0; i < n; i++) {
      try {
        if (o.randomLanes !== false && Math.random() < dt * 1.6) {
          moveLane(Math.random() < .5 ? -1 : 1);
          lanes++;
        }
        if (o.randomLanes !== false && Math.random() < dt * .3) {
          honk();
          honks++;
        }
        const s0 = performance.now();
        step(dt * G.timeScale, dt);
        const stepMs = performance.now() - s0;
        maxStep = Math.max(maxStep, stepMs);
        physMs += stepMs;
        if (G.mode === 'over' && G.overShown) {
          crashes++;
          totalDist += G.dist;
          startRun(!!o.daily, !!o.practice);
        }
        if (i % (o.every || 10) === 0) {
          const r0 = performance.now();
          render();
          updateHUD();
          maxRender = Math.max(maxRender, performance.now() - r0);
        }
      } catch (e) {
        errors.push(String(e && e.stack || e));
        if (errors.length > 5) break;
      }
    }
    return {
      steps: n, dt, fixedStep: true, seconds, crashes, laneChanges: lanes, honks, errors,
      maxStepMs: +maxStep.toFixed(2), avgStepMs: +(physMs / n).toFixed(3), maxRenderMs: +maxRender.toFixed(1),
      totalMs: Math.round(performance.now() - t0), objs: G.objs.length, wallFixes: G.wallFixes, dist: Math.round(totalDist + G.dist), waves: G.waves, mode: G.mode,
    };
  },
};
</script>
</body>
