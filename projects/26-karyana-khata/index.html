// Sales are most of the stored bytes, and every file:// page shares one storage quota,
// so they are persisted as compact arrays and expanded again on load.
const SALE_FIELDS = ['id', 'no', 'ts', 'by', 'subP', 'discP', 'roundP', 'totalP', 'method', 'cashP', 'walletP', 'creditP', 'tenderedP', 'changeP', 'custId', 'ref'];
const packSale = s => [...SALE_FIELDS.map(f => s[f]), s.lines.flatMap(l => [l.itemId, l.qty, l.priceP, l.amountP, l.costP]), s.voided || 0];

function unpackSale(a) {
  if (!Array.isArray(a)) return a;
  const s = {};
  SALE_FIELDS.forEach((f, i) => (s[f] = a[i]));
  const flat = a[SALE_FIELDS.length];
  s.lines = [];
  for (let i = 0; i < flat.length; i += 5) s.lines.push({ itemId: flat[i], qty: flat[i + 1], priceP: flat[i + 2], amountP: flat[i + 3], costP: flat[i + 4] });
  if (a[SALE_FIELDS.length + 1]) s.voided = a[SALE_FIELDS.length + 1];
  return s;
}

function loadState() {
  const meta = store.get('meta', null);
  if (!meta || !Array.isArray(store.get('items', null))) return null;
  const st = { meta, settings: { ...DEFAULT_SETTINGS, ...store.get('settings', {}) } };
  for (const k of COLLECTIONS) st[k] = store.get(k, []);
  st.sales = st.sales.map(unpackSale);
  return st;
}

function persist(...keys) {
  // TODO(student): move the books to IndexedDB behind a service worker (installable PWA) so years of bills fit beyond the localStorage quota.
  const list = keys.length ? keys : ['meta', 'settings', ...COLLECTIONS];
  let ok = true;
  for (const k of list) ok = store.set(k, k === 'sales' ? S.sales.map(packSale) : S[k]) && ok;
  if (!ok) toast(t('err_storage'), 'bad');
  return ok;
}

// Every mutation goes through touch(): bumps the version, clears derived caches, saves.
function touch(...keys) {
  S.meta.ver++;
  memo.clear();
  persist('meta', ...keys);
}

const nid = p => p + (++S.meta.seq).toString(36);
const nm = o => (o ? (lang === 'ur' && o.ur ? o.ur : o.name) : '—');

function indexes() {
  return cached('idx', () => ({
    items: new Map(S.items.map(x => [x.id, x])),
    cust: new Map(S.customers.map(x => [x.id, x])),
    sup: new Map(S.suppliers.map(x => [x.id, x])),
    sales: new Map(S.sales.map(x => [x.id, x])),
  }));
}
const itemById = id => indexes().items.get(id);
const custById = id => indexes().cust.get(id);
const supById = id => indexes().sup.get(id);
const saleById = id => indexes().sales.get(id);

// ---------- per-day index of every money/stock document ----------
const EMPTY_DAY = Object.freeze({ sales: [], voids: [], ledger: [], sup: [], cash: [], adjust: [], purchases: [] });

function dayIdx() {
  return cached('dayIdx', () => {
    const m = new Map();
    const add = (ts, type, rec) => {
      const k = dkey(ts);
      if (!m.has(k)) m.set(k, { sales: [], voids: [], ledger: [], sup: [], cash: [], adjust: [], purchases: [] });
      m.get(k)[type].push(rec);
    };
    S.sales.forEach(s => {
      add(s.ts, 'sales', s);
      if (s.voided) add(s.voided.ts, 'voids', s);
    });
    S.ledger.forEach(e => add(e.ts, 'ledger', e));
    S.supLedger.forEach(e => add(e.ts, 'sup', e));
    S.cash.forEach(e => add(e.ts, 'cash', e));
    S.adjust.forEach(e => add(e.ts, 'adjust', e));
    S.purchases.forEach(e => add(e.ts, 'purchases', e));
    return m;
  });
}
const dayRecs = key => dayIdx().get(key) || EMPTY_DAY;

// ---------- roles and activity log ----------
const isOwner = () => role === 'owner';

function logAct(k, v = {}, kind = 'misc') {
  S.activity.unshift({ id: nid('a'), ts: Date.now(), by: role, kind, k, v });
  if (S.activity.length > 800) S.activity.length = 800;
}

function actText(a) {
  const v = { ...a.v };
  const it = v.item ? itemById(v.item) : null;
  if (typeof v.q === 'number' && it) v.q = qtyStr(it.unit, v.q);
  if (v.item) v.item = it ? nm(it) : v.itemName || '';
  if (v.day) v.day = fmtDay(v.day);
  if (v.m) v.m = t('pm_' + v.m);
  if (v.k2) v.k2 = t('ck_' + v.k2);
  if (v.reason2) v.reason2 = t('vr_' + v.reason2);
  if (v.cust) v.cust = custById(v.cust) ? nm(custById(v.cust)) : v.custName || '';
  if (v.sup) v.sup = supById(v.sup) ? nm(supById(v.sup)) : '';
  for (const k of ['amt', 'amt2']) if (typeof v[k] === 'number') v[k] = rs(v[k]);
  if (v.reason) v.reason = t('adj_' + v.reason);
  if (v.cat) v.cat = t('ex_' + v.cat);
  return t(a.k, v);
}

// ---------- seed: a deterministic 60-day simulation of one shop ----------
// Every seeded record is produced by the same domain functions the UI uses
// (postSale, postPurchase, addLedger, postAdjust, addCash, closeDayCore), so the
// demo books reconcile exactly like real ones.
const BILLS_PER_DAY = 36;
const LINES_PER_BILL = 2.2;
const popWeight = p => Math.pow(p, 1.7);
const pickW = (r, vals, weights) => {
  let x = r() * sum(weights);
  for (let i = 0; i < vals.length; i++) if ((x -= weights[i]) < 0) return vals[i];
  return vals[vals.length - 1];
};

// Typical quantities a customer asks for, in base units.
function qtyChoices(it) {
  const price = it.sellP / 100;
  if (it.unit === 'kg') {
    if (/^Atta/.test(it.name)) return [1000, 2000, 5000, 5000, 10000];
    if (/^Cheeni/.test(it.name)) return [500, 1000, 1000, 2000, 5000];
    if (price >= 1500) return [50, 100, 100, 250];
    if (price >= 500) return [100, 250, 250, 500];
    return [250, 500, 1000, 1000, 2000];
  }
  if (it.unit === 'litre') return [250, 500, 1000, 1000];
  if (it.unit === 'dozen') return [6, 12, 12, 24, 6, 30];
  return price <= 20 ? [2, 3, 5, 10] : [1, 1, 1, 2, 3];
}

function roundBase(unit, b) {
  if (unit === 'kg' || unit === 'litre') return Math.max(250, Math.round(b / 250) * 250);
  if (unit === 'dozen') return Math.max(6, Math.round(b / 6) * 6);
  return Math.max(2, Math.ceil(b));
}

function makeSeedItem(row, i, r, totalW, start, t0) {
  const [name, ur, cat, unit, sell, cost, pack, pop, shelf, supIdx] = row;
  const sup = SEED_SUPPLIERS[supIdx];
  const it = { id: 'i' + String(i + 1).padStart(3, '0'), name, ur, cat, unit, sellP: sell * 100, lastCostP: cost * 100 };
  const choices = qtyChoices(it);
  const daily = BILLS_PER_DAY * LINES_PER_BILL * (popWeight(pop) / totalW) * (sum(choices) / choices.length);
  it.reorder = roundBase(unit, daily * (sup.leadDays + 1) * 1.3);
  it.pack = Math.round(pack * UNITS[unit].base);
  it.stock = roundBase(unit, it.reorder * (1.6 + r() * 1.8));
  it.poolP = lineAmount(it.lastCostP, it.stock, unit);
  it.openQty = it.stock;
  it.openCostP = it.poolP;
  it.expiry = shelf < 1000 ? addDays(start, Math.round(shelf * (0.4 + r() * 0.6))) : '';
  it.batches = [{ qty: it.stock, exp: it.expiry }];
  it.supId = 'sup' + (supIdx + 1);
  it.barcode = UNITS[unit].loose ? '' : eanWithCheck('896' + String(4100000 + i * 37).padStart(9, '0'));
  it.shelf = shelf;
  it.createdAt = t0;
  it.priceHist = [];
  return it;
}

function seedMasters(sim) {
  const { r, start } = sim;
  const t0 = dayStartOf(start);
  const totalW = sum(SEED_ITEMS, row => popWeight(row[7]));
  S.suppliers = SEED_SUPPLIERS.map((s, i) => ({ id: 'sup' + (i + 1), ...s, balanceP: 0, note: '', createdAt: t0 }));
  S.items = SEED_ITEMS.map((row, i) => makeSeedItem(row, i, r, totalW, start, t0));
  S.customers = SEED_CUSTOMERS.map((row, i) => ({ id: 'c' + (i + 1), name: row[0], ur: row[1], area: row[2], phone: row[3], limitP: row[4] * 100, balanceP: 0, lang: i % 6 === 3 ? 'en' : 'ur', note: '', createdAt: t0 }));
  SEED_CUSTOMERS.forEach((row, i) => (sim.profile['c' + (i + 1)] = row[5]));
  sim.drift = S.items.map(() => r() * 0.03);
  sim.weights = SEED_ITEMS.map(row => popWeight(row[7]));
  sim.baseCost = SEED_ITEMS.map(row => row[5] * 100);
  sim.bump = SEED_ITEMS.map(() => 0);
  memo.clear();
  seedOpeningBalances(sim, t0);
}

// Balances carried over from the old paper khata, dated before the books start.
function seedOpeningBalances(sim, t0) {
  const { r } = sim;
  const note = 'Carried from paper khata';
  S.customers.forEach(c => {
    const p = sim.profile[c.id];
    const plan = p === 'defaulter' ? [140, 115, 95] : p === 'slow' ? [80, 50] : p === 'monthly' ? [6] : [];
    const size = p === 'defaulter' ? 3500 : p === 'slow' ? 1800 : 1500;
    plan.forEach(back => addLedger({ custId: c.id, ts: t0 - back * DAY + 11 * HOUR, type: 'open', amountP: Math.round(size * (0.6 + r() * 0.8)) * 100, by: 'owner', note }));
  });
  S.suppliers.forEach(s => addSupEntry({ supId: s.id, ts: t0 - 3 * DAY + 12 * HOUR, type: 'open', amountP: Math.round(5000 + r() * 30000) * 100, by: 'owner', note }));
}

function seedPickItem(sim) {
  const total = sim.totalWeight || (sim.totalWeight = sum(sim.weights));
  let x = sim.r() * total;
  for (let i = 0; i < S.items.length; i++) if ((x -= sim.weights[i]) < 0) return S.items[i];
  return S.items[0];
}

function seedPickCustomer(sim) {
  const ids = S.customers.map(c => c.id);
  const w = ids.map(id => ({ monthly: 3, prompt: 3, slow: 2, defaulter: 0 }[sim.profile[id]]));
  return custById(pickW(sim.r, ids, w));
}

function seedPayment(sim, draft) {
  const { r } = sim;
  const { totalP } = billTotals(draft.lines, draft.discP);
  const x = r();
  if (x < 0.2) {
    const c = seedPickCustomer(sim);
    const over = c.balanceP + totalP > c.limitP;
    if (!over || (sim.profile[c.id] === 'slow' && r() < 0.35)) {
      draft.method = 'udhaar';
      draft.custId = c.id;
      draft.paidNowP = r() < 0.25 && totalP > 40000 ? Math.floor((totalP * (0.3 + r() * 0.3)) / 10000) * 10000 : 0;
      return;
    }
  }
  if (x > 0.91) draft.method = 'jazzcash';
  else if (x > 0.83) draft.method = 'easypaisa';
  else {
    draft.method = 'cash';
    const note = pickW(r, [0, 10000, 50000, 100000], [3, 3, 2, 2]);
    draft.tenderedP = note ? Math.ceil(totalP / note) * note : totalP;
  }
}

function seedBill(sim, ts) {
  const { r } = sim;
  const n = pickW(r, [1, 2, 3, 4, 5], [35, 30, 20, 10, 5]);
  const lines = [];
  const used = new Set();
  for (let i = 0; i < n; i++) {
    const it = seedPickItem(sim);
    const ch = qtyChoices(it);
    const q = ch[Math.floor(r() * ch.length)];
    if (used.has(it.id) || it.stock < q) continue;
    used.add(it.id);
    lines.push({ itemId: it.id, qty: q, priceP: it.sellP });
  }
  if (!lines.length) return;
  const h = new Date(ts).getHours();
  const draft = { ts, by: h >= 14 && h < 20 && r() < 0.55 ? 'helper' : 'owner', lines, discP: 0 };
  const sub = billTotals(lines).subP;
  if (sub > 150000 && r() < 0.3) draft.discP = Math.round((sub * 0.02) / 10000) * 10000;
  seedPayment(sim, draft);
  postSale(draft);
}

// Bills cluster in the morning and evening rush.
function billTime(r) {
  const slot = pickW(r, [8, 10, 12, 14, 16, 18, 20], [8, 16, 10, 8, 12, 22, 12]);
  return (slot + r() * 2) * HOUR;
}

function billCount(r, dow, dom) {
  const f = [1.2, 0.9, 0.95, 1, 1, 1.15, 1.1][dow] * (dom <= 7 ? 1.15 : 1);
  return Math.round(BILLS_PER_DAY * f * (0.85 + r() * 0.3));
}

// Drawer cash at a moment of a seeded day (opening + movements up to ts).
function simCashAt(key, ts) {
  memo.clear();
  return openingFor(key) + sum(cashMoves(key).filter(m => m.ts <= ts), m => m.amountP);
}

// Supplier visits: reorder whatever is near its level, priced with slow cost inflation.
function seedDeliveries(sim, key, t0) {
  S.suppliers.forEach((s, si) => {
    const ts = t0 + (si === 3 ? 7.5 : 10 + si * 0.4) * HOUR;
    if ((sim.day + si) % s.visitEvery !== 0 || !sim.ok(ts)) return;
    const lines = [];
    S.items.forEach((it, ii) => {
      const daily = it.reorder / ((s.leadDays + 1) * 1.3);
      if (it.supId !== s.id || it.stock > it.reorder + daily * s.visitEvery * 0.5) return;
      const qty = Math.max(1, Math.ceil((it.reorder + daily * s.visitEvery * 1.5 - it.stock) / it.pack)) * it.pack;
      const unitCostP = Math.round((sim.baseCost[ii] * (1 + (sim.drift[ii] * sim.day) / 59 + sim.bump[ii])) / 100) * 100;
      lines.push({ itemId: it.id, qty, costP: lineAmount(unitCostP, qty, it.unit), expiry: it.shelf < 1000 ? addDays(key, it.shelf) : '' });
    });
    if (lines.length) postPurchase({ ts, supId: s.id, lines, paidP: 0, by: 'owner' });
  });
}

function seedSupplierPayments(sim, key, ts) {
  const { r } = sim;
  S.suppliers.forEach((s, si) => {
    if ((sim.day + si) % s.visitEvery !== 0 || s.balanceP <= 0 || !sim.ok(ts)) return;
    if (s.balanceP > 6000000 && r() < 0.5) {
      addSupEntry({ supId: s.id, ts: ts + si * 60000, type: 'paid', amountP: Math.floor(s.balanceP / 200000) * 100000, method: 'bank', by: 'owner' });
    }
    const avail = simCashAt(key, ts + si * 60000) - 800000;
    const amount = Math.floor(Math.min(s.balanceP, avail) / 50000) * 50000;
    if (amount > 0) addSupEntry({ supId: s.id, ts: ts + si * 60000 + 1, type: 'paid', amountP: amount, method: 'cash', by: 'owner' });
  });
}

function seedCustomerPayments(sim, key, dom, ts) {
  const { r } = sim;
  S.customers.forEach((c, i) => {
    const when = ts + ((i * 7) % 60) * 60000;
    if (c.balanceP <= 0 || !sim.ok(when)) return;
    const p = sim.profile[c.id];
    const gap = sim.day - (sim.lastPay[c.id] ?? -20);
    let amount = 0;
    if (p === 'prompt' && gap >= 6 + Math.floor(r() * 5)) amount = c.balanceP;
    else if (p === 'monthly' && dom <= 10 && sim.paidMonth[c.id] !== key.slice(0, 7) && r() < 0.22) amount = Math.floor((c.balanceP * (0.7 + r() * 0.3)) / 10000) * 10000;
    else if (p === 'slow' && gap >= 15 && r() < 0.08) amount = Math.floor((c.balanceP * (0.2 + r() * 0.2)) / 10000) * 10000;
    else if (p === 'defaulter' && r() < 0.008) amount = 50000;
    amount = Math.min(amount, c.balanceP);
    if (amount <= 0) return;
    addLedger({ custId: c.id, ts: when, type: 'got', amountP: amount, method: pickW(r, ['cash', 'jazzcash', 'easypaisa'], [75, 15, 10]), by: 'owner' });
    sim.lastPay[c.id] = sim.day;
    if (p === 'monthly') sim.paidMonth[c.id] = key.slice(0, 7);
  });
}

function seedExpenses(sim, key, dom, t0) {
  const { r } = sim;
  const add = (h, kind, cat, rupees, method, note = '') => sim.ok(t0 + h * HOUR) && addCash({ ts: t0 + h * HOUR, kind, cat, amountP: rupees * 100, method, by: 'owner', note });
  if (dom === 1) {
    add(11, 'expense', 'rent', 35000, 'bank', 'Shop rent');
    add(20.75, 'expense', 'salary', 25000, simCashAt(key, t0 + 20.75 * HOUR) > 3500000 ? 'cash' : 'bank', 'Helper salary');
  }
  if (dom === 10) add(12, 'expense', 'bijli', 9000 + Math.round(r() * 50) * 100, 'wallet', 'Electricity bill');
  if (dom === 12) add(12.5, 'expense', 'gas', 800 + Math.round(r() * 7) * 100, 'wallet', 'Gas bill');
  add(17, 'expense', 'chai', 150 + Math.round(r() * 15) * 10, 'cash');
  if (sim.day % 3 === 1) add(10.5, 'expense', 'transport', 300 + Math.round(r() * 30) * 10, 'cash', 'Rickshaw for stock');
  if (r() < 0.04) add(15, 'expense', 'repair', 500 + Math.round(r() * 20) * 100, 'cash', 'Scale and fridge repair');
  if (sim.day % 5 === 2) add(21.5, 'drawing', 'home', 2000 + Math.round(r() * 30) * 100, 'cash', 'Household expenses');
}

function seedAdjustments(sim, key, dow, ts) {
  const { r } = sim;
  const adj = (name, qty, reason, note = '') => {
    const it = S.items.find(i => i.name === name);
    const when = ts + Math.floor(r() * 30) * 60000;
    if (!it || !sim.ok(when) || (qty < 0 && it.stock < -qty)) return;
    postAdjust({ ts: when, itemId: it.id, reason, qty, note, by: 'owner' });
  };
  S.items.forEach(it => {
    if (it.shelf > 10 || it.stock <= 0) return;
    if (it.expiry && it.expiry <= key) adj(it.name, -it.stock, 'expiry', 'Stale batch removed');
    else if (it.stock >= 2 && r() < 0.22) adj(it.name, r() < 0.3 ? -2 : -1, 'expiry', 'Past date');
  });
  if (r() < 0.08) adj('Eggs', -(1 + Math.floor(r() * 4)), 'damage', 'Broken in tray');
  if (r() < 0.03) {
    const it = S.items[Math.floor(r() * S.items.length)];
    if (!UNITS[it.unit].loose) adj(it.name, -1, 'damage', 'Torn packet');
  }
  if (dow === 0) {
    adj('Atta chakki (loose)', -2000, 'own', 'For home');
    adj('Cheeni (loose)', -1000, 'own', 'For home');
    adj('Chai patti 95 g', -1, 'own', 'For home');
  }
  if (sim.day === 30) {
    adj('Cheeni (loose)', -300, 'count', 'Weighing loss');
    adj('Daal masoor', -150, 'count', 'Weighing loss');
    adj('Chawal sela (loose)', 250, 'count', 'Recount');
  }
}

const SEED_REVISIONS = [['Cheeni (loose)', 170], ['Cheeni 1 kg pack', 185], ['Ghee pouch 1 kg', 575], ['Eggs', 350], ['Cooking oil 1 L pouch', 605]];

function seedPriceRevision(sim, ts) {
  SEED_REVISIONS.forEach(([name, rupees]) => {
    const idx = S.items.findIndex(i => i.name === name);
    const it = S.items[idx];
    it.priceHist.push({ ts, fromP: it.sellP, toP: rupees * 100, by: 'owner' });
    it.sellP = rupees * 100;
    sim.bump[idx] = 0.05;
  });
}

function seedDeposit(sim, key, ts) {
  const cash = simCashAt(key, ts);
  if (cash > 2500000) addCash({ ts, kind: 'deposit', cat: 'bank', amountP: Math.floor((cash - 1000000) / 100000) * 100000, method: 'cash', by: 'owner', note: 'Deposited at bank' });
}

function simulateDay(sim, key, isToday) {
  const t0 = dayStartOf(key);
  const d = new Date(t0);
  sim.ok = ts => !isToday || ts <= sim.now;
  if (sim.day === 25) seedPriceRevision(sim, t0 + 8 * HOUR);
  seedDeliveries(sim, key, t0);
  const times = Array.from({ length: billCount(sim.r, d.getDay(), d.getDate()) }, () => t0 + billTime(sim.r)).sort((a, b) => a - b);
  times.filter(sim.ok).forEach(ts => seedBill(sim, ts));
  seedCustomerPayments(sim, key, d.getDate(), t0 + 19 * HOUR);
  seedSupplierPayments(sim, key, t0 + 20 * HOUR);
  seedExpenses(sim, key, d.getDate(), t0);
  seedAdjustments(sim, key, d.getDay(), t0 + 21 * HOUR);
  if (isToday) return;
  seedDeposit(sim, key, t0 + 21.75 * HOUR);
  memo.clear();
  closeDayCore(key, daySummary(key).expectedP, { ts: t0 + 22.25 * HOUR, by: 'owner' });
}

// A few hand-placed expiry dates so the alerts inbox shows realistic cases on first open.
function seedExpiryTouches(today) {
  [['Cake slice', -1], ['Butter 100 g', 3], ['Cheese slices 200 g', 5], ['Custard powder 120 g', 8], ['Juice pack 200 ml', 9]].forEach(([name, d]) => {
    const it = S.items.find(i => i.name === name);
    if (it && it.stock > 0) setOldestExpiry(it, addDays(today, d));
  });
}

function seedActivity() {
  const since = Date.now() - 4 * DAY;
  const acts = [];
  const push = (ts, by, kind, k, v) => ts <= Date.now() && acts.push({ id: nid('a'), ts, by, kind, k, v });
  S.closes.filter(c => c.ts >= since).forEach(c => push(c.ts, 'owner', 'cash', 'act_close', { day: c.date, amt: c.countedP, amt2: c.diffP }));
  S.purchases.filter(p => p.ts >= since).forEach(p => push(p.ts, 'owner', 'purchase', 'act_purchase', { no: p.no, sup: p.supId, amt: p.totalP }));
  S.adjust.filter(a => a.ts >= since).forEach(a => push(a.ts, a.by, 'stock', 'act_adjust', { item: a.itemId, q: a.qty, reason: a.reason }));
  S.ledger.filter(e => e.type === 'got' && e.ts >= since).forEach(e => push(e.ts, 'owner', 'udhaar', 'act_got', { cust: e.custId, amt: e.amountP }));
  S.items.forEach(it => it.priceHist.forEach(h => push(h.ts, 'owner', 'stock', 'act_price', { item: it.id, amt: h.fromP, amt2: h.toP })));
  for (let i = 0; i <= 3; i++) {
    const t0 = dayStartOf(addDays(todayKey(), -i));
    push(t0 + 14 * HOUR, 'owner', 'role', 'act_helperOn', {});
    push(t0 + 20 * HOUR + 5 * 60000, 'owner', 'role', 'act_ownerBack', {});
  }
  liveSales().slice(-8).forEach(s => push(s.ts, s.by, 'sale', 'act_sale', { no: s.no, amt: s.totalP, m: s.method }));
  S.activity = acts.sort((a, b) => b.ts - a.ts);
}

function seedShop() {
  const keep = S ? { ...S.settings } : null;
  S = blankState();
  if (keep) Object.assign(S.settings, keep, { demo: true });
  memo.clear();
  const today = todayKey();
  const sim = { r: rng(46046), start: addDays(today, -59), day: 0, now: Date.now(), profile: {}, lastPay: {}, paidMonth: {} };
  S.meta.startKey = sim.start;
  seedMasters(sim);
  for (let k = sim.start; k <= today; k = addDays(k, 1)) {
    simulateDay(sim, k, k === today);
    sim.day++;
  }
  seedExpiryTouches(today);
  memo.clear();
  seedActivity();
  if (!S.settings.pinHash) setPin(DEMO_PIN);
  S.meta.seeded = true;
  memo.clear();
  persist();
}

function blankShop() {
  const keep = { ...S.settings, demo: false };
  S = blankState();
  Object.assign(S.settings, keep);
  memo.clear();
  persist();
}

// ---------- domain: stock with a moving-average cost pool ----------
// Each item keeps `stock` (base units) and `poolP` (total cost of that stock, paisa).
// Issuing q units removes round(poolP * q / stock) — the last unit takes the remainder,
// so the pool reaches exactly zero with the stock and every paisa of cost is accounted for.
function stockOut(item, qty) {
  if (!(qty > 0) || qty > item.stock) throw new KKError('err_stock', { name: nm(item), have: qtyStr(item.unit, item.stock) });
  const cost = qty === item.stock ? item.poolP : Math.round((item.poolP * qty) / item.stock);
  item.stock -= qty;
  item.poolP -= cost;
  takeBatches(item, qty);
  return cost;
}

function stockIn(item, qty, costP, exp = item.expiry || '') {
  item.stock += qty;
  item.poolP += costP;
  addBatch(item, qty, exp);
}

// Expiry batches, first-expiry-first-out: [{qty, exp}] whose quantities always sum to `stock`.
// The item's `expiry` is the date of the oldest batch still on the shelf.
const syncExpiry = it => (it.expiry = it.batches.length ? it.batches[0].exp : '');

function addBatch(it, qty, exp = '') {
  const b = it.batches.find(x => x.exp === exp);
  if (b) b.qty += qty;
  else it.batches.push({ qty, exp });
  it.batches.sort((a, b) => ((a.exp || '9999') < (b.exp || '9999') ? -1 : 1));
  syncExpiry(it);
}

function takeBatches(it, qty) {
  let left = qty;
  while (left > 0 && it.batches.length) {
    const b = it.batches[0];
    const take = Math.min(b.qty, left);
    b.qty -= take;
    left -= take;
    if (!b.qty) it.batches.shift();
  }
  syncExpiry(it);
}

function setOldestExpiry(it, exp) {
  if (it.batches.length) it.batches[0].exp = exp;
  it.batches.sort((a, b) => ((a.exp || '9999') < (b.exp || '9999') ? -1 : 1));
  syncExpiry(it);
}

// Average cost per selling unit, in (possibly fractional) paisa — for display and margins only.
const avgCostP = it => (it.stock > 0 ? (it.poolP * UNITS[it.unit].base) / it.stock : it.lastCostP);
const marginPct = it => (it.sellP ? ((it.sellP - avgCostP(it)) / it.sellP) * 100 : 0);
const stockValueP = () => sum(S.items, i => i.poolP);
const retailValueP = () => sum(S.items, i => lineAmount(i.sellP, i.stock, i.unit));

function stockState(it) {
  if (it.stock <= 0) return 'out';
  if (it.stock <= it.reorder) return 'low';
  return 'ok';
}

function expiryDays(it) {
  if (!it.expiry) return null;
  return Math.round((dayStartOf(it.expiry) - dayStartOf(todayKey())) / DAY);
}

// Near-expiry window: the settings value, shortened for short-life goods (bread, dahi).
function expiryState(it) {
  const d = expiryDays(it);
  if (d === null || it.stock <= 0) return 'none';
  if (d < 0) return 'expired';
  const win = Math.max(1, Math.min(S.settings.nearDays, Math.ceil((it.shelf || 365) / 3)));
  return d <= win ? 'near' : 'ok';
}

// ---------- domain: sales ----------
const roundAdj = p => (S.settings.roundBill ? Math.round(p / 100) * 100 - p : 0);

function billTotals(lines, discP = 0) {
  const subP = sum(lines, l => lineAmount(l.priceP, l.qty, itemById(l.itemId).unit));
  const d = clamp(Math.round(discP) || 0, 0, subP);
  const roundP = roundAdj(subP - d);
  return { subP, discP: d, roundP, totalP: subP - d + roundP };
}

function splitPayment(draft, totalP) {
  const pay = { method: draft.method, cashP: 0, walletP: 0, creditP: 0, tenderedP: 0, changeP: 0 };
  if (draft.method === 'cash') {
    pay.tenderedP = Math.max(draft.tenderedP || totalP, totalP);
    pay.changeP = pay.tenderedP - totalP;
    pay.cashP = totalP;
  } else if (draft.method === 'udhaar') {
    if (!custById(draft.custId)) throw new KKError('err_needCustomer');
    const now = clamp(draft.paidNowP || 0, 0, totalP);
    pay.cashP = now;
    pay.creditP = totalP - now;
  } else {
    pay.walletP = totalP;
  }
  return pay;
}

// All-or-nothing: stock is checked for every line before anything is issued.
function postSale(draft) {
  const need = new Map();
  draft.lines.forEach(l => need.set(l.itemId, (need.get(l.itemId) || 0) + l.qty));
  for (const [id, q] of need) {
    const it = itemById(id);
    if (!it || it.stock < q) throw new KKError('err_stock', { name: nm(it), have: it ? qtyStr(it.unit, it.stock) : '0' });
  }
  const tot = billTotals(draft.lines, draft.discP);
  const pay = splitPayment(draft, tot.totalP);
  const lines = draft.lines.map(l => {
    const it = itemById(l.itemId);
    return { itemId: l.itemId, qty: l.qty, priceP: l.priceP, amountP: lineAmount(l.priceP, l.qty, it.unit), costP: stockOut(it, l.qty) };
  });
  const sale = { id: nid('s'), no: S.meta.nextBill++, ts: draft.ts, by: draft.by, lines, ...tot, ...pay, custId: draft.custId || '', ref: draft.ref || '' };
  S.sales.push(sale);
  if (sale.creditP > 0) addLedger({ custId: sale.custId, ts: sale.ts, type: 'sale', amountP: sale.creditP, saleId: sale.id, by: draft.by });
  return sale;
}

function voidSaleCore(sale, ts, by, reason) {
  if (sale.voided) throw new KKError('err_alreadyVoid');
  sale.lines.forEach(l => stockIn(itemById(l.itemId), l.qty, l.costP));
  sale.voided = { ts, by, reason };
  if (sale.creditP > 0) addLedger({ custId: sale.custId, ts, type: 'return', amountP: sale.creditP, saleId: sale.id, by, note: '#' + sale.no });
}

const liveSales = () => S.sales.filter(s => !s.voided);
const saleCost = s => sum(s.lines, l => l.costP);
const saleProfit = s => s.totalP - saleCost(s);

// ---------- domain: udhaar ledger (debits raise what the customer owes) ----------
const DEBIT_TYPES = new Set(['open', 'sale', 'loan', 'other']);
const signOf = e => (DEBIT_TYPES.has(e.type) ? 1 : -1);

function addLedger(e) {
  const c = custById(e.custId);
  if (!c) throw new KKError('err_needCustomer');
  if (!(e.amountP > 0)) throw new KKError('err_amount');
  const rec = { id: nid('l'), note: '', method: '', ...e };
  S.ledger.push(rec);
  c.balanceP += signOf(rec) * rec.amountP;
  return rec;
}

function custEntries(custId) {
  return cached('ce:' + custId, () => S.ledger.filter(e => e.custId === custId).sort((a, b) => a.ts - b.ts));
}

// FIFO ageing: payments settle the oldest debits first; what remains is aged by its own date.
function ageing(custId, asOf = Date.now()) {
  const entries = custEntries(custId);
  let credit = sum(entries.filter(e => signOf(e) < 0), e => e.amountP);
  const buckets = [0, 0, 0, 0];
  let oldest = null;
  for (const e of entries) {
    if (signOf(e) < 0) continue;
    const settled = Math.min(credit, e.amountP);
    credit -= settled;
    const open = e.amountP - settled;
    if (open <= 0) continue;
    const days = daysBetween(e.ts, asOf);
    buckets[days > 90 ? 3 : days > 60 ? 2 : days > 30 ? 1 : 0] += open;
    if (oldest === null) oldest = days;
  }
  return { buckets, advanceP: credit, oldest: oldest ?? 0 };
}

function lastPayment(custId) {
  const got = custEntries(custId).filter(e => e.type === 'got');
  return got.length ? got[got.length - 1] : null;
}

function riskOf(c) {
  const flags = [];
  if (c.limitP > 0 && c.balanceP > c.limitP) flags.push('over');
  else if (c.limitP > 0 && c.balanceP >= c.limitP * 0.8) flags.push('near');
  if (c.balanceP > 0) {
    const ag = ageing(c.id);
    if (ag.buckets[3] > 0) flags.push('old');
    const lp = lastPayment(c.id);
    if (!lp || daysBetween(lp.ts, Date.now()) > 30) flags.push('quiet');
  }
  return flags;
}
const receivableP = () => sum(S.customers, c => Math.max(0, c.balanceP));

function totalAgeing() {
  return cached('ageAll', () => {
    const tot = [0, 0, 0, 0];
    S.customers.forEach(c => ageing(c.id).buckets.forEach((v, i) => (tot[i] += v)));
    return tot;
  });
}

// ---------- domain: suppliers and purchases (payables) ----------
const SUP_DEBIT = new Set(['open', 'bill']);

function addSupEntry(e) {
  const s = supById(e.supId);
  if (!s) throw new KKError('err_needSupplier');
  if (!(e.amountP > 0)) throw new KKError('err_amount');
  const rec = { id: nid('p'), note: '', method: '', ...e };
  S.supLedger.push(rec);
  s.balanceP += (SUP_DEBIT.has(rec.type) ? 1 : -1) * rec.amountP;
  return rec;
}
const supEntries = supId => S.supLedger.filter(e => e.supId === supId).sort((a, b) => a.ts - b.ts);
const payableP = () => sum(S.suppliers, s => Math.max(0, s.balanceP));

function postPurchase(d) {
  if (!supById(d.supId)) throw new KKError('err_needSupplier');
  if (!d.lines.length) throw new KKError('err_noLines');
  const lines = d.lines.map(l => {
    const it = itemById(l.itemId);
    if (!(l.qty > 0) || !(l.costP >= 0)) throw new KKError('err_amount');
    stockIn(it, l.qty, l.costP, l.expiry || '');
    it.lastCostP = Math.round((l.costP * UNITS[it.unit].base) / l.qty);
    return { itemId: l.itemId, qty: l.qty, costP: l.costP, expiry: l.expiry || '' };
  });
  const totalP = sum(lines, l => l.costP);
  const p = { id: nid('po'), no: S.meta.nextPo++, ts: d.ts, supId: d.supId, lines, totalP, by: d.by, note: d.note || '' };
  S.purchases.push(p);
  addSupEntry({ supId: d.supId, ts: d.ts, type: 'bill', amountP: totalP, purchaseId: p.id, by: d.by, note: '#' + p.no });
  const paid = clamp(d.paidP || 0, 0, totalP);
  if (paid > 0) addSupEntry({ supId: d.supId, ts: d.ts + 1, type: 'paid', amountP: paid, method: d.method || 'cash', purchaseId: p.id, by: d.by, note: '#' + p.no });
  return p;
}

// ---------- domain: stock adjustments (damage, expiry, own use, count) ----------
function postAdjust(d) {
  const it = itemById(d.itemId);
  if (!it || !d.qty) throw new KKError('err_amount');
  let costP;
  if (d.qty < 0) {
    costP = -stockOut(it, -d.qty);
  } else {
    if (d.reason !== 'count') throw new KKError('err_adjIn');
    costP = it.stock > 0 ? Math.round((it.poolP * d.qty) / it.stock) : lineAmount(it.lastCostP, d.qty, it.unit);
    stockIn(it, d.qty, costP);
  }
  const rec = { id: nid('j'), ts: d.ts, itemId: it.id, reason: d.reason, qty: d.qty, costP, note: d.note || '', by: d.by };
  S.adjust.push(rec);
  return rec;
}

// ---------- domain: cash book (drawer cash only; wallets and bank are tracked beside it) ----------
function addCash(d) {
  if (!(d.amountP > 0)) throw new KKError('err_amount');
  const rec = { id: nid('k'), note: '', cat: '', method: 'cash', ...d };
  S.cash.push(rec);
  return rec;
}
const cashSign = e => (e.kind === 'cashin' ? 1 : -1);

function cashMoves(key) {
  const r = dayRecs(key);
  const out = [];
  const push = (ts, type, amountP, ref) => amountP && out.push({ ts, type, amountP, ref });
  r.sales.forEach(s => push(s.ts, 'sale', s.cashP, s));
  r.voids.forEach(s => push(s.voided.ts, 'refund', -s.cashP, s));
  r.ledger.forEach(e => {
    if (e.type === 'got' && e.method === 'cash') push(e.ts, 'got', e.amountP, e);
    if (e.type === 'loan') push(e.ts, 'loan', -e.amountP, e);
  });
  r.sup.forEach(e => e.type === 'paid' && e.method === 'cash' && push(e.ts, 'supPaid', -e.amountP, e));
  r.cash.forEach(e => e.method === 'cash' && push(e.ts, e.kind, cashSign(e) * e.amountP, e));
  return out.sort((a, b) => a.ts - b.ts);
}
const netCash = key => sum(cashMoves(key), m => m.amountP);

function walletMoves(key) {
  const r = dayRecs(key);
  const inP = sum(r.sales, s => s.walletP) + sum(r.ledger.filter(e => e.type === 'got' && e.method !== 'cash'), e => e.amountP);
  const outP = sum(r.voids, s => s.walletP) + sum(r.sup.filter(e => e.type === 'paid' && e.method !== 'cash'), e => e.amountP) + sum(r.cash.filter(e => e.method !== 'cash'), e => e.amountP);
  return { inP, outP };
}

const closeOf = key => S.closes.find(c => c.date === key) || null;
const isClosed = key => !!closeOf(key);

// Opening = the last counted close before this day, carried through any unclosed days.
function openingFor(key) {
  let base = S.meta.openingFloatP;
  let from = S.meta.startKey;
  let last = null;
  for (const c of S.closes) if (c.date < key) last = c;
  if (last) {
    base = last.countedP;
    from = addDays(last.date, 1);
  }
  for (let k = from; k < key; k = addDays(k, 1)) base += netCash(k);
  return base;
}

function daySummary(key) {
  const moves = cashMoves(key);
  const openingP = openingFor(key);
  const inP = sum(moves.filter(m => m.amountP > 0), m => m.amountP);
  const outP = -sum(moves.filter(m => m.amountP < 0), m => m.amountP);
  return { key, openingP, inP, outP, expectedP: openingP + inP - outP, moves };
}

function closeDayCore(key, countedP, { ts, by, note = '', denoms = null }) {
  const d = daySummary(key);
  const rec = { date: key, openingP: d.openingP, inP: d.inP, outP: d.outP, expectedP: d.expectedP, countedP, diffP: countedP - d.expectedP, ts, by, note, denoms };
  S.closes = S.closes.filter(c => c.date !== key);
  S.closes.push(rec);
  S.closes.sort((a, b) => (a.date < b.date ? -1 : 1));
  return rec;
}

function assertOpen() {
  if (isClosed(todayKey())) throw new KKError('err_dayClosed');
}

// ---------- domain: sales velocity and reorder suggestions ----------
// Daily quantities per item for the last `days` complete days (today excluded).
function salesMatrix(days = 28) {
  return cached('mat' + days, () => {
    const start = addDays(todayKey(), -days);
    const m = new Map();
    for (let i = 0; i < days; i++) {
      dayRecs(addDays(start, i)).sales.forEach(s => {
        if (s.voided) return;
        s.lines.forEach(l => {
          if (!m.has(l.itemId)) m.set(l.itemId, new Array(days).fill(0));
          m.get(l.itemId)[i] += l.qty;
        });
      });
    }
    return m;
  });
}

function velocity(it, days = 28) {
  // TODO(student): forecast with seasonality instead of a flat 28-day mean (Holt-Winters, or a model that knows Ramadan, Eid and payday weeks) and backtest it against the seeded history.
  const arr = salesMatrix(days).get(it.id) || new Array(days).fill(0);
  const mean = sum(arr) / days;
  const varc = sum(arr, x => (x - mean) ** 2) / days;
  return { mean, sd: Math.sqrt(varc), total: sum(arr) };
}

// Periodic review (supplier visits every R days, lead time L):
//   safety stock SS = z·σ·√L, reorder point ROP = v·L + SS,
//   order-up-to level T = v·(L+R) + z·σ·√(L+R), suggest = T − stock rounded up to whole packs.
function reorderPlan(it) {
  const sup = supById(it.supId);
  const L = sup ? sup.leadDays : 3;
  const R = sup ? sup.visitEvery : 7;
  const { mean, sd } = velocity(it);
  const ss = SAFETY_Z * sd * Math.sqrt(L);
  const rop = mean * L + ss;
  const target = mean * (L + R) + SAFETY_Z * sd * Math.sqrt(L + R);
  const packs = target > it.stock ? Math.ceil((target - it.stock) / it.pack) : 0;
  const cover = mean > 0 ? it.stock / mean : Infinity;
  const below = it.stock <= Math.max(rop, it.reorder);
  return { mean, sd, L, R, ss, rop, target, packs, suggest: packs * it.pack, cover, below };
}

function reorderList() {
  return cached('reorder', () =>
    S.items
      .map(it => ({ it, plan: reorderPlan(it) }))
      .filter(x => x.plan.below && x.plan.suggest > 0)
      .sort((a, b) => a.plan.cover - b.plan.cover));
}

function lastSoldMap() {
  return cached('lastSold', () => {
    const m = new Map();
    S.sales.forEach(s => !s.voided && s.lines.forEach(l => m.set(l.itemId, Math.max(m.get(l.itemId) || 0, s.ts))));
    return m;
  });
}

function deadStock(days = 30) {
  const cut = Date.now() - days * DAY;
  const last = lastSoldMap();
  return S.items.filter(it => it.stock > 0 && (last.get(it.id) || 0) < cut).sort((a, b) => b.poolP - a.poolP);
}

function frequentItems(n = 24) {
  return cached('freq' + n, () => {
    const count = new Map();
    const since = Date.now() - 14 * DAY;
    for (let i = S.sales.length - 1; i >= 0 && S.sales[i].ts >= since; i--) S.sales[i].lines.forEach(l => count.set(l.itemId, (count.get(l.itemId) || 0) + 1));
    const ranked = [...count.entries()].sort((a, b) => b[1] - a[1]).map(([id]) => itemById(id)).filter(Boolean);
    const rest = S.items.filter(it => !count.has(it.id));
    return [...ranked, ...rest].slice(0, n);
  });
}

// ---------- books audit: re-derive every balance from source documents ----------
function auditStock() {
  const q = new Map(S.items.map(i => [i.id, i.openQty]));
  const c = new Map(S.items.map(i => [i.id, i.openCostP]));
  const add = (id, dq, dc) => {
    q.set(id, (q.get(id) || 0) + dq);
    c.set(id, (c.get(id) || 0) + dc);
  };
  S.purchases.forEach(p => p.lines.forEach(l => add(l.itemId, l.qty, l.costP)));
  S.sales.forEach(s => !s.voided && s.lines.forEach(l => add(l.itemId, -l.qty, -l.costP)));
  S.adjust.forEach(a => add(a.itemId, a.qty, a.costP));
  const issues = [];
  S.items.forEach(it => {
    if (q.get(it.id) !== it.stock) issues.push(t('au_stock', { name: nm(it), a: qtyStr(it.unit, it.stock), b: qtyStr(it.unit, q.get(it.id)) }));
    if (c.get(it.id) !== it.poolP) issues.push(t('au_pool', { name: nm(it), a: rs(it.poolP), b: rs(c.get(it.id)) }));
    if (it.stock < 0 || it.poolP < 0 || (it.stock === 0 && it.poolP !== 0)) issues.push(t('au_neg', { name: nm(it) }));
    if (sum(it.batches, b => b.qty) !== it.stock) issues.push(t('au_batch', { name: nm(it) }));
  });
  return { key: 'au_secStock', checked: S.items.length, issues };
}

function auditSales() {
  const issues = [];
  const credit = new Map(S.ledger.filter(e => e.saleId && e.type === 'sale').map(e => [e.saleId, e.amountP]));
  const back = new Map(S.ledger.filter(e => e.saleId && e.type === 'return').map(e => [e.saleId, e.amountP]));
  S.sales.forEach(s => {
    const lineOk = s.lines.every(l => l.amountP === lineAmount(l.priceP, l.qty, itemById(l.itemId).unit));
    const sub = sum(s.lines, l => l.amountP);
    const okTot = lineOk && sub === s.subP && s.totalP === s.subP - s.discP + s.roundP;
    const okPay = s.cashP + s.walletP + s.creditP === s.totalP;
    const okLedger = (credit.get(s.id) || 0) === s.creditP && (!s.voided || (back.get(s.id) || 0) === s.creditP);
    if (!okTot || !okPay || !okLedger) issues.push(t('au_sale', { no: s.no }));
  });
  return { key: 'au_secSales', checked: S.sales.length, issues };
}

function auditCustomers() {
  const bal = new Map();
  S.ledger.forEach(e => bal.set(e.custId, (bal.get(e.custId) || 0) + signOf(e) * e.amountP));
  const issues = S.customers.filter(c => (bal.get(c.id) || 0) !== c.balanceP).map(c => t('au_cust', { name: nm(c), a: rs(c.balanceP), b: rs(bal.get(c.id) || 0) }));
  return { key: 'au_secCust', checked: S.customers.length, issues };
}

function auditSuppliers() {
  const bal = new Map();
  S.supLedger.forEach(e => bal.set(e.supId, (bal.get(e.supId) || 0) + (SUP_DEBIT.has(e.type) ? 1 : -1) * e.amountP));
  const issues = S.suppliers.filter(s => (bal.get(s.id) || 0) !== s.balanceP).map(s => t('au_sup', { name: nm(s), a: rs(s.balanceP), b: rs(bal.get(s.id) || 0) }));
  S.purchases.forEach(p => {
    if (sum(p.lines, l => l.costP) !== p.totalP) issues.push(t('au_po', { no: p.no }));
  });
  return { key: 'au_secSup', checked: S.suppliers.length + S.purchases.length, issues };
}

// Each close must still match its re-derived opening and expected drawer cash.
function auditCash() {
  const issues = [];
  const warnings = [];
  S.closes.forEach(c => {
    const d = daySummary(c.date);
    if (d.openingP !== c.openingP || d.expectedP !== c.expectedP) issues.push(t('au_close', { day: fmtDay(c.date), a: rs(c.expectedP), b: rs(d.expectedP) }));
    if (c.diffP !== 0) warnings.push(t('au_diff', { day: fmtDay(c.date), amt: rs(c.diffP) }));
  });
  return { key: 'au_secCash', checked: S.closes.length, issues, warnings };
}

function auditBooks() {
  const sections = [auditStock(), auditSales(), auditCustomers(), auditSuppliers(), auditCash()];
  return { sections, ok: sections.every(s => !s.issues.length), checks: sum(sections, s => s.checked) };
}

// ---------- alerts inbox (derived from the books; read state is persisted) ----------
function computeAlerts() {
  return cached('alerts', () => {
    const out = [];
    const add = (id, sev, icon, title, body, href) => out.push({ id, sev, icon, title, body, href });
    const today = todayKey();
    const sold = salesMatrix(28);
    S.items.filter(it => it.stock <= 0 && sold.has(it.id)).forEach(it => add('out:' + it.id, 'red', 'package-x', t('al_out', { name: nm(it) }), t('al_outB'), '#item/' + it.id));
    const lows = S.items.filter(it => stockState(it) === 'low');
    if (lows.length) add('low:' + today, 'amber', 'box', t('al_low', { n: lows.length }), lows.slice(0, 6).map(nm).join(SEP()), '#reorder');
    S.items.forEach(it => {
      const st = expiryState(it);
      if (st === 'expired') add('exp:' + it.id + ':' + it.expiry, 'red', 'hourglass', t('al_expired', { name: nm(it) }), t('al_expB', { date: fmtDay(it.expiry) }), '#item/' + it.id);
      if (st === 'near') add('near:' + it.id + ':' + it.expiry, 'amber', 'hourglass', t('al_near', { name: nm(it), n: expiryDays(it) }), t('al_expB', { date: fmtDay(it.expiry) }), '#item/' + it.id);
    });
    S.customers.forEach(c => {
      const r = riskOf(c);
      if (r.includes('over')) add('over:' + c.id + ':' + today, 'red', 'alert', t('al_over', { name: nm(c) }), t('al_overB', { bal: rs(c.balanceP), lim: rs(c.limitP) }), '#cust/' + c.id);
      else if (r.includes('old')) add('old:' + c.id + ':' + mkey(Date.now()), 'amber', 'clock', t('al_old', { name: nm(c) }), t('al_oldB', { amt: rs(ageing(c.id).buckets[3]) }), '#cust/' + c.id);
    });
    S.suppliers.forEach(s => {
      const paid = supEntries(s.id).filter(e => e.type === 'paid').pop();
      if (s.balanceP > 0 && (!paid || daysBetween(paid.ts, Date.now()) > 14)) add('sup:' + s.id + ':' + today, 'amber', 'truck', t('al_sup', { name: nm(s) }), t('al_supB', { amt: rs(s.balanceP) }), '#sup/' + s.id);
    });
    const y = addDays(today, -1);
    if (y >= S.meta.startKey && !isClosed(y) && netCash(y) !== 0) add('close:' + y, 'amber', 'calendar-check', t('al_close'), t('al_closeB', { day: fmtDay(y) }), '#cash/' + y);
    if (Date.now() - (S.settings.lastBackup || 0) > 7 * DAY) add('backup:' + mkey(Date.now()) + ':' + Math.floor(Date.now() / (7 * DAY)), 'blue', 'download', t('al_backup'), t('al_backupB'), '#settings');
    return out;
  });
}
const unreadAlerts = () => computeAlerts().filter(a => !S.read.includes(a.id));

// ---------- view: home ("Aaj" — today at a glance) ----------
function kpi(label, icon, value, sub = '', tone = '', fmt = 'rs') {
  const v = typeof value === 'number' ? `<div class="v" data-count="${value}" data-fmt="${fmt}">${fmt === 'n' ? value : rs(value)}</div>` : `<div class="v">${value}</div>`;
  return `<div class="kpi ${tone}"><div class="k">${ic(icon)}<span>${label}</span></div>${v}${sub ? `<div class="s">${sub}</div>` : ''}</div>`;
}

function todayNumbers() {
  const key = todayKey();
  const r = dayRecs(key);
  const sales = r.sales.filter(s => !s.voided);
  return {
    sales,
    totalP: sum(sales, s => s.totalP),
    profitP: sum(sales, saleProfit),
    givenP: sum(r.ledger.filter(e => e.type === 'sale' || e.type === 'loan'), e => e.amountP),
    gotP: sum(r.ledger.filter(e => e.type === 'got'), e => e.amountP),
    day: daySummary(key),
    wallet: walletMoves(key),
  };
}

function quickActions() {
  const qa = [
    ['sale', 'cart', 'qa_sale', 'blue'],
    ['got', 'arrow-down-left', 'qa_got', 'green'],
    ['gave', 'arrow-up-right', 'qa_gave', 'red'],
    ['expense', 'cash-out', 'qa_expense', 'amber'],
    ['purchase', 'truck', 'qa_purchase', 'blue'],
    ['close', 'calendar-check', 'qa_close', 'green'],
  ];
  return `<div class="qa stagger mt" id="homeQa">${qa.map(([id, icon, k, tone]) => `<button type="button" class="${tone}" data-qa="${id}">${ic(icon)}<span>${t(k)}</span></button>`).join('')}</div>`;
}

function onQuickAction(id) {
  if (id === 'sale') return go('sale');
  if (id === 'got' || id === 'gave') return pickCustomer(c => openEntry(c, id));
  if (id === 'expense') return openCashEntry('expense');
  if (id === 'purchase') return go('purchase');
  if (id === 'close') return go('cash');
}

function weekChartHtml() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const k = addDays(todayKey(), -i);
    days.push({ label: fmtDate(dayStartOf(k), { weekday: 'short' }), value: sum(dayRecs(k).sales.filter(s => !s.voided), s => s.totalP), hl: i === 0 });
  }
  return barChart(days, { h: 170, every: 1 });
}

function recentBillsHtml(n = 5) {
  const list = S.sales.slice(-n).reverse();
  if (!list.length) return emptyHtml('receipt', t('noBills'));
  return `<div class="list">${list.map(billRow).join('')}</div>`;
}

function homeAlertsHtml() {
  const list = unreadAlerts().slice(0, 4);
  if (!list.length) return `<div class="alert green">${ic('check-circle')}<div class="main">${t('allClear')}</div></div>`;
  return list.map(alertHtml).join('') + `<a class="btn ghost sm mt" href="#alerts">${t('seeAll')} (${unreadAlerts().length})</a>`;
}

function receivablesHtml() {

// Shared row renderers used across pages.
function emptyHtml(icon, text) {
  return `<div class="empty">${ic(icon)}<div>${text}</div></div>`;
}

function methodTag(s) {
  const tone = { cash: 'green', jazzcash: 'blue', easypaisa: 'blue', udhaar: 'red' }[s.method];
  return `<span class="tag ${tone}">${t('pm_' + s.method)}</span>`;
}

function billRow(s) {
  const c = custById(s.custId);
  const sub = [`<bdi class="num">#${s.no}</bdi>`, fmtTime(s.ts), t('nLines', { n: s.lines.length })];
  if (c) sub.push(esc(nm(c)));
  return `<div class="lrow" role="button" tabindex="0" data-bill="${s.id}">
    <div class="av">${ic('receipt')}</div>
    <div class="main"><b>${s.lines.slice(0, 2).map(l => esc(nm(itemById(l.itemId)))).join(SEP())}${s.lines.length > 2 ? '…' : ''}</b><div class="sub">${sub.join(' · ')}</div></div>
    <div class="end">${money(s.totalP, s.voided ? 'muted' : '')}<div>${s.voided ? `<span class="tag">${t('voided')}</span>` : methodTag(s)}</div></div></div>`;
}

function custRow(c) {
  const flags = riskOf(c);
  const usage = c.limitP ? clamp(pct(c.balanceP, c.limitP), 0, 100) : 0;
  const tone = flags.includes('over') ? 'red' : flags.includes('near') ? 'amber' : 'green';
  return `<a class="lrow" href="#cust/${c.id}">
    <div class="av">${esc(initials(c.name))}</div>
    <div class="main"><b>${esc(nm(c))}</b><div class="sub">${esc(c.area || '')} ${flags.map(riskTag).join(' ')}</div>
      ${c.limitP ? `<div class="bar ${tone}" style="margin-top:5px;max-width:180px"><i data-w="${usage}"></i></div>` : ''}</div>
    <div class="end">${money(c.balanceP, c.balanceP > 0 ? 'dr' : c.balanceP < 0 ? 'cr' : 'muted')}<div class="tiny muted">${c.balanceP > 0 ? t('owes') : c.balanceP < 0 ? t('advance') : t('settled')}</div></div></a>`;
}

function riskTag(f) {
  const tone = { over: 'red', near: 'amber', old: 'red', quiet: 'amber' }[f];
  return `<span class="tag ${tone}">${t('risk_' + f)}</span>`;
}

function ageingBar(b) {
  const tot = sum(b) || 1;
  const labels = ['age0', 'age1', 'age2', 'age3'];
  return `<div class="ageing mt" role="img" aria-label="${t('ageing')}">${b.map((v, i) => `<i class="a${i}" data-w="${(v / tot) * 100}"></i>`).join('')}</div>
    <div class="agelegend">${b.map((v, i) => `<span><em><i class="a${i}" style="background:${['#6a9fd8', '#d9a441', '#d0702f', '#a3221f'][i]}"></i>${t(labels[i])}</em>${money(v)}</span>`).join('')}</div>`;
}

// Rows with data-bill open the receipt; keyboard Enter works too.
function bindRows(root) {
  $$('[data-bill]', root).forEach(el => {
    el.onclick = () => openReceipt(saleById(el.dataset.bill));
    el.onkeydown = e => e.key === 'Enter' && el.click();
  });
}

// ---------- view: quick sale (POS) ----------
// The cart survives a reload (kk:cart) so a power cut mid-sale loses nothing.
let cart = null;
let posCat = 'freq';
let posQuery = '';
const emptyCart = () => ({ lines: [], discP: 0, custId: '' });
const saveCart = () => store.set('cart', cart);
const stepFor = it => ({ kg: 250, litre: 250, dozen: 6 }[it.unit] || 1);

function cartTotals() {
  const lines = cart.lines.filter(l => itemById(l.itemId)).map(l => ({ ...l, priceP: itemById(l.itemId).sellP }));
  return { lines, ...billTotals(lines, cart.discP) };
}

function searchItems(q, limit = 60) {
  const s = q.trim().toLowerCase();
  if (!s) return [];
  const hit = it => it.name.toLowerCase().includes(s) || (it.ur || '').includes(q.trim()) || it.barcode === s;
  return S.items.filter(hit).sort((a, b) => a.name.toLowerCase().indexOf(s) - b.name.toLowerCase().indexOf(s)).slice(0, limit);
}

function posList() {
  if (posQuery.trim()) return searchItems(posQuery);
  if (posCat === 'freq') return frequentItems(24);
  const list = posCat === 'all' ? S.items : S.items.filter(i => i.cat === posCat);
  return [...list].sort((a, b) => nm(a).localeCompare(nm(b)));
}

function tileHtml(it) {
  const line = cart.lines.find(l => l.itemId === it.id);
  const st = stockState(it);
  const unit = t('per_' + it.unit);
  return `<button type="button" class="tile ${UNITS[it.unit].loose ? 'loose' : ''} ${st === 'out' ? 'out' : ''}" data-add="${it.id}" aria-label="${esc(nm(it))}, ${rs(it.sellP)} ${unit}">
    <span class="nm">${esc(nm(it))}</span>
    <span class="st ${st !== 'ok' ? 'low' : ''}">${st === 'out' ? t('outOfStock') : qtyStr(it.unit, it.stock)}</span>
    <span class="pr"><bdi>${rs(it.sellP)}</bdi><small> ${unit}</small></span>
    ${line ? `<span class="incart">${UNITS[it.unit].loose ? qtyStr(it.unit, line.qty) : line.qty}</span>` : ''}</button>`;
}

function drawTiles() {
  const list = posList();
  $('#posTiles').innerHTML = list.length ? list.map(tileHtml).join('') : emptyHtml('search', t('noMatch'));
  $$('#posTiles [data-add]').forEach(b => (b.onclick = () => onTile(itemById(b.dataset.add))));
}

function onTile(it) {
  if (it.stock <= 0) return toast(t('err_stock', { name: nm(it), have: '0' }), 'bad');
  if (UNITS[it.unit].loose) return openQtyPad(it, (cart.lines.find(l => l.itemId === it.id) || {}).qty || 0);
  addToCart(it.id, 1);
}

function addToCart(id, q, replace = false) {
  const it = itemById(id);
  const line = cart.lines.find(l => l.itemId === id);
  const next = replace ? q : (line ? line.qty : 0) + q;
  if (next > it.stock) {
    toast(t('err_stock', { name: nm(it), have: qtyStr(it.unit, it.stock) }), 'bad');
    return false;
  }
  if (next <= 0) cart.lines = cart.lines.filter(l => l.itemId !== id);
  else if (line) line.qty = next;
  else cart.lines.push({ itemId: id, qty: next });
  saveCart();
  drawCart();
  return true;
}

function cartLineHtml(l) {
  const it = itemById(l.itemId);
  return `<div class="cline">
    <div class="nm">${esc(nm(it))}</div><div class="amt">${rs(lineAmount(it.sellP, l.qty, it.unit))}</div>
    <div class="ctl"><div class="stepper">
      <button type="button" data-cart="dec" data-id="${it.id}" aria-label="${t('less')}">${ic('minus')}</button>
      <button type="button" class="q" data-cart="qty" data-id="${it.id}" aria-label="${t('editQty')}">${qtyStr(it.unit, l.qty)}</button>
      <button type="button" data-cart="inc" data-id="${it.id}" aria-label="${t('more')}">${ic('plus')}</button></div>
      <span class="meta grow">@ ${rs(it.sellP)} ${t('per_' + it.unit)}</span>
      <button type="button" class="ibtn" data-cart="rm" data-id="${it.id}" aria-label="${t('remove')}">${ic('x')}</button></div></div>`;
}

function cartPanelHtml(tot) {
  const c = custById(cart.custId);
  return `<div class="between"><h3>${ic('cart')} ${t('cart')} <span class="tag">${tot.lines.length}</span></h3>
      ${tot.lines.length ? `<button type="button" class="btn ghost sm" data-cart="clear">${ic('trash')} ${t('clear')}</button>` : ''}</div>
    ${c ? `<div class="alert red mt">${ic('khata')}<div class="main small">${t('sellingOnUdhaar', { name: esc(nm(c)) })}</div><button type="button" class="ibtn" data-cart="uncust" aria-label="${t('remove')}">${ic('x')}</button></div>` : ''}
    <div class="cart-lines">${tot.lines.map(cartLineHtml).join('') || emptyHtml('cart', t('cartEmpty'))}</div>
    <div class="totals">
      <div class="tr"><span>${t('subtotal')}</span><b>${rs(tot.subP)}</b></div>
      <div class="tr"><button type="button" class="btn ghost sm" data-cart="disc">${ic('percent')} ${t('discount')}</button><b class="dr">${tot.discP ? NEG + rs(tot.discP) : rs(0)}</b></div>
      ${tot.roundP ? `<div class="tr"><span>${t('roundOff')}</span><b>${tot.roundP > 0 ? '+' : ''}${amt(tot.roundP, true)}</b></div>` : ''}
      <div class="tr grand"><span>${t('total')}</span><span class="money">${rs(tot.totalP)}</span></div>
    </div>
    <button type="button" class="btn lg block binding mt" data-cart="pay" ${tot.lines.length ? '' : 'disabled'}>${ic('check')} ${t('charge')} <bdi>${rs(tot.totalP)}</bdi></button>
    <div class="hint" style="text-align:center">${t('payHint')}</div>`;
}

function drawCart() {
  const tot = cartTotals();
  const panel = $('#posCart');
  if (panel) panel.innerHTML = cartPanelHtml(tot);
  const sheet = $('#sheet .cart-sheet');
  if (sheet) sheet.innerHTML = cartPanelHtml(tot);
  const bar = $('#cartBar');
  if (bar) {
    bar.classList.toggle('hidden', !tot.lines.length || curRoute !== 'sale');
    bar.innerHTML = `<button type="button" class="info" id="cbOpen"><b>${rs(tot.totalP)}</b><span>${t('nItems', { n: tot.lines.length })} · ${t('viewCart')}</span></button>
      <button type="button" class="btn" id="cbPay">${t('charge')}</button>`;
    $('#cbOpen').onclick = openCartSheet;
    $('#cbPay').onclick = openCheckout;
  }
  if ($('#posTiles')) drawTiles();
  announce(t('cartAnnounce', { n: tot.lines.length, amt: rs(tot.totalP) }));
}

function onCartAction(e) {
  const b = e.target.closest('[data-cart]');
  if (!b) return;
  const act = b.dataset.cart;
  const it = itemById(b.dataset.id);
  const line = it && cart.lines.find(l => l.itemId === it.id);
  if (act === 'inc') addToCart(it.id, stepFor(it));
  if (act === 'dec') addToCart(it.id, Math.max(0, line.qty - stepFor(it)), true);
  if (act === 'rm') addToCart(it.id, 0, true);
  if (act === 'qty') openQtyPad(it, line.qty);
  if (act === 'clear') {
    cart = emptyCart();
    saveCart();
    drawCart();
  }
  if (act === 'uncust') {
    cart.custId = '';
    saveCart();
    drawCart();
  }
  if (act === 'disc') openDiscount();
  if (act === 'pay') openCheckout();
}

function openCartSheet() {
  const sh = openModal(`${sheetHead(t('cart'), 'cart')}<div class="cart-sheet"></div>`);
  drawCart();
  sh.onclick = onCartAction;
}

function handleCode(code) {
  const it = S.items.find(i => i.barcode && i.barcode === code);
  if (it) {
    onTile(it);
    toast(t('scanned', { name: nm(it) }), 'ok');
    return;
  }
  toast(t('barcodeUnknown', { code }), 'bad');
  if (isOwner()) openItemForm(null, { barcode: code });
}

function renderSale(arg) {
  if (!cart) cart = store.get('cart', null) || emptyCart();
  if (arg && custById(arg)) {
    cart.custId = arg;
    saveCart();
  }
  const cats = [['freq', t('frequent')], ['all', t('allItems')], ...CATS.map(c => [c.id, catName(c.id)])];
  $('#view').innerHTML = `<div class="pos">
    <div class="pos-main">
      <div class="pos-search">
        <div class="searchbox">${ic('search')}<input class="inp" id="posQ" type="search" autocomplete="off" placeholder="${t('posSearch')}" aria-label="${t('posSearch')}" value="${esc(posQuery)}"></div>
        <button type="button" class="btn ghost icon" id="posScan" aria-label="${t('scan')}">${ic('barcode')}</button>
      </div>
      <div class="chips mt" id="posCats" role="tablist">${cats.map(([id, label]) => `<button type="button" class="chip ${posCat === id && !posQuery ? 'on' : ''}" data-cat="${id}">${label}</button>`).join('')}</div>
      <div class="tiles mt" id="posTiles"></div>
    </div>
    <aside class="cart slip" id="posCart" aria-label="${t('cart')}"></aside>
  </div>`;
  bindSale();
  drawCart();
}

function bindSale() {
  const q = $('#posQ');
  q.oninput = debounce(() => {
    posQuery = q.value;
    $$('#posCats .chip').forEach(c => c.classList.toggle('on', !posQuery && c.dataset.cat === posCat));
    drawTiles();
  }, 120);
  q.onkeydown = e => {
    if (e.key !== 'Enter') return;
    const v = q.value.trim();
    if (/^\d{8,14}$/.test(v)) handleCode(v);
    else if (posList()[0]) onTile(posList()[0]);
    q.value = '';
    posQuery = '';
    drawTiles();
  };
  $$('#posCats .chip').forEach(c => (c.onclick = () => {
    posCat = c.dataset.cat;
    posQuery = '';
    q.value = '';
    $$('#posCats .chip').forEach(x => x.classList.toggle('on', x === c));
    drawTiles();
  }));
  $('#posScan').onclick = () => openScanner(handleCode);
  $('#posCart').onclick = onCartAction;
}

// ---------- quick sale: quantity keypad (by weight/count or "Rs 100 worth") ----------
const QTY_CHIPS = { kg: [250, 500, 1000, 2000, 5000], litre: [250, 500, 1000, 2000], dozen: [6, 12, 24, 30] };

function padQty(it, st) {
  if (st.mode === 'qty') return parseQty(st.entry, it.unit);
  const p = parseRs(st.entry);
  return p > 0 ? Math.floor((p * UNITS[it.unit].base) / it.sellP) : NaN;
}

function drawPad(it, st) {
  const q = padQty(it, st);
  const ok = q > 0;
  if (st.mode === 'qty') {
    $('#qpBig').innerHTML = `<bdi>${esc(st.entry || '0')} ${t('in_' + it.unit)}</bdi>`;
    $('#qpSub').innerHTML = ok ? `= <bdi>${rs(lineAmount(it.sellP, q, it.unit))}</bdi>` : t('typeQty');
  } else {
    $('#qpBig').innerHTML = `<bdi>Rs ${esc(st.entry || '0')}</bdi>`;
    $('#qpSub').innerHTML = ok ? `≈ <bdi>${qtyStr(it.unit, q)}</bdi> = <bdi>${rs(lineAmount(it.sellP, q, it.unit))}</bdi>` : t('typeAmount');
  }
  const chips = st.mode === 'qty' ? QTY_CHIPS[it.unit] || [1, 2, 3, 5, 10, 12] : [5000, 10000, 20000, 50000];
  $('#qpChips').innerHTML = chips.map(c => `<button type="button" class="chip" data-chip="${c}">${st.mode === 'qty' ? qtyStr(it.unit, c) : rs(c)}</button>`).join('');
  $$('#qpChips [data-chip]').forEach(b => (b.onclick = () => {
    const v = Number(b.dataset.chip);
    st.entry = st.mode === 'qty' ? qtyInput(it.unit, v) : rsInput(v);
    drawPad(it, st);
  }));
  $('#qpAdd').disabled = !ok;
}

function padKey(st, k, decimals) {
  if (k === 'del') st.entry = st.entry.slice(0, -1);
  else if (k === '.') {
    if (decimals && !st.entry.includes('.')) st.entry = (st.entry || '0') + '.';
  } else if (st.entry.length < 8) st.entry = st.entry === '0' ? k : st.entry + k;
}

function openQtyPad(it, current = 0) {
  const st = { mode: 'qty', entry: current ? qtyInput(it.unit, current) : '' };
  const sh = openModal(`${sheetHead(esc(nm(it)), 'scale')}
    <div class="between"><div class="seg" id="qpMode"><button type="button" data-m="qty" class="on">${t('byQty')}</button>
      ${UNITS[it.unit].loose ? `<button type="button" data-m="rs">${t('byAmount')}</button>` : ''}</div>
      <span class="small muted"><bdi>${rs(it.sellP)}</bdi> ${t('per_' + it.unit)} · ${t('inStock')} ${qtyHtml(it.unit, it.stock)}</span></div>
    <div class="qtyshow" aria-live="polite"><div class="big" id="qpBig"></div><div class="sub" id="qpSub"></div></div>
    <div class="chips" id="qpChips"></div>
    <div class="keypad mt" id="qpKeys">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0', 'del'].map(k => `<button type="button" data-k="${k}" aria-label="${k === 'del' ? t('backspace') : k}">${k === 'del' ? ic('backspace') : k}</button>`).join('')}</div>
    <div class="sfoot"><button type="button" class="btn ghost" data-close>${t('cancel')}</button><button type="button" class="btn binding" id="qpAdd">${ic('check')} ${t(current ? 'update' : 'addToCart')}</button></div>`);
  const decimals = () => st.mode === 'rs' || UNITS[it.unit].dec > 0;
  $$('#qpMode button', sh).forEach(b => (b.onclick = () => {
    st.mode = b.dataset.m;
    st.entry = '';
    $$('#qpMode button', sh).forEach(x => x.classList.toggle('on', x === b));
    drawPad(it, st);
  }));
  $$('#qpKeys [data-k]', sh).forEach(b => (b.onclick = () => {
    padKey(st, b.dataset.k, decimals());
    drawPad(it, st);
  }));
  sh.onkeydown = e => {
    if (/^[0-9.]$/.test(e.key)) padKey(st, e.key, decimals());
    else if (e.key === 'Backspace') padKey(st, 'del', true);
    else if (e.key === 'Enter') return $('#qpAdd').click();
    else return;
    e.preventDefault();
    drawPad(it, st);
  };
  $('#qpAdd', sh).onclick = () => {
    const q = padQty(it, st);
    if (q > 0 && addToCart(it.id, q, true)) closeModal();
  };
  drawPad(it, st);
  setTimeout(() => $('#qpAdd', sh).focus(), 90);
}

// ---------- quick sale: discount (helpers are capped by the owner's setting) ----------
function discountFrom(mode, raw, subP) {
  if (mode === 'rs') return parseRs(raw);
  const v = Number(raw);
  return raw !== '' && v >= 0 && v <= 100 ? Math.round((subP * v) / 100) : NaN;
}

function openDiscount() {
  const tot = cartTotals();
  const cap = isOwner() ? 100 : S.settings.helperDiscPct;
  let mode = 'rs';
  const sh = openModal(`${sheetHead(t('discount'), 'percent')}
    <div class="seg" id="dMode"><button type="button" data-m="rs" class="on">${t('rupees')}</button><button type="button" data-m="pct">%</button></div>
    <label class="fld mt"><span>${t('discountAmount')}</span><input class="inp money-in" id="dVal" inputmode="decimal" value="${tot.discP ? rsInput(tot.discP) : ''}" placeholder="0"></label>
    <div class="hint">${isOwner() ? t('discHintOwner') : t('discHintHelper', { n: cap })}</div>
    <div class="between mt"><span>${t('newTotal')}</span><b class="money" id="dPrev"></b></div><div class="err hidden" id="dErr"></div>
    <div class="sfoot"><button type="button" class="btn ghost" id="dZero">${t('noDiscount')}</button><button type="button" class="btn binding" id="dOk">${t('apply')}</button></div>`);
  const calc = () => {
    const d = discountFrom(mode, $('#dVal').value.trim(), tot.subP);
    const bad = !(d >= 0) || d > tot.subP || d > Math.round((tot.subP * cap) / 100);
    $('#dPrev').textContent = bad ? '—' : rs(billTotals(tot.lines, d).totalP);
    $('#dErr').classList.toggle('hidden', !bad || $('#dVal').value === '');
    $('#dErr').textContent = d > Math.round((tot.subP * cap) / 100) ? t('err_discCap', { n: cap }) : t('err_amount');
    return bad ? null : d;
  };
  $$('#dMode button', sh).forEach(b => (b.onclick = () => {
    mode = b.dataset.m;
    $$('#dMode button', sh).forEach(x => x.classList.toggle('on', x === b));
    calc();
  }));
  $('#dVal').oninput = calc;
  $('#dZero').onclick = () => applyDiscount(0);
  $('#dOk').onclick = () => {
    const d = calc();
    if (d !== null) applyDiscount(d);
  };
  calc();
}

function applyDiscount(d) {
  cart.discP = d;
  saveCart();
  closeModal();
  drawCart();
}

// ---------- quick sale: payment ----------
const PM_ICON = { cash: 'banknote', jazzcash: 'smartphone', easypaisa: 'smartphone', udhaar: 'khata' };

function cashNotes(total) {
  const list = [total, Math.ceil(total / 10000) * 10000, Math.ceil(total / 50000) * 50000, Math.ceil(total / 100000) * 100000, Math.ceil(total / 500000) * 500000];
  return [...new Set(list)].slice(0, 5);
}

function udhaarBodyHtml(p, tot) {
  const c = custById(p.custId);
  if (!c) return `<button type="button" class="btn ghost block" id="pCust">${ic('user')} ${t('chooseCustomer')}</button>`;
  const after = c.balanceP + tot.totalP - (p.paidNowP || 0);
  const over = c.limitP > 0 && after > c.limitP;
  return `<button type="button" class="btn ghost block" id="pCust">${ic('user')} ${esc(nm(c))} · ${t('change')}</button>
    <div class="facts mt"><div class="fact"><div class="k">${t('balanceNow')}</div><div class="v dr">${rs(c.balanceP)}</div></div>
      <div class="fact"><div class="k">${t('afterSale')}</div><div class="v ${over ? 'dr' : ''}">${rs(after)}</div></div>
      <div class="fact"><div class="k">${t('creditLimit')}</div><div class="v">${rs(c.limitP)}</div></div>
      <div class="fact"><div class="k">${t('risk')}</div><div class="v small">${riskOf(c).map(riskTag).join(' ') || t('none')}</div></div></div>
    <label class="fld mt"><span>${t('paidNow')}</span><input class="inp money-in" id="pNow" inputmode="decimal" placeholder="0" value="${p.paidNowP ? rsInput(p.paidNowP) : ''}"></label>

      ${p.override ? `<div><b>${t('ownerApproved')}</b></div>` : `<button type="button" class="btn sm red mt" id="pOverride">${ic('key')} ${t('approveOver')}</button>`}</div></div>` : ''}`;
}

function payBodyHtml(p, tot) {
  if (p.method === 'cash') {
    return `<label class="fld"><span>${t('tendered')}</span><input class="inp money-in" id="pTend" inputmode="decimal" value="${rsInput(p.tenderedP)}"></label>
      <div class="notes mt">${cashNotes(tot.totalP).map(n => `<button type="button" class="chip" data-note="${n}">${n === tot.totalP ? t('exact') : rs(n)}</button>`).join('')}</div>
      <div class="between mt"><span>${t('changeDue')}</span><span class="change" id="pChange">${rs(Math.max(0, p.tenderedP - tot.totalP))}</span></div>`;
  }
  if (p.method === 'udhaar') return udhaarBodyHtml(p, tot);
  // TODO(student): confirm wallet payments automatically (JazzCash/Easypaisa merchant API or a Raast QR) instead of trusting the typed reference.
  return `<div class="notice">${ic('smartphone')}<span>${t('walletAsk', { num: esc(S.settings.wallet), amt: rs(tot.totalP), w: t('pm_' + p.method) })}</span></div>
    <label class="fld mt"><span>${t('walletRef')}</span><input class="inp" id="pRef" value="${esc(p.ref)}" autocomplete="off"></label>`;
}

function bindPayBody(p, tot, redraw) {
  const tend = $('#pTend');
  if (tend) {
    tend.oninput = () => {
      const v = parseRs(tend.value);
      p.tenderedP = v >= 0 ? v : 0;
      $('#pChange').textContent = rs(Math.max(0, p.tenderedP - tot.totalP));
      tend.classList.toggle('bad', !(v >= tot.totalP));
    };
    $$('[data-note]').forEach(b => (b.onclick = () => {
      tend.value = rsInput(Number(b.dataset.note));
      tend.oninput();
    }));
  }
  if ($('#pRef')) $('#pRef').oninput = e => (p.ref = e.target.value.trim());
  if ($('#pCust')) $('#pCust').onclick = () => pickCustomer(c => {
    p.custId = c.id;
    p.override = false;
    openCheckout(p);
  });
  if ($('#pNow')) $('#pNow').onchange = e => {
    const v = parseRs(e.target.value || '0');
    p.paidNowP = v >= 0 ? Math.min(v, tot.totalP) : 0;
    later(redraw);
  };
  if ($('#pOverride')) $('#pOverride').onclick = () => requireOwner(() => {
    p.override = true;
    openCheckout(p);
  }, true);
}

function openCheckout(prev = null) {
  const tot = cartTotals();
  if (!tot.lines.length) return;
  if (isClosed(todayKey())) return showError(new KKError('err_dayClosed'));
  const p = prev || { method: cart.custId ? 'udhaar' : 'cash', tenderedP: tot.totalP, ref: '', custId: cart.custId, paidNowP: 0, override: false };
  const sh = openModal(`${sheetHead(t('payment'), 'wallet')}
    <div class="between"><span class="muted">${t('total')}</span><span class="money" style="font-size:1.7rem">${rs(tot.totalP)}</span></div>
    <div class="paymethods mt" id="pmBox">${PAY_METHODS.map(m => `<button type="button" class="paym ${m === 'udhaar' ? 'udhaar' : ''}" data-pm="${m}">${ic(PM_ICON[m])}<span>${t('pm_' + m)}</span></button>`).join('')}</div>
    <div id="payBody" class="mt"></div>
    <div class="sfoot"><button type="button" class="btn ghost" data-close>${t('back')}</button><button type="button" class="btn lg binding" id="payDone">${ic('check')} ${t('completeSale')}</button></div>`);
  const draw = () => {
    $$('[data-pm]', sh).forEach(b => b.classList.toggle('on', b.dataset.pm === p.method));
    $('#payBody').innerHTML = payBodyHtml(p, tot);
    bindPayBody(p, tot, draw);
  };
  $$('[data-pm]', sh).forEach(b => (b.onclick = () => {
    p.method = b.dataset.pm;
    draw();
  }));
  $('#payDone', sh).onclick = () => completeSale(p);
  draw();
}

function checkCredit(p, totalP) {
  const c = custById(p.custId);
  if (!c) throw new KKError('err_needCustomer');
  const after = c.balanceP + totalP - (p.paidNowP || 0);
  if (c.limitP > 0 && after > c.limitP && !p.override) throw new KKError('err_limit', { name: nm(c) });
}

function completeSale(p) {
  try {
    assertOpen();
    const tot = cartTotals();
    if (!tot.lines.length) throw new KKError('err_noLines');
    if (!isOwner() && cart.discP > Math.round((tot.subP * S.settings.helperDiscPct) / 100)) throw new KKError('err_discCap', { n: S.settings.helperDiscPct });
    if (p.method === 'cash' && p.tenderedP < tot.totalP) throw new KKError('err_tendered');
    if (p.method === 'udhaar') checkCredit(p, tot.totalP);
    const draft = { ts: Date.now(), by: role, lines: tot.lines.map(l => ({ itemId: l.itemId, qty: l.qty, priceP: l.priceP })), discP: cart.discP, ...p };
    const sale = postSale(draft);
    logAct(p.override ? 'act_saleOver' : 'act_sale', { no: sale.no, amt: sale.totalP, m: sale.method, cust: sale.custId }, 'sale');
    touch('items', 'sales', 'ledger', 'customers', 'activity');
    cart = emptyCart();
    saveCart();
    closeModal();
    rerender();
    openReceipt(sale, true);
    toast(t('saleDone', { no: sale.no }), 'ok');
  } catch (e) {
    showError(e);
  }
}

// ---------- receipts: 58 mm thermal layout, plain-text share, void ----------
const balanceAt = (custId, ts) => sum(custEntries(custId).filter(e => e.ts <= ts), e => signOf(e) * e.amountP);

function receiptPayRows(s) {
  const rows = [[t('pm_' + s.method), '']];
  if (s.method === 'cash') rows.push([t('tendered'), amt(s.tenderedP, true)], [t('changeDue'), amt(s.changeP, true)]);
  if (s.walletP && s.ref) rows.push([t('walletRef'), s.ref]);
  if (s.method === 'udhaar') {
    if (s.cashP) rows.push([t('paidNow'), amt(s.cashP, true)]);
    rows.push([t('addedToKhata'), amt(s.creditP, true)], [t('newBalance'), amt(balanceAt(s.custId, s.ts), true)]);
  }
  return rows;
}

function receiptHtml(s) {
  const st = S.settings;
  const c = custById(s.custId);
  const tr = (l, r, cls = '') => `<tr class="${cls}"><td>${l}</td><td class="r">${r}</td></tr>`;
  const lines = s.lines.map(l => {
    const it = itemById(l.itemId);
    return `<tr><td colspan="2" class="it">${esc(nm(it))}</td></tr>${tr(`<span class="q">${qtyStr(it.unit, l.qty)} × ${amt(l.priceP)}</span>`, amt(l.amountP, true))}`;
  }).join('');
  return `<div class="receipt" dir="${lang === 'ur' ? 'rtl' : 'ltr'}">
    <div class="c shop">${esc(st.shopName)}</div><div class="c ur">${esc(st.shopUr)}</div>
    <div class="c">${esc(lang === 'ur' ? st.addressUr : st.address)}</div><div class="c">${esc(st.phone)}</div><hr>
    <table>${tr(`${t('billNo')} <bdi><b>#${s.no}</b></bdi>`, `<bdi>${fmtDT(s.ts)}</bdi>`)}${tr(`${t('cashier')}: ${t('role_' + s.by)}`, c ? esc(nm(c)) : '')}</table><hr>
    <table>${lines}</table><hr>
    <table>${tr(t('subtotal'), amt(s.subP, true))}${s.discP ? tr(t('discount'), NEG + amt(s.discP, true)) : ''}${s.roundP ? tr(t('roundOff'), amt(s.roundP, true)) : ''}
      ${tr(t('total'), rs(s.totalP), 'tot')}</table><hr>
    <table>${receiptPayRows(s).map(([l, r]) => tr(l, esc(r))).join('')}</table>
    ${s.voided ? `<hr><div class="c"><b>${t('voided')}</b> · ${fmtDT(s.voided.ts)}</div>` : ''}
    <div class="foot">${esc(lang === 'ur' ? st.footerUr : st.footer)}<div>${t('itemsCount', { n: s.lines.length })}</div></div></div>`;
}

// 32 characters per line = font A on a 58 mm ESC/POS printer.
function receiptText(s) {
  const W = 32;
  const lr = (l, r) => (W - l.length - r.length >= 1 ? l + ' '.repeat(W - l.length - r.length) + r : l + '\n' + r.padStart(W));
  const rule = '-'.repeat(W);
  const st = S.settings;
  const out = [st.shopName, st.address, st.phone, rule, lr(`${t('billNo')} #${s.no}`, fmtDT(s.ts)), rule];
  s.lines.forEach(l => {
    const it = itemById(l.itemId);
    out.push(nm(it), lr(`  ${qtyStr(it.unit, l.qty)} x ${amt(l.priceP)}`, amt(l.amountP, true)));
  });
  out.push(rule, lr(t('subtotal'), amt(s.subP, true)));
  if (s.discP) out.push(lr(t('discount'), '-' + amt(s.discP, true)));
  if (s.roundP) out.push(lr(t('roundOff'), amt(s.roundP, true)));
  out.push(lr(t('total'), rs(s.totalP)), rule);
  receiptPayRows(s).forEach(([l, r]) => out.push(lr(l, r)));
  out.push(rule, lang === 'ur' ? st.footerUr : st.footer);
  return out.join('\n');
}

function printReceipt(s) {

async function shareText(text, phone = '') {
  if (navigator.share) {
    try {
      await navigator.share({ text });
      return;
    } catch {
      /* cancelled: fall through to copy */
    }
  }
  if (phone) window.open(`https://wa.me/${phoneIntl(phone)}?text=${encodeURIComponent(text)}`, '_blank', 'noopener');
  else copyText(text);
}

function copyText(text) {
  const done = () => toast(t('copied'), 'ok');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.append(ta);
  ta.select();
  try {
    document.execCommand('copy');
    done();
  } catch {
    toast(t('copyFailed'), 'bad');
  }
  ta.remove();
}

// ---------- view: bills (sales history) ----------
let billRange = 'today';
let billMethod = 'all';
let billQuery = '';

function billsInRange() {
  const days = { today: 0, yesterday: 1, week: 6, month: 29 }[billRange];
  const from = dayStartOf(addDays(todayKey(), -days));
  const to = billRange === 'yesterday' ? dayStartOf(todayKey()) : Infinity;
  const q = billQuery.trim().toLowerCase();
  return S.sales.filter(s => s.ts >= from && s.ts < to).filter(s => {
    if (billMethod === 'void') return !!s.voided;
    if (billMethod === 'wallet') return s.method === 'jazzcash' || s.method === 'easypaisa';
    return billMethod === 'all' || s.method === billMethod;
  }).filter(s => !q || String(s.no).includes(q) || nm(custById(s.custId)).toLowerCase().includes(q) || s.lines.some(l => nm(itemById(l.itemId)).toLowerCase().includes(q))).reverse();
}

function renderBills() {
  if (!isOwner()) billRange = 'today';
  const list = billsInRange();
  const live = list.filter(s => !s.voided);
  const ranges = isOwner() ? ['today', 'yesterday', 'week', 'month'] : ['today'];
  $('#view').innerHTML = `<div class="pagehead"><div><h2>${t('nav_bills')}</h2><p>${t('billsSub')}</p></div><a class="btn binding" href="#sale">${ic('cart')} ${t('newSale')}</a></div>
    <div class="kpis stagger">${kpi(t('k_bills'), 'receipt', live.length, '', 'blue', 'n')}${kpi(t('k_billTotal'), 'coins', sum(live, s => s.totalP), '', 'green')}
      ${kpi(t('k_avgBill'), 'calculator', live.length ? Math.round(sum(live, s => s.totalP) / live.length) : 0)}${kpi(t('k_onUdhaar'), 'khata', sum(live, s => s.creditP), '', 'red')}</div>
    <div class="slip mt"><div class="between"><div class="seg" id="bRange">${ranges.map(r => `<button type="button" data-r="${r}" class="${billRange === r ? 'on' : ''}">${t('rg_' + r)}</button>`).join('')}</div>

// ---------- view: stock (inventory list) ----------
let stockFilter = 'all';
let stockCat = '';
let stockSort = 'name';
let stockQuery = '';

function stockList() {
  const dead = new Set(deadStock().map(i => i.id));
  const q = stockQuery.trim();
  let list = q ? searchItems(q, 500) : S.items.slice();
  if (stockCat) list = list.filter(i => i.cat === stockCat);
  const f = {
    low: i => stockState(i) !== 'ok',
    out: i => i.stock <= 0,
    expiry: i => ['near', 'expired'].includes(expiryState(i)),
    dead: i => dead.has(i.id),
  }[stockFilter];
  if (f) list = list.filter(f);
  const sorters = {
    name: (a, b) => nm(a).localeCompare(nm(b)),
    value: (a, b) => b.poolP - a.poolP,
    cover: (a, b) => reorderPlan(a).cover - reorderPlan(b).cover,
    margin: (a, b) => marginPct(a) - marginPct(b),
  };
  return list.sort(sorters[stockSort]);
}

function stockRow(it) {
  const st = stockState(it);
  const ex = expiryState(it);
  const fill = clamp(pct(it.stock, Math.max(it.reorder * 3, 1)), 2, 100);
  const tags = [];
  if (st === 'out') tags.push(`<span class="tag red">${t('outOfStock')}</span>`);
  else if (st === 'low') tags.push(`<span class="tag amber">${t('lowStock')}</span>`);
  if (ex === 'expired') tags.push(`<span class="tag red">${ic('hourglass')} ${t('expired')}</span>`);
  if (ex === 'near') tags.push(`<span class="tag amber">${ic('hourglass')} ${t('expiresIn', { n: expiryDays(it) })}</span>`);
  return `<a class="lrow stockrow" href="#item/${it.id}">
    <div class="av" style="color:var(--binding)">${ic(catById(it.cat).icon)}</div>
    <div class="main"><b>${esc(nm(it))}</b><div class="sub"><span>${catName(it.cat)}</span><span>· <bdi>${rs(it.sellP)}</bdi> ${t('per_' + it.unit)}</span>${tags.join(' ')}</div></div>
    <div class="end"><span class="qtybadge ${st === 'out' ? 'zero' : st === 'low' ? 'low' : ''}">${qtyHtml(it.unit, it.stock)}</span>
      <div class="minibar ${st !== 'ok' ? 'low' : ''}"><i style="width:${fill}%"></i></div><div class="tiny muted">${money(it.poolP)}</div></div></a>`;
}

    <div class="kpis stagger">${kpi(t('k_items'), 'box', S.items.length, t('nCats', { n: CATS.length }), 'blue', 'n')}

      ${kpi(t('k_retailValue'), 'tag', retailValueP(), t('potentialGP', { amt: rs(retailValueP() - stockValueP()) }))}

function drawStockList() {

function bindStock() {

// ---------- view: item detail (facts, reorder maths, batches, movements) ----------
function itemMovements(it, limit = 40) {
  const rows = [];
  S.purchases.forEach(p => p.lines.forEach(l => l.itemId === it.id && rows.push({ ts: p.ts, kind: 'purchase', qty: l.qty, valueP: l.costP, ref: '#' + p.no + ' · ' + nm(supById(p.supId)) })));
  S.adjust.forEach(a => a.itemId === it.id && rows.push({ ts: a.ts, kind: 'adj', qty: a.qty, valueP: a.costP, ref: t('adj_' + a.reason) + (a.note ? ' · ' + a.note : '') }));
  const byDay = new Map();
  S.sales.forEach(s => !s.voided && s.lines.forEach(l => {
    if (l.itemId !== it.id) return;
    const k = dkey(s.ts);
    const d = byDay.get(k) || { ts: dayStartOf(k) + 23 * HOUR, kind: 'sales', qty: 0, valueP: 0, n: 0 };
    d.qty -= l.qty;
    d.valueP -= l.costP;
    d.n++;
    byDay.set(k, d);
  }));
  byDay.forEach(d => rows.push({ ...d, ref: t('nBills', { n: d.n }) }));
  return rows.sort((a, b) => b.ts - a.ts).slice(0, limit);
}

function reorderExplainHtml(it) {
  const p = reorderPlan(it);
  const u = b => qtyStr(it.unit, Math.round(b));
  return `<div class="calc" dir="ltr">
    v = <b>${u(p.mean)}</b>/day · σ = ${u(p.sd)} · L = ${p.L} d · R = ${p.R} d · z = ${SAFETY_Z}<br>
    SS = z·σ·√L = <b>${u(p.ss)}</b> · ROP = v·L + SS = <b>${u(p.rop)}</b><br>
    T = v·(L+R) + z·σ·√(L+R) = <b>${u(p.target)}</b> · stock = ${u(it.stock)}<br>
    order = ceil((T − stock) / pack) × ${u(it.pack)} = <b>${p.packs} × ${u(it.pack)} = ${u(p.suggest)}</b></div>
    <p class="small muted mt">${t('reorderExplain')}</p>`;
}

function itemFactsHtml(it) {
  const p = reorderPlan(it);

    ${f(t('stockValue'), rs(it.poolP))}${f(t('reorderLevel'), qtyHtml(it.unit, it.reorder))}
    ${f(t('daysCover'), Number.isFinite(p.cover) ? p.cover.toFixed(1) : '—')}${f(t('expiry'), it.expiry ? fmtExp(it.expiry) : '—', ['near', 'expired'].includes(expiryState(it)) ? 'dr' : '')}</div>`;
}

// ---------- inventory forms: add/edit item, stock adjustment, barcode scanner ----------
const field = (label, inner, hint = '') => `<label class="fld"><span>${label}</span>${inner}${hint ? `<div class="hint">${hint}</div>` : ''}</label>`;
const opt = (v, label, cur) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${label}</option>`;

function itemFormHtml(it, pre) {
  const v = it || { name: '', ur: '', cat: 'atta', unit: 'packet', sellP: 0, reorder: 0, pack: 1, supId: S.suppliers[0] ? S.suppliers[0].id : '', barcode: pre.barcode || '' };
