    <td>${e.src === 'user' ? `<button class="btn sm ghost icon" data-dsdel="${e.id}" aria-label="${t('delete')}">${ic('trash')}</button>` : ''}</td></tr>`);
  return `<div class="split">
    <div class="stack">
      <section class="panel"><header class="ph"><span class="num">01</span><h3>${t('composition')}</h3></header><div class="pb">${datasetSummary()}</div></section>
      <section class="panel"><header class="ph"><span class="num">02</span><h3>${t('addExample')}</h3></header><div class="pb stack">
        <label class="field"><span>${t('messageText')}</span><textarea id="dsText" rows="4" dir="auto"></textarea></label>
        <div class="seg" id="dsLabel"><button type="button" data-l="s" class="on">${t('labelScam')}</button><button type="button" data-l="h">${t('labelLegit')}</button></div>
        <div class="row"><button class="btn primary" id="dsAdd">${ic('plus')}${t('add')}</button><button class="btn ghost" id="dsResetLabels">${ic('undo')}${t('resetRelabels')}</button></div>
        <p class="muted small">${t('dsSynthetic')}</p></div></section>
    </div>
    <section class="panel"><header class="ph"><span class="num">03</span><h3>${t('messages')}</h3><span class="meta"><span class="badge mono">${rows.length}</span></span></header>
      <div class="pb stack">
        <input type="search" id="dsQ" value="${esc(DS_VIEW.q)}" placeholder="${t('searchMessages')}" aria-label="${t('searchMessages')}">
        ${chipRow('script', ['all', 'en', 'ur', 'ru'])}${chipRow('label', ['all', 's', 'h'])}${chipRow('src', ['all', 'seed', 'user', 'relabelled'])}
        <div class="table-wrap"><table class="data"><thead><tr><th>ID</th><th>${t('message')}</th><th>${t('script')}</th><th>${t('label')}</th><th></th></tr></thead><tbody>${body.join('') || `<tr><td colspan="5" class="muted">${t('noMatches')}</td></tr>`}</tbody></table></div>
        <div class="pager"><button class="btn sm" id="dsPrev" ${DS_VIEW.page ? '' : 'disabled'}>${ic('chevron-left')}</button><span class="mono">${DS_VIEW.page + 1} / ${pages}</span><button class="btn sm" id="dsNext" ${DS_VIEW.page < pages - 1 ? '' : 'disabled'}>${ic('chevron-right')}</button></div>
      </div></section></div>`;
}

function bindDataset(page) {
  $$('[data-dsf]', page).forEach(b => (b.onclick = () => {
    DS_VIEW[b.dataset.dsf] = b.dataset.v;
    DS_VIEW.page = 0;
    refresh();
  }));
  $('#dsQ', page).oninput = debounce(e => {
    DS_VIEW.q = e.target.value;
    DS_VIEW.page = 0;
    refresh();
    const q = $('#dsQ');
    q.focus();
    q.setSelectionRange(q.value.length, q.value.length);
  }, 250);
  $('#dsPrev', page).onclick = () => {
    DS_VIEW.page--;
    refresh();
  };
  $('#dsNext', page).onclick = () => {
    DS_VIEW.page++;
    refresh();
  };
  $$('#dsLabel button', page).forEach(b => (b.onclick = () => $$('#dsLabel button', page).forEach(x => x.classList.toggle('on', x === b))));
  $('#dsAdd', page).onclick = () => {
    const text = $('#dsText', page).value.trim();
    if (!text) return toast(t('pasteFirst'), 'warn');
    const st = datasetState();
    const sc = detectScript(text);
    st.added.push({ id: uid('u'), label: $('#dsLabel .on', page).dataset.l, script: sc === 'mixed' ? 'ru' : sc, text, at: nowISO() });
    markDatasetChanged(st);
    toast(t('addedToDataset'));
    refresh();
  };
  $('#dsResetLabels', page).onclick = () => confirmModal(t('confirmResetLabels'), () => {
    const st = datasetState();
    st.relabels = {};
    markDatasetChanged(st);
    refresh();
  });
  $$('[data-dsdel]', page).forEach(b => (b.onclick = () => {
    const st = datasetState();
    st.added = st.added.filter(a => a.id !== b.dataset.dsdel);
    markDatasetChanged(st);
    refresh();
  }));
}

function explainTab() {
  const m = getModel();
  const g = which => globalTopTokens(m, which, 10);
  const col = which => `<section class="panel"><header class="ph"><span class="num">${which.toUpperCase()}</span><h3>${t('globalTokens')} · ${t('model_' + which)}</h3></header><div class="pb stack">
      <div class="label">${t('towardScam')}</div>${tokenBars(g(which).scam)}<div class="label">${t('towardSafe')}</div>${tokenBars(g(which).legit)}</div></section>`;
  return `<section class="panel"><header class="ph"><span class="num">01</span><h3>${t('tryMessage')}</h3></header><div class="pb stack">
      <textarea id="exText" rows="3" dir="auto" placeholder="${t('anPlaceholder')}">${esc(getDraft().text || MSG_SAMPLES[2].text)}</textarea>
      <div class="row"><button class="btn primary" id="exGo">${ic('zap')}${t('explain')}</button></div><div id="exOut" aria-live="polite"></div></div></section>
    <div class="grid g2 mt">${col('lr')}${col('nb')}</div>`;
}

function explainResult(text) {
  const pr = predict(getModel(), text);
  const block = k => `<div class="stack"><div class="between"><b>${t('model_' + k)}</b>${verdictBadge(pr[k].p >= getModel().opts.threshold ? 'high' : 'low', pct(pr[k].p) + ' ' + t('labelScam'))}</div>${tokenBars(topContrib(pr[k].contrib, 10))}</div>`;
  return `<div class="grid g2 mt">${block('nb')}${block('lr')}</div>${legend([{ color: 'red', label: t('towardScam') }, { color: 'series-1', label: t('towardSafe') }])}<p class="muted small">${t('explainNote')}</p>`;
}

function bindExplain(page) {
  const run = () => {
    const text = $('#exText', page).value.trim();
    if (!text) return toast(t('pasteFirst'), 'warn');
    const out = $('#exOut', page);
    out.innerHTML = explainResult(text);
    animateNumbers(out);
  };
  $('#exGo', page).onclick = run;
  if ($('#exText', page).value.trim()) run();
}

function exportTab() {
  const m = getModel();
  const ev = m.eval;
  const lr = confusion(ev.pLR, ev.ys, m.opts.threshold);
  const nb = confusion(ev.pNB, ev.ys, m.opts.threshold);
  const meta = [[t('source'), t('src_' + m.source)], [t('trainedAt'), m.trainedAt ? fmtDateTime(m.trainedAt) : '—'], [t('vocabSize'), m.vocab.length], [t('options'), `α ${m.opts.alpha} · lr ${m.opts.lr} · ${m.opts.epochs} ep · L2 ${m.opts.l2} · ${m.opts.bigrams ? 'bigrams' : 'unigrams'} · ${m.opts.rules ? 'hybrid' : 'text-only'}`], ['F1 (NB / LR)', `${nb.f1.toFixed(3)} / ${lr.f1.toFixed(3)}`]];
  return `<div class="grid g2">
    <section class="panel"><header class="ph"><span class="num">01</span><h3>${t('currentModel')}</h3></header><div class="pb"><dl class="parts-grid">${meta.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
      ${m.source === 'import' ? `<p class="muted small mt">${t('importedEvalNote')}</p>` : ''}</div></section>
    <section class="panel"><header class="ph"><span class="num">02</span><h3>${t('exportImport')}</h3></header><div class="pb stack">
      <div class="row"><button class="btn primary" id="mxExport">${ic('download')}${t('exportModel')}</button><button class="btn" id="mxImport">${ic('upload')}${t('importModel')}</button>${m.source === 'import' ? `<button class="btn ghost" id="mxRevert">${ic('undo')}${t('revertModel')}</button>` : ''}</div>
      <div class="row"><button class="btn" id="mxCsv">${ic('file')}${t('exportCsv')}</button><button class="btn" id="mxPrint">${ic('printer')}${t('printEval')}</button></div>
      <p class="muted small">${t('exportNote')}</p></div></section></div>`;
}

const csvCell = v => `"${String(v).replace(/"/g, '""')}"`;

function bindExport(page) {
  $('#mxExport', page).onclick = () => {
    download('fraudshield-model.json', exportModelJSON(getModel()));
    logEvent('logModelExport', {}, 'download');
  };
  $('#mxImport', page).onclick = async () => {
    const f = await pickFile();
    if (!f) return;
    try {
      MODEL = importModelJSON(f.text);
      store.set('model', JSON.parse(f.text));
      logEvent('logModelImport', { name: f.name }, 'upload');
      toast(t('modelImported'));
      refresh();

      toast(t('modelImportFailed') + ' ' + esc(err.message), 'err');
    }
  };
  if ($('#mxRevert', page)) $('#mxRevert', page).onclick = () => {
    retrain(mlOpts());

    const lines = ['id,label,script,source,text', ...allExamples().map(e => [e.id, e.label === 's' ? 'scam' : 'legit', e.script, e.src, e.text].map(csvCell).join(','))];
    download('fraudshield-dataset.csv', '\uFEFF' + lines.join('\n'), 'text/csv');
  };
  $('#mxPrint', page).onclick = () => printReport('model');
}

// ---------- link checker UI ----------
const LINK_SAMPLES = ['http://easypaisa-verify.top/login', 'https://xn--bl-3wc.com/secure', 'hbl.com.pk.secure-login.xyz/kyc', 'https://jazzcassh.com.pk/bonus', 'bit.ly/ep-bonus', 'http://193.34.12.8/jazzcash.apk', 'https://www.hbl.com@verify-account.click/', 'https://www.meezanbank.com/'];
const SEV_OF = pts => (pts >= 30 ? 'high' : pts > 0 ? 'med' : 'good');

function linkFindingTitle(f) {
  return t('lf_' + f.id, { brand: f.brand || '', domain: f.domain || '', shown: f.shown ?? '' });
}

function anatomyHTML(res) {
  const p = res.parts;
  const reg = res.reg.reg;
  const hostShown = p.unicode !== p.host ? p.unicode : p.host;
  const subPart = hostShown.endsWith(reg) ? hostShown.slice(0, hostShown.length - reg.length) : '';
  const regPart = hostShown.endsWith(reg) ? reg : hostShown;
  const regCls = res.official ? 'ok' : res.level === 'high' ? 'bad' : '';
  return `<div class="anatomy" dir="ltr">${p.scheme ? `<span class="sch">${esc(p.scheme)}://</span>` : ''}${p.userinfo ? `<span class="usr" data-tip="${esc(t('lf_userinfo'))}">${esc(p.userinfo)}@</span>` : ''}<span class="sub">${esc(subPart)}</span><span class="reg ${regCls}" data-tip="${esc(t('registrableTip'))}">${esc(regPart)}</span>${p.port ? `<span class="sch">:${esc(p.port)}</span>` : ''}<span class="pth">${esc(p.path)}</span><span class="qry">${esc(p.query)}</span></div>`;
}

function urlCard(res) {
  if (!res.valid) return `<div class="url-card"><div class="uh">${verdictBadge('med', t('invalidUrl'))}<code>${esc(res.raw)}</code></div></div>`;
  const p = res.parts;
  const findings = res.findings.map(f => `<div class="flag ${SEV_OF(f.pts) === 'high' ? 'high' : SEV_OF(f.pts) === 'good' ? 'good' : ''}"><span class="ico">${ic(f.pts < 0 ? 'shield-check' : f.pts >= 30 ? 'alert' : 'alert-circle')}</span>
      <div><div class="t">${esc(linkFindingTitle(f))}</div><div class="why">${esc(t('lfd_' + f.id, { brand: f.brand || '', domain: f.domain || '', shown: f.shown ?? '' }))}</div></div><span class="pts">${f.pts >= 0 ? '+' : ''}${f.pts}</span></div>`);
  const parts = [[t('scheme'), p.scheme || t('none')], [t('host'), p.host], [t('hostUnicode'), p.unicode], [t('registrable'), res.reg.reg], ['TLD', '.' + res.reg.tld], [t('path'), p.path || '/'], [t('query'), p.query || '—']];
  return `<article class="url-card enter"><div class="uh">${verdictBadge(res.level, t('link_' + res.level))}<span class="score-pill ${res.level}">${res.score}/100</span><code>${esc(res.raw)}</code></div>
    <div class="ub">${anatomyHTML(res)}
      <div class="list">${findings.join('') || `<div class="empty">${ic('shield-check')}<span>${t('noLinkIssues')}</span></div>`}</div>
      <details><summary class="small">${t('urlParts')}</summary><dl class="parts-grid mt">${parts.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl></details>
      <div class="baseline small">${ic('globe')}<span>${t('reputation')}: ${t('rep_' + res.reputation.status)}</span></div>

const defang = u => u.replace(/^http/i, 'hxxp').replace(/\./g, '[.]');

function checkLinks(page, input, save = true) {
  let found = extractUrls(input).map(u => u.raw);
  if (!found.length && input.trim()) found = input.split(/\s+/).filter(Boolean);
  const results = [...new Set(found)].slice(0, 8).map(u => analyseUrl(u));
  $('#lkOut', page).innerHTML = results.length ? results.map(urlCard).join('') : `<div class="panel"><div class="pb"><div class="empty">${ic('link')}<span>${t('noLinksFound')}</span></div></div></div>`;
  if (save) {
    results.filter(r => r.valid).forEach(r => coll.add('links', { id: uid('k'), at: nowISO(), url: r.raw, score: r.score, level: r.level }, 100));
    if (results.length) logEvent('logLinks', { n: results.length }, 'link');
    if (results.some(r => r.level === 'high')) notify('noteBadLink', { url: results.find(r => r.level === 'high').raw }, { icon: 'link', level: 'high', route: '#links' });
  }
  bindUrlCards(page);
  renderLinkHistory(page);
  announce(t('announceLinks', { n: results.length }));
}

// ---------- transaction lab UI: controls, overview charts ----------
const TXN_TABS = ['overview', 'flagged', 'explore', 'tuning'];
const TXN_VIEW = { truth: true, pkSource: 'truth', q: '', type: 'all', sort: 'combined', page: 0 };
const PK_KS = [5, 10, 15, 20, 25, 30, 40, 50, 60, 80, 100];

const scoreCls = v => (v >= txnCfg().threshold ? 'high' : v >= txnCfg().threshold * 0.7 ? 'med' : '');
const reviewOf = id => visibleReviews()[id] || null;
const analystLabel = x => {
  const r = reviewOf(x.id);
  return r ? (r.label === 'fraud' ? true : r.label === 'legit' ? false : null) : null;
};

function flaggedTxns() {
  const cfg = txnCfg();
  return getTxn().txns.filter(x => x.combined >= cfg.threshold).sort((a, b) => b.combined - a.combined);
}

function labControls(cfg) {
  const num = (id, key, v, min, max, step = 1) => `<label class="field"><span>${t(key)}</span><input type="number" id="${id}" value="${v}" min="${min}" max="${max}" step="${step}"></label>`;
  return `<section class="panel"><header class="ph"><span class="num">00</span><h3>${t('generator')}</h3><span class="meta"><span class="badge warn">${t('synthetic')}</span></span></header>
    <div class="pb"><div class="lab-controls">${num('txSeed', 'seed', cfg.seed, 1, 99999)}${num('txAcc', 'accountsN', cfg.accounts, 20, 200)}${num('txDays', 'daysN', cfg.days, 7, 90)}
      ${num('txRate', 'anomalyRate', (cfg.rate * 100).toFixed(1), 0.5, 10, 0.5)}${num('txTrees', 'treesN', cfg.trees, 10, 300, 10)}${num('txSample', 'sampleN', cfg.sample, 32, 1024, 32)}
      <button class="btn primary" id="txRegen">${ic('refresh')}${t('regenerate')}</button></div></div></section>`;
}

function txnKpis(d) {
  const flagged = flaggedTxns();
  const truth = d.txns.filter(x => x.fraud).length;
  const ys = d.txns.map(x => (x.fraud ? 1 : 0));
  const auc = key => aucScore(d.txns.map(x => x[key]), ys);
  const hits = flagged.filter(x => x.fraud).length;
  return `<div class="kpis stagger">
    <div class="tile"><span class="k">${ic('activity')}${t('kpiTxns')}</span><span class="v" data-count="${d.txns.length}">0</span><span class="s">${t('kpiAccounts', { n: d.accounts.length, days: d.cfg.days })}</span></div>
    <div class="tile"><span class="k">${ic('banknote')}${t('kpiVolume')}</span><span class="v">${(sum(d.txns.map(x => x.amount)) / 1e6).toFixed(1)}M</span><span class="s">PKR · ${t('synthetic')}</span></div>
    <div class="tile red"><span class="k">${ic('flag')}${t('kpiFlagged')}</span><span class="v" data-count="${flagged.length}">0</span><span class="s">${t('atThreshold', { thr: d.cfg.threshold })}</span></div>
    <div class="tile amber"><span class="k">${ic('target')}${t('kpiSeeded')}</span><span class="v" data-count="${truth}">0</span><span class="s">${t('kpiCaught', { n: hits, p: pct(flagged.length ? hits / flagged.length : 0) })}</span></div>
    <div class="tile green"><span class="k">${ic('split')}AUC</span><span class="v">${auc('iso').toFixed(3)}</span><span class="s">IF · ${t('rules')} ${auc('rule').toFixed(3)} · ${t('combined')} ${auc('combined').toFixed(3)}</span></div>
  </div>`;
}

function scoreHistogram(d) {
  const thr = d.cfg.threshold;
  const bins = Array.from({ length: 20 }, (_, i) => ({ x0: i * 5, n: 0, fr: 0 }));
  d.txns.forEach(x => {
    const b = bins[Math.min(19, Math.floor(x.combined / 5))];
    b.n++;
    if (x.fraud) b.fr++;
  });
  const tip = b => `${b.x0}–${b.x0 + 5}: <b>${b.n}</b>${TXN_VIEW.truth ? ` (${t('seededShort')} ${b.fr})` : ''}`;
  return histogram({ bins, thrX: thr / 100, xFmt: v => v, cls: b => (b.x0 + 5 > thr ? 'bar-r' : 'bar-n'), tip }) + legend([{ color: 'line-2', label: t('belowThr') }, { color: 'red', label: t('aboveThr') }, { kind: 'dash', label: t('threshold') }]);
}

function scatterPlot(d) {
  const w = 560;
  const h = 260;
  const pad = { l: 44, r: 10, t: 10, b: 30 };
  const la = d.txns.map(x => Math.log10(x.amount));
  const yMin = Math.floor(Math.min(...la));
  const yMax = Math.ceil(Math.max(...la));
  const X = hr => pad.l + (hr / 24) * (w - pad.l - pad.r);
  const Y = v => h - pad.b - ((v - yMin) / (yMax - yMin || 1)) * (h - pad.t - pad.b);
  const thr = d.cfg.threshold;
  const grid = [];
  for (let v = yMin; v <= yMax; v++) grid.push(`<line class="gl" x1="${pad.l}" x2="${w - pad.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${pad.l - 6}" y="${Y(v) + 3}" text-anchor="end">${fmtNum(10 ** v)}</text>`);
  [0, 6, 12, 18, 24].forEach(hr => grid.push(`<text class="ax" x="${X(hr)}" y="${h - pad.b + 14}" text-anchor="middle">${String(hr).padStart(2, '0')}:00</text>`));
  const sorted = d.txns.slice().sort((a, b) => a.combined - b.combined);
  const pts = sorted.map(x => {
    const hr = x.f.hour + new Date(x.ts).getMinutes() / 60;
    const flagged = x.combined >= thr;
    const ring = TXN_VIEW.truth && x.fraud ? `<circle class="pt truth" cx="${X(hr)}" cy="${Y(Math.log10(x.amount))}" r="6"/>` : '';
    return `${ring}<circle class="pt ${flagged ? 'flag' : ''}" cx="${X(hr).toFixed(1)}" cy="${Y(Math.log10(x.amount)).toFixed(1)}" r="${flagged ? 4 : 2.6}" data-tx="${x.id}" data-tip="${x.id} · ${fmtPKR(x.amount)}<br>${hhmm(x.ts)} · ${t('combined')} <b>${x.combined.toFixed(0)}</b>"/>`;
  });
  const items = [{ color: 'muted', label: t('normalTxn') }, { color: 'red', label: t('flaggedTxn') }];
  if (TXN_VIEW.truth) items.push({ color: 'amber', label: t('seededAnomaly') });
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${t('scatterTitle')}">${grid.join('')}${pts.join('')}<text class="ax" x="${(w + pad.l) / 2}" y="${h - 3}" text-anchor="middle">${t('hourOfDay')}</text></svg>${legend(items)}`;
}

function pkChart(d) {
  const source = TXN_VIEW.pkSource;
  const labelOf = source === 'truth' ? x => x.fraud : analystLabel;
  const base = source === 'truth' ? mean(d.txns.map(x => (x.fraud ? 1 : 0))) : null;
  const mk = (key, name, cls, color) => ({ name, cls, color, dots: true, points: precisionAtK(d.txns, key, PK_KS, labelOf).map(r => ({ x: r.k, y: r.p })) });
  const series = [mk('iso', t('isoForest'), 's1', 'series-1'), mk('rule', t('rules'), 's2', 'series-2'), mk('combined', t('combined'), 's3', 'series-3')];
  if (base !== null) series.push({ name: t('randomBaseline'), cls: '', dash: true, points: PK_KS.map(k => ({ x: k, y: base })) });
  const chart = lineChart({ series, xMin: PK_KS[0], xMax: PK_KS[PK_KS.length - 1], yMax: 1, yFmt: v => (v * 100).toFixed(0) + '%', xLabel: 'k', yLabel: t('pkTitle') });
  const items = series.map(s => (s.dash ? { kind: 'dash', label: s.name } : { color: s.color, label: s.name }));
  const note = source === 'analyst' ? `<p class="muted small">${t('pkAnalystNote', { n: Object.keys(visibleReviews()).length })}</p>` : '';
  return chart + legend(items) + note;
}

function pkTable(d) {
  const labelOf = TXN_VIEW.pkSource === 'truth' ? x => x.fraud : analystLabel;
  const rows = ['iso', 'rule', 'combined'].map(key => {
    const r = precisionAtK(d.txns, key, [10, 20, 50], labelOf);

function regenerate(page) {
  const v = id => parseFloat($('#' + id, page).value);
  const cfg = { ...txnCfg(), seed: Math.round(v('txSeed')) || 2026, accounts: clamp(Math.round(v('txAcc')) || 70, 20, 200), days: clamp(Math.round(v('txDays')) || 30, 7, 90), rate: clamp((v('txRate') || 3) / 100, 0.005, 0.1), trees: clamp(Math.round(v('txTrees')) || 100, 10, 300), sample: clamp(Math.round(v('txSample')) || 256, 32, 1024) };
  const apply = () => {
    store.set('txncfg', cfg);
    store.set('reviews', {});

  const f = x.f;
  const tiles = [['amountZ', f.amountZ.toFixed(2), f.amountZ >= 2], ['velocity1h', f.velocity1h, f.velocity1h >= 3], ['velocity24h', f.velocity24h, f.velocity24h >= 6], ['hourRarity', f.hourRarity.toFixed(2), f.hourRarity > 0.8], ['newDevice', f.newDevice ? t('yes') : t('no'), f.newDevice], ['newBeneficiary', f.newBeneficiary ? t('yes') : t('no'), f.newBeneficiary], ['cityChange', f.cityChange ? t('yes') : t('no'), f.cityChange]];
  return `<div class="feature-grid">${tiles.map(([k, v, hot]) => `<div class="feature ${hot ? 'hot' : ''}"><b>${v}</b><span>${t('feat_' + k)}</span></div>`).join('')}</div>`;
}

function isoExplain(x, d) {
  const r = isoScore(d.model, featureVector(x.f), true);
  const total = sum(r.attr) || 1;
  const top = r.attr.map((v, i) => ({ name: FEATURE_NAMES[i], v: v / total })).sort((a, b) => b.v - a.v).slice(0, 4);
  return `<p class="small muted">${t('isoPathLine', { s: r.score.toFixed(3), h: r.avgPath.toFixed(2), c: d.model.c.toFixed(2) })}</p>
    ${top.map(a => `<div class="meter-row"><span class="mono tiny">${a.name}</span><div class="bar blue"><i data-w="${(a.v * 100).toFixed(0)}%"></i></div><span class="num">${pct(a.v)}</span></div>`).join('')}`;
}

// ---------- analyst review queue ----------
const REVIEW_VIEW = { filter: 'pending', current: null };
const REVIEW_UNDO = [];

function reviewQueue() {
  return flaggedTxns().filter(x => !reviewOf(x.id));
}

function setReview(id, label, note = '') {
  const all = reviews();
  REVIEW_UNDO.push({ id, prev: all[id] || null });
  all[id] = { label, note: note || (all[id] && all[id].note) || '', at: nowISO() };
  store.set('reviews', all);
  logEvent('logReview', { id, label: t('rv_' + label) }, 'list-checks');
  if (label === 'fraud') notify('noteConfirmed', { id }, { icon: 'flag', level: 'high', route: '#review' });
  renderNavCounts();
}

function undoReview() {
  const last = REVIEW_UNDO.pop();
  if (!last) return toast(t('nothingToUndo'), 'info');
  const all = reviews();
  if (last.prev) all[last.id] = last.prev;
  else delete all[last.id];
  store.set('reviews', all);
  REVIEW_VIEW.current = last.id;
  toast(t('undone'));
  refresh();
}

function reviewStats() {
  const flagged = flaggedTxns();
  const revs = visibleReviews();
  const done = flagged.filter(x => revs[x.id]);
  const fraud = done.filter(x => revs[x.id].label === 'fraud').length;
  const legit = done.filter(x => revs[x.id].label === 'legit').length;
  const decided = done.filter(x => revs[x.id].label !== 'escalated');
  const agree = decided.filter(x => (revs[x.id].label === 'fraud') === x.fraud).length;
  return { total: flagged.length, done: done.length, fraud, legit, prec: fraud + legit ? fraud / (fraud + legit) : null, agree: decided.length ? agree / decided.length : null };
}

function queueList() {
  const flagged = flaggedTxns();
  const rows = flagged.filter(x => (REVIEW_VIEW.filter === 'pending' ? !reviewOf(x.id) : REVIEW_VIEW.filter === 'reviewed' ? !!reviewOf(x.id) : true));
  if (!rows.length) return `<div class="empty">${ic('check-circle')}<span>${t('queueEmpty')}</span></div>`;
  return rows.map(x => `<button class="qrow ${x.id === REVIEW_VIEW.current ? 'on' : ''}" data-q="${x.id}"><span class="t">${x.id}</span><span class="score-pill ${scoreCls(x.combined)}">${x.combined.toFixed(0)}</span><span class="d">${fmtPKR(x.amount)} · ${hhmm(x.ts)}</span><span>${reviewBadge(x)}</span></button>`).join('');
}

function compareBlock(x, d) {
  const acc = d.accounts.find(a => a.id === x.acc);
  const hist = d.txns.filter(y => y.acc === x.acc && y.ts < x.ts);
  const amounts = hist.map(y => y.amount).sort((a, b) => a - b);
  const median = amounts.length ? amounts[Math.floor(amounts.length / 2)] : acc.base;
  const hours = hist.map(y => y.f.hour);
  const usual = hours.length ? `${String(Math.min(...hours)).padStart(2, '0')}:00–${String(Math.max(...hours)).padStart(2, '0')}:59` : '—';
  const cell = (k, now, normal, hot) => `<div class="feature ${hot ? 'hot' : ''}"><span>${t(k)}</span><b>${now}</b><span>${t('usually')}: ${normal}</span></div>`;
  return `<div class="compare">
    ${cell('amount', fmtPKR(x.amount), fmtPKR(median), x.f.amountZ >= 2)}
    ${cell('time', hhmm(x.ts), usual, x.f.hourRarity > 0.8)}
    ${cell('device', x.device, acc.devices[acc.devices.length - 1], !!x.f.newDevice)}
    ${cell('beneficiary', x.ben, t('knownN', { n: new Set(hist.map(y => y.ben)).size }), !!x.f.newBeneficiary)}</div>`;
}

function caseCard(x, d) {
  if (!x) return `<section class="panel"><div class="pb"><div class="empty">${ic('list-checks', 'xl')}<b>${t('queueEmpty')}</b><span>${t('queueEmptySub')}</span></div></div></section>`;
  const r = reviewOf(x.id);
  const acc = d.accounts.find(a => a.id === x.acc);
  return `<section class="panel" id="caseCard"><header class="ph"><span class="num">${x.id}</span><h3>${esc(acc.name)} · ${acc.id}</h3><span class="meta">${reviewBadge(x)}<span class="score-pill ${scoreCls(x.combined)}">${x.combined.toFixed(0)}</span></span></header>
    <div class="pb stack">
      <div class="case-head"><span class="case-amt">${fmtPKR(x.amount)}</span><span class="muted">${t('type_' + x.type)} · ${fmtDateTime(x.ts)} · ${esc(x.city)}</span></div>
      <div class="label">${t('whyFlagged')}</div>
      <div class="row">${ruleChips(x)}<span class="badge info mono">IF ${x.iso.toFixed(3)}</span><span class="badge mono">${t('rules')} ${x.rule}</span></div>
      ${compareBlock(x, d)}
      <div class="label">${t('accountHistory')}</div>${accountTimeline(x, d)}

function nextInQueue(afterId) {
  const q = reviewQueue();
  if (!q.length) return null;
  const all = flaggedTxns();
  const idx = all.findIndex(x => x.id === afterId);
  return q.find(x => all.indexOf(x) > idx) || q[0];
}

function decide(label) {
  const id = REVIEW_VIEW.current;
  if (!id) return;
  const note = $('#rvNote') ? $('#rvNote').value.trim() : '';
  setReview(id, label, note);
  const nx = nextInQueue(id);
  REVIEW_VIEW.current = nx ? nx.id : id;
  toast(t('reviewSaved', { id, label: t('rv_' + label) }));
  refresh();
}

function skipCase() {
  const nx = nextInQueue(REVIEW_VIEW.current);
  if (nx) REVIEW_VIEW.current = nx.id;
  refresh();
}

  const x = flagged.find(y => y.id === REVIEW_VIEW.current);

  $('#rvPrint', page).onclick = () => printReport('review');

// Single-key shortcuts while the review page is open (ignored while typing in a field).
function reviewKeys(e) {
  if (parseHash().route.id !== 'review' || /input|textarea|select/i.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return false;
  const map = { f: () => decide('fraud'), l: () => decide('legit'), e: () => decide('escalated'), s: skipCase, z: undoReview };
  const fn = map[e.key.toLowerCase()];
  if (!fn) return false;
  e.preventDefault();
  fn();
  return true;
}

const REPORT_TEMPLATES = ['bank', 'cyber', 'pta'];
const STD_EVIDENCE = ['evScreens', 'evStatement', 'evCallLog', 'evCnic', 'evChat'];
const blankReport = () => ({ template: 'bank', contact: 'bank', letterLang: SETTINGS.lang, name: '', cnic: '', phone: '', email: '', city: '', account: '', date: iso(TODAY), time: '', amount: '', txids: '', scammer: '', channel: 'sms', description: '', std: ['evScreens'], maskCnic: true });

function maskCnic(c) {
  const d = String(c).replace(/\D/g, '');
  return d.length >= 13 ? `${d.slice(0, 5)}-*******-${d.slice(12)}` : c;
}

function selectedEvidence() {
  const sel = evSelected();
  return coll.visible('evidence').filter(e => sel.includes(e.id));
}

function autoDescription(r, lang) {
  const ev = selectedEvidence();
  const first = ev.find(e => e.kind === 'message');
  const parts = [];
  if (first) parts.push(lang === 'ur' ? `مجھے ${first.sender || 'ایک نامعلوم نمبر'} سے یہ پیغام موصول ہوا: "\u2068${first.detail.slice(0, 300)}\u2069"` : `I received the following message from ${first.sender || 'an unknown number'}: "\u2068${first.detail.slice(0, 300)}\u2069"`);
  const link = ev.find(e => e.kind === 'link');
  if (link) parts.push(lang === 'ur' ? `پیغام میں یہ لنک تھا: ${link.title}` : `The message contained this link: ${link.title}`);
  const tx = ev.filter(e => e.kind === 'txn');
  if (tx.length) parts.push(lang === 'ur' ? `متعلقہ ٹرانزیکشنز: ${tx.map(e => e.title).join('، ')}` : `Related transactions: ${tx.map(e => e.title).join(', ')}`);
  if (!parts.length) parts.push(lang === 'ur' ? '[یہاں واقعہ اپنے الفاظ میں لکھیں: کیا ہوا، کب ہوا، آپ نے کیا معلومات یا رقم دی]' : '[Describe what happened in your own words: what you were told, when, and what information or money you gave]');
  return parts.join('\n');
}

function evidenceLines(r, lang) {
  const items = selectedEvidence().map((e, i) => `${i + 1}. [${tr('ev_' + e.kind, lang)}] ${e.title} (${tr('riskScore', lang)} ${e.score}/100, ${iso(e.at)})${e.note ? ' — ' + e.note : ''}`);
  const std = r.std.map((k, i) => `${items.length + i + 1}. ${tr(k, lang)}`);
  return [...items, ...std].join('\n') || '-';
}

function bindReport(page) {
  const update = () => {
    const r = readReport(page);
    store.set('reportdraft', r);
    renderLetter(page, r);
  };
  $$('[data-rp], [data-std], #rpMask', page).forEach(el => el.addEventListener(el.tagName === 'SELECT' || el.type === 'checkbox' ? 'change' : 'input', debounce(update, 200)));
  $$('#rpTpl button', page).forEach(b => (b.onclick = () => {
    const r = readReport(page);
    r.template = b.dataset.tpl;
    r.contact = r.template === 'bank' ? 'bank' : r.template === 'cyber' ? 'fia' : 'pta';
    store.set('reportdraft', r);
    refresh();
  }));
  $$('#rpLang button', page).forEach(b => (b.onclick = () => {
    $$('#rpLang button', page).forEach(x => x.classList.toggle('on', x === b));
    update();
  }));
  $('#rpCopy', page).onclick = () => copyText(buildLetter(readReport(page)));
  $('#rpDownload', page).onclick = () => download('complaint-' + iso(TODAY) + '.txt', '\uFEFF' + buildLetter(readReport(page)), 'text/plain');
  $('#rpPrint', page).onclick = () => printReport('complaint', readReport(page));

// ---------- quiz ----------
let QUIZ_RUN = null;

function startQuiz() {
  const rand = rng(Date.now() % 100000);
  QUIZ_RUN = { order: shuffle([...QUIZ.keys()], rand), i: 0, answers: [], done: false };
}

function quizProgress() {
  return `<div class="qprog" aria-hidden="true">${QUIZ_RUN.order.map((q, i) => {
    const a = QUIZ_RUN.answers[i];
    const cls = a === undefined ? (i === QUIZ_RUN.i ? 'cur' : '') : a === QUIZ[q].a ? 'ok' : 'no';
    return `<i class="${cls}"></i>`;
  }).join('')}</div>`;
}

function quizQuestion() {
  const qi = QUIZ_RUN.order[QUIZ_RUN.i];
  const q = QUIZ[qi];
  const ans = QUIZ_RUN.answers[QUIZ_RUN.i];
  const answered = ans !== undefined;
  const opts = q.opts.map((o, k) => {
    const cls = answered ? (k === q.a ? 'right' : k === ans ? 'wrong' : '') : '';
    return `<button class="qopt ${cls}" data-opt="${k}" ${answered ? 'disabled' : ''}><span class="k">${'ABCD'[k]}</span><span dir="auto">${esc(L(o))}</span></button>`;
  });
  return `<section class="panel quiz"><header class="ph"><span class="num">${QUIZ_RUN.i + 1}/${QUIZ.length}</span><h3>${t('quizTitle')}</h3><span class="meta mono">${t('score')}: ${quizScore()}</span></header>
    <div class="pb">${quizProgress()}<h3 class="mt" dir="auto">${esc(L(q.q))}</h3><div class="qopts">${opts.join('')}</div>
    ${answered ? `<div class="qexplain" aria-live="polite"><b>${ans === q.a ? t('correct') : t('notQuite')}</b> ${esc(L(q.why))}</div><div class="row mt"><button class="btn primary" id="qNext">${QUIZ_RUN.i + 1 < QUIZ.length ? t('nextQuestion') : t('seeResult')}${ic(lang() === 'ur' ? 'arrow-left' : 'arrow-right')}</button></div>` : ''}</div></section>`;
}

const quizScore = () => QUIZ_RUN.answers.filter((a, i) => a === QUIZ[QUIZ_RUN.order[i]].a).length;

function quizResult() {
  const score = quizScore();
  const st = quizState();
  const best = Math.max(st.best || 0, score);
  const grade = score >= 13 ? 'gradeA' : score >= 9 ? 'gradeB' : 'gradeC';
  const review = QUIZ_RUN.order.map((qi, i) => ({ q: QUIZ[qi], a: QUIZ_RUN.answers[i] })).filter(x => x.a !== x.q.a);
  return `<section class="panel quiz"><header class="ph"><h3>${t('quizDone')}</h3><span class="meta">${verdictBadge(score >= 13 ? 'low' : score >= 9 ? 'med' : 'high', t(grade))}</span></header>
    <div class="pb stack"><div class="kpis"><div class="tile green"><span class="k">${t('score')}</span><span class="v"><span data-count="${score}">0</span>/${QUIZ.length}</span></div><div class="tile"><span class="k">${t('bestScore')}</span><span class="v">${best}/${QUIZ.length}</span></div><div class="tile"><span class="k">${t('attempts')}</span><span class="v">${st.attempts.length}</span></div></div>
    ${review.length ? `<div class="label">${t('reviewMistakes')}</div><div class="list">${review.map(x => `<div class="item"><span class="ico red">${ic('x')}</span><span class="body"><span class="t">${esc(L(x.q.q))}</span><span class="d">${t('rightAnswer')}: ${esc(L(x.q.opts[x.q.a]))} — ${esc(L(x.q.why))}</span></span></div>`).join('')}</div>` : `<p>${t('perfect')}</p>`}
    <div class="row"><button class="btn primary" id="qAgain">${ic('refresh')}${t('retake')}</button><a class="btn" href="#learn">${ic('book')}${t('navLearn')}</a></div></div></section>`;
}

function finishQuiz() {
  const score = quizScore();
  const st = quizState();
  st.attempts = [{ at: nowISO(), score }, ...st.attempts].slice(0, 20);
  st.best = Math.max(st.best || 0, score);
  store.set('quiz', st);
  logEvent('logQuiz', { score, total: QUIZ.length }, 'award');
  QUIZ_RUN.done = true;
}

RENDERERS.quiz = page => {
  if (!QUIZ_RUN) startQuiz();
  page.innerHTML = `${pageHead('qzTitle', 'qzSub')}${QUIZ_RUN.done ? quizResult() : quizQuestion()}`;
  $$('[data-opt]', page).forEach(b => (b.onclick = () => {
    QUIZ_RUN.answers[QUIZ_RUN.i] = +b.dataset.opt;
    refresh();
    const ex = $('.qexplain');
    if (ex) announce(ex.textContent);
  }));
  if ($('#qNext', page)) $('#qNext', page).onclick = () => {
    if (QUIZ_RUN.i + 1 < QUIZ.length) QUIZ_RUN.i++;
    else finishQuiz();
    refresh();
  };
  if ($('#qAgain', page)) $('#qAgain', page).onclick = () => {
    startQuiz();
    refresh();
  };
};

// ---------- analyst dashboard ----------
function flagFrequency(hist) {
  const counts = {};
  hist.forEach(h => (h.flags || []).forEach(id => (counts[id] = (counts[id] || 0) + 1)));
  return Object.entries(counts)
    .filter(([id]) => FLAG_INDEX[id] && FLAG_INDEX[id].w > 0)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 8);
}

function meterRows(rows, max, cls = '', wide = false) {
  return rows.map(([label, n]) => `<div class="meter-row${wide ? ' wide' : ''}"><span>${label}</span><div class="bar ${cls}"><i data-w="${max ? Math.round((n / max) * 100) : 0}%"></i></div><span class="num">${n}</span></div>`).join('');
}

function verdictBars(hist) {
  const counts = ['low', 'med', 'high'].map(l => [l, hist.filter(h => h.level === l).length]);
  const max = Math.max(1, ...counts.map(c => c[1]));
  return counts.map(([l, n]) => `<div class="meter-row"><span>${verdictBadge(l)}</span><div class="bar ${l === 'high' ? 'red' : l === 'med' ? '' : 'green'}"><i data-w="${Math.round((n / max) * 100)}%"></i></div><span class="num">${n}</span></div>`).join('');
}

function dashKpis() {
  const hist = coll.visible('history');
  const m = getModel();
  const lr = confusion(m.eval.pLR, m.eval.ys, m.opts.threshold);
  const d = getTxn();
  const s = reviewStats();
  const p20 = precisionAtK(d.txns, 'combined', [20])[0].p;
  const highShare = hist.length ? hist.filter(h => h.level === 'high').length / hist.length : 0;
  return `<div class="kpis stagger">
    <div class="tile"><span class="k">${ic('message')}${t('statChecked')}</span><span class="v" data-count="${hist.length}">0</span><span class="s">${t('highShare', { p: pct(highShare) })}</span></div>
    <div class="tile amber"><span class="k">${ic('brain')}${t('modelF1')}</span><span class="v">${lr.f1.toFixed(3)}</span><span class="s">${t('accuracy')} ${pct(lr.acc, 1)} · ${t('baseline')} ${pct(m.eval.baseline.acc, 1)}</span></div>
    <div class="tile red"><span class="k">${ic('flag')}${t('kpiFlagged')}</span><span class="v" data-count="${flaggedTxns().length}">0</span><span class="s">${t('ofTxns', { n: fmtNum(d.txns.length) })}</span></div>
    <div class="tile"><span class="k">${ic('list-checks')}${t('reviewProgress')}</span><span class="v">${s.done}/${s.total}</span><div class="bar green"><i data-w="${s.total ? Math.round((s.done / s.total) * 100) : 0}%"></i></div></div>
    <div class="tile green"><span class="k">${ic('target')}P@20</span><span class="v">${p20 === null ? '—' : pct(p20)}</span><span class="s">${t('combined')} · ${t('seededTruth')}</span></div>
  </div>`;
}

function topFlaggedList() {
  const d = getTxn();

// Pages, lessons and actions rank above raw records when both match.
const SEARCH_BOOST = { grpPages: 60, grpLessons: 60, grpActions: 40 };

function searchRank(items, q) {
  const needle = normalizeText(q).trim();
  if (!needle) return items.filter(i => ['grpPages', 'grpActions'].includes(i.group)).slice(0, 14);
  const scored = items
    .map(i => {
      const hay = normalizeText(i.label + ' ' + i.sub);
      const pos = hay.indexOf(needle);
      const boost = SEARCH_BOOST[i.group] || 0;
      return { i, s: pos < 0 ? -1 : 100 - Math.min(pos, 90) + boost + (normalizeText(i.label).startsWith(needle) ? 50 : 0) };
    })
    .filter(x => x.s >= 0)
    .sort((a, b) => b.s - a.s);
  const perGroup = {};
  const top = scored.map(x => x.i).filter(i => (perGroup[i.group] = (perGroup[i.group] || 0) + 1) <= 6).slice(0, 30);
  // Keep each group together, ordered by its best match (sort is stable within a group).
  const order = [...new Set(top.map(i => i.group))];
  return top.sort((a, b) => order.indexOf(a.group) - order.indexOf(b.group));
}

function renderSearchResults(q) {
  PS_RESULTS = searchRank(searchIndex(), q);
  PS_INDEX = 0;
  const box = $('#psRes');
  let html = '';
  let last = '';
  PS_RESULTS.forEach((r, i) => {
    if (r.group !== last) html += `<div class="ps-group label">${t(r.group)}</div>`;
    last = r.group;
    html += `<button class="ps-row ${i === 0 ? 'on' : ''}" data-ps="${i}" role="option">${ic(r.icon)}<span class="grow" dir="auto">${esc(r.label.slice(0, 110))}</span><span class="tiny muted">${esc(String(r.sub).slice(0, 40))}</span></button>`;
  });
  box.innerHTML = html || `<div class="empty">${ic('search')}<span>${t('noMatches')}</span></div>`;
  $$('[data-ps]', box).forEach(b => (b.onclick = () => runSearchResult(+b.dataset.ps)));
  announce(t('resultsN', { n: PS_RESULTS.length }));
}

function runSearchResult(i) {
  const r = PS_RESULTS[i];
  if (!r) return;
  closeModal(true);
  r.run();
}

function moveSearch(delta) {
  if (!PS_RESULTS.length) return;
  PS_INDEX = (PS_INDEX + delta + PS_RESULTS.length) % PS_RESULTS.length;
  $$('#psRes .ps-row').forEach((b, i) => b.classList.toggle('on', i === PS_INDEX));
  const on = $('#psRes .ps-row.on');

}

function openSearch() {
  const m = openModal(`<div class="ps-in">${ic('search')}<input type="search" id="psQ" placeholder="${t('searchPlaceholder')}" aria-label="${t('search')}" autocomplete="off"><kbd>Esc</kbd></div><div class="ps-res" id="psRes" role="listbox"></div>`);

  };

  setTimeout(() => q.focus(), 60);
}

function handleKeys(e) {
  const typing = /input|textarea|select/i.test(e.target.tagName) || e.target.isContentEditable;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    return openSearch();
  }
  if (e.key === 'Escape') {
    if ($('#tour').classList.contains('on')) return endTour();
    closeModal();
    closeDrawer();
    return openRail(false);
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if ($('#modal').classList.contains('on') || $('#tour').classList.contains('on')) return;
  if (reviewKeys(e)) return;
  if (pendingG && Date.now() - pendingG < 1200 && GOTO[e.key]) {
    pendingG = 0;
    return go('#' + GOTO[e.key]);
  }
  if (e.key === 'g') pendingG = Date.now();
  else if (e.key === '/') {
    e.preventDefault();
    openSearch();
  } else if (e.key === '?') openShortcuts();
  else if (e.key === 't') toggleTheme();
  else if (e.key === 'U' && e.shiftKey) setLang(SETTINGS.lang === 'ur' ? 'en' : 'ur');
}

const TOUR = [
  { sel: '#rail .nav', mobile: '#tabbar', route: null, key: 'tour1' },
  { sel: '#tourQuick', route: '#home', key: 'tour2' },
  { sel: '#tourVerdict', route: '#analyse/run', key: 'tour3', prep: () => setDraft({ text: MSG_SAMPLES[2].text, sender: MSG_SAMPLES[2].sender, channel: 'whatsapp' }) },

  { sel: '#searchBtn', route: null, key: 'tour7' },
  { sel: '#langBtn', route: null, key: 'tour8' },
];
let TOUR_I = -1;

function startTour() {
  TOUR_I = 0;
  $('#tour').classList.add('on');
  showTourStep();
}

function endTour() {
  $('#tour').classList.remove('on');
  TOUR_I = -1;
  saveSettings({ tourDone: true });
}

function tourTarget(step) {
  const mobile = window.innerWidth <= 720;
  const el = $(mobile && step.mobile ? step.mobile : step.sel);
  return el && el.getClientRects().length ? el : null;
}

function showTourStep() {
  const step = TOUR[TOUR_I];
  if (!step) return endTour();
  if (step.prep) step.prep();
  if (step.route && location.hash !== step.route) {
    location.hash = step.route;
    return setTimeout(showTourStep, 380);
  }
  const el = tourTarget(step);
  if (!el) {
    TOUR_I++;
    return showTourStep();
  }
  el.scrollIntoView({ block: 'center', behavior: 'instant' });
  setTimeout(() => placeTour(el, step), 60);
}

function placeTour(el, step) {
  const r = el.getBoundingClientRect();
  const hole = $('#tourHole');
  const pad = 6;
  const top = Math.max(4, r.top - pad);
  const height = Math.min(window.innerHeight - top - 4, r.height + pad * 2);
  Object.assign(hole.style, { left: r.left - pad + 'px', top: top + 'px', width: r.width + pad * 2 + 'px', height: height + 'px' });
  const tip = $('#tourTip');
  tip.innerHTML = `<span class="kicker">${t('tourStep', { n: TOUR_I + 1, total: TOUR.length })}</span><h4 id="tourTitle">${t(step.key + 'T')}</h4><p>${t(step.key)}</p>
    <div class="row"><button class="btn sm ghost" id="tourSkip">${t('skipTour')}</button><span class="spacer"></span>${TOUR_I ? `<button class="btn sm" id="tourBack">${t('back')}</button>` : ''}<button class="btn sm primary" id="tourNext">${TOUR_I === TOUR.length - 1 ? t('finish') : t('next')}</button></div>`;
  const tw = tip.offsetWidth;
  const tipH = tip.offsetHeight;
  const rtl = document.documentElement.dir === 'rtl';
  const side = rtl ? r.left - tw - 16 : r.right + 16;
  const tall = height > window.innerHeight * 0.45 && side >= 8 && side + tw <= window.innerWidth - 8;
  const below = top + height + 12;
  let y = below + tipH < window.innerHeight ? below : Math.max(8, top - tipH - 12);
  let x = clamp(rtl ? r.right - tw : r.left, 8, window.innerWidth - tw - 8);
  if (tall) {
    x = side;
    y = clamp(top + 24, 8, window.innerHeight - tipH - 8);
  }
  Object.assign(tip.style, { left: x + 'px', top: clamp(y, 8, Math.max(8, window.innerHeight - tipH - 8)) + 'px' });
  $('#tourSkip').onclick = endTour;
  $('#tourNext').onclick = () => {
    TOUR_I++;
    showTourStep();
  };
  if ($('#tourBack')) $('#tourBack').onclick = () => {
    TOUR_I--;
    showTourStep();
  };
  $('#tourNext').focus();
}

function printModel() {
  const m = getModel();
  const ev = m.eval;
  const row = k => {
    const c = confusion(k === 'nb' ? ev.pNB : ev.pLR, ev.ys, m.opts.threshold);
    return [t('model_' + k), pct(c.acc, 1), pct(c.prec, 1), pct(c.rec, 1), c.f1.toFixed(3), ev.auc[k].toFixed(3), `${c.tp}/${c.fp}/${c.fn}/${c.tn}`];
  };
  const perScript = ['en', 'ur', 'ru'].map(sc => [t('script_' + sc), ev.perScript[sc].n, pct(ev.perScript[sc].nb), pct(ev.perScript[sc].lr)]);
  return `<h1>${t('prModel')}</h1><p class="pr-meta">${t('src_' + m.source)} · ${m.trainedAt ? fmtDateTime(m.trainedAt) : ''} · ${t('vocabSize')} ${m.vocab.length} · ${t('threshold')} ${m.opts.threshold}</p>
    <p>${t('baselineLine', { acc: pct(ev.baseline.acc, 1), cls: t(ev.baseline.majority ? 'labelScam' : 'labelLegit'), n: ev.nTest, tr: ev.nTrain })}</p>
    <h2>${t('metrics')}</h2>${prTable([t('model'), t('accuracy'), t('precision'), t('recall'), 'F1', 'AUC', 'TP/FP/FN/TN'], [row('nb'), row('lr')])}
    <h2>${t('perScript')}</h2>${prTable([t('script'), t('testN'), 'NB', 'LR'], perScript)}
    <h2>${t('globalTokens')}</h2>${prTable([t('towardScam'), t('towardSafe')], globalTopTokens(m, 'lr', 10).scam.map((s, i) => [displayToken(s.tk), displayToken(globalTopTokens(m, 'lr', 10).legit[i].tk)]))}`;
}

function printFlagged(title, rows) {
  const d = getTxn();
  const acc = Object.fromEntries(d.accounts.map(a => [a.id, a]));
  return `<h1>${title}</h1><p class="pr-meta">${fmtDateTime(new Date())} · seed ${d.cfg.seed} · ${t('threshold')} ${d.cfg.threshold} · ${t('synthetic')}</p>
    ${prTable(['ID', t('time'), t('account'), t('amountPkr'), 'IF', t('rules'), t('combined'), t('review'), t('analystNote')], rows.map(x => {
      const r = reviewOf(x.id);
      return [x.id, fmtDateTime(x.ts), acc[x.acc].name + ' ' + x.acc, fmtNum(x.amount), x.iso.toFixed(3), x.rule, x.combined.toFixed(0), r ? t('rv_' + r.label) : t('rv_pending'), r ? r.note : ''];
    }))}`;
}

function printReview() {
  const s = reviewStats();
  return `${printFlagged(t('prReview'), flaggedTxns())}<h2>${t('summary')}</h2><p>${t('reviewProgress')}: ${s.done}/${s.total} · ${t('confirmedFraud')}: ${s.fraud} · ${t('analystPrecision')}: ${s.prec === null ? '—' : pct(s.prec)}</p>`;
}

function printHandout() {
  return `<h1>${t('prHandout')}</h1><p class="pr-meta">FraudShield · ${fmtDate(new Date())}</p>` + PATTERNS.map((p, i) => `<h2>${i + 1}. ${esc(L(p.title))}</h2><p>${esc(L(p.summary))}</p><p><b>${t('lsFlags')}:</b> ${L(p.flags).map(esc).join(' · ')}</p><p><b>${t('lsTodo')}:</b> ${L(p.todo).map(esc).join(' · ')}</p>`).join('');
}

function printDashboard() {
  const hist = coll.visible('history');
  const m = getModel();
  const lr = confusion(m.eval.pLR, m.eval.ys, m.opts.threshold);
  const s = reviewStats();
  const pk = precisionAtK(getTxn().txns, 'combined', [10, 20, 50]).map(r => `P@${r.k} ${pct(r.p)}`).join(' · ');
  return `<h1>${t('prDashboard')}</h1><p class="pr-meta">${fmtDateTime(new Date())}</p>
    ${prTable([t('metric'), t('value')], [[t('statChecked'), hist.length], [t('statHigh'), hist.filter(h => h.level === 'high').length], [t('modelF1'), lr.f1.toFixed(3)], [t('kpiFlagged'), flaggedTxns().length], [t('reviewProgress'), `${s.done}/${s.total}`], [t('pkTitle'), pk]])}
    <h2>${t('topFlaggedTx')}</h2>${printFlagged('', flaggedTxns().slice(0, 15)).replace(/^<h1><\/h1>/, '')}`;
}

function printLog() {
  return `<h1>${t('activityLog')}</h1>${prTable([t('time'), t('event')], coll.all('log').map(l => [fmtDateTime(l.at), t(l.key, l.vars)]))}`;
}

function printReport(kind, data) {
  const builders = {
    analysis: () => printAnalysis(data),
    model: printModel,
    flagged: () => printFlagged(t('prFlagged'), flaggedTxns()),
    review: printReview,
    complaint: () => `<div class="pr-letter ${data.letterLang === 'ur' ? 'pr-ur' : ''}">${esc(buildLetter(data))}</div>`,
    handout: printHandout,
    dashboard: printDashboard,
    log: printLog,
  };
  const area = $('#printArea');
  area.dir = SETTINGS.lang === 'ur' ? 'rtl' : 'ltr';
  area.innerHTML = builders[kind]() + `<p class="pr-note">${t('printFooter')}</p>`;
  document.body.classList.add('printing');
  logEvent('logPrint', { what: t('pr_' + kind) }, 'printer');
  setTimeout(() => {
    window.print();
    document.body.classList.remove('printing');
  }, 50);
}

// ---------- demo data (illustrative; hidden when "Show demo data" is off) ----------
const hoursAgo = h => new Date(Date.now() - h * 3600e3).toISOString();

function seedHistory() {
  const picks = [MSG_SAMPLES[0], MSG_SAMPLES[2], MSG_SAMPLES[5], MSG_SAMPLES[1], MSG_SAMPLES[6], MSG_SAMPLES[4], MSG_SAMPLES[3], MSG_SAMPLES[7]];
  const hist = picks.map((s, i) => {
    const r = fullAnalysis(s.text, { sender: s.sender, channel: s.channel });
    return { id: 'h-demo' + i, at: hoursAgo(3 + i * 7), text: r.text, sender: s.sender, channel: s.channel, script: r.script, score: r.score, ruleScore: r.ruleScore, p: r.p, level: r.level, flags: r.flags.map(f => f.id), demo: true };
  });
  store.set('history', hist);
  return hist;
}

function seedEvidence(hist) {
  const msg = hist.filter(h => h.level === 'high').slice(0, 2);
  const ev = msg.map((h, i) => ({ id: 'e-demo' + i, at: h.at, kind: 'message', title: h.text.replace(/\s+/g, ' ').slice(0, 70), detail: h.text, sender: h.sender, channel: h.channel, score: h.score, level: h.level, flags: h.flags, note: i ? '' : 'Mother received this on her phone', demo: true }));
  const link = analyseUrl('http://easypaisa-verify.top/login');
  ev.push({ id: 'e-demo-link', at: hoursAgo(30), kind: 'link', title: link.raw, detail: link.findings.map(linkFindingTitle).join('; '), score: link.score, level: link.level, note: '', demo: true });
  store.set('evidence', ev);
  store.set('evsel', ev.map(e => e.id).slice(0, 2));
  store.set('links', ['http://easypaisa-verify.top/login', 'bit.ly/ep-bonus', 'https://www.meezanbank.com/', 'hbl.com.pk.secure-login.xyz/kyc'].map((u, i) => {
    const r = analyseUrl(u);
    return { id: 'k-demo' + i, at: hoursAgo(5 + i * 11), url: u, score: r.score, level: r.level, demo: true };
  }));
}

function seedReviews() {
  const top = flaggedTxns().slice(0, 9);
  const out = {};
  top.forEach((x, i) => {
    const label = i === 4 ? 'escalated' : x.fraud ? 'fraud' : 'legit';
    out[x.id] = { label, note: i === 0 ? 'New device at 02:40, mule beneficiary — customer confirmed theft by phone.' : '', at: hoursAgo(2 + i), demo: true };
  });
  store.set('reviews', out);
}

  store.set('reportdraft', { ...blankReport(), name: 'Ayesha Khan', city: 'Lahore', phone: '0300-0000000', amount: '15000', scammer: '0341-7788990', txids: 'TRX 3049582217', time: '14:30', channel: 'sms' });
  store.set('reports', [{ id: 'r-demo', at: hoursAgo(48), template: 'cyber', title: 'Cybercrime complaint · 0333-4455667', form: { ...blankReport(), template: 'cyber', contact: 'fia', name: 'Ayesha Khan', scammer: '0333-4455667', amount: '30000' }, demo: true }]);
  store.set('quiz', { best: 11, attempts: [{ at: hoursAgo(70), score: 11 }] });
  store.set('lessons', ['bisp', 'kyc', 'otp']);
}

function seedNotes() {
  notify('noteWelcome', {}, { icon: 'shield', level: 'ok', route: '#about' });
  notify('noteQueue', { n: reviewQueue().length }, { icon: 'list-checks', route: '#review', demo: true });
  notify('noteHighRisk', { score: coll.all('history')[0].score }, { icon: 'shield-alert', level: 'high', route: '#analyse/h-demo0', demo: true });
  notify('noteQuizNudge', {}, { icon: 'help', route: '#quiz', demo: true });
  const log = [['logSeed', {}, 'database'], ['logTrained', { f1: confusion(MODEL.eval.pLR, MODEL.eval.ys, 0.5).f1.toFixed(2), n: MODEL.eval.nTrain }, 'brain'], ['logRegen', { n: TXN.txns.length, seed: TXN.cfg.seed }, 'refresh']];
  log.forEach(([k, v, i]) => logEvent(k, v, i));
}

function seedDemo() {
  if (store.get('seeded', false)) return;
  const hist = seedHistory();
  seedEvidence(hist);
  seedReviews();
  seedOther();
  seedNotes();
  store.set('seeded', true);
}

// ---------- boot ----------
function bindShell() {
  window.addEventListener('hashchange', route);
  document.addEventListener('keydown', handleKeys);
  bindTooltips(document);
  $('#menuBtn').onclick = () => openRail(!$('#rail').classList.contains('open'));
  $('#scrim').onclick = () => {
    closeModal();
    closeDrawer();
    openRail(false);
  };
  $('#langBtn').onclick = () => setLang(SETTINGS.lang === 'ur' ? 'en' : 'ur');
  $('#themeBtn').onclick = toggleTheme;
  $('#bellBtn').onclick = () => go('#inbox');
  $('#helpBtn').onclick = openShortcuts;
  $('#searchBtn').onclick = openSearch;
  $('#rail').addEventListener('click', e => {
    if (e.target.closest('a')) openRail(false);
  });
  window.addEventListener('resize', debounce(() => {
    if (TOUR_I >= 0) showTourStep();
  }, 200));
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => SETTINGS.theme === 'system' && applyAppearance());
}

function boot() {
  applyAppearance();
  getModel();
  getTxn();
  seedDemo();
  renderNav();
  updateBell();
  bindShell();
  route();
  if (!SETTINGS.tourDone) setTimeout(startTour, 700);
}

boot();
