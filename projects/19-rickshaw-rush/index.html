  horn: { w: .34, len: 1.6, h: .34, speed: 0, pick: 1, power: 1 },
  nitro: { w: .34, len: 1.6, h: .34, speed: 0, pick: 1, power: 1 },
  shield: { w: .34, len: 1.6, h: .34, speed: 0, pick: 1, power: 1 },
};
const NAMES = {
  car: ['car', 'کار'], bus: ['bus', 'بس'], pickup: ['Suzuki pickup', 'سوزوکی پک اپ'], bike: ['motorcycle', 'موٹر سائیکل'],
  cart: ['donkey cart', 'گدھا گاڑی'], cow: ['cow', 'گائے'], barrier: ['construction barrier', 'تعمیراتی رکاوٹ'],
};
const CAR_COLORS = ['#e8e8e8', '#c7c7c7', '#1d1d1d', '#9c2b2b', '#2b4b9c', '#c9a23b', '#4d7f4a', '#f2f2f2', '#7a3b8f'];

// ===================================================================
// 5. engine — run state
// ===================================================================
const G = {};
let OID = 0;

function freshRunState() {
  return {
    mode: 'attract', paused: false, daily: false, practice: false, seed: 0,
    rs: Math.random, rw: Math.random, rm: Math.random,
    t: 0, dist: 0, score: 0, speed: 13, lane: 1, x: 0, lean: 0, bob: 0, bobV: 0,
    fuel: 100, fuelMax: 100, coins: 0, fares: 0, fareRs: 0, pax: [], combo: 0, bestCombo: 0, near: 0, nearT: 0,
    nitro: 0, shield: 0, hornBlast: 0, hornT: 0, invul: 0, slow: 0, shake: 0, timeScale: 1,
    objs: [], scen: [], parts: [], floats: [], lights: [],
    rain: 0, rainTarget: 0, weatherT: 25, rainDist: 0, tod: .36, curve: 0, curveTarget: 0, curveT: 6,
    sinceSpawn: -30, nextGap: 90, sinceScen: 0, sun: null, lastFree: [0, 1, 2], waves: 0, wallFixes: 0,
    over: null, overT: 0, overShown: false, crashSpin: 0, spinDir: 1, inNight: false, nightDone: false, pal: null,
    demoT: 0, hintT: 0, startedAt: 0, honks: 0, powerups: 0, smashes: 0, maxSpeed: 0, laneTime: [0, 0, 0],
    rec: [], recT: 0, ghost: null, ghostIdx: 0, ghostBeaten: false,
  };
}

function resetRun(daily, practice = false) {
  const seed = daily ? hash('rush-' + todayStr()) : (Math.random() * 4294967295) >>> 0;
  Object.assign(G, freshRunState(), {
    daily,
    practice,
    seed,
    rs: rng(seed),                 // traffic stream (distance-driven → identical for everyone on a daily seed)
    rw: rng(seed ^ 0x9e3779b9),    // world stream: scenery, weather, curves
    rm: rng(seed ^ 0x55aa55aa),    // misc stream: fares, weaving
    speed: 14,
    fuelMax: UPG.tank.vals[P.up.tank],
    hintT: 5,
    startedAt: performance.now(),
  });
  G.fuel = G.fuelMax;
  if (daily) G.ghost = loadGhost();
  for (let z = 10; z < FAR; z += 26) {
    spawnScenery(z);
  }
}

const mult = () => 1 + Math.min(4, Math.floor(G.combo / 4)) * .5;
const covers = (o, laneIndex) => Math.abs(LANE_X[laneIndex] - o.x) < (o.w + PW) / 2 - .03;

// ===================================================================
// 5. engine — spawning
// ===================================================================
function spawnScenery(z) {
  const r = G.rw;
  const u = r();
  const side = r() < .5 ? -1 : 1;
  let kind = 'shop';
  if (u < .3) kind = 'palm';
  else if (u < .48) kind = 'lamp';
  else if (u < .64) kind = 'pillar';
  else if (u < .82) kind = 'board';

  const offsets = { palm: lerp(1.35, 1.7, r()), lamp: 1.2, pillar: 1.55, board: 1.8, shop: 2.05 };
  const o = { kind, side, z, h: lerp(.9, 1.3, r()), v: r(), x: side * offsets[kind] };

  if (kind === 'board') {
    const b = BILLBOARDS[Math.floor(r() * BILLBOARDS.length)];
    o.text = b[0];
    o.ur = b[1] === 'ur';
    o.col = ['#ff2e88', '#2ed3f0', '#ffd23f', '#3ddc84'][Math.floor(r() * 4)];
  }
  if (kind === 'shop') {
    o.col = ['#c94f7c', '#4f8fc9', '#c9a34f', '#5fa86a'][Math.floor(r() * 4)];
    o.name = SHOP_NAMES[Math.floor(r() * SHOP_NAMES.length)];
  }
  G.scen.push(o);
}

function add(type, lane, z, x) {
  const T = TYPES[type];
  const r = G.rs;
  const o = Object.assign({}, T, {
    id: OID++,
    type,
    z,
    lane,
    x: x ?? LANE_X[lane],
    col: CAR_COLORS[Math.floor(r() * CAR_COLORS.length)],
    v: r(),
    passed: false,
    hit: false,
    dead: false,
  });
  if (T.weave) {
    o.tl = lane;
    o.wt = lerp(1, 2.5, r());
  }
  if (type === 'pax') {
    o.name = PAX_NAMES[Math.floor(o.v * PAX_NAMES.length)];
    o.dest = DESTINATIONS[Math.floor(r() * DESTINATIONS.length)];
  }
  G.objs.push(o);
  return o;
}

// A passenger stands at the lane edge with a bus shelter on the nearest footpath.
function addPax(lane, z) {
  const edge = lane === 0 ? -.1 : lane === 2 ? .1 : 0;
  const o = add('pax', lane, z, LANE_X[lane] + edge);
  const side = lane === 0 ? -1 : lane === 2 ? 1 : (o.v < .5 ? -1 : 1);
  G.scen.push({ kind: 'shelter', side, z, x: side * 1.3, h: 1, v: o.v });
}

function pickType(diff, r) {
  const u = r();
  if (u < .3 - diff * .06) return 'car';
  if (u < .45) return 'pickup';
  if (u < .58 + diff * .08) return 'bike';
  if (u < .68) return 'cart';
  if (u < .8) return 'cow';
  return 'barrier';
}

// One wave of traffic: block one or two lanes (never three), then place hazards and pickups in a free lane.
function spawnWave() {
  const r = G.rs;
  const diff = clamp(G.dist / 5000, 0, 1);
  G.waves++;
  G.sinceSpawn = 0;
  G.nextGap = lerp(150, 78, diff) * lerp(.85, 1.2, r());

  const z = FAR - PD;
  const lanes = [0, 1, 2];
  for (let i = 2; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    [lanes[i], lanes[j]] = [lanes[j], lanes[i]];
  }

  const nBlock = r() < .62 - .3 * diff ? 1 : 2;
  const blocked = [];
  if (nBlock === 2 && r() < .3 + .25 * diff) {
    const i = r() < .5 ? 0 : 1;
    add('bus', i, z, (LANE_X[i] + LANE_X[i + 1]) / 2);
    blocked.push(i, i + 1);
  } else {
    for (let k = 0; k < nBlock; k++) {
      add(pickType(diff, r), lanes[k], z + lerp(-6, 6, r()));
      blocked.push(lanes[k]);
    }
  }

  // fairness: a free lane always exists; if it is two lane changes from every previously free lane, push the wave out
  const free = [0, 1, 2].filter(l => !blocked.includes(l));
  const need = Math.min(...free.map(a => Math.min(...G.lastFree.map(b => Math.abs(a - b)))));
  if (need > 1) {
    for (const o of G.objs) {
      if (o.z >= z - 7) o.z += 45;
    }
  }
  G.lastFree = free;

  const pl = free[Math.floor(r() * free.length)];
  if (r() < .22 + .2 * diff) add('pothole', pl, z + lerp(22, 45, r()));
  if (r() < .07 + .1 * diff) add('breaker', 1, z + lerp(50, 65, r()), 0);

  const u = r();
  const lowFuel = G.fuel / G.fuelMax < .45;
  if (u < .2 && G.pax.length < 3) {
    addPax(pl, z - lerp(16, 30, r()));
  } else if (u < .5) {
    const n = 3 + Math.floor(r() * 3);
    for (let i = 0; i < n; i++) {
      add('coin', pl, z - 20 - i * 6);
    }
  } else if (u < .5 + (lowFuel ? .34 : .14)) {
    add('fuel', pl, z - 22);
  } else if (u < .78) {
    add(['horn', 'nitro', 'shield'][Math.floor(r() * 3)], pl, z - 22);
  }
}

// Safety net: moving traffic can bunch into a three-lane wall far ahead; remove one vehicle while it is still distant.
function sweep() {
  const cs = G.objs.filter(o => o.crash && !o.dead && o.z > 45).sort((a, b) => a.z - b.z);
  for (const c of cs) {
    const win = cs.filter(o => !o.dead && Math.abs(o.z - c.z) < 15);
    const walled = [0, 1, 2].every(l => win.some(o => covers(o, l)));
    if (!walled) continue;
    const victim = win.filter(o => !o.wide).sort((a, b) => b.z - a.z)[0] || win[0];
    victim.dead = true;
    G.wallFixes++;
  }
}

// ===================================================================
// 5. engine — effects, pickups, scoring
// ===================================================================
function float(o, text, color) {
  const p = o ? proj(o.z, o.x) : proj(6, G.x);
  const lift = o ? o.h * p.k : p.k * .9;
  G.floats.push({ x: p.x, y: p.y - lift, text, color, t: 0 });
}

function sparks(x, y, n, color, spread = 260) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = Math.random() * spread;
    G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, g: 500, life: lerp(.3, .8, Math.random()), r: lerp(1.5, 3.5, Math.random()), color });
  }
}

function sparksAt(o, n, color) {
  const p = proj(o.z, o.x);
  sparks(p.x, p.y - o.h * p.k * .5, n, color);
}

function bumpMult() {
  const el = $('#hMult');
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
}

function collect(o) {
  o.dead = true;
  switch (o.type) {
    case 'coin':
      G.coins++;
      G.score += 5 * mult();
      G.combo++;
      sfx('coin');
      sparksAt(o, 6, '#ffd23f');
      break;
    case 'pax':
      if (G.pax.length >= 3) {
        o.dead = false;
        float(o, t('fullPax'), '#c9b7e4');
        return;
      }
      G.pax.push({ name: o.name, dest: o.dest, at: G.dist + lerp(250, 520, G.rm()), fare: Math.round(lerp(6, 16, G.rm())) * 10 });
      G.combo++;
      float(o, `${o.name} → ${o.dest}`, '#2ed3f0');
      sfx('pick');
      break;
    case 'fuel':
      G.fuel = Math.min(G.fuelMax, G.fuel + 40);
      G.combo++;
      float(o, '+' + t('refuel'), '#3ddc84');
      sfx('pick');
      break;
    case 'horn':
      G.hornBlast = 1;
      G.hornT = 1;
      G.combo++;
      G.powerups++;
      float(o, t('hornBlast'), '#ffd23f');
      sfx('horn');
      break;
    case 'nitro':
      G.nitro = 3;
      G.combo++;
      G.powerups++;
      float(o, t('nitro'), '#ff2e88');
      sfx('nitro');
      break;
    case 'shield':
      G.shield = UPG.shield.vals[P.up.shield];
      G.combo++;
      G.powerups++;
      float(o, t('shield'), '#2ed3f0');
      sfx('pick');
      break;
  }
  G.bestCombo = Math.max(G.bestCombo, G.combo);
  if (G.combo >= 10 && !G.practice) unlockAch('combo10');
  haptic(10);
  bumpMult();
}

function nearMiss(o) {
  G.near++;
  G.nearT = .9;
  const bonus = Math.round(25 * mult());
  G.score += bonus;
  float(o, t('nearMiss') + ' +' + bonus, '#2ed3f0');
  sfx('whoosh');
  haptic(15);
  if (G.near >= 10 && !G.practice) unlockAch('near10');
}

function smash(o, key, bonus) {
  o.dead = true;
  G.smashes++;
  sparksAt(o, 24, '#ffd23f');
  G.score += bonus;
  if (key) float(o, t(key), '#ffd23f');
  sfx('crash', .35);
  G.shake = Math.max(G.shake, .5);
}

function crash(o) {
  G.mode = 'over';
  G.over = { reason: 'crash', type: o.type };
  G.overT = 0;
  G.timeScale = .18;
  G.shake = 1.3;
  G.spinDir = o.x > G.x ? -1 : 1;
  G.crashSpin = 0;
  const p = proj(0, G.x);
  sparks(p.x, p.y - p.k * .3, 60, '#ffb347', 420);
  sparks(p.x, p.y - p.k * .3, 20, '#ffffff', 300);
  sfx('crash');
  haptic([120, 60, 200]);
  engineOn(false);
}

function endFuel() {
  G.mode = 'over';
  G.over = { reason: 'fuel' };
  G.overT = 0;
  sfx('sputter');
  engineOn(false);
}

// Collision and near-miss test for one object against the player.
function interact(o) {
  const lat = Math.abs(o.x - G.x);
  const hitLat = (o.w + PW) / 2;
  const overlapping = Math.abs(o.z) < (o.len + PLEN) / 2 && lat < hitLat;

  if (!o.hit && overlapping) {
    o.hit = true;
    if (o.pick) return collect(o);
    if (o.slow) {
      G.slow = Math.max(G.slow, 1.1);
      G.shake = Math.max(G.shake, .5);
      sfx('bump');
      haptic(30);
      return;
    }
    if (o.bump) {
      G.bobV = -2.4;
      G.slow = Math.max(G.slow, .35);
      sfx('bump');
      haptic(20);
      return;
    }
    if (G.nitro > 0 || G.invul > 0 || G.practice) return smash(o, 'smash', 50);
    if (G.shield > 0) {
      G.shield = 0;
      G.invul = 1.2;
      G.combo = 0;
      return smash(o, 'shieldSaved', 0);
    }
    crash(o);
    return;
  }

  const fullyPassed = o.crash && !o.passed && o.z < -(o.len + PLEN) / 2;
  if (fullyPassed) {
    o.passed = true;
    if (!o.hit && lat - hitLat < .16) nearMiss(o);
  }
}

// Manual horn: scares cows and donkey carts within the upgraded horn range off the road.
function honk() {
  if (G.mode !== 'play' || G.paused) return;
  G.hornT = .45;
  G.honks++;
  sfx('horn');
  const range = UPG.horn.vals[P.up.horn];
  for (const o of G.objs) {
    const inFront = o.animal && !o.scared && o.z > 0 && o.z < range && Math.abs(o.x - G.x) < .75;
    if (!inFront) continue;
    o.scared = true;
    o.scareDir = Math.abs(o.x) < .2 ? (G.x > 0 ? -1 : 1) : Math.sign(o.x);
  }
}

function weave(o, dt) {
  o.wt -= dt;
  if (o.wt <= 0) {
    o.wt = lerp(1.2, 2.8, G.rm());
    o.tl = clamp(o.lane + (G.rm() < .5 ? -1 : 1), 0, 2);
  }
  o.x += (LANE_X[o.tl] - o.x) * Math.min(1, dt * 2.2);
  if (Math.abs(o.x - LANE_X[o.tl]) < .15) o.lane = o.tl;
}

// ===================================================================
// 5. engine — fixed-step simulation
// ===================================================================
function payFares() {
  let paid = false;
  for (const px of G.pax) {
    if (G.dist < px.at) continue;
    px.paid = true;
    paid = true;
    const rs = Math.round(px.fare * mult());
    G.fareRs += rs;
    G.fares++;
    G.score += rs;
    float(null, `+Rs ${rs} · ${px.dest}`, '#3ddc84');
    sfx('fare');
  }
  if (paid) G.pax = G.pax.filter(p => !p.paid);
}

// Ghost replay: sample the player's time/distance/lane for the daily run
function recordGhost(dt) {
  if (!G.daily) return;
  G.recT += dt;
  if (G.recT < .25) return;
  G.recT = 0;
  G.rec.push([Math.round(G.t * 100) / 100, Math.round(G.dist), Math.round(G.x * 100) / 100]);
}

function stepPlay(dt) {
  const up = P.up;
  const diff = clamp(G.dist / 5000, 0, 1);
  const top = G.practice ? 17 : UPG.engine.vals[up.engine];
  const nitroMul = G.nitro > 0 ? 1.5 : 1;
  const slowMul = G.slow > 0 ? .55 : 1;
  const target = lerp(14, top, Math.pow(diff, .7)) * nitroMul * slowMul;
  const approach = G.slow > 0 ? 5 : G.nitro > 0 ? 4 : 1.1;
  G.speed += (target - G.speed) * Math.min(1, dt * approach);
  G.maxSpeed = Math.max(G.maxSpeed, G.speed);

  // lane tween, lean and speed-breaker bob (damped spring)
  const dx = LANE_X[G.lane] - G.x;
  G.x += dx * Math.min(1, dt * UPG.handling.vals[up.handling]);
  G.lean += (clamp(dx * 1.6, -.5, .5) - G.lean) * Math.min(1, dt * 9);
  G.bobV += (-G.bob * 70 - G.bobV * 9) * dt;
  G.bob += G.bobV * dt;
  G.laneTime[G.lane] += dt;

  const dd = G.speed * dt;
  G.dist += dd;
  G.score += dd;
  G.sinceSpawn += dd;
  if (G.rain > .3) G.rainDist += dd;

  if (!G.practice) {
    G.fuel -= dt * (1.6 + G.speed * .045) * (G.nitro > 0 ? .4 : 1);
    if (G.fuel <= 0) {
      G.fuel = 0;
      return endFuel();
    }
  }

  for (const k of ['nitro', 'shield', 'hornBlast', 'slow', 'invul', 'nearT', 'hornT', 'hintT']) {
    if (G[k] > 0) G[k] = Math.max(0, G[k] - dt);
  }

  payFares();
  recordGhost(dt);
  if (G.ghost && !G.ghostBeaten && G.dist > G.ghost.dist) {
    G.ghostBeaten = true;
    float(null, t('ghostBeaten'), '#ffd23f');
    sfx('fare');
  }

  if (G.sinceSpawn >= G.nextGap) spawnWave();

  for (const o of G.objs) {
    o.z -= (G.speed - o.speed) * dt;
    if (o.weave) weave(o, dt);
    if (o.scared) o.x += o.scareDir * dt * 1.2;
    if (G.mode === 'play') interact(o);
  }

  if (G.hornBlast > 0) {
    for (const o of G.objs) {
      if (o.crash && !o.dead && o.z > 0 && o.z < 140 && covers(o, G.lane)) smash(o, null, 20);
    }
  }

  G.objs = G.objs.filter(o => !o.dead && o.z > -30);
  sweep();

  const night = G.tod > .62 && G.tod < .95;
  if (night) G.inNight = true;
  else if (G.inNight) {
    G.inNight = false;
    G.nightDone = true;
  }
}

function stepAttract(dt) {
  G.speed += (13 - G.speed) * Math.min(1, dt);
  G.demoT += dt;
  if (G.demoT > 3.2) {
    G.demoT = 0;
    G.lane = clamp(G.lane + (Math.random() < .5 ? -1 : 1), 0, 2);
  }
  const dx = LANE_X[G.lane] - G.x;
  G.x += dx * Math.min(1, dt * 4);
  G.lean += (clamp(dx * 1.2, -.4, .4) - G.lean) * Math.min(1, dt * 8);
  G.dist += G.speed * dt;
}

// After a crash the world runs in slow motion (dt is scaled) while the timer uses real time (rdt).
function stepOver(dt, rdt) {
  G.overT += rdt;
  const crashed = G.over.reason === 'crash';
  G.speed = Math.max(0, G.speed - rdt * (crashed ? 32 : 9));
  G.dist += G.speed * dt;
  if (crashed) G.crashSpin = Math.min(1.4, G.crashSpin + rdt * 2.6);

  for (const o of G.objs) {
    o.z -= (G.speed - o.speed) * dt;
  }
  G.objs = G.objs.filter(o => o.z > -30 && o.z < FAR);

  const wait = crashed ? 1.5 : 2.2;
  if (G.overT > wait && !G.overShown) {
    G.timeScale = 1;
    finishRun();
  }
}

// Shared world simulation: time of day, scenery, weather, road curvature, particles.
function stepWorld(dt) {
  const dd = G.speed * dt;
  G.tod = (G.tod + dd / 3200) % 1;
  G.sinceScen += dd;
  while (G.sinceScen >= 26) {
    G.sinceScen -= 26;
    spawnScenery(FAR - PD);
  }
  for (const s of G.scen) {
    s.z -= dd;
  }
  G.scen = G.scen.filter(s => s.z > -24);

  G.weatherT -= dt;
  if (G.weatherT <= 0) {
    if (G.rainTarget > 0) {
      G.rainTarget = 0;
      G.weatherT = lerp(30, 70, G.rw());
    } else {
      G.rainTarget = G.rw() < .5 ? lerp(.5, 1, G.rw()) : 0;
      G.weatherT = G.rainTarget ? lerp(18, 35, G.rw()) : lerp(20, 40, G.rw());
    }
  }
  const rainGoal = P.settings.reduce ? 0 : G.rainTarget;
  G.rain += (rainGoal - G.rain) * Math.min(1, dt * .5);

  G.curveT -= dt;
  if (G.curveT <= 0) {
    G.curveT = lerp(6, 14, G.rw());
    G.curveTarget = G.rw() < .35 ? 0 : lerp(-.4, .4, G.rw());
  }
  G.curve += (G.curveTarget - G.curve) * Math.min(1, dt * .35);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 1.6);

  for (const p of G.parts) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += p.g * dt;
    p.life -= dt;
  }
  if (G.parts.length) G.parts = G.parts.filter(p => p.life > 0);
  for (const f of G.floats) {
    f.t += dt;
  }
  if (G.floats.length) G.floats = G.floats.filter(f => f.t < 1.4);
}

function step(dt, rdt) {
  if (G.paused) return;
  G.t += dt;
  if (G.mode === 'play') stepPlay(dt);
  else if (G.mode === 'attract') stepAttract(dt);
  else if (G.mode === 'over') stepOver(dt, rdt);
  stepWorld(dt);
}

// ===================================================================
// 6. render — palette, city, helpers
// ===================================================================
// sky keyframes over one day cycle: [top, middle, horizon] colours and ambient light level
const SKY = [
  { t: 0, c: ['#3d8bd9', '#8cc8f2', '#ffe6b8'], l: 1 },
  { t: .2, c: ['#3d8bd9', '#9ccff2', '#ffe6b8'], l: 1 },
  { t: .42, c: ['#2b1055', '#8e2d7c', '#ff7a3d'], l: .72 },
  { t: .62, c: ['#120d33', '#2a1f5a', '#4a2a6c'], l: .34 },
  { t: .9, c: ['#120d33', '#2a1f5a', '#5a2a6c'], l: .34 },
  { t: 1, c: ['#3d8bd9', '#8cc8f2', '#ffe6b8'], l: 1 },
];

function palette(tod) {
  let i = 0;
  while (SKY[i + 1].t < tod) i++;
  const a = SKY[i];
  const b = SKY[i + 1];
  const u = (tod - a.t) / (b.t - a.t);
  return { c: a.c.map((h, j) => mixCol(h, b.c[j], u)), l: lerp(a.l, b.l, u) };
}

// Two parallax layers of procedural buildings in normalised units (x, w as fractions of W; h as fraction of H).
const CITY = (() => {
  const r = rng(20261016);
  const layers = [];
  const specs = [[36, .05, .15, false], [28, .07, .25, true]];
  for (const [n, hMin, hMax, win] of specs) {
    const buildings = [];
    let x = 0;
    for (let i = 0; i < n; i++) {
      const w = lerp(.035, .1, r());
      const h = lerp(hMin, hMax, r());
      const u = r();
      buildings.push({
        x, w, h, win,
        kind: u < .08 ? 'dome' : u < .16 ? 'tower' : 'block',
        c: Math.floor(r() * 4),
        lit: Array.from({ length: 30 }, () => r() < .5),
        bb: win && r() < .22 ? Math.floor(r() * BILLBOARDS.length) : -1,
      });
      x += w + lerp(0, .02, r());
    }
    layers.push({ b: buildings, span: x });
  }
  return layers;
})();
const STARS = Array.from({ length: 70 }, (_, i) => {
  const r = rng(777 + i);
  return { x: r(), y: r(), s: r() };
});
const CITY_COLS = [['#2a1548', '#311a52', '#241240', '#3a2060'], ['#4a2a6c', '#5b3a7a', '#3e2a5e', '#6a3f6f']];

function rrect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function quad(a, b, c, d, col) {
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.lineTo(c.x, c.y);
  ctx.lineTo(d.x, d.y);
  ctx.closePath();
  ctx.fill();
}

function ell(x, y, rx, ry, col) {
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), 0, 0, Math.PI * 2);
  ctx.fill();
}

function text(str, x, y, size, col, font = 'Righteous,Poppins,sans-serif', maxW) {
  ctx.fillStyle = col;
  ctx.font = `${size}px ${font}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(str, x, y, maxW);
}
const URDU_FONT = '"Noto Nastaliq Urdu",serif';
const light = (x, y, r, c, a = 1) => G.lights.push({ x, y, r, c, a });
let RDT = 1 / 60;
let rainDrops = [];

// ===================================================================
// 6. render — sky, city, road
// ===================================================================
function drawSky(pal) {
  const g = ctx.createLinearGradient(0, 0, 0, horizonY);
  g.addColorStop(0, pal.c[0]);
  g.addColorStop(.55, pal.c[1]);
  g.addColorStop(1, pal.c[2]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, horizonY + 2);

  const night = 1 - pal.l;
  if (night > .1) {
    ctx.fillStyle = '#fff';
    for (const s of STARS) {
      ctx.globalAlpha = night * (.4 + .6 * s.s) * (.6 + .4 * Math.sin(G.t * 2 + s.s * 9));
      ctx.fillRect(s.x * W, s.y * horizonY * .85, 1.5 + s.s, 1.5 + s.s);
    }
    ctx.globalAlpha = 1;
  }

  // sun or moon travels an arc; the disc itself is drawn after the night tint so it stays bright
  const day = G.tod < .62;
  const ph = day ? G.tod / .62 : (G.tod - .62) / .38;
  const bx = lerp(.12, .88, ph) * W;
  const by = horizonY - Math.sin(ph * Math.PI) * horizonY * .78 + 8;
  if (day) {
    const gr = ctx.createRadialGradient(bx, by, 0, bx, by, H * .24);
    gr.addColorStop(0, 'rgba(255,220,150,.6)');
    gr.addColorStop(1, 'rgba(255,160,80,0)');
    ctx.fillStyle = gr;
    ctx.fillRect(0, 0, W, horizonY);
  }
  G.sun = { x: bx, y: by, day, c: day ? (G.tod > .33 ? '#ffb15c' : '#fff3c4') : '#f5f0d8', sky: pal.c[0] };
}

function drawSunDisc() {
  const s = G.sun;
  if (!s) return;
  if (s.day) {
    ell(s.x, s.y, H * .035, H * .035, s.c);
    return;
  }
  ell(s.x, s.y, H * .028, H * .028, s.c);
  ell(s.x + H * .012, s.y - H * .008, H * .024, H * .024, s.sky);
}

function drawBuilding(b, x, top, bw, bh, col) {
  ctx.fillStyle = col;
  ctx.fillRect(x, top, bw, bh + 2);
  if (b.kind === 'dome') {
    ctx.fillStyle = mixCol('#efe6d8', col, .3);
    ctx.beginPath();
    ctx.arc(x + bw / 2, top, bw * .42, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(x + bw / 2 - 1, top - bw * .55, 2, bw * .14);
  }
  if (b.kind === 'tower') {
    ctx.fillStyle = col;
    ctx.fillRect(x + bw * .35, top - bh * .3, bw * .3, bh * .3);
    ctx.fillRect(x + bw / 2 - 1, top - bh * .5, 2, bh * .2);
    light(x + bw / 2, top - bh * .5, 3, '#ff3b3b', .5 + .5 * Math.sin(G.t * 3));
  }
  if (b.bb >= 0 && bw > 34) {
    const bb = BILLBOARDS[b.bb];
    const hh = Math.max(12, bw * .28);
    ctx.fillStyle = ['#ff2e88', '#2ed3f0', '#ffd23f'][b.bb % 3];
    ctx.fillRect(x + 2, top - hh - 6, bw - 4, hh);
    ctx.fillStyle = '#1b0d30';
    ctx.fillRect(x + bw / 2 - 1, top - 6, 2, 6);
    const urdu = bb[1] === 'ur';
    text(bb[0], x + bw / 2, top - hh / 2 - 6, Math.max(7, hh * .5), urdu ? '#fff' : '#1b0d30', urdu ? URDU_FONT : undefined, bw - 8);
  }
}

function drawCity(pal) {
  const parallax = P.settings.reduce ? 0 : 1;
  CITY.forEach((layer, i) => {
    const spanW = layer.span * W;
    const off = -(G.curve * W * (.18 + i * .22)) - G.x * (8 + i * 12) * parallax - (i ? W * .33 : 0);
    const fog = i ? .25 : .55;
    for (const b of layer.b) {
      const bx = ((b.x * W + off) % spanW + spanW) % spanW;
      const bw = b.w * W;
      const bh = b.h * H;
      for (const x of [bx, bx - spanW]) {
        if (x > W || x + bw < 0) continue;
        const col = mixCol(CITY_COLS[i][b.c], pal.c[2], fog * .6);
        drawBuilding(b, x, horizonY - bh, bw, bh, col);
        if (b.win) (b._d || (b._d = [])).push({ x, top: horizonY - bh, bw, bh });
      }
    }
  });
}

// lit windows are drawn after the night tint so they glow
function drawCityLights(pal) {
  const n = 1 - pal.l;
  for (const b of CITY[1].b) {
    if (!b._d) continue;
    if (n >= .12) {
      ctx.fillStyle = '#ffe39a';
      for (const d of b._d) {
        const cols = Math.max(1, Math.floor(d.bw / 9));
        const rows = Math.max(1, Math.floor(d.bh / 11));
        let k = 0;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++, k++) {
            if (!b.lit[k % 30]) continue;
            ctx.globalAlpha = n * .8;
            ctx.fillRect(d.x + 3 + c * 9, d.top + 4 + r * 11, 4, 5);
          }
        }
      }
    }
    b._d = null;
  }
  ctx.globalAlpha = 1;
}

function drawRoad() {
  ctx.fillStyle = '#6e5f52';
  ctx.fillRect(0, horizonY, W, H - horizonY);

  const N = 28;
  const Lp = [], Rp = [], Lo = [], Ro = [];
  for (let i = 0; i <= N; i++) {
    const z = -PD + (FAR + PD) * Math.pow(i / N, 2.2);
    Lp.push(proj(z, -1));
    Rp.push(proj(z, 1));
    Lo.push(proj(z, -1.12));
    Ro.push(proj(z, 1.12));
  }
  const path = (A, B) => {
    ctx.beginPath();
    A.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
    for (let i = B.length - 1; i >= 0; i--) ctx.lineTo(B[i].x, B[i].y);
    ctx.closePath();
  };
  path(Lo, Ro);
  ctx.fillStyle = '#8c8275';
  ctx.fill();
  path(Lp, Rp);
  ctx.fillStyle = '#45454f';
  ctx.fill();
  if (G.rain > .02) {
    const g = ctx.createLinearGradient(0, horizonY, 0, H);
    g.addColorStop(0, 'rgba(180,200,255,0)');
    g.addColorStop(1, `rgba(180,200,255,${.22 * G.rain})`);
    ctx.fillStyle = g;
    ctx.fill();
  }

  // kerb stripes scroll with distance travelled
  for (const side of [-1, 1]) {
    const z0 = -(G.dist % 6) - PD;
    let i = Math.floor(G.dist / 6);
    for (let z = z0; z < 260; z += 6, i++) {
      quad(proj(z, side), proj(z, side * 1.08), proj(z + 6, side * 1.08), proj(z + 6, side), i % 2 ? '#1a1a1a' : '#ffd23f');
    }
  }
  // dashed lane lines: 4 m dash every 10 m
  for (const lx of [-.333, .333]) {
    const z0 = -(G.dist % 10) - PD;
    for (let z = z0; z < FAR; z += 10) {
      quad(proj(z, lx - .014), proj(z, lx + .014), proj(z + 4, lx + .014), proj(z + 4, lx - .014), '#e9e2c9');
    }
  }
}

// ===================================================================
// 6. render — roadside scenery
// ===================================================================
function drawPalm(s, p, out) {
  const k = p.k;
  ctx.strokeStyle = '#5a3d22';
  ctx.lineWidth = Math.max(1, k * .05);
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  ctx.quadraticCurveTo(p.x + out * k * .12, p.y - k * .6 * s.h, p.x + out * k * .2, p.y - k * 1.1 * s.h);
  ctx.stroke();
  const tx = p.x + out * k * .2;
  const ty = p.y - k * 1.1 * s.h;
  ctx.strokeStyle = '#2f8a4a';
  ctx.lineWidth = Math.max(1, k * .045);
  for (let i = 0; i < 6; i++) {
    const a = -Math.PI / 2 + (i - 2.5) * .5 + Math.sin(G.t * 1.5 + s.v * 6) * .04;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.quadraticCurveTo(tx + Math.cos(a) * k * .35, ty + Math.sin(a) * k * .35 - k * .1, tx + Math.cos(a) * k * .5, ty + Math.sin(a) * k * .5 + k * .25);
    ctx.stroke();
  }
  ell(tx, ty + k * .04, k * .05, k * .05, '#7a4a1a');
}

function drawLamp(p, out) {
  const k = p.k;
  ctx.fillStyle = '#9a9aa6';
  ctx.fillRect(p.x - k * .02, p.y - k * 1.5, k * .04, k * 1.5);
  ctx.fillRect(Math.min(p.x, p.x - out * k * .3), p.y - k * 1.5, k * .3, k * .035);
  light(p.x - out * k * .3, p.y - k * 1.45, k * .14, '#ffe9a8', .9);
  if (1 - G.pal.l > .2) ell(p.x - out * k * .3, p.y - k * 1.45, k * .05, k * .03, '#fff6d0');
}

function drawPillar(p, out) {
  const k = p.k;
  ctx.fillStyle = '#7d7a86';
  ctx.fillRect(p.x - k * .12, p.y - k * 1.5, k * .24, k * 1.5);
  ctx.fillStyle = '#6a6774';
  ctx.fillRect(p.x - k * .12, p.y - k * 1.5, k * .06, k * 1.5);
  ctx.fillStyle = '#8e8b98';
  ctx.fillRect(Math.min(p.x - k * .2, p.x + out * k * 1.6), p.y - k * 1.75, k * 1.8, k * .25);
}

function drawBoard(s, p, out) {
  const k = p.k;
  ctx.fillStyle = '#5c5a66';
  ctx.fillRect(p.x - k * .03, p.y - k * 1.6, k * .06, k * 1.6);
  const bw = k * .95;
  const bh = k * .5;
  const bx = p.x - bw / 2 + out * k * .12;
  const by = p.y - k * 1.6 - bh;
  ctx.fillStyle = '#1b0d30';
  ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
  ctx.fillStyle = s.col;
  ctx.fillRect(bx, by, bw, bh);
  if (k > 26) text(s.text, bx + bw / 2, by + bh / 2, bh * (s.ur ? .42 : .38), s.ur ? '#fff' : '#1b0d30', s.ur ? URDU_FONT : undefined, bw - 8);
  if (1 - G.pal.l > .2) light(bx + bw / 2, by + bh / 2, bw * .7, s.col, .35);
}

function drawShop(s, p, out) {
  const k = p.k;
  const w = k * 1.1;
  const h = k * .8;
  const sx = p.x - w / 2 + out * w / 2;
  const y = p.y;
  ctx.fillStyle = '#b9a58a';
  ctx.fillRect(sx, y - h, w, h);
  ctx.fillStyle = s.col;
  ctx.fillRect(sx, y - h, w, h * .22);
  ctx.fillStyle = '#2b1a2a';
  ctx.fillRect(sx + w * .08, y - h * .6, w * .3, h * .6);
  ctx.fillStyle = '#ffe9b0';
  ctx.fillRect(sx + w * .5, y - h * .62, w * .4, h * .34);
  ctx.fillStyle = '#5a3a2a';
  ctx.fillRect(sx + w * .5, y - h * .46, w * .4, h * .02);
  ctx.fillRect(sx + w * .69, y - h * .62, w * .02, h * .34);
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 5; i += 2) {
    ctx.fillRect(sx + (w / 5) * i, y - h, w / 5, h * .22);
  }
  if (k > 40) text(s.name, sx + w / 2, y - h * .89, h * .11, '#1b0d30', undefined, w * .9);
  if (1 - G.pal.l > .25) light(sx + w * .7, y - h * .45, k * .22, '#ffd58a', .5);
}

function drawShelter(p, out) {
  const k = p.k;
  const w = k * .7;
  const h = k * .55;
  const sx = p.x - w / 2 + out * w * .3;
  const y = p.y;
  ctx.fillStyle = '#4a7fb5';
  ctx.fillRect(sx, y - h, w, k * .06);
  ctx.fillStyle = '#9aa0ad';
  ctx.fillRect(sx + k * .03, y - h, k * .035, h);
  ctx.fillRect(sx + w - k * .065, y - h, k * .035, h);
  ctx.fillStyle = '#7a5a3a';
  ctx.fillRect(sx + k * .08, y - k * .2, w - k * .16, k * .04);
  ctx.fillStyle = '#ffd23f';
  ctx.fillRect(sx + w / 2 - k * .14, y - h - k * .22, k * .28, k * .14);
  if (k > 30) text('BUS STOP', sx + w / 2, y - h - k * .15, k * .07, '#1b0d30', 'Poppins,sans-serif');
}

function drawScenery(s) {
  if (s.z < -PD + 3) return;
  const p = proj(s.z, s.x);
  const out = Math.sign(s.x);
  switch (s.kind) {
    case 'palm': return drawPalm(s, p, out);
    case 'lamp': return drawLamp(p, out);
    case 'pillar': return drawPillar(p, out);
    case 'board': return drawBoard(s, p, out);
    case 'shop': return drawShop(s, p, out);
    case 'shelter': return drawShelter(p, out);
  }
}

// ===================================================================
// 6. render — vehicles and pickups
// ===================================================================
// Pseudo-3D box: rear face at p0, roof receding to p1, and the side that faces the camera.
function box3d(p0, p1, w, h, face, roof, side) {
  const hw0 = w * p0.k / 2;
  const hw1 = w * p1.k / 2;
  const t0 = p0.y - h * p0.k;
  const t1 = p1.y - h * p1.k;
  quad({ x: p0.x - hw0, y: t0 }, { x: p0.x + hw0, y: t0 }, { x: p1.x + hw1, y: t1 }, { x: p1.x - hw1, y: t1 }, roof);
  const sgn = p0.x < cx ? 1 : -1;
  quad({ x: p0.x + sgn * hw0, y: t0 }, { x: p1.x + sgn * hw1, y: t1 }, { x: p1.x + sgn * hw1, y: p1.y }, { x: p0.x + sgn * hw0, y: p0.y }, side);
  ctx.fillStyle = face;
  rrect(p0.x - hw0, t0, hw0 * 2, p0.y - t0, hw0 * .14);
  ctx.fill();
  return { hw0, t0 };
}

function wheels(p, w, k, size = .09) {
  ctx.fillStyle = '#141414';
  const hw = w * k / 2;
  rrect(p.x - hw + k * .01, p.y - k * size, k * .07, k * size, 2);
  ctx.fill();
  rrect(p.x + hw - k * .08, p.y - k * size, k * .07, k * size, 2);
  ctx.fill();
}

function tailLights(x, y, k, dx, size, lit) {
  for (const s of [-1, 1]) {
    const lx = x + s * dx;
    ctx.fillStyle = '#ff3b3b';
    rrect(lx - k * size / 2, y - k * size / 2, k * size, k * size * .6, 2);
    ctx.fill();
    light(lx, y, k * .1, '#ff3b3b', lit ? .9 : .35);
  }
}

// colour-blind helper: shape badge above the object (triangle = danger, diamond = hazard, circle = pickup)
function cbMark(o, p, kind) {
  if (!P.settings.cb || p.k < 20) return;
  const y = p.y - (o.h + .25) * p.k - 12;
  const s = 7;
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#1b0d30';
  ctx.lineWidth = 2;
  ctx.beginPath();
  if (kind === 'tri') {
    ctx.moveTo(p.x, y - s);
    ctx.lineTo(p.x + s, y + s);
    ctx.lineTo(p.x - s, y + s);
  } else if (kind === 'dia') {
    ctx.moveTo(p.x, y - s);
    ctx.lineTo(p.x + s, y);
    ctx.lineTo(p.x, y + s);
    ctx.lineTo(p.x - s, y);
  } else {
    ctx.arc(p.x, y, s, 0, Math.PI * 2);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
}

function drawPothole(o, p) {
  const k = p.k;
  ell(p.x, p.y - k * .02, o.w * k / 2, o.w * k * .14, '#2a2a30');
  ell(p.x, p.y - k * .03, o.w * k * .36, o.w * k * .09, '#1a1a1e');
  if (G.rain > .3) ell(p.x, p.y - k * .03, o.w * k * .3, o.w * k * .07, `rgba(160,190,255,${G.rain * .5})`);
  cbMark(o, p, 'dia');
}

function drawBreaker(o, p) {
  const a = proj(o.z, -1);
  const b = proj(o.z, 1);
  const c = proj(o.z + o.len, 1);
  const d = proj(o.z + o.len, -1);
  quad(a, b, c, d, '#ffd23f');
  for (let i = 0; i < 10; i += 2) {
    const u0 = i / 10;
    const u1 = (i + 1) / 10;
    quad({ x: lerp(a.x, b.x, u0), y: a.y }, { x: lerp(a.x, b.x, u1), y: a.y }, { x: lerp(d.x, c.x, u1), y: c.y }, { x: lerp(d.x, c.x, u0), y: c.y }, '#1a1a1a');
  }
  cbMark(o, p, 'dia');
}

function drawCoin(o, p, bob) {
  const k = p.k;
  const r = k * .12;
  const cy = p.y - k * .2 + bob;
  ell(p.x, cy, r, r, '#c98f00');
  ell(p.x - r * .1, cy - r * .08, r * .85, r * .85, '#ffd23f');
  if (k > 40) text('₨', p.x, cy + 1, r, '#9a6a00', 'bold Poppins,sans-serif');
  light(p.x, cy, r * 1.8, '#ffd23f', .35);
}

function drawFuelCan(o, p, bob) {
  const k = p.k;
  const w = k * .2;
  const h = k * .26;
  const cy = p.y - h + bob;
  ctx.fillStyle = '#d6232d';
  rrect(p.x - w / 2, cy, w, h, 3);
  ctx.fill();
  ctx.fillStyle = '#ffd23f';
  ctx.fillRect(p.x - w * .12, cy - k * .035, w * .24, k * .04);
  ctx.strokeStyle = '#ffd23f';
  ctx.lineWidth = Math.max(1, k * .02);
  ctx.beginPath();
  ctx.arc(p.x + w * .1, cy + h * .25, w * .22, Math.PI, 0);
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.fillRect(p.x - w * .3, cy + h * .45, w * .6, h * .22);
}

function drawPassenger(o, p) {
  const k = p.k;
  const h = k * .46;
  const x = p.x;
  const y = p.y;
  const c = ['#2ed3f0', '#ff2e88', '#3ddc84', '#ffd23f'][Math.floor(o.v * 4)];
  ctx.fillStyle = '#f3dcc0';
  ctx.fillRect(x - k * .05, y - h * .42, k * .04, h * .42);
  ctx.fillRect(x + k * .01, y - h * .42, k * .04, h * .42);
  ctx.fillStyle = c;
  rrect(x - k * .075, y - h * .75, k * .15, h * .36, 3);
  ctx.fill();
  ell(x, y - h * .86, k * .055, k * .055, '#c68a5a');
  ctx.fillStyle = '#1b0d30';
  ctx.beginPath();
  ctx.arc(x, y - h * .88, k * .055, Math.PI, 0);
  ctx.fill();
  const wave = Math.sin(G.t * 6 + o.v * 5) * .4;
  ctx.strokeStyle = c;
  ctx.lineWidth = Math.max(1, k * .03);
  ctx.beginPath();
  ctx.moveTo(x + k * .07, y - h * .68);
  ctx.lineTo(x + k * .14 + wave * k * .04, y - h * .95);
  ctx.stroke();
  ctx.fillStyle = '#7a4a2a';
  ctx.fillRect(x - k * .13, y - h * .5, k * .06, k * .08);
  if (k > 60) text(o.name, x, y - h * 1.12, k * .07, '#fff3dc', 'Poppins,sans-serif');
}

function drawPowerup(o, p, bob) {
  const k = p.k;
  const r = k * .15;
  const x = p.x;
  const cy = p.y - k * .25 + bob;
  const col = { horn: '#ffd23f', nitro: '#ff2e88', shield: '#2ed3f0' }[o.type];
  light(x, cy, r * 2.2, col, .5);
  ctx.fillStyle = '#1b0d30';
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = i * Math.PI / 3 + G.t;
    ctx.lineTo(x + Math.cos(a) * r, cy + Math.sin(a) * r);
  }
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = col;
  ctx.lineWidth = Math.max(1.5, k * .025);
  ctx.stroke();

  ctx.fillStyle = col;
  ctx.beginPath();
  if (o.type === 'horn') {
    ctx.moveTo(x - r * .5, cy - r * .2);
    ctx.lineTo(x - r * .1, cy - r * .2);
    ctx.lineTo(x + r * .45, cy - r * .55);
    ctx.lineTo(x + r * .45, cy + r * .55);
    ctx.lineTo(x - r * .1, cy + r * .2);
    ctx.lineTo(x - r * .5, cy + r * .2);
    ctx.closePath();
    ctx.fill();
  } else if (o.type === 'nitro') {
    ctx.moveTo(x, cy + r * .55);
    ctx.bezierCurveTo(x - r * .6, cy + r * .2, x - r * .2, cy - r * .2, x - r * .05, cy - r * .6);
    ctx.bezierCurveTo(x + r * .1, cy - r * .2, x + r * .3, cy - r * .1, x + r * .15, cy + r * .05);
    ctx.bezierCurveTo(x + r * .6, cy, x + r * .5, cy + r * .5, x, cy + r * .55);
    ctx.fill();
  } else {
    ctx.moveTo(x, cy - r * .55);
    ctx.lineTo(x + r * .45, cy - r * .35);
    ctx.lineTo(x + r * .4, cy + r * .1);
    ctx.quadraticCurveTo(x + r * .3, cy + r * .45, x, cy + r * .6);
    ctx.quadraticCurveTo(x - r * .3, cy + r * .45, x - r * .4, cy + r * .1);
    ctx.lineTo(x - r * .45, cy - r * .35);
    ctx.closePath();
    ctx.lineWidth = Math.max(1.5, k * .03);
    ctx.stroke();
  }
}

function drawPickupObj(o, p) {
  const bob = Math.sin(G.t * 5 + o.v * 7) * p.k * .03;
  ell(p.x, p.y, o.w * p.k * .5, o.w * p.k * .14, 'rgba(0,0,0,.3)');
  if (o.type === 'coin') drawCoin(o, p, bob);
  else if (o.type === 'fuel') drawFuelCan(o, p, bob);
  else if (o.type === 'pax') drawPassenger(o, p);
  else drawPowerup(o, p, bob);
  cbMark(o, p, 'cir');
}

function drawCar(o, p, p1, lit) {
  const k = p.k;
  const { hw0, t0 } = box3d(p, p1, o.w, o.h, o.col, shade(o.col, 1.2), shade(o.col, .7));
  ctx.fillStyle = '#20243a';
  rrect(p.x - hw0 * .78, t0 + k * .03, hw0 * 1.56, k * .13, 3);
  ctx.fill();
  ctx.fillStyle = shade(o.col, .8);
  ctx.fillRect(p.x - hw0, p.y - k * .11, hw0 * 2, k * .035);
  wheels(p, o.w, k);
  tailLights(p.x, p.y - k * .17, k, o.w * k * .4, .07, lit);
}

function drawPickupTruck(o, p, p1, lit) {
  const k = p.k;
  const pm = proj(o.z + o.len * .5, o.x);
  box3d(p, pm, o.w, .26, '#d9d9d9', '#c9c9c9', '#9a9a9a');
  for (let i = 0; i < 3; i++) {
    ell(pm.x + (i - 1) * pm.k * .13, pm.y - pm.k * .3, pm.k * .08, pm.k * .06, i % 2 ? '#b08968' : '#8a6a4a');
  }
  box3d(pm, p1, o.w, o.h, '#e9e9e9', '#f4f4f4', '#bdbdbd');
  ctx.fillStyle = '#20243a';
  rrect(pm.x - pm.k * .18, pm.y - o.h * pm.k * .92, pm.k * .36, pm.k * .16, 3);
  ctx.fill();
  wheels(p, o.w, k);
  tailLights(p.x, p.y - k * .17, k, o.w * k * .4, .07, lit);
}

function drawBus(o, p, p1, lit) {
  const k = p.k;
  const base = ['#c0392b', '#1f6f8b', '#2e8b57'][Math.floor(o.v * 3)];
  const { hw0, t0 } = box3d(p, p1, o.w, o.h, base, shade(base, 1.15), shade(base, .65));
  const hgt = p.y - t0;
  ctx.fillStyle = '#ffd23f';
  ctx.fillRect(p.x - hw0, t0 + hgt * .55, hw0 * 2, k * .05);
  ctx.fillStyle = '#3ddc84';
  ctx.fillRect(p.x - hw0, t0 + hgt * .64, hw0 * 2, k * .03);
  ctx.fillStyle = '#fff';
  ctx.fillRect(p.x - hw0, t0 + hgt * .69, hw0 * 2, k * .02);
  ctx.fillStyle = '#20243a';
  for (let i = -1; i <= 1; i++) {
    rrect(p.x + i * hw0 * .6 - hw0 * .25, t0 + k * .06, hw0 * .5, k * .22, 3);
    ctx.fill();
  }
  ctx.fillStyle = '#ffd23f';
  rrect(p.x - hw0 * .25, t0 + hgt * .3, hw0 * .5, k * .09, 2);
  ctx.fill();
  if (k > 50) text('W-11', p.x, t0 + hgt * .3 + k * .045, k * .06, '#1b0d30', 'bold Poppins,sans-serif');
  ctx.fillStyle = '#7a3b2a';
  ctx.fillRect(p.x - hw0 * .9, t0 - k * .08, hw0 * 1.8, k * .08);
  const luggage = ['#2ed3f0', '#ff2e88', '#ffd23f', '#3ddc84'];
  for (let i = 0; i < 4; i++) {
    ell(p.x + (i - 1.5) * hw0 * .42, t0 - k * .1, hw0 * .17, k * .05, luggage[i]);
  }
  wheels(p, o.w, k, .1);
  tailLights(p.x, p.y - k * .2, k, hw0 * .82, .07, lit);
}

function drawBike(o, p, lit) {
  const k = p.k;
  const x = p.x;
  const y = p.y;
  ell(x, y - k * .05, k * .035, k * .09, '#111');
  ctx.fillStyle = '#333';
  rrect(x - k * .05, y - k * .2, k * .1, k * .1, 3);
  ctx.fill();
  ctx.fillStyle = ['#2b4b9c', '#8e2b2b', '#1f6f3a', '#333'][Math.floor(o.v * 4)];
  rrect(x - k * .07, y - k * .4, k * .14, k * .22, 4);
  ctx.fill();
  ctx.fillStyle = '#f3dcc0';
  ctx.fillRect(x - k * .11, y - k * .36, k * .04, k * .12);
  ctx.fillRect(x + k * .07, y - k * .36, k * .04, k * .12);
  ell(x, y - k * .44, k * .055, k * .055, o.v > .5 ? '#1b1b1b' : '#d6232d');
  ctx.fillStyle = '#ff3b3b';
  ctx.fillRect(x - k * .02, y - k * .17, k * .04, k * .03);
  light(x, y - k * .16, k * .06, '#ff3b3b', lit ? .8 : .3);
}

function drawCart(o, p) {
  const k = p.k;
  const x = p.x;
  const y = p.y;
  const pm = proj(o.z + o.len * .55, o.x);
  box3d(p, pm, o.w, .3, '#9a6a3a', '#b07a45', '#6e4a28');
  for (let i = 0; i < 3; i++) {
    ell(x + (i - 1) * k * .12, y - k * .32, k * .09, k * .07, i % 2 ? '#c9b48a' : '#a88f68');
  }
  for (const s of [-1, 1]) {
    ell(x + s * o.w * k * .55, y - k * .13, k * .04, k * .14, '#3a2a1a');
  }
  // the donkey walks ahead of the cart
  const dk = pm.k;
  const dx = pm.x;
  const dy = pm.y;
  ell(dx, dy - dk * .3, dk * .13, dk * .12, '#8d8680');
  ctx.fillStyle = '#6e6862';
  ctx.fillRect(dx - dk * .1, dy - dk * .22, dk * .035, dk * .22);
  ctx.fillRect(dx + dk * .065, dy - dk * .22, dk * .035, dk * .22);
  ell(dx, dy - dk * .46, dk * .07, dk * .08, '#8d8680');
  ell(dx - dk * .06, dy - dk * .55, dk * .025, dk * .07, '#7a736d');
  ell(dx + dk * .06, dy - dk * .55, dk * .025, dk * .07, '#7a736d');
  light(x, y - k * .2, k * .05, '#ff3b3b', .3);
}

function drawCow(o, p) {
  const k = p.k;
  const x = p.x;
  const y = p.y;
  const bw = o.w * k;
  const white = o.v > .5;
  ctx.fillStyle = '#5a4030';
  ctx.fillRect(x - bw * .35, y - k * .22, k * .04, k * .22);
  ctx.fillRect(x + bw * .3, y - k * .22, k * .04, k * .22);
  ell(x, y - k * .3, bw * .5, k * .17, white ? '#f1ebe0' : '#8a5a3a');
  ell(x - bw * .15, y - k * .33, bw * .14, k * .07, white ? '#6e4a2e' : '#f1ebe0');
  ell(x + bw * .2, y - k * .28, bw * .1, k * .05, white ? '#6e4a2e' : '#f1ebe0');
  ctx.strokeStyle = '#5a4030';
  ctx.lineWidth = Math.max(1, k * .015);
  ctx.beginPath();
  ctx.moveTo(x, y - k * .42);
  ctx.lineTo(x + k * .02, y - k * .18 + Math.sin(G.t * 3 + o.v) * k * .03);
  ctx.stroke();
  ell(x, y - k * .5, bw * .18, k * .08, white ? '#e4d9c8' : '#7a4a2a');
  ctx.strokeStyle = '#d9cbb0';
  ctx.lineWidth = Math.max(1, k * .02);
  ctx.beginPath();
  ctx.moveTo(x - bw * .15, y - k * .53);
  ctx.lineTo(x - bw * .3, y - k * .62);
  ctx.moveTo(x + bw * .15, y - k * .53);
  ctx.lineTo(x + bw * .3, y - k * .62);
  ctx.stroke();
}

function drawBarrier(o, p) {
  const k = p.k;
  const x = p.x;
  const y = p.y;
  const w = o.w * k;
  const h = o.h * k;
  ctx.fillStyle = '#555';
  ctx.fillRect(x - w * .45, y - h * .5, k * .03, h * .5);
  ctx.fillRect(x + w * .42, y - h * .5, k * .03, h * .5);
  ctx.fillStyle = '#ff7a1a';
  rrect(x - w / 2, y - h, w, h * .6, 2);
  ctx.fill();
  ctx.save();
  ctx.beginPath();
  ctx.rect(x - w / 2, y - h, w, h * .6);
  ctx.clip();
  ctx.fillStyle = '#fff';
  for (let i = -2; i < 8; i++) {
    const sx = x - w / 2 + i * w * .2;
    ctx.beginPath();
    ctx.moveTo(sx, y - h);
    ctx.lineTo(sx + w * .1, y - h);
    ctx.lineTo(sx - w * .1, y - h * .4);
    ctx.lineTo(sx - w * .2, y - h * .4);
    ctx.fill();
  }
  ctx.restore();
  const on = Math.sin(G.t * 6 + o.v * 3) > 0;
  ell(x, y - h * 1.1, k * .03, k * .03, on ? '#ffd23f' : '#6a5a1a');
  if (on) light(x, y - h * 1.1, k * .09, '#ffd23f', .8);
}

function drawObj(o) {
  if (o.z < -PD + 2 || o.z > FAR) return;
  const p = proj(o.z, o.x);
  if (o.type === 'pothole') return drawPothole(o, p);
  if (o.type === 'breaker') return drawBreaker(o, p);
  if (o.pick) return drawPickupObj(o, p);

  const p1 = proj(o.z + o.len, o.x);
  const lit = 1 - G.pal.l > .25;
  ell(p.x, p.y, o.w * p.k * .55, o.w * p.k * .12, 'rgba(0,0,0,.35)');
  switch (o.type) {
    case 'car': drawCar(o, p, p1, lit); break;
    case 'pickup': drawPickupTruck(o, p, p1, lit); break;
    case 'bus': drawBus(o, p, p1, lit); break;
    case 'bike': drawBike(o, p, lit); break;
    case 'cart': drawCart(o, p); break;
    case 'cow': drawCow(o, p); break;
    case 'barrier': drawBarrier(o, p); break;
  }
  cbMark(o, p, 'tri');
}

// ===================================================================
// 6. render — the rickshaw and its truck-art panel
// ===================================================================
function patClassic(c, x, y, w, h, s) {
  const cyp = y + h / 2;
  c.fillStyle = s.trim;
  c.fillRect(x, y + h * .42, w, h * .16);
  for (let i = 0; i < 3; i++) {
    const fx = x + w * (.2 + .3 * i);
    for (let j = 0; j < 6; j++) {
      const a = j * Math.PI / 3;
      c.fillStyle = s.accent;
      c.beginPath();
      c.ellipse(fx + Math.cos(a) * h * .12, cyp + Math.sin(a) * h * .12, h * .08, h * .05, a, 0, Math.PI * 2);
      c.fill();
    }
    c.fillStyle = '#fff';
    c.beginPath();
    c.arc(fx, cyp, h * .06, 0, Math.PI * 2);
    c.fill();
  }
  c.fillStyle = '#fff';
  for (let i = 0; i < 8; i++) {
    for (const yy of [y + h * .12, y + h * .88]) {
      c.beginPath();
      c.arc(x + w * (i + .5) / 8, yy, h * .04, 0, Math.PI * 2);
      c.fill();
    }
  }
}

function patPhool(c, x, y, w, h, s) {
  const cyp = y + h / 2;
  for (let i = 0; i < 2; i++) {
    const fx = x + w * (.3 + .4 * i);
    for (let j = 0; j < 5; j++) {
      const a = j * Math.PI * 2 / 5 - Math.PI / 2;
      c.fillStyle = s.accent;
      c.beginPath();
      c.ellipse(fx + Math.cos(a) * h * .15, cyp + Math.sin(a) * h * .15, h * .1, h * .07, a, 0, Math.PI * 2);
      c.fill();
    }
    c.fillStyle = '#ffd23f';
    c.beginPath();
    c.arc(fx, cyp, h * .08, 0, Math.PI * 2);
    c.fill();
  }
  c.fillStyle = s.trim;
  c.beginPath();
  c.ellipse(x + w / 2, y + h * .85, w * .1, h * .08, .6, 0, Math.PI * 2);
  c.fill();
  c.beginPath();
  c.ellipse(x + w / 2, y + h * .15, w * .1, h * .08, -.6, 0, Math.PI * 2);
  c.fill();
}

function patAjrak(c, x, y, w, h, s) {
  const cyp = y + h / 2;
  c.fillStyle = s.trim;
  c.fillRect(x, y, w, h * .14);
  c.fillRect(x, y + h * .86, w, h * .14);
  const d = h * .22;
  for (let i = 0; i < w / d + 1; i++) {
    const dx = x + i * d;
    c.fillStyle = s.accent;
    c.beginPath();
    c.moveTo(dx, cyp);
    c.lineTo(dx + d / 2, cyp - d * .6);
    c.lineTo(dx + d, cyp);
    c.lineTo(dx + d / 2, cyp + d * .6);
    c.closePath();
    c.fill();
    c.fillStyle = s.trim;
    c.beginPath();
    c.arc(dx + d / 2, cyp, d * .14, 0, Math.PI * 2);
    c.fill();
  }
}

function patChamak(c, x, y, w, h) {
  const cols = ['#2ed3f0', '#ff2e88', '#ffd23f', '#3ddc84'];
  for (let b = 0; b < 4; b++) {
    c.strokeStyle = cols[b];
    c.lineWidth = h * .07;
    c.beginPath();
    const yy = y + h * (.2 + .2 * b);
    for (let i = 0; i <= 8; i++) {
      c.lineTo(x + w * i / 8, yy + (i % 2 ? -h * .07 : h * .07));
    }
    c.stroke();
  }
}

function patRoyal(c, x, y, w, h, s) {
  const cxp = x + w / 2;
  const cyp = y + h / 2;
  c.fillStyle = s.accent;
  for (let i = 0; i < 9; i++) {
    c.beginPath();
    c.arc(x + w * (i + .5) / 9, y, h * .11, 0, Math.PI);
    c.fill();
    c.beginPath();
    c.arc(x + w * (i + .5) / 9, y + h, h * .11, Math.PI, 0);
    c.fill();
  }
  // crescent and star
  c.fillStyle = s.trim;
  c.beginPath();
  c.arc(cxp - w * .02, cyp, h * .22, 0, Math.PI * 2);
  c.fill();
  c.fillStyle = s.body;
  c.beginPath();
  c.arc(cxp + w * .02, cyp - h * .03, h * .19, 0, Math.PI * 2);
  c.fill();
  c.fillStyle = s.trim;
  c.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = i * Math.PI / 5 - Math.PI / 2;
    const r = i % 2 ? h * .05 : h * .11;
    c.lineTo(cxp + w * .12 + Math.cos(a) * r, cyp + Math.sin(a) * r);
  }
  c.closePath();
  c.fill();
}

function patNeon(c, x, y, w, h, s) {
  const cyp = y + h / 2;
  c.strokeStyle = s.accent;
  c.lineWidth = Math.max(1, h * .05);
  for (let i = 0; i < 4; i++) {
    const dx = x + w * (i + .5) / 4;
    c.beginPath();
    c.moveTo(dx, y + h * .2);
    c.lineTo(dx + w * .09, cyp);
    c.lineTo(dx, y + h * .8);
    c.lineTo(dx - w * .09, cyp);
    c.closePath();
    c.stroke();
  }
  c.fillStyle = s.trim;
  for (let i = 0; i <= 4; i++) {
    for (const yy of [y + h * .1, y + h * .9]) {
      c.beginPath();
      c.arc(x + w * i / 4, yy, h * .06, 0, Math.PI * 2);
      c.fill();
    }
  }
}

const PATTERNS = { classic: patClassic, phool: patPhool, ajrak: patAjrak, chamak: patChamak, royal: patRoyal, neon: patNeon };

function panelPattern(c, x, y, w, h, s) {
  c.save();
  c.beginPath();
  c.rect(x, y, w, h);
  c.clip();
  c.fillStyle = s.body;
  c.fillRect(x, y, w, h);
  (PATTERNS[s.id] || patClassic)(c, x, y, w, h, s);
  c.restore();
}

function roundedOn(c, x, y, w, h, r) {
  c.beginPath();
  if (c.roundRect) c.roundRect(x, y, w, h, r);
  else c.rect(x, y, w, h);
  c.fill();
}

// Draw a rickshaw seen from behind at base point (x, y); k = pixels per lane unit. Works on any 2D context.
function drawRickshaw(c, x, y, k, s, lean = 0, o = {}) {
  c.save();
  c.translate(x, y);
  c.rotate(lean * .22 + (o.spin || 0));
  if (o.spin) c.scale(1 - Math.abs(o.spin) * .15, 1 - Math.abs(o.spin) * .15);
  if (o.alpha != null) c.globalAlpha = o.alpha;

  // rear wheels and the front wheel peeking under the chassis
  for (const sx of [-1, 1]) {
    c.fillStyle = '#141414';
    roundedOn(c, sx * k * .2 - k * .045, -k * .15, k * .09, k * .16, 3);
    c.fillStyle = '#8a8a8a';
    c.beginPath();
    c.arc(sx * k * .2, -k * .07, k * .025, 0, Math.PI * 2);
    c.fill();
  }
  c.fillStyle = '#1a1a1a';
  c.beginPath();
  c.ellipse(0, -k * .04, k * .05, k * .03, 0, 0, Math.PI * 2);
  c.fill();

  // body, truck-art panel, bumper, number plate, tail lights
  c.fillStyle = s.body;
  roundedOn(c, -k * .25, -k * .47, k * .5, k * .41, k * .05);
  panelPattern(c, -k * .23, -k * .42, k * .46, k * .22, s);
  c.fillStyle = '#2b2b2b';
  c.fillRect(-k * .26, -k * .12, k * .52, k * .05);
  c.fillStyle = '#fff';
  c.fillRect(-k * .08, -k * .19, k * .16, k * .06);
  if (k > 60) {
    c.fillStyle = '#1b0d30';
    c.font = `bold ${k * .045}px Poppins,sans-serif`;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText('KHI-' + (o.plate || '786'), 0, -k * .158);
  }
  for (const sx of [-1, 1]) {
    c.fillStyle = '#ff3b3b';
    c.beginPath();
    c.arc(sx * k * .2, -k * .17, k * .03, 0, Math.PI * 2);
    c.fill();
  }

  // canopy, roof edge, rear window with passenger silhouettes
  c.fillStyle = s.canopy;
  c.beginPath();
  c.moveTo(-k * .25, -k * .47);
  c.lineTo(k * .25, -k * .47);
  c.lineTo(k * .22, -k * .8);
  c.lineTo(-k * .22, -k * .8);
  c.closePath();
  c.fill();
  c.fillStyle = shade(s.canopy, 1.6);
  c.fillRect(-k * .22, -k * .8, k * .44, k * .03);
  c.fillStyle = '#242a44';
  roundedOn(c, -k * .18, -k * .75, k * .36, k * .23, k * .03);
  c.fillStyle = '#1b1b24';
  const pax = o.pax || 0;
  for (let i = 0; i < pax; i++) {
    const px = (i - (pax - 1) / 2) * k * .1;
    c.beginPath();
    c.arc(px, -k * .62, k * .045, 0, Math.PI * 2);
    c.fill();
    c.fillRect(px - k * .06, -k * .6, k * .12, k * .08);
  }

  // fringe pom-poms along the canopy edge, exhaust pipe
  for (let i = 0; i < 7; i++) {
    c.fillStyle = i % 2 ? '#ffd23f' : '#e23d28';
    c.beginPath();
    c.arc(-k * .21 + i * k * .07, -k * .45 + Math.sin(G.t * 9 + i) * k * .006, k * .017, 0, Math.PI * 2);
    c.fill();
  }
  c.fillStyle = '#555';
  c.fillRect(-k * .3, -k * .09, k * .06, k * .03);
  c.restore();
}

function drawPlayer() {
  const p = proj(0, G.x);
  const k = p.k;
  const y = p.y - G.bob * k * .08;
  const s = skinOf(P.skin);
  ell(p.x, p.y, k * .32, k * .07, 'rgba(0,0,0,.4)');

  if (G.nitro > 0 && G.mode === 'play') {
    for (let i = 0; i < 3; i++) {
      ell(p.x - k * .27 + (Math.random() - .5) * k * .04, y - k * .07 + Math.random() * k * .04, k * (.04 + Math.random() * .04), k * .02, i ? '#ff7a1a' : '#ffd23f');
    }
  }
  const crashing = G.mode === 'over' && G.over && G.over.reason === 'crash';
  drawRickshaw(ctx, p.x, y, k, s, G.lean, { pax: G.pax.length, spin: crashing ? G.crashSpin * G.spinDir : 0, plate: G.daily ? 'DLY' : G.practice ? 'LRN' : '786' });

  if (G.shield > 0) {
    const blink = G.shield < 2 && Math.sin(G.t * 18) > 0;
    ctx.strokeStyle = blink ? 'rgba(46,211,240,.3)' : 'rgba(46,211,240,.75)';
    ctx.fillStyle = 'rgba(46,211,240,.12)';
    ctx.lineWidth = Math.max(1.5, k * .015);
    ctx.beginPath();
    ctx.ellipse(p.x, y - k * .4, k * .36, k * .5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }
  if (G.hornT > 0) {
    ctx.strokeStyle = `rgba(255,210,63,${G.hornT})`;
    ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const r = (1 - G.hornT / .45 + i * .3) * k * .5;
      ctx.beginPath();
      ctx.arc(p.x, y - k * .6, Math.max(1, r), Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();
    }
  }
  for (const sx of [-1, 1]) {
    light(p.x + sx * k * .2, y - k * .17, k * .09, '#ff3b3b', .6);
  }
  // headlight cone on the road at night
  if (1 - G.pal.l > .25 && G.mode !== 'over') {
    const a = proj(3, G.x - .22);
    const b = proj(3, G.x + .22);
    const c = proj(55, G.x + .5);
    const d = proj(55, G.x - .5);
    const g = ctx.createLinearGradient(0, a.y, 0, c.y);
    g.addColorStop(0, `rgba(255,236,170,${(1 - G.pal.l) * .35})`);
    g.addColorStop(1, 'rgba(255,236,170,0)');
    G.lights.push({ cone: [a, b, c, d], g });
  }
}

// Ghost of the best daily run so far: interpolate its distance and lane at the current run time.
function ghostPose() {
  const samples = G.ghost && G.ghost.samples;
  if (!samples || samples.length < 2) return null;
  while (G.ghostIdx < samples.length - 2 && samples[G.ghostIdx + 1][0] < G.t) G.ghostIdx++;
  const a = samples[G.ghostIdx];
  const b = samples[G.ghostIdx + 1];
  if (G.t > b[0] + 1) return null;
  const u = clamp((G.t - a[0]) / Math.max(.01, b[0] - a[0]), 0, 1);
  return { d: lerp(a[1], b[1], u), x: lerp(a[2], b[2], u) };
}

function drawGhost() {
  if (G.mode !== 'play' || !G.daily) return;
  const pose = ghostPose();
  if (!pose) return;
  const z = pose.d - G.dist;
  if (z < -PD + 4 || z > 320) return;
  const p = proj(z, pose.x);
  drawRickshaw(ctx, p.x, p.y, p.k, skinOf(P.skin), 0, { alpha: .4, plate: 'GHO' });
  if (p.k > 50) text(t('ghostLabel'), p.x, p.y - p.k * .9, p.k * .08, 'rgba(46,211,240,.8)', 'Poppins,sans-serif');
}

// ===================================================================
// 6. render — post layers and the frame
// ===================================================================
function drawLights(pal) {
  ctx.globalCompositeOperation = 'lighter';
  for (const l of G.lights) {
    if (l.cone) {
      quad(l.cone[0], l.cone[1], l.cone[2], l.cone[3], l.g);
      continue;
    }
    const g = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, Math.max(1, l.r));
    g.addColorStop(0, l.c);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = clamp(l.a * (.35 + (1 - pal.l) * .9), 0, 1);
    ctx.fillStyle = g;
    ctx.fillRect(l.x - l.r, l.y - l.r, l.r * 2, l.r * 2);
    // wet road: stretch a dim reflection below the light
    if (G.rain > .2 && l.y > horizonY) {
      ctx.globalAlpha *= G.rain * .5;
      ctx.save();
      ctx.translate(l.x, l.y);
      ctx.scale(.6, 3);
      ctx.translate(-l.x, -l.y);
      ctx.fillRect(l.x - l.r, l.y, l.r * 2, l.r * 2);
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawRain() {
  const want = Math.round(G.rain * (portrait ? 110 : 170));
  if (!want && !rainDrops.length) return;
  while (rainDrops.length < want) {
    rainDrops.push({ x: Math.random() * (W + 200), y: Math.random() * H, l: lerp(10, 26, Math.random()), v: lerp(900, 1400, Math.random()) });
  }
  if (rainDrops.length > want) rainDrops.length = want;
  ctx.strokeStyle = 'rgba(205,228,255,.45)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (const d of rainDrops) {
    d.y += d.v * RDT;
    d.x -= d.v * .25 * RDT;
    if (d.y > H) {
      d.y = -20;
      d.x = Math.random() * (W + 200);
    }
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x - d.l * .25, d.y - d.l);
  }
  ctx.stroke();
}

function drawParticles() {
  for (const p of G.parts) {
    ctx.globalAlpha = clamp(p.life * 1.8, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r);
  }
  ctx.globalAlpha = 1;
}

function drawFloats() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `${portrait ? 16 : 20}px Righteous,Poppins,sans-serif`;
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#1b0d30';
  for (const f of G.floats) {
    const a = f.t < 1 ? 1 : 1 - (f.t - 1) / .4;
    ctx.globalAlpha = clamp(a, 0, 1);
    const y = f.y - f.t * 40 - 10;
    ctx.strokeText(f.text, f.x, y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, y);
  }
  ctx.globalAlpha = 1;
}

function drawOverlays() {
  if (G.hornBlast > 0) {
    ctx.strokeStyle = `rgba(255,210,63,${G.hornBlast * .8})`;
    ctx.lineWidth = 6;
    const p = proj(0, G.x);
    for (let i = 0; i < 3; i++) {
      const r = (1 - G.hornBlast + i * .25) * W * .5;
      ctx.beginPath();
      ctx.arc(p.x, p.y - p.k * .4, Math.max(1, r), 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  if (G.nitro > 0 && G.mode === 'play' && !P.settings.reduce) {
    ctx.strokeStyle = 'rgba(255,255,255,.25)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2 + G.t * 3;
      const r0 = Math.min(W, H) * .42;
      const r1 = r0 + 60 + Math.random() * 60;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r0, H * .55 + Math.sin(a) * r0);
      ctx.lineTo(cx + Math.cos(a) * r1, H * .55 + Math.sin(a) * r1);
      ctx.stroke();
    }
  }
}

function render() {
  if (!W) return;
  const pal = palette(G.tod);
  G.pal = pal;
  G.lights.length = 0;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.save();
  if (G.shake > 0 && P.settings.shake && !P.settings.reduce) {
    ctx.translate((Math.random() - .5) * G.shake * 12, (Math.random() - .5) * G.shake * 9);
  }

  drawSky(pal);
  drawCity(pal);
  drawRoad();

  // depth-sort scenery, objects and the player, far to near
  const items = [];
  for (const s of G.scen) items.push({ z: s.z, s });
  for (const o of G.objs) items.push({ z: o.z, o });
  items.push({ z: 0, pl: 1 });
  items.sort((a, b) => b.z - a.z);
  for (const it of items) {
    if (it.s) drawScenery(it.s);
    else if (it.o) drawObj(it.o);
    else drawPlayer();
  }
  drawGhost();

  // night tint (multiply) then everything that should glow through it
  const dark = (1 - pal.l) * .6;
  if (dark > .02) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = `rgba(40,30,80,${dark})`;
    ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.globalCompositeOperation = 'source-over';
  }
  drawSunDisc();
  drawCityLights(pal);
  drawLights(pal);
  drawRain();
  drawParticles();
  drawFloats();
  drawOverlays();
  ctx.restore();
}

// ===================================================================
// 7. audio — WebAudio synthesis (engine hum, horn, coin, crash…)
// ===================================================================
let AC = null;
let engine = null;
let master = null;

function audioInit() {
  if (AC || !P.settings.sound) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain();
    master.gain.value = P.settings.vol;
    master.connect(AC.destination);
  } catch {
    AC = null;
  }
}

// Two-stroke putt-putt: sawtooth through a low-pass, amplitude chopped by a square LFO.
function engineOn(on) {
  if (!AC) return;
  if (on && !P.settings.sound) return;
  if (on && !engine) {
    const osc = AC.createOscillator();
    const lfo = AC.createOscillator();
    const lfoGain = AC.createGain();
    const gain = AC.createGain();
    const filter = AC.createBiquadFilter();
    osc.type = 'sawtooth';
    osc.frequency.value = 60;
    lfo.type = 'square';
    lfo.frequency.value = 22;
    lfoGain.gain.value = .5;
    filter.type = 'lowpass';
    filter.frequency.value = 400;
    gain.gain.value = 0;
    lfo.connect(lfoGain);
    lfoGain.connect(gain.gain);
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(master);
    osc.start();
    lfo.start();
    engine = { osc, lfo, g: gain, f: filter };
    gain.gain.linearRampToValueAtTime(.07, AC.currentTime + .4);
  }
  if (!on && engine) {
    const e = engine;
    engine = null;
    e.g.gain.linearRampToValueAtTime(0, AC.currentTime + .3);
    setTimeout(() => {
      try {
        e.osc.stop();
        e.lfo.stop();
      } catch {
        /* already stopped */
      }
    }, 400);
  }
}

function engineTick() {
  if (!engine) return;
  const sp = G.speed;
  const now = AC.currentTime;
  engine.osc.frequency.setTargetAtTime(45 + sp * 2.4 + (G.nitro > 0 ? 40 : 0), now, .1);
  engine.lfo.frequency.setTargetAtTime(12 + sp * .7, now, .1);
  engine.f.frequency.setTargetAtTime(300 + sp * 14, now, .1);
}

function tone(type, f0, f1, dur, vol = .2, when = 0) {
  const o = AC.createOscillator();
  const g = AC.createGain();
  const t0 = AC.currentTime + when;
  o.type = type;
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + .01);
  g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
  o.connect(g);
  g.connect(master);
  o.start(t0);
  o.stop(t0 + dur + .02);
}

function noise(dur, vol, cutoff) {
  const n = Math.floor(AC.sampleRate * dur);
  const buffer = AC.createBuffer(1, n, AC.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < n; i++) {
    data[i] = (Math.random() * 2 - 1) * (1 - i / n);
  }
  const src = AC.createBufferSource();
  const g = AC.createGain();
  const filter = AC.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = cutoff;
  src.buffer = buffer;
  g.gain.value = vol;
  src.connect(filter);
  filter.connect(g);
  g.connect(master);
  src.start();
}

function sfx(name, v = 1) {
  if (!AC || !P.settings.sound) return;
  switch (name) {
    case 'coin':
      tone('sine', 880, 1320, .09, .15 * v);
      tone('sine', 1320, 1760, .1, .1 * v, .07);
      break;
    case 'pick':
      tone('triangle', 520, 900, .18, .18 * v);
      break;
    case 'fare':
      tone('sine', 660, 660, .1, .15 * v);
      tone('sine', 880, 880, .1, .15 * v, .1);
      tone('sine', 1100, 1100, .18, .15 * v, .2);
      break;
    case 'horn':
      tone('square', 420, 410, .35, .12 * v);
      tone('square', 530, 520, .35, .1 * v);
      break;
    case 'nitro':
      tone('sawtooth', 180, 900, .5, .14 * v);
      break;
    case 'whoosh':
      noise(.25, .25 * v, 1800);
      break;
    case 'bump':
      tone('sine', 120, 60, .18, .3 * v);
      break;
    case 'crash':
      noise(.6, .7 * v, 900);
      tone('sine', 90, 30, .5, .5 * v);
      break;
    case 'sputter':
      tone('sawtooth', 90, 30, 1.2, .15 * v);
      break;
  }
}

// ===================================================================
// 8. HUD — DOM overlay, updated only when a value changes
// ===================================================================
const HUD = {};
function resetHUD() {
  for (const k in HUD) delete HUD[k];
}

function hudSet(key, val, apply) {
  if (HUD[key] === val) return;
  HUD[key] = val;
  apply(val);
}

function activePowerups() {
  const list = [];
  if (G.nitro > 0) list.push(['nitro', 'flame', '#ff2e88', G.nitro / 3]);
  if (G.shield > 0) list.push(['shield', 'shield', '#2ed3f0', G.shield / UPG.shield.vals[P.up.shield]]);
  if (G.hornBlast > 0) list.push(['horn', 'horn', '#ffd23f', G.hornBlast]);
  return list;
}

function updateHUD() {
  if (G.mode === 'attract') return;
  hudSet('score', Math.round(G.score), v => { $('#hScore').textContent = nf.format(v); });
  hudSet('dist', Math.round(G.dist), v => { $('#hDist').textContent = nf.format(v); });
  hudSet('speed', Math.round(G.speed * 3.6), v => { $('#hSpeed').textContent = v; });
  hudSet('coins', G.coins, v => { $('#hCoins').innerHTML = ic('coins') + v; });
  hudSet('fares', G.fareRs, v => { $('#hFares').innerHTML = ic('wallet') + 'Rs ' + nf.format(v); });
  hudSet('pax', G.pax.length, v => { $('#hPax').innerHTML = ic('users') + v + '/3'; });
  hudSet('fuel', Math.round(G.fuel / G.fuelMax * 100), v => {
    $('#hFuel').style.width = v + '%';
    $('#hFuelBox').classList.toggle('low', v < 25 && !G.practice);
  });
  hudSet('mult', `${mult()}|${G.combo}`, () => {
    $('#hMult').textContent = '×' + mult();
    $('#hCombo .lab').textContent = t('combo') + (G.combo ? ' ' + G.combo : '');
  });
  hudSet('near', G.nearT > 0, v => {
    $('#hNear').textContent = t('nearMiss') + '!';
    $('#hNear').classList.toggle('on', v);
  });
  hudSet('mode', G.practice ? 'practice' : G.daily ? 'daily' : '', v => {
    const el = $('#hMode');
    el.classList.toggle('hidden', !v);
    el.classList.toggle('practice', v === 'practice');
    el.textContent = v === 'practice' ? t('practice') : t('dailyTab');
  });

  const pws = activePowerups();
  hudSet('pwKeys', pws.map(p => p[0]).join(), () => {
    $('#hPw').innerHTML = pws.map(p => `<div class="pill" style="--c:${p[2]}" data-pw="${p[0]}">${ic(p[1])}<div class="bar"><i></i></div></div>`).join('');
  });
  for (const p of pws) {
    const bar = $(`#hPw [data-pw=${p[0]}] i`);
    if (bar) bar.style.width = Math.round(p[3] * 100) + '%';
  }
  hudSet('hint', G.hintT > 0, v => {
    $('#hint').classList.remove('hidden');
    $('#hint').style.opacity = v ? 1 : 0;
  });
}

// ---------- garage ----------
function upgradeRow(id, u) {
  const lv = P.up[id];
  const maxed = lv >= 5;
  const cost = UPG_COST[lv];
  const name = lang === 'ur' ? u.ur : u.en;
  const desc = lang === 'ur' ? u.dur : u.den;
  const nextVal = maxed ? '' : ' → ' + u.fmt(u.vals[lv + 1]);
  const segs = [0, 1, 2, 3, 4].map(i => `<i class="${i < lv ? 'on' : ''}"></i>`).join('');

    <div class="uic">${ic(u.icon)}</div>
    <div><div class="nm">${name} <span class="ds">· ${desc}: ${u.fmt(u.vals[lv])}${nextVal}</span></div><div class="segs">${segs}</div></div>
    <button class="btn sm ${canBuy ? '' : 'ghost'}" data-buy="${id}" ${canBuy ? '' : 'disabled'}>${label}</button>
  </div>`;
}

function skinCard(s, i) {
  const owned = P.skins.includes(s.id);
  const sel = P.skin === s.id;
  let status = t('select');
  if (sel) status = t('selected');
  else if (!owned) status = s.unlock.dist ? t('unlockDist', km(s.unlock.dist)) : t('unlockCoins', s.unlock.coins);
  return `<button class="skin card ${sel ? 'sel' : ''} ${owned ? '' : 'locked'}" data-skin="${s.id}" style="--i:${i}" aria-label="${esc(s.en)}">
    <canvas width="240" height="220" data-prev="${s.id}"></canvas>
    ${owned ? '' : `<span class="lk">${ic('lock')}</span>`}
    <span class="nm">${lang === 'ur' ? s.ur : s.en}</span><span class="st">${status}</span>
  </button>`;
}

function paintSkinPreview(cv) {
  const c2 = cv.getContext('2d');
  const s = skinOf(cv.dataset.prev);
  const g = c2.createLinearGradient(0, 0, 0, 220);
  g.addColorStop(0, '#2b1055');
  g.addColorStop(.6, '#8e2d7c');
  g.addColorStop(1, '#ff7a3d');
  c2.fillStyle = g;
  c2.fillRect(0, 0, 240, 220);
  c2.fillStyle = '#45454f';
  c2.fillRect(0, 150, 240, 70);
  c2.fillStyle = 'rgba(0,0,0,.35)';
  c2.beginPath();
  c2.ellipse(120, 200, 70, 10, 0, 0, Math.PI * 2);
  c2.fill();
  drawRickshaw(c2, 120, 200, 215, s, 0, { pax: 1 });
}

function buyUpgrade(id) {
  const cost = UPG_COST[P.up[id]];
  if (P.coins < cost) return toast(t('notEnough'), 'bad', 'coins');
  P.coins -= cost;
  P.up[id]++;
  if (P.up[id] >= 5) unlockAch('maxup');
  saveP();
  toast(t('bought'), 'ok', 'check-circle');
  renderGarage();
}

function chooseSkin(id) {
  const s = skinOf(id);
  if (!P.skins.includes(s.id)) {
    if (!s.unlock.coins) return toast(t('unlockDist', km(s.unlock.dist)), '', 'lock');
    if (P.coins < s.unlock.coins) return toast(t('notEnough'), 'bad', 'coins');
    P.coins -= s.unlock.coins;
    P.skins.push(s.id);
    notify({ type: 'skin', icon: 'palette', title: t('skinBought'), body: lang === 'ur' ? s.ur : s.en, toastType: 'ok' });
    if (P.skins.length === SKINS.length) unlockAch('skins');
  }
  P.skin = s.id;
  saveP();
  renderGarage();
}

function importBackup(file) {
  if (!file) return;
  file.text().then(txt => {
    const j = JSON.parse(txt);
    if (!j.profile) throw new Error('no profile');
    store.set('profile', j.profile);
    store.set('board', j.board || []);
    store.set('boardDaily', j.boardDaily || []);
    store.set('runs', j.runs || []);
    store.set('inbox', j.inbox || []);
    if (j.goals) store.set('goals', j.goals);
    store.set('daily', j.daily || {});
    if (j.ghost) store.set('ghost', j.ghost);
    toast(t('imported'), 'ok', 'check-circle');
    setTimeout(() => location.reload(), 600);
  }).catch(() => toast(t('badFile'), 'bad', 'alert'));

// ---------- game over ----------
function qualifies(score, list) {
  return score > 0 && (list.length < 10 || score > list[list.length - 1].s);
}

function saveInitials(form, score, list) {
  const raw = $('#iniIn').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  const n = (raw || 'YOU').slice(0, 3);
  store.set('ini', n);
  list.forEach(r => delete r.me);
  list.push({ n, s: score, d: Math.round(G.dist), f: G.fares, date: todayStr(), me: true, seed: undefined });
  list.sort((a, b) => b.s - a.s);
  list.length = Math.min(10, list.length);
  store.set(G.daily ? 'boardDaily' : 'board', list);
  form.innerHTML = `<span class="record">${ic('trophy')}${n}</span>`;
  toast(t('save'), 'ok', 'trophy');
}

function showOver(score, earned) {
  const list = G.daily ? BOARD_D : BOARD;
  const q = !G.practice && qualifies(score, list);
  const rec = !G.practice && score >= P.stats.bestScore && score > 0;
  let reason = `${ic('droplet')}<span>${t('nofuel')}</span>`;
  if (G.over.reason === 'crash') {
    const name = NAMES[G.over.type] || [G.over.type, G.over.type];
    reason = `${ic('alert')}<span>${t('crashed')} ${lang === 'ur' ? name[1] : name[0]}</span>`;
  }
  if (G.practice) reason = `${ic('eye')}<span>${t('practiceOver')}</span>`;

  const stats = [
    [t('score'), score, 'trophy'],
    [t('distance'), Math.round(G.dist), 'flag', v => km(v)],
    [t('fares'), G.fareRs, 'wallet', v => 'Rs ' + nf.format(Math.round(v))],
    [t('earned'), earned, 'coins', v => '+' + nf.format(Math.round(v))],
    [t('near'), G.near, 'zap'],
    [t('bestCombo'), G.bestCombo, 'flame', v => '×' + Math.round(v)],
  ];
  const tiles = stats.map(([k, , icon], idx) => `<div class="kpi tile"><div class="k">${ic(icon)} ${k}</div><div class="v" id="ov${idx}">0</div></div>`).join('');
  const iniForm = q ? `<form id="iniForm" class="rowc" style="justify-content:center;margin-bottom:12px">
      <label for="iniIn" class="muted" style="width:100%;text-align:center;font-size:.85rem">${t('initials')}</label>
      <input type="text" id="iniIn" class="ini-in" maxlength="3" value="${esc(store.get('ini', 'YOU'))}" autocomplete="off" aria-label="${t('initials')}">
      <button class="btn cyan sm" type="submit">${ic('check')}${t('save')}</button></form>` : '';
  const sub = G.daily ? ' · ' + t('dailyTab') : G.practice ? ' · ' + t('practice') : '';

  $('#overBody').innerHTML = `<div class="head"><h2 id="overTitle">${t('over')}${sub}</h2>${rec ? `<span class="record">${ic('sparkles')}${t('newrecord')}</span>` : ''}</div><div class="chamak"></div>
    <div class="reason">${reason}</div>
    <div class="over-stats stagger">${tiles}</div>
    ${iniForm}
    <div class="stack">
      <button class="btn big pink wide" id="btnRetry">${ic('refresh')}${t('retry')}</button>
      <div class="menu-grid"><a class="btn ghost" href="#garage">${ic('rickshaw')}${t('garage')}</a><a class="btn ghost" href="#menu">${ic('home')}${t('quit')}</a></div>
    </div>`;
  stats.forEach(([, v, , f], idx) => countUp($('#ov' + idx), v, f ? { fmt: f } : {}));
  $('#btnRetry').onclick = () => startRun(G.daily, G.practice);
  const form = $('#iniForm');
  if (form) {
    form.onsubmit = e => {
      e.preventDefault();
      saveInitials(form, score, list);
    };
  }
  $('#s-over').classList.add('on');
  animateIn($('#s-over .panel'));
}

function finishRun() {
  G.overShown = true;
  $('#hint').classList.add('hidden');
  const score = Math.round(G.score);
  const earned = G.coins + Math.floor(G.fareRs / 25);
  if (G.practice) return showOver(score, 0);

  const s = P.stats;
  const previousBest = s.bestScore;
  s.runs++;
  s.dist += G.dist;
  s.bestDist = Math.max(s.bestDist, G.dist);
  s.bestScore = Math.max(s.bestScore, score);
  s.bestCombo = Math.max(s.bestCombo, G.bestCombo);
  s.fares += G.fares;
  s.coins += earned;
  s.near += G.near;
  s.rainDist += G.rainDist;
  s.honks += G.honks;
  s.powerups += G.powerups;
  s.smashes += G.smashes;
  s.time += G.t;
  if (G.nightDone) s.nights++;
  P.coins += earned;

  if (G.daily) {
    s.dailies++;
    const d = store.get('daily', {});
    const rec = d[todayStr()] || { best: 0, plays: 0 };
    rec.plays++;
    rec.best = Math.max(rec.best, score);
    d[todayStr()] = rec;
    store.set('daily', d);
    saveGhostIfBest(score);
    if (s.dailies >= 3) unlockAch('daily3');
  }
  if (G.dist >= 5000) unlockAch('km5');
  if (s.coins >= 1000) unlockAch('rich');
  if (G.fares > 0) unlockAch('first_fare');
  if (G.nightDone) unlockAch('night');
  if (s.rainDist >= 1000) unlockAch('rain');
  if (score > previousBest && previousBest > 0) notify({ type: 'record', icon: 'sparkles', title: t('nRecordT'), body: t('nRecordB', nf.format(score)), silent: true });

  saveP();
  checkSkinUnlocks();
  logRun(score, earned);
  updateGoals(runSummary());
  showOver(score, earned);
}

function ensureInbox() {
  if (INBOX) return;
  INBOX = [{ id: uid(), ts: Date.now() - 3600000, type: 'system', icon: 'rickshaw', title: t('nWelcomeT'), body: t('nWelcomeB'), read: false }];
  store.set('inbox', INBOX);
}

function unreadCount() {
  return INBOX.filter(m => !m.read).length;
}

function updateInboxBadge() {
  const n = unreadCount();
  const badge = $('#inboxBadge');
  badge.textContent = n > 9 ? '9+' : String(n);
  badge.classList.toggle('hidden', n === 0);
}

// Add a message to the inbox (persisted, capped at 60) and show it as a toast unless silent.
function notify({ type, icon = 'info', title, body = '', toastType = '', silent = false, key = null }) {
  ensureInbox();
  if (key && INBOX.some(m => m.key === key)) return;
  INBOX.unshift({ id: uid(), ts: Date.now(), type, icon, title, body, read: false, key });
  if (INBOX.length > 60) INBOX.length = 60;
  store.set('inbox', INBOX);
  updateInboxBadge();
  if (!silent) toast(body ? `${title}: ${body}` : title, toastType, icon);
}

// Once per day: remind the player that a fresh seeded run is available.
function ensureDailyNotice() {
  const key = 'daily-' + todayStr();
  notify({ type: 'daily', icon: 'calendar', title: t('nDailyT'), body: t('nDailyB', dailySeedCode()), silent: true, key });
}

function timeAgo(ts) {
  const diff = Math.max(0, Date.now() - ts);
  const min = Math.round(diff / 60000);
  if (min < 1) return t('justNow');
  if (min < 60) return t('minAgo', min);
  const hr = Math.round(min / 60);
  if (hr < 24) return t('hrAgo', hr);
  return t('dayAgo', Math.round(hr / 24));
}

function inboxTarget(type) {
  return { ach: '#board', skin: '#garage', record: '#board', goal: '#goals', daily: '#daily', trip: '#trips' }[type] || null;
}

function renderInbox() {
  ensureInbox();
  const n = unreadCount();
  const extra = `<span class="pillmode">${n} ${t('unread')}</span>`;
  const rows = INBOX.map(m => `<button class="msg ${m.read ? '' : 'unread'}" data-msg="${m.id}">
      <span class="mic">${ic(m.icon)}</span>
      <span><span class="t">${esc(m.title)}${m.read ? '' : '<span class="dot"></span>'}</span><br><span class="b">${esc(m.body)}</span></span>
      <span class="when">${timeAgo(m.ts)}</span>
    </button>`).join('');
  $('#inboxBody').innerHTML = `${head(t('inbox'), extra)}<p class="lead">${t('inboxLead')}</p>
    <div class="rowc" style="margin:12px 0">
      <button class="btn ghost sm" id="inboxRead" ${n ? '' : 'disabled'}>${ic('check')}${t('markRead')}</button>

}

// Three goals are picked deterministically from the date so everyone sees the same set.
function goalsState() {
  const today = todayStr();
  let st = store.get('goals', null);
  if (st && st.date === today) return st;
  const r = rng(hash('goals-' + today));
  const pool = GOAL_POOL.map(g => g.id);
  const ids = [];
  while (ids.length < 3) {
    const pick = pool[Math.floor(r() * pool.length)];
    if (!ids.includes(pick)) ids.push(pick);
  }
  st = { date: today, ids, prog: [0, 0, 0], done: [false, false, false] };
  store.set('goals', st);
  return st;
}

const goalDef = id => GOAL_POOL.find(g => g.id === id);

function goalProgressText(g, value) {
  if (g.metric === 'dist' || g.metric === 'rainDist') return `${km(Math.min(value, g.target))} / ${km(g.target)}`;
  return `${Math.min(value, g.target)} / ${g.target}`;
}

// Per-run summary used by goals and the trip log.
function runSummary() {
  return {
    fares: G.fares, coins: G.coins, near: G.near, dist: G.dist, combo: G.bestCombo, powerups: G.powerups,
    honks: G.honks, dailyRuns: G.daily ? 1 : 0, runs: 1, rainDist: G.rainDist, smashes: G.smashes,
  };
}

function updateGoals(summary) {
  const st = goalsState();
  let changed = false;
  st.ids.forEach((id, i) => {
    const g = goalDef(id);
    const value = summary[g.metric] || 0;
    const next = g.scope === 'run' ? Math.max(st.prog[i], value) : st.prog[i] + value;
    if (next !== st.prog[i]) changed = true;
    st.prog[i] = next;
    if (!st.done[i] && next >= g.target) {
      st.done[i] = true;
      P.coins += g.reward;
      saveP();
      notify({ type: 'goal', icon: g.icon, title: t('nGoalT'), body: `${t('g_' + id)} · +${g.reward}`, toastType: 'ok' });
    }
  });
  if (changed) store.set('goals', st);
}

function renderGoalStrip() {
  const st = goalsState();
  $('#menuGoals').innerHTML = st.ids.map((id, i) => {
    const g = goalDef(id);
    const pct = clamp(st.prog[i] / g.target * 100, 0, 100);
    return `<div class="g ${st.done[i] ? 'done' : ''}">

}

      <div class="rw">${ic('coins')} ${g.reward}</div>
