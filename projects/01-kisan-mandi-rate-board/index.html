    } }));
  allBuyers().filter(b => b.en.toLowerCase().includes(ql) || b.ur.includes(q)).slice(0, 4)
    .forEach(b => out.push({ grp: 'by_title', icon: 'users', label: name(b), sub: name(MM[b.m]), go: () => {
      location.hash = 'buyers?m=' + b.m;
    } }));
  ALL_NAV.filter(([, k]) => t(k).toLowerCase().includes(ql)).slice(0, 4)
    .forEach(([id, k, i]) => out.push({ grp: 'q_pages', icon: i, label: t(k), sub: '#' + id, go: () => {
      location.hash = id;
    } }));
  return out;
}
function renderSearch(q) {
  const box = $('#qres');
  if (!q.trim()) {
    box.classList.remove('open');
    box.innerHTML = '';
    qRes = [];
    return;
  }
  qRes = searchResults(q.trim());
  if (!qRes.length) {
    box.innerHTML = `<div class="grp">${t('q_none')}</div>`;
    box.classList.add('open');
    return;
  }
  let html = '';
  let lastGrp = '';
  qRes.forEach((r, i) => {
    if (r.grp !== lastGrp) {
      html += `<div class="grp">${t(r.grp)}</div>`;
      lastGrp = r.grp;
    }
    html += `<button data-qi="${i}" class="${i === qSel ? 'sel' : ''}" role="option">${ic(r.icon)}<span><b>${esc(r.label)}</b> <span class="muted tiny">${esc(r.sub)}</span></span></button>`;
  });
  box.innerHTML = html;
  box.classList.add('open');
  $$('[data-qi]', box).forEach(b => (b.onmousedown = e => {
    e.preventDefault();
    pickSearch(qRes[+b.dataset.qi]);
  }));
}
function pickSearch(r) {
  if (!r) return;
  $('#qres').classList.remove('open');
  $('#q').blur();
  r.go();
}
$('#q').addEventListener('input', e => {
  state.q = e.target.value;
  qSel = 0;
  renderSearch(state.q);
  if (currentPage() !== 'rates' && state.q) location.hash = 'rates';
  else if (currentPage() === 'rates') renderRates();
});
$('#q').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    qSel = clamp(qSel + (e.key === 'ArrowDown' ? 1 : -1), 0, Math.max(0, qRes.length - 1));
    renderSearch(state.q);
  } else if (e.key === 'Enter') pickSearch(qRes[qSel]);
  else if (e.key === 'Escape') {
    e.target.value = '';
    state.q = '';
    renderSearch('');
    e.target.blur();
    if (currentPage() === 'rates') renderRates();
  }
});
$('#q').addEventListener('focus', () => renderSearch(state.q));
$('#q').addEventListener('blur', () => setTimeout(() => $('#qres').classList.remove('open'), 150));

// ---------- keyboard shortcuts ----------
const SHORTCUTS = [
  ['/', 'k_search'], ['?', 'k_help'], ['Esc', 'k_close'], ['l', 'k_lang'], ['t', 'k_view'],
  ['r', 'nav_rates'], ['a', 'nav_advisor'], ['c', 'nav_calc'], ['m', 'nav_map'], ['h', 'nav_analytics'],
  ['p', 'nav_portfolio'], ['b', 'nav_buyers'], ['n', 'nav_inbox'], ['s', 'nav_settings']
];
const KEY_ROUTES = { r: 'rates', a: 'advisor', c: 'calculator', m: 'map', h: 'analytics', p: 'portfolio', b: 'buyers', n: 'inbox', s: 'settings' };
function showShortcuts() {
  openModal(`<h2>${ic('hash')}${t('st_shortcuts')}</h2><p class="muted small">${t('k_lead')}</p>
    <div class="keys">${SHORTCUTS.map(([k, lb]) => `<kbd>${k}</kbd><span>${t(lb)}</span>`).join('')}</div>
    <div class="actions"><button class="btn wheat" id="mCancel">${t('close')}</button></div>`);
  $('#mCancel').onclick = closeModal;
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeDrawer();
    closeModal();
    closeMore();
    document.body.classList.remove('filters-open');
    if (document.body.classList.contains('tour-on')) endTour();
    return;
  }
  const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.target.isContentEditable;
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === '/') {
    e.preventDefault();
    $('#q').focus();
  } else if (e.key === '?') showShortcuts();
  else if (e.key === 'l') toggleLang();
  else if (e.key === 't' && currentPage() === 'rates') {
    state.view = state.view === 'cards' ? 'table' : 'cards';
    saveFilters();
    renderSidebar();
    renderRates();
  } else if (KEY_ROUTES[e.key]) location.hash = KEY_ROUTES[e.key];
});

// ---------- sidebar / nav / router ----------
function renderSidebar() {
  $('#catChips').innerHTML = CATS.map(c => `<button class="chip ${state.cat === c ? 'on' : ''}" data-cat="${c}">${t('cat_' + c)}</button>`).join('');
  $('#regionChips').innerHTML = REGIONS.map(r => `<button class="chip wheat ${state.region === r ? 'on' : ''}" data-region="${r}">${r === 'all' ? t('region_all') : t(r)}</button>`).join('');
  $('#unitSeg').innerHTML = Object.keys(UNITS).map(u => `<button class="${state.unit === u ? 'on' : ''}" data-unit="${u}">${t(u)}</button>`).join('');
  $('#sortSeg').innerHTML = ['name', 'price', 'change'].map(s => `<button class="${state.sort === s ? 'on' : ''}" data-sort="${s}">${t('sort_' + s)}</button>`).join('');
  $('#viewSeg').innerHTML = ['cards', 'table'].map(v => `<button class="${state.view === v ? 'on' : ''}" data-view="${v}">${t('view_' + v)}</button>`).join('');
  $$('#sidebar [data-cat],#sidebar [data-region],#sidebar [data-unit],#sidebar [data-sort],#sidebar [data-view]').forEach(b => (b.onclick = () => {
    const [k, v] = Object.entries(b.dataset)[0];
    state[k] = v;
    saveFilters();
    renderSidebar();
    route();
    if (window.innerWidth <= 980 && (k === 'cat' || k === 'region')) document.body.classList.remove('filters-open');
  }));
}

const NAV_PRIMARY = [['rates', 'nav_rates', 'grid'], ['advisor', 'nav_advisor', 'shuffle'], ['calculator', 'nav_calc', 'calculator'], ['map', 'nav_map', 'map'], ['analytics', 'nav_analytics', 'bar-chart']];
const NAV_MORE = [['portfolio', 'nav_portfolio', 'wallet'], ['buyers', 'nav_buyers', 'users'], ['sheet', 'nav_sheet', 'printer'], ['alerts', 'nav_alerts', 'bell'], ['contribute', 'nav_contribute', 'edit'], ['inbox', 'nav_inbox', 'message'], ['settings', 'nav_settings', 'settings'], ['about', 'nav_about', 'info']];
const ALL_NAV = [...NAV_PRIMARY, ...NAV_MORE];
const NAV_MOBILE = ['rates', 'advisor', 'map', 'inbox'];
const ROUTES = {
  rates: renderRates, advisor: renderAdvisor, calculator: renderCalculator, map: renderMap, analytics: renderAnalytics,
  portfolio: renderPortfolio, buyers: renderBuyers, sheet: renderSheet, alerts: renderAlerts, contribute: renderContribute,
  inbox: renderInbox, settings: renderSettings, about: renderAbout
};

function renderNav() {
  const cur = currentPage();
  const badge = id => (id === 'inbox' ? '<span class="badgeN zero">0</span>' : '');
  const link = ([id, k, i]) => `<a href="#${id}" class="${cur === id ? 'active' : ''}">${ic(i)} ${t(k)}${badge(id)}</a>`;
  const moreActive = NAV_MORE.some(([id]) => id === cur);
  $('#topnav').innerHTML = NAV_PRIMARY.map(link).join('') +
    `<div class="morewrap" id="moreWrap"><button id="moreBtn" class="${moreActive ? 'active' : ''}" aria-haspopup="true" aria-expanded="false">${ic('more')} ${t('nav_more')} ${ic('chevron-down')}</button><div class="moremenu">${NAV_MORE.map(link).join('')}</div></div>`;
  const mobile = ALL_NAV.filter(([id]) => NAV_MOBILE.includes(id));
  $('#bottomnav').innerHTML = mobile.map(([id, k, i]) => `<a href="#${id}" class="${cur === id ? 'active' : ''}"><span>${ic(i)}</span>${t(k)}${badge(id)}</a>`).join('') +
    `<a href="#more" id="moreMobile" class="${NAV_MOBILE.includes(cur) ? '' : 'active'}"><span>${ic('menu')}</span>${t('nav_more')}</a>`;
  $('#moreSheet').innerHTML = `<div class="sect">${ic('menu')}${t('nav_all')}</div><div class="tiles">${ALL_NAV.map(([id, k, i]) => `<a href="#${id}" class="${cur === id ? 'active' : ''}">${ic(i)}${t(k)}</a>`).join('')}</div>`;
  $('#moreBtn').onclick = e => {
    e.stopPropagation();
    toggleMore();
  };
  $('#moreMobile').onclick = e => {
    e.preventDefault();
    document.body.classList.toggle('more-open');
  };
  updateBadges();
}
function toggleMore(force) {
  const w = $('#moreWrap');
  if (!w) return;
  const open = force ?? !w.classList.contains('open');
  w.classList.toggle('open', open);
  $('#moreBtn').setAttribute('aria-expanded', String(open));
}
function closeMore() {
  toggleMore(false);
  document.body.classList.remove('more-open');
}
document.addEventListener('click', e => {
  if (!e.target.closest('#moreWrap')) toggleMore(false);
});

function route() {
  const page = currentPage();
  document.body.dataset.page = ROUTES[page] ? page : 'rates';
  closeDrawer();
  closeMore();
  closeModal();
  if (document.body.classList.contains('tour-on') && page !== 'rates') endTour();
  renderNav();
  (ROUTES[page] || renderRates)();
  animateIn(view);
  window.scrollTo({ top: 0 });
}

function applyTheme() {
  document.documentElement.dataset.theme = settings.theme;
}
function applyLang() {
  document.documentElement.lang = lang;
  store.set('lang', lang);
  $$('[data-i18n]').forEach(el => (el.textContent = t(el.dataset.i18n)));
  $$('[data-i18n-ph]').forEach(el => (el.placeholder = t(el.dataset.i18nPh)));
  $('#langBtn').textContent = lang === 'en' ? 'اردو' : 'English';
  $('#dateBadge').textContent = today.toLocaleDateString(lang === 'ur' ? 'ur-PK' : 'en-PK', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  renderSidebar();
  route();
  // TODO(student): full RTL layout for Urdu — set dir="rtl" here and switch the CSS to logical properties (margin-inline, inset-inline).
}
const toggleLang = () => {
  lang = lang === 'en' ? 'ur' : 'en';
  applyLang();
};
$('#langBtn').onclick = toggleLang;
$('#filterBtn').onclick = () => document.body.classList.toggle('filters-open');
$('#bellBtn').onclick = () => {
  location.hash = 'inbox';
};
window.addEventListener('hashchange', route);

// ---------- init ----------
// TODO(student): offline PWA — add manifest.json and register a service worker here (navigator.serviceWorker.register('sw.js')) so the board installs and opens without network.
applyTheme();
ensureDemoData();
const lastSync = store.get('lastSync');
if (!lastSync || dayKey(new Date(lastSync.ts)) !== dayKey(today)) store.set('lastSync', { ts: Date.now(), source: 'simulated' });
syncNotifications();
applyLang();
checkAlertsOnLoad();
if (!store.get('tourDone') && currentPage() === 'rates') setTimeout(startTour, 900);
</script>
