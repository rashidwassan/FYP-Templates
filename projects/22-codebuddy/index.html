  notExpr() {
    if (this.py && this.isKw('not')) {
      const t = this.next();
      return { k: 'unary', op: 'not', e: this.notExpr(), line: t.line };
    }
    return this.compare();
  },

  compareOp() {
    const c = this.cur;
    if (c.t === 'op' && COMPARE_OPS.has(c.v)) return this.next().v;
    if (!this.py) return null;
    if (this.isKw('in')) return this.next().v;
    if (this.isKw('not') && this.peek().t === 'kw' && this.peek().v === 'in') {
      this.next();
      this.next();
      return 'not in';
    }
    if (this.isKw('is')) {
      this.next();
      return this.isKw('not') ? (this.next(), '!=') : '==';
    }
    return null;
  },

  // Python chains a < b < c into (a < b) and (b < c).
  compare() {
    const first = this.additive();
    let left = first;
    let result = null;
    for (let op = this.compareOp(); op; op = this.compareOp()) {
      const right = this.additive();
      const cmp = { k: 'bin', op, l: left, r: right, line: first.line };
      result = result ? { k: 'logic', op: 'and', l: result, r: cmp, line: first.line } : cmp;
      left = right;
    }
    return result || first;
  },

  additive() {
    let l = this.multiplicative();
    while (this.is('+') || this.is('-')) {
      const op = this.next().v;
      l = { k: 'bin', op, l, r: this.multiplicative(), line: l.line };
    }
    return l;
  },

  multiplicative() {
    let l = this.unary();
    while (this.is('*') || this.is('/') || this.is('%') || (this.py && this.is('//'))) {
      const op = this.next().v;
      l = { k: 'bin', op, l, r: this.unary(), line: l.line };
    }
    return l;
  },

  unary() {
    const t = this.cur;
    if (this.is('-') || this.is('+')) {
      this.next();
      return { k: 'unary', op: t.v, e: this.unary(), line: t.line };
    }
    if (!this.py && this.is('!')) {
      this.next();
      return { k: 'unary', op: 'not', e: this.unary(), line: t.line };
    }
    if (!this.py && this.isKw('typeof')) {
      this.next();
      return { k: 'unary', op: 'typeof', e: this.unary(), line: t.line };
    }
    if (!this.py && (this.is('++') || this.is('--'))) {
      this.next();
      const target = this.unary();
      this.checkTarget(target, t);
      return { k: 'update', op: t.v, target, prefix: true, line: t.line };
    }
    return this.power();
  },

  power() {
    const base = this.postfix();
    if (!this.is('**')) return base;
    this.next();
    return { k: 'bin', op: '**', l: base, r: this.unary(), line: base.line };
  },

  postfix() {
    let e = this.atom();
    for (;;) {
      const t = this.cur;
      if (this.is('(')) {
        this.next();
        const { args, kw } = this.callArgs(t);
        e = { k: 'call', fn: e, args, kw, line: t.line };
      } else if (this.is('.')) {
        this.next();
        if (this.cur.t !== 'name' && this.cur.t !== 'kw') throw this.err(this.unexpectedMsg());
        e = { k: 'member', obj: e, prop: this.next().v, line: t.line };
      } else if (this.is('[')) {
        this.next();
        e = this.indexOrSlice(e, t);
      } else if (!this.py && (this.is('++') || this.is('--')) && !t.nlBefore) {
        this.next();
        this.checkTarget(e, t);
        e = { k: 'update', op: t.v, target: e, prefix: false, line: t.line };
      } else {
        return e;
      }
    }
  },

  callArgs(open) {
    const args = [];
    const kw = {};
    while (!this.is(')')) {
      if (this.cur.t === 'eof') throw this.unclosed(open);
      if (this.is('...')) throw unsupported('Spread arguments (...)', open.line, this.lang);
      if (this.py && this.cur.t === 'name' && this.peek().v === '=' && this.peek().t === 'op') {
        const n = this.next().v;
        this.next();
        kw[n] = this.expr();
      } else {
        args.push(this.expr());
      }
      if (!this.eat(',')) break;
    }
    if (!this.is(')')) throw this.missingClose(open);
    this.next();
    return { args, kw };
  },

  unclosed(open) {
    if (this.py) return this.err(`'${open.v}' was never closed`, open);
    return this.err(open.v === '(' ? 'missing ) after argument list' : 'Unexpected end of input', this.cur);
  },

  // A token on a later line usually means the bracket was never closed.
  missingClose(open) {
    if (this.cur.t === 'eof' || this.cur.line > this.prev().line) return this.unclosed(open);
    if (this.py) return this.err('invalid syntax. Perhaps you forgot a comma?');
    return this.err(open.v === '(' ? 'missing ) after argument list' : this.unexpectedMsg());
  },

  indexOrSlice(obj, open) {
    let lo = null;
    if (!this.is(':')) lo = this.expr();
    if (this.py && this.eat(':')) {
      const hi = this.is(']') ? null : this.expr();
      if (!this.is(']')) throw this.missingClose(open);
      this.next();
      return { k: 'slice', obj, lo, hi, line: open.line };
    }
    if (!this.is(']')) throw this.missingClose(open);
    this.next();
    return { k: 'index', obj, idx: lo, line: open.line };
  },

  atom() {
    const t = this.cur;
    const line = t.line;
    if (t.t === 'num') {
      this.next();
      const v = Number(t.v.replace(/_/g, ''));
      return { k: 'num', v, float: this.py && /[.eE]/.test(t.v), line };
    }
    if (t.t === 'str') {
      this.next();
      let v = stringValue(t);
      while (this.cur.t === 'str') v += stringValue(this.next());
      return { k: 'str', v, line };
    }
    if (t.t === 'fstr' || t.t === 'tpl') {
      this.next();
      return { k: 'tpl', parts: this.templateParts(t), line };
    }
    if (t.t === 'kw') return this.keywordAtom(t);
    if (t.t === 'name') {
      this.next();
      if (!this.py && this.is('=>')) throw unsupported('Arrow functions (=>)', line, 'js');
      return { k: 'name', id: t.v, line };
    }
    if (this.is('(')) return this.parenAtom(t);
    if (this.is('[')) return this.listAtom(t);
    if (this.is('{')) return this.dictAtom(t);
    throw this.err(this.unexpectedMsg());
  },

  keywordAtom(t) {
    const consts = this.py ? { True: true, False: false } : { true: true, false: false };
    this.next();
    if (t.v in consts) return { k: 'bool', v: consts[t.v], line: t.line };
    if (t.v === 'None' || t.v === 'null') return { k: 'none', line: t.line };
    if (t.v === 'undefined') return { k: 'undef', line: t.line };
    if (t.v === 'function') throw unsupported('Function expressions', t.line, this.lang);
    if (t.v === 'lambda') throw unsupported("'lambda'", t.line, this.lang);
    this.i--;
    throw this.err(this.unexpectedMsg());
  },

  parenAtom(open) {
    this.next();
    if (!this.py && this.is(')') && this.peek().v === '=>') throw unsupported('Arrow functions (=>)', open.line, 'js');
    const e = this.expr();
    if (this.is(',')) throw unsupported(this.py ? 'Tuples' : 'The comma operator', open.line, this.lang);
    if (!this.is(')')) throw this.missingClose(open);
    this.next();
    if (!this.py && this.is('=>')) throw unsupported('Arrow functions (=>)', open.line, 'js');
    return e;
  },

  listAtom(open) {
    this.next();
    const items = [];
    while (!this.is(']')) {
      if (this.cur.t === 'eof') throw this.unclosed(open);
      items.push(this.expr());
      if (this.py && this.isKw('for')) throw unsupported('List comprehensions', open.line, 'py');
      if (!this.eat(',')) break;
    }
    if (!this.is(']')) throw this.missingClose(open);
    this.next();
    return { k: 'list', items, line: open.line };
  },

  dictAtom(open) {
    this.next();
    const entries = [];
    while (!this.is('}')) {
      if (this.cur.t === 'eof') throw this.unclosed(open);
      let key;
      if (!this.py && (this.cur.t === 'name' || this.cur.t === 'kw')) key = { k: 'str', v: this.next().v, line: open.line };
      else key = this.expr();
      this.expect(':');
      entries.push([key, this.expr()]);
      if (!this.eat(',')) break;
    }
    if (!this.is('}')) throw this.missingClose(open);
    this.next();
    return { k: 'dict', entries, line: open.line };
  },

  // Split `Hello ${name}` / f"Hi {name}" into text and expression parts.
  templateParts(tok) {
    const pre = (tok.prefix || '').length;
    const q = tok.triple ? 3 : 1;
    const body = tok.v.slice(pre + q, tok.v.length - q);
    const parts = [];
    let text = '';
    let i = 0;
    const js = tok.t === 'tpl';
    while (i < body.length) {
      const opens = js ? body.startsWith('${', i) : body[i] === '{' && body[i + 1] !== '{';
      if (!js && (body.startsWith('{{', i) || body.startsWith('}}', i))) {
        text += body[i];
        i += 2;
      } else if (opens) {
        if (text) parts.push({ s: decodeEscapes(text) });
        text = '';
        i = this.templateExpr(body, i + (js ? 2 : 1), tok, parts);
      } else {
        if (body[i] === '\\') {
          text += body.slice(i, i + 2);
          i += 2;
          continue;
        }
        text += body[i++];
      }
    }
    if (text) parts.push({ s: decodeEscapes(text) });
    return parts;
  },

  templateExpr(body, start, tok, parts) {
    let depth = 0;
    let j = start;
    let specAt = -1;
    for (; j < body.length; j++) {
      const ch = body[j];
      if ('([{'.includes(ch)) depth++;
      else if (')]'.includes(ch)) depth--;
      else if (ch === '}' && depth-- === 0) break;
      else if (ch === ':' && depth === 0 && tok.t === 'fstr' && specAt < 0) specAt = j;
    }
    if (j >= body.length) throw new MiniError('SyntaxError', this.py ? "f-string: expecting '}'" : 'Unterminated template literal', tok.line);
    const src = body.slice(start, specAt >= 0 ? specAt : j);
    if (!src.trim()) throw new MiniError('SyntaxError', this.py ? 'f-string: empty expression not allowed' : 'Unexpected token \'}\'', tok.line);
    const sub = new Parser(src.trim(), this.lang, tok.line - 1);
    const e = sub.expr();
    parts.push({ e, spec: specAt >= 0 ? body.slice(specAt + 1, j) : '' });
    return j + 1;
  },
});

function parseProgram(src, lang) {
  return new Parser(src, lang).program();
}

// =====================================================================
// Mini interpreter — generator-based so every statement can be a "step"
// =====================================================================
class PyFloat {
  constructor(v) {
    this.v = v;
  }
}
class UserFn {
  constructor(node, closure) {
    this.node = node;
    this.name = node.name;
    this.closure = closure;
  }
}
class Builtin {
  constructor(name, fn, opts = {}) {
    this.name = name;
    this.fn = fn;
    this.self = opts.self;
    this.gen = !!opts.gen;
  }
}
class Module {
  constructor(name, members) {
    this.name = name;
    this.members = members;
  }
}
class PyRange {
  constructor(start, stop, step) {
    this.start = start;
    this.stop = stop;
    this.step = step;
  }

  get length() {
    const n = Math.ceil((this.stop - this.start) / this.step);
    return Math.max(0, n);
  }

  at(i) {
    return this.start + i * this.step;
  }
}
class PyType {
  constructor(name) {
    this.name = name;
  }
}
class TurtleObj {}
class ReturnSig {
  constructor(value) {
    this.value = value;
  }
}
const BREAK = { sig: 'break' };
const CONTINUE = { sig: 'continue' };
const num = v => (v instanceof PyFloat ? v.v : v === true ? 1 : v === false ? 0 : v);
const isNumLike = v => typeof v === 'number' || v instanceof PyFloat || typeof v === 'boolean';

class Env {
  constructor(parent = null, kind = 'block') {
    this.vars = new Map();
    this.consts = new Set();
    this.declared = new Set();
    this.parent = parent;
    this.kind = kind;
    this.locals = null;
    this.globals = null;
  }

  find(name) {
    for (let e = this; e; e = e.parent) {
      if (e.vars.has(name)) return e;
    }
    return null;
  }
}

function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

class Machine {
  constructor(prog, opts = {}) {
    this.prog = prog;
    this.lang = prog.lang;
    this.py = this.lang === 'py';
    this.inputs = (opts.inputs || []).slice();
    this.inputIdx = 0;
    this.inputMissing = false;
    this.out = [];
    this.outLength = 0;
    this.turtle = [];
    this.asks = 0;
    this.rand = opts.seed != null && opts.seed !== '' ? mulberry32(Number(opts.seed)) : Math.random;
    this.maxSteps = opts.maxSteps || 3e6;
    this.deadline = opts.deadline || Infinity;
    this.steps = 0;
    this.loops = [];
    this.root = new Env(null, 'builtins');
    installBuiltins(this);
    this.global = new Env(this.root, 'global');
    this.frames = [{ name: this.py ? '<module>' : 'main', env: this.global, cur: this.global, line: 0 }];
  }

  *run() {
    yield* this.execBlock(this.prog.body, this.global);
  }

  error(type, msg, line) {
    return new MiniError(type, msg, line);
  }

  // Called before every statement: counts steps, enforces limits, records the line.
  tick(s, env) {
    this.steps++;
    if (this.steps > this.maxSteps) throw this.error('Timeout', 'Program took too many steps', s.line);
    if ((this.steps & 511) === 0 && performance.now() > this.deadline) throw this.error('Timeout', 'Program ran too long', s.line);
    const f = this.frames[this.frames.length - 1];
    f.line = s.line;
    f.cur = env;
    return s;
  }

  *execBlock(body, env) {
    if (!this.py) {
      body.filter(s => s.k === 'func').forEach(s => this.declare(env, s.name, new UserFn(s, env)));
    }
    for (const s of body) yield* this.exec(s, env);
  }

  *execBody(body, env) {
    yield* this.execBlock(body, this.py ? env : new Env(env, 'block'));
  }

  *exec(s, env) {
    if (s.k === 'func' && !this.py) return;
    yield this.tick(s, env);
    switch (s.k) {
      case 'expr':
        yield* this.eval(s.e, env);
        return;
      case 'assign':
        yield* this.assign(s, env);
        return;
      case 'if': {
        const test = yield* this.eval(s.test, env);
        yield* this.execBody(this.truthy(test) ? s.body : s.orelse, env);
        return;
      }
      case 'while':
        yield* this.execWhile(s, env);
        return;
      case 'for':
        yield* this.execFor(s, env);
        return;
      case 'foreach':
        yield* this.execForeach(s, env);
        return;
      default:
        yield* this.execSimple(s, env);
    }
  }

  *execSimple(s, env) {
    switch (s.k) {
      case 'func':
        this.declare(env, s.name, new UserFn(s, env));
        return;
      case 'return': {
        if (this.frames.length < 2) throw this.error('SyntaxError', this.py ? "'return' outside function" : 'Illegal return statement', s.line);
        const v = s.value ? yield* this.eval(s.value, env) : this.py ? null : undefined;
        throw new ReturnSig(v);
      }
      case 'break':
        if (!this.loops.length) throw this.error('SyntaxError', this.py ? "'break' outside loop" : 'Illegal break statement', s.line);
        throw BREAK;
      case 'continue':
        if (!this.loops.length) throw this.error('SyntaxError', this.py ? "'continue' not properly in loop" : 'Illegal continue statement', s.line);
        throw CONTINUE;
      case 'block':
        yield* this.execBody(s.body, env);
        return;
      case 'import':
        this.doImport(s, env);
        return;
      case 'global':
        if (env.kind === 'func') s.names.forEach(n => env.globals.add(n));
        return;
      case 'pass':
        return;
      default:
        throw this.error('Unsupported', `Statement '${s.k}' is not supported`, s.line);
    }
  }

  enterLoop(s, kind, total = null) {
    const loop = { node: s, line: s.line, kind, count: 0, total };
    this.loops.push(loop);
    return loop;
  }

  exitLoop(loop) {
    const i = this.loops.lastIndexOf(loop);
    if (i >= 0) this.loops.splice(i, 1);
  }

  // Runs one loop body; returns false when the loop must stop (break).
  *loopBody(body, env) {
    try {
      yield* this.execBody(body, env);
    } catch (sig) {
      if (sig === BREAK) return false;
      if (sig !== CONTINUE) throw sig;
    }
    return true;
  }

  *execWhile(s, env) {
    const loop = this.enterLoop(s, s.doFirst ? 'do-while' : 'while');
    try {
      for (;;) {
        if (loop.count > 0) yield this.tick(s, env);
        const skipTest = s.doFirst && loop.count === 0;
        if (!skipTest && !this.truthy(yield* this.eval(s.test, env))) break;
        loop.count++;
        if (!(yield* this.loopBody(s.body, env))) break;
      }
    } finally {
      this.exitLoop(loop);
    }
  }

  *execFor(s, env) {
    const forEnv = new Env(env, 'block');
    for (const init of s.init) yield* this.assign(init, forEnv);
    const loop = this.enterLoop(s, 'for', this.guessTotal(s, forEnv));
    try {
      for (;;) {
        if (loop.count > 0) yield this.tick(s, forEnv);
        if (s.test && !this.truthy(yield* this.eval(s.test, forEnv))) break;
        loop.count++;
        if (!(yield* this.loopBody(s.body, forEnv))) break;
        if (s.update) yield* (s.update.k === 'assign' ? this.assign(s.update, forEnv) : this.eval(s.update.e, forEnv));
      }
    } finally {
      this.exitLoop(loop);
    }
  }

  // For `for (let i = 0; i < 10; i++)` the visualiser can show "round 3 of 10".
  guessTotal(s, env) {
    const t = s.test;
    const u = s.update;
    if (!t || t.k !== 'bin' || t.l.k !== 'name' || !['<', '<='].includes(t.op)) return null;
    if (!u || !(u.k === 'expr' && u.e.k === 'update' && u.e.op === '++')) return null;
    const start = env.vars.get(t.l.id);
    let end = null;
    if (t.r.k === 'num') end = t.r.v;
    else if (t.r.k === 'name' && env.find(t.r.id)) end = num(env.find(t.r.id).vars.get(t.r.id));
    if (typeof start !== 'number' || typeof end !== 'number') return null;
    return Math.max(0, end - start + (t.op === '<=' ? 1 : 0));
  }

  *execForeach(s, env) {
    const iterable = yield* this.eval(s.iter, env);
    const items = this.iterate(iterable, s.iter.line);
    const loop = this.enterLoop(s, this.py ? 'for' : 'for...of', items.length);
    try {
      for (let i = 0; i < items.length; i++) {
        if (i > 0) yield this.tick(s, env);
        const bodyEnv = this.py ? env : new Env(env, 'block');
        this.bindTargets(s, items.at ? items.at(i) : items[i], bodyEnv);
        loop.count++;
        if (!(yield* this.loopBody(s.body, bodyEnv))) break;
      }
    } finally {
      this.exitLoop(loop);
    }
  }

  bindTargets(s, value, env) {
    if (s.targets.length === 1) {
      this.setName(s.targets[0], value, env, s.decl || null, s.line);
      return;
    }
    const parts = Array.isArray(value) ? value : null;
    if (!parts || parts.length !== s.targets.length) {
      throw this.error('ValueError', `not enough values to unpack (expected ${s.targets.length})`, s.line);
    }
    s.targets.forEach((n, i) => this.setName(n, parts[i], env, null, s.line));
  }

  iterate(v, line) {
    if (Array.isArray(v)) return v.slice();
    if (typeof v === 'string') return [...v];
    if (v instanceof PyRange) return v;
    if (v instanceof Map && this.py) return [...v.keys()];
    const shown = this.py ? `'${pyTypeName(v)}' object is not iterable` : `${this.jsDescribe(v)} is not iterable`;
    throw this.error('TypeError', shown, line);
  }

  declare(env, name, value) {
    env.vars.set(name, value);
  }

  // ---------- variables ----------
  *assign(s, env) {
    const t = s.target;
    let value = yield* this.eval(s.value, env);
    if (s.op !== '=') {
      const old = yield* this.eval(t, env);
      value = this.binop(s.op.slice(0, -1), old, value, s.line);
    }
    yield* this.store(t, value, env, s.decl, s.line);
  }

  setName(name, value, env, decl, line) {
    if (this.py) {
      if (env.globals && env.globals.has(name)) this.global.vars.set(name, value);
      else env.vars.set(name, value);
      return;
    }
    if (decl === 'let' || decl === 'const') {
      if (env.declared.has(name)) throw this.error('SyntaxError', `Identifier '${name}' has already been declared`, line);
      env.vars.set(name, value);
      env.declared.add(name);
      if (decl === 'const') env.consts.add(name);
      return;
    }
    if (decl === 'var') {
      let fe = env;
      while (fe.kind === 'block' && fe.parent) fe = fe.parent;
      fe.vars.set(name, value);
      return;
    }
    const owner = env.find(name);
    if (owner && owner.kind !== 'builtins') {
      if (owner.consts.has(name)) throw this.error('TypeError', 'Assignment to constant variable.', line);
      owner.vars.set(name, value);
      return;
    }
    this.global.vars.set(name, value);
  }

  lookup(e, env) {
    const name = e.id;
    let scope = env;
    if (this.py && env.globals && env.globals.has(name)) {
      scope = this.global;
    } else if (this.py && env.locals && env.locals.has(name) && !env.vars.has(name)) {
      throw this.error('UnboundLocalError', `cannot access local variable '${name}' where it is not associated with a value`, e.line);
    }
    const owner = scope.find(name);
    if (!owner) {
      if (this.py) throw this.error('NameError', `name '${name}' is not defined`, e.line);
      throw this.error('ReferenceError', `${name} is not defined`, e.line);
    }
    return owner.vars.get(name);
  }

  // ---------- functions ----------
  *callUser(fn, args, kw, line) {
    if (this.frames.length > 120) {
      if (this.py) throw this.error('RecursionError', 'maximum recursion depth exceeded', line);
      throw this.error('RangeError', 'Maximum call stack size exceeded', line);
    }
    const node = fn.node;
    const env = new Env(fn.closure, 'func');
    if (this.py) {
      env.locals = localNames(node);
      env.globals = new Set(globalNames(node));
    }
    yield* this.bindParams(node, args, kw, env, line);
    this.frames.push({ name: node.name, env, cur: env, line: node.line, callLine: line });
    try {
      yield* this.execBlock(node.body, env);
    } catch (sig) {
      if (sig instanceof ReturnSig) return sig.value;
      throw sig;
    } finally {
      this.frames.pop();
    }
    return this.py ? null : undefined;
  }

  *bindParams(node, args, kw, env, line) {
    const ps = node.params;
    if (this.py && args.length > ps.length) {
      const n = ps.length;
      throw this.error('TypeError', `${node.name}() takes ${n} positional argument${n === 1 ? '' : 's'} but ${args.length} ${args.length === 1 ? 'was' : 'were'} given`, line);
    }
    const missing = [];
    for (let i = 0; i < ps.length; i++) {
      const p = ps[i];
      let v = i < args.length ? args[i] : kw[p.name];
      if (v === undefined && p.def) v = yield* this.eval(p.def, env);
      if (v === undefined && this.py) missing.push(p.name);
      env.vars.set(p.name, v);
    }
    if (missing.length) {
      const names = missing.map(n => `'${n}'`).join(' and ');
      throw this.error('TypeError', `${node.name}() missing ${missing.length} required positional argument${missing.length > 1 ? 's' : ''}: ${names}`, line);
    }
  }

  *callValue(fn, args, kw, e) {
    if (fn instanceof UserFn) return yield* this.callUser(fn, args, kw, e.line);
    if (fn instanceof Builtin) {
      if (fn.gen) return yield* fn.fn.call(this, args, kw, e.line, fn.self);
      return fn.fn.call(this, args, kw, e.line, fn.self);
    }
    if (this.py) throw this.error('TypeError', `'${pyTypeName(fn)}' object is not callable`, e.line);
    throw this.error('TypeError', `${exprText(e.fn)} is not a function`, e.line);
  }

  // ---------- output and input ----------
  write(text, kind = 'out') {
    if (this.outLength > 200000) return;
    const last = this.out[this.out.length - 1];
    if (last && last.k === kind) last.s += text;
    else this.out.push({ k: kind, s: text });
    this.outLength += text.length;
  }

  readInput(promptText, line) {
    this.asks++;
    const has = this.inputIdx < this.inputs.length;
    const answer = has ? this.inputs[this.inputIdx++] : '';
    if (!has) this.inputMissing = true;
    const p = promptText == null ? '' : String(promptText);
    if (p) this.write(this.py || /\s$/.test(p) ? p : p + ' ');
    this.write(answer + '\n', 'in');
    return answer;
  }

  // ---------- snapshots for the visualiser ----------
  snapshot(node) {
    return {
      line: node ? node.line : 0,
      frames: this.frames.map(f => ({ name: f.name, line: f.line, vars: this.frameVars(f) })),
      loops: this.loops.map(l => ({ line: l.line, kind: l.kind, count: l.count, total: l.total })),
      outLen: this.outLength,
      turtleLen: this.turtle.length,
    };
  }

  frameVars(f) {
    const chain = [];
    for (let e = f.cur; e; e = e.parent) {
      chain.unshift(e);
      if (e === f.env) break;
    }
    const rows = new Map();
    chain.forEach(e => e.vars.forEach((v, k) => {
      if (v instanceof Module || v instanceof Builtin) return;
      rows.set(k, [k, shortRepr(this.repr(v)), this.typeName(v)]);
    }));
    return [...rows.values()];
  }
}

// Names a Python function assigns to (they are local unless declared global).
function localNames(fnNode) {
  if (fnNode._locals) return fnNode._locals;
  const names = new Set(fnNode.params.map(p => p.name));
  const walk = body => body.forEach(s => {
    if (s.k === 'assign' && s.target.k === 'name') names.add(s.target.id);
    if (s.k === 'foreach') s.targets.forEach(n => names.add(n));
    if (s.k === 'func') names.add(s.name);
    if (s.k === 'import') names.add(s.alias);
    ['body', 'orelse'].forEach(key => s.k !== 'func' && s[key] && walk(s[key]));
  });
  walk(fnNode.body);
  globalNames(fnNode).forEach(n => names.delete(n));
  fnNode._locals = names;
  return names;
}

function globalNames(fnNode) {
  const out = [];
  const walk = body => body.forEach(s => {
    if (s.k === 'global') out.push(...s.names);
    ['body', 'orelse'].forEach(key => s.k !== 'func' && s[key] && walk(s[key]));
  });
  walk(fnNode.body);
  return out;
}

function exprText(e) {
  if (!e) return '';
  if (e.k === 'name') return e.id;
  if (e.k === 'member') return `${exprText(e.obj)}.${e.prop}`;
  if (e.k === 'index') return `${exprText(e.obj)}[...]`;
  if (e.k === 'call') return `${exprText(e.fn)}(...)`;
  return 'expression';
}

const shortRepr = s => (s.length > 48 ? s.slice(0, 45) + '...' : s);

// ---------- value formatting (shared with the JS worker) ----------
function fmtJsValue(v, top = true, special = null, depth = 0) {
  const custom = special ? special(v) : null;
  if (custom != null) return custom;
  if (typeof v === 'string') {
    if (top) return v;
    return "'" + v.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n') + "'";
  }
  if (v === null) return 'null';
  if (v === undefined) return 'undefined';
  if (typeof v === 'number') return Object.is(v, -0) ? '0' : String(v);
  if (typeof v === 'function') return '[Function: ' + (v.name || 'anonymous') + ']';
  if (typeof v !== 'object') return String(v);
  if (depth > 3) return Array.isArray(v) ? '[Array]' : '[Object]';
  const inner = x => fmtJsValue(x, false, special, depth + 1);
  if (Array.isArray(v)) return '[' + v.map(inner).join(', ') + ']';
  const entries = v instanceof Map ? [...v.entries()] : Object.entries(v);
  if (!entries.length) return '{}';
  const key = k => (/^[A-Za-z_$][\w$]*$/.test(k) ? k : "'" + k + "'");
  return '{ ' + entries.map(([k, x]) => key(String(k)) + ': ' + inner(x)).join(', ') + ' }';
}

const jsSpecial = v => {
  if (v instanceof UserFn) return `[Function: ${v.name}]`;
  if (v instanceof Builtin) return `[Function: ${v.name}]`;
  if (v instanceof Module) return `[object ${v.name}]`;
  return null;
};

function jsToString(v) {
  if (typeof v === 'string') return v;
  if (v === null) return 'null';
  if (v === undefined) return 'undefined';
  if (Array.isArray(v)) return v.map(x => (x == null ? '' : jsToString(x))).join(',');
  if (v instanceof Map) return '[object Object]';
  if (v instanceof UserFn) return `function ${v.name}() { ... }`;
  if (v instanceof Builtin) return `function ${v.name}() { [native code] }`;
  return String(v);
}

function jsNum(v) {
  if (typeof v === 'number') return v;
  if (typeof v === 'boolean') return +v;
  if (v === null) return 0;
  if (v === undefined) return NaN;
  if (typeof v === 'string') return v.trim() === '' ? 0 : Number(v);
  if (Array.isArray(v)) return jsNum(jsToString(v));
  return NaN;
}

function jsTypeof(v) {
  if (v === undefined) return 'undefined';
  if (v instanceof UserFn || v instanceof Builtin) return 'function';
  if (v === null || typeof v === 'object') return 'object';
  return typeof v;
}

function pyTypeName(v) {
  if (v === null || v === undefined) return 'NoneType';
  if (typeof v === 'boolean') return 'bool';
  if (typeof v === 'number') return 'int';
  if (typeof v === 'string') return 'str';
  if (v instanceof PyFloat) return 'float';
  if (Array.isArray(v)) return 'list';
  if (v instanceof Map) return 'dict';
  if (v instanceof PyRange) return 'range';
  if (v instanceof UserFn) return 'function';
  if (v instanceof Builtin) return 'builtin_function_or_method';
  if (v instanceof Module) return 'module';
  if (v instanceof PyType) return 'type';
  if (v instanceof TurtleObj) return 'Turtle';
  return 'object';
}

function pyFloatRepr(x) {
  if (Number.isNaN(x)) return 'nan';
  if (!Number.isFinite(x)) return x > 0 ? 'inf' : '-inf';
  if (Number.isInteger(x) && Math.abs(x) < 1e16) return x.toFixed(1);
  return String(x);
}

function pyQuote(s) {
  const q = s.includes("'") && !s.includes('"') ? '"' : "'";
  const body = s.replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/\t/g, '\\t');
  return q + (q === "'" ? body.replace(/'/g, "\\'") : body) + q;
}

function pyRepr(v) {
  if (v === null || v === undefined) return 'None';
  if (v === true) return 'True';
  if (v === false) return 'False';
  if (typeof v === 'number') return Number.isInteger(v) ? String(v) : pyFloatRepr(v);
  if (v instanceof PyFloat) return pyFloatRepr(v.v);
  if (typeof v === 'string') return pyQuote(v);
  if (Array.isArray(v)) return '[' + v.map(pyRepr).join(', ') + ']';
  if (v instanceof Map) return '{' + [...v].map(([k, x]) => pyRepr(k) + ': ' + pyRepr(x)).join(', ') + '}';
  if (v instanceof PyRange) return `range(${v.start}, ${v.stop}${v.step !== 1 ? ', ' + v.step : ''})`;
  if (v instanceof UserFn) return `<function ${v.name}>`;
  if (v instanceof Builtin) return `<built-in function ${v.name}>`;
  if (v instanceof Module) return `<module '${v.name}'>`;
  if (v instanceof PyType) return `<class '${v.name}'>`;
  if (v instanceof TurtleObj) return '<turtle.Turtle object>';
  return String(v);
}

const pyStr = v => (typeof v === 'string' ? v : pyRepr(v));

function pyEq(a, b) {
  if (isNumLike(a) && isNumLike(b)) return num(a) === num(b);
  if (Array.isArray(a) && Array.isArray(b)) return a.length === b.length && a.every((x, i) => pyEq(x, b[i]));
  if (a instanceof Map && b instanceof Map) return a.size === b.size && [...a].every(([k, v]) => b.has(k) && pyEq(v, b.get(k)));
  if (a instanceof PyType || b instanceof PyType) return !!a && !!b && a.name === b.name;
  if (a == null || b == null) return a == null && b == null;
  return a === b;
}

// Apply a small subset of Python's format spec: [align][width][,][.prec][f|d|%]
function formatSpec(v, spec, toText) {
  const m = /^([<>^]?)(\d*)(,?)(?:\.(\d+))?([fd%]?)$/.exec(spec || '');
  if (!spec || !m) return toText(v);
  const [, align, width, comma, prec, type] = m;
  let s;
  if (type === '%') s = (num(v) * 100).toFixed(prec ? +prec : 6) + '%';
  else if (type === 'f' || prec) s = num(v).toFixed(prec ? +prec : 6);
  else s = toText(v);
  if (comma) s = s.replace(/^(-?\d+)/, d => Number(d).toLocaleString('en-US'));
  const w = +width || 0;
  const al = align || (isNumLike(v) ? '>' : '<');
  if (s.length >= w) return s;
  const pad = w - s.length;
  if (al === '>') return ' '.repeat(pad) + s;
  if (al === '^') return ' '.repeat(Math.floor(pad / 2)) + s + ' '.repeat(Math.ceil(pad / 2));
  return s + ' '.repeat(pad);
}

// ---------- expression evaluation ----------
Object.assign(Machine.prototype, {
  *eval(e, env) {
    switch (e.k) {
      case 'num':
        return e.float ? new PyFloat(e.v) : e.v;
      case 'str':
      case 'bool':
        return e.v;
      case 'none':
        return null;
      case 'undef':
        return undefined;
      case 'name':
        return this.lookup(e, env);
      case 'list': {
        const out = [];
        for (const it of e.items) out.push(yield* this.eval(it, env));
        return out;
      }
      case 'dict':
        return yield* this.evalDict(e, env);
      case 'tpl':
        return yield* this.evalTemplate(e, env);
      default:
        return yield* this.evalOps(e, env);
    }
  },

  *evalOps(e, env) {
    switch (e.k) {
      case 'unary':
        return this.unop(e.op, yield* this.eval(e.e, env), e.line);
      case 'bin': {
        const a = yield* this.eval(e.l, env);
        const b = yield* this.eval(e.r, env);
        return this.binop(e.op, a, b, e.line);
      }
      case 'logic': {
        const l = yield* this.eval(e.l, env);
        const stop = e.op === 'and' ? !this.truthy(l) : this.truthy(l);
        return stop ? l : yield* this.eval(e.r, env);
      }
      case 'cond':
        return this.truthy(yield* this.eval(e.test, env)) ? yield* this.eval(e.a, env) : yield* this.eval(e.b, env);
      case 'call':
        return yield* this.evalCall(e, env);
      case 'member':
        return this.getMember(yield* this.eval(e.obj, env), e.prop, e.line);
      case 'index': {
        const obj = yield* this.eval(e.obj, env);
        return this.getIndex(obj, yield* this.eval(e.idx, env), e.line);
      }
      case 'slice':
        return yield* this.evalSlice(e, env);
      case 'update':
        return yield* this.evalUpdate(e, env);
      default:
        throw this.error('Unsupported', `Expression '${e.k}' is not supported`, e.line);
    }
  },

  *evalDict(e, env) {
    const m = new Map();
    for (const [k, v] of e.entries) {
      const key = this.key(yield* this.eval(k, env), e.line);
      m.set(key, yield* this.eval(v, env));
    }
    return m;
  },

  *evalTemplate(e, env) {
    let s = '';
    for (const p of e.parts) {
      if (!p.e) {
        s += p.s;
        continue;
      }
      const v = yield* this.eval(p.e, env);
      s += this.py ? formatSpec(v, p.spec, pyStr) : jsToString(v);
    }
    return s;
  },

  *evalCall(e, env) {
    const fn = yield* this.eval(e.fn, env);
    const args = [];
    for (const a of e.args) args.push(yield* this.eval(a, env));
    const kw = {};
    for (const k of Object.keys(e.kw)) kw[k] = yield* this.eval(e.kw[k], env);
    return yield* this.callValue(fn, args, kw, e);
  },

  *evalSlice(e, env) {
    const obj = yield* this.eval(e.obj, env);
    const lo = e.lo ? num(yield* this.eval(e.lo, env)) : null;
    const hi = e.hi ? num(yield* this.eval(e.hi, env)) : null;
    if (!Array.isArray(obj) && typeof obj !== 'string') throw this.error('TypeError', `'${pyTypeName(obj)}' object is not subscriptable`, e.line);
    const n = obj.length;
    const fix = (x, d) => (x == null ? d : x < 0 ? Math.max(0, n + x) : Math.min(n, x));
    return obj.slice(fix(lo, 0), fix(hi, n));
  },

  *evalUpdate(e, env) {
    const old = jsNum(yield* this.eval(e.target, env));
    const next = e.op === '++' ? old + 1 : old - 1;
    yield* this.store(e.target, next, env, null, e.line);
    return e.prefix ? next : old;
  },

  *store(t, value, env, decl, line) {
    if (t.k === 'name') {
      this.setName(t.id, value, env, decl, line);
      return;
    }
    const obj = yield* this.eval(t.obj, env);
    if (t.k === 'index') this.setIndex(obj, yield* this.eval(t.idx, env), value, line);
    else this.setMember(obj, t.prop, value, line);
  },

  key(v, line) {
    if (v instanceof PyFloat) return v.v;
    if (Array.isArray(v) || v instanceof Map) throw this.error('TypeError', `unhashable type: '${pyTypeName(v)}'`, line);
    return this.py ? v : jsToString(v);
  },

  truthy(v) {
    if (!this.py) return !(v === false || v === 0 || v === '' || v == null || Number.isNaN(v));
    if (v == null || v === false || v === 0 || v === '') return false;
    if (v instanceof PyFloat) return v.v !== 0;
    if (Array.isArray(v)) return v.length > 0;
    if (v instanceof Map) return v.size > 0;
    if (v instanceof PyRange) return v.length > 0;
    return true;
  },

  repr(v) {
    return this.py ? pyRepr(v) : fmtJsValue(v, false, jsSpecial);
  },

  str(v) {
    return this.py ? pyStr(v) : fmtJsValue(v, true, jsSpecial);
  },

  typeName(v) {
    if (this.py) return pyTypeName(v);
    return Array.isArray(v) ? 'array' : jsTypeof(v);
  },

  jsDescribe(v) {
    return typeof v === 'string' ? `"${v}"` : jsTypeof(v) === 'object' && v !== null ? 'object' : jsToString(v);
  },

  unop(op, v, line) {
    if (op === 'not') return !this.truthy(v);
    if (op === 'typeof') return jsTypeof(v);
    if (!this.py) return op === '-' ? -jsNum(v) : jsNum(v);
    if (!isNumLike(v)) throw this.error('TypeError', `bad operand type for unary ${op}: '${pyTypeName(v)}'`, line);
    if (op === '+') return v instanceof PyFloat ? v : num(v);
    return v instanceof PyFloat ? new PyFloat(-v.v) : -num(v);
  },

  binop(op, a, b, line) {
    return this.py ? this.pyBin(op, a, b, line) : this.jsBin(op, a, b);
  },
});

// ---------- Python operators ----------
Object.assign(Machine.prototype, {
  pyBin(op, a, b, line) {
    if (op === '==') return pyEq(a, b);
    if (op === '!=') return !pyEq(a, b);
    if (op === 'in' || op === 'not in') return (op === 'in') === this.pyIn(a, b, line);
    if (['<', '>', '<=', '>='].includes(op)) return this.pyCompare(op, a, b, line);
    if (isNumLike(a) && isNumLike(b)) return this.pyArith(op, a, b, line);
    if (op === '+') return this.pyConcat(a, b, line);
    if (op === '*') {
      const seq = typeof a === 'string' || Array.isArray(a) ? a : b;
      const times = seq === a ? b : a;
      if ((typeof seq === 'string' || Array.isArray(seq)) && typeof times === 'number') {
        const n = Math.max(0, times);
        return typeof seq === 'string' ? seq.repeat(n) : Array.from({ length: n }, () => seq).flat();
      }
      if (typeof seq === 'string' || Array.isArray(seq)) throw this.error('TypeError', `can't multiply sequence by non-int of type '${pyTypeName(times)}'`, line);
    }
    throw this.error('TypeError', `unsupported operand type(s) for ${op}: '${pyTypeName(a)}' and '${pyTypeName(b)}'`, line);
  },

  pyConcat(a, b, line) {
    if (typeof a === 'string' && typeof b === 'string') return a + b;
    if (Array.isArray(a) && Array.isArray(b)) return a.concat(b);
    if (typeof a === 'string') throw this.error('TypeError', `can only concatenate str (not "${pyTypeName(b)}") to str`, line);
    if (Array.isArray(a)) throw this.error('TypeError', `can only concatenate list (not "${pyTypeName(b)}") to list`, line);
    throw this.error('TypeError', `unsupported operand type(s) for +: '${pyTypeName(a)}' and '${pyTypeName(b)}'`, line);
  },

  pyArith(op, a, b, line) {
    const fl = a instanceof PyFloat || b instanceof PyFloat;
    const x = num(a);
    const y = num(b);
    const mk = v => (fl ? new PyFloat(v) : v);
    switch (op) {
      case '+':
        return mk(x + y);
      case '-':
        return mk(x - y);
      case '*':
        return mk(x * y);
      case '/':
        if (y === 0) throw this.error('ZeroDivisionError', 'division by zero', line);
        return new PyFloat(x / y);
      case '//':
        if (y === 0) throw this.error('ZeroDivisionError', 'integer division or modulo by zero', line);
        return mk(Math.floor(x / y));
      case '%':
        if (y === 0) throw this.error('ZeroDivisionError', 'integer modulo by zero', line);
        return mk(x - y * Math.floor(x / y));
      case '**':
        return fl || y < 0 ? new PyFloat(x ** y) : x ** y;
      default:
        throw this.error('TypeError', `unsupported operand type(s) for ${op}`, line);
    }
  },

  pyCompare(op, a, b, line) {
    let x;
    let y;
    if (isNumLike(a) && isNumLike(b)) {
      x = num(a);
      y = num(b);
    } else if (typeof a === 'string' && typeof b === 'string') {
      x = a;
      y = b;
    } else {
      throw this.error('TypeError', `'${op}' not supported between instances of '${pyTypeName(a)}' and '${pyTypeName(b)}'`, line);
    }
    if (op === '<') return x < y;
    if (op === '>') return x > y;
    if (op === '<=') return x <= y;
    return x >= y;
  },

  pyIn(a, b, line) {
    if (typeof b === 'string') {
      if (typeof a !== 'string') throw this.error('TypeError', `'in <string>' requires string as left operand, not ${pyTypeName(a)}`, line);
      return b.includes(a);
    }
    if (Array.isArray(b)) return b.some(x => pyEq(x, a));
    if (b instanceof Map) return b.has(this.key(a, line));
    if (b instanceof PyRange) {
      const n = num(a);
      return Number.isInteger(n) && (n - b.start) % b.step === 0 && (b.step > 0 ? n >= b.start && n < b.stop : n <= b.start && n > b.stop);
    }
    throw this.error('TypeError', `argument of type '${pyTypeName(b)}' is not iterable`, line);
  },
});

// ---------- JavaScript operators ----------
Object.assign(Machine.prototype, {
  jsBin(op, a, b) {
    const pa = Array.isArray(a) || a instanceof Map ? jsToString(a) : a;
    const pb = Array.isArray(b) || b instanceof Map ? jsToString(b) : b;
    switch (op) {
      case '+':
        if (typeof pa === 'string' || typeof pb === 'string') return jsToString(pa) + jsToString(pb);
        return jsNum(pa) + jsNum(pb);
      case '-':
        return jsNum(pa) - jsNum(pb);
      case '*':
        return jsNum(pa) * jsNum(pb);
      case '/':
        return jsNum(pa) / jsNum(pb);
      case '%':
        return jsNum(pa) % jsNum(pb);
      case '**':
        return jsNum(pa) ** jsNum(pb);
      case '===':
        return a === b;
      case '!==':
        return a !== b;
      case '==':
        return this.jsLoose(a, b, pa, pb);
      case '!=':
        return !this.jsLoose(a, b, pa, pb);
      default:
        return this.jsRelational(op, pa, pb);
    }
  },

  jsLoose(a, b, pa, pb) {
    if (a == null || b == null) return a == null && b == null;
    if (typeof a === typeof b) return a === b;
    return jsNum(pa) === jsNum(pb);
  },

  jsRelational(op, a, b) {
    const both = typeof a === 'string' && typeof b === 'string';
    const x = both ? a : jsNum(a);
    const y = both ? b : jsNum(b);
    if (op === '<') return x < y;
    if (op === '>') return x > y;
    if (op === '<=') return x <= y;
    return x >= y;
  },
});

// =====================================================================
// Built-in functions, modules and methods for the mini interpreter
// =====================================================================
const NONE = m => (m.py ? null : undefined);

function installBuiltins(m) {
  const def = (name, fn, opts) => m.root.vars.set(name, new Builtin(name, fn, opts));
  m.turtleModule = makeTurtleModule(m);
  if (m.py) {
    installPyBuiltins(m, def);
    m.modules = { turtle: m.turtleModule, random: makeRandomModule(m), math: makeMathModule(m), time: new Module('time', { sleep: new Builtin('sleep', () => null) }) };
    return;
  }
  installJsBuiltins(m, def);
}

function turtleCommand(m, name, code) {
  const needsNumber = new Set(['fd', 'bk', 'lt', 'rt', 'seth', 'size', 'circle']);
  return (args, kw, line) => {
    const vals = args.map(a => (typeof a === 'string' ? a : num(a)));
    if (needsNumber.has(code) && (typeof vals[0] !== 'number' || Number.isNaN(vals[0]))) {
      throw m.error('TypeError', `${name}() needs a number, but got ${m.typeName(args[0])}`, line);
    }
    m.turtle.push([code, ...vals]);
    if (m.turtle.length > 20000) throw m.error('Timeout', 'Too many turtle moves (over 20,000)', line);
    return NONE(m);
  };
}

function makeTurtleModule(m) {
  const members = {};
  Object.entries(TURTLE_ALIASES).forEach(([name, code]) => {
    members[name] = new Builtin(name, turtleCommand(m, name, code));
  });
  members.Turtle = new Builtin('Turtle', () => new TurtleObj());
  members.Pen = members.Turtle;
  const noop = name => new Builtin(name, () => NONE(m));
  const screen = new Module('Screen', { bgcolor: members.bgcolor, exitonclick: noop('exitonclick'), title: noop('title'), setup: noop('setup'), tracer: noop('tracer'), update: noop('update'), mainloop: noop('mainloop') });
  members.Screen = new Builtin('Screen', () => screen);
  members.title = noop('title');
  members.setup = noop('setup');
  members.tracer = noop('tracer');
  return new Module('turtle', members);
}

function makeRandomModule(m) {
  const int = (args, line) => args.map(a => {
    if (typeof a !== 'number' || !Number.isInteger(a)) throw m.error('TypeError', `'${pyTypeName(a)}' object cannot be interpreted as an integer`, line);
    return a;
  });
  return new Module('random', {
    randint: new Builtin('randint', (args, kw, line) => {
      const [a, b] = int(args, line);
      return a + Math.floor(m.rand() * (b - a + 1));
    }),
    randrange: new Builtin('randrange', (args, kw, line) => {
      const [a, b] = args.length > 1 ? int(args, line) : [0, int(args, line)[0]];
      return a + Math.floor(m.rand() * (b - a));
    }),
    random: new Builtin('random', () => new PyFloat(m.rand())),
    uniform: new Builtin('uniform', args => new PyFloat(num(args[0]) + m.rand() * (num(args[1]) - num(args[0])))),
    choice: new Builtin('choice', (args, kw, line) => {
      const seq = m.iterate(args[0], line);
      if (!seq.length) throw m.error('IndexError', 'Cannot choose from an empty sequence', line);
      return seq.at ? seq.at(Math.floor(m.rand() * seq.length)) : seq[Math.floor(m.rand() * seq.length)];
    }),
    shuffle: new Builtin('shuffle', args => {
      const a = args[0];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(m.rand() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return null;
    }),
    seed: new Builtin('seed', args => {
      m.rand = mulberry32(Number(num(args[0])) || 0);
      return null;
    }),
  });
}

function makeMathModule(m) {
  const f = fn => new Builtin(fn.name, (args, kw, line) => fn(args.map(num), line));
  return new Module('math', {
    sqrt: f(function sqrt([x], line) {
      if (x < 0) throw m.error('ValueError', 'math domain error', line);
      return new PyFloat(Math.sqrt(x));
    }),
    floor: f(function floor([x]) {
      return Math.floor(x);
    }),
    ceil: f(function ceil([x]) {
      return Math.ceil(x);
    }),
    pow: f(function pow([x, y]) {
      return new PyFloat(x ** y);
    }),
    fabs: f(function fabs([x]) {
      return new PyFloat(Math.abs(x));
    }),
    pi: new PyFloat(Math.PI),
  });
}

// ---------- Python builtins ----------
function installPyBuiltins(m, def) {
  def('print', (args, kw) => {
    const sep = kw.sep != null ? pyStr(kw.sep) : ' ';
    const end = kw.end != null ? pyStr(kw.end) : '\n';
    m.write(args.map(pyStr).join(sep) + end);
    return null;
  });
  def('input', args => m.readInput(args.length ? pyStr(args[0]) : '', 0));
  def('int', (args, kw, line) => pyInt(m, args[0], line));
  def('float', (args, kw, line) => pyFloat(m, args[0], line));
  def('str', args => (args.length ? pyStr(args[0]) : ''));
  def('bool', args => m.truthy(args[0]));
  def('len', (args, kw, line) => {
    const v = args[0];
    if (typeof v === 'string' || Array.isArray(v) || v instanceof PyRange) return v.length;
    if (v instanceof Map) return v.size;
    throw m.error('TypeError', `object of type '${pyTypeName(v)}' has no len()`, line);
  });
  def('range', (args, kw, line) => pyRange(m, args, line));
  def('abs', args => (args[0] instanceof PyFloat ? new PyFloat(Math.abs(args[0].v)) : Math.abs(num(args[0]))));
  def('min', (args, kw, line) => pyMinMax(m, args, line, 'min'));
  def('max', (args, kw, line) => pyMinMax(m, args, line, 'max'));
  def('sum', (args, kw, line) => m.iterate(args[0], line).reduce((acc, x) => m.pyBin('+', acc, x, line), args[1] ?? 0));
  def('round', args => pyRound(args[0], args[1]));
  def('list', (args, kw, line) => (args.length ? [...m.iterate(args[0], line)] : []));
  def('sorted', (args, kw, line) => pySort(m, [...m.iterate(args[0], line)], kw.reverse, line));
  def('reversed', (args, kw, line) => [...m.iterate(args[0], line)].reverse());
  def('type', args => new PyType(pyTypeName(args[0])));
  def('enumerate', (args, kw, line) => [...m.iterate(args[0], line)].map((x, i) => [i + num(args[1] ?? kw.start ?? 0), x]));
}

function pyInt(m, v, line) {
  if (v === undefined) return 0;
  if (typeof v === 'number' || typeof v === 'boolean') return num(v);
  if (v instanceof PyFloat) return Math.trunc(v.v);
  if (typeof v === 'string' && /^\s*[+-]?\d[\d_]*\s*$/.test(v)) return parseInt(v.replace(/_/g, ''), 10);
  if (typeof v === 'string') throw m.error('ValueError', `invalid literal for int() with base 10: ${pyRepr(v)}`, line);
  throw m.error('TypeError', `int() argument must be a string or a number, not '${pyTypeName(v)}'`, line);
}

function pyFloat(m, v, line) {
  if (v === undefined) return new PyFloat(0);
  if (isNumLike(v)) return new PyFloat(num(v));
  const s = typeof v === 'string' ? v.trim().toLowerCase() : null;
  if (s && /^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/.test(s)) return new PyFloat(Number(s));
  if (s && /^[+-]?(inf|infinity)$/.test(s)) return new PyFloat(s.startsWith('-') ? -Infinity : Infinity);
  if (s != null) throw m.error('ValueError', `could not convert string to float: ${pyRepr(v)}`, line);
  throw m.error('TypeError', `float() argument must be a string or a real number, not '${pyTypeName(v)}'`, line);
}

function pyRange(m, args, line) {
  args.forEach(a => {
    if (typeof a !== 'number' && typeof a !== 'boolean') {
      throw m.error('TypeError', `'${pyTypeName(a)}' object cannot be interpreted as an integer`, line);
    }
  });
  const [a, b, c] = args.map(num);
  if (c === 0) throw m.error('ValueError', 'range() arg 3 must not be zero', line);
  if (args.length === 1) return new PyRange(0, a, 1);
  return new PyRange(a, b, c ?? 1);
}

function pyMinMax(m, args, line, which) {
  const items = args.length === 1 ? [...m.iterate(args[0], line)] : args;
  if (!items.length) throw m.error('ValueError', `${which}() arg is an empty sequence`, line);
  const better = which === 'max' ? '>' : '<';
  return items.reduce((best, x) => (m.pyCompare(better, x, best, line) ? x : best));
}

// Python rounds halves to the nearest even number: round(2.5) == 2.
function pyRound(v, digits) {
  const x = num(v);
  if (digits != null) return new PyFloat(Number(x.toFixed(num(digits))));
  const r = Math.round(x);
  return Math.abs(x % 1) === 0.5 ? 2 * Math.round(x / 2) : r;
}

function pySort(m, arr, reverse, line) {
  arr.sort((a, b) => (m.pyCompare('<', a, b, line) ? -1 : m.pyCompare('>', a, b, line) ? 1 : 0));
  if (m.truthy(reverse)) arr.reverse();
  return arr;
}

// ---------- JavaScript globals ----------
function installJsBuiltins(m, def) {
  const log = new Builtin('log', args => {
    m.write(args.map(a => fmtJsValue(a, true, jsSpecial)).join(' ') + '\n');
  });
  m.root.vars.set('console', new Module('console', { log, info: log, warn: log, error: log }));
  m.root.vars.set('Math', makeJsMath(m));
  m.root.vars.set('turtle', m.turtleModule);
  TURTLE_JS_NAMES.forEach(n => m.root.vars.set(n, m.turtleModule.members[n]));
  def('Number', args => jsNum(args[0]));
  def('String', args => jsToString(args[0]));
  def('parseInt', args => parseInt(jsToString(args[0]), args[1]));
  def('parseFloat', args => parseFloat(jsToString(args[0])));
  def('isNaN', args => Number.isNaN(jsNum(args[0])));
  def('ask', args => m.readInput(args.length ? jsToString(args[0]) : '', 0));
  def('prompt', args => m.readInput(args.length ? jsToString(args[0]) : '', 0));
  def('alert', args => {
    m.write(jsToString(args[0]) + '\n');
  });
}

function makeJsMath(m) {
  const f = (name, fn) => new Builtin(name, args => fn(...args.map(jsNum)));
  return new Module('Math', {
    floor: f('floor', Math.floor),
    ceil: f('ceil', Math.ceil),
    round: f('round', Math.round),
    trunc: f('trunc', Math.trunc),
    abs: f('abs', Math.abs),
    sqrt: f('sqrt', Math.sqrt),
    pow: f('pow', Math.pow),
    max: f('max', Math.max),
    min: f('min', Math.min),
    random: new Builtin('random', () => m.rand()),
    PI: Math.PI,
    E: Math.E,
  });
}

// ---------- methods on strings, lists and dictionaries ----------
const PY_STR_METHODS = {
  upper: s => s.toUpperCase(),
  lower: s => s.toLowerCase(),
  strip: (s, [ch]) => (ch ? s.replace(new RegExp(`^[${escRe(ch)}]+|[${escRe(ch)}]+$`, 'g'), '') : s.trim()),
  lstrip: s => s.trimStart(),
  rstrip: s => s.trimEnd(),
  split: (s, [sep]) => (sep == null ? s.trim().split(/\s+/).filter(Boolean) : s.split(sep)),
  replace: (s, [a, b]) => s.split(a).join(b),
  startswith: (s, [p]) => s.startsWith(p),
  endswith: (s, [p]) => s.endsWith(p),
  find: (s, [p]) => s.indexOf(p),
  count: (s, [p]) => s.split(p).length - 1,
  isdigit: s => /^\d+$/.test(s),
  isalpha: s => /^\p{L}+$/u.test(s),
  isnumeric: s => /^\d+$/.test(s),
  capitalize: s => s.charAt(0).toUpperCase() + s.slice(1).toLowerCase(),
  title: s => s.toLowerCase().replace(/(^|[^\p{L}])(\p{L})/gu, (x, a, b) => a + b.toUpperCase()),
};
const escRe = s => String(s).replace(/[\\\]^-]/g, '\\$&');

const PY_LIST_METHODS = {
  append(a, [x]) {
    a.push(x);
    return null;
  },
  extend(a, [xs], kw, line) {
    a.push(...this.iterate(xs, line));
    return null;
  },
  insert(a, [i, x]) {
    a.splice(num(i) < 0 ? Math.max(0, a.length + num(i)) : num(i), 0, x);
    return null;
  },
  pop(a, [i], kw, line) {
    if (!a.length) throw this.error('IndexError', 'pop from empty list', line);
    const idx = i == null ? a.length - 1 : num(i) < 0 ? a.length + num(i) : num(i);
    if (idx < 0 || idx >= a.length) throw this.error('IndexError', 'pop index out of range', line);
    return a.splice(idx, 1)[0];
  },
  remove(a, [x], kw, line) {
    const idx = a.findIndex(y => pyEq(x, y));
    if (idx < 0) throw this.error('ValueError', 'list.remove(x): x not in list', line);
    a.splice(idx, 1);
    return null;
  },
  index(a, [x], kw, line) {
    const idx = a.findIndex(y => pyEq(x, y));
    if (idx < 0) throw this.error('ValueError', `${pyRepr(x)} is not in list`, line);
    return idx;
  },
  count: (a, [x]) => a.filter(y => pyEq(x, y)).length,
  sort(a, args, kw, line) {
    pySort(this, a, kw.reverse, line);
    return null;
  },
  reverse(a) {
    a.reverse();
    return null;
  },
  clear(a) {
    a.length = 0;
    return null;
  },
  copy: a => a.slice(),
};

const PY_DICT_METHODS = {
  get(d, [k, dflt = null]) {
    const key = this.key(k);
    return d.has(key) ? d.get(key) : dflt;
  },
  keys: d => [...d.keys()],
  values: d => [...d.values()],
  items: d => [...d.entries()].map(([k, v]) => [k, v]),
  pop(d, [k], kw, line) {
    const key = this.key(k);
    if (!d.has(key)) throw this.error('KeyError', pyRepr(k), line);
    const v = d.get(key);
    d.delete(key);
    return v;
  },
};

const JS_STR_METHODS = {
  toUpperCase: s => s.toUpperCase(),
  toLowerCase: s => s.toLowerCase(),
  trim: s => s.trim(),
  split: (s, [sep]) => (sep === undefined ? [s] : s.split(jsToString(sep))),
  includes: (s, [x]) => s.includes(jsToString(x)),
  indexOf: (s, [x]) => s.indexOf(jsToString(x)),
  repeat: (s, [n]) => s.repeat(Math.max(0, jsNum(n))),
  charAt: (s, [i]) => s.charAt(jsNum(i ?? 0)),
  slice: (s, [a, b]) => s.slice(a, b),
  substring: (s, [a, b]) => s.substring(a, b),
  startsWith: (s, [x]) => s.startsWith(jsToString(x)),
  endsWith: (s, [x]) => s.endsWith(jsToString(x)),
  replace: (s, [a, b]) => s.replace(jsToString(a), jsToString(b)),
  replaceAll: (s, [a, b]) => s.split(jsToString(a)).join(jsToString(b)),
  padStart: (s, [n, ch]) => s.padStart(jsNum(n), ch === undefined ? ' ' : jsToString(ch)),
  padEnd: (s, [n, ch]) => s.padEnd(jsNum(n), ch === undefined ? ' ' : jsToString(ch)),
  at: (s, [i]) => s.at(jsNum(i)),
  concat: (s, args) => s + args.map(jsToString).join(''),
};

const JS_ARRAY_METHODS = {
  push: (a, xs) => a.push(...xs),
  pop: a => a.pop(),
  shift: a => a.shift(),
  unshift: (a, xs) => a.unshift(...xs),
  includes: (a, [x]) => a.includes(x),
  indexOf: (a, [x]) => a.indexOf(x),
  join: (a, [sep]) => a.map(x => (x == null ? '' : jsToString(x))).join(sep === undefined ? ',' : jsToString(sep)),
  slice: (a, [x, y]) => a.slice(x, y),
  reverse: a => a.reverse(),
  concat: (a, xs) => a.concat(...xs),
  at: (a, [i]) => a.at(jsNum(i)),
};

// Array methods that call back into user functions must be generators.
const JS_ARRAY_GEN_METHODS = {
  *sort(a, [cmp]) {
    if (!cmp) return a.sort((x, y) => (jsToString(x) < jsToString(y) ? -1 : jsToString(x) > jsToString(y) ? 1 : 0));
    for (let i = 1; i < a.length; i++) {
      for (let j = i; j > 0; j--) {
        const r = jsNum(yield* this.callValue(cmp, [a[j - 1], a[j]], {}, { line: 0, fn: { k: 'name', id: 'compare' } }));
        if (!(r > 0)) break;
        [a[j - 1], a[j]] = [a[j], a[j - 1]];
      }
    }
    return a;
  },
  *forEach(a, [fn]) {
    for (let i = 0; i < a.length; i++) yield* this.callValue(fn, [a[i], i, a], {}, { line: 0, fn: { k: 'name', id: 'callback' } });
    return undefined;
  },
  *map(a, [fn]) {
    const out = [];
    for (let i = 0; i < a.length; i++) out.push(yield* this.callValue(fn, [a[i], i, a], {}, { line: 0, fn: { k: 'name', id: 'callback' } }));
    return out;
  },
  *filter(a, [fn]) {
    const out = [];
    for (let i = 0; i < a.length; i++) {
      if (this.truthy(yield* this.callValue(fn, [a[i], i, a], {}, { line: 0, fn: { k: 'name', id: 'callback' } }))) out.push(a[i]);
    }
    return out;
  },
};

const JS_NUM_METHODS = {
  toFixed: (n, [d]) => n.toFixed(jsNum(d ?? 0)),
  toString: n => String(n),
};

function bindMethod(table, name, self, gen = false) {
  const fn = table[name];
  if (gen) return new Builtin(name, function* (args, kw, line, me) {
    return yield* fn.call(this, me, args, kw, line);
  }, { self, gen: true });
  return new Builtin(name, function (args, kw, line, me) {
    return fn.call(this, me, args, kw, line);
  }, { self });
}

// ---------- member access and indexing ----------
Object.assign(Machine.prototype, {
  getMember(obj, prop, line) {
    if (obj instanceof TurtleObj) return this.getMember(this.turtleModule, prop, line);
    if (obj instanceof Module) {
      if (Object.prototype.hasOwnProperty.call(obj.members, prop)) return obj.members[prop];
      if (this.py) throw this.error('AttributeError', `module '${obj.name}' has no attribute '${prop}'`, line);
      return undefined;
    }
    return this.py ? this.pyMember(obj, prop, line) : this.jsMember(obj, prop, line);
  },

  pyMember(obj, prop, line) {
    const table = typeof obj === 'string' ? PY_STR_METHODS : Array.isArray(obj) ? PY_LIST_METHODS : obj instanceof Map ? PY_DICT_METHODS : null;
    if (table && Object.prototype.hasOwnProperty.call(table, prop)) return bindMethod(table, prop, obj);
    if (typeof obj === 'string' && prop === 'format') return new Builtin('format', args => pyFormatMethod(obj, args), { self: obj });
    throw this.error('AttributeError', `'${pyTypeName(obj)}' object has no attribute '${prop}'`, line);
  },

  jsMember(obj, prop, line) {
    if (obj == null) throw this.error('TypeError', `Cannot read properties of ${obj} (reading '${prop}')`, line);
    const has = (t, p) => Object.prototype.hasOwnProperty.call(t, p);
    if (typeof obj === 'string') {
      if (prop === 'length') return obj.length;
      return has(JS_STR_METHODS, prop) ? bindMethod(JS_STR_METHODS, prop, obj) : undefined;
    }
    if (Array.isArray(obj)) {
      if (prop === 'length') return obj.length;
      if (has(JS_ARRAY_GEN_METHODS, prop)) return bindMethod(JS_ARRAY_GEN_METHODS, prop, obj, true);
      return has(JS_ARRAY_METHODS, prop) ? bindMethod(JS_ARRAY_METHODS, prop, obj) : undefined;
    }
    if (typeof obj === 'number') return has(JS_NUM_METHODS, prop) ? bindMethod(JS_NUM_METHODS, prop, obj) : undefined;
    if (obj instanceof Map) return obj.get(prop);
    if (obj instanceof UserFn && prop === 'name') return obj.name;
    return undefined;
  },

  setMember(obj, prop, value, line) {
    if (!this.py && obj instanceof Map) {
      obj.set(prop, value);
      return;
    }
    if (!this.py && obj == null) throw this.error('TypeError', `Cannot set properties of ${obj} (setting '${prop}')`, line);
    if (!this.py) return;
    throw this.error('AttributeError', `'${pyTypeName(obj)}' object has no attribute '${prop}'`, line);
  },

  getIndex(obj, idx, line) {
    return this.py ? this.pyIndex(obj, idx, line) : this.jsIndex(obj, idx, line);
  },

  pyIndex(obj, idx, line) {
    if (Array.isArray(obj) || typeof obj === 'string' || obj instanceof PyRange) {
      const kind = Array.isArray(obj) ? 'list' : typeof obj === 'string' ? 'string' : 'range';
      if (!(typeof idx === 'number' || typeof idx === 'boolean')) {
        throw this.error('TypeError', `${kind} indices must be integers or slices, not ${pyTypeName(idx)}`, line);
      }
      const i = num(idx) < 0 ? obj.length + num(idx) : num(idx);
      if (i < 0 || i >= obj.length) throw this.error('IndexError', `${kind} index out of range`, line);
      return obj instanceof PyRange ? obj.at(i) : obj[i];
    }
    if (obj instanceof Map) {
      const key = this.key(idx, line);
      if (!obj.has(key)) throw this.error('KeyError', pyRepr(idx), line);
      return obj.get(key);
    }
    throw this.error('TypeError', `'${pyTypeName(obj)}' object is not subscriptable`, line);
  },

  jsIndex(obj, idx, line) {
    if (obj == null) throw this.error('TypeError', `Cannot read properties of ${obj} (reading '${jsToString(idx)}')`, line);
    if (Array.isArray(obj) || typeof obj === 'string') {
      if (typeof idx === 'number') return obj[idx];
      return idx === 'length' ? obj.length : undefined;
    }
    if (obj instanceof Map) return obj.get(jsToString(idx));
    return undefined;
  },

  setIndex(obj, idx, value, line) {
    if (this.py && Array.isArray(obj)) {
      const i = num(idx) < 0 ? obj.length + num(idx) : num(idx);
      if (typeof num(idx) !== 'number' || i < 0 || i >= obj.length) throw this.error('IndexError', 'list assignment index out of range', line);
      obj[i] = value;
    } else if (obj instanceof Map) {
      obj.set(this.key(idx, line), value);
    } else if (!this.py && Array.isArray(obj)) {
      const i = jsNum(idx);
      while (obj.length < i) obj.push(undefined);
      obj[i] = value;
    } else if (!this.py && obj == null) {
      throw this.error('TypeError', `Cannot set properties of ${obj} (setting '${jsToString(idx)}')`, line);
    } else if (this.py) {
      throw this.error('TypeError', `'${pyTypeName(obj)}' object does not support item assignment`, line);
    }
  },

  doImport(s, env) {
    const mod = this.modules[s.mod];
    if (!mod) throw this.error('ModuleNotFoundError', `No module named '${s.mod}'`, s.line);
    if (!s.names) {
      this.setName(s.alias, mod, env, null, s.line);
      return;
    }
    const pairs = s.names === '*' ? Object.keys(mod.members).map(n => [n, n]) : s.names;
    pairs.forEach(([n, alias]) => {
      if (!(n in mod.members)) throw this.error('ImportError', `cannot import name '${n}' from '${s.mod}'`, s.line);
      this.setName(alias, mod.members[n], env, null, s.line);
    });
  },
});

// "Hi {}, you are {}".format(name, age) and {0}/{1} positions.
function pyFormatMethod(template, args) {
  let auto = 0;
  return template.replace(/\{\{|\}\}|\{(\d*)(?::([^}]*))?\}/g, (m, pos, spec) => {
    if (m === '{{') return '{';
    if (m === '}}') return '}';
    const v = args[pos === '' ? auto++ : Number(pos)];
    return formatSpec(v, spec, pyStr);
  });
}

// ---------- entry points: run to the end, or record every step ----------
function miniErrorInfo(e) {
  if (e instanceof MiniError) return { type: e.type, message: e.message, line: e.line || 0 };
  if (e instanceof RangeError) return { type: 'RecursionError', message: 'maximum recursion depth exceeded', line: 0 };
  return { type: 'InternalError', message: String((e && e.message) || e), line: 0 };
}

function runMini(code, lang, opts = {}) {
  const t0 = performance.now();
  let m = null;
  let error = null;
  try {
    const prog = parseProgram(code, lang);
    m = new Machine(prog, { ...opts, deadline: t0 + (opts.timeLimit || 3000) });
    const it = m.run();
    while (!it.next().done);
  } catch (e) {
    error = miniErrorInfo(e);
  }
  return {
    ok: !error,
    error,
    out: m ? m.out : [],
    turtle: m ? m.turtle : [],
    asks: m ? m.asks : 0,
    inputMissing: m ? m.inputMissing : false,
    steps: m ? m.steps : 0,
    engine: 'mini',
    ms: Math.round(performance.now() - t0),
  };
}

function traceMini(code, lang, opts = {}) {
  const maxSnaps = opts.maxSnaps || 1500;
  const t0 = performance.now();
  const snaps = [];
  let m = null;
  let error = null;
  let truncated = false;
  try {
    m = new Machine(parseProgram(code, lang), { ...opts, deadline: t0 + (opts.timeLimit || 3000) });
    const it = m.run();
    for (let r = it.next(); !r.done; r = it.next()) {
      if (snaps.length >= maxSnaps) {
        truncated = true;
        break;
      }
      snaps.push(m.snapshot(r.value));
    }
  } catch (e) {
    error = miniErrorInfo(e);
  }
  if (m) snaps.push({ ...m.snapshot(null), end: true, error });
  const outText = m ? m.out.map(c => c.s).join('') : '';
  return { ok: !error, error, snaps, truncated, out: m ? m.out : [], outText, turtle: m ? m.turtle : [] };
}

// =====================================================================
// Editor: transparent <textarea> over a highlighted layer
// =====================================================================
const PAIRS = { '(': ')', '[': ']', '{': '}', '"': '"', "'": "'", '`': '`' };
const OPENERS = '([{';
const CLOSERS_STR = ')]}';

// Token to CSS class, looking ahead for "name(" to colour function calls.
function tokenClasses(toks, lang) {
  return toks.map((tk, i) => {
    if (tk.t === 'kw') return 't-kw';
    if (tk.t === 'num') return 't-num';
    if (tk.t === 'comment') return 't-com';
    if (tk.t === 'str' || tk.t === 'tpl' || tk.t === 'fstr') return tk.bad ? 't-str t-bad' : 't-str';
    if (tk.t === 'op') return 't-op';
    if (tk.t === 'bad') return 't-bad';
    if (tk.t !== 'name') return '';
    let j = i + 1;
    while (toks[j] && toks[j].t === 'ws') j++;
    if (toks[j] && toks[j].v === '(') return BUILTIN_NAMES[lang].has(tk.v) || TURTLE_ALIASES[tk.v] ? 't-bi' : 't-fn';
    return BUILTIN_NAMES[lang].has(tk.v) ? 't-bi' : '';
  });
}

// Highlighted HTML split into lines, with decorations [{s, e, cls}] layered on top.
function highlightHTML(src, lang, decos = [], lineCls = {}) {
  const toks = scanCode(src, lang);
  const classes = tokenClasses(toks, lang);
  const cuts = new Set([0, src.length]);
  toks.forEach(tk => {
    cuts.add(tk.start);
    cuts.add(tk.end);
  });
  decos.forEach(d => {
    cuts.add(d.s);
    cuts.add(d.e);
  });
  const pts = [...cuts].sort((a, b) => a - b);
  const lines = [''];
  let ti = 0;
  for (let k = 0; k < pts.length - 1; k++) {
    const a = pts[k];
    const b = pts[k + 1];
    while (ti < toks.length - 1 && toks[ti].end <= a) ti++;
    const cls = [classes[ti] || '', ...decos.filter(d => d.s <= a && d.e >= b).map(d => d.cls)].join(' ').trim();
    src.slice(a, b).split('\n').forEach((part, idx) => {
      if (idx > 0) lines.push('');
      if (part) lines[lines.length - 1] += cls ? `<span class="${cls}">${esc(part)}</span>` : esc(part);
    });
  }
  return lines.map((html, i) => `<span class="ln ${lineCls[i + 1] || ''}">${html}</span>`).join('');
}

class CodeEditor {
  constructor(root, opts = {}) {
    this.root = root;
    this.opts = opts;
    this.lang = 'js';
    this.marks = { err: null, step: null };
    this.findState = { q: '', matches: [], cur: -1 };
    this.bracket = null;
    this.autoClose = true;
    root.innerHTML = `<div class="ed-gutter" aria-hidden="true"><div class="in"></div></div>
      <div class="ed-main"><pre class="ed-hl" aria-hidden="true"><div class="in"></div></pre>
      <textarea class="ed-ta" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea></div>`;
    this.gutter = root.querySelector('.ed-gutter .in');
    this.hl = root.querySelector('.ed-hl .in');
    this.ta = root.querySelector('.ed-ta');
    this.bind();
  }

  bind() {
    const ta = this.ta;
    ta.addEventListener('input', () => {
      this.marks.err = null;
      this.render();
      if (this.opts.onChange) this.opts.onChange(ta.value);
    });
    ta.addEventListener('scroll', () => this.syncScroll());
    ta.addEventListener('keydown', e => this.onKey(e));
    const caret = () => requestAnimationFrame(() => this.onCaret());
    ta.addEventListener('click', caret);
    ta.addEventListener('keyup', caret);
    ta.addEventListener('focus', caret);
  }

  get value() {
    return this.ta.value;
  }

  setValue(code, lang) {
    if (lang) this.lang = lang;
    this.ta.value = code;
    this.marks = { err: null, step: null };
    this.bracket = null;
    this.ta.scrollTop = 0;
    this.ta.scrollLeft = 0;
    this.render();
    this.syncScroll();
  }

  setLabel(text) {
    this.ta.setAttribute('aria-label', text);
  }

  setFont(px) {
    this.root.style.setProperty('--ed-fs', px + 'px');
    this.root.style.setProperty('--ed-lh', Math.round(px * 1.6) + 'px');
  }

  setMarks(marks) {
    Object.assign(this.marks, marks);
    this.render();
    const line = marks.step || marks.err;
    if (line) this.revealLine(line);
  }

  cursor() {
    const before = this.ta.value.slice(0, this.ta.selectionStart);
    const line = before.split('\n').length;
    return { line, col: before.length - before.lastIndexOf('\n') };
  }

  // ---------- rendering ----------
  render() {
    const src = this.ta.value;
    const lineCls = {};
    const cur = document.activeElement === this.ta ? this.cursor().line : 0;
    if (cur) lineCls[cur] = 'cur';
    if (this.marks.step) lineCls[this.marks.step] = 'step';
    if (this.marks.err) lineCls[this.marks.err] = 'err';
    const decos = this.findState.matches.map((m, i) => ({ s: m, e: m + this.findState.q.length, cls: i === this.findState.cur ? 'd-cur' : 'd-find' }));
    if (this.bracket) this.bracket.forEach(p => decos.push({ s: p, e: p + 1, cls: 'd-br' }));
    this.hl.innerHTML = highlightHTML(src, this.lang, decos, lineCls);
    const n = src.split('\n').length;
    let g = '';
    for (let i = 1; i <= n; i++) g += `<span class="gl ${lineCls[i] || ''}">${i}</span>`;
    this.gutter.innerHTML = g;
  }

  syncScroll() {
    const { scrollTop: st, scrollLeft: sl } = this.ta;
    this.hl.style.transform = `translate(${-sl}px, ${-st}px)`;
    this.gutter.style.transform = `translateY(${-st}px)`;
  }

  lineHeight() {
    return parseFloat(getComputedStyle(this.ta).lineHeight) || 24;
  }

  revealLine(line) {
    const lh = this.lineHeight();
    const top = (line - 1) * lh;
    const h = this.ta.clientHeight;
    if (top < this.ta.scrollTop || top > this.ta.scrollTop + h - lh * 2) this.ta.scrollTop = Math.max(0, top - h / 2);
    this.syncScroll();
  }

  focusLine(line) {
    const lines = this.ta.value.split('\n');
    const start = lines.slice(0, line - 1).reduce((a, l) => a + l.length + 1, 0);
    this.ta.focus();
    this.ta.setSelectionRange(start, start + (lines[line - 1] || '').length);
    this.revealLine(line);
  }

  onCaret() {
    this.bracket = this.matchBracket();
    this.render();
    if (this.opts.onCursor) this.opts.onCursor(this.cursor());
  }

  // Find the partner of a bracket next to the caret, skipping strings and comments.
  matchBracket() {
    const p = this.ta.selectionStart;
    if (p !== this.ta.selectionEnd) return null;
    const toks = scanCode(this.ta.value, this.lang).filter(t => t.t === 'op' && (OPENERS + CLOSERS_STR).includes(t.v));
    const at = toks.findIndex(t => t.start === p - 1 || t.start === p);
    if (at < 0) return null;
    const tk = toks[at];
    const forward = OPENERS.includes(tk.v);
    let depth = 0;
    for (let i = at; forward ? i < toks.length : i >= 0; i += forward ? 1 : -1) {
      depth += OPENERS.includes(toks[i].v) ? (forward ? 1 : -1) : (forward ? -1 : 1);
      if (depth === 0) return [tk.start, toks[i].start];
    }
    return null;
  }
}

// ---------- editing behaviour (keys) ----------
Object.assign(CodeEditor.prototype, {
  indentUnit() {
    return this.lang === 'py' ? '    ' : '  ';
  },

  insert(text, selectStart = null, selectEnd = null) {
    const ta = this.ta;
    ta.focus();
    let ok = false;
    try {
      ok = document.execCommand('insertText', false, text);
    } catch {
      ok = false;
    }
    if (!ok) {
      ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, 'end');
      ta.dispatchEvent(new Event('input'));
    }
    if (selectStart != null) ta.setSelectionRange(selectStart, selectEnd ?? selectStart);
  },

  onKey(e) {
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key === 'Enter') {
      e.preventDefault();
      e.stopPropagation();
      if (this.opts.onRun) this.opts.onRun();
      return;
    }
    if (mod && (e.key === 'f' || e.key === 'F')) {
      e.preventDefault();
      if (this.opts.onFind) this.opts.onFind();
      return;
    }
    if (mod && e.key === '/') {
      e.preventDefault();
      this.toggleComment();
      return;
    }
    if (e.key === 'Tab' && !mod && !e.altKey) {
      if (e.shiftKey || this.ta.selectionStart !== this.ta.selectionEnd) {
        e.preventDefault();
        this.shiftLines(e.shiftKey ? -1 : 1);
      } else if (!this.opts.tabEscapes || !this.opts.tabEscapes()) {
        e.preventDefault();
        this.insert(this.indentUnit());
      }
      return;
    }
    if (e.key === 'Enter' && !mod && !e.shiftKey && !e.altKey) {
      e.preventDefault();
      this.newline();
      return;
    }
    if (e.key === 'Backspace' && this.deletePair()) {
      e.preventDefault();
      return;
    }
    if (this.autoClose && e.key.length === 1 && !mod && !e.altKey && this.typePair(e.key)) e.preventDefault();
  },

  // Keep the current indent, add a level after "{" or ":", dedent after return/pass/break.
  newline() {
    const { value, selectionStart: s, selectionEnd: end } = this.ta;
    const lineStart = value.lastIndexOf('\n', s - 1) + 1;
    const line = value.slice(lineStart, s);
    const base = line.match(/^[ \t]*/)[0];
    const trimmed = line.replace(/(#|\/\/).*$/, '').trimEnd();
    const unit = this.indentUnit();
    const opens = this.lang === 'py' ? /:$/.test(trimmed) : /[{([]$/.test(trimmed);
    let indent = opens ? base + unit : base;
    if (this.lang === 'py' && /^\s*(return|pass|break|continue)\b/.test(line)) indent = base.slice(0, Math.max(0, base.length - 4));
    const next = value[end] || '';
    if (opens && this.lang === 'js' && CLOSERS_STR.includes(next)) {
      const caret = s + 1 + indent.length;
      this.insert('\n' + indent + '\n' + base, caret);
      return;
    }
    this.insert('\n' + indent);
  },

  typePair(ch) {
    const ta = this.ta;
    const { value, selectionStart: s, selectionEnd: end } = ta;
    const next = value[end] || '';
    const prev = value[s - 1] || '';
    const isQuote = ch === '"' || ch === "'" || (ch === '`' && this.lang === 'js');
    if ((CLOSERS_STR.includes(ch) || isQuote) && next === ch && s === end) {
      ta.setSelectionRange(s + 1, s + 1);
      return true;
    }
    if (!PAIRS[ch] || (ch === '`' && this.lang !== 'js')) return false;
    if (isQuote && /[\p{L}\p{N}_]/u.test(prev)) return false;
    if (s !== end) {
      const sel = value.slice(s, end);
      this.insert(ch + sel + PAIRS[ch], s + 1, end + 1);
      return true;
    }
    if (next && /[\p{L}\p{N}_]/u.test(next)) return false;
    this.insert(ch + PAIRS[ch], s + 1);
    return true;
  },

  deletePair() {
    const { value, selectionStart: s, selectionEnd: end } = this.ta;
    if (s !== end || s === 0) return false;
    const prev = value[s - 1];
    if (!PAIRS[prev] || value[s] !== PAIRS[prev]) return false;
    this.ta.setSelectionRange(s - 1, s + 1);
    this.insert('');
    return true;
  },

  selectedLines() {
    const { value, selectionStart: s, selectionEnd: e } = this.ta;
    const start = value.lastIndexOf('\n', s - 1) + 1;
    let stop = value.indexOf('\n', e > s && value[e - 1] === '\n' ? e - 1 : e);
    if (stop < 0) stop = value.length;
    return { start, stop, lines: value.slice(start, stop).split('\n') };
  },

  replaceLines(start, stop, lines) {
    const text = lines.join('\n');
    this.ta.setSelectionRange(start, stop);
    this.insert(text, start, start + text.length);
  },

  shiftLines(dir) {
    const { start, stop, lines } = this.selectedLines();
    const unit = this.indentUnit();
    const out = lines.map(l => {
      if (dir > 0) return unit + l;
      const cut = Math.min(unit.length, l.match(/^ */)[0].length);
      return l.slice(cut);
    });
    this.replaceLines(start, stop, out);
  },

  toggleComment() {
    const { start, stop, lines } = this.selectedLines();
    const mark = this.lang === 'py' ? '# ' : '// ';
    const bare = mark.trim();
    const allCommented = lines.filter(l => l.trim()).every(l => l.trim().startsWith(bare));
    const out = lines.map(l => {
      if (!l.trim()) return l;
      if (allCommented) return l.replace(new RegExp('^(\\s*)' + bare.replace(/\//g, '\\/') + ' ?'), '$1');
      return l.replace(/^(\s*)/, '$1' + mark);
    });
    this.replaceLines(start, stop, out);
  },
});

// ---------- find ----------
Object.assign(CodeEditor.prototype, {
  setFind(q) {
    const matches = [];
    if (q) {
      const hay = this.ta.value.toLowerCase();
      const needle = q.toLowerCase();
      let i = hay.indexOf(needle);
      while (i >= 0 && matches.length < 500) {
        matches.push(i);
        i = hay.indexOf(needle, i + needle.length);
      }
    }
    this.findState = { q, matches, cur: matches.length ? 0 : -1 };
    this.render();
    if (matches.length) this.revealOffset(matches[0]);
    return matches.length;
  },

  findStep(dir) {
    const f = this.findState;
    if (!f.matches.length) return;
    f.cur = (f.cur + dir + f.matches.length) % f.matches.length;
    const at = f.matches[f.cur];
    this.ta.setSelectionRange(at, at + f.q.length);
    this.render();
    this.revealOffset(at);
  },

  revealOffset(offset) {
    this.revealLine(this.ta.value.slice(0, offset).split('\n').length);
  },

  clearFind() {
    this.findState = { q: '', matches: [], cur: -1 };
    this.render();
  },
});

// =====================================================================
// Turtle graphics: commands, then drawing ops (pure), then an animated canvas
// =====================================================================
const TURTLE_WORLD = 400;

function turtleColor(args, fallback) {
  if (!args.length) return fallback;
  if (args.length >= 3 && args.slice(0, 3).every(a => typeof a === 'number')) {
    const scale = args.slice(0, 3).every(a => a <= 1) ? 255 : 1;
    return `rgb(${args.slice(0, 3).map(a => Math.round(a * scale)).join(',')})`;
  }
  return String(args[0]);
}

// Replays the command list with Python turtle's rules (heading 0 = east, left = anticlockwise).
function buildTurtleModel(cmds) {
  const s = { x: 0, y: 0, h: 0, pen: true, color: '#1d2b3a', fill: '#ffc83d', width: 2, visible: true };
  const ops = [];
  const cmdToOp = [];
  const stats = { lines: 0, turn: 0, colors: new Set() };
  let fillPts = null;
  const snap = () => ({ x: s.x, y: s.y, h: s.h, visible: s.visible });
  const go = dist => {
    const rad = (s.h * Math.PI) / 180;
    const nx = s.x + dist * Math.cos(rad);
    const ny = s.y + dist * Math.sin(rad);
