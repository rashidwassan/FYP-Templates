function renderPlan() {
  const today = todayIso();
  const left = Math.max(0, daysBetween(today, settings.examDate));
  const ready = overallReadiness();
  view.innerHTML = `${planKpisHtml(settings.examDate)}
  <div class="plan-layout">
    <section class="panel" aria-labelledby="weekTitle">
      <div class="weekbar">
        <button class="btn icon" id="wPrev" aria-label="Previous week">${ic('chevron-left')}</button>
        <button class="btn icon" id="wNext" aria-label="Next week">${ic('chevron-right')}</button>
        <button class="btn sm" id="wToday">${T('this_week')}</button>
        <h2 class="title" id="weekTitle"></h2>
        <span class="spacer"></span>
        <button class="btn sm" id="wPrint">${ic('printer')} ${T('print_week')}</button>
        <button class="btn sm" id="wIcs">${ic('download')} ${T('ics')}</button>
        <button class="btn sm primary" id="wRegen">${ic('refresh')} ${T('regenerate')}</button>
      </div>
      <div class="week stagger" id="week"></div>
      <p class="muted sm noprint" style="margin:10px 0 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap">${ic('move')} ${T('drag_hint')} <span class="tag vio">${T('revision_week')}</span> ${T('revision_week_note')}</p>
    </section>
    ${todayPanelHtml(today)}
  </div>`;
  countUp($('#kDays'), left);
  countUp($('#kStreak'), streak());
  countUp($('#kMins'), focusedTotal());
  countUp($('#kReady'), ready, { fmt: v => Math.round(v) + '%' });
  countUp($('#mReady'), ready, { fmt: v => Math.round(v) + '%' });
  requestAnimationFrame(() => ringSet($('#mRing'), ready / 100));
  const days = new Set(log.map(l => l.date));
  $('#streakDots').innerHTML = Array.from({ length: 14 }, (_, i) => {
    const d = addDays(today, i - 13);
    return `<i class="${days.has(d) ? (d === today ? 'hi' : 'on') : ''}" title="${d}"></i>`;
  }).join('');
  bindPlanControls(today);
  renderWeek();
  renderTodayList();
  renderTimer();
  animateIn(view);
}

function bindPlanControls(today) {
  $('#wPrev').onclick = () => {
    weekStart = addDays(weekStart, -7);
    renderWeek();
  };
  $('#wNext').onclick = () => {
    weekStart = addDays(weekStart, 7);
    renderWeek();
  };
  $('#wToday').onclick = () => {
    weekStart = mondayOf(today);
    renderWeek();
  };
  $('#wPrint').onclick = () => window.print();
  $('#wIcs').onclick = exportIcs;
  $('#wRegen').onclick = () => {
    const n = generatePlan();
    pushInbox({ k: 'plan_regen', p: { n }, icon: 'refresh', route: 'plan', key: 'regen:' + Date.now() });
    toast(`${n} ${t('sessions')} ${t('planned')}`, 'ok', 'sparkles');
    renderPlan();
  };
  $('#tPlay').onclick = () => (timer.running ? timerPause() : timerResume());
  $('#tReset').onclick = timerReset;
  $('#tSkipBrk').onclick = () => {
    timer.remaining = 0;
    timerEnd();
  };
  $('#tFinish').onclick = () => {
    const sid = timer.sid;
    timerReset();
    openRating(sid, 'done');
  };
  $('#tAdd').onclick = () => openAddSession(today);
}

function sessHtml(s) {
  const c = chById(s.ch);
  const sb = subjById(s.subj);
  if (!c) return '';
  const typeTag = s.type !== 'study' ? `<span class="tp ${s.type}">${t(s.type)}</span>` : '';
  const stateIcon = s.status !== 'todo' ? ic(STATUS_IC[s.status]) : s.moved ? ic('move') : '';
  return `<div class="sess ${s.status} ${s.type}" draggable="${s.status === 'todo'}" data-id="${s.id}" style="--sc:${sb.color}" role="button" tabindex="0" aria-label="${esc(c.name)}, ${esc(sb.name)}, ${s.mins} minutes">
    <div class="s"><span>${ic(sb.icon)} ${esc(subjName(sb))}</span>${typeTag}</div>
    <div class="c">${esc(c.name)}</div>
    <div class="m"><span>${ic('clock')} ${s.mins}m</span>${stateIcon}</div></div>`;
}

function dayHtml(d, today) {
  const list = sessionsOn(d);
  const mins = sum(list.filter(s => s.status !== 'skipped').map(s => s.mins));
  const off = capacity(d) === 0;
  const revStart = addDays(settings.examDate, -7);
  let label = '';
  if (d === settings.examDate) label = `<div class="empty">${ic('graduation')}${T('exam_day')}</div>`;
  else if (d < settings.examDate && d >= revStart) label = `<div class="sm" style="text-align:center;color:var(--p2);font-weight:700;padding:2px 0">${T('revision_week')}</div>`;
  let body = list.map(sessHtml).join('');
  if (!body && off && d < settings.examDate) body = `<div class="empty sm">${ic('coffee')}${T('day_off')}</div>`;
  else if (!body && d < settings.examDate && d >= today) body = `<div class="empty sm">${ic('sticky-note')}${T('free')}</div>`;
  const addBtn = d >= today ? `<button class="btn ghost icon noprint" data-add="${d}" aria-label="${esc(t('add_session'))}">${ic('plus')}</button>` : '';
  const summary = mins ? `${fmtMin(mins)} - ${list.length} ${t('sessions')}` : '';
  return `<div class="day ${d === today ? 'today' : ''} ${off ? 'off' : ''} ${d < today ? 'past' : ''}" data-date="${d}">
    <div class="dh"><b>${esc(dayName(d))}</b><span class="d">${esc(fmtD(d))}</span></div>${label}${body}
    <div class="mins"><span>${summary}</span>${addBtn}</div></div>`;
}

function renderWeek() {
  const today = todayIso();
  const end = addDays(weekStart, 6);
  $('#weekTitle').textContent = `${fmtD(weekStart)} - ${fmtD(end, { day: 'numeric', month: 'short', year: 'numeric' })}`;
  const week = $('#week');
  week.innerHTML = Array.from({ length: 7 }, (_, i) => dayHtml(addDays(weekStart, i), today)).join('');
  $$('.sess', week).forEach(el => {
    el.onclick = () => openSession(el.dataset.id);
    el.onkeydown = e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openSession(el.dataset.id);
      }
    };
    el.ondragstart = e => {
      e.dataTransfer.setData('text/plain', el.dataset.id);
      e.dataTransfer.effectAllowed = 'move';
      el.classList.add('dragging');
    };
    el.ondragend = () => el.classList.remove('dragging');
  });
  $$('[data-add]', week).forEach(b => {
    b.onclick = () => openAddSession(b.dataset.add);
  });
  bindDropTargets(week, today);
  [...week.children].forEach((el, i) => el.style.setProperty('--i', i));
  // on phones the week is a horizontal scroller: bring today into view without scrolling the page
  const tcol = $('.day.today', week);
  if (tcol && window.innerWidth <= 860) week.scrollLeft = Math.max(0, tcol.offsetLeft - 16);
}

function bindDropTargets(week, today) {
  $$('.day', week).forEach(col => {
    col.ondragover = e => {
      if (col.dataset.date >= today) {
        e.preventDefault();
        col.classList.add('over');
      }
    };
    col.ondragleave = () => col.classList.remove('over');
    col.ondrop = e => {
      e.preventDefault();
      col.classList.remove('over');
      if (moveSession(e.dataTransfer.getData('text/plain'), col.dataset.date)) {
        toast(t('moved'), 'ok', 'move');
        renderWeek();
        renderTodayList();
      }
    };
  });
}

function renderTodayList() {
  const today = todayIso();
  const list = sessionsOn(today);
  const times = sessionTimes(today);
  const rowHtml = s => {
    const c = chById(s.ch);
    const sb = subjById(s.subj);
    const tm = times[s.id];
    const actions = s.status === 'todo'
      ? `<button class="btn icon sm primary" data-start="${s.id}" aria-label="${esc(t('start'))} ${esc(c.name)}">${ic('play')}</button><button class="btn icon sm" data-open="${s.id}" aria-label="${esc(t('edit'))} ${esc(c.name)}">${ic('edit')}</button>`
      : `<span style="color:${s.status === 'done' ? 'var(--ok)' : 'var(--muted)'}">${ic(STATUS_IC[s.status])}</span>`;
    return `<div class="trow ${s.status}" style="--sc:${sb.color}"><span class="dot"></span>
      <div class="t"><b>${esc(c.name)}</b><span>${esc(subjName(sb))} - ${s.mins} min${s.type !== 'study' ? ' - ' + t(s.type) : ''}</span></div>
      <span class="tm">${fmtClock(tm.start)}</span>${actions}</div>`;
  };
  $('#tList').innerHTML = list.length ? list.map(rowHtml).join('') : `<div class="empty">${ic('coffee')}${T('no_sessions')}</div>`;
  $$('[data-start]').forEach(b => {
    b.onclick = () => {
      timerStart(b.dataset.start);
      $('#tTime').scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
  });
  $$('[data-open]').forEach(b => {
    b.onclick = () => openSession(b.dataset.open);
  });
}

// ---------- Subjects view: readiness rings · what-if · weightage heatmaps ----------
const lerp = (a, b, f) => Math.round(a + (b - a) * f);
const heatColor = f => `rgb(${lerp(238, 79, f)},${lerp(242, 70, f)},${lerp(255, 229, f)})`;

function ringCard(label, pct, color, cls = '') {
  return `<div class="rcard ${cls}"><div class="wrap">
    <svg viewBox="0 0 60 60" aria-hidden="true"><circle class="bg" cx="30" cy="30" r="25"/><circle class="fg" cx="30" cy="30" r="25" data-frac="${pct / 100}" style="stroke:${color}"/></svg>
    <div class="num" data-count="${pct}">0%</div></div><div class="nm" title="${esc(label)}">${esc(label)}</div></div>`;
}

function whatIfHtml() {
  return `<section class="panel"><h2>${ic('sliders')} ${T('what_if')} <span id="wiH" style="color:var(--p)">${settings.hrsWd}</span> ${T('hours_day')}?</h2>
    <input type="range" id="wiRange" min="0.5" max="10" step="0.5" value="${settings.hrsWd}" aria-label="Hours per day" style="margin:10px 0">
    <div class="whatif">
      <div><div class="muted sm">${T('projected')}</div><div class="big" id="wiProj">0%</div><div class="bar" style="margin-top:6px"><i id="wiBar" style="background:var(--grad)"></i></div></div>
      <div><div class="muted sm">${T('coverage')}</div><div class="big" id="wiCov">0%</div><div class="muted sm" id="wiNote"></div></div>
    </div>
    <p class="muted sm i18n" style="margin:10px 0 0">${esc(tf('model_note', { m: MIN_PER_UNIT }))}</p>
  </section>`;
}

function perSubjectHtml(ss) {
  const per = sessionsPerSubject();
  const maxPer = Math.max(1, ...Object.values(per));
  const rows = ss.map(s => `<div class="hbar"><span class="nm">${esc(subjName(s))}</span><div class="bar"><i style="--sc:${s.color};width:0" data-w="${((per[s.id] || 0) / maxPer) * 100}"></i></div><b>${per[s.id] || 0}</b></div>`).join('');
  return `<section class="panel"><h2>${ic('bar-chart')} ${T('per_subject')}</h2><div style="margin-top:10px">${rows}</div>
    <p class="muted sm" style="margin:10px 0 0">${T('focused')}: <b>${focusedTotal().toLocaleString('en-PK')}</b> - ${T('streak')}: <b>${streak()}</b></p></section>`;
}

function tileHtml(c, maxW) {
  const f = W(c) / maxW;
  const m = M(c);
  const dots = [1, 2, 3, 4, 5].map(i => `<i class="${m >= i - 0.25 ? 'on' : ''}"></i>`).join('');
  return `<button class="tile ${f > 0.55 ? 'dark' : ''}" style="background:${heatColor(f)}" data-ch="${c.id}" aria-label="${esc(c.name)}, ${t('weightage')} ${W(c)}%, ${t('difficulty')} ${D(c)}, ${t('mastery')} ${m}">
    <span class="n">${esc(c.name)}</span>
    <span class="f"><span>${W(c)}% <span class="muted">- D${D(c)}</span></span><span class="ms" title="${t('mastery')} ${m}/5">${dots}</span></span></button>`;
}

function subjectHeatHtml(s) {
  const maxW = Math.max(1, ...s.ch.map(W));
  const ready = subjReadiness(s);
  return `<section class="panel subj" style="--sc:${s.color}">
    <div class="sh"><span class="ico">${ic(s.icon)}</span>
      <h3>${esc(subjName(s))} <span class="muted sm">- ${s.ch.length} ${T('chapters')} - ${T('mastery')} ${Math.round(ready)}%</span></h3>
      <div class="bar" style="max-width:220px"><i data-w="${ready}"></i></div></div>
    <div class="heat">${s.ch.map(c => tileHtml(c, maxW)).join('')}</div></section>`;
}

function renderSubjects() {
  const ss = subjects();
  const bankNote = `${paperBank(ss[0].id, settings.board).length} ${t('paper')} x BISE ${esc(settings.board)}`;
  view.innerHTML = `
  <div class="rings stagger">${ringCard(t('readiness'), overallReadiness(), '#fff', 'all')}${ss.map(s => ringCard(subjName(s), subjReadiness(s), s.color)).join('')}</div>
  <div class="two" style="margin-bottom:16px">${whatIfHtml()}${perSubjectHtml(ss)}</div>
  <div class="legend" style="margin-bottom:10px">${ic('info')} ${T('heat_hint')} <span class="sw"></span> ${T('weightage')} <span class="tag">${bankNote}</span></div>
  <div class="stagger">${ss.map(subjectHeatHtml).join('')}</div>`;
  requestAnimationFrame(() => $$('.rcard .fg').forEach(el => ringSet(el, +el.dataset.frac)));
  growBars(view);
  $$('.rcard .num').forEach(el => countUp(el, +el.dataset.count, { fmt: v => Math.round(v) + '%' }));
  const updateWhatIf = () => {
    const h = +$('#wiRange').value;
    const p = projection(h);
    $('#wiH').textContent = h;
    $('#wiProj').textContent = Math.round(p.projected) + '%';
    $('#wiCov').textContent = Math.round(p.coverage) + '%';
    $('#wiBar').style.width = p.projected + '%';
    $('#wiNote').textContent = `${p.avail} h ${t('available')} - ${p.need} h ${t('needed')}`;
  };
  $('#wiRange').oninput = updateWhatIf;
  updateWhatIf();
  $$('.tile').forEach(b => {
    b.onclick = () => openChapter(b.dataset.ch);
  });
  animateIn(view);
}

function openChapter(id) {
  const c = chById(id);
  if (!c) return;
  const sb = subjById(c.subj);
  const r = reviews.find(x => x.ch === id);
  const weak = weakCount(id);
  const flags = `${weak ? tf('flagged_weak', { n: weak }) : t('not_flagged')}${r ? ` - ${t('next_review')} ${fmtD(r.due)}` : ''}`;
  const diffLabels = ['Easy', 'Light', 'Medium', 'Hard', 'Very hard'];
  openModal({
    title: esc(c.name),
    body: `<p class="muted sm" style="margin:0 0 12px">${ic(sb.icon)} ${esc(subjName(sb))} - ${esc(flags)}</p>
    <div class="grid3">
      <div class="field"><label for="cW">${T('weightage')} %</label><input type="number" id="cW" min="0" max="100" step="1" value="${W(c)}"></div>
      <div class="field"><label for="cD">${T('difficulty')}</label><select id="cD">${[1, 2, 3, 4, 5].map(d => `<option value="${d}" ${d === D(c) ? 'selected' : ''}>${d} - ${diffLabels[d - 1]}</option>`).join('')}</select></div>
      <div class="field"><label for="cM">${T('mastery')} <b id="cMv">${M(c)}</b>/5</label><input type="range" id="cM" min="0" max="5" step="0.5" value="${M(c)}"></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="cSave">${ic('check')} ${T('save')}</button>
      <button class="btn" id="cReset">${ic('rotate')} ${T('default_weightage')} (${bankWeight(c)}%)</button>
      <button class="btn" id="cCards">${ic('layers')} ${T('nav_cards')}</button>
      <button class="btn ghost" id="cCancel">${T('cancel')}</button></div>`
  });
  $('#cM').oninput = e => {
    $('#cMv').textContent = e.target.value;
  };
  $('#cSave').onclick = () => {
    overrides[id] = { w: clamp(+$('#cW').value || 0, 0, 100), d: +$('#cD').value };
    setMastery(id, +$('#cM').value);
    saveAll();
    closeModal();
    toast(t('saved'), 'ok');
    route();
  };
  $('#cReset').onclick = () => {
    delete overrides[id];
    saveAll();
    closeModal();
    route();
  };
  $('#cCards').onclick = () => {
    closeModal();
    cardDeck = id;
    cardSession = null;
    location.hash = 'cards';
  };
  $('#cCancel').onclick = closeModal;
}

// ---------- Revise view: spaced-repetition queue ----------
function reviewRowHtml(r, rate, today) {
  const c = chById(r.ch);
  if (!c) return '';
  const sb = subjById(c.subj);
  const od = r.due < today;
  let when = esc(fmtD(r.due, { weekday: 'short', day: 'numeric', month: 'short' }));
  if (od) when = `<b style="color:var(--bad)">${t('overdue')} ${-daysBetween(today, r.due)}d</b>`;
  else if (r.due === today) when = t('due_today');
  const lastQ = r.hist?.length ? ` - ${t('last')} ${r.hist.at(-1)}/5` : '';
  const right = rate
    ? `<div class="rate" aria-label="${esc(t('rate'))}">${[1, 2, 3, 4, 5].map(q => `<button data-r="${r.id}" data-q="${q}" aria-label="${esc(confLabel(q))}">${q}</button>`).join('')}</div>`
    : `<span class="tag">+${r.interval}d</span>`;
  return `<div class="row ${od ? 'overdue' : ''}" style="--sc:${sb.color}"><span style="color:${sb.color}">${ic(sb.icon)}</span>
    <div class="t"><b>${esc(c.name)}</b><span>${esc(subjName(sb))} - ${t('step')} ${r.reps + 1}/5 - ${when}${lastQ}</span></div>${right}</div>`;
}

function renderRevise() {
  const today = todayIso();
  const due = dueReviews();
  const upcoming = reviews.filter(r => r.due > today).sort((a, b) => a.due.localeCompare(b.due)).slice(0, 12);
  const dueTag = `<span class="tag ${due.length ? 'bad' : ''}">${due.length}</span>`;
  view.innerHTML = `<div class="two">
    <section class="panel"><div class="phead"><h2>${ic('brain')} ${T('due_today')} ${dueTag}</h2><span class="muted sm i18n">${t('rate')}: 1 = ${esc(confLabel(1))} ... 5 = ${esc(confLabel(5))}</span></div>
      <div class="list stagger">${due.map(r => reviewRowHtml(r, true, today)).join('') || `<div class="empty">${ic('check-circle')}${T('nothing_due')}</div>`}</div></section>
    <div class="stack">
      <section class="panel"><h2>${ic('calendar')} ${T('upcoming')}</h2>
        <div class="list stagger" style="margin-top:10px">${upcoming.map(r => reviewRowHtml(r, false, today)).join('') || `<div class="empty sm">${ic('sticky-note')}${T('no_upcoming')}</div>`}</div></section>
      <section class="panel"><h2>${ic('help')} ${T('how_intervals')}</h2><p class="muted sm i18n" style="margin:8px 0 0">${esc(t('intervals_text'))}</p>
        <div class="actions"><a class="btn sm" href="#cards">${ic('layers')} ${T('practice_due')}</a></div></section>
    </div></div>`;
  $$('[data-r]').forEach(b => {
    b.onclick = () => {
      rateReview(b.dataset.r, +b.dataset.q);
      const r = reviews.find(x => x.id === b.dataset.r);
      toast(`${t('saved')} - +${r.interval}d`, 'ok', 'brain');
      renderRevise();
      updateNavBadges();
    };
  });
  animateIn(view);
}

// ---------- Cards view: Leitner flashcards per chapter ----------
const BOX_DAYS = [1, 2, 4, 7, 15];
let cardDeck = null;
let cardSession = null;
const cardsDue = list => list.filter(c => c.due <= todayIso());
const deckCards = chId => cards.filter(c => c.ch === chId);

function deckListHtml() {
  const byCh = {};
  cards.forEach(c => (byCh[c.ch] = byCh[c.ch] || []).push(c));
  const groups = subjects().map(s => {
    const chs = s.ch.filter(c => byCh[c.id]);
    if (!chs.length) return '';
    const decks = chs.map(c => {
      const list = byCh[c.id];
      const due = cardsDue(list).length;
      return `<button class="deck ${cardDeck === c.id ? 'on' : ''}" data-deck="${c.id}" style="--sc:${s.color}">
        <span style="color:${s.color}">${ic(s.icon)}</span>
        <span class="t"><b>${esc(c.name)}</b><span>${list.length} ${t('cards')}${due ? ` - <b style="color:var(--bad)">${due} ${t('due')}</b>` : ''}</span></span>
        ${ic('chevron-right')}</button>`;
    }).join('');
    return `<div class="dayhead">${esc(subjName(s))}</div><div class="list">${decks}</div>`;
  }).join('');
  return groups || `<div class="empty sm">${ic('layers')}${T('no_cards')}</div>`;
}

function addCardFormHtml() {
  const ss = subjects();
  const selected = cardDeck ? cardDeck.split(':')[0] : ss[0].id;
  return `<section class="panel"><h2>${ic('plus')} ${T('add_card')}</h2>
    <div class="grid2" style="margin-top:10px">
      <div class="field"><label for="ncSubj">${T('subject')}</label><select id="ncSubj">${ss.map(s => `<option value="${s.id}" ${s.id === selected ? 'selected' : ''}>${esc(subjName(s))}</option>`).join('')}</select></div>
      <div class="field"><label for="ncCh">${T('chapter')}</label><select id="ncCh"></select></div>
    </div>
    <div class="field" style="margin-top:10px"><label for="ncQ">${T('question')}</label><textarea id="ncQ" rows="2"></textarea></div>
    <div class="field" style="margin-top:10px"><label for="ncA">${T('answer')}</label><textarea id="ncA" rows="2"></textarea></div>
    <div class="actions"><button class="btn primary" id="ncAdd">${ic('check')} ${T('add')}</button></div></section>`;
}

function deckDetailHtml(chId) {
  const c = chById(chId);
  const list = deckCards(chId);
  const due = cardsDue(list).length;
  const rows = list.map(card => `<div class="cardrow">
      <div class="t"><b>${esc(card.q)}</b><span>${esc(card.a)}</span>
        <div style="display:flex;align-items:center;gap:8px;margin-top:6px"><span class="boxes" style="width:80px" title="${t('box')} ${card.box}/5">${[1, 2, 3, 4, 5].map(i => `<i class="${card.box >= i ? 'on' : ''}"></i>`).join('')}</span>
        <span class="muted sm">${t('box')} ${card.box} - ${t('due')} ${esc(fmtD(card.due))} - ${card.right}/${card.seen}</span></div></div>
      <button class="btn icon sm ghost" data-delcard="${card.id}" aria-label="${esc(t('delete'))}">${ic('trash')}</button></div>`).join('');
  return `<section class="panel"><div class="phead"><h2>${ic('layers')} ${esc(c ? c.name : chId)} <span class="tag">${list.length}</span>${due ? `<span class="tag bad">${due} ${t('due')}</span>` : ''}</h2>
      <button class="btn primary sm" id="pdStart" ${list.length ? '' : 'disabled'}>${ic('play')} ${T('practice')}</button></div>
    <div class="list">${rows || `<div class="empty sm">${ic('sticky-note')}${T('no_cards')}</div>`}</div></section>`;
}

function practiceHtml() {
  const s = cardSession;
  const card = s.queue[s.i];
  const c = chById(card.ch);
  return `<section class="panel">
    <div class="phead"><h2>${ic('brain')} ${T('practice')} <span class="tag">${s.i + 1}/${s.queue.length}</span></h2>
      <span class="muted sm">${s.right} ${t('cards_right')} - ${s.wrong} ${t('cards_wrong')}</span></div>
    <div class="bar" style="margin-bottom:12px"><i style="width:${(s.i / s.queue.length) * 100}%;background:var(--grad)"></i></div>
    <div class="fcard ${s.flipped ? 'flipped' : ''}" id="fcard" role="button" tabindex="0" aria-label="${esc(t('flip'))}">
      <div class="inner">
        <div class="face"><small>${esc(c ? c.name : '')} - ${T('question')}</small>${esc(card.q)}</div>
        <div class="face back"><small>${T('answer')}</small>${esc(card.a)}</div>
      </div></div>
    <p class="muted sm" style="text-align:center;margin:10px 0">${T('flip')} <span class="kbd">Space</span> - ${t('box')} ${card.box}/5</p>
    <div class="actions" style="justify-content:center">
      <button class="btn danger" id="fcWrong" ${s.flipped ? '' : 'disabled'}>${ic('x')} ${T('missed')} <span class="kbd">1</span></button>
      <button class="btn ok" id="fcRight" ${s.flipped ? '' : 'disabled'}>${ic('check')} ${T('got_it')} <span class="kbd">2</span></button>
      <button class="btn ghost" id="fcStop">${T('cancel')}</button></div></section>`;
}

function practiceSummaryHtml() {
  const s = cardSession;
  const ratio = s.queue.length ? s.right / s.queue.length : 0;
  return `<section class="panel" style="text-align:center">
    <h2 style="justify-content:center">${ic('award')} ${T('session_summary')}</h2>
    <div class="scorebig" style="margin:14px 0 4px;color:var(--p)">${Math.round(ratio * 100)}%</div>
    <p class="muted" style="margin:0 0 14px">${s.right} ${t('cards_right')} - ${s.wrong} ${t('cards_wrong')}${s.ratedQ ? ` - ${t('review')} ${s.ratedQ}/5` : ''}</p>
    <div class="actions" style="justify-content:center"><button class="btn primary" id="fcAgain">${ic('rotate')} ${T('practice')}</button><button class="btn" id="fcClose">${T('close')}</button></div></section>`;
}

function startPractice(chId) {
  const pool = chId ? deckCards(chId) : cardsDue(cards);
  if (!pool.length) {
    toast(chId ? t('no_cards') : t('nothing_due_cards'));
    return;
  }
  const queue = [...pool].sort((a, b) => a.due.localeCompare(b.due) || a.box - b.box).slice(0, 20);
  cardSession = { ch: chId, queue, i: 0, flipped: false, right: 0, wrong: 0, finished: false, ratedQ: 0 };
  renderCards();
}

function answerCard(ok) {
  const s = cardSession;
  if (!s || s.finished || !s.flipped) return;
  const card = s.queue[s.i];
  card.seen++;
  if (ok) {
    card.right++;
    card.box = Math.min(5, card.box + 1);
    s.right++;
  } else {
    card.box = 1;
    s.wrong++;
  }
  card.due = addDays(todayIso(), BOX_DAYS[card.box - 1]);
  s.i++;
  s.flipped = false;
  if (s.i >= s.queue.length) finishPractice();
  store.set('cards', cards);
  renderCards();
}

// A run of 5+ cards from one chapter rates that chapter's spaced review from recall.
function finishPractice() {
  const s = cardSession;
  s.finished = true;
  const chIds = [...new Set(s.queue.map(c => c.ch))];
  if (chIds.length === 1 && s.queue.length >= 5) {
    const ch = chIds[0];
    const ratio = s.right / s.queue.length;
    const q = clamp(1 + Math.round(ratio * 4), 1, 5);
    const c = chById(ch);
    if (c) setMastery(ch, M(c) + (q - M(c)) * 0.2);
    scheduleReview(ch);
    const r = reviews.find(x => x.ch === ch);
    if (r) rateReview(r.id, q, false);
    s.ratedQ = q;
    if (c) pushInbox({ k: 'practice_done', p: { c: c.name, r: s.right, w: s.wrong, q }, icon: 'layers', route: 'cards', key: 'practice:' + Date.now() });
  }
  saveAll();
  updateNavBadges();
}

function renderCards() {
  const due = cardsDue(cards).length;
  if (!cardDeck && cards.length) {
    const firstDue = cardsDue(cards)[0];
    cardDeck = (firstDue || cards[0]).ch;
  }
  let right;
  if (cardSession && !cardSession.finished) right = practiceHtml();
  else if (cardSession && cardSession.finished) right = practiceSummaryHtml();
  else if (cardDeck) right = deckDetailHtml(cardDeck);
  else right = `<section class="panel"><div class="empty">${ic('layers')}${T('pick_deck')}</div></section>`;
  view.innerHTML = `<div class="two">
    <div class="stack">
      <section class="panel"><div class="phead"><h2>${ic('layers')} ${T('decks')} <span class="tag">${cards.length}</span></h2>
        <button class="btn primary sm" id="pdDue" ${due ? '' : 'disabled'}>${ic('zap')} ${T('practice_due')} (${due})</button></div>
        <div id="deckList">${deckListHtml()}</div></section>
      ${addCardFormHtml()}
    </div>
    <div class="stack">${right}<section class="panel"><h2>${ic('help')} Leitner</h2><p class="muted sm i18n" style="margin:8px 0 0">${esc(t('leitner_note'))}</p></section></div>
  </div>`;
  bindCards();
  animateIn(view);
}

function bindCards() {
  $('#pdDue').onclick = () => startPractice(null);
  $$('[data-deck]').forEach(b => {
    b.onclick = () => {
      cardDeck = b.dataset.deck;
      cardSession = null;
      renderCards();
    };
  });
  $('#pdStart')?.addEventListener('click', () => startPractice(cardDeck));
  $$('[data-delcard]').forEach(b => {
    b.onclick = () => {
      cards = cards.filter(c => c.id !== b.dataset.delcard);
      store.set('cards', cards);
      toast(t('card_removed'));
      renderCards();
    };
  });
  const fc = $('#fcard');
  if (fc) {
    const flip = () => {
      cardSession.flipped = !cardSession.flipped;
      renderCards();
    };
    fc.onclick = flip;
    fc.onkeydown = e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        flip();
      }
    };
    $('#fcWrong').onclick = () => answerCard(false);
    $('#fcRight').onclick = () => answerCard(true);
    $('#fcStop').onclick = () => {
      cardSession = null;
      renderCards();
    };
  }
  $('#fcAgain')?.addEventListener('click', () => startPractice(cardSession.ch));
  $('#fcClose')?.addEventListener('click', () => {
    cardSession = null;
    renderCards();
  });
  bindAddCard();
}

function bindAddCard() {
  const fillCh = () => {
    const chs = subjById($('#ncSubj').value).ch;
    $('#ncCh').innerHTML = chs.map(c => `<option value="${c.id}" ${c.id === cardDeck ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
  };
  $('#ncSubj').onchange = fillCh;
  fillCh();
  $('#ncAdd').onclick = () => {
    const q = $('#ncQ').value.trim();
    const a = $('#ncA').value.trim();
    if (!q || !a) {
      toast(`${t('question')} / ${t('answer')}?`, 'bad');

// ---------- Mock exam generator ----------
// A paper outline is sampled from the weighted chapter list: MCQs and short questions by
// weightage, long questions from distinct chapters. The student writes answers on paper
// against a countdown, then self-marks each question; the result becomes a paper attempt.
const MOCK_PATTERNS = {
  board: { fsc: { mcq: 17, short: 22, long: 3, shortMarks: 2, longMarks: 8, mins: 180 }, matric: { mcq: 12, short: 15, long: 3, shortMarks: 2, longMarks: 6, mins: 150 } },
  half: { fsc: { mcq: 10, short: 12, long: 2, shortMarks: 2, longMarks: 8, mins: 90 }, matric: { mcq: 8, short: 9, long: 2, shortMarks: 2, longMarks: 6, mins: 75 } },
  quick: { fsc: { mcq: 10, short: 5, long: 0, shortMarks: 2, longMarks: 8, mins: 30 }, matric: { mcq: 10, short: 5, long: 0, shortMarks: 2, longMarks: 6, mins: 30 } }
};
const patternFor = (key, subjId) => MOCK_PATTERNS[key][subjClass(subjId) >= 11 ? 'fsc' : 'matric'];
let mockView = null;
const mockTimer = { iv: null };
const activeMock = () => mocks.find(m => m.status === 'running' || m.status === 'marking');

function weightedPick(chs, rng, exclude = new Set()) {
  const pool = chs.filter(c => !exclude.has(c.id));
  const list = pool.length ? pool : chs;
  const total = sum(list.map(W)) || 1;
  let r = rng() * total;
  for (const c of list) {
    r -= W(c);
    if (r <= 0) return c;
  }
  return list[list.length - 1];
}

// Give each chapter a question count proportional to its weightage (largest remainder),
// then shuffle so the paper reads like a real one instead of grouping by chapter.
function allocateByWeight(chs, count, rng) {
  const total = sum(chs.map(W)) || 1;
  const exact = chs.map(c => (W(c) / total) * count);
  const counts = exact.map(Math.floor);
  let left = count - sum(counts);
  const order = exact.map((v, i) => ({ i, frac: v - Math.floor(v) })).sort((a, b) => b.frac - a.frac || rng() - 0.5);
  for (let k = 0; left > 0 && k < order.length; k++, left--) counts[order[k].i]++;
  const out = [];
  chs.forEach((c, i) => {
    for (let k = 0; k < counts[i]; k++) out.push(c.id);
  });
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

function generateMock({ subj, pattern = 'board', seed = Date.now() >>> 0, startedAt = Date.now(), mins }) {
  const s = subjById(subj);
  const pat = patternFor(pattern, s.id);
  const rng = mulberry32(seed);
  const items = [];
  let n = 1;
  allocateByWeight(s.ch, pat.mcq, rng).forEach(ch => items.push({ n: n++, type: 'mcq', ch, marks: 1, got: null }));
  allocateByWeight(s.ch, pat.short, rng).forEach(ch => items.push({ n: n++, type: 'short', ch, marks: pat.shortMarks, got: null }));
  const used = new Set();
  for (let i = 0; i < pat.long; i++) {
    const c = weightedPick(s.ch, rng, used);
    used.add(c.id);
    items.push({ n: n++, type: 'long', ch: c.id, marks: pat.longMarks, got: null });
  }
  const duration = mins || pat.mins;
  return {
    id: uid(), subj: s.id, pattern, seed, date: iso(new Date(startedAt)), startedAt, endAt: startedAt + duration * 60000,
    duration, status: 'running', items, total: sum(items.map(it => it.marks)), got: 0, pct: 0, weak: [], perCh: {}
  };
}

function finalizeMock(m, silent) {
  const perCh = {};
  m.items.forEach(it => {
    const row = (perCh[it.ch] = perCh[it.ch] || { marks: 0, got: 0 });
    row.marks += it.marks;
    row.got += it.got || 0;
  });
  m.perCh = perCh;
  m.got = sum(Object.values(perCh).map(r => r.got));
  m.pct = Math.round((m.got / (m.total || 1)) * 100);
  m.weak = Object.keys(perCh).filter(id => perCh[id].marks >= 4 && perCh[id].got / perCh[id].marks < 0.5);
  m.status = 'marked';
  m.markedAt = Date.now();
  Object.entries(perCh).forEach(([id, row]) => {
    const c = chById(id);
    if (c && row.marks >= 4) setMastery(id, M(c) + ((row.got / row.marks) * 5 - M(c)) * 0.3);
  });
  if (!silent) {
    const s = subjById(m.subj);
    const weakNames = m.weak.map(id => chById(id)?.name).filter(Boolean).join(', ') || '-';
    pushInbox({ k: 'mock_done', p: { s: s.name, sc: m.pct, w: weakNames }, icon: 'trophy', route: 'mock', key: 'mock:' + m.id });
  }
}

function logMockAsPaper(m) {
  if (m.logged) return;
  papers.push({ id: uid(), subj: m.subj, year: new Date(m.startedAt).getFullYear(), board: 'Mock', score: m.pct, weak: [...m.weak], date: m.date, mock: true });

function mockItemsHtml(m, marking) {
  const sections = [['mcq', 'mcq'], ['short', 'short_q'], ['long', 'long_q']];

    const rows = list.map(it => {
      const c = chById(it.ch);
      const gotTxt = it.got == null ? '-' : it.got;
      const ctl = marking ? markingControls(it) : (m.status === 'marked' ? `<b style="color:${it.got >= it.marks ? 'var(--ok)' : it.got ? 'var(--warn)' : 'var(--bad)'}">${gotTxt}/${it.marks}</b>` : `<span class="tag">${it.marks} ${t('marks')}</span>`);
      return `<div class="qrow"><span class="qn">Q${it.n}</span><div class="t"><b>${esc(c ? c.name : it.ch)}</b><span>${T(label)} - ${it.marks} ${t('marks')}</span></div><div class="mk">${ctl}</div></div>`;
    }).join('');
    return `<div class="qsec">${T(label)} - ${list.length} x ${list[0].marks}</div><div class="list">${rows}</div>`;
  }).join('');
}

function markingControls(it) {
  if (it.type === 'mcq') {

}

function mockResultHtml(m) {

function renderMock() {
  const act = activeMock();
  const shown = act || mocks.find(m => m.id === mockView);
  let main;
  if (!shown) {
    const tips = `<section class="panel"><h2>${ic('lightbulb')} ${T('tips')}</h2><ul class="muted sm i18n" style="margin:8px 0 0;padding-left:18px">${['tip1', 'tip2', 'tip3', 'tip4'].map(k => `<li>${esc(t(k))}</li>`).join('')}</ul></section>`;
    main = `<div class="two"><div class="stack">${mockSetupHtml()}${tips}</div>${mockHistoryHtml()}</div>`;
  } else if (shown.status === 'running') {
    const controls = `<div class="actions noprint" style="margin:0">
        <button class="btn sm" id="mkPrint">${ic('printer')} ${T('print_paper')}</button>
        <button class="btn sm primary" id="mkFinish">${ic('check')} ${T('finish_mark')}</button>
        <button class="btn sm ghost" id="mkAbandon">${T('abandon')}</button></div>`;
    main = `${mockHeaderHtml(shown)}<div class="two">
      <section class="panel"><div class="phead"><h2>${ic('clipboard')} ${T('paper')}</h2>${controls}</div>${mockItemsHtml(shown, false)}</section>
      <section class="panel noprint"><h2>${ic('lightbulb')} ${T('tips')}</h2><ul class="muted sm i18n" style="margin:8px 0 0;padding-left:18px">${['tip1', 'tip2', 'tip3', 'tip4'].map(k => `<li>${esc(t(k))}</li>`).join('')}</ul></section></div>`;
  } else if (shown.status === 'marking') {
    main = `${mockHeaderHtml(shown)}<section class="panel"><div class="phead"><h2>${ic('edit')} ${T('marking')}</h2><span class="muted sm i18n">${esc(t('unattempted'))}</span></div>${mockItemsHtml(shown, true)}
      <div class="actions"><button class="btn primary" id="mkSubmit">${ic('check')} ${T('submit_marks')}</button><button class="btn ghost" id="mkAbandon">${T('abandon')}</button></div></section>`;
  } else {
    main = `${mockHeaderHtml(shown)}<div class="two">${mockResultHtml(shown)}<section class="panel"><h2>${ic('clipboard')} ${T('paper')}</h2>${mockItemsHtml(shown, false)}</section></div>`;
  }
  view.innerHTML = main;
  growBars(view);
  bindMock(shown);
  animateIn(view);
}

function bindMock(m) {
  if (!m) {
    bindMockSetup();
    $$('[data-view]').forEach(b => {
      b.onclick = () => {
        mockView = b.dataset.view;
        renderMock();
      };
    });
    return;
  }
  clearInterval(mockTimer.iv);
  if (m.status === 'running') mockTimer.iv = setInterval(() => mockTick(m), 1000);
  $('#mkFinish')?.addEventListener('click', () => {
    m.status = 'marking';
    saveAll();
    renderMock();
  });
  $('#mkAbandon')?.addEventListener('click', () => {
    mocks = mocks.filter(x => x.id !== m.id);
    mockView = null;
    saveAll();
    renderMock();
  });
  $('#mkPrint')?.addEventListener('click', () => window.print());
  $('#mkSubmit')?.addEventListener('click', () => {
    finalizeMock(m, false);
    mockView = m.id;
    saveAll();
    toast(`${t('result')}: ${m.pct}%`, 'ok', 'trophy');
    renderMock();
  });
  $('#mkLog')?.addEventListener('click', () => {
    logMockAsPaper(m);
    renderMock();
  });
  $('#mkBack')?.addEventListener('click', () => {
    mockView = null;
    renderMock();
  });
  bindMarking(m);
}

function bindMockSetup() {
  const preview = () => {
    const pat = patternFor($('#mkPat').value, $('#mkSubj').value);
    $('#mkMins').value = pat.mins;
    const total = pat.mcq + pat.short * pat.shortMarks + pat.long * pat.longMarks;
    $('#mkPreview').textContent = `${pat.mcq} ${t('mcq')} x 1 + ${pat.short} ${t('short_q')} x ${pat.shortMarks} + ${pat.long} ${t('long_q')} x ${pat.longMarks} = ${total} ${t('marks')}`;
  };
  $('#mkPat').onchange = preview;
  $('#mkSubj').onchange = preview;
  preview();
  $('#mkGo').onclick = () => {
    const m = generateMock({ subj: $('#mkSubj').value, pattern: $('#mkPat').value, mins: clamp(+$('#mkMins').value || 30, 10, 240) });
    mocks.push(m);
    saveAll();
    toast(t('started'), 'ok', 'clipboard');
    renderMock();
  };
}

function bindMarking(m) {
  const setGot = (n, v) => {
    const it = m.items.find(x => x.n === n);
    if (!it) return;
    it.got = clamp(Number.isFinite(v) ? v : 0, 0, it.marks);
    store.set('mocks', mocks);
  };
  $$('[data-mark]').forEach(b => {
    b.onclick = () => {
      setGot(+b.dataset.mark, +b.dataset.v);
      renderMock();
    };
  });
  $$('[data-marknum]').forEach(inp => {
    inp.onchange = () => {
      setGot(+inp.dataset.marknum, parseFloat(inp.value));
      renderMock();
    };
  });
}

function mockTick(m) {
  const el = $('#mockTime');
  if (!el || m.status !== 'running') {
    clearInterval(mockTimer.iv);
    return;
  }
  const remaining = Math.max(0, Math.round((m.endAt - Date.now()) / 1000));
  el.textContent = fmtT(remaining);
  el.classList.toggle('low', remaining < 300);
  if (remaining <= 0) {
    clearInterval(mockTimer.iv);
    m.status = 'marking';
    saveAll();
    beep();
    toast(t('time_up'), 'bad', 'timer');
    renderMock();
  }
}

function renderPapers() {
  const ss = subjects();
  if (!paperSubj || !ss.find(s => s.id === paperSubj)) {
    paperSubj = papers[0] && ss.find(s => s.id === papers[0].subj) ? papers[0].subj : ss[0].id;
  }
  const sb = subjById(paperSubj);
  const mine = papers.filter(p => p.subj === paperSubj).sort((a, b) => a.date.localeCompare(b.date));
  const sorted = [...papers].sort((a, b) => b.date.localeCompare(a.date));
  view.innerHTML = `<div class="two">
    <div class="stack">
      <section class="panel"><div class="phead"><h2>${ic('trending-up')} ${T('score_trend')}</h2>
        <select id="pSubj" aria-label="${esc(t('subject'))}" style="width:auto;min-width:160px">${ss.map(s => `<option value="${s.id}" ${s.id === paperSubj ? 'selected' : ''}>${esc(subjName(s))}</option>`).join('')}</select></div>
        <div class="chart" id="pChart"></div></section>
      <section class="panel"><h2>${ic('file')} ${T('logged_attempts')} <span class="tag">${papers.length}</span></h2>
        <div class="scrollx" style="margin-top:8px"><table><thead><tr><th>${T('subject')}</th><th>${T('paper')}</th><th>${T('score')}</th><th>${T('weak_chapters').split(' (')[0]}</th><th></th></tr></thead>
        <tbody>${sorted.map(paperRowHtml).join('') || `<tr><td colspan="5" class="empty">${ic('file')}${T('no_papers')}</td></tr>`}</tbody></table></div></section>
      ${bankMatrixHtml(sb)}
    </div>
    <div class="stack">${logPaperFormHtml(ss)}${weakFreqHtml()}</div></div>`;
  bindPapers(ss);
  scoreChart($('#pChart'), mine, sb.color);
  growBars(view);
  animateIn(view);
}

function bindPapers() {
  const drawWeak = () => {
    const chs = subjById($('#fSubj').value).ch;
    $('#fWeak').innerHTML = chs.map(c => `<button class="chip" data-w="${c.id}" aria-pressed="false">${esc(c.name)}</button>`).join('');
    $$('#fWeak .chip').forEach(b => {
      b.onclick = () => {
        b.classList.toggle('on');
        b.setAttribute('aria-pressed', b.classList.contains('on'));
      };
    });
  };
  $('#fSubj').onchange = drawWeak;
  drawWeak();
  $('#pSubj').onchange = e => {
    paperSubj = e.target.value;
    renderPapers();
  };
  $('#bankBoard').onchange = e => {
    bankBoard = e.target.value;
    renderPapers();
  };
  $('#fAdd').onclick = addPaperFromForm;
  $$('[data-del]').forEach(b => {
    b.onclick = () => {
      papers = papers.filter(p => p.id !== b.dataset.del);
      saveAll();
      renderPapers();
    };
  });
  $('#pBoost').onclick = () => {
    const n = generatePlan();
    toast(`${t('plan_rebuilt')} - ${n} ${t('sessions')}`, 'ok', 'sparkles');
    location.hash = 'plan';
  };
}

function addPaperFromForm() {
  const score = +$('#fScore').value;
  if (!$('#fScore').value || score < 0 || score > 100) {
    toast(t('score_range'), 'bad');
    $('#fScore').focus();
    return;
  }
  const weak = $$('#fWeak .chip.on').map(b => b.dataset.w);
  const subj = $('#fSubj').value;
  const year = +$('#fYear').value;
  papers.push({ id: uid(), subj, year, board: $('#fBoard').value, score, weak, date: todayIso() });
  pushInbox({ k: 'paper_added', p: { s: subjById(subj).name, y: year, sc: score, w: weak.length }, icon: 'file', route: 'papers', key: 'paper:' + Date.now() });
  saveAll();
  paperSubj = subj;
  toast(t('attempt_logged'), 'ok', 'file');
  renderPapers();
}

function scoreChart(el, pts, color) {
  const Wd = 600;
  const H = 220;
  const P = { l: 40, r: 16, t: 14, b: 34 };
  if (!pts.length) {
    el.innerHTML = `<div class="empty">${ic('trending-up')}${T('no_trend')}</div>`;
    return;
  }
  const x = i => (pts.length === 1 ? Wd / 2 : P.l + (i / (pts.length - 1)) * (Wd - P.l - P.r));
  const y = v => P.t + (1 - v / 100) * (H - P.t - P.b);
  let svg = `<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="${esc(t('score_trend'))}">`;
  [0, 25, 50, 75, 100].forEach(g => {
    svg += `<line x1="${P.l}" x2="${Wd - P.r}" y1="${y(g)}" y2="${y(g)}" style="stroke:var(--line)"/><text x="${P.l - 8}" y="${y(g) + 4}" font-size="11" text-anchor="end" style="fill:var(--muted)">${g}%</text>`;
  });
  svg += `<line x1="${P.l}" x2="${Wd - P.r}" y1="${y(60)}" y2="${y(60)}" stroke="#0f9d6e" stroke-dasharray="4 4" opacity=".6"/><text x="${Wd - P.r}" y="${y(60) - 5}" font-size="10" text-anchor="end" fill="#0f9d6e">${t('target')} 60%</text>`;
  pts.forEach((p, i) => {
    svg += `<text x="${x(i)}" y="${H - 10}" font-size="11" text-anchor="middle" style="fill:var(--muted)">${p.year} ${esc(String(p.board).slice(0, 3))}</text>`;
  });
  const d = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.score).toFixed(1)).join(' ');
  svg += `<path id="trend" d="${d}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p, i) => {
    svg += `<circle cx="${x(i)}" cy="${y(p.score)}" r="5" fill="#fff" stroke="${color}" stroke-width="3" data-i="${i}" style="cursor:pointer"><title>${p.year} ${esc(p.board)}: ${p.score}%</title></circle>`;
  });
  el.innerHTML = svg + '</svg><div class="tip"></div>';
  bindChartTips(el, pts, Wd, H);
  requestAnimationFrame(() => drawPath($('#trend', el)));
}

function bindChartTips(el, pts, Wd, H) {
  const tip = $('.tip', el);
  const svgEl = $('svg', el);
  $$('circle', el).forEach(c => {
    c.onmouseenter = () => {
      const p = pts[+c.dataset.i];
      const r = svgEl.getBoundingClientRect();
      tip.style.display = 'block';
      tip.style.left = (+c.getAttribute('cx') / Wd) * r.width + 'px';
      tip.style.top = (+c.getAttribute('cy') / H) * r.height + 'px';
      tip.textContent = `${p.year} ${p.board} - ${p.score}% - ${p.weak.length} weak`;
    };
    c.onmouseleave = () => {
      tip.style.display = 'none';
    };
  });
}

// ---------- Exams view: datesheet · final-week focus · exam-day checklist ----------
function daysLeftLabel(d, today) {
  const n = daysBetween(today, d);
  if (n < 0) return `<span class="muted">${t('passed')}</span>`;
  if (n === 0) return `<span style="color:var(--bad)">${t('today_cap')}</span>`;
  if (n === 1) return `<span style="color:var(--warn)">${t('tomorrow')}</span>`;
  return `${n} <span class="muted sm">${t('days')}</span>`;
}

function datesheetHtml(today) {
  const ordered = [...subjects()].sort((a, b) => (datesheet[a.id] || '').localeCompare(datesheet[b.id] || ''));
  const nextId = ordered.find(s => (datesheet[s.id] || '') >= today)?.id;
  let prev = null;
  const rows = ordered.map(s => {
    const d = datesheet[s.id] || settings.examDate;
    const gap = prev ? daysBetween(prev, d) : null;
    prev = d;
    return `<div class="ds ${s.id === nextId ? 'next' : ''}"><span class="ico" style="background:${s.color}">${ic(s.icon)}</span>
      <div class="t"><b>${esc(subjName(s))}</b><span>${esc(dayName(d))} - ${esc(fmtD(d, { day: 'numeric', month: 'long' }))}${gap != null ? ` - ${t('gap')} ${gap} ${t('days')}` : ''}</span></div>
      <input type="date" data-ds="${s.id}" value="${d}" aria-label="${esc(subjName(s))} ${esc(t('date'))}">
      <div class="left">${daysLeftLabel(d, today)}</div></div>`;
  }).join('');
  return `<section class="panel"><div class="phead"><h2>${ic('calendar')} ${T('datesheet')}</h2><span class="tag">BISE ${esc(settings.board)}</span></div>
    <p class="muted sm i18n" style="margin:0 0 10px">${esc(t('datesheet_hint'))}</p><div class="list">${rows}</div></section>`;
}

function focusHtml() {

function renderExams() {
  const today = todayIso();
  ensureDatesheet();
  if (!checklist) checklist = defaultChecklist();
  const tips = ['tip1', 'tip2', 'tip3', 'tip4'].map(k => `<li>${esc(t(k))}</li>`).join('');
  view.innerHTML = `<div class="two">

    <div class="stack">${checklistHtml()}<section class="panel"><h2>${ic('lightbulb')} ${T('tips')}</h2><ul class="muted sm i18n" style="margin:8px 0 0;padding-left:18px">${tips}</ul></section></div></div>`;
  growBars(view);

function bindExams() {
  $$('[data-ds]').forEach(inp => {
    inp.onchange = () => {
      if (!inp.value) return;
      const before = settings.examDate;
      datesheet[inp.dataset.ds] = inp.value;
      settings.examDate = firstExamDate();
      saveAll();
      if (before !== settings.examDate && settings.examDate > todayIso()) generatePlan();
      updateCountdown();
      toast(t('saved'), 'ok', 'calendar');
      renderExams();
    };
  });
  $$('[data-ch]', view).forEach(b => {
    b.onclick = () => openChapter(b.dataset.ch);
  });
  $$('[data-ck]').forEach(cb => {
    cb.onchange = () => {
      const item = checklist.find(i => i.id === cb.dataset.ck);
      if (item) item.done = cb.checked;
      store.set('checklist', checklist);
      renderExams();
    };
  });
  $$('[data-ckdel]').forEach(b => {
    b.onclick = e => {
      e.preventDefault();
      checklist = checklist.filter(i => i.id !== b.dataset.ckdel);
      store.set('checklist', checklist);
      renderExams();
    };
  });
  $('#ckReset').onclick = () => {
    checklist.forEach(i => (i.done = false));
    store.set('checklist', checklist);
    renderExams();
  };
  $('#ckAdd').onclick = () => {
    const text = $('#ckNew').value.trim();
    if (!text) return;
    checklist.push({ id: uid(), text, done: false });
    store.set('checklist', checklist);
    toast(t('item_added'), 'ok', 'plus');
    renderExams();
  };
}

// Hand-drawn SVG bar chart; bars grow in via CSS transform.
function barChart(values, labels, color = 'var(--p)') {
  const Wd = 600;
  const H = 200;
  const P = { l: 36, r: 10, t: 14, b: 28 };
  const max = Math.max(60, ...values);
  const bw = (Wd - P.l - P.r) / values.length;
  let svg = `<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="${esc(t('minutes_per_day'))}">`;
  [0, 0.5, 1].forEach(f => {
    const y = P.t + (1 - f) * (H - P.t - P.b);
    svg += `<line x1="${P.l}" x2="${Wd - P.r}" y1="${y}" y2="${y}" style="stroke:var(--line)"/><text x="${P.l - 6}" y="${y + 4}" font-size="11" text-anchor="end" style="fill:var(--muted)">${Math.round(max * f)}</text>`;
  });
  values.forEach((v, i) => {
    const h = (v / max) * (H - P.t - P.b);
    const x = P.l + i * bw + bw * 0.2;
    const y = H - P.b - h;
    svg += `<rect class="grow" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw * 0.6).toFixed(1)}" height="${h.toFixed(1)}" rx="5" fill="${color}" style="transition-delay:${i * 50}ms"><title>${labels[i]}: ${v} min</title></rect>`;
    svg += `<text x="${(x + bw * 0.3).toFixed(1)}" y="${H - 10}" font-size="11" text-anchor="middle" style="fill:var(--muted)">${esc(labels[i])}</text>`;
    if (v) svg += `<text x="${(x + bw * 0.3).toFixed(1)}" y="${(y - 5).toFixed(1)}" font-size="11" text-anchor="middle" font-weight="700" style="fill:var(--ink)">${v}</text>`;
  });
  return svg + '</svg>';
}

function weekStats(from, to) {
  const inWeek = plan.sessions.filter(s => s.date >= from && s.date <= to);
  const entries = logBetween(from, to);
  return {
    minutes: sum(entries.map(l => l.mins)),
    done: inWeek.filter(s => s.status === 'done').length,
    partial: inWeek.filter(s => s.status === 'partial').length,
    skipped: inWeek.filter(s => s.status === 'skipped').length,
    todo: inWeek.filter(s => s.status === 'todo').length,
    reviews: entries.filter(l => l.review).length,
    papers: papers.filter(p => p.date >= from && p.date <= to).length,
    mocks: mocks.filter(m => m.status === 'marked' && m.date >= from && m.date <= to).length,
    target: sum(Array.from({ length: 7 }, (_, i) => capacity(addDays(from, i))))
  };
}

    reportWeek = mondayOf(todayIso());
    renderReports();
  });

function noteHtml(n) {
  const when = fmtDT(n.at);
  return `<div class="note ${n.read ? '' : 'unread'}" data-note="${n.id}" role="button" tabindex="0">
    <span class="ico">${ic(n.icon || 'bell')}</span>

    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"><span class="when">${esc(when)}</span>
      ${n.read ? '' : `<button class="btn sm ghost" data-read="${n.id}">${ic('check')} ${T('mark_read')}</button>`}</div></div>`;
}

function activityHtml() {
  const entries = [...log].map((l, i) => ({ ...l, i })).sort((a, b) => b.date.localeCompare(a.date) || b.i - a.i).slice(0, 120);
  if (!entries.length) return `<div class="empty">${ic('activity')}${T('no_log')}</div>`;
  let out = '';
  let cur = '';
  entries.forEach(l => {
    if (l.date !== cur) {
      cur = l.date;
      out += `<div class="dayhead">${esc(fmtD(l.date, { weekday: 'long', day: 'numeric', month: 'long' }))} - ${fmtMin(minutesOn(l.date))}</div>`;
    }
    const c = chById(l.ch);
    const s = subjById(l.subj);
    out += `<div class="actline" style="--sc:${s.color}"><span class="dot"></span><span>${esc(c ? c.name : l.ch)}</span><span class="muted sm">${esc(subjName(s))}</span>${l.review ? `<span class="tag vio">${T('review')}</span>` : ''}<span class="mins">${l.mins} min</span></div>`;
  });
  return out;
}

function renderInbox() {
  const unread = inboxUnread();
  const list = inbox.filter(n => inboxFilter === 'all' || !n.read).sort((a, b) => b.at - a.at);
  const tabs = `<div class="tabs" role="tablist"><button class="${inboxTab === 'notes' ? 'on' : ''}" data-tab="notes">${ic('bell')} ${T('inbox')} ${unread ? `<span class="tag bad">${unread}</span>` : ''}</button><button class="${inboxTab === 'activity' ? 'on' : ''}" data-tab="activity">${ic('activity')} ${T('activity')}</button></div>`;
  let body;
  if (inboxTab === 'notes') {
    body = `<section class="panel"><div class="phead"><div class="chips"><button class="chip ${inboxFilter === 'all' ? 'on' : ''}" data-f="all">${T('all')} (${inbox.length})</button><button class="chip ${inboxFilter === 'unread' ? 'on' : ''}" data-f="unread">${T('unread')} (${unread})</button></div>
        <div style="display:flex;gap:8px"><button class="btn sm" id="ibAll" ${unread ? '' : 'disabled'}>${ic('check-circle')} ${T('mark_all_read')}</button><button class="btn sm danger" id="ibClear" ${inbox.length ? '' : 'disabled'}>${ic('trash')} ${T('clear_inbox')}</button></div></div>
      <p class="muted sm i18n" style="margin:0 0 10px">${esc(t('inbox_hint'))}</p>
      <div class="list stagger">${list.map(noteHtml).join('') || `<div class="empty">${ic('bell')}${T('inbox_empty')}</div>`}</div></section>`;
  } else {
    body = `<section class="panel"><h2>${ic('activity')} ${T('activity')} <span class="tag">${log.length}</span></h2><p class="muted sm i18n" style="margin:6px 0 0">${esc(t('activity_hint'))}</p>${activityHtml()}</section>`;
  }
  view.innerHTML = `<div class="phead">${tabs}</div>${body}`;
  bindInbox();
  animateIn(view);
}

function bindInbox() {
  $$('[data-tab]').forEach(b => {
    b.onclick = () => {
      inboxTab = b.dataset.tab;
      renderInbox();
    };
  });
  $$('[data-f]').forEach(b => {
    b.onclick = () => {
      inboxFilter = b.dataset.f;
      renderInbox();
    };
  });
  const markRead = id => {
    const n = inbox.find(x => x.id === id);
    if (n) n.read = true;
    store.set('inbox', inbox);
    updateNavBadges();
  };
  $$('[data-read]').forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      markRead(b.dataset.read);
      renderInbox();
    };
  });
  $$('[data-note]').forEach(el => {
    const open = () => {
      const n = inbox.find(x => x.id === el.dataset.note);
      markRead(el.dataset.note);
      if (n?.route && n.route !== 'inbox') location.hash = n.route;
      else renderInbox();
    };
    el.onclick = open;
    el.onkeydown = e => {
      if (e.key === 'Enter') open();
    };
  });
  $('#ibAll')?.addEventListener('click', () => {
    inbox.forEach(n => (n.read = true));
    store.set('inbox', inbox);
    updateNavBadges();
    renderInbox();
  });
  $('#ibClear')?.addEventListener('click', () => {
    inbox = [];
    store.set('inbox', inbox);
    updateNavBadges();
    renderInbox();
  });
}

// ---------- exports: .ics calendar for the next 14 days ----------
// TODO(student): two-way calendar sync. Replace this one-shot file with the Google Calendar API
// (OAuth) so moved or completed sessions update the student's real calendar.
function exportIcs() {
  const today = todayIso();
  const end = addDays(today, 14);
  const stamp = s => s.replace(/[-:]/g, '');
  const now = new Date();
  const dtstamp = `${stamp(iso(now))}T${pad2(now.getHours())}${pad2(now.getMinutes())}00`;
  const events = [];
  for (let d = today; d < end; d = addDays(d, 1)) {
    const times = sessionTimes(d);
    sessionsOn(d).filter(s => s.status === 'todo').forEach(s => {
      const c = chById(s.ch);
      const sb = subjById(s.subj);
      const tm = times[s.id];
      const start = `${stamp(d)}T${fmtClock(tm.start).replace(':', '')}00`;
      const finish = `${stamp(d)}T${fmtClock(tm.end).replace(':', '')}00`;
      const summary = `${sb.name}: ${(c?.name || '').replace(/[,;\\]/g, ' ')}`;
      events.push(`BEGIN:VEVENT\r\nUID:${s.id}@berp\r\nDTSTAMP:${dtstamp}\r\nDTSTART:${start}\r\nDTEND:${finish}\r\nSUMMARY:${summary}\r\nDESCRIPTION:${s.type} session - ${s.mins} min - weightage ${c ? W(c) : ''}%\r\nEND:VEVENT`);
    });
  }
  if (!events.length) {
    toast(t('no_upcoming_ics'), 'bad');
    return;
  }
  const cal = `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Board Exam Revision Planner//EN\r\nCALSCALE:GREGORIAN\r\n${events.join('\r\n')}\r\nEND:VCALENDAR\r\n`;
  download('revision-plan.ics', cal, 'text/calendar');
  toast(`${events.length} ${t('sessions')} ${t('exported')}`, 'ok', 'calendar');
}

function saveProfile() {
  const exam = $('#sExam').value;
  if (!exam || exam <= todayIso()) {

  }
  const changedCombo = +$('#sCls').value !== +settings.cls || $('#sStream').value !== settings.stream;
  settings = {
    ...settings, name: $('#sName').value.trim(), board: $('#sBoard').value, cls: +$('#sCls').value, stream: $('#sStream').value, examDate: exam,

    startWd: $('#sStartWd').value || '16:00', startWe: $('#sStartWe').value || '10:00', daysOff: $$('#sOff .chip.on').map(b => +b.dataset.d)
  };
  if (changedCombo) {

function bindData() {
  $('#dExp').onclick = () => {

  $('#nAsk').onclick = () => {

  };

function importBackup(text) {
  try {
    const d = JSON.parse(text);
    if (d.app !== 'berp') throw new Error('not a backup');
    settings = { ...DEF, ...d.settings };
    prefs = { ...DEF_PREFS, ...(d.prefs || {}) };
    mastery = d.mastery || {};
    overrides = d.overrides || {};
    papers = d.papers || [];
    reviews = d.reviews || [];
    log = d.log || [];
    plan = d.plan || { generated: 0, sessions: [] };
    inbox = d.inbox || [];
    cards = d.cards || [];
    mocks = d.mocks || [];
    datesheet = d.datesheet || {};
    checklist = d.checklist || defaultChecklist();
    ensureDatesheet();
    saveAll();
    applyTheme();
    toast(t('imported'), 'ok');
    route();
  } catch {
    toast(t('import_bad'), 'bad');
  }
}

  { sel: '#countdown', k: 'tour_cd', icon: 'calendar' },
  { sel: '#week', k: 'tour_week', icon: 'move' },
  { sel: '.today', k: 'tour_today', icon: 'zap' },
  { sel: '#inboxBtn', k: 'tour_inbox', icon: 'bell' },
  { sel: '#langBtn', k: 'tour_lang', icon: 'languages' }
];
let tourStep = -1;
const tourActive = () => tourStep >= 0;

function tourStart() {
  if (page() !== 'plan') {
    location.hash = 'plan';
    setTimeout(tourStart, 300);
    return;
  }
  tourStep = 0;
  tourShow();
}

function tourShow() {
  $$('.spot,.tourtip').forEach(el => el.remove());
  const step = TOUR_STEPS[tourStep];
  const target = step && $(step.sel);
  if (!target) {
    tourEnd();
    return;
  }
  target.scrollIntoView({ block: 'center', inline: 'nearest' });
  const r = target.getBoundingClientRect();
  const spot = document.createElement('div');
  spot.className = 'spot';
  Object.assign(spot.style, { top: r.top - 6 + 'px', left: r.left - 6 + 'px', width: r.width + 12 + 'px', height: r.height + 12 + 'px' });
  const tip = document.createElement('div');
  tip.className = 'tourtip';
  tip.setAttribute('role', 'dialog');
  tip.innerHTML = `<h3>${ic(step.icon)} <span class="i18n">${esc(t(step.k + '_t'))}</span></h3><p class="i18n">${esc(t(step.k + '_b'))}</p>
    <div class="tf"><div class="dots">${TOUR_STEPS.map((_, i) => `<i class="${i === tourStep ? 'on' : ''}"></i>`).join('')}</div>
      <button class="btn sm ghost" id="tourSkip">${T('skip_tour')}</button>
      ${tourStep > 0 ? `<button class="btn sm" id="tourBack">${ic('arrow-left')} ${T('back')}</button>` : ''}
      <button class="btn sm primary" id="tourNext">${tourStep === TOUR_STEPS.length - 1 ? T('got_it_tour') : T('next') + ' ' + ic('arrow-right')}</button></div>`;
  document.body.append(spot, tip);
  placeTourTip(tip, r);
  $('#tourSkip').onclick = () => tourEnd();
  $('#tourBack')?.addEventListener('click', () => {
    tourStep--;
    tourShow();
  });
  $('#tourNext').onclick = () => {
    tourStep++;
    if (tourStep >= TOUR_STEPS.length) tourEnd();
    else tourShow();
  };
  $('#tourNext').focus();
}

function placeTourTip(tip, r) {
  const tw = tip.offsetWidth;
  const th = tip.offsetHeight;
  const below = r.bottom + 14 + th < window.innerHeight || r.top - 14 - th < 0;
  const top = below ? r.bottom + 14 : r.top - 14 - th;
  const left = clamp(r.left + r.width / 2 - tw / 2, 16, Math.max(16, window.innerWidth - tw - 16));
  tip.style.top = clamp(top, 8, Math.max(8, window.innerHeight - th - 8)) + 'px';
  tip.style.left = left + 'px';
}

function tourEnd() {
  $$('.spot,.tourtip').forEach(el => el.remove());
  tourStep = -1;
  tourDone = true;
  store.set('tourDone', true);
}

// ---------- global search (chapters, pages, flashcards) ----------
function searchItems(q) {
  const needle = q.trim().toLowerCase();
  const out = [];
  NAV.forEach(([id, k, icon]) => {
    if (!needle || t(k).toLowerCase().includes(needle) || id.includes(needle)) out.push({ kind: 'page', icon, title: t(k), sub: t('pages'), go: () => (location.hash = id) });
  });
  if (!needle) return out.slice(0, 6);
  chapters().forEach(c => {
    if (c.name.toLowerCase().includes(needle) || c.sname.toLowerCase().includes(needle)) {
      out.push({ kind: 'chapter', icon: subjById(c.subj).icon, color: c.color, title: c.name, sub: `${c.sname} - ${W(c)}% - ${t('mastery')} ${M(c)}/5`, go: () => openChapter(c.id) });
    }
  });
  cards.forEach(card => {
    if (card.q.toLowerCase().includes(needle) || card.a.toLowerCase().includes(needle)) {
      out.push({ kind: 'card', icon: 'bookmark', title: card.q, sub: chById(card.ch)?.name || card.ch, go: () => {
        cardDeck = card.ch;
        cardSession = null;
        location.hash = 'cards';
        if (page() === 'cards') renderCards();
      } });
    }
  });
  return out.slice(0, 14);
}

function openSearch() {
  openModal({
    title: `${ic('search')} ${t('search')}`,
    body: `<div class="search"><input type="search" id="sq" placeholder="${esc(t('search_ph'))}" autocomplete="off" aria-label="${esc(t('search'))}"><div class="sres" id="sres" role="listbox"></div></div>`
  });
  const draw = () => {
    const items = searchItems($('#sq').value);
    $('#sres').innerHTML = items.map((it, i) => `<button data-i="${i}" role="option"><span style="color:${it.color || 'var(--p)'}">${ic(it.icon)}</span><span class="t"><b>${esc(it.title)}</b><span>${esc(it.sub)}</span></span></button>`).join('') || `<div class="empty sm">${ic('search')}${T('no_results')}</div>`;
    $$('#sres button').forEach(b => {
      b.onclick = () => {
        closeModal();
        items[+b.dataset.i].go();
      };
    });
  };
  $('#sq').oninput = draw;
  $('#sq').onkeydown = e => {
    if (e.key === 'Enter') $('#sres button')?.click();
    if (e.key === 'ArrowDown') $('#sres button')?.focus();
  };
  draw();
}

function openShortcuts() {
  const rows = [['/', 'sc_search'], ['?', 'sc_help'], ['Esc', 'sc_esc'], ['[  ]', 'sc_week'], ['Space', 'sc_flip'], ['1 / 2', 'sc_mark']];
  openModal({ title: `${ic('type')} ${t('shortcuts')}`, body: `<div class="list">${rows.map(([k, l]) => `<div class="row"><span class="kbd">${esc(k)}</span><span class="i18n">${esc(t(l))}</span></div>`).join('')}</div>` });
}

function onKeydown(e) {
  if (e.key === 'Escape') {
    if (tourActive()) tourEnd();
    else if (scrim.classList.contains('open')) closeModal();
    return;
  }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if (typing || e.ctrlKey || e.metaKey || e.altKey || scrim.classList.contains('open')) return;
  if (e.key === '/') {
    e.preventDefault();
    openSearch();
  } else if (e.key === '?') {
    openShortcuts();
  } else if (page() === 'plan' && (e.key === '[' || e.key === ']')) {
    weekStart = addDays(weekStart, e.key === '[' ? -7 : 7);
    renderWeek();
  } else if (page() === 'cards' && cardSession && !cardSession.finished) {
    if (e.key === ' ') {
      e.preventDefault();
      cardSession.flipped = !cardSession.flipped;
      renderCards();
    } else if (e.key === '1') answerCard(false);
    else if (e.key === '2') answerCard(true);
  }
}

// ---------- theme, language, nav, router ----------
const darkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function applyTheme() {
  const resolved = prefs.theme === 'auto' ? (darkQuery && darkQuery.matches ? 'dark' : 'light') : prefs.theme;
  document.documentElement.dataset.theme = resolved;
}
function applyMotion() {
  document.documentElement.dataset.motion = prefs.motion ? 'on' : 'off';
}
darkQuery?.addEventListener?.('change', () => prefs.theme === 'auto' && applyTheme());

const NAV = [
  ['plan', 'nav_plan', 'grid'], ['subjects', 'nav_subjects', 'layers'], ['revise', 'nav_revise', 'brain'], ['cards', 'nav_cards', 'bookmark'],
  ['mock', 'nav_mock', 'clipboard'], ['papers', 'nav_papers', 'file'], ['exams', 'nav_exams', 'graduation'], ['reports', 'nav_reports', 'printer'],
  ['settings', 'nav_settings', 'settings'], ['about', 'nav_about', 'info']
];
const ROUTES = {
  plan: renderPlan, subjects: renderSubjects, revise: renderRevise, cards: renderCards, mock: renderMock, papers: renderPapers,
  exams: renderExams, reports: renderReports, inbox: renderInbox, settings: renderSettings, about: renderAbout
};
const page = () => (location.hash.slice(1) || 'plan').split('?')[0];

function renderNav() {
  const cur = page();
  $('#nav').innerHTML = NAV.map(([id, k, icon]) => `<a href="#${id}" class="${cur === id ? 'on' : ''}" ${cur === id ? 'aria-current="page"' : ''}>${ic(icon)}<span class="i18n">${t(k)}</span>${id === 'revise' ? '<span class="badge hidden" id="navDue"></span>' : ''}</a>`).join('');
  $('.seg a.on')?.scrollIntoView({ inline: 'nearest', block: 'nearest' });
}
function updateNavBadges() {
  const due = dueReviews().length;
  const navDue = $('#navDue');
  if (navDue) {
    navDue.textContent = due;
    navDue.classList.toggle('hidden', !due);
  }
  const unread = inboxUnread();
  const badge = $('#inboxBadge');
  badge.textContent = unread;
  badge.classList.toggle('hidden', !unread);
  $('#inboxBtn').title = `${unread} ${t('unread')} - ${due} ${t('due_today')}`;
}
function updateCountdown() {
  $('#cdNum').textContent = Math.max(0, daysBetween(todayIso(), firstExamDate()));
}
function route() {
  if (tourActive() && page() !== 'plan') tourEnd();
  renderNav();
  updateNavBadges();
  updateCountdown();
  (ROUTES[page()] || renderPlan)();
}
function applyLang() {
  document.documentElement.lang = lang;
  store.set('lang', lang);
  $('#langLbl').textContent = lang === 'en' ? 'اردو' : 'EN';
  $('#langLbl').className = lang === 'en' ? 'ur' : '';
  $$('[data-t]').forEach(el => {
    el.textContent = t(el.dataset.t);
  });
  route();
}

function init() {
  if (!settings) seedDemo();
  settings = { ...DEF, ...settings };
  ensureDatesheet();
  if (!checklist) checklist = defaultChecklist();
  applyTheme();
  applyMotion();
  dailyNotices();
  saveAll();
  $('#langBtn').onclick = () => {
    lang = lang === 'en' ? 'ur' : 'en';
    applyLang();
  };
  $('#searchBtn').onclick = openSearch;
  document.addEventListener('keydown', onKeydown);
  window.addEventListener('hashchange', () => {
    route();
    window.scrollTo({ top: 0 });
  });
  window.addEventListener('resize', () => tourActive() && tourShow());
  applyLang();
  if (!tourDone && page() === 'plan') setTimeout(tourStart, 700);
}
init();
</script>
