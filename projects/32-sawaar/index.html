/* ============================================================
   QR CODE ENCODER — shared FYP-templates kit (offline, no deps)
   ISO/IEC 18004 model 2: numeric, alphanumeric and byte (UTF-8)
   modes, versions 1–40, error correction L / M / Q / H,
   automatic mask selection by the standard penalty rules.
   Usage:
     const qr = QR.encode('hello', { ecc: 'M' });
     el.innerHTML = QR.toSvg(qr, { border: 4, label: 'Share code' });
   ============================================================ */
const QR = (() => {
  // Error correction levels: index into the tables and the 2-bit format value
  const ECL = {
    L: { idx: 0, bits: 1 },
    M: { idx: 1, bits: 0 },
    Q: { idx: 2, bits: 3 },
    H: { idx: 3, bits: 2 },
  };

  // Error correction codewords per block, by level then version (index 0 unused)
  const ECC_PER_BLOCK = [
    [-1, 7, 10, 15, 20, 26, 18, 20, 24, 30, 18, 20, 24, 26, 30, 22, 24, 28, 30, 28, 28, 28, 28, 30, 30, 26, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
    [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28],
    [-1, 13, 22, 18, 26, 18, 24, 18, 22, 20, 24, 28, 26, 24, 20, 30, 24, 28, 28, 26, 30, 28, 30, 30, 30, 30, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
    [-1, 17, 28, 22, 16, 22, 28, 26, 26, 24, 28, 24, 28, 22, 24, 24, 30, 28, 28, 26, 28, 30, 24, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
  ];

  // Number of error correction blocks, by level then version (index 0 unused)
  const NUM_BLOCKS = [
    [-1, 1, 1, 1, 1, 1, 2, 2, 2, 2, 4, 4, 4, 4, 4, 6, 6, 6, 6, 7, 8, 8, 9, 9, 10, 12, 12, 12, 13, 14, 15, 16, 17, 18, 19, 19, 20, 21, 22, 24, 25],
    [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49],
    [-1, 1, 1, 2, 2, 4, 4, 6, 6, 8, 8, 8, 10, 12, 16, 12, 17, 16, 18, 21, 20, 23, 23, 25, 27, 29, 34, 34, 35, 38, 40, 43, 45, 48, 51, 53, 56, 59, 62, 65, 68],
    [-1, 1, 1, 2, 4, 4, 4, 5, 6, 8, 8, 11, 11, 16, 16, 18, 16, 19, 21, 25, 25, 25, 34, 30, 32, 35, 37, 40, 42, 45, 48, 51, 54, 57, 60, 63, 66, 70, 74, 77, 81],
  ];

  const ALNUM_CHARSET = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:';

  // Mode indicator and character-count bit widths for versions 1–9, 10–26, 27–40
  const MODES = {
    numeric: { indicator: 0x1, countBits: [10, 12, 14] },
    alphanumeric: { indicator: 0x2, countBits: [9, 11, 13] },
    byte: { indicator: 0x4, countBits: [8, 16, 16] },
  };

  /* ---------- bit helpers ---------- */

  const getBit = (value, i) => ((value >>> i) & 1) !== 0;

  function appendBits(buffer, value, length) {
    for (let i = length - 1; i >= 0; i--) {
      buffer.push((value >>> i) & 1);
    }
  }

  function countBitsFor(mode, version) {
    const band = version <= 9 ? 0 : version <= 26 ? 1 : 2;
    return MODES[mode].countBits[band];
  }

  /* ---------- capacity ---------- */

  // Modules available for data + ECC after function patterns are removed
  function rawDataModules(version) {
    let result = (16 * version + 128) * version + 64;
    if (version >= 2) {
      const numAlign = Math.floor(version / 7) + 2;
      result -= (25 * numAlign - 10) * numAlign - 55;
      if (version >= 7) {
        result -= 36;
      }
    }
    return result;
  }

  function dataCodewords(version, ecl) {
    const total = Math.floor(rawDataModules(version) / 8);
    return total - ECC_PER_BLOCK[ecl.idx][version] * NUM_BLOCKS[ecl.idx][version];
  }

  /* ---------- segment encoding ---------- */

  function chooseMode(text) {
    if (/^[0-9]*$/.test(text)) {
      return 'numeric';
    }
    if ([...text].every(ch => ALNUM_CHARSET.includes(ch))) {
      return 'alphanumeric';
    }
    return 'byte';
  }

  // Returns { mode, count, bits } where bits excludes mode and count headers
  function encodeSegment(text) {
    const mode = chooseMode(text);
    const bits = [];
    if (mode === 'numeric') {
      for (let i = 0; i < text.length; i += 3) {
        const chunk = text.slice(i, i + 3);
        appendBits(bits, parseInt(chunk, 10), chunk.length * 3 + 1);
      }
      return { mode, count: text.length, bits };
    }
    if (mode === 'alphanumeric') {
      for (let i = 0; i + 1 < text.length; i += 2) {
        const pair = ALNUM_CHARSET.indexOf(text[i]) * 45 + ALNUM_CHARSET.indexOf(text[i + 1]);
        appendBits(bits, pair, 11);
      }
      if (text.length % 2 === 1) {
        appendBits(bits, ALNUM_CHARSET.indexOf(text[text.length - 1]), 6);
      }
      return { mode, count: text.length, bits };
    }
    const bytes = new TextEncoder().encode(text);
    bytes.forEach(b => appendBits(bits, b, 8));
    return { mode, count: bytes.length, bits };
  }

  function segmentBitLength(segment, version) {
    const countBits = countBitsFor(segment.mode, version);
    if (segment.count >= (1 << countBits)) {
      return Infinity;
    }
    return 4 + countBits + segment.bits.length;
  }

  /* ---------- Reed–Solomon over GF(256), polynomial 0x11D ---------- */

  function gfMultiply(x, y) {
    let z = 0;
    for (let i = 7; i >= 0; i--) {
      z = (z << 1) ^ ((z >>> 7) * 0x11d);
      z ^= ((y >>> i) & 1) * x;
    }
    return z;
  }

  function rsDivisor(degree) {
    const result = new Array(degree - 1).fill(0);
    result.push(1);
    let root = 1;
    for (let i = 0; i < degree; i++) {
      for (let j = 0; j < result.length; j++) {
        result[j] = gfMultiply(result[j], root);
        if (j + 1 < result.length) {
          result[j] ^= result[j + 1];
        }
      }
      root = gfMultiply(root, 0x02);
    }
    return result;
  }

  function rsRemainder(data, divisor) {
    const result = divisor.map(() => 0);
    for (const b of data) {
      const factor = b ^ result.shift();
      result.push(0);
      divisor.forEach((coef, i) => {
        result[i] ^= gfMultiply(coef, factor);
      });
    }
    return result;
  }

  // Split data into blocks, append ECC to each, then interleave
  function addEccAndInterleave(data, version, ecl) {
    const numBlocks = NUM_BLOCKS[ecl.idx][version];
    const eccLen = ECC_PER_BLOCK[ecl.idx][version];
    const rawCodewords = Math.floor(rawDataModules(version) / 8);
    const numShortBlocks = numBlocks - (rawCodewords % numBlocks);
    const shortBlockLen = Math.floor(rawCodewords / numBlocks);
    const divisor = rsDivisor(eccLen);
    const blocks = [];
    for (let i = 0, k = 0; i < numBlocks; i++) {
      const dataLen = shortBlockLen - eccLen + (i < numShortBlocks ? 0 : 1);
      const block = data.slice(k, k + dataLen);
      k += dataLen;
      const ecc = rsRemainder(block, divisor);
      if (i < numShortBlocks) {
        block.push(0);
      }
      blocks.push(block.concat(ecc));
    }
    const result = [];
    for (let i = 0; i < blocks[0].length; i++) {
      blocks.forEach((block, j) => {
        // Skip the padding byte of short blocks
        if (i !== shortBlockLen - eccLen || j >= numShortBlocks) {
          result.push(block[i]);
        }
      });
    }
    return result;
  }

  /* ---------- matrix construction ---------- */

  function makeGrid(size) {
    return {
      size,
      modules: Array.from({ length: size }, () => new Array(size).fill(false)),
      isFunction: Array.from({ length: size }, () => new Array(size).fill(false)),
    };
  }

  function setFunction(grid, x, y, dark) {
    grid.modules[y][x] = dark;
    grid.isFunction[y][x] = true;
  }

  function alignmentPositions(version) {
    if (version === 1) {
      return [];
    }
    const size = version * 4 + 17;
    const numAlign = Math.floor(version / 7) + 2;
    const step = Math.floor((version * 8 + numAlign * 3 + 5) / (numAlign * 4 - 4)) * 2;
    const result = [6];
    for (let pos = size - 7; result.length < numAlign; pos -= step) {
      result.splice(1, 0, pos);
    }
    return result;
  }

  function drawFinder(grid, cx, cy) {
    for (let dy = -4; dy <= 4; dy++) {
      for (let dx = -4; dx <= 4; dx++) {
        const x = cx + dx;
        const y = cy + dy;
        if (x < 0 || y < 0 || x >= grid.size || y >= grid.size) {
          continue;
        }
        const dist = Math.max(Math.abs(dx), Math.abs(dy));
        setFunction(grid, x, y, dist !== 2 && dist !== 4);
      }
    }
  }

  function drawAlignment(grid, cx, cy) {
    for (let dy = -2; dy <= 2; dy++) {
      for (let dx = -2; dx <= 2; dx++) {
        setFunction(grid, cx + dx, cy + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
      }
    }
  }

  function drawFormatBits(grid, ecl, mask) {
    const data = (ecl.bits << 3) | mask;
    let rem = data;
    for (let i = 0; i < 10; i++) {
      rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
    }
    const bits = ((data << 10) | rem) ^ 0x5412;
    const size = grid.size;
    // Copy 1, around the top-left finder
    for (let i = 0; i <= 5; i++) {
      setFunction(grid, 8, i, getBit(bits, i));
    }
    setFunction(grid, 8, 7, getBit(bits, 6));
    setFunction(grid, 8, 8, getBit(bits, 7));
    setFunction(grid, 7, 8, getBit(bits, 8));
    for (let i = 9; i < 15; i++) {
      setFunction(grid, 14 - i, 8, getBit(bits, i));
    }
    // Copy 2, split between the top-right and bottom-left finders
    for (let i = 0; i < 8; i++) {
      setFunction(grid, size - 1 - i, 8, getBit(bits, i));
    }
    for (let i = 8; i < 15; i++) {
      setFunction(grid, 8, size - 15 + i, getBit(bits, i));
    }
    // The always-dark module
    setFunction(grid, 8, size - 8, true);
  }

  function drawVersionBits(grid, version) {
    if (version < 7) {
      return;
    }
    let rem = version;
    for (let i = 0; i < 12; i++) {
      rem = (rem << 1) ^ ((rem >>> 11) * 0x1f25);
    }
    const bits = (version << 12) | rem;
    for (let i = 0; i < 18; i++) {
      const dark = getBit(bits, i);
      const a = grid.size - 11 + (i % 3);
      const b = Math.floor(i / 3);
      setFunction(grid, a, b, dark);
      setFunction(grid, b, a, dark);
    }
  }

  function drawFunctionPatterns(grid, version, ecl) {
    const size = grid.size;
    for (let i = 0; i < size; i++) {
      setFunction(grid, 6, i, i % 2 === 0);
      setFunction(grid, i, 6, i % 2 === 0);
    }
    drawFinder(grid, 3, 3);
    drawFinder(grid, size - 4, 3);
    drawFinder(grid, 3, size - 4);
    const positions = alignmentPositions(version);
    const last = positions.length - 1;
    positions.forEach((py, i) => {
      positions.forEach((px, j) => {
        const overlapsFinder = (i === 0 && j === 0) || (i === 0 && j === last) || (i === last && j === 0);
        if (!overlapsFinder) {
          drawAlignment(grid, px, py);
        }
      });
    });
    // Reserve format areas now; real bits are drawn once the mask is chosen
    drawFormatBits(grid, ecl, 0);
    drawVersionBits(grid, version);
  }

  // Zig-zag placement of codeword bits, two columns at a time, right to left
  function drawCodewords(grid, codewords) {
    const size = grid.size;
    let i = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) {
        right = 5;
      }
      for (let vert = 0; vert < size; vert++) {
        for (let j = 0; j < 2; j++) {
          const x = right - j;
          const upward = ((right + 1) & 2) === 0;
          const y = upward ? size - 1 - vert : vert;
          if (!grid.isFunction[y][x] && i < codewords.length * 8) {
            grid.modules[y][x] = getBit(codewords[i >>> 3], 7 - (i & 7));
            i++;
          }
        }
      }
    }
  }

  const MASKS = [
    (x, y) => (x + y) % 2 === 0,
    (x, y) => y % 2 === 0,
    (x, y) => x % 3 === 0,
    (x, y) => (x + y) % 3 === 0,
    (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,
    (x, y) => ((x * y) % 2) + ((x * y) % 3) === 0,
    (x, y) => (((x * y) % 2) + ((x * y) % 3)) % 2 === 0,
    (x, y) => (((x + y) % 2) + ((x * y) % 3)) % 2 === 0,
  ];

  // XOR is its own inverse, so applying the same mask twice removes it
  function applyMask(grid, mask) {
    const test = MASKS[mask];
    for (let y = 0; y < grid.size; y++) {
      for (let x = 0; x < grid.size; x++) {
        if (!grid.isFunction[y][x] && test(x, y)) {
          grid.modules[y][x] = !grid.modules[y][x];
        }
      }
    }
  }

  /* ---------- mask penalty (rules N1–N4) ---------- */

  function linePenalty(line) {
    let score = 0;
    let runColor = line[0];
    let runLen = 1;
    for (let i = 1; i <= line.length; i++) {
      if (i < line.length && line[i] === runColor) {
        runLen++;
        continue;
      }
      if (runLen >= 5) {
        score += 3 + (runLen - 5);
      }
      runColor = line[i];
      runLen = 1;
    }
    // Finder-like 1:1:3:1:1 with four light modules on one side
    const s = line.map(v => (v ? '1' : '0')).join('');
    const patterns = ['10111010000', '00001011101'];
    patterns.forEach(p => {
      for (let at = s.indexOf(p); at !== -1; at = s.indexOf(p, at + 1)) {
        score += 40;
      }
    });
    return score;
  }

  function penaltyScore(grid) {
    const { size, modules } = grid;
    let score = 0;
    let dark = 0;
    for (let y = 0; y < size; y++) {
      score += linePenalty(modules[y]);
      score += linePenalty(modules.map(row => row[y]));
    }
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        if (modules[y][x]) {
          dark++;
        }
        if (x + 1 < size && y + 1 < size) {
          const c = modules[y][x];
          if (c === modules[y][x + 1] && c === modules[y + 1][x] && c === modules[y + 1][x + 1]) {
            score += 3;
          }
        }
      }
    }
    const percent = (dark * 100) / (size * size);
    score += Math.floor(Math.abs(percent - 50) / 5) * 10;
    return score;
  }

  /* ---------- public: encode ---------- */

  function pickVersion(segment, ecl, minVersion, maxVersion) {
    for (let v = minVersion; v <= maxVersion; v++) {
      if (segmentBitLength(segment, v) <= dataCodewords(v, ecl) * 8) {
        return v;
      }
    }
    throw new RangeError('QR: data too long for the allowed versions');
  }

  function buildCodewords(segment, version, ecl) {
    const capacityBits = dataCodewords(version, ecl) * 8;
    const bits = [];
    appendBits(bits, MODES[segment.mode].indicator, 4);
    appendBits(bits, segment.count, countBitsFor(segment.mode, version));
    segment.bits.forEach(b => bits.push(b));
    appendBits(bits, 0, Math.min(4, capacityBits - bits.length));
    appendBits(bits, 0, (8 - (bits.length % 8)) % 8);
    for (let pad = 0xec; bits.length < capacityBits; pad ^= 0xec ^ 0x11) {
      appendBits(bits, pad, 8);
    }
    const bytes = [];
    for (let i = 0; i < bits.length; i += 8) {
      bytes.push(bits.slice(i, i + 8).reduce((acc, b) => (acc << 1) | b, 0));
    }
    return bytes;
  }

  function encode(text, options = {}) {
    const { ecc = 'M', minVersion = 1, maxVersion = 40, mask = -1, boostEcc = true } = options;
    let ecl = ECL[ecc] || ECL.M;
    const segment = encodeSegment(String(text));
    const version = pickVersion(segment, ecl, minVersion, maxVersion);
    // Use a stronger level when it fits in the same version
    if (boostEcc) {
      ['M', 'Q', 'H'].forEach(name => {
        const candidate = ECL[name];
        if (candidate.idx > ecl.idx && segmentBitLength(segment, version) <= dataCodewords(version, candidate) * 8) {
          ecl = candidate;
        }
      });
    }
    const codewords = addEccAndInterleave(buildCodewords(segment, version, ecl), version, ecl);
    const grid = makeGrid(version * 4 + 17);
    drawFunctionPatterns(grid, version, ecl);
    drawCodewords(grid, codewords);
    let chosen = mask;
    if (chosen < 0) {
      let best = Infinity;
      for (let m = 0; m < 8; m++) {
        applyMask(grid, m);
        drawFormatBits(grid, ecl, m);
        const score = penaltyScore(grid);
        if (score < best) {
          best = score;
          chosen = m;
        }
        applyMask(grid, m);
      }
    }
    applyMask(grid, chosen);
    drawFormatBits(grid, ecl, chosen);
    const eccName = Object.keys(ECL).find(k => ECL[k] === ecl);
    return { version, size: grid.size, ecc: eccName, mask: chosen, mode: segment.mode, modules: grid.modules };
  }

  /* ---------- public: render ---------- */

  // One SVG path for all dark modules; scales cleanly and prints sharply
  function toSvg(input, options = {}) {
    const qr = typeof input === 'string' ? encode(input, options) : input;
    const { border = 4, dark = '#000', light = '#fff', label = 'QR code' } = options;
    const dim = qr.size + border * 2;
    const parts = [];
    for (let y = 0; y < qr.size; y++) {
      for (let x = 0; x < qr.size; x++) {
        if (qr.modules[y][x]) {
          parts.push(`M${x + border},${y + border}h1v1h-1z`);
        }
      }
    }
    const safeLabel = String(label).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${dim} ${dim}" role="img" aria-label="${safeLabel}" shape-rendering="crispEdges">`
      + `<rect width="100%" height="100%" fill="${light}"/>`
      + `<path d="${parts.join('')}" fill="${dark}"/></svg>`;
  }

  // Draw onto a canvas (for PNG download or printing at a fixed size)
  function toCanvas(input, canvas, options = {}) {
    const qr = typeof input === 'string' ? encode(input, options) : input;
    const { border = 4, scale = 8, dark = '#000', light = '#fff' } = options;
    const dim = (qr.size + border * 2) * scale;
    canvas.width = dim;
    canvas.height = dim;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = light;
    ctx.fillRect(0, 0, dim, dim);
    ctx.fillStyle = dark;
    for (let y = 0; y < qr.size; y++) {
      for (let x = 0; x < qr.size; x++) {
        if (qr.modules[y][x]) {
          ctx.fillRect((x + border) * scale, (y + border) * scale, scale, scale);
        }
      }
    }
    return canvas;
  }

  return { encode, toSvg, toCanvas };
})();

// =====================================================================
// SIGNAL CHAIN — filters and per-sample features. The live ride, the
// Signal Lab and the behaviour tests all run exactly this code.
// =====================================================================
const G0 = 9.80665;
const RAD = Math.PI / 180;

/** Deterministic PRNG (mulberry32) so seeded traces and trips look the same on every machine. */
function rng(seed) {
  return () => {
    seed |= 0;
    seed = (seed + 0x6d2b79f5) | 0;
    let x = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

/** Standard normal sample (Box–Muller) from a uniform generator. */
function gauss(r) {
  let u = 0;
  while (u === 0) u = r();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r());
}

const norm3 = v => Math.hypot(v[0], v[1], v[2]);

/** Angle between two 3-vectors in degrees (0 when either is zero). */
function angleDeg(a, b) {
  const na = norm3(a);
  const nb = norm3(b);
  if (!na || !nb) return 0;
  const c = (a[0] * b[0] + a[1] * b[1] + a[2] * b[2]) / (na * nb);
  return Math.acos(clamp(c, -1, 1)) / RAD;
}

/** First-order low-pass on a 3-vector. Alpha follows the real sample interval, so 50 Hz and 60 Hz phones behave alike. */
class LowPass3 {
  constructor(fc) {
    this.fc = fc;
    this.v = null;
  }

  step(x, y, z, dt) {
    if (!this.v) {
      this.v = [x, y, z];
      return this.v;
    }
    const rc = 1 / (2 * Math.PI * this.fc);
    const a = dt / (rc + dt);
    this.v[0] += a * (x - this.v[0]);
    this.v[1] += a * (y - this.v[1]);
    this.v[2] += a * (z - this.v[2]);
    return this.v;
  }
}

/**
 * Raw sample → features:
 *   acc  = |a| / g            total acceleration (1 g when still)
 *   lin  = |a − LPF(a)| / g   high-pass "linear" acceleration, where impacts show
 *   jerk = |Δlin| / Δt        g per second; impacts are sharp, braking is not
 *   rot  = |ω|                rotation rate in deg/s (tumbling)
 *   g*   = LPF(a)             gravity estimate, for tilt and lean
 *   lean = complementary filter of the roll rate, pulled toward a reference
 */
class SignalChain {
  constructor(cfg = {}) {
    this.grav = new LowPass3(cfg.gravityHz || 0.6);
    this.prevT = null;
    this.prevLin = 0;
    this.lean = 0;
    this.f = { t: 0, dt: 0.02, acc: 1, lin: 0, jerk: 0, rot: 0, gx: 0, gy: G0, gz: 0, kmh: null, lean: 0, yaw: 0 };
  }

  push(s) {
    const dt = this.prevT === null ? 0.02 : clamp(s.t - this.prevT, 0.001, 0.25);
    this.prevT = s.t;
    const g = this.grav.step(s.ax, s.ay, s.az, dt);
    const f = this.f;
    f.t = s.t;
    f.dt = dt;
    f.kmh = s.kmh;
    f.acc = Math.hypot(s.ax, s.ay, s.az) / G0;
    f.lin = Math.hypot(s.ax - g[0], s.ay - g[1], s.az - g[2]) / G0;
    f.jerk = Math.abs(f.lin - this.prevLin) / dt;
    this.prevLin = f.lin;
    f.rot = Math.hypot(s.rx, s.ry, s.rz);
    f.gx = g[0];
    f.gy = g[1];
    f.gz = g[2];
    f.yaw = s.ry;
    f.lean = this.leanStep(s, g, dt);
    return f;
  }

  // Lean (phone upright on the handlebar): integrate the roll rate, then pull gently toward a reference.
  // Moving: kinematic lean atan(v·ψ'/g), because in a balanced turn gravity and centripetal force add up
  // along the bike's own vertical and the accelerometer alone cannot see the lean. Stopped: gravity tilt.
  leanStep(s, g, dt) {
    const gravLean = Math.atan2(-g[0], g[1]) / RAD;
    const v = (s.kmh || 0) / 3.6;
    const ref = v > 3 ? Math.atan((v * s.ry * RAD) / G0) / RAD : gravLean;
    this.lean = 0.97 * (this.lean + s.rz * dt) + 0.03 * ref;
    this.lean = clamp(this.lean, -90, 90);
    return this.lean;
  }
}

/** Rolling mean / standard deviation over the last `span` seconds (stillness test). */
class RollingStd {
  constructor() {
    this.clear();
  }

  clear() {
    this.ts = [];
    this.vs = [];
    this.h = 0;
    this.sum = 0;
    this.sq = 0;
  }

  push(t, v, span) {
    this.ts.push(t);
    this.vs.push(v);
    this.sum += v;
    this.sq += v * v;
    while (t - this.ts[this.h] > span) {
      const old = this.vs[this.h++];
      this.sum -= old;
      this.sq -= old * old;
    }
    if (this.h > 512) {
      this.ts = this.ts.slice(this.h);
      this.vs = this.vs.slice(this.h);
      this.h = 0;
    }
  }

  count() {
    return this.ts.length - this.h;
  }

  span() {
    return this.count() ? this.ts[this.ts.length - 1] - this.ts[this.h] : 0;
  }

  std() {
    const n = this.count();
    if (n < 2) return Infinity;
    const m = this.sum / n;
    return Math.sqrt(Math.max(0, this.sq / n - m * m));
  }
}

// =====================================================================
// CRASH DETECTION ENGINE — a streaming state machine
//   ride ──impact──▶ impact ──tumble──▶ still ──quiet + stopped──▶ confirmed
//     ▲      │ drop (parked + free fall)  │ no tumble (bump)   │ riding on / moved on
//     └──────┴────────────────────────────┴────────────────────┘
// =====================================================================
const ENGINE_DEFAULTS = {
  gravityHz: 0.6,
  impactG: 1.5,
  jerkG: 10,
  rotDps: 200,
  tiltDeg: 45,
  tumbleS: 3,
  stillS: 5,
  stillStdG: 0.05,
  stopKmh: 5,
  stillTimeoutS: 20,
  freefallG: 0.4,
  freefallMs: 160,
  minKmh: 8,
  preS: 5,
  continueKmh: 15,
  countdown: 30,
};

/** Slider metadata shared by the Lab and the Engine page (labels come from STR: p_<key>, h_<key>). */
const ENGINE_PARAMS = [
  { k: 'impactG', min: 0.6, max: 8, step: 0.1, unit: 'g', dp: 1 },
  { k: 'jerkG', min: 0, max: 60, step: 1, unit: 'g/s', dp: 0 },
  { k: 'rotDps', min: 40, max: 600, step: 10, unit: '°/s', dp: 0 },
  { k: 'tiltDeg', min: 10, max: 120, step: 5, unit: '°', dp: 0 },
  { k: 'tumbleS', min: 1, max: 6, step: 0.5, unit: 's', dp: 1 },
  { k: 'stillS', min: 1, max: 15, step: 0.5, unit: 's', dp: 1 },
  { k: 'stillStdG', min: 0.01, max: 0.2, step: 0.005, unit: 'g', dp: 3 },
  { k: 'freefallMs', min: 60, max: 600, step: 10, unit: 'ms', dp: 0 },
  { k: 'minKmh', min: 0, max: 30, step: 1, unit: 'km/h', dp: 0 },
  { k: 'preS', min: 1, max: 30, step: 1, unit: 's', dp: 0 },
  { k: 'continueKmh', min: 8, max: 40, step: 1, unit: 'km/h', dp: 0 },
];

// Stage lights on the HUD: 0 riding · 1 impact · 2 tumble · 3 stillness · 4 alert
const STAGE_KEYS = ['st_ride', 'st_impact', 'st_tumble', 'st_still', 'st_alert'];

class CrashEngine {
  constructor(cfg = {}, opts = {}) {
    this.cfg = { ...ENGINE_DEFAULTS, ...cfg };
    this.autoReset = !!opts.autoReset;
    this.onEvent = opts.onEvent || null;
    this.events = [];
    this.lastT = 0;
    this.lastMovingT = -Infinity;
    this.ff = { start: null, end: 0, lastDur: 0, bigEnd: -Infinity, bigDur: 0 };
    this.snaps = [];
    this.nextSnap = 0;
    this.fastSince = null;
    this.win = new RollingStd();
    this.state = 'ride';
    this.cand = null;
    this.coolUntil = -Infinity;
  }

  stage() {
    if (this.state === 'confirmed') return 4;
    if (this.state === 'still') return 3;
    if (this.state === 'impact') return this.cand && this.cand.tumbled ? 2 : 1;
    return 0;
  }

  push(f) {
    const c = this.cfg;
    this.lastT = f.t;
    if (f.kmh != null && f.kmh >= c.minKmh) this.lastMovingT = f.t;
    this.trackFreefall(f);
    this.snapGravity(f);
    if (this.state === 'ride') this.watchImpact(f);
    else if (this.state === 'impact') this.watchTumble(f);
    else if (this.state === 'still') this.watchStill(f);
    return this.state;
  }

  // Free fall: total acceleration close to 0 g. Its length tells a dropped phone from a crash.
  trackFreefall(f) {
    const ff = this.ff;
    if (f.acc < this.cfg.freefallG) {
      if (ff.start === null) ff.start = f.t;
      ff.end = f.t;
      return;
    }
    if (ff.start !== null) {
      ff.lastDur = (ff.end - ff.start + f.dt) * 1000;
      if (ff.lastDur >= this.cfg.freefallMs) {
        ff.bigEnd = ff.end;
        ff.bigDur = ff.lastDur;
      }
      ff.start = null;
    }
  }

  // Gravity snapshots every 0.2 s for the last 3 s. The reference is 1.2 s old, from before a slow topple began.
  snapGravity(f) {
    if (f.t < this.nextSnap) return;
    this.nextSnap = f.t + 0.2;
    this.snaps.push({ t: f.t, g: [f.gx, f.gy, f.gz] });
    if (this.snaps.length > 15) this.snaps.shift();
  }

  gravityBefore(t, f) {
    for (let i = this.snaps.length - 1; i >= 0; i--) {
      if (t - this.snaps[i].t >= 1.2) return this.snaps[i].g.slice();
    }
    return this.snaps.length ? this.snaps[0].g.slice() : [f.gx, f.gy, f.gz];
  }

  watchImpact(f) {
    const c = this.cfg;
    if (f.t < this.coolUntil || f.lin < c.impactG || f.jerk < c.jerkG) return;
    const moving = f.kmh == null || f.t - this.lastMovingT <= c.preS;
    const ff = this.ff;
    // A long free fall that ended within the last second (the first strike or a bounce follows it).
    const fellFreely = f.t - ff.bigEnd <= 1;
    this.cand = { t: f.t, peak: f.lin, jerk: f.jerk, maxRot: f.rot, maxTilt: 0, moving, ffMs: fellFreely ? ff.bigDur : 0, gRef: this.gravityBefore(f.t, f), tumbled: false };
    this.emit('candidate', f, { peak: f.lin, jerk: f.jerk, moving });
    if (!moving && fellFreely) {
      this.reject(f, 'drop');
      return;
    }
    this.state = 'impact';
  }

  watchTumble(f) {
    const c = this.cfg;
    const k = this.cand;
    k.peak = Math.max(k.peak, f.lin);
    k.maxRot = Math.max(k.maxRot, f.rot);
    k.maxTilt = Math.max(k.maxTilt, angleDeg(k.gRef, [f.gx, f.gy, f.gz]));
    if (!k.tumbled && (k.maxRot >= c.rotDps || k.maxTilt >= c.tiltDeg)) {
      k.tumbled = true;
      this.emit('tumble', f, { rot: k.maxRot, tilt: k.maxTilt });
    }
    if (f.t - k.t < c.tumbleS) return;
    if (!k.tumbled) {
      this.reject(f, 'bump');
      return;
    }
    this.state = 'still';
    this.win.clear();
    this.fastSince = null;
  }

  watchStill(f) {
    const c = this.cfg;
    if (this.keptRiding(f)) {
      this.reject(f, 'riding');
      return;
    }
    this.win.push(f.t, f.acc, c.stillS);
    const slow = f.kmh == null || f.kmh <= c.stopKmh;
    if (slow && this.win.span() >= c.stillS - f.dt && this.win.std() < c.stillStdG) {
      this.confirm(f);
      return;
    }
    if (f.t - this.cand.t > c.stillTimeoutS) this.reject(f, 'moved');
  }

  // GPS speed lags by a second or two, so "still riding" needs 2 s above the limit.
  keptRiding(f) {
    if (f.kmh == null || f.kmh <= this.cfg.continueKmh) {
      this.fastSince = null;
      return false;
    }
    if (this.fastSince === null) this.fastSince = f.t;
    return f.t - this.fastSince >= 2;
  }

  confirm(f) {
    const k = this.cand;
    k.confirmT = f.t;
    k.finalTilt = angleDeg(k.gRef, [f.gx, f.gy, f.gz]);
    this.state = 'confirmed';
    this.emit('confirm', f, { peak: k.peak, rot: k.maxRot, tilt: k.maxTilt, std: this.win.std(), latency: f.t - k.t });
    if (this.autoReset) this.ack(30);
  }

  reject(f, reason) {
    this.emit('reject', f, { reason });
    this.state = 'ride';
    this.cand = null;
    this.coolUntil = f.t + 1;
  }

  /** Called after the countdown ends or "I am OK" is pressed: back to monitoring after a quiet period. */
  ack(cooldownS = 10) {
    this.state = 'ride';
    this.cand = null;
    this.coolUntil = this.lastT + cooldownS;
  }

  emit(type, f, data) {
    const ev = { t: f.t, type, ...data };
    this.events.push(ev);
    if (this.events.length > 300) this.events.shift();
    if (this.onEvent) this.onEvent(ev, this);
  }
}

// =====================================================================
// TRACE SYNTHESISER — procedurally generated, labelled sensor traces.
// Physics-lite model of a phone on a motorcycle: gravity reaction along
// the bike's vertical, longitudinal acceleration, engine and road
// vibration, wheel strikes, free fall, impacts and tumbling, a 1 Hz GPS
// speed with lag, ±8 g accelerometer saturation. The live simulator
// streams from the same class, so Lab and HUD see identical physics.
// =====================================================================
const TRACE_KINDS = [
  { id: 'normal', crash: false, icon: 'bike' },
  { id: 'breaker', crash: false, icon: 'bump' },
  { id: 'pothole', crash: false, icon: 'pothole' },
  { id: 'brake', crash: false, icon: 'brake' },
  { id: 'drop', crash: false, icon: 'phone' },
  { id: 'skid', crash: true, icon: 'skid' },
  { id: 'impact', crash: true, icon: 'crash' },
  { id: 'standfall', crash: true, icon: 'alert' },
];
const kindInfo = id => TRACE_KINDS.find(k => k.id === id) || TRACE_KINDS[0];
const ACC_SAT = 8 * G0;

/** Rodrigues rotation of v about unit axis k by angle a (radians). */
function rotateVec(v, k, a) {
  const c = Math.cos(a);
  const s = Math.sin(a);
  const d = k[0] * v[0] + k[1] * v[1] + k[2] * v[2];
  return [
    v[0] * c + (k[1] * v[2] - k[2] * v[1]) * s + k[0] * d * (1 - c),
    v[1] * c + (k[2] * v[0] - k[0] * v[2]) * s + k[1] * d * (1 - c),
    v[2] * c + (k[0] * v[1] - k[1] * v[0]) * s + k[2] * d * (1 - c),
  ];
}

function randUnit(r) {
  const v = [gauss(r), gauss(r), gauss(r)];
  const n = norm3(v) || 1;
  return [v[0] / n, v[1] / n, v[2] / n];
}

class Synth {
  constructor(seed, opts = {}) {
    this.r = rng(seed);
    this.hz = opts.hz || 50;
    this.dt = 1 / this.hz;
    this.noise = opts.noise ?? 1;
    this.pocket = opts.placement === 'pocket' ? { k: randUnit(this.r), a: 0.4 + this.r() * 2.4 } : null;
    this.t = 0;
    this.v = 0;
    this.yaw = 0;
    this.lean = 0;
    this.heading = 0;
    this.up = [0, 1, 0];
    this.vib = 0.02;
    this.gps = { at: 0, kmh: 0 };
    this.cols = { t: [], ax: [], ay: [], az: [], rx: [], ry: [], rz: [], kmh: [] };
    this.marks = [];
    this.recovered = false;
  }

  rand(a, b) {
    return a + (b - a) * this.r();
  }

  mark(kind) {
    this.marks.push({ t: this.t, kind });
  }

  /** Append one sample: f = specific force (m/s²), w = rotation rate (deg/s), both in the mount frame. */
  push(f, w) {
    const r = this.r;
    const vib = this.vib * G0 * this.noise;
    let a = [f[0] + gauss(r) * vib, f[1] + gauss(r) * vib, f[2] + gauss(r) * vib];
    let g = [w[0] + gauss(r) * 1.2 * this.noise, w[1] + gauss(r) * 1.2 * this.noise, w[2] + gauss(r) * 1.2 * this.noise];
    if (this.pocket) {
      a = rotateVec(a, this.pocket.k, this.pocket.a);
      g = rotateVec(g, this.pocket.k, this.pocket.a);
    }
    const c = this.cols;
    c.t.push(Math.round(this.t * 1000) / 1000);
    c.ax.push(clamp(a[0], -ACC_SAT, ACC_SAT));
    c.ay.push(clamp(a[1], -ACC_SAT, ACC_SAT));
    c.az.push(clamp(a[2], -ACC_SAT, ACC_SAT));
    c.rx.push(g[0]);
    c.ry.push(g[1]);
    c.rz.push(g[2]);
    c.kmh.push(this.gpsStep());
    this.t += this.dt;
  }

  // Doppler GPS speed: one fix per second, about one second of lag, a little noise.
  gpsStep() {
    if (this.t >= this.gps.at) {
      this.gps.at = this.t + 1;
      const target = this.v * 3.6;
      this.gps.kmh = Math.max(0, 0.35 * this.gps.kmh + 0.65 * target + gauss(this.r) * 0.6 * this.noise);
    }
    return Math.round(this.gps.kmh * 10) / 10;
  }

  /** Riding upright: the gravity reaction (plus any vertical wheel strike) along the bike's vertical; forward is −z. */
  rideForce(accel, bumpG = 0) {
    const vert = G0 / Math.cos(this.lean * RAD) + bumpG * G0;
    return [this.up[0] * vert, this.up[1] * vert, this.up[2] * vert - accel];
  }

  // A world-fixed vector seen from a device turning at w (deg/s) rotates the opposite way.
  spin(w) {
    const m = norm3(w);
    if (!m) return;
    this.up = rotateVec(this.up, [w[0] / m, w[1] / m, w[2] / m], -m * RAD * this.dt);
    const n = norm3(this.up);
    this.up = [this.up[0] / n, this.up[1] / n, this.up[2] / n];
  }

  steps(sec) {
    return Math.max(1, Math.round(sec * this.hz));
  }

  /** Ride toward a target speed (km/h) with a yaw rate (deg/s, + = right); rough = road roughness in g. */
  ride(sec, { kmh = 30, yaw = 0, accel = 1.4, rough = 0.05 } = {}) {
    const n = this.steps(sec);
    for (let i = 0; i < n; i++) {
      const dv = clamp(kmh / 3.6 - this.v, -accel * 1.6 * this.dt, accel * this.dt);
      this.v = Math.max(0, this.v + dv);
      this.yaw += (yaw - this.yaw) * 0.06;
      const leanTarget = Math.atan((this.v * this.yaw * RAD) / G0) / RAD;
      const dLean = (leanTarget - this.lean) * 0.08;
      this.lean += dLean;
      this.heading += this.yaw * this.dt;
      this.vib = 0.015 + rough * Math.min(1, this.v / 10);
      const road = this.v > 1 ? gauss(this.r) * rough * 0.5 : 0;
      this.push(this.rideForce(dv / this.dt, road), [gauss(this.r) * 3 * Math.min(1, this.v / 8), this.yaw * Math.cos(this.lean * RAD), dLean / this.dt]);
    }
  }

  /** Engine idling (or off) at a stop: the phone stays upright on the mount. */
  idle(sec, { engine = true } = {}) {
    const n = this.steps(sec);
    this.v = 0;
    this.yaw = 0;
    this.lean *= 0.5;
    for (let i = 0; i < n; i++) {
      this.vib = engine ? 0.016 : 0.004;
      this.push(this.rideForce(0), [0, 0, 0]);
    }
  }

  /** Hard braking: constant deceleration with fork dive and ABS-like chatter. */
  brake({ decelG = 0.7, toKmh = 5 } = {}) {
    const a = decelG * G0;
    let i = 0;
    while (this.v * 3.6 > toKmh + 0.1 && i < this.hz * 8) {
      const dv = Math.min(this.v - toKmh / 3.6, a * this.dt);
      this.v -= dv;
      this.vib = 0.07;
      const pitch = i < 8 ? -35 : gauss(this.r) * 6;
      this.push(this.rideForce(-dv / this.dt), [pitch, this.yaw, 0]);
      i++;
    }
  }

  /** One wheel strike: half-sine vertical pulse (ampG over ms), pitch kick, optional handlebar jolt. */
  pulse(ampG, ms, { pitch = 0, jolt = 0, backG = 0 } = {}) {
    const n = Math.max(1, Math.round((ms / 1000) * this.hz));
    for (let i = 0; i < n; i++) {
      const s = Math.sin((Math.PI * (i + 0.5)) / n);
      const f = this.rideForce(0, ampG * s);
      f[2] += backG * G0 * s;
      this.vib = 0.06;
      this.push(f, [pitch * s, this.yaw + jolt * s * 0.4, jolt * s]);
    }
  }

  /** Pakistani speed breaker: slow down (or not), front wheel, then rear wheel one wheelbase later. */
  speedBreaker({ ampG = 1.6, slowTo = 18, count = 1 } = {}) {
    if (slowTo) this.ride(this.rand(1.4, 2.4), { kmh: slowTo, accel: 2.2 });
    for (let b = 0; b < count; b++) {
      this.mark('breaker');
      const gap = 1.25 / Math.max(this.v, 2);
      this.pulse(ampG * this.rand(0.85, 1.1), this.rand(90, 150), { pitch: this.rand(25, 55) });
      this.ride(gap, { kmh: this.v * 3.6, rough: 0.03 });
      this.pulse(ampG * this.rand(0.65, 0.95), this.rand(90, 150), { pitch: -this.rand(25, 55) });
      if (b < count - 1) this.ride(this.rand(0.6, 1.2), { kmh: this.v * 3.6 });
    }
  }

  /** Pothole: a short, sharp strike with a backward kick and a handlebar jolt. */
  pothole({ ampG = 2.2, jolt = 80 } = {}) {
    this.mark('pothole');
    const gap = 1.25 / Math.max(this.v, 2);
    this.pulse(ampG, this.rand(30, 60), { pitch: this.rand(30, 70), jolt, backG: -ampG * 0.35 });
    this.ride(gap, { kmh: this.v * 3.6, rough: 0.08 });
    this.pulse(ampG * this.rand(0.55, 0.9), this.rand(30, 60), { pitch: -this.rand(20, 50), backG: -ampG * 0.2 });
  }

  /** Phone in the hand while parked: slow sway and small hand movements. */
  handle(sec, amp = 1) {
    const n = this.steps(sec);
    const ph = [this.rand(0, 6), this.rand(0, 6), this.rand(0, 6)];
    this.v = 0;
    for (let i = 0; i < n; i++) {
      const tt = this.t;
      const w = [Math.sin(tt * 1.3 + ph[0]) * 14 * amp, Math.sin(tt * 0.9 + ph[1]) * 11 * amp, Math.sin(tt * 1.7 + ph[2]) * 9 * amp];
      this.spin(w);
      this.vib = 0.03 * amp;
      this.push([this.up[0] * G0, this.up[1] * G0, this.up[2] * G0], w);
    }
  }

  /** Free fall: the accelerometer reads about 0 g while the phone spins. */
  freefall(ms, spinDps = 200) {
    const n = Math.max(1, Math.round((ms / 1000) * this.hz));
    const axis = randUnit(this.r);
    for (let i = 0; i < n; i++) {
      const w = [axis[0] * spinDps, axis[1] * spinDps, axis[2] * spinDps];
      this.spin(w);
      this.vib = 0.008;
      this.push([0, 0, 0], w);
    }
  }

  /** Impact: half-sine pulse of peakG along dir (random if omitted), clipped later by sensor saturation. */
  impact(peakG, ms = 45, dir = null) {
    const raw = dir || randUnit(this.r);
    const dn = norm3(raw) || 1;
    const d = [raw[0] / dn, raw[1] / dn, raw[2] / dn];
    const n = Math.max(2, Math.round((ms / 1000) * this.hz));
    const kick = randUnit(this.r);
    for (let i = 0; i < n; i++) {
      const s = Math.sin((Math.PI * (i + 0.5)) / n);
      const f = [this.up[0] * G0 + d[0] * peakG * G0 * s, this.up[1] * G0 + d[1] * peakG * G0 * s, this.up[2] * G0 + d[2] * peakG * G0 * s];
      const w = [kick[0] * 250 * s, kick[1] * 250 * s, kick[2] * 250 * s];
      this.spin(w);
      this.vib = 0.1;
      this.push(f, w);
    }
  }

  /** Tumbling and sliding along the road: changing spin axis, scraping, speed bleeding off. */
  tumble(sec, { rot = 300, decelG = 0.6, scrape = 0.25 } = {}) {
    const n = this.steps(sec);
    let axis = randUnit(this.r);
    for (let i = 0; i < n; i++) {
      if (i % 12 === 0) axis = randUnit(this.r);
      const rate = rot * (1 - (i / n) * 0.75);
      const w = [axis[0] * rate, axis[1] * rate, axis[2] * rate];
      this.spin(w);
      this.v = Math.max(0, this.v - decelG * G0 * this.dt);
      this.vib = scrape;
      this.push([this.up[0] * G0, this.up[1] * G0, this.up[2] * G0], w);
    }
  }

  /** Bike tips over sideways (rotation about the forward axis), gravity-driven so it speeds up. */
  topple(sec, toDeg) {
    const n = this.steps(sec);
    let ang = 0;
    for (let i = 1; i <= n; i++) {
      const target = toDeg * (i / n) ** 2;
      const rate = (target - ang) / this.dt;
      ang = target;
      const w = [0, 0, rate];
      this.spin(w);
      this.v = Math.max(0, this.v - 2 * this.dt);
      this.vib = 0.03;
      this.push([this.up[0] * G0, this.up[1] * G0, this.up[2] * G0], w);
    }
  }

  /** Lying on the ground; an idling engine adds a little vibration. */
  lie(sec, { engine = false } = {}) {
    const n = this.steps(sec);
    this.v = 0;
    for (let i = 0; i < n; i++) {
      this.vib = engine ? 0.014 : 0.004;
      this.push([this.up[0] * G0, this.up[1] * G0, this.up[2] * G0], [0, 0, 0]);
    }
  }

  /** High-speed impact: frontal strike, rider thrown (free fall), second strike, tumble to rest. */
  crashImpact() {
    this.mark('impact');
    this.impact(this.rand(6, 16), this.rand(40, 80), [this.rand(-0.3, 0.3), this.rand(-0.2, 0.4), 1]);
    this.v *= 0.3;
    this.freefall(this.rand(250, 700), this.rand(250, 700));
    this.impact(this.rand(3, 9), this.rand(30, 60));
    this.tumble(this.rand(1, 2.5), { rot: this.rand(200, 600), decelG: 0.7, scrape: this.rand(0.2, 0.4) });
    this.v = 0;
  }

  /** Low-speed skid: the rear slides out in a turn, the bike goes down and slides to a stop. */
  crashSkid(dir) {
    this.mark('skid');
    this.topple(this.rand(0.4, 0.8), dir * this.rand(70, 95));
    this.impact(this.rand(1.5, 4.2), this.rand(30, 60));
    this.tumble(this.rand(0.6, 1.6), { rot: this.rand(30, 120), decelG: 0.5, scrape: this.rand(0.15, 0.35) });
    this.v = 0;
  }

  /** Phone dropped from h metres: free fall, a knock, often a bounce. */
  dropPhone(h) {
    this.mark('drop');
    this.freefall(Math.sqrt((2 * h) / G0) * 1000, this.rand(60, 500));
    this.impact(this.rand(2.5, 9) * Math.min(1, 0.45 + h), this.rand(15, 40));
    if (this.r() < 0.6) {
      this.freefall(this.rand(40, 90), 300);
      this.impact(this.rand(1, 2.5), 25);
    }
  }

  /** Back on the bike after a fall: stand it up and ride away. */
  recover() {
    this.recovered = true;
    this.handle(2.5, 2.5);
    this.up = [0, 1, 0];
    this.lean = 0;
    this.idle(1.5);
  }

  /** Pad to `total` seconds: keep riding, idling or lying, whichever fits the current state. */
  finish(total, mode) {
    const left = total - this.t;
    if (left <= 0) return;
    if (mode === 'lie') this.lie(left);
    else if (this.v < 0.5) this.idle(left);
    else this.ride(left, { kmh: this.v * 3.6 });
  }

  /** Freeze the columns into Float32Arrays for evaluation and plotting. */
  toTrace(kind, seed, eventT) {
    const cols = {};
    Object.keys(this.cols).forEach(k => (cols[k] = Float32Array.from(this.cols[k])));
    return { id: `${kind}-${seed}`, kind, label: kindInfo(kind).crash ? 1 : 0, seed, hz: this.hz, cols, marks: this.marks, eventT, pocket: !!this.pocket, recovered: this.recovered };
  }
}

// =====================================================================
// LABELLED SCENARIOS, DATASET, EVALUATION (confusion matrix, precision,
// recall, F1, parametric ROC) and CSV import / export of traces
// =====================================================================
const TRACE_LEN = 24;
const flip = s => (s.r() < 0.5 ? -1 : 1);

// Each builder scripts one labelled scenario and marks the moment of interest.
const BUILDERS = {
  normal(s) {
    const v0 = s.rand(25, 55);
    s.ride(s.rand(3, 5), { kmh: v0, rough: s.rand(0.03, 0.09) });
    s.ride(s.rand(2.5, 4), { kmh: v0 * 0.8, yaw: flip(s) * s.rand(10, 26) });
    s.mark('normal');
    for (let i = 0; i < 3; i++) {
      s.pulse(s.rand(0.2, 0.7), s.rand(40, 120), { pitch: s.rand(5, 15) });
      s.ride(s.rand(0.8, 1.6), { kmh: v0, rough: 0.09 });
    }
    if (s.r() < 0.4) {
      s.ride(3, { kmh: 0, accel: 2.4 });
      s.idle(s.rand(3, 6));
    }
    s.ride(Math.max(0.5, TRACE_LEN - s.t), { kmh: s.rand(25, 45) });
  },

  breaker(s) {
    const v0 = s.rand(28, 48);
    s.ride(s.rand(4, 6), { kmh: v0 });
    const careless = s.r() < 0.3;
    const count = s.r() < 0.35 ? (s.r() < 0.5 ? 2 : 3) : 1;
    s.speedBreaker({ ampG: careless ? s.rand(1.8, 2.8) : s.rand(0.9, 2), slowTo: careless ? 0 : s.rand(12, 25), count });
    s.ride(s.rand(3, 5), { kmh: v0 });
    if (s.r() < 0.4) s.speedBreaker({ ampG: s.rand(0.9, 2), slowTo: s.rand(12, 25) });
    s.finish(TRACE_LEN, 'ride');
  },

  pothole(s) {
    const v0 = s.rand(25, 50);
    s.ride(s.rand(4, 7), { kmh: v0, rough: 0.08 });
    s.pothole({ ampG: s.rand(1.2, 3.6), jolt: flip(s) * s.rand(40, 170) });
    if (s.r() < 0.25) {
      s.ride(s.rand(2, 3.5), { kmh: 0, accel: 2.4 });
      s.idle(s.rand(6, 10));
    }
    s.finish(TRACE_LEN, 'ride');
  },

  brake(s) {
    s.ride(s.rand(4, 6), { kmh: s.rand(40, 70) });
    s.mark('brake');
    const stop = s.r() < 0.5;
    s.brake({ decelG: s.rand(0.55, 0.95), toKmh: stop ? 0 : s.rand(8, 18) });
    if (stop) s.idle(s.rand(5, 8));
    s.ride(Math.max(0.5, TRACE_LEN - s.t), { kmh: s.rand(30, 50), accel: 2 });
  },

  drop(s) {
    if (s.r() < 0.3) {
      s.ride(s.rand(3, 4), { kmh: s.rand(15, 25) });
      s.ride(2.5, { kmh: 0, accel: 2.4 });
    }
    s.idle(s.rand(1, 2), { engine: false });
    s.handle(s.rand(4, 6));
    s.dropPhone(s.rand(0.15, 1.2));
    s.lie(s.rand(5, 8));
    if (s.r() < 0.5) s.handle(s.rand(2, 4));
    s.finish(TRACE_LEN, 'lie');
  },

  skid(s) {
    const v0 = s.rand(15, 30);
    const dir = flip(s);
    s.ride(s.rand(3, 5), { kmh: v0 });
    s.ride(s.rand(1.5, 2.5), { kmh: v0, yaw: dir * s.rand(18, 30) });
    s.crashSkid(dir);
    afterFall(s, 0.25);
  },

  impact(s) {
    s.ride(s.rand(4, 7), { kmh: s.rand(40, 80) });
    s.crashImpact();
    if (s.r() < 0.2) {
      s.lie(s.rand(3, 6));
      s.handle(1.5, 0.6);
    }
    s.finish(TRACE_LEN, 'lie');
  },

  standfall(s) {
    if (s.r() < 0.5) s.ride(s.rand(4, 6), { kmh: s.rand(2, 5), accel: 0.8 });
    else s.idle(s.rand(4, 6));
    s.mark('standfall');
    s.topple(s.rand(0.6, 1.3), flip(s) * s.rand(70, 95));
    s.impact(s.rand(1.4, 3.4), s.rand(30, 60));
    s.v = 0;
    afterFall(s, 0.3);
  },
};

// After a fall the rider either lies still (engine running or not) or gets up quickly and rides off.
function afterFall(s, upChance) {
  if (s.r() < upChance) {
    s.lie(s.rand(2.5, 4.5), { engine: s.r() < 0.5 });
    s.recover();
    s.ride(Math.max(0.5, TRACE_LEN - s.t), { kmh: 15 });
    return;
  }
  s.lie(Math.max(0.5, TRACE_LEN - s.t), { engine: s.r() < 0.5 });
}

function buildTrace(kind, seed, opts = {}) {
  const s = new Synth(seed, opts);
  BUILDERS[kind](s);
  const m = s.marks.find(x => x.kind === kind) || s.marks[0];
  return s.toTrace(kind, seed, m ? m.t : null);
}

/** A labelled test set: `per` traces of every kind, about 30 % carried in a pocket instead of on the mount. */
function makeDataset({ seed = 2026, per = 12, noise = 1, pocket = 0.3 } = {}) {
  const r = rng(seed);
  const out = [];
  TRACE_KINDS.forEach(k => {
    for (let i = 0; i < per; i++) {
      const s = Math.floor(r() * 1e9);
      out.push(buildTrace(k.id, s, { noise, placement: r() < pocket ? 'pocket' : 'mount' }));
    }
  });
  return out;
}

/** Features are cached per trace and gravity cut-off, so threshold sweeps only re-run the state machine. */
function traceFeatures(tr, gravityHz) {
  if (tr._feat && tr._feat.hz === gravityHz) return tr._feat;
  const c = tr.cols;
  const n = c.t.length;
  const F = { hz: gravityHz, n };
  ['t', 'dt', 'acc', 'lin', 'jerk', 'rot', 'gx', 'gy', 'gz', 'kmh', 'lean'].forEach(k => (F[k] = new Float32Array(n)));
  const chain = new SignalChain({ gravityHz });
  const s = {};
  for (let i = 0; i < n; i++) {
    s.t = c.t[i];
    s.ax = c.ax[i];
    s.ay = c.ay[i];
    s.az = c.az[i];
    s.rx = c.rx[i];
    s.ry = c.ry[i];
    s.rz = c.rz[i];
    s.kmh = Number.isNaN(c.kmh[i]) ? null : c.kmh[i];
    const f = chain.push(s);
    ['t', 'dt', 'acc', 'lin', 'jerk', 'rot', 'gx', 'gy', 'gz', 'lean'].forEach(k => (F[k][i] = f[k]));
    F.kmh[i] = f.kmh == null ? NaN : f.kmh;
  }
  tr._feat = F;
  return F;
}

/** Run the crash engine over one trace; returns whether (and when) it confirmed, plus every stage event. */
function runTrace(tr, cfg) {
  const F = traceFeatures(tr, cfg.gravityHz);
  const eng = new CrashEngine(cfg, { autoReset: true });
  const f = { t: 0, dt: 0.02, acc: 1, lin: 0, jerk: 0, rot: 0, gx: 0, gy: 0, gz: 0, kmh: null };
  for (let i = 0; i < F.n; i++) {
    f.t = F.t[i];
    f.dt = F.dt[i];
    f.acc = F.acc[i];
    f.lin = F.lin[i];
    f.jerk = F.jerk[i];
    f.rot = F.rot[i];
    f.gx = F.gx[i];
    f.gy = F.gy[i];
    f.gz = F.gz[i];
    f.kmh = Number.isNaN(F.kmh[i]) ? null : F.kmh[i];
    eng.push(f);
  }
  const conf = eng.events.find(e => e.type === 'confirm');
  return { detected: !!conf, confirmT: conf ? conf.t : null, events: eng.events.slice() };
}

function metrics(cm) {
  const pos = cm.tp + cm.fn;
  const neg = cm.fp + cm.tn;
  const precision = cm.tp + cm.fp ? cm.tp / (cm.tp + cm.fp) : NaN;
  const recall = pos ? cm.tp / pos : NaN;
  const f1 = precision + recall > 0 ? (2 * precision * recall) / (precision + recall) : 0;
  return {
    precision,
    recall,
    f1: Number.isNaN(f1) ? 0 : f1,
    accuracy: pos + neg ? (cm.tp + cm.tn) / (pos + neg) : NaN,
    fpr: neg ? cm.fp / neg : 0,
    specificity: neg ? cm.tn / neg : NaN,
  };
}

/** Evaluate the detector on a labelled set: per-trace outcome, confusion matrix, metrics, per-kind rates, latency. */
function evaluate(set, cfg) {
  const cm = { tp: 0, fp: 0, tn: 0, fn: 0 };
  const per = {};
  const lat = [];
  const rows = set.map(tr => {
    const res = runTrace(tr, cfg);
    const outcome = tr.label ? (res.detected ? 'tp' : 'fn') : res.detected ? 'fp' : 'tn';
    cm[outcome]++;
    const p = (per[tr.kind] = per[tr.kind] || { n: 0, det: 0, label: tr.label });
    p.n++;
    if (res.detected) p.det++;
    const latency = res.detected && tr.label && tr.eventT != null ? res.confirmT - tr.eventT : null;
    if (latency != null) lat.push(latency);
    return { tr, res, outcome, latency };
  });
  const latency = lat.length ? lat.reduce((a, b) => a + b, 0) / lat.length : null;
  return { rows, cm, per, latency, ...metrics(cm) };
}

// Values swept for the parametric ROC: each point is one threshold value, all other settings fixed.
const SWEEPS = {
  impactG: [0.6, 0.8, 1, 1.2, 1.4, 1.6, 1.8, 2, 2.3, 2.6, 3, 3.5, 4, 5, 6, 8, 12],
  rotDps: [40, 60, 80, 100, 130, 160, 200, 250, 300, 400, 500, 700, 1000],
  tiltDeg: [10, 15, 20, 30, 40, 45, 50, 60, 75, 90, 120, 180],
  stillStdG: [0.2, 0.15, 0.1, 0.08, 0.06, 0.05, 0.04, 0.03, 0.02, 0.012, 0.008, 0.005],
  stillS: [1, 2, 3, 4, 5, 6, 8, 10, 12, 15, 20],
  freefallMs: [600, 400, 300, 240, 200, 160, 120, 100, 80, 60, 40],
  preS: [1, 2, 3, 4, 5, 6, 8, 10, 12, 15, 20, 30],
};

/** Parametric ROC over one threshold; AUC by the trapezoid rule after adding the (0,0) and (1,1) anchors. */
function rocCurve(set, cfg, param) {
  const values = [...new Set([...SWEEPS[param], cfg[param]])].sort((a, b) => a - b);
  const pts = values.map(v => {
    const e = evaluate(set, { ...cfg, [param]: v });
    return { v, tpr: e.recall || 0, fpr: e.fpr };
  });
  const curve = [{ fpr: 0, tpr: 0 }, ...pts, { fpr: 1, tpr: 1 }].sort((a, b) => a.fpr - b.fpr || a.tpr - b.tpr);
  let auc = 0;
  for (let i = 1; i < curve.length; i++) auc += ((curve[i].fpr - curve[i - 1].fpr) * (curve[i].tpr + curve[i - 1].tpr)) / 2;
  return { pts, curve, auc };
}

// ---------- CSV: one row per sample; the same format is used for export and import ----------
const CSV_HEAD = 't_s,ax_ms2,ay_ms2,az_ms2,rx_dps,ry_dps,rz_dps,speed_kmh,label';

function traceToCsv(tr, label = tr.kind) {
  const c = tr.cols;
  const lines = [CSV_HEAD];
  for (let i = 0; i < c.t.length; i++) {
    const sp = Number.isNaN(c.kmh[i]) ? '' : c.kmh[i].toFixed(1);
    lines.push(`${c.t[i].toFixed(3)},${c.ax[i].toFixed(3)},${c.ay[i].toFixed(3)},${c.az[i].toFixed(3)},${c.rx[i].toFixed(2)},${c.ry[i].toFixed(2)},${c.rz[i].toFixed(2)},${sp},${label}`);
  }
  return lines.join('\n');
}

/** Parse our CSV (or any CSV with the same first eight columns) into plain arrays; null if it does not fit. */
function csvToCols(text) {
  const rows = String(text).trim().split(/\r?\n/);
  if (rows.length < 3) return null;
  const cols = { t: [], ax: [], ay: [], az: [], rx: [], ry: [], rz: [], kmh: [] };
  const keys = Object.keys(cols);
  let label = '';
  for (const row of rows.slice(1)) {
    const p = row.split(',');
    if (p.length < 7) continue;
    const nums = p.slice(0, 8).map(x => (x === '' ? NaN : Number(x)));
    if (nums.slice(0, 7).some(Number.isNaN)) return null;
    keys.forEach((k, i) => cols[k].push(nums[i]));
    label = p[8] || label;
  }
  return cols.t.length >= 2 ? { cols, label: label.trim() } : null;
}

// =====================================================================
// SENSORS AND SIMULATOR — DeviceMotion / DeviceOrientation (with the iOS
// permission prompt), Geolocation watchPosition and the Screen Wake Lock,
// plus a trace-replay simulator that drives the same pipeline when the
// sensors are missing (desktop, headless browser, no permission).
// =====================================================================
const SENS = { motion: 'unknown', orient: 'unknown', geo: 'unknown', wake: 'unknown', vibrate: false, audio: false, secure: false };
const LIVE = { onMotion: null, onOrient: null, watchId: null, wake: null, gps: null, compass: null, samples: 0 };

/** Presence only; whether data really arrives is learned during a ride. */
function detectSensors() {
  SENS.secure = !!window.isSecureContext;
  const dm = 'DeviceMotionEvent' in window;
  SENS.motion = !dm ? 'absent' : typeof DeviceMotionEvent.requestPermission === 'function' ? 'ask' : 'api';
  SENS.orient = 'DeviceOrientationEvent' in window ? 'api' : 'absent';
  SENS.geo = 'geolocation' in navigator ? 'api' : 'absent';
  SENS.wake = 'wakeLock' in navigator ? 'api' : 'absent';
  SENS.vibrate = 'vibrate' in navigator;
  SENS.audio = !!(window.AudioContext || window.webkitAudioContext);
}

// iOS 13+ only delivers motion events after an explicit permission prompt inside a tap.
async function askMotionPermission() {
  try {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      const res = await DeviceMotionEvent.requestPermission();
      if (res !== 'granted') {
        SENS.motion = 'denied';
        return false;
      }
    }
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      await DeviceOrientationEvent.requestPermission().catch(() => 'denied');
    }
    return true;
  } catch {
    SENS.motion = 'denied';
    return false;
  }
}

const gpsFresh = () => LIVE.gps && now() - LIVE.gps.t < 5000;
const gpsKmh = () => (gpsFresh() ? LIVE.gps.kmh : null);

/** Phone sensors → raw samples. rotationRate alpha/beta/gamma are rates about z/x/y in deg/s. */
function startSensors(feed) {
  LIVE.samples = 0;
  LIVE.onMotion = e => {
    const a = e.accelerationIncludingGravity;
    if (!a || a.x == null) return;
    const r = e.rotationRate || {};
    LIVE.samples++;
    SENS.motion = 'ok';
    feed({ t: e.timeStamp / 1000, ax: a.x, ay: a.y, az: a.z, rx: r.beta || 0, ry: r.gamma || 0, rz: r.alpha || 0, kmh: gpsKmh() });
  };
  LIVE.onOrient = e => {
    const h = e.webkitCompassHeading != null ? e.webkitCompassHeading : e.absolute && e.alpha != null ? 360 - e.alpha : null;
    if (h != null) LIVE.compass = h;
  };
  window.addEventListener('devicemotion', LIVE.onMotion);
  window.addEventListener('deviceorientation', LIVE.onOrient);
}

/** Geolocation fixes; speed from the receiver, or from successive fixes when the device does not report it. */
function startGps(onFix) {
  if (!('geolocation' in navigator)) {
    SENS.geo = 'absent';
    return;
  }
  const opts = { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 };
  LIVE.watchId = navigator.geolocation.watchPosition(pos => {
    const c = pos.coords;
    const fix = { lat: c.latitude, lng: c.longitude, acc: c.accuracy, kmh: c.speed != null && !Number.isNaN(c.speed) ? c.speed * 3.6 : null, heading: c.heading, t: now() };
    if (fix.kmh == null && LIVE.gps) {
      const dt = (fix.t - LIVE.gps.t) / 1000;
      if (dt > 0.5) fix.kmh = (haversine(LIVE.gps, fix) / dt) * 3.6;
    }
    SENS.geo = 'ok';
    LIVE.gps = fix;
    onFix(fix);
  }, err => {
    SENS.geo = err.code === 1 ? 'denied' : 'error';
  }, opts);
}

/** Screen Wake Lock: the browser stops sensors when the screen sleeps, so a ride must keep it on. */
async function keepAwake(on) {
  if (!('wakeLock' in navigator)) {
    SENS.wake = 'absent';
    return;
  }
  try {
    if (on && !LIVE.wake) {
      LIVE.wake = await navigator.wakeLock.request('screen');
      SENS.wake = 'on';
      LIVE.wake.addEventListener('release', () => {
        LIVE.wake = null;
        if (SENS.wake === 'on') SENS.wake = 'off';
      });
    } else if (!on && LIVE.wake) {
      const w = LIVE.wake;
      LIVE.wake = null;
      SENS.wake = 'off';
      await w.release();
    }
  } catch {
    SENS.wake = 'denied';
  }
}

function stopSensors() {
  if (LIVE.onMotion) window.removeEventListener('devicemotion', LIVE.onMotion);
  if (LIVE.onOrient) window.removeEventListener('deviceorientation', LIVE.onOrient);
  if (LIVE.watchId != null && navigator.geolocation) navigator.geolocation.clearWatch(LIVE.watchId);
  LIVE.onMotion = null;
  LIVE.onOrient = null;
  LIVE.watchId = null;
  keepAwake(false);
}

// ---------- trace-replay simulator: a seeded route, the Synth physics, scripted and injected events ----------
class SimRide {
  constructor(scenarioId, seed) {
    const sc = scenarioById(scenarioId);
    this.scenario = sc.id;
    this.city = sc.city;
    this.syn = new Synth(seed, { hz: 50 });
    this.route = makeRoute(sc.city, rng(seed), { minKm: 4, maxKm: 9 });
    this.cum = [0];
    for (let i = 1; i < this.route.pts.length; i++) this.cum.push(this.cum[i - 1] + haversine(this.pt(i - 1), this.pt(i)));
    this.total = this.cum[this.cum.length - 1];
    this.pos = 0;
    this.read = 0;
    this.queue = sc.events.map(([kind, f]) => ({ kind, at: f * this.total }));
    this.state = 'ride';
    this.target = 30;
    this.retargetAt = 0;
    this.limit = roadType(S.settings.road).limit;
  }

  pt(i) {
    const p = this.route.pts[clamp(i, 0, this.route.pts.length - 1)];
    return P(p[0], p[1]);
  }

  // Position and heading at a distance (m) along the route, by linear interpolation.
  at(dist) {
    const d = clamp(dist, 0, this.total);
    let i = 1;
    while (i < this.cum.length - 1 && this.cum[i] < d) i++;
    const a = this.pt(i - 1);
    const b = this.pt(i);
    const f = (d - this.cum[i - 1]) / (this.cum[i] - this.cum[i - 1] || 1);
    return { lat: a.lat + (b.lat - a.lat) * f, lng: a.lng + (b.lng - a.lng) * f, heading: bearing(a, b) };
  }

  where() {
    return this.at(this.pos);
  }

  yawAhead() {
    const v = Math.max(this.syn.v, 3);
    let dh = this.at(this.pos + 25).heading - this.at(this.pos).heading;
    if (dh > 180) dh -= 360;
    if (dh < -180) dh += 360;
    return clamp(dh / (25 / v), -30, 30);
  }

  speedTarget(yaw) {
    if (this.syn.t >= this.retargetAt) {
      this.target = this.limit * this.syn.rand(0.7, 1.18);
      this.retargetAt = this.syn.t + this.syn.rand(10, 20);
    }
    return Math.abs(yaw) > 14 ? Math.min(this.target, 24) : this.target;
  }

  /** Generate samples until the simulated clock passes `until` seconds. */
  fill(until) {
    let guard = 0;
    while (this.syn.t < until && guard++ < 400) this.step();
  }

  step() {
    const s = this.syn;
    if (this.state === 'down') return s.lie(0.5, { engine: true });
    if (this.state !== 'ride') return s.idle(0.5, { engine: false });
    const ev = this.queue.length && this.queue[0].at <= this.pos ? this.queue.shift() : null;
    if (ev) return this.runEvent(ev.kind);
    if (this.pos >= this.total) {
      s.ride(3, { kmh: 0, accel: 2 });
      this.state = 'done';
      return;
    }
    const t0 = s.t;
    const yaw = this.yawAhead();
    s.ride(0.5, { kmh: this.speedTarget(yaw), yaw, rough: 0.06 });
    this.pos += s.v * (s.t - t0);
  }

  runEvent(kind) {
    const s = this.syn;
    const t0 = s.t;
    const v0 = s.v;
    if (kind === 'breaker') s.speedBreaker({ ampG: s.rand(1, 2.2), slowTo: s.rand(12, 22) });
    else if (kind === 'pothole') s.pothole({ ampG: s.rand(1.4, 3), jolt: s.rand(40, 140) });
    else if (kind === 'brake') s.brake({ decelG: s.rand(0.6, 0.85), toKmh: s.rand(5, 12) });
    else if (kind === 'impact') this.crash(() => s.crashImpact());
    else if (kind === 'skid') this.crash(() => s.crashSkid(s.r() < 0.5 ? -1 : 1));
    else if (kind === 'drop') this.parkAndDrop();
    this.pos += ((v0 + s.v) / 2) * (s.t - t0);
  }

  crash(seq) {
    if (this.syn.v < 8) this.syn.ride(2, { kmh: 35 });
    seq();
    this.state = 'down';
  }

  parkAndDrop() {
    const s = this.syn;
    s.ride(2.5, { kmh: 0, accel: 2.4 });
    s.idle(3, { engine: false });
    s.handle(4);
    s.dropPhone(0.9);
    this.state = 'parked';
  }

  /** Simulator buttons inject an event at the current position. */
  inject(kind) {
    if (this.state === 'done') this.state = 'ride';
    if (this.state !== 'ride') this.recover();
    this.queue.unshift({ kind, at: this.pos });
  }

  /** After "I am OK": the rider stands the bike up and rides on. */
  recover() {
    if (this.state === 'ride') return;
    this.syn.recover();
    this.state = this.pos >= this.total ? 'done' : 'ride';
  }

  /** Feed every generated sample up to `until` into the pipeline, trimming consumed samples. */
  pull(until, feed) {
    this.fill(until);
    const c = this.syn.cols;
    while (this.read < c.t.length && c.t[this.read] <= until) {
      const i = this.read++;
      feed({ t: c.t[i], ax: c.ax[i], ay: c.ay[i], az: c.az[i], rx: c.rx[i], ry: c.ry[i], rz: c.rz[i], kmh: c.kmh[i] });
    }
    if (this.read > 3000) {
      Object.values(c).forEach(arr => arr.splice(0, this.read));
      this.read = 0;
    }
  }
}

// =====================================================================
// ALARM AUDIO — WebAudio two-tone siren, countdown ticks, chimes.
// The AudioContext is only created after the user has touched the page
// (browsers block sound otherwise); every call is safe without audio.
// =====================================================================
const AUD = { ctx: null, siren: null, master: null };

function audioCtx() {
  const C = window.AudioContext || window.webkitAudioContext;
  const active = !navigator.userActivation || navigator.userActivation.hasBeenActive;
  if (!C || !S.settings.sound || (!AUD.ctx && !active)) return null;
  if (!AUD.ctx) {
    AUD.ctx = new C();
    const comp = AUD.ctx.createDynamicsCompressor();
    AUD.master = AUD.ctx.createGain();
    AUD.master.connect(comp);
    comp.connect(AUD.ctx.destination);
  }
  if (AUD.ctx.state === 'suspended') AUD.ctx.resume().catch(() => {});
  AUD.master.gain.value = S.settings.volume;
  return AUD.ctx;
}

/** Short tone: countdown ticks, coach chirps, hazard warnings. */
function beep(freq = 880, ms = 120, vol = 0.5, type = 'sine') {
  const ctx = audioCtx();
  if (!ctx) return;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  const t0 = ctx.currentTime;
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + ms / 1000);
  o.connect(g);
  g.connect(AUD.master);
  o.start(t0);
  o.stop(t0 + ms / 1000 + 0.02);
}

const chime = () => [660, 880].forEach((f, i) => setTimeout(() => beep(f, 160, 0.35), i * 140));

/** Hi-lo siren (960 / 770 Hz, 0.45 s each) through a square and a sawtooth for a harsh, carrying sound. */
function startSiren(level = 1) {
  const ctx = audioCtx();
  if (!ctx || AUD.siren) return;
  const g = ctx.createGain();
  g.gain.value = 0.55 * level;
  g.connect(AUD.master);
  const oscs = ['square', 'sawtooth'].map(type => {
    const o = ctx.createOscillator();
    o.type = type;
    o.connect(g);
    o.start();
    return o;
  });
  const schedule = () => {
    const t0 = ctx.currentTime;
    for (let i = 0; i < 8; i++) oscs.forEach(o => o.frequency.setValueAtTime(i % 2 ? 770 : 960, t0 + i * 0.45));
  };
  schedule();
  AUD.siren = { g, oscs, timer: setInterval(schedule, 3400) };
}

function setSirenLevel(level) {
  if (AUD.siren) AUD.siren.g.gain.value = 0.55 * level;
}

function stopSiren() {
  if (!AUD.siren) return;
  clearInterval(AUD.siren.timer);
  AUD.siren.oscs.forEach(o => {
    try {
      o.stop();
    } catch {
      /* already stopped */
    }
  });
  AUD.siren.g.disconnect();
  AUD.siren = null;
}

function saveSetting(k, v, then) {
  S.settings[k] = v;
  persist('settings');

// ---------- start / stop ----------
async function startRide() {
  if (RIDE.on) return;
  if (!PREP.rider) {
    const ok = await askConfirm(t('rd_noHelmetQ'), { okText: t('rd_rideAnyway'), danger: true, icon: 'helmet' });
    if (!ok) return;
  }
  if (PREP.pillion !== 'none' && !PREP.dupatta) toast(t('rd_dupattaToast'));
  audioCtx();
  const src = await chooseSource();
  Object.assign(RIDE, freshRide(src));
  RIDE.chain = new SignalChain(S.engine);
  RIDE.engine = new CrashEngine(S.engine, { onEvent: onEngineEvent });
  if (src === 'sim') startSim();
  else {
    startSensors(ingest);
    startGps(onFix);
    RIDE.fallback = setTimeout(checkSensorsAlive, 2500);
  }
  keepAwake(true);
  logEvent('lg_rideStart', { src }, 'play');
  showHud();
  RIDE.raf = requestAnimationFrame(rideLoop);
}

async function chooseSource() {
  const want = S.settings.source;
  if (want === 'sim') return 'sim';
  if (SENS.motion === 'absent') {
    toast(t('rd_noMotion'));
    return 'sim';
  }
  const ok = await askMotionPermission();
  if (!ok) {
    toast(t('rd_motionDenied'), 'bad');
    return 'sim';
  }
  return 'sensors';
}

function startSim() {
  RIDE.src = 'sim';
  RIDE.sim = new SimRide(S.settings.scenario, (now() % 100000) + 1);
  RIDE.road = S.settings.road;
}

// Desktop browsers expose DeviceMotionEvent but never fire it: fall back to the simulator.
function checkSensorsAlive() {
  if (!RIDE.on || RIDE.src !== 'sensors' || LIVE.samples > 0) return;
  SENS.motion = 'silent';
  stopSensors();
  startSim();
  keepAwake(true);
  toast(t('rd_silentFallback'));
  showHud();
}

function rideLoop(ts) {
  if (!RIDE.on) return;
  const dt = RIDE.lastFrame ? Math.min(0.25, (ts - RIDE.lastFrame) / 1000) : 0;
  RIDE.lastFrame = ts;
  if (RIDE.src === 'sim' && !RIDE.paused) advanceSim(dt * S.settings.simSpeed);
  hudFrame();
  RIDE.raf = requestAnimationFrame(rideLoop);
}

/** Move the simulated clock forward in half-second steps (also used by the HUD's "+10 s" button). */
function advanceSim(sec) {
  for (let left = sec; left > 1e-9; left -= 0.5) {
    RIDE.simClock += Math.min(0.5, left);
    RIDE.sim.pull(RIDE.simClock, ingest);
    if (RIDE.simClock < RIDE.gpsNext) continue;
    RIDE.gpsNext = RIDE.simClock + 1;
    const w = RIDE.sim.where();
    onFix({ lat: w.lat, lng: w.lng, acc: 6, kmh: RIDE.f ? RIDE.f.kmh : 0, heading: w.heading, t: now() });
  }
}

function togglePause() {
  RIDE.paused = !RIDE.paused;
  if (!RIDE.paused && RIDE.engine) RIDE.engine.ack(2);
  toast(RIDE.paused ? t('rd_paused') : t('rd_resumed'));
  RIDE.dirty = true;
  hudFrame(true);
}

async function endRide() {
  if (!RIDE.on) return;
  cancelAnimationFrame(RIDE.raf);
  clearTimeout(RIDE.fallback);
  stopSensors();
  RIDE.on = false;
  hideHud();
  if (ALARM.phase === 'count') stopAlarm();
  if (RIDE.tNow < 15 && RIDE.stats.km < 0.05) {
    toast(t('rd_tooShort'));
    rerender();
    return;
  }
  const trip = buildTrip();
  S.trips.unshift(trip);
  S.bike.odo = Math.round(S.bike.odo + trip.km);
  persist('trips', 'bike');
  logEvent('lg_rideEnd', { km: round(trip.km, 1), score: trip.score }, 'bike');
  checkServicesDue();
  rerender();
  showRideSummary(trip);
}

function buildTrip() {
  const st = RIDE.stats;
  const durS = Math.round(RIDE.tNow);
  const hour = new Date(RIDE.startTs).getHours();
  const trip = {
    id: uid('t'), city: RIDE.sim ? RIDE.sim.city : nearestCity(RIDE.pts), from: null, to: null, start: RIDE.startTs, durS, km: round(st.km, 2),
    avgKmh: round(st.movingS ? st.km / (st.movingS / 3600) : 0, 1), maxKmh: Math.round(st.maxKmh), maxLean: Math.round(Math.max(st.leanL, st.leanR)),
    road: RIDE.road, pts: RIDE.pts, events: RIDE.events, helmet: RIDE.helmet, pillion: RIDE.pillion, night: hour >= 19 || hour < 6, src: RIDE.src, crashes: RIDE.crashes,
  };
  trip.score = rideScore(trip).score;
  return trip;
}

function nearestCity(pts) {
  if (!pts.length) return S.profile.city || 'lhr';
  const p = P(pts[0][0], pts[0][1]);
  return haversine(p, CITIES.khi.c) < haversine(p, CITIES.lhr.c) ? 'khi' : 'lhr';
}

// ---------- sample ingest: filters → engine → coaching → recorder ----------
function ingest(s) {
  if (!RIDE.on || RIDE.paused) return;
  if (RIDE.t0 === null) RIDE.t0 = s.t;
  const f = RIDE.chain.push(s);
  RIDE.engine.push(f);
  RIDE.tNow = s.t - RIDE.t0;
  RIDE.f = f;
  RIDE.linPeak = Math.max(RIDE.linPeak * 0.992, f.lin);
  RIDE.buf.push(s);
  if (RIDE.buf.length > 2400) RIDE.buf.splice(0, RIDE.buf.length - 2000);
  coachStep(f);
  if (REC.on && REC.fromRide) recordSample(s);
  RIDE.dirty = true;
}

function onFix(fix) {
  if (!RIDE.on) return;
  const prev = RIDE.gps;
  RIDE.gps = fix;
  if (prev && fix.acc < 40 && !RIDE.paused) {
    const d = haversine(prev, fix);
    if (d > 2 && d < 300) RIDE.stats.km += d / 1000;
  }
  if (RIDE.tNow >= RIDE.ptNext) {
    RIDE.ptNext = RIDE.tNow + 2;
    RIDE.pts.push([round(fix.lat, 5), round(fix.lng, 5), Math.round(fix.kmh || 0), Math.round(RIDE.tNow)]);
  }
  if (S.settings.hazardWarn) checkHazards(fix);
}

function checkHazards(fix) {
  for (const h of S.hazards) {
    if (h.status !== 'open' || RIDE.warned.has(h.id)) continue;
    const d = haversine(fix, h);
    if (d > 150) continue;
    RIDE.warned.add(h.id);
    hudWarn(t('hz_ahead', { type: t('hz_' + h.type), m: Math.round(d) }));
    chime();
    return;
  }
}

// TODO(student): look up the signed limit for the current road from OpenStreetMap maxspeed tags (Overpass API,
// cached per road segment, offline fallback) so over-speed coaching uses real limits, not the road type chosen.
function fetchRoadSpeedLimit() {
  return null;
}
const currentLimit = () => fetchRoadSpeedLimit(RIDE.gps) ?? roadType(RIDE.road).limit;

// ---------- live coaching: longitudinal from GPS speed, lateral = v·yaw rate ----------
function coachStep(f) {
  const c = RIDE.coach;
  if (f.t < c.next) return;
  c.next = f.t + 0.25;
  const kmh = f.kmh ?? 0;
  c.hist.push({ t: f.t, kmh });
  while (c.hist.length > 1 && f.t - c.hist[0].t > 2) c.hist.shift();
  const h0 = c.hist[0];
  // GPS speed updates about once a second, so the slope is taken over two seconds.
  const aLong = (kmh - h0.kmh) / 3.6 / Math.max(1, f.t - h0.t);
  c.yaw = 0.7 * c.yaw + 0.3 * f.yaw;
  const aLat = (kmh / 3.6) * c.yaw * RAD;
  c.gLong = aLong / G0;
  c.gLat = aLat / G0;
  if (aLong <= -2.8) coachEvent('brake', -aLong, f);
  else if (aLong >= 2.6) coachEvent('accel', aLong, f);
  if (Math.abs(aLat) >= 3.6 && kmh > 15) coachEvent('corner', Math.abs(aLat), f);
  c.overS = kmh > currentLimit() * 1.1 ? c.overS + 0.25 : 0;
  if (c.overS >= 3) coachEvent('speed', kmh, f);
  const st = RIDE.stats;
  st.maxKmh = Math.max(st.maxKmh, kmh);
  if (kmh > 3) st.movingS += 0.25;
  if (f.lean < 0) st.leanL = Math.max(st.leanL, -f.lean);
  else st.leanR = Math.max(st.leanR, f.lean);
  RIDE.trail.push([c.gLat, c.gLong]);
  if (RIDE.trail.length > 28) RIDE.trail.shift();
}

function coachEvent(kind, val, f) {
  const c = RIDE.coach;
  if (f.t - (c.last[kind] ?? -99) < (kind === 'speed' ? 20 : 4)) return;
  c.last[kind] = f.t;
  const g = RIDE.gps;
  RIDE.events.push({ kind, t: round(RIDE.tNow, 1), lat: g ? round(g.lat, 5) : null, lng: g ? round(g.lng, 5) : null, val: round(val, 1) });
  hudMsg(t('ev_' + kind), 'o');
  beep(520, 90, 0.25, 'triangle');
}

// Touching the phone while moving counts against the ride score (the simulator pad and the alarm do not).
function onRideTouch(e) {
  if (!RIDE.on || !RIDE.f || (RIDE.f.kmh ?? 0) < 10) return;
  if (e.target.closest('#simPad, #alarm')) return;
  coachEvent('touch', RIDE.f.kmh, RIDE.f);
}

// ---------- engine events → HUD and the crash alarm ----------
function onEngineEvent(ev) {
  if (ev.type === 'reject') hudMsg(t('rj_' + ev.reason), 'c');
  if (ev.type === 'candidate') hudMsg(t('hud_candidate', { g: fmtN(ev.peak, 1) }), 'y');
  if (ev.type !== 'confirm') return;
  RIDE.crashes++;
  startCountdown({ details: { peak: ev.peak, rot: ev.rot, tilt: ev.tilt }, src: RIDE.src });
}

function showRideSummary(trip) {
  const sc = rideScore(trip);
  const counts = COACH_KINDS.map(k => `<span class="chip ${trip.events.some(e => e.kind === k) ? 'o' : 'g'}">${ic(COACH_ICONS[k])} ${t('ev_' + k)}: ${trip.events.filter(e => e.kind === k).length}</span>`).join('');
  const sh = openModal(`${sheetHead(t('rd_summary'), 'flag')}
    <div class="row"><div class="ring">${ringSvg(sc.score / 100)}<b class="num">${sc.score}</b></div>
    <div class="grow kpis">${miniKpi(t('k_distance'), fmtN(trip.km, 2), 'km')}${miniKpi(t('k_time'), clock(trip.durS), '')}${miniKpi(t('k_avg'), fmtN(trip.avgKmh, 0), 'km/h')}${miniKpi(t('k_max'), trip.maxKmh, 'km/h')}</div>
        </div>
    <div class="row mt">${counts}</div>
    <p class="small muted mt">${scoreExplain(sc)}</p>
    <div class="sfoot"><button class="btn ghost" type="button" data-close>${t('close')}</button>
        <button class="btn y" type="button" id="sumView">${ic('route')} ${t('rd_viewTrip')}</button></div>`);
  animateIn(sh);
  $('#sumView', sh).onclick = () => {
    closeModal();
    go('trips/' + trip.id);
  };
}

const miniKpi = (k, v, unit) => `<div class="tile"><span class="k">${k}</span><span class="v">${v}<small>${unit}</small></span></div>`;

// =====================================================================
// RIDE HUD — full-screen night HUD: speed arc, g-force meter with an
// impact bar, lean gauge, heading, detector stage lights, trip stats,
// huge hold-to-confirm buttons and the simulator pad.
// =====================================================================
const SPD_MAX = 120;
const SPD_ARC = 'M46.1 210 A120 120 0 1 1 253.9 210';
const setText = (id, v) => {
  const el = document.getElementById(id);
  if (el && el.textContent !== String(v)) el.textContent = v;
};
const setHtml = (id, html, cls) => {
  const el = document.getElementById(id);
  if (!el || el.dataset.h === html) return;
  el.dataset.h = html;
  el.innerHTML = html;
  el.className = cls;
};

// Point on the speed arc for a value: 0 km/h at 210°, SPD_MAX at −30°.
function arcPoint(v, r) {
  const a = toRad(210 - (clamp(v, 0, SPD_MAX) / SPD_MAX) * 240);
  return [150 + r * Math.cos(a), 150 - r * Math.sin(a)];
}

function speedArcSvg(limit) {
  let ticks = '';
  for (let v = 0; v <= SPD_MAX; v += 10) {
    const [x1, y1] = arcPoint(v, v % 20 ? 127 : 122);
    const [x2, y2] = arcPoint(v, 136);
    ticks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
    if (v % 20 === 0) {
      const [tx, ty] = arcPoint(v, 106);
      ticks += `<text x="${tx.toFixed(1)}" y="${(ty + 5).toFixed(1)}">${v}</text>`;
    }
  }
  const [lx, ly] = arcPoint(limit, 130);
  return `<svg class="spd-arc" viewBox="0 0 300 232" aria-hidden="true">
    <path class="trk" d="${SPD_ARC}" pathLength="100"/>
    <path class="val" id="hArc" d="${SPD_ARC}" pathLength="100" stroke-dasharray="0 200"/>
    <g class="tk">${ticks}</g><circle class="lim" cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="6"/></svg>`;
}

function gMeterSvg() {
  const rings = [0.25, 0.5, 0.75, 1].map(g => `<circle class="${g === 1 ? 'r1' : 'r'}" cx="110" cy="110" r="${g * 95}"/>`).join('');
  return `<svg class="gm" viewBox="0 0 220 220" aria-hidden="true">${rings}
    <line class="ax" x1="12" y1="110" x2="208" y2="110"/><line class="ax" x1="110" y1="12" x2="110" y2="208"/>
    <text x="110" y="30">${t('hud_accel')}</text><text x="110" y="198">${t('hud_brake')}</text>
    <text x="204" y="212" class="r">1 g</text>
    <polyline class="trail" id="hTrail" points="110,110"/><circle class="dot" id="hDot" cx="110" cy="110" r="8"/></svg>`;
}

function leanSvg() {
  let ticks = '';
  for (let a = -60; a <= 60; a += 15) {
    const r1 = a % 30 ? 92 : 86;
    const p = d => [120 + d * Math.sin(toRad(a)), 125 - d * Math.cos(toRad(a))];
    const [x1, y1] = p(r1);
    const [x2, y2] = p(100);
    ticks += `<line class="${Math.abs(a) >= 45 ? 'hot' : ''}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
    if (a % 30 === 0) {
      const [tx, ty] = p(72);
      ticks += `<text x="${tx.toFixed(1)}" y="${(ty + 4).toFixed(1)}">${Math.abs(a)}</text>`;
    }
  }
  return `<svg class="lg" viewBox="0 0 240 140" aria-hidden="true">
    <path class="trk" d="M33.4 75 A100 100 0 0 1 206.6 75"/><g class="tk">${ticks}</g>
    <g id="hMaxL" class="mx"><path d="M120 18l-5-9h10z"/></g><g id="hMaxR" class="mx"><path d="M120 18l-5-9h10z"/></g>

function showHud() {
  const h = $('#hud');

function hideHud() {
  $('#hud').classList.remove('on');

function minimizeHud() {
  RIDE.minimized = true;
