<style>
/* =====================================================================
   Dhoop — "sunrise control room" theme
   warm off-white day, saffron sun, deep teal battery, slate grid,
   coral import cost; the night theme is a navy night sky.
   ===================================================================== */
:root {
  --bg: #f7f2e8;
  --bg-2: #efe6d4;
  --surface: #fffdf8;
  --surface-2: #f7f0e3;
  --surface-3: #efe5d2;
  --line: #e7dbc6;
  --line-2: #d6c5a8;
  --ink: #221f1a;
  --ink-2: #5a5247;
  --ink-3: #857b6d;
  --sun: #e18f08;
  --sun-2: #f5b43a;
  --sun-soft: #fcebc6;
  --sun-ink: #7a4b00;
  --batt: #0c6c67;
  --batt-2: #16968d;
  --batt-soft: #d4ebe7;
  --grid: #4d5c77;
  --grid-soft: #e0e5ee;
  --imp: #d9573a;
  --imp-soft: #f9ddd3;
  --exp: #3a8a5b;
  --exp-soft: #d9ede0;
  --load: #7a54a6;
  --load-soft: #ece3f6;
  --gen: #8b6a3a;
  --warn: #b7791f;
  --warn-soft: #fbefd4;
  --rail: #132a2d;
  --rail-2: #1b373b;
  --rail-ink: #b6c9c5;
  --rail-on: #f5b43a;
  --focus: #0c6c67;
  --shadow: 0 1px 2px rgba(70, 45, 10, .06), 0 8px 24px -12px rgba(70, 45, 10, .22);
  --shadow-lg: 0 20px 60px -20px rgba(40, 25, 5, .35);
  --r: 16px;
  --r-sm: 10px;
  --ui: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'DM Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --ur: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --dur: .35s;
  --fs: 15px;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #0a1226;
  --bg-2: #0d1730;
  --surface: #111c38;
  --surface-2: #16244a;
  --surface-3: #1c2d58;
  --line: #22335d;
  --line-2: #2f4478;
  --ink: #e9eef9;
  --ink-2: #b0bcd6;
  --ink-3: #8090b3;
  --sun: #f6ad2f;
  --sun-2: #ffc75e;
  --sun-soft: #3a2e18;
  --sun-ink: #ffd88e;
  --batt: #2fc2b3;
  --batt-2: #5fd9cc;
  --batt-soft: #0f3a40;
  --grid: #98a8c9;
  --grid-soft: #1f2c4e;
  --imp: #ff8564;
  --imp-soft: #3e2328;
  --exp: #62d08f;
  --exp-soft: #15392b;
  --load: #b996ea;
  --load-soft: #2b2449;
  --gen: #d0aa6c;
  --warn: #f2c066;
  --warn-soft: #3a3020;
  --rail: #060c1d;
  --rail-2: #0e1730;
  --rail-ink: #9fb0d2;
  --rail-on: #ffc75e;
  --focus: #5fd9cc;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px -14px rgba(0, 0, 0, .6);
  --shadow-lg: 0 24px 70px -20px rgba(0, 0, 0, .7);
  color-scheme: dark;
}
html[data-size="lg"] { --fs: 16.5px; }
html[data-size="xl"] { --fs: 18px; }

/* ---------- motion kit ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
html.calm *, html.calm *::before, html.calm *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
@keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }
@keyframes toastIn { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes flowDash { to { stroke-dashoffset: -32; } }
@keyframes pulseRing { 0% { opacity: .55; transform: scale(.9); } 100% { opacity: 0; transform: scale(1.35); } }
.enter { animation: fadeUp var(--dur) var(--ease) both; }
.stagger > * { animation: fadeUp .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
.btn { transition: transform .15s var(--ease), box-shadow .15s var(--ease), background .15s, border-color .15s, color .15s; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0) scale(.98); }
.card, .tile { transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s; }
.card.lift:hover, .tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.fill, .bar > i { transition: width .6s var(--ease); }
.skeleton { background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: var(--r-sm); }

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { font-size: var(--fs); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--ui);
  color: var(--ink);
  background: var(--bg);
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: hidden;
}
[data-theme="dark"] body {
  background:
    radial-gradient(1px 1px at 12% 18%, rgba(255, 255, 255, .5) 50%, transparent 51%),
    radial-gradient(1px 1px at 72% 9%, rgba(255, 255, 255, .45) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 88% 32%, rgba(255, 255, 255, .35) 50%, transparent 51%),
    radial-gradient(1px 1px at 40% 6%, rgba(255, 255, 255, .4) 50%, transparent 51%),
    radial-gradient(1px 1px at 58% 26%, rgba(255, 255, 255, .3) 50%, transparent 51%),
    linear-gradient(180deg, #0c1734 0, var(--bg) 420px);
  background-attachment: fixed;
}
html[lang="ur"] body { font-family: var(--ur); line-height: 2.05; }
html[lang="ur"] .num, html[lang="ur"] .mono, html[lang="ur"] input, html[lang="ur"] .ltr { font-family: var(--mono); line-height: 1.5; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; font-weight: 650; letter-spacing: -.01em; }
html[lang="ur"] h1, html[lang="ur"] h2, html[lang="ur"] h3, html[lang="ur"] h4 { line-height: 1.9; font-weight: 700; letter-spacing: 0; }
p { margin: 0 0 .6em; }
a { color: var(--batt); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.ic { width: 1.1em; height: 1.1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; flex: none; }
.ic.lg { width: 1.5em; height: 1.5em; }
.ic.xl { width: 2.2em; height: 2.2em; }
html[dir="rtl"] .ic.flip { transform: scaleX(-1); }
.num, .mono { font-family: var(--mono); font-feature-settings: 'tnum'; letter-spacing: -.01em; }
.ltr { direction: ltr; unicode-bidi: isolate; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.hidden { display: none !important; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: .86rem; }
.tiny { font-size: .76rem; }
.mt { margin-top: 14px; }
.mt-s { margin-top: 8px; }
.mb { margin-bottom: 14px; }
.grow { flex: 1; min-width: 0; }
.nowrap { white-space: nowrap; }
.right { text-align: end; }
.center { text-align: center; }
.c-sun { color: var(--sun); }
.c-batt { color: var(--batt); }
.c-grid { color: var(--grid); }
.c-imp { color: var(--imp); }
.c-exp { color: var(--exp); }
.c-load { color: var(--load); }
.skip { position: fixed; top: -60px; left: 12px; z-index: 100; }
.skip:focus { top: 12px; }

/* ---------- shell: left rail, top bar, view, phone tabs ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.rail {
  position: sticky;
  top: 0;
  height: 100vh;
  background: var(--rail);
  color: var(--rail-ink);
  display: flex;
  flex-direction: column;
  padding: 14px 12px;
  overflow-y: auto;
  scrollbar-width: thin;
  z-index: 20;
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; padding: 4px 6px 14px; }
.brand .mark { width: 40px; height: 40px; flex: none; }
.brand .mark svg { width: 100%; height: 100%; display: block; }
.brand b { display: block; font-size: 1.12rem; color: #fff7e6; letter-spacing: .01em; }
.brand small { display: block; font-size: .72rem; opacity: .8; line-height: 1.3; }
html[lang="ur"] .brand small { line-height: 1.9; }
.rail nav { display: flex; flex-direction: column; gap: 2px; }
.rail .grp { font-size: .68rem; text-transform: uppercase; letter-spacing: .12em; opacity: .55; padding: 12px 10px 4px; }
html[lang="ur"] .rail .grp { text-transform: none; letter-spacing: 0; font-size: .74rem; }
.rail nav a {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 8px 10px;
  border-radius: 11px;
  color: var(--rail-ink);
  text-decoration: none;
  font-size: .93rem;
  position: relative;
  transition: background .2s var(--ease), color .2s;
}
.rail nav a:hover { background: var(--rail-2); color: #fff; }
.rail nav a.on { background: linear-gradient(90deg, rgba(245, 180, 58, .2), rgba(245, 180, 58, .04)); color: #fff7e6; }
.rail nav a.on::before { content: ''; position: absolute; inset-inline-start: -12px; top: 8px; bottom: 8px; width: 4px; border-radius: 0 4px 4px 0; background: var(--rail-on); }
.rail nav a.on .ic { color: var(--rail-on); }
.rail nav a .cnt { margin-inline-start: auto; background: var(--imp); color: #fff; font: 600 .7rem/1 var(--mono); padding: 3px 6px; border-radius: 99px; }
.rail-foot { margin-top: auto; padding: 14px 8px 4px; font-size: .78rem; border-top: 1px solid var(--rail-2); }
.rail-foot .sunclock { display: flex; align-items: center; gap: 8px; }
.rail-foot .sunclock svg { width: 58px; height: 32px; flex: none; }
.main { min-width: 0; display: flex; flex-direction: column; }
.top {
  position: sticky;
  top: 0;
  z-index: 15;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 26px;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.top .brand { display: none; padding: 0; }
.top .title { flex: 1; min-width: 0; }
.top h1 { font-size: 1.28rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .sub { font-size: .8rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
html[lang="ur"] .top h1 { font-size: 1.15rem; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.tbtn {
  height: 40px;
  min-width: 40px;
  padding: 0 11px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  position: relative;
  color: var(--ink);
}
.tbtn:hover { border-color: var(--line-2); background: var(--surface-2); }
.tbtn.lang { font-family: var(--ur); font-size: .95rem; line-height: 1; }
html[lang="ur"] .tbtn.lang { font-family: var(--ui); }
.badge { position: absolute; top: -5px; inset-inline-end: -5px; min-width: 19px; height: 19px; border-radius: 99px; background: var(--imp); color: #fff; font: 600 .68rem/19px var(--mono); padding: 0 5px; text-align: center; }
#view { padding: 22px 26px 60px; max-width: 1320px; width: 100%; margin: 0 auto; outline: none; }
.tabs { display: none; }

/* ---------- layout helpers ---------- */
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.stack > * + * { margin-top: 14px; }
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.g4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.split { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.split.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.span2 { grid-column: span 2; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head h2 { font-size: 1.5rem; }
.page-head p { color: var(--ink-2); margin: 4px 0 0; max-width: 70ch; }

/* ---------- cards, tiles, chips ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.card.tint { background: var(--surface-2); box-shadow: none; }
.card h3 { font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
.card h3 .ic { color: var(--sun); }
.card .hd { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card .hd p { margin: 2px 0 0; color: var(--ink-2); font-size: .86rem; }
.tile {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 14px 16px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
  min-width: 0;
}
.tile::after { content: ''; position: absolute; inset-inline-start: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: var(--tc, var(--sun)); }
.tile .lbl { font-size: .8rem; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.tile .lbl .ic { color: var(--tc, var(--sun)); }
.tile .val { font: 500 1.6rem/1.2 var(--mono); margin-top: 6px; letter-spacing: -.02em; white-space: nowrap; }
.tile .val small { font-size: .8rem; color: var(--ink-3); margin-inline-start: 3px; }
.tile .foot { font-size: .78rem; color: var(--ink-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); font-size: .8rem; white-space: nowrap; }
.chip.sun { background: var(--sun-soft); border-color: transparent; color: var(--sun-ink); }
.chip.batt { background: var(--batt-soft); border-color: transparent; color: var(--batt); }
.chip.grid { background: var(--grid-soft); border-color: transparent; color: var(--grid); }
.chip.imp { background: var(--imp-soft); border-color: transparent; color: var(--imp); }
.chip.exp { background: var(--exp-soft); border-color: transparent; color: var(--exp); }
.chip.load { background: var(--load-soft); border-color: transparent; color: var(--load); }
.chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.tag { font: 600 .66rem/1 var(--ui); text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); }
html[lang="ur"] .tag { text-transform: none; letter-spacing: 0; font-size: .75rem; }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 12px; background: var(--warn-soft); color: var(--ink); font-size: .86rem; }
.note > .ic { color: var(--warn); margin-top: 3px; }
.note.info { background: var(--grid-soft); }
.note.info > .ic { color: var(--grid); }
.note.ok { background: var(--exp-soft); }
.note.ok > .ic { color: var(--exp); }
.note.bad { background: var(--imp-soft); }
.note.bad > .ic { color: var(--imp); }
.illus { font-size: .74rem; color: var(--ink-3); display: inline-flex; gap: 5px; align-items: center; }
.empty { padding: 30px 16px; text-align: center; color: var(--ink-2); }
.empty .ic { width: 2.2em; height: 2.2em; color: var(--ink-3); display: block; margin: 0 auto 8px; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--batt); }
.bar.sun > i { background: var(--sun); }
.bar.imp > i { background: var(--imp); }
.bar.exp > i { background: var(--exp); }
.dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: .9rem; }
.dl dt { color: var(--ink-2); }
.dl dd { margin: 0; text-align: end; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 40px;
  padding: 8px 16px;
  border-radius: 12px;
  border: 1px solid transparent;
  background: var(--batt);
  color: #fff;
  font-weight: 550;
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
}
.btn:hover { box-shadow: 0 6px 16px -8px rgba(12, 108, 103, .6); }
[data-theme="dark"] .btn { color: #04201d; }
.btn.sun { background: var(--sun); color: #2a1800; }
.btn.sun:hover { box-shadow: 0 6px 16px -8px rgba(225, 143, 8, .7); }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line-2); }
.btn.ghost:hover { background: var(--surface-2); box-shadow: none; }
.btn.danger { background: var(--imp); color: #fff; }
.btn.link { background: none; color: var(--batt); padding: 4px 6px; min-height: 0; }
.btn.sm { min-height: 34px; padding: 5px 12px; font-size: .86rem; border-radius: 10px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
.ibtn { width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; cursor: pointer; color: var(--ink); flex: none; }
.ibtn:hover { background: var(--surface-2); }
.ibtn.sm { width: 32px; height: 32px; border-radius: 9px; }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; display: inline-block; }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: .82rem; color: var(--ink-2); font-weight: 500; }
.field > span em { font-style: normal; color: var(--ink-3); font-weight: 400; }
.field .hint { font-size: .74rem; color: var(--ink-3); }
.inp, .field input, .field select, .field textarea {
  width: 100%;
  min-height: 40px;
  padding: 8px 12px;
  border-radius: 11px;
  border: 1px solid var(--line-2);
  background: var(--surface);
  color: var(--ink);
}
.field textarea { min-height: 80px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus, .inp:focus { outline: none; border-color: var(--batt); box-shadow: 0 0 0 3px color-mix(in srgb, var(--batt) 22%, transparent); }
.field.bad input, .field.bad select { border-color: var(--imp); }
.field .err { color: var(--imp); font-size: .78rem; }
.unit { position: relative; }
.unit input { padding-inline-end: 52px; }
.unit i { position: absolute; inset-inline-end: 12px; top: 50%; transform: translateY(-50%); font: normal .78rem var(--mono); color: var(--ink-3); pointer-events: none; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 9px; cursor: pointer; font-size: .86rem; color: var(--ink-2); min-height: 32px; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); font-weight: 600; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; cursor: pointer; }
.switch input { appearance: none; width: 44px; height: 26px; border-radius: 99px; background: var(--line-2); position: relative; cursor: pointer; flex: none; transition: background .2s; margin: 0; }
.switch input::after { content: ''; position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s var(--ease); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.switch input:checked { background: var(--batt); }
.switch input:checked::after { transform: translateX(18px); }
html[dir="rtl"] .switch input:checked::after { transform: translateX(-18px); }
input[type="range"] { width: 100%; accent-color: var(--sun); }

/* ---------- tables ---------- */
.tbl-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--line); }
table.tbl { width: 100%; border-collapse: collapse; font-size: .88rem; }
.tbl th, .tbl td { padding: 9px 12px; text-align: start; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th { background: var(--surface-2); font-weight: 600; font-size: .78rem; color: var(--ink-2); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.n, .tbl th.n { text-align: end; font-family: var(--mono); }
.tbl tr.best td { background: var(--exp-soft); }
.tbl tr.sel td { background: var(--sun-soft); }

/* ---------- modal sheet, palette, tour, toasts, tooltip ---------- */
#scrim { position: fixed; inset: 0; background: rgba(15, 12, 6, .45); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 40; }
#scrim.on { opacity: 1; pointer-events: auto; }
#modal { position: fixed; inset: 0; display: grid; place-items: center; z-index: 45; pointer-events: none; padding: 16px; }
#modal.on { pointer-events: auto; }
.sheet {
  width: min(560px, 100%);
  max-height: min(86vh, 900px);
  overflow-y: auto;
  background: var(--surface);
  border-radius: 20px;
  padding: 18px 20px 20px;
  box-shadow: var(--shadow-lg);
  opacity: 0;
  transform: scale(.96) translateY(8px);
  transition: opacity .25s var(--ease), transform .3s var(--ease);
  border: 1px solid var(--line);
}
.sheet.wide { width: min(860px, 100%); }
#modal.on .sheet { opacity: 1; transform: none; }
.sheet .grab { display: none; }
.shead { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
.shead h3 { display: flex; gap: 8px; align-items: center; font-size: 1.15rem; }
.shead h3 .ic { color: var(--sun); }
.sfoot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.palette { position: fixed; inset: 0; z-index: 50; display: none; justify-content: center; align-items: flex-start; padding: 10vh 16px 16px; background: rgba(15, 12, 6, .4); }
.palette.on { display: flex; animation: fadeIn .2s both; }
.palbox { width: min(620px, 100%); background: var(--surface); border-radius: 18px; box-shadow: var(--shadow-lg); overflow: hidden; border: 1px solid var(--line); animation: pop .25s var(--ease) both; }
.palbox .inp { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; min-height: 54px; font-size: 1.05rem; padding: 0 18px; }
.palres { max-height: 52vh; overflow-y: auto; padding: 6px; }
.palres .pg { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); padding: 10px 12px 4px; }
.palres button { display: flex; width: 100%; gap: 10px; align-items: center; padding: 9px 12px; border: 0; background: none; border-radius: 10px; cursor: pointer; text-align: start; }
.palres button.on, .palres button:hover { background: var(--sun-soft); }
.palres button small { margin-inline-start: auto; color: var(--ink-3); font-size: .78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
.palhint { font-size: .74rem; color: var(--ink-3); padding: 8px 16px; border-top: 1px solid var(--line); }
#tour { position: fixed; inset: 0; z-index: 60; display: none; }
#tour.on { display: block; }
#tourSpot { position: fixed; border-radius: 16px; box-shadow: 0 0 0 9999px rgba(10, 8, 4, .58); transition: all .35s var(--ease); pointer-events: none; outline: 2px solid var(--sun-2); }
#tourTip { position: fixed; width: min(340px, calc(100vw - 32px)); background: var(--surface); border-radius: 16px; padding: 16px; box-shadow: var(--shadow-lg); transition: top .35s var(--ease), left .35s var(--ease); border: 1px solid var(--line); }
#tourTip h4 { font-size: 1.05rem; margin: 6px 0 4px; }
#tourTip p { font-size: .9rem; color: var(--ink-2); }
.dots { display: flex; gap: 5px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); }
.dots i.on { background: var(--sun); width: 18px; border-radius: 99px; }
#toasts { position: fixed; bottom: 22px; inset-inline-end: 22px; z-index: 70; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.toast { display: flex; gap: 10px; align-items: center; background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 13px; box-shadow: var(--shadow-lg); max-width: min(420px, calc(100vw - 32px)); animation: toastIn .3s var(--ease) both; font-size: .9rem; transition: opacity .3s, transform .3s; }
.toast.ok .ic { color: var(--exp-soft); }
.toast.bad .ic { color: var(--imp-soft); }
.toast.out { opacity: 0; transform: translateY(8px); }
.ctip { position: fixed; z-index: 80; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 8px 11px; font-size: .78rem; box-shadow: var(--shadow-lg); opacity: 0; transition: opacity .12s; max-width: 260px; }
.ctip.on { opacity: 1; }
.ctip b { font-family: var(--mono); font-weight: 500; }
.ctip .r { display: flex; justify-content: space-between; gap: 14px; }
.ctip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-inline-end: 5px; }
#printArea { display: none; }

/* ---------- home: energy-flow diagram and scrubber ---------- */
.home-head h2 { font-size: 1.6rem; margin-top: 2px; }
.home-head p.row { margin-top: 8px; gap: 6px; }
.home-grid { display: grid; grid-template-columns: minmax(0, 1.85fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.flow-card { padding-bottom: 14px; background: radial-gradient(120% 70% at 50% -10%, var(--sun-soft), transparent 60%), var(--surface); }
.flow-wrap { position: relative; min-height: 280px; }
.flow-svg { width: 100%; height: auto; display: block; overflow: visible; }
.flow-svg text { font-family: var(--mono); }
.flow-svg .ftrack { fill: none; stroke: var(--line); stroke-width: 7; stroke-linecap: round; }
.flow-svg .flow { fill: none; stroke-linecap: round; stroke-dasharray: 2 14; animation: flowDash 1.4s linear infinite; transition: stroke-width .45s var(--ease), opacity .45s; }
.flow-svg .flow.rev { animation-direction: reverse; }
.flow-svg .fl-sun { stroke: var(--sun); }
.flow-svg .fl-home { stroke: var(--load); }
.flow-svg .fl-batt { stroke: var(--batt); }
.flow-svg .fl-grid { stroke: var(--grid); }
.flow-svg .fl-gen { stroke: var(--gen); }
.flow-svg .fl-grid:not(.rev) { stroke: var(--imp); }
.flow-svg .fl-grid.rev { stroke: var(--exp); }
.fnode .disc { fill: var(--surface); stroke-width: 2.5; }
.fnode .halo { fill: none; stroke-width: 1; opacity: .45; }
.fnode .nic { stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.fnode .nval { font-size: 13px; font-weight: 500; fill: var(--ink); }
.fnode .nlbl { font-family: var(--ui); font-size: 13px; font-weight: 600; fill: var(--ink); }
.fnode .nstate { font-family: var(--ui); font-size: 11px; fill: var(--ink-3); }
.fnode .nsub { font-family: var(--ui); font-size: 10.5px; fill: var(--ink-3); }
html[lang="ur"] .fnode .nlbl, html[lang="ur"] .fnode .nstate, html[lang="ur"] .fnode .nsub { font-family: var(--ur); }
.n-sun .disc { stroke: var(--sun); fill: var(--sun-soft); }
.n-sun .halo { stroke: var(--sun); }
.n-sun .nic { stroke: var(--sun-ink); }
.n-home .disc { stroke: var(--load); fill: var(--load-soft); }
.n-home .halo { stroke: var(--load); }
.n-home .nic { stroke: var(--load); }
.n-grid .disc { stroke: var(--grid); fill: var(--grid-soft); }
.n-grid .halo { stroke: var(--grid); }
.n-grid .nic { stroke: var(--grid); }
.n-grid.off .disc { stroke-dasharray: 4 4; opacity: .7; }
.n-grid.off .nstate { fill: var(--imp); font-weight: 600; }
.n-gen .disc { stroke: var(--gen); }
.n-gen .nic { stroke: var(--gen); }
.n-batt .disc { stroke: var(--batt); fill: var(--batt-soft); }
.n-batt .halo { stroke: var(--batt); }
.n-batt .bshell { fill: var(--surface); stroke: var(--batt); stroke-width: 2.4; }
.n-batt .bcap { fill: var(--batt); }
.n-batt .bfill { fill: var(--batt-2); transition: height .45s var(--ease), y .45s var(--ease); }
.n-batt .bfill.low { fill: var(--imp); }
.n-batt .nval.soc { font-size: 12px; }
.n-hub .hub { fill: var(--rail); stroke: var(--sun-2); stroke-width: 1.5; }
.n-hub .nic { stroke: var(--sun-2); }
.n-hub .nval { fill: #fff7e6; font-size: 15px; }
.n-hub .nsub { fill: #b6c9c5; }
.fnode .halo { transform-box: fill-box; transform-origin: center; }
.n-sun .halo { animation: pulseRing 2.8s var(--ease) infinite; }
.sunarc .arc { fill: none; stroke: var(--sun-2); stroke-width: 1.5; stroke-dasharray: 3 5; opacity: .9; }
.sunarc .horizon { stroke: var(--line-2); stroke-width: 1; }
.sunarc .arc-t { font-size: 10px; fill: var(--ink-3); }
.sunarc .sundot { fill: var(--sun); stroke: var(--sun-soft); stroke-width: 4; transition: cx .45s var(--ease), cy .45s var(--ease); }
.sunarc .sundot.night { fill: var(--ink-3); stroke: var(--surface-3); }
.scrub { display: flex; gap: 12px; align-items: center; margin-top: 6px; padding: 12px 4px 0; border-top: 1px dashed var(--line); }
.scrub #playBtn { width: 46px; height: 46px; border-radius: 50%; background: var(--sun); color: #2a1800; border: 0; }
.scrub-main { flex: 1; min-width: 0; }
.scrub-time { display: flex; justify-content: space-between; align-items: center; }
.scrub-time b { font-size: 1.05rem; }
.scrub-track { position: relative; height: 30px; margin-top: 2px; }
.sk-sun { position: absolute; left: 0; right: 0; top: 11px; height: 8px; border-radius: 99px; overflow: hidden; background: var(--surface-3); }
.sk-sun i { position: absolute; top: 0; bottom: 0; background: var(--sun); }
.sk-out { position: absolute; top: 6px; height: 18px; border-radius: 5px; background: var(--imp); opacity: .35; }
.scrub-track input[type="range"] { position: absolute; inset: 0; width: 100%; margin: 0; background: transparent; appearance: none; -webkit-appearance: none; }
.scrub-track input[type="range"]::-webkit-slider-runnable-track { height: 30px; background: transparent; }
.scrub-track input[type="range"]::-moz-range-track { height: 30px; background: transparent; }
.scrub-track input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 8px; height: 30px; border-radius: 4px; background: var(--ink); border: 2px solid var(--surface); box-shadow: var(--shadow); cursor: grab; }
.scrub-track input[type="range"]::-moz-range-thumb { width: 8px; height: 30px; border-radius: 4px; background: var(--ink); border: 2px solid var(--surface); cursor: grab; }
.scrub-ticks { display: flex; justify-content: space-between; font-size: .7rem; color: var(--ink-3); }
.flows { list-style: none; margin: 0; padding: 0; }
.flows li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.flows li:last-child { border-bottom: 0; }
.flows li span { flex: 1; min-width: 0; color: var(--ink-2); font-size: .9rem; }
.why { display: flex; gap: 8px; align-items: flex-start; margin: 12px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--sun-soft); font-size: .86rem; }
.why .ic { color: var(--sun-ink); margin-top: 3px; }
.outs { list-style: none; margin: 0; padding: 0; }
.outs li { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 6px 0; font-size: .88rem; }

/* ---------- reasons list ---------- */
.reasons { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.reasons.compact { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 14px; }
.reasons li { display: grid; grid-template-columns: auto auto 1fr; gap: 10px; align-items: start; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border-inline-start: 3px solid var(--tone, var(--sun)); font-size: .9rem; }
.reasons .rs-time { font-size: .8rem; color: var(--ink-3); padding-top: 2px; }
.reasons .rs-ic { color: var(--tone, var(--sun)); }
.rs-sun { --tone: var(--sun); }
.rs-batt { --tone: var(--batt); }
.rs-grid { --tone: var(--grid); }
.rs-imp { --tone: var(--imp); }
.rs-exp { --tone: var(--exp); }
.rs-load { --tone: var(--load); }

/* ---------- charts ---------- */
.chart-box { min-height: 120px; position: relative; }
.ch { display: block; max-width: 100%; overflow: visible; touch-action: pan-y; }
.ch text { font: 10.5px var(--mono); fill: var(--ink-3); }
.ch text.t2 { fill: var(--batt); }
.ch text.unit { font-size: 9.5px; }
.ch .band-lbl { font: 600 9.5px var(--ui); fill: var(--ink-2); }
html[lang="ur"] .ch .band-lbl { font-family: var(--ur); font-size: 10px; }
.ch .gl { stroke: var(--line); stroke-width: 1; }
.ch .gl.zero { stroke: var(--line-2); }
.ch .hit { fill: transparent; }
.ch .guide { stroke: var(--ink-3); stroke-dasharray: 3 3; opacity: 0; transition: opacity .1s; pointer-events: none; }
.ch .cursor { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 4 3; pointer-events: none; }
.ch .pv { fill: none; stroke: var(--sun); stroke-width: 2.2; }
.ch .pv-area { fill: var(--sun); fill-opacity: .2; }
.ch .load-area { fill: var(--load); fill-opacity: .22; }
.ch .flex-area { fill-opacity: .55; }
.ch .load-line { fill: none; stroke: var(--load); stroke-width: 1.4; stroke-opacity: .8; }
.ch .load-line2 { fill: none; stroke: var(--load); stroke-width: 2; }
.ch .imp-line { fill: none; stroke: var(--imp); stroke-width: 1.8; }
.ch .exp-line { fill: none; stroke: var(--exp); stroke-width: 1.8; }
.ch .soc { fill: none; stroke: var(--batt); stroke-width: 2.6; stroke-linejoin: round; }
.ch .socfill-area { fill: var(--batt); fill-opacity: .12; }
.ch .socfill { fill: none; stroke: none; }
.ch .soc-naive { fill: none; stroke: var(--grid); stroke-width: 1.6; stroke-dasharray: 2 4; }
.ch .soc-inv { fill: none; stroke: var(--ink-3); stroke-width: 1.6; stroke-dasharray: 7 4; }
.ch .min-line { stroke: var(--batt); stroke-dasharray: 2 4; stroke-width: 1; opacity: .7; }
.ch .eol-line { stroke: var(--imp); stroke-dasharray: 5 4; stroke-width: 1.4; }
.ch .dash-lbl { font-size: 9.5px; fill: var(--batt); }
.ch .imp-bar { fill: var(--imp); }
.ch .exp-bar { fill: var(--exp); }
.ch .pv-bar { fill: var(--sun); }
.ch .clear-bar { fill: var(--sun-soft); stroke: var(--sun-2); stroke-width: 1; stroke-dasharray: 3 2; }
.ch .cloud-bar { fill: var(--grid); fill-opacity: .14; }
.ch .bill-bar { fill: var(--imp); fill-opacity: .85; }
.ch .hist-bar { fill: var(--sun); }
.ch .stack-bar { stroke: var(--surface); stroke-width: .5; }
.ch .clear-line { fill: none; stroke: var(--ink-3); stroke-width: 1.4; stroke-dasharray: 5 4; }
.ch .ghi-line { fill: none; stroke: var(--ink-2); stroke-width: 1.4; }
.ch .dni-line { fill: none; stroke: var(--imp); stroke-width: 1.4; }
.ch .dhi-line { fill: none; stroke: var(--grid); stroke-width: 1.4; }
.ch .temp-line { fill: none; stroke: var(--imp); stroke-width: 1.6; stroke-dasharray: 1 3; stroke-linecap: round; }
.ch .cash-line { fill: none; stroke-width: 2.2; }
.ch .out-band { fill: var(--grid); fill-opacity: .13; }
.ch .peak-band { fill: var(--imp); fill-opacity: .06; }
.ch .after-band { fill: var(--surface-3); fill-opacity: .6; }
.ch .path-today { fill: none; stroke: var(--sun); stroke-width: 2.6; }
.ch .path-sol { fill: none; stroke: var(--line-2); stroke-width: 1.2; stroke-dasharray: 4 4; }
.ch .panel-az { stroke: var(--batt); stroke-width: 1.2; stroke-dasharray: 2 3; }
.ch .hr-dot { fill: var(--surface); stroke: var(--sun); stroke-width: 2; }
.ch .hr-lbl { font-size: 9.5px; fill: var(--sun-ink); }
.ch.gantt .gantt-track { fill: var(--surface-2); }
.ch.gantt .gantt-bar { fill-opacity: .9; }
.ch.gantt .gantt-ic { stroke: var(--ink-2); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ch.gantt .gantt-lbl { font: 600 10px var(--ui); fill: #fff; dominant-baseline: middle; pointer-events: none; }
.ch.gantt .gantt-lbl.out { fill: var(--ink-2); }
html[lang="ur"] .ch.gantt .gantt-lbl { font-family: var(--ur); }
.ch.heat rect { transition: fill-opacity .2s; }
.spark path { fill: none; stroke: var(--batt); stroke-width: 2; }
.pchart > div + div { margin-top: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: .78rem; color: var(--ink-2); }
.legend .lg { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 8px; border-radius: 3px; display: inline-block; }
.l-pv { background: var(--sun); }
.l-load { background: color-mix(in srgb, var(--load) 35%, transparent); }
.l-soc { background: var(--batt); height: 3px !important; }
.l-load2 { background: var(--load); height: 3px !important; }
.l-socn { border-top: 2px dotted var(--grid); height: 0 !important; }
.l-soci { border-top: 2px dashed var(--ink-3); height: 0 !important; }
.l-imp { background: var(--imp); }
.l-exp { background: var(--exp); }
.l-out { background: color-mix(in srgb, var(--grid) 30%, transparent); }
.l-peak { background: color-mix(in srgb, var(--imp) 15%, transparent); }
.l-clear { border-top: 2px dashed var(--ink-3); height: 0 !important; }
.l-ghi { background: var(--ink-2); height: 2px !important; }
.l-dni { background: var(--imp); height: 2px !important; }
.l-dhi { background: var(--grid); height: 2px !important; }
.l-cloud { background: color-mix(in srgb, var(--grid) 25%, transparent); }
.l-temp { border-top: 2px dotted var(--imp); height: 0 !important; }
.l-cursor { border-top: 2px dashed var(--ink); height: 0 !important; }

/* ---------- controls ---------- */
.controls .ctl-row + .ctl-row { margin-top: 14px; }
.ctl-row { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-end; }
.ctl { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.range-ctl { min-width: 220px; flex: 1; }
.range-ctl .tag b { color: var(--ink); font-size: .85rem; margin-inline-start: 4px; }
.sticky-side { position: sticky; top: 84px; }
.model { margin: 0; padding-inline-start: 20px; display: grid; gap: 8px; font-size: .9rem; color: var(--ink-2); }
.model li::marker { color: var(--sun); font-family: var(--mono); }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.checks li { display: flex; gap: 10px; align-items: flex-start; font-size: .88rem; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }
.checks .ic { margin-top: 3px; }
.ck-ok .ic { color: var(--exp); }
.ck-warn .ic { color: var(--warn); }
.ck-warn { background: var(--warn-soft) !important; }
.ck-info .ic { color: var(--grid); }
.hint.d-block { display: block; font-weight: 400; }
.field-l { font-size: .82rem; color: var(--ink-2); font-weight: 500; margin: 12px 0 6px; }
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: ''; width: 8px; height: 8px; border: solid var(--ink-3); border-width: 0 2px 2px 0; transform: rotate(45deg); margin-inline-start: auto; transition: transform .2s; }
details[open] > summary::after { transform: rotate(225deg); }

/* ---------- forecast ---------- */
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; transition: all .2s var(--ease); min-width: 0; }
.day:hover { border-color: var(--sun-2); }
.day.on { background: var(--sun-soft); border-color: var(--sun); box-shadow: 0 0 0 2px color-mix(in srgb, var(--sun) 30%, transparent); }
.day .d-name { font-size: .78rem; color: var(--ink-2); white-space: nowrap; }
.day .ic { color: var(--sun); margin: 4px 0; }
.day b { font-size: 1.05rem; }
.day small { font-size: .68rem; color: var(--ink-3); white-space: nowrap; }
.sunfacts { margin-bottom: 8px; }

/* ---------- loads ---------- */
.ld-list { list-style: none; margin: 0; padding: 0; }
.ld-row { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ld-row:last-child { border-bottom: 0; }
.ld-ic { width: 40px; height: 40px; border-radius: 12px; background: var(--load-soft); color: var(--load); display: grid; place-items: center; flex: none; }
.ld-row .row { gap: 6px; }
.ld-row small { display: block; margin-top: 2px; }
.ld-kwh { white-space: nowrap; font-size: .95rem; }
.ld-kwh small { color: var(--ink-3); display: inline; }
.base-ed { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 3px; height: 170px; align-items: end; touch-action: none; user-select: none; padding: 4px; border-radius: 12px; background: var(--surface-2); }
.bb { height: 100%; border: 0; background: none; padding: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; position: relative; cursor: ns-resize; min-width: 0; }
.bb i { display: block; background: color-mix(in srgb, var(--load) 55%, transparent); border-radius: 4px 4px 0 0; min-height: 2px; transition: height .15s; }
.bb.on i { background: var(--load); }
.bb span { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: .62rem; color: var(--ink-3); }
.base-ed + .row { margin-top: 26px; }
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.lib-item { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; text-align: start; transition: border-color .2s, transform .2s var(--ease); }
.lib-item:hover { border-color: var(--load); transform: translateY(-2px); }
.lib-item .ic { color: var(--load); }
.lib-item b { font-size: .88rem; }
.lib-item small { color: var(--ink-3); font-size: .74rem; }
.hours { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; }
.hr { min-height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); font: .74rem var(--mono); cursor: pointer; color: var(--ink-2); }
.hr.on { background: var(--load); border-color: var(--load); color: #fff; }
.danger-t { color: var(--imp) !important; }

/* ---------- tariff ---------- */
.regimes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.regime { text-align: start; cursor: pointer; display: flex; flex-direction: column; gap: 6px; border-top: 4px solid var(--rc); padding: 14px; color: var(--ink); font: inherit; }
.regime.on { box-shadow: 0 0 0 2px var(--rc), var(--shadow); }
.regime b { font-size: .92rem; }
.regime small { font-size: .76rem; line-height: 1.35; }
html[lang="ur"] .regime small { line-height: 1.9; }
.rg-val { font-size: 1.3rem; margin-top: auto; }
.rg-val small { font-size: .74rem; color: var(--ink-3); }
.rg-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: .74rem; color: var(--ink-2); }
.rg-meta span { display: inline-flex; gap: 4px; align-items: center; }
.slabs { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }

/* ---------- load-shedding ---------- */
.week-grid { display: grid; gap: 3px; user-select: none; }
.wg-row { display: grid; grid-template-columns: 44px repeat(24, minmax(0, 1fr)); gap: 2px; align-items: center; }
.wg-head span { font-size: .62rem; color: var(--ink-3); text-align: start; }
.wg-day { font-size: .78rem; color: var(--ink-2); }
.wg-c { height: 28px; border-radius: 4px; border: 0; background: var(--surface-3); cursor: pointer; padding: 0; touch-action: none; transition: background .12s; }
.wg-c:hover { background: var(--line-2); }
.wg-c.on { background: var(--imp); }
.runtime { padding: 16px; border-radius: 16px; background: var(--batt-soft); display: flex; flex-direction: column; gap: 4px; }
.runtime b { font-size: 2rem; color: var(--batt); line-height: 1.2; }
.runtime.bad { background: var(--imp-soft); }
.runtime.bad b { color: var(--imp); }
.runtime small { color: var(--ink-2); font-size: .8rem; }
.pick-list { list-style: none; margin: 12px 0 0; padding: 0; max-height: 360px; overflow-y: auto; }
.pick-list li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; font-size: .88rem; }
.pick-list li.on { background: var(--batt-soft); }
.pick-list li .q { min-width: 20px; text-align: center; }

/* ---------- battery link ---------- */
.ble-read { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px; border-radius: 14px; background: var(--surface-2); }
.ble-read b { display: block; font-size: 2rem; color: var(--batt); }
.ble-read small { display: block; }
.sim { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px; }
.sim.idle .cells { opacity: .35; }
.sim-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-content: start; }
.ss { padding: 10px; border-radius: 12px; background: var(--surface-2); min-width: 0; }
.ss b { display: block; font-size: 1.05rem; margin-top: 2px; white-space: nowrap; }
.ss.batt b { color: var(--batt); }
.ss.warn { background: var(--warn-soft); }
.spark-ss { grid-column: span 3; }
.cells { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.cell { height: 92px; border-radius: 9px; border: 1.5px solid var(--batt); position: relative; display: flex; align-items: flex-end; overflow: hidden; background: var(--surface); }
.cell i { position: absolute; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--batt) 30%, transparent); transition: height .6s var(--ease); }
.cell span { position: relative; width: 100%; text-align: center; font-size: .66rem; padding-bottom: 4px; }
.cell.hi { border-color: var(--imp); }
.cell.lo { border-color: var(--warn); }

/* ---------- learn ---------- */
.guides { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.guide-card { text-decoration: none; color: var(--ink); display: flex; flex-direction: column; gap: 8px; }
.guide-card .btn { align-self: flex-start; margin-top: auto; }
.quiz-card { background: linear-gradient(160deg, var(--sun-soft), var(--surface) 70%); }
.g-ic { width: 48px; height: 48px; border-radius: 14px; background: var(--sun-soft); color: var(--sun-ink); display: grid; place-items: center; flex: none; }
.guide { max-width: 820px; }
.guide .g-head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 8px; }
.guide section { margin-top: 18px; }
.guide h3 { font-size: 1.08rem; margin-bottom: 6px; color: var(--batt); }
.guide p, .guide li { color: var(--ink-2); }
.guide ul { padding-inline-start: 20px; margin: 0; display: grid; gap: 6px; }
.back { margin-bottom: 10px; }
.quiz { max-width: 760px; }
.quiz .q { font-size: 1.2rem; margin: 18px 0 14px; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: center; text-align: start; padding: 13px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-size: .95rem; transition: border-color .2s, background .2s; }
.opt:hover:not([disabled]) { border-color: var(--sun); background: var(--sun-soft); }
.opt.right { border-color: var(--exp); background: var(--exp-soft); }
.opt.right .ic { color: var(--exp); }
.opt.wrong { border-color: var(--imp); background: var(--imp-soft); }
.opt.wrong .ic { color: var(--imp); }
.opt.dim { opacity: .55; }
.opt[disabled] { cursor: default; }
.result { text-align: center; }
.ring-wrap { position: relative; width: 140px; height: 140px; margin: 6px auto 10px; }
.ring { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { fill: none; stroke: var(--surface-3); stroke-width: 10; }
.ring .val { fill: none; stroke: var(--sun); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .9s var(--ease); }
.ring-wrap b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.6rem; }
.review { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 8px; text-align: start; }
.review li { padding: 10px 12px; border-radius: 12px; background: var(--surface-2); display: grid; gap: 2px; }
.review span { color: var(--exp); }
.result .row { justify-content: center; }

/* ---------- inbox, about, shortcuts, more sheet ---------- */
.notes, .log { list-style: none; margin: 0; padding: 0; }
.notes li { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); }
.notes li.unread p { font-weight: 600; }
.notes li p { margin: 0; }
.n-ic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--surface-2); color: var(--sun); flex: none; }
.notes li.unread .n-ic { background: var(--sun-soft); }
.day-h { font-size: .8rem; color: var(--ink-3); margin: 14px 0 4px; font-weight: 600; }
.log li { display: flex; gap: 10px; align-items: center; padding: 7px 0; font-size: .9rem; border-bottom: 1px dashed var(--line); }
.log li .ic { color: var(--ink-3); }
.todos { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.todos li { padding: 12px; border-radius: 12px; background: var(--surface-2); }
.todos p { margin: 4px 0; }
code { font: .78rem var(--mono); background: var(--surface-3); padding: 2px 6px; border-radius: 6px; }
.sources { margin: 0; padding-inline-start: 18px; display: grid; gap: 6px; font-size: .88rem; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; align-items: center; margin: 0; }
.keys dd { margin: 0; }
kbd { font: 500 .8rem var(--mono); padding: 3px 8px; border-radius: 7px; border: 1px solid var(--line-2); border-bottom-width: 3px; background: var(--surface-2); white-space: nowrap; }
.qa { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.qa a { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; border-radius: 14px; background: var(--surface-2); color: var(--ink); text-decoration: none; font-size: .8rem; text-align: center; }
.qa a .ic { color: var(--sun); width: 1.4em; height: 1.4em; }
.slots { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 6px; }
.slots li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); font-size: .88rem; }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .regimes { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .guides { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 1099px) {
  .app { grid-template-columns: 76px minmax(0, 1fr); }
  .rail { padding: 12px 8px; align-items: center; }
  .rail .brand span:last-child, .rail .grp, .rail nav a span, .rail-foot div div { display: none; }
  .rail nav a { justify-content: center; padding: 10px; }
  .rail nav a .cnt { position: absolute; top: 2px; inset-inline-end: 2px; display: block; }
  .rail nav a.on::before { inset-inline-start: -8px; }
  .rail .grp + a { margin-top: 10px; }
  .rail-foot { padding: 10px 0 0; }
  .home-grid, .split { grid-template-columns: minmax(0, 1fr); }
  .home-grid > aside { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .home-grid > aside > * + * { margin-top: 0; }
  .sticky-side { position: static; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .top { padding: 10px 16px; gap: 8px; }
  .top .brand { display: flex; }
  .top .brand .mark { width: 34px; height: 34px; }
  .top h1 { font-size: 1.05rem; }
  .top .sub { font-size: .72rem; }
  .tbtn { height: 38px; min-width: 38px; padding: 0 8px; }
  #view { padding: 16px 16px 96px; }
  .tabs { display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
  .tabs a, .tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border: 0; background: none; color: var(--ink-3); font-size: .7rem; text-decoration: none; border-radius: 12px; position: relative; min-height: 48px; cursor: pointer; }
  .tabs .ic { width: 1.35em; height: 1.35em; }
  .tabs .on { color: var(--batt); background: var(--batt-soft); }
  .tdot { position: absolute; top: 2px; inset-inline-end: 22%; background: var(--imp); color: #fff; font: 600 .62rem/16px var(--mono); min-width: 16px; height: 16px; border-radius: 99px; }
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .g2, .split.even, .guides { grid-template-columns: minmax(0, 1fr); }
  .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .home-grid > aside { grid-template-columns: minmax(0, 1fr); }
  .regimes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .reasons.compact { grid-template-columns: minmax(0, 1fr); }
  .tile { padding: 12px 12px 12px 14px; }
  .tile .val { font-size: 1.25rem; }
  .card { padding: 14px; }
  .page-head h2 { font-size: 1.3rem; }
  .days { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .sim, .sim-stats { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .sim { grid-template-columns: minmax(0, 1fr); }
  .spark-ss { grid-column: span 2; }
  .cells { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .wg-row { grid-template-columns: 34px repeat(24, minmax(0, 1fr)); gap: 1px; }
  .wg-c { height: 24px; border-radius: 3px; }
  .hours { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .qa { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  #modal { align-items: end; padding: 0; }
  .sheet { width: 100%; border-radius: 22px 22px 0 0; max-height: 88vh; transform: translateY(30px); padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
  .sheet .grab { display: block; width: 44px; height: 5px; border-radius: 99px; background: var(--line-2); margin: -6px auto 10px; }
  #toasts { bottom: 86px; inset-inline-end: 16px; inset-inline-start: 16px; align-items: stretch; }
  .scrub #playBtn { width: 42px; height: 42px; }
  .ctl-row { gap: 12px; }
  .seg { max-width: 100%; }
  .range-ctl { min-width: 0; flex: 1 1 100%; }
  .day small { white-space: normal; text-align: center; line-height: 1.3; }
}
@media (max-width: 420px) {
  .top-actions #searchBtn { display: none; }
  .regimes { grid-template-columns: minmax(0, 1fr); }
}

/* ---------- right-to-left ---------- */
html[dir="rtl"] .tile::after { border-radius: 3px 0 0 3px; }
html[dir="rtl"] .rail nav a.on::before { border-radius: 4px 0 0 4px; }
html[dir="rtl"] .scrub-ticks, html[dir="rtl"] .scrub-track, html[dir="rtl"] .base-ed, html[dir="rtl"] .wg-row, html[dir="rtl"] .chart-box, html[dir="rtl"] .pchart, html[dir="rtl"] .flow-wrap { direction: ltr; }
html[dir="rtl"] :is(span, b, small, strong).num { direction: ltr; unicode-bidi: isolate; }
html[dir="rtl"] :is(div, td, dd, p, li).num, html[dir="rtl"] td.n, html[dir="rtl"] .tile .val { unicode-bidi: plaintext; }
html[dir="rtl"] .wg-day { direction: rtl; text-align: end; padding-inline-end: 4px; }
html[lang="ur"] .tile .lbl, html[lang="ur"] .tile .foot { line-height: 1.9; }
html[lang="ur"] .tile .val { line-height: 1.4; }
html[lang="ur"] .chip { line-height: 1.7; padding-top: 1px; padding-bottom: 1px; }
html[lang="ur"] .btn { line-height: 1.6; }
html[lang="ur"] .tabs a span, html[lang="ur"] .tabs button span { font-size: .72rem; line-height: 1.6; }
html[lang="ur"] .reasons li { line-height: 2; }

/* ---------- print (A4 reports) ---------- */
@media print {
  @page { size: A4; margin: 14mm; }
  :root, [data-theme="dark"] { --bg: #fff; --surface: #fff; --surface-2: #f6f2ea; --surface-3: #ece5d6; --line: #ddd2bf; --line-2: #c9b99c; --ink: #1b1813; --ink-2: #4b443a; --ink-3: #776e61; --sun: #d98a06; --sun-soft: #fbe8c2; --batt: #0c6c67; --grid: #4d5c77; --imp: #d9573a; --exp: #3a8a5b; --load: #7a54a6;
    --exp-soft: #d9ede0; --imp-soft: #f9ddd3; --batt-soft: #d4ebe7; --grid-soft: #e0e5ee; --load-soft: #ece3f6; --warn-soft: #fbefd4; --sun-ink: #7a4b00; color-scheme: light; }
  body { background: #fff !important; }
  body > *:not(#printArea) { display: none !important; }
  #printArea { display: block !important; }
  .doc { font-size: 10.5pt; color: #1b1813; }
  .doc h1 { font-size: 18pt; margin: 6px 0 2px; }
  .doc h2 { font-size: 12.5pt; margin: 16px 0 6px; }
  .r-head { display: flex; justify-content: space-between; border-bottom: 2px solid #d98a06; padding-bottom: 6px; font-size: 9pt; }
  .r-brand { font-size: 13pt; margin-inline-end: 8px; }
  .r-meta { text-align: end; color: #4b443a; }
  .r-sub { color: #4b443a; margin-bottom: 10px; }
  .r-tbl, .doc .tbl { width: 100%; border-collapse: collapse; font-size: 9pt; margin: 8px 0; }
  .r-tbl th, .r-tbl td, .doc .tbl th, .doc .tbl td { border: 1px solid #ddd2bf; padding: 4px 6px; text-align: start; }
  .r-chart svg { display: block; margin: 6px 0; break-inside: avoid; }
  .r-list { padding-inline-start: 28px; }
  .r-list li { margin: 3px 0; }
  .r-foot { margin-top: 18px; padding-top: 6px; border-top: 1px solid #ddd2bf; font-size: 8.5pt; color: #776e61; }
  .doc .ic { display: none; }
  .doc tr { break-inside: avoid; }
}

'use strict';
/* =====================================================================
   Dhoop — solar battery optimizer (single file, no build)
   utils · i18n · catalog (cities, DISCOs, appliances) · state and seed ·
   solar model (position, clear sky, Erbs, plane of array, temperature) ·
   day-ahead optimizer (dynamic programming + load shifting) · tariff and
   regimes · logs, CSV mapper, rainflow and ageing · SVG charts · views ·
   platform (inbox, settings, search, tour, shortcuts, print) · boot.
   All tariffs, prices and model parameters are illustrative.
   The eight student extension points are listed on the About page.

// ---------- DOM + storage helpers ----------
const NS = 'dhoop.';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const store = {
  get(k, d) {
    try {
      const v = localStorage.getItem(NS + k);
      return v == null ? d : JSON.parse(v);
    } catch {
      return d;
    }
  },
  set(k, v) {
    try {
      localStorage.setItem(NS + k, JSON.stringify(v));
      return true;
    } catch {
      return false;
    }
  },
  del(k) {
    try {
      localStorage.removeItem(NS + k);
    } catch {
      /* storage blocked */
    }
  },
  keys() {
    const out = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith(NS)) out.push(k.slice(NS.length));
      }
    } catch {
      /* storage blocked */
    }
    return out;
  },
  bytes() {
    let n = 0;
    for (const k of this.keys()) n += k.length + (localStorage.getItem(NS + k) || '').length;
    return n * 2;
  },
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = a => a.reduce((s, v) => s + v, 0);
const mean = a => (a.length ? sum(a) / a.length : 0);
const round = (v, d = 0) => Math.round(v * 10 ** d) / 10 ** d;
const uid = (p = '') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const now = () => Date.now();
const later = fn => setTimeout(fn, 0);
const nextFrame = () => new Promise(r => setTimeout(r, 0));

function debounce(fn, ms = 180) {
  let h = 0;
  return (...a) => {
    clearTimeout(h);
    h = setTimeout(() => fn(...a), ms);
  };
}

// Deterministic PRNG (mulberry32) so seeded weather and logs look the same on every machine.
function rng(seed) {
  return () => {
    seed |= 0;
    seed = (seed + 0x6d2b79f5) | 0;
    let x = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

// Small string hash used to seed per-city randomness and to key plan caches.
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

// ---------- dates (Pakistan Standard Time, UTC+5, no daylight saving) ----------
const MIN = 60000;
const HOUR = 36e5;
const DAY = 864e5;
const PKT = 5;
const pad2 = n => String(n).padStart(2, '0');
const locale = () => (lang === 'ur' ? 'ur-PK-u-nu-latn' : 'en-PK');

/** Local calendar date "YYYY-MM-DD" of a timestamp (device time zone). */
function isoDate(ts = now()) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
const dateTs = iso => new Date(iso + 'T00:00:00').getTime();
const addDays = (iso, n) => isoDate(dateTs(iso) + n * DAY + 2 * HOUR);
const weekday = iso => new Date(iso + 'T12:00:00').getDay();

/** Day of year 1..366 for an ISO date. */
function dayOfYear(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(y, 0, 0)) / DAY);
}
const fmtDate = (iso, opts = { weekday: 'short', day: 'numeric', month: 'short' }) => new Date(iso + 'T12:00:00').toLocaleDateString(locale(), opts);
const fmtLongDate = iso => fmtDate(iso, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const fmtDT = ts => new Date(ts).toLocaleString(locale(), { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });

/** 13.5 → "13:30" (24-hour clock everywhere, so no AM/PM is reordered in Urdu). */
function hhmm(h) {
  const tot = Math.round(h * 60);
  const hh = tot === 1440 ? 24 : Math.floor(tot / 60) % 24;
  return `${pad2(hh)}:${pad2(tot % 60)}`;
}
const nowHour = () => {
  const d = new Date();
  return d.getHours() + d.getMinutes() / 60;
};

function ago(ts) {
  const s = Math.round((now() - ts) / 1000);
  if (s < 60) return t('justNow');
  if (s < 3600) return t('minAgo', { n: Math.round(s / 60) });
  if (s < 86400) return t('hrAgo', { n: Math.round(s / 3600) });
  return t('daysAgo', { n: Math.round(s / 86400) });
}

// ---------- number formats ----------
const nf = (v, d = 0) => Number(v).toLocaleString('en-PK', { minimumFractionDigits: d, maximumFractionDigits: d });
const fKW = (v, d = 1) => `${nf(v, d)} kW`;
const fKWh = (v, d = 1) => `${nf(v, d)} kWh`;
const fPct = (v, d = 0) => `${nf(v, d)}%`;
const fRs = (v, d = 0) => `${v < 0 ? '−' : ''}Rs ${nf(Math.abs(v), d)}`;
const fRsK = v => (Math.abs(v) >= 100000 ? `${v < 0 ? '−' : ''}Rs ${nf(Math.abs(v) / 100000, 2)} lakh` : fRs(v));
const signed = (v, d = 0) => (v > 0 ? '+' : v < 0 ? '−' : '') + nf(Math.abs(v), d);

// ---------- feedback: toast, aria-live, motion ----------
function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.setAttribute('role', 'status');
  el.innerHTML = ic(type === 'ok' ? 'check-circle' : type === 'bad' ? 'alert-circle' : 'info') + '<span></span>';
  el.lastChild.textContent = msg;
  $('#toasts').append(el);
  setTimeout(() => el.classList.add('out'), 3000);
  setTimeout(() => el.remove(), 3350);
}

const announce = msg => {
  $('#live').textContent = '';
  setTimeout(() => ($('#live').textContent = msg), 30);
};
const calm = () => document.documentElement.classList.contains('calm') || matchMedia('(prefers-reduced-motion: reduce)').matches;

function animateIn(root) {
  if (!root) return;
  root.classList.remove('enter');
  void root.offsetWidth;
  root.classList.add('enter');
  $$('.stagger', root).forEach(g => [...g.children].forEach((el, i) => el.style.setProperty('--i', Math.min(i, 14))));
  settle(root, true);
}

// Bars, counters and chart lines: animated on first render, placed directly on re-render.
function settle(root, animate = false) {
  if (!root) return;
  requestAnimationFrame(() => $$('.bar > i[data-w]', root).forEach(b => (b.style.width = b.dataset.w + '%')));
  $$('[data-count]', root).forEach(el => {
    const d = Number(el.dataset.dec || 0);
    const fmt = v => (el.dataset.pre || '') + nf(v, d) + (el.dataset.suf || '');
    if (animate) countUp(el, Number(el.dataset.count), { fmt });
    else el.textContent = fmt(Number(el.dataset.count));
  });
  if (animate) $$('path[data-draw], polyline[data-draw]', root).forEach(drawPath);
}

function countUp(el, to, { dur = 700, fmt = v => nf(v) } = {}) {
  if (calm()) {
    el.textContent = fmt(to);
    return;
  }
  const t0 = performance.now();
  const step = ts => {
    const p = Math.min(1, (ts - t0) / dur);
    el.textContent = fmt(to * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function drawPath(p) {
  if (calm() || !p.getTotalLength) return;
  const L = p.getTotalLength();
  p.style.strokeDasharray = L;
  p.style.strokeDashoffset = L;
  p.getBoundingClientRect();
  p.style.transition = 'stroke-dashoffset .9s var(--ease)';
  p.style.strokeDashoffset = 0;
  setTimeout(() => (p.style.strokeDasharray = ''), 950);
}

// A tile with an animated number: data-count drives countUp in animateIn.
function tile({ icon, label, value, dec = 0, pre = '', suf = '', unit = '', foot = '', color = 'var(--sun)', id = '' }) {
  return `<div class="tile" style="--tc:${color}" ${id ? `id="${id}"` : ''}><div class="lbl">${ic(icon)}<span>${label}</span></div>
    <div class="val"><span data-count="${value}" data-dec="${dec}" data-pre="${pre}" data-suf="${suf}">${pre}${nf(value, dec)}${suf}</span>${unit ? `<small>${unit}</small>` : ''}</div>
    ${foot ? `<div class="foot">${foot}</div>` : ''}</div>`;
}

// ---------- modal sheet ----------
let modalReturn = null;
let modalOnClose = null;

function sheetHead(title, icon = 'info') {
  return `<div class="shead"><h3 id="sheetTitle">${ic(icon)}<span>${title}</span></h3><button class="ibtn" type="button" data-close aria-label="${t('close')}">${ic('x')}</button></div>`;
}

function openModal(html, { wide = false, onClose = null } = {}) {
  if (!$('#modal').classList.contains('on')) modalReturn = document.activeElement;
  const sh = $('#sheet');
  sh.className = 'sheet' + (wide ? ' wide' : '');
  sh.innerHTML = '<div class="grab"></div>' + html;
  sh.scrollTop = 0;
  $('#scrim').classList.add('on');
  $('#modal').classList.add('on');
  modalOnClose = onClose;
  $$('[data-close]', sh).forEach(b => (b.onclick = closeModal));
  const first = sh.querySelector('[autofocus], input:not([type=hidden]):not([type=checkbox]):not([type=file]):not([type=range]), select, textarea');
  setTimeout(() => (first || sh.querySelector('.shead [data-close]') || sh).focus({ preventScroll: true }), 80);
  return sh;
}

function closeModal() {
  if (!$('#modal').classList.contains('on')) return;
  $('#modal').classList.remove('on');
  $('#scrim').classList.remove('on');
  const cb = modalOnClose;
  modalOnClose = null;
  if (cb) cb();
  if (modalReturn && document.contains(modalReturn)) modalReturn.focus({ preventScroll: true });
}
const modalOpen = () => $('#modal').classList.contains('on');

function askConfirm(msg, { okText = t('confirm'), danger = false, icon = 'help' } = {}) {
  return new Promise(resolve => {
    let answered = false;
    const finish = v => {
      if (answered) return;
      answered = true;
      resolve(v);
    };
    const sh = openModal(`${sheetHead(t('areYouSure'), icon)}<p>${msg}</p>
      <div class="sfoot"><button class="btn ghost" type="button" data-close>${t('cancel')}</button>
      <button class="btn ${danger ? 'danger' : ''}" type="button" id="cfOk">${okText}</button></div>`, { onClose: () => finish(false) });
    $('#cfOk', sh).onclick = () => {
      finish(true);
      closeModal();
    };
  });
}

// ---------- print, download, files, clipboard ----------
function printDoc(html) {
  $('#printArea').innerHTML = html;
  window.print();
}

function downloadFile(name, text, mime = 'application/json') {
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function pickFile(accept, cb) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = accept;
  inp.onchange = () => inp.files[0] && inp.files[0].text().then(text => cb(text, inp.files[0].name));
  inp.click();
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast(t('copied'), 'ok');
  } catch {
    toast(t('copyFailed'), 'bad');
  }
}

// Read a numeric input with a fallback and limits.
function numVal(el, d = 0, lo = -Infinity, hi = Infinity) {
  const v = parseFloat(el && el.value);
  return Number.isFinite(v) ? clamp(v, lo, hi) : d;
}

// Segmented control: buttons with data-v inside .seg; returns HTML.
function segHtml(id, options, value) {
  const btn = ([v, label]) => {
    const on = String(v) === String(value);
    return `<button type="button" data-v="${v}" class="${on ? 'on' : ''}" aria-pressed="${on}">${label}</button>`;
  };
  return `<div class="seg" id="${id}" role="group">${options.map(btn).join('')}</div>`;
}
function bindSeg(id, cb, root = document) {
  $$(`#${id} [data-v]`, root).forEach(b => (b.onclick = () => cb(b.dataset.v)));
}

// ---------- form field builders ----------
function numField(id, label, v, unit = '', o = {}) {
  const lim = `${o.min != null ? `min="${o.min}"` : ''} ${o.max != null ? `max="${o.max}"` : ''} step="${o.step || 'any'}"`;
  const input = `<input id="${id}" type="number" inputmode="decimal" value="${v}" ${lim} class="ltr">`;
  return `<label class="field"><span>${label}</span><div class="unit">${input}${unit ? `<i>${unit}</i>` : ''}</div>${hintHtml(o.hint)}</label>`;
}

function selectField(id, label, options, value, hint = '') {
  const opt = ([v, l]) => `<option value="${esc(v)}" ${String(v) === String(value) ? 'selected' : ''}>${esc(l)}</option>`;
  return `<label class="field"><span>${label}</span><select id="${id}">${options.map(opt).join('')}</select>${hintHtml(hint)}</label>`;
}

const hintHtml = (hint, cls = '') => (hint ? `<small class="hint ${cls}">${hint}</small>` : '');
const switchField = (id, label, on, hint = '') =>

/** Read a number field; marks it invalid (and returns null) when empty or outside [lo, hi]. */
function readNum(id, lo, hi, root = document) {
  const el = $('#' + id, root);
  const v = parseFloat(el.value);
  const ok = Number.isFinite(v) && v >= lo && v <= hi;
  el.closest('.field').classList.toggle('bad', !ok);
  return ok ? v : null;
}

// TXT.en / TXT.ur are built from STR so both languages always have the same keys.
const TXT = { en: {}, ur: {} };

function buildTxt() {
  for (const [k, [en, ur]] of Object.entries(STR)) {
    TXT.en[k] = en;
    TXT.ur[k] = ur || en;
  }
}

// A key ending in "1" (daysAgo1) is used automatically when the count {n} is exactly 1.
function tIn(lng, k, vars = {}) {
  if (!TXT.en.appName) buildTxt();
  const dict = TXT[lng === 'ur' ? 'ur' : 'en'];
  const s = (vars.n === 1 && dict[k + '1']) || dict[k] || TXT.en[k] || k;
  return s.replace(/\{(\w+)\}/g, (m, v) => (vars[v] ?? m));
}
const t = (k, vars) => tIn(lang, k, vars);
// Bilingual field from content objects: { en: '…', ur: '…' }.
