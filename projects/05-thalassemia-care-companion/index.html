    <label class="f" for="pgName">${T('prog_name')}</label><input id="pgName" type="text" value="${esc(d.name || '')}" maxlength="120">
    <div class="cols tight">${field('pgKind', 'prog_kind', `<select id="pgKind">${opt(['govt', 'ngo'], d.kind, x => t(x === 'govt' ? 'prog_govt' : 'prog_ngo'))}</select>`)}${field('pgProv', 'prog_province', `<select id="pgProv">${opt(PROVINCES, d.province)}</select>`)}</div>
    <label class="f" for="pgOffers">${T('prog_offers')} (English)</label><textarea id="pgOffers" maxlength="400">${esc(d.offers_en || '')}</textarea>
    <label class="f" for="pgOffersUr">${T('prog_offers')} (اردو)</label><textarea id="pgOffersUr" class="ur rtl" maxlength="400">${esc(d.offers_ur || '')}</textarea>
    <label class="f" for="pgApply">${T('prog_apply')} (English)</label><input id="pgApply" type="text" value="${esc(d.apply_en || '')}" maxlength="240">
    <label class="f" for="pgApplyUr">${T('prog_apply')} (اردو)</label><input id="pgApplyUr" type="text" class="ur rtl" value="${esc(d.apply_ur || '')}" maxlength="240">
    <label class="f" for="pgContact">${T('prog_contact')}</label><input id="pgContact" type="text" value="${esc(d.contact || '')}" maxlength="120">
    <div class="acts"><button class="btn ghost" id="pgCancel">${T('cancel')}</button><button class="btn" id="pgSave">${ic('check')} ${T('save')}</button></div>`);
  $('#pgCancel').onclick = closeModal;
  $('#pgSave').onclick = () => {
    const name = $('#pgName').value.trim();
    const offers = $('#pgOffers').value.trim();
    if (!name || !offers) return toast(t('prog_invalid'), 'bad');
    const rec = { id: pg ? pg.id : 'pg_' + uid(), name, kind: $('#pgKind').value, province: $('#pgProv').value, offers_en: offers, offers_ur: $('#pgOffersUr').value.trim(), apply_en: $('#pgApply').value.trim(), apply_ur: $('#pgApplyUr').value.trim(), contact: $('#pgContact').value.trim() };
    const list = programmes();
    const i = list.findIndex(x => x.id === rec.id);
    if (i >= 0) list[i] = rec;
    else list.push(rec);
    store.set('programmes', list);
    closeModal();
    toast(t('prog_saved'), 'ok');
    route();
  };
}

// ---------- notifications inbox ----------
function refreshInboxBadge() {
  const unread = buildInbox().filter(i => !i.read).length;
  const el = $('#inboxCnt');
  el.textContent = unread > 9 ? '9+' : String(unread);
  el.classList.toggle('hidden', unread === 0);
  $('#inboxBtn').setAttribute('aria-label', `${t('ib_t')} · ${t('ib_unread', { n: unread })}`);
}
function inboxModal() {
  const items = buildInbox().sort((a, b) => (a.read - b.read) || (a.lvl === 'bad' ? -1 : b.lvl === 'bad' ? 1 : 0));
  const unread = items.filter(i => !i.read).length;
  const rows = items.map(it => `<div class="row ${it.read ? '' : 'unread'}"><div class="l"><div class="fine">${esc(it.who)}</div><b>${ic(it.ic)} ${esc(it.title)}</b><div class="muted ${urCls()}" style="font-size:.85rem">${esc(it.body)}</div></div>
      <div class="acts"><span class="pill ${it.lvl}">${T('lvl_' + it.lvl)}</span><button class="btn ghost sm" data-go="${it.pid}|${it.tab}|${it.id}">${ic('chevron-right')}</button>${it.read ? '' : `<button class="btn ghost sm" data-read="${it.id}" aria-label="${esc(t('ib_markRead'))}">${ic('check')}</button>`}</div></div>`).join('');
  openModal(`<div class="toolbar" style="margin-bottom:8px"><h3 style="margin:0">${ic('bell')} ${T('ib_t')} <span class="muted" style="font-weight:500;font-size:.9rem">· ${T('ib_unread', { n: unread })}</span></h3><span class="spacer"></span>${unread ? `<button class="btn ghost sm" id="ibAll">${ic('check-circle')} ${T('ib_markAll')}</button>` : ''}</div>
    <div class="list stagger" style="max-height:60vh;overflow:auto">${rows || `<div class="empty">${T('ib_none')}</div>`}</div>
    <div class="acts"><button class="btn ghost" id="ibClose">${T('close')}</button></div>`);
  animateIn($('#modal'));
  $('#ibClose').onclick = closeModal;
  if ($('#ibAll')) {
    $('#ibAll').onclick = () => {
      markInboxRead(items.map(i => i.id));
      refreshInboxBadge();
      inboxModal();
    };
  }
  $$('[data-read]').forEach(b => {
    b.onclick = () => {
      markInboxRead([b.dataset.read]);
      refreshInboxBadge();
      inboxModal();
    };
  });
  $$('[data-go]').forEach(b => {
    b.onclick = () => {
      const [pid, tab, id] = b.dataset.go.split('|', 3);
      markInboxRead([b.dataset.go.slice(pid.length + tab.length + 2)]);
      store.set('current', pid);
      closeModal();
      location.hash = tab;
      route();
      refreshInboxBadge();
    };
  });
}
function shortcutsModal() {
  const rows = [['1–9', 'sc_tabs'], ['n', 'sc_inbox'], ['l', 'sc_lang'], ['?', 'sc_help'], ['Esc', 'sc_esc']];
  openModal(`<h3>${ic('hash')} ${T('st_shortcuts')}</h3><div class="list" style="margin-top:10px">${rows.map(([k, d]) => `<div class="setrow" style="padding:8px 0"><span class="kbd">${k}</span><span class="fine" style="flex:1;text-align:right">${T(d)}</span></div>`).join('')}</div>
    <div class="acts"><button class="btn ghost" id="scClose">${T('close')}</button></div>`);
  $('#scClose').onclick = closeModal;
}

// ---------- guided tour (spotlight steps) ----------
const tour = { i: -1, hole: null, card: null };
function startTour() {
  endTour();
  tour.hole = document.createElement('div');
  tour.hole.className = 'tourhole';
  tour.card = document.createElement('div');
  tour.card.className = 'tourcard';
  tour.card.setAttribute('role', 'dialog');
  document.body.append(tour.hole, tour.card);
  tour.i = 0;
  showTourStep();
  window.addEventListener('resize', positionTour);
}
function endTour() {
  if (tour.hole) tour.hole.remove();
  if (tour.card) tour.card.remove();
  tour.hole = null;
  tour.card = null;
  tour.i = -1;
  window.removeEventListener('resize', positionTour);
  store.set('tourDone', TODAY);
}
function tourTarget() {
  const step = TOUR_STEPS[tour.i];
  return $(step.sel) || (step.fallback ? $(step.fallback) : null);
}
function positionTour() {
  if (tour.i < 0 || !tour.hole) return;
  const el = tourTarget();
  if (!el) return;
  const r = el.getBoundingClientRect();
  const pad = 6;
  Object.assign(tour.hole.style, { top: `${r.top - pad}px`, left: `${r.left - pad}px`, width: `${r.width + pad * 2}px`, height: `${r.height + pad * 2}px` });
  const cw = tour.card.offsetWidth;
  const chh = tour.card.offsetHeight;
  let top = r.bottom + 14;
  if (top + chh > window.innerHeight - 10) top = Math.max(10, r.top - chh - 14);
  let left = clamp(r.left, 10, window.innerWidth - cw - 10);
  if (r.width > window.innerWidth * 0.8) left = clamp(window.innerWidth / 2 - cw / 2, 10, window.innerWidth - cw - 10);
  Object.assign(tour.card.style, { top: `${top}px`, left: `${left}px` });
}
function showTourStep() {
  const step = TOUR_STEPS[tour.i];
  const el = tourTarget();
  if (!step || !el) return endTour();
  el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  const last = tour.i === TOUR_STEPS.length - 1;
  tour.card.innerHTML = `<div class="step">${tour.i + 1} / ${TOUR_STEPS.length}</div><h4 class="${urCls()}">${T(step.key + '_t')}</h4><p class="${urCls()}">${T(step.key)}</p>
    <div class="acts"><button class="btn ghost sm" id="tourSkip">${T('tour_skip')}</button><span class="spacer"></span>${tour.i > 0 ? `<button class="btn ghost sm" id="tourBack">${ic('chevron-left')} ${T('tour_back')}</button>` : ''}<button class="btn sm" id="tourNext">${T(last ? 'tour_done' : 'tour_next')} ${ic(last ? 'check' : 'chevron-right')}</button></div>`;
  $('#tourSkip').onclick = endTour;
  if ($('#tourBack')) $('#tourBack').onclick = () => { tour.i--; showTourStep(); };
  $('#tourNext').onclick = () => {
    if (last) return endTour();
    tour.i++;
    showTourStep();
  };
  setTimeout(positionTour, 50);
  setTimeout(positionTour, 400);
}

// ---------- reminders ----------
function checkReminders() {
  const rem = store.get('rem', {});
  const fired = store.get('remFired', {});
  const now = new Date();
  patients().forEach(p => {
    const r = rem[p.id];
    if (!r || !r.on) return;
    const [h, m] = (r.time || '21:00').split(':').map(Number);
    const due = new Date(today);
    due.setHours(h, m, 0, 0);
    if (now < due || fired[p.id] === TODAY || dosesOf(p.id)[TODAY]) return;
    fired[p.id] = TODAY;
    store.set('remFired', fired);
    const msg = `${p.name}: ${t('rem_msg')}`;
    if ('Notification' in window && Notification.permission === 'granted') {
      try {
        new Notification(t('title'), { body: msg });
      } catch {
        toast(msg);
      }
    } else {
      toast(msg);
    }
  });
  // TODO(student): scheduleReminder(p) — register a service worker + push subscription (FCM/OneSignal) or an SMS gateway so reminders fire when the page is closed.
}

// ---------- keyboard shortcuts ----------
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeModal();
    if (tour.i >= 0) endTour();
    return;
  }
  const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement && document.activeElement.tagName);
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key >= '1' && e.key <= '9') {
    const tab = TABS[+e.key - 1];
    if (tab) location.hash = tab[0];
  } else if (e.key === 'n') {
    inboxModal();
  } else if (e.key === 'l') {
    lang = lang === 'en' ? 'ur' : 'en';
    applyLang();
  } else if (e.key === '?') {
    shortcutsModal();
  }
});

// ---------- router / boot ----------
const VIEWS = {
  overview: renderOverview,
  transfusions: renderTransfusions,
  reactions: renderReactions,
  iron: renderIron,
  labs: renderLabs,
  growth: renderGrowth,
  adherence: renderAdherence,
  meds: renderMeds,
  costs: renderCosts,
  appointments: renderAppointments,
  notes: renderNotes,
  summary: renderSummary,
  screening: renderScreening,
  learn: renderLearn,
  settings: renderSettings,
  about: renderAbout
};
function route() {
  let tab = (location.hash.slice(1) || 'overview').split('?')[0];
  if (!VIEWS[tab]) tab = 'overview';
  cur = tab;
  document.body.dataset.tab = tab;
  renderRail();
  renderHead();
  renderTabs();
  const p = current();
  if (PATIENT_TABS.includes(tab)) {
    if (!p) renderEmpty();
    else VIEWS[tab](p);
  } else {
    VIEWS[tab]();
  }
  animateIn(view);
  refreshInboxBadge();
  window.scrollTo({ top: 0 });
}
function applyLang() {
  document.documentElement.lang = lang;
  store.set('lang', lang);
  $('#langBtn').textContent = lang === 'en' ? 'اردو' : 'English';
  $('#brandTitle').textContent = t('title');
  $('#brandTitle').className = lang === 'ur' ? 'ur' : '';
  $('#brandTag').textContent = t('tagline');
  $('#brandTag').className = lang === 'ur' ? 'ur' : '';
  $('#dateBadge').textContent = today.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  $('#inboxBtn').title = t('ib_t');
  route();
}
$('#langBtn').onclick = () => {
  lang = lang === 'en' ? 'ur' : 'en';
  applyLang();
};
$('#inboxBtn').onclick = inboxModal;
$('#printBtn').onclick = () => {
  if (cur !== 'summary' && current()) {
    location.hash = 'summary';
    setTimeout(() => window.print(), 400);
  } else {
    window.print();
  }
};
window.addEventListener('hashchange', route);
window.addEventListener('resize', debounce(() => {
  if (['transfusions', 'iron', 'labs', 'growth', 'costs', 'summary'].includes(cur)) route();
}, 250));
document.body.insertAdjacentHTML('beforeend', `<datalist id="centres">${CENTRES.map(c => `<option value="${esc(c)}">`).join('')}</datalist>`);
applySettings();
applyLang();
checkReminders();
setInterval(checkReminders, 60000);
</script>
