<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rickshaw Rush</title>
<meta name="description" content="Karachi-at-dusk endless rickshaw runner: three lanes, fares, fuel, truck-art garage, daily seeded challenge with ghost replay, goals, trip analytics and a printable report. All art drawn procedurally on canvas, single file.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=Poppins:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Design tokens: Karachi dusk sky + truck-art chrome
   ===================================================================== */
:root {
  --bg: #120a24;
  --panel: #24113f;
  --panel-2: #1b0d30;
  --surface: #2d1850;
  --surface-2: #3a2066;
  --line: #4a2a78;
  --magenta: #ff2e88;
  --yellow: #ffd23f;
  --cyan: #2ed3f0;
  --green: #3ddc84;
  --red: #ff5c5c;
  --cream: #fff3dc;
  --muted: #c9b7e4;
  --font: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "Righteous", "Poppins", sans-serif;
  --font-ur: "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --dur: .35s;
  --radius: 18px;
}

/* ---------- motion kit ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
html.reduce *, html.reduce *::before, html.reduce *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
@keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
@keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.enter { animation: fadeUp var(--dur) var(--ease) both; }
.stagger > * { animation: fadeUp .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
.card, .tile { transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s; }
.card:hover { transform: translateY(-2px); }
.fill, .bar > i { transition: width .6s var(--ease); }
.skeleton { background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--cream); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.15; }
.ur, [lang=ur] { font-family: var(--font-ur); line-height: 1.9; }
html[lang=ur] .i18n { font-family: var(--font-ur); line-height: 1.8; }
.muted { color: var(--muted); }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.ic { width: 1.1em; height: 1.1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; flex: none; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
code { font-size: .88em; background: var(--panel-2); padding: 1px 5px; border-radius: 5px; }

/* ---------- stage: letterboxed canvas ---------- */
#stage {
  position: fixed; inset: 0; display: grid; place-items: center;
  background: repeating-linear-gradient(135deg, rgba(255, 46, 136, .08) 0 14px, transparent 14px 28px), radial-gradient(ellipse at 50% 120%, #5a1d6e, transparent 60%), #120a24;
}
#frame { position: relative; overflow: hidden; box-shadow: 0 0 0 1px #000, 0 0 80px -10px rgba(255, 46, 136, .35); }
#c { display: block; touch-action: none; user-select: none; cursor: pointer; }

/* ---------- HUD overlay ---------- */
.hud { position: absolute; inset: 0; pointer-events: none; font-family: var(--display); text-shadow: 0 2px 0 #3a0b2a, 0 0 12px rgba(0, 0, 0, .6); }
.hud.large { font-size: 1.18em; }
.hud .tl { position: absolute; left: 12px; top: 10px; }
.hud .score { font-size: clamp(1.6rem, 4.5vw, 2.2rem); color: var(--yellow); letter-spacing: .02em; line-height: 1; }
.hud .lab { font: 600 .68rem var(--font); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); text-shadow: none; }
.hud .dist { font-size: 1.1rem; color: var(--cream); margin-top: 4px; }
.hud .dist small { font: 600 .75rem var(--font); color: var(--muted); }
.hud .tr { position: absolute; right: 12px; top: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.hud .chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.hud .chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(27, 13, 48, .75); border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: .95rem; color: var(--cream); }
.hud .chip .ic { color: var(--yellow); }
.hud .chip.pax .ic { color: var(--cyan); }
.hud .pause { pointer-events: auto; width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--yellow); background: rgba(27, 13, 48, .8); color: var(--yellow); display: grid; place-items: center; cursor: pointer; }
.hud .pw { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); display: flex; gap: 8px; }
.hud .pill { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 58px; padding: 5px 8px; border-radius: 12px; background: rgba(27, 13, 48, .8); border: 1.5px solid var(--c, var(--cyan)); color: var(--c, var(--cyan)); font-size: .85rem; animation: pop .25s var(--ease); }
.hud .pill .bar { width: 100%; height: 5px; border-radius: 3px; background: #000a; overflow: hidden; }
.hud .pill .bar > i { display: block; height: 100%; background: var(--c, var(--cyan)); transition: none; }
.hud .fuel { position: absolute; left: 12px; bottom: 14px; width: min(44%, 220px); }
.hud .fuel .bar { height: 14px; border: 2px solid var(--cream); border-radius: 9px; background: rgba(0, 0, 0, .6); overflow: hidden; }
.hud .fuel .bar > i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--red), var(--yellow) 45%, var(--green)); transition: width .25s linear; }
.hud .fuel.low .bar { border-color: var(--red); animation: pulse .6s infinite; }
.hud .speed { position: absolute; left: 12px; bottom: 46px; font-size: 1rem; color: var(--cream); }
.hud .speed small { font: 600 .7rem var(--font); color: var(--muted); }
.hud .combo { position: absolute; right: 12px; bottom: 14px; text-align: right; }
.hud .combo .mult { font-size: 2rem; color: var(--magenta); line-height: 1; transform-origin: right bottom; }
.hud .combo .mult.bump { animation: pulse .3s var(--ease); }
.hud .near { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); color: var(--cyan); font-size: 1.4rem; opacity: 0; transition: opacity .2s; }
.hud .near.on { opacity: 1; }
.hud .mode { position: absolute; left: 50%; top: 58px; transform: translateX(-50%); font: 700 .7rem var(--font); letter-spacing: .16em; text-transform: uppercase; color: var(--cyan); background: rgba(27, 13, 48, .8); border: 1.5px solid var(--cyan); border-radius: 999px; padding: 3px 10px; }
.hud .mode.practice { color: var(--green); border-color: var(--green); }
.hint { position: absolute; left: 50%; bottom: 22%; transform: translateX(-50%); background: rgba(27, 13, 48, .85); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 14px; font: 500 .85rem var(--font); color: var(--cream); text-align: center; white-space: nowrap; transition: opacity .5s; pointer-events: none; }
.hint .ic { color: var(--yellow); }

/* ---------- screens: truck-art panels ---------- */
.screen { position: fixed; inset: 0; display: none; overflow: auto; padding: 22px 16px; background: rgba(14, 6, 30, .6); backdrop-filter: blur(3px); z-index: 20; }
.screen.on { display: flex; }
.screen.light { background: rgba(14, 6, 30, .28); backdrop-filter: none; }
.panel {
  position: relative; margin: auto; width: 100%; max-width: var(--w, 460px);
  background: linear-gradient(180deg, var(--panel), #160a28); border: 3px solid var(--yellow); border-radius: var(--radius);
  padding: 22px; color: var(--cream);
  box-shadow: 0 0 0 5px #160a28, 0 0 0 7px var(--magenta), 0 30px 70px -20px rgba(0, 0, 0, .9);
}
.panel::before, .panel::after { content: ""; position: absolute; left: 18px; right: 18px; height: 10px; pointer-events: none; }
.panel::before { top: -12px; background: radial-gradient(circle at 7px 10px, var(--cyan) 0 4px, transparent 4.6px) 0 0 / 14px 10px repeat-x; }
.panel::after { bottom: -12px; background: radial-gradient(circle at 7px 0, var(--cyan) 0 4px, transparent 4.6px) 0 0 / 14px 10px repeat-x; }
.chamak { height: 7px; border-radius: 4px; background: repeating-linear-gradient(90deg, var(--magenta) 0 12px, var(--yellow) 12px 24px, var(--cyan) 24px 36px); margin: 12px 0 16px; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .35); }
.title { font-family: var(--display); font-size: clamp(2.1rem, 7vw, 3.2rem); line-height: 1; color: var(--yellow); text-shadow: 3px 3px 0 var(--magenta), 6px 6px 0 #2a0b4a; letter-spacing: .01em; }
.title-ur { font-family: var(--font-ur); font-size: 1.35rem; color: var(--cyan); direction: rtl; margin-top: 6px; }
.lead { color: var(--muted); margin: 6px 0 0; font-size: .92rem; }
.head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
.head h2 { font-family: var(--display); font-size: 1.6rem; color: var(--yellow); letter-spacing: .01em; flex: 1; min-width: 0; }
.head .coinchip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel-2); border: 1.5px solid var(--yellow); border-radius: 999px; padding: 6px 12px; font-family: var(--display); color: var(--yellow); }
.sect { font: 700 .72rem var(--font); text-transform: uppercase; letter-spacing: .14em; color: var(--cyan); margin: 14px 0 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px; padding: 11px 18px; min-height: 44px;
  font: 600 .95rem var(--font); cursor: pointer; background: var(--yellow); color: #2a0b4a; box-shadow: 0 4px 0 #b88a00; text-decoration: none;
  transition: transform .15s var(--ease), box-shadow .15s var(--ease), background .15s;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #b88a00; }
.btn.pink { background: var(--magenta); color: #fff; box-shadow: 0 4px 0 #9b0f4e; }
.btn.pink:active { box-shadow: 0 1px 0 #9b0f4e; }
.btn.cyan { background: var(--cyan); color: #0b2a30; box-shadow: 0 4px 0 #1289a0; }
.btn.cyan:active { box-shadow: 0 1px 0 #1289a0; }
.btn.green { background: var(--green); color: #063d22; box-shadow: 0 4px 0 #1d8a4e; }
.btn.green:active { box-shadow: 0 1px 0 #1d8a4e; }
.btn.ghost { background: var(--surface); color: var(--cream); border: 2px solid var(--line); box-shadow: none; }
.btn.ghost:active { box-shadow: none; }
.btn.big { font-size: 1.2rem; padding: 14px 26px; font-family: var(--display); letter-spacing: .03em; min-height: 54px; }
.btn.sm { padding: 7px 12px; min-height: 40px; font-size: .85rem; border-radius: 11px; }
.btn.icon { width: 44px; padding: 0; position: relative; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn.wide { width: 100%; }
.badge { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--magenta); color: #fff; font: 700 .7rem var(--font); display: grid; place-items: center; padding: 0 5px; border: 2px solid var(--panel); }
.backbtn { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 8px 10px 8px 0; min-height: 40px; font-weight: 600; text-decoration: none; }
.backbtn:hover { color: var(--cream); }
.menu-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: nowrap; }
.menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.menu-grid.three { grid-template-columns: repeat(3, 1fr); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.rowc { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }

/* ---------- menu chips, goals strip ---------- */
.statchips { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 4px; }
.statchip { display: inline-flex; align-items: center; gap: 8px; background: var(--panel-2); border: 1.5px solid var(--line); border-radius: 12px; padding: 7px 12px; font-size: .9rem; }
.statchip b { font-family: var(--display); color: var(--yellow); font-weight: 400; font-size: 1.05rem; }
.statchip .ic { color: var(--cyan); }
.goalstrip { display: flex; flex-direction: column; gap: 6px; background: var(--panel-2); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; margin: 10px 0 4px; }
.goalstrip .g { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: .8rem; align-items: center; }
.goalstrip .g .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: #0008; overflow: hidden; }
.goalstrip .g .bar > i { display: block; height: 100%; background: var(--cyan); }
.goalstrip .g.done .bar > i { background: var(--green); }
.goalstrip .g .rw { color: var(--yellow); font-family: var(--display); font-size: .85rem; }

/* ---------- garage ---------- */
.uprow { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); }
.uprow .uic { width: 42px; height: 42px; border-radius: 12px; background: var(--panel-2); display: grid; place-items: center; color: var(--yellow); font-size: 1.3rem; }
.uprow .nm { font-weight: 600; }
.uprow .ds { font-size: .8rem; color: var(--muted); font-weight: 500; }
.segs { display: flex; gap: 4px; margin-top: 6px; }
.segs i { flex: 1; height: 8px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); transition: background .4s var(--ease), border-color .4s; }
.segs i.on { background: var(--cyan); border-color: var(--cyan); }
.skins { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.skin { position: relative; border: 2px solid var(--line); border-radius: 14px; background: var(--surface); padding: 8px; text-align: center; cursor: pointer; color: var(--cream); }
.skin canvas { width: 100%; aspect-ratio: 1.1; display: block; border-radius: 10px; background: linear-gradient(180deg, #3b1a5c, #ff7a3d); }
.skin .nm { display: block; font-size: .8rem; font-weight: 600; margin-top: 6px; line-height: 1.25; }
.skin .st { display: block; font-size: .72rem; color: var(--muted); }
.skin.sel { border-color: var(--yellow); box-shadow: 0 0 0 3px rgba(255, 210, 63, .25); }
.skin.locked canvas { filter: grayscale(.7) brightness(.6); }
.skin .lk { position: absolute; top: 10px; right: 10px; color: var(--cream); background: rgba(0, 0, 0, .5); border-radius: 8px; padding: 3px 5px; display: flex; }

/* ---------- tables, tabs, KPIs, achievements ---------- */
.tabs { display: inline-flex; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel-2); }
.tabs button { border: 0; background: none; padding: 9px 16px; cursor: pointer; font-weight: 600; color: var(--muted); min-height: 40px; }
.tabs button.on { background: var(--magenta); color: #fff; }
.tbl { width: 100%; border-collapse: collapse; font-size: .92rem; }
.tbl th, .tbl td { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.tbl th { font: 700 .7rem var(--font); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .rk { font-family: var(--display); color: var(--muted); width: 34px; }
.tbl tr:nth-child(1) .rk { color: var(--yellow); }
.tbl tr:nth-child(2) .rk { color: var(--cyan); }
.tbl tr:nth-child(3) .rk { color: var(--magenta); }
.tbl .ini { font-family: var(--display); letter-spacing: .08em; font-size: 1rem; }
.tbl tr.me td { background: rgba(255, 46, 136, .12); }
.tbl tr.seed td { opacity: .8; }
.tblwrap { overflow: auto; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kpis.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.kpi .k { font: 600 .68rem var(--font); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.kpi .v { font-family: var(--display); font-size: 1.35rem; color: var(--yellow); margin-top: 2px; }
.achs { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.ach { display: flex; gap: 10px; align-items: center; padding: 9px 10px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); font-size: .78rem; line-height: 1.3; }
.ach .aic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--panel-2); color: var(--muted); flex: none; font-size: 1.1rem; }
.ach.on { border-color: var(--yellow); }
.ach.on .aic { background: var(--yellow); color: #2a0b4a; }
.ach .muted { display: block; font-size: .7rem; }
.pillmode { font: 700 .62rem var(--font); letter-spacing: .1em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
.pillmode.daily { color: var(--cyan); border-color: var(--cyan); }

/* ---------- settings switches, forms ---------- */
.sw { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.sw .d { font-size: .78rem; color: var(--muted); }
.tog { appearance: none; width: 48px; height: 28px; border-radius: 14px; background: var(--panel-2); border: 2px solid var(--line); position: relative; cursor: pointer; flex: none; transition: background .2s, border-color .2s; margin: 0; }
.tog::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--cream); transition: transform .2s var(--ease); }
.tog:checked { background: var(--magenta); border-color: var(--magenta); }
.tog:checked::after { transform: translateX(20px); }
input[type=range] { width: 120px; accent-color: var(--magenta); }
input[type=text] { background: var(--panel-2); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; color: var(--cream); min-height: 44px; outline: 0; width: 100%; }
input[type=text]:focus { border-color: var(--cyan); }
.ini-in { font-family: var(--display); font-size: 1.6rem; letter-spacing: .3em; text-transform: uppercase; text-align: center; width: 150px !important; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: .88rem; align-items: center; }
kbd { display: inline-block; min-width: 26px; text-align: center; padding: 2px 7px; border-radius: 7px; background: var(--panel-2); border: 1.5px solid var(--line); border-bottom-width: 3px; font: 600 .78rem var(--font); color: var(--cream); }
.todo { border: 1.5px dashed var(--magenta); border-radius: 12px; padding: 10px 12px; background: var(--surface); }
.todo h4 { font-size: .92rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.todo .tag { font-size: .66rem; background: var(--magenta); color: #fff; border-radius: 6px; padding: 2px 6px; font-weight: 700; letter-spacing: .04em; }
.todo p { margin: 4px 0 0; font-size: .84rem; color: var(--muted); }
.note { background: rgba(46, 211, 240, .1); border-left: 4px solid var(--cyan); padding: 9px 12px; border-radius: 8px; font-size: .86rem; color: var(--cream); }

/* ---------- game over, daily ---------- */
.over-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 14px 0; }
.over-stats .kpi .v { font-size: 1.25rem; }
.reason { display: flex; align-items: center; gap: 10px; background: var(--panel-2); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: .92rem; }
.reason .ic { color: var(--red); font-size: 1.3rem; }
.record { display: inline-flex; align-items: center; gap: 8px; background: var(--yellow); color: #2a0b4a; border-radius: 999px; padding: 5px 12px; font-family: var(--display); animation: pop .4s var(--ease); }
.dailybox { background: var(--panel-2); border: 1.5px solid var(--cyan); border-radius: 14px; padding: 12px 14px; }
.dailybox .seed { font-family: var(--display); letter-spacing: .12em; color: var(--cyan); font-size: 1.3rem; }
.goalrows { display: flex; flex-direction: column; gap: 8px; }
.goalrow { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); }
.goalrow .gic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--panel-2); color: var(--cyan); font-size: 1.2rem; }
.goalrow.done .gic { background: var(--green); color: #063d22; }
.goalrow .bar { height: 7px; border-radius: 4px; background: #0008; overflow: hidden; margin-top: 6px; }
.goalrow .bar > i { display: block; height: 100%; background: var(--cyan); }
.goalrow.done .bar > i { background: var(--green); }
.goalrow .rw { font-family: var(--display); color: var(--yellow); white-space: nowrap; }

/* ---------- inbox ---------- */
.inbox { display: flex; flex-direction: column; gap: 8px; }
.msg { display: grid; grid-template-columns: 38px 1fr auto; gap: 10px; align-items: start; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); cursor: pointer; text-align: left; color: var(--cream); width: 100%; }
.msg .mic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--panel-2); color: var(--muted); font-size: 1.15rem; }
.msg.unread { border-color: var(--magenta); }
.msg.unread .mic { color: var(--magenta); }
.msg .t { font-weight: 600; font-size: .9rem; }
.msg .b { font-size: .8rem; color: var(--muted); }
.msg .when { font-size: .72rem; color: var(--muted); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--magenta); display: inline-block; margin-left: 6px; }
.empty { text-align: center; color: var(--muted); padding: 26px 10px; border: 1.5px dashed var(--line); border-radius: 14px; }
.empty .ic { font-size: 2rem; color: var(--cyan); display: block; margin: 0 auto 8px; }

/* ---------- charts (hand-drawn SVG) ---------- */
.chartbox { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.chartbox h4 { font: 700 .72rem var(--font); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-bottom: 6px; }
.chartbox svg { width: 100%; height: auto; display: block; overflow: visible; }
.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.legend { display: flex; gap: 10px 14px; flex-wrap: wrap; font-size: .76rem; margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }
.lanebars { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; font-size: .8rem; }
.lanebars .bar { height: 10px; border-radius: 5px; background: #0008; overflow: hidden; }
.lanebars .bar > i { display: block; height: 100%; background: var(--yellow); }

/* ---------- onboarding tour ---------- */
#tour { position: fixed; inset: 0; z-index: 70; display: none; }
#tour.on { display: block; }
#tour .spot { position: absolute; border-radius: 14px; box-shadow: 0 0 0 9999px rgba(10, 4, 24, .72), 0 0 0 3px var(--yellow); transition: all .3s var(--ease); pointer-events: none; }
#tour .tip { position: absolute; width: min(320px, calc(100vw - 32px)); background: var(--panel); border: 2px solid var(--yellow); border-radius: 14px; padding: 14px 16px; box-shadow: 0 20px 50px -20px #000; animation: pop .3s var(--ease); }
#tour .tip h3 { font-family: var(--display); color: var(--yellow); font-size: 1.1rem; margin-bottom: 4px; }
#tour .tip p { margin: 0 0 12px; font-size: .88rem; color: var(--cream); }
#tour .tip .steps { font-size: .74rem; color: var(--muted); }

/* ---------- toasts ---------- */
#toasts { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 60; pointer-events: none; width: max-content; max-width: calc(100vw - 32px); }
.toast { display: flex; align-items: center; gap: 8px; background: var(--panel-2); border: 2px solid var(--yellow); color: var(--cream); padding: 10px 16px; border-radius: 12px; font-weight: 600; box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .7); animation: toastIn .3s var(--ease) both; transition: opacity .4s; }
.toast .ic { color: var(--yellow); }
.toast.ok { border-color: var(--green); }
.toast.ok .ic { color: var(--green); }
.toast.bad { border-color: var(--red); }
.toast.bad .ic { color: var(--red); }
.toast.gone { opacity: 0; }

/* ---------- responsive ---------- */
@media (max-width: 720px) {
  .two, .charts { grid-template-columns: 1fr; }
  .kpis, .kpis.four, .over-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .panel { padding: 18px 16px 20px; }
  .hud .tr .chips { max-width: 160px; }
  .hud .speed { display: none; }
  .tbl .dt { display: none; }
  .menu-grid .btn { padding: 11px 10px; }
  .menu-grid.three { grid-template-columns: 1fr 1fr; }
  .head > .rowc { flex-basis: 100%; }
}
@media (max-width: 420px) {
  .skins { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* ---------- print: only the report screen ---------- */
@media print {
  body { overflow: visible; background: #fff; color: #000; }
  #stage, #toasts, #tour, .screen:not(#s-report), .no-print { display: none !important; }
  #s-report { display: block; position: static; padding: 0; background: #fff; backdrop-filter: none; }
  #s-report .panel { max-width: none; border: 0; box-shadow: none; background: #fff; color: #000; padding: 0; }
  #s-report .panel::before, #s-report .panel::after { display: none; }
  #s-report .kpi, #s-report .tblwrap, #s-report .ach { background: #fff; border-color: #bbb; color: #000; }
  #s-report .kpi .v, #s-report .head h2 { color: #000; }
  #s-report .tbl th, #s-report .tbl td { border-color: #ccc; color: #000; }
  #s-report .muted, #s-report .kpi .k, #s-report .sect { color: #444; }
  #s-report .chamak { display: none; }
}

/* =====================================================================
   Rickshaw Rush — single-file canvas game
   Sections:
     1. utils            $, store, esc, ic, toast, rng, countUp, colours
     2. i18n             L.en / L.ur dictionaries, t()
     3. data             upgrades, skins, achievements, goals pool, seed records
     4. profile          persistent state (localStorage, prefix rush:)
     5. engine           geometry, object catalogue, spawning, physics, collisions
     6. render           procedural art: sky, city, road, scenery, vehicles, rickshaw
     7. audio            WebAudio synthesis
     8. HUD              DOM overlay updated per frame
     9. screens          menu, garage, leaderboard, daily, goals, inbox, trips, report, settings, about, over
    10. modules          notifications inbox, daily goals, trip log + SVG charts, ghost replay, onboarding tour
    11. input · loop · router · test hooks (window.game)
   Student extension points are marked with  TODO(student)
   ===================================================================== */

// ===================================================================
// 1. utils
// ===================================================================
const NS = 'rush:';
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

const store = {
  get(key, fallback) {
    try {
      const raw = localStorage.getItem(NS + key);
      return raw == null ? fallback : JSON.parse(raw);
    } catch {
      return fallback;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(NS + key, JSON.stringify(value));
    } catch {
      /* storage may be unavailable in private mode — the game still runs */
    }
  },
  del(key) {
    try {
      localStorage.removeItem(NS + key);
    } catch {
      /* ignore */
    }
  },
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (name, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;
const uid = () => Math.random().toString(36).slice(2, 9);
const nf = new Intl.NumberFormat('en-PK', { maximumFractionDigits: 0 });

function km(metres) {
  if (metres >= 1000) {
    return (metres / 1000).toFixed(2) + ' km';
  }
  return Math.round(metres) + ' m';
}

function dateStr(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
const todayStr = () => dateStr();

function daysAgoStr(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return dateStr(d);
}

function fmtDuration(seconds) {
  const m = Math.floor(seconds / 60);
  const s = Math.round(seconds % 60);
  return m ? `${m}m ${String(s).padStart(2, '0')}s` : `${s}s`;
}

// FNV-1a string hash → 32-bit unsigned (used to seed the daily challenge)
function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

// mulberry32: small deterministic PRNG, one stream per seed
function rng(seed) {
  return () => {
    seed |= 0;
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function toast(msg, type = '', icon = 'info') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = ic(icon) + '<span></span>';
  el.lastChild.textContent = msg;
  $('#toasts').append(el);
  setTimeout(() => el.classList.add('gone'), 2800);
  setTimeout(() => el.remove(), 3300);
}

// motion kit: route enter animation + stagger indices
function animateIn(root) {
  if (!root) return;
  root.classList.remove('enter');
  void root.offsetWidth;
  root.classList.add('enter');
  $$('.stagger', root).forEach(group => {
    [...group.children].forEach((el, i) => el.style.setProperty('--i', i));
  });
}

// motion kit: animated number
function countUp(el, to, { dur = 700, fmt = v => nf.format(Math.round(v)) } = {}) {
  if (!el) return;
  const t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(to * eased);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// motion kit: SVG line draw-in
function drawPath(path) {
  const len = path.getTotalLength();
  path.style.strokeDasharray = len;
  path.style.strokeDashoffset = len;
  path.getBoundingClientRect();
  path.style.transition = 'stroke-dashoffset .9s var(--ease)';
  path.style.strokeDashoffset = 0;
}

// colour helpers: accept '#rrggbb' or 'rgb(r,g,b)'
function parseCol(c) {
  if (c[0] === '#') {
    return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
  }
  return c.match(/\d+/g).slice(0, 3).map(Number);
}
function mixCol(a, b, t) {
  const A = parseCol(a);
  const B = parseCol(b);
  const r = Math.round(lerp(A[0], B[0], t));
  const g = Math.round(lerp(A[1], B[1], t));
  const bl = Math.round(lerp(A[2], B[2], t));
  return `rgb(${r},${g},${bl})`;
}
function shade(c, factor) {
  const [r, g, b] = parseCol(c);
  return `rgb(${clamp(Math.round(r * factor), 0, 255)},${clamp(Math.round(g * factor), 0, 255)},${clamp(Math.round(b * factor), 0, 255)})`;
}

const canvas = $('#c');
const ctx = canvas.getContext('2d');
const frame = $('#frame');
let dpr = 1, W = 0, H = 0, horizonY = 0, cx = 0, roadHalf = 0, portrait = false;

const LANE_X = [-0.667, 0, 0.667];   // lane centres in "road half-width" units
const CAM = 70;                       // camera depth constant (metres)
const PD = 16;                        // player distance from the camera (metres)
const FAR = 500;                      // spawn horizon (metres)
const PW = .5;                        // player width in lane units
const PLEN = 3;                       // player length in metres

// Size the canvas to the viewport, letterboxing ultra-wide or ultra-tall screens.
function resize() {
  const vw = innerWidth;
  const vh = innerHeight;
  const ar = vw / vh;
  let w = vw;
  let h = vh;
  if (ar > 2) w = Math.round(vh * 2);
  else if (ar < .46) h = Math.round(vw / .46);

  portrait = w < h;
  dpr = Math.min(2, devicePixelRatio || 1);
  frame.style.width = canvas.style.width = w + 'px';
  frame.style.height = canvas.style.height = h + 'px';
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);

  W = w;
  H = h;
  cx = W / 2;
  horizonY = Math.round(H * (portrait ? .40 : .42));
  roadHalf = portrait ? W * .5 : Math.min(W * .36, H * .52);
}

// perspective scale at camera distance d
const sc = d => CAM / (d + CAM);

// Project a point z metres ahead of the player at lateral offset xoff (lane units).
// Returns screen x/y, the scale s and k = pixels per lane unit at that depth.
function proj(z, xoff) {
  const s = sc(z + PD);
  const c = (1 - s) * (1 - s);
  return {
    x: cx + G.curve * W * c * 1.1 + xoff * roadHalf * s,
    y: horizonY + (H - horizonY) * s,
    s,
    k: roadHalf * s,
  };
}
