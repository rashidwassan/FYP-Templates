// Each rule returns { st: pass|fail|warn|info, w: weight, got: earned weight, hard, text }.
function rLevel(s, p) {
  const l = tr(LEVELS[p.level]);
  if (s.lv.includes(p.level)) return { st: 'pass', w: 30, got: 30, text: t('m_level_ok', { l }) };
  return { st: 'fail', w: 30, got: 0, hard: true, text: t('m_level_no', { l, list: s.lv.map(x => tr(LEVELS[x])).join(', ') }) };
}

function rField(s, p) {
  if (s.f.includes('any') || s.f.includes(p.field)) return { st: 'pass', w: 15, got: 15, text: t('m_field_ok') };
  return { st: 'fail', w: 15, got: 0, hard: true, text: t('m_field_no', { list: s.f.map(x => tr(FIELDS[x])).join(', ') }) };
}

function rProvince(s, p) {
  if (!s.e.prov) return null;
  if (s.e.prov.includes(p.prov)) return { st: 'pass', w: 15, got: 15, text: t('m_prov_ok', { p: tr(PROVINCES[p.prov]) }) };
  return { st: 'fail', w: 15, got: 0, hard: true, text: t('m_prov_no', { list: s.e.prov.map(x => tr(PROVINCES[x])).join(', ') }) };
}

function rLda(s, p) {
  if (!s.e.lda) return null;
  if (p.lda === 'yes') return { st: 'pass', w: 15, got: 15, text: t('m_lda_ok') };
  if (p.lda === 'unsure') return { st: 'warn', w: 15, got: 7, text: t('m_lda_unsure') };
  return { st: 'fail', w: 15, got: 0, hard: true, text: t('m_lda_no') };
}

function rIncome(s, p) {
  if (!s.e.inc) return null;
  const cap = fmtMoney(s.e.inc);
  if (p.income <= s.e.inc) return { st: 'pass', w: 15, got: 15, text: t('m_inc_ok', { cap }) };
  if (p.income <= s.e.inc * 1.1) return { st: 'warn', w: 15, got: 7, text: t('m_inc_close', { cap }) };
  return { st: 'fail', w: 15, got: 0, hard: true, text: t('m_inc_no', { cap }) };
}

function rAcademics(s, p) {
  if (!s.e.cgpa && !s.e.pct) return null;
  const byCgpa = p.scoreType === 'cgpa';
  const need = byCgpa ? s.e.cgpa ?? pctToCgpa(s.e.pct) : s.e.pct ?? cgpaToPct(s.e.cgpa);
  const have = byCgpa ? +p.cgpa : +p.pct;
  const label = byCgpa ? `CGPA ${need.toFixed(2)}` : `${need}%`;
  if (have >= need) return { st: 'pass', w: 15, got: 15, text: t('m_acad_ok', { need: label }) };
  const gap = byCgpa ? need - have <= 0.1 : need - have <= 3;
  if (gap) return { st: 'warn', w: 15, got: 6, text: t('m_acad_close', { need: label }) };
  return { st: 'fail', w: 15, got: 0, hard: true, text: t('m_acad_no', { need: label }) };
}

function rAge(s, p) {
  const max = (s.e.ageBy && s.e.ageBy[p.level]) || s.e.age;
  const min = s.e.ageMin;
  if (!max && !min) return null;
  const ok = (!max || p.age <= max) && (!min || p.age >= min);
  const range = min && max ? `${min}–${max}` : max ? `≤ ${max}` : `≥ ${min}`;
  if (ok) return { st: 'pass', w: 10, got: 10, text: t('m_age_ok') + ` (${range})` };
  return { st: 'fail', w: 10, got: 0, hard: true, text: t('m_age_no', { range }) };
}

function rWork(s, p) {
  if (!s.e.work) return null;
  const n = s.e.work;
  if (p.work >= n) return { st: 'pass', w: 10, got: 10, text: t('m_work_ok', { n }) };
  if (n - p.work <= 0.5) return { st: 'warn', w: 10, got: 5, text: t('m_work_close', { n }) };
  return { st: 'fail', w: 10, got: 0, hard: true, text: t('m_work_no', { n }) };
}

function rEnglish(s, p) {
  if (!s.e.eng) return null;
  const n = s.e.eng.toFixed(1);
  if (!p.eng) return { st: 'warn', w: 10, got: 4, text: t('m_eng_none', { n }) };
  if (p.eng >= s.e.eng) return { st: 'pass', w: 10, got: 10, text: t('m_eng_ok', { n }) };
  return { st: 'warn', w: 10, got: s.e.eng - p.eng <= 0.5 ? 5 : 1, text: t('m_eng_low', { n }) };
}

function rBond(s, p) {
  if (!s.e.bond) return null;
  if (p.bond) return { st: 'pass', w: 10, got: 10, text: t('m_bond_ok') };
  return { st: 'fail', w: 10, got: 0, hard: true, text: t('m_bond_no') };
}

function rGender(s, p) {
  if (!s.e.gender) return null;
  if (p.gender === s.e.gender) return { st: 'pass', w: 10, got: 10, text: t('m_gender_ok') };
  return { st: 'fail', w: 10, got: 0, hard: true, text: t('m_gender_no') };
}

function rDestination(s, p) {
  const domestic = s.c === 'PK';
  const mismatch = (p.dest === 'pk' && !domestic) || (p.dest === 'abroad' && domestic);
  if (mismatch) return { st: 'warn', w: 10, got: 0, text: t('m_dest_no') };
  return { st: 'pass', w: 10, got: 10, text: t('m_dest_ok') };
}

function rExtras(s, p) {
  const out = [];
  if (s.e.quota && (p.quota || []).some(q => s.e.quota.includes(q))) out.push({ st: 'pass', w: 0, got: 5, text: t('m_quota') });
  if (s.e.adm) out.push(p.admission ? { st: 'pass', w: 5, got: 5, text: t('m_adm_ok') } : { st: 'info', w: 0, got: 0, text: t('m_adm_need') });
  if (s.b === 'loan') out.push({ st: 'info', w: 0, got: 0, text: t('m_loan') });
  return out;
}

const RULES = [rLevel, rField, rProvince, rLda, rIncome, rAcademics, rAge, rWork, rEnglish, rBond, rGender, rDestination];

// Score = earned weight / total weight; any hard failure makes the scholarship ineligible.
function matchScholarship(s, p) {
  const reasons = [...RULES.map(rule => rule(s, p)).filter(Boolean), ...rExtras(s, p)];
  const total = sum(reasons.map(r => r.w));
  const got = sum(reasons.map(r => r.got));
  const eligible = !reasons.some(r => r.hard);
  const raw = total ? Math.round((100 * got) / total) : 0;
  const score = clamp(eligible ? raw : Math.min(raw, 35), 0, 100);
  return { id: s.id, score, eligible, reasons, warns: reasons.filter(r => r.st === 'warn').length };
}

function matchAll(p = profile()) {
  if (!p) return [];
  const value = id => (schById(id) || {}).v || 0;
  return allScholarships().map(s => matchScholarship(s, p)).sort((a, b) => b.eligible - a.eligible || b.score - a.score || value(b.id) - value(a.id));
}

const matchMap = () => Object.fromEntries(matchAll().map(m => [m.id, m]));

const ACTIVE = ['eligible', 'documents'];

function appReminders(a, s, out) {
  const dl = appDeadline(a);
  const n = daysUntil(dl);
  const nameFor = l => (l === 'ur' ? appSch(a).n[1] : appSch(a).n[0]) || a.sch;
  if (ACTIVE.includes(a.stage) && n != null && n >= 0 && n <= s.remindDays) {
    out.push({ kind: 'deadline', key: `dl:${a.id}:${dl}`, days: n, link: '#app/' + a.id, text: both('rm_deadline', l => ({ s: nameFor(l), when: tIn(l, n === 0 ? 'today' : 'inDays', { n }) })) });
  }
  if (ACTIVE.includes(a.stage) && n != null && n < 0) {
    out.push({ kind: 'overdue', key: `od:${a.id}:${dl}`, days: n, link: '#app/' + a.id, text: both('rm_overdue', l => ({ s: nameFor(l) })) });
  }
  const missing = a.docs.filter(d => d.status === 'missing').length;
  if (ACTIVE.includes(a.stage) && missing && n != null && n >= 0 && n <= 30) {
    out.push({ kind: 'docs', key: `md:${a.id}:${missing}`, days: n, link: '#app/' + a.id + '/docs', text: both('rm_docs', l => ({ s: nameFor(l), n: missing })) });
  }
  const iv = daysUntil(a.interview);
  if (a.stage === 'interview' && iv != null && iv >= 0 && iv <= 14) {
    out.push({ kind: 'interview', key: `iv:${a.id}:${a.interview}`, days: iv, link: '#app/' + a.id, text: both('rm_interview', l => ({ s: nameFor(l), when: tIn(l, iv === 0 ? 'today' : 'inDays', { n: iv }) })) });
  }
}

function vaultReminders(s, out) {
  const docName = (d, l) => d.title || (l === 'ur' ? DOC_TYPES[d.type].n[1] : DOC_TYPES[d.type].n[0]);
  vault().forEach(d => {
    const n = daysUntil(d.expiry);
    if (n == null) return;
    if (n < 0) out.push({ kind: 'expired', key: `xp:${d.id}:${d.expiry}`, days: n, link: '#documents/vault', text: both('rm_expired', l => ({ d: docName(d, l) })) });
    else if (n <= s.expiryDays) out.push({ kind: 'expiring', key: `ex:${d.id}:${d.expiry}`, days: n, link: '#documents/vault', text: both('rm_expiring', l => ({ d: docName(d, l), when: tIn(l, n === 0 ? 'today' : 'inDays', { n }) })) });
  });
  // Passport validity versus overseas intakes (many visas need six months beyond arrival).
  const pass = vault().find(d => d.type === 'passport' && d.expiry);
  if (!pass) return;
  const hit = apps().filter(a => a.stage !== 'result' && appSch(a).c !== 'PK' && intakeDate(a) && parseISO(pass.expiry) < addDays(intakeDate(a), 182));
  if (!hit.length) return;
  const first = hit.sort((a, b) => intakeDate(a) - intakeDate(b))[0];
  out.push({ kind: 'intake', key: `pi:${pass.id}:${pass.expiry}:${hit.length}`, days: daysUntil(pass.expiry), link: '#documents/vault', text: both('rm_intake', l => ({ d: docName(pass, l), s: (l === 'ur' ? appSch(first).n[1] : appSch(first).n[0]), n: hit.length })) });
}

function refereeReminders(out) {
  referees().forEach(r => r.requests.forEach(q => {
    if (!['asked', 'agreed'].includes(q.status)) return;
    const a = appById(q.app);
    const n = daysUntil(q.due);
    if (!a || n == null || n > 14) return;
    out.push({ kind: 'referee', key: `rf:${q.id}:${q.due}`, days: n, link: '#referees', text: both('rm_referee', l => ({ r: r.name, s: (l === 'ur' ? appSch(a).n[1] : appSch(a).n[0]), when: tIn(l, n < 0 ? 'daysAgo' : n === 0 ? 'today' : 'inDays', { n: Math.abs(n) }) })) });
  }));
}

function reminders() {
  const s = settings();
  const out = [];
  apps().forEach(a => appReminders(a, s, out));
  vaultReminders(s, out);
  refereeReminders(out);
  return out.sort((a, b) => a.days - b.days);
}

const REMIND_ICON = { deadline: 'clock', overdue: 'alert', docs: 'paperclip', interview: 'mic', expiring: 'timer', expired: 'alert-circle', intake: 'globe', referee: 'quote' };

// Push new reminders into the inbox once (deduplicated by key).
// TODO(student): push, email and SMS reminders — register a service worker and use the Notification API (or a server
//   cron that emails / texts the student) so reminders arrive when the page is closed; add quiet hours and per-kind
//   opt-outs in Settings, and reuse the same reminder keys so nothing is sent twice.
function syncReminders() {
  let added = 0;
  reminders().forEach(r => {
    if (notify(r.kind, r.key, r.text, '', r.link)) added++;
  });
  return added;
}

const saveDb = () => store.set('dbView', db);

const LEVEL_SHORT = { ug: ['BS', 'بی ایس'], ms: ['MS', 'ایم ایس'], phd: ['PhD', 'پی ایچ ڈی'], exch: ['Exchange', 'تبادلہ'], fellow: ['Fellowship', 'فیلوشپ'] };
const COVER_ICON = { T: 'graduation', t: 'percent', S: 'wallet', A: 'plane', H: 'heart', B: 'book' };
const coverIcons = s => `<span class="covicons">${[...(s.cov || '')].map(f => `<span class="cov cov-${f === 't' ? 'p' : f}" title="${esc(tr(COVER[f]))}">${ic(COVER_ICON[f])}<span class="sr-only">${esc(tr(COVER[f]))}</span></span>`).join('')}</span>`;
const isFullyFunded = s => /T/.test(s.cov || '') && /S/.test(s.cov || '');
const coverChips = (s, max = 6) => [...(s.cov || '')].slice(0, max).map(f => `<span class="chip ${f === 'T' || f === 'S' ? 'navy' : ''}" title="${esc(tr(COVER[f]))}">${esc(tr(COVER[f]))}</span>`).join(' ');
const countryName = c => tr((COUNTRIES[c] || COUNTRIES.MULTI).n);
const levelsText = s => s.lv.map(l => tr(LEVELS[l])).join(', ');

function searchText(s) {
  return [s.n[0], s.n[1], s.p ? s.p[0] : '', s.p ? s.p[1] : '', countryName(s.c), COUNTRIES[s.c] ? COUNTRIES[s.c].n[0] : '', s.id].join(' ').toLowerCase();
}

function filterScholarships(matches) {
  const q = db.q.trim().toLowerCase();
  const short = shortlist();
  return allScholarships().filter(s => {
    if (q && !q.split(/\s+/).every(w => searchText(s).includes(w))) return false;
    if (db.dest === 'pk' && s.c !== 'PK') return false;
    if (db.dest === 'abroad' && s.c === 'PK') return false;
    if (db.levels.length && !db.levels.some(l => s.lv.includes(l))) return false;
    if (db.field && !(s.f.includes('any') || s.f.includes(db.field))) return false;
    if (db.region && (COUNTRIES[s.c] || COUNTRIES.MULTI).r !== db.region) return false;
    if (db.basis && s.b !== db.basis) return false;
    if (db.full && !isFullyFunded(s)) return false;
    if (db.open && !isOpenNow(s)) return false;
    if (db.soon && !(s.w && daysUntil(typicalDeadline(s)) <= 60)) return false;
    if (db.short && !short.includes(s.id)) return false;
    if (db.elig && !(matches[s.id] && matches[s.id].eligible)) return false;
    return true;
  });
}

function sortScholarships(rows, matches) {
  const dl = s => (s.w ? daysUntil(typicalDeadline(s)) : 9999);
  const by = {
    deadline: (a, b) => dl(a) - dl(b),
    name: (a, b) => tr(a.n).localeCompare(tr(b.n)),
    value: (a, b) => (b.v || 0) - (a.v || 0),
    match: (a, b) => ((matches[b.id] || {}).score || 0) - ((matches[a.id] || {}).score || 0),
  };
  return rows.sort(by[db.sort] || by.deadline);
}

  const lvChip = l => `<button class="chip ${db.levels.includes(l) ? 'on' : ''}" data-lv="${l}" aria-pressed="${db.levels.includes(l)}">${esc(tr(LEVELS[l]))}</button>`;

  const sw = (id, key, label, disabled = false) => `<label class="swrow"><span>${label}</span><span class="switch"><input type="checkbox" id="${id}" data-flag="${key}" ${db[key] ? 'checked' : ''} ${disabled ? 'disabled' : ''}><span></span></span></label>`;
  const active = activeFilters();
  return `<details class="filters card flat" id="dbBox" ${window.innerWidth > 980 || active ? 'open' : ''}><summary>${ic('filter')} ${t('db_filters')} <span class="chip gold ${active ? '' : 'hidden'}" id="dbActive">${active}</span></summary><div class="fbody">
    <label class="field"><span class="sr-only">${t('search')}</span><span class="inputicon">${ic('search')}<input type="search" id="dbQ" value="${esc(db.q)}" placeholder="${t('db_search')}"></span></label>
    <div class="field"><span>${t('db_dest')}</span><div class="seg" id="dbDest">${['all', 'pk', 'abroad'].map(d => `<button data-dest="${d}" class="${db.dest === d ? 'on' : ''}">${t(d === 'all' ? 'all' : 'db_' + d)}</button>`).join('')}</div></div>
    <div class="field"><span>${t('db_level')}</span><div class="chips">${Object.keys(LEVELS).map(lvChip).join('')}</div></div>
    <label class="field">${t('db_field')}<select id="dbField"><option value="">${t('any')}</option>${opt(FIELDS, db.field).replace(/<option value="any"[^>]*>[^<]*<\/option>/, '')}</select></label>
    <label class="field">${t('db_region')}<select id="dbRegion"><option value="">${t('all')}</option>${opt(REGIONS, db.region)}</select></label>
    <label class="field">${t('db_basis')}<select id="dbBasis"><option value="">${t('all')}</option>${opt(BASIS, db.basis)}</select></label>
    <div class="switches">${sw('dbFull', 'full', t('db_full'))}${sw('dbOpen', 'open', t('db_open'))}${sw('dbSoon', 'soon', t('db_soon'))}${sw('dbShort', 'short', t('db_short'))}${sw('dbElig', 'elig', t('db_elig'), !profile())}</div>
    ${profile() ? '' : `<a class="small" href="#quiz">${ic('target')} ${t('noProfile')}</a>`}
    <button class="btn ghost sm" id="dbClear">${ic('x')} ${t('db_clear')}</button>
    <div class="covkey tiny muted">${Object.keys(COVER).map(f => `<span>${ic(COVER_ICON[f])} ${esc(tr(COVER[f]))}</span>`).join('')}</div>
  </div></details>`;
}

  const total = allScholarships().length;
  const nCmp = store.get('compare', []).length;
  view.innerHTML = `<header class="pagehead">
      <div><div class="kicker">${ic('book')} ${t('db_kicker')}</div><h1>${t('db_title')}</h1><p class="dek">${t('db_dek', { n: total })}</p></div>
      <div class="actions"><a class="btn ghost" href="#compare">${ic('scale')} ${t('compareN', { n: nCmp })}</a><button class="btn ghost" id="dbCsv">${ic('download')} ${t('exportCsv')}</button><button class="btn" id="dbAdd">${ic('plus')} ${t('addCustom')}</button></div>
    </header>
    <div class="db-layout"><aside id="dbFilters"></aside><section class="db-results">
      <div class="between mb"><p class="small muted" id="dbCount" aria-live="polite"></p>
        <label class="row small">${t('db_sort')} <select id="dbSort" class="inline">${['deadline', 'name', 'value', 'match'].map(k => `<option value="${k}" ${db.sort === k ? 'selected' : ''}>${t('so_' + k)}</option>`).join('')}</select></label></div>
      <div class="tablewrap"><table class="data" id="dbTable"><thead><tr><th class="c-cmp"><span class="sr-only">${t('col_compare')}</span>${ic('scale')}</th><th>${t('col_name')}</th><th>${t('col_level')}</th><th>${t('col_cover')}</th><th>${t('col_window')} / ${t('col_deadline')}</th><th>${t('col_match')}</th><th><span class="sr-only">${t('add')}</span></th></tr></thead><tbody></tbody></table></div>
      <p class="verify mt">${ic('info')} ${t('verify')}</p>
    </section></div>`;
  drawFilters();
  drawTable();
  $('#dbSort').onchange = e => {
    db.sort = e.target.value;
    saveDb();
    drawTable();
  };
  $('#dbCsv').onclick = exportScholarshipsCsv;
  $('#dbAdd').onclick = openCustomScholarship;
}

function drawFilters() {
  $('#dbFilters').innerHTML = filterPanel();
  const redraw = () => {
    saveDb();
    drawTable();
    const n = activeFilters();
    $('#dbActive').textContent = n;
    $('#dbActive').classList.toggle('hidden', !n);
  };
  $('#dbQ').oninput = debounce(e => {
    db.q = e.target.value;
    redraw();
  }, 150);
  $$('#dbDest button').forEach(b => (b.onclick = () => {
    db.dest = b.dataset.dest;
    $$('#dbDest button').forEach(x => x.classList.toggle('on', x === b));
    redraw();
  }));
  $$('[data-lv]').forEach(b => (b.onclick = () => {
    const l = b.dataset.lv;
    db.levels = db.levels.includes(l) ? db.levels.filter(x => x !== l) : [...db.levels, l];
    b.classList.toggle('on');
    b.setAttribute('aria-pressed', db.levels.includes(l));
    redraw();
  }));
  [['#dbField', 'field'], ['#dbRegion', 'region'], ['#dbBasis', 'basis']].forEach(([sel, key]) => ($(sel).onchange = e => {
    db[key] = e.target.value;
    redraw();
  }));
  $$('[data-flag]').forEach(cb => (cb.onchange = () => {
    db[cb.dataset.flag] = cb.checked;
    redraw();
  }));
  $('#dbClear').onclick = () => {
    db = { ...DB_DEFAULT, sort: db.sort };
    saveDb();
    drawFilters();
    drawTable();
  };
}

function drawTable() {
  const matches = matchMap();
  const rows = sortScholarships(filterScholarships(matches), matches);
  const inPipe = new Set(apps().map(a => a.sch));
  const body = $('#dbTable tbody');
  body.innerHTML = rows.length ? rows.map(s => dbRow(s, matches[s.id], inPipe.has(s.id))).join('') : `<tr><td colspan="7"><div class="empty">${ic('search')}${t('noResults')}</div></td></tr>`;
  body.classList.add('stagger');
  [...body.children].forEach((el, i) => el.style.setProperty('--i', Math.min(i, 14)));
  const msg = t('db_count', { n: rows.length, t: allScholarships().length });
  $('#dbCount').textContent = msg;
  announce(msg);
  animateMetrics(body);
  bindRows(body);
}

function bindRows(root) {
  $$('[data-open]', root).forEach(b => (b.onclick = () => openScholarship(b.dataset.open)));
  $$('[data-star]', root).forEach(b => (b.onclick = () => {
    const on = toggleShortlist(b.dataset.star);
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on);
    toast(on ? t('shortlisted') : t('unshortlisted'), on ? 'ok' : '');
  }));
  $$('[data-addapp]', root).forEach(b => (b.onclick = () => openNewApplication(b.dataset.addapp)));
  $$('[data-cmp]', root).forEach(cb => (cb.onchange = () => toggleCompare(cb.dataset.cmp, cb)));
}

function toggleCompare(id, cb) {
  let cmp = store.get('compare', []);
  if (cmp.includes(id)) cmp = cmp.filter(x => x !== id);
  else if (cmp.length >= 3) {
    if (cb) cb.checked = false;
    toast(t('compareMax'), 'bad');
    return;
  } else cmp.push(id);
  store.set('compare', cmp);
  const link = $('.pagehead a[href="#compare"]');
  if (link) link.innerHTML = `${ic('scale')} ${t('compareN', { n: cmp.length })}`;
}

// Human-readable list of the eligibility rules stored for a scholarship.
function eligibilityList(s) {
  const e = s.e || {};
  const out = [];
  if (e.prov) out.push(t('e_prov', { v: e.prov.map(p => tr(PROVINCES[p])).join(', ') }));
  if (e.lda) out.push(t('e_lda'));
  if (e.cgpa) out.push(t('e_cgpa', { v: e.cgpa }));
  if (e.pct) out.push(t('e_pct', { v: e.pct }));
  if (e.inc) out.push(t('e_inc', { v: fmtMoney(e.inc) }));
  if (e.age || e.ageMin || e.ageBy) out.push(t('e_age', { v: e.ageBy ? Object.entries(e.ageBy).map(([l, a]) => `${tr(LEVELS[l])} ≤ ${a}`).join(', ') : [e.ageMin ? '≥ ' + e.ageMin : '', e.age ? '≤ ' + e.age : ''].filter(Boolean).join(', ') }));
  if (e.work) out.push(t('e_work', { v: e.work }));
  if (e.eng) out.push(t('e_eng', { v: e.eng.toFixed(1) }));
  if (e.bond) out.push(t('e_bond'));
  if (e.gender) out.push(t('e_gender'));
  if (e.adm) out.push(t('e_adm'));
  if (e.quota) out.push(t('e_quota'));
  return out.length ? out : [t('e_none')];
}

function reasonList(m) {
  const icon = { pass: 'check-circle', fail: 'x', warn: 'alert', info: 'info' };
  return `<ul class="reasons">${m.reasons.map(r => `<li class="${r.st}">${ic(icon[r.st])}<span>${esc(r.text)}</span></li>`).join('')}</ul>`;
}

  return `<div class="stack">
    <div class="row">${s.lv.map(l => `<span class="chip navy">${esc(tr(LEVELS[l]))}</span>`).join('')}<span class="chip">${esc(countryName(s.c))}</span><span class="chip gold">${esc(tr(BASIS[s.b]))}</span></div>
    <p class="muted">${esc(tr(s.p))}</p>
    <div class="notice">${ic('alert')}<span>${t('verify')}</span></div>
    ${m ? `<section><h4 class="sub">${ic('target')} ${t('d_yourMatch')} · ${bdi(m.score + '%')}</h4>${reasonList(m)}</section>` : `<a class="btn ghost sm" href="#quiz">${ic('target')} ${t('takeQuiz')}</a>`}
    <section><h4 class="sub">${ic('list-checks')} ${t('d_eligibility')}</h4><ul class="plain">${eligibilityList(s).map(x => `<li>${esc(x)}</li>`).join('')}</ul></section>
    <section><h4 class="sub">${ic('wallet')} ${t('d_coverage')}</h4><div class="chips">${coverChips(s)}</div>
      <p class="small mt">${t('d_value')}: <b class="tnum">${fmtCompactPKR(s.v || 0)}</b> · ${t('d_duration')}: <b class="tnum">${s.d}</b> ${s.d === 1 ? t('year') : t('years')}</p></section>
    <section><h4 class="sub">${ic('calendar')} ${t('d_window')}</h4><p>${windowText(s)}${dl ? ` · ${t('col_deadline')}: <b class="tnum">${fmtDate(dl)}</b> (${relDays(daysUntil(dl))})` : ''}</p><p class="verify">${ic('info')} ${t('verify')}</p></section>
    <section><h4 class="sub">${ic('paperclip')} ${t('d_docs')}</h4><div class="chips">${docs.map(k => `<span class="chip">${ic(DOC_TYPES[k] ? DOC_TYPES[k].icon : 'file')} ${esc(tr(DOC_TYPES[k] ? DOC_TYPES[k].n : k))}</span>`).join('')}</div></section>
    ${s.note ? `<section><h4 class="sub">${ic('info')} ${t('d_note')}</h4><p>${esc(tr(s.note))}</p></section>` : ''}

  </div>`;

function openScholarship(id) {
  const s = schById(id);
  if (!s) return;
  const inPipe = apps().some(a => a.sch === id);
  const star = isShortlisted(id);
  const html = scholarshipDetailHtml(s) + `<div class="drawer-actions">
      <button class="btn" id="dApp" ${inPipe ? 'disabled' : ''}>${ic(inPipe ? 'check' : 'plus')} ${inPipe ? t('inPipeline') : t('addToPipeline')}</button>
      <button class="btn ghost" id="dStar" aria-pressed="${star}">${ic('star')} ${star ? t('shortlistRemove') : t('shortlistAdd')}</button>
      <button class="btn ghost" id="dCmp">${ic('scale')} ${t('col_compare')}</button></div>`;
  openDrawer(esc(tr(s.n)), html);
  $('#dApp').onclick = () => openNewApplication(id);
  $('#dStar').onclick = () => {
    const on = toggleShortlist(id);
    toast(on ? t('shortlisted') : t('unshortlisted'), on ? 'ok' : '');
    openScholarship(id);
  };
  $('#dCmp').onclick = () => {
    toggleCompare(id, null);
    closeModal(true);
    location.hash = '#compare';
  };
  $('#dEdit').onclick = () => openEditLink(id);
}

function openEditLink(id) {
  const s = schById(id);
  openModal(`<h3>${ic('link')} ${t('d_editLink')}</h3><p class="small muted">${esc(tr(s.n))}</p>
    <label class="field">${t('d_link')}<input type="url" id="elUrl" value="${esc(s.url || '')}" placeholder="https://"></label>
    <label class="field mt">${t('d_myNote')}<textarea id="elNote" rows="3">${esc(s.myNote || '')}</textarea></label>
    <div class="row mt"><span class="spacer"></span><button class="btn" id="elSave">${ic('save')} ${t('save')}</button></div>`);
  $('#elSave').onclick = () => {
    const url = $('#elUrl').value.trim();
    if (url && !/^https?:\/\//i.test(url)) {
      toast(t('d_badUrl'), 'bad');
      return;
    }
    editScholarship(id, { url, myNote: $('#elNote').value.trim() });
    toast(t('saved'), 'ok');
    closeModal(true);
    openScholarship(id);
  };
}

function openCustomScholarship() {
  const monthOpts = sel => Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}" ${sel === i + 1 ? 'selected' : ''}>${monthName(i)}</option>`).join('');
  const countryOpts = Object.entries(COUNTRIES).map(([k, v]) => `<option value="${k}">${esc(tr(v.n))}</option>`).join('');
  openModal(`<h3>${ic('plus')} ${t('cu_title')}</h3>
    <div class="grid2"><label class="field">${t('cu_name')}<input type="text" id="cuName"></label><label class="field">${t('cu_provider')}<input type="text" id="cuProv"></label>
    <label class="field">${t('col_country')}<select id="cuCountry">${countryOpts}</select></label><label class="field">${t('db_basis')}<select id="cuBasis">${Object.entries(BASIS).map(([k, v]) => `<option value="${k}">${esc(tr(v))}</option>`).join('')}</select></label>
    <label class="field">${t('cu_open')}<select id="cuOpen">${monthOpts(9)}</select></label><label class="field">${t('cu_close')}<select id="cuClose">${monthOpts(11)}</select></label>
    <label class="field">${t('cu_value')}<input type="number" id="cuValue" min="0" step="10000" value="0"></label><label class="field">${t('d_link')}<input type="url" id="cuUrl" placeholder="https://"></label></div>
    <div class="field mt"><span>${t('db_level')}</span><div class="chips">${Object.keys(LEVELS).map(l => `<label class="check"><input type="checkbox" name="cuLv" value="${l}" ${l === 'ms' ? 'checked' : ''}> ${esc(tr(LEVELS[l]))}</label>`).join('')}</div></div>
    <div class="field mt"><span>${t('d_coverage')}</span><div class="chips">${Object.keys(COVER).map(f => `<label class="check"><input type="checkbox" name="cuCov" value="${f}"> ${esc(tr(COVER[f]))}</label>`).join('')}</div></div>
    <div class="row mt"><span class="spacer"></span><button class="btn" id="cuSave">${ic('save')} ${t('save')}</button></div>`, { wide: true });
  $('#cuSave').onclick = saveCustomScholarship;
}

function saveCustomScholarship() {
  const name = $('#cuName').value.trim();
  if (!name) {
    toast(t('cu_required'), 'bad');
    return;
  }
  const lv = $$('input[name="cuLv"]:checked').map(x => x.value);
  const entry = {
    id: 'c-' + uid(), n: [name, name], p: [$('#cuProv').value.trim(), $('#cuProv').value.trim()], c: $('#cuCountry').value,
    lv: lv.length ? lv : ['ms'], f: ['any'], b: $('#cuBasis').value, w: [+$('#cuOpen').value, +$('#cuClose').value],
    cov: $$('input[name="cuCov"]:checked').map(x => x.value).join(''), v: +$('#cuValue').value || 0, d: 2, e: {}, docs: 'transcript degree cnic passport sop refs', url: $('#cuUrl').value.trim(),
  };
  store.set('customSch', [...store.get('customSch', []), entry]);
  logActivity('act_custom', { s: entry.id });
  toast(t('cu_saved'), 'ok');
  closeModal(true);
  route();
}

function exportScholarshipsCsv() {
  const matches = matchMap();
  const rows = sortScholarships(filterScholarships(matches), matches);
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const head = ['id', 'name', 'provider', 'country', 'levels', 'basis', 'coverage', 'typical_window', 'estimated_deadline', 'approx_value_pkr', 'match', 'official_site'];
  const lines = rows.map(s => [s.id, s.n[0], s.p ? s.p[0] : '', COUNTRIES[s.c] ? COUNTRIES[s.c].n[0] : s.c, s.lv.join('|'), s.b, s.cov, s.w ? s.w.join('-') : 'rolling', typicalDeadline(s), s.v || 0, matches[s.id] ? matches[s.id].score : '', s.url].map(q).join(','));
  downloadText('scholartrack-scholarships.csv', [head.join(','), ...lines].join('\r\n'), 'text/csv');
}

// ---------- compare (up to three side by side) ----------
function renderCompare(view) {
  const ids = store.get('compare', []).filter(id => schById(id));
  const list3 = ids.map(schById);
  const ms = profile() ? list3.map(s => matchScholarship(s, profile())) : [];
  const row = (label, fn) => `<tr><th scope="row">${label}</th>${list3.map((s, i) => `<td>${fn(s, i)}</td>`).join('')}</tr>`;
  const table = !list3.length ? `<div class="empty card">${ic('scale')}<p>${t('cmp_empty')}</p><a class="btn" href="#database">${ic('book')} ${t('cmp_add')}</a></div>` : `<div class="tablewrap"><table class="data compare">
      <thead><tr><th></th>${list3.map(s => `<th><button class="rowlink" data-open="${s.id}">${esc(tr(s.n))}</button><div><button class="linkbtn tiny noprint" data-uncmp="${s.id}">${t('cmp_remove')}</button></div></th>`).join('')}</tr></thead>
      <tbody>
      ${row(t('col_country'), s => esc(countryName(s.c)))}
      ${row(t('col_level'), s => esc(levelsText(s)))}
      ${row(t('db_field'), s => esc(s.f.map(f => tr(FIELDS[f])).join(', ')))}
      ${row(t('db_basis'), s => esc(tr(BASIS[s.b])))}
      ${row(t('d_coverage'), s => `<div class="chips">${coverChips(s)}</div>`)}
      ${row(t('d_value'), s => `<b class="tnum">${fmtCompactPKR(s.v || 0)}</b>`)}
      ${row(t('d_duration'), s => `<span class="tnum">${s.d}</span> ${s.d === 1 ? t('year') : t('years')}`)}
      ${row(t('col_window'), s => windowText(s))}
      ${row(t('col_deadline'), s => (typicalDeadline(s) ? `<span class="tnum">${fmtDate(typicalDeadline(s))}</span>` : '—'))}
      ${row(t('d_eligibility'), s => `<ul class="plain small">${eligibilityList(s).map(x => `<li>${esc(x)}</li>`).join('')}</ul>`)}
      ${row(t('d_docs'), s => `<span class="small">${String(s.docs || '').split(/\s+/).filter(Boolean).map(k => esc(tr(DOC_TYPES[k] ? DOC_TYPES[k].n : k))).join(', ')}</span>`)}
      ${profile() ? row(t('d_yourMatch'), (s, i) => `${matchCell(ms[i])}${reasonList(ms[i])}`) : ''}
      ${row(t('openSite'), s => (s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer" class="small">${esc(s.url.replace(/^https?:\/\//, ''))}</a>` : '—'))}
      </tbody></table></div><p class="verify mt">${ic('info')} ${t('verify')}</p>`;
  view.innerHTML = `<header class="pagehead"><div><div class="kicker">${ic('scale')} ${t('nav_compare')}</div><h1>${t('cmp_title')}</h1><p class="dek">${t('cmp_dek')}</p></div>
    <div class="actions"><a class="btn ghost" href="#database">${ic('arrow-left')} ${t('nav_database')}</a>${list3.length ? `<button class="btn ghost" onclick="window.print()">${ic('printer')} ${t('print')}</button>` : ''}</div></header>${table}`;
  $$('[data-open]', view).forEach(b => (b.onclick = () => openScholarship(b.dataset.open)));
  $$('[data-uncmp]', view).forEach(b => (b.onclick = () => {
    toggleCompare(b.dataset.uncmp, null);
    renderCompare(view);
    animateMetrics(view);
  }));
  animateMetrics(view);
}

const QUIZ_STEPS = 4;
let quizStep = 0;
let quizDraft = null;
let quizShowAll = false;

function quizDefaults() {
  return { name: '', level: 'ms', field: 'stem', dest: 'either', scoreType: 'cgpa', cgpa: 3.0, pct: 70, eng: 0, work: 0, prov: 'punjab', lda: 'no', age: 22, gender: 'skip', income: 60000, quota: [], bond: true, admission: false };
}

function radioCards(name, options, cur) {
  return `<div class="radiocards" role="radiogroup">${options.map(([v, label, icon]) => `<label class="rcard ${cur === v ? 'on' : ''}"><input type="radio" name="${name}" value="${v}" ${cur === v ? 'checked' : ''}>${icon ? ic(icon) : ''}<span>${label}</span></label>`).join('')}</div>`;
}

const segInput = (name, options, cur) => `<div class="seg" role="radiogroup">${options.map(([v, label]) => `<button type="button" data-seg="${name}" data-v="${v}" class="${String(cur) === String(v) ? 'on' : ''}" aria-pressed="${String(cur) === String(v)}">${label}</button>`).join('')}</div>`;

function quizStepHtml(d) {
  const levelIcons = { ug: 'book', ms: 'graduation', phd: 'flask', exch: 'shuffle', fellow: 'briefcase' };
  const yesNo = [[true, t('yes')], [false, t('no')]];
  const steps = [
    `<div class="field"><span>${t('qz_level')}</span>${radioCards('level', Object.keys(LEVELS).map(l => [l, esc(tr(LEVELS[l])), levelIcons[l]]), d.level)}</div>
     <div class="grid2 mt"><label class="field">${t('qz_field')}<select id="qzField">${Object.keys(FIELDS).filter(f => f !== 'any').map(f => `<option value="${f}" ${d.field === f ? 'selected' : ''}>${esc(tr(FIELDS[f]))}</option>`).join('')}</select></label>
     <div class="field"><span>${t('qz_dest')}</span>${segInput('dest', [['pk', t('db_pk')], ['abroad', t('db_abroad')], ['either', t('qz_either')]], d.dest)}</div></div>`,
    `<div class="field"><span>${t('qz_scoreType')}</span>${segInput('scoreType', [['cgpa', 'CGPA'], ['pct', t('qz_pct')]], d.scoreType)}</div>
     <div class="grid2 mt"><label class="field ${d.scoreType === 'cgpa' ? '' : 'hidden'}" id="qzCgpaWrap">${t('qz_cgpa')}<input type="number" id="qzCgpa" min="0" max="4" step="0.01" value="${d.cgpa}"></label>
     <label class="field ${d.scoreType === 'pct' ? '' : 'hidden'}" id="qzPctWrap">${t('qz_pct')}<input type="number" id="qzPct" min="0" max="100" step="1" value="${d.pct}"></label>
     <label class="field">${t('qz_eng')}<select id="qzEng"><option value="0">${t('qz_engNone')}</option>${[5, 5.5, 6, 6.5, 7, 7.5, 8, 8.5, 9].map(b => `<option value="${b}" ${+d.eng === b ? 'selected' : ''}>${b.toFixed(1)}</option>`).join('')}</select></label>
     <label class="field">${t('qz_work')}<input type="number" id="qzWork" min="0" max="40" step="0.5" value="${d.work}"></label></div>
     <p class="small muted mt">${ic('info')} ${t('qz_approx')}</p>`,
    `<div class="grid2"><label class="field">${t('qz_prov')}<select id="qzProv">${Object.keys(PROVINCES).map(p => `<option value="${p}" ${d.prov === p ? 'selected' : ''}>${esc(tr(PROVINCES[p]))}</option>`).join('')}</select></label>
     <label class="field">${t('qz_age')}<input type="number" id="qzAge" min="14" max="70" value="${d.age}"></label></div>
     <div class="field mt"><span>${t('qz_lda')}</span>${segInput('lda', [['yes', t('yes')], ['no', t('no')], ['unsure', t('qz_unsure')]], d.lda)}</div>
     <div class="field mt"><span>${t('qz_gender')}</span>${segInput('gender', [['female', t('qz_female')], ['male', t('qz_male')], ['skip', t('qz_skip')]], d.gender)}</div>`,
    `<label class="field">${t('qz_income')}<input type="number" id="qzIncome" min="0" step="1000" value="${d.income}"><span class="hint">${t('qz_incomeHint')}</span></label>
     <input type="range" id="qzIncomeR" min="0" max="400000" step="5000" value="${Math.min(400000, d.income)}" aria-label="${t('qz_income')}">
     <div class="field mt"><span>${t('qz_quota')}</span><div class="row"><label class="check"><input type="checkbox" name="qzQuota" value="minority" ${d.quota.includes('minority') ? 'checked' : ''}> ${t('qz_minority')}</label><label class="check"><input type="checkbox" name="qzQuota" value="disability" ${d.quota.includes('disability') ? 'checked' : ''}> ${t('qz_disability')}</label></div></div>
     <div class="grid2 mt"><div class="field"><span>${t('qz_bond')}</span>${segInput('bond', yesNo, d.bond)}</div><div class="field"><span>${t('qz_adm')}</span>${segInput('admission', yesNo, d.admission)}</div></div>
     <label class="field mt">${t('qz_name')}<input type="text" id="qzName" value="${esc(d.name || '')}" autocomplete="name"></label>`,
  ];

function renderQuizForm(view) {
  if (!quizDraft) quizDraft = { ...quizDefaults(), ...(profile() || {}) };
  const titles = ['qz_s1', 'qz_s2', 'qz_s3', 'qz_s4'];
  const p = Math.round(((quizStep + 1) / QUIZ_STEPS) * 100);
  view.innerHTML = `<header class="pagehead"><div><div class="kicker">${ic('target')} ${t('qz_kicker')}</div><h1>${t('qz_title')}</h1><p class="dek">${t('qz_dek')}</p></div></header>
    <div class="quiz card">
      <div class="between"><span class="tag">${t('qz_step', { n: quizStep + 1, t: QUIZ_STEPS })}</span><span class="small muted tnum">${p}%</span></div>
      <div class="bar navy mt"><i data-w="${p}"></i></div>
      <ol class="steps">${titles.map((k, i) => `<li class="${i === quizStep ? 'on' : i < quizStep ? 'done' : ''}">${i < quizStep ? ic('check') : `<b>${i + 1}</b>`}<span>${t(k)}</span></li>`).join('')}</ol>
      <h2 class="qtitle">${t(titles[quizStep])}</h2>
      <form id="quizForm" class="enter" novalidate>${quizStepHtml(quizDraft)}</form>
      <div class="between mt2"><button class="btn ghost" id="qzBack" ${quizStep === 0 ? 'disabled' : ''}>${ic('chevron-left')} ${t('back')}</button>
        <button class="btn ${quizStep === QUIZ_STEPS - 1 ? 'gold' : ''}" id="qzNext">${quizStep === QUIZ_STEPS - 1 ? `${ic('target')} ${t('qz_seeResults')}` : `${t('next')} ${ic('chevron-right')}`}</button></div>
    </div>`;
  bindQuizForm(view);
  animateMetrics(view);
}

function bindQuizForm(view) {
  $$('input[type="radio"]', view).forEach(r => (r.onchange = () => {
    quizDraft[r.name] = r.value;
    $$(`input[name="${r.name}"]`, view).forEach(x => x.closest('.rcard').classList.toggle('on', x.checked));
  }));
  $$('[data-seg]', view).forEach(b => (b.onclick = () => {
    const key = b.dataset.seg;
    const raw = b.dataset.v;
    quizDraft[key] = raw === 'true' ? true : raw === 'false' ? false : raw;
    $$(`[data-seg="${key}"]`, view).forEach(x => {
      x.classList.toggle('on', x === b);
      x.setAttribute('aria-pressed', x === b);
    });
    if (key === 'scoreType') {
      $('#qzCgpaWrap').classList.toggle('hidden', raw !== 'cgpa');
      $('#qzPctWrap').classList.toggle('hidden', raw !== 'pct');
    }
  }));
  const inc = $('#qzIncome');
  if (inc) {
    $('#qzIncomeR').oninput = e => (inc.value = e.target.value);
    inc.oninput = () => ($('#qzIncomeR').value = Math.min(400000, +inc.value || 0));
  }
  $('#quizForm').onsubmit = e => e.preventDefault();
  $('#qzBack').onclick = () => {
    readQuizStep();
    quizStep = Math.max(0, quizStep - 1);
    renderQuizForm(view);
  };
  $('#qzNext').onclick = () => {
    if (!readQuizStep()) return;
    if (quizStep < QUIZ_STEPS - 1) {
      quizStep++;
      renderQuizForm(view);
      $('#quizForm select, #quizForm input', view)?.focus();
      return;
    }
    finishQuiz();
  };
}

// Read the inputs of the current step into the draft; returns false if a value is out of range.
function readQuizStep() {
  const num = (id, lo, hi) => {
    const el = $(id);
    if (!el) return null;
    const v = +el.value;
    const bad = el.value === '' || Number.isNaN(v) || v < lo || v > hi;
    el.classList.toggle('invalid', bad);
    el.setAttribute('aria-invalid', bad);
    return bad ? NaN : v;
  };
  const d = quizDraft;
  const vals = [];
  if ($('#qzField')) d.field = $('#qzField').value;
  if ($('#qzCgpa')) {
    if (d.scoreType === 'cgpa') vals.push((d.cgpa = num('#qzCgpa', 0, 4)));
    else vals.push((d.pct = num('#qzPct', 0, 100)));
    d.eng = +$('#qzEng').value;
    vals.push((d.work = num('#qzWork', 0, 40)));
  }
  if ($('#qzProv')) {
    d.prov = $('#qzProv').value;
    vals.push((d.age = num('#qzAge', 14, 70)));
  }
  if ($('#qzIncome')) {
    vals.push((d.income = num('#qzIncome', 0, 1e8)));
    d.quota = $$('input[name="qzQuota"]:checked').map(x => x.value);
    d.name = $('#qzName').value.trim();
  }
  const ok = vals.every(v => !Number.isNaN(v));
  if (!ok) toast(t('qz_invalid'), 'bad');
  return ok;
}

function finishQuiz() {
  const d = { ...quizDraft };
  if (d.scoreType === 'cgpa') d.pct = cgpaToPct(d.cgpa);
  else d.cgpa = pctToCgpa(d.pct);
  delete d.demo;
  store.set('profile', d);
  logActivity('act_quiz');
  quizDraft = null;
  quizStep = 0;
  toast(t('qz_done'), 'ok');
  location.hash = '#quiz';
  route();
}

function scoreRing(score, eligible) {
  const r = 20;
  const c = 2 * Math.PI * r;
  const off = c * (1 - score / 100);
  const cls = eligible ? (score >= 75 ? 'green' : 'navy') : 'red';
  return `<svg class="ring ${cls}" viewBox="0 0 52 52" role="img" aria-label="${score}%"><circle cx="26" cy="26" r="${r}" class="track"/><circle cx="26" cy="26" r="${r}" class="val" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 26 26)"/><text x="26" y="30" text-anchor="middle">${score}</text></svg>`;
}

function matchCard(m) {
  const s = schById(m.id);
  const inPipe = apps().some(a => a.sch === m.id);
  const top = m.reasons.filter(r => r.st !== 'pass').concat(m.reasons.filter(r => r.st === 'pass')).slice(0, 3);
  return `<article class="mcard card lift ${m.eligible ? '' : 'inel'}">
    <div class="mhead">${scoreRing(m.score, m.eligible)}<div class="grow"><button class="rowlink" data-open="${s.id}">${esc(tr(s.n))}</button>
      <div class="tiny muted">${esc(countryName(s.c))} · ${windowText(s)} · ${esc(tr(BASIS[s.b]))}</div></div></div>
    ${reasonList({ reasons: top })}
    <details><summary class="small">${t('qz_allReasons')} (${m.reasons.length})</summary>${reasonList(m)}</details>
    <div class="row mt"><button class="btn sm ${inPipe ? 'ghost' : ''}" data-addapp="${s.id}" ${inPipe ? 'disabled' : ''}>${ic(inPipe ? 'check' : 'plus')} ${inPipe ? t('inPipeline') : t('addToPipeline')}</button>
      <button class="btn ghost sm icon star ${isShortlisted(s.id) ? 'on' : ''}" data-star="${s.id}" aria-label="${t('shortlistAdd')}">${ic('star')}</button></div>
  </article>`;
}

function scoreBands(ms) {
  const bands = [[0, 35], [36, 59], [60, 79], [80, 100]];
  const counts = bands.map(([lo, hi]) => ms.filter(m => m.score >= lo && m.score <= hi).length);
  const max = Math.max(1, ...counts);
  return `<div class="bands chart">${bands.map(([lo, hi], i) => `<div class="band"><div class="bcol"><i style="height:${Math.round((counts[i] / max) * 100)}%"></i></div><b class="tnum">${counts[i]}</b><span class="tiny muted tnum">${lo}–${hi}</span></div>`).join('')}</div>`;
}

function profileSummary(p) {
  const acad = p.scoreType === 'cgpa' ? `CGPA ${(+p.cgpa).toFixed(2)}` : `${p.pct}%`;
  const items = [tr(LEVELS[p.level]), tr(FIELDS[p.field]), tr(PROVINCES[p.prov]), acad, p.eng ? `IELTS ${(+p.eng).toFixed(1)}` : t('qz_engNone'), `${p.work} ${t('years')}`, fmtMoney(p.income) + ' / ' + t('perMonth')];
  return `<div class="chips">${items.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>`;
}

function renderQuizResults(view, p) {
  const ms = matchAll(p);
  const elig = ms.filter(m => m.eligible);
  const warn = elig.filter(m => m.warns).length;
  const shown = quizShowAll ? ms : elig;
  view.innerHTML = `<header class="pagehead"><div><div class="kicker">${ic('target')} ${t('qz_kicker')}</div><h1>${t('qz_resTitle')}${p.name ? ` — ${esc(p.name)}` : ''}</h1>
      <p class="dek">${t('qz_summary', { e: elig.length, w: warn, n: ms.length - elig.length })}</p></div>
      <div class="actions"><button class="btn ghost" id="qzEdit">${ic('edit')} ${t('qz_editAnswers')}</button><button class="btn ghost" id="qzRestart">${ic('refresh')} ${t('qz_retake')}</button></div></header>
    <div class="quiz-res">
      <aside class="stack"><div class="panel"><h3>${ic('user')} ${t('qz_profile')}</h3>${profileSummary(p)}</div>
        <div class="panel"><h3>${ic('bar-chart')} ${t('qz_bands')}</h3>${scoreBands(ms)}</div>
        <p class="verify">${ic('info')} ${t('verify')}</p></aside>
      <section><div class="between mb">${segInput('qzShow', [['elig', t('qz_showElig') + ` (${elig.length})`], ['all', t('qz_showAll') + ` (${ms.length})`]], quizShowAll ? 'all' : 'elig')}</div>
        <div class="mgrid stagger" aria-live="polite">${shown.map(matchCard).join('')}</div></section>
    </div>`;
  $('#qzEdit').onclick = () => {
    quizDraft = { ...quizDefaults(), ...p };
    quizStep = 0;
    location.hash = '#quiz/edit';
  };
  $('#qzRestart').onclick = () => {
    quizDraft = quizDefaults();
    quizStep = 0;
    location.hash = '#quiz/edit';
  };
  $$('[data-seg="qzShow"]', view).forEach(b => (b.onclick = () => {
    quizShowAll = b.dataset.v === 'all';
    renderQuizResults(view, p);
    animateIn(view);
  }));
  bindRows(view);
}

function renderQuiz(view, sub) {
  const p = profile();
  if (sub === 'edit' || !p) renderQuizForm(view);
  else renderQuizResults(view, p);
}

  const need = a.docs.filter(d => d.status !== 'na');

  return { done, total: need.length, pct: pct(done, need.length) };
};

const refRequestsFor = appId => referees().flatMap(r => r.requests.filter(q => q.app === appId).map(q => ({ ...q, referee: r })));

function kanbanCard(a) {
  const s = appSch(a);
  const dl = appDeadline(a);
  const n = daysUntil(dl);
  const dp = docProgress(a);
  const refs = refRequestsFor(a.id);
  const refsDone = refs.filter(q => q.status === 'submitted').length;
  const idx = STAGES.indexOf(a.stage);
  const name = esc(tr(s.n));
  const showDue = a.stage === 'eligible' || a.stage === 'documents';
  const due = showDue && dl ? `<span class="chip ${urgency(n)}">${ic('clock')} ${relDays(n)}</span>` : '';
  const iv = a.stage === 'interview' && a.interview ? `<span class="chip violet">${ic('mic')} ${fmtDate(a.interview)}</span>` : '';
  const oc = a.stage === 'result' ? `<span class="chip ${OUTCOME_CHIP[a.outcome]}">${t('oc_' + a.outcome)}</span>${a.outcome === 'awarded' && a.amount ? ` <span class="tiny tnum">${fmtCompactPKR(a.amount)}/${t('perYear')}</span>` : ''}` : '';
  const prev = STAGES[idx - 1];
  const next = STAGES[idx + 1];
  return `<article class="kcard pr-${a.priority}" draggable="true" data-id="${a.id}" tabindex="0" aria-label="${name}">
    <div class="between"><span class="chip">${ic(s.c === 'PK' ? 'home' : 'plane')} ${esc(countryName(s.c))}</span>${due}${iv}</div>
    <h4><a href="#app/${a.id}">${name}</a></h4>
    <div class="tiny muted">${t('pl_intake')} ${fmtIntake(a.intake)} · ${t('pl_deadline')} <span class="tnum">${dl ? fmtDate(dl) : '—'}</span>${a.demo ? ` · <span class="chip tiny">${t('demoBadge')}</span>` : ''}</div>
    ${oc ? `<div class="mt-s">${oc}</div>` : ''}
    <div class="kmeta"><span>${ic('paperclip')} ${t('pl_docs')} <b class="tnum">${dp.done}/${dp.total}</b></span>${refs.length ? `<span>${ic('quote')} ${t('pl_refs')} <b class="tnum">${refsDone}/${refs.length}</b></span>` : ''}</div>
    <div class="bar ${dp.pct === 100 ? 'green' : ''}"><i data-w="${dp.pct}"></i></div>
    <div class="kmove">
      <button class="btn ghost sm icon" data-move="${a.id}" data-to="${prev || ''}" ${prev ? '' : 'disabled'} aria-label="${prev ? t('pl_moveBack', { s: name, stage: t('st_' + prev) }) : t('back')}">${ic(document.dir === 'rtl' ? 'chevron-right' : 'chevron-left')}</button>
      <span class="grip" aria-hidden="true">${ic('grip')}</span>
      <button class="btn ghost sm icon" data-move="${a.id}" data-to="${next || ''}" ${next ? '' : 'disabled'} aria-label="${next ? t('pl_moveNext', { s: name, stage: t('st_' + next) }) : t('next')}">${ic(document.dir === 'rtl' ? 'chevron-left' : 'chevron-right')}</button>
    </div>
  </article>`;
}

function filteredApps() {
  const q = plFilter.q.trim().toLowerCase();
  return apps().filter(a => (!q || appName(a).toLowerCase().includes(q) || a.sch.includes(q)) && (!plFilter.pr || String(a.priority) === plFilter.pr));
}

function renderPipeline(view) {
  const all = apps();
  view.innerHTML = `<header class="pagehead"><div><div class="kicker">${ic('columns')} ${t('pl_kicker')}</div><h1>${t('pl_title')}</h1><p class="dek">${t('pl_dek')}</p></div>
      <div class="actions"><a class="btn ghost" href="#report">${ic('printer')} ${t('nav_report')}</a><button class="btn" id="plNew">${ic('plus')} ${t('pl_new')}</button></div></header>
    <div class="toolbar"><span class="inputicon grow">${ic('filter')}<input type="search" id="plQ" placeholder="${t('pl_filter')}" value="${esc(plFilter.q)}" aria-label="${t('pl_filter')}"></span>
      <select id="plPr" class="inline" aria-label="${t('na_priority')}"><option value="">${t('pl_allPr')}</option>${[1, 2, 3].map(p => `<option value="${p}" ${plFilter.pr === String(p) ? 'selected' : ''}>${t('pr_' + p)}</option>`).join('')}</select></div>
    <div class="seg stagetabs" id="plTabs">${STAGES.map(s => `<button data-tab="${s}" class="${plFilter.stage === s ? 'on' : ''}">${t('st_' + s)} <b class="tnum" data-tabn="${s}"></b></button>`).join('')}</div>
    ${all.length ? '' : `<div class="notice info mb">${ic('info')}<span>${t('pl_none')}</span></div>`}
    <div class="kanban" id="kanban">${STAGES.map(st => `<section class="kcol ${plFilter.stage === st ? 'on' : ''}" data-stage="${st}" aria-label="${t('st_' + st)}">
        <header>${ic(STAGE_ICON[st])}<h3>${t('st_' + st)}</h3><span class="count tnum" data-count-st="${st}"></span></header>
        <p class="tiny muted">${t('stl_' + st)}</p><div class="kcards" data-drop="${st}"></div></section>`).join('')}</div>`;
  drawKanban();
  $('#plNew').onclick = () => openNewApplication();
  $('#plQ').oninput = debounce(e => {
    plFilter.q = e.target.value;
    drawKanban();
  }, 120);
  $('#plPr').onchange = e => {
    plFilter.pr = e.target.value;
    drawKanban();
  };
  $$('#plTabs button').forEach(b => (b.onclick = () => {
    plFilter.stage = b.dataset.tab;
    $$('#plTabs button').forEach(x => x.classList.toggle('on', x === b));
    $$('.kcol').forEach(c => c.classList.toggle('on', c.dataset.stage === plFilter.stage));
  }));
  bindDropZones();
}

function drawKanban() {
  const rows = filteredApps();
  STAGES.forEach(st => {
    const inStage = rows.filter(a => a.stage === st).sort((a, b) => a.priority - b.priority || (appDeadline(a) || '9').localeCompare(appDeadline(b) || '9'));
    const zone = $(`[data-drop="${st}"]`);
    zone.innerHTML = inStage.length ? inStage.map(kanbanCard).join('') : `<div class="kempty">${t('pl_empty')}</div>`;
    zone.classList.add('stagger');
    [...zone.children].forEach((el, i) => el.style.setProperty('--i', i));
    $(`[data-count-st="${st}"]`).textContent = inStage.length;
    $(`[data-tabn="${st}"]`).textContent = inStage.length;
  });
  animateMetrics($('#kanban'));
  bindCards();
}

function bindCards() {
  $$('.kcard').forEach(card => {
    card.ondragstart = e => {
      e.dataTransfer.setData('text/plain', card.dataset.id);
      e.dataTransfer.effectAllowed = 'move';
      card.classList.add('dragging');
    };
    card.ondragend = () => card.classList.remove('dragging');
    card.onkeydown = e => {
      if (e.target !== card) return;
      if (e.key === 'Enter') location.hash = '#app/' + card.dataset.id;
      const dirKey = document.dir === 'rtl' ? { ArrowLeft: 1, ArrowRight: -1 } : { ArrowLeft: -1, ArrowRight: 1 };
      if (dirKey[e.key] && e.altKey) {
        const a = appById(card.dataset.id);
        const to = STAGES[STAGES.indexOf(a.stage) + dirKey[e.key]];
        if (to) moveApp(a.id, to);
      }
    };
  });
  $$('[data-move]').forEach(b => (b.onclick = () => b.dataset.to && moveApp(b.dataset.move, b.dataset.to)));
}

function bindDropZones() {
  $$('.kcol').forEach(col => {
    col.ondragover = e => {
      e.preventDefault();
      col.classList.add('over');
    };
    col.ondragleave = e => {
      if (!col.contains(e.relatedTarget)) col.classList.remove('over');
    };
    col.ondrop = e => {
      e.preventDefault();
      col.classList.remove('over');
      const id = e.dataTransfer.getData('text/plain');
      if (id) moveApp(id, col.dataset.stage);
    };
  });
}

// Change an application's stage; results ask for the outcome first.
function moveApp(id, stage, after = null) {
  const a = appById(id);
  if (!a || a.stage === stage) return;
  if (stage === 'result') {
    openOutcome(id, after);
    return;
  }
  mutateIn('apps', id, x => {
    x.stage = stage;
    x.timeline.push({ ts: Date.now(), stage });
    if (stage === 'submitted') x.docs.forEach(d => d.status === 'ready' && (d.status = 'submitted'));
    if (stage !== 'result') x.outcome = 'pending';
  });
  logActivity('act_move', { s: a.sch, stage });
  toast(t('pl_moved', { stage: t('st_' + stage) }), 'ok');
  announce(t('pl_moved', { stage: t('st_' + stage) }));
  refreshChrome();
  if (after) after();
  else if (currentRoute().page === 'pipeline') drawKanban();
}

function openOutcome(id, after = null) {
  const a = appById(id);
  const s = appSch(a);
  let outcome = a.outcome === 'pending' ? 'awarded' : a.outcome;
  openModal(`<h3>${ic('award')} ${t('oc_title')}</h3><p class="small muted">${esc(tr(s.n))}</p>
    <div class="seg" id="ocSeg">${OUTCOMES.map(o => `<button data-oc="${o}" class="${o === outcome ? 'on' : ''}">${t('oc_' + o)}</button>`).join('')}</div>
    <label class="field mt">${t('oc_amount')}<input type="number" id="ocAmount" min="0" step="10000" value="${a.amount || s.v || 0}"></label>
    <label class="field mt">${t('notes')}<textarea id="ocNote" rows="2"></textarea></label>
    <div class="row mt"><span class="spacer"></span><button class="btn" id="ocSave">${ic('save')} ${t('save')}</button></div>`);
  $$('#ocSeg button').forEach(b => (b.onclick = () => {
    outcome = b.dataset.oc;
    $$('#ocSeg button').forEach(x => x.classList.toggle('on', x === b));
  }));
  $('#ocSave').onclick = () => {
    const note = $('#ocNote').value.trim();
    mutateIn('apps', id, x => {
      if (x.stage !== 'result') x.timeline.push({ ts: Date.now(), stage: 'result' });
      x.stage = 'result';
      x.outcome = outcome;
      x.amount = outcome === 'awarded' ? Math.max(0, +$('#ocAmount').value || 0) : 0;
      if (note) x.notes.push({ id: uid(), ts: Date.now(), text: note });
    });
    logActivity('act_outcome', { s: a.sch, o: t('oc_' + outcome) });
    toast(t('oc_saved'), 'ok');
    closeModal(true);
    refreshChrome();
    if (after) after();
    else route();
  };
}

function schOptions(selected) {
  const inPipe = new Set(apps().map(a => a.sch));
  const group = (label, rows) => `<optgroup label="${esc(label)}">${rows.map(s => `<option value="${s.id}" ${s.id === selected ? 'selected' : ''} ${inPipe.has(s.id) ? 'disabled' : ''}>${esc(tr(s.n))}</option>`).join('')}</optgroup>`;
  const all = allScholarships().sort((a, b) => tr(a.n).localeCompare(tr(b.n)));
  return group(t('db_pk'), all.filter(s => s.c === 'PK')) + group(t('db_abroad'), all.filter(s => s.c !== 'PK'));
}

function openNewApplication(schId = '') {
  if (schId && apps().some(a => a.sch === schId)) {
    toast(t('na_exists'), 'bad');
    return;
  }
  const first = schId || (allScholarships().find(s => !apps().some(a => a.sch === s.id)) || {}).id;
  let priority = 2;
  openModal(`<h3>${ic('plus')} ${t('na_title')}</h3>
    <label class="field">${t('na_sch')}<select id="naSch">${schOptions(first)}</select></label>
    <div class="grid2 mt"><label class="field">${t('na_deadline')}<input type="date" id="naDeadline"><span class="hint verify">${ic('info')} ${t('pl_estimated')}</span></label>
    <label class="field">${t('na_intake')}<input type="month" id="naIntake" value="${TODAY.getFullYear() + 1}-09"></label></div>
    <div class="field mt"><span>${t('na_priority')}</span><div class="seg" id="naPr">${[1, 2, 3].map(p => `<button data-pr="${p}" class="${p === priority ? 'on' : ''}">${t('pr_short_' + p)}</button>`).join('')}</div></div>
    <div class="row mt"><span class="spacer"></span><button class="btn" id="naSave">${ic('save')} ${t('save')}</button></div>`);
  const syncDeadline = () => ($('#naDeadline').value = typicalDeadline(schById($('#naSch').value)) || '');
  syncDeadline();
  $('#naSch').onchange = syncDeadline;
  $$('#naPr button').forEach(b => (b.onclick = () => {
    priority = +b.dataset.pr;
    $$('#naPr button').forEach(x => x.classList.toggle('on', x === b));
  }));
  $('#naSave').onclick = () => createApplication($('#naSch').value, $('#naDeadline').value, $('#naIntake').value, priority);
}

function createApplication(schId, deadline, intake, priority) {
  const s = schById(schId);
  if (!s || apps().some(a => a.sch === schId)) {
    toast(t('na_exists'), 'bad');
    return null;
  }
  const vaultReady = vault().filter(d => d.status === 'ready').map(d => d.type);
  const app = {
    id: 'a-' + uid(), sch: schId, stage: 'eligible', outcome: 'pending', priority, deadline, interview: '', intake, amount: 0,
    created: Date.now(), docs: checklistFor(s, vaultReady), notes: [], timeline: [{ ts: Date.now(), stage: 'eligible' }],
  };
  saveList('apps', [...list('apps'), app]);
  logActivity('act_app', { s: schId });
  toast(t('na_created'), 'ok');
  closeModal(true);
  refreshChrome();
  location.hash = '#app/' + app.id;
  return app;
}

function stageStepper(a) {
  const idx = STAGES.indexOf(a.stage);
  const when = st => {
    const hit = [...a.timeline].reverse().find(x => x.stage === st);
    return hit ? fmtDate(new Date(hit.ts)) : '';
  };
  return `<ol class="stepper" aria-label="${t('ap_stepper')}">${STAGES.map((st, i) => `<li class="${i < idx ? 'done' : i === idx ? 'on' : ''}">
      <button data-stage="${st}" aria-current="${i === idx ? 'step' : 'false'}">${i < idx ? ic('check') : ic(STAGE_ICON[st])}</button>
      <span>${t('st_' + st)}</span><span class="tiny muted tnum">${when(st)}</span></li>`).join('')}</ol>`;
}

function appKpis(a) {
  const dl = appDeadline(a);
  const n = daysUntil(dl);
  const dp = docProgress(a);
  const words = sum(essays().filter(e => e.app === a.id).map(e => countWords(e.text)));
  const refs = refRequestsFor(a.id);
  const kpi = (k, icon, v, s = '', count = true, fmt = '') => `<div class="kpi"><div class="k">${ic(icon)} ${t(k)}</div><div class="v" ${count ? `data-count="${v}"` : ''} ${fmt ? `data-fmt="${fmt}"` : ''}>${count ? 0 : v}</div><div class="s">${s}</div></div>`;
  return `<div class="kpis stagger">
    ${kpi('ap_daysLeft', 'clock', n == null ? '—' : n < 0 ? 0 : n, dl ? fmtDate(dl) : '', n != null)}
    ${kpi('ap_docsReady', 'paperclip', dp.pct, `${dp.done}/${dp.total}`, true, 'pct')}
    ${kpi('ap_words', 'feather', words)}
    ${kpi('ap_letters', 'quote', refs.filter(q => q.status === 'submitted').length, `/ ${refs.length}`)}
  </div>`;
}

function overviewTab(a) {
  const s = appSch(a);

  return `${appKpis(a)}
    <div class="grid2 mt2"><div class="panel"><h3>${ic('calendar')} ${t('ap_dates')}</h3>
      <label class="field">${t('na_deadline')}<input type="date" id="apDeadline" value="${esc(a.deadline || '')}"></label>
      <div class="row tiny"><span class="verify">${ic('info')} ${t('verify')}</span><button class="linkbtn tiny" id="apResetDl">${t('ap_resetDl')}</button></div>
      <label class="field mt">${t('ap_interview')}<input type="date" id="apInterview" value="${esc(a.interview || '')}"></label>

function renderApp(view, id, tab = 'overview') {
  const a = appById(id);
  if (!a) {
    view.innerHTML = `<div class="empty card">${ic('alert')}<p>${t('ap_notFound')}</p><a class="btn" href="#pipeline">${t('nav_pipeline')}</a></div>`;
    return;
  }
  if (!APP_TABS.includes(tab)) tab = 'overview';
  const s = appSch(a);
  const site = s.url ? `<a class="btn ghost" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${ic('external')} ${t('openSite')}</a>` : '';
  const body = { overview: overviewTab, docs: checklistHtml, essays: essaysTab, refs: refsTab, timeline: timelineTab }[tab](a);
  view.innerHTML = `<header class="pagehead"><div><div class="kicker">${ic(s.c === 'PK' ? 'home' : 'plane')} ${esc(countryName(s.c))} · ${esc(levelsText(s))}</div>
      <h1>${esc(tr(s.n))}</h1><p class="dek">${esc(tr(s.p))}</p></div>
      <div class="actions"><a class="btn ghost" href="#pipeline">${ic('arrow-left')} ${t('nav_pipeline')}</a>${site}<button class="btn danger" id="apDelete">${ic('trash')} ${t('del')}</button></div></header>
    ${stageStepper(a)}
    <nav class="tabs" role="tablist">${APP_TABS.map(k => `<a role="tab" href="#app/${a.id}/${k}" class="${k === tab ? 'on' : ''}" aria-selected="${k === tab}">${t('ap_' + k)}</a>`).join('')}</nav>
    <div class="tabbody" id="apBody">${body}</div>`;
  bindApp(a, view, tab);
  animateMetrics(view);
}

function bindApp(a, view, tab) {
  $$('.stepper [data-stage]', view).forEach(b => (b.onclick = () => moveApp(a.id, b.dataset.stage, () => renderApp(view, a.id, tab))));
  $('#apDelete').onclick = () => confirmBox(t('ap_deleteQ'), () => {
    removeFrom('apps', a.id);
    referees().forEach(r => mutateIn('referees', r.id, x => (x.requests = x.requests.filter(q => q.app !== a.id))));
    toast(t('deleted'), 'ok');
    refreshChrome();
    location.hash = '#pipeline';
  });
  if (tab === 'overview') bindOverview(a, view);
  if (tab === 'docs') bindChecklist(view, () => renderApp(view, a.id, 'docs'));
  if (tab === 'essays') $('#apNewEssay').onclick = () => openNewEssay(a.id);
  if (tab === 'refs') {
    $('#apReqLetter').onclick = () => openLetterRequest(null, a.id, () => renderApp(view, a.id, 'refs'));
    bindRefRows(view, () => renderApp(view, a.id, 'refs'));
  }
  if (tab === 'timeline') bindTimeline(a, view);
}

function bindTimeline(a, view) {
  $('#noteForm').onsubmit = e => {
    e.preventDefault();
    const text = $('#noteText').value.trim();
    if (!text) return;
    mutateIn('apps', a.id, x => x.notes.push({ id: uid(), ts: Date.now(), text }));
    logActivity('act_note', { s: a.sch });
    renderApp(view, a.id, 'timeline');
    $('#noteText').focus();
  };
  $$('[data-delnote]', view).forEach(b => (b.onclick = () => {
    mutateIn('apps', a.id, x => (x.notes = x.notes.filter(n => n.id !== b.dataset.delnote)));
    renderApp(view, a.id, 'timeline');
  }));
}

const vaultFor = type => vault().filter(d => d.type === type).sort((a, b) => (b.expiry || '9999').localeCompare(a.expiry || '9999'))[0];

function expiryChip(expiry) {
  const n = daysUntil(expiry);
  if (n == null) return `<span class="chip">${t('dc_noExpiry')}</span>`;
  if (n < 0) return `<span class="chip red">${ic('alert-circle')} ${t('dc_expired')}</span>`;
  if (n <= settings().expiryDays) return `<span class="chip amber">${ic('timer')} ${t('dc_expiring', { when: relDays(n) })}</span>`;
  return `<span class="chip green">${t('dc_valid')} · <span class="tnum">${fmtDate(expiry)}</span></span>`;
}

// Warnings for a checklist item based on the linked vault document.
function docWarnings(a, v) {
  if (!v || !v.expiry) return [];
  const out = [];
  const dl = appDeadline(a);
  if (dl && v.expiry < dl) out.push(t('dc_expBeforeDl'));
  const intake = intakeDate(a);
  if (intake && ['passport', 'ielts', 'cnic'].includes(v.type) && parseISO(v.expiry) < addDays(intake, 182)) out.push(t('dc_expBeforeIntake'));
  return out;
}

function checklistRow(a, d, i) {
  const type = DOC_TYPES[d.key] || { n: [d.key, d.key], icon: 'file' };
  const v = vaultFor(d.key);
  const warns = docWarnings(a, v);
  const opts = DOC_STATUS.map(s => `<option value="${s}" ${d.status === s ? 'selected' : ''}>${t('ds_' + s)}</option>`).join('');
  return `<li class="docrow st-${d.status}">
    <span class="docic">${ic(type.icon)}</span>
    <div class="grow"><div class="docname">${esc(tr(type.n))}</div>
      <div class="tiny muted">${v ? `${t('dc_linked', { s: esc(v.title) })} · ${expiryChip(v.expiry)}` : t('dc_notInVault')}</div>
      ${warns.map(w => `<div class="tiny warnline">${ic('alert')} ${esc(w)}</div>`).join('')}
      <input type="text" class="docnote" data-note="${i}" value="${esc(d.note || '')}" placeholder="${t('dc_note')}" aria-label="${t('dc_note')}"></div>
    <select data-st="${i}" class="inline st-${d.status}" aria-label="${t('status')}: ${esc(tr(type.n))}">${opts}</select>
    <button class="btn ghost sm icon" data-rmdoc="${i}" aria-label="${t('del')}">${ic('x')}</button>
  </li>`;
}

function checklistHtml(a) {
  const dp = docProgress(a);
  const missingTypes = Object.keys(DOC_TYPES).filter(k => !a.docs.some(d => d.key === k));
  return `<div class="checklist" data-app="${a.id}">
    <div class="clhead"><div class="grow"><div class="small"><b>${t('dc_progress', { d: dp.done, t: dp.total })}</b></div><div class="bar ${dp.pct === 100 ? 'green' : ''}"><i data-w="${dp.pct}"></i></div></div>
      <div class="row"><select class="inline" data-addtype aria-label="${t('dc_addItem')}">${missingTypes.map(k => `<option value="${k}">${esc(tr(DOC_TYPES[k].n))}</option>`).join('')}</select><button class="btn ghost sm" data-additem>${ic('plus')} ${t('add')}</button></div></div>
    <ul class="doclist">${a.docs.map((d, i) => checklistRow(a, d, i)).join('')}</ul></div>`;
}

function bindChecklist(root, rerender) {
  $$('.checklist', root).forEach(box => {
    const id = box.dataset.app;
    const a = appById(id);
    $$('[data-st]', box).forEach(sel => (sel.onchange = () => {
      mutateIn('apps', id, x => (x.docs[+sel.dataset.st].status = sel.value));
      logActivity('act_doc', { s: a.sch });
      refreshChrome();
      rerender();
    }));
    $$('[data-note]', box).forEach(inp => (inp.onchange = () => mutateIn('apps', id, x => (x.docs[+inp.dataset.note].note = inp.value.trim()))));
    $$('[data-rmdoc]', box).forEach(b => (b.onclick = () => {
      mutateIn('apps', id, x => x.docs.splice(+b.dataset.rmdoc, 1));
      rerender();
    }));
    const add = $('[data-additem]', box);
    if (add) add.onclick = () => {
      const key = $('[data-addtype]', box).value;
      if (!key) return;
      const v = vaultFor(key);
      mutateIn('apps', id, x => x.docs.push({ key, status: v && v.status === 'ready' ? 'ready' : 'missing', note: '' }));
      rerender();
    };
  });
}

function docKpis() {
  const active = apps().filter(a => a.stage !== 'result');
  const expSoon = vault().filter(d => d.expiry && daysUntil(d.expiry) <= settings().expiryDays).length;
  const missing = sum(active.map(a => a.docs.filter(d => d.status === 'missing').length));
  const complete = active.filter(a => docProgress(a).pct === 100).length;
  const kpi = (k, icon, v, s = '') => `<div class="kpi"><div class="k">${ic(icon)} ${t(k)}</div><div class="v" data-count="${v}">0</div><div class="s">${s}</div></div>`;
  return `<div class="kpis stagger">${kpi('dc_inVault', 'folder', vault().length)}${kpi('dc_expSoon', 'timer', expSoon)}${kpi('dc_missing', 'alert', missing)}${kpi('dc_complete', 'check-circle', complete, `/ ${active.length}`)}</div>`;
}

// Applications still being prepared come first; the open/closed state of each card survives re-renders.
let openChecklists = null;

function checklistsTab() {
  const preparing = a => ['eligible', 'documents'].includes(a.stage);
  const active = apps().filter(a => a.stage !== 'result').sort((a, b) => preparing(b) - preparing(a) || (appDeadline(a) || '9').localeCompare(appDeadline(b) || '9'));
  if (!active.length) return `<div class="empty">${ic('paperclip')}${t('dc_noActive')}</div>`;
  if (!openChecklists) openChecklists = new Set(active.slice(0, 2).map(a => a.id));
  return `<div class="between mb"><span></span><button class="btn ghost sm" onclick="window.print()">${ic('printer')} ${t('dc_printList')}</button></div>
    <div class="stack">${active.map(a => {
      const dp = docProgress(a);
      const n = daysUntil(appDeadline(a));
      const tag = preparing(a) ? `<span class="chip ${urgency(n)}">${relDays(n)}</span>` : `<span class="chip navy">${t('st_' + a.stage)}</span>`;
      return `<details class="card flat acc" data-acc="${a.id}" ${openChecklists.has(a.id) ? 'open' : ''}><summary><span class="grow"><b>${esc(appName(a))}</b> ${tag}</span><span class="tnum small">${dp.done}/${dp.total}</span></summary>${checklistHtml(a)}</details>`;
    }).join('')}</div>`;
}

  const rows = [...vault()].sort(vaultSort === 'expiry' ? (a, b) => (a.expiry || '9999').localeCompare(b.expiry || '9999') : (a, b) => a.type.localeCompare(b.type));
  return `<div class="between mb"><p class="small muted">${ic('lock')} ${t('dc_privacy')}</p>
      <div class="row"><select id="vSort" class="inline" aria-label="${t('db_sort')}"><option value="expiry" ${vaultSort === 'expiry' ? 'selected' : ''}>${t('dc_sortExpiry')}</option><option value="type" ${vaultSort === 'type' ? 'selected' : ''}>${t('dc_sortType')}</option></select>
      <button class="btn" id="vAdd">${ic('plus')} ${t('dc_addDoc')}</button></div></div>
    <div class="tablewrap"><table class="data vault"><thead><tr><th>${t('title')}</th><th>${t('status')}</th><th>${t('dc_issued')}</th><th>${t('dc_expiry')}</th><th>${t('dc_attShort')}</th><th>${t('dc_usedBy')}</th><th><span class="sr-only">${t('edit')}</span></th></tr></thead>
    <tbody class="stagger">${rows.map(d => `<tr>
      <td class="c-name"><span class="row nowrap">${ic(DOC_TYPES[d.type].icon)} <b>${esc(d.title)}</b></span><div class="tiny muted">${esc(tr(DOC_TYPES[d.type].n))} · ${esc(d.location || '')}</div></td>
      <td data-label="${t('status')}"><span class="chip ${DOC_CHIP[d.status]}">${t('ds_' + d.status)}</span></td>
      <td data-label="${t('dc_issued')}" class="tnum small">${d.issued ? fmtDate(d.issued) : '—'}</td>
      <td data-label="${t('dc_expiry')}">${expiryChip(d.expiry)}</td>
      <td data-label="${t('dc_attShort')}">${d.attested ? ic('check-circle', 'ok') : '—'}</td>
      <td data-label="${t('dc_usedBy')}" class="small nowrap-t">${usedBy(d.type) === 1 ? t('dc_app1') : t('dc_apps', { n: usedBy(d.type) })}</td>
      <td class="c-act"><button class="btn ghost sm icon" data-vedit="${d.id}" aria-label="${t('edit')}">${ic('edit')}</button><button class="btn ghost sm icon" data-vdel="${d.id}" aria-label="${t('del')}">${ic('trash')}</button></td>
    </tr>`).join('')}</tbody></table></div>`;

function remindersTab() {
  const docKinds = ['expiring', 'expired', 'intake', 'docs'];
  const rows = reminders().filter(r => docKinds.includes(r.kind));
  return `<label class="field narrow">${t('dc_leadDays')}<input type="number" id="leadDays" min="7" max="180" value="${settings().expiryDays}"></label>

}

const remRow = r => `<li class="rem ${r.kind}"><span class="remic">${ic(REMIND_ICON[r.kind] || 'bell')}</span><a href="${r.link}">${esc(tr(r.text))}</a></li>`;

function renderDocuments(view, tab = 'checklists') {
  if (!['checklists', 'vault', 'reminders'].includes(tab)) tab = 'checklists';
  const body = { checklists: checklistsTab, vault: vaultTab, reminders: remindersTab }[tab]();
  view.innerHTML = `<header class="pagehead"><div><div class="kicker">${ic('paperclip')} ${t('dc_kicker')}</div><h1>${t('dc_title')}</h1><p class="dek">${t('dc_dek')}</p></div></header>
    ${docKpis()}
    <nav class="tabs mt2" role="tablist">${['checklists', 'vault', 'reminders'].map(k => `<a role="tab" href="#documents/${k}" class="${k === tab ? 'on' : ''}" aria-selected="${k === tab}">${t('dc_' + k)}</a>`).join('')}</nav>
    <div class="tabbody">${body}</div>`;
  const rerender = () => {
    renderDocuments(view, tab);
    animateMetrics(view);
  };
  if (tab === 'checklists') {
    bindChecklist(view, rerender);
    $$('[data-acc]', view).forEach(d => (d.ontoggle = () => (d.open ? openChecklists.add(d.dataset.acc) : openChecklists.delete(d.dataset.acc))));
  }
  if (tab === 'vault') bindVault(view, rerender);
  if (tab === 'reminders') $('#leadDays').onchange = e => {
    setSetting('expiryDays', clamp(+e.target.value || 60, 7, 180));
    rerender();
  };

function bindVault(view, rerender) {
  $('#vAdd').onclick = () => openVaultDoc(null, rerender);
  $('#vSort').onchange = e => {
    vaultSort = e.target.value;
    rerender();
  };
  $$('[data-vedit]', view).forEach(b => (b.onclick = () => openVaultDoc(b.dataset.vedit, rerender)));
  $$('[data-vdel]', view).forEach(b => (b.onclick = () => confirmBox(t('dc_deleteQ'), () => {
    removeFrom('vault', b.dataset.vdel);
    toast(t('deleted'), 'ok');
    rerender();
  })));
}

function openVaultDoc(id, after) {
  // TODO(student): read expiry dates with OCR — add a "Scan" button that lazy-loads Tesseract.js (pinned version,
  //   offline fallback), reads a photo of a passport, CNIC or IELTS report on the device only, extracts dates with
  //   regular expressions (DD MMM YYYY, DD/MM/YYYY) and pre-fills #vdIssued / #vdExpiry for the user to confirm.
  const d = id ? list('vault').find(x => x.id === id) : { type: 'transcript', title: '', issued: iso(TODAY), expiry: '', location: '', attested: false, status: 'ready', note: '' };
  const typeOpts = Object.keys(DOC_TYPES).map(k => `<option value="${k}" ${d.type === k ? 'selected' : ''}>${esc(tr(DOC_TYPES[k].n))}</option>`).join('');
  openModal(`<h3>${ic('folder')} ${id ? t('dc_editDoc') : t('dc_addDoc')}</h3>
    <div class="grid2"><label class="field">${t('dc_type')}<select id="vdType">${typeOpts}</select></label><label class="field">${t('dc_title2')}<input type="text" id="vdTitle" value="${esc(d.title)}"></label>
    <label class="field">${t('dc_issued')}<input type="date" id="vdIssued" value="${esc(d.issued || '')}"></label><label class="field">${t('dc_expiry')}<input type="date" id="vdExpiry" value="${esc(d.expiry || '')}"></label></div>
    <button class="linkbtn tiny" id="vdSuggest"></button>
    <label class="field mt">${t('dc_location')}<input type="text" id="vdLoc" value="${esc(d.location || '')}" placeholder="${t('dc_locationPh')}"></label>
    <div class="grid2 mt"><label class="field">${t('status')}<select id="vdStatus">${['ready', 'progress', 'missing'].map(s => `<option value="${s}" ${d.status === s ? 'selected' : ''}>${t('ds_' + s)}</option>`).join('')}</select></label>
    <label class="check" style="align-self:end"><input type="checkbox" id="vdAtt" ${d.attested ? 'checked' : ''}> ${t('dc_attested')}</label></div>
    <label class="field mt">${t('notes')}<textarea id="vdNote" rows="2">${esc(d.note || '')}</textarea></label>
    <div class="row mt"><span class="spacer"></span><button class="btn" id="vdSave">${ic('save')} ${t('save')}</button></div>`);
  const syncSuggest = () => {
    const m = DOC_TYPES[$('#vdType').value].valid;
    $('#vdSuggest').textContent = m ? t('dc_suggest', { m }) : t('dc_noExpiry');
    $('#vdSuggest').disabled = !m;
  };
  syncSuggest();
  $('#vdType').onchange = syncSuggest;
  $('#vdSuggest').onclick = () => {
    const m = DOC_TYPES[$('#vdType').value].valid;
    const base = parseISO($('#vdIssued').value) || TODAY;
    const e = new Date(base);
    e.setMonth(e.getMonth() + m);
    $('#vdExpiry').value = iso(e);
  };
  $('#vdSave').onclick = () => saveVaultDoc(id, after);
}

function saveVaultDoc(id, after) {
  const type = $('#vdType').value;
  const rec = {
    type, title: $('#vdTitle').value.trim() || tr(DOC_TYPES[type].n), issued: $('#vdIssued').value, expiry: $('#vdExpiry').value,
    location: $('#vdLoc').value.trim(), attested: $('#vdAtt').checked, status: $('#vdStatus').value, note: $('#vdNote').value.trim(),
  };
  if (id) mutateIn('vault', id, x => Object.assign(x, rec));
  else saveList('vault', [...list('vault'), { id: 'v-' + uid(), ...rec }]);
  logActivity('act_vault', { d: rec.title });
  let n = 0;
  if (rec.status === 'ready') {
    const all = list('apps');
    all.filter(a => a.stage !== 'result').forEach(a => a.docs.forEach(d => {
      if (d.key === type && d.status === 'missing') {
        d.status = 'ready';
        n++;
      }
    }));
    saveList('apps', all);
  }
  toast(n ? t('dc_markedReady', { n }) : t('saved'), 'ok');
  closeModal(true);
  refreshChrome();
  after();
}
