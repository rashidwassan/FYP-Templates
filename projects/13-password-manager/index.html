function paletteResults(query) {
  const q = query.trim().toLowerCase();
  const actions = paletteActions().filter(a => !q || a.label.toLowerCase().includes(q));
  const items = entries().filter(e => {
    if (!q) return false;
    return [e.title, e.username, e.url, ...(e.tags || [])].some(v => (v || '').toLowerCase().includes(q));
  }).slice(0, 8);
  const results = [];
  items.forEach(e => results.push({ kind: 'item', icon: TYPES[e.type].icon, label: e.title, sub: e.username || host(e.url || '') || TYPES[e.type].label, run: () => { location.hash = 'all/' + e.id; } }));
  actions.forEach(a => results.push({ kind: 'action', ...a, sub: 'Action' }));
  if (!q) {
    entries().slice().sort((a, b) => b.updated - a.updated).slice(0, 5).forEach(e => results.push({ kind: 'item', icon: TYPES[e.type].icon, label: e.title, sub: 'Recent', run: () => { location.hash = 'all/' + e.id; } }));
  }
  return results;
}

function openPalette() {
  if (!session.key) return;
  openModal(`<div class="search"><span class="sr">Quick open</span>${ic('search')}<input id="palQ" type="search" placeholder="Type an item name, tag or action…" autocomplete="off" aria-label="Quick open"></div><div class="pal-results" id="palList" role="listbox"></div>`, { cls: 'palette' });
  let active = 0;
  let results = [];
  const render = () => {
    results = paletteResults($('#palQ').value);
    active = clamp(active, 0, Math.max(0, results.length - 1));
    const list = $('#palList');
    if (!results.length) {
      list.innerHTML = '<div class="empty-inline">No matches</div>';
      return;
    }
    let lastKind = '';
    list.innerHTML = results.map((r, i) => {
      const group = r.kind !== lastKind ? `<div class="pal-group">${r.kind === 'item' ? 'Items' : 'Actions'}</div>` : '';
      lastKind = r.kind;
      return `${group}<button class="pal-item ${i === active ? 'active' : ''}" data-i="${i}" role="option">${ic(r.icon)} <span>${esc(r.label)}</span><span class="sub">${esc(r.sub)}</span></button>`;
    }).join('');
    $$('.pal-item', list).forEach(b => {
      b.onclick = () => choose(+b.dataset.i);
    });
  };
  const choose = i => {
    const r = results[i];
    if (!r) return;
    modalClose = null;
    closeModal();
    r.run();
  };
  $('#palQ').addEventListener('input', () => { active = 0; render(); });
  $('#palQ').addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(results.length - 1, active + 1); render(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(0, active - 1); render(); }
    if (e.key === 'Enter') { e.preventDefault(); choose(active); }
  });
  render();
}

function openShortcuts() {
  const rows = SHORTCUTS.map(([keys, what]) => `<span>${esc(what)}</span><span>${keys.split(' then ').map(k => k.split(' / ').map(x => `<kbd>${esc(x)}</kbd>`).join(' / ')).join(' then ')}</span>`).join('');
  openModal(`${modalHead('Keyboard shortcuts', 'help')}<div class="shortcuts">${rows}</div><p class="small muted" style="margin:14px 0 0">Shortcuts are ignored while you type in a field. Ctrl K works everywhere once the vault is unlocked.</p>`);
}

let chordKey = '';
let chordTimer = null;

function handleGlobalKeys(e) {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    if (session.key) openPalette();
    return;
  }
  if (e.key === 'Escape') {
    if ($('#modal').classList.contains('open')) closeModal();
    else if (tourIndex >= 0) finishTour();
    else document.body.classList.remove('rail-open');
    return;
  }
  if (typing || !session.key || e.ctrlKey || e.metaKey || e.altKey) return;
  const key = e.key.toLowerCase();
  if (chordKey === 'g') {
    chordKey = '';
    const routes = { h: 'health', g: 'generator', i: 'inbox', s: 'settings' };
    if (routes[key]) location.hash = routes[key];
    return;
  }
  if (key === 'g') {
    chordKey = 'g';
    clearTimeout(chordTimer);
    chordTimer = setTimeout(() => { chordKey = ''; }, 1200);
  } else if (key === 'n' && document.body.dataset.page === 'vault') {
    openEditor(null);
  } else if (key === '/') {
    e.preventDefault();
    $('#q').focus();
  } else if (key === 'l') {
    lock('Locked');
  } else if (e.key === '?') {
    openShortcuts();
  }
}

document.addEventListener('keydown', handleGlobalKeys);

// ---------- rail / list ----------
const PAGES = {
  health: ['activity', 'Health'], generator: ['dice', 'Generator'], inbox: ['bell', 'Inbox'], trash: ['trash', 'Trash'],
  lab: ['cpu', 'Crypto lab'], reports: ['printer', 'Reports'], settings: ['settings', 'Settings'], about: ['info', 'About']
};
const VAULT_VIEWS = ['all', 'fav', 'tag', 'type'];

function viewBase() {
  if (state.view === 'tag') return 'tag/' + encodeURIComponent(state.tag);
  if (state.view === 'type') return 'type/' + state.type;
  return state.view;
}

function viewTitle() {
  if (state.view === 'fav') return 'Favourites';
  if (state.view === 'tag') return '#' + state.tag;
  if (state.view === 'type') return TYPES[state.type].plural;
  if (PAGES[state.view]) return PAGES[state.view][1];
  return 'All items';
}

function allTags() {
  const counts = new Map();
  entries().forEach(e => (e.tags || []).forEach(t => counts.set(t, (counts.get(t) || 0) + 1)));
  return [...counts.entries()].sort((a, b) => a[0].localeCompare(b[0]));
}

function railLink(href, icon, label, count, active, extra = '') {
  const n = count === '' ? '' : `<span class="n">${count}</span>`;
  return `<a href="#${href}" class="${active ? 'active' : ''}">${ic(icon)} ${label}${extra}${n}</a>`;
}

function renderRail() {
  const es = entries();
  const isView = (view, value) => state.view === view && (view !== 'tag' || state.tag === value) && (view !== 'type' || state.type === value);
  const typeLinks = Object.entries(TYPES).map(([key, t]) => railLink('type/' + key, t.icon, t.plural, es.filter(e => e.type === key).length, isView('type', key))).join('');
  const tagLinks = allTags().map(([tag, n]) => railLink('tag/' + encodeURIComponent(tag), 'tag', esc(tag), n, isView('tag', tag))).join('');
  const unread = unreadCount();
  const toolLinks = Object.entries(PAGES).map(([key, [icon, label]]) => {
    let count = '';
    let extra = '';
    if (key === 'health') count = healthReport().score;
    if (key === 'trash') count = trash().length;
    if (key === 'inbox' && unread) extra = `<span class="badge">${unread}</span>`;
    return railLink(key, icon, label, count, state.view === key, extra);
  }).join('');
  $('#railNav').innerHTML = `${railLink('all', 'layers', 'All items', es.length, isView('all'))}${railLink('fav', 'star', 'Favourites', es.filter(e => e.fav).length, isView('fav'))}
    <h4>Types</h4>${typeLinks}
    <h4>Tags</h4>${tagLinks || '<div class="small dim" style="padding:0 10px">No tags yet</div>'}
    <h4>Tools</h4>${toolLinks}`;
  $('#mbTitle').textContent = viewTitle();
  updateInboxBadges();
}

function entrySubtitle(e) {
  if (e.type === 'card') return `${cardBrand(e.extra.number)} •••• ${(e.extra.number || '').replace(/\D/g, '').slice(-4)}`;
  if (e.type === 'note') return (e.notes || '').split('\n')[0] || 'Secure note';
  if (e.type === 'identity') return e.extra.cnic || e.extra.name || 'Identity';
  if (e.type === 'wifi') return `SSID ${e.username}`;
  return e.username || host(e.url || '') || '—';
}

function rotationDue(e) {
  if (!e.rotateDays) return null;
  return e.pwAt + e.rotateDays * DAY;
}

function visibleEntries() {
  let list = entries().slice();
  if (state.view === 'fav') list = list.filter(e => e.fav);
  if (state.view === 'tag') list = list.filter(e => (e.tags || []).includes(state.tag));
  if (state.view === 'type') list = list.filter(e => e.type === state.type);
  const q = state.q.trim().toLowerCase();
  if (q) {
    list = list.filter(e => [e.title, e.username, e.url, e.notes, ...(e.tags || [])].some(v => (v || '').toLowerCase().includes(q)));
  }
  const sorters = {
    title: (a, b) => a.title.localeCompare(b.title),
    updated: (a, b) => b.updated - a.updated,
    created: (a, b) => b.created - a.created,
    weak: (a, b) => analyze(a.password).bits - analyze(b.password).bits,
    oldest: (a, b) => a.pwAt - b.pwAt
  };
  return list.sort(sorters[state.sort] || sorters.title);
}

function rowHTML(e) {
  const badges = [];
  if (e.totp) badges.push(`<span title="Has one-time code">${ic('timer')}</span>`);
  if (e.fav) badges.push(`<span class="warnc" title="Favourite">${ic('star')}</span>`);
  const due = rotationDue(e);
  if (due && due - now() < 7 * DAY) badges.push(`<span class="${due < now() ? 'bad' : 'warnc'}" title="Rotation due">${ic('alert')}</span>`);
  if (e.password && (e.type === 'login' || e.type === 'wifi')) {
    const a = analyze(e.password);
    badges.push(`<span class="sdot s${a.score}" title="${esc(a.verdict)}"></span>`);
  } else {
    badges.push(`<span class="dim" title="${TYPES[e.type].label}">${ic(TYPES[e.type].icon)}</span>`);
  }
  return `<button class="row ${e.id === state.selected ? 'active' : ''}" data-id="${e.id}" aria-label="${esc(e.title)}">
    <div class="avatar" style="--c:${esc(e.color)}">${esc(initial(e.title))}</div>
    <div class="txt"><div class="t">${esc(e.title)}</div><div class="s">${esc(entrySubtitle(e))}</div></div>
    <div class="badges">${badges.join('')}</div></button>`;
}

function renderList() {
  const list = visibleEntries();
  $('#listTitle').textContent = viewTitle();
  $('#sortSel').value = state.sort;
  const rows = $('#rows');
  const key = state.view + '|' + state.tag + '|' + state.type;
  if (!list.length) {
    const title = state.q ? 'No matches' : 'Nothing here yet';
    const hint = state.q ? 'Try another search term.' : 'Click <b>New</b> to add an item.';
    rows.innerHTML = `<div class="empty"><div>${ic('search', 'big')}<h3>${title}</h3><p class="small">${hint}</p></div></div>`;
    return;
  }
  const animate = key !== state.listKey;
  rows.innerHTML = `<div class="${animate ? 'stagger' : ''}">${list.map(rowHTML).join('')}</div>`;
  if (animate) {
    animateIn(rows);
    state.listKey = key;
  }
  $$('.row', rows).forEach(b => {
    b.onclick = () => { location.hash = viewBase() + '/' + b.dataset.id; };
  });
}

// ---------- detail ----------
function stopTotp() {
  clearInterval(totpTimer);
  totpTimer = null;
}

function startTotp(secret) {
  const codeEl = $('#totpCode');
  const ring = $('#totpRing');
  const left = $('#totpLeft');
  if (!codeEl) return;
  let lastCounter = -1;
  const circumference = 94.25;
  const tick = async () => {
    const t = now();
    const counter = Math.floor(t / 30000);
    const remaining = 30 - (t / 1000) % 30;
    if (counter !== lastCounter) {
      lastCounter = counter;
      try {
        const code = await totp(secret, t);
        currentTotp = code || '';
        codeEl.textContent = code ? code.slice(0, 3) + ' ' + code.slice(3) : 'invalid secret';
      } catch {
        codeEl.textContent = 'invalid secret';
      }
      ring.style.transition = 'none';
      ring.style.strokeDashoffset = circumference * (1 - remaining / 30);
      void ring.getBoundingClientRect();
      ring.style.transition = '';
    } else {
      ring.style.strokeDashoffset = circumference * (1 - remaining / 30);
    }
    ring.closest('.ring').classList.toggle('warn', remaining < 6);
    left.textContent = Math.ceil(remaining) + 's';
  };
  tick();
  totpTimer = setInterval(tick, 1000);
}

const fld = (label, icon, valueHTML, actionsHTML = '') => `<div class="fld"><div class="main"><div class="fl">${ic(icon)} ${label}</div><div class="fv">${valueHTML}</div></div>${actionsHTML}</div>`;
const copyBtn = (key, label, small = false) => `<button class="iconbtn ${small ? 'sm' : ''}" data-copy="${esc(key)}" aria-label="Copy ${esc(label)}" title="Copy">${ic('copy')}</button>`;
const revealBtn = (key, small = false) => `<button class="iconbtn ${small ? 'sm' : ''}" data-reveal="${esc(key)}" aria-label="Show value" title="Show / hide">${ic(state.revealed.has(key) ? 'eye-off' : 'eye')}</button>`;
const mask = (key, value) => `<span class="mono secret" data-secret="${esc(key)}">${state.revealed.has(key) ? esc(value) : '••••••••••••'}</span>`;

/** Copy and reveal buttons name a key; the value is looked up here, never stored in the DOM. */
function secretByKey(e, key) {
  const direct = { password: e.password, username: e.username, url: e.url, notes: e.notes, totp: currentTotp, wifi: e.type === 'wifi' ? wifiString(e) : '' };
  if (key in direct) return direct[key] || '';
  if (key.startsWith('cf:')) return (e.fields[+key.slice(3)] || {}).value || '';
  if (key.startsWith('hist:')) return (e.history[+key.slice(5)] || {}).password || '';
  if (key.startsWith('x:')) return String(e.extra[key.slice(2)] || '');
  return '';
}

function cardFieldsHTML(e) {
  const x = e.extra;
  const digits = (x.number || '').replace(/\D/g, '');
  const expiry = cardExpiryState(e);

  const face = `<div class="cardface" style="--c:${esc(e.color)}"><div class="bank"><span>${esc(x.bank || 'Bank')}</span><span class="brandpill">${esc(cardBrand(x.number))}</span></div>
    <div class="num">${state.revealed.has('x:number') ? esc(formatCardNumber(x.number)) : esc(maskCardNumber(x.number))}</div>
    <div class="meta"><div><b>CARD HOLDER</b>${esc(x.holder || '—')}</div><div><b>EXPIRES</b>${esc(x.expiry || '—')}</div><span class="chip" aria-hidden="true"></span></div></div>`;
  return [
    face,
    fld('Card number', 'credit-card', mask('x:number', formatCardNumber(x.number)) + luhnPill, revealBtn('x:number') + copyBtn('x:number', 'card number')),
    fld('Expiry', 'calendar', esc(x.expiry || '—') + ' ' + expiryPill),
    fld('CVV', 'lock', x.cvv ? mask('x:cvv', x.cvv) : '<span class="dim">—</span>', x.cvv ? revealBtn('x:cvv') + copyBtn('x:cvv', 'CVV') : ''),
    fld('PIN', 'lock', x.pin ? mask('x:pin', x.pin) : '<span class="dim">—</span>', x.pin ? revealBtn('x:pin') + copyBtn('x:pin', 'PIN') : ''),
    fld('Card holder', 'user', esc(x.holder || '—'), x.holder ? copyBtn('x:holder', 'card holder') : '')
  ].join('');
}

function identityFieldsHTML(e) {
  const x = e.extra;

  ];
  return rows.filter(([, , value]) => value).map(([label, icon, value, key, raw]) => fld(label, icon, raw ? value : esc(value), copyBtn(key, label.toLowerCase()))).join('');

function wifiFieldsHTML(e) {
  return [
    fld('Network name (SSID)', 'radio', esc(e.username || '—'), e.username ? copyBtn('username', 'SSID') : ''),
    passwordFieldHTML(e),
    fld('Security', 'shield', esc(e.extra.security || 'WPA2')),

  ].join('');
}

function commonFieldsHTML(e) {
  const notes = e.notes ? `<div class="fld"><div class="main"><div class="fl">${ic('file')} Notes</div><div class="fv pre">${esc(e.notes)}</div></div>${copyBtn('notes', 'notes')}</div>` : '';
  const custom = (e.fields || []).map((f, i) => {

    const value = f.secret ? mask(key, f.value) : esc(f.value);
    return fld(esc(f.label || 'Field'), f.secret ? 'lock' : 'hash', value, (f.secret ? revealBtn(key) : '') + copyBtn(key, f.label || 'field'));
  }).join('');
  const tags = (e.tags || []).length ? fld('Tags', 'tag', `<span class="chips">${e.tags.map(t => `<a class="chip" href="#tag/${encodeURIComponent(t)}">${ic('tag')} ${esc(t)}</a>`).join('')}</span>`) : '';

function strengthCardHTML(e) {
  if (!e.password || (e.type !== 'login' && e.type !== 'wifi')) return '';
  const a = analyze(e.password);
  return `<div class="card"><h3>${ic('shield-check')} Strength analysis</h3>${meterHTML(a)}${strengthLine(a)}${reasonsHTML(a)}</div>`;
}

function historyCardHTML(e) {
  if (!(e.history || []).length) return '';
  const rows = e.history.map((h, i) => `<div class="hrow"><span class="muted small" style="min-width:92px">${fmtDate(h.at)}</span><span class="main">${mask('hist:' + i, h.password)}</span>${revealBtn('hist:' + i, true)}${copyBtn('hist:' + i, 'old password', true)}</div>`).join('');
  return `<div class="card"><h3>${ic('clock')} Password history <span class="pill">${e.history.length}</span></h3><div class="hist">${rows}</div></div>`;
}

function metaHTML(e) {
  const pwAge = now() - e.pwAt;
  const oldPill = e.password && pwAge > 365 * DAY ? `<span class="pill warn">${ic('alert')} older than a year</span>` : '';
  const due = rotationDue(e);
  let rotation = '<span class="muted">not scheduled</span>';
  if (due) {
    const cls = due < now() ? 'bad' : due - now() < 7 * DAY ? 'warn' : 'ok';
    rotation = `every ${e.rotateDays} days · <span class="pill ${cls}">${inDays(due)}</span>`;
  }
  const twofa = e.type === 'login' && !e.totp ? `<dt>2FA</dt><dd class="muted">No TOTP secret saved${KNOWN_2FA.some(k => (e.url + ' ' + e.title).toLowerCase().includes(k)) ? ' — this service offers 2FA, consider enabling it' : ''}</dd>` : '';
  return `<dl class="kv" style="padding:0 4px"><dt>Type</dt><dd>${TYPES[e.type].label}</dd><dt>Created</dt><dd>${fmtDate(e.created)}</dd><dt>Updated</dt><dd>${fmtDate(e.updated)} (${ago(e.updated)})</dd>
    ${e.password ? `<dt>Password changed</dt><dd>${fmtDate(e.pwAt)} ${oldPill}</dd><dt>Rotation</dt><dd>${rotation}</dd>` : ''}${twofa}</dl>`;
}

function emptyDetailHTML() {
  const hasItems = entries().length > 0;
  return `<div class="empty"><div>${ic('shield', 'big')}<h3>${hasItems ? 'Select an item' : 'Your vault is empty'}</h3>
    <p class="small">${hasItems ? 'Pick something from the list to see its details, codes and strength analysis.' : 'Add your first login with the New button, or import a CSV in Settings.'}</p></div></div>`;
}

function renderDetail() {
  stopTotp();
  const pane = $('#detailPane');
  const e = findEntry(state.selected);
  if (!e) {
    pane.innerHTML = emptyDetailHTML();
    return;
  }
  const typeFields = { login: loginFieldsHTML, card: cardFieldsHTML, note: () => '', identity: identityFieldsHTML, wifi: wifiFieldsHTML }[e.type](e);
  pane.innerHTML = `${detailHeadHTML(e)}<div class="d-body stagger">${typeFields}${commonFieldsHTML(e)}${strengthCardHTML(e)}${historyCardHTML(e)}${metaHTML(e)}</div>`;
  animateIn(pane);
  if (e.totp) startTotp(e.totp);
  $('#backBtn').onclick = () => { location.hash = viewBase(); };
  pane.onclick = ev => handleDetailClick(ev, e);
}

function toggleReveal(pane, e, button) {
  const key = button.dataset.reveal;
  if (state.revealed.has(key)) state.revealed.delete(key);
  else state.revealed.add(key);
  const span = pane.querySelector(`[data-secret="${key.replace(/"/g, '\\"')}"]`);
  if (span) span.textContent = state.revealed.has(key) ? secretByKey(e, key) : '••••••••••••';
  button.innerHTML = ic(state.revealed.has(key) ? 'eye-off' : 'eye');
  if (key === 'x:number') renderDetail();
}

async function handleDetailClick(ev, e) {
  const pane = $('#detailPane');
  const copy = ev.target.closest('[data-copy]');
  if (copy) {
    const value = secretByKey(e, copy.dataset.copy);
    const label = copy.getAttribute('aria-label').replace('Copy ', '');
    if (value) {
      copyText(value, label[0].toUpperCase() + label.slice(1), copy);
      if (copy.dataset.copy === 'password' || copy.dataset.copy.startsWith('x:')) logEvent('copy', `Copied ${label} of “${e.title}”`, e.id);
    }
    return;
  }
  const reveal = ev.target.closest('[data-reveal]');
  if (reveal) {
    toggleReveal(pane, e, reveal);
    return;
  }
  const action = ev.target.closest('[data-act]');
  if (!action) return;
  const act = action.dataset.act;
  if (act === 'fav') {
    e.fav = !e.fav;
    e.updated = now();
    await saveVault();
    renderRail();
    renderList();
    renderDetail();
    toast(e.fav ? 'Added to favourites' : 'Removed from favourites', 'ok', 'star');
  } else if (act === 'edit') {
    openEditor(e.id);
  } else if (act === 'share') {
    shareEntry(e);
  } else if (act === 'dup') {
    const copyOf = normalizeEntry({ ...JSON.parse(JSON.stringify(e)), id: uid(), title: e.title + ' (copy)', created: now(), updated: now(), pwAt: now(), history: [], fav: false });
    entries().push(copyOf);
    logEvent('item', `Duplicated “${e.title}”`, copyOf.id);
    await saveVault();
    toast('Item duplicated', 'ok');
    location.hash = viewBase() + '/' + copyOf.id;
  } else if (act === 'del') {
    const ok = await confirmModal({ title: `Move “${e.title}” to trash?`, body: `The item stays in Trash for ${prefs.trashDays} days and can be restored from there.`, ok: 'Move to trash', danger: true, icon: 'trash' });
    if (!ok) return;
    softDelete(e);
    refreshNotices();
    await saveVault();
    toast('Moved to trash', 'ok', 'trash');
    location.hash = viewBase();
  }
}

// ---------- editor (type-aware) ----------

    ? `<textarea id="${id}" placeholder="${esc(placeholder)}">${esc(value)}</textarea>`
    : `<input id="${id}" type="${type}" value="${esc(value)}" autocomplete="off" spellcheck="false" placeholder="${esc(placeholder)}" class="${mono ? 'mono' : ''}">`;

}

function passwordEditorHTML(v, label = 'Password') {
  return `<div class="span2"><label class="f" for="edPw">${label}</label>
    <div class="pwwrap"><input id="edPw" type="password" value="${esc(v.password)}" autocomplete="off" spellcheck="false">

function customFieldRow(f) {
  const row = document.createElement('div');
  row.className = 'cf';
  row.innerHTML = `<input placeholder="Label" value="${esc(f.label || '')}" autocomplete="off" aria-label="Field label"><input placeholder="Value" value="${esc(f.value || '')}" autocomplete="off" aria-label="Field value" class="mono">
    <label class="chk small"><input type="checkbox" ${f.secret ? 'checked' : ''}> Secret</label><button type="button" class="iconbtn danger" aria-label="Remove field">${ic('x')}</button>`;
  row.querySelector('.iconbtn').onclick = () => row.remove();
  $('#cfList').append(row);
}

function readCustomFields() {
  return $$('#cfList .cf').map(row => {
    const [label, value] = $$('input:not([type=checkbox])', row).map(i => i.value.trim());
    return { label, value, secret: row.querySelector('input[type=checkbox]').checked };
  }).filter(f => f.label || f.value);
}

function readExtra(type) {
  const get = id => ($('#' + id) ? $('#' + id).value.trim() : '');
  if (type === 'card') return { bank: get('exBank'), holder: get('exHolder'), number: get('exNumber').replace(/\s+/g, ''), expiry: get('exExpiry'), cvv: get('exCvv'), pin: get('exPin') };
  if (type === 'identity') return { name: get('exName'), cnic: get('exCnic'), dob: get('exDob'), phone: get('exPhone'), email: get('exEmail'), passport: get('exPassport'), address: get('exAddress') };
  if (type === 'wifi') return { security: get('exSecurity') || 'WPA2', router: get('exRouter') };
  return {};
}

function bindEditorWidgets(v) {
  let color = v.color;
  (v.fields || []).forEach(customFieldRow);
  $('#cfAdd').onclick = () => customFieldRow({});
  $$('#edColors .sw').forEach(b => {
    b.onclick = () => {
      color = b.dataset.c;
      $$('#edColors .sw').forEach(x => x.classList.toggle('on', x === b));
    };
  });
  $$('[data-tag]').forEach(b => {
    b.onclick = () => {
      const current = $('#edTags').value.split(',').map(s => s.trim()).filter(Boolean);
      if (!current.includes(b.dataset.tag)) current.push(b.dataset.tag);
      $('#edTags').value = current.join(', ');
    };
  });
  if ($('#edPw')) {
    const meter = () => {
      const a = analyze($('#edPw').value);
      $('#edMeter').innerHTML = meterHTML(a) + (a.len ? strengthLine(a) + reasonsHTML(a) : '');
    };
    meter();
    $('#edPw').addEventListener('input', meter);
    $('#edGen').onclick = () => {
      $('#edPw').value = generate().pw;
      $('#edPw').type = 'text';
      $('[data-toggle=edPw]').innerHTML = ic('eye-off');
      meter();
    };
  }
  if ($('#edTotp')) {
    const preview = async () => {
      const secret = $('#edTotp').value.trim();
      if (!secret) {
        $('#edTotpPrev').textContent = '';
        return;
      }
      const code = await totp(secret).catch(() => null);
      $('#edTotpPrev').innerHTML = code ? `${ic('check-circle')} Current code: <b class="mono">${code}</b>` : `${ic('alert-circle')} Not a valid Base32 secret`;
    };
    $('#edTotp').addEventListener('input', debounce(preview, 250));
    preview();
  }
  if ($('#exNumber')) {
    const info = () => {
      const digits = $('#exNumber').value.replace(/\D/g, '');
      if (!digits) {
        $('#exNumberInfo').textContent = '';
        return;
      }
      const ok = luhnValid(digits);
      $('#exNumberInfo').innerHTML = `${ic(ok ? 'check-circle' : 'alert-circle')} ${cardBrand(digits)} · ${digits.length} digits · Luhn ${ok ? 'OK' : 'fails'}`;
    };
    $('#exNumber').addEventListener('input', info);
    info();
  }
  return () => color;
}

function openEditor(id, prefill = {}) {
  const e = id ? findEntry(id) : null;
  const base = { title: '', username: '', password: '', url: '', notes: '', tags: [], fav: false, color: COLORS[randInt(COLORS.length)], totp: '', fields: [], rotateDays: 0, extra: {}, type: 'login' };
  const v = { ...base, ...(e ? JSON.parse(JSON.stringify(e)) : {}), ...prefill };
  const type = v.type;
  openModal(editorHTML(e, v, type), { wide: true });
  const getColor = bindEditorWidgets(v);
  $$('#edTypes button').forEach(b => {
    b.onclick = () => openEditor(null, { ...prefill, type: b.dataset.type, title: $('#edTitle').value, notes: $('#edNotes').value });
  });
  $('#edForm').onsubmit = async ev => {
    ev.preventDefault();
    await saveEditor(e, type, getColor());
  };
}

async function saveEditor(e, type, color) {
  const t = now();
  const get = id => ($('#' + id) ? $('#' + id).value.trim() : '');
  const password = get('edPw');
  const draft = {
    ...(e || { id: uid(), created: t, history: [], pwAt: t }),
    type, title: get('edTitle'), username: get('edUser'), password, url: get('edUrl'), notes: get('edNotes'),
    tags: [...new Set(get('edTags').split(',').map(s => s.trim().toLowerCase()).filter(Boolean))], fav: $('#edFav').checked, color,
    totp: get('edTotp').replace(/\s+/g, '').toUpperCase(), rotateDays: Number(get('edRotate')) || 0, updated: t, fields: readCustomFields(), extra: readExtra(type)
  };
  if (!draft.title) return;
  if (type === 'note' && !draft.notes) {
    toast('A secure note needs some text', 'bad');
    return;
  }
  const changes = [];
  if (e && e.password !== password) {
    draft.history = [{ password: e.password, at: e.pwAt }, ...(e.history || [])].filter(h => h.password).slice(0, 10);
    draft.pwAt = t;
    changes.push('password changed');
  }
  if (e && !e.totp && draft.totp) changes.push('TOTP added');
  const saved = normalizeEntry(draft);
  if (e) Object.assign(e, saved);
  else entries().push(saved);
  logEvent('item', e ? `Updated “${saved.title}”${changes.length ? ' — ' + changes.join(', ') : ''}` : `Added “${saved.title}” (${TYPES[type].label})`, saved.id);
  refreshNotices();
  await saveVault();
  modalClose = null;
  closeModal();
  toast(e ? 'Item updated' : 'Item added', 'ok', 'save');
  state.listKey = '';
  if (VAULT_VIEWS.includes(state.view)) {
    location.hash = viewBase() + '/' + saved.id;
    renderRail();
    renderList();
    renderDetail();
  } else {
    location.hash = 'all/' + saved.id;
  }
}

// ---------- health ----------
const hasPassword = e => e.password && (e.type === 'login' || e.type === 'wifi');

function healthReport() {
  const es = entries();
  const withPw = es.filter(hasPassword);
  const byPassword = new Map();
  withPw.forEach(e => {
    if (!byPassword.has(e.password)) byPassword.set(e.password, []);
    byPassword.get(e.password).push(e);
  });
  const groups = [...byPassword.values()].filter(g => g.length > 1);
  const reusedIds = new Set(groups.flat().map(e => e.id));
  const weak = withPw.filter(e => analyze(e.password).score <= 1);
  const old = withPw.filter(e => now() - e.pwAt > 365 * DAY);
  const no2fa = es.filter(e => e.type === 'login' && !e.totp && KNOWN_2FA.some(k => ((e.url || '') + ' ' + e.title).toLowerCase().includes(k)));
  const expiredCards = es.filter(e => { const x = cardExpiryState(e); return x && x.expired; });
  const rotationDueList = withPw.filter(e => { const due = rotationDue(e); return due && due < now(); });
  const n = withPw.length || 1;
  const penalty = 0.45 * weak.length / n + 0.3 * reusedIds.size / n + 0.15 * (old.length + expiredCards.length) / n + 0.1 * no2fa.length / n;
  const score = es.length ? clamp(Math.round(100 * (1 - penalty)), 0, 100) : 100;
  const dist = [0, 0, 0, 0, 0];
  withPw.forEach(e => dist[analyze(e.password).score]++);
  const fixes = es.map(e => {
    const why = [];
    if (weak.includes(e)) why.push('weak');
    if (reusedIds.has(e.id)) why.push('reused');
    if (old.includes(e)) why.push('old');
    if (rotationDueList.includes(e)) why.push('rotation due');
    if (no2fa.includes(e)) why.push('no 2FA');
    if (expiredCards.includes(e)) why.push('expired card');
    return { e, why };
  }).filter(f => f.why.length).sort((a, b) => b.why.length - a.why.length || analyze(a.e.password).bits - analyze(b.e.password).bits);
  return { score, weak, groups, reusedIds, old, no2fa, expiredCards, rotationDueList, dist, fixes, n: es.length, withPw: withPw.length };
}

function scoreCardHTML(h) {

  return `<div class="card scorecard"><div class="scorering"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="scoreFg" cx="60" cy="60" r="52" style="stroke:${colour};stroke-dasharray:${C};stroke-dashoffset:${C}"/></svg><div class="num" id="scoreNum">0</div></div>
    <div><b>Health score</b> · ${plural(h.n, 'item')}</div><div class="small muted">${verdict}</div></div>`;

function fixesHTML(h) {

function bindBreachCheck() {
  let hashInfo = null;
  $('#brHash').onclick = async () => {
    const custom = $('#brCustom').value;
    const e = findEntry($('#brSel').value);
    const pw = custom || (e ? e.password : '');
    if (!pw) {
      toast('Nothing to hash', 'bad');
      return;
    }
    const digest = await sha1Hex(pw);
    hashInfo = { prefix: digest.slice(0, 5), suffix: digest.slice(5) };
    $('#brOut').innerHTML = `<div class="hashbox">SHA-1 = <span class="pre">${hashInfo.prefix}</span>${hashInfo.suffix}</div>
      <div class="small muted" style="margin-top:8px">Only <code class="mono">${hashInfo.prefix}</code> would leave this device → <code class="mono">GET https://api.pwnedpasswords.com/range/${hashInfo.prefix}</code>. The 35-character suffix stays here and is compared against the returned list. 16⁵ = 1,048,576 possible prefixes, so the server learns nearly nothing about your password.</div>`;
    $('#brCheck').disabled = false;
  };
  $('#brCheck').onclick = async () => {
    if (!hashInfo) return;
    const result = await checkRangeAPI(hashInfo.prefix);
    let html;
    if (result === null) html = `<div class="note warn" style="margin-top:10px">${ic('alert')}<span><b>Offline stub — no request was sent.</b> <code>checkRangeAPI()</code> returns <code>null</code> until a student implements the fetch (see TODO in the source). When built, a match count &gt; 0 means this password appeared in public breaches and must be changed.</span></div>`;
    else if (result.has(hashInfo.suffix)) html = `<div class="note bad" style="margin-top:10px">${ic('alert')}<span>Seen ${result.get(hashInfo.suffix)} times in breaches — change it.</span></div>`;
    else html = `<div class="note ok" style="margin-top:10px">${ic('check-circle')}<span>Not found in the returned range.</span></div>`;
    $('#brOut').insertAdjacentHTML('beforeend', html);
  };
}

async function runKdfBenchmark() {
  const out = $('#labBenchOut');
  out.innerHTML = '<div class="tile skeleton" style="height:58px"></div><div class="tile skeleton" style="height:58px"></div><div class="tile skeleton" style="height:58px"></div>';
  const salt = rnd(16);
  const start = performance.now();
  await deriveKey('benchmark-password', salt, 100000);
  const per100k = performance.now() - start;
  const msPerIteration = per100k / 100000;
  const unlockMs = msPerIteration * prefs.iterations;
  const guessesPerSecond = 1000 / unlockMs;
  const recommended = Math.max(KDF_MIN, Math.round(500 / msPerIteration / 100000) * 100000);
  const tile = (value, label) => `<div class="tile"><b>${value}</b><span>${label}</span></div>`;
  out.innerHTML = tile(per100k.toFixed(0) + ' ms', '100,000 iterations here') + tile((unlockMs / 1000).toFixed(2) + ' s', `unlock at ${prefs.iterations.toLocaleString('en-PK')} iterations`) +
    tile(guessesPerSecond.toFixed(1) + ' /s', 'master-password guesses on this CPU') + tile(recommended.toLocaleString('en-PK'), 'iterations for a 0.5 s unlock') +
    `<div class="note" style="grid-column:1/-1">${ic('info')}<span>A GPU cracking rig does roughly 10⁴–10⁵× better than one browser thread, so iterations buy time but never replace a strong master password. Memory-hard Argon2id (student TODO) closes that gap.</span></div>`;
  logEvent('settings', `KDF benchmark: ${per100k.toFixed(0)} ms per 100k iterations`);
}

function bitDiff(hexA, hexB) {
  let count = 0;
  const cells = [];
  for (let i = 0; i < hexA.length; i++) {
    const x = parseInt(hexA[i], 16) ^ parseInt(hexB[i], 16);
    for (let b = 3; b >= 0; b--) {
      const on = (x >> b) & 1;
      count += on;
      cells.push(on);
    }
  }
  return { count, cells };
}

async function updateHashPlayground() {
  const text = $('#labHashIn').value;
  const [sha1, sha256, sha512] = await Promise.all([digestHex('SHA-1', text), digestHex('SHA-256', text), digestHex('SHA-512', text)]);
  const altered = text.length ? text.slice(0, -1) + String.fromCharCode((text.charCodeAt(text.length - 1) + 1) % 65536) : '.';
  const sha256b = await digestHex('SHA-256', altered);
  const diff = bitDiff(sha256, sha256b);
  $('#labHashOut').innerHTML = `<dl class="kv"><dt>SHA-1</dt><dd class="mono small">${sha1}</dd><dt>SHA-256</dt><dd class="mono small">${sha256}</dd><dt>SHA-512</dt><dd class="mono small">${sha512}</dd></dl>
    <div class="small muted" style="margin-top:10px">Change the last character to “${esc(altered.slice(-1))}” → <b class="acc">${diff.count} of 256 bits</b> differ (${(diff.count / 2.56).toFixed(0)}%).</div>
    <div class="bitdiff" aria-hidden="true">${diff.cells.map(on => `<i class="${on ? 'on' : ''}"></i>`).join('')}</div>`;
}

function bindAesDemo() {
  let box = null;
  let key = null;
  let salt = null;
  const out = $('#labAesOut');
  $('#labEnc').onclick = async () => {
    salt = rnd(16);
    key = await deriveKey($('#labPass').value, salt, 50000);
    box = await encryptJSON(key, { message: $('#labMsg').value });
    out.innerHTML = `<dl class="kv"><dt>Salt</dt><dd class="mono small">${hex(salt)}</dd><dt>IV</dt><dd class="mono small">${hex(unb64(box.iv))}</dd><dt>Ciphertext + tag</dt><dd class="mono small" id="labCt">${box.ct}</dd></dl>
      <div class="small muted" style="margin-top:8px">${unb64(box.ct).length} bytes = message + 16-byte authentication tag. Encrypt again and the IV and ciphertext change even for the same message.</div>`;
    $('#labDec').disabled = false;
    $('#labTamper').disabled = false;
  };
  $('#labDec').onclick = async () => {
    try {
      const plain = await decryptJSON(key, box);
      out.insertAdjacentHTML('beforeend', `<div class="note ok" style="margin-top:10px">${ic('check-circle')}<span>Decrypted: <b>${esc(plain.message)}</b> — the tag verified, so the data is exactly what was encrypted.</span></div>`);
    } catch {
      out.insertAdjacentHTML('beforeend', `<div class="note bad" style="margin-top:10px">${ic('alert')}<span><b>Decryption refused.</b> The authentication tag no longer matches — GCM detected the modified byte instead of returning corrupted text. The vault relies on exactly this check.</span></div>`);
    }
  };
  $('#labTamper').onclick = () => {
    const bytes = unb64(box.ct);
    const i = randInt(bytes.length - 16);
    bytes[i] ^= 1;
    box = { ...box, ct: b64(bytes) };
    $('#labCt').textContent = box.ct;
    out.insertAdjacentHTML('beforeend', `<div class="note warn" style="margin-top:10px">${ic('zap')}<span>Flipped one bit in ciphertext byte ${i}. Now press Decrypt.</span></div>`);
  };
}

async function updateTotpWalkthrough() {
  const steps = await totpSteps($('#labTotpIn').value).catch(() => null);
  const out = $('#labTotpOut');
  if (!steps) {
    out.innerHTML = '<div class="empty-inline">Enter a valid Base32 secret</div>';
    return;
  }
  const macHex = hex(steps.mac);
  const highlighted = macHex.slice(0, steps.offset * 2) + `<span class="pre">${macHex.slice(steps.offset * 2, steps.offset * 2 + 8)}</span>` + macHex.slice(steps.offset * 2 + 8);
  const row = (n, title, code) => `<div class="step-row"><span class="no">${n}</span><div><b>${title}</b><code class="mono">${code}</code></div></div>`;
  out.innerHTML = row(1, `Decode Base32 → ${steps.keyBytes.length} key bytes`, hex(steps.keyBytes)) +
    row(2, `Counter = ⌊unix time / 30⌋ = ${steps.counter} (${Math.ceil(steps.secondsLeft)} s left)`, steps.counterHex + ' (8 bytes, big-endian)') +
    row(3, 'HMAC-SHA-1(key, counter) → 20 bytes', `<span class="hashbox" style="padding:4px 6px">${highlighted}</span>`) +
    row(4, `Offset = last nibble = ${steps.offset}; take 4 bytes, clear the top bit`, `${steps.binary} (decimal)`) +
    row(5, 'mod 10⁶ → 6 digits', `<b class="acc" style="font-size:1.2rem;letter-spacing:.1em">${steps.code}</b>`);
}

function renderTrash(root) {
  const items = trash().slice().sort((a, b) => b.deletedAt - a.deletedAt);
  root.innerHTML = `<div class="page">
    <div class="page-head"><div><h2>Trash</h2><p>Deleted items wait here for ${prefs.trashDays} days (change it in Settings), then they are purged automatically on unlock. Restoring puts an item back exactly as it was.</p></div>
      <button class="btn danger" id="trashEmpty" ${items.length ? '' : 'disabled'}>${ic('trash')} Empty trash</button></div>
    <div class="card">${items.length ? `<div class="stagger">${items.map(trashRowHTML).join('')}</div>` : `<div class="empty-inline">${ic('check-circle')} Trash is empty.</div>`}</div>
  </div>`;
  animateIn(root);
  root.onclick = async e => {
    const restore = e.target.closest('[data-restore]');
    const forever = e.target.closest('[data-forever]');
    if (restore) {
      const entry = restoreFromTrash(restore.dataset.restore);
      refreshNotices();
      await saveVault();
      toast(`Restored “${entry.title}”`, 'ok', 'refresh');
      location.hash = 'all/' + entry.id;
    } else if (forever) {
      const item = trash().find(t => t.id === forever.dataset.forever);
      const ok = await confirmModal({ title: `Delete “${item.title}” forever?`, body: 'This removes the item from the encrypted vault permanently.', ok: 'Delete forever', danger: true, icon: 'trash' });
      if (!ok) return;
      session.data.trash = trash().filter(t => t.id !== item.id);
      logEvent('delete', `Deleted “${item.title}” forever`);
      refreshNotices();
      await saveVault();
      renderTrash(root);
      renderRail();
    }
  };
  $('#trashEmpty').onclick = async () => {
    const ok = await confirmModal({ title: 'Empty the trash?', body: `${plural(items.length, 'item')} will be removed permanently.`, ok: 'Empty trash', danger: true, typed: 'EMPTY', icon: 'trash' });
    if (!ok) return;
    session.data.trash = [];
    logEvent('delete', `Emptied trash (${plural(items.length, 'item')})`);
    refreshNotices();
    await saveVault();
    renderTrash(root);
    renderRail();
  };
}

  const rec = store.get('vault');
  if (!rec) return;
  download(`vault-export-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ ...rec, exportedAt: now() }, null, 2));
  prefs.lastExport = now();
  savePrefs();
  logEvent('export', 'Encrypted export downloaded');
  refreshNotices();
  saveVault();
  toast('Encrypted export downloaded', 'ok', 'download');
  if (document.body.dataset.page === 'settings') renderPage('settings');
}

function importEncryptedModalHTML(rec, fromLockScreen) {
  const modeField = fromLockScreen ? '' : `<label class="f">Mode</label><label class="chk"><input type="radio" name="imMode" value="merge" checked> Merge — add items that are not already here</label><label class="chk"><input type="radio" name="imMode" value="replace"> Replace — discard current items</label>`;
  return `${modalHead('Unlock the imported file', 'upload')}<form id="imForm" autocomplete="off">
    <p class="small muted">The file was encrypted with its own master password (${rec.iterations.toLocaleString('en-PK')} iterations). Enter it to decrypt the export.</p>
    <label class="f" for="imPw">Export's master password</label><input id="imPw" type="password" autocomplete="off" required>${modeField}
    <div id="imErr" class="small bad" style="min-height:1.2em"></div>
    <div class="modal-foot"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn primary">${ic('unlock')} Decrypt &amp; import</button></div></form>`;
}

function importEncrypted(fromLockScreen) {
  pickFile('.json,application/json', async text => {
    let rec;
    try {
      rec = JSON.parse(text);
    } catch {
      toast('Not a JSON file', 'bad');
      return;
    }
    if (!rec || rec.format !== 'pfpm-vault' || !rec.data || !rec.salt) {
      toast('Not a Vault export', 'bad');
      return;
    }
    openModal(importEncryptedModalHTML(rec, fromLockScreen));
    $('#imForm').onsubmit = async ev => {
      ev.preventDefault();
      try {
        const key = await deriveKey($('#imPw').value, unb64(rec.salt), rec.iterations);
        await decryptJSON(key, rec.verifier);
        const data = ensureDataShape(await decryptJSON(key, rec.data));
        if (fromLockScreen) {
          store.set('vault', { ...rec, savedAt: now() });
          modalClose = null;
          closeModal();
          demoHint = false;
          lockReason = 'Export restored — unlock with its master password';
          renderLock('unlock');
          return;
        }
        const mode = $('input[name=imMode]:checked').value;
        mergeImportedData(data, mode);
        logEvent('import', `Imported ${plural(data.entries.length, 'item')} from an encrypted export (${mode})`);
        refreshNotices();
        await saveVault();
        modalClose = null;
        closeModal();
        toast(`Imported ${plural(data.entries.length, 'item')}`, 'ok', 'upload');
        state.listKey = '';
        location.hash = 'all';
      } catch {
        $('#imErr').textContent = 'Wrong password for this export.';
      }
    };
  });
}

function mergeImportedData(data, mode) {
  if (mode === 'replace') {
    session.data.entries = data.entries;
    return;
  }
  const ids = new Set(entries().map(e => e.id));
  data.entries.forEach(e => {
    if (!ids.has(e.id)) entries().push(e);
  });
}

/** RFC 4180-ish CSV parser: quoted fields, doubled quotes, newlines inside quotes. */
function parseCSV(text) {
  const rows = [];
  let row = [];
  let cell = '';
  let quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"' && text[i + 1] === '"') {
        cell += '"';
        i++;
      } else if (c === '"') {
        quoted = false;
      } else {
        cell += c;
      }
    } else if (c === '"') {
      quoted = true;
    } else if (c === ',') {
      row.push(cell);
      cell = '';
    } else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell);
      rows.push(row);
      row = [];
      cell = '';
    } else {
      cell += c;
    }
  }
  if (cell || row.length) {
    row.push(cell);
    rows.push(row);
  }
  return rows.filter(r => r.some(v => v.trim()));
}

const CSV_ALIASES = { title: ['name', 'title', 'account'], url: ['url', 'website', 'login_uri', 'web site'], username: ['username', 'login', 'user', 'email', 'login_username'], password: ['password', 'login_password', 'pass'], notes: ['note', 'notes', 'extra', 'comments'] };

function mapCsvColumns(headerRow) {
  const head = headerRow.map(h => h.trim().toLowerCase());
  const index = {};
  let hasHeader = false;
  Object.entries(CSV_ALIASES).forEach(([key, aliases]) => {
    const i = head.findIndex(h => aliases.includes(h));
    if (i >= 0) {
      index[key] = i;
      hasHeader = true;
    }
  });
  if (!hasHeader) Object.assign(index, { title: 0, url: 1, username: 2, password: 3, notes: 4 });
  return { index, hasHeader };
}

function importCSV() {
  pickFile('.csv,text/csv', async text => {
    const rows = parseCSV(text.replace(/^﻿/, ''));
    if (!rows.length) {
      toast('Empty CSV', 'bad');
      return;
    }
    const { index, hasHeader } = mapCsvColumns(rows[0]);
    const body = hasHeader ? rows.slice(1) : rows;
    const t = now();
    const items = body.map(r => {
      const get = key => (index[key] != null ? (r[index[key]] || '').trim() : '');
      return normalizeEntry({ id: uid(), type: 'login', title: get('title') || host(get('url')) || 'Imported item', username: get('username'), password: get('password'), url: get('url'), notes: get('notes'), tags: ['imported'], color: COLORS[7], created: t, updated: t, pwAt: t });
    }).filter(x => x.password || x.username);
    if (!items.length) {
      toast('No usable rows found', 'bad');
      return;
    }
    const body2 = `Detected columns: <code>${esc(Object.keys(index).join(', '))}</code>${hasHeader ? '' : ' (no header row — positional mapping)'}. Items get the tag <b>imported</b>. Delete the CSV file afterwards — it is plaintext.`;
    const ok = await confirmModal({ title: `Import ${plural(items.length, 'item')}?`, body: body2, ok: 'Import', icon: 'file' });
    if (!ok) return;
    entries().push(...items);
    logEvent('import', `Imported ${plural(items.length, 'item')} from CSV`);
    refreshNotices();
    await saveVault();
    toast(`Imported ${plural(items.length, 'item')}`, 'ok', 'upload');
    state.listKey = '';
    location.hash = 'tag/imported';
  });
}

async function exportCSV() {
  const warning = `<div class="note bad">${ic('alert')}<span>The file will contain every login password <b>unencrypted</b>. Anyone who opens it can read everything. Use it only to migrate, then delete it securely.</span></div>`;
  const ok = await confirmModal({ title: 'Export plaintext CSV?', body: warning, ok: 'I understand, export', danger: true, typed: 'EXPORT', icon: 'alert' });
  if (!ok) return;
  const quote = v => '"' + String(v || '').replace(/"/g, '""') + '"';
  const lines = entries().filter(e => e.type === 'login' || e.type === 'wifi').map(e => [e.title, e.url, e.username, e.password, e.notes].map(quote).join(','));
  download(`vault-plaintext-${new Date().toISOString().slice(0, 10)}.csv`, ['name,url,username,password,note', ...lines].join('\r\n'), 'text/csv');
  logEvent('export', `Plaintext CSV exported (${plural(lines.length, 'login')})`);
  saveVault();
  toast('Plaintext CSV downloaded — delete it after use', 'bad', 'alert');
}

function aboutProblemHTML() {
  return `<div class="card"><h3>${ic('alert')} The problem</h3><p class="small muted" style="margin:0">People reuse one weak password across banking apps, JazzCash/Easypaisa, email and social accounts. Cloud password managers cost money or ask for trust in a company; this is a zero-knowledge, offline, single-file vault that also <b>teaches</b> the cryptography it uses.</p></div>`;
}

function aboutThreatHTML() {
  const protects = [
    ['Device theft / lost laptop', 'while the vault is locked: the attacker only gets AES-GCM ciphertext and must brute-force your master password through 600,000 PBKDF2 rounds per guess.'],
    ['Cloud or provider leaks', ': there is no server, account or sync, so nothing can leak from one.'],
    ['Casual snooping', ' in DevTools / localStorage: no plaintext, no password hash — only salt, parameters and ciphertext.'],
    ['Tampering', ': AES-GCM is authenticated; a modified blob fails to decrypt instead of returning garbage.']
  ];
  const limits = [
    ['Malware, keyloggers or a malicious extension', ' on this device can read the master password or the unlocked DOM.'],
    ['Shoulder surfing', ` while a secret is revealed, and <b>clipboard sniffers</b> during the ${prefs.clipClear}-second copy window.`],
    ['A weak master password', ' — 600k iterations only multiply an attacker\'s cost; they do not fix 20 bits of entropy.'],
    ['Forgetting the master password', ': there is no recovery (a recovery kit is a student TODO).'],
    ['A tampered copy of this HTML file', ': verify where you got it. Inline scripts mean a strict CSP cannot be applied; a bundled build with hashes would allow one.']
  ];
  const li = (cls, icon) => ([head, tail]) => `<li class="${cls}">${ic(icon)}<span><b>${head}</b>${tail}</span></li>`;
  return `<div class="card"><h3>${ic('shield-check')} Threat model — what this protects against</h3><ul class="reasons">${protects.map(li('ok', 'check-circle')).join('')}</ul></div>
    <div class="card"><h3>${ic('alert-circle')} …and what it does not</h3><ul class="reasons">${limits.map(li('bad', 'alert-circle')).join('')}</ul></div>`;
}

function aboutHowHTML() {
  return `<div class="card"><h3>${ic('cpu')} How it works</h3><p class="small muted" style="margin:0">Master password → PBKDF2-SHA-256 (600,000 iterations, 16-byte random salt) → AES-GCM-256 key. The whole vault JSON — items, trash, activity log and notices — is encrypted as one blob with a fresh 12-byte IV on every save and stored in <code>localStorage</code> beside the salt, iteration count and a verifier. TOTP codes use HMAC-SHA-1 (RFC 6238); the breach check uses SHA-1 k-anonymity. Everything is WebCrypto — no crypto library is loaded. The <a href="#lab">crypto lab</a> lets you run each primitive by hand.</p></div>`;
}

// ---------- router ----------
function parseHash() {
  const parts = (location.hash.slice(1) || 'all').split('/');
  if (parts[0] === 'tag') return { view: 'tag', tag: decodeURIComponent(parts[1] || ''), type: null, id: parts[2] || null };
  if (parts[0] === 'type') return { view: 'type', tag: null, type: parts[1] || 'login', id: parts[2] || null };
  return { view: parts[0], tag: null, type: null, id: parts[1] || null };
}

const PAGE_RENDERERS = { health: renderHealth, generator: renderGenerator, inbox: renderInbox, trash: renderTrash, lab: renderLab, reports: renderReports, settings: renderSettings, about: renderAbout };

function renderPage(view) {
  const root = $('#contentPane');
  PAGE_RENDERERS[view](root);
  root.scrollTop = 0;
}

function route() {
  if (!session.key) return;
  const r = parseHash();
  const vaultView = VAULT_VIEWS.includes(r.view);
  if (!vaultView && !PAGES[r.view]) {
    location.hash = 'all';
    return;
  }
  if (r.view === 'tag' && !allTags().some(([t]) => t === r.tag)) {
    location.hash = 'all';
    return;
  }
  if (r.view === 'type' && !TYPES[r.type]) {
    location.hash = 'all';
    return;
  }
  if (r.id !== state.selected) state.revealed.clear();
  state.view = r.view;
  state.tag = r.tag;
  state.type = r.type;
  state.selected = vaultView ? r.id : null;
  document.body.dataset.page = vaultView ? 'vault' : r.view;
  document.body.classList.toggle('detail-open', vaultView && !!r.id);
  document.body.classList.remove('rail-open');
  $('#scrim').classList.remove('open');
  renderRail();
  if (vaultView) {
    renderList();
    renderDetail();
  } else {
    stopTotp();
    renderPage(r.view);
  }
}

window.addEventListener('hashchange', route);
$('#q').addEventListener('input', e => {
  state.q = e.target.value;
  renderList();
});
$('#sortSel').addEventListener('change', e => {

});

};
$('#railNav').addEventListener('click', e => {

  document.body.classList.remove('rail-open');

});
