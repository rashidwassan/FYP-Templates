function renderATS(animate) {
  const a = analysis || (analysis = analyse());
  const struct = a.checks.filter(c => c.id !== 'keywords');
  const sg = sum(struct.map(c => c.pts));
  const sm = sum(struct.map(c => c.max));
  const fixes = [...a.checks].filter(c => c.status !== 'pass').sort((x, y) => y.max - y.pts - (x.max - x.pts));
  const passes = a.checks.filter(c => c.status === 'pass');
  $('#atsBody').innerHTML = `${scorecardHTML(a, sg, sm)}
  ${jdPanelHTML(a)}
  ${langNoteHTML()}
  <div class="panel"><h3>${ic('list')} Fix list (highest impact first)</h3>${fixes.map(fixHTML).join('') || `<div class="empty">${ic('check-circle')} Everything passes.</div>`}</div>
  <div class="panel"><h3>${ic('check-circle')} Passing (${passes.length})</h3>${passes.map(fixHTML).join('')}</div>
  ${tipsPanelHTML()}`;
  requestAnimationFrame(() => {
    const C = 2 * Math.PI * 62;
    $('#bigFg').style.strokeDashoffset = C * (1 - a.score / 100);
    $('#barS').style.width = (100 * sg) / sm + '%';
    $('#barK').style.width = (a.hasJD ? a.kw.pct : 0) + '%';
    if (animate) countUp($('#bigNum'), a.score);
    else $('#bigNum').textContent = a.score;
  });
  bindATSActions();
}
function fixHTML(c) {
  const icon = c.status === 'pass' ? 'check-circle' : c.status === 'warn' ? 'alert-circle' : 'alert';
  const hint = c.status !== 'pass' && c.fix ? ` <i>${esc(c.fix)}</i>` : '';
  const go =
    c.status !== 'pass'
      ? `<div class="go"><button class="btn sm soft" data-goto="${c.target}">${ic('arrow-right')} Go to ${c.target === 'sections' ? 'editor' : c.target}</button></div>`
      : '';
  return `<div class="fix ${c.status}"><span class="st">${ic(icon)}</span><b>${esc(c.title)}</b><span class="pts">${c.pts}/${c.max}</span><div class="d">${esc(c.detail)}${hint}</div>${go}</div>`;
}
function addKeywordToSkills(kw, chipEl) {
  let grp = R.skills.find(g => /tool|keyword|tech/i.test(g.group)) || R.skills[0];
  if (!grp) {
    grp = { id: uid(), group: 'Keywords', items: [] };
    R.skills.push(grp);
  }
  grp.items.push(cap(kw));
  chipEl.style.cssText = 'transform:scale(.6);opacity:0;transition:all .25s';
  saveNow();
  renderPreview();
  setTimeout(() => {
    analysis = analyse();
    renderPill();
    renderATS(false);
    renderEditor();
  }, 260);

// ---------- bullet improver (rule-based) ----------
// gerund or base verb → past tense
function pastOf(w) {
  const lw = w.toLowerCase();
  const stem = lw.endsWith('ing') ? lw.slice(0, -3) : lw;
  if (IRREG[stem]) return IRREG[stem];
  if (IRREG[stem + 'e']) return IRREG[stem + 'e'];
  if (/[^aeiou]y$/.test(stem)) return stem.slice(0, -1) + 'ied';
  if (stem.endsWith('e')) return stem + 'd';
  return stem + 'ed';
}
// Strip a weak opener ("responsible for managing…" → "Managed…"), twice, so the result cannot start weakly
function rewriteWeakOpening(s, weak) {
  let up = s;
  for (let pass = 0, wk = weak; pass < 2 && wk; pass++, wk = weakStart(up)) {
    let rest = up.slice(wk[0].length).trim();
    let infinitive = / to$/.test(wk[0]);
    if (/^to\s/i.test(rest)) {
      rest = rest.slice(3);
      infinitive = true;
    }
    const w0 = rest.split(' ')[0] || '';
    up = infinitive || /ing$/i.test(w0) ? cap(pastOf(w0)) + rest.slice(w0.length) : `${wk[1]} ${rest}`;
  }
  return up;
}
// Returns [suggestion, upgradedSentence] or [null, null]
function verbSuggestion(s) {
  const fw = firstWord(s);
  const weak = weakStart(s);
  if (weak) {
    const up = rewriteWeakOpening(s, weak);
    return [['Stronger opening verb', up, `“${weak[0]}” tells the parser nothing — lead with what you did.`], up];
  }
  if (UPGRADE[fw]) {
    const up = UPGRADE[fw] + s.slice(s.indexOf(' '));
    return [['Stronger opening verb', up, `“${cap(fw)}” is weak; “${UPGRADE[fw]}” reads as ownership.`], up];
  }
  if (!STRONG.has(fw) && !/^\d/.test(s)) {
    const up = `Delivered ${s[0].toLowerCase()}${s.slice(1)}`;
    return [['Start with an action verb', up, 'Bullets that open with a verb are easier to parse and skim.'], up];
  }
  return [null, null];
}
function metricPlaceholder(s) {
  if (/reduc|cut|decreas|lower|fix|resolv|debug/i.test(s)) return 'reducing [errors/time] by X %';
  if (/improv|increas|boost|grow|speed|optimi/i.test(s)) return 'improving [metric] by X %';
  if (/user|customer|student|client|farmer|team|people/i.test(s)) return 'used by N+ [people]';
  return 'saving X hours per week';
}
function splitSuggestion(s) {
  if (words(s).length <= 30) return null;
  const cut = Math.max(s.lastIndexOf('; '), s.lastIndexOf(', and '), s.lastIndexOf(' and '));
  if (cut <= 20) return null;
  const second = cap(s.slice(cut).replace(/^[;,]?\s*and\s*/, '').trim());
  return ['Split into two bullets', s.slice(0, cut).trim() + '\n' + second, 'Long bullets wrap to three lines and get skimmed past.'];
}
function tidySuggestion(s) {
  const endsWithStop = /\.\s*$/.test(s);
  const othersEndWithStop = /\.\s*$/.test(allBullets()[0] || '.');
  const needsTidy = s[0] !== s[0].toUpperCase() || /\s[.]$/.test(s) || endsWithStop !== othersEndWithStop;
  if (!needsTidy) return null;
  const tidy = cap(s).replace(/\s+([.,;])/g, '$1').replace(/\.\s*$/, '');
  return ['Tidy capitalisation & punctuation', tidy, 'Consistent casing and no trailing full stops across all bullets.'];
}
function suggestBullet(text) {
  const out = [];
  const s = text.trim().replace(/^[-•*]\s*/, '').replace(/\s+/g, ' ');
  if (!s) return out;
  const fw = firstWord(s);
  const [verbSug, up] = verbSuggestion(s);
  if (verbSug) out.push(verbSug);
  const core = (up || s).replace(/[.;]\s*$/, '');
  if (!/\d/.test(s)) {
    out.push(['Add a measurable result', `${core}, ${metricPlaceholder(s)}`, 'Replace X/N with a real number — ranges and estimates are fine.']);
  }
  const already = STRONG.has(fw) && /\d/.test(s) && words(s).length >= 8;
  if (!already) {
    const cw = core.split(' ')[0];
    out.push([
      'STAR rewrite',
      `${cw} ${core.slice(cw.length + 1)} for [team/client], to [goal], achieving [result with a number]`,
      'Situation → Task → Action → Result in one line; delete the brackets you cannot fill.'
    ]);
  }
  if (/\b(i|my|me|we|our|myself)\b/i.test(s)) {
    const impersonal = cap(s.replace(/\b(i|my|me|we|our|myself)\b\s*/gi, '').replace(/\s+/g, ' ').trim());
    out.push(['Remove first person', impersonal, 'Resumes are written in implied first person — no “I” or “we”.']);
  }
  const split = splitSuggestion(s);
  if (split) out.push(split);
  const tidy = tidySuggestion(s);
  if (tidy) out.push(tidy);
  return out;
}

// bytes used by this app in localStorage, per key
function storageUsage() {
  const rows = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k.startsWith(NS)) continue;
    rows.push({ key: k.slice(NS.length), bytes: (localStorage.getItem(k) || '').length * 2 });
  }
  rows.sort((a, b) => b.bytes - a.bytes);
  return { rows, total: sum(rows.map(r => r.bytes)) };
}
const fmtBytes = b => (b > 1024 * 1024 ? (b / 1048576).toFixed(2) + ' MB' : b > 1024 ? Math.round(b / 1024) + ' KB' : b + ' B');

  $('#impMerge').onclick = () => applyBackup(obj, 'merge');

function mergeById(mine, theirs) {
  const ids = new Set(mine.map(x => x.id));
  return [...mine, ...(theirs || []).filter(x => x && !ids.has(x.id))];
}
// writes the merged or replaced state and reloads, so every module re-reads a consistent store
function applyBackup(obj, mode) {
  const safeResumes = (obj.resumes || []).filter(r => r && r.contact && Array.isArray(r.sections));
  if (mode === 'replace') {
    store.set('resumes', safeResumes.length ? safeResumes : resumes);
    store.set('apps', obj.apps || []);
    store.set('star', obj.star || {});
    store.set('linkedin', obj.linkedin || {});
    store.set('log', obj.log || []);
    store.set('settings', Object.assign({}, DEFAULT_SETTINGS, obj.settings || {}));
    if (obj.ui) store.set('ui', Object.assign({}, ui, obj.ui));
  } else {
    store.set('resumes', mergeById(resumes, safeResumes));
    store.set('apps', mergeById(apps, obj.apps));
    store.set('star', Object.assign({}, obj.star || {}, star));
    store.set('linkedin', Object.assign({}, obj.linkedin || {}, linkedin));
    store.set('log', mergeById(activity, obj.log).sort((a, b) => b.at - a.at).slice(0, LOG_MAX));
  }
  modalClose();
  toast(mode === 'replace' ? 'Backup restored — reloading' : 'Backup merged — reloading', 'ok');
  setTimeout(() => location.reload(), 700);
}

// KPIs and per-version performance
function trackerKPIs(list) {
  const reached = stage => list.filter(a => a.history.some(h => h.stage === stage)).length;
  const sent = reached('applied');
  return {
    total: list.length,
    active: list.filter(a => !isClosed(a)).length,
    interviews: reached('interview'),
    offers: reached('offer'),
    responseRate: pct(reached('interview'), sent),
    due: dueFollowUps().filter(a => list.includes(a)).length
  };
}
function versionStats() {
  return resumes
    .map(r => {
      const list = appsForResume(r.id);
      const k = trackerKPIs(list);
      return { id: r.id, name: r.name, template: TEMPLATES[r.template]?.name || '', ...k };
    })
    .filter(v => v.total)
    .sort((a, b) => b.responseRate - a.responseRate || b.total - a.total);
}

function bindTracker(v) {
  $('#appAdd').onclick = () => openAppForm();
  $('#appPrint').onclick = () => {
    logEvent('ok', 'Printed the application report');
    printPage('tracker');
  };
  $('#appFilter').onchange = e => {
    ui.appFilter = e.target.value;
    store.set('ui', ui);
    renderTracker();
  };
  $('#closedBox')?.addEventListener('toggle', e => {
    ui.showClosed = e.target.open;
    store.set('ui', ui);
  });
  v.onclick = e => {
    const b = e.target.closest('[data-appact]');
    if (!b) return;
    const act = b.dataset.appact;
    const id = b.dataset.id;
    if (act === 'open') openAppDetail(id);
    else if (act === 'edit') openAppForm(id);
    else if (act === 'back') moveStage(id, -1);
    else if (act === 'fwd') moveStage(id, 1);
  };
  bindBoardDnD(v);
}
// drag a card onto another column to change its stage
function bindBoardDnD(v) {
  let dragId = null;
  v.addEventListener('dragstart', e => {
    const card = e.target.closest?.('.appc[draggable="true"]');
    if (!card) return;
    dragId = card.dataset.app;
    card.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', dragId);
  });
  v.addEventListener('dragend', e => {
    e.target.closest?.('.appc')?.classList.remove('dragging');
    $$('.col.drop', v).forEach(c => c.classList.remove('drop'));
    dragId = null;
  });
  v.addEventListener('dragover', e => {
    const col = e.target.closest('.col');
    if (!col || !dragId) return;
    e.preventDefault();
    $$('.col.drop', v).forEach(c => c.classList.remove('drop'));
    col.classList.add('drop');
  });
  v.addEventListener('drop', e => {
    const col = e.target.closest('.col');
    if (!col || !dragId) return;
    e.preventDefault();
    setStage(dragId, col.dataset.stage);
  });
}

// stage changes
function setStage(id, stage, note = '') {
  const a = apps.find(x => x.id === id);
  if (!a || a.stage === stage) return;
  a.stage = stage;
  a.history.push({ stage, at: isoDate() });
  if (stage === 'applied' && !a.applied) a.applied = isoDate();
  a.updated = Date.now();
  saveApps();
  const where = `${a.role} at ${a.company}`;
  if (stage === 'interview') logEvent('ok', `Interview stage: ${where}. Prepare answers in Interview prep.`, '#interview');
  else if (stage === 'offer') logEvent('ok', `Offer received: ${where}`, '#tracker');
  else if (stage in CLOSED) logEvent('warn', `${CLOSED[stage]}: ${where}${note ? ' — ' + note : ''}`, '#tracker');
  else logEvent('info', `Moved ${where} to ${stageName(stage)}`, '#tracker');
  renderTracker();
  renderSubnav();
}
function moveStage(id, dir) {
  const a = apps.find(x => x.id === id);
  if (!a || isClosed(a)) return;
  const next = STAGES[STAGE_INDEX[a.stage] + dir];
  if (next) setStage(id, next[0]);
}
function deleteApp(id) {
  const a = apps.find(x => x.id === id);
  if (!a) return;
  confirmModal(`Remove ${a.role} at ${a.company}?`, 'The application and its history are deleted from the tracker.', () => {
    apps = apps.filter(x => x.id !== id);
    saveApps();
    renderTracker();
    renderSubnav();
    toast('Application removed');
  });
}

function openAppForm(id) {
  const existing = apps.find(x => x.id === id);
  const a = existing ? clone(existing) : blankApp();
  modalOpen(`<h2>${ic(existing ? 'edit' : 'plus')} ${existing ? 'Edit application' : 'Add application'} <button class="ib" data-close aria-label="Close">${ic('x')}</button></h2>
    ${appFormHTML(a)}
    <div class="mactions">${existing ? `<button class="btn danger" id="apDelete">${ic('trash')} Remove</button>` : ''}<span class="spacer"></span><button class="btn ghost" data-close>Cancel</button><button class="btn acc" id="apSave">${ic('check')} Save</button></div>`);
  $('#apSave').onclick = () => {
    const stage = readAppForm(a);
    if (!a.company || !a.role) return toast('Company and role are required', 'bad');
    a.updated = Date.now();
    if (existing) Object.assign(existing, a, { stage: existing.stage });
    else {
      apps.push(a);
      logEvent('ok', `Added application: ${a.role} at ${a.company} (${resumeName(a.resumeId)})`, '#tracker');
    }
    saveApps();
    modalClose();
    const target = existing || a;
    if (target.stage !== stage) setStage(target.id, stage);
    else {
      renderTracker();
      renderSubnav();
    }
    toast(existing ? 'Application updated' : 'Application added', 'ok');
  };
  if (existing) $('#apDelete').onclick = () => deleteApp(id);
}

// reminders created once per application per day; shown on the bell and in the Applications badge
function followUpNotifications() {
  dueFollowUps().forEach(a => {
    const days = daysBetween(lastChange(a));
    logEvent('warn', `Follow up with ${a.company} about ${a.role} — ${days} days since you applied`, '#tracker', { key: `fu:${a.id}:${isoDate()}` });
  });
  apps
    .filter(a => a.stage === 'interview' && a.interviewOn && daysBetween(a.interviewOn) >= -3 && daysBetween(a.interviewOn) <= 0)
    .forEach(a => {
      const d = -daysBetween(a.interviewOn);
      logEvent('info', `Interview with ${a.company} ${d === 0 ? 'today' : `in ${plural(d, 'day')}`} — rehearse your STAR answers`, '#interview', { key: `iv:${a.id}:${isoDate()}` });
    });
  apps
    .filter(a => a.stage === 'saved' && a.deadline && daysBetween(a.deadline) >= -2 && daysBetween(a.deadline) <= 0)
    .forEach(a => {
      const d = -daysBetween(a.deadline);
      logEvent('warn', `${a.company} — ${a.role} closes ${d === 0 ? 'today' : `in ${plural(d, 'day')}`}; you have not applied yet`, '#tracker', { key: `dl:${a.id}:${isoDate()}` });
    });
}

// n-gram set of a text so multi-word skills ("power bi", "rest api") can be matched
function ngramSet(text) {
  const t = tokens(text || '').map(normTok);
  const set = new Set(t);
  for (let i = 0; i < t.length - 1; i++) {
    set.add(t[i] + ' ' + t[i + 1]);
    if (i < t.length - 2) set.add(t[i] + ' ' + t[i + 1] + ' ' + t[i + 2]);
  }
  return set;
}
const phraseKey = p => tokens(p).map(normTok).join(' ');
// where does the resume show this skill? Bullets and stacks count as proof; lists only as claims
function resumeSources(r) {
  const entryText = arr => arr.map(e => [e.role, e.name, e.stack, e.title, ...(e.bullets || [])].join(' ')).join(' ');
  return [
    ['Experience', ngramSet(entryText(r.experience)), true],
    ['Projects', ngramSet(entryText(r.projects) + ' ' + entryText(r.custom.items)), true],
    ['Skills', ngramSet(r.skills.flatMap(g => g.items).join(', ')), false],
    ['Summary', ngramSet(r.summary + ' ' + r.contact.headline), false],
    ['Certifications', ngramSet(r.certifications.map(c => c.name).join(' ') + ' ' + r.education.map(e => e.honours).join(' ')), false]
  ];
}
function skillEvidence(skill, sources) {
  const keys = skill.phrases.map(phraseKey).filter(Boolean);
  const where = sources.filter(([, set]) => keys.some(k => set.has(k)));
  return { where: where.map(([label]) => label), proven: where.some(([, , proof]) => proof) };
}
// proof-weighted match: shown in a bullet/project = full weight, only listed = 70 %
function gapAnalysis(roleKey, r = R) {
  const role = ROLE_PROFILES[roleKey];
  const sources = resumeSources(r);
  const rows = role.skills.map(s => {
    const ev = skillEvidence(s, sources);
    const status = !ev.where.length ? 'miss' : ev.proven ? 'have' : 'listed';
    return { ...s, ...ev, status };
  });
  const core = rows.filter(x => !x.nice);
  const total = sum(core.map(x => x.w));
  const got = sum(core.map(x => (x.status === 'have' ? x.w : x.status === 'listed' ? 0.7 * x.w : 0)));
  return { role, rows, pct: pct(got, total), missingCore: core.filter(x => x.status === 'miss'), niceHave: rows.filter(x => x.nice && x.status !== 'miss').length };
}
// week-by-week plan from the missing skills (core first by weight, then nice-to-have)
function learningPlan(roleKey, analysis, hoursPerWeek) {
  const done = gap.done[roleKey] || {};
  const todo = analysis.rows
    .filter(x => x.status === 'miss')
    .sort((a, b) => Number(a.nice) - Number(b.nice) || b.w - a.w);
  let week = 1;
  return todo.map(s => {
    const [resource, hours] = LEARN[s.name] || LEARN_DEFAULT;
    const weeks = Math.max(1, Math.ceil(hours / hoursPerWeek));
    const item = { skill: s.name, nice: s.nice, resource, hours, from: week, to: week + weeks - 1, done: !!done[s.name] };
    week += weeks;
    return item;
  });
}
function gapResume() {

}

function planHTML(plan, hpw) {

// hand-drawn SVG: every resume version's match for the selected role
function versionsChartSVG(roleKey) {

function addSkillToResume(r, name) {

// every bullet in the resume with its context, for the STAR picker
function bulletPool(r = R) {
  const pool = [];
  r.experience.forEach(e => (e.bullets || []).filter(Boolean).forEach(b => pool.push({ text: b, org: e.company, role: e.role, kind: 'job' })));
  r.projects.forEach(p => (p.bullets || []).filter(Boolean).forEach(b => pool.push({ text: b, org: p.name.replace(/\s*—.*$/, ''), role: '', kind: 'project' })));
  r.custom.items.forEach(c => (c.bullets || []).filter(Boolean).forEach(b => pool.push({ text: b, org: c.sub || c.title, role: c.title, kind: 'activity' })));
  return pool;
}
// relevance = keyword overlap (stems) + a bonus for numbers, which make Results concrete
function rankBullets(q, r = R) {
  const keys = q.keys.map(k => normTok(k).slice(0, 5));
  return bulletPool(r)
    .map(b => {
      const toks = tokens(b.text).map(t => normTok(t).slice(0, 5));
      const hits = keys.filter(k => toks.includes(k)).length;
      return { ...b, score: hits * 2 + (/\d/.test(b.text) ? 1 : 0) };
    })
    .sort((a, b) => b.score - a.score);
}
// split "Built X for Y, cutting Z by 38 %" into action and result clauses
function splitBullet(text) {
  const parts = text.split(/,\s+|;\s+|\s+—\s+/);
  const action = parts[0];
  const rest = parts.slice(1).join(', ');
  if (rest && /\d/.test(rest)) return { action, result: rest };
  if (/\d/.test(action) && !rest) return { action, result: '' };
  return { action: text, result: '' };
}

function resultSentence(result) {

  if (/ing$/i.test(w0)) return `I ${pastOf(w0)}${result.slice(w0.length)}`;
  return lcFirst(result);
}

function composeAnswer(ans) {

function answerMeters(ans) {

function bindInterview(v, q, ans) {
  const persist = () => {
    ans.updated = Date.now();

  };
  v.oninput = e => {

      autoGrow(t);

      if (row) row.classList.toggle('done', isAnswered(q.id));

  };

    renderInterview();
  });
  $('#starCopy').onclick = () => copyText(`${q.q}\n\n${composeAnswer(ans)}`, 'Answer');
  $('#qAdd').onclick = addCustomQuestion;

      store.set('ui', ui);
      return renderInterview();

    const d = e.target.closest('[data-draft]');

function selectQuestion(id) {

function draftInto(q, ans, bullet) {
  if (!bullet) return;
  const apply = () => {
    Object.assign(ans, draftFromBullet(bullet), { bullet: bullet.text, updated: Date.now() });
    saveStar();
    renderInterview();
    logEvent('info', `Drafted a STAR answer for “${truncate(q.q, 60)}”`, '#interview');
    toast('Draft created — replace the [brackets] with your own details', 'ok');
  };
  if (composeAnswer(ans).trim()) confirmModal('Replace your current answer?', 'The four parts will be overwritten with a draft built from this bullet.', apply);
  else apply();
}
function addCustomQuestion() {
  promptModal('Add your own question', '', text => {
    const q = text.trim();
    if (q.length < 8) return toast('Write the full question', 'bad');
    const item = { id: 'c' + uid(), cat: 'custom', role: 'all', q, tip: 'Your own question — answer it with STAR.', keys: tokens(q).filter(t => !STOP.has(t)) };

function exportAnswers() {

let practiceTimer = null;
// TODO(student): voice practice — record the spoken answer with MediaRecorder (getUserMedia audio), store the blob in IndexedDB per question and add a playback list, then estimate filler words with the Web Speech API where available.
function startPractice(prevId) {
  const pool = filteredQuestions().filter(x => x.id !== prevId);
  const q = pool[Math.floor(Math.random() * pool.length)] || allQuestions()[0];
  const total = 120;
  let left = total;
  modalOpen(`<h2>${ic('timer')} Practice round <button class="ib" data-close aria-label="Close">${ic('x')}</button></h2>
    <p class="muted" style="margin:6px 0 0;font-size:.85rem">${Q_CATS[q.cat] || 'Your question'} · answer out loud, then rate yourself.</p>
    <div class="panel" style="margin-top:12px"><h2 style="font-size:1.2rem">${esc(q.q)}</h2>
      <div class="meterrow"><span id="prTime" style="font-family:var(--serif);font-size:1.6rem;color:var(--ink)">2:00</span><div class="bar" style="flex:1;min-width:120px"><i id="prBar" style="width:100%"></i></div></div></div>
    <div id="prAns" class="ans hidden" style="margin-top:12px">${esc(star[q.id] ? composeAnswer(star[q.id]) : '')}</div>
    <div class="mactions"><button class="btn ghost" id="prShow">${ic('eye')} Show my answer</button><span class="spacer"></span>
      ${CONF.slice(1).map((c, i) => `<button class="btn soft" data-rate="${i + 1}">${c}</button>`).join('')}
      <button class="btn acc" id="prNext">${ic('shuffle')} Next</button></div>`);
  clearInterval(practiceTimer);
  practiceTimer = setInterval(() => {
    if (!$('#prTime')) return clearInterval(practiceTimer);
    left = Math.max(0, left - 1);
    $('#prTime').textContent = `${Math.floor(left / 60)}:${pad2(left % 60)}`;
    $('#prBar').style.width = (100 * left) / total + '%';
    if (!left) {
      clearInterval(practiceTimer);
      $('#prTime').classList.add('s-bad');
    }
  }, 1000);
  $('#prShow').onclick = () => $('#prAns').classList.toggle('hidden');
  $('#prNext').onclick = () => startPractice(q.id);
  $('#modal').onclick = e => {
    const r = e.target.closest('[data-rate]');
    if (!r) return;
    const ans = answerOf(q.id);
    ans.conf = +r.dataset.rate;
    ans.practised = (ans.practised || 0) + 1;
    ans.updated = Date.now();
    saveStar();
    logEvent('info', `Practised “${truncate(q.q, 50)}” in ${total - left} s — ${CONF[ans.conf]}`, '#interview');
    toast(`Saved: ${CONF[ans.conf]}`, 'ok');
    startPractice(q.id);
  };
}

// ---------- LinkedIn headline + About generator (cvb:linkedin, per resume version) ----------
const LI_HEADLINE_MAX = 220;
const LI_ABOUT_MAX = 2600;
const TONES = { professional: 'Professional', friendly: 'Friendly', concise: 'Concise' };
let linkedin = store.get('linkedin', {});
const liState = (r = R) => linkedin[r.id] || (linkedin[r.id] = { headline: '', tone: 'professional', about: '', checks: {} });
const saveLinkedIn = () => store.set('linkedin', linkedin);

// facts pulled from the resume once and shared by the generators
function profileFacts(r = R) {
  const c = r.contact;
  const edu = r.education[0] || {};
  const role = (c.headline.split(/[·|]/)[0] || r.experience[0]?.role || 'Graduate').trim();
  const instShort = (edu.institute || '').replace(/\s*\(.*?\)\s*/g, ' ').trim();
  const acronym = /\(([A-Z][A-Z-]+)\)/.exec(edu.institute || '')?.[1] || instShort;
  const skills = topSkills(r)
    .filter(s => !s.soft)
    .map(s => s.name);
  const wins = achievements(r);
  return {
    first: (c.name || '').split(' ')[0] || 'there',
    role,
    degree: edu.degree || '',
    inst: acronym,
    instFull: instShort,
    grade: edu.grade || '',
    city: (c.city || '').split(',')[0],
    skills,
    wins,
    cert: r.certifications[0]?.name || '',
    email: c.email,
    target: r.cover?.job || role
  };
}
// skills ranked by how often the resume text mentions them (evidence beats a long list)
function topSkills(r = R) {
  const text = ngramSet(toTXT(r));
  const body = tokens(allBullets(r).join(' ') + ' ' + r.projects.map(p => p.stack).join(' ')).map(normTok);
  return r.skills
    .flatMap(g => g.items.map(name => ({ name, soft: /soft/i.test(g.group) })))
    .map(s => {
      const key = phraseKey(s.name);
      const first = key.split(' ')[0];
      return { ...s, n: body.filter(t => t === first).length + (text.has(key) ? 1 : 0) };
    })
    .sort((a, b) => b.n - a.n || a.name.localeCompare(b.name));
}
// bullets with numbers, biggest-looking impact first
function achievements(r = R) {
  return allBullets(r)
    .filter(b => /\d/.test(b))
    .map(b => ({ b, score: (b.match(/\d+/g) || []).length + (/%|rs|users|installs|\+/i.test(b) ? 2 : 0) }))
    .sort((a, b) => b.score - a.score)
    .map(x => x.b.replace(/\.\s*$/, ''));
}
const shortWin = s => truncate(s.split(/,\s+/)[0], 70);
function headlineVariants(r = R) {
  const f = profileFacts(r);
  const s3 = f.skills.slice(0, 3).join(', ');
  const s5 = f.skills.slice(0, 5).join(' | ');
  const edu = f.degree && f.inst ? `${f.degree} @ ${f.inst}` : f.degree || f.inst;
  return [
    ['Role + stack + degree', [f.role, s3, edu].filter(Boolean).join(' | ')],
    ['Proof point', `${f.role} · ${f.wins[0] ? shortWin(f.wins[0]) : '[your best result with a number]'}`],
    ['Open to work', `${f.degree ? f.degree + ' graduate' : 'Graduate'}${f.inst ? ' (' + f.inst + ')' : ''} · ${f.role} · Open to ${f.target} roles${f.city ? ' in ' + f.city + ' or remote' : ''}`],
    ['Keyword dense (recruiter search)', [f.role, s5].filter(Boolean).join(' | ')],
    ['Certification led', `${f.role}${f.cert ? ' · ' + f.cert : ''} · ${f.skills.slice(0, 2).join(' & ')}`]
  ].map(([label, text]) => [label, text.replace(/\s+/g, ' ').trim()]);
}
function aboutHook(f, tone) {
  if (tone === 'friendly') return `Hi, I’m ${f.first}. I’m a ${f.role.toLowerCase()} who enjoys turning messy, real-world problems into software people actually use.${f.degree ? ` I studied ${f.degree} at ${f.instFull}${f.grade ? ' (' + f.grade + ')' : ''}.` : ''}`;
  if (tone === 'concise') return `${f.role}${f.degree ? ' · ' + f.degree + ', ' + f.inst : ''}.`;
  return `${f.role} with a ${f.degree || 'degree'} from ${f.instFull || '[institute]'}${f.grade ? ' (' + f.grade + ')' : ''}. I build reliable, well-tested work and measure what it changes.`;
}
function aboutText(r = R, tone = 'professional') {
  const f = profileFacts(r);
  const wins = f.wins.slice(0, tone === 'concise' ? 2 : 3);
  const intro = tone === 'concise' ? 'Highlights:' : tone === 'friendly' ? 'A few things I’m proud of:' : 'Selected results:';
  const paras = [
    aboutHook(f, tone),
    wins.length ? `${intro}\n${wins.map(w => '• ' + w).join('\n')}` : '',
    f.skills.length ? `${tone === 'friendly' ? 'Tools I reach for' : 'Core skills'}: ${f.skills.slice(0, 10).join(', ')}.` : '',
    tone === 'concise' ? '' : `Right now I’m looking for ${f.target} roles${f.city ? ' in ' + f.city + ' or remote' : ''}, ideally in a team that reviews code and ships often.`,
    f.email ? `${tone === 'friendly' ? 'Say hello' : 'Contact'}: ${f.email}` : ''
  ];
  return paras.filter(Boolean).join('\n\n');
}
// profile checklist: some items detected from the resume, the rest ticked by hand
function liChecklist(r, st) {
  const c = r.contact;
  return [
    ['url', 'Custom profile URL (linkedin.com/in/your-name)', /linkedin\.com\/in\/[a-z0-9-]+/i.test(c.linkedin), true],
    ['headline', 'Headline chosen (not just “Student at …”)', !!st.headline, true],
    ['about', 'About section of 3+ short paragraphs', (st.about || '').split(/\n{2,}/).length >= 3, true],
    ['skills', '5+ skills that match your target role', topSkills(r).filter(s => !s.soft).length >= 5, true],
    ['featured', 'Featured: FYP repo, demo or portfolio link', !!(c.github || c.website || r.projects.some(p => p.link)), true],
    ['photo', 'Professional photo (fine on LinkedIn, unlike an ATS resume)', !!st.checks.photo, false],
    ['banner', 'Banner image related to your field', !!st.checks.banner, false],
    ['otw', '“Open to work” set for recruiters only', !!st.checks.otw, false],
    ['recs', 'Two recommendations (supervisor, FYP advisor)', !!st.checks.recs, false]
  ];
}

}

function regenAbout(st, tone) {
  const fresh = aboutText(R, tone);
  const apply = () => {
    st.tone = tone;
    st.about = fresh;
    saveLinkedIn();
    renderLinkedIn();
  };
  const edited = st.about && st.about !== aboutText(R, st.tone);
  if (edited) confirmModal('Replace your edited About?', 'Your edits to the About text will be replaced by a freshly generated version.', apply);
  else apply();
}

function portfolioLinks(c) {
  const items = [
    c.email && `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`,
    c.phone && `<span>${esc(c.phone)}</span>`,

function portfolioProjects(r) {

// ---------- onboarding tour (spotlight) + first-run welcome ----------
// Each step: [selectors tried in order (first visible wins), title, text, icon]
const TOUR = [
  [['#editor'], 'Edit on the left', 'Accordion sections with drag-to-reorder, autosave and a sparkle button on every bullet that suggests stronger wording.', 'edit'],
  [['#pvscroll', '#mviewSeg'], 'Live A4 preview', 'What you see is what prints: real text, single reading order, page-break markers. Switch the CV language to bilingual or Urdu from the preview bar.', 'eye'],
  [['#tplSeg', '#tplSel'], 'Six ATS-safe templates', 'Classic, Modern, Compact, Academic, Minimal and Bold header. All keep one linear DOM so parsers read them correctly.', 'layers'],
  [['#scorePill'], 'ATS score', 'Eleven checks plus a keyword match against a pasted job description, with a fix list sorted by impact.', 'target'],
  [['#exportBtn'], 'Export', 'PDF, plain text for portal forms, Markdown, JSON backups and a portfolio one-pager you can host for free.', 'download'],
  [['#subnav'], 'Beyond the resume', 'Track applications per resume version, find your skills gap, build STAR interview answers from your bullets and generate a LinkedIn profile.', 'columns'],
  [['#bellBtn'], 'Reminders', 'Follow-ups, interview dates and milestones land here and in the Activity log.', 'bell']
];
let tourStep = 0;
function visibleTarget(selectors) {
  for (const s of selectors) {
    const el = $(s);
    if (!el) continue;
    const r = el.getBoundingClientRect();
    if (r.width > 0 && r.height > 0) return el;
  }
  return null;
}
function startTour() {
  if (!/^#?(edit)?$/.test(location.hash) && location.hash !== '#edit') location.hash = '#edit';
  closeDrawer();
  tourStep = 0;
  document.body.classList.add('touring');
  showTourStep();
}
function endTour(completed = false) {
  document.body.classList.remove('touring');
  if (!settings.tourDone) {
    settings.tourDone = true;
    saveSettings();
    if (completed) logEvent('ok', 'Finished the guided tour', '#edit');
  }
}
function placeTourCard(rect) {
  const card = $('#tourCard');
  const pad = 12;
  const cw = card.offsetWidth;
  const ch = card.offsetHeight;
  const below = rect.bottom + pad + ch < window.innerHeight;
  let top = below ? rect.bottom + pad : rect.top - ch - pad;
  if (top < pad) top = Math.max(pad, window.innerHeight - ch - pad);
  const left = Math.min(Math.max(pad, rect.left + rect.width / 2 - cw / 2), window.innerWidth - cw - pad);
  card.style.top = top + 'px';
  card.style.left = left + 'px';
}
function showTourStep() {
  const [sels, title, text, icon] = TOUR[tourStep];
  const el = visibleTarget(sels);
  if (!el) {
    // skip steps whose target is hidden at this screen size
    if (tourStep < TOUR.length - 1) {
      tourStep++;
      return showTourStep();
    }
    return endTour(true);
  }
  const r = el.getBoundingClientRect();
  const m = 6;
  const top = Math.max(4, r.top - m);
  const left = Math.max(4, r.left - m);
  // the spotlight animates, so place the card from the target's final box, not the spot's current one
  const width = Math.min(window.innerWidth - left - 4, r.width + 2 * m);
  const height = Math.min(window.innerHeight - top - 4, r.height + 2 * m);
  Object.assign($('#tourSpot').style, { top: top + 'px', left: left + 'px', width: width + 'px', height: height + 'px' });
  const last = tourStep === TOUR.length - 1;
  $('#tourCard').innerHTML = `<h4>${ic(icon)} ${esc(title)}</h4><p>${esc(text)}</p>
    <div class="acts"><div class="dots">${TOUR.map((_, i) => `<i class="${i === tourStep ? 'on' : ''}"></i>`).join('')}</div>
      <button class="btn sm ghost" data-tour="skip">Skip</button>${tourStep ? `<button class="btn sm soft" data-tour="back">${ic('chevron-left')}</button>` : ''}
      <button class="btn sm acc" data-tour="next">${last ? 'Done' : 'Next'} ${last ? '' : ic('chevron-right')}</button></div>`;
  placeTourCard({ top, left, bottom: top + height, width, height });
  $('#tourCard [data-tour="next"]').focus();
}
$('#tourCard').addEventListener('click', e => {
  const b = e.target.closest('[data-tour]');
  if (!b) return;
  const act = b.dataset.tour;
  if (act === 'skip') return endTour();
  if (act === 'back') tourStep = Math.max(0, tourStep - 1);
  if (act === 'next') {
    if (tourStep === TOUR.length - 1) return endTour(true);
    tourStep++;
  }
  showTourStep();
});
$('#tourScrim').addEventListener('click', () => endTour());
document.addEventListener('keydown', e => {
  if (!document.body.classList.contains('touring')) return;
  if (e.key === 'ArrowRight') $('#tourCard [data-tour="next"]')?.click();
  if (e.key === 'ArrowLeft') $('#tourCard [data-tour="back"]')?.click();
});
window.addEventListener(
  'resize',
  debounce(() => {
    if (document.body.classList.contains('touring')) showTourStep();
  }, 150)
);
// welcome card at the top of the editor until the tour is taken or dismissed
function welcomeHTML() {
  if (settings.welcomeDismissed || settings.tourDone) return '';
  return `<div class="welcome"><div class="tx"><b>New here?</b>A 60-second tour shows the editor, ATS score, export and the job-search tools.</div>
    <button class="btn sm acc" data-act="tour-start">${ic('play')} Take the tour</button><button class="btn sm ghost" data-act="tour-dismiss" aria-label="Dismiss">${ic('x')}</button></div>`;
}
function dismissWelcome() {
  settings.welcomeDismissed = true;
  saveSettings();
  $('#editor .welcome')?.remove();
}

const MODULES = [
  ['edit', 'Resume editor', 'Six ATS-safe templates, live A4 preview, bilingual and Urdu (RTL) CV modes, five sample profiles.'],
  ['ats', 'ATS score', 'Eleven rule checks plus keyword match against a pasted job description.'],

function aboutMainHTML() {
  const a = analysis || analyse();
  const checkRows = a.checks.map(c => `<tr><td>${esc(c.title.replace(/ \d+ %$/, '').replace(/^Length:.*/, 'Length vs years of experience'))}</td><td>${c.max}</td></tr>`).join('');
  const kwRow = a.hasJD ? '' : '<tr><td>Job-description keyword match (after pasting an ad)</td><td>17</td></tr>';
  return `<div class="panel"><h2>About this project</h2><p>Fresh graduates in Pakistan apply with designer templates full of tables, icons and photos that applicant-tracking systems (ATS) cannot parse, add a CNIC number and marital status, and never tailor keywords to the job ad — so strong candidates are filtered out before a human reads the CV. This tool bakes the career office’s advice into the editor and follows the student through the whole job search.</p>
      <h3>Modules</h3><table class="modtbl"><tr><th>Module</th><th>What it does</th></tr>${MODULES.map(([r, n, d]) => `<tr><td><a href="#${r}">${esc(n)}</a></td><td>${esc(d)}</td></tr>`).join('')}</table>
      <h3>How it works</h3><p>Everything is one HTML file with vanilla JavaScript. The resume is a plain JSON model; <code>blocks()</code> shapes it once and the renderers produce the A4 preview (HTML), plain text, Markdown and the portfolio page. Templates are ATS-safe by construction: real headings, a single linear DOM, no tables or text-in-images, print CSS with <code>@page</code> margins. The ATS score runs ${a.checks.length} rule checks plus a keyword match: the job description is tokenised, stop-words removed, 1- and 2-grams counted by frequency and compared with the resume text (plural-insensitive).</p>
      <h3>Pakistani context</h3><p>Local CV habits that hurt in ATS pipelines — photo, CNIC, father's name, date of birth, religion, marital status — are flagged explicitly; phone is pre-formatted +92; the sample profiles mirror FAST, UET, IBA and NUST graduates; the Urdu CV mode serves public-sector and NGO applications that ask for Urdu.</p>
      <p class="urnote" lang="ur" dir="rtl" style="margin-top:8px">اردو موڈ میں سرخیاں نستعلیق میں اور صفحہ دائیں سے بائیں چھپتا ہے۔ بین الاقوامی کمپنیوں کے لیے انگریزی ورژن ہی بھیجیں۔</p>
      <h3>ATS checks and weights</h3><table><tr><th>Check</th><th>Points</th></tr>${checkRows}${kwRow}</table>

// ---------- router ----------
const PAGE_RENDER = {
  cover: () => renderCover(),
  tracker: () => renderTracker(),
  skills: () => renderSkills(),
  interview: () => renderInterview(),
  linkedin: () => renderLinkedIn(),
  settings: () => renderSettings(),
  activity: () => renderActivity(),
  about: () => renderAbout()
};
const ROUTES = ['edit', 'ats', ...Object.keys(PAGE_RENDER)];
function route() {
  const page = (location.hash.slice(1) || 'edit').split('?')[0];
  if (page.startsWith('r/')) return recruiterView(page.slice(2));
  const p = ROUTES.includes(page) ? page : 'edit';
  const editLike = p === 'edit' || p === 'ats';
  document.body.dataset.page = p;
  $('#view-edit').classList.toggle('hidden', !editLike);
  Object.keys(PAGE_RENDER).forEach(k => $('#view-' + k).classList.toggle('hidden', p !== k));
  $('#coverLink').href = p === 'cover' ? '#edit' : '#cover';
  $('#coverLink').innerHTML = p === 'cover' ? `${ic('edit')}<span class="t">Back to editor</span>` : `${ic('mail')}<span class="t">Cover letter</span>`;
  if (p === 'ats') openDrawer();
  else closeDrawer();
  if (PAGE_RENDER[p]) PAGE_RENDER[p]();
  if (editLike) applyZoom();
  if (!editLike && document.body.classList.contains('touring')) endTour();
  closePops();
  renderSubnav();
}
