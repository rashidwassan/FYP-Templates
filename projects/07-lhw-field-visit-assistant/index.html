  const sub = p.status === 'active'
    ? `${gaStr(p.lmp)} · ${t('pg_edd')} ${fmtS(p.edd)}`
    : `${t('pg_' + p.status)}${p.delivery ? ' · ' + fmtS(p.delivery.date) : ''}`;
  let tail = '';
  if (alert) tail = `<span class="chip red">${ic('alert')}</span>`;
  else if (next) tail = chip(next.status);
  else if (p.status === 'active') tail = `<span class="chip green">${ic('check')}</span>`;
  return `<a class="pitem ${selId === p.id ? 'on' : ''}" href="#pregnancy/${p.id}"><div class="av">${avatar(w.name)}</div><div class="t"><b>${esc(w.name)}</b><span>${sub}</span></div>${tail}</a>`;
}

function pregnancyList(selId) {
  const ps = DB.pregnancies.slice().sort((a, b) => (a.status === 'active' ? 0 : 1) - (b.status === 'active' ? 0 : 1) || (a.edd < b.edd ? -1 : 1));
  return ps.length ? ps.map(p => pregnancyItem(p, selId)).join('') : `<div class="card muted">${t('pg_none')}</div>`;
}

function renderPregnancies(id, sub, vid) {
  const p = id ? byId('pregnancies', id) : null;
  view.innerHTML = pagehead(t('pg_title'), t('pg_lead')) + `<div class="split ${id ? 'detail-open' : ''}"><div class="col-list"><div class="plist stagger">${pregnancyList(id)}</div></div><div class="col-detail" id="pgDetail"></div></div>`;
  const det = $('#pgDetail');
  if (!p) {
    det.innerHTML = emptyCard('heart', t('pg_pick'), 'var(--orange)');
    return;
  }
  const forms = { visit: renderAncForm, pnc: renderPncForm, delivery: renderDeliveryForm, plan: renderBirthPlan };
  if (sub === 'slip') renderSlip(det, p, vid);
  else if (forms[sub]) forms[sub](det, p);
  else renderPregnancyDetail(det, p);
}

function pregHeadCard(p, w, h, risks, last) {
  const statusChip = `<span class="chip ${p.status === 'active' ? 'orange' : p.status === 'delivered' ? 'green' : ''} lg">${t('pg_' + p.status)}</span>`;
  let meta = '';
  if (p.status === 'active') meta = `<span class="chip teal lg">${ic('clock')} ${gaStr(p.lmp)}</span><span class="chip lg">${t('pg_edd')} ${fmtD(p.edd)}</span>`;
  else if (p.delivery) meta = `<span class="chip lg">${t('pg_date')} ${fmtD(p.delivery.date)} · ${esc(p.delivery.place)}</span>`;
  const riskChip = risks.length ? `<span class="chip red lg">${ic('alert')} ${t('pg_highrisk')}</span>` : '';
  let actions = '';
  if (p.status === 'active') {
    actions += `<a class="btn" href="#pregnancy/${p.id}/visit">${ic('stethoscope')} ${t('pg_newVisit')}</a><a class="btn ghost" href="#pregnancy/${p.id}/plan">${ic('clipboard')} ${t('bp_title')}</a><a class="btn teal" href="#pregnancy/${p.id}/delivery">${ic('baby')} ${t('pg_delivery')}</a>`;
  }
  if (p.status === 'delivered') {
    actions += `<a class="btn" href="#pregnancy/${p.id}/pnc">${ic('baby')} ${t('pg_pnc')}</a>`;
    const child = p.delivery?.childId && byId('children', p.delivery.childId);
    if (child) actions += `<a class="btn ghost" href="#children/${child.id}">${ic('shield-check')} ${esc(child.name)}</a>`;
    actions += `<a class="btn ghost" href="#fp/${w.id}">${ic('pill')} ${t('nav_fp')}</a>`;
  }
  if (last && last.referral) actions += `<a class="btn ghost" href="#pregnancy/${p.id}/slip/${last.id}">${ic('printer')} ${t('pg_slip')}</a>`;
  return `<div class="card"><div class="detailhead"><div class="big">${avatar(w.name)}</div><div style="flex:1;min-width:0"><div class="eyebrow">${esc(h.head)} · ${esc(h.mohalla)}</div><h2>${esc(w.name)} <span class="muted" style="font-size:1rem;font-weight:400">· ${w.age} ${bi({ en: 'years', ur: 'سال' })} · G${p.gravida} P${p.para}</span></h2>
      <div class="meta">${statusChip}${meta}${riskChip}</div></div></div>
      <div class="actions no-print">${actions}</div></div>`;
}

function riskCard(risks) {
  const chips = risks.map(r => {
    const o = RISKS.find(x => x.id === r);
    return `<span class="chip red lg wrap" title="${esc(o.ur)}">${esc(o.en)} · <span class="ur" style="display:inline;line-height:1.4">${esc(o.ur)}</span></span>`;
  }).join('');
  return `<div class="card"><h3>${ic('alert-circle')} ${t('pg_risk')}<button class="btn ghost sm no-print" id="editRisk" style="margin-left:auto">${ic('edit')} ${t('edit')}</button></h3>${risks.length ? `<div style="display:flex;gap:8px;flex-wrap:wrap">${chips}</div>` : `<div class="muted small">${t('pg_risk_none')}</div>`}</div>`;
}

function scheduleCard(p, sch) {
  const rows = sch.map(c => {
    const when = c.visit ? `${fmtD(c.visit.date)} · ${gaStr(p.lmp, c.visit.date)}` : fmtD(c.dueDate);
    const who = c.who ? `${t('pg_who')} ${c.who}` : '';
    const pk = c.pk ? `<span class="chip orange" style="padding:1px 7px">${t('pg_pk')} ${c.pk}</span>` : '';
    const readings = c.visit ? ` · BP ${c.visit.sys}/${c.visit.dia}${c.visit.hb ? ' · Hb ' + c.visit.hb : ''}` : '';
    return `<div class="c ${c.status}"><div class="wk">${c.wk}<small>wk</small></div><div style="min-width:0"><b>${when}</b><div class="small muted">${who}${who && pk ? ' · ' : ''}${pk}${readings}</div></div>${chip(c.status)}</div>`;
  }).join('');
  return `<div class="card"><h3>${ic('calendar')} ${t('pg_schedule')}</h3><div class="tl stagger">${rows}</div></div>`;
}

function pncCard(pn) {
  const rows = pn.map(s => {
    let sub;
    if (s.visit) {
      const n = s.visit.motherSigns.length + s.visit.babySigns.length;
      sub = n ? `${n} ${t('pg_signs')}` : t('pg_noSigns');
    } else {
      sub = relDays(s.dueDate);
    }
    return `<div class="c ${s.status}"><div class="wk">${s.day}<small>${t('pg_day')}</small></div><div><b>${s.visit ? fmtD(s.visit.date) : fmtD(s.dueDate)}</b><div class="small muted">${sub}</div></div>${chip(s.status)}</div>`;
  }).join('');
  return `<div class="card"><h3>${ic('baby')} ${t('pg_pncSchedule')}</h3><div class="tl stagger">${rows}</div></div>`;
}

function visitRow(p, v) {
  const a = assessAnc(p, v);
  const readings = [`BP <b>${v.sys}/${v.dia}</b>`, v.weight && `${v.weight} kg`, v.hb && `Hb <b>${v.hb}</b>`, v.fh && `FH ${v.fh} cm`, `FM ${t('v_' + (v.fm || 'na'))}`, v.tt, v.iron && 'Fe/FA'].filter(Boolean).join(' · ');
  const signs = v.signs.length ? `<div class="small" style="margin-top:4px;color:var(--red)">${v.signs.map(s => esc(PREG_DANGER.find(x => x.id === s)?.en || s)).join(' · ')}</div>` : '';
  const complaints = v.complaints ? `<div class="small muted" style="margin-top:2px">${esc(v.complaints)}</div>` : '';
  const flags = a.flags.map(f => `<span class="chip ${f.cls}">${ic('alert')}</span>`).join('');
  const slip = v.referral ? `<a class="btn ghost sm" href="#pregnancy/${p.id}/slip/${v.id}">${ic('printer')} ${t('pg_slip')}</a>` : `<span class="chip green">${ic('check')}</span>`;
  return `<div class="row" style="align-items:flex-start;flex-wrap:wrap"><div style="min-width:0;flex:1"><b>${fmtD(v.date)}</b> <span class="muted">· ${gaStr(p.lmp, v.date)}</span><div class="small" style="margin-top:4px">${readings}</div>${signs}${complaints}</div><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${flags}${slip}<button class="btn danger sm no-print" data-delv="${v.id}" aria-label="${t('delete')}">${ic('trash')}</button></div></div>`;
}

function bplanSummaryCard(p) {
  if (p.status !== 'active') return '';
  const b = DB.bplans.find(x => x.pregnancyId === p.id);
  const score = b ? bplanScore(b) : 0;
  const bar = `<div style="display:flex;align-items:center;gap:12px;margin-top:6px"><div class="progress" style="flex:1"><i class="${score === BP_TOTAL ? 'green' : score >= BP_TOTAL / 2 ? '' : 'amber'}" data-grow="${Math.round((score / BP_TOTAL) * 100)}%" style="width:0"></i></div><b style="white-space:nowrap">${score}/${BP_TOTAL} ${t('bp_ready')}</b></div>`;
  return `<div class="card"><h3>${ic('clipboard')} ${t('bp_title')}<a class="btn ghost sm no-print" href="#pregnancy/${p.id}/plan" style="margin-left:auto">${ic(b ? 'edit' : 'plus')} ${b ? t('edit') : t('bp_save')}</a></h3>${b ? bar + `<div class="small muted" style="margin-top:8px">${t('bp_place')}: <b>${esc(b.place || '—')}</b> · ${t('bp_transport')}: ${esc(b.transport || '—')}</div>` : `<div class="muted small">${t('bp_none')}</div>`}</div>`;
}

function renderPregnancyDetail(det, p) {
  const w = womanOf(p);
  const h = hhOf(w);
  const risks = riskList(p);
  const sch = schedule(p);
  const vs = visitsOf(p).slice().reverse();
  const pn = pncSchedule(p);
  const last = vs[0];
  const alert = last && last.referral && diffDays(last.date, T_ISO) <= 14;
  const alertHtml = alert
    ? `<div class="alert red" style="margin:14px 0">${ic('siren', 'lg')}<div><b>${esc(URG[last.referral.urg].en)} · ${fmtS(last.date)} · ${esc(destName(last.referral.dest))}</b><div class="small">${esc(last.referral.reason)}</div><div class="ur">${esc(URG[last.referral.urg].ur)}</div></div></div>`
    : '';
  det.innerHTML = backBtn('#pregnancy') + pregHeadCard(p, w, h, risks, last) + alertHtml + riskCard(risks) + bplanSummaryCard(p) +
    (p.status === 'active' || vs.length ? scheduleCard(p, sch) : '') +
    (p.delivery ? pncCard(pn) : '') +
    `<div class="card"><h3>${ic('list')} ${t('pg_history')}</h3>${vs.length ? `<div class="list stagger">${vs.map(v => visitRow(p, v)).join('')}</div>` : `<div class="muted small">${t('pg_noVisits')}</div>`}</div>`;
  requestAnimationFrame(() => animateBars(det));
  $('#editRisk').onclick = () => openRiskSheet(det, p);
  $$('[data-delv]').forEach(b => (b.onclick = () => {
    if (!confirm(t('delete') + '?')) return;
    remove('anc', b.dataset.delv);
    renderPregnancyDetail(det, p);
  }));
}

function openRiskSheet(det, p) {
  const html = sheetHead(t('pg_risk')) + `<div class="checks">${checklist(RISKS.filter(r => r.id !== 'age'), p.risks || [], 'teal', 'risk')}</div>
    <div class="cols" style="margin-top:8px">${field(t('pg_lmp'), `<input id="eLmp" type="date" value="${p.lmp}" max="${T_ISO}">`)}${field(t('pg_gravida'), `<input id="eG" type="number" min="1" value="${p.gravida}">`)}${field(t('pg_para'), `<input id="eP" type="number" min="0" value="${p.para}">`)}</div>
    <div class="actions"><button class="btn block" id="eSave">${ic('check')} ${t('save')}</button></div>`;
  openSheet(html, s => {
    wireChecks(s);
    $('#eSave', s).onclick = () => {
      const lmp = $('#eLmp', s).value;
      if (!lmp || lmp > T_ISO) return toast(t('pg_lmp'), 'bad');
      put('pregnancies', Object.assign(p, { risks: picked(s, 'risk'), lmp, edd: eddOf(lmp), gravida: +$('#eG', s).value || 1, para: +$('#eP', s).value || 0 }));
      closeSheet();
      toast(t('pg_saved'), 'ok');
      renderPregnancyDetail(det, p);
    };
  });
}

// ---- ANC visit form with live assessment ----
function ancFormHtml(p, w) {
  return backBtn(`#pregnancy/${p.id}`) + `<div class="two"><div class="card"><h3>${ic('stethoscope')} ${t('v_title')} — ${esc(w.name)} <span class="chip teal">${gaStr(p.lmp)}</span></h3>
      <div class="cols">${field(t('v_date'), `<input id="vDate" type="date" value="${T_ISO}" max="${T_ISO}" min="${p.lmp}">`)}${field(t('v_weight'), `<input id="vWt" type="number" step=".1" min="30" max="150" inputmode="decimal">`)}</div>
      <label class="f">${t('v_bp')}</label><div class="cols tight"><input id="vSys" type="number" min="60" max="250" placeholder="${t('v_sys')}" inputmode="numeric" aria-label="${t('v_sys')}"><input id="vDia" type="number" min="30" max="150" placeholder="${t('v_dia')}" inputmode="numeric" aria-label="${t('v_dia')}"></div>
      <div class="cols">${field(t('v_hb'), `<input id="vHb" type="number" step=".1" min="3" max="18" inputmode="decimal">`)}${field(t('v_fh'), `<input id="vFh" type="number" min="10" max="50" inputmode="numeric">`)}</div>
      <label class="f">${t('v_fm')}</label><div class="seg" id="vFm"><button data-v="yes">${t('v_yes')}</button><button data-v="no">${t('v_no')}</button><button data-v="na" class="on">${t('v_na')}</button></div>
      <label class="f">${t('v_complaints')}</label><div style="display:flex;gap:8px"><input id="vComp" type="text" maxlength="200"><button class="btn ghost" id="vVoice" aria-label="${t('v_voice')}" title="${t('v_voice')}">${ic('mic')}</button></div>
      <label class="f" style="color:var(--red)">${ic('alert')} ${t('v_danger')}</label><div class="checks" id="vSigns">${checklist(PREG_DANGER, [], '', 'sign')}</div>
      <div class="cols">${field(t('v_tt'), `<select id="vTt"><option value="">${t('v_ttNone')}</option>${['TT1', 'TT2', 'TT3', 'TT4', 'TT5'].map(x => `<option>${x}</option>`).join('')}</select>`)}<div><label class="f">${t('v_iron')}</label><label class="check ok teal" style="min-height:48px"><input type="checkbox" id="vIron" checked><span class="en">${t('v_iron')}</span></label></div></div>
      <label class="f">${t('v_counsel')}</label><div class="checks" id="vCounsel">${checklist(COUNSEL_ANC, [], 'ok', 'counsel')}</div>
    </div>
    <div style="position:sticky;top:14px"><div class="card" id="vAssess"></div><div class="actions"><button class="btn block" id="vSave" style="font-size:1.1rem;min-height:56px">${ic('check')} ${t('v_save')}</button></div></div></div>`;
}

function renderAncForm(det, p) {
  const w = womanOf(p);
  det.innerHTML = ancFormHtml(p, w);
  let fm = 'na';
  let urgOverride = null;
  let destTouched = false; // follow destFor(urg) until the LHW picks a destination
  const draft = () => ({
    date: $('#vDate').value,
    sys: +$('#vSys').value || 0,
    dia: +$('#vDia').value || 0,
    weight: +$('#vWt').value || null,
    hb: $('#vHb').value === '' ? null : +$('#vHb').value,
    fh: +$('#vFh').value || null,
    fm,
    complaints: $('#vComp').value.trim(),
    signs: picked(det, 'sign'),
    tt: $('#vTt').value,
    iron: $('#vIron').checked,
    counsel: picked(det, 'counsel')
  });
  const assess = () => {
    const v = draft();
    const a = assessAnc(p, v);
    const urg = urgOverride ?? a.urg;
    const curDest = $('#vDest')?.value;
    const curReason = $('#vReason')?.value;
    const flagsHtml = a.flags.length
      ? `<div class="list stagger">${a.flags.map(f => `<div class="alert ${f.cls}">${ic(f.cls === 'red' ? 'siren' : 'alert')}<div><b>${esc(f.en)}</b><div class="ur">${esc(f.ur)}</div></div></div>`).join('')}</div>`
      : `<div class="note">${ic('check-circle')} ${t('v_noFlags')}</div>`;
    const urgLabels = [t('v_urgNone'), t('v_urgNext'), t('v_urgSame'), t('v_urgEmerg')];
    const autoReason = [...a.flags.map(f => f.en.split(' — ')[0].split('. ')[0]), ...v.signs.map(s => PREG_DANGER.find(x => x.id === s)?.en)].filter(Boolean).join('; ');
    const referralHtml = urg
      ? `<div class="cols">${field(t('v_refTo'), destSelect('vDest', DEST, destTouched && curDest ? curDest : destFor(urg)))}</div>${field(t('v_refReason'), `<textarea id="vReason" rows="2" maxlength="300">${esc(curReason ?? autoReason)}</textarea>`)}`
      : '';
    $('#vAssess').innerHTML = `<h3>${ic('activity')} ${t('v_assess')}</h3>${flagsHtml}
      <label class="f">${t('v_referral')}</label>${urgBanner(urg)}
      <div class="seg" id="vUrg" style="margin-top:8px">${[0, 1, 2, 3].map(u => `<button data-u="${u}" class="${u === urg ? 'on' : ''}">${urgLabels[u]}</button>`).join('')}</div>${referralHtml}`;
    $('#vDest')?.addEventListener('change', () => (destTouched = true));
    $$('#vUrg button').forEach(b => (b.onclick = () => {
      urgOverride = +b.dataset.u;
      assess();
    }));
  };
  const reset = () => {
    urgOverride = null;
    assess();
  };
  $$('#vFm button').forEach(b => (b.onclick = () => {
    $$('#vFm button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    fm = b.dataset.v;
    reset();
  }));
  $$('#vSys,#vDia,#vHb,#vFh,#vDate,#vWt').forEach(el => el.addEventListener('input', reset));
  wireChecks($('#vSigns'), reset);
  wireChecks($('#vCounsel'));
  // TODO(student): Urdu / Sindhi voice input. Use the Web Speech API (webkitSpeechRecognition, lang 'ur-PK') or an offline Vosk model to dictate complaints and notes; fall back to this toast when unsupported.
  $('#vVoice').onclick = () => toast('Voice input is a student extension (see About)', '', 'mic');
  $('#vSave').onclick = () => saveAncVisit(p, w, draft(), urgOverride);
  assess();
}

function saveAncVisit(p, w, v, urgOverride) {
  if (!v.date || v.date > T_ISO || v.date < p.lmp) return toast(t('v_needDate'), 'bad');
  if (!v.sys || !v.dia) return toast(t('v_bp'), 'bad');
  const a = assessAnc(p, v);
  const urg = urgOverride ?? a.urg;
  v.referral = urg ? { urg, dest: $('#vDest').value, reason: $('#vReason').value.trim() } : null;
  const rec = put('anc', Object.assign(v, { pregnancyId: p.id }));
  // iron-folate handed over at the visit comes out of the LHW kit (30 tablets per month)
  if (v.iron) dispense('ifa', 30, `ANC visit · ${w.name}`);
  toast(v.referral ? t('v_savedRef') : t('v_saved'), 'ok');
  location.hash = v.referral ? `pregnancy/${p.id}/slip/${rec.id}` : `pregnancy/${p.id}`;
}

// ---- Postnatal visit form ----
function renderPncForm(det, p) {
  const w = womanOf(p);
  const sch = pncSchedule(p);
  const next = sch.find(s => s.status !== 'done') || sch[sch.length - 1];
  const baby = p.delivery?.childId && byId('children', p.delivery.childId);
  const presetSmall = baby && baby.birthWeight && baby.birthWeight < 2.5 && ageDays(baby) < 28 ? ['small'] : [];
  const babyHtml = p.delivery.outcome === 'live'
    ? `<label class="f" style="color:var(--red)">${ic('alert')} ${t('v_newborn')}${baby ? ` — ${esc(baby.name)}` : ''}</label><div class="checks" id="nBaby">${checklist(NB_DANGER, presetSmall, '', 'bsign')}</div>
       <label class="f">${t('v_bf')}</label><div class="seg" id="nBf"><button data-v="yes" class="on">${t('v_yes')}</button><button data-v="no">${t('v_no')}</button></div>`
    : '';
  det.innerHTML = backBtn(`#pregnancy/${p.id}`) + `<div class="two"><div class="card"><h3>${ic('baby')} ${t('v_pncTitle')} — ${esc(w.name)}</h3>
      <div class="cols">${field(t('v_pncDay'), `<select id="nDay">${PNC_DAYS.map(d => `<option value="${d}" ${d === next.day ? 'selected' : ''}>${t('pg_day')} ${d} · ${fmtS(iso(addDays(p.delivery.date, d)))}</option>`).join('')}</select>`)}${field(t('v_date'), `<input id="nDate" type="date" value="${T_ISO}" max="${T_ISO}" min="${p.delivery.date}">`)}</div>
      <label class="f" style="color:var(--red)">${ic('alert')} ${t('v_mother')}</label><div class="checks" id="nMother">${checklist(PNC_DANGER, [], '', 'msign')}</div>
      ${babyHtml}
      <label class="f">${t('v_counsel')}</label><div class="checks" id="nCounsel">${checklist(COUNSEL_PNC, [], 'ok', 'counsel')}</div></div>
    <div style="position:sticky;top:14px"><div class="card" id="nAssess"></div><div class="actions"><button class="btn block" id="nSave" style="font-size:1.1rem;min-height:56px">${ic('check')} ${t('v_save')}</button></div></div></div>`;
  let bf = 'yes';
  let destTouched = false;
  const urgNow = (ms, bs) => Math.max(assessSigns(PNC_DANGER, ms), assessSigns(NB_DANGER, bs), bf === 'no' ? 2 : 0);
  const assess = () => {
    const urg = urgNow(picked(det, 'msign'), picked(det, 'bsign'));
    const cur = $('#nDest')?.value;
    $('#nAssess').innerHTML = `<h3>${ic('activity')} ${t('v_assess')}</h3>${urgBanner(urg)}${urg ? `<div class="cols">${field(t('v_refTo'), destSelect('nDest', DEST, cur || destFor(urg)))}</div>` : ''}`;
  };
  wireChecks(det, assess);
  if ($('#nBf')) segControl($('#nBf'), 'yes', v => {
    bf = v;
    assess();
  });
  $('#nSave').onclick = () => savePncVisit(det, p, baby, bf, urgNow);
  assess();
}

function savePncVisit(det, p, baby, bf, urgNow) {
  const date = $('#nDate').value;
  if (!date || date > T_ISO || date < p.delivery.date) return toast(t('v_needDate'), 'bad');
  const ms = picked(det, 'msign');
  const bs = picked(det, 'bsign');
  const urg = urgNow(ms, bs);
  const reason = [
    ...ms.map(s => PNC_DANGER.find(x => x.id === s).en),
    ...bs.map(s => 'Baby: ' + NB_DANGER.find(x => x.id === s).en),
    bf === 'no' ? 'Baby not breastfeeding well' : ''
  ].filter(Boolean).join('; ');
  const rec = put('pnc', { pregnancyId: p.id, day: +$('#nDay').value, date, motherSigns: ms, babySigns: bs, bf, counsel: picked(det, 'counsel'), referral: urg ? { urg, dest: $('#nDest').value, reason } : null });
  if (baby && bs.length) {
    baby.checks = baby.checks || [];
    baby.checks.push({ date, signs: bs, urg });
    put('children', baby);
  }
  toast(urg ? t('v_savedRef') : t('v_saved'), 'ok');
  location.hash = urg ? `pregnancy/${p.id}/slip/${rec.id}` : `pregnancy/${p.id}`;
}

// ---- Delivery outcome: creates the child, starts the PNC schedule, logs the birth / stillbirth ----
function renderDeliveryForm(det, p) {
  const w = womanOf(p);
  det.innerHTML = backBtn(`#pregnancy/${p.id}`) + `<div class="card" style="max-width:640px"><h3>${ic('baby')} ${t('pg_delivery')} — ${esc(w.name)}</h3>
    <div class="cols">${field(t('pg_date'), `<input id="dDate" type="date" value="${T_ISO}" max="${T_ISO}" min="${p.lmp}">`)}${field(t('pg_outcome'), `<select id="dOut"><option value="live">${t('pg_live')}</option><option value="still">${t('pg_still')}</option><option value="lost">${t('pg_lostPreg')}</option></select>`)}</div>
    <div class="cols">${field(t('pg_place'), `<select id="dPlace"><option value="Home">${t('pg_home')}</option><option value="BHU">BHU</option><option value="RHC">RHC</option><option value="DHQ">DHQ</option><option value="Private">Private</option></select>`)}${field(t('pg_mode'), `<select id="dMode"><option value="normal">${t('pg_normal')}</option><option value="csec">${t('pg_csec')}</option></select>`)}</div>
    <div id="dBaby"><div class="cols">${field(t('pg_babyName'), `<input id="dName" type="text" maxlength="60" placeholder="${bi({ en: 'Baby of', ur: 'بچہ' })} ${esc(w.name)}">`)}${field(t('pg_babySex'), `<select id="dSex"><option value="boy">${t('boy')}</option><option value="girl">${t('girl')}</option></select>`)}${field(t('hh_bw'), `<input id="dBw" type="number" step=".1" min=".5" max="6" inputmode="decimal">`)}</div></div>
    <div class="actions"><button class="btn" id="dSave">${ic('check')} ${t('save')}</button><a class="btn ghost" href="#pregnancy/${p.id}">${t('cancel')}</a></div></div>`;
  $('#dOut').onchange = e => $('#dBaby').classList.toggle('hidden', e.target.value === 'lost');
  $('#dSave').onclick = () => saveDelivery(p, w);
}

function saveDelivery(p, w) {
  const date = $('#dDate').value;
  const out = $('#dOut').value;
  if (!date || date > T_ISO || date < p.lmp) return toast(t('v_needDate'), 'bad');
  const place = $('#dPlace').value;
  const mode = $('#dMode').value;
  const sex = $('#dSex').value;
  const babyName = $('#dName').value.trim() || `${bi({ en: 'Baby of', ur: 'بچہ' })} ${w.name}`;
  let childId = null;
  if (out === 'live') {
    const bw = +$('#dBw').value || null;
    const c = put('children', { householdId: w.householdId, motherId: w.id, name: babyName, dob: date, sex, birthWeight: bw, weights: bw ? [{ date, kg: bw }] : [], immunizations: {}, checks: [], supplements: {} });
    childId = c.id;
  }
  const risks = new Set(p.risks || []);
  if (out === 'still') risks.add('still');
  if (mode === 'csec') risks.add('csec');
  put('pregnancies', Object.assign(p, { status: out === 'lost' ? 'lost' : 'delivered', risks: [...risks], delivery: { date, place, mode, outcome: out, childId } }));
  // every birth or stillbirth goes into the registration log automatically
  if (out !== 'lost') {
    put('vitals', { type: out === 'live' ? 'birth' : 'still', name: babyName, date, sex, place, householdId: w.householdId, childId, motherName: w.name, status: 'recorded', statusDates: { recorded: T_ISO }, notes: '' });
  }
  toast(t('pg_deliverySaved'), 'ok');
  location.hash = `pregnancy/${p.id}`;
}

// ---- Birth-preparedness plan ----
function bplanScore(b) {
  const filled = BP_FIELDS.filter(f => b[f.id] !== '' && b[f.id] != null && b[f.id] !== 0).length;
  const checked = BP_CHECKS.filter(c => b.checks?.[c.id]).length;
  return filled + checked;
}

function renderBirthPlan(det, p) {
  const w = womanOf(p);
  const b = DB.bplans.find(x => x.pregnancyId === p.id) || { pregnancyId: p.id, checks: {} };
  const fieldHtml = f => {
    if (f.type === 'select') return field(t(f.key), `<select id="bp_${f.id}"><option value="">—</option>${f.options.map(o => `<option ${b[f.id] === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`);
    if (f.type === 'number') return field(t(f.key), `<input id="bp_${f.id}" type="number" min="0" step="100" value="${esc(b[f.id] ?? '')}" inputmode="numeric">`);
    return field(t(f.key), `<input id="bp_${f.id}" type="text" maxlength="120" value="${esc(b[f.id] || '')}">`);
  };
  const score = bplanScore(b);
  det.innerHTML = backBtn(`#pregnancy/${p.id}`) + `<div class="card" style="max-width:720px"><h3>${ic('clipboard')} ${t('bp_title')} — ${esc(w.name)} <span class="chip teal">${gaStr(p.lmp)} · ${t('pg_edd')} ${fmtS(p.edd)}</span></h3>
    <p class="muted small" style="margin:0 0 6px">${t('bp_lead')}</p>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px"><div class="progress" style="flex:1"><i id="bpBar" class="${score === BP_TOTAL ? 'green' : ''}" style="width:${Math.round((score / BP_TOTAL) * 100)}%"></i></div><b id="bpScore" style="white-space:nowrap">${score}/${BP_TOTAL} ${t('bp_ready')}</b></div>
    <div class="cols">${BP_FIELDS.map(fieldHtml).join('')}</div>
    <label class="f">${t('bp_arranged')}</label><div class="checks">${checklist(BP_CHECKS, Object.keys(b.checks || {}).filter(k => b.checks[k]), 'ok', 'bpc')}</div>
    <div class="actions no-print"><button class="btn" id="bpSave">${ic('check')} ${t('bp_save')}</button><button class="btn ghost" onclick="window.print()">${ic('printer')} ${t('print')}</button></div></div>`;
  const read = () => {
    const out = { pregnancyId: p.id, checks: {} };
    BP_FIELDS.forEach(f => {
      const v = $('#bp_' + f.id).value.trim();
      out[f.id] = f.type === 'number' ? +v || 0 : v;
    });
    BP_CHECKS.forEach(c => (out.checks[c.id] = picked(det, 'bpc').includes(c.id)));
    return out;
  };
  const live = () => {
    const s = bplanScore(read());
    $('#bpBar').style.width = `${Math.round((s / BP_TOTAL) * 100)}%`;
    $('#bpBar').className = s === BP_TOTAL ? 'green' : '';
    $('#bpScore').textContent = `${s}/${BP_TOTAL} ${t('bp_ready')}`;
  };
  $$('input,select', det).forEach(el => el.addEventListener('input', live));
  wireChecks(det, live);
  $('#bpSave').onclick = () => {
    put('bplans', Object.assign(b, read()));
    toast(t('bp_saved'), 'ok');
    location.hash = `pregnancy/${p.id}`;
  };
}

// ---- Referral slip for ANC / PNC visits ----
function renderSlip(det, p, vid) {
  const v = byId('anc', vid) || byId('pnc', vid);
  const w = womanOf(p);
  const h = hhOf(w);
  if (!v || !v.referral) {
    det.innerHTML = backBtn(`#pregnancy/${p.id}`) + `<div class="card muted">${t('s_none')}</div>`;
    return;
  }
  const r = v.referral;
  const isAnc = 'sys' in v;
  const signs = isAnc
    ? v.signs.map(s => PREG_DANGER.find(x => x.id === s)).filter(Boolean)
    : [...v.motherSigns.map(s => PNC_DANGER.find(x => x.id === s)), ...v.babySigns.map(s => NB_DANGER.find(x => x.id === s))].filter(Boolean);
  const findings = isAnc
    ? [`BP ${v.sys}/${v.dia} mmHg`, v.weight && `${v.weight} kg`, v.hb && `Hb ${v.hb} g/dL`, v.fh && `FH ${v.fh} cm`, `FM: ${t('v_' + (v.fm || 'na'))}`, v.complaints].filter(Boolean)
    : [`${t('pg_day')} ${v.day} ${bi({ en: 'postnatal', ur: 'زچگی بعد' })}`, `${t('v_bf')} ${t('v_' + v.bf)}`];
  const risks = riskList(p).map(x => RISKS.find(y => y.id === x).en).join(', ');
  const stageRow = isAnc
    ? [t('s_ga'), `${gaStr(p.lmp, v.date)} · ${t('pg_edd')} ${fmtD(p.edd)}${risks ? ` · ${t('pg_risk')}: ${esc(risks)}` : ''}`]
    : [t('pg_date'), `${fmtD(p.delivery.date)} · ${esc(p.delivery.place)} · ${t('pg_' + p.delivery.mode)}`];
  const rows = [
    [t('s_patient'), `<b>${esc(w.name)}</b>, ${t('s_age')} ${w.age} · G${p.gravida} P${p.para}`],
    [t('s_household'), `${esc(h.head)}, ${esc(h.mohalla)}${h.phone ? ' · ' + esc(h.phone) : ''}`],
    stageRow,
    [t('s_findings'), findings.map(esc).join(' · ')]
  ];
  const smsText = `REFERRAL ${URG[r.urg].en.split(' — ')[0]}: ${w.name} (${w.age}y) ${isAnc ? 'GA ' + gaStr(p.lmp, v.date) : 'PNC day ' + v.day}, ${findings.join(', ')}. Reason: ${r.reason}. To ${destName(r.dest)}. LHW ${profile.name} ${profile.code} ${fmtS(v.date)}`;
  det.innerHTML = backBtn(`#pregnancy/${p.id}`) + slipActions('sSms') + slipArticle({ date: v.date, urg: r.urg, rows, signs, reason: r.reason, dest: r.dest });
  // TODO(student): SMS referral. Send smsText to the Lady Health Supervisor / receiving facility through an SMS gateway (e.g. a Twilio/Telenor API behind your backend) and log delivery status on the visit record.
  $('#sSms').onclick = () => shareSlip(smsText);
}

// ---------- Children: immunization card, growth chart, newborn check ----------
function childItem(c, selId) {
  const g = vaxGroups(c);
  const od = g.filter(x => x.status === 'overdue').length;
  const du = g.filter(x => x.status === 'due').length;
  const lw = lastWeight(c);
  const st = lw && growthStatus(c, lw);
  let tail;
  if (od) tail = `<span class="chip red">${od}</span>`;
  else if (du) tail = `<span class="chip amber">${du}</span>`;
  else if (st && st.cls === 'red') tail = `<span class="chip red">${ic('scale')}</span>`;
  else tail = `<span class="chip green">${ic('check')}</span>`;
  return `<a class="pitem ${selId === c.id ? 'on' : ''}" href="#children/${c.id}"><div class="av ${c.sex}">${ic('baby')}</div><div class="t"><b>${esc(c.name)}</b><span>${t(c.sex)} · ${ageStr(c)} · ${esc(hhOf(c).head)}</span></div>${tail}</a>`;
}

function renderChildren(id) {
  const kids = DB.children.slice().sort((a, b) => (a.dob < b.dob ? 1 : -1));
  const sel = id ? byId('children', id) : null;
  const list = kids.length ? kids.map(c => childItem(c, sel && sel.id)).join('') : `<div class="card muted">${t('ch_none')}</div>`;
  view.innerHTML = pagehead(t('ch_title'), t('ch_lead')) + `<div class="split ${id ? 'detail-open' : ''}"><div class="col-list"><div class="plist stagger">${list}</div></div><div class="col-detail" id="chDetail"></div></div>`;
  const det = $('#chDetail');
  if (sel) renderChild(det, sel);
  else det.innerHTML = emptyCard('baby', t('ch_pick'));
}

function childHeadCard(c, h) {
  const mother = c.motherId && byId('women', c.motherId);
  const given = ALL_VACCINES.filter(v => c.immunizations?.[v]).length;
  const coverage = Math.round((given / ALL_VACCINES.length) * 100);
  const nu = latestNutrition(c.id);
  const avStyle = c.sex === 'girl' ? 'background:#fbe0ea;color:#a8325f' : 'background:#dbe9f7;color:#1f4f8a';
  const bwChip = c.birthWeight ? `<span class="chip ${c.birthWeight < 2.5 ? 'red' : ''} lg">${c.birthWeight} kg${c.birthWeight < 2.5 ? ' · ' + t('ch_lbw') : ''}</span>` : '';
  const muacChip = nu ? `<a class="chip ${nu.cls === 'sam' ? 'red' : nu.cls === 'mam' ? 'amber' : 'green'} lg" href="#nutrition/${c.id}" style="text-decoration:none">${ic('leaf')} MUAC ${nu.muac} cm</a>` : '';
  return `<div class="card"><div class="detailhead"><div class="big" style="${avStyle}">${ic('baby', 'lg')}</div><div style="flex:1;min-width:0"><div class="eyebrow">${esc(h.head)} · ${esc(h.mohalla)}${mother ? ' · ' + esc(mother.name) : ''}</div><h2>${esc(c.name)}</h2>
      <div class="meta"><span class="chip teal lg">${t(c.sex)} · ${ageStr(c)}</span><span class="chip lg">${t('ch_born')} ${fmtD(c.dob)}</span>${bwChip}${muacChip}</div></div>
      <a class="btn ghost sm no-print" href="#nutrition/${c.id}">${ic('leaf')} ${t('ch_nutrition')}</a></div>
      <div style="margin-top:14px;display:flex;align-items:center;gap:12px"><div class="progress" style="flex:1"><i data-grow="${coverage}%" style="width:0"></i></div><b style="white-space:nowrap">${given}/${ALL_VACCINES.length} ${t('ch_coverage')}</b></div></div>`;
}

function epiCard(c, groups) {
  const vaccineRow = (g, v) => {
    const d = c.immunizations?.[v];
    if (d) return `<div class="vx"><span class="nm">${v}</span><span class="chip green">${ic('check')} ${fmtS(d)}</span><button class="btn ghost sm no-print" data-undo="${esc(v)}" aria-label="${t('ch_undo')}">${ic('x')}</button></div>`;
    if (g.status === 'upcoming') return `<div class="vx"><span class="nm">${v}</span><span class="chip">${t('ch_upcoming')}</span></div>`;
    return `<div class="vx"><span class="nm">${v}</span><input type="date" value="${T_ISO}" max="${T_ISO}" min="${c.dob}" data-vdate="${esc(v)}" aria-label="${t('r_date')}"><button class="btn sm no-print" data-give="${esc(v)}">${ic('check')} ${t('ch_giveToday')}</button></div>`;
  };
  const groupHtml = g => `<div class="epi ${g.status}"><header><div><b>${esc(g.en)} · <span class="ur" style="display:inline">${esc(g.ur)}</span></b><span class="d" style="display:block">${t('ch_due')} ${fmtD(g.dueDate)}${g.status !== 'given' && g.status !== 'upcoming' ? ` · ${relDays(g.dueDate)}` : ''}</span></div>${chip(g.status)}</header>${g.vaccines.map(v => vaccineRow(g, v)).join('')}</div>`;
  return `<div class="card"><h3>${ic('syringe')} ${t('ch_card')}</h3><div class="list stagger">${groups.map(groupHtml).join('')}</div></div>`;
}

function growthCard(c, ws, st) {
  const statusChip = st ? `<span class="chip ${st.cls} lg" style="margin-left:auto">${st.pct != null ? Math.round(st.pct) + '% ' + t('ch_median') + ' · ' : ''}${t(st.key)}</span>` : '';
  const weightRows = ws.slice().reverse().slice(0, 6).map(w => {
    const s = growthStatus(c, w);
    return `<div class="row" style="padding:8px 12px"><span>${fmtD(w.date)} <span class="muted small">· ${ageStr(c, w.date)}</span></span><span><b>${w.kg} kg</b> ${s.pct != null ? `<span class="chip ${s.cls}">${Math.round(s.pct)}%</span>` : ''}</span></div>`;
  }).join('');
  return `<div class="card"><h3>${ic('scale')} ${t('ch_growth')}${statusChip}</h3>
      <div class="chart" id="gChart"></div>
      <div class="legend"><span><i style="background:var(--teal)"></i>WHO ${t('ch_median')}</span><span><i style="background:var(--amber)"></i>80%</span><span><i style="background:var(--red)"></i>70%</span><span><i style="background:var(--orange);height:8px;width:8px;border-radius:50%"></i>${esc(c.name)}</span></div>
      <p class="small muted" style="margin:8px 0 0">${t('ch_ruleNote')}</p>
      <div class="two" style="margin-top:12px"><div><div class="eyebrow" style="margin-bottom:6px">${t('ch_weights')}</div><div class="list">${weightRows || '<div class="muted small">—</div>'}</div></div>
      <div class="no-print"><div class="eyebrow" style="margin-bottom:6px">${t('ch_addWeight')}</div>
        <div class="cols tight"><input id="gDate" type="date" value="${T_ISO}" max="${T_ISO}" min="${c.dob}" aria-label="${t('r_date')}"><input id="gKg" type="number" step=".05" min=".5" max="30" placeholder="${t('ch_kg')}" inputmode="decimal" aria-label="${t('ch_kg')}"></div>
        <div class="cols tight" style="margin-top:8px"><input id="gMuac" type="number" step=".1" min="5" max="25" placeholder="${t('ch_muac')}" inputmode="decimal" aria-label="${t('ch_muac')}" ${ageMonths(c) < 6 ? 'disabled' : ''}><button class="btn" id="gSave">${ic('plus')} ${t('ch_addWeight')}</button></div></div></div></div>`;
}

function newbornCard(c) {
  const lastCheck = (c.checks || []).slice(-1)[0];
  const preset = c.birthWeight && c.birthWeight < 2.5 && ageDays(c) < 28 ? ['small'] : [];
  return `<div class="card" style="border-color:var(--red)"><h3 style="color:var(--red)">${ic('alert')} ${t('ch_newborn')}</h3><p class="muted small" style="margin:0 0 10px">${t('ch_newbornLead')}${lastCheck ? ` · ${t('ch_lastCheck')} ${fmtS(lastCheck.date)}` : ''}</p>
    <div class="checks" id="nbSigns">${checklist(NB_DANGER, preset, '', 'nb')}</div><div id="nbOut" style="margin-top:12px"></div>
    <div class="actions no-print"><button class="btn" id="nbSave">${ic('check')} ${t('ch_saveCheck')}</button></div></div>`;
}

function renderChild(det, c) {
  const h = hhOf(c);
  const groups = vaxGroups(c);
  const ws = (c.weights || []).slice().sort((a, b) => (a.date < b.date ? -1 : 1));
  const lw = ws[ws.length - 1];
  const st = lw && growthStatus(c, lw);
  const newborn = ageDays(c) < 90; // IMNCI young-infant check, shown through the third month
  det.innerHTML = backBtn('#children') + childHeadCard(c, h) + epiCard(c, groups) + growthCard(c, ws, st) + (newborn ? newbornCard(c) : '');
  requestAnimationFrame(() => animateBars(det));
  growthChart($('#gChart'), c, ws);
  $$('[data-give]').forEach(b => (b.onclick = () => {
    const v = b.dataset.give;
    const d = $(`[data-vdate="${v}"]`).value || T_ISO;
    c.immunizations = c.immunizations || {};
    c.immunizations[v] = d;
    put('children', c);
    toast(t('ch_vaxSaved'), 'ok');
    renderChild(det, c);
  }));
  $$('[data-undo]').forEach(b => (b.onclick = () => {
    delete c.immunizations[b.dataset.undo];
    put('children', c);
    renderChild(det, c);
  }));
  $('#gSave').onclick = () => saveWeight(det, c);
  if (newborn) wireNewbornCheck(det, c);
}

function saveWeight(det, c) {
  const kg = +$('#gKg').value;
  const date = $('#gDate').value;
  if (!kg || !date || date > T_ISO || date < c.dob) return toast(t('ch_kg'), 'bad');
  const muac = +$('#gMuac').value || null;
  c.weights = (c.weights || []).filter(w => w.date !== date);
  c.weights.push({ date, kg, muac });
  put('children', c);
  // a MUAC typed here also becomes a nutrition assessment so the nutrition module sees it
  if (muac && ageMonths(c) >= 6) {
    const m = muacStatus(muac);
    put('nutrition', { childId: c.id, date, muac, oedema: false, cls: m.code, counsel: [], referral: m.code === 'sam' ? { urg: 2, dest: 'OTP', reason: `MUAC ${muac} cm — SAM` } : null });
  }
  const s = growthStatus(c, { date, kg });
  toast(s.cls === 'green' || !s.cls ? t('ch_weightSaved') : t(s.key), s.cls === 'red' ? 'bad' : 'ok');
  renderChild(det, c);
}

function wireNewbornCheck(det, c) {
  const assess = () => {
    const s = picked($('#nbSigns'), 'nb');
    const urg = assessSigns(NB_DANGER, s);
    $('#nbOut').innerHTML = s.length
      ? urgBanner(urg, `<div class="small" style="margin-top:4px">${t('v_refTo')}: <b>${esc(destName(destFor(urg)))}</b></div>`)
      : `<div class="note">${ic('check-circle')} ${t('ch_noSigns')}</div>`;
  };
  wireChecks($('#nbSigns'), assess);
  assess();
  $('#nbSave').onclick = () => {
    const s = picked($('#nbSigns'), 'nb');
    c.checks = c.checks || [];
    c.checks.push({ date: T_ISO, signs: s, urg: assessSigns(NB_DANGER, s) });
    put('children', c);
    toast(t('ch_checkSaved'), 'ok');
    renderChild(det, c);
  };
}

/** Weight-for-age SVG: median line + 80%/70% screening lines + the child's points. */
function growthChart(el, c, ws) {
  const W = 520;
  const H = 230;
  const P = { l: 36, r: 12, t: 12, b: 28 };
  const maxM = 24;
  const maxKg = 14;
  const x = m => P.l + (m / maxM) * (W - P.l - P.r);
  const y = kg => P.t + (1 - kg / maxKg) * (H - P.t - P.b);
  const line = (f, color, dash = '') => {
    const d = Array.from({ length: 25 }, (_, m) => `${m ? 'L' : 'M'}${x(m).toFixed(1)} ${y(median(c.sex, m) * f).toFixed(1)}`).join(' ');
    return `<path class="draw" d="${d}" fill="none" stroke="${color}" stroke-width="2.5" ${dash ? `stroke-dasharray="${dash}"` : ''}/>`;
  };
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('ch_growth')}">`;
  for (let kg = 2; kg <= maxKg; kg += 2) {
    s += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(kg)}" y2="${y(kg)}" stroke="#e6d8c4"/><text x="${P.l - 6}" y="${y(kg) + 4}" font-size="13" text-anchor="end" fill="#665c52">${kg}</text>`;
  }
  for (let m = 0; m <= maxM; m += 3) {
    s += `<text x="${x(m)}" y="${H - 8}" font-size="13" text-anchor="middle" fill="#665c52">${m}${m === 24 ? ' mo' : ''}</text>`;
  }
  s += line(1, '#0b525b') + line(0.8, '#a35a00', '5 4') + line(0.7, '#b42318', '3 4');
  const pts = ws.filter(w => ageMonths(c, w.date) <= maxM).map(w => [x(ageMonths(c, w.date)), y(Math.min(w.kg, maxKg))]);
  if (pts.length > 1) {
    s += `<path class="draw" d="${pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ')}" fill="none" stroke="#e8590c" stroke-width="2.5"/>`;
  }
  pts.forEach(p => {
    s += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="5" fill="#e8590c" stroke="#fff" stroke-width="2"/>`;
  });
  el.innerHTML = s + '</svg>';
  $$('.draw', el).forEach(drawPath);
}

// ---------- Family planning: suitability counselling, method record, follow-up schedule ----------
function fpItem(w, selId) {
  const rec = currentFp(w.id);
  const preg = activePregnancyOf(w.id);
  let tail;
  let sub = `${esc(hhOf(w).head)} · ${w.age} ${bi({ en: 'y', ur: 'سال' })}`;
  if (rec) {
    const st = fpStatus(rec);
    sub += ` · ${esc(fpMethod(rec.method).en)}`;
    tail = st.status === 'complete' ? `<span class="chip green">${ic('check')}</span>` : chip(st.status);
  } else if (preg) {
    tail = `<span class="chip orange">${ic('heart')}</span>`;
    sub += ` · ${gaStr(preg.lmp)}`;
  } else {
    tail = `<span class="chip">${t('fp_noMethod')}</span>`;
  }
  return `<a class="pitem ${selId === w.id ? 'on' : ''}" href="#fp/${w.id}"><div class="av">${avatar(w.name)}</div><div class="t"><b>${esc(w.name)}</b><span>${sub}</span></div>${tail}</a>`;
}

function fpRank(w) {
  const rec = currentFp(w.id);
  if (rec) {
    const st = fpStatus(rec).status;
    return st === 'overdue' ? 0 : st === 'due' ? 1 : 3;
  }
  return activePregnancyOf(w.id) ? 4 : 2;
}

function renderFp(id) {
  const women = DB.women.slice().sort((a, b) => fpRank(a) - fpRank(b) || a.name.localeCompare(b.name));
  const sel = id ? byId('women', id) : null;
  const users = DB.women.filter(w => currentFp(w.id)).length;
  const due = DB.women.filter(w => {
    const r = currentFp(w.id);
    return r && ['due', 'overdue'].includes(fpStatus(r).status);
  }).length;
  const unmet = DB.women.filter(w => !currentFp(w.id) && !activePregnancyOf(w.id)).length;
  view.innerHTML = pagehead(t('fp_title'), t('fp_lead')) +
    `<div class="kpis stagger" style="margin-bottom:16px">${kpi('teal', t('fp_kpi_users'), users, 'pill')}${kpi(due ? 'amber' : 'green', t('fp_kpi_due'), due, 'calendar')}${kpi(unmet ? 'orange' : 'green', t('fp_kpi_unmet'), unmet, 'users')}</div>
    <div class="split ${id ? 'detail-open' : ''}"><div class="col-list"><div class="plist stagger">${women.length ? women.map(w => fpItem(w, sel && sel.id)).join('') : `<div class="card muted">${t('fp_none')}</div>`}</div></div><div class="col-detail" id="fpDetail"></div></div>`;
  runCounters(view);
  const det = $('#fpDetail');
  if (sel) renderFpDetail(det, sel);
  else det.innerHTML = emptyCard('pill', t('fp_pick'));
}

function fpScheduleText(m) {
  const first = m.follow.map(d => `${d} ${t('days')}`).join(` ${t('fp_then')} `);
  const rep = m.repeat ? ` ${t('fp_then')} ${t('fp_every')} ${m.repeat} ${t('days')}` : '';
  return `${first}${rep}`;
}

function fpHeadCard(w, rec, preg) {
  const h = hhOf(w);
  let body;
  if (rec) {
    const m = fpMethod(rec.method);
    const st = fpStatus(rec);
    body = `<div class="meta"><span class="chip teal lg">${ic('pill')} ${esc(m.en)}</span><span class="chip lg">${t('fp_start')} ${fmtD(rec.start)}</span>${st.next ? `<span class="chip ${chipFor(st.status)[0]} lg">${t('fp_next')} ${fmtD(st.next)} · ${relDays(st.next)}</span>` : `<span class="chip green lg">${t('nu_complete')}</span>`}</div>
      <div class="ur" style="margin-top:4px">${esc(m.ur)} · ${esc(m.note.ur)}</div><div class="small muted" style="margin-top:4px">${t('fp_schedule')}: ${fpScheduleText(m)}${rec.lastFollow ? ` · ${t('ch_lastCheck')} ${fmtD(rec.lastFollow)}` : ''}</div>
      <div class="actions no-print">${st.next ? `<button class="btn" id="fpDone">${ic('check')} ${t('fp_followup')} — ${t('today')}</button>` : ''}<button class="btn danger" id="fpStop">${ic('x')} ${t('fp_stop')}</button></div>`;
  } else if (preg) {
    body = `<div class="alert teal" style="margin-top:8px">${ic('heart', 'lg')}<div><b>${t('fp_pregnant')}</b><div class="small">${gaStr(preg.lmp)} · ${t('pg_edd')} ${fmtD(preg.edd)}</div></div></div>`;
  } else {
    body = `<div class="meta"><span class="chip lg">${t('fp_noMethod')}</span></div>`;
  }
  return `<div class="card"><div class="detailhead"><div class="big">${avatar(w.name)}</div><div style="flex:1;min-width:0"><div class="eyebrow">${esc(h.head)} · ${esc(h.mohalla)}</div><h2>${esc(w.name)} <span class="muted" style="font-size:1rem;font-weight:400">· ${w.age} ${bi({ en: 'years', ur: 'سال' })}</span></h2>${body}</div></div></div>`;
}

function fpMethodRow(m, answers, selected) {
  const s = fpSuitability(m.id, answers);
  const level = { suitable: ['green', 'fp_suitable'], caution: ['amber', 'fp_caution'], avoid: ['red', 'fp_avoid'] }[s.level];
  const why = s.reasons.length ? `<div class="why">${s.reasons.map(r => esc(r.en)).join(' · ')}</div>` : '';
  const facility = m.facility ? ` · <span class="chip orange" style="padding:1px 7px">${t('fp_facility')}</span>` : '';
  return `<div class="m ${s.level} ${selected === m.id ? 'sel' : ''}" data-method="${m.id}" role="button" tabindex="0"><div style="min-width:0"><b>${esc(m.en)} <span class="ur" style="display:inline;line-height:1.4;font-weight:400">${esc(m.ur)}</span></b><span class="small muted">${esc(m.eff)} ${t('fp_eff')}${facility}</span></div><span class="chip ${level[0]}">${t(level[1])}</span>${why}</div>`;
}

function fpHistoryCard(w) {
  const rows = fpOf(w.id).map(r => {
    const m = r.method ? fpMethod(r.method) : null;
    const status = r.status === 'stopped' ? `<span class="chip">${t('fp_stopped')} ${r.stoppedAt ? fmtS(r.stoppedAt) : ''}</span>` : r.method ? `<span class="chip green">${t('pg_active')}</span>` : `<span class="chip">${t('fp_counselOnly')}</span>`;
    const disp = r.dispensed ? ` · ${t('fp_dispensed')}: ${r.dispensed.qty} ${esc(supplyItem(r.dispensed.item).unit)}` : '';
    return `<div class="row"><div style="min-width:0"><b>${fmtD(r.date)}</b> · ${m ? esc(m.en) : t('fp_counselOnly')}<div class="small muted">${r.answers.length ? r.answers.map(a => esc(FP_QUESTIONS.find(q => q.id === a)?.en || a)).join(', ') : '—'}${disp}${r.notes ? ' · ' + esc(r.notes) : ''}</div></div>${status}</div>`;
  }).join('');
  return `<div class="card"><h3>${ic('list')} ${t('fp_history')}</h3>${rows ? `<div class="list stagger">${rows}</div>` : '<div class="muted small">—</div>'}</div>`;
}

function renderFpDetail(det, w) {
  const rec = currentFp(w.id);
  const preg = activePregnancyOf(w.id);
  let answers = [];
  let selected = null;
  det.innerHTML = backBtn('#fp') + fpHeadCard(w, rec, preg) +
    `<div class="card"><h3>${ic('help')} ${t('fp_questions')}</h3><div class="checks" id="fpQ">${checklist(FP_QUESTIONS, [], 'teal', 'fpq')}</div></div>
    <div class="card"><h3>${ic('pill')} ${t('fp_methods')}</h3><p class="muted small" style="margin:0 0 8px">${t('fp_tapMethod')}</p><div class="suit" id="fpMethods"></div>
      <div class="cols" style="margin-top:12px">${field(t('fp_start'), `<input id="fpStart" type="date" value="${T_ISO}" max="${T_ISO}">`)}${field(t('hh_notes'), `<input id="fpNotes" type="text" maxlength="160">`)}</div>
      <div id="fpChosen" class="note" style="margin-top:10px"></div>
      <div class="actions no-print"><button class="btn" id="fpSave">${ic('check')} ${t('fp_save')}</button></div>
      <p class="muted small" style="margin:12px 0 0">${t('fp_note')}</p></div>` + fpHistoryCard(w);
  const drawMethods = () => {
    $('#fpMethods').innerHTML = FP_METHODS.map(m => fpMethodRow(m, answers, selected)).join('');
    $$('#fpMethods .m').forEach(el => {
      const choose = () => {
        const level = fpSuitability(el.dataset.method, answers).level;
        if (level === 'avoid') return toast(t('fp_avoid'), 'bad');
        selected = selected === el.dataset.method ? null : el.dataset.method;
        drawMethods();
      };
      el.onclick = choose;
      el.onkeydown = e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          choose();
        }
      };
    });
    const m = selected && fpMethod(selected);
    $('#fpChosen').innerHTML = m
      ? `<b>${t('fp_choose')}: ${esc(m.en)}</b> · ${t('fp_schedule')}: ${fpScheduleText(m)}${m.supply ? ` · ${t('fp_dispensed')}: ${m.supplyQty} ${esc(supplyItem(m.supply).unit)} (${stockLevel(m.supply)} ${t('su_stock').toLowerCase()})` : ''}<div class="ur">${esc(m.note.ur)}</div>`
      : t('fp_counselOnly');
  };
  wireChecks($('#fpQ'), () => {
    answers = picked($('#fpQ'), 'fpq');
    drawMethods();
  });
  drawMethods();
  $('#fpSave').onclick = () => saveFp(det, w, rec, { answers, selected, start: $('#fpStart').value, notes: $('#fpNotes').value.trim() });
  if ($('#fpDone')) $('#fpDone').onclick = () => fpFollowUpDone(det, w, rec);
  if ($('#fpStop')) $('#fpStop').onclick = () => {
    put('fp', Object.assign(rec, { status: 'stopped', stoppedAt: T_ISO }));
    toast(t('fp_stopped'), 'ok');
    renderFpDetail(det, w);
  };
}

function saveFp(det, w, current, d) {
  if (!d.start || d.start > T_ISO) return toast(t('fp_start'), 'bad');
  const m = d.selected ? fpMethod(d.selected) : null;
  if (current && m) put('fp', Object.assign(current, { status: 'stopped', stoppedAt: d.start }));
  let dispensed = null;
  if (m && m.supply) {
    dispense(m.supply, m.supplyQty, `FP · ${w.name}`);
    dispensed = { item: m.supply, qty: m.supplyQty };
  }
  put('fp', { womanId: w.id, date: T_ISO, answers: d.answers, method: m ? m.id : null, start: d.start, lastFollow: null, status: m ? 'active' : 'counselOnly', dispensed, notes: d.notes });
  toast(t('fp_saved'), 'ok');
  renderFpDetail(det, w);
}

function fpFollowUpDone(det, w, rec) {
  const m = fpMethod(rec.method);
  rec.lastFollow = T_ISO;
  if (m.supply) {
    dispense(m.supply, m.supplyQty, `FP resupply · ${w.name}`);
    rec.dispensed = { item: m.supply, qty: m.supplyQty };
  }
  put('fp', rec);
  toast(t('fp_saved'), 'ok');
  renderFpDetail(det, w);
}

// ---------- Nutrition: MUAC screening, IYCF counselling, supplementation schedule ----------
function nuRank(c) {
  const nu = latestNutrition(c.id);
  if (nu && nu.cls === 'sam') return 0;
  if (nu && nu.cls === 'mam') return 1;
  const due = SUPPLEMENTS.some(s => ['due', 'overdue'].includes(suppStatus(c, s).status));
  return due ? 2 : 3;
}

function nuItem(c, selId) {
  const nu = latestNutrition(c.id);
  const dueCount = SUPPLEMENTS.filter(s => ['due', 'overdue'].includes(suppStatus(c, s).status)).length;
  let tail;
  if (nu && nu.cls !== 'normal') tail = `<span class="chip ${nu.cls === 'sam' ? 'red' : 'amber'}">${nu.muac}</span>`;
  else if (dueCount) tail = `<span class="chip amber">${dueCount} ${t('ch_due')}</span>`;
  else tail = `<span class="chip green">${ic('check')}</span>`;
  return `<a class="pitem ${selId === c.id ? 'on' : ''}" href="#nutrition/${c.id}"><div class="av ${c.sex}">${ic('baby')}</div><div class="t"><b>${esc(c.name)}</b><span>${ageStr(c)} · ${esc(hhOf(c).head)}${nu ? ` · MUAC ${nu.muac} cm` : ''}</span></div>${tail}</a>`;
}

function renderNutrition(id, sub, recId) {
  const kids = DB.children.filter(c => ageMonths(c) < 60).sort((a, b) => nuRank(a) - nuRank(b) || (a.dob < b.dob ? 1 : -1));
  const sel = id ? byId('children', id) : null;
  const mk = monthKey(T_ISO);
  const recent = DB.nutrition.filter(r => diffDays(r.date, T_ISO) <= 90);
  const screened = DB.nutrition.filter(r => r.date.slice(0, 7) === mk).length;
  const sam = new Set(recent.filter(r => r.cls === 'sam').map(r => r.childId)).size;
  const mam = new Set(recent.filter(r => r.cls === 'mam').map(r => r.childId)).size;
  const dosesDue = kids.filter(c => SUPPLEMENTS.some(s => ['due', 'overdue'].includes(suppStatus(c, s).status))).length;
  view.innerHTML = pagehead(t('nu_title'), t('nu_lead')) +
    `<div class="kpis stagger" style="margin-bottom:16px">${kpi('teal', t('nu_kpi_screened'), screened, 'leaf')}${kpi(sam ? 'red' : 'green', t('nu_kpi_sam'), sam, 'siren')}${kpi(mam ? 'amber' : 'green', t('nu_kpi_mam'), mam, 'alert')}${kpi(dosesDue ? 'orange' : 'green', t('nu_kpi_supp'), dosesDue, 'droplet')}</div>
    <div class="split ${id ? 'detail-open' : ''}"><div class="col-list"><div class="plist stagger">${kids.length ? kids.map(c => nuItem(c, sel && sel.id)).join('') : `<div class="card muted">${t('ch_none')}</div>`}</div></div><div class="col-detail" id="nuDetail"></div></div>`;
  runCounters(view);
  const det = $('#nuDetail');
  if (sel && sub === 'slip') renderNutritionSlip(det, sel, recId);
  else if (sel) renderNutritionDetail(det, sel);
  else det.innerHTML = emptyCard('leaf', t('nu_pick'));
}

function nuHeadCard(c) {
  const h = hhOf(c);
  const nu = latestNutrition(c.id);
  const lw = lastWeight(c);
  const st = lw && growthStatus(c, lw);
  const muacChip = nu ? `<span class="chip ${nu.cls === 'sam' ? 'red' : nu.cls === 'mam' ? 'amber' : 'green'} lg">MUAC ${nu.muac} cm · ${fmtS(nu.date)}</span>` : '';
  const growthChip = st && st.pct != null ? `<span class="chip ${st.cls} lg">${ic('scale')} ${lw.kg} kg · ${Math.round(st.pct)}%</span>` : '';
  const avStyle = c.sex === 'girl' ? 'background:#fbe0ea;color:#a8325f' : 'background:#dbe9f7;color:#1f4f8a';
  return `<div class="card"><div class="detailhead"><div class="big" style="${avStyle}">${ic('baby', 'lg')}</div><div style="flex:1;min-width:0"><div class="eyebrow">${esc(h.head)} · ${esc(h.mohalla)}</div><h2>${esc(c.name)}</h2><div class="meta"><span class="chip teal lg">${t(c.sex)} · ${ageStr(c)}</span>${muacChip}${growthChip}</div></div><a class="btn ghost sm no-print" href="#children/${c.id}">${ic('syringe')} ${t('ch_card')}</a></div></div>`;
}

function nuAssessCard(c) {
  const band = iycfBand(c);
  const young = ageMonths(c) < 6;
  const counsel = band.items.map((it, i) => ({ id: String(i), en: it.en, ur: it.ur }));
  return `<div class="card"><h3>${ic('leaf')} ${t('nu_muac')}</h3>
    ${young ? `<div class="note warn" style="margin-bottom:10px">${t('nu_tooYoung')}</div>` : ''}
    <div class="cols"><div><label class="f">${t('nu_muac')}</label><input id="nuMuac" type="number" step=".1" min="5" max="25" inputmode="decimal" ${young ? 'disabled' : ''} aria-label="${t('nu_muac')}"></div><div><label class="f">${t('v_date')}</label><input id="nuDate" type="date" value="${T_ISO}" max="${T_ISO}" min="${c.dob}"></div></div>
    <div class="checks" style="margin-top:10px"><label class="check"><input type="checkbox" id="nuOed" ${young ? 'disabled' : ''}>${both({ en: t('nu_oedema'), ur: L.ur.nu_oedema })}</label></div>
    <div id="nuOut" style="margin-top:12px"></div>
    <label class="f">${t('nu_iycf')} · ${esc(band.en)} · <span class="ur" style="display:inline">${esc(band.ur)}</span></label><div class="checks" id="nuCounsel">${checklist(counsel, [], 'ok', 'iycf')}</div>
    <div class="actions no-print"><button class="btn" id="nuSave">${ic('check')} ${t('nu_save')}</button></div>
    <p class="muted small" style="margin:12px 0 0">${t('nu_note')}</p></div>`;
}

function suppRow(c, s) {
  const st = suppStatus(c, s);
  const m = ageMonths(c);
  const canGive = ['due', 'overdue', 'upcoming'].includes(st.status);
  const give = canGive ? `<button class="btn ${st.status === 'upcoming' ? 'ghost' : ''} sm no-print" data-supp="${s.id}">${ic('check')} ${t('nu_giveNow')}</button>` : '';
  const when = st.status === 'complete' ? t('nu_complete') : st.status === 'notYet' ? `${t('nu_notYet')} · ${fmtS(st.next)}` : `${t('nu_nextDue')} ${fmtD(st.next)} · ${relDays(st.next)}`;
  return `<div class="row" style="flex-wrap:wrap"><div style="min-width:0;flex:1"><b>${esc(s.en)} · <span class="ur" style="display:inline;line-height:1.4;font-weight:400">${esc(s.ur)}</span></b><div class="small muted">${t('nu_dose')} ${s.dose(m)} · ${when}${st.last ? ` · ${t('nu_lastGiven')} ${fmtS(st.last)} (${st.doses.length})` : ''}</div></div><div style="display:flex;gap:6px;align-items:center">${chip(st.status)}${give}</div></div>`;
}

function nuHistoryCard(c) {
  const rows = nutritionOf(c.id).slice().reverse().map(r => {
    const cls = r.cls === 'sam' ? 'red' : r.cls === 'mam' ? 'amber' : 'green';
    return `<div class="row" style="padding:8px 12px"><span>${fmtD(r.date)} <span class="muted small">· ${ageStr(c, r.date)}</span></span><span style="display:flex;gap:6px;align-items:center"><b>${r.muac} cm</b><span class="chip ${cls}">${r.cls.toUpperCase()}</span>${r.referral ? `<a class="btn ghost sm" href="#nutrition/${c.id}/slip/${r.id}">${ic('printer')}</a>` : ''}</span></div>`;
  }).join('');
  return `<div class="card"><h3>${ic('trending-up')} ${t('nu_chart')}</h3><div class="chart" id="muacChart"></div><div class="legend"><span><i style="background:var(--red)"></i>SAM &lt; ${MUAC_CUTS.sam}</span><span><i style="background:var(--amber)"></i>MAM &lt; ${MUAC_CUTS.mam}</span><span><i style="background:var(--orange);height:8px;width:8px;border-radius:50%"></i>${esc(c.name)}</span></div>
    <div class="eyebrow" style="margin:12px 0 6px">${t('nu_history')}</div><div class="list">${rows || '<div class="muted small">—</div>'}</div></div>`;
}

function renderNutritionDetail(det, c) {
  det.innerHTML = backBtn('#nutrition') + nuHeadCard(c) + nuAssessCard(c) +
    `<div class="card"><h3>${ic('droplet')} ${t('nu_supp')}</h3><div class="list stagger">${SUPPLEMENTS.map(s => suppRow(c, s)).join('')}</div></div>` + nuHistoryCard(c);
  muacChart($('#muacChart'), c);
  const live = () => {
    const m = muacStatus($('#nuMuac').value === '' ? null : +$('#nuMuac').value, $('#nuOed').checked);
    if (!m) {
      $('#nuOut').innerHTML = '';
      return;
    }
    const extra = m.code === 'sam' ? `<div class="small" style="margin-top:4px">${t('v_refTo')}: <b>${esc(destName('OTP'))}</b></div>` : '';
    const urg = m.code === 'sam' ? 2 : 0;
    $('#nuOut').innerHTML = `<div class="alert ${m.cls}">${ic(m.code === 'sam' ? 'siren' : m.code === 'mam' ? 'alert' : 'check-circle', 'lg')}<div><b>${esc(L.en[m.key])}</b><div class="ur">${esc(L.ur[m.key])}</div>${extra}</div></div>${urg ? `<div style="margin-top:8px">${urgBanner(urg)}</div>` : ''}`;
  };
  $('#nuMuac').addEventListener('input', live);
  $('#nuOed').addEventListener('change', e => {
    e.target.closest('.check').classList.toggle('on', e.target.checked);
    live();
  });
  wireChecks($('#nuCounsel'));
  $('#nuSave').onclick = () => saveNutrition(det, c);
  $$('[data-supp]', det).forEach(b => (b.onclick = () => giveSupplement(det, c, b.dataset.supp)));
}

function saveNutrition(det, c) {
  const muac = $('#nuMuac').value === '' ? null : +$('#nuMuac').value;
  const oedema = $('#nuOed').checked;
  const date = $('#nuDate').value;
  const m = muacStatus(muac, oedema);
  if (!m || !date || date > T_ISO || date < c.dob) return toast(t('nu_muac'), 'bad');
  const referral = m.code === 'sam' ? { urg: 2, dest: 'OTP', reason: `${oedema ? 'Bilateral oedema' : 'MUAC ' + muac + ' cm'} — severe acute malnutrition` } : null;
  const rec = put('nutrition', { childId: c.id, date, muac: muac ?? 0, oedema, cls: m.code, counsel: picked($('#nuCounsel'), 'iycf').map(Number), referral });
  if (muac) {
    c.weights = c.weights || [];
    const same = c.weights.find(w => w.date === date);
    if (same) same.muac = muac;
    put('children', c);
  }
  toast(t('nu_saved'), m.code === 'sam' ? 'bad' : 'ok');
  if (referral) location.hash = `nutrition/${c.id}/slip/${rec.id}`;
  else renderNutritionDetail(det, c);
}

function giveSupplement(det, c, suppId) {
  const s = SUPPLEMENTS.find(x => x.id === suppId);
  c.supplements = c.supplements || {};
  c.supplements[s.id] = [...(c.supplements[s.id] || []), T_ISO];
  put('children', c);
  if (s.supply) dispense(s.supply, s.supplyQty, `${s.en} · ${c.name}`);
  toast(`${s.en} ${t('nu_given')}`, 'ok');
  renderNutritionDetail(det, c);
}

/** MUAC trend chart: SAM/MAM bands and the child's measurements over age in months (6–59). */
function muacChart(el, c) {
  const W = 520;
  const H = 200;
  const P = { l: 36, r: 12, t: 12, b: 28 };
  const minM = 6;
  const maxM = 60;
  const lo = 9;
  const hi = 17;
  const x = m => P.l + ((clamp(m, minM, maxM) - minM) / (maxM - minM)) * (W - P.l - P.r);
  const y = cm => P.t + (1 - (clamp(cm, lo, hi) - lo) / (hi - lo)) * (H - P.t - P.b);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('nu_chart')}">`;
  s += `<rect x="${P.l}" y="${y(MUAC_CUTS.sam)}" width="${W - P.l - P.r}" height="${H - P.b - y(MUAC_CUTS.sam)}" fill="#fde3e0"/>`;
  s += `<rect x="${P.l}" y="${y(MUAC_CUTS.mam)}" width="${W - P.l - P.r}" height="${y(MUAC_CUTS.sam) - y(MUAC_CUTS.mam)}" fill="#fdebc8"/>`;
  for (let cm = lo; cm <= hi; cm += 2) {
    s += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(cm)}" y2="${y(cm)}" stroke="#e6d8c4"/><text x="${P.l - 6}" y="${y(cm) + 4}" font-size="13" text-anchor="end" fill="#665c52">${cm}</text>`;
  }
  for (let m = minM; m <= maxM; m += 6) {
    s += `<text x="${x(m)}" y="${H - 8}" font-size="13" text-anchor="middle" fill="#665c52">${m}${m === maxM ? ' mo' : ''}</text>`;
  }
  const pts = nutritionOf(c.id).filter(r => r.muac).map(r => [x(ageMonths(c, r.date)), y(r.muac)]);
  if (pts.length > 1) s += `<path class="draw" d="${pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ')}" fill="none" stroke="#e8590c" stroke-width="2.5"/>`;
  pts.forEach(p => {
    s += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="5" fill="#e8590c" stroke="#fff" stroke-width="2"/>`;
  });
  el.innerHTML = s + '</svg>';
  $$('.draw', el).forEach(drawPath);
}

// ---------- TB & malaria screening: symptom checklists, rule-based result, referral slip, outcome tracking ----------
let scFilter = 'all';

function scResultChip(s) {
  const map = { negative: ['green', 'sc_negative'], presumptive: ['amber', 'sc_presumptive'], suspect: ['amber', 'sc_suspect'], severe: ['red', 'sc_severe'] };
  const [cls, key] = map[s.result] || ['', s.result];
  return `<span class="chip ${cls}">${t(key).split(' — ')[0]}</span>`;
}

function scRow(s) {
  const outcome = s.referral ? `<span class="chip ${s.outcome === 'pending' ? 'amber' : s.outcome === 'confirmed' ? 'red' : ''}">${t('sc_' + s.outcome)}</span>` : '';
  const h = s.householdId && byId('households', s.householdId);
  return `<a class="row click" href="#screening/${s.id}" style="text-decoration:none;color:inherit;flex-wrap:wrap"><div style="min-width:0;flex:1 1 220px"><b>${esc(s.name)}</b> <span class="muted">· ${s.age} ${bi({ en: 'y', ur: 'سال' })} · ${t(s.type === 'tb' ? 'sc_tb' : 'sc_malaria')}</span><div class="small muted">${fmtD(s.date)}${h ? ' · ' + esc(h.head) : ''} · ${s.signs.length} ${bi({ en: 'symptom(s)', ur: 'علامات' })}</div></div><div style="display:flex;gap:6px;flex-wrap:wrap">${scResultChip(s)}${outcome}</div></a>`;
}

function renderScreening(id, sub) {
  const mk = monthKey(T_ISO);
  const list = DB.screenings.slice().sort((a, b) => (a.date < b.date ? 1 : -1));
  const inMonth = list.filter(s => s.date.slice(0, 7) === mk);
  const tbRef = inMonth.filter(s => s.type === 'tb' && s.result === 'presumptive').length;
  const malRef = inMonth.filter(s => s.type === 'malaria' && s.result !== 'negative').length;
  const pending = list.filter(s => s.referral && s.outcome === 'pending').length;
  const shown = list.filter(s => scFilter === 'all' || (scFilter === 'pending' ? s.referral && s.outcome === 'pending' : s.type === scFilter));
  const filters = [['all', t('all')], ['tb', t('sc_tb')], ['malaria', t('sc_malaria')], ['pending', t('sc_pending')]];
  view.innerHTML = pagehead(t('sc_title'), t('sc_lead'), `<a class="btn no-print" href="#screening/new">${ic('plus')} ${t('sc_new')}</a>`) +
    `<div class="kpis stagger" style="margin-bottom:16px">${kpi('teal', t('sc_kpi_month'), inMonth.length, 'clipboard')}${kpi(tbRef ? 'amber' : 'green', t('sc_kpi_tb'), tbRef, 'activity')}${kpi(malRef ? 'amber' : 'green', t('sc_kpi_mal'), malRef, 'thermometer')}${kpi(pending ? 'orange' : 'green', t('sc_kpi_pending'), pending, 'clock')}</div>
    <div class="split ${id ? 'detail-open' : ''}"><div class="col-list">
      <div class="seg" id="scFilter" style="margin-bottom:10px">${filters.map(([v, l]) => `<button data-v="${v}" class="${scFilter === v ? 'on' : ''}">${l}</button>`).join('')}</div>
      <div class="plist stagger" style="gap:8px">${shown.length ? shown.map(scRow).join('') : `<div class="card muted">${t('sc_none')}</div>`}</div></div>
    <div class="col-detail" id="scDetail"></div></div>`;
  runCounters(view);
  segControl($('#scFilter'), scFilter, v => {
    scFilter = v;
    renderScreening(id, sub);
  });
  const det = $('#scDetail');
  if (id === 'new') renderScreeningForm(det, sub);
  else if (id === 'slip') renderScreeningSlip(det, byId('screenings', sub));
  else if (id && byId('screenings', id)) renderScreeningDetail(det, byId('screenings', id));
  else det.innerHTML = emptyCard('clipboard', t('sc_pick'));
}

function scPersonOptions(householdId) {
  if (!householdId) return '';
  const women = DB.women.filter(w => w.householdId === householdId).map(w => `<option value="woman:${w.id}">${esc(w.name)} · ${w.age} y</option>`);
  const kids = DB.children.filter(c => c.householdId === householdId).map(c => `<option value="child:${c.id}">${esc(c.name)} · ${ageStr(c)}</option>`);
  return women.join('') + kids.join('');
}

function renderScreeningForm(det, householdId) {
  const hhOptions = DB.households.map(h => `<option value="${h.id}" ${h.id === householdId ? 'selected' : ''}>${esc(h.head)} · ${esc(h.mohalla)}</option>`).join('');
  det.innerHTML = backBtn('#screening') + `<div class="two"><div class="card"><h3>${ic('clipboard')} ${t('sc_new')}</h3>
      <label class="f">${t('sc_type')}</label><div class="seg" id="scType"><button data-v="tb" class="on">${t('sc_tb')}</button><button data-v="malaria">${t('sc_malaria')}</button></div>
      <div class="cols">${field(t('sc_household'), `<select id="scHh"><option value="">—</option>${hhOptions}</select>`)}${field(t('sc_person'), `<select id="scPerson"><option value="other">${t('sc_other')}</option>${scPersonOptions(householdId)}</select>`)}</div>
      <div class="cols" id="scOther">${field(t('name'), `<input id="scName" type="text" maxlength="60">`)}${field(t('age'), `<input id="scAge" type="number" min="0" max="110" inputmode="numeric">`)}${field(t('hh_sex'), `<select id="scSex"><option value="female">${bi({ en: 'Female', ur: 'عورت' })}</option><option value="male">${bi({ en: 'Male', ur: 'مرد' })}</option></select>`)}</div>
      ${field(t('v_date'), `<input id="scDate" type="date" value="${T_ISO}" max="${T_ISO}">`)}
      <label class="f" style="color:var(--red)">${ic('alert')} ${t('sc_symptoms')}</label><div class="checks" id="scSigns"></div>
      <p class="muted small" style="margin:12px 0 0">${t('sc_note')}</p></div>
    <div style="position:sticky;top:14px"><div class="card" id="scAssess"></div><div class="actions"><button class="btn block" id="scSave" style="font-size:1.1rem;min-height:56px">${ic('check')} ${t('sc_save')}</button></div></div></div>`;
  let type = 'tb';
  let destTouched = false; // follow the rule's destination until the LHW picks one
  const drawSigns = () => {
    $('#scSigns').innerHTML = checklist(screenSigns(type), [], '', 'scs');
    wireChecks($('#scSigns'), assess);
    assess();
  };
  const assess = () => {
    const r = screenResult(type, picked($('#scSigns'), 'scs'));
    const cur = $('#scDest')?.value;
    const banner = `<div class="alert ${r.urg >= 3 ? 'red' : r.urg ? 'amber' : 'green'}">${ic(r.urg >= 3 ? 'siren' : r.urg ? 'alert' : 'check-circle', 'lg')}<div><b>${esc(L.en[r.key])}</b><div class="ur">${esc(L.ur[r.key])}</div></div></div>`;
    $('#scAssess').innerHTML = `<h3>${ic('activity')} ${t('sc_result')}</h3>${banner}${r.urg ? `<div style="margin-top:8px">${urgBanner(r.urg)}</div><div class="cols">${field(t('v_refTo'), destSelect('scDest', DEST, destTouched && cur ? cur : r.dest))}</div>` : ''}`;
    $('#scDest')?.addEventListener('change', () => (destTouched = true));
  };
  segControl($('#scType'), 'tb', v => {
    type = v;
    drawSigns();
  });
  $('#scHh').onchange = e => {
    $('#scPerson').innerHTML = `<option value="other">${t('sc_other')}</option>${scPersonOptions(e.target.value)}`;
    $('#scOther').classList.remove('hidden');
  };
  $('#scPerson').onchange = e => $('#scOther').classList.toggle('hidden', e.target.value !== 'other');
  drawSigns();
  $('#scSave').onclick = () => saveScreening(() => type);
}

function saveScreening(getType) {
  const type = getType();
  const date = $('#scDate').value;
  const householdId = $('#scHh').value || null;
  const who = $('#scPerson').value;
  let person = { personKind: 'other', personId: null, name: $('#scName').value.trim(), age: +$('#scAge').value || 0, sex: $('#scSex').value };
  if (who.startsWith('woman:')) {
    const w = byId('women', who.slice(6));
    person = { personKind: 'woman', personId: w.id, name: w.name, age: w.age, sex: 'female' };
  } else if (who.startsWith('child:')) {
    const c = byId('children', who.slice(6));
    person = { personKind: 'child', personId: c.id, name: c.name, age: Math.floor(ageMonths(c) / 12), sex: c.sex === 'girl' ? 'female' : 'male' };
  }
  if (!person.name || !date || date > T_ISO) return toast(t('name') + ' / ' + t('v_date'), 'bad');
  const signs = picked($('#scSigns'), 'scs');
  const r = screenResult(type, signs);
  const referral = r.urg ? { urg: r.urg, dest: $('#scDest').value, reason: r.reason } : null;
  const rec = put('screenings', Object.assign(person, { type, householdId, date, signs, result: r.result, referral, outcome: referral ? 'pending' : null, outcomeDate: null }));
  toast(t('sc_saved'), referral ? '' : 'ok');
  location.hash = referral ? `screening/slip/${rec.id}` : `screening/${rec.id}`;
}

function renderScreeningDetail(det, s) {
  const h = s.householdId && byId('households', s.householdId);
  const signs = screenSigns(s.type).filter(x => s.signs.includes(x.id));

    : '';
  const contacts = s.type === 'tb' && s.outcome === 'confirmed' ? `<div class="alert amber" style="margin-top:12px">${ic('users', 'lg')}<div><b>${t('sc_contacts')}</b>${h ? `<div class="small"><a href="#screening/new/${h.id}">${esc(h.head)} →</a></div>` : ''}</div></div>` : '';
  det.innerHTML = backBtn('#screening') + `<div class="card"><div class="detailhead"><div class="big">${ic(s.type === 'tb' ? 'activity' : 'thermometer', 'lg')}</div><div style="flex:1;min-width:0"><div class="eyebrow">${t(s.type === 'tb' ? 'sc_tb' : 'sc_malaria')} · ${fmtD(s.date)}</div><h2>${esc(s.name)} <span class="muted" style="font-size:1rem;font-weight:400">· ${s.age} ${bi({ en: 'years', ur: 'سال' })} · ${esc(s.sex)}</span></h2>
      <div class="meta">${scResultChip(s)}${h ? `<a class="chip" href="#households/${h.id}" style="text-decoration:none">${ic('home')} ${esc(h.head)}</a>` : ''}${s.referral ? `<span class="chip ${URG[s.referral.urg].cls}">${esc(URG[s.referral.urg].en.split(' — ')[0])} · ${esc(destName(s.referral.dest))}</span>` : ''}</div></div>
      ${s.referral ? `<a class="btn ghost sm no-print" href="#screening/slip/${s.id}">${ic('printer')} ${t('pg_slip')}</a>` : ''}</div>
      <div class="list" style="margin-top:14px">${signs.length ? signs.map(x => `<div class="row" style="padding:8px 12px">${both(x)}</div>`).join('') : `<div class="muted small">${t('none')}</div>`}</div>
      ${outcomeSeg}${contacts}
      <div class="actions no-print"><button class="btn danger sm" id="scDel">${ic('trash')} ${t('delete')}</button></div></div>`;
  if ($('#scOutcome')) {
    segControl($('#scOutcome'), s.outcome, v => {
      put('screenings', Object.assign(s, { outcome: v, outcomeDate: T_ISO }));
      toast(t('sc_outcomeSaved'), 'ok');
      renderScreening(s.id);
    });
  }
  $('#scDel').onclick = () => {
    if (!confirm(t('delete') + '?')) return;
    remove('screenings', s.id);
    location.hash = 'screening';
  };
}

function renderScreeningSlip(det, s) {
  if (!s || !s.referral) {
    det.innerHTML = backBtn('#screening') + `<div class="card muted">${t('s_none')}</div>`;
    return;

  const h = s.householdId && byId('households', s.householdId);

// ---------- Supplies: LHW kit stock, movements, stock-outs, monthly consumption, request sheet ----------
const STOCK_CHIP = { out: ['red', 'su_stockout'], low: ['amber', 'su_low'], ok: ['green', 'su_ok'] };

function supplyRow(item, selId) {
  const st = stockStatus(item.id);
  const [cls, key] = STOCK_CHIP[st.status];
  const months = st.monthsLeft != null ? ` · ${st.monthsLeft.toFixed(1)} ${t('su_months')}` : '';
  const exp = st.expired ? ` · <span style="color:var(--red)">${t('su_expired')}</span>` : st.expiringSoon ? ` · ${t('su_expiry')} ${fmtS(st.expiry)}` : '';
  return `<a class="pitem ${selId === item.id ? 'on' : ''}" href="#supplies/${item.id}"><div class="av">${ic('box')}</div><div class="t"><b>${esc(item.en)}</b><span>${st.qty} ${esc(item.unit)}${months}${exp}</span></div><span class="chip ${cls}">${t(key)}</span></a>`;
}

function renderSupplies(id) {
  const sel = id && id !== 'request' ? SUPPLY_ITEMS.find(i => i.id === id) : null;
  const statuses = SUPPLY_ITEMS.map(i => stockStatus(i.id));
  const outs = statuses.filter(s => s.status === 'out').length;
  const low = statuses.filter(s => s.status === 'low').length;
  const exp = statuses.filter(s => s.expired || s.expiringSoon).length;
  const order = { out: 0, low: 1, ok: 2 };
  const items = SUPPLY_ITEMS.slice().sort((a, b) => order[stockStatus(a.id).status] - order[stockStatus(b.id).status]);
  view.innerHTML = pagehead(t('su_title'), t('su_lead'), `<a class="btn teal no-print" href="#supplies/request">${ic('file')} ${t('su_request')}</a>`) +
    `<div class="kpis stagger" style="margin-bottom:16px">${kpi('teal', t('su_kpi_items'), SUPPLY_ITEMS.length, 'box')}${kpi(outs ? 'red' : 'green', t('su_kpi_out'), outs, 'alert')}${kpi(low ? 'amber' : 'green', t('su_kpi_low'), low, 'trending-up')}${kpi(exp ? 'orange' : 'green', t('su_kpi_exp'), exp, 'calendar')}</div>
    <div class="split ${id ? 'detail-open' : ''}"><div class="col-list"><div class="plist stagger">${items.map(i => supplyRow(i, sel && sel.id)).join('')}</div></div><div class="col-detail" id="suDetail"></div></div>`;
  runCounters(view);
  const det = $('#suDetail');
  if (id === 'request') renderRequestSheet(det);
  else if (sel) renderSupplyDetail(det, sel);
  else renderConsumptionOverview(det);
}

function renderConsumptionOverview(det) {
  const months = lastMonths(6);
  const top = SUPPLY_ITEMS.filter(i => amc(i.id) > 0).slice(0, 6);
  const rows = SUPPLY_ITEMS.map(i => {
    const st = stockStatus(i.id);
    const [cls, key] = STOCK_CHIP[st.status];
    return `<tr><td><a href="#supplies/${i.id}">${esc(i.en)}</a></td><td class="num">${st.qty}</td><td class="num">${st.min}</td><td class="num">${st.amc.toFixed(1)}</td><td><span class="chip ${cls}">${t(key)}</span></td></tr>`;
  }).join('');
  det.innerHTML = `<div class="card"><h3>${ic('bar-chart')} ${t('su_consumption')}</h3><div class="chart" id="suChart"></div>
      <div class="legend">${top.slice(0, 3).map((i, k) => `<span><i style="background:${['#0b525b', '#e8590c', '#a35a00'][k]};height:10px"></i>${esc(i.en)}</span>`).join('')}</div></div>
    <div class="card"><h3>${ic('list')} ${t('su_item')}</h3><div class="tablewrap"><table><thead><tr><th>${t('su_item')}</th><th class="num">${t('su_stock')}</th><th class="num">${t('su_min')}</th><th class="num">${t('su_amc')}</th><th>${t('status')}</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;

  groupedBars($('#suChart'), months.map(mk => ({ label: monthShort(mk), values: series.map(i => monthlyOut(i.id, mk)) })), series.map((_, k) => ({ color: ['#0b525b', '#e8590c', '#a35a00'][k] })));
}

function renderSupplyDetail(det, item) {
  const st = stockStatus(item.id);
  const cfg = supplies.find(s => s.id === item.id);
  const [cls, key] = STOCK_CHIP[st.status];
  const moves = movementsOf(item.id).slice().reverse().slice(0, 15);
  const fill = Math.min(100, Math.round((st.qty / Math.max(1, st.min * 2)) * 100));
  const moveRows = moves.map(m => {
    const sign = m.type === 'in' ? '+' : m.type === 'out' ? '−' : '=';

  }).join('');
  det.innerHTML = backBtn('#supplies') + `<div class="card"><div class="detailhead"><div class="big">${ic('box', 'lg')}</div><div style="flex:1;min-width:0"><div class="eyebrow">${esc(item.unit)}</div><h2>${esc(item.en)}</h2><div class="ur" style="text-align:left;direction:rtl">${esc(item.ur)}</div>
      <div class="meta"><span class="chip ${cls} lg">${t(key)} · ${st.qty} ${esc(item.unit)}</span><span class="chip lg">${t('su_amc')} ${st.amc.toFixed(1)}</span>${st.monthsLeft != null ? `<span class="chip lg">${st.monthsLeft.toFixed(1)} ${t('su_months')}</span>` : ''}</div></div></div>
      <div class="progress" style="margin-top:14px"><i class="${cls}" data-grow="${fill}%" style="width:0"></i></div></div>
    <div class="card no-print"><h3>${ic('edit')} ${t('su_log')}</h3>
      <div class="seg" id="suType"><button data-v="in" class="on">${ic('plus')} ${t('su_receive')}</button><button data-v="out">${ic('minus')} ${t('su_dispense')}</button><button data-v="count">${ic('hash')} ${t('su_adjust')}</button></div>
      <div class="cols">${field(t('su_qty'), `<input id="suQty" type="number" min="0" inputmode="numeric">`)}${field(t('v_date'), `<input id="suDate" type="date" value="${T_ISO}" max="${T_ISO}">`)}</div>
      ${field(t('su_note'), `<input id="suNote" type="text" maxlength="120">`)}

  const getType = segControl($('#suType'), 'in');
