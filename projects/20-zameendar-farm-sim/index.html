<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zameendar — Farm Strategy Sim</title>
<meta name="description" content="Turn-based farm strategy game grounded in Pakistani agriculture: Kharif/Rabi seasons, warabandi water, soil health, pests, mandi prices, arhti vs bank finance. Bilingual single-file FYP template.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Signika:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens: olive fields, soil, sky, clay-tile panels ---------- */
:root{
  --olive:#5b7f2a; --olive-deep:#3f5c1b; --field:#a7c957; --field-soft:#e7f1cf; --soil:#7a5230; --soil-deep:#4e3219;
  --sky:#bfe3f5; --sky-deep:#4f9ccb; --clay:#f3e9d8; --clay-2:#e9dcc5; --paper:#faf5ec; --ink:#2a2419; --muted:#6f6352; --line:#d9c7a9;
  --ok:#2f7d32; --ok-soft:#dff2dd; --warn:#c77c11; --warn-soft:#fbead0; --bad:#b3342a; --bad-soft:#f8dfdb; --gold:#d9a521; --gold-soft:#fbefc9;
  --radius:16px; --radius-sm:10px; --shadow:0 12px 30px -18px rgba(42,36,25,.45);
  --display:"Signika",system-ui,sans-serif; --font:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --font-ur:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;
  --ease:cubic-bezier(.2,.8,.2,1); --dur:.35s;
}
/* ---------- Motion kit ---------- */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
@keyframes growIn{from{transform:scale(.78);opacity:.4}}
@keyframes coinFly{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
@keyframes sweep{to{transform:translateX(100%)}}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}}
@keyframes marquee{to{transform:translateX(-100%)}}
.enter{animation:fadeUp var(--dur) var(--ease) both}
.stagger>*{animation:fadeUp .45s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.btn{transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s}
.btn:hover{transform:translateY(-1px)} .btn:active{transform:translateY(0) scale(.98)}
.card,.tile,.kpi{transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s}
.card:hover,.kpi:hover{transform:translateY(-2px);box-shadow:0 16px 34px -18px rgba(42,36,25,.5)}
.fill,.bar>i{transition:width .6s var(--ease)}
.skeleton{background:linear-gradient(90deg,var(--clay-2) 25%,var(--clay) 50%,var(--clay-2) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite}

/* ---------- Base ---------- */
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
body{min-height:100vh;background:linear-gradient(180deg,var(--sky) 0,#d7e9f0 240px,#edf0df 520px,#e3e9cf 100%) fixed}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:600;line-height:1.2;letter-spacing:-.01em}
a{color:var(--olive-deep)}
.ic{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.muted{color:var(--muted)} .small{font-size:.82rem} .hidden{display:none!important} .num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ur,[lang=ur]{font-family:var(--font-ur);line-height:1.95;direction:rtl;text-align:right}
html[lang=ur] body{font-family:var(--font-ur);line-height:1.8}
html[lang=ur] .num,html[lang=ur] input,html[lang=ur] select,html[lang=ur] .ltr,html[lang=ur] .hchip .v,html[lang=ur] .kpi .v,html[lang=ur] .mono{font-family:var(--font);direction:ltr}
html[lang=ur] .txt,html[lang=ur] p,html[lang=ur] .tip,html[lang=ur] .note,html[lang=ur] .warn,html[lang=ur] .ecard,html[lang=ur] .logrow .msg,html[lang=ur] .todo{direction:rtl;text-align:right}
html[lang=ur] h1,html[lang=ur] h2,html[lang=ur] h3,html[lang=ur] .btn,html[lang=ur] .chip{letter-spacing:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* paper-textured clay tile panels */
.paper{min-width:0;background-color:var(--clay);background-image:radial-gradient(rgba(122,82,48,.07) 1px,transparent 1.3px),radial-gradient(rgba(122,82,48,.05) 1px,transparent 1.3px),linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0) 60%);background-size:9px 9px,13px 13px,100% 100%;background-position:0 0,4px 6px,0 0;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:8px 18px;background:linear-gradient(180deg,var(--olive-deep),var(--olive));color:#f4f7e8;box-shadow:0 4px 20px -8px rgba(0,0,0,.45)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:inherit}
.brand .logo{width:40px;height:40px;border-radius:12px;background:var(--field);color:var(--olive-deep);display:grid;place-items:center;flex:none}
.brand h1{font-size:1.1rem;color:#fff;white-space:nowrap}
.brand small{display:block;font-size:.72rem;opacity:.85;font-family:var(--font);white-space:nowrap}
@media (max-width:1500px){.topnav a.sec span{display:none} .topnav a.sec{padding:8px 8px}}
@media (max-width:1240px){.brand small{display:none} #saveTop span{display:none}}
.topnav{display:flex;gap:1px;margin-left:6px;flex-wrap:nowrap;min-width:0}
.topnav a{color:#eef3dc;text-decoration:none;padding:8px 9px;border-radius:10px;font-weight:700;font-size:.84rem;white-space:nowrap;opacity:.85;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.topnav a:hover{background:rgba(255,255,255,.1);opacity:1}
.topnav a.active{background:var(--field);color:var(--olive-deep);opacity:1}
.spacer{flex:1}
.lang{background:var(--clay);color:var(--soil-deep);border:0;border-radius:10px;padding:8px 12px;font-weight:800;cursor:pointer;min-height:40px}
.tbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;gap:6px;font-weight:700}

/* ---------- Shared components ---------- */
.btn{border:0;border-radius:11px;padding:9px 14px;font-weight:800;cursor:pointer;background:var(--olive);color:#fff;display:inline-flex;align-items:center;gap:8px;min-height:40px;font-family:var(--font)}
.btn.gold{background:var(--gold);color:var(--soil-deep)} .btn.soil{background:var(--soil);color:#fff} .btn.sky{background:var(--sky-deep);color:#fff}
.btn.ghost{background:rgba(255,255,255,.65);color:var(--ink);border:1px solid var(--line)} .btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:.82rem;min-height:36px} .btn.block{width:100%;justify-content:center} .btn.lg{font-size:1.05rem;padding:12px 20px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.6);border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:700;cursor:pointer;min-height:38px;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.chip.on{background:var(--olive);border-color:var(--olive);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
select,input[type=number],input[type=text]{width:100%;border:1px solid var(--line);background:#fffdf8;border-radius:10px;padding:9px 11px;outline:0;min-height:40px}
select:focus,input:focus{border-color:var(--olive);box-shadow:0 0 0 3px var(--field-soft)}
label.f{display:block;font-size:.8rem;font-weight:800;color:var(--muted);margin:10px 0 5px}
.bar{height:8px;background:rgba(122,82,48,.15);border-radius:999px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--olive);border-radius:999px}
.bar>i.warn{background:var(--warn)} .bar>i.bad{background:var(--bad)} .bar>i.sky{background:var(--sky-deep)}
.tag{display:inline-block;border-radius:6px;padding:2px 7px;font-size:.72rem;font-weight:800;background:var(--field-soft);color:var(--olive-deep);white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.sky{background:var(--sky);color:#1d5a7a} .tag.gold{background:var(--gold-soft);color:#8a6410} .tag.soil{background:#e8d9c8;color:var(--soil-deep)}
.note{background:var(--field-soft);border-left:4px solid var(--olive);padding:10px 12px;border-radius:10px;font-size:.88rem}
.warn{background:var(--warn-soft);border-left:4px solid var(--warn);padding:10px 12px;border-radius:10px;font-size:.88rem}
.danger-note{background:var(--bad-soft);border-left:4px solid var(--bad);padding:10px 12px;border-radius:10px;font-size:.88rem}
.wrap{max-width:1360px;margin:0 auto;padding:16px 18px 90px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px 16px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{padding:12px 14px}
.kpi .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;display:flex;gap:6px;align-items:center}
.kpi .v{font-family:var(--display);font-size:1.35rem;font-weight:700;margin-top:4px;white-space:nowrap}
.kpi .s{font-size:.8rem;color:var(--muted)}
.panelbox{padding:16px 18px} .panelbox h2{font-size:1.25rem;margin-bottom:4px} .panelbox p.lead{margin:0 0 12px;color:var(--muted)}
.sec{margin-top:18px} .sec h3{font-size:1.05rem;margin-bottom:8px;display:flex;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse;background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:.88rem;vertical-align:middle}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--clay-2)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
.tablewrap{overflow:auto;border-radius:12px}
.chart{position:relative;background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:12px;padding:8px}
.chart svg{width:100%;height:220px;display:block;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--soil-deep);color:#fff;border-radius:8px;padding:5px 8px;font-size:.76rem;transform:translate(-50%,-115%);white-space:nowrap;display:none;z-index:2}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;margin:8px 2px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.list{display:flex;flex-direction:column;gap:10px;min-width:0}
.list>*{min-width:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:rgba(255,255,255,.55)}
.todo{border:1px dashed var(--soil);border-radius:12px;padding:12px 14px;background:rgba(255,255,255,.4)}
.todo h4{margin:0 0 6px;font-size:.95rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.todo .tag{background:var(--soil);color:#fff}
.bigstat{font-family:var(--display);font-size:2.2rem;font-weight:700;letter-spacing:-.02em}
.grade{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:var(--olive);color:#fff;font-family:var(--display);font-size:2.2rem;font-weight:700;box-shadow:0 10px 24px -12px rgba(0,0,0,.5);flex:none}
.grade.b{background:var(--sky-deep)} .grade.c{background:var(--gold);color:var(--soil-deep)} .grade.d{background:var(--warn)} .grade.f{background:var(--bad)}
.ach{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.55);border:1px solid var(--line);font-weight:700;font-size:.88rem}
.ach .ico{width:30px;height:30px;border-radius:9px;background:var(--gold-soft);color:#8a6410;display:grid;place-items:center;flex:none}
.ach.locked{opacity:.5;filter:grayscale(1)}

/* ---------- Game layout ---------- */
.game{display:grid;grid-template-columns:minmax(0,1fr) 352px;grid-template-rows:auto minmax(0,1fr) auto;gap:14px;max-width:1360px;margin:0 auto;padding:12px 18px 20px;min-height:calc(100vh - 58px)}
.hud{grid-column:1/-1;min-width:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 12px}
.hchip{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 6px;border-radius:12px;background:rgba(255,255,255,.6);border:1px solid var(--line);min-height:46px}
.hchip .ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--field-soft);color:var(--olive-deep);flex:none}
.hchip .k{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800;line-height:1.1}
.hchip .v{font-family:var(--display);font-weight:700;font-size:1.02rem;line-height:1.15;white-space:nowrap}
.hchip.warn .ico{background:var(--warn-soft);color:var(--warn)} .hchip.bad .ico{background:var(--bad-soft);color:var(--bad)} .hchip.sky .ico{background:var(--sky);color:#1d5a7a} .hchip.gold .ico{background:var(--gold-soft);color:#8a6410} .hchip.soil .ico{background:#e8d9c8;color:var(--soil-deep)}
.turnbar{flex:1 1 150px;min-width:130px}
.turnbar .k{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800;display:flex;justify-content:space-between;margin-bottom:4px}
.farmstage{grid-column:1;grid-row:2;position:relative;padding:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:380px}
.farmstage svg{width:100%;height:100%;max-height:540px;display:block}
.panel{grid-column:2;grid-row:2/4;padding:14px;display:flex;flex-direction:column;gap:10px;overflow:auto;max-height:calc(100vh - 160px);position:sticky;top:72px}
.panel .close-sheet{display:none}
.ticker{grid-column:1;grid-row:3;padding:10px 14px;max-height:200px;display:flex;flex-direction:column}
.ticker h3{font-size:.95rem;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.loglist{overflow:auto;flex:1;display:flex;flex-direction:column;gap:4px;font-size:.85rem;min-height:70px}
.logrow{display:flex;gap:8px;align-items:flex-start;padding:5px 8px;border-radius:8px;background:rgba(255,255,255,.5)}
.logrow .when{font-size:.72rem;color:var(--muted);white-space:nowrap;min-width:62px;font-weight:800;padding-top:2px}
.logrow .msg{flex:1}
.logrow.bad{background:var(--bad-soft)} .logrow.ok{background:var(--ok-soft)} .logrow.news{background:var(--sky)} .logrow.warn{background:var(--warn-soft)}
.marquee{overflow:hidden;white-space:nowrap;border-top:1px dashed var(--line);margin-top:6px;padding-top:6px;font-size:.8rem;color:var(--muted)}
.marquee span{display:inline-block;padding-left:100%;animation:marquee 30s linear infinite}

/* SVG farm */
.plot{cursor:pointer;outline:none}
.plot .tile{transition:fill .6s var(--ease),stroke .2s,stroke-width .2s}
.plot:hover .tile,.plot:focus-visible .tile{stroke:#fff;stroke-width:2.5}
.plot.sel .tile{stroke:#fff;stroke-width:3}
.plot.sel .glow{opacity:1}
.glow{opacity:0;transition:opacity .3s}
.sprite.grew{animation:growIn .55s var(--ease)}
.badge-g{filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.plabel{font-family:var(--font);font-size:10px;font-weight:800;fill:#fff;opacity:.85;pointer-events:none}

/* panel internals */
.ptitle{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ptitle h2{font-size:1.2rem}
.stat{display:flex;justify-content:space-between;gap:8px;font-size:.86rem;padding:4px 0;border-bottom:1px dashed var(--line)}
.stat b{white-space:nowrap}
.stat.wrap b{white-space:normal;text-align:right;max-width:62%}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .btn{justify-content:flex-start;font-size:.86rem;padding:8px 10px}
.tip{background:#fff8e1;border:1px solid #f1d98a;border-radius:12px;padding:10px 12px;font-size:.86rem}
.tip h4{font-size:.92rem;display:flex;gap:6px;align-items:center;margin-bottom:4px;color:#7a5a06}
.tip .btn{margin-top:8px}
.sowlist{display:flex;flex-direction:column;gap:6px}
.sowopt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:rgba(255,255,255,.6);cursor:pointer;text-align:left;width:100%;min-height:44px}
.sowopt:hover{border-color:var(--olive)}
.sowopt .sw{width:14px;height:14px;border-radius:4px;flex:none}
.sowopt .nm{font-weight:800;flex:1} .sowopt .cs{font-size:.78rem;color:var(--muted);white-space:nowrap}

/* event cards */
#events{position:fixed;top:66px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:55;width:min(340px,calc(100vw - 32px))}
.ecard{background:#fffdf8;border:1px solid var(--line);border-left:5px solid var(--sky-deep);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);animation:slideIn .4s var(--ease);display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.ecard.weather{border-left-color:var(--warn)} .ecard.pest{border-left-color:var(--bad)} .ecard.news{border-left-color:var(--sky-deep)} .ecard.good{border-left-color:var(--ok)}
.ecard .eic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--clay-2);color:var(--soil-deep);flex:none}
.ecard h4{font-size:.95rem} .ecard p{margin:3px 0 0;font-size:.8rem;color:var(--muted)}

/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.coin{position:absolute;width:18px;height:18px;color:var(--gold);animation:coinFly .8s var(--ease) forwards}
.coin .ic{width:18px;height:18px;stroke-width:2.4}
.sweep{position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);transform:translateX(-100%);animation:sweep .65s var(--ease) forwards;border-radius:var(--radius)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(42,36,25,.45);backdrop-filter:blur(2px);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:65;padding:16px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal .box{width:min(760px,100%);max-height:90vh;overflow:auto;padding:18px 20px;transform:scale(.96);transition:transform .25s var(--ease)}
.modal .box h2{font-size:1.35rem}
body.modal-open .scrim,body.modal-open .modal{opacity:1;pointer-events:auto} body.modal-open .modal .box{transform:none}
.mhead{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.xbtn{margin-left:auto;background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:9px;width:40px;height:40px;cursor:pointer;display:grid;place-items:center;flex:none}

/* toasts */
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80;width:max-content;max-width:calc(100vw - 24px)}
.toast{background:var(--soil-deep);color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:toastIn .3s var(--ease),toastOut .3s ease 2.9s forwards;display:flex;gap:8px;align-items:center}
.toast.ok{background:var(--olive)} .toast.bad{background:var(--bad)}

/* mobile */
.mobilebar{display:none} .fabs{display:none}
@media (max-width:980px){
  .topnav{display:none} .brand small{display:none}
  .game{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto;padding:10px 12px 120px;min-height:0;gap:10px}
  .hud{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;padding:8px 10px} .hud::-webkit-scrollbar{display:none} .turnbar{flex:0 0 130px}
  .farmstage{grid-column:1;grid-row:2;min-height:0;padding:4px} .farmstage svg{max-height:330px}
  .ticker{grid-column:1;grid-row:3;max-height:230px}
  .panel{position:fixed;inset:auto 0 0 0;top:auto;max-height:80vh;border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .3s var(--ease);z-index:62;grid-column:auto;grid-row:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .panel .close-sheet{display:inline-grid}
  body.sheet-open .panel{transform:none}
  .panel::before{content:'';position:fixed;inset:0;background:rgba(42,36,25,.45);z-index:-1;opacity:0;pointer-events:none;transition:opacity .25s}
  body.sheet-open .panel::before{opacity:1;pointer-events:auto}
  body.sheet-open .fabs{display:none}
  .mobilebar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:var(--clay);border-top:1px solid var(--line)}
  .mobilebar a{flex:1;text-decoration:none;color:var(--muted);font-size:.68rem;font-weight:800;text-align:center;padding:6px 2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:44px}
  .mobilebar a .ic{width:1.3em;height:1.3em}
  .mobilebar a.active{color:var(--olive-deep);background:var(--field-soft)}
  .fabs{display:flex;position:fixed;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:44;gap:8px}
  .fabs .btn{box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}
  .two{grid-template-columns:minmax(0,1fr)}
  .wrap{padding:12px 12px 110px}
  #events{top:62px}
  .actions{grid-template-columns:1fr 1fr}
  .modal .box{max-height:86vh}
}
/* ---------- grids, tour, shortcuts, print ---------- */
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card.panelbox{padding:14px 16px}
kbd{font-family:var(--font)}
html[data-motion=reduced] *,html[data-motion=reduced] *::before,html[data-motion=reduced] *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
#tour{position:fixed;inset:0;z-index:90;pointer-events:none}
.tour-hole{position:absolute;border-radius:14px;box-shadow:0 0 0 9999px rgba(42,36,25,.55),0 0 0 3px var(--gold);transition:all .35s var(--ease);pointer-events:none}
.tour-card{position:absolute;width:min(340px,calc(100vw - 24px));padding:14px 16px;pointer-events:auto;animation:pop .3s var(--ease)}
.tour-card h3{font-size:1.05rem;margin-top:2px}
.no-print{display:flex}
@media print{
  .no-print,.topbar,.mobilebar,.fabs,#toasts,#events,.panel,.scrim,.modal,#tour{display:none!important}
  body{background:#fff;font-size:12px}
  .paper{box-shadow:none;background:#fff;border-color:#bbb}
  .wrap{padding:0;max-width:none}
  .kpi .v{font-size:1.1rem}
  .two{grid-template-columns:1fr 1fr}
  .printdoc .loglist{max-height:none!important;overflow:visible}
  a{text-decoration:none;color:inherit}
}

<script>
'use strict';
/* =====================================================================
   Zameendar — farm strategy sim (single file)
   Sections: utils · i18n · crop/pest/event data · engine (turn loop, water, soil,
   pests, market, finance, scoring) · farm renderer (iso SVG) · action panel ·
   market · bank · reports (SVG charts) · almanac · about · new game · router · API
   Student extension points are marked  TODO(student)
   ===================================================================== */
// ---------- utils ----------
const NS = 'zmd:';
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

// Namespaced localStorage wrapper. Every key this app writes starts with "zmd:".
const store = {
  get(key, fallback) {
    try {
      const raw = localStorage.getItem(NS + key);
      return raw == null ? fallback : JSON.parse(raw);
    } catch {
      return fallback;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(NS + key, JSON.stringify(value));
    } catch {
      /* storage full or blocked: the game keeps running in memory */
    }
  },
  del(key) {
    try {
      localStorage.removeItem(NS + key);
    } catch {
      /* ignore */
    }
  },
  keys() {
    const out = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(NS)) out.push(k.slice(NS.length));
      }
    } catch {
      /* ignore */
    }
    return out;
  }
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = new Intl.NumberFormat('en-PK', { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat('en-PK', { maximumFractionDigits: 1 });
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const sum = arr => arr.reduce((a, b) => a + b, 0);
const lerp = (a, b, t) => a + (b - a) * t;

// Money formatting. rs() is always the full figure; rsk() abbreviates to lac / crore; money() follows the settings.
function rs(n) {
  const sign = n < 0 ? '−' : '';
  return sign + 'Rs ' + nf.format(Math.abs(Math.round(n)));
}
function rsk(n) {
  const a = Math.abs(n);
  const sign = n < 0 ? '−' : '';
  if (a >= 1e7) return sign + 'Rs ' + nf1.format(a / 1e7) + ' cr';
  if (a >= 1e5) return sign + 'Rs ' + nf1.format(a / 1e5) + ' lac';
  return sign + 'Rs ' + nf.format(Math.round(a));
}
function money(n) {
  return S.compact ? rsk(n) : rs(n);
}
// Water volume: acre-inches by default, cubic metres when the setting asks for it (1 acre-inch ≈ 102.8 m³).
function wu(v) {
  if (S.waterUnit === 'm3') return nf.format(v * 102.8) + ' m³';
  return nf1.format(v) + ' ' + t('acre_in');
}

function lerpColor(a, b, t) {
  const hex = x => [1, 3, 5].map(i => parseInt(x.slice(i, i + 2), 16));
  const A = hex(a);
  const B = hex(b);
  return '#' + A.map((v, i) => Math.round(lerp(v, B[i], clamp(t, 0, 1))).toString(16).padStart(2, '0')).join('');
}

const ic = (name, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;

function toast(msg, type = '', icon = 'info') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const iconName = type === 'ok' ? 'check-circle' : type === 'bad' ? 'alert-circle' : icon;
  el.innerHTML = ic(iconName) + '<span></span>';
  el.lastChild.textContent = msg;
  const host = $('#toasts');
  while (host.children.length >= 3) host.firstChild.remove();
  host.append(el);
  setTimeout(() => el.remove(), 3300);
}

// Motion kit helpers (see KIT.md): route enter animation, staggered children, animated numbers, SVG path draw-in.
function animateIn(root) {
  root.classList.remove('enter');
  void root.offsetWidth;
  root.classList.add('enter');
  // drop the class once the animation ends so the route container stops being a stacking context
  root.addEventListener('animationend', () => root.classList.remove('enter'), { once: true });
  $$('.stagger', root).forEach(group => {
    [...group.children].forEach((el, i) => el.style.setProperty('--i', i));
  });
}
function countUp(el, to, { from = 0, dur = 700, fmt = v => nf.format(Math.round(v)) } = {}) {
  if (!el) return;
  const t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(from + (to - from) * eased);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function drawPath(path) {
  const len = path.getTotalLength();
  path.style.strokeDasharray = len;
  path.style.strokeDashoffset = len;
  path.getBoundingClientRect();
  path.style.transition = 'stroke-dashoffset .9s var(--ease)';
  path.style.strokeDashoffset = 0;
}

// Seeded RNG (mulberry32). The state lives inside the game object, so saves and seeds replay identically.
function rnd() {
  g.rs = (g.rs + 0x6D2B79F5) | 0;
  let x = Math.imul(g.rs ^ (g.rs >>> 15), 1 | g.rs);
  x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
  return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
}
function rnorm() {
  const u = Math.max(rnd(), 1e-9);
  const v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

function newGame({ name = 'Chak 7 Farm', diff = 'normal', seed = Math.floor(Math.random() * 1e6), tutorial = true, challenge = null } = {}) {
  const d = DIFF[diff] || DIFF.normal;
  const ch = CHALLENGES.find(c => c.id === challenge) || null;
  const debt = ch && ch.debt != null ? ch.debt : d.debt;

  g = {
    v: 2, name: String(name || 'Chak 7 Farm').slice(0, 40), diff, seed: seed | 0, rs: seed | 0, turn: 0,
    cash: d.cash, startCash: d.cash - debt, loan: 0, advance: debt, credit: 60,
    solar: false, autoIrr: false, combine: true, insured: 0, needMult: 1, canalNow: 0,
    mods: [], plots: [], inv: [], recv: [], prices: {}, log: [], inbox: [], years: [], ach: [], plan: {},
    over: false, flags: {}, challenge: ch ? ch.id : null,
    stats: freshStats(),
    tut: { on: !!tutorial, done: {}, queue: [] }
  };

  for (let i = 0; i < 16; i++) g.plots.push(freshPlot(i));
  CROP_IDS.forEach(c => {
    g.prices[c] = { lvl: 1 + (rnd() - .5) * .12, hist: [] };
    g.prices[c].hist.push(Math.round(price(c)));
  });
  g.canalNow = canalFor(0);
  g.stats.cashHist.push(g.cash);

  log('sprout', { en: `Welcome to ${g.name}. It is April — Kharif season begins.`, ur: `${g.name} میں خوش آمدید۔ اپریل ہے — خریف کا موسم شروع۔` }, 'ok');
  if (debt) {
    log('alert', { en: `You start owing the arhti ${rs(debt)}. Sales go through him until it is repaid.`, ur: `آپ آڑھتی کے ${rs(debt)} کے مقروض ہیں۔ ادائیگی تک فروخت اسی کے ذریعے ہوگی۔` }, 'bad');
  }
  if (ch) {
    notify('farm', ch.icon, { en: `Challenge: ${ch.en}`, ur: `چیلنج: ${ch.ur}` }, ch.obj);
  }
  if (g.tut.on && S.tips) queueTip('welcome');

  ui.sel = null;
  ui.lastStage = {};
  ui.prevCash = null;
  autosave();
  return g;
}

// ---------- engine: derived values ----------
function canalFor(turn) {
  const base = CANAL[mOf(turn)] * DIFF[g.diff].water * (1 + .15 * rnorm());
  return Math.max(10, Math.round(base));
}
function mod(kind, mult, months, crop = null) {
  g.mods.push({ k: kind, mult, crop, until: g.turn + months });
}
function modMult(kind, crop) {
  return g.mods
    .filter(x => x.k === kind && (!x.crop || x.crop === crop))
    .reduce((acc, x) => acc * x.mult, 1);
}
// Seasonal price factor: 15 % dip in glut months, 8 % lift in the two months before.
function seasonal(c, m) {
  const cr = CROPS[c];
  if (cr.glut.includes(m)) return cr.perish ? .7 : .85;
  if (cr.glut.includes((m + 1) % 12) || cr.glut.includes((m + 2) % 12)) return 1.08;
  return 1;
}
function price(c) {
  return CROPS[c].price * seasonal(c, mOf(g.turn)) * g.prices[c].lvl * modMult('price', c);
}
const dieselPrice = () => DIESEL * modMult('diesel');
function sowCost(c) {
  const cr = CROPS[c];
  return Math.round((cr.seed + cr.fert + cr.pest) * modMult('input') + cr.labour + TRACTOR);
}
function harvestCost(c) {
  const cr = CROPS[c];
  if (g.combine && cr.machine) return cr.machine;
  return Math.round(cr.harvest * modMult('labour'));
}
const avgSoil = () => sum(g.plots.map(p => p.soil)) / 16;
function orchardFactor(p) {
  if (p.age < 36) return 0;
  if (p.age < 48) return .7;
  if (p.age < 60) return 1;
  return 1.3;
}
// Expected yield and value of a plot's standing crop at today's price.
function estimate(p) {
  const c = CROPS[p.crop];
  if (!c || c.green) return null;
  const waterF = p.wN ? clamp(.25 + .75 * (p.wSum / p.wN), 0, 1) : 1;
  const soilF = .55 + .45 * p.soil / 100;
  const orchardF = c.orchard ? Math.max(orchardFactor(p), .7) : 1;
  const qty = c.yield * soilF * waterF * (1 - p.dmg) * (p.fert ? 1.15 : 1) * orchardF;
  return { qty, value: qty * price(p.crop) };
}
function plotNeed(p) {
  const c = CROPS[p.crop];
  if (!c) return 0;
  const young = c.orchard && p.age < 36 ? .7 : 1;
  return c.water * g.needMult * young;
}
const farmNeed = () => sum(g.plots.map(plotNeed));
const activeAcres = () => g.plots.filter(p => p.crop).length;

// ---------- engine: money, log, inbox ----------
function pay(n, cat = 'other') {
  g.cash -= n;
  g.stats.expense += n;
  g.stats.yr.expense += n;
  g.stats.expenseBy[cat] = (g.stats.expenseBy[cat] || 0) + n;
}
function earn(n, crop = null) {
  g.cash += n;
  g.stats.revenue += n;
  g.stats.yr.income += n;
  if (crop) g.stats.incomeBy[crop] = (g.stats.incomeBy[crop] || 0) + n;
}
function log(icon, text, kind = '') {
  g.log.unshift({ t: g.turn, icon, en: text.en, ur: text.ur, kind });
  if (g.log.length > 240) g.log.length = 240;
}
// Inbox entries keep both languages so the language toggle re-renders old messages correctly.
function notify(type, icon, title, body) {
  g.inbox.unshift({ id: g.turn + '-' + g.inbox.length + '-' + Math.floor(rnd() * 1e6), t: g.turn, type, icon, title_en: title.en, title_ur: title.ur, body_en: body?.en || '', body_ur: body?.ur || '', read: false });
  if (g.inbox.length > 150) g.inbox.length = 150;
}
const unreadCount = () => (g ? g.inbox.filter(n => !n.read).length : 0);
function markRead(id) {
  const n = g.inbox.find(x => x.id === id);
  if (n) n.read = true;
  autosave();
}
function markAllRead() {
  g.inbox.forEach(n => { n.read = true; });
  autosave();
}
function fail(msg) {
  toast(msg, 'bad');
  return false;
}
function insurancePayout(loss) {
  if (!(g.insured > g.turn) || loss <= 0) return null;
  const amount = Math.round(loss * .6);
  earn(amount);
  g.flags.insuredLoss = true;
  log('shield-check', { en: `Insurance paid out ${rs(amount)} for the loss.`, ur: `انشورنس نے نقصان کے ${rs(amount)} ادا کیے۔` }, 'ok');
  return { en: `Insurance paid ${rs(amount)}.`, ur: `انشورنس نے ${rs(amount)} ادا کیے۔` };
}

// ---------- engine: plot actions ----------
function sow(i, c) {
  const p = g.plots[i];
  const cr = CROPS[c];
  const m = mOf(g.turn);
  if (!p || !cr) return false;
  if (g.over) return fail(t('game_over'));
  if (p.crop) return fail(t('plot_busy'));
  if (!cr.sow.includes(m)) return fail(t('not_window'));
  const cost = sowCost(c);
  if (g.cash < cost) return fail(t('not_enough'));

  pay(cost, 'inputs');
  const prev = p.hist[p.hist.length - 1];
  p.mono = prev === c && !cr.green;
  if (p.mono) g.stats.repeats++;
  if (prev && prev !== c && CROPS[prev].cat !== cr.cat) {
    p.soil = clamp(p.soil + 3, 5, 100);
    g.stats.rotations++;
  }
  Object.assign(p, { crop: c, stage: 0, age: 0, sown: g.turn, wSum: 0, wN: 0, dmg: 0, fert: false, pest: null, irrig: false, ready: false, over: 0, waterlog: false });
  g.stats.grown[c] = (g.stats.grown[c] || 0) + 1;
  g.stats.sows++;
  if (cr.cat === 'legume') g.stats.legumePlots++;
  delete g.plan[i];

  log('sprout', { en: `Sowed ${cr.en} on ${p.name} (${rs(cost)}).`, ur: `${p.name} پر ${cr.ur} بوئی (${rs(cost)})۔` });
  ui.sowOpen = false;
  queueTip('water');
  afterAction();
  return true;
}

function irrigate(i) {
  const p = g.plots[i];
  if (!p || !p.crop || g.over) return false;
  p.irrig = !p.irrig;
  toast(t(p.irrig ? 'planned' : 'unplanned'), p.irrig ? 'ok' : '');
  afterAction();
  return p.irrig;
}

function fertilize(i) {
  const p = g.plots[i];
  if (!p || !p.crop || g.over) return false;
  if (p.fert) return fail(t('already_fert'));
  const cost = Math.round(FERT_COST * modMult('input'));
  if (g.cash < cost) return fail(t('not_enough'));
  pay(cost, 'inputs');
  p.fert = true;
  p.soil = clamp(p.soil - 2, 5, 100);
  toast(t('fertilised'), 'ok');
  log('flask', { en: `Fertilised ${p.name} (${rs(cost)}).`, ur: `${p.name} پر کھاد ڈالی (${rs(cost)})۔` });
  afterAction();
  return true;
}

function spray(i) {
  const p = g.plots[i];
  if (!p || !p.crop || g.over) return false;
  if (p.pest) {
    const pd = PESTS[p.pest.id];
    const cost = Math.round(pd.spray * modMult('input'));
    pay(cost, 'inputs');
    log('bug', { en: `Sprayed ${p.name} against ${pd.en} (${rs(cost)}).`, ur: `${p.name} پر ${pd.ur} کے خلاف سپرے (${rs(cost)})۔` }, 'ok');
    p.pest = null;
    toast(t('sprayed'), 'ok');
  } else {
    const cost = Math.round(PREV_SPRAY * modMult('input'));
    if (g.cash < cost) return fail(t('not_enough'));
    pay(cost, 'inputs');
    p.shield = true;
    toast(t('shield'), 'ok');
  }
  afterAction();
  return true;
}

function harvest(i) {
  const p = g.plots[i];
  const c = CROPS[p?.crop];
  if (!p || !c || g.over) return false;
  if (!p.ready) return fail(t('not_ready'));
  const cost = harvestCost(p.crop);
  pay(cost, g.combine && c.machine ? 'machinery' : 'labour');

  if (c.green) {
    p.soil = clamp(p.soil + 12, 5, 100);
    log('leaf', { en: `Ploughed in green manure on ${p.name}: soil +12.`, ur: `${p.name} پر سبز کھاد ہل چلا کر ملائی: زمین +12۔` }, 'ok');
    clearPlot(p, true);
    afterAction();
    return true;
  }

  const est = estimate(p);
  const variance = 1 + c.varr * clamp(rnorm(), -2, 2) * .6;
  const qty = Math.max(0, Math.round(est.qty * variance * 10) / 10);
  const pr = price(p.crop);
  g.stats.harvestValue += qty * pr;
  g.stats.harvests++;
  g.stats.yr.harvests++;

  if (c.mill) {
    const amt = Math.round(qty * pr);
    g.recv.push({ amt, due: g.turn + 2, crop: p.crop });
    log('factory', { en: `Harvested ${nf.format(qty)} maunds sugarcane on ${p.name}; mill owes ${rs(amt)} (2 months).`, ur: `${p.name} پر ${nf.format(qty)} من گنا کاٹا؛ مل ${rs(amt)} کی مقروض (2 ماہ)۔` }, 'ok');
  } else {
    const it = g.inv.find(x => x.crop === p.crop);
    if (it) it.qty += qty;
    else g.inv.push({ crop: p.crop, qty, age: 0 });
    log('wheat', { en: `Harvested ${nf.format(qty)} maunds of ${c.en} on ${p.name} → store.`, ur: `${p.name} پر ${nf.format(qty)} من ${c.ur} کاٹی → گودام۔` }, 'ok');
    queueTip('market');
  }

  if (c.orchard) {
    p.ready = false;
    p.lastHarvestY = yOf(g.turn);
    p.dmg = 0;
    p.fert = false;
    p.wSum = 0;
    p.wN = 0;
    g.stats.mango++;
  } else {
    clearPlot(p, true);
  }
  queueTip('rotation');
  fxCoins(i);
  afterAction();
  return qty;
}

function clearPlot(p, keepHist) {
  if (keepHist && p.crop) p.hist.push(p.crop);
  Object.assign(p, { crop: null, stage: 0, age: 0, dmg: 0, fert: false, pest: null, irrig: false, ready: false, over: 0, mono: false, waterlog: false, wSum: 0, wN: 0 });
}
function fallow(i) {
  const p = g.plots[i];
  if (!p || !p.crop || g.over) return false;
  log('refresh', { en: `Cleared ${p.name}; land left fallow.`, ur: `${p.name} صاف کیا؛ زمین خالی چھوڑی۔` });
  clearPlot(p, true);
  ui.confirmClear = null;
  toast(t('cleared'));
  afterAction();
  return true;
}

// ---------- engine: the monthly tick ----------
function endMonth() {
  if (!g || g.over) return false;
  const m = mOf(g.turn);
  const cashBefore = g.cash;

  resolveWater(m);
  g.plots.forEach(growPlot);
  g.turn++;

  const m2 = mOf(g.turn);
  g.mods = g.mods.filter(x => x.until > g.turn);
  g.needMult = 1;
  updateReady(m2);
  monthlyFinance(m2);
  g.canalNow = canalFor(g.turn);
  const cards = rollEvents(m2);
  rollPests(m2);
  updateMarket();
  g.stats.cashHist.push(Math.round(g.cash));

  if (g.turn % 12 === 0) yearEnd();
  if (g.turn >= TURNS) finishGame();
  if (g.turn === 12) queueTip('year');
  if (g.cash < 150000) queueTip('arhti');

  autosave();
  ui.prevCash = cashBefore;
  refresh();
  fxSweep();
  if (S.cards) showCards(cards);
  if (g.over) openFinal();
  else if (g.turn % 12 === 0) openYearReport(g.years[g.years.length - 1]);
  return true;
}

// Canal water is shared in proportion to need; the tubewell tops up plots that asked for it (or all, with auto-irrigate).
function resolveWater(m) {
  const active = g.plots.filter(p => p.crop);
  const rain = RAIN[m];
  const pool = g.canalNow;
  const needs = active.map(plotNeed);
  const total = sum(needs);
  const shareRatio = total > 0 ? Math.min(1, pool / total) : 0;
  let tube = 0;
  let tubeCost = 0;

  active.forEach((p, k) => {
    const need = needs[k];
    let got = need * shareRatio + rain;
    if (p.irrig || g.autoIrr) {
      const deficit = Math.max(0, need - got);
      const amount = deficit > 0 ? deficit : (p.irrig ? need * .5 : 0);
      if (amount > 0) {
        const freeLeft = g.solar ? Math.max(0, SOLAR_CAP - tube) : 0;
        const paidPart = Math.max(0, amount - freeLeft);
        const cost = Math.round(paidPart * dieselPrice());
        if (g.cash >= cost) {
          pay(cost, 'water');
          tubeCost += cost;
          tube += amount;
          got += amount;
        }
      }
    }
    const ratio = need > 0 ? got / need : 1;
    p.wSum += Math.min(ratio, 1);
    p.wN++;
    p.waterlog = ratio > 1.35;
    if (p.waterlog) {
      p.soil = clamp(p.soil - (ratio - 1.35) * 8, 5, 100);
      g.stats.overIrr += got - need;
    }
    p.irrig = false;
  });

  const used = Math.min(pool, total) + tube;
  g.stats.waterAvail.push(pool);
  g.stats.waterUsed.push(Math.round(used));
  g.stats.waterTotal += used;
  g.stats.yr.water += used;
  g.stats.yr.avail += pool;

  if (tubeCost > 0) {
    log('droplet', { en: `Tubewell pumped ${nf.format(tube)} acre-inches (${rs(tubeCost)} diesel).`, ur: `ٹیوب ویل نے ${nf.format(tube)} ایکڑ انچ پانی دیا (${rs(tubeCost)} ڈیزل)۔` });
  } else if (tube > 0) {
    log('zap', { en: `Solar tubewell pumped ${nf.format(tube)} acre-inches for free.`, ur: `سولر ٹیوب ویل نے ${nf.format(tube)} ایکڑ انچ مفت دیا۔` }, 'ok');
  }
  if (total > 0 && shareRatio < .7 && tube === 0) {
    const pct = Math.round(shareRatio * 100);
    log('droplet', { en: `Canal share covered only ${pct} % of crop need — yields will suffer.`, ur: `نہری باری نے ضرورت کا صرف ${pct}٪ پورا کیا — پیداوار کم ہوگی۔` }, 'warn');
    notify('farm', 'droplet', { en: 'Water shortfall', ur: 'پانی کی کمی' }, { en: `Only ${pct} % of crop need was met this month.`, ur: `اس ماہ فصلوں کی ضرورت کا صرف ${pct}٪ پورا ہوا۔` });
  }
}

function growPlot(p) {
  if (!p.crop) {
    p.soil = clamp(p.soil + 1.5, 5, 100);
    return;
  }
  const c = CROPS[p.crop];
  p.soil = clamp(p.soil - c.drain - (p.mono ? .6 : 0), 5, 100);

  if (p.pest) {
    const pd = PESTS[p.pest.id];
    p.pest.months++;
    p.dmg = Math.min(.85, p.dmg + pd.dmg * (p.pest.months === 1 ? .5 : .35));
    if (p.pest.months === 1) {
      log('bug', { en: `${pd.en} is eating into ${p.name} (unsprayed).`, ur: `${pd.ur} ${p.name} کو نقصان پہنچا رہی ہے (سپرے نہیں ہوا)۔` }, 'bad');
    }
    spreadPest(p);
  }
  p.shield = false;

  if (c.orchard) {
    p.age++;
    p.stage = Math.min(p.age, 36);
    return;
  }
  p.stage++;
  if (p.ready) {
    p.over++;
    p.dmg = Math.min(.95, p.dmg + (c.perish ? .3 : .12));
    if (p.over >= 3) {
      log('alert', { en: `${c.en} on ${p.name} rotted in the field — never harvested.`, ur: `${p.name} پر ${c.ur} کھیت میں ہی خراب ہو گئی — کٹائی نہ ہوئی۔` }, 'bad');
      notify('farm', 'alert', { en: `Crop lost on ${p.name}`, ur: `${p.name} کی فصل ضائع` }, { en: `${c.en} was left unharvested for three months.`, ur: `${c.ur} تین ماہ تک بغیر کٹائی رہی۔` });
      clearPlot(p, true);
    }
  } else if (p.stage >= c.dur) {
    p.ready = true;
    log('check-circle', { en: `${c.en} on ${p.name} is ready to harvest.`, ur: `${p.name} پر ${c.ur} کٹائی کے لیے تیار ہے۔` }, 'ok');
    notify('farm', 'check-circle', { en: `${c.en} ready on ${p.name}`, ur: `${p.name} پر ${c.ur} تیار` }, { en: 'Harvest this month to avoid losses.', ur: 'نقصان سے بچنے کے لیے اسی ماہ کٹائی کریں۔' });
    queueTip('harvest');
  }
}

// An unsprayed pest jumps to orthogonal neighbours growing the same crop with 25 % probability each.
function spreadPest(p) {
  const col = p.i % 4;
  const neighbours = [p.i - 4, p.i + 4];
  if (col > 0) neighbours.push(p.i - 1);
  if (col < 3) neighbours.push(p.i + 1);
  neighbours.forEach(j => {
    const q = g.plots[j];
    if (q && q.crop === p.crop && !q.pest && rnd() < .25) q.pest = { id: p.pest.id, months: 0 };
  });
}

function updateReady(m) {
  g.plots.forEach(p => {
    if (!p.crop || !CROPS[p.crop].orchard) return;
    const was = p.ready;
    p.ready = p.age >= 36 && [5, 6].includes(m) && p.lastHarvestY !== yOf(g.turn);
    if (p.ready && !was) {
      log('check-circle', { en: `Mangoes on ${p.name} are ripe — harvest this month or next.`, ur: `${p.name} کے آم پک گئے — اس ماہ یا اگلے ماہ اتاریں۔` }, 'ok');
    }
  });
}

function monthlyFinance(m) {
  pay(OVERHEAD, 'other');
  if (g.loan > 0) {
    const interest = g.loan * LOAN_RATE;
    g.loan += interest;
    g.stats.expense += interest;
    g.stats.yr.expense += interest;
    g.stats.expenseBy.finance = (g.stats.expenseBy.finance || 0) + interest;
    if (g.loan > LOAN_CAP * .7) g.credit = clamp(g.credit - 1, 0, 100);
  } else {
    g.credit = clamp(g.credit + .5, 0, 100);
  }
  if (g.advance > 0) {
    const interest = g.advance * ADV_RATE;
    g.advance += interest;
    g.stats.expense += interest;
    g.stats.yr.expense += interest;
    g.stats.expenseBy.finance = (g.stats.expenseBy.finance || 0) + interest;
  }

  // storage cost and spoilage on everything that has been in store for at least a month
  g.inv.forEach(it => {
    const c = CROPS[it.crop];
    if (it.age >= 1) {
      const cost = Math.round(it.qty * c.storeCost);
      if (cost) pay(cost, 'storage');
      if (c.perish) {
        const lost = it.qty * c.perish;
        it.qty -= lost;
        log('box', { en: `${nf.format(lost)} maunds of ${c.en} spoiled in store.`, ur: `گودام میں ${nf.format(lost)} من ${c.ur} خراب ہو گئی۔` }, 'warn');
      }
    }
    it.age++;
  });
  g.inv = g.inv.filter(it => it.qty >= 1);

  // mill receivables that fall due
  g.recv.filter(r => r.due <= g.turn).forEach(r => {
    earn(r.amt, 'sugarcane');
    log('coins', { en: `Sugar mill paid ${rs(r.amt)}.`, ur: `شوگر مل نے ${rs(r.amt)} ادا کیے۔` }, 'ok');
    notify('news', 'factory', { en: 'Mill payment received', ur: 'مل کی ادائیگی موصول' }, { en: rs(r.amt), ur: rs(r.amt) });
  });
  g.recv = g.recv.filter(r => r.due > g.turn);

  // orchard upkeep every March
  const orchards = g.plots.filter(p => p.crop === 'mango');
  if (m === 2 && orchards.length) {
    orchards.forEach(() => pay(CROPS.mango.upkeep, 'upkeep'));
    log('leaf', { en: 'Annual orchard upkeep paid (Rs 20,000 per acre).', ur: 'باغ کی سالانہ دیکھ بھال ادا (20,000 روپے فی ایکڑ)۔' });
  }

  // the arhti quietly covers any shortfall — and adds it to what you owe him
  if (g.cash < 0) {
    const short = -g.cash;
    g.advance += short;
    g.cash = 0;
    log('alert', { en: `The arhti covered a ${rs(short)} shortfall — you now owe him ${rs(g.advance)}.`, ur: `آڑھتی نے ${rs(short)} کی کمی پوری کی — اب آپ اس کے ${rs(g.advance)} کے مقروض ہیں۔` }, 'bad');
    notify('news', 'wallet', { en: 'Arhti covered a shortfall', ur: 'آڑھتی نے کمی پوری کی' }, { en: `Your balance with him is now ${rs(g.advance)}.`, ur: `اب آپ کا بیلنس ${rs(g.advance)} ہے۔` });
    queueTip('arhti');
  }

  // track when the farm first became debt-free after carrying debt (for the challenge and the report)
  if (g.loan === 0 && g.advance === 0 && g.flags.hadDebt && g.flags.debtFreeTurn == null) g.flags.debtFreeTurn = g.turn;
  if (g.loan > 0 || g.advance > 0) g.flags.hadDebt = true;
}

function rollEvents(m) {
  const cards = [];
  const evMult = DIFF[g.diff].ev;
  for (const e of EVENTS) {
    if (cards.length >= 2) break;
    if (e.m && !e.m.includes(m)) continue;
    const chance = e.p * (e.type === 'news' || e.type === 'good' ? 1 : evMult);
    if (rnd() >= chance) continue;
    const extra = e.apply();
    const body = tx(e.adv) + (extra ? ' ' + tx(extra) : '');
    cards.push({ type: e.type, icon: e.icon, title: tx(e), body });
    const kind = e.type === 'news' ? 'news' : e.type === 'good' ? 'ok' : 'warn';
    log(e.icon, { en: e.en + ' — ' + e.adv.en, ur: e.ur + ' — ' + e.adv.ur }, kind);
    notify(e.type === 'good' ? 'news' : e.type, e.icon, { en: e.en, ur: e.ur }, { en: e.adv.en + (extra ? ' ' + extra.en : ''), ur: e.adv.ur + (extra ? ' ' + extra.ur : '') });
  }
  return cards;
}

function rollPests(m) {
  const evMult = DIFF[g.diff].ev;
  g.plots.forEach(p => {
    if (!p.crop || p.pest) return;
    const risks = CROPS[p.crop].pests;
    for (const id in risks) {
      const r = risks[id];
      if (!r.m.includes(m)) continue;
      const chance = r.p * evMult * (p.mono ? 1.4 : 1) * (p.shield ? .3 : 1);
      if (rnd() < chance) {
        p.pest = { id, months: 0 };
        log('bug', { en: `${PESTS[id].en} spotted on ${p.name}. Spray now or lose yield.`, ur: `${p.name} پر ${PESTS[id].ur} نظر آئی۔ ابھی سپرے کریں ورنہ نقصان۔` }, 'bad');
        notify('pest', 'bug', { en: `${PESTS[id].en} on ${p.name}`, ur: `${p.name} پر ${PESTS[id].ur}` }, { en: `Spray costs ${rs(PESTS[id].spray)}; unsprayed damage up to ${Math.round(PESTS[id].dmg * 100)} %.`, ur: `سپرے ${rs(PESTS[id].spray)}؛ بغیر سپرے ${Math.round(PESTS[id].dmg * 100)}٪ تک نقصان۔` });
        break;
      }
    }
  });
}

function updateMarket() {
  const vol = DIFF[g.diff].vol;
  const target = Math.pow(1.005, g.turn);   // ~6 % a year inflation drift
  CROP_IDS.forEach(c => {
    const pr = g.prices[c];
    const cr = CROPS[c];
    pr.lvl += (target - pr.lvl) * .1 + pr.lvl * cr.vol * vol * rnorm();
    pr.lvl = clamp(pr.lvl, .45 * target, 2.2 * target);
    pr.hist.push(Math.round(price(c)));
  });
  // TODO(student): real mandi price feed — replace this random walk with rates fetched from the Kisan Mandi Rate Board template (projects/01) or AMIS, keeping pr.hist as the offline cache with a "last synced" stamp.
}

function yearEnd() {
  const y = yOf(g.turn - 1);
  const s = g.stats.yr;
  const nw = netWorth();
  g.years.push({ y, income: Math.round(s.income), expense: Math.round(s.expense), soil: Math.round(avgSoil()), water: Math.round(s.water), avail: Math.round(s.avail), harvests: s.harvests, nw: Math.round(nw), grade: grade().letter, cash: Math.round(g.cash) });
  g.stats.yr = { income: 0, expense: 0, water: 0, avail: 0, harvests: 0 };
  log('calendar', { en: `Year ${y} closed: income ${rsk(s.income)}, expenses ${rsk(s.expense)}, net worth ${rsk(nw)}.`, ur: `سال ${y} مکمل: آمدن ${rsk(s.income)}، اخراجات ${rsk(s.expense)}، کل مالیت ${rsk(nw)}۔` }, 'news');
  notify('farm', 'calendar', { en: `Year ${y} report card`, ur: `سال ${y} کا رپورٹ کارڈ` }, { en: `Net worth ${rsk(nw)}, grade so far ${grade().letter}.`, ur: `کل مالیت ${rsk(nw)}، اب تک گریڈ ${grade().letter}۔` });
}

function finishGame() {
  g.over = true;
  const gr = grade();
  const ch = CHALLENGES.find(c => c.id === g.challenge);
  const won = ch ? !!ch.check() : null;
  g.flags.result = { score: gr.score, letter: gr.letter, nw: Math.round(gr.nw), sust: gr.sust.index, won };
  recordRun(gr, ch, won);
}

// ---------- engine: market & finance actions ----------
function sell(c, qty) {
  const it = g.inv.find(x => x.crop === c);
  if (!it || g.over) return false;
  qty = clamp(+qty || 0, 0, it.qty);
  if (qty <= 0) return false;

  const viaArhti = g.advance > 0;
  const pr = price(c) * (viaArhti ? .95 : 1);
  const commission = viaArhti ? .05 : .03;
  const gross = qty * pr;
  const net = gross * (1 - commission);
  let repay = 0;
  if (viaArhti) {
    repay = Math.min(g.advance, net);
    g.advance -= repay;
    if (g.advance < 1) g.advance = 0;
  }
  earn(net, c);
  g.cash -= repay;
  it.qty -= qty;
  g.inv = g.inv.filter(x => x.qty >= 1);
  g.credit = clamp(g.credit + (viaArhti ? 0 : 1), 0, 100);

  const kept = repay ? `, ${rs(repay)} kept by the arhti` : '';
  const keptUr = repay ? `، ${rs(repay)} آڑھتی نے رکھ لیے` : '';
  log('coins', { en: `Sold ${nf.format(qty)} maunds ${CROPS[c].en} at ${rs(pr)} → ${rs(net)} net${kept}.`, ur: `${nf.format(qty)} من ${CROPS[c].ur} ${rs(pr)} پر بیچی → خالص ${rs(net)}${keptUr}۔` }, 'ok');
  toast(`${t('sold')}: ${rs(net - repay)} ${t('net')}`, 'ok');
  autosave();
  return net;
}

function takeLoan(amt) {
  amt = Math.round(+amt || 0);
  if (amt <= 0 || g.over) return false;
  if (g.credit < 50) return fail(t('b_low_credit'));
  if (g.loan + amt > LOAN_CAP) return fail(`${t('b_loan')}: ${t('balance')} ≤ ${rs(LOAN_CAP)}`);
  g.loan += amt;
  g.cash += amt;
  g.flags.hadDebt = true;
  log('building', { en: `Bank loan ${rs(amt)} disbursed.`, ur: `بینک قرض ${rs(amt)} جاری۔` });
  autosave();
  return true;
}
function repayLoan(amt) {
  amt = Math.min(Math.round(+amt || 0), Math.ceil(g.loan), g.cash);
  if (amt <= 0) return false;
  g.loan = Math.max(0, g.loan - amt);
  if (g.loan < 1) g.loan = 0;
  g.cash -= amt;
  g.credit = clamp(g.credit + amt / 100000, 0, 100);
  log('building', { en: `Repaid ${rs(amt)} to the bank.`, ur: `بینک کو ${rs(amt)} واپس کیے۔` }, 'ok');
  autosave();
  return true;
}
function takeAdvance(amt) {
  amt = Math.round(+amt || 0);
  if (amt <= 0 || g.over) return false;
  if (g.advance + amt > ADV_CAP) return fail(`${t('b_adv')}: ≤ ${rs(ADV_CAP)}`);
  g.advance += amt;
  g.cash += amt;
  g.flags.hadDebt = true;
  log('wallet', { en: `Arhti advanced ${rs(amt)} — sales now go through him.`, ur: `آڑھتی نے ${rs(amt)} پیشگی دیے — اب فروخت اسی کے ذریعے۔` }, 'warn');
  queueTip('arhti');
  autosave();
  return true;
}
function repayAdvance(amt) {
  amt = Math.min(Math.round(+amt || 0), Math.ceil(g.advance), g.cash);
  if (amt <= 0) return false;
  g.advance = Math.max(0, g.advance - amt);
  if (g.advance < 1) g.advance = 0;
  g.cash -= amt;
  log('wallet', { en: `Repaid ${rs(amt)} to the arhti.`, ur: `آڑھتی کو ${rs(amt)} واپس کیے۔` }, 'ok');
  autosave();
  return true;
}
function buyInsurance() {
  if (g.insured > g.turn || g.over) return false;
  const standing = sum(g.plots.map(p => estimate(p)?.value || 0));
  const premium = Math.max(10000, Math.round(standing * .02));
  if (g.cash < premium) return fail(t('not_enough'));
  pay(premium, 'insurance');
  g.insured = g.turn + 6;
  log('shield-check', { en: `Crop insurance bought for 6 months (premium ${rs(premium)}).`, ur: `6 ماہ کی فصل انشورنس (پریمیم ${rs(premium)})۔` }, 'ok');
  autosave();
  return true;
}
function buySolar() {
  if (g.solar || g.over) return false;
  if (g.cash < SOLAR_COST) return fail(t('not_enough'));
  pay(SOLAR_COST, 'machinery');
  g.solar = true;
  log('zap', { en: 'Solar tubewell installed — 60 acre-inches a month at zero running cost.', ur: 'سولر ٹیوب ویل نصب — ہر ماہ 60 ایکڑ انچ بغیر خرچ۔' }, 'ok');
  autosave();
  return true;
}
function setOption(key, value) {
  if (!['autoIrr', 'combine'].includes(key)) return;
  g[key] = !!value;
  autosave();
}

// ---------- engine: scoring ----------
function invValue() {
  return sum(g.inv.map(it => it.qty * price(it.crop) * .97));
}
function orchardValue(p) {
  if (p.crop !== 'mango') return 0;
  return p.age < 36 ? 80000 + p.age * 3000 : 250000;
}
function netWorth() {
  const assets = g.cash + invValue() + sum(g.recv.map(r => r.amt)) + sum(g.plots.map(orchardValue)) + (g.solar ? SOLAR_COST * .7 : 0);
  return assets - g.loan - g.advance;
}
function sustainability() {
  const soil = avgSoil();
  const weff = g.stats.waterTotal > 0 ? clamp(g.stats.harvestValue / g.stats.waterTotal / 12000 * 100, 0, 100) : 50;
  const distinct = Object.keys(g.stats.grown).filter(c => c !== 'manure').length;
  const rotationDiscipline = g.stats.sows ? 100 * (1 - g.stats.repeats / g.stats.sows) : 100;
  const div = .6 * Math.min(100, distinct * 22) + .4 * rotationDiscipline;
  return { soil: Math.round(soil), weff: Math.round(weff), div: Math.round(div), index: Math.round(.4 * soil + .3 * weff + .3 * div) };
}
function grade() {
  const nw = netWorth();
  const s = sustainability();
  // the benchmark grows with elapsed time so the interim "grade so far" is meaningful; at 60 turns it equals five years of par income
  const yearsElapsed = Math.max(g.turn, 1) / 12;
  const par = g.startCash + PAR_PER_ACRE_YEAR * 16 * yearsElapsed;
  const fin = clamp(50 + 50 * Math.log2(Math.max(nw, 1) / par), 0, 100);
  const score = Math.round(.6 * fin + .4 * s.index);
  let letter = 'F';
  if (score >= 90) letter = 'A+';
  else if (score >= 80) letter = 'A';
  else if (score >= 65) letter = 'B';
  else if (score >= 50) letter = 'C';
  else if (score >= 35) letter = 'D';
  return { score, letter, fin: Math.round(fin), sust: s, nw };
}
function achievements() {
  const s = sustainability();
  const nw = netWorth();
  const list = [
    ['rotation', g.stats.repeats === 0 && g.stats.sows >= 16, 'refresh'],
    ['debt', g.loan === 0 && g.advance === 0, 'piggy'],
    ['solar', g.solar, 'zap'],
    ['soil', s.soil >= 70, 'leaf'],
    ['water', s.weff >= 75, 'droplet'],
    ['mango', g.stats.mango > 0, 'sun'],
    ['insured', !!g.flags.insuredLoss, 'shield-check'],
    ['rich', nw >= 1e7, 'trophy'],
    ['diverse', Object.keys(g.stats.grown).length >= 8, 'layers'],
    ['legume', g.stats.legumePlots >= 6, 'sprout']
  ];
  return list.map(([id, got, icon]) => ({ id, got, icon }));
}

// ---------- engine: hall of fame ----------
function recordRun(gr, ch, won) {
  const hall = store.get('hall', []);
  hall.unshift({ name: g.name, diff: g.diff, challenge: ch ? ch.id : null, won, grade: gr.letter, score: gr.score, nw: Math.round(gr.nw), sust: gr.sust.index, seed: g.seed, date: new Date().toISOString().slice(0, 10) });
  if (hall.length > 30) hall.length = 30;
  store.set('hall', hall);
}

// ---------- engine: tutorial ----------
function queueTip(key) {
  if (!g.tut.on || !S.tips || g.tut.done[key] || g.tut.queue.includes(key) || g.turn > 13) return;
  g.tut.queue.push(key);
}
function dismissTip(key) {
  g.tut.done[key] = true;
  g.tut.queue = g.tut.queue.filter(x => x !== key);
  autosave();
  refresh();
}

// ---------- engine: persistence ----------
function autosave() {
  if (g) store.set('auto', g);
}
function saveSlot(n) {
  if (!g) return;
  store.set('slot' + n, g);
  toast(t('saved'), 'ok');
}
function loadSlot(n) {
  const saved = store.get('slot' + n);
  if (!saved) return false;
  adoptGame(saved);
  toast(t('loaded'), 'ok');
  return true;
}
// Older saves (v1) lack fields added later; fill them so the engine never sees undefined.
function adoptGame(saved) {
  g = saved;
  g.inbox = g.inbox || [];
  g.plan = g.plan || {};
  g.flags = g.flags || {};
  g.stats.incomeBy = g.stats.incomeBy || {};
  g.stats.expenseBy = g.stats.expenseBy || {};
  g.stats.legumePlots = g.stats.legumePlots || 0;
  CROP_IDS.forEach(c => {
    if (!g.prices[c]) g.prices[c] = { lvl: 1, hist: Array(g.turn + 1).fill(CROPS[c].price) };
  });
  ui.sel = null;
  ui.lastStage = {};
  autosave();
}
function slotMeta(n) {
  const s = store.get('slot' + n);
  if (!s) return null;
  return { name: s.name, turn: s.turn, cash: s.cash, diff: s.diff, over: s.over };
}
function afterAction() {
  autosave();
  refresh();
}

// ---------- farm renderer: isometric SVG ----------
const ISO = { w: 64, h: 32, ox: 280, oy: 74 };
// Back-to-front plant positions inside a tile (dx, dy) so later sprites overlap earlier ones correctly.
const SPOTS = [[0, -18], [-36, 0], [36, 0], [0, 0], [0, 18]];
const TREE_SPOTS = [[0, -14], [-34, 2], [34, 2]];

function plotXY(i) {
  const r = Math.floor(i / 4);
  const c = i % 4;
  return { x: ISO.ox + (c - r) * ISO.w, y: ISO.oy + (c + r) * ISO.h };
}
// Depleted soil is pale and grey; healthy soil is a deep, dark brown.
function soilTint(soil) {
  return lerpColor('#cdb795', '#6e4a2a', soil / 100);
}
function growthFraction(p) {
  const c = CROPS[p.crop];
  if (c.orchard) return clamp(p.age / 36, .08, 1);
  if (p.ready) return 1;
  return clamp((p.stage + .3) / c.dur, .1, 1);
}
// Three-stop colour ramp used by most crops: young green → mature green → ripe tint.
function ramp(f, a, b, c) {
  if (f < .6) return lerpColor(a, b, f / .6);
  return lerpColor(b, c, (f - .6) / .4);
}

// ----- procedural plant sprites (one function per crop family) -----
function plantWheat(f, x, y, ripe) {
  const col = ripe ? '#b8860b' : ramp(f, '#5f9a3a', '#a7c957', '#d9a521');
  const h = 6 + 16 * f;
  let s = '';
  for (let k = -1; k <= 1; k++) {
    s += `<line x1="${x + k * 4}" y1="${y}" x2="${x + k * 4 + k}" y2="${y - h}" stroke="${col}" stroke-width="1.6" stroke-linecap="round"/>`;
    if (f > .55) s += `<ellipse cx="${x + k * 4 + k}" cy="${y - h}" rx="1.8" ry="4" fill="${col}"/>`;
  }
  return s;
}
function plantRice(f, x, y) {
  const col = f > .75 ? '#c9b74a' : '#6fae3f';
  const h = 5 + 13 * f;
  let s = '';
  for (let k = -2; k <= 2; k++) {
    s += `<line x1="${x}" y1="${y}" x2="${x + k * 3}" y2="${y - h}" stroke="${col}" stroke-width="1.2" stroke-linecap="round"/>`;
  }
  return s;
}
function plantCotton(f, x, y) {
  const r = 3 + 6 * f;
  let s = `<circle cx="${x}" cy="${y - r}" r="${r}" fill="#4f8f3a"/>`;
  if (f > .7) {
    s += `<circle cx="${x - r * .5}" cy="${y - r * 1.1}" r="1.9" fill="#fff"/>`;
    s += `<circle cx="${x + r * .5}" cy="${y - r * .8}" r="1.9" fill="#fff"/>`;
    s += `<circle cx="${x}" cy="${y - r * 1.6}" r="1.9" fill="#fff"/>`;
  }
  return s;
}
function plantCane(f, x, y) {
  const h = 10 + 30 * f;
  let s = '';
  for (let k = -1; k <= 1; k++) {
    const tx = x + k * 4;
    s += `<line x1="${tx}" y1="${y}" x2="${tx + k}" y2="${y - h}" stroke="#86a84a" stroke-width="2"/>`;
    s += `<path d="M${tx + k} ${y - h} l-5 -4 M${tx + k} ${y - h} l5 -3" stroke="#5f9a3a" stroke-width="1.3" fill="none"/>`;
  }
  return s;
}
function plantMaize(f, x, y) {
  const h = 8 + 26 * f;
  let s = `<line x1="${x}" y1="${y}" x2="${x}" y2="${y - h}" stroke="#5f9a3a" stroke-width="1.8"/>`;
  s += `<path d="M${x} ${y - h * .45} q-9 -3 -11 3 M${x} ${y - h * .7} q9 -3 11 3" stroke="#6fae3f" stroke-width="1.6" fill="none"/>`;
  if (f > .7) s += `<ellipse cx="${x + 3}" cy="${y - h * .55}" rx="2" ry="5" fill="#e8c23a"/>`;
  return s;
}
function plantOnion(f, x, y) {
  const h = 4 + 8 * f;
  let s = '';
  for (let k = -2; k <= 2; k++) {
    s += `<line x1="${x}" y1="${y}" x2="${x + k * 2.2}" y2="${y - h}" stroke="#4f8f3a" stroke-width="1.3" stroke-linecap="round"/>`;
  }
  if (f > .5) s += `<circle cx="${x}" cy="${y}" r="${2 + 2 * f}" fill="#b06a94"/>`;
  return s;
}
function plantTomato(f, x, y) {
  const r = 3 + 5 * f;
  let s = `<circle cx="${x}" cy="${y - r}" r="${r}" fill="#4f8f3a"/>`;
  if (f > .65) {
    s += `<circle cx="${x - 2.5}" cy="${y - r}" r="1.8" fill="#d94f3a"/>`;
    s += `<circle cx="${x + 2.5}" cy="${y - r * 1.3}" r="1.8" fill="#d94f3a"/>`;
  }
  return s;
}
function plantPotato(f, x, y) {
  const r = 2.5 + 4.5 * f;
  let s = `<ellipse cx="${x}" cy="${y - r * .7}" rx="${r * 1.3}" ry="${r * .8}" fill="#5f9a3a"/>`;
  if (f > .5) s += `<path d="M${x - 2} ${y - r * 1.4} l1.5 -3 M${x + 2} ${y - r * 1.4} l-1 -3" stroke="#fff" stroke-width="1.2"/>`;
  return s;
}
function plantChickpea(f, x, y) {
  const r = 2 + 4 * f;
  let s = `<circle cx="${x}" cy="${y - r}" r="${r}" fill="#7ea84f"/>`;
  if (f > .7) s += `<circle cx="${x + 1}" cy="${y - r * .6}" r="1.4" fill="#b89b5e"/>`;
  return s;
}
function plantCanola(f, x, y) {
  const h = 6 + 18 * f;
  let s = `<line x1="${x}" y1="${y}" x2="${x}" y2="${y - h}" stroke="#6fae3f" stroke-width="1.4"/>`;
  if (f > .5) {
    s += `<circle cx="${x - 2}" cy="${y - h}" r="2" fill="#e3c13a"/>`;
    s += `<circle cx="${x + 2}" cy="${y - h + 2}" r="2" fill="#e3c13a"/>`;
  }
  return s;
}
function plantSunflower(f, x, y) {
  const h = 8 + 24 * f;
  let s = `<line x1="${x}" y1="${y}" x2="${x}" y2="${y - h}" stroke="#5f9a3a" stroke-width="1.8"/>`;
  if (f > .6) {
    s += `<circle cx="${x}" cy="${y - h}" r="4.5" fill="#f0b429"/>`;
    s += `<circle cx="${x}" cy="${y - h}" r="2" fill="#5a3a1a"/>`;
  } else {
    s += `<path d="M${x} ${y - h * .5} q-7 -2 -8 3" stroke="#6fae3f" stroke-width="1.4" fill="none"/>`;
  }
  return s;
}
function plantManure(f, x, y) {
  const h = 4 + 9 * f;
  let s = '';
  for (let k = -1; k <= 1; k++) {
    s += `<line x1="${x}" y1="${y}" x2="${x + k * 4}" y2="${y - h}" stroke="#3f8f3a" stroke-width="1.6" stroke-linecap="round"/>`;
  }
  return s;
}
function plantMango(p, f, x, y, fruiting) {
  const h = 6 + 10 * f;
  const r = 5 + 13 * f;
  let s = `<rect x="${x - 1.5}" y="${y - h}" width="3" height="${h}" fill="#7a5230"/>`;
  s += `<circle cx="${x}" cy="${y - h - r * .6}" r="${r}" fill="#3f6b2a"/>`;
  s += `<circle cx="${x - r * .4}" cy="${y - h - r * .8}" r="${r * .55}" fill="#4f8a35"/>`;
  if (fruiting) {
    s += `<circle cx="${x - r * .5}" cy="${y - h - r * .3}" r="1.8" fill="#e9a33a"/>`;
    s += `<circle cx="${x + r * .4}" cy="${y - h - r * .5}" r="1.8" fill="#e9a33a"/>`;
  }
  return s;
}
function fallowMarks(p, x, y) {
  let s = '';
  SPOTS.forEach(([dx, dy], k) => {
    const px = x + dx;
    const py = y + dy;
    s += `<path d="M${px - 3} ${py} l2 -3 M${px + 2} ${py} l1 -2" stroke="#8a6a44" stroke-width="1" fill="none"/>`;
    if (p.soil < 40 && k % 2 === 0) s += `<path d="M${px - 6} ${py + 3} l5 -1 l3 2" stroke="#9c8464" stroke-width=".8" fill="none"/>`;
  });
  return s;
}

function cropSprite(p, x, y) {
  if (!p.crop) return fallowMarks(p, x, y);
  const c = CROPS[p.crop];
  const f = growthFraction(p);
  const ripe = p.over > 0;
  if (c.orchard) {
    return TREE_SPOTS.map(([dx, dy]) => plantMango(p, f, x + dx, y + dy, p.ready)).join('');
  }
  const draw = {
    wheat: (px, py) => plantWheat(f, px, py, ripe),
    rice: (px, py) => plantRice(f, px, py),
    cotton: (px, py) => plantCotton(f, px, py),
    sugarcane: (px, py) => plantCane(f, px, py),
    maize: (px, py) => plantMaize(f, px, py),
    onion: (px, py) => plantOnion(f, px, py),
    tomato: (px, py) => plantTomato(f, px, py),
    potato: (px, py) => plantPotato(f, px, py),
    chickpea: (px, py) => plantChickpea(f, px, py),
    canola: (px, py) => plantCanola(f, px, py),
    sunflower: (px, py) => plantSunflower(f, px, py),
    manure: (px, py) => plantManure(f, px, py)
  }[p.crop] || ((px, py) => plantWheat(f, px, py, ripe));
  const spots = p.crop === 'sugarcane' ? [SPOTS[0], SPOTS[1], SPOTS[2], SPOTS[4]] : SPOTS;
  return spots.map(([dx, dy]) => draw(x + dx, y + dy)).join('');
}

function badge(cx, cy, icon, color) {
  return `<g class="badge-g"><circle cx="${cx}" cy="${cy}" r="8" fill="#fff"/>` +
    `<use href="#i-${icon}" x="${cx - 5}" y="${cy - 5}" width="10" height="10" fill="none" stroke="${color}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>`;
}
function plotBadges(p, x, y) {
  const list = [];
  if (p.ready) list.push(['check', '#2f7d32']);
  if (p.pest) list.push(['bug', '#b3342a']);
  const thirsty = p.crop && ((p.wN && p.wSum / p.wN < .8) || (farmNeed() > 0 && g.canalNow / farmNeed() < .7));
  if (thirsty && !p.irrig && !g.autoIrr) list.push(['droplet', '#1d5a7a']);
  if (p.irrig) list.push(['droplet', '#4f9ccb']);
  if (p.waterlog) list.push(['waves', '#4f9ccb']);
  return list.map(([icon, color], k) => badge(x + 36 - k * 17, y - 26, icon, color)).join('');
}
function plotAria(p) {

}

function plotTile(p) {
  const { x, y } = plotXY(p.i);
  const sel = ui.sel === p.i;
  const top = `${x},${y - 32} ${x + 64},${y} ${x},${y + 32} ${x - 64},${y}`;
  const right = `${x},${y + 32} ${x + 64},${y} ${x + 64},${y + 8} ${x},${y + 40}`;
  const left = `${x - 64},${y} ${x},${y + 32} ${x},${y + 40} ${x - 64},${y + 8}`;
  const fill = soilTint(p.soil);

  // remember the growth key so a changed sprite gets the grow-in animation
  const key = p.crop ? `${p.crop}:${p.stage}:${p.ready ? 1 : 0}` : 'none';
  const grew = p.crop && ui.lastStage[p.i] !== undefined && ui.lastStage[p.i] !== key;
  ui.lastStage[p.i] = key;

  let furrows = '';
  [.25, .5, .75].forEach(s => {
    furrows += `<line x1="${x - 64 + 64 * s}" y1="${y + 32 * s}" x2="${x + 64 * s}" y2="${y - 32 + 32 * s}" stroke="rgba(0,0,0,.12)" stroke-width="1"/>`;
  });
  const paddy = p.crop === 'rice' && !p.ready ? `<polygon points="${top}" fill="rgba(79,156,203,.35)"/>` : '';

  return `<g class="plot ${sel ? 'sel' : ''}" data-i="${p.i}" tabindex="0" role="button" aria-label="${esc(plotAria(p))}" aria-pressed="${sel}">
    <polygon class="glow" points="${top}" fill="none" stroke="#fff" stroke-width="6" style="filter:blur(3px)"/>
    <polygon points="${left}" fill="${lerpColor(fill, '#000000', .35)}"/>
    <polygon points="${right}" fill="${lerpColor(fill, '#000000', .2)}"/>
    <polygon class="tile" points="${top}" fill="${fill}" stroke="rgba(78,50,25,.4)" stroke-width="1.2"/>
    ${furrows}${paddy}
    <g class="sprite ${grew ? 'grew' : ''}" style="transform-origin:${x}px ${y}px">${cropSprite(p, x, y)}</g>

}

// ---------- HUD ----------
function waterStatus() {
  const m = mOf(g.turn);
  const need = farmNeed();
  const cover = g.canalNow + RAIN[m] * activeAcres();
  let cls = '';
  if (need > 0 && cover < need * .7) cls = 'bad';
  else if (need > 0 && cover < need) cls = 'warn';
  return { need, share: g.canalNow, rain: RAIN[m] * activeAcres(), cls };
}
function hudChip(id, icon, cls, k, v, sub = '') {
  return `<div class="hchip ${cls}" id="${id}"><div class="ico">${ic(icon)}</div><div><div class="k">${k}</div><div class="v num">${v}${sub ? ` 
    <span class="muted small">${sub}</span>` : ''}</div></div></div>`;
}
function hudHTML() {
  const m = mOf(g.turn);
  const w = waterStatus();
  const season = t(seasonOf(m));
  const soil = Math.round(avgSoil());
  const soilCls = soil < 40 ? 'bad' : soil < 55 ? 'warn' : '';
  const pct = Math.round(100 * g.turn / TURNS);
  const endLabel = g.over ? t('game_over') : t('end_month');
  return `
    ${hudChip('hudDate', 'calendar', 'gold', `${t('year')} ${yOf(Math.min(g.turn, TURNS - 1))}`, mName(m), season)}
    ${hudChip('hudCashChip', 'coins', '', t('cash'), `<span id="hudCash">${rsk(g.cash)}</span>`)}
    ${hudChip('hudWater', 'droplet', w.cls || 'sky', t('water'), `${nf.format(w.need)} / ${nf.format(w.share)}`, `${t('need')} / ${t('share')}`)}
    ${hudChip('hudSoil', 'sprout', soilCls, t('soil'), soil, t('avg'))}
    ${hudChip('hudCredit', 'star', g.credit < 50 ? 'warn' : '', t('rep'), Math.round(g.credit))}
    <div class="turnbar"><div class="k"><span>${t('progress')}</span><span class="num">${g.turn}/${TURNS}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>
    <button class="btn gold lg" id="endBtn" ${g.over ? 'disabled' : ''}>${ic('arrow-right')} ${endLabel}</button>`;
}

function sowListHTML(p) {
  const m = mOf(g.turn);
  const options = CROP_IDS.filter(c => CROPS[c].sow.includes(m));
  if (!options.length) return `<div class="note txt">${t('sow_none')}</div>`;
  const prev = p.hist[p.hist.length - 1];
  const rows = options.map(c => {
    const cr = CROPS[c];
    const cost = sowCost(c);
    let flag = '';
    if (prev === c && !cr.green) flag = `<span class="tag bad">${t('sow_mono').split(' — ')[0]}</span>`;
    else if (prev && prev !== c && CROPS[prev].cat !== cr.cat) flag = `<span class="tag">+3 ${t('soil').toLowerCase()}</span>`;
    const afford = g.cash >= cost;
    return `<button class="sowopt" data-sow="${c}" ${afford ? '' : 'disabled'}>
      <span class="sw" style="background:${cr.color};border:1px solid rgba(0,0,0,.15)"></span>
      <span class="nm">${tx(cr)}<br><span class="small muted">${cr.dur} ${t('mo')} · ${cr.water} ${t('acre_in')}${t('per_mo')} ${flag}</span></span>
      <span class="cs num">${rs(cost)}</span></button>`;
  }).join('');
  return `<div class="small muted">${t('sow_pick')} ${mName(m)}:</div><div class="sowlist stagger">${rows}</div>
    <button class="btn ghost sm" id="sowBack">${ic('arrow-left')} ${t('back')}</button>`;
}
function plotWaterLine(p) {
  const need = plotNeed(p);
  if (!need) return '';
  const total = farmNeed();
  const ratio = total > 0 ? Math.min(1, g.canalNow / total) : 0;
  const cover = Math.min(1, (need * ratio + RAIN[mOf(g.turn)]) / need);
  const pct = Math.round(cover * 100);
  const deficit = Math.max(0, need - need * cover);
  const cost = g.solar ? t('solar_free') : rs(deficit * dieselPrice());
  let line = `<div class="small">${t('water_cover')} <b>${pct} %</b> ${t('of_need')}`;
  if (cover >= 1) line += ` <span class="tag warn">${t('waterlog_warn')}</span>`;
  else line += ` ${t('tubewell_est')} <b>${cost}</b>.`;
  return line + '</div>';
}
function plotStats(p) {
  const c = CROPS[p.crop];
  const est = estimate(p);
  let html = `<div class="stat"><span>${t('soil')}</span><b class="num">${Math.round(p.soil)}/100</b></div>${soilBar(p.soil)}`;
  if (!c) {
    const prev = p.hist[p.hist.length - 1];
    html += `<div class="stat"><span>${t('prev_crop')}</span><b>${prev ? tx(CROPS[prev]) : t('none')}</b></div>`;
    html += `<div class="note small txt">${t('fallow_hint')}</div>`;
    return html;
  }
  const growth = c.orchard ? `${p.age} ${t('mo')} · ${t('first_fruit')}` : `${Math.min(p.stage, c.dur)}/${c.dur} ${t('mo')}`;
  html += `<div class="stat"><span>${c.orchard ? t('orchard_age') : t('growth')}</span><b class="num">${growth}</b></div>`;
  const wAvg = p.wN ? Math.round(100 * p.wSum / p.wN) : 100;
  html += `<div class="stat"><span>${t('water_st')}</span><b class="num ${wAvg < 80 ? 'muted' : ''}">${wAvg} %</b></div>`;
  html += `<div class="stat"><span>${t('pest')}</span><b>${p.pest ? `<span class="tag bad">${tx(PESTS[p.pest.id])}</span>` : t('none')}</b></div>`;
  if (p.dmg > 0) html += `<div class="stat"><span>${t('damage')}</span><b class="num">−${Math.round(p.dmg * 100)} %</b></div>`;
  if (est) html += `<div class="stat"><span>${t('expected')}</span><b class="num">${nf.format(est.qty)} ${t('maund')} · ${rsk(est.value)}</b></div>`;
  const tags = [];
  if (p.ready) tags.push(`<span class="tag">${t('ready')}</span>`);
  if (p.over) tags.push(`<span class="tag bad">${t('overripe')}</span>`);
  if (p.fert) tags.push(`<span class="tag soil">${t('fert_done')}</span>`);
  if (p.irrig) tags.push(`<span class="tag sky">${t('irrig_on')}</span>`);
  if (p.waterlog) tags.push(`<span class="tag warn">${t('waterlogged')}</span>`);
  if (p.shield) tags.push(`<span class="tag">${t('shield')}</span>`);
  if (tags.length) html += `<div class="chips" style="margin-top:6px">${tags.join('')}</div>`;
  html += plotWaterLine(p);
  return html;
}
function plotActions(p) {
  const c = CROPS[p.crop];
  if (!c) return `<div class="actions"><button class="btn" id="sowOpen">${ic('sprout')} ${t('act_sow')}</button></div>`;
  let html = '<div class="actions">';
  if (p.ready) html += `<button class="btn gold" data-act="harvest">${ic('wheat')} ${c.green ? t('act_plough') : t('act_harvest')} <span class="small">${rs(harvestCost(p.crop))}</span></button>`;
  html += `<button class="btn ${p.irrig ? 'ghost' : 'sky'}" data-act="irrigate">${ic('droplet')} ${p.irrig ? t('act_irrig_off') : t('act_irrig')}</button>`;
  if (!c.green) html += `<button class="btn ghost" data-act="fertilize" ${p.fert ? 'disabled' : ''}>${ic('flask')} ${t('act_fert')} 
    <span class="small">${rs(FERT_COST * modMult('input'))}</span></button>`;
  const sprayCost = p.pest ? PESTS[p.pest.id].spray : PREV_SPRAY;
  html += `<button class="btn ${p.pest ? 'danger' : 'ghost'}" data-act="spray" ${p.shield ? 'disabled' : ''}>${ic('bug')} ${p.pest ? t('act_spray') : t('act_spray_prev')} 
    <span class="small">${rs(sprayCost * modMult('input'))}</span></button>`;
  if (ui.confirmClear === p.i) html += `<button class="btn danger" data-act="fallow">${ic('alert')} ${t('act_confirm_clear')}</button>`;
  else html += `<button class="btn ghost" data-act="clear">${ic('trash')} ${t('act_fallow')}</button>`;
  return html + '</div>';
}
function panelHTML() {
  const closeBtn = `<button class="xbtn close-sheet" id="sheetClose" aria-label="${t('close')}">${ic('x')}</button>`;
  if (ui.sel == null) {
