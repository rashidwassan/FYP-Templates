const FACE_ROT = { 1: [0, 0], 2: [90, 0], 3: [0, -90], 4: [0, 90], 5: [-90, 0], 6: [0, 180] };

// ---------- animations ----------
const tween = (dur, fn) => new Promise(res => {
  if (dur <= 0) {
    fn(1);
    res();
    return;
  }
  const t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / dur);
    fn(k);
    if (k < 1) requestAnimationFrame(step);
    else res();
  };
  requestAnimationFrame(step);
});

function setFace(p, d, instant = true) {
  const cube = $('#cube' + p);
  if (!cube || d == null) return;
  const [rx, ry] = FACE_ROT[d];
  cube.style.transition = instant ? 'none' : '';
  cube.style.transform = `rotateX(${rx + UI.spin * 360}deg) rotateY(${ry + UI.spin * 360}deg)`;
  if (instant) void cube.offsetWidth;
}

async function animateDice(p, d) {
  const dice = $('#dc' + p);
  const cube = $('#cube' + p);
  if (!cube) return;
  dice.classList.remove('idle');
  if (prefs.rules.quickDice || motionOff()) {
    setFace(p, d, true);
    await sleep(120);
    return;
  }
  UI.spin++;
  setFace(p, d, false);
  dice.classList.add('rolling');
  await sleep(900);
  dice.classList.remove('rolling');
}

/** Hop a token square by square; `idp` selects the live board ('tok') or the replay board ('rtok'). */
async function animateHop(mv, idp = 'tok', speed = 1) {
  const el = $(`#${idp}-${mv.p}-${mv.i}`);
  if (!el) return;
  el.parentElement.appendChild(el);
  el.classList.remove('legal', 'hint');
  const steps = mv.from === -1 ? [0] : Array.from({ length: mv.to - mv.from }, (_, k) => mv.from + 1 + k);
  const per = motionOff() ? 0 : clamp(Math.round(820 / steps.length / speed), 40, 150);
  let [cx, cy] = tokXY(el);
  for (const pos of steps) {
    const [nx, ny] = posPoint(mv.p, pos, mv.i);
    await tween(per, k => {
      const lift = Math.sin(Math.PI * k) * 10;
      const sc = 1 + Math.sin(Math.PI * k) * 0.2;
      setTok(el, cx + (nx - cx) * k, cy + (ny - cy) * k - lift, sc);
    });
    setTok(el, nx, ny, pos === FINISH ? 0.45 : 1);
    cx = nx;
    cy = ny;
    if (idp === 'tok') Snd.hop();
  }
}

async function animateCapture(caps, idp = 'tok') {
  await Promise.all(caps.map(async c => {
    const el = $(`#${idp}-${c.p}-${c.i}`);
    if (!el) return;
    el.parentElement.appendChild(el);
    const [sx, sy] = tokXY(el);
    const [tx, ty] = posPoint(c.p, -1, c.i);
    await tween(motionOff() ? 0 : 650, k => {
      const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      const lift = Math.sin(Math.PI * k) * 46;
      setTok(el, sx + (tx - sx) * e, sy + (ty - sy) * e - lift, 1 + Math.sin(Math.PI * k) * 0.5, k * 720);
    });
    setTok(el, tx, ty, 1);
  }));
}

function confetti() {
  if (motionOff()) return;
  const cv = $('#confetti');
  const ctx = cv.getContext('2d');
  cv.width = innerWidth;
  cv.height = innerHeight;
  cv.classList.add('on');
  const cs = getComputedStyle(document.documentElement);
  const cols = [...SEATS.map(c => cs.getPropertyValue('--' + c).trim() || '#d9a441'), '#d9a441', '#fff'];
  const ps = Array.from({ length: 150 }, () => ({
    x: rnd() * cv.width,
    y: -20 - rnd() * cv.height * 0.5,
    vx: (rnd() - 0.5) * 2.4,
    vy: 2 + rnd() * 3.5,
    r: 4 + rnd() * 5,
    a: rnd() * 6.28,
    va: (rnd() - 0.5) * 0.3,
    c: cols[Math.floor(rnd() * cols.length)]
  }));
  const t0 = performance.now();
  const step = now => {
    const k = (now - t0) / 3200;
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(q => {
      q.x += q.vx;
      q.y += q.vy;
      q.a += q.va;
      q.vy += 0.03;
      ctx.save();
      ctx.translate(q.x, q.y);
      ctx.rotate(q.a);
      ctx.globalAlpha = Math.max(0, 1 - Math.max(0, k - 0.6) / 0.4);
      ctx.fillStyle = q.c;
      ctx.fillRect(-q.r / 2, -q.r / 3, q.r, q.r * 0.66);
      ctx.restore();
    });
    if (k < 1) {
      requestAnimationFrame(step);
    } else {
      cv.classList.remove('on');
      ctx.clearRect(0, 0, cv.width, cv.height);
    }
  };
  requestAnimationFrame(step);
}

// ---------- rendering: tokens / highlights ----------
/** The expert's suggestion for the human to move (cached per legal-move list). */
function hintMove() {
  if (UI.hintFor !== G.legal) {
    UI.hintFor = G.legal;
    UI.hint = G.legal && G.legal.length > 1 ? aiChoose(G, G.turn, G.legal, 'expert') : null;
  }
  return UI.hint;
}

function renderTokens() {
  const g = $('#tokens');
  if (!g || !G) return;
  const humanPick = G.phase === 'move' && isHuman(G.turn) && !UI.paused;
  const legalIdx = new Set(humanPick && G.legal ? G.legal.map(m => m.i) : []);
  const best = humanPick && prefs.rules.hints && G.legal ? hintMove() : null;
  const last = UI.lastMoved;
  g.innerHTML = tokensMarkup(G.players, G.tokens, {
    cls: tk => {
      const mine = tk.p === G.turn;
      let c = mine && legalIdx.has(tk.i) ? 'legal ' : '';
      if (best && mine && best.i === tk.i) c += 'hint ';
      if (last && last[0] === tk.p && last[1] === tk.i && !humanPick) c += 'last';
      return c;
    }
  });
  $$('.tok.legal', g).forEach(el => {
    el.onclick = () => pickToken(+el.dataset.i);
    el.onkeydown = e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        e.stopPropagation();
        pickToken(+el.dataset.i);
      }
    };
  });
}

function renderHL() {
  const g = $('#hl');
  if (!g) return;
  if (!(G && G.phase === 'move' && isHuman(G.turn) && G.legal && !UI.paused)) {
    g.innerHTML = '';
    return;
  }
  g.innerHTML = G.legal.map(m => {
    const [x, y] = posPoint(m.p, m.to, m.i);
    return `<circle class="hl ${SEATS[m.p]}" data-i="${m.i}" cx="${x}" cy="${y}" r="17"/>`;
  }).join('');
  $$('.hl', g).forEach(el => { el.onclick = () => pickToken(+el.dataset.i); });
}

// ---------- rendering: player panels ----------
function buildPanels() {
  const faces = [1, 2, 3, 4, 5, 6].map(f => {
    const pips = PIPS[f].map(k => `<i style="grid-area:${Math.floor(k / 3) + 1}/${(k % 3) + 1}"></i>`).join('');
    return `<span class="face f${f}">${pips}</span>`;
  }).join('');
  for (let p = 0; p < 4; p++) {
    $('#pp' + p).innerHTML = `<div class="pp-head"><div class="avatar" id="av${p}"></div><div class="who"><div class="nm" id="nm${p}"></div><div class="kind" id="kd${p}"></div></div><span class="turnDot" id="td${p}"></span></div>
      <div class="pp-mid"><div class="toks" id="tk${p}"></div><button class="dice idle" id="dc${p}" aria-label="Dice"><div class="cube" id="cube${p}">${faces}</div></button></div>
      <div class="pp-foot"><span class="think" id="th${p}">${ic('cpu')}<span></span></span><span class="pst" id="ps${p}"></span></div>`;
    $('#dc' + p).onclick = () => {
      if (G && G.turn === p) doRoll();
    };
  }
}

function panelKind(pl, p) {
  if (pl.type === 'human') return ic('user') + esc(t('human'));
  if (pl.type === 'ai') return ic('cpu') + esc(t('ai') + ' · ' + t(pl.level));
  return esc(t(SEATS[p]));
}

function panelStats(pl, p) {
  if (pl.type === 'off') return '';
  const st = G.stats[p];
  const place = G.winOrder.indexOf(p);
  let html = `<span title="${esc(t('sixes'))}">${ic('dice')}${st.sixes}</span><span title="${esc(t('captures'))}">${ic('swords')}${st.captures}</span>`;
  if (place >= 0) html += `<span class="place">${ic('trophy')}${esc(t('place' + (place + 1)))}</span>`;
  return html;
}

function renderPanel(pl, p) {
  const el = $('#pp' + p);
  const active = G.turn === p && G.phase !== 'over' && pl.type !== 'off';
  el.classList.toggle('active', active);
  el.classList.toggle('off', pl.type === 'off');
  el.classList.toggle('done', allHome(G, p));
  $('#av' + p).textContent = pl.type === 'off' ? '–' : initials(pl.name);
  $('#nm' + p).textContent = pl.type === 'off' ? t('seat_off') : pl.name;
  $('#kd' + p).innerHTML = panelKind(pl, p);
  const toks = G.tokens[p];
  $('#tk' + p).innerHTML = toks.map(x => `<i class="${x === FINISH ? 'fin' : x >= 0 ? 'on' : ''}"></i>`).join('') + `<b>${homeCount(G, p)}/4</b>`;
  $('#ps' + p).innerHTML = panelStats(pl, p);
  const thinking = active && pl.type === 'ai' && !UI.paused && (G.phase === 'roll' || G.phase === 'move');
  $('#th' + p).classList.toggle('on', thinking);
  $('#th' + p + ' span').textContent = t('thinking');
  const dice = $('#dc' + p);
  const shown = active ? (G.dice || UI.lastDice[p] || 1) : UI.lastDice[p];
  dice.classList.toggle('canroll', active && pl.type === 'human' && G.phase === 'roll' && !UI.paused && !UI.anim);
  dice.classList.toggle('idle', !active && G.phase !== 'over');
  dice.setAttribute('aria-label', shown ? `${t('roll')}: ${shown}` : t('roll'));
  if (shown && !UI.anim) setFace(p, shown, true);
}

function renderPanels() {
  G.players.forEach(renderPanel);
}

// ---------- rendering: status bar + meta ----------
function statusMessage() {
  const p = G.turn;
  const human = isHuman(p);
  if (G.phase === 'over') return `${t('game_over')} — ${t('winner')}: ${name(G.winOrder[0])}`;
  if (UI.paused) return t('paused');
  if (G.phase === 'roll') return human ? t('turn_roll', { name: name(p) }) : t('turn_ai', { name: name(p) });
  if (G.phase === 'move') return human ? t('pick_token', { name: name(p), d: G.dice }) : t('turn_ai', { name: name(p) });
  if (G.phase === 'anim') return t('moving', { name: name(p) });
  return t('waiting');
}

function renderStatus() {
  const sb = $('#status');
  if (!G) return;
  const p = G.turn;
  const msg = statusMessage();
  const showRoll = G.phase === 'roll' && isHuman(p) && !UI.paused && !UI.anim;
  const action = showRoll ? `<button class="btn gold" id="rollBtn">${ic('dice')}${esc(t('roll'))}</button>` : '';
  const canUndo = prefs.rules.casual && UI.undo.length > 0 && !UI.anim && G.phase !== 'over';
  const pauseLbl = esc(UI.paused ? t('resume_game') : t('pause'));
  sb.innerHTML = `<span class="dot ${SEATS[p]}"></span><span class="msg">${esc(msg)}</span>${action}<span class="acts">
    <button class="tb" id="undoBtn" aria-label="${esc(t('undo'))}" title="${esc(t('undo'))}" ${canUndo ? '' : 'disabled'}>${ic('undo')}</button>
    <button class="tb" id="pauseBtn" aria-label="${pauseLbl}" title="${pauseLbl}" ${G.phase === 'over' ? 'disabled' : ''}>${ic(UI.paused ? 'play' : 'pause')}</button>
    <button class="tb" id="statsBtn" aria-label="${esc(t('stats'))}" title="${esc(t('stats'))}">${ic('bar-chart')}</button></span>`;
  $('#rollBtn')?.addEventListener('click', () => doRoll());
  $('#undoBtn').onclick = undo;
  $('#pauseBtn').onclick = togglePause;
  $('#statsBtn').onclick = showStats;
  announce(msg);
}

function logLine(e, players = G.players) {
  const nm = q => (players[q] ? players[q].name : '');
  return t(e.k, {
    name: nm(e.p),
    victim: e.v != null ? nm(e.v) : '',
    d: e.d ?? '',
    place: e.place ? t('place' + e.place) : ''
  });
}

function renderMeta() {
  const last = G.log[0];
  const tn = G.tourney ? Tourney.get() : null;
  const tnLabel = tn && tn.id === G.tourney.id ? `<span class="tn">${ic('trophy')}${esc(tn.name)} · ${esc(t('tn_match', { n: G.tourney.match + 1 }))}</span>` : '';
  $('#meta').innerHTML = `<span>${ic('flag')}${esc(t('turn'))} ${G.turnNo}</span><span>${ic('clock')}<span id="clock">${fmtTime(G.elapsed)}</span></span>${tnLabel}`
    + `<span class="last">${last ? ic('sparkles') + esc(logLine(last)) : ''}</span><span class="keys">${ic('keyboard')}${esc(t('keys_h'))}</span>`;
}

function renderAll() {
  if (!G || !$('#tokens')) return;
  renderPanels();
  renderTokens();
  renderHL();
  renderStatus();
  renderMeta();
  Tutorial.render();
}


// ---------- accessibility: spoken move announcements (assertive live region) ----------
const Speak = {
  say(msg) {
    // TODO(student): spoken announcements — also pass msg to speechSynthesis.speak() with an ur-PK voice when the language is Urdu, behind a "speak aloud" toggle in Settings › Accessibility.
    const el = $('#liveMoves');
    el.textContent = '';
    setTimeout(() => { el.textContent = msg; }, 30);
  },
  where(p, pos) {
    if (pos === -1) return t('an_base');
    if (pos <= 50) return t('an_sq', { n: absOf(p, pos) + 1 });
    if (pos < FINISH) return t('an_col', { n: pos - 50 });
    return t('home');
  },
  roll(p, d) {
    if (prefs.a11y.dice) this.say(t('an_roll', { name: name(p), d }));
  },
  /** Called after applyMove(): one sentence per move, plus capture / finish clauses. */
  move(mv) {
    if (!prefs.a11y.announce) return;
    const nm = name(mv.p);
    const i = mv.i + 1;
    let s;
    if (mv.from === -1) s = t('an_out', { name: nm, i });
    else if (mv.finish) s = t('an_finish', { name: nm, i });
    else s = t('an_move', { name: nm, i, d: mv.to - mv.from, from: this.where(mv.p, mv.from), to: this.where(mv.p, mv.to) });
    if (mv.capture.length) {
      s += t('an_capture', { victims: mv.capture.map(c => `${name(c.p)} ${c.i + 1}`).join(', ') });
    }
    const place = G.winOrder.indexOf(mv.p);
    if (mv.finish && allHome(G, mv.p) && place >= 0) s += ' ' + t('an_win', { name: nm, place: t('place' + (place + 1)) });
    this.say(s);
  }
};

// ---------- turn flow ----------
async function doRoll(auto = false) {
  if (!G || G.phase !== 'roll' || UI.anim || UI.paused || !onGame()) return;
  if (!auto && !isHuman(G.turn)) return;
  clearTimeout(UI.timer);
  const p = G.turn;
  const d = Tutorial.scriptedDie(p) ?? rollDie();
  UI.anim = true;
  renderStatus();
  Snd.dice();
  await animateDice(p, d);
  UI.lastDice[p] = d;
  UI.anim = false;
  const r = resolveRoll(G, d);
  Speak.roll(p, d);
  if (d === 6 && !r.forfeit) Snd.six();
  if (r.forfeit) {
    passAfterRoll('three_sixes', 'bad', 'alert', 1100, false);
    return;
  }
  if (r.none) {
    passAfterRoll(r.six ? 'no_moves_six' : 'no_moves', '', 'info', 800, r.six);
    return;
  }
  G.legal = r.moves;
  G.phase = 'move';
  Tutorial.event('rolled');
  save();
  renderAll();
  schedule();
}

/** No move after a roll: show why, then either roll again (a six) or pass the turn. */
function passAfterRoll(msgKey, type, icon, delay, rollAgain) {
  G.phase = 'wait';
  renderAll();
  toast(t(msgKey), type, icon);
  UI.pending = () => {
    UI.pending = null;
    if (rollAgain) {
      G.phase = 'roll';
      G.dice = null;
    } else {
      nextTurn(G);
    }
    afterStep();
  };
  UI.timer = setTimeout(UI.pending, delay);
}

function pickToken(i) {
  if (!G || G.phase !== 'move' || UI.anim || UI.paused || !isHuman(G.turn)) return;
  const mv = G.legal.find(m => m.i === i);
  if (mv) performMove(mv);
}

async function performMove(mv) {
  if (!G || G.phase !== 'move' || UI.anim || UI.paused) return;
  clearTimeout(UI.timer);
  const p = mv.p;
  const d = G.dice;
  if (isHuman(p) && prefs.rules.casual) {
    UI.undo.push(JSON.stringify(G));
    if (UI.undo.length > 30) UI.undo.shift();
  }
  // TODO(student): online multiplayer — broadcast `mv` (and the die value) to the room over a WebRTC data channel or WebSocket here, and feed remote players' moves back through performMove().
  UI.anim = true;
  G.phase = 'anim';
  renderHL();
  renderStatus();
  $$('.tok.legal,.tok.hint').forEach(el => el.classList.remove('legal', 'hint'));
  await animateHop(mv);
  const res = applyMove(G, mv);
  G.history.push({ p, d, i: mv.i, from: mv.from, to: mv.to, cap: res.captured.map(c => [c.p, c.i]) });
  UI.lastMoved = [p, mv.i];
  Speak.move(mv);
  if (res.captured.length) {
    Snd.capture();
    toast(t('captured_toast', { name: name(p), victim: name(res.captured[0].p) }), 'bad', 'swords');
    await animateCapture(res.captured);
  }
  if (mv.finish) celebrateFinish(p);
  afterMove(G, mv, d);
  UI.anim = false;
  Tutorial.event('moved');
  afterStep();
}

function celebrateFinish(p) {
  Snd.finish();
  if (allHome(G, p)) toast(t('all_home', { name: name(p), place: t('place' + G.winOrder.length) }), 'gold', 'trophy');
  else toast(t('finished_toast', { name: name(p) }), 'ok', 'home');
}

function afterStep() {
  clearTimeout(UI.timer);
  save();
  renderAll();
  if (G.phase === 'over') {
    onGameOver();
    return;
  }
  const humans = G.players.filter(pl => pl.type === 'human').length;
  const handOver = G.phase === 'roll' && isHuman(G.turn) && UI.lastHuman !== null && UI.lastHuman !== G.turn;
  if (handOver && humans > 1) toast(t('pass_device', { name: name(G.turn) }), 'gold', 'users');
  if (isHuman(G.turn)) UI.lastHuman = G.turn;
  schedule();
}

/** Arms the timer for whatever must happen next without a human: AI roll/move, auto-move, pending pass. */
function schedule() {
  clearTimeout(UI.timer);
  if (!G || UI.paused || UI.anim || !onGame() || G.phase === 'over') return;
  const auto = G.phase === 'move' && G.legal && G.legal.length === 1 && prefs.rules.autoMove;
  if (G.phase === 'wait' && UI.pending) {
    UI.timer = setTimeout(UI.pending, 400);
  } else if (G.phase === 'roll' && isAI(G.turn)) {
    UI.timer = setTimeout(() => doRoll(true), think());
  } else if (auto) {
    UI.timer = setTimeout(() => performMove(G.legal[0]), isAI(G.turn) ? think() : 450);
  } else if (G.phase === 'move' && isAI(G.turn)) {
    UI.timer = setTimeout(() => performMove(aiChoose(G, G.turn, G.legal, G.players[G.turn].level)), think());
  }
}

function undo() {
  if (!G || !prefs.rules.casual || !UI.undo.length || UI.anim) {
    toast(t('undo_na'), '', 'undo');
    return;
  }
  clearTimeout(UI.timer);
  G = JSON.parse(UI.undo.pop());
  G.legal = legalMoves(G, G.turn, G.dice);
  UI.paused = false;
  UI.lastMoved = null;
  save();
  renderAll();
  schedule();
  toast(t('undone'), '', 'undo');
}

function togglePause() {
  if (!G || G.phase === 'over') return;
  UI.paused = !UI.paused;
  clearTimeout(UI.timer);
  if (UI.paused) {
    openModal(`<h2>${ic('pause')}${esc(t('paused'))}</h2><p class="muted">${esc(t('keys_h'))}</p><div class="btns"><button class="btn gold big" id="resumeBtn">${ic('play')}${esc(t('resume_game'))}</button></div>`, () => {
      if (UI.paused) togglePause();
    });
  } else {
    closeModal();
  }
  renderAll();
  schedule();
}

function onGameOver() {
  clearTimeout(UI.timer);
  Snd.win();
  Records.finish(G);
  showWin();
  confetti();
}

/** Game clock: ticks only while the board is visible and the game is running. */
setInterval(() => {
  if (!G || UI.paused || document.hidden || G.phase === 'over' || !onGame()) return;
  G.elapsed += 1000;
  const c = $('#clock');
  if (c) c.textContent = fmtTime(G.elapsed);
  if (G.elapsed % 10000 === 0) save();
}, 1000);


// ---------- records: results, per-player history, replays ----------
const MAX_HISTORY = 100;
const MAX_REPLAYS = 8;

/** Recent-results list shown on the setup screen (original storage format). */
function recordResult(g = G) {
  // TODO(student): Elo ratings — after each game update a rating per player name from the pairwise results (expected score 1 / (1 + 10^((Rb − Ra) / 400)), K = 32), store it under ludo:elo and add a rating column to the Stats leaderboard.
  const w = g.winOrder[0];
  const results = store.get('results', []);
  results.unshift({
    date: today(),
    winner: g.players[w].name,
    seat: w,
    turns: g.turnNo,
    time: g.elapsed,
    players: activeSeats(g).map(p => g.players[p].name)
  });
  store.set('results', results.slice(0, 20));
}

const gameMode = g => (g.tutorial ? 'tutorial' : g.tourney ? 'tournament' : 'casual');

/** Compact per-player summary of a finished game (feeds the statistics page). */
function gameSummary(g) {
  return {
    id: g.id,
    date: today(),
    turns: g.turnNo,
    time: g.elapsed || 0,
    mode: gameMode(g),
    faces: (g.faces || [0, 0, 0, 0, 0, 0]).slice(),
    players: activeSeats(g).map(p => ({
      name: g.players[p].name,
      seat: p,
      type: g.players[p].type,
      level: g.players[p].level,
      place: g.winOrder.indexOf(p) + 1,
      caps: g.stats[p].captures,
      lost: g.stats[p].lost,
      sixes: g.stats[p].sixes,
      rolls: g.stats[p].rolls,
      home: homeCount(g, p)
    }))
  };
}

/** Full record with the move list, used by the replay viewer and the match report. */
function replayRecord(g, extra = {}) {
  return {
    id: g.id,
    date: today(),
    mode: gameMode(g),
    players: g.players.map(pl => ({ type: pl.type, level: pl.level, name: pl.name })),
    winOrder: g.winOrder.slice(),
    turns: g.turnNo,
    time: g.elapsed || 0,
    stats: g.stats.map(s => ({ ...s })),
    faces: (g.faces || [0, 0, 0, 0, 0, 0]).slice(),
    rules: { ...prefs.rules },
    history: g.history.slice(),
    ...extra
  };
}

const Records = {
  history: () => store.get('history', []),
  replays: () => store.get('replays', []),

  addHistory(sumRow) {
    const h = this.history().filter(r => r.id !== sumRow.id);
    h.unshift(sumRow);
    store.set('history', h.slice(0, MAX_HISTORY));
  },

  addReplay(rec) {
    const list = this.replays().filter(r => r.id !== rec.id && !(rec.sample && r.sample));
    list.unshift(rec);
    store.set('replays', list.slice(0, MAX_REPLAYS));
  },

  /** Called once when a live game ends: every downstream module is fed from here. */
  finish(g) {
    if (g.recorded) return;
    g.recorded = true;
    save();
    recordResult(g);
    const summary = gameSummary(g);
    this.addHistory(summary);
    this.addReplay(replayRecord(g));
    Inbox.add('ib_result', { winner: g.players[g.winOrder[0]].name, turns: g.turnNo }, 'trophy');
    if (g.tourney) Tourney.recordGame(g);
    Achievements.check(summary);
  },

  /** A finished AI-only game recorded without the board (tournament "simulate"). */
  finishHeadless(g) {
    g.recorded = true;
    this.addHistory(gameSummary(g));
  },

  /** First run: play one headless game so the replay viewer has something to show. */
  ensureSample() {
    if (this.replays().length) return;
    const g = playHeadless(DEFAULT_PREFS.seats.map(s => ({ ...s, type: 'ai' })));
    g.players = DEFAULT_PREFS.seats.map(s => ({ ...s }));
    this.addReplay(replayRecord(g, { sample: true, date: '2026-10-15' }));
  }
};

// ---------- achievements ----------
const ACHIEVEMENTS = [
  { id: 'first_win', icon: 'trophy', test: c => !!c.hw },
  { id: 'hat_trick', icon: 'swords', test: c => c.humans.some(r => r.caps >= 3) },
  { id: 'untouchable', icon: 'shield', test: c => !!c.hw && c.hw.lost === 0 },
  { id: 'lucky', icon: 'dice', test: c => c.humans.some(r => r.sixes >= 8) },
  { id: 'speedster', icon: 'zap', test: c => !!c.hw && c.turns <= 90 },
  { id: 'giant_killer', icon: 'brain', test: c => !!c.hw && c.rows.some(r => r.type === 'ai' && r.level === 'expert') },
  { id: 'full_house', icon: 'users', test: c => !!c.hw && c.rows.length === 4 },
  { id: 'comeback', icon: 'flame', test: c => !!c.hw && c.hw.lost >= 3 },
  { id: 'marathon', icon: 'timer', test: c => c.humans.length > 0 && c.turns >= 150 },
  { id: 'veteran', icon: 'award', goal: 10, progress: () => humanGames(), test: () => humanGames() >= 10 },
  { id: 'champion', icon: 'flag', manual: true },
  { id: 'scholar', icon: 'graduation', manual: true }
];

/** Number of recorded games that had at least one human seat. */
const humanGames = () => Records.history().filter(r => r.players.some(p => p.type === 'human')).length;

const Achievements = {
  unlocked: () => store.get('ach', {}),

  /** Stores the unlock and files an inbox note; `quiet` skips the toast (check() shows one for all). */
  unlock(id, quiet = false) {
    const got = this.unlocked();
    if (got[id]) return false;
    got[id] = today();
    store.set('ach', got);
    Inbox.add('ib_ach', { title: '@ach_' + id }, 'award');
    if (!quiet) {
      Snd.unlock();
      toast(t('ach_toast', { title: t('ach_' + id) }), 'gold', 'award');
    }
    return true;
  },

  /** Evaluates every automatic achievement against one finished game summary. */
  check(summary) {
    const rows = summary.players;
    const humans = rows.filter(r => r.type === 'human');
    const hw = humans.find(r => r.place === 1) || null;
    const ctx = { rows, humans, hw, turns: summary.turns };
    const got = this.unlocked();
    const fresh = ACHIEVEMENTS.filter(a => !a.manual && !got[a.id] && a.test(ctx)).map(a => a.id);
    fresh.forEach(id => this.unlock(id, true));
    if (fresh.length) {
      Snd.unlock();
      toast(t('ach_toast', { title: fresh.map(id => t('ach_' + id)).join(', ') }), 'gold', 'award');
    }
  },

  /** Display list: unlocked date or progress fraction. */
  list() {
    const got = this.unlocked();
    return ACHIEVEMENTS.map(a => ({
      ...a,
      date: got[a.id] || null,
      pct: got[a.id] ? 1 : a.goal ? clamp(a.progress() / a.goal, 0, 1) : 0
    }));
  }
};

// ---------- notifications inbox ----------
const Inbox = {
  list: () => store.get('inbox', []),
  unread() {
    return this.list().filter(n => !n.read).length;
  },
  add(k, vars = {}, icon = 'bell') {
    const l = this.list();
    l.unshift({ id: uid(), k, vars, icon, at: Date.now(), read: false });
    store.set('inbox', l.slice(0, 40));
    renderBadge();
  },
  markAll() {
    store.set('inbox', this.list().map(n => ({ ...n, read: true })));
    renderBadge();
  },
  clear() {
    store.set('inbox', []);
    renderBadge();
  },
  /** Variables starting with "@" are i18n keys, so old notifications follow the language toggle. */
  text(n) {
    const vars = {};
    Object.entries(n.vars || {}).forEach(([a, b]) => {
      vars[a] = typeof b === 'string' && b[0] === '@' ? t(b.slice(1)) : b;
    });
    return t(n.k, vars);
  }
};

/** "5 min ago" style stamp for inbox rows. */
function fmtAgo(ts) {
  const m = Math.max(0, Math.round((Date.now() - ts) / 60000));
  if (m < 1) return t('ago_now');
  if (m < 60) return t('ago_m', { n: m });
  if (m < 1440) return t('ago_h', { n: Math.round(m / 60) });
  return t('ago_d', { n: Math.round(m / 1440) });
}

function renderBadge() {
  const n = Inbox.unread();
  const btn = $('#inboxBtn');
  if (!btn) return;
  btn.innerHTML = ic('bell') + (n ? `<span class="badge">${n > 9 ? '9+' : n}</span>` : '');
  const label = n ? `${t('ib_title')} — ${t('ib_unread', { n })}` : t('ib_title');
  btn.setAttribute('aria-label', label);
  btn.title = label;
}

function renderInbox(body) {
  const list = Inbox.list();
  const rows = list.map(n => `<li class="${n.read ? '' : 'unread'}"><span class="iicon">${ic(n.icon || 'bell')}</span><span class="itext">${esc(Inbox.text(n))}<span class="itime">${esc(fmtAgo(n.at))}</span></span></li>`).join('');
  body.innerHTML = `<div class="row" style="margin:6px 0 14px"><button class="btn ghost sm" id="ibMark">${ic('check')}${esc(t('ib_mark'))}</button><button class="btn ghost sm" id="ibClear">${ic('trash')}${esc(t('ib_clear'))}</button></div>`
    + (list.length ? `<ul class="inbox-list stagger">${rows}</ul>` : `<div class="empty">${ic('bell')}<span>${esc(t('ib_empty'))}</span></div>`);
  animateIn(body);
  $('#ibMark').onclick = () => {
    Inbox.markAll();
    renderInbox(body);
  };
  $('#ibClear').onclick = () => {
    Inbox.clear();
    renderInbox(body);
  };
}


// ---------- modal helper ----------
let modalOnClose = null;
let modalReturnFocus = null;

function openModal(html, onClose) {
  const m = $('#modal');
  modalReturnFocus = document.activeElement;
  $('#modalBox').innerHTML = `<button class="close x" id="modalX" aria-label="${esc(t('closed'))}">${ic('x')}</button>` + html;
  m.classList.add('open');
  m.setAttribute('aria-hidden', 'false');
  modalOnClose = onClose || null;
  $('#modalX').onclick = closeModal;
  $('#resumeBtn')?.addEventListener('click', closeModal);
  setTimeout(() => ($('#modalBox .btn.gold') || $('#modalX'))?.focus(), 50);
}

function closeModal() {
  const m = $('#modal');
  if (!m.classList.contains('open')) return;
  m.classList.remove('open');
  m.setAttribute('aria-hidden', 'true');
  const cb = modalOnClose;
  modalOnClose = null;
  if (cb) cb();
  if (modalReturnFocus && document.contains(modalReturnFocus)) modalReturnFocus.focus({ preventScroll: true });
}
$('#modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

/** Small confirm dialog; resolves the action only on the danger/gold button. */
function confirmModal(icon, title, body, okLabel, onOk, danger = false) {
  openModal(`<h2>${ic(icon)}${esc(title)}</h2><p class="muted">${esc(body)}</p><div class="btns"><button class="btn ghost" id="cancelBtn">${esc(t('cancel'))}</button><button class="btn ${danger ? 'danger' : 'gold'}" id="okBtn">${ic(danger ? 'trash' : 'check')}${esc(okLabel)}</button></div>`);
  $('#cancelBtn').onclick = closeModal;
  $('#okBtn').onclick = () => {
    closeModal();
    onOk();
  };
}

/** Starts a fresh game; opts.tourney / opts.tutorial tag the game for those modules. */
function startGame(seats, opts = {}) {
  // TODO(student): spectator mode — allow a read-only viewer: render this board without dice/token handlers and feed it the moves received from the networking layer.
  clearTimeout(UI.timer);
  G = newGame(seats);
  if (opts.tourney) G.tourney = opts.tourney;
  if (opts.tutorial) G.tutorial = opts.tutorial;
  Object.assign(UI, {
    undo: [],
    paused: false,
    lastDice: [null, null, null, null],
    lastHuman: null,
    lastMoved: null,
    pending: null,
    hintFor: null
  });
  save();
  if (location.hash === '#game') route();
  else location.hash = '#game';
}

// ---------- tournament: round-robin with standings ----------
const POINTS = { pairs: [3, 0], table: [3, 2, 1, 0] };
const TABLE_COLOURS = { 2: [0, 2], 3: [0, 1, 2], 4: [0, 1, 2, 3] };

/** Builds the match list: every pair once per round, or everyone each round with rotating colours. */
function tourneySchedule(n, format, rounds) {
  const matches = [];
  for (let r = 0; r < rounds; r++) {
    if (format === 'pairs') {
      for (let a = 0; a < n; a++) {
        for (let b = a + 1; b < n; b++) {
          const [x, y] = r % 2 === 0 ? [a, b] : [b, a];
          matches.push({ round: r, seats: [x, -1, y, -1], result: null });
        }
      }
    } else {
      const cols = TABLE_COLOURS[n];
      const seats = [-1, -1, -1, -1];
      for (let k = 0; k < n; k++) seats[cols[(k + r) % n]] = k;
      matches.push({ round: r, seats, result: null });
    }
  }
  return matches;
}

const Tourney = {
  get: () => store.get('tourney', null),
  put: tn => store.set('tourney', tn),

  create(nameStr, format, rounds, participants) {
    const tn = {
      id: uid(),
      name: nameStr || t('tn_default_name'),
      format,
      rounds,
      created: today(),
      participants,
      matches: tourneySchedule(participants.length, format, rounds),
      live: null,
      done: false,
      champion: null
    };
    this.put(tn);
    return tn;
  },

  /** Seat list for startGame()/playHeadless(): participants in their colours, other seats off. */
  seatsFor(tn, mi) {
    return tn.matches[mi].seats.map((pi, c) => (pi < 0 ? { type: 'off', level: 'medium', name: t(SEATS[c]) } : { ...tn.participants[pi] }));
  },

  allAI(tn, mi) {
    return tn.matches[mi].seats.every(pi => pi < 0 || tn.participants[pi].type === 'ai');
  },

  /** Converts a finished game (colour order) into participant order and per-participant totals. */
  resultOf(tn, mi, g) {
    const seats = tn.matches[mi].seats;
    const home = {};
    const caps = {};
    seats.forEach((pi, c) => {
      if (pi < 0) return;
      home[pi] = homeCount(g, c);
      caps[pi] = g.stats[c].captures;
    });
    return { order: g.winOrder.map(c => seats[c]), home, caps, turns: g.turnNo };
  },

  setResult(tn, mi, g) {
    tn.matches[mi].result = this.resultOf(tn, mi, g);
    if (tn.live === mi) tn.live = null;
    const winner = tn.participants[tn.matches[mi].result.order[0]].name;
    Inbox.add('ib_match', { winner }, 'trophy');
    if (tn.matches.every(m => m.result)) this.complete(tn);
    this.put(tn);
  },

  complete(tn) {
    tn.done = true;
    const top = this.standings(tn)[0];
    tn.champion = top.name;
    toast(t('tn_complete', { name: top.name }), 'gold', 'trophy');
    Inbox.add('ib_tdone', { name: tn.name, winner: top.name }, 'flag');
    if (tn.participants[top.i].type === 'human') Achievements.unlock('champion');
  },

  /** Hook from Records.finish(): a live tournament game just ended. */
  recordGame(g) {
    const tn = this.get();
    if (!tn || tn.id !== g.tourney.id || tn.matches[g.tourney.match].result) return;
    this.setResult(tn, g.tourney.match, g);
    toast(t('tn_match_saved'), 'ok', 'check');
  },

  /** Table sorted by points, then wins, tokens home and captures. */
  standings(tn) {
    const pts = POINTS[tn.format];
    const rows = tn.participants.map((p, i) => ({ i, name: p.name, type: p.type, level: p.level, played: 0, wins: 0, pts: 0, home: 0, caps: 0 }));
    tn.matches.forEach(m => {
      if (!m.result) return;
      m.result.order.forEach((pi, place) => {
        const r = rows[pi];
        r.played++;
        r.pts += pts[place] || 0;
        if (place === 0) r.wins++;
        r.home += m.result.home[pi] || 0;
        r.caps += m.result.caps[pi] || 0;
      });
    });
    return rows.sort((a, b) => b.pts - a.pts || b.wins - a.wins || b.home - a.home || b.caps - a.caps);
  },

  play(mi) {
    const tn = this.get();
    if (!tn || tn.matches[mi].result) return;
    const resumable = G && G.tourney && G.tourney.id === tn.id && G.tourney.match === mi && G.phase !== 'over';
    if (resumable) {
      location.hash = '#game';
      return;
    }
    const go = () => {
      tn.live = mi;
      this.put(tn);
      startGame(this.seatsFor(tn, mi), { tourney: { id: tn.id, match: mi } });
    };
    if (G && G.phase !== 'over') confirmModal('refresh', t('new_game_q'), t('new_game_h'), t('confirm'), go);
    else go();
  },

  simulate(mi) {
    const tn = this.get();
    if (!tn || tn.matches[mi].result || !this.allAI(tn, mi)) return;
    const g = playHeadless(this.seatsFor(tn, mi));
    g.tourney = { id: tn.id, match: mi };
    Records.finishHeadless(g);
    this.setResult(tn, mi, g);
  },

  /** Simulates every pending AI-only match, one per frame so the page stays responsive. */
  simulateAll(done) {
    const tn = this.get();
    if (!tn) return;
    const queue = tn.matches.map((m, i) => i).filter(i => !tn.matches[i].result && this.allAI(tn, i));
    const step = () => {
      const mi = queue.shift();
      if (mi == null) {
        done();
        return;
      }
      this.simulate(mi);
      done();
      setTimeout(step, 30);
    };
    step();
  }
};

// ---------- replay viewer ----------
/** Token positions after the first k moves of a recorded history (rebuilt from the empty board). */
function positionAt(players, history, k) {
  const tokens = players.map(() => [-1, -1, -1, -1]);
  for (let j = 0; j < k && j < history.length; j++) {
    const h = history[j];
    tokens[h.p][h.i] = h.to;
    (h.cap || []).forEach(([q, i]) => { tokens[q][i] = -1; });
  }
  return tokens;
}
const finalPosition = rec => positionAt(rec.players, rec.history, rec.history.length);

/** Resolves a ?src= value to a record: 'current' = the live game, otherwise a saved replay id. */
function findRecord(src) {
  const saved = Records.replays();
  if (G && (src === 'current' || src === G.id)) return G.phase === 'over' ? saved.find(r => r.id === G.id) || replayRecord(G) : replayRecord(G);
  return saved.find(r => r.id === src) || saved[0] || (G ? replayRecord(G) : null);
}

const hashParam = k => new URLSearchParams(location.hash.split('?')[1] || '').get(k);

/** One-line description of history entry h (player names come from the record). */
function moveText(rec, h) {
  const nm = rec.players[h.p].name;
  let s;
  if (h.from === -1) s = `${nm}: ${t('rp_out', { i: h.i + 1 })}`;
  else if (h.to === FINISH) s = `${nm}: ${t('rp_fin', { i: h.i + 1 })}`;
  else s = t('rp_desc', { name: nm, d: h.d, i: h.i + 1, from: Speak.where(h.p, h.from), to: Speak.where(h.p, h.to) });
  if (h.cap && h.cap.length) s += t('rp_cap', { victims: h.cap.map(([q, i]) => `${rec.players[q].name} ${i + 1}`).join(', ') });
  return s;
}

const Replay = {
  rec: null,
  k: 0,
  playing: false,
  speed: 1,
  busy: false,

  load(src) {
    this.stop();
    this.rec = findRecord(src);
    this.k = 0;
  },

  stop() {
    this.playing = false;
  },

  render() {
    renderReplayPage();
  },

  /** Static redraw of the board and the controls for the current index. */
  draw() {
    const rec = this.rec;
    if (!rec) return;
    const last = this.k > 0 ? rec.history[this.k - 1] : null;
    $('#rp-tokens').innerHTML = tokensMarkup(rec.players, positionAt(rec.players, rec.history, this.k), {
      idp: 'rtok',
      cls: tk => (last && last.p === tk.p && last.i === tk.i ? 'last' : '')
    });
    this.drawControls();
  },

  drawControls() {
    // TODO(student): blunder check — for every history entry rebuild the position before it, ask expertChoose() for its move and mark moves whose evaluation drops sharply as ticks on the scrubber.
    const rec = this.rec;
    const n = rec.history.length;
    const last = this.k > 0 ? rec.history[this.k - 1] : null;
    $('#rpRange').value = this.k;
    $('#rpCount').textContent = t('rp_move', { n: this.k, total: n });
    $('#rpDesc').innerHTML = last ? `<span class="dot ${SEATS[last.p]}"></span><span>${esc(moveText(rec, last))}</span>` : `${ic('flag')}<span>${esc(t('rp_start'))}</span>`;
    $('#rpPlay').innerHTML = ic(this.playing ? 'pause' : 'play') + `<span class="sr">${esc(t(this.playing ? 'rp_pause' : 'rp_play'))}</span>`;
    const tokens = positionAt(rec.players, rec.history, this.k);
    $('#rpHome').innerHTML = rec.players.map((pl, p) => (pl.type === 'off' ? '' : `<span class="chip"><span class="sw-dot" style="background:var(--${SEATS[p]})"></span>${esc(pl.name)} · ${tokens[p].filter(x => x === FINISH).length}/4</span>`)).join('');
  },

  seek(k) {
    if (!this.rec) return;
    this.k = clamp(k, 0, this.rec.history.length);
    this.draw();
  },

  /** Advance one move with the hop/capture animation. */
  async stepForward() {
    const rec = this.rec;
    if (!rec || this.busy || this.k >= rec.history.length) return;
    this.busy = true;
    const h = rec.history[this.k];
    await animateHop({ p: h.p, i: h.i, from: h.from, to: h.to }, 'rtok', this.speed);
    const caps = (h.cap || []).map(([q, i]) => ({ p: q, i }));
    if (caps.length) await animateCapture(caps, 'rtok');
    this.k++;
    this.busy = false;
    if (document.body.dataset.view === 'replay') this.draw();
  },

  async play() {
    if (!this.rec) return;
    if (this.k >= this.rec.history.length) this.k = 0;
    this.playing = true;
    this.draw();
    while (this.playing && this.k < this.rec.history.length && document.body.dataset.view === 'replay') {
      await this.stepForward();
      await sleep(motionOff() ? 350 / this.speed : 260 / this.speed);
    }
    this.playing = false;
    if (document.body.dataset.view === 'replay') this.drawControls();
  },

  toggle() {
    if (this.playing) {
      this.stop();
      this.drawControls();
    } else {
      this.play();
    }
  }
};

function bindReplay() {
  $('#rpRange').oninput = e => {
    Replay.stop();

  $('#rpSpeed').onchange = e => { Replay.speed = +e.target.value; };

  $('#rpPrev').onclick = () => {
    Replay.stop();

  };
  $('#rpNext').onclick = () => {

    el.onkeydown = e => {
      if (e.key === 'Enter') open();
    };
  });
}


// ---------- statistics: derived per-player records ----------
/** Folds the game history (newest first) into one record per player name. */
function playerRecords(history) {
  const map = new Map();
  [...history].reverse().forEach(g => {
    g.players.forEach(r => {
      const p = map.get(r.name) || { name: r.name, games: 0, wins: 0, places: [0, 0, 0, 0], caps: 0, lost: 0, sixes: 0, rolls: 0, turns: 0, streak: 0, best: 0, last: g.date, series: [] };
      p.games++;
      if (r.place === 1) {
        p.wins++;
        p.streak++;
        p.best = Math.max(p.best, p.streak);
      } else {
        p.streak = 0;
      }
      p.places[clamp(r.place, 1, 4) - 1]++;
      p.caps += r.caps;
      p.lost += r.lost;
      p.sixes += r.sixes;
      p.rolls += r.rolls;
      p.turns += g.turns;
      p.last = g.date;
      p.series.push({ date: g.date, caps: r.caps, lost: r.lost, place: r.place });
      map.set(r.name, p);
    });
  });
  return [...map.values()].sort((a, b) => b.wins - a.wins || b.games - a.games || a.name.localeCompare(b.name));
}

/** Face counts over every recorded game plus the live one. */
function diceTotals(history) {
  const faces = [0, 0, 0, 0, 0, 0];
  history.forEach(g => (g.faces || []).forEach((n, k) => { faces[k] += n; }));
  if (G && !G.recorded && G.faces) G.faces.forEach((n, k) => { faces[k] += n; });
  return faces;
}

// ---------- hand-drawn SVG charts ----------
/** Bar with a square baseline end and a 4px rounded data end (horizontal). */
function barPathH(x, y, w, h) {
  if (w < 5) return `M${x} ${y}h${Math.max(w, 1)}v${h}h${-Math.max(w, 1)}Z`;
  return `M${x} ${y}h${w - 4}a4 4 0 0 1 4 4v${h - 8}a4 4 0 0 1 -4 4h${-(w - 4)}Z`;
}

/** Vertical variant: square at the baseline, rounded at the top. */
function barPathV(x, y, w, h) {
  if (h < 5) return `M${x} ${y + h}v${-Math.max(h, 1)}h${w}v${Math.max(h, 1)}Z`;
  return `M${x} ${y + h}V${y + 4}a4 4 0 0 1 4 -4h${w - 8}a4 4 0 0 1 4 4V${y + h}Z`;
}

const short = (s, n = 11) => (s.length > n ? s.slice(0, n - 1) + '…' : s);

function chartWins(el, recs) {
  const W = Math.max(280, el.clientWidth);
  const rows = recs.slice(0, 8);
  const padL = 96;
  const padR = 34;
  const rowH = 30;
  const max = Math.max(1, ...rows.map(r => r.wins));
  let s = '';
  rows.forEach((r, k) => {
    const y = k * rowH + 6;
    const w = ((W - padL - padR) * r.wins) / max;
    const tip = `${r.name}: ${r.wins} ${t('st_wins')} / ${r.games} ${t('games')} (${fmtPct(r.wins / r.games)})`;
    s += `<text class="lbl" x="${padL - 8}" y="${y + 13}" text-anchor="end">${esc(short(r.name))}</text>`;
    s += `<path class="mark" d="${barPathH(padL, y, w, 18)}" fill="var(--chart-a)" data-tip="${esc(tip)}"/>`;
    s += `<text class="axis" x="${padL + w + 6}" y="${y + 13}">${r.wins}</text>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${rows.length * rowH + 8}" role="img" aria-label="${esc(t('st_wins_chart'))}">${s}</svg>`;
}

function chartPlaces(el, recs) {
  const W = Math.max(280, el.clientWidth);
  const rows = recs.slice(0, 8);
  const padL = 96;
  const rowH = 30;
  const span = W - padL - 8;
  let s = '';
  rows.forEach((r, k) => {
    const y = k * rowH + 6;
    let x = padL;
    s += `<text class="lbl" x="${padL - 8}" y="${y + 13}" text-anchor="end">${esc(short(r.name))}</text>`;
    r.places.forEach((n, pi) => {
      if (!n) return;
      const w = (span * n) / r.games;
      const tip = `${r.name} · ${t('place' + (pi + 1))}: ${n} (${fmtPct(n / r.games)})`;
      s += `<rect class="mark seg" x="${x}" y="${y}" width="${Math.max(1, w - 2)}" height="18" fill="var(--pl${pi + 1})" data-tip="${esc(tip)}"/>`;
      x += w;
    });
  });
  const legend = [1, 2, 3, 4].map(k => `<span><i style="background:var(--pl${k})"></i>${esc(t('place' + k))}</span>`).join('');
  el.innerHTML = `<div class="legend">${legend}</div><svg viewBox="0 0 ${W} ${rows.length * rowH + 8}" role="img" aria-label="${esc(t('st_places'))}">${s}</svg>`;
}

/** Two-series line chart: captures made vs lost over a player's last 12 games. */
function chartTrend(el, rec) {
  const W = Math.max(280, el.clientWidth);
  const H = 190;
  const pad = { l: 30, r: 46, t: 12, b: 26 };
  const pts = rec.series.slice(-12);
  const max = Math.max(3, ...pts.map(p => Math.max(p.caps, p.lost)));
  const x = k => pad.l + (pts.length < 2 ? (W - pad.l - pad.r) / 2 : (k * (W - pad.l - pad.r)) / (pts.length - 1));
  const y = v => pad.t + (H - pad.t - pad.b) * (1 - v / max);
  let s = '';
  [0, Math.round(max / 2), max].forEach(v => {
    s += `<line class="grid" x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${pad.l - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  });
  const every = Math.max(1, Math.ceil(pts.length / Math.max(2, Math.floor((W - pad.l - pad.r) / 70))));
  pts.forEach((p, k) => {
    if (k % every === 0) s += `<text class="axis" x="${x(k)}" y="${H - 6}" text-anchor="middle">${esc(t('st_game_n', { n: rec.series.length - pts.length + k + 1 }))}</text>`;
  });
  const series = [['caps', 'var(--chart-a)', 'st_made'], ['lost', 'var(--chart-b)', 'st_lost']];
  const ends = endLabelY(y(pts[pts.length - 1].caps), y(pts[pts.length - 1].lost));
  series.forEach(([key, col, lbl], si) => {
    const d = pts.map((p, k) => `${k ? 'L' : 'M'}${x(k).toFixed(1)} ${y(p[key]).toFixed(1)}`).join('');
    s += `<path class="line draw" d="${d}" stroke="${col}"/>`;
    pts.forEach((p, k) => {
      s += `<circle class="dot mark" cx="${x(k)}" cy="${y(p[key])}" r="4" fill="${col}" data-tip="${esc(`${p.date} · ${t(lbl)}: ${p[key]}`)}"/>`;
    });
    s += `<text class="lbl" x="${W - pad.r + 8}" y="${ends[si] + 4}">${esc(t(lbl))}</text>`;
  });
  const legend = series.map(([, col, lbl]) => `<span><i class="ln" style="background:${col}"></i>${esc(t(lbl))}</span>`).join('');
  el.innerHTML = `<div class="legend">${legend}</div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('st_trend'))}">${s}</svg>`;
  $$('path.draw', el).forEach(drawPath);
}

/** End-of-line label positions for two series, pushed apart when they would collide. */
function endLabelY(a, b, gap = 14) {
  if (Math.abs(a - b) >= gap) return [a, b];
  const mid = (a + b) / 2;
  return a <= b ? [mid - gap / 2, mid + gap / 2] : [mid + gap / 2, mid - gap / 2];
}

/** Share of each die face against the expected one sixth. */
function chartDice(el, faces) {
  const W = Math.max(280, el.clientWidth);
  const H = 180;
  const pad = { l: 34, r: 10, t: 14, b: 24 };
  const total = sum(faces) || 1;
  const shares = faces.map(n => n / total);
  const max = Math.max(0.25, ...shares);
  const bw = (W - pad.l - pad.r) / 6;
  const y = v => pad.t + (H - pad.t - pad.b) * (1 - v / max);
  let s = '';
  [0, 0.1, 0.2].forEach(v => {
    s += `<line class="grid" x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${pad.l - 6}" y="${y(v) + 4}" text-anchor="end">${Math.round(v * 100)}%</text>`;
  });
  shares.forEach((v, k) => {
    const x0 = pad.l + k * bw + bw * 0.22;
    const tip = `${k + 1}: ${faces[k]} (${(v * 100).toFixed(1)}%)`;
    s += `<path class="mark" d="${barPathV(x0, y(v), bw * 0.56, y(0) - y(v))}" fill="var(--chart-a)" data-tip="${esc(tip)}"/>`;
    s += `<text class="axis" x="${x0 + bw * 0.28}" y="${H - 6}" text-anchor="middle">${k + 1}</text>`;
  });
  s += `<line class="ref" x1="${pad.l}" x2="${W - pad.r}" y1="${y(1 / 6)}" y2="${y(1 / 6)}" stroke-dasharray="5 4"/>`;
  s += `<text class="axis halo" x="${W - pad.r}" y="${y(1 / 6) - 5}" text-anchor="end">${esc(t('st_expected'))} 16.7%</text>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('st_dice'))}">${s}</svg>`;
}

// ---------- AI arena: headless games between levels ----------
const Arena = {
  running: false,
  last: () => store.get('arena', null),

  /** Plays `games` headless games with the given seat levels ('off' allowed), reporting progress. */
  run(levels, games, onProgress) {
    if (this.running) return;
    this.running = true;
    const seats = levels.map((lv, p) => (lv === 'off' ? { type: 'off', level: 'medium', name: '' } : { type: 'ai', level: lv, name: t(SEATS[p]) }));
    const res = { levels, games, played: 0, wins: [0, 0, 0, 0], placeSum: [0, 0, 0, 0], at: Date.now() };
    const step = () => {
      const g = playHeadless(seats);
      res.played++;
      res.wins[g.winOrder[0]]++;
      g.winOrder.forEach((p, k) => { res.placeSum[p] += k + 1; });
      if (res.played >= games) {
        this.running = false;
        store.set('arena', res);
      } else {
        setTimeout(step, 0);
      }
      onProgress(res);
    };
    setTimeout(step, 0);
  }
};

function kpiTile(icon, label, value, fmt, hint = '') {

function statsKpis(history) {
  const rolls = sum(history.map(g => sum(g.players.map(r => r.rolls))));
  const caps = sum(history.map(g => sum(g.players.map(r => r.caps))));

function leaderTable(recs) {

// ---------- tutorial: guided first game ----------
/**
 * Each step waits for a game event ('rolled' / 'moved'), a Next click ('next') or the Finish button ('done').
 * `hl` adds a board highlight class while the step is shown.
 */
const TUT_STEPS = [
  { k: 'tut_s0', wait: 'rolled' },
  { k: 'tut_s1', wait: 'moved' },
  { k: 'tut_s2', wait: 'moved' },
  { k: 'tut_s3', wait: 'next', hl: 'tut-safe' },
  { k: 'tut_s4', wait: 'next' },
  { k: 'tut_s5', wait: 'next', hl: 'tut-home' },
  { k: 'tut_s6', wait: 'done' }
];
const TUT_DICE = [6, 3];          // the learner's first two rolls are scripted: out on a six, then a short move

const Tutorial = {
  active: () => !!(G && G.tutorial && !G.tutorial.done),

  start() {
    const go = () => {
      const you = (prefs.seats.find(s => s.type === 'human') || {}).name || 'You';
      const seats = [
        { type: 'human', level: 'medium', name: you },
        { type: 'off', level: 'medium', name: '' },
        { type: 'ai', level: 'easy', name: 'Zara' },
        { type: 'off', level: 'medium', name: '' }
      ];
      startGame(seats, { tutorial: { step: 0, rolls: 0, done: false } });
    };
    if (G && G.phase !== 'over' && !G.tutorial) confirmModal('graduation', t('new_game_q'), t('new_game_h'), t('confirm'), go);
    else go();
  },

  /** Die override for the learner's scripted rolls; null means "roll normally". */
  scriptedDie(p) {
    if (!this.active() || !isHuman(p) || G.tutorial.rolls >= TUT_DICE.length) return null;
    return TUT_DICE[G.tutorial.rolls++];
  },

  /** Game events advance the steps that wait for them. */
  event(name) {
    if (!this.active()) return;
    const st = TUT_STEPS[G.tutorial.step];
    if (st && st.wait === name) this.go(G.tutorial.step + 1);
  },

  go(step) {
    G.tutorial.step = clamp(step, 0, TUT_STEPS.length - 1);
    save();
    this.render();
    const st = TUT_STEPS[G.tutorial.step];
    Speak.say(t(st.k) + '. ' + t(st.k + '_h'));
  },

  finish() {
    G.tutorial.done = true;
    store.set('tutorial', today());
    save();
    Achievements.unlock('scholar');
    Inbox.add('ib_tut', {}, 'graduation');
    toast(t('tut_done'), 'ok', 'graduation');
    this.render();
  },

  skip() {
    G.tutorial.done = true;
    save();
    this.render();
  },

  render() {
    const coach = $('#coach');
    const board = $('#board');
    if (!coach) return;
    board.classList.remove('tut-safe', 'tut-home');
    const on = this.active() && onGame();
    coach.classList.toggle('on', on);
    document.body.classList.toggle('coaching', on);
    if (!on) {
      coach.innerHTML = '';
      return;
    }
    const n = G.tutorial.step;
    const st = TUT_STEPS[n];
    if (st.hl) board.classList.add(st.hl);
    const next = st.wait === 'next' ? `<button class="btn gold sm" id="tutNext">${esc(t('tut_next'))}${ic('arrow-right')}</button>` : '';
    const done = st.wait === 'done' ? `<button class="btn gold sm" id="tutDone">${ic('check')}${esc(t('tut_done_btn'))}</button>` : '';
    const skip = st.wait !== 'done' ? `<button class="btn ghost sm" id="tutSkip">${esc(t('tut_skip'))}</button>` : '';
    coach.innerHTML = `<span class="cicon">${ic('graduation')}</span><div class="cbody rtl"><b>${esc(t(st.k))}</b><p>${esc(t(st.k + '_h'))}</p>
      <div class="cacts">${next}${done}${skip}<span class="steps">${esc(t('tut_step', { n: n + 1, total: TUT_STEPS.length }))}</span></div></div>`;
    $('#tutNext')?.addEventListener('click', () => this.go(n + 1));
    $('#tutDone')?.addEventListener('click', () => this.finish());
    $('#tutSkip')?.addEventListener('click', () => this.skip());
  }
};

// ---------- onboarding tour (spotlight steps on the setup screen) ----------
const TOUR_STEPS = [
  { sel: '#seatGrid', k: 'tour_s0' },
  { sel: '#rulesCard', k: 'tour_s1' },
  { sel: '.quick', k: 'tour_s2' },
  { sel: '#topnav', k: 'tour_s3' },
  { sel: '#settingsBtn', k: 'tour_s4' }
];

const Tour = {
  i: 0,
  on: false,

  start() {
    if (document.body.dataset.view !== 'setup') {
      location.hash = '#setup';
      setTimeout(() => this.start(), 450);
      return;
    }
    this.i = 0;
    this.on = true;
    $('#tour').classList.add('on');
    $('#tour').setAttribute('aria-hidden', 'false');
    this.show();
  },

  end() {
    if (!this.on) return;
    this.on = false;
    store.set('toured', 1);
    $('#tour').classList.remove('on');
    $('#tour').setAttribute('aria-hidden', 'true');
    window.scrollTo({ top: 0, behavior: motionOff() ? 'auto' : 'smooth' });
  },

  go(i) {
    if (i >= TOUR_STEPS.length) {
      this.end();
      return;
    }
    this.i = clamp(i, 0, TOUR_STEPS.length - 1);
    this.show();
  },

  show() {
    const st = TOUR_STEPS[this.i];
    const el = $(st.sel);
    if (!el) {
      this.go(this.i + 1);
      return;
    }
    el.scrollIntoView({ block: 'center', behavior: 'instant' });
    const last = this.i === TOUR_STEPS.length - 1;
    const card = $('#tourCard');
    card.innerHTML = `<b class="rtl">${esc(t(st.k))}</b><p class="rtl">${esc(t(st.k + '_h'))}</p>
      <div class="tacts"><button class="btn ghost sm" id="tourSkip">${esc(t('tour_skip'))}</button>${this.i ? `<button class="btn ghost sm" id="tourBack">${ic('arrow-left')}${esc(t('tour_back'))}</button>` : ''}
      <button class="btn gold sm" id="tourNext">${esc(t(last ? 'tour_finish' : 'tour_next'))}${ic(last ? 'check' : 'arrow-right')}</button><span class="tstep">${esc(t('tour_step', { n: this.i + 1, total: TOUR_STEPS.length }))}</span></div>`;
    card.setAttribute('aria-label', t(st.k));
    $('#tourSkip').onclick = () => this.end();
    $('#tourBack')?.addEventListener('click', () => this.go(this.i - 1));
    $('#tourNext').onclick = () => this.go(this.i + 1);
    this.place();
    setTimeout(() => $('#tourNext')?.focus({ preventScroll: true }), 60);
  },

  /** Positions the spotlight hole over the target and the card below, above or at the bottom. */
  place() {
    if (!this.on) return;
    const el = $(TOUR_STEPS[this.i].sel);
    if (!el) return;
    const r = el.getBoundingClientRect();
    const hole = $('#tourHole');
    const top = Math.max(4, r.top - 6);
    const bottom = Math.min(innerHeight - 4, r.bottom + 6);
    Object.assign(hole.style, { left: Math.max(4, r.left - 6) + 'px', top: top + 'px', width: Math.min(innerWidth - 8, r.width + 12) + 'px', height: Math.max(20, bottom - top) + 'px' });
    const card = $('#tourCard');
    const ch = card.offsetHeight;
    const cw = card.offsetWidth;
    let y;
    if (bottom + 12 + ch < innerHeight) y = bottom + 12;
    else if (top - 12 - ch > 0) y = top - 12 - ch;
    else y = innerHeight - ch - 16;
    card.style.top = y + 'px';
    card.style.left = clamp(r.left + r.width / 2 - cw / 2, 16, innerWidth - cw - 16) + 'px';
  }
};


// ---------- printable match report ----------
/** Final standings: finished players by place, the rest by tokens home. */
function reportStandings(rec, tokens) {
  const active = rec.players.map((pl, p) => (pl.type === 'off' ? -1 : p)).filter(p => p >= 0);
  const homes = p => tokens[p].filter(x => x === FINISH).length;
  const rest = active.filter(p => !rec.winOrder.includes(p)).sort((a, b) => homes(b) - homes(a));
  return [...rec.winOrder.filter(p => active.includes(p)), ...rest];
}

function reportStandingsTable(rec, tokens) {
  const order = reportStandings(rec, tokens);
  const finished = new Set(rec.winOrder);
  const rows = order.map((p, k) => {
    const pl = rec.players[p];
    const s = rec.stats[p];
    const place = finished.has(p) ? k + 1 : '–';
    const kind = pl.type === 'ai' ? t('ai') + ' · ' + t(pl.level) : t('human');
    return `<tr><td><span class="pname"><span class="rank ${k === 0 && finished.has(p) ? 'r1' : ''}" title="${esc(finished.has(p) ? t('place' + (k + 1)) : '')}">${place}</span><span><span class="sw-dot" style="background:var(--${SEATS[p]})"></span>${esc(pl.name)}<small class="muted block">${esc(kind)}</small></span></span></td><td class="num">${s.rolls}</td><td class="num">${s.sixes}</td><td class="num">${s.captures}</td><td class="num">${s.lost}</td><td class="num">${tokens[p].filter(x => x === FINISH).length}/4</td></tr>`;
  }).join('');
  const head = ['rolls', 'sixes', 'captures', 'lost', 'home'].map(k => `<th class="num">${esc(t(k))}</th>`).join('');
  return `<div class="tablewrap"><table class="stats"><thead><tr><th>${esc(t('player'))}</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function reportMoveList(rec) {
  const rows = rec.history.map((h, k) => {
    const pl = rec.players[h.p];
    const notes = [];
    if (h.cap && h.cap.length) notes.push(t('rep_captured', { names: h.cap.map(([q]) => rec.players[q].name).join(', ') }));
    if (h.to === FINISH) notes.push(t('rep_home_note'));
    return `<tr><td class="num">${k + 1}</td><td><span class="sw-dot" style="background:var(--${SEATS[h.p]})"></span>${esc(pl.name)}</td><td class="num">${h.d}</td><td class="num">${h.i + 1}</td><td>${esc(Speak.where(h.p, h.from))}</td><td>${esc(Speak.where(h.p, h.to))}</td><td>${esc(notes.join(' · '))}</td></tr>`;
  }).join('');
  const head = ['rep_move_no', 'player', 'rep_die', 'rep_token', 'rep_from', 'rep_to', 'rep_note'].map(k => `<th>${esc(t(k))}</th>`).join('');
  return `<div class="movelist tablewrap"><table class="stats"><thead><tr>${head}</tr></thead><tbody>${rows || `<tr><td colspan="7" class="muted">—</td></tr>`}</tbody></table></div>`;
}

function reportRules(rec) {
  return RULE_VARIANTS.map(k => `<span class="chip">${ic(rec.rules && rec.rules[k] ? 'check' : 'x')}${esc(t('r_' + k))}</span>`).join('');
}

/** Tournament table when the report's game belongs to the stored tournament. */
function reportTourney(rec) {
  const tn = Tourney.get();

  const rows = Tourney.standings(tn).map((r, k) => `<tr><td>${k + 1}</td><td>${esc(r.name)}</td><td class="num">${r.played}</td><td class="num">${r.wins}</td><td class="num">${r.pts}</td></tr>`).join('');
  return `<h3>${ic('trophy')}${esc(t('rep_tourney'))} · ${esc(tn.name)}</h3><div class="tablewrap"><table class="stats"><thead><tr><th>${esc(t('tn_rank'))}</th><th>${esc(t('player'))}</th><th class="num">${esc(t('tn_played'))}</th><th class="num">${esc(t('tn_won'))}</th><th class="num">${esc(t('tn_points'))}</th></tr></thead><tbody>${rows}</tbody></table></div>`;

// ---------- topbar ----------
const NAV = [
  ['game', 'nav_game', 'gamepad'],
  ['setup', 'nav_new', 'users'],
  ['tournament', 'nav_tourney', 'trophy'],
  ['stats', 'nav_stats', 'trending-up'],
  ['about', 'nav_about', 'info']
];
const VIEWS = ['setup', 'game', 'tournament', 'stats', 'replay', 'report', 'about'];

function renderTopbar() {
  const cur = document.body.dataset.view;
  $('#topnav').innerHTML = NAV.map(([id, k, i]) => {
    const active = cur === id || (id === 'stats' && (cur === 'replay' || cur === 'report'));
    return `<a href="#${id}" class="${active ? 'active' : ''} ${id === 'about' ? 'about-link' : ''}" aria-label="${esc(t(k))}" ${active ? 'aria-current="page"' : ''}>${ic(i)}<span class="lbl">${esc(t(k))}</span></a>`;
  }).join('');
  $('#newBtn').innerHTML = ic('refresh') + `<span class="lbl">${esc(t('nav_new'))}</span>`;
  $('#newBtn').setAttribute('aria-label', t('nav_new'));
  const snd = t(prefs.sound ? 'sound_on' : 'sound_off');
  $('#soundBtn').innerHTML = ic(prefs.sound ? 'volume' : 'volume-x');
  $('#soundBtn').setAttribute('aria-label', snd);
  $('#soundBtn').title = snd;
  $('#settingsBtn').innerHTML = ic('settings');
  $('#settingsBtn').setAttribute('aria-label', t('settings'));
  $('#settingsBtn').title = t('settings');
  renderBadge();
}

function leaveGame() {
  clearTimeout(UI.timer);
  store.del('game');
  G = null;
  location.hash = '#setup';
  route();
}

$('#newBtn').onclick = () => {
  if (!G || G.phase === 'over') {
    leaveGame();
    return;
  }
  confirmModal('refresh', t('new_game_q'), t('new_game_h'), t('confirm'), leaveGame);
};
$('#soundBtn').onclick = () => {
  prefs.sound = !prefs.sound;
  savePrefs();
  renderTopbar();
  if (drawerOpen()) renderDrawer();
  toast(t(prefs.sound ? 'sound_on' : 'sound_off'), '', prefs.sound ? 'volume' : 'volume-x');
};
$('#settingsBtn').onclick = () => openDrawer('settings');
$('#inboxBtn').onclick = () => openDrawer('inbox');
$('#drawerClose').onclick = closeDrawer;
$('#scrim').onclick = closeDrawer;
$('#langBtn').onclick = () => setLang(lang === 'en' ? 'ur' : 'en');

// ---------- keyboard ----------
function onEscape() {
  if (Tour.on) Tour.end();
  else if ($('#modal').classList.contains('open')) closeModal();
  else closeDrawer();
}

function replayKeys(e) {
  if (!Replay.rec) return;
  const keys = { ArrowLeft: () => Replay.seek(Replay.k - 1), ArrowRight: () => Replay.stepForward(), Home: () => Replay.seek(0), End: () => Replay.seek(Replay.rec.history.length) };
  if (keys[e.key]) {
    e.preventDefault();
    Replay.stop();
    keys[e.key]();
  }
}

function gameKeys(e) {
  if (e.key === ' ' || e.key === 'Enter') {
    if (G.phase === 'roll' && isHuman(G.turn) && !e.target.closest('button,a')) {
      e.preventDefault();
      doRoll();
    }
  } else if (/^[1-4]$/.test(e.key)) {
    pickToken(+e.key - 1);
  } else if (e.key === 'u' || e.key === 'U') {
    undo();
  } else if (e.key === 'p' || e.key === 'P') {
    togglePause();
  }
}

document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select')) return;
  if (e.key === 'Escape') {
    onEscape();
    return;
  }
  if (Tour.on || $('#modal').classList.contains('open') || drawerOpen()) return;
  const view = document.body.dataset.view;
  if (view === 'replay') replayKeys(e);
  else if (view === 'game' && G) gameKeys(e);
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    clearTimeout(UI.timer);
    save();
  } else {
    schedule();
  }
});

// ---------- router ----------
/** Loads the saved game for #game when none is in memory; false when there is nothing to resume. */
function restoreGame() {
  const saved = store.get('game');
  if (!(saved && saved.tokens && saved.phase !== 'over')) return false;
  G = saved;
  if (G.phase === 'move' && G.dice) G.legal = legalMoves(G, G.turn, G.dice);
  if (G.phase === 'wait' || G.phase === 'anim') {
    G.phase = 'roll';
    G.dice = null;
    G.legal = null;
  }
  return true;
}

function renderView(h) {
  if (h === 'setup') renderSetup();
  if (h === 'tournament') renderTournament();
  if (h === 'stats') Stats.render();
  if (h === 'replay') renderReplayPage();
  if (h === 'report') renderReport();
  if (h === 'about') renderAbout();
  if (h === 'game') renderAll();
  animateIn($('#v-' + h));
}

function route(opts) {
  let h = (location.hash.slice(1) || 'setup').split('?')[0];
  if (!VIEWS.includes(h)) h = 'setup';
  if (h === 'game' && !G && !restoreGame()) {
    location.hash = '#setup';
    return;
  }
  const same = document.body.dataset.view === h;
  clearTimeout(UI.timer);
  if (!(opts && opts.keepDrawer)) closeDrawer();
  if (h !== 'replay') Replay.stop();
  document.body.dataset.view = h;
  $$('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + h));
  renderTopbar();
  renderView(h);
  if (h === 'game') {
    if (G.phase === 'over') showWin();
    else schedule();
  } else {
    Tutorial.render();
  }
  if (!same) window.scrollTo({ top: 0 });
}
window.addEventListener('hashchange', route);

/** Resize: keep confetti full-screen, redraw width-dependent charts, re-place the tour card. */
let resizeTimer = null;
window.addEventListener('resize', () => {
  const cv = $('#confetti');
  if (cv.classList.contains('on')) {
    cv.width = innerWidth;
    cv.height = innerHeight;
  }
  Tour.place();
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (document.body.dataset.view === 'stats') Stats.render();
  }, 250);
});


// ---------- headless play (self-test, tournaments, AI arena, sample replay) ----------
/** One synchronous AI turn with no UI — used by the self-test and by Ludo.simulate(). */
function simulateTurn(g) {
  const p = g.turn;
  const d = rollDie();
  const r = resolveRoll(g, d);
  if (r.forfeit) {
    nextTurn(g);
    return;
  }
  if (r.none) {
    if (!r.six) {
      nextTurn(g);
    } else {
      g.phase = 'roll';
      g.dice = null;
    }
    return;
  }
  const mv = aiChoose(g, p, r.moves, g.players[p].level || 'medium');
  applyMove(g, mv);
  g.history.push({ p, d, i: mv.i, from: mv.from, to: mv.to, cap: mv.capture.map(c => [c.p, c.i]) });
  afterMove(g, mv, d);
}

/** Plays a whole game between AI seats (humans are played by the medium AI) and returns it. */
function playHeadless(seats, maxSteps = 20000) {
  const g = newGame(seats.map(s => (s.type === 'human' ? { ...s, type: 'ai', level: 'medium' } : s)));
  for (let k = 0; k < maxSteps && g.phase !== 'over'; k++) simulateTurn(g);
  g.players = seats.map((s, p) => ({ ...g.players[p], type: s.type }));
  return g;
}

/** Invariants after every turn: 4 tokens each, legal positions, no two colours on one unsafe square. */
function checkInvariants(g, turns, errors) {
  g.tokens.forEach((tk, p) => {
    if (tk.length !== 4) errors.push(`player ${p} has ${tk.length} tokens`);
    tk.forEach(x => {
      if (!(x === -1 || (Number.isInteger(x) && x >= 0 && x <= FINISH))) errors.push(`bad position ${x} for player ${p}`);
    });
  });
  const occ = {};
  g.tokens.forEach((tk, p) => tk.forEach(x => {
    if (x < 0 || x > 50) return;
    const a = absOf(p, x);
    if (!isSafe(a)) (occ[a] ??= new Set()).add(p);
  }));
  Object.entries(occ).forEach(([a, s]) => {
    if (s.size > 1) errors.push(`two colours share unsafe square ${a} after turn ${turns}`);
  });
  if (!['roll', 'over'].includes(g.phase)) errors.push(`unexpected phase ${g.phase}`);
}

function selfTest(n = 200, levels = ['easy', 'medium', 'hard', 'expert']) {
  const g = newGame([0, 1, 2, 3].map(p => ({ type: 'ai', level: levels[p % levels.length], name: SEATS[p] })));
  const errors = [];
  let turns = 0;
  try {
    for (; turns < n && g.phase !== 'over'; turns++) {
      simulateTurn(g);
      checkInvariants(g, turns, errors);
      if (errors.length > 5) break;
    }
  } catch (e) {
    errors.push('exception: ' + (e && e.message));
  }
  const captures = g.stats.reduce((a, s) => a + s.captures, 0);
  const lost = g.stats.reduce((a, s) => a + s.lost, 0);
  if (captures !== lost) errors.push(`captures ${captures} != lost ${lost}`);
  return {
    ok: errors.length === 0,
    turns,
    phase: g.phase,
    captures,
    finished: g.tokens.map(tk => tk.filter(x => x === FINISH).length),
    winOrder: g.winOrder,
    levels: g.players.map(pl => pl.level),
    errors: errors.slice(0, 5)
  };
}

/** Synchronous arena for tests: win counts per seat over `games` headless games. */
function arena(levels = ['expert', 'hard', 'medium', 'easy'], games = 10) {
  const seats = levels.map((lv, p) => (lv === 'off' ? { type: 'off', level: 'medium', name: '' } : { type: 'ai', level: lv, name: SEATS[p] }));
  const wins = [0, 0, 0, 0];
  let unfinished = 0;
  for (let k = 0; k < games; k++) {
    const g = playHeadless(seats);
    if (g.phase !== 'over') unfinished++;
    else wins[g.winOrder[0]]++;
  }
  return { levels, games, wins, unfinished };
}

// ---------- public API (console, tests) ----------
window.Ludo = {
  get state() { return G; },
  levels: AI_LEVELS,
  startGame,
  legalMoves,
  aiChoose,
  expertChoose,
  selfTest,
  newGame,
  simulateTurn,
  playHeadless,
  arena,
  render: () => renderAll(),
  tutorial: () => Tutorial.start(),
  tour: () => Tour.start(),
  closeTour: () => Tour.end(),
  tournament: Tourney,
  records: Records,
  achievements: Achievements,
  inbox: Inbox,

  /** Fast-forward the live game n AI turns (stops early when a human must roll) and re-render. */
  simulate(n = 10, stopAtHuman = true) {
    if (!G) return null;
    clearTimeout(UI.timer);
    for (let k = 0; k < n && G.phase !== 'over'; k++) {
      if (stopAtHuman && isHuman(G.turn) && k > 0) break;
      simulateTurn(G);
    }
    save();
    renderAll();
    if (G.phase === 'over') onGameOver();
    else schedule();
    return G;
  },

  /** Force a finished game for screenshots/tests. */
  forceWin() {
    if (!G) return null;
    clearTimeout(UI.timer);
    const act = activeSeats(G);
    act.forEach((p, k) => {
      G.tokens[p] = k === 0 ? [FINISH, FINISH, FINISH, FINISH] : k === 1 ? [FINISH, FINISH, FINISH, 40] : [FINISH, 12, 3, -1];
      G.stats[p].captures = [3, 1, 2, 0][k];
      G.stats[p].sixes = [7, 5, 4, 2][k];
      G.stats[p].rolls = [40, 36, 33, 28][k];
    });
    G.winOrder = act.slice().sort((a, b) => homeCount(G, b) - homeCount(G, a));
    G.phase = 'over';
    G.turnNo = 97;
    G.elapsed = 1234000;
    save();
    renderAll();
    onGameOver();
    return G;
  }
};
