      title: `${name(st)} · ${flowShort(level(st.id))} ${flowUnit()}`,
      onClick: it => { selectStation(it.id); sheetUp(); }

  });
  return [...districts, ...stations];
}

function selectStation(id) {
  state.station = id;
  saveUI();
  renderGauges(id);

}

const PLAN_DEFAULT = () => ({
  adults: 2, children: 2, infants: 0, elderly: 1, pregnant: 0, disabled: 0, livestock: 4, vehicle: false,
  docs: { cnic: true, bform: false, land: true, bank: true, med: false },
  meet: '', contacts: [{ name: '', phone: '' }, { name: '', phone: '' }], loc: null,
  routeCamp: null, routeMode: 'foot'
});
const getPlan = () => Object.assign(PLAN_DEFAULT(), store.get('plan', {}));
const headcount = p => p.adults + p.children + p.infants + p.elderly;
const vulnerable = p => p.infants + p.elderly + p.pregnant + p.disabled;

// Travel modes for the route estimate: km/h on flood-affected roads
const MODES = [
  ['foot', 'footprints', 'p_mode_foot', 4],
  ['tractor', 'tractor', 'p_mode_tractor', 15],
  ['car', 'car', 'p_mode_car', 40],
  ['boat', 'boat', 'p_mode_boat', 6]
];
const ROAD_FACTOR = 1.3;

/** Prioritised checklist: pr 1 = now, 2 = soon, 3 = later; shifted by the district alert level. */
function buildChecklist(p, lv) {
  const n = headcount(p);
  const items = [];
  const add = (pr, icon, en, ur, cond = true) => { if (cond) items.push({ pr, icon, en, ur }); };
  const docsMissing = Object.values(p.docs).some(v => !v);
  const urgentLevel = lv === 'warning' || lv === 'severe';

  add(1, 'file', 'Documents in a sealed waterproof bag: CNICs, B-forms, land papers', 'دستاویزات پانی سے محفوظ بند تھیلے میں: شناختی کارڈ، ب فارم، زمین کے کاغذات');
  add(2, 'camera', 'Photograph the documents you do not hold and save to your phone / WhatsApp', 'جو دستاویزات موجود نہیں ان کی تصویر لے کر فون / واٹس ایپ میں محفوظ کریں', docsMissing);
  add(vulnerable(p) ? 1 : 2, 'pill', 'Regular medicines for 2 weeks, ORS, paracetamol, first-aid kit', 'دو ہفتے کی روزمرہ دوائیں، او آر ایس، پیراسیٹامول، فرسٹ ایڈ کٹ');
  add(1, 'bottle', `Water and dry food for 3 days: about ${n * 12} litres of water for ${n} people`, `تین دن کا پانی اور خشک خوراک: ${n} افراد کے لیے تقریباً ${n * 12} لیٹر پانی`);
  add(1, 'battery', 'Phones charged, power bank full, helpline numbers saved and written on paper', 'فون چارج، پاور بینک بھرا، ہیلپ لائن نمبر محفوظ اور کاغذ پر لکھے ہوئے');
  add(2, 'wallet', 'Cash in small notes; bank / BISP card in the documents bag', 'چھوٹے نوٹوں میں نقد؛ بینک / بی آئی ایس پی کارڈ دستاویزات کے تھیلے میں');
  add(urgentLevel ? 1 : 2, 'livestock', `Livestock plan: move ${p.livestock} animals to high ground, store fodder; untie them if you must leave fast`, `مویشیوں کا منصوبہ: ${p.livestock} جانوروں کو اونچی جگہ لے جائیں، چارہ رکھیں؛ جلدی نکلنا پڑے تو کھول دیں`, p.livestock > 0);
  add(1, 'zap', 'Switch off gas and electricity at the mains before leaving', 'نکلنے سے پہلے مین سے گیس اور بجلی بند کریں');
  add(1, 'map-pin', p.meet ? `Family meeting point agreed: ${p.meet}` : 'Agree a family meeting point (set it below)', p.meet ? `خاندان کے ملنے کی جگہ طے: ${p.meet}` : 'خاندان کے ملنے کی جگہ طے کریں (نیچے درج کریں)');
  add(1, 'heart', 'Pregnant women: mother card, clean delivery kit, nearest working BHU / RHC and ambulance number', 'حاملہ خواتین: ماں کارڈ، صاف ڈلیوری کٹ، قریبی فعال بی ایچ یو / آر ایچ سی اور ایمبولینس نمبر', p.pregnant > 0);
  add(1, 'hand', 'Assign one helper to each person with a disability; mobility aid and medicines ready', 'ہر معذور فرد کے لیے ایک مددگار مقرر کریں؛ سہارا اور دوائیں تیار', p.disabled > 0);
  add(1, 'baby', 'Infants: formula, clean bottles, extra water, warm wrap', 'شیر خوار: دودھ، صاف بوتلیں، اضافی پانی، گرم کپڑا', p.infants > 0);
  add(1, 'user', 'Elderly: medicines, glasses, a chair or charpai to carry if needed', 'بزرگ: دوائیں، عینک، ضرورت پر اٹھانے کے لیے کرسی یا چارپائی', p.elderly > 0);
  if (p.vehicle) add(2, 'car', 'Fuel the vehicle, park it facing the exit road, keys in the go-bag', 'گاڑی میں تیل بھریں، نکلنے کے راستے کی طرف کھڑی کریں، چابی بیگ میں');
  else add(2, 'car', 'Arrange transport with neighbours (tractor-trolley / pickup) and agree the pickup point', 'محلے داروں سے سواری (ٹریکٹر ٹرالی / پک اپ) طے کریں اور اٹھانے کی جگہ مقرر کریں');
  add(2, 'users', "Write your phone number on each child's arm with a marker", 'ہر بچے کے بازو پر مارکر سے اپنا فون نمبر لکھیں', p.children + p.infants > 0);
  add(3, 'home', 'Raise grain, bedding and valuables onto high shelves; sandbag the doorway', 'اناج، بستر اور قیمتی سامان اونچی جگہ رکھیں؛ دروازے پر ریت کی بوریاں لگائیں');
  add(3, 'share', 'Share the printed plan card with relatives in another district', 'پرنٹ شدہ منصوبہ کارڈ دوسرے ضلع کے رشتہ داروں کو دیں');

  const shift = lv === 'severe' ? -1 : lv === 'normal' ? 1 : 0;
  return items
    .map(i => ({ ...i, pr: clamp(i.pr + shift, 1, 3) }))
    .sort((a, b) => a.pr - b.pr);
}

function leaveRule(p, lv) {
  if (lv === 'severe') return { key: 'p_leave_severe', c: LEVELS.severe.c, icon: 'siren' };
  if (lv === 'warning') {
    const key = vulnerable(p) > 0 || p.livestock > 0 ? 'p_leave_warning_v' : 'p_leave_warning';
    return { key, c: LEVELS.warning.c, icon: 'alert' };
  }
  if (lv === 'watch') return { key: 'p_leave_watch', c: LEVELS.watch.c, icon: 'clock' };
  return { key: 'p_leave_normal', c: LEVELS.normal.c, icon: 'shield-check' };
}

/** Route estimate from the household location (district centroid) to a camp. */
function routeEstimate(p, from) {
  const near = nearestCamps(from, 5);
  const chosen = near.find(n => n.c.id === p.routeCamp) || near[0];
  const km = chosen.km * ROAD_FACTOR;
  const mode = MODES.find(m => m[0] === p.routeMode) || MODES[0];
  const hours = km / mode[3];
  return { near, chosen, km, mode, hours };
}

function fmtHours(hours) {
  const h = Math.floor(hours);
  const m = Math.round((hours - h) * 60);
  if (h === 0) return `${m} ${t('minutes')}`;
  return `${h} ${t('hours')} ${m} ${t('minutes')}`;
}

  return `<div class="card flat" id="household">

      ${stepper('pregnant', t('p_pregnant'))}${stepper('disabled', t('p_disabled'))}${stepper('livestock', t('p_livestock'))}

    <label class="f">${t('p_docs')}</label><div class="chips">${['cnic', 'bform', 'land', 'bank', 'med'].map(docChip).join('')}</div>
    <label class="f" for="pMeet">${t('p_meet')}</label><input id="pMeet" type="text" value="${esc(p.meet)}" placeholder="${esc(t('p_meet_ph'))}" maxlength="80">
    <label class="f">${t('p_contacts')}</label>${p.contacts.map(contactRow).join('')}
    <div class="actions"><button class="btn" id="pSave">${ic('check')}${t('p_save')}</button></div>

function planChecklist(list) {
  const colorFor = pr => (pr === 1 ? LEVELS.severe.c : pr === 2 ? LEVELS.warning.c : LEVELS.watch.c);
  const labelFor = pr => t(pr === 1 ? 'p_now' : pr === 2 ? 'p_soon' : 'p_later');
  const rows = list.map(i => `<li style="--c:${colorFor(i.pr)}"><span class="p" title="${labelFor(i.pr)}">${i.pr}</span>${ic(i.icon)}<span>${esc(bi(i.en, i.ur))}</span></li>`);
  return `<div class="card flat"><h3>${ic('list')}${t('p_checklist')}</h3><ul class="cl stagger" style="margin-top:8px">${rows.join('')}</ul><div class="small muted" style="margin-top:8px">1 = ${t('p_now')} · 2 = ${t('p_soon')} · 3 = ${t('p_later')}</div></div>`;
}

function planGoBag(items, bag) {
  const done = items.filter(g => bag[g[0]]).length;
  const rows = items.map(g => `<label class="check ${bag[g[0]] ? 'done' : ''}"><input type="checkbox" data-bag="${g[0]}" ${bag[g[0]] ? 'checked' : ''}>${ic(g[1])}<span>${esc(bi(g[2], g[3]))}</span></label>`);
  return `<div class="card flat">
    <div class="ringwrap">
      <svg class="ring" viewBox="0 0 72 72" aria-hidden="true"><circle class="trk" cx="36" cy="36" r="30"/><circle class="val" cx="36" cy="36" r="30" stroke-dasharray="188.5" stroke-dashoffset="188.5" id="ringVal"/><text x="36" y="36" id="ringTxt">0%</text></svg>
      <div style="flex:1"><h3>${ic('bag')}${t('p_gobag')}</h3><div class="small muted"><span id="bagCount">${done}</span>/${items.length} · <button class="btn sm ghost" id="bagReset" style="min-height:28px;padding:2px 8px">${t('p_reset_bag')}</button></div></div>
    </div>
    <div class="list stagger" style="margin-top:10px;gap:6px">${rows.join('')}</div>
  </div>`;
}

function planRoute(p, est) {
  const options = est.near.map(({ c, km }) => `<option value="${c.id}" ${c.id === est.chosen.c.id ? 'selected' : ''}>${esc(c.en)} · ${km.toFixed(0)} ${t('p_km')}</option>`);
  const modeBtns = MODES.map(([id, icon, key, kmh]) => {
    const hours = est.km / kmh;
    return `<button type="button" class="${id === est.mode[0] ? 'on' : ''}" data-mode="${id}">${ic(icon)}<span>${t(key)}</span><b>${fmtHours(hours)}</b></button>`;
  });
  const leaveBy = new Date(Date.now() + est.hours * 3600000 * -1 + 6 * 3600000);
  return `<div class="card flat">
    <h3>${ic('navigation')}${t('p_route')}</h3><p class="lead txt small">${t('p_route_lead')}</p>
    <label class="f" for="routeCamp">${t('p_dest')}</label><select id="routeCamp">${options.join('')}</select>
    <div class="eta">${modeBtns.join('')}</div>
    <div class="note txt" style="margin-top:10px"><b>${est.km.toFixed(0)} ${t('p_km')}</b> · ${t('p_eta')} <b>${fmtHours(est.hours)}</b> · ${t('p_leave_by')} <b>${leaveBy.toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit' })}</b></div>
    <div class="small muted txt" style="margin-top:6px">${ic('info')} ${t('p_route_note')}</div>
  </div>`;
}

function renderPlan() {
  const p = getPlan();
  const d = DM[myDistrict];
  const r = R(d);
  const bag = store.get('gobag', {});
  const rule = leaveRule(p, r.lv);
  const items = GOBAG.filter(g => !g[4] || g[4](p));
  const from = p.loc || d;
  const est = routeEstimate(p, from);
  const list = buildChecklist(p, r.lv);

  setHead('bag', t('p_title'), `<button class="btn sm ghost" id="printBtn">${ic('printer')}<span class="lbl">${t('p_print')}</span></button>`);
  view.innerHTML = `<p class="lead txt">${t('p_lead')}</p>
    ${planLeaveCard(d, r, rule)}
    ${planHousehold(p)}
    ${planChecklist(list)}
    ${planGoBag(items, bag)}
    ${planRoute(p, est)}
    <div class="card flat"><h3>${ic('tent')}${t('p_nearest')}</h3><div class="list stagger" style="margin-top:8px">${est.near.slice(0, 3).map(({ c, km }) => campRow(c, km)).join('')}</div></div>`;

  bindPlan(p, items);
  bindCampRows(view);
  drawPlanMap(d, r, est);
}

function updateRing(items) {
  const bag = store.get('gobag', {});
  const done = items.filter(g => bag[g[0]]).length;
  const pct = items.length ? Math.round(done / items.length * 100) : 0;
  $('#ringVal').style.strokeDashoffset = 188.5 * (1 - pct / 100);
  $('#ringTxt').textContent = pct + '%';
  $('#bagCount').textContent = done;
  return pct;
}

function savePlanFromForm(quiet) {
  const np = getPlan();
  $$('.stepper', view).forEach(s => { np[s.dataset.k] = +$('output', s).textContent; });
  np.vehicle = $('#pVeh').checked;
  ['cnic', 'bform', 'land', 'bank', 'med'].forEach(k => { np.docs[k] = $(`[data-doc="${k}"]`).classList.contains('on'); });
  np.meet = $('#pMeet').value.trim();
  np.contacts = [0, 1].map(i => ({ name: $(`[data-cn="${i}"]`).value.trim(), phone: $(`[data-cp="${i}"]`).value.trim() }));
  store.set('plan', np);
  if (quiet) return;
  logActivity('act_plan', `${headcount(np)} ${t('p_members')}`, 'bag');
  toast(t('p_saved'), 'ok', 'check-circle');
  renderPlan();
}

function bindPlan(p, items) {
  requestAnimationFrame(() => {
    const pct = updateRing(items);
    countUp($('#ringTxt'), pct, { fmt: v => Math.round(v) + '%' });
  });

  $$('.stepper', view).forEach(s => {
    $$('button', s).forEach((b, i) => {
      b.onclick = () => {
        const out = $('output', s);
        out.textContent = clamp(+out.textContent + (i ? 1 : -1), 0, 99);
        savePlanFromForm(true);
      };
    });
  });
  $$('[data-doc]', view).forEach(b => {
    b.onclick = () => {
      b.classList.toggle('on');
      b.innerHTML = (b.classList.contains('on') ? ic('check') : '') + t('p_doc_' + b.dataset.doc);
      savePlanFromForm(true);
    };
  });
  $('#pVeh').onchange = () => savePlanFromForm(true);
  $('#pSave').onclick = () => savePlanFromForm(false);

  $$('[data-bag]', view).forEach(cb => {
    cb.onchange = () => {
      const bag = store.get('gobag', {});
      if (cb.checked) bag[cb.dataset.bag] = true;
      else delete bag[cb.dataset.bag];
      store.set('gobag', bag);
      cb.closest('.check').classList.toggle('done', cb.checked);
      const pct = updateRing(items);
      if (cb.checked) logActivity('act_bag', bi(GOBAG.find(g => g[0] === cb.dataset.bag)[2], GOBAG.find(g => g[0] === cb.dataset.bag)[3]), 'bag');
      if (pct === 100) toast(t('p_gobag') + ' ✓', 'ok', 'check-circle');
    };
  });
  $('#bagReset').onclick = () => { store.set('gobag', {}); renderPlan(); };
  $('#printBtn').onclick = () => printReport('plan');

  $('#routeCamp').onchange = e => {
    const np = getPlan();
    np.routeCamp = e.target.value;
    store.set('plan', np);
    renderPlan();
  };
  $$('[data-mode]', view).forEach(b => {
    b.onclick = () => {
      const np = getPlan();
      np.routeMode = b.dataset.mode;
      store.set('plan', np);
      renderPlan();
    };
  });
}

function drawPlanMap(d, r, est) {
  MapCtl.legend([[r.c, t('al_mine')], ['#1e3a5f', t('lg_camp'), 'sq'], ['#1e3a5f', t('lg_route'), 'ln']]);
  const home = { id: d.id, lat: d.lat, lng: d.lng, r: 11, color: r.c, pulse: r.lv !== 'normal', sel: true, title: name(d), onClick: () => openDistrict(d.id) };
  const camps = est.near.slice(0, 3).map(({ c, km }) => ({
    id: c.id, lat: c.lat, lng: c.lng, r: 8, shape: 'sq',
    color: c.id === est.chosen.c.id ? '#1e3a5f' : '#6b8cae',
    sel: c.id === est.chosen.c.id,
    title: `${c.en} · ${km.toFixed(0)} ${t('p_km')}`,
    onClick: () => { location.hash = 'camps/' + c.id; }
  }));
  const markers = [home, ...camps];
  MapCtl.setMarkers(markers);
  MapCtl.setRoute({ from: d, to: est.chosen.c, color: '#1e3a5f' });
  MapCtl.fit(markers);
}

// =====================================================================
// 10. camps
// =====================================================================
function campRow(c, km) {
  const pct = Math.min(100, Math.round(c.occ / c.cap * 100));
  const col = occColor(c);
  const d = DM[c.d];
  const regs = getRegistrations().filter(reg => reg.camp === c.id).length;
  const facilities = [['w', 'droplet', 'c_water'], ['l', 'home', 'c_latrines'], ['m', 'stethoscope', 'c_medical'], ['f', 'box', 'c_food']];
  const facHtml = facilities.map(([k, icon, key]) => `<span class="${c.fac.includes(k) ? '' : 'no'}">${ic(icon)}${t(key)}</span>`).join('');
  const needsHtml = c.needs.length
    ? `<div class="chips" style="margin-top:8px"><span class="small muted" style="align-self:center">${t('c_needs')}:</span>${c.needs.map(n => `<span class="chip need">${ic('alert-circle')}${esc(n.trim())}</span>`).join('')}</div>`
    : '';
  const kmHtml = km != null ? ` · <b>${km.toFixed(0)} ${t('p_km')}</b>` : '';
  const regHtml = regs ? ` · ${regs} ${t('c_reg_count')}` : '';

  return `<article class="card camp" data-c="${c.id}" tabindex="0">
    <div class="top">
      <div class="ico">${ic(CAMP_TYPE_ICON[c.type])}</div>
      <div style="flex:1;min-width:0"><div class="nm">${esc(c.en)}</div><div class="sub">${t('c_type_' + c.type)} · ${esc(name(d))}, ${t(d.prov)}${kmHtml}${regHtml}</div></div>
      ${pct >= 95 ? `<span class="badge solid" style="--c:${col}">${t('c_full')}</span>` : ''}
    </div>
    <div class="occ"><span class="num"><b>${nf.format(c.occ)}</b> / ${nf.format(c.cap)} ${t('c_people')}</span><div class="bar" style="--c:${col}"><i data-w="${pct}"></i></div><b class="num" style="color:${col}">${pct}%</b></div>
    <div class="fac">${facHtml}</div>
    ${needsHtml}
    <div class="actions">
      <a class="btn sm ghost" href="tel:${esc(c.phone)}">${ic('phone')}${esc(c.phone)}</a>
      <a class="btn sm river" href="${mapsLink(c.lat, c.lng)}" target="_blank" rel="noopener">${ic('navigation')}${t('c_directions')}</a>
      <button class="btn sm ghost" data-upd="${c.id}">${ic('edit')}${t('c_update')}</button>
      <button class="btn sm ghost" data-reg="${c.id}">${ic('clipboard')}${t('c_register')}</button>
      <button class="btn sm ghost" data-focus="${c.id}" aria-label="${t('al_focus')}">${ic('map-pin')}</button>
    </div>
  </article>`;
}

function bindCampRows(root) {
  $$('[data-upd]', root).forEach(b => {
    b.onclick = e => { e.stopPropagation(); openCampUpdate(b.dataset.upd); };
  });
  $$('[data-reg]', root).forEach(b => {
    b.onclick = e => { e.stopPropagation(); openRegistration(b.dataset.reg); };
  });
  $$('[data-focus]', root).forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      const c = CM[b.dataset.focus];
      if (page !== 'camps') { location.hash = 'camps/' + c.id; return; }
      state.selCamp = c.id;
      MapCtl.focus(c.lat, c.lng, 11);
      renderCampMarkers();
    };
  });
}

function openCampUpdate(id) {
  const c = campData(CM[id]);
  modal(t('c_update_title'), `<div class="small muted" style="margin-bottom:6px">${esc(c.en)}</div>
    <label class="f" for="uOcc">${t('c_occ_now')}</label><input id="uOcc" type="number" min="0" max="${c.cap * 2}" value="${c.occ}">
    <label class="f" for="uNeeds">${t('c_needs_in')}</label><input id="uNeeds" type="text" value="${esc(c.needs.join(', '))}" placeholder="food, tents, medicines">
    <div class="actions"><button class="btn" id="uSave">${ic('check')}${t('save')}</button><button class="btn ghost" id="uCancel">${t('cancel')}</button></div>`,
  box => {
    $('#uCancel', box).onclick = closeModal;
    $('#uSave', box).onclick = () => {
      const needs = $('#uNeeds', box).value.split(',').map(s => s.trim()).filter(Boolean);
      saveCampUpdate(c.id, +$('#uOcc', box).value || 0, needs);
    };
  });
}

function saveCampUpdate(id, occ, needs) {
  const updates = store.get('campUpdates', {});
  updates[id] = { occ, needs, ts: Date.now() };
  store.set('campUpdates', updates);
  logActivity('act_camp', CM[id].en, 'tent');
  closeModal();
  toast(t('c_updated'), 'ok', 'check-circle');
  route(false);
}

function openRegistration(campId) {
  const c = CM[campId];
  const options = DISTRICTS.map(d => `<option value="${d.id}" ${d.id === myDistrict ? 'selected' : ''}>${esc(name(d))}</option>`).join('');
  modal(t('c_reg_title'), `<div class="small muted" style="margin-bottom:6px">${esc(c.en)}</div>
    <label class="f" for="rHead">${t('c_reg_head')}</label><input id="rHead" type="text" maxlength="60">
    <div class="cols2"><div><label class="f" for="rMembers">${t('c_reg_members')}</label><input id="rMembers" type="number" min="1" max="30" value="5"></div><div><label class="f" for="rPhone">${t('c_reg_phone')}</label><input id="rPhone" type="tel" placeholder="03xx-xxxxxxx"></div></div>
    <label class="f" for="rOrigin">${t('c_reg_origin')}</label><select id="rOrigin">${options}</select>
    <label class="f" for="rNeeds">${t('c_reg_needs')}</label><input id="rNeeds" type="text" maxlength="120">
    <div class="actions"><button class="btn" id="rSave">${ic('check')}${t('save')}</button><button class="btn ghost" id="rCancel">${t('cancel')}</button></div>`,
  box => {
    $('#rCancel', box).onclick = closeModal;
    $('#rSave', box).onclick = () => {
      const head = $('#rHead', box).value.trim();
      const members = +$('#rMembers', box).value || 0;
      if (!head || !members) { toast(t('m_valid'), 'bad', 'alert'); return; }
      const regs = getRegistrations();
      regs.unshift({ id: uid(), camp: campId, head, members, origin: $('#rOrigin', box).value, phone: $('#rPhone', box).value.trim(), needs: $('#rNeeds', box).value.trim(), ts: Date.now() });
      store.set('registrations', regs);
      logActivity('act_reg', c.en, 'clipboard');
      closeModal();
      toast(t('c_reg_saved'), 'ok', 'check-circle');
      route(false);
    };
  });
}

function visibleCamps() {
  const q = state.campQ.trim().toLowerCase();
  const from = DM[myDistrict];
  return CAMPS
    .map(c => ({ c: campData(c), km: haversine(from, c) }))
    .filter(({ c }) => state.campProv === 'all' || DM[c.d].prov === state.campProv)
    .filter(({ c }) => !q || c.en.toLowerCase().includes(q) || DM[c.d].en.toLowerCase().includes(q) || DM[c.d].ur.includes(q))
    .sort((a, b) => a.km - b.km);
}

function renderCampMarkers() {
  const ids = new Set(visibleCamps().map(row => row.c.id));
  const d = DM[myDistrict];
  const home = { id: 'mine', lat: d.lat, lng: d.lng, r: 9, color: R(d).c, title: `${t('al_mine')}: ${name(d)}`, onClick: () => openDistrict(d.id) };
  const camps = CAMPS.map(campData).map(c => ({
    id: c.id,
    lat: c.lat,
    lng: c.lng,
    r: 7 + Math.min(4, c.cap / 600),
    shape: 'sq',
    color: occColor(c),
    dim: !ids.has(c.id),
    sel: state.selCamp === c.id,
    pulse: c.occ / c.cap >= .95,
    title: `${c.en} · ${Math.round(c.occ / c.cap * 100)}%`,
    onClick: it => {
      state.selCamp = it.id;
      renderCampMarkers();
      scrollToCard(`.camp[data-c="${it.id}"]`, true);
    }
  }));
  const markers = [home, ...camps];
  MapCtl.setMarkers(markers);
  return markers;
}

function renderCamps(param) {
  if (param && CM[param]) state.selCamp = param;
  const rows = visibleCamps();
  const emptyHtml = `<div class="empty">${ic('tent')}${t('c_none')}</div>`;

  setHead('tent', t('c_title'), `<button class="btn sm ghost" id="campPrint">${ic('printer')}<span class="lbl">${t('c_print')}</span></button><span class="badge" id="campCount">${rows.length} / ${CAMPS.length}</span>`);
  view.innerHTML = `<p class="lead txt">${t('c_lead')}</p>
    <div class="toolbar"><div class="search">${ic('search')}<input id="campQ" type="search" value="${esc(state.campQ)}" placeholder="${esc(t('c_search'))}" aria-label="${esc(t('c_search'))}"></div><span class="badge">${ic('navigation')}${t('c_near')}: ${esc(name(DM[myDistrict]))}</span></div>
    ${provChips(state.campProv)}
    <div class="list stagger" id="clist">${rows.map(({ c, km }) => campRow(c, km)).join('') || emptyHtml}</div>`;

  animateBars(view);
  bindCampRows(view);
  $('#campPrint').onclick = () => printReport('camps');
  $('#campQ').oninput = e => {
    state.campQ = e.target.value;
    const list = $('#clist');
    const filtered = visibleCamps();
    list.innerHTML = filtered.map(({ c, km }) => campRow(c, km)).join('') || emptyHtml;
    animateBars(list);
    bindCampRows(list);
    $('#campCount').textContent = `${filtered.length} / ${CAMPS.length}`;
    renderCampMarkers();
  };
  $$('[data-prov] .chip', view).forEach(b => {
    b.onclick = () => { state.campProv = b.dataset.p; saveUI(); renderCamps(); };
  });

  MapCtl.legend([[LEVELS.normal.c, '< 70%', 'sq'], [LEVELS.warning.c, '70–95%', 'sq'], [LEVELS.severe.c, t('c_full'), 'sq'], [R(DM[myDistrict]).c, t('al_mine')]]);
  MapCtl.setRoute(null);
  const markers = renderCampMarkers();
  if (state.selCamp && CM[state.selCamp]) {
    const c = CM[state.selCamp];
    MapCtl.focus(c.lat, c.lng, 10);
    setTimeout(() => scrollToCard(`.camp[data-c="${c.id}"]`), 300);
  } else {
    MapCtl.fit(markers.filter(m => !m.dim));
  }
}

// =====================================================================
// 11. supplies & volunteers
// =====================================================================
const getVolunteers = () => store.get('volunteers', null) || VOLUNTEERS_SEED();
const saveVolunteers = list => store.set('volunteers', list);
const getStockLog = () => store.get('stockLog', []);

function supplyCamp() {
  if (state.supplyCamp && CM[state.supplyCamp]) return campData(CM[state.supplyCamp]);
  return nearestCamps(DM[myDistrict], 1)[0].c;
}

function daysCell(st) {
  if (st.days != null) {
    const cls = st.bad ? 'bad' : st.warn ? 'warn' : 'ok';
    return `<span class="days ${cls}">${st.days.toFixed(1)}</span>`;
  }
  const cls = st.bad ? 'bad' : st.warn ? 'warn' : 'ok';
  return `<span class="days ${cls}">${Math.round(st.coverage * 100)}%</span>`;
}

function inventoryTable(c) {
  const stock = stockOf(c.id);
  const rows = ITEMS.map(it => {
    const st = supplyStatus(c, it, stock[it.id]);
    const col = st.bad ? LEVELS.severe.c : st.warn ? LEVELS.warning.c : LEVELS.normal.c;
    const rateTxt = it.kind === 'daily' ? `${it.rate} ${bi(it.unitEn, it.unitUr)} ${t('s_per_day')}` : `${it.rate} ${t('s_per_people')}`;
    return `<div class="nm">${ic(it.icon)}<span title="${rateTxt}">${esc(bi(it.en, it.ur))}</span></div>
      <div class="q"><b>${nf.format(stock[it.id])}</b> <span class="small muted">${esc(bi(it.unitEn, it.unitUr))}</span><div class="bar" style="--c:${col};margin-top:3px"><i data-w="${Math.round(st.ratio * 100)}"></i></div></div>
      ${daysCell(st)}`;
  });
  return `<div class="inv"><div class="h">${t('s_item')}</div><div class="h" style="text-align:right">${t('s_stock')}</div><div class="h" style="text-align:right">${t('s_days')} / ${t('s_coverage')}</div>${rows.join('')}</div>`;
}

function supplyKpis() {
  const camps = CAMPS.map(campData);
  const count = (itemId, pred) => camps.filter(c => pred(supplyStatus(c, IM[itemId], stockOf(c.id)[itemId]))).length;
  const water = count('water', st => st.days < 2);
  const food = count('food', st => st.days < 2);
  const tents = count('tents', st => st.coverage < .6);
  const vols = getVolunteers().filter(v => v.camp).length;
  const tile = (key, value, color, icon) => `<div class="kpi static" style="--c:${color}"><div class="k">${t(key)}</div><div class="v num" data-n="${value}">0</div><div class="s">${ic(icon)}</div></div>`;
  return `<div class="kpis stagger">${tile('s_k_water', water, LEVELS.severe.c, 'droplet')}${tile('s_k_food', food, LEVELS.warning.c, 'box')}${tile('s_k_tents', tents, LEVELS.watch.c, 'tent')}${tile('s_k_vols', vols, LEVELS.normal.c, 'users')}</div>`;
}

function shortageList() {
  const rows = shortages().slice(0, 10);
  if (!rows.length) return `<div class="ok txt">${t('s_short_none')}</div>`;
  return `<div class="list" style="gap:6px">${rows.map(({ c, it, qty, st }) => `<button class="row" data-sc="${c.id}" style="cursor:pointer;text-align:left"><span style="min-width:0"><b>${esc(c.en)}</b><br><span class="small muted">${ic(it.icon)} ${esc(bi(it.en, it.ur))} · ${nf.format(qty)} ${esc(bi(it.unitEn, it.unitUr))}</span></span>${daysCell(st)}</button>`).join('')}</div>`;
}

function stockLogList(campId) {
  const rows = getStockLog().filter(l => l.camp === campId).slice(0, 8);
  if (!rows.length) return `<div class="small muted">${t('s_log_none')}</div>`;
  return rows.map(l => `<div class="act">${ic(l.qty > 0 ? 'download' : 'truck')}<span><b>${l.qty > 0 ? '+' : ''}${nf.format(l.qty)}</b> ${esc(bi(IM[l.item].en, IM[l.item].ur))}${l.note ? ` · <span class="muted">${esc(l.note)}</span>` : ''}</span><span class="when">${timeAgo(l.ts)}</span></div>`).join('');
}

function volunteerRows() {
  const vols = getVolunteers();
  const options = c => `<option value="">${t('s_unassigned')}</option>` + CAMPS.map(x => `<option value="${x.id}" ${x.id === c ? 'selected' : ''}>${esc(x.en)}</option>`).join('');
  return vols.map(v => `<div class="row vol" data-v="${v.id}">
    <div class="av">${esc(v.nm.split(' ').map(w => w[0]).join('').slice(0, 2))}</div>
    <div style="flex:1;min-width:0"><b>${esc(v.nm)}</b> <span class="chip skill">${t('sk_' + v.skill)}</span><div class="small muted">${ic('phone')} ${esc(v.phone)}</div></div>
    <select data-assign="${v.id}" aria-label="${t('s_vol_camp')}">${options(v.camp)}</select>
  </div>`).join('');
}

function renderSupplies(param) {
  if (param && CM[param]) state.supplyCamp = param;
  const c = supplyCamp();
  const options = CAMPS.map(campData).sort((a, b) => a.en.localeCompare(b.en)).map(x => `<option value="${x.id}" ${x.id === c.id ? 'selected' : ''}>${esc(x.en)} (${Math.round(x.occ / x.cap * 100)}%)</option>`).join('');

  setHead('box', t('s_title'), `<button class="btn sm ghost" id="shortPrint">${ic('printer')}<span class="lbl">${t('s_print')}</span></button>`);
  view.innerHTML = `<p class="lead txt">${t('s_lead')}</p>
    ${supplyKpis()}
    <div class="card flat">
      <label class="f" for="supCamp">${t('s_camp')}</label><select id="supCamp">${options}</select>
      <div class="small muted" style="margin:6px 0 10px">${nf.format(c.occ)} ${t('c_people')} · ${esc(name(DM[c.d]))} · <a href="#camps/${c.id}">${t('nav_camps')} ${ic('arrow-right')}</a></div>
      ${inventoryTable(c)}
      <div class="actions"><button class="btn sm green" id="recvBtn">${ic('download')}${t('s_receive')}</button><button class="btn sm ghost" id="dispBtn">${ic('truck')}${t('s_dispatch')}</button><button class="btn sm ghost" id="regPrint">${ic('printer')}${t('r_register')}</button></div>
      <h3 style="margin-top:14px;font-size:.9rem">${ic('history')}${t('s_log')}</h3>
      <div id="stockLog">${stockLogList(c.id)}</div>
    </div>
    <div class="card flat"><h3>${ic('alert')}${t('s_short')}</h3><div style="margin-top:8px">${shortageList()}</div></div>
    <div class="card flat"><h3>${ic('users')}${t('s_vols')} <span class="badge">${getVolunteers().length}</span></h3><div class="list stagger" style="margin-top:8px;gap:6px">${volunteerRows()}</div><div class="actions"><button class="btn sm" id="addVol">${ic('plus')}${t('s_add_vol')}</button></div></div>`;

  $$('.kpi .v', view).forEach(el => countUp(el, +el.dataset.n, { dur: 600 }));
  animateBars(view);
  bindSupplies(c);
  drawSupplyMap(c);
}

function bindSupplies(c) {
  $('#supCamp').onchange = e => { state.supplyCamp = e.target.value; saveUI(); renderSupplies(); };
  $('#recvBtn').onclick = () => openStockMove(c.id, 1);
  $('#dispBtn').onclick = () => openStockMove(c.id, -1);
  $('#shortPrint').onclick = () => printReport('supplies');
  $('#regPrint').onclick = () => printReport('register', c.id);
  $$('[data-sc]', view).forEach(b => {
    b.onclick = () => { state.supplyCamp = b.dataset.sc; saveUI(); renderSupplies(); view.scrollTo({ top: 0, behavior: 'smooth' }); };
  });
  $$('[data-assign]', view).forEach(sel => {
    sel.onchange = () => {
      const vols = getVolunteers();
      const v = vols.find(x => x.id === sel.dataset.assign);
      v.camp = sel.value || null;
      saveVolunteers(vols);
      toast(t('s_vol_assigned'), 'ok', 'check');
      updateSupplyKpis();
    };
  });
  $('#addVol').onclick = openVolunteerForm;
}

function updateSupplyKpis() {
  const kpis = $('.kpis', view);
  if (!kpis) return;
  kpis.outerHTML = supplyKpis();
  $$('.kpi .v', view).forEach(el => { el.textContent = el.dataset.n; });
  staggerChildren(view);
}

function openStockMove(campId, sign) {
  const options = ITEMS.map(it => `<option value="${it.id}">${esc(bi(it.en, it.ur))} (${esc(bi(it.unitEn, it.unitUr))})</option>`).join('');
  modal(t(sign > 0 ? 's_receive' : 's_dispatch'), `<div class="small muted" style="margin-bottom:6px">${esc(CM[campId].en)}</div>
    <label class="f" for="mItem">${t('s_item')}</label><select id="mItem">${options}</select>
    <label class="f" for="mQty">${t('s_qty')}</label><input id="mQty" type="number" min="1" value="100">
    <label class="f" for="mNote">${t('s_note')}</label><input id="mNote" type="text" maxlength="80" placeholder="${sign > 0 ? 'PDMA truck / NGO' : 'Govt High School Johi'}">
    <div class="actions"><button class="btn" id="mSave">${ic('check')}${t('save')}</button><button class="btn ghost" id="mCancel">${t('cancel')}</button></div>`,
  box => {
    $('#mCancel', box).onclick = closeModal;
    $('#mSave', box).onclick = () => {
      const qty = (+$('#mQty', box).value || 0) * sign;
      if (!qty) return;
      applyStockMove(campId, $('#mItem', box).value, qty, $('#mNote', box).value.trim());
    };
  });
}

function applyStockMove(campId, itemId, qty, note) {
  const inventory = store.get('inventory', {});
  const current = stockOf(campId);
  inventory[campId] = Object.assign({}, inventory[campId], { [itemId]: Math.max(0, current[itemId] + qty) });
  store.set('inventory', inventory);
  const log = getStockLog();
  log.unshift({ id: uid(), ts: Date.now(), camp: campId, item: itemId, qty, note });
  store.set('stockLog', log.slice(0, 300));
  logActivity('act_stock', `${CM[campId].en} (${qty > 0 ? '+' : ''}${qty} ${bi(IM[itemId].en, IM[itemId].ur)})`, 'box');
  closeModal();
  toast(t('s_saved'), 'ok', 'check-circle');
  renderSupplies();
}

function openVolunteerForm() {
  const skills = SKILLS.map(s => `<option value="${s}">${t('sk_' + s)}</option>`).join('');
  const camps = `<option value="">${t('s_unassigned')}</option>` + CAMPS.map(x => `<option value="${x.id}">${esc(x.en)}</option>`).join('');
  modal(t('s_add_vol'), `<label class="f" for="vName">${t('s_vol_name')}</label><input id="vName" type="text" maxlength="60">
    <div class="cols2"><div><label class="f" for="vSkill">${t('s_vol_skill')}</label><select id="vSkill">${skills}</select></div><div><label class="f" for="vPhone">${t('s_vol_phone')}</label><input id="vPhone" type="tel" placeholder="03xx-xxxxxxx"></div></div>
    <label class="f" for="vCamp">${t('s_vol_camp')}</label><select id="vCamp">${camps}</select>
    <div class="actions"><button class="btn" id="vSave">${ic('check')}${t('save')}</button><button class="btn ghost" id="vCancel">${t('cancel')}</button></div>`,
  box => {
    $('#vCancel', box).onclick = closeModal;
    $('#vSave', box).onclick = () => {
      const nm = $('#vName', box).value.trim();
      if (!nm) { toast(t('m_valid'), 'bad', 'alert'); return; }
      const vols = getVolunteers();
      vols.unshift({ id: uid(), nm, skill: $('#vSkill', box).value, phone: $('#vPhone', box).value.trim(), camp: $('#vCamp', box).value || null });
      saveVolunteers(vols);
      logActivity('act_vol', nm, 'users');
      closeModal();
      toast(t('s_vol_saved'), 'ok', 'check-circle');
      renderSupplies();
    };
  });
}

function drawSupplyMap(selected) {
  MapCtl.legend([[LEVELS.normal.c, '≥ 2 ' + t('s_days'), 'sq'], [LEVELS.warning.c, '1–2 ' + t('s_days'), 'sq'], [LEVELS.severe.c, '< 1 ' + t('s_days'), 'sq']]);
  MapCtl.setRoute(null);
  const markers = CAMPS.map(campData).map(c => {
    const water = supplyStatus(c, IM.water, stockOf(c.id).water);
    const color = water.bad ? LEVELS.severe.c : water.warn ? LEVELS.warning.c : LEVELS.normal.c;
    return {
      id: c.id, lat: c.lat, lng: c.lng, r: 8, shape: 'sq', color,
      sel: c.id === selected.id, pulse: water.bad,

const norm = s => String(s || '').toLowerCase().replace(/[^a-z؀-ۿ0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();

/** Dice coefficient over character bigrams of each word — tolerant to spelling variants (Ghulam / Gulam). */
function dice(a, b) {
  const bigrams = text => {
    const bag = new Map();
    text.split(' ').forEach(word => {
      for (let i = 0; i < word.length - 1; i++) {
        const key = word.slice(i, i + 2);
        bag.set(key, (bag.get(key) || 0) + 1);
      }
    });
    return bag;
  };
  const A = bigrams(norm(a));
  const B = bigrams(norm(b));
  let hit = 0;
  let nA = 0;
  let nB = 0;
  A.forEach((v, k) => {
    nA += v;
    if (B.has(k)) hit += Math.min(v, B.get(k));
  });
  B.forEach(v => { nB += v; });
  return nA + nB ? 2 * hit / (nA + nB) : 0;
}

/** Match suggestions: opposite status, name bigram similarity (50%), age proximity (30%), location (20%). */
function matches(p, all) {
  const want = p.status === 'missing' ? 'found' : p.status === 'found' ? 'missing' : null;
  if (!want) return [];
  return all
    .filter(o => o.status === want && o.id !== p.id)
    .map(o => {
      const nameScore = dice(p.name, o.name);
      const ageScore = clamp(1 - Math.abs(p.age - o.age) / 8, 0, 1);
      const locScore = o.d === p.d ? 1 : DM[o.d].prov === DM[p.d].prov ? .4 : 0;
      let s = .5 * nameScore + .3 * ageScore + .2 * locScore;
      if (p.gender !== 'o' && o.gender !== 'o' && p.gender !== o.gender) s *= .5;
      return { o, s };
    })
    .filter(m => m.s >= .45)
    .sort((a, b) => b.s - a.s)
    .slice(0, 3);
}

function resizePhoto(file, done) {
  const img = new Image();
  img.onload = () => {
    const k = 240 / Math.max(img.width, img.height);
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(img.width * k);
    canvas.height = Math.round(img.height * k);
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(img.src);
    done(canvas.toDataURL('image/jpeg', .8));
  };
  img.src = URL.createObjectURL(file);
}

  const H = 170;
  const P = { l: 44, r: 10, t: 12, b: 24 };
  const values = [['today', level(s.id)], ...PEAK_YEARS.map(y => [String(y), s.peaks[y]])];
  const ymax = Math.max(...values.map(v => v[1]), s.th[4]) * 1.1;
  const y = v => P.t + (1 - v / ymax) * (H - P.t - P.b);
  const slot = (W - P.l - P.r) / values.length;
  let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="${esc(t('h_peaks'))}">`;

  s.th.forEach((th, i) => {
    svg += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(th)}" y2="${y(th)}" stroke="${GCATS[i + 1][1]}" stroke-dasharray="4 4" opacity=".6"/>`;
  });
  [0, .5, 1].forEach(f => {
    svg += `<text x="${P.l - 6}" y="${y(ymax * f) + 4}" font-size="11" text-anchor="end" fill="#5b6b80">${flowShort(ymax * f)}</text>`;
  });
  values.forEach(([key, v], i) => {
    const x = P.l + slot * i + slot * .2;
    const w = slot * .6;
    const color = PEAK_COLORS[key];
    const label = key === 'today' ? t('h_today') : key;
    svg += `<rect class="pk" x="${x}" y="${H - P.b}" width="${w}" height="0" rx="4" fill="${color}" data-y="${y(v)}" data-h="${H - P.b - y(v)}"/>`;
    svg += `<text x="${x + w / 2}" y="${y(v) - 5}" font-size="11" font-weight="800" text-anchor="middle" fill="${color}">${flowShort(v)}</text>`;
    svg += `<text x="${x + w / 2}" y="${H - 8}" font-size="11" text-anchor="middle" fill="#5b6b80">${label}</text>`;
  });
  svg += '</svg>';
  el.innerHTML = svg;

  requestAnimationFrame(() => {
    $$('.pk', el).forEach(rect => {
      rect.style.transition = 'y .6s var(--ease), height .6s var(--ease)';
      rect.setAttribute('y', rect.dataset.y);
      rect.setAttribute('height', rect.dataset.h);
    });
  });
}

function rainChart(el, days) {
  const W = 440;
  const H = 150;
  const P = { l: 34, r: 10, t: 12, b: 24 };
  const max = Math.max(10, ...days) * 1.15;
  const slot = (W - P.l - P.r) / days.length;
  const y = v => P.t + (1 - v / max) * (H - P.t - P.b);
  let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="${esc(t('h_rain_mine'))}">`;
  [0, .5, 1].forEach(f => {
    svg += `<text x="${P.l - 6}" y="${y(max * f) + 4}" font-size="11" text-anchor="end" fill="#5b6b80">${Math.round(max * f)}</text>`;
  });
  days.forEach((v, i) => {
    const x = P.l + slot * i + slot * .22;
    svg += `<rect class="pk" x="${x}" y="${H - P.b}" width="${slot * .56}" height="0" rx="3" fill="#2f80ed" data-y="${y(v)}" data-h="${H - P.b - y(v)}"/>`;
    svg += `<text x="${x + slot * .28}" y="${y(v) - 4}" font-size="10" text-anchor="middle" fill="#1e3a5f" font-weight="700">${v}</text>`;
    svg += `<text x="${x + slot * .28}" y="${H - 8}" font-size="10" text-anchor="middle" fill="#5b6b80">${dLabel(dateOf(i, 7))}</text>`;
  });
  svg += '</svg>';
  el.innerHTML = svg;
  requestAnimationFrame(() => {
    $$('.pk', el).forEach(rect => {
      rect.style.transition = 'y .6s var(--ease), height .6s var(--ease)';
      rect.setAttribute('y', rect.dataset.y);
      rect.setAttribute('height', rect.dataset.h);
    });
  });
}

const DATA_KEYS = ['plan', 'gobag', 'campUpdates', 'registrations', 'inventory', 'stockLog', 'volunteers', 'missing', 'helplines', 'inboxRead', 'activity', 'settings', 'ui'];

function exportData() {
  const payload = { app: 'sailab', version: 2, exported: new Date().toISOString(), district: myDistrict, lang };
  DATA_KEYS.forEach(k => { payload[k] = store.get(k, null); });
  if (!payload.missing) payload.missing = getPosts();
  if (!payload.volunteers) payload.volunteers = getVolunteers();
  download(`sailab-backup-${today.toISOString().slice(0, 10)}.json`, JSON.stringify(payload, null, 2));
  logActivity('act_export', '', 'download');
}

function importData(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (data.app !== 'sailab') throw new Error('not a sailab file');
      DATA_KEYS.forEach(k => { if (data[k] != null) store.set(k, data[k]); });
      if (DM[data.district]) {
        myDistrict = data.district;
        store.set('district', myDistrict);
        $('#myDistrict').value = myDistrict;
      }
      settings = Object.assign(SETTINGS_DEFAULT(), store.get('settings', {}));
      applySettings();
      logActivity('act_import', file.name, 'upload');
      toast(t('st_imported'), 'ok', 'check-circle');
      updateInboxBadge();
      route(false);
    } catch {
      toast(t('st_bad_file'), 'bad', 'alert');
    }
  };
  reader.readAsText(file);
}

function resetDemo() {
  DATA_KEYS.forEach(k => store.del(k));
  store.del('sheet');
  myDistrict = 'dadu';
  store.set('district', 'dadu');
  $('#myDistrict').value = 'dadu';
  settings = SETTINGS_DEFAULT();
  applySettings();
  Object.assign(state, UI_DEFAULT);
  logActivity('act_reset', '', 'refresh');
  toast(t('st_reset_ok'), 'ok', 'refresh');
  updateInboxBadge();
  route(false);
}

const lvlTag = lv => `<span class="lvl" style="background:${LEVELS[lv].c}">${TXT.en['lv_' + lv]}</span>`;

function sitrepReport() {
  const districts = [...DISTRICTS].sort((a, b) => R(b).score - R(a).score);
  const counts = Object.keys(LEVELS).map(k => `${TXT.en['lv_' + k]}: ${DISTRICTS.filter(d => R(d).lv === k).length}`).join(' · ');
  const districtRows = districts.map(d => {
    const r = R(d);
    const g = d.gauge ? `${SM[d.gauge].en} (${TXT.en['gc_' + gcatMeta(gcat(d.gauge)).key]})` : 'rain-driven';
    return `<tr><td>${esc(d.en)}</td><td>${d.prov}</td><td>${esc(g)}</td><td>${r.rain} mm</td><td>${r.score}</td><td>${lvlTag(r.lv)}</td></tr>`;
  });
  const gaugeRows = STATIONS.map(s => `<tr><td>${esc(s.en)}</td><td>${s.river}</td><td>${nf.format(level(s.id))}</td><td>${nf.format(series(s.id).outflow[DAYS - 1])}</td><td>${TXT.en['gc_' + gcatMeta(gcat(s.id)).key]}</td><td>${TXT.en[trend(s.id).key]}</td></tr>`);
  const campRows = CAMPS.map(campData).filter(c => c.occ / c.cap >= .85).sort((a, b) => b.occ / b.cap - a.occ / a.cap).map(c => `<tr><td>${esc(c.en)}</td><td>${esc(DM[c.d].en)}</td><td>${nf.format(c.occ)} / ${nf.format(c.cap)}</td><td>${Math.round(c.occ / c.cap * 100)}%</td><td>${esc(c.needs.join(', ')) || '—'}</td></tr>`);

  return `${reportHeader(t('r_sitrep'))}<p>${counts}</p>
    <h2>${t('r_districts')}</h2><table><tr><th>District</th><th>Province</th><th>Upstream gauge</th><th>7-day rain</th><th>Risk</th><th>Level</th></tr>${districtRows.join('')}</table>
    <h2>${t('r_gauges')}</h2><table><tr><th>Station</th><th>River</th><th>Inflow (cusecs)</th><th>Outflow</th><th>Category</th><th>Trend</th></tr>${gaugeRows.join('')}</table>
    <h2>${t('r_camps')}</h2><table><tr><th>Camp</th><th>District</th><th>Occupancy</th><th>%</th><th>Needs</th></tr>${campRows.join('') || '<tr><td colspan="5">—</td></tr>'}</table>`;
}

function planReport() {
  const p = getPlan();
  const d = DM[myDistrict];
  const r = R(d);
  const est = routeEstimate(p, p.loc || d);
  const helplines = store.get('helplines', HELPLINES_SEED);
  const rule = leaveRule(p, r.lv);
  const contacts = p.contacts.filter(c => c.name || c.phone).map(c => `<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td></tr>`).join('');
  const bag = store.get('gobag', {});
  const bagRows = GOBAG.filter(g => !g[4] || g[4](p)).map(g => `<tr><td>${bag[g[0]] ? '☑' : '☐'}</td><td>${esc(g[2])}</td><td class="ur">${esc(g[3])}</td></tr>`).join('');

  return `<h1>${TXT.en.p_card} · <span class="ur">${TXT.ur.p_card}</span></h1><div class="meta">${esc(d.en)} · ${TXT.en['lv_' + r.lv]} ${r.score} · ${today.toLocaleDateString('en-PK', { day: 'numeric', month: 'long', year: 'numeric' })}</div>
    <h2>${TXT.en.p_family} / <span class="ur">${TXT.ur.p_family}</span></h2><p>${TXT.en.p_adults} ${p.adults} · ${TXT.en.p_children} ${p.children} · ${TXT.en.p_infants} ${p.infants} · ${TXT.en.p_elderly} ${p.elderly} · ${TXT.en.p_pregnant} ${p.pregnant} · ${TXT.en.p_disabled} ${p.disabled} · ${TXT.en.p_livestock} ${p.livestock}</p>
    <h2>${TXT.en.p_meet} / <span class="ur">${TXT.ur.p_meet}</span></h2><p>${esc(p.meet) || '—'}</p>
    <h2>${TXT.en.p_contacts} / <span class="ur">${TXT.ur.p_contacts}</span></h2><table>${contacts || '<tr><td>—</td></tr>'}${helplines.map(h => `<tr><td>${esc(h.en)} <span class="ur">${esc(h.ur || '')}</span></td><td>${esc(h.num)}</td></tr>`).join('')}</table>
    <h2>${TXT.en.p_route} / <span class="ur">${TXT.ur.p_route}</span></h2><p>${esc(est.chosen.c.en)} · ${est.km.toFixed(0)} km · ${TXT.en[est.mode[2]]} · ${fmtHours(est.hours)}</p>
    <h2>${TXT.en.p_nearest} / <span class="ur">${TXT.ur.p_nearest}</span></h2><table>${est.near.slice(0, 3).map(({ c, km }) => `<tr><td>${esc(c.en)}</td><td>${km.toFixed(0)} km</td><td>${esc(c.phone)}</td></tr>`).join('')}</table>
    <h2>${TXT.en.p_gobag} / <span class="ur">${TXT.ur.p_gobag}</span></h2><table>${bagRows}</table>
    <h2>${TXT.en.p_leave} / <span class="ur">${TXT.ur.p_leave}</span></h2><p>${TXT.en[rule.key]}</p><p class="ur">${TXT.ur[rule.key]}</p>`;
}

function campsReport() {
  const rows = CAMPS.map(c => ({ c: campData(c), km: haversine(DM[myDistrict], c) })).sort((a, b) => a.km - b.km);
  return `${reportHeader(TXT.en.c_title)}<table><tr><th>Camp</th><th>Type</th><th>District</th><th>Distance</th><th>Occupancy</th><th>Facilities</th><th>Needs</th><th>Contact</th></tr>${rows.map(({ c, km }) => `<tr><td>${esc(c.en)}</td><td>${TXT.en['c_type_' + c.type]}</td><td>${esc(DM[c.d].en)}</td><td>${km.toFixed(0)} km</td><td>${nf.format(c.occ)} / ${nf.format(c.cap)} (${Math.round(c.occ / c.cap * 100)}%)</td><td>${c.fac.toUpperCase().split('').join(' ')}</td><td>${esc(c.needs.join(', ')) || '—'}</td><td>${esc(c.phone)}</td></tr>`).join('')}</table>`;
}

function suppliesReport() {
  const rows = shortages();
  return `${reportHeader(TXT.en.r_shortages)}<table><tr><th>Camp</th><th>District</th><th>Item</th><th>Stock</th><th>Days / coverage</th></tr>${rows.map(({ c, it, qty, st }) => `<tr><td>${esc(c.en)}</td><td>${esc(DM[c.d].en)}</td><td>${it.en}</td><td>${nf.format(qty)} ${it.unitEn}</td><td>${st.days != null ? st.days.toFixed(1) + ' days' : Math.round(st.coverage * 100) + '%'}</td></tr>`).join('') || '<tr><td colspan="5">No shortages</td></tr>'}</table>`;
}

function registerReport(campId) {
  const c = campData(CM[campId]);
  const regs = getRegistrations().filter(r => r.camp === campId);
  const vols = getVolunteers().filter(v => v.camp === campId);
  return `${reportHeader(`${TXT.en.r_register} — ${c.en}`)}<p>${nf.format(c.occ)} / ${nf.format(c.cap)} people · ${regs.length} families registered on this device · ${vols.length} volunteers</p>
    <h2>${TXT.en.c_register_list}</h2><table><tr><th>#</th><th>Head of family</th><th>Members</th><th>Origin</th><th>Phone</th><th>Needs</th><th>Registered</th></tr>${regs.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.head)}</td><td>${r.members}</td><td>${esc(DM[r.origin]?.en || '')}</td><td>${esc(r.phone)}</td><td>${esc(r.needs) || '—'}</td><td>${new Date(r.ts).toLocaleString('en-PK')}</td></tr>`).join('') || `<tr><td colspan="7">${TXT.en.c_reg_none}</td></tr>`}</table>
    <h2>${TXT.en.s_vols}</h2><table>${vols.map(v => `<tr><td>${esc(v.nm)}</td><td>${TXT.en['sk_' + v.skill]}</td><td>${esc(v.phone)}</td></tr>`).join('') || '<tr><td>—</td></tr>'}</table>`;
}

function printReport(kind, arg) {
  const builders = { sitrep: sitrepReport, plan: planReport, camps: campsReport, supplies: suppliesReport, register: () => registerReport(arg) };
  const body = builders[kind]();
  $('#printArea').innerHTML = `<div class="pc">${body}<p class="meta" style="margin-top:14px">Sailab — ${t('r_disclaimer')}</p></div>`;
  logActivity('act_print', kind, 'printer');
  window.print();
}

// =====================================================================
// 19. global search, onboarding tour, "more" menu
// =====================================================================
const NAV = [
  ['alerts', 'nav_alerts', 'siren'], ['gauges', 'nav_gauges', 'gauge'], ['plan', 'nav_plan', 'bag'], ['camps', 'nav_camps', 'tent'],
  ['supplies', 'nav_supplies', 'box'], ['missing', 'nav_missing', 'users'], ['history', 'nav_history', 'history'], ['guide', 'nav_guide', 'book'], ['about', 'nav_about', 'info']
];
const MOBILE_PRIMARY = ['alerts', 'gauges', 'plan', 'camps'];

/** Builds the flat search index on demand so it always reflects the current language and local posts. */
function searchIndex() {
  const rows = [];
  DISTRICTS.forEach(d => rows.push({ grp: 'sr_g_district', icon: 'map-pin', label: name(d), sub: `${t(d.prov)} · ${t('lv_' + R(d).lv)} ${R(d).score}`, text: `${d.en} ${d.ur} ${d.prov}`, go: '#alerts/' + d.id }));
  STATIONS.forEach(s => rows.push({ grp: 'sr_g_station', icon: 'gauge', label: name(s), sub: `${bi(s.river, s.riverUr)} · ${flowShort(level(s.id))} ${flowUnit()}`, text: `${s.en} ${s.ur} ${s.river}`, go: '#gauges/' + s.id }));
  CAMPS.forEach(c => rows.push({ grp: 'sr_g_camp', icon: 'tent', label: c.en, sub: name(DM[c.d]), text: `${c.en} ${DM[c.d].en} ${DM[c.d].ur}`, go: '#camps/' + c.id }));
  getPosts().forEach(p => rows.push({ grp: 'sr_g_post', icon: 'users', label: p.name, sub: `${t('m_' + p.status)} · ${p.place}`, text: `${p.name} ${p.place} ${DM[p.d].en}`, go: '#missing' }));
  Object.keys(GUIDE).forEach(tab => GUIDE[tab].forEach(g => rows.push({ grp: 'sr_g_guide', icon: g[0], label: bi(g[1], g[3]), sub: t('gd_' + tab), text: `${g[1]} ${g[2]} ${g[3]}`, go: '#guide/' + tab })));
  [...NAV, ['inbox', 'nav_inbox', 'inbox'], ['settings', 'nav_settings', 'settings']].forEach(([id, key, icon]) => rows.push({ grp: 'sr_g_page', icon, label: t(key), sub: '', text: `${TXT.en[key]} ${TXT.ur[key]}`, go: '#' + id }));
  return rows;
}

function runSearch(q) {
  const needle = norm(q);
  if (!needle) return [];
  return searchIndex()
    .filter(row => norm(row.label + ' ' + row.text).includes(needle))
    .slice(0, 24);
}

function openSearch() {
  modal(t('sr_title'), `<div class="srch">${ic('search')}<input id="srIn" type="search" placeholder="${esc(t('sr_ph'))}" aria-label="${esc(t('sr_title'))}" autocomplete="off"></div>
    <div class="sres" id="srRes"><div class="small muted" style="padding:8px 4px">${t('sr_hint')}</div></div>`,
  box => {
    const input = $('#srIn', box);
    const out = $('#srRes', box);
    const render = () => {
      const rows = runSearch(input.value);
      if (!input.value.trim()) { out.innerHTML = `<div class="small muted" style="padding:8px 4px">${t('sr_hint')}</div>`; return; }
      if (!rows.length) { out.innerHTML = `<div class="empty">${ic('search')}${t('sr_none')}</div>`; return; }
      let html = '';
      let lastGroup = null;
      rows.forEach((row, i) => {
        if (row.grp !== lastGroup) { html += `<div class="grp">${t(row.grp)}</div>`; lastGroup = row.grp; }
        html += `<a href="${row.go}" class="${i === 0 ? 'on' : ''}">${ic(row.icon)}<span>${esc(row.label)}</span><small>${esc(row.sub)}</small></a>`;
      });
      out.innerHTML = html;
      $$('a', out).forEach(a => { a.onclick = () => closeModal(); });
    };
    input.oninput = render;
    input.onkeydown = e => {
      if (e.key !== 'Enter') return;
      const first = $('a', out);
      if (first) { closeModal(); location.hash = first.getAttribute('href').slice(1); }
    };
  });
}

// ---- onboarding tour: spotlight + card, five steps ----
const TOUR_STEPS = [
  { target: () => (window.innerWidth <= 900 ? $('.mydist') : $('#myDistrict')), title: 'tr_1t', body: 'tr_1b' },
  { target: () => $('#map'), title: 'tr_2t', body: 'tr_2b', inset: 80 },
  { target: () => $('#panel'), title: 'tr_3t', body: 'tr_3b' },
  { target: () => (window.innerWidth <= 900 ? $('.bottomnav a[href="#plan"]') : $('.topnav a[href="#plan"]')), title: 'tr_4t', body: 'tr_4b' },
  { target: () => $('#inboxBtn'), title: 'tr_5t', body: 'tr_5b' }
];
let tourStep = -1;

function startTour(force = false) {
  if (!force && store.get('tourDone', false)) return;
  closeModal();
  tourStep = 0;
  renderTourStep();
}

function endTour() {
  tourStep = -1;
  store.set('tourDone', true);
  $('#tourRoot').innerHTML = '';
}

function renderTourStep() {
  const step = TOUR_STEPS[tourStep];
  const target = step.target();
  const root = $('#tourRoot');
  const rect = target ? target.getBoundingClientRect() : { left: window.innerWidth / 2 - 40, top: window.innerHeight / 2 - 40, width: 80, height: 80 };
  const inset = step.inset || 0;
  const spot = { x: rect.left + inset - 6, y: rect.top + inset - 6, w: Math.max(40, rect.width - inset * 2 + 12), h: Math.max(40, rect.height - inset * 2 + 12) };
  const boxW = Math.min(340, window.innerWidth - 32);
  const below = spot.y + spot.h + 190 < window.innerHeight;
  const boxTop = below ? spot.y + spot.h + 12 : Math.max(12, spot.y - 200);
  const boxLeft = clamp(spot.x + spot.w / 2 - boxW / 2, 16, window.innerWidth - boxW - 16);
  const dots = TOUR_STEPS.map((_, i) => `<i class="${i === tourStep ? 'on' : ''}"></i>`).join('');
  const last = tourStep === TOUR_STEPS.length - 1;

  root.innerHTML = `<div class="tour" role="dialog" aria-modal="true" aria-label="${t('tr_step')} ${tourStep + 1}">
    <div class="spot" style="left:${spot.x}px;top:${spot.y}px;width:${spot.w}px;height:${spot.h}px"></div>
    <div class="tourbox" style="left:${boxLeft}px;top:${boxTop}px">
      <div class="small muted">${t('tr_step')} ${tourStep + 1} / ${TOUR_STEPS.length}</div>
      <h3>${t(step.title)}</h3><p class="txt">${t(step.body)}</p>
      <div class="foot"><div class="dots">${dots}</div>
        <button class="btn sm ghost" id="tourSkip">${t('tr_skip')}</button>
        ${tourStep > 0 ? `<button class="btn sm ghost" id="tourBack">${ic('chevron-left')}${t('tr_back')}</button>` : ''}
        <button class="btn sm river" id="tourNext">${last ? t('tr_done') : t('tr_next')}${last ? ic('check') : ic('chevron-right')}</button>
      </div>
    </div>
  </div>`;
  $('#tourSkip').onclick = endTour;
  $('#tourNext').onclick = () => { if (last) endTour(); else { tourStep++; renderTourStep(); } };
  const back = $('#tourBack');
  if (back) back.onclick = () => { tourStep--; renderTourStep(); };
  $('#tourNext').focus();
}

// ---- "more" menu on phones: the pages that do not fit in the bottom bar ----
function openMoreMenu() {
  const extra = [...NAV.filter(([id]) => !MOBILE_PRIMARY.includes(id)), ['inbox', 'nav_inbox', 'inbox'], ['settings', 'nav_settings', 'settings']];
  const unread = unreadCount();
  const tiles = extra.map(([id, key, icon]) => `<a href="#${id}" class="${page === id ? 'active' : ''}">${ic(icon)}${t(key)}${id === 'inbox' && unread ? `<span class="cnt">${unread}</span>` : ''}</a>`);
  tiles.push(`<a href="#" id="moreSearch">${ic('search')}${t('sr_title')}</a>`);
  modal(t('nav_more'), `<div class="moregrid">${tiles.join('')}</div>`, box => {
    $$('a', box).forEach(a => { a.onclick = () => closeModal(); });
    $('#moreSearch', box).onclick = e => { e.preventDefault(); closeModal(); openSearch(); };
  });
}

// =====================================================================
// 20. bottom sheet, navigation, router, boot
// =====================================================================
const panel = $('#panel');
const handle = $('#handle');
let refitTimer = 0;

function setSheet(st) {
  const changed = panel.dataset.state !== st;
  panel.dataset.state = st;
  store.set('sheet', st);
  if (!changed) return;
  clearTimeout(refitTimer);
  refitTimer = setTimeout(() => MapCtl.refit(), 340);
}

function bindSheetDrag() {
  let drag = null;
  handle.addEventListener('pointerdown', e => {
    drag = { y: e.clientY, h: panel.getBoundingClientRect().height, moved: false };
    panel.classList.add('dragging');
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove', e => {
    if (!drag) return;
    const dy = drag.y - e.clientY;
    if (Math.abs(dy) > 4) drag.moved = true;
    panel.style.height = clamp(drag.h + dy, 90, window.innerHeight - 66) + 'px';
  });
  const end = () => {
    if (!drag) return;
    const h = panel.getBoundingClientRect().height;
    const H = window.innerHeight - 114;
    panel.classList.remove('dragging');
    panel.style.height = '';
    if (!drag.moved) setSheet(panel.dataset.state === 'full' ? 'half' : 'full');
    else setSheet(h < H * .3 ? 'peek' : h < H * .78 ? 'half' : 'full');
    drag = null;
  };
  handle.addEventListener('pointerup', end);
  handle.addEventListener('pointercancel', end);
}

window.addEventListener('resize', () => {
  clearTimeout(refitTimer);
  refitTimer = setTimeout(() => MapCtl.refit(), 250);
});

const VIEWS = {
  alerts: renderAlerts, gauges: renderGauges, plan: renderPlan, camps: renderCamps, supplies: renderSupplies, missing: renderMissing,
  history: renderHistory, guide: renderGuide, inbox: renderInbox, settings: renderSettings, about: renderAbout
};

function renderNav() {
  $('#topnav').innerHTML = NAV.map(([id, key, icon]) => `<a href="#${id}" class="${page === id ? 'active' : ''}" title="${t(key)}">${ic(icon)}<span class="lbl">${t(key)}</span></a>`).join('');
  const primary = NAV.filter(([id]) => MOBILE_PRIMARY.includes(id)).map(([id, key, icon]) => `<a href="#${id}" class="${page === id ? 'active' : ''}">${ic(icon)}${t(key)}</a>`);
  const moreActive = !MOBILE_PRIMARY.includes(page);
  const unread = unreadCount();
  primary.push(`<a href="#" id="moreBtn" class="${moreActive ? 'active' : ''}">${ic('grid')}${t('nav_more')}<span class="cnt ${unread ? '' : 'hidden'}">${unread}</span></a>`);
  $('#bottomnav').innerHTML = primary.join('');
  $('#moreBtn').onclick = e => { e.preventDefault(); openMoreMenu(); };
  $('#inboxBtn').classList.toggle('on', page === 'inbox');
}

function route(animate = true) {
  const hashPath = location.hash.slice(1).split('?')[0];
  const [p, param] = hashPath.split('/');
  page = VIEWS[p] ? p : 'alerts';
  document.body.dataset.page = page;
  renderNav();
  closeModal();
  VIEWS[page](param);
  if (animate) {
    animateIn(view);
    view.scrollTop = 0;
    if (window.innerWidth <= 900 && panel.dataset.state === 'peek') setSheet('half');
  } else {
    staggerChildren(view);
  }
}

function fillDistrictSelect() {
  const sel = $('#myDistrict');
  sel.innerHTML = PROVS.map(p => `<optgroup label="${t(p)}">${DISTRICTS.filter(d => d.prov === p).map(d => `<option value="${d.id}">${esc(name(d))}</option>`).join('')}</optgroup>`).join('');
  sel.value = myDistrict;
}

function applyLang() {
  document.documentElement.lang = lang;
  store.set('lang', lang);
  $$('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $('#langBtn').textContent = lang === 'en' ? 'اردو' : 'English';
  $('#searchBtn').setAttribute('aria-label', t('sr_title'));
  $('#inboxBtn').setAttribute('aria-label', t('nav_inbox'));
  $('#settingsBtn').setAttribute('aria-label', t('nav_settings'));
  fillDistrictSelect();
  if (MapCtl.mode) MapCtl.updateStatus();
  route(false);
}

function bindGlobalKeys() {
  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
    if (e.key === 'Escape') {
      closeModal();
      if (tourStep >= 0) endTour();
      return;
    }
    if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === '/') { e.preventDefault(); openSearch(); return; }
    if (e.key === '?') { location.hash = 'settings'; return; }
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= NAV.length) location.hash = NAV[n - 1][0];
  });
}

function bindTopbar() {
  $('#langBtn').onclick = () => { lang = lang === 'en' ? 'ur' : 'en'; applyLang(); };
  $('#myDistrict').onchange = e => setMyDistrict(e.target.value);
  $('#searchBtn').onclick = openSearch;
  $('#inboxBtn').onclick = () => { location.hash = 'inbox'; };
  $('#settingsBtn').onclick = () => { location.hash = 'settings'; };
  window.addEventListener('hashchange', () => route(true));
}

// Map calls made before the map library is ready are queued and replayed after init.
function wrapMapCalls() {
  const focus = MapCtl.focus.bind(MapCtl);
  const fit = MapCtl.fit.bind(MapCtl);
  MapCtl.focus = (...args) => {
    if (!MapCtl.mode) { MapCtl.pending.focus = args; MapCtl.pending.fit = null; return; }
    focus(...args);
  };
  MapCtl.fit = (...args) => {
    if (!MapCtl.mode) { MapCtl.pending.fit = args; MapCtl.pending.focus = null; return; }
    fit(...args);
  };
}

function boot() {
  applySettings();
  wrapMapCalls();
  bindTopbar();
  bindGlobalKeys();
  bindSheetDrag();
  setSheet(store.get('sheet', settings.sheet));
  applyLang();
  updateInboxBadge();
  MapCtl.init().then(() => {
    MapCtl.setMarkers(MapCtl.items);
    MapCtl.setRoute(MapCtl.route);
    MapCtl.updateStatus();
    const pending = MapCtl.pending;
    if (pending.focus) MapCtl.focus(...pending.focus);
    else if (pending.fit) MapCtl.fit(...pending.fit);
  });
  setTimeout(pushAlerts, 900);
  setTimeout(() => startTour(false), 1400);
}

boot();
