<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kameti Committee Manager</title>
<meta name="description" content="Run rotating savings committees (kameti / beesi / ROSCA): multi-committee dashboard with cash-flow calendar, payments matrix, lottery and need-based payout order, default simulator, disputes, receipts, trust scores, savings planner and bilingual printable agreements. Single-file FYP template.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens: forest ledger, mint surfaces, gold payouts ---------- */
:root{
  --forest:#14532d; --forest-deep:#0b3b1f; --forest-soft:#1f6b3a;
  --mint:#d1fae5; --mint-2:#a7f3d0; --mint-soft:#ecfdf5;
  --gold:#ca8a04; --gold-soft:#fef3c7; --gold-deep:#854d0e;
  --bg:#f8faf7; --surface:#ffffff; --surface-2:#eef4f0; --ink:#0f1f16; --muted:#5b6b62; --line:#d9e4dc;
  --ok:#15803d; --ok-soft:#dcfce7; --late:#b45309; --late-soft:#fef3c7; --bad:#b91c1c; --bad-soft:#fee2e2;
  --part:#0369a1; --part-soft:#e0f2fe; --waive:#6b7280; --waive-soft:#f1f3f4;
  --in:#14532d; --out:#ca8a04;
  --radius:14px; --radius-sm:9px; --shadow:0 10px 30px -18px rgba(15,31,22,.35);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --font-ur:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;
  --ease:cubic-bezier(.2,.8,.2,1); --dur:.35s;
  color-scheme:light;
}
/* Dark theme: same forest identity, deeper surfaces, lifted text colours */
html[data-theme=dark]{
  --bg:#0c1710; --surface:#132019; --surface-2:#1a2d21; --ink:#e7f3ea; --muted:#9fb6a7; --line:#27402f;
  --mint:#1f4a33; --mint-2:#2f6b48; --mint-soft:#15271c;
  --gold-soft:#3b2d0b; --gold-deep:#f1c75a;
  --ok:#4ade80; --ok-soft:rgba(74,222,128,.14); --late:#fbbf24; --late-soft:rgba(251,191,36,.14);
  --bad:#f87171; --bad-soft:rgba(248,113,113,.14); --part:#60a5fa; --part-soft:rgba(96,165,250,.14);
  --waive:#9ca3af; --waive-soft:rgba(156,163,175,.14);
  --in:#4ade80; --shadow:0 10px 30px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}
html[data-theme=dark] .avatar,html[data-theme=dark] .kpi .icw,html[data-theme=dark] .oitem .pos,html[data-theme=dark] .brand .logo{color:var(--mint-2)}
html[data-theme=dark] .avatar,html[data-theme=dark] .kpi .icw,html[data-theme=dark] .oitem .pos{color:#d1fae5}
html[data-theme=dark] .btn.mint,html[data-theme=dark] .tb-btn{background:var(--mint-2);color:#f1fff6}
html[data-theme=dark] .badge.mint,html[data-theme=dark] .badge.gold{color:#f1fff6}
html[data-theme=dark] .pill.gold,html[data-theme=dark] .btn.gold,html[data-theme=dark] .oitem.cur .pos,html[data-theme=dark] .toast.gold{color:#1f1300}
html[data-theme=dark] .doc{background:var(--surface)}
html[data-theme=dark] .chart .tip{background:#000}

/* ---------- Motion kit ---------- */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
html[data-motion=off] *,html[data-motion=off] *::before,html[data-motion=off] *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(202,138,4,.45)}60%{box-shadow:0 0 0 10px rgba(202,138,4,0)}}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.enter{animation:fadeUp var(--dur) var(--ease) both}
.stagger>*{animation:fadeUp .45s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.btn{transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.card,.tile,.kpi{transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s}
.card:hover,.kpi:hover{transform:translateY(-2px);box-shadow:0 14px 34px -18px rgba(15,31,22,.4)}
.fill,.bar>i{transition:width .6s var(--ease)}
.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite}

/* ---------- Base ---------- */
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--forest)}
html[data-theme=dark] a{color:var(--mint-2)}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.01em}
.ic{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.mono,.num,.matrix,.tbl td.num,.amt{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ur,[lang=ur]{font-family:var(--font-ur);line-height:1.95;direction:rtl;text-align:right}
html[lang=ur] body{font-family:var(--font-ur);line-height:1.85}
html[lang=ur] .txt,html[lang=ur] .lead,html[lang=ur] .note,html[lang=ur] .faq summary,html[lang=ur] .faq p,html[lang=ur] .todo,html[lang=ur] .tour-card p{direction:rtl;text-align:right}
html[lang=ur] .tabs a,html[lang=ur] .btn,html[lang=ur] .kpi .k,html[lang=ur] h2,html[lang=ur] h3{letter-spacing:0}
html[lang=ur] .mono,html[lang=ur] .num,html[lang=ur] .matrix,html[lang=ur] .amt,html[lang=ur] input,html[lang=ur] select{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--forest-deep),var(--forest));color:#eafff1;display:flex;align-items:center;gap:10px;padding:10px 18px;box-shadow:0 4px 20px -8px rgba(0,0,0,.45)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:11px;background:var(--mint);display:grid;place-items:center;color:var(--forest-deep);flex:none}
.brand h1{font-size:1.02rem;font-weight:700;white-space:nowrap}
.brand small{display:block;font-size:.72rem;opacity:.8;font-weight:500}
.spacer{flex:1}
.switcher{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:4px 6px 4px 10px;min-width:0}
.switcher select{appearance:none;-webkit-appearance:none;background:transparent;border:0;outline:0;color:#fff;font-weight:600;min-width:0;max-width:260px;padding:6px 2px;cursor:pointer}
.switcher select option{color:var(--ink);background:var(--surface)}
.tb-btn{position:relative;background:var(--mint);color:var(--forest-deep);border:0;border-radius:9px;padding:8px 12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-height:40px}
.tb-btn.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2)}
.tb-btn.icon{width:40px;padding:8px;justify-content:center}
.tb-btn .dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:#1f1300;font-size:.68rem;font-weight:800;display:grid;place-items:center;padding:0 4px;font-family:var(--mono)}
.lang{min-width:64px;justify-content:center}

/* ---------- Pot hero ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px 18px 80px}
.pot{background:linear-gradient(135deg,var(--forest) 0%,var(--forest-soft) 70%,#2a7d47 100%);color:#f1fff6;border-radius:18px;padding:18px 22px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px 24px;align-items:center;box-shadow:0 22px 50px -28px rgba(11,59,31,.7);position:relative;overflow:hidden}
.pot::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(209,250,229,.18),transparent 70%)}
.ring{width:118px;height:118px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .track{stroke:rgba(255,255,255,.18)}
.ring .prog{stroke:#a7f3d0;transition:stroke-dashoffset .9s var(--ease)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:1.35rem;font-family:var(--mono)}
.pot .k{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;opacity:.8;font-weight:600}
.pot .big{font-family:var(--mono);font-size:clamp(1.6rem,3vw,2.3rem);font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:4px 0}
.pot .of{opacity:.85;font-size:.95rem}
.pot .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:.8rem;font-weight:600;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);white-space:nowrap}
.pill.gold{background:var(--gold);color:#1f1300;border-color:var(--gold)}
.pill.warn{background:rgba(254,243,199,.2);border-color:rgba(254,243,199,.5)}
.pot .side{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:170px}
.pot .side .btn{justify-content:center}
.pot-empty{display:flex;align-items:center;gap:16px;grid-column:1/-1}
.banner{display:flex;align-items:center;gap:12px;background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:10px 14px;margin-top:12px;color:var(--ink)}
.banner .ic{color:var(--gold-deep)}
.banner p{margin:0;flex:1;font-size:.9rem}

/* ---------- Tabs ---------- */
.tabs{position:relative;display:flex;gap:2px;margin:18px 0 14px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{color:var(--muted);text-decoration:none;padding:10px 12px;font-weight:600;font-size:.9rem;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;border-radius:8px 8px 0 0;min-height:42px}
.tabs a:hover{color:var(--forest);background:var(--mint-soft)}
.tabs a.active{color:var(--forest)}
html[data-theme=dark] .tabs a.active,html[data-theme=dark] .tabs a:hover{color:var(--mint-2)}
.tabs .ink{position:absolute;bottom:-1px;left:0;height:3px;width:0;background:var(--forest);border-radius:3px 3px 0 0;transition:transform .3s var(--ease),width .3s var(--ease)}
html[data-theme=dark] .tabs .ink{background:var(--mint-2)}

/* ---------- Cards / KPIs ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:1.05rem;display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--forest-deep);flex-wrap:wrap}
html[data-theme=dark] .card h2,html[data-theme=dark] .sheet header h2{color:var(--mint-2)}
.card h2 .ic{color:var(--forest)}
html[data-theme=dark] .card h2 .ic{color:var(--mint-2)}
.card .lead{margin:-4px 0 12px;color:var(--muted);font-size:.9rem}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start}
.kpi .icw{width:38px;height:38px;border-radius:10px;background:var(--mint);color:var(--forest);display:grid;place-items:center;flex:none}
.kpi.gold .icw{background:var(--gold-soft);color:var(--gold-deep)}
.kpi.bad .icw{background:var(--bad-soft);color:var(--bad)}
.kpi .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.kpi .v{font-size:1.3rem;font-weight:600;font-family:var(--mono);margin-top:2px;letter-spacing:-.01em}
.kpi .s{font-size:.8rem;color:var(--muted)}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .spacer{flex:1}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;background:var(--forest);color:#fff;display:inline-flex;align-items:center;gap:7px;min-height:40px;text-decoration:none;white-space:nowrap}
.btn.gold{background:var(--gold);color:#1f1300}
.btn.ghost{background:var(--surface);color:var(--forest-deep);border:1px solid var(--line)}
html[data-theme=dark] .btn.ghost{color:var(--ink)}
.btn.mint{background:var(--mint);color:var(--forest-deep)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:.82rem;border-radius:8px;min-height:36px}
.btn.icon{padding:8px;width:40px;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 8px;font-size:.74rem;font-weight:700;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.late{background:var(--late-soft);color:var(--late)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.part{background:var(--part-soft);color:var(--part)}
.badge.waive{background:var(--waive-soft);color:var(--waive)}
.badge.gold{background:var(--gold-soft);color:var(--gold-deep)}
.badge.mint{background:var(--mint);color:var(--forest-deep)}
.badge.muted{background:var(--surface-2);color:var(--muted)}
.note{background:var(--mint-soft);border-left:4px solid var(--forest);padding:10px 12px;border-radius:8px;font-size:.88rem}
.note.gold{background:var(--gold-soft);border-color:var(--gold)}
.note.bad{background:var(--bad-soft);border-color:var(--bad)}
.bar{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--forest);border-radius:999px}
html[data-theme=dark] .bar>i{background:var(--mint-2)}
.bar.gold>i{background:var(--gold)}
.bar.bad>i{background:var(--bad)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty .ic{width:38px;height:38px;color:var(--forest);opacity:.6}
.search{position:relative;flex:1;min-width:180px;max-width:360px}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:36px}

/* ---------- Tables ---------- */
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--surface-2);font-weight:700;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr:hover{background:var(--mint-soft)}
.tbl td.num,.tbl th.num{text-align:right;white-space:nowrap}
.tbl .acts{display:flex;gap:4px;justify-content:flex-end}
.tbl .acts .btn{min-height:36px}
.tbl tr.clickable{cursor:pointer}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--mint);color:var(--forest-deep);display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none}
.who .n{font-weight:600;white-space:nowrap}
.who .p{font-size:.78rem;color:var(--muted);font-family:var(--mono)}
.tring{width:36px;height:36px;position:relative;flex:none}
.tring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tring circle{fill:none;stroke-width:4}
.tring .t{stroke:var(--surface-2)}
.tring .p{stroke:var(--ok);transition:stroke-dashoffset .8s var(--ease)}
.tring.mid .p{stroke:var(--late)}
.tring.low .p{stroke:var(--bad)}
.tring span{position:absolute;inset:0;display:grid;place-items:center;font-size:.62rem;font-weight:700;font-family:var(--mono)}

/* ---------- Payments matrix ---------- */
.matrixwrap{overflow:auto;border:1px solid var(--line);border-radius:12px;max-width:100%;-webkit-overflow-scrolling:touch;direction:ltr}
.matrix{border-collapse:separate;border-spacing:0;font-size:.78rem;min-width:max-content}
.matrix th,.matrix td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;white-space:nowrap;background:var(--surface)}
.matrix thead th{background:var(--surface-2);position:sticky;top:0;z-index:2;padding:8px 10px;font-weight:600;text-align:center;font-size:.72rem;color:var(--muted);cursor:pointer}
.matrix thead th.cur{color:var(--forest-deep);background:var(--mint)}
html[data-theme=dark] .matrix thead th.cur{color:#f1fff6}
.matrix thead th.sel{box-shadow:inset 0 -3px 0 var(--gold)}
.matrix th.name,.matrix td.name{position:sticky;left:0;z-index:3;text-align:left;padding:6px 12px;font-family:var(--font);font-weight:600;min-width:160px;max-width:200px;box-shadow:2px 0 0 var(--line)}
.matrix thead th.name{z-index:4;background:var(--surface-2)}
.matrix td.name small{display:block;font-weight:400;color:var(--muted);font-family:var(--mono);font-size:.7rem}
.matrix tbody tr:hover td{background:var(--mint-soft)}
.matrix tfoot td{background:var(--surface-2);padding:6px 8px;text-align:center;font-weight:600;color:var(--forest-deep)}
html[data-theme=dark] .matrix tfoot td{color:var(--ink)}
.matrix tfoot td.name{background:var(--surface-2);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.matrix tfoot .bar{height:6px;margin:4px 0 0;width:72px;display:inline-block}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:100px;height:52px;cursor:pointer;user-select:none;border:0;background:transparent;font-family:var(--mono);font-size:.76rem;line-height:1.2;transition:background .15s,transform .1s;padding:0;color:inherit}
.cell:active{transform:scale(.96)}
.cell .st{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:.7rem}
.cell .d{font-size:.64rem;opacity:.75}
.cell.unpaid{color:var(--muted)}
.cell.unpaid:hover{background:var(--surface-2)}
.cell.over{background:var(--bad-soft);color:var(--bad)}
.cell.paid{background:var(--ok-soft);color:var(--ok)}
.cell.late{background:var(--late-soft);color:var(--late)}
.cell.partial{background:var(--part-soft);color:var(--part)}
.cell.waived{background:var(--waive-soft);color:var(--waive)}
.cell.future{color:#b8c4bc;cursor:default}
.cell.future:hover{background:transparent}
.cell.me{box-shadow:inset 0 0 0 2px var(--gold)}
.cell.disputed::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
.cell{position:relative}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.mstats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.mstat{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.mstat .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.mstat .v{font-family:var(--mono);font-weight:600;font-size:1.05rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mstat.gold{background:var(--gold-soft)}
.mstat.gold .v{color:var(--gold-deep)}

/* ---------- Charts ---------- */
.chart{position:relative;background:var(--surface-2);border-radius:12px;padding:8px;min-width:0}
.chart svg{width:100%;height:auto;display:block;overflow:visible;font-family:var(--mono);direction:ltr}
.chart .tip{position:absolute;pointer-events:none;background:var(--forest-deep);color:#fff;border-radius:8px;padding:5px 9px;font-size:.76rem;transform:translate(-50%,-115%);white-space:nowrap;display:none;z-index:2;font-family:var(--mono)}
.clegend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;margin:8px 2px 0;color:var(--muted)}
.clegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.hbars{display:flex;flex-direction:column;gap:7px}
.hbar{display:grid;grid-template-columns:120px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:.82rem}
.hbar .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.hbar .bar{height:10px}
.hbar .v{text-align:right;font-family:var(--mono);color:var(--muted)}
.spark{display:inline-block;width:110px;height:30px;vertical-align:middle}
.spark svg{width:100%;height:100%;overflow:visible}

/* ---------- Schedule timeline ---------- */
.timeline{position:relative;padding-inline-start:26px}
.timeline::before{content:"";position:absolute;inset-inline-start:9px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:11px 14px;margin-bottom:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);transition:transform .2s var(--ease),border-color .2s}
.tl:hover{transform:translateX(2px);border-color:var(--mint-2)}
.tl::before{content:"";position:absolute;inset-inline-start:-22px;top:50%;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--line);transform:translateY(-50%)}
.tl.done::before{background:var(--forest);border-color:var(--forest)}
.tl.current{border-color:var(--gold);background:linear-gradient(90deg,var(--gold-soft),var(--surface) 60%)}
.tl.current::before{background:var(--gold);border-color:var(--gold);animation:pulse 2s infinite}
.tl .m{font-weight:700;color:var(--forest-deep)}
html[data-theme=dark] .tl .m{color:var(--ink)}
.tl .r{font-size:.86rem;color:var(--muted)}
.tl>.amt{font-weight:600;text-align:right;white-space:nowrap}
.tl>.amt .small{white-space:normal;font-weight:400}
.tl .bot{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.countdown{display:flex;align-items:baseline;gap:8px}
.countdown .n{font-family:var(--mono);font-size:2.6rem;font-weight:600;color:var(--gold-deep);line-height:1}
.optgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.opt{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2)}
.opt h4{font-size:.9rem;display:flex;align-items:center;gap:6px;margin-bottom:6px;color:var(--forest-deep)}
html[data-theme=dark] .opt h4{color:var(--ink)}
.opt .v{font-family:var(--mono);font-weight:600;font-size:1.05rem}

/* ---------- Members / order list / needs ---------- */
.orderlist{display:flex;flex-direction:column;gap:6px}
.oitem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);transition:transform .2s var(--ease),box-shadow .2s,border-color .2s}
.oitem:hover{border-color:var(--mint-2)}
.oitem.dragging{opacity:.5}
.oitem.over{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.oitem .pos{width:30px;height:30px;border-radius:8px;background:var(--mint);color:var(--forest-deep);display:grid;place-items:center;font-weight:700;font-family:var(--mono);font-size:.8rem;flex:none}
.oitem.done .pos{background:var(--surface-2);color:var(--muted)}
.oitem.cur .pos{background:var(--gold);color:#1f1300}
.oitem .grip{color:var(--muted);cursor:grab;display:grid;place-items:center;width:28px;height:36px}
.oitem .nm{flex:1;min-width:0;font-weight:600;line-height:1.3}
.oitem .nm small{display:block;color:var(--muted);font-weight:400;font-family:var(--mono);font-size:.72rem;margin-top:2px}
.oitem .ud{display:flex;gap:2px}
.urg{display:inline-flex;gap:2px}
.urg i{width:8px;height:8px;border-radius:2px;background:var(--surface-2);border:1px solid var(--line)}
.urg i.on{background:var(--gold);border-color:var(--gold)}
.lotto{position:relative;height:var(--h,300px);transition:height .3s}
.litem{position:absolute;left:0;right:0;height:44px;display:flex;align-items:center;gap:10px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);transition:top .28s var(--ease),background .3s,border-color .3s;font-weight:600}
.litem .pos{width:28px;height:28px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--mono);font-size:.78rem;font-weight:700;color:var(--muted)}
.litem.final{border-color:var(--mint-2);background:var(--mint-soft)}
.litem.final .pos{background:var(--forest);color:#fff}
.litem.spin{background:var(--gold-soft)}

/* ---------- Forms ---------- */
label.f{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin:10px 0 5px}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=tel],input[type=password],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;outline:0;min-height:40px}
input:focus,select:focus,textarea:focus{border-color:var(--forest);box-shadow:0 0 0 3px var(--mint)}
input.bad{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
textarea{min-height:70px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--forest)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.err{color:var(--bad);font-size:.78rem;margin-top:4px;min-height:1em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2);flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 11px;cursor:pointer;font-weight:600;font-size:.82rem;min-height:38px;display:inline-flex;align-items:center;gap:5px;color:var(--ink)}
.seg button.on{background:var(--forest);color:#fff}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch .lbl{flex:1;min-width:0}
.switch .lbl b{display:block;font-size:.92rem}
.switch .lbl span{font-size:.8rem;color:var(--muted)}
.toggle{position:relative;width:46px;height:26px;border-radius:13px;background:var(--line);border:0;cursor:pointer;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle[aria-checked=true]{background:var(--forest)}
.toggle[aria-checked=true]::after{transform:translateX(20px)}
.rangeval{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);font-family:var(--mono)}

/* ---------- Modal / popover / drawer / toasts ---------- */
.scrim{position:fixed;inset:0;background:rgba(11,59,31,.45);backdrop-filter:blur(2px);z-index:40;opacity:0;pointer-events:none;transition:opacity .22s}
body.modal-open .scrim,body.drawer-open .scrim{opacity:1;pointer-events:auto}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
body.modal-open .modal{display:flex}
.sheet{background:var(--surface);border-radius:16px;width:min(620px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px -30px rgba(0,0,0,.6);animation:pop .25s var(--ease)}
.sheet.wide{width:min(860px,100%)}
.sheet header{display:flex;align-items:center;gap:10px;padding:16px 20px 8px;position:sticky;top:0;background:var(--surface);z-index:1}
.sheet header h2{font-size:1.1rem;flex:1;display:flex;align-items:center;gap:8px;color:var(--forest-deep)}
.sheet .body{padding:4px 20px 18px}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px 18px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line)}
.sheet .foot .left{margin-right:auto}
.close{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;width:38px;height:38px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.pop{position:fixed;z-index:55;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px -20px rgba(0,0,0,.45);padding:14px;width:320px;display:none;animation:pop .2s var(--ease)}
.pop.open{display:block}
.pop h4{font-size:.9rem;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.stbtns{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.stbtns button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 9px;font-size:.78rem;font-weight:700;cursor:pointer;min-height:36px;display:inline-flex;align-items:center;gap:4px;color:var(--ink)}
.stbtns button.on.paid{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.stbtns button.on.late{background:var(--late-soft);color:var(--late);border-color:var(--late)}
.stbtns button.on.partial{background:var(--part-soft);color:var(--part);border-color:var(--part)}
.stbtns button.on.waived{background:var(--waive-soft);color:var(--waive);border-color:var(--waive)}
.stbtns button.on.unpaid{background:var(--surface-2);border-color:var(--muted)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);z-index:52;box-shadow:-20px 0 60px -30px rgba(0,0,0,.5);transform:translateX(100%);transition:transform .3s var(--ease);display:flex;flex-direction:column}
body.drawer-open .drawer{transform:none}
.drawer header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer header h2{font-size:1.05rem;flex:1;display:flex;align-items:center;gap:8px}
.drawer .dbody{flex:1;overflow:auto;padding:12px 16px}
.drawer .dfoot{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.ntf{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--surface);cursor:pointer;transition:background .15s;animation:slideIn .3s var(--ease) both}
.ntf:hover{background:var(--mint-soft)}
.ntf.unread{border-color:var(--gold);background:linear-gradient(90deg,var(--gold-soft),var(--surface) 70%)}
.ntf .icw{width:34px;height:34px;border-radius:9px;background:var(--mint);color:var(--forest);display:grid;place-items:center;flex:none}
.ntf.bad .icw{background:var(--bad-soft);color:var(--bad)}
.ntf.gold .icw{background:var(--gold-soft);color:var(--gold-deep)}
.ntf .t{font-weight:600;font-size:.9rem}
.ntf .b{font-size:.82rem;color:var(--muted)}
.ntf .at{font-size:.72rem;color:var(--muted);font-family:var(--mono);margin-top:2px}
.logline{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.86rem}
.logline:last-child{border-bottom:0}
.logline .at{font-family:var(--mono);font-size:.72rem;color:var(--muted);white-space:nowrap;padding-top:2px}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;width:max-content;max-width:92vw}
.toast{background:var(--forest-deep);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:toastIn .3s var(--ease) both,toastOut .4s var(--ease) 2.8s both;display:flex;align-items:center;gap:8px}
.toast.ok{background:var(--ok);color:#fff}
.toast.bad{background:var(--bad);color:#fff}
.toast.gold{background:var(--gold);color:#1f1300}
html[data-theme=dark] .toast.ok{background:#166534}
html[data-theme=dark] .toast.bad{background:#991b1b}

/* ---------- Dashboard: committee cards + cash-flow calendar ---------- */
.ccard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;cursor:pointer;position:relative}
.ccard .ring{width:66px;height:66px}
.ccard .ring circle{stroke-width:8}
.ccard .ring .track{stroke:var(--surface-2)}
.ccard .ring .prog{stroke:var(--forest)}
html[data-theme=dark] .ccard .ring .prog{stroke:var(--mint-2)}
.ccard .ring .lbl{font-size:.8rem;color:var(--ink)}
.ccard h3{font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ccard .row{display:flex;gap:8px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:4px}
.ccard.active{border-color:var(--forest);box-shadow:0 0 0 2px var(--mint)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;font-weight:700;padding:4px 0}
.cal .day{min-height:74px;border:1px solid var(--line);border-radius:8px;padding:4px;background:var(--surface);font-size:.72rem;display:flex;flex-direction:column;gap:2px;min-width:0}
.cal .day.other{opacity:.35}
.cal .day.today{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.cal .day .dn{font-family:var(--mono);font-weight:600;color:var(--muted)}
.cal .ev{border-radius:5px;padding:2px 5px;font-size:.66rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:3px;align-items:center}
.cal .ev.in{background:var(--mint);color:var(--forest-deep)}
.cal .ev.out{background:var(--gold-soft);color:var(--gold-deep)}
html[data-theme=dark] .cal .ev.in{color:#f1fff6}
.cal .ev .ic{width:.9em;height:.9em}
.evlist{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.evrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:.86rem}
.evrow .d{font-family:var(--mono);font-weight:700;color:var(--forest-deep)}
html[data-theme=dark] .evrow .d{color:var(--mint-2)}
.evrow .amt{font-weight:600}

/* ---------- People / profile / disputes ---------- */
.pcard{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.pcard .avatar{width:44px;height:44px;font-size:.95rem}
.pcard .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.outc{display:flex;gap:4px;flex-wrap:wrap}
.outc i{display:inline-block;width:10px;height:10px;border-radius:2px}
.hist{position:relative;padding-left:18px;margin-top:8px}
.hist::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.hist .h{position:relative;padding:4px 0 10px;font-size:.86rem}
.hist .h::before{content:"";position:absolute;left:-17px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--forest);border:2px solid var(--surface)}
.hist .h .at{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.dstatus{display:inline-flex;align-items:center;gap:4px}

/* ---------- Planner ---------- */
.planner .res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.planner .res div{background:var(--surface-2);border-radius:12px;padding:12px 14px}
.planner .res b{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.planner .res .v{font-family:var(--mono);font-size:1.15rem;font-weight:600;margin-top:2px}
.planner .res .v.pos{color:var(--ok)}
.planner .res .v.neg{color:var(--bad)}
.turnrow td.hi{background:var(--gold-soft)}

/* ---------- Receipt / QR ---------- */
.receipt{border:1px dashed var(--line);border-radius:12px;padding:16px;background:var(--surface);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}
.receipt h3{font-size:1rem;letter-spacing:.06em;text-transform:uppercase;color:var(--forest-deep)}
.receipt .no{font-family:var(--mono);color:var(--muted);font-size:.8rem}
.receipt dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:10px 0;font-size:.9rem}
.receipt dt{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;align-self:center}
.receipt dd{margin:0;font-weight:600}
.receipt canvas{width:132px;height:132px;image-rendering:pixelated;border:1px solid var(--line);border-radius:8px;background:#fff}
.receipt .code{font-family:var(--mono);font-size:.7rem;color:var(--muted);text-align:center;margin-top:4px;word-break:break-all;max-width:132px}
.receipt .stamp{display:inline-block;border:2px solid var(--ok);color:var(--ok);border-radius:6px;padding:2px 8px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:.72rem;transform:rotate(-4deg);margin-top:6px}

/* ---------- Lock screen + tour ---------- */
.lock{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,var(--forest-deep),var(--forest) 60%,#2a7d47);color:#f1fff6;display:none;align-items:center;justify-content:center;padding:20px}
body.locked .lock{display:flex}
body.locked .wrap,body.locked .topbar{filter:blur(6px);pointer-events:none;user-select:none}
.lockbox{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:26px 24px;width:min(340px,100%);text-align:center;backdrop-filter:blur(8px)}
.lockbox h2{font-size:1.1rem;margin:10px 0 4px}
.lockbox p{margin:0 0 14px;opacity:.8;font-size:.9rem}
.dots{display:flex;justify-content:center;gap:10px;margin:10px 0 18px;min-height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.6)}
.dots i.on{background:var(--mint-2);border-color:var(--mint-2)}
.dots.wrong{animation:shake .4s}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{height:52px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font-size:1.2rem;font-weight:600;cursor:pointer;font-family:var(--mono)}
.keypad button:hover{background:rgba(255,255,255,.2)}
.tour-hi{position:fixed;z-index:70;border-radius:12px;box-shadow:0 0 0 9999px rgba(11,59,31,.6),0 0 0 3px var(--gold);pointer-events:none;transition:all .3s var(--ease);display:none}
.tour-card{position:fixed;z-index:71;width:min(340px,calc(100vw - 24px));background:var(--surface);color:var(--ink);border-radius:14px;padding:16px 18px;box-shadow:0 30px 70px -20px rgba(0,0,0,.6);display:none;animation:pop .25s var(--ease)}
body.touring .tour-hi,body.touring .tour-card{display:block}
.tour-card h4{font-size:1rem;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.tour-card p{margin:0 0 12px;font-size:.9rem;color:var(--muted)}
.tour-card .steps{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.tour-card .foot{display:flex;gap:6px;align-items:center}
.kbd{font-family:var(--mono);font-size:.74rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface-2)}

/* ---------- Agreement / FAQ / About / statements ---------- */
.doc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px 32px;max-width:860px;margin:0 auto;font-size:.92rem;direction:ltr;text-align:left}
.doc h3{font-size:1.25rem;text-align:center;letter-spacing:.04em;text-transform:uppercase;color:var(--forest-deep);margin-bottom:4px}
html[data-theme=dark] .doc h3,html[data-theme=dark] .receipt h3{color:var(--mint-2)}
.doc .sub{text-align:center;color:var(--muted);margin-bottom:18px;font-size:.85rem}
.doc ol{padding-left:20px;margin:8px 0}
.doc li{margin:6px 0}
.doc .terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px 16px;background:var(--mint-soft);border-radius:10px;padding:12px 14px;margin:12px 0}
.doc .terms div b{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.doc .ur{margin-top:22px;padding-top:18px;border-top:1px dashed var(--line);font-size:1rem}
.doc .ur h3{font-family:var(--font-ur);text-transform:none;font-size:1.3rem}
.doc .ur ol{padding-right:22px;padding-left:0}
.doc .pagebreak{page-break-after:always;break-after:page;height:0;margin:24px 0;border-top:1px dashed var(--line)}
.doc .tot4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.doc .tot4 div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.doc .tot4 b{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.sigs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px 20px;margin-top:20px}
.sig{border-top:1px solid var(--ink);padding-top:6px;font-size:.82rem}
.sig b{display:block}
.sig span{color:var(--muted)}
.faq details{border:1px solid var(--line);border-radius:10px;padding:0 14px;margin-bottom:8px;background:var(--surface)}
.faq summary{padding:12px 0;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;list-style:none;min-height:44px}
.faq summary::-webkit-details-marker{display:none}
.faq summary .ic{color:var(--forest);transition:transform .25s var(--ease)}
.faq details[open] summary .ic{transform:rotate(90deg)}
.faq p{margin:0 0 12px;color:var(--muted);font-size:.9rem}
.todo{border:1px dashed var(--forest);border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.todo h4{margin:0 0 6px;font-size:.95rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.todo .tag{font-size:.7rem;background:var(--forest);color:#fff;border-radius:6px;padding:2px 6px;font-weight:700;font-family:var(--mono)}
.todo .stars{color:var(--gold);letter-spacing:1px;font-size:.8rem}
.list{display:flex;flex-direction:column;gap:10px}
.rowi{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface);transition:background .15s}
.rowi:hover{background:var(--mint-soft)}
.statement .tot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}
.statement .tot div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.statement .tot b{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.modmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.modmap div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.84rem;background:var(--surface)}
.modmap b{display:flex;align-items:center;gap:6px}

/* ---------- Responsive ---------- */
@media (max-width:1000px){
  .g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g5{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g21,.g12{grid-template-columns:minmax(0,1fr)}
  .mstats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .optgrid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:700px){
  .topbar{flex-wrap:wrap;row-gap:8px;padding:10px 12px}
  .brand small{display:none}
  .brand h1{font-size:.95rem}
  .switcher{order:10;flex:1 1 100%;justify-content:space-between}
  .switcher select{max-width:none;flex:1}
  .topbar .spacer{display:none}
  .tb-btn .lbl{display:none}
  .tb-btn{padding:8px 10px}
  .wrap{padding:12px 12px 70px}
  .pot{grid-template-columns:auto minmax(0,1fr);padding:16px;gap:12px 14px}
  .pot .side{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;min-width:0}
  .pot .side .btn{flex:1}
  .ring{width:96px;height:96px}
  .ring .lbl{font-size:1.1rem}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mstats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .planner .res{grid-template-columns:minmax(0,1fr)}
  .kpi .v{font-size:1.1rem}
  .hbar{grid-template-columns:88px minmax(0,1fr) 46px}
  .doc{padding:18px 16px}
  .doc .tot4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sheet .foot .left{margin-right:0;width:100%}
  .statement .tot{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tbl th,.tbl td{padding:8px 10px}
  .matrix th.name,.matrix td.name{min-width:128px;max-width:140px;padding:6px 8px;font-size:.78rem}
  .cell{width:86px}
  .countdown .n{font-size:2rem}
  .tl{grid-template-columns:minmax(0,1fr)}
  .tl>.amt{text-align:left}
  .cal .day{min-height:46px;padding:3px}
  .cal .ev span{display:none}
  .cal .ev{justify-content:center;padding:2px}
  .receipt{grid-template-columns:minmax(0,1fr)}
  .receipt canvas{justify-self:center}
  .evrow{grid-template-columns:44px minmax(0,1fr)}
  .evrow .amt{grid-column:2}
}
@media print{
  body.printing>*:not(#printRoot){display:none!important}
  #printRoot{display:block!important;padding:0}
  .doc{border:0;padding:0;max-width:none;box-shadow:none;background:#fff;color:#000}
  .btn,.toolbar{display:none!important}
  body{background:#fff}
  .receipt{break-inside:avoid}
}
#printRoot{display:none}
.noanim.enter,.noanim .enter,.noanim .stagger>*{animation:none}
</style>

// ---------- 1. utils ----------
const NS = 'kameti:';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const store = {
  get(k, d) {
    try {
      const v = localStorage.getItem(NS + k);
      return v == null ? d : JSON.parse(v);
    } catch {
      return d;
    }
  },
  set(k, v) {
    try {
      localStorage.setItem(NS + k, JSON.stringify(v));
    } catch {
      /* quota or private mode: keep working in memory */
    }
    syncToBackend(k, v);
  },
  remove(k) {
    try {
      localStorage.removeItem(NS + k);
    } catch {
      /* ignore */
    }
  },
  keys() {
    const out = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(NS)) out.push(k.slice(NS.length));
      }
    } catch {
      /* ignore */
    }
    return out;
  },
  bytes() {
    let n = 0;
    try {
      for (const k of this.keys()) n += (localStorage.getItem(NS + k) || '').length * 2;
    } catch {
      /* ignore */
    }
    return n;
  }
};

// TODO(student): multi-device sync. Push every store.set() to a backend (Firebase / Supabase / your own REST API) with member
// logins, and pull on startup. Keep localStorage as the offline cache and resolve conflicts with a lastModified timestamp per record.
function syncToBackend(/* key, value */) {}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const ic = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const nf = new Intl.NumberFormat('en-PK', { maximumFractionDigits: 0 });
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const sum = arr => arr.reduce((a, b) => a + b, 0);

/* Rupee formatting honours the "compact numbers" setting (Rs 1.2M / Rs 45k). */
function rs(n) {
  const v = Math.round(n || 0);
  if (SETTINGS.compact && Math.abs(v) >= 100000) return 'Rs ' + (v / 1000000).toFixed(v >= 10000000 ? 0 : 2).replace(/\.?0+$/, '') + 'M';
  if (SETTINGS.compact && Math.abs(v) >= 10000) return 'Rs ' + Math.round(v / 1000) + 'k';
  return 'Rs ' + nf.format(v);
}
const rsFull = n => 'Rs ' + nf.format(Math.round(n || 0));
const pctf = n => Math.round(n * 100) + '%';
const kfmt = v => (v >= 1000 ? Math.round(v / 1000) + 'k' : String(Math.round(v)));

function toast(msg, type = '', icon = 'info') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icn = type === 'ok' ? 'check-circle' : type === 'bad' ? 'alert-circle' : icon;
  el.innerHTML = ic(icn) + `<span>${esc(msg)}</span>`;
  $('#toasts').append(el);
  setTimeout(() => el.remove(), 3300);
}

/* Motion helpers from the kit */
function animateIn(root) {
  root.classList.remove('enter');
  void root.offsetWidth;
  root.classList.add('enter');
  $$('.stagger', root).forEach(g => [...g.children].forEach((el, i) => el.style.setProperty('--i', i)));
}
function countUp(el, to, { dur = 700, fmt = v => nf.format(Math.round(v)) } = {}) {
  if (!el) return;
  const t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(to * e);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function drawPath(p) {
  const L = p.getTotalLength();
  p.style.strokeDasharray = L;
  p.style.strokeDashoffset = L;
  p.getBoundingClientRect();
  p.style.transition = 'stroke-dashoffset .9s var(--ease)';
  p.style.strokeDashoffset = 0;
}
const animBars = root => requestAnimationFrame(() => $$('[data-w]', root).forEach(b => (b.style.width = b.dataset.w)));
const animRings = root => requestAnimationFrame(() => $$('[data-off]', root).forEach(p => (p.style.strokeDashoffset = p.dataset.off)));
const countAll = root => $$('[data-count]', root).forEach(el => countUp(el, +el.dataset.count));

/* Dates: the app works in whole days and calendar months. */
const today = new Date();
today.setHours(0, 0, 0, 0);
const pad2 = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
function fromIso(s) {
  const [y, m, d] = String(s).split('-').map(Number);
  return new Date(y, m - 1, d || 1);
}
const ym = d => iso(d).slice(0, 7);
function addMonths(ymS, n) {
  const [y, m] = ymS.split('-').map(Number);
  return ym(new Date(y, m - 1 + n, 1));
}
function addDays(d, n) {
  const x = new Date(d);
  x.setDate(x.getDate() + n);
  return x;
}
const daysBetween = (a, b) => Math.round((b - a) / 86400000);
const daysInMonth = ymS => {
  const [y, m] = ymS.split('-').map(Number);
  return new Date(y, m, 0).getDate();
};
const loc = () => (lang === 'ur' ? 'ur-PK-u-nu-latn' : 'en-PK');
function monthLabel(ymS, long = false) {
  const [y, m] = ymS.split('-').map(Number);
  const opts = long ? { month: 'long', year: 'numeric' } : { month: 'short', year: '2-digit' };
  return new Date(y, m - 1, 1).toLocaleDateString(loc(), opts);
}
function dateLabel(isoS, long = false) {
  if (!isoS) return '—';
  const opts = long ? { day: 'numeric', month: 'long', year: 'numeric' } : { day: 'numeric', month: 'short' };
  return fromIso(isoS).toLocaleDateString(loc(), opts);
}
function timeAgo(isoTs) {
  const diff = Math.max(0, Date.now() - new Date(isoTs).getTime());
  const mins = Math.floor(diff / 60000);
  if (mins < 60) return tf('ago_m', { a: Math.max(1, mins) });
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return tf('ago_h', { a: hrs });
  return tf('ago_d', { a: Math.floor(hrs / 24) });
}

const initials = n => String(n || '').split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
const digits = p => String(p || '').replace(/\D/g, '');
const waLink = (phone, text) => `https://wa.me/92${digits(phone).replace(/^0/, '')}?text=${encodeURIComponent(text)}`;
const PHONE_RE = /^03\d{2}-\d{7}$/;
const CNIC_RE = /^\d{5}-\d{7}-\d$/;
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

function download(name, text, type = 'application/json') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* Deterministic pseudo-randomness (LCG) for seed data and QR-style codes */
function seeded(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s * 1664525 + 1013904223) % 4294967296;
    return s / 4294967296;
  };
}
/* FNV-1a 32-bit: fast, deterministic, good enough for receipt codes and a local PIN check (not cryptographic). */
function hash32(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h >>> 0;
}
const hashHex = str => hash32(str).toString(16).padStart(8, '0') + hash32(str + '|k').toString(16).padStart(8, '0');

  ab_problem_t: 'Millions of Pakistani households save through informal rotating committees (kameti / beesi). They run on memory, paper and WhatsApp, so disputes over who paid, who is next and late payments are common — and there is no legal protection when things go wrong.',

  faq: [
    ['What is a kameti?', 'A kameti (also beesi or committee) is a rotating savings group: every member pays a fixed amount each month and one member takes the whole pot each cycle, until everyone has had a turn. It is an interest-free way to save for a large expense.'],
    ['Who benefits from an early turn?', 'Early recipients effectively receive an interest-free loan; late recipients are effectively lending. That is why the order matters and should be transparent — a lottery, a need-based ranking everyone can see, or an agreed list that everyone signs. The Planner tab puts numbers on this.'],
    ['What are the risks?', 'There is no legal protection: if the organizer or an early recipient disappears, the later members lose money. Only join committees run by people you know, keep written records and receipts, and never hand over cash without a signed entry.'],
    ['What if someone stops paying?', 'Agree the rule before you start (clause 5 of the agreement). Use the default simulator in Schedule to see the shortfall and the options: split it, the organizer covers it, or move the defaulter\'s turn to the end.'],
    ['What are grace days and fee caps?', 'A grace period gives members a few days after the collection day before a payment counts as late. A fee cap stops percentage-based late fees from growing without limit. Both are written into the agreement.'],
    ['Is a kameti like a bank account?', 'No. Banks are regulated and deposits are protected up to a limit; a kameti relies entirely on trust. Many families still prefer it because it enforces saving discipline and involves no interest.']
