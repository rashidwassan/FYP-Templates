/** Plain data table. heads: 'Label' (text column) or ['Label'] (numeric column); rows: arrays of cell HTML. */
function tableHtml(heads, rows, rowCls = () => '') {
  const num = heads.map(h => Array.isArray(h));
  const th = heads.map((h, j) => `<th class="${num[j] ? 'n' : ''}">${num[j] ? h[0] : h}</th>`).join('');
  const body = rows.map((r, i) => `<tr class="${rowCls(i)}">${r.map((c, j) => `<td class="${num[j] ? 'n' : ''}">${c}</td>`).join('')}</tr>`).join('');
  return `<table class="tbl"><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table>`;
}

/** 0..max rounded up to 1, 2, 2.5 or 5 × 10^n. */
function niceMax(v) {
  if (!(v > 0)) return 1;
  const p = 10 ** Math.floor(Math.log10(v));
  const n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}

/** Linear map from [d0, d1] to [r0, r1]. */
const lin = (d0, d1, r0, r1) => v => r0 + ((v - d0) * (r1 - r0)) / (d1 - d0 || 1);

/**
 * Index-based chart: n slots across the width. Series types: 'area', 'line', 'bars' (signed, optional stack
 * group), 'dash' (horizontal reference). spec = { h, n, yMax, yMin, y2Max, fmt, fmt2, xLabels(i) → label|null,
 * series, bands: [{a, b, cls, label}], cursor, tips(i), cls }.
 */
function xyChart(w, spec) {
  const h = spec.h || 220;
  const pad = { ...PAD, ...(spec.pad || {}) };
  const n = spec.n;
  const bw = (w - pad.l - pad.r) / n;
  const x = i => pad.l + (i + 0.5) * bw;
  const lo = Math.min(0, ...spec.series.filter(s => !s.axis2 && s.vals).flatMap(s => s.vals));
  const yMin = spec.yMin ?? (lo < 0 ? -niceMax(-lo) : 0);
  const yMax = spec.yMax ?? niceMax(seriesMax(spec.series, n));
  const y = lin(yMin, yMax, h - pad.b, pad.t);
  const y2 = lin(0, spec.y2Max || 100, h - pad.b, pad.t);
  let g = '';
  (spec.bands || []).forEach(b => {
    g += `<rect class="${b.cls}" x="${pad.l + b.a * bw}" y="${pad.t}" width="${(b.b - b.a) * bw}" height="${h - pad.t - pad.b}"/>`;
    if (b.label && (b.b - b.a) * bw > 34) g += `<text class="band-lbl" x="${pad.l + b.a * bw + 4}" y="${pad.t + 11}">${esc(b.label)}</text>`;
  });
  g += gridLines(spec, w, h, pad, y, y2, yMin, yMax);
  const stacks = {};
  spec.series.forEach(s => (g += seriesSvg(s, { x, y: s.axis2 ? y2 : y, bw, n, stacks, h, pad })));
  g += xLabelsSvg(spec, x, h);
  if (spec.cursor != null) g += `<line class="cursor" x1="${x(spec.cursor)}" x2="${x(spec.cursor)}" y1="${pad.t}" y2="${h - pad.b}"/>`;
  let hits = '';
  if (spec.tips) {
    hits = `<line class="guide" x1="0" x2="0" y1="${pad.t}" y2="${h - pad.b}"/>`;
    for (let i = 0; i < n; i++) hits += `<rect class="hit" data-i="${i}" x="${pad.l + i * bw}" y="${pad.t}" width="${bw}" height="${h - pad.t - pad.b}"/>`;
  }
  const svg = `<svg class="ch ${spec.cls || ''}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(spec.label || '')}">${g}${hits}</svg>`;
  return { svg, tips: spec.tips };
}

/** Largest value on the left axis, summing stacked bar groups slot by slot. */
function seriesMax(series, n) {
  const left = series.filter(s => !s.axis2 && s.vals);
  const stacked = Array.from({ length: n }, (_, i) => sum(left.filter(s => s.stack).map(s => Math.max(0, s.vals[i] || 0))));
  return Math.max(1e-6, ...left.filter(s => !s.stack).flatMap(s => s.vals), ...stacked);
}

/** 1 → 5 ticks of 0.2, 2 → 4 of 0.5, 2.5 → 5 of 0.5, 5 → 5 of 1, 10 → 5 of 2 (times a power of ten). */
const autoTicks = yMax => (Math.abs(yMax / 10 ** Math.floor(Math.log10(yMax)) - 2) < 1e-9 ? 4 : 5);

function gridLines(spec, w, h, pad, y, y2, yMin, yMax) {
  let g = '';
  const ticks = spec.ticks || (yMin === 0 && !spec.y2Max ? autoTicks(yMax) : 4);
  const fmt = spec.fmt || (v => nf(v, yMax < 3 ? 1 : 0));
  const vals = spec.tickVals || Array.from({ length: ticks + 1 }, (_, i) => yMin + ((yMax - yMin) * i) / ticks);
  let lastY = Infinity;
  vals.forEach((v, t0) => {
    g += `<line class="gl ${Math.abs(v) < 1e-9 ? 'zero' : ''}" x1="${pad.l}" x2="${w - pad.r}" y1="${y(v)}" y2="${y(v)}"/>`;
    // Skip a label that would collide with the previous one (e.g. 0 next to a small maximum).
    if (Math.abs(y(v) - lastY) >= 11) {
      g += `<text x="${pad.l - 6}" y="${y(v) + 3.5}" text-anchor="end">${fmt(v)}</text>`;
      lastY = y(v);
    }
    if (spec.y2Max && !spec.tickVals) {
      const v2 = (spec.y2Max * t0) / ticks;
      g += `<text class="t2" x="${w - pad.r + 6}" y="${y2(v2) + 3.5}">${(spec.fmt2 || (u => u + '%'))(Math.round(v2))}</text>`;
    }
  });
  if (spec.unit) g += `<text class="unit" x="${pad.l - 6}" y="${pad.t - 8}" text-anchor="end">${spec.unit}</text>`;
  return g;
}

function xLabelsSvg(spec, x, h) {
  let g = '';
  if (!spec.xLabels) return g;
  for (let i = 0; i < spec.n; i++) {
    const lbl = spec.xLabels(i);
    if (lbl != null) g += `<text x="${x(i)}" y="${h - 6}" text-anchor="middle">${esc(lbl)}</text>`;
  }
  return g;
}

function seriesSvg(s, c) {
  const vals = s.vals;
  if (s.type === 'line' || s.type === 'area') {
    const pts = vals.map((v, i) => [c.x(i), c.y(v)]);
    const d = 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L');
    const base = s.base ? s.base.map((v, i) => [c.x(i), c.y(v)]).reverse() : [[c.x(vals.length - 1), c.y(0)], [c.x(0), c.y(0)]];
    const area = s.type === 'area' ? `<path class="${s.cls}-area" style="${s.color ? 'fill:' + s.color : ''}" d="${d}L${base.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L')}Z"/>` : '';
    return area + (s.noLine ? '' : `<path class="${s.cls}" style="${s.color ? 'stroke:' + s.color : ''}" d="${d}" ${s.draw ? 'data-draw' : ''}/>`);
  }
  if (s.type === 'bars') {
    let g = '';
    const wBar = c.bw * (s.width || 0.68);
    vals.forEach((v, i) => {
      if (!v) return;
      const key = (s.stack || '') + (v >= 0 ? '+' : '-') + i;
      const from = s.stack ? c.stacks[key] || 0 : 0;
      c.stacks[key] = from + v;
      const y0 = c.y(from);
      const y1 = c.y(from + v);
      const box = `x="${(c.x(i) - wBar / 2).toFixed(1)}" y="${Math.min(y0, y1).toFixed(1)}" width="${wBar.toFixed(1)}" height="${Math.max(0.5, Math.abs(y1 - y0)).toFixed(1)}"`;
      g += `<rect class="${s.cls}" style="${s.color ? 'fill:' + s.color : ''}" ${box} rx="${Math.min(3, wBar / 4).toFixed(1)}"/>`;
    });
    return g;
  }
  if (s.type === 'dash') {
    return `<line class="${s.cls}" x1="${c.pad.l}" x2="${c.x(c.n - 1) + c.bw / 2}" y1="${c.y(s.value)}" y2="${c.y(s.value)}"/>`
      + (s.label ? `<text class="dash-lbl" x="${c.pad.l + 4}" y="${c.y(s.value) - 4}">${esc(s.label)}</text>` : '');
  }
  return '';
}

/** Hour labels every `every` hours for step charts. */
const hourLabels = (dt, every = 3) => i => {
  const h = i * dt;
  return Math.abs(h % every) < 1e-9 ? pad2(h % 24) : null;
};

/** Gantt rows for flexible loads, aligned with xyChart's padding. rows = [{label, icon, color, blocks:[[a,b]]}]. */
function ganttSvg(w, rows, n, { pad = PAD, rowH = 22 } = {}) {
  const bw = (w - pad.l - pad.r) / n;
  const h = rows.length * rowH + 4;
  let g = '';
  rows.forEach((r, ri) => {
    const y0 = ri * rowH + 3;
    g += `<rect class="gantt-track" x="${pad.l}" y="${y0}" width="${w - pad.l - pad.r}" height="${rowH - 6}" rx="5"/>`;
    g += `<use href="#i-${r.icon}" class="gantt-ic" x="${pad.l - 24}" y="${y0 - 1}" width="18" height="18"/>`;
    r.blocks.forEach(([a, b]) => {
      const box = `x="${(pad.l + a * bw + 1).toFixed(1)}" y="${y0}" width="${Math.max(3, (b - a) * bw - 2).toFixed(1)}" height="${rowH - 6}"`;
      g += `<rect class="gantt-bar" style="fill:${r.color}" ${box} rx="5"><title>${esc(r.label)}</title></rect>`;
    });
    if (r.blocks.length) g += ganttLabel(r, y0 + rowH / 2 + 0.5, bw, w, pad);
  });
  return `<svg class="ch gantt" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(t('ganttAria'))}">${g}</svg>`;
}

/** Label inside the first block when it fits, otherwise just after it (or before it near the right edge). */
function ganttLabel(r, y, bw, w, pad) {
  const [a, b] = r.blocks[0];
  const text = r.short || '';
  const tw = text.length * 6.2 + 12;
  const x0 = pad.l + a * bw;
  const x1 = pad.l + b * bw;
  if (x1 - x0 >= tw) return `<text class="gantt-lbl" x="${x0 + 6}" y="${y}">${esc(text)}</text>`;
  if (x1 + tw < w - pad.r) return `<text class="gantt-lbl out" x="${x1 + 5}" y="${y}">${esc(text)}</text>`;
  return `<text class="gantt-lbl out" x="${x0 - 5}" y="${y}" text-anchor="end">${esc(text)}</text>`;
}

/** Hour × day heatmap. vals[d][h]; colour from the theme's accent with opacity by value. */
function heatmapSvg(w, vals, { color = 'var(--sun)', labels = [], max = null } = {}) {
  const days = vals.length;
  const pad = { l: 34, r: 8, t: 6, b: 22 };
  const cw = (w - pad.l - pad.r) / Math.max(1, days);
  const ch = 9;
  const h = pad.t + 24 * ch + pad.b;
  const top = max || Math.max(1e-6, ...vals.flat());
  let g = '';
  vals.forEach((col, d) => col.forEach((v, hr) => {
    const op = clamp(v / top, 0, 1);
    const box = `x="${(pad.l + d * cw).toFixed(1)}" y="${pad.t + hr * ch}" width="${Math.max(1, cw - 0.6).toFixed(1)}" height="${ch - 0.6}"`;
    g += `<rect data-i="${d * 24 + hr}" ${box} style="fill:${color};fill-opacity:${(0.06 + op * 0.94).toFixed(2)}"/>`;
  }));
  for (let hr = 0; hr < 24; hr += 6) g += `<text x="${pad.l - 6}" y="${pad.t + hr * ch + 8}" text-anchor="end">${pad2(hr)}</text>`;
  labels.forEach(([d, lbl]) => (g += `<text x="${pad.l + d * cw}" y="${h - 6}">${esc(lbl)}</text>`));
  return `<svg class="ch heat" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(t('heatAria'))}">${g}</svg>`;
}

/** Small inline sparkline (no axes). */
function sparkSvg(vals, { w = 120, h = 32, cls = 'spark' } = {}) {
  const lo = Math.min(...vals);
  const hi = Math.max(...vals);
  const x = lin(0, vals.length - 1, 2, w - 2);
  const y = lin(lo, hi === lo ? lo + 1 : hi, h - 3, 3);
  return `<svg class="${cls}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="M${vals.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join('L')}"/></svg>`;
}

// ---------- plan service: one cached optimisation per set of inputs, shared by Home and the Plan page ----------
const PLAN = { key: '', res: null, busy: null, busyKey: '', progress: null };

function planKey() {
  const s = S.settings;
  const wx = S.weather[S.system.city];
  return hashStr(JSON.stringify([S.system, S.loads, S.tariff, S.outages, s.res, s.horizon, s.planDay, s.reserveSoc, s.reservePenalty, s.voll, wx ? wx.syncedAt : 0, isoDate()]));
}

function invalidatePlan() {
  PLAN.key = '';
  PLAN.res = null;
}

/** Resolve the current plan, optimising only when an input changed. */
function getPlan() {
  const key = planKey();
  if (PLAN.res && PLAN.key === key) return Promise.resolve(PLAN.res);
  if (PLAN.busy && PLAN.busyKey === key) return PLAN.busy;
  PLAN.busyKey = key;
  PLAN.progress = { runs: 0 };
  PLAN.busy = scenarioPlan(planContext()).then(res => {
    if (PLAN.busyKey === key) {
      PLAN.res = res;
      PLAN.key = key;
      PLAN.busy = null;
      planNotices(res);
    }
    return res;
  });
  return PLAN.busy;
}

/**
 * Plan under forecast uncertainty. Today this optimises the single (expected) forecast.
 * TODO(student): build 5–10 cloud scenarios (perturb the hourly cloud cover with the forecast's error spread),
 * then either minimise the expected cost with a shared first-hours decision (two-stage stochastic DP) or the
 * worst case (robust), and show how much reserve SOC the uncertainty is worth.
 */
function scenarioPlan(ctx) {
  return optimisePlan(ctx, { onProgress: st => {
    PLAN.progress = { ...st };
    const el = $('#planProgress');
    if (el) el.textContent = t('pl_progress', { n: st.runs, p: st.pruned });
  } });
}

/** Notices worth an inbox entry after a fresh plan (once per day and kind). */
function planNotices(res) {
  const day = res.ctx.iso;
  const seen = store.get('noticed', {});
  const once = (kind, key, vars, icon) => {
    if (seen[kind] === day) return;
    seen[kind] = day;
    notify(key, vars, icon);
  };
  const saving = res.naive.total - res.plan.total;
  if (saving > 50) once('saving', 'nt_saving', { rs: nf(saving), day: fmtDate(day) }, 'piggy');
  const unmet = res.plan.tot.unmet;
  if (unmet > 0.2) once('unmet', 'nt_unmet', { kwh: nf(unmet, 1) }, 'alert');
  store.set('noticed', seen);
}

/** SOC (%) and flows of the plan at a step, for the home diagram and the BMS simulator. */
function planRowAt(res, k) {
  const rows = res.plan.rows;
  return rows[clamp(k, 0, rows.length - 1)];
}

/** Step index for the current wall-clock time when the plan starts today, else 0. */
function nowStep(res) {
  if (res.ctx.iso !== isoDate()) return 0;
  return clamp(Math.floor(nowHour() / res.ctx.dt), 0, res.ctx.steps - 1);
}

// ---------- plan timeline: energy panel + grid panel + Gantt rows, aligned on one hour axis ----------
function planBands(res) {
  const { P, ctx } = res;
  const bands = [];
  if (ctx.tariff.tou) {
    windows(res.plan.rows, r => inWindow((r.k * ctx.dt) % 24, ctx.tariff.peakFrom, ctx.tariff.peakTo))
      .forEach(w => bands.push({ ...w, cls: 'peak-band', label: t('ch_peak') }));
  }
  if (ctx.regime !== 'offgrid') windows(res.plan.rows, r => !P.gridOn[r.k]).forEach(w => bands.push({ ...w, cls: 'out-band', label: t('ch_outage') }));
  return bands;
}

const xEvery = (w, ctx) => (ctx.steps * ctx.dt > 24 ? (w < 560 ? 12 : 6) : w < 560 ? 6 : 3);

function planTip(res, i) {
  const r = res.plan.rows[i];
  const dt = res.ctx.dt;
  const kw = v => fKW(v / dt, 2);
  const batt = r.chg > 1e-6 ? tipRow('var(--batt)', t('ch_charge'), kw(r.chg)) : r.dis > 1e-6 ? tipRow('var(--batt)', t('ch_discharge'), kw(r.dis)) : '';
  return `<div><b>${hhmm(r.h)}–${hhmm(r.h + dt)}</b></div>${tipRow('var(--sun)', t('ch_pv'), kw(r.pv))}${tipRow('var(--load)', t('ch_load'), kw(r.load))}${batt}`
    + (r.imp > 1e-6 ? tipRow('var(--imp)', t('ch_import'), kw(r.imp)) : '') + (r.exp > 1e-6 ? tipRow('var(--exp)', t('ch_export'), kw(r.exp)) : '')
    + (r.unmet > 1e-6 ? tipRow('var(--imp)', t('ch_unmet'), kw(r.unmet)) : '') + tipRow('var(--batt)', t('ch_soc'), r.soc + '%') + tipRow('var(--ink-3)', t('ch_cost'), fRs(r.cost, 1));
}

/** Energy panel: fixed load + each flexible load stacked, solar area, SOC line(s) on the right axis. */
function planEnergyChart(res, w, { h = 240, cursor = null, compare = false } = {}) {
  const { ctx, P } = res;
  const kw = v => v / ctx.dt;
  const series = [];
  let acc = ctx.base.map(kw);
  series.push({ type: 'area', vals: acc, cls: 'load', noLine: true });
  res.flex.forEach((arr, vi) => {
    const top = acc.map((v, k) => v + kw(arr[k]));
    series.push({ type: 'area', vals: top, base: acc, cls: 'flex', color: FLEX_COLORS[vi % FLEX_COLORS.length], noLine: true });
    acc = top;
  });
  series.push({ type: 'line', vals: acc, cls: 'load-line' });
  series.push({ type: 'area', vals: P.pv.map(kw), cls: 'pv', draw: true });
  series.push({ type: 'dash', value: P.minIdx, axis2: true, cls: 'min-line', label: t('ch_minSoc') });
  const mid = ev => ev.rows.map(r => (r.soc0 + r.soc) / 2);
  if (compare) {
    series.push({ type: 'line', vals: mid(res.naive), axis2: true, cls: 'soc-naive' });
    series.push({ type: 'line', vals: mid(res.inverter), axis2: true, cls: 'soc-inv' });
  }
  series.push({ type: 'line', vals: mid(res.plan), axis2: true, cls: 'soc', draw: true });
  const yMax = niceMax(Math.max(...acc, ...P.pv.map(kw), 0.5));
  return xyChart(w, { h, n: ctx.steps, yMax, y2Max: 100, series, bands: planBands(res), cursor, unit: 'kW',
    xLabels: hourLabels(ctx.dt, xEvery(w, ctx)), tips: i => planTip(res, i), label: t('ch_planAria') });
}

/** Grid panel: import bars up, export bars down (kW). */
function planGridChart(res, w, { h = 96, cursor = null } = {}) {
  const { ctx } = res;
  const imp = res.plan.rows.map(r => r.imp / ctx.dt);
  const exp = res.plan.rows.map(r => -r.exp / ctx.dt);
  const top = niceMax(Math.max(0.5, ...imp));
  const bot = -niceMax(Math.max(0.5, ...exp.map(Math.abs)));
  const series = [{ type: 'bars', vals: imp, cls: 'imp-bar' }, { type: 'bars', vals: exp, cls: 'exp-bar' }];
  return xyChart(w, { h, n: ctx.steps, yMin: bot, yMax: top, tickVals: [bot, top, 0], series, cursor, unit: 'kW', fmt: v => nf(v, Math.max(top, -bot) < 3 ? 1 : 0),
    xLabels: null, pad: { b: 6 }, tips: i => planTip(res, i), label: t('ch_gridAria') });
}

/** One Gantt row per flexible appliance (both days of a 48 h plan share the row). */
function planGantt(res, w) {
  const byItem = new Map();
  res.ctx.vars.forEach((v, vi) => {
    const app = appById(v.item.app);
    if (!byItem.has(v.item.id)) byItem.set(v.item.id, { label: L(app.name), short: shortName(app), icon: app.icon, color: FLEX_COLORS[vi % FLEX_COLORS.length], blocks: [] });
    windows(res.flex[vi].map((e, k) => ({ k, e })), r => r.e > 1e-9).forEach(win => byItem.get(v.item.id).blocks.push([win.a, win.b]));
  });
  return ganttSvg(w, [...byItem.values()], res.ctx.steps);
}
const shortName = app => L(app.name).replace(/\s*\(.*\)/, '');

function planLegend(res) {
  const flex = res.ctx.vars.filter((v, i, a) => a.findIndex(x => x.item.id === v.item.id) === i)
    .map(v => `<span class="lg"><i style="background:${FLEX_COLORS[res.ctx.vars.indexOf(v) % FLEX_COLORS.length]}"></i>${esc(shortName(appById(v.item.app)))}</span>`).join('');
  return `<div class="legend"><span class="lg"><i class="l-pv"></i>${t('ch_pv')}</span><span class="lg"><i class="l-load"></i>${t('ch_fixedLoad')}</span>${flex}
    <span class="lg"><i class="l-soc"></i>${t('ch_soc')}</span><span class="lg"><i class="l-imp"></i>${t('ch_import')}</span><span class="lg"><i class="l-exp"></i>${t('ch_export')}</span>
    <span class="lg"><i class="l-out"></i>${t('ch_outage')}</span>${res.ctx.tariff.tou ? `<span class="lg"><i class="l-peak"></i>${t('ch_peak')}</span>` : ''}</div>`;
}

/** Mount the three aligned panels into a container that has .pc-energy, .pc-grid and .pc-gantt children. */
function mountPlanChart(root, res, opts = {}) {
  mountChart($('.pc-energy', root), w => planEnergyChart(res, w, opts));
  mountChart($('.pc-grid', root), w => planGridChart(res, w, { cursor: opts.cursor }));
  mountChart($('.pc-gantt', root), w => planGantt(res, w));
}

const planChartHtml = res => `<div class="pchart"><div class="pc-energy"></div><div class="pc-grid"></div><div class="pc-gantt"></div></div>${planLegend(res)}`;

// ---------- Home: live energy-flow diagram, 24-hour scrubber, KPIs and the day plan ----------
const HOME = { k: null, playing: 0, res: null };

const FLOW_LAYOUTS = {
  wide: { w: 760, h: 340, sun: [112, 96], home: [648, 96], batt: [112, 262], grid: [648, 262], hub: [380, 182], gen: [380, 312], arc: [380, 30, 120, 26] },
  tall: { w: 360, h: 470, sun: [72, 132], home: [288, 132], batt: [72, 378], grid: [288, 378], hub: [180, 256], gen: [180, 440], arc: [180, 18, 66, 24] },
};

function renderHome() {
  stopPlay();
  const city = cityById(S.system.city);
  const iso = addDays(isoDate(), S.settings.planDay || 0);
  const st = sunTimes(iso, S.system.lat, S.system.lon);
  $('#view').innerHTML = `
    <div class="page-head home-head"><div><span class="tag">${t('hm_kicker')}</span><h2>${esc(fmtLongDate(iso))}</h2>
      <p class="row"><span class="chip">${ic('map-pin')}${esc(L(city.name))}</span><span class="chip sun">${ic('sunrise')}<span class="num">${hhmm(st.rise)}</span></span>
      <span class="chip sun">${ic('sunset')}<span class="num">${hhmm(st.set)}</span></span><span class="chip" id="homeSrc">${ic('cloud-sun')}${wxSourceLabel()}</span></p></div>
      <div class="row"><a class="btn ghost sm" href="#plan">${ic('gantt')}${t('hm_openPlan')}</a><a class="btn sun sm" href="#forecast">${ic('cloud-sun')}${t('hm_forecast')}</a></div></div>
    <div class="home-grid">
      <section class="card flow-card" id="flowCard" aria-labelledby="flowTitle">
        <div class="hd"><div><h3 id="flowTitle">${ic('flow')}${t('hm_flowTitle')}</h3><p>${t('hm_flowSub')}</p></div><span class="chip" id="flowMode"></span></div>
        <div class="flow-wrap" id="flowSvg"><div class="skeleton" style="height:300px"></div></div>
        <div class="scrub" id="scrub"></div>
      </section>
      <aside class="stack">
        <section class="card" id="nowCard"><div class="skeleton" style="height:210px"></div></section>
        <section class="card" id="outCard"><div class="skeleton" style="height:120px"></div></section>
      </aside>
    </div>
    <div class="g4 stagger mt" id="homeKpis">${Array(4).fill('<div class="tile"><div class="skeleton" style="height:58px"></div></div>').join('')}</div>
    <section class="card mt" id="dayPlan"><div class="hd"><div><h3>${ic('gantt')}${t('hm_dayPlan')}</h3><p id="planProgress">${t('pl_working')}</p></div></div>
      <div class="skeleton" style="height:260px"></div></section>`;
  getPlan().then(res => curRoute === 'home' && fillHome(res));
}

function fillHome(res) {
  HOME.res = res;
  if (HOME.k == null || HOME.k >= res.ctx.steps) HOME.k = nowStep(res);
  mountChart($('#flowSvg'), w => flowSvg(w, res), () => updateFlow());
  renderScrubber(res);
  renderHomeKpis(res);
  renderOutageCard(res);
  const dp = $('#dayPlan');
  const reasons = planReasons(res).slice(0, 6);
  dp.innerHTML = `<div class="hd"><div><h3>${ic('gantt')}${t('hm_dayPlan')}</h3><p>${t('hm_dayPlanSub', { n: res.stats.runs })}</p></div>
      <div class="row">${checkChip(res)}<a class="btn ghost sm" href="#plan">${t('hm_allDecisions')} ${ic('chevron-right', 'flip')}</a></div></div>
    ${planChartHtml(res)}
    <ol class="reasons compact stagger">${reasons.map(reasonHtml).join('')}</ol>`;
  mountPlanChart(dp, res, { h: 220, cursor: HOME.k });
  animateIn(dp);
  updateFlow();
}

const checkChip = res => {
  const c = checkPlan(res.P, res.plan);
  return `<span class="chip ${c.ok ? 'exp' : 'imp'}">${ic(c.ok ? 'shield-check' : 'alert')}${c.ok ? t('pl_checkOk', { n: res.ctx.steps }) : t('pl_checkBad', { n: c.bad.length })}</span>`;
};

const reasonHtml = r => `<li class="rs-${r.tone}"><span class="rs-time num">${hhmm(r.h % 24)}</span><span class="rs-ic">${ic(r.icon)}</span><span class="rs-text">${esc(r.text)}</span></li>`;

// ---------- the energy-flow diagram ----------
function flowSvg(w, res) {
  const lay = w >= 600 ? FLOW_LAYOUTS.wide : FLOW_LAYOUTS.tall;
  const gen = S.system.gen.on;
  const links = [['sun', lay.sun], ['home', lay.home], ['batt', lay.batt], ['grid', lay.grid]];
  let g = sunArcSvg(lay, res);
  links.forEach(([id, p]) => {
    const d = linkPath(p, lay.hub);
    g += `<path class="ftrack" d="${d}"/><path class="flow fl-${id}" id="fl-${id}" d="${d}"/>`;
  });
  if (gen) {
    const d = `M${lay.gen[0]},${lay.gen[1] - 34}L${lay.hub[0]},${lay.hub[1] + 48}`;
    g += `<path class="ftrack" d="${d}"/><path class="flow fl-gen" id="fl-gen" d="${d}"/>`;
  }
  // In the portrait layout the top nodes link downwards, so their labels go above the disc.
  const above = lay === FLOW_LAYOUTS.tall;
  g += flowNode('sun', lay.sun, 'sun', t('fl_solar'), above);
  g += flowNode('home', lay.home, 'home', t('fl_home'), above);
  g += flowNode('grid', lay.grid, 'pylon', t('fl_grid'));
  g += battNode(lay.batt);
  g += hubNode(lay.hub);
  if (gen) g += flowNode('gen', lay.gen, 'generator', t('fl_gen'));
  const aria = 'role="img" aria-labelledby="flowTitle" aria-describedby="flowDesc"';
  return `<svg class="flow-svg ${above ? 'tall' : ''}" viewBox="0 0 ${lay.w} ${lay.h}" ${aria}><desc id="flowDesc"></desc>${g}</svg>`;
}

/** Curved link from a node edge to the inverter hub edge (vertical S-curve in the portrait layout). */
function linkPath(a, hub) {
  const dx = hub[0] - a[0];
  const dy = hub[1] - a[1];
  if (Math.abs(dy) > Math.abs(dx)) {
    const sy = a[1] + Math.sign(dy) * 44;
    const ex = hub[0] - Math.sign(dx) * 30;
    const ey = hub[1] - Math.sign(dy) * 46;
    return `M${a[0]},${sy}C${a[0]},${sy + dy * 0.45} ${ex},${ey - dy * 0.35} ${ex},${ey}`;
  }
  const sx = a[0] + Math.sign(dx) * 44;
  const ex = hub[0] - Math.sign(dx) * 50;
  const ey = hub[1] + (a[1] < hub[1] ? -16 : 16);
  return `M${sx},${a[1]}C${sx + dx * 0.45},${a[1]} ${ex - dx * 0.3},${ey} ${ex},${ey}`;
}

function flowNode(id, [x, y], icon, label, above = false) {
  const ly = above ? y - 70 : y + 60;
  return `<g class="fnode n-${id}" id="fn-${id}"><circle class="halo" cx="${x}" cy="${y}" r="44"/><circle class="disc" cx="${x}" cy="${y}" r="38"/>
    <use href="#i-${icon}" class="nic" x="${x - 15}" y="${y - 24}" width="30" height="30"/>
    <text class="nval" id="fv-${id}" x="${x}" y="${y + 21}" text-anchor="middle">0.0</text>
    <text class="nlbl" x="${x}" y="${ly}" text-anchor="middle">${esc(label)}</text>
    <text class="nstate" id="fs-${id}" x="${x}" y="${ly + 16}" text-anchor="middle"></text></g>`;
}

function battNode([x, y]) {
  return `<g class="fnode n-batt" id="fn-batt"><circle class="halo" cx="${x}" cy="${y}" r="44"/><circle class="disc" cx="${x}" cy="${y}" r="38"/>
    <rect class="bshell" x="${x - 13}" y="${y - 25}" width="26" height="42" rx="5"/><rect class="bcap" x="${x - 5}" y="${y - 30}" width="10" height="5" rx="1.5"/>
    <rect class="bfill" id="battFill" x="${x - 10}" y="${y + 14}" width="20" height="0" rx="2.5" data-bottom="${y + 14}"/>
    <text class="nval soc" id="fv-soc" x="${x}" y="${y + 33}" text-anchor="middle">0%</text>
    <text class="nlbl" x="${x}" y="${y + 60}" text-anchor="middle">${t('fl_battery')}</text>
    <text class="nstate" id="fs-batt" x="${x}" y="${y + 76}" text-anchor="middle"></text></g>`;
}

function hubNode([x, y]) {
  return `<g class="fnode n-hub"><rect class="hub" x="${x - 48}" y="${y - 46}" width="96" height="92" rx="20"/>
    <use href="#i-inverter" class="nic" x="${x - 15}" y="${y - 32}" width="30" height="30"/>
    <text class="nval" id="fv-hub" x="${x}" y="${y + 14}" text-anchor="middle">0.0</text>
    <text class="nsub" x="${x}" y="${y + 32}" text-anchor="middle">${t('fl_inverter', { kw: nf(S.system.pv.invKw, 1) })}</text></g>`;
}

/** Day arc from sunrise to sunset with the sun at the scrubber time. */
function sunArcSvg(lay, res) {
  const [cx, top, rx, ry] = lay.arc;
  const st = sunTimes(res.ctx.iso, S.system.lat, S.system.lon);
  const base = top + ry;
  return `<g class="sunarc"><path class="arc" d="M${cx - rx},${base}A${rx},${ry} 0 0 1 ${cx + rx},${base}"/>
    <line class="horizon" x1="${cx - rx - 18}" x2="${cx + rx + 18}" y1="${base}" y2="${base}"/>
    <text class="arc-t" x="${cx - rx}" y="${base + 13}" text-anchor="middle">${hhmm(st.rise)}</text><text class="arc-t" x="${cx + rx}" y="${base + 13}" text-anchor="middle">${hhmm(st.set)}</text>
    <circle class="sundot" id="sunDot" cx="${cx}" cy="${top}" r="7" data-rise="${st.rise}" data-set="${st.set}" data-cx="${cx}" data-rx="${rx}" data-ry="${ry}" data-base="${base}"/></g>`;
}

/** Move every animated part of the diagram to step HOME.k (no re-render, so dash animations stay smooth). */
function updateFlow() {
  const res = HOME.res;
  if (!res || !$('#fl-sun')) return;
  const r = planRowAt(res, HOME.k);
  const dt = res.ctx.dt;
  const p = { sun: r.pv / dt, home: r.load / dt, batt: (r.dis - r.chg) / dt, grid: (r.imp - r.exp) / dt, gen: 0 };
  if (S.system.gen.on && r.unmet > 0) p.gen = r.unmet / dt;
  const pmax = Math.max(S.system.pv.invKw, S.system.pv.kwp * 0.8, 1);
  setFlow('sun', p.sun, 1, pmax);
  setFlow('home', p.home, -1, pmax);
  setFlow('batt', Math.abs(p.batt), p.batt >= 0 ? 1 : -1, pmax);
  setFlow('grid', Math.abs(p.grid), p.grid >= 0 ? 1 : -1, pmax);
  if ($('#fl-gen')) setFlow('gen', p.gen, 1, pmax);
  const soc = Math.round(((r.soc0 + r.soc) / 2));
  $('#fv-sun').textContent = fKW(p.sun);
  $('#fv-home').textContent = fKW(p.home);
  $('#fv-grid').textContent = fKW(Math.abs(p.grid));
  $('#fv-soc').textContent = soc + '%';
  $('#fv-hub').textContent = fKW(Math.min(S.system.pv.invKw, p.sun + Math.max(0, p.batt)));
  if ($('#fv-gen')) $('#fv-gen').textContent = fKW(p.gen);
  const fill = $('#battFill');
  const hgt = (35 * soc) / 100;
  fill.setAttribute('height', hgt.toFixed(1));
  fill.setAttribute('y', (Number(fill.dataset.bottom) - hgt).toFixed(1));
  fill.classList.toggle('low', soc <= res.P.minIdx + 5);
  updateFlowStates(res, r, p);
  moveSun(res);
  updateNowCard(res, r, p, soc);
}

function setFlow(id, kw, dir, pmax) {
  const el = $('#fl-' + id);
  const f = clamp(kw / pmax, 0, 1);
  el.style.strokeWidth = (2.5 + 9 * f).toFixed(1);
  el.style.opacity = kw > 0.02 ? 1 : 0;
  el.style.animationDuration = (2.6 - 1.9 * f).toFixed(2) + 's';
  el.classList.toggle('rev', dir < 0);
}

function updateFlowStates(res, r, p) {
  const out = !res.P.gridOn[r.k] && res.ctx.regime !== 'offgrid';
  $('#fs-batt').textContent = p.batt > 0.02 ? t('fl_discharging') : p.batt < -0.02 ? t('fl_charging') : t('fl_idle');
  $('#fs-grid').textContent = res.ctx.regime === 'offgrid' ? t('fl_offgrid') : out ? t('fl_shedding') : p.grid > 0.02 ? t('fl_importing') : p.grid < -0.02 ? t('fl_exporting') : t('fl_idle');
  $('#fs-sun').textContent = r.curt > 0.02 ? t('fl_curtailed', { kw: nf(r.curt / res.ctx.dt, 1) }) : '';
  $('#fs-home').textContent = r.unmet > 0.02 ? t('fl_unserved', { kw: nf(r.unmet / res.ctx.dt, 1) }) : '';
  $('#fn-grid').classList.toggle('off', out || res.ctx.regime === 'offgrid');
  $('#flowMode').innerHTML = `${ic(out ? 'plug-off' : 'clock')}<span class="num">${hhmm(r.h)}–${hhmm(r.h + res.ctx.dt)}</span>`;
  $('#flowDesc').textContent = t('fl_desc', { time: hhmm(r.h), pv: nf(p.sun, 1), load: nf(p.home, 1), soc: r.soc });
}

function moveSun(res) {
  const dot = $('#sunDot');
  const hod = (HOME.k + 0.5) * res.ctx.dt % 24;
  const rise = Number(dot.dataset.rise);
  const set = Number(dot.dataset.set);
  const f = (hod - rise) / (set - rise);
  const up = f > 0 && f < 1;
  const ang = Math.PI * (1 - clamp(f, 0, 1));
  dot.setAttribute('cx', (Number(dot.dataset.cx) + Number(dot.dataset.rx) * Math.cos(ang)).toFixed(1));
  dot.setAttribute('cy', (Number(dot.dataset.base) - Number(dot.dataset.ry) * Math.sin(ang)).toFixed(1));
  dot.classList.toggle('night', !up);
}

// ---------- scrubber ----------
function renderScrubber(res) {
  const n = res.ctx.steps;
  const outs = windows(res.plan.rows, r => !res.P.gridOn[r.k] && res.ctx.regime !== 'offgrid');
  const pvMax = Math.max(...res.P.pv, 1e-6);
  const shade = res.P.pv.map((v, k) => `<i style="left:${(100 * k) / n}%;width:${100 / n + 0.1}%;opacity:${(0.12 + (0.88 * v) / pvMax).toFixed(2)}"></i>`).join('');
  $('#scrub').innerHTML = `<button type="button" class="ibtn" id="playBtn" aria-label="${t('hm_play')}">${ic('play')}</button>
    <div class="scrub-main"><div class="scrub-time"><b class="num" id="scrubTime"></b><button type="button" class="btn link sm" id="nowBtn">${ic('clock')}${t('hm_now')}</button></div>
      <div class="scrub-track"><div class="sk-sun">${shade}</div>${outs.map(o => `<span class="sk-out" style="left:${(100 * o.a) / n}%;width:${(100 * (o.b - o.a)) / n}%"></span>`).join('')}
      <input type="range" id="scrubIn" min="0" max="${n - 1}" step="1" value="${HOME.k}" aria-label="${t('hm_scrubAria')}"></div>
      <div class="scrub-ticks num">${[0, 6, 12, 18, 24].map(h => `<span>${pad2(h)}</span>`).join('')}</div></div>`;
  $('#scrubIn').oninput = e => setStep(Number(e.target.value));
  $('#playBtn').onclick = togglePlay;
  $('#nowBtn').onclick = () => setStep(nowStep(res));
  setStep(HOME.k);
}

function setStep(k) {
  const res = HOME.res;
  if (!res) return;
  HOME.k = clamp(k, 0, res.ctx.steps - 1);
  const inp = $('#scrubIn');
  if (inp && Number(inp.value) !== HOME.k) inp.value = HOME.k;
  if ($('#scrubTime')) $('#scrubTime').textContent = `${hhmm(HOME.k * res.ctx.dt)}–${hhmm((HOME.k + 1) * res.ctx.dt)}`;
  moveCursor($('#dayPlan'), HOME.k, res.ctx.steps);
  updateFlow();
}

/** Slide the dashed cursor line of each mounted plan panel to step k. */
function moveCursor(root, k, n) {
  if (!root) return;
  $$('svg.ch line.cursor', root).forEach(line => {
    const w = Number(line.ownerSVGElement.getAttribute('width'));
    const x = PAD.l + (k + 0.5) * ((w - PAD.l - PAD.r) / n);
    line.setAttribute('x1', x);
    line.setAttribute('x2', x);
  });
}

function togglePlay() {
  if (HOME.playing) return stopPlay();
  HOME.playing = setInterval(() => setStep((HOME.k + 1) % HOME.res.ctx.steps), calm() ? 1200 : 650);
  $('#playBtn').innerHTML = ic('pause');
  $('#playBtn').setAttribute('aria-label', t('hm_pause'));
}

function stopPlay() {
  clearInterval(HOME.playing);
  HOME.playing = 0;
  if ($('#playBtn')) {
    $('#playBtn').innerHTML = ic('play');
    $('#playBtn').setAttribute('aria-label', t('hm_play'));
  }
}

// ---------- side cards and KPIs ----------
function updateNowCard(res, r, p, soc) {
  const card = $('#nowCard');
  if (!card) return;
  const dt = res.ctx.dt;
  const rate = res.P.impRate[r.k];
  const peak = res.ctx.tariff.tou && inWindow(r.h % 24, res.ctx.tariff.peakFrom, res.ctx.tariff.peakTo);
  const bms = S.settings.feedBms && BMS.sim ? `<span class="chip batt">${ic('bluetooth')}${t('hm_bmsLive', { soc: Math.round(BMS.soc) })}</span>` : '';
  const block = planReasons(res).filter(x => x.k <= r.k).pop();
  const battLabel = p.batt < -0.02 ? t('fl_charging') : p.batt > 0.02 ? t('fl_discharging') : t('hm_rowBattIdle');
  const gridLabel = p.grid > 0.02 ? t('fl_importing') : p.grid < -0.02 ? t('fl_exporting') : t('hm_rowGridIdle');
  card.innerHTML = `<div class="hd"><h3>${ic('clock')}${t('hm_atTime', { time: hhmm(r.h) })}</h3>${bms}</div>
    <ul class="flows">
      <li>${ic('sun', 'c-sun')}<span>${t('hm_rowSolar')}</span><b class="num">${fKW(p.sun)}</b></li>
      <li>${ic('home', 'c-load')}<span>${t('hm_rowHome')}</span><b class="num">${fKW(p.home)}</b></li>
      <li>${ic(p.batt < 0 ? 'battery-charging' : 'battery', 'c-batt')}<span>${battLabel} · ${soc}%</span><b class="num">${fKW(Math.abs(p.batt))}</b></li>
      <li>${ic('pylon', p.grid > 0 ? 'c-imp' : 'c-exp')}<span>${gridLabel}</span><b class="num">${fKW(Math.abs(p.grid))}</b></li>
      <li>${ic('receipt', 'c-grid')}<span>${peak ? t('hm_peakRate') : t('hm_offRate')}</span><b class="num">${fRs(rate, 1)}/kWh</b></li>
    </ul>${block ? `<p class="why">${ic(block.icon)}<span>${esc(block.text)}</span></p>` : ''}`;
}

function renderHomeKpis(res) {
  const pv = res.plan.tot.pv;
  const load = res.plan.tot.load;
  const selfSuff = load > 0 ? clamp((load - res.plan.tot.imp) / load, 0, 1) * 100 : 0;
  const save = res.naive.total - res.plan.total;
  const vsInv = res.inverter.total - res.plan.total;
  const peak = res.plan.rows.reduce((a, r) => (r.pv > a.pv ? r : a));
  $('#homeKpis').innerHTML = [
    tile({ icon: 'sun', label: t('hm_kSolar'), value: pv, dec: 1, unit: 'kWh', foot: t('hm_kSolarFoot', { kw: nf(peak.pv / res.ctx.dt, 1), time: hhmm(peak.h) }), color: 'var(--sun)' }),
    tile({ icon: 'home', label: t('hm_kSelf'), value: selfSuff, suf: '%', foot: t('hm_kSelfFoot', { kwh: nf(load, 1) }), color: 'var(--load)' }),
    tile({ icon: 'piggy', label: t('hm_kSave'), value: save, pre: 'Rs ', foot: t('hm_kSaveFoot', { rs: nf(vsInv) }), color: 'var(--exp)' }),
    tile({ icon: 'receipt', label: t('hm_kCost'), value: res.plan.total, pre: 'Rs ', foot: t('hm_kCostFoot', { imp: nf(res.plan.tot.imp, 1), exp: nf(res.plan.tot.exp, 1) }), color: 'var(--imp)' }),
  ].join('');
  animateIn($('#homeKpis'));
}

function renderOutageCard(res) {
  const outs = windows(res.plan.rows, r => !res.P.gridOn[r.k] && res.ctx.regime !== 'offgrid');
  const card = $('#outCard');
  if (!outs.length) {
    card.innerHTML = `<div class="hd"><h3>${ic('plug-off')}${t('hm_outTitle')}</h3></div><p class="muted">${t('hm_outNone')}</p><a class="btn ghost sm" href="#outage">${t('hm_outEdit')}</a>`;
    return;
  }
  card.innerHTML = `<div class="hd"><h3>${ic('plug-off')}${t('hm_outTitle')}</h3><a class="btn link sm" href="#outage">${t('hm_outEdit')}</a></div>
    <ul class="outs">${outs.map(o => {
      const soc = res.plan.rows[o.a].soc0;
      const ok = soc >= res.ctx.reserveSoc;
      const need = sum(res.plan.rows.slice(o.a, o.b).map(r => r.load));
      return `<li><span class="num">${hhmm(o.a * res.ctx.dt)}–${hhmm(o.b * res.ctx.dt)}</span><span class="grow">${t('hm_outNeed', { kwh: nf(need, 1) })}</span>
        <span class="chip ${ok ? 'exp' : 'warn'}">${ic(ok ? 'shield-check' : 'alert')}${t('hm_outSoc', { soc })}</span></li>`;
    }).join('')}</ul>`;
}

/** Read the form into a system object; with strict = true invalid fields block the save. */
function readSystemForm(strict = true) {
  const n = (id, lo, hi) => readNum(id, lo, hi);
  const v = {
    city: $('#syCity').value, lat: n('syLat', 23, 37.5), lon: n('syLon', 60, 78), owner: $('#syOwner').value.trim().slice(0, 60),
    pv: { kwp: n('syKwp', 0.5, 100), tilt: n('syTilt', 0, 90), azimuth: n('syAz', 0, 359), tempCoef: n('syTc', -0.6, 0),
      noct: n('syNoct', 35, 55), losses: n('syLoss', 0, 40), invKw: n('syInv', 0.5, 50) },
    batt: { kwh: n('syKwh', 0.5, 200), chem: $('#syChem').value, minSoc: n('syMin', 0, 80), chgKw: n('syChg', 0.1, 50), disKw: n('syDis', 0.1, 50), rte: n('syRte', 50, 100),
      cycles: n('syCyc', 100, 20000), price: n('syPrice', 0, 1e7), installed: $('#syInst').value || S.system.batt.installed, soc0: n('sySoc0', 0, 100) },
    grid: { disco: $('#syDisco').value, sanctioned: n('sySan', 1, 100), regime: $('#syRegime').value, exportLimit: n('syExp', 0, 100), gridCharge: $('#syGridChg').checked },
    gen: { on: $('#syGenOn').checked, kw: n('syGenKw', 0.5, 50), lph: n('syGenL', 0.1, 20), price: n('syGenP', 50, 1000) },
  };
  const bad = $$('#syForm .field.bad').length;
  if (bad && strict) return null;
  return bad ? null : v;
}

function saveSystem() {
  const v = readSystemForm(true);
  if (!v) {
    toast(t('err_fix'), 'bad');

  S.system = v;
  persist('system');
  logEvent('ev_profile', {}, 'panel');

}

/** One row of a check list: ok / warn / info with the matching icon. */
const checkItem = (lvl, text, icon = null) => `<li class="ck-${lvl}">${ic(icon || (lvl === 'ok' ? 'check-circle' : lvl === 'warn' ? 'alert' : 'info'))}<span>${text}</span></li>`;

/** Rule of thumb for a fixed annual tilt in the subcontinent: about 0.76 × latitude + 3°. */
const optimalTilt = lat => Math.round(0.76 * lat + 3.1);

/** Engineering sanity checks and derived numbers for the side panel. */
function systemChecks(s) {
  const out = [];
  const ratio = s.pv.kwp / s.pv.invKw;
  out.push(ratio > 1.35 ? ['warn', 'sc_dcacHigh', { r: nf(ratio, 2) }] : ratio < 0.9 ? ['info', 'sc_dcacLow', { r: nf(ratio, 2) }] : ['ok', 'sc_dcacOk', { r: nf(ratio, 2) }]);
  const cRate = Math.max(s.batt.chgKw, s.batt.disKw) / s.batt.kwh;
  const cMax = s.batt.chem === 'lfp' ? 0.6 : 0.25;
  out.push(cRate > cMax ? ['warn', 'sc_cHigh', { c: nf(cRate, 2), m: cMax }] : ['ok', 'sc_cOk', { c: nf(cRate, 2) }]);
  const chem = CHEMS[s.batt.chem];
  if (s.batt.minSoc < chem.minSoc) out.push(['warn', 'sc_minSoc', { a: s.batt.minSoc, b: chem.minSoc }]);
  if (Math.abs(s.pv.azimuth - 180) > 45) out.push(['info', 'sc_az', { a: s.pv.azimuth }]);
  if (Math.abs(s.pv.tilt - optimalTilt(s.lat)) > 15) out.push(['info', 'sc_tilt', { a: s.pv.tilt, b: optimalTilt(s.lat) }]);
  if (canExportIn(s.grid.regime) && s.grid.exportLimit > s.pv.invKw) out.push(['info', 'sc_exp']);
  if (s.pv.invKw > s.grid.sanctioned * 1.5 && s.grid.regime !== 'offgrid') out.push(['info', 'sc_sanction', { s: s.grid.sanctioned }]);
  if (s.grid.regime === 'offgrid' && !s.gen.on) out.push(['warn', 'sc_offgrid']);
  return out;
}

function renderSystemSide(s) {
  const checks = systemChecks(s);
  $('#syChecks').innerHTML = `<div class="hd"><h3>${ic('list-checks')}${t('sy_checks')}</h3></div>
    <ul class="checks">${checks.map(([lvl, key, vars]) => checkItem(lvl, t(key, vars))).join('')}</ul>`;
  const wear = s.batt.price / (s.batt.cycles * s.batt.kwh * 2);
  const night = fixedProfile(S.loads, 24, 1).filter((_, h) => h >= 18 || h < 6);
  const nightKw = Math.max(0.05, mean(night));
  const backup = (s.batt.kwh * (1 - s.batt.minSoc / 100) * Math.sqrt(s.batt.rte / 100)) / nightKw;
  const clear = sum(forecastSeries(s, isoDate(), 24, 1, { clear: true }).map(r => r.kwh));
  $('#syDerived').innerHTML = `<div class="hd"><h3>${ic('calculator')}${t('sy_derived')}</h3></div><dl class="dl">
    <dt>${t('sy_wear')}</dt><dd class="num">${fRs(wear, 2)}/kWh</dd>
    <dt>${t('sy_wearFormula')}</dt><dd class="num tiny">${nf(s.batt.price)} / (${nf(s.batt.cycles)} × ${s.batt.kwh} × 2)</dd>
    <dt>${t('sy_backup')}</dt><dd class="num">${nf(backup, 1)} h</dd>
    <dt>${t('sy_clearToday')}</dt><dd class="num">${fKWh(clear)}</dd>
    <dt>${t('sy_specific')}</dt><dd class="num">${nf(clear / s.pv.kwp, 2)} kWh/kWp</dd>
    ${s.gen.on ? `<dt>${t('sy_genCost')}</dt><dd class="num">${fRs(genCostPerKWh(s.gen), 1)}/kWh</dd>` : ''}
    <dt>${t('sy_capex')}</dt><dd class="num">${fRsK(investment(s, S.tariff))}</dd></dl>`;
}

/** Sun path: elevation against azimuth for the chosen day and both solstices, hour marks, panel azimuth. */
function sunPathSvg(w, s, iso) {
  const h = 190;
  const pad = { l: 34, r: 10, t: 10, b: 24 };
  const x = lin(45, 315, pad.l, w - pad.r);
  const y = lin(0, 90, h - pad.b, pad.t);
  const path = (dIso, cls) => {
    const n = dayOfYear(dIso);
    const pts = [];
    for (let m = 0; m <= 24 * 12; m++) {
      const p = sunPosition(n, m / 12, s.lat, s.lon);
      if (p.elevation > 0 && p.azimuth > 45 && p.azimuth < 315) pts.push(`${x(p.azimuth).toFixed(1)},${y(p.elevation).toFixed(1)}`);
    }
    return pts.length ? `<path class="${cls}" d="M${pts.join('L')}"/>` : '';
  };
  const yr = iso.slice(0, 4);
  let g = '';
  [0, 30, 60, 90].forEach(e => (g += `<line class="gl" x1="${pad.l}" x2="${w - pad.r}" y1="${y(e)}" y2="${y(e)}"/><text x="${pad.l - 6}" y="${y(e) + 3.5}" text-anchor="end">${e}°</text>`));
  [[90, t('dir_e')], [180, t('dir_s')], [270, t('dir_w')]].forEach(([a, l]) => (g += `<text x="${x(a)}" y="${h - 6}" text-anchor="middle">${l}</text>`));
  g += `<line class="panel-az" x1="${x(s.pv.azimuth)}" x2="${x(s.pv.azimuth)}" y1="${pad.t}" y2="${h - pad.b}"/>`;
  g += path(`${yr}-06-21`, 'path-sol') + path(`${yr}-12-21`, 'path-sol') + path(iso, 'path-today');
  const n = dayOfYear(iso);
  for (let hr = 6; hr <= 18; hr += 2) {
    const p = sunPosition(n, hr, s.lat, s.lon);
    if (p.elevation <= 0) continue;
    g += `<circle class="hr-dot" cx="${x(p.azimuth)}" cy="${y(p.elevation)}" r="3.5"/>`;
    g += `<text class="hr-lbl" x="${x(p.azimuth)}" y="${y(p.elevation) - 7}" text-anchor="middle">${pad2(hr)}</text>`;
  }
  return `<svg class="ch" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(t('fc_pathAria'))}">${g}</svg>`;
}

async function fetchForecast() {
  if (FC.busy) return;
  const btn = $('#fcFetch');
  FC.busy = true;
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span>${t('fc_fetching')}`;
  const city = L(cityById(S.system.city).name);
  try {
    if (!navigator.onLine) throw new Error('offline');
    S.weather[S.system.city] = await fetchLiveWeather(S.system);
    persist('weather');
    logEvent('ev_live', { city }, 'globe');
    toast(t('fc_fetched', { city }), 'ok');
  } catch (e) {
    logEvent('ev_liveFail', { city }, 'wifi-off');
    toast(t('fc_fetchFail'), 'bad');
  } finally {
    FC.busy = false;
    if (curRoute === 'forecast') rerender();
  }
}

// ---------- Loads: appliance library, household list, hourly base-load profile ----------
const LD = { cls: 'all', sel: 18 };

/** Per-item kWh for each hour of a typical day with flexible loads at their usual times. */
function loadParts(loads = S.loads) {
  const parts = [{ id: 'misc', label: t('ld_misc'), color: 'var(--ink-3)', vals: loads.misc.map(w => w / 1000) }];
  const fixed = Array(24).fill(0);
  loads.items.filter(it => it.cls === 'fixed').forEach(it => {
    const one = fixedProfile({ items: [it], misc: null }, 24, 1);
    one.forEach((v, h) => (fixed[h] += v));
  });
  parts.push({ id: 'fixed', label: t('ld_fixedAll'), color: 'var(--load)', vals: fixed });
  loads.items.filter(it => it.cls !== 'fixed').forEach((it, i) => {
    const arr = Array(24).fill(0);
    if (it.cls === 'shift') addBlock(arr, it.pref, it.dur / 60, itemKw(it), 1);
    else (it.prefHours || []).forEach(h => addBlock(arr, h, 1, itemKw(it), 1));
    parts.push({ id: it.id, label: shortName(appById(it.app)), color: FLEX_COLORS[i % FLEX_COLORS.length], vals: arr });
  });
  return parts;
}

const itemDaily = it => {
  if (it.cls === 'fixed') return sum(fixedProfile({ items: [it], misc: null }, 24, 1));
  if (it.cls === 'shift') return (itemKw(it) * it.dur) / 60;
  return itemKw(it) * it.want;
};

/** Bar scale for the base-load editor: a little headroom above the largest hour, at least 200 W. */
const baseMax = () => Math.ceil((Math.max(200, ...S.loads.misc) * 1.3) / 100) * 100;

function renderBaseEditor() {
  const misc = S.loads.misc;
  const max = baseMax();
  const bar = (w, h) => `<button type="button" class="bb ${h === LD.sel ? 'on' : ''}" data-h="${h}" aria-label="${t('ld_baseAria', { time: hhmm(h), w })}">`
    + `<i style="height:${(100 * w) / max}%"></i><span class="num">${h % 6 === 0 ? pad2(h) : ''}</span></button>`;
  $('#baseEd').innerHTML = misc.map(bar).join('');
  $('#baseLbl').textContent = t('ld_baseAt', { time: hhmm(LD.sel) });
  $('#baseIn').value = misc[LD.sel];
  $('#baseIn').oninput = () => setBase(LD.sel, numVal($('#baseIn'), 0, 0, 3000), false);
  $('#baseFlat').onclick = () => {
    const avg = Math.round(mean(misc) / 10) * 10;
    S.loads.misc = misc.map(() => avg);
    persist('loads');
    rerender();
  };
  const ed = $('#baseEd');
  const fromPointer = e => {
    const r = ed.getBoundingClientRect();
    let h = Math.floor(((e.clientX - r.left) / r.width) * 24);
    if (document.documentElement.dir === 'rtl') h = 23 - h;
    const w = Math.round(((r.bottom - e.clientY) / r.height) * max / 10) * 10;
    setBase(clamp(h, 0, 23), clamp(w, 0, 3000), true);
  };
  ed.onpointerdown = e => {
    ed.setPointerCapture(e.pointerId);
    fromPointer(e);
    ed.onpointermove = fromPointer;
  };
  ed.onpointerup = () => {
    ed.onpointermove = null;
    persist('loads');
    rerender();
  };
  ed.onkeydown = e => {
    const h = Number(document.activeElement.dataset.h);
    if (!Number.isFinite(h) || !['ArrowUp', 'ArrowDown'].includes(e.key)) return;
    e.preventDefault();
    setBase(h, clamp(S.loads.misc[h] + (e.key === 'ArrowUp' ? 10 : -10), 0, 3000), true);
  };
  $$('.bb', ed).forEach(b => (b.onfocus = () => selectBaseHour(Number(b.dataset.h))));
}

function selectBaseHour(h) {
  LD.sel = h;
  $$('#baseEd .bb').forEach(b => b.classList.toggle('on', Number(b.dataset.h) === h));
  $('#baseLbl').textContent = t('ld_baseAt', { time: hhmm(h) });
  $('#baseIn').value = S.loads.misc[h];
}

function setBase(h, w, live) {
  S.loads.misc[h] = w;
  const max = baseMax();
  $$('#baseEd .bb').forEach(b => ($('i', b).style.height = (100 * S.loads.misc[Number(b.dataset.h)]) / max + '%'));
  selectBaseHour(h);
  $(`#baseEd .bb[data-h="${h}"]`).setAttribute('aria-label', t('ld_baseAria', { time: hhmm(h), w }));
  if (!live) persist('loads');
}

function openLibrary() {

    <div class="lib stagger">${APPLIANCES.map(libItem).join('')}</div>`, { wide: true });

const libItem = a => `<button type="button" class="lib-item" data-app="${a.id}">${ic(a.icon, 'lg')}<b>${esc(L(a.name))}</b>`
  + `<small class="num">${nf(a.w)} W · ${t('ld_surgeX', { x: a.surge })}</small><span class="chip">${t('cls_' + a.cls)}</span></button>`;

function newItem(appId) {
  const a = appById(appId);
  const base = { id: uid('i'), app: a.id, qty: 1, cls: a.cls, essential: false, hours: Array(24).fill(0) };
  if (a.cls === 'shift') Object.assign(base, { earliest: 8, latest: 18, dur: a.dur || 60, pref: 9 });
  if (a.cls === 'comfort') Object.assign(base, { from: 12, to: 24, want: 4, prefHours: [20, 21, 22, 23] });
  if (a.cls === 'fixed') base.hours = hoursOf([[18, 23]]);
  return base;
}

function openItemEditor(it, isNew = false) {
  const app = appById(it.app);
  const draft = JSON.parse(JSON.stringify(it));
  const sh = openModal(`${sheetHead(L(app.name), app.icon)}<form id="itForm" novalidate>
    <div class="fgrid">${numField('itQty', t('ld_qty'), draft.qty, '', { min: 1, max: 50, step: 1 })}
      ${numField('itW', t('ld_watts'), draft.w || app.w, 'W', { min: 1, max: 10000 })}
      ${selectField('itCls', t('ld_class'), LOAD_CLASSES.map(c => [c, t('cls_' + c)]), draft.cls)}</div>
    ${switchField('itEss', t('ld_essential'), draft.essential, t('ld_essentialHint'))}
    <div id="itClsBox"></div>
    <div class="sfoot">${isNew ? '' : `<button type="button" class="btn ghost danger-t" id="itDel">${ic('trash')}${t('delete')}</button>`}<span class="grow"></span>
      <button type="button" class="btn ghost" data-close>${t('cancel')}</button><button class="btn" type="submit">${ic('check')}${t('save')}</button></div></form>`);
  const box = () => itemClassBox(draft, sh);
  box();
  $('#itCls', sh).onchange = () => {
    Object.assign(draft, newItem(draft.app), { id: draft.id, qty: draft.qty, cls: $('#itCls', sh).value });
    if (draft.cls === 'shift' && !draft.dur) Object.assign(draft, { earliest: 8, latest: 18, dur: 60, pref: 9 });
    if (draft.cls === 'comfort' && !draft.want) Object.assign(draft, { from: 12, to: 24, want: 4, prefHours: [20, 21, 22, 23] });
    box();
  };
  $('#itForm', sh).onsubmit = e => {
    e.preventDefault();
    saveItem(draft, sh, isNew);
  };
  if ($('#itDel', sh)) $('#itDel', sh).onclick = () => deleteItem(draft.id);
}

/** Class-specific fields: hour toggles (fixed), window + duration (shiftable), window + hours wanted (comfort). */
function itemClassBox(d, sh) {
  const box = $('#itClsBox', sh);
  const hrBtn = (h, on) => `<button type="button" class="hr ${on ? 'on' : ''}" data-hr="${h}" aria-pressed="${on}">${pad2(h)}</button>`;
  const toggles = (arr, from = 0, to = 24) => `<div class="hours">${Array.from({ length: to - from }, (_, i) => hrBtn(from + i, arr.includes(from + i))).join('')}</div>`;
  if (d.cls === 'fixed') {
    const on = d.hours.map((f, h) => (f > 0 ? h : -1)).filter(h => h >= 0);
    const duty = Math.round((d.duty ?? appById(d.app).duty ?? 1) * 100);
    box.innerHTML = `<p class="field-l">${t('ld_hoursOn')}</p>${toggles(on)}${numField('itDuty', t('ld_duty'), duty, '%', { min: 5, max: 100, hint: t('ld_dutyHint') })}`;
  } else if (d.cls === 'shift') {
    box.innerHTML = `<div class="fgrid">${selectField('itE', t('ld_earliest'), hourOptions(0, 23), d.earliest)}${selectField('itL', t('ld_latest'), hourOptions(1, 24), d.latest)}
      ${numField('itDur', t('ld_dur'), d.dur, 'min', { min: 15, max: 720, step: 15 })}
      ${selectField('itP', t('ld_usual'), hourOptions(0, 23), Math.floor(d.pref))}</div><p class="hint">${t('ld_shiftHint')}</p>`;
  } else {
    box.innerHTML = `<div class="fgrid">${selectField('itF', t('ld_from'), hourOptions(0, 23), d.from)}${selectField('itT', t('ld_to'), hourOptions(1, 24), d.to)}
      ${numField('itWant', t('ld_want'), d.want, 'h', { min: 1, max: 24, step: 1 })}</div>
      <p class="field-l">${t('ld_usualHours')}</p>${toggles(d.prefHours || [], d.from, d.to)}<p class="hint">${t('ld_comfortHint')}</p>`;
    ['itF', 'itT'].forEach(id => ($('#' + id, sh).onchange = () => {
      d.from = Number($('#itF', sh).value);
      d.to = Math.max(d.from + 1, Number($('#itT', sh).value));
      d.prefHours = (d.prefHours || []).filter(h => h >= d.from && h < d.to);
      itemClassBox(d, sh);
    }));
  }
  $$('.hr', box).forEach(b => (b.onclick = () => {
    b.classList.toggle('on');
    b.setAttribute('aria-pressed', b.classList.contains('on'));
  }));
}

function saveItem(d, sh, isNew) {
  const qty = readNum('itQty', 1, 50, sh);
  const w = readNum('itW', 1, 10000, sh);
  if (qty == null || w == null) return toast(t('err_fix'), 'bad');
  const out = { ...d, qty, w: w === appById(d.app).w ? undefined : w, essential: $('#itEss', sh).checked };
  const on = $$('.hr.on', sh).map(b => Number(b.dataset.hr));
  if (d.cls === 'fixed') {
    out.hours = Array.from({ length: 24 }, (_, h) => (on.includes(h) ? 1 : 0));
    out.duty = (readNum('itDuty', 5, 100, sh) ?? 100) / 100;
  } else if (d.cls === 'shift') {
    Object.assign(out, { earliest: Number($('#itE', sh).value), latest: Number($('#itL', sh).value), dur: readNum('itDur', 15, 720, sh), pref: Number($('#itP', sh).value) });
    if (out.dur == null || out.latest - out.earliest < out.dur / 60) return toast(t('ld_errWindow'), 'bad');
    out.pref = clamp(out.pref, out.earliest, out.latest - out.dur / 60);
  } else {
    Object.assign(out, { from: Number($('#itF', sh).value), to: Number($('#itT', sh).value), want: readNum('itWant', 1, 24, sh), prefHours: on });
    if (out.want == null || out.want > out.to - out.from) return toast(t('ld_errWant'), 'bad');
  }
  const i = S.loads.items.findIndex(x => x.id === d.id);
  if (i >= 0) S.loads.items[i] = out;
  else S.loads.items.push(out);
  persist('loads');
  logEvent(isNew ? 'ev_itemAdd' : 'ev_itemEdit', { name: L(appById(d.app).name) }, 'plug');
  closeModal();
  toast(t('saved'), 'ok');
  rerender();
}

async function deleteItem(id) {
  const it = S.loads.items.find(x => x.id === id);
  if (!(await askConfirm(t('ld_delQ', { name: L(appById(it.app).name) }), { danger: true, okText: t('delete') }))) return;
  S.loads.items = S.loads.items.filter(x => x.id !== id);
  persist('loads');
  toast(t('deleted'));
  rerender();
}

function strategyTable(res) {

  const cells = rows.map(([k, ev]) => [t(k), nf(ev.tot.imp, 1), nf(ev.tot.exp, 1), nf(ev.tot.chg + ev.tot.dis, 1), nf(ev.tot.unmet, 1), fRs(ev.total)]);
  return `<div class="tbl-wrap">${tableHtml(heads, cells, i => (i === 0 ? 'best' : ''))}</div>`;

function scheduleTable(res) {

// ---------- Load-shedding planner: weekly feeder schedule, reserve SOC guidance, outage runtime calculator ----------
const OT = { picks: null, soc: null, paint: null };
const WEEKDAYS = [0, 1, 2, 3, 4, 5, 6];

const toMask = wins => {
  const m = Array(24).fill(false);
  wins.forEach(([a, b]) => {
    for (let h = a; h < b; h++) m[h] = true;
  });
  return m;
};

const toWins = mask => {
  const out = [];
  mask.forEach((on, h) => {
    if (!on) return;
    const last = out[out.length - 1];
    if (last && last[1] === h) last[1] = h + 1;
    else out.push([h, h + 1]);
  });
  return out;
};

const fmtHours = h => (Number.isFinite(h) ? t('durHM', { h: Math.floor(h), m: pad2(Math.round((h % 1) * 60) % 60) }) : '∞');
const dayName = (d, opt = 'long') => new Date(2026, 9, 18 + d).toLocaleDateString(locale(), { weekday: opt });

/** Energy (kWh) the household needs during [a, b) hours, everything or essentials only. */
function outageNeed(a, b, essentialOnly) {
  const items = S.loads.items.filter(it => !essentialOnly || it.essential);
  const loads = { items, misc: essentialOnly ? S.loads.misc.map(w => w * 0.5) : S.loads.misc };
  const parts = loadParts(loads);
  let e = 0;
  for (let h = a; h < b; h++) e += sum(parts.map(p => p.vals[h % 24]));
  return e;
}

/** SOC (%) needed at the start of an outage so the battery covers `kwh` above the minimum SOC. */
function socNeeded(kwh, sys = S.system) {
  const eta = Math.sqrt(sys.batt.rte / 100);
  return Math.min(100, Math.ceil(sys.batt.minSoc + (100 * kwh) / (sys.batt.kwh * eta)));
}

function renderOutage() {
  if (!OT.picks) OT.picks = Object.fromEntries(S.loads.items.filter(it => it.essential).map(it => [it.id, it.qty]));
  const upcoming = upcomingOutages();
  const suggest = Math.min(100, Math.ceil(Math.max(S.system.batt.minSoc, ...upcoming.map(o => o.socEss)) / 5) * 5);
  $('#view').innerHTML = `
    <div class="page-head"><div><h2>${t('ot_title')}</h2><p>${t('ot_sub')}</p></div></div>
    <div class="note mb">${ic('info')}<span>${t('ot_illus')}</span></div>
    <div class="split">
      <section class="card"><div class="hd"><div><h3>${ic('calendar')}${t('ot_week')}</h3><p>${t('ot_weekSub')}</p></div></div>
        <div class="week-grid" id="weekGrid" role="grid" aria-label="${t('ot_week')}"></div>
        <div class="row mt">${['ot_pEve', 'ot_pTwo', 'ot_pHigh', 'ot_pNone'].map(k => `<button type="button" class="btn ghost sm" data-preset="${k}">${t(k)}</button>`).join('')}</div></section>
      <section class="card"><div class="hd"><h3>${ic('shield')}${t('ot_reserve')}</h3></div>
        ${rangeCtl('otRes', t('pl_reserve'), S.settings.reserveSoc, { step: 5 })}
        ${noteHtml(suggest > S.settings.reserveSoc ? '' : 'ok', suggest > S.settings.reserveSoc ? 'alert' : 'check-circle', t('ot_suggest', { soc: suggest }), 'mt')}
        <div class="row mt mb"><button class="btn sm" type="button" id="otApply">${t('ot_apply', { soc: suggest })}</button></div>
        ${numField('otPen', t('ot_penalty'), S.settings.reservePenalty, 'Rs/kWh', { min: 0, max: 1000, hint: t('ot_penaltyHint') })}</section>
    </div>
    <section class="card mt">${cardHead('plug-off', t('ot_next'), t('ot_nextSub'))}
      <div class="tbl-wrap">${upcomingTable(upcoming)}</div></section>
    <section class="card mt" id="otCalc"></section>`;
  renderWeekGrid();
  $$('[data-preset]').forEach(b => (b.onclick = () => applyPreset(b.dataset.preset)));
  $('#otRes').oninput = e => ($('#otResV').textContent = e.target.value + '%');
  $('#otRes').onchange = e => setPlanSetting('reserveSoc', Number(e.target.value));
  $('#otApply').onclick = () => setPlanSetting('reserveSoc', suggest);
  $('#otPen').onchange = () => {
    const v = readNum('otPen', 0, 1000);
    if (v != null) setPlanSetting('reservePenalty', v);
  };
  renderRuntimeCalc(upcoming[0]);
}

function upcomingTable(list) {
  if (!list.length) return `<p class="empty">${t('ot_none')}</p>`;
  const heads = [t('ot_when'), [t('ot_all')], [t('ot_ess')], [t('ot_socAll')], [t('ot_socEss')]];
  const rows = list.map(o => [`${esc(fmtDate(o.iso))} <span class="num">${hhmm(o.a)}–${hhmm(o.b)}</span>`, fKWh(o.all), fKWh(o.ess), o.socAll + '%', o.socEss + '%']);
  return tableHtml(heads, rows);
}

function upcomingOutages() {
  const out = [];
  for (let d = 0; d < 7; d++) {
    const iso = addDays(isoDate(), d);
    (S.outages[weekday(iso)] || []).forEach(([a, b]) => {
      const all = outageNeed(a, b, false);
      const ess = outageNeed(a, b, true);
      out.push({ iso, a, b, all, ess, socAll: socNeeded(all), socEss: socNeeded(ess) });
    });
  }
  return out;
}

// ---------- weekly grid: tap or drag to paint outage hours ----------
function renderWeekGrid() {
  const g = $('#weekGrid');
  g.innerHTML = `<div class="wg-row wg-head"><span></span>${Array.from({ length: 24 }, (_, h) => `<span class="num">${h % 3 === 0 ? pad2(h) : ''}</span>`).join('')}</div>`
    + WEEKDAYS.map(d => {
      const m = toMask(S.outages[d] || []);
      const cell = (on, h) => `<button type="button" role="gridcell" class="wg-c ${on ? 'on' : ''}" data-c="${d}-${h}" aria-pressed="${on}" aria-label="${esc(dayName(d))} ${hhmm(h)}"></button>`;
      return `<div class="wg-row" role="row"><span class="wg-day">${esc(dayName(d, 'short'))}</span>${m.map(cell).join('')}</div>`;
    }).join('');
  const apply = el => {
    if (!el || OT.paint == null) return;
    el.classList.toggle('on', OT.paint);
    el.setAttribute('aria-pressed', OT.paint);
  };
  g.onpointerdown = e => {
    const el = e.target.closest('[data-c]');
    if (!el) return;
    e.preventDefault();
    OT.paint = !el.classList.contains('on');
    apply(el);
    g.onpointermove = ev => apply(document.elementFromPoint(ev.clientX, ev.clientY)?.closest('#weekGrid [data-c]'));
  };
  const finish = () => {
    if (OT.paint == null) return;
    OT.paint = null;
    g.onpointermove = null;
    saveWeekGrid();
  };
  g.onpointerup = finish;
  g.onpointerleave = finish;
  g.onkeydown = e => {
    const el = e.target.closest('[data-c]');
    if (!el || (e.key !== 'Enter' && e.key !== ' ')) return;
    e.preventDefault();
    OT.paint = !el.classList.contains('on');
    apply(el);
    finish();
  };
}

function saveWeekGrid() {
  WEEKDAYS.forEach(d => (S.outages[d] = toWins($$(`#weekGrid [data-c^="${d}-"]`).map(c => c.classList.contains('on')))));
  persist('outages');
  logEvent('ev_outages', {}, 'calendar');
  const focus = document.activeElement && document.activeElement.dataset.c;
  rerender();
  if (focus) $(`[data-c="${focus}"]`)?.focus();
}

function applyPreset(k) {
  const presets = {
    ot_pEve: () => [[20, 22]],
    ot_pTwo: d => [[9 + (d % 3), 10 + (d % 3)], [20 + (d % 2), 21 + (d % 2)]],
    ot_pHigh: d => [[3, 5], [10 + (d % 2), 12 + (d % 2)], [19, 21]],

// ---------- "what can I run during the outage" ----------
function renderRuntimeCalc(next) {
  const s = S.system;
  if (OT.soc == null) OT.soc = PLAN.res ? planRowAt(PLAN.res, nowStep(PLAN.res)).soc : 80;
  const box = $('#otCalc');
  const items = S.loads.items;
  const picked = items.filter(it => OT.picks[it.id] > 0);
  const watts = sum(picked.map(it => (it.w || appById(it.app).w) * OT.picks[it.id] * (it.cls === 'fixed' ? it.duty ?? appById(it.app).duty ?? 1 : 1)));
  const surge = watts + Math.max(0, ...picked.map(it => (appById(it.app).surge - 1) * (it.w || appById(it.app).w)));
  const eta = Math.sqrt(s.batt.rte / 100);
  const usable = Math.max(0, ((OT.soc - s.batt.minSoc) / 100) * s.batt.kwh * eta);
  const hours = watts > 0 ? usable / (watts / 1000) : Infinity;
  const over = watts > s.pv.invKw * 1000;
  const surgeOver = surge > s.pv.invKw * 2000;
  box.innerHTML = `<div class="hd"><div><h3>${ic('hourglass')}${t('ot_calc')}</h3><p>${t('ot_calcSub')}</p></div></div>
    <div class="split even"><div>${rangeCtl('otSoc', t('ot_soc'), OT.soc)}
      <ul class="pick-list">${items.map(it => pickRow(it)).join('') || `<li class="empty">${t('ld_empty')}</li>`}</ul></div>
      <div class="stack"><div class="runtime ${over || surgeOver ? 'bad' : ''}"><span class="tag">${t('ot_runtime')}</span><b class="num">${fmtHours(hours)}</b>
        <small>${t('ot_runtimeFoot', { kwh: nf(usable, 1), w: nf(watts) })}</small></div>
        ${dlHtml([[t('ot_running'), nf(watts) + ' W'], [t('ot_surge'), nf(surge) + ' W'], [t('ot_invLimit'), nf(s.pv.invKw * 1000) + ' W']])}
        ${over ? `<div class="note bad">${ic('alert')}<span>${t('ot_over')}</span></div>` : surgeOver ? `<div class="note bad">${ic('alert')}<span>${t('ot_surgeOver')}</span></div>` : ''}
        ${next ? coverNote(hours, next) : ''}
        <p class="tiny muted">${t('ot_calcNote')}</p></div></div>`;
  $('#otSoc').oninput = e => ($('#otSocV').textContent = e.target.value + '%');
  $('#otSoc').onchange = e => {
    OT.soc = Number(e.target.value);
    renderRuntimeCalc(next);
  };
  $$('[data-pick]', box).forEach(b => (b.onclick = () => {
    const it = items.find(x => x.id === b.dataset.pick);
    const cur = OT.picks[it.id] || 0;
    OT.picks[it.id] = clamp(cur + Number(b.dataset.d), 0, it.qty * 2);
    renderRuntimeCalc(next);
  }));
}

function coverNote(hours, next) {
  const ok = hours >= next.b - next.a;
  const when = `${fmtDate(next.iso)} ${hhmm(next.a)}–${hhmm(next.b)}`;
  return noteHtml(ok ? 'ok' : '', ok ? 'check-circle' : 'alert', t(ok ? 'ot_covers' : 'ot_short', { when }));
}

function pickRow(it) {
  const app = appById(it.app);
  const q = OT.picks[it.id] || 0;
  return `<li class="${q ? 'on' : ''}">${ic(app.icon)}<span class="grow">${esc(L(app.name))}<small class="num"> · ${nf(it.w || app.w)} W</small></span>
    <button type="button" class="ibtn sm" data-pick="${it.id}" data-d="-1" aria-label="${t('ot_less')} ${esc(L(app.name))}">${ic('minus')}</button><b class="num q">${q}</b>
    <button type="button" class="ibtn sm" data-pick="${it.id}" data-d="1" aria-label="${t('ot_more')} ${esc(L(app.name))}">${ic('plus')}</button></li>`;
}

// ---------- CSV import: column mapper with sign and unit choices ----------
function openMapper(parsed, name) {
  if (!parsed.rows.length) return toast(t('lg_csvEmpty'), 'bad');
  const map = guessMapping(parsed.header);
  const kw = map.pv_w >= 0 && /kw/i.test(parsed.header[map.pv_w]);
  const opt = { kw, gridSign: 1, battSign: guessBattSign(parsed, map), mode: 'replace' };
  const cols = [[-1, t('lg_none')], ...parsed.header.map((h, i) => [i, h || `#${i + 1}`])];
  const sh = openModal(`${sheetHead(t('lg_mapper'), 'upload')}<p class="muted">${t('lg_mapperSub', { name: esc(name), n: parsed.rows.length, d: parsed.delim === '\t' ? 'Tab' : parsed.delim })}</p>
    <div class="fgrid">${CSV_FIELDS.map(f => selectField('map_' + f, t('lf_' + f), cols, map[f])).join('')}</div>
    <div class="ctl-row mt"><div class="ctl"><span class="tag">${t('lg_unit')}</span>${segHtml('mUnit', [[0, 'W'], [1, 'kW']], kw ? 1 : 0)}</div>
      <div class="ctl"><span class="tag">${t('lg_gridSign')}</span>${segHtml('mGrid', [[1, t('lg_impPos')], [-1, t('lg_expPos')]], 1)}</div>
      <div class="ctl"><span class="tag">${t('lg_battSign')}</span>${segHtml('mBatt', [[1, t('lg_disPos')], [-1, t('lg_chgPos')]], opt.battSign)}</div>
      <div class="ctl"><span class="tag">${t('lg_mode')}</span>${segHtml('mMode', [['replace', t('lg_replace')], ['append', t('lg_append')]], 'replace')}</div></div>
    <div class="tbl-wrap mt" id="mPreview"></div>
    <div class="sfoot"><button class="btn ghost" type="button" data-close>${t('cancel')}</button>${btnHtml('mGo', 'upload', t('lg_doImport'), '')}</div>`, { wide: true });
  const readMap = () => Object.fromEntries(CSV_FIELDS.map(f => [f, Number($('#map_' + f, sh).value)]));
  const preview = () => ($('#mPreview', sh).innerHTML = mapperPreview(parsed, readMap(), opt));
  const setters = [['mUnit', v => (opt.kw = v === '1')], ['mGrid', v => (opt.gridSign = Number(v))], ['mBatt', v => (opt.battSign = Number(v))], ['mMode', v => (opt.mode = v)]];
  setters.forEach(([id, set]) => bindSeg(id, v => {
    set(v);
    $$(`#${id} [data-v]`, sh).forEach(b => b.classList.toggle('on', b.dataset.v === v));
    preview();
  }, sh));
  $$('select', sh).forEach(s => (s.onchange = preview));
  preview();
  $('#mGo', sh).onclick = () => importMapped(parsed, readMap(), opt, name);
}

/** If the battery column is mostly positive while solar exceeds load, the file counts charging as positive. */
function guessBattSign(parsed, map) {
  if (map.battery_w < 0 || map.pv_w < 0 || map.load_w < 0) return 1;
  const vals = parsed.rows.filter(r => parseFloat(r[map.pv_w]) > parseFloat(r[map.load_w]) * 1.3).map(r => parseFloat(r[map.battery_w]) || 0);
  return vals.length && mean(vals) > 0 ? -1 : 1;
}

function mapperPreview(parsed, map, opt) {
  const sample = csvToDays({ header: parsed.header, rows: parsed.rows.slice(0, 400) }, map, opt).days[0];
  if (map.time < 0 || !sample) return `<div class="note bad">${ic('alert')}<span>${t('lg_noTime')}</span></div>`;
  const hours = sample.pv.map((_, h) => h).filter(h => sample.pv[h] || sample.load[h]).slice(0, 6);
  const heads = [esc(fmtDate(sample.d)), ['PV W'], [t('ch_load') + ' W'], [t('lf_grid_w')], [t('lf_battery_w')], ['SOC']];
  return tableHtml(heads, hours.map(h => [hhmm(h), nf(sample.pv[h]), nf(sample.load[h]), nf(sample.grid[h]), nf(sample.batt[h]), sample.soc[h] + '%']));
}

function importMapped(parsed, map, opt, name) {
  if (map.time < 0) return toast(t('lg_noTime'), 'bad');
  const res = csvToDays(parsed, map, opt);
  if (!res.days.length) return toast(t('lg_csvEmpty'), 'bad');
  const merged = opt.mode === 'replace' ? res.days : [...S.logs.days.filter(d => !res.days.find(x => x.d === d.d)), ...res.days].sort((a, b) => (a.d < b.d ? -1 : 1));
  S.logs = { days: merged.slice(-400), source: name, importedAt: now() };
  persist('logs');
  logEvent('ev_csv', { n: res.days.length }, 'upload');
  notify('nt_csv', { n: res.days.length, bad: res.bad }, 'upload');
  closeModal();
  toast(t('lg_imported', { n: res.days.length, bad: res.bad }), 'ok');
  LG.day = null;
  rerender();
}

// ---------- What-if sizing: re-run the optimizer over the logged days with a changed system ----------
const WI = { running: false, results: null, custom: { batt: 5, pv: 2, regime: 'same', inv: false } };

function wiScenarios() {
  const s = S.system;
  const T = S.tariff;
  const perKwh = s.batt.price / s.batt.kwh;
  const other = s.grid.regime === 'netbill' ? 'netmeter' : 'netbill';
  const c = WI.custom;
  const regime = c.regime === 'same' ? s.grid.regime : c.regime;
  return [
    { id: 'base', label: t('wi_base'), sys: s, capex: 0 },
    { id: 'batt5', label: t('wi_batt', { n: 5 }), sys: withSys(s, { batt: biggerBattery(s, 5) }), capex: 5 * perKwh },
    { id: 'pv2', label: t('wi_pv', { n: 2 }), sys: withSys(s, { pv: { kwp: s.pv.kwp + 2 } }), capex: 2 * T.pvCostKw * 0.6 },
    { id: 'regime', label: t(other === 'netmeter' ? 'wi_regimeLegacy' : 'wi_regime', { r: t('rg_' + other) }), sys: withSys(s, { grid: { regime: other } }), capex: 0 },
    { id: 'custom', label: t('wi_custom', { b: c.batt, p: c.pv }), capex: c.batt * perKwh + c.pv * T.pvCostKw * 0.6 + (c.inv ? T.invCost * 0.5 : 0),
      sys: withSys(s, { batt: biggerBattery(s, c.batt),
        pv: { kwp: s.pv.kwp + c.pv, invKw: c.inv ? s.pv.invKw * (s.pv.kwp + c.pv) / s.pv.kwp : s.pv.invKw }, grid: { regime } }) },
  ];
}

/** Adding modules scales capacity, power limits and price in proportion. */
function biggerBattery(s, add) {
  const f = 1 + add / s.batt.kwh;
  return { kwh: s.batt.kwh + add, chgKw: s.batt.chgKw * f, disKw: s.batt.disKw * f, price: s.batt.price * f };
}

/** Shallow-merge nested system sections into a copy. */
function withSys(s, patch) {
  const out = JSON.parse(JSON.stringify(s));
  for (const k of Object.keys(patch)) Object.assign(out[k], patch[k]);
  return out;
}

/** Day by day over the log: logged load, logged PV scaled to the new array (clipped by the inverter), SOC carried over. */
async function simulateScenario(sys, days, base, onDay) {
  const scale = sys.pv.kwp / base.pv.kwp;
  const acc = { rs: 0, imp: 0, exp: 0, unmet: 0, thru: 0, curt: 0 };
  let soc = 50;
  for (let i = 0; i < days.length; i++) {
    const d = days[i];
    const pv = d.pv.map(v => Math.min((v / 1000) * scale, sys.pv.invKw));
    const load = d.load.map(v => v / 1000);
    const outage = Array.from({ length: 24 }, (_, h) => d.out.includes(h));
    const ctx = planContext({ sys, iso: d.d, days: 1, res: 60, pv, base: load, outage, soc0: soc, noFlex: true, regime: sys.grid.regime });
    const P = buildProblem(ctx, load);
    const ev = evaluatePath(P, solveDP(P).path);
    acc.rs += ev.tot.impRs - ev.tot.expRs + ev.tot.wearRs + ev.tot.unmetRs;
    acc.imp += ev.tot.imp;
    acc.exp += ev.tot.exp;
    acc.unmet += ev.tot.unmet;
    acc.thru += ev.tot.chg + ev.tot.dis;
    acc.curt += ev.tot.curt;
    soc = ev.path[ev.path.length - 1];
    if (onDay && i % 6 === 5) await onDay(i + 1);
  }
  return acc;
}

async function runWhatIf() {
  if (WI.running) return;
  const days = S.logs.days.slice(-60);
  if (!days.length) return toast(t('bh_empty'), 'bad');
  WI.running = true;
  const sc = wiScenarios();
  const total = sc.length * days.length;
  let done = 0;
  const bar = () => $('#wiBar') && ($('#wiBar').style.width = (100 * done) / total + '%');
  renderWhatIf();
  const out = [];
  for (const s of sc) {
    const base = done;
    const r = await simulateScenario(s.sys, days, S.system, async n => {
      done = base + n;
      bar();
      await nextFrame();
    });
    done = base + days.length;
    out.push({ ...s, ...r });
  }
  const annual = 365 / days.length;
  out.forEach(r => {
    r.annual = (out[0].rs - r.rs) * annual;
    r.payback = r.capex > 0 ? simplePayback(r.capex, r.annual) : null;
  });
  WI.results = { rows: out, days: days.length, at: now() };
  WI.running = false;
  logEvent('ev_whatif', { n: days.length }, 'scale');
  if (curRoute === 'whatif') renderWhatIf();
}

/** Best investment = shortest payback among scenarios that cost money and save money. */
function bestInvestment(rows) {
  const paying = rows.filter(r => r.capex > 0 && r.annual > 0);
  return paying.length ? paying.reduce((a, r) => (r.payback < a.payback ? r : a)) : null;
}

function whatIfResults(res) {
  const best = bestInvestment(res.rows);
  return `<section class="card mt"><div class="hd"><div><h3>${ic('bar-chart')}${t('wi_results')}</h3><p>${t('wi_resultsSub', { n: res.days, ago: ago(res.at) })}</p></div></div>

// ---------- real device: standard GATT Battery Service (0x180F) / Battery Level (0x2A19) ----------
async function connectBle() {
  try {
    const dev = await navigator.bluetooth.requestDevice({ filters: [{ services: [BLE_SERVICE] }], optionalServices: [BLE_SERVICE] });
    BMS.dev = dev;
    dev.addEventListener('gattserverdisconnected', onBleGone);
    const server = await dev.gatt.connect();
    const ch = await (await server.getPrimaryService(BLE_SERVICE)).getCharacteristic(BLE_LEVEL);
    setBleLevel((await ch.readValue()).getUint8(0));
    try {
      await ch.startNotifications();
      ch.addEventListener('characteristicvaluechanged', e => setBleLevel(e.target.value.getUint8(0)));
    } catch {
      /* notifications are optional for this characteristic */
    }
    logEvent('ev_ble', { name: dev.name || t('bm_unnamed') }, 'bluetooth');
    rerender();
  } catch (e) {
    toast(e && e.name === 'NotFoundError' ? t('bm_cancelled') : t('bm_fail', { msg: (e && e.message) || '' }), e && e.name === 'NotFoundError' ? '' : 'bad');
  }
}

function setBleLevel(v) {
  BMS.level = v;
  S.bms = { lastLevel: v, lastAt: now(), device: (BMS.dev && BMS.dev.name) || t('bm_unnamed') };
  persist('bms');
  if ($('#bleLevel')) $('#bleLevel').textContent = v + '%';
  announce(t('bm_levelIs', { v }));
}

function onBleGone() {
  BMS.dev = null;
  toast(t('bm_gone'));
  if (curRoute === 'bms') rerender();
}

function disconnectBle() {
  if (BMS.dev && BMS.dev.gatt.connected) BMS.dev.gatt.disconnect();
  BMS.dev = null;
  rerender();
}

/** Recognise common BMS frame headers so the student knows which decoder to write. */

  if (b[0] === 0x4e && b[1] === 0x57) return 'jkRs485';

  if (b[0] === 0xa5) return 'daly';

// ---------- simulated BMS: 16 LFP cells following today's plan, one simulated minute per second ----------
const LFP_OCV = [[0, 2.9], [5, 3.12], [10, 3.2], [20, 3.26], [40, 3.29], [60, 3.31], [80, 3.33], [90, 3.35], [95, 3.38], [100, 3.45]];

function ocv(soc) {
  for (let i = 1; i < LFP_OCV.length; i++) {
    const [s1, v1] = LFP_OCV[i];
    const [s0, v0] = LFP_OCV[i - 1];
    if (soc <= s1) return v0 + ((v1 - v0) * (soc - s0)) / (s1 - s0);
  }
  return LFP_OCV[LFP_OCV.length - 1][1];
}

async function startSim() {
  const res = await getPlan();
  const r = rng(42);
  BMS.minute = Math.floor(nowHour() * 60);
  BMS.soc = planRowAt(res, nowStep(res)).soc;
  BMS.cycles = Math.round(batteryHealthQuick());
  BMS.offsets = Array.from({ length: 16 }, () => (r() - 0.5) * 0.016);
  BMS.hist = [];
  BMS.sim = setInterval(simTick, 1000);
  simTick();
  logEvent('ev_sim', {}, 'cpu');
}

/** Lifetime cycle count estimate: logged equivalent full cycles per day × days in service. */
function batteryHealthQuick() {
  if (!S.logs.days.length) return 0;
  const h = batteryHealth(S.system, S.logs.days.slice(-60));
  return h.efcPerDay * h.served;
}

function stopSim() {
  clearInterval(BMS.sim);
  BMS.sim = 0;
}

function simTick() {
  const res = PLAN.res;
  if (!res) return;
  BMS.minute = (BMS.minute + 1) % 1440;
  const k = clamp(Math.floor(BMS.minute / 60 / res.ctx.dt), 0, res.ctx.steps - 1);
  const row = planRowAt(res, k);
  const kw = (row.dis - row.chg) / res.ctx.dt;
  BMS.soc = clamp(BMS.soc - (kw / 60 / S.system.batt.kwh) * 100 + (row.soc - BMS.soc) * 0.02, 0, 100);
  BMS.volts = 16 * ocv(BMS.soc) - kw * 0.02;
  BMS.amps = (kw * 1000) / BMS.volts;
  BMS.temp = 27 + 0.06 * Math.abs(BMS.amps) + (BMS.temp - 27) * 0.9;
  BMS.cells = BMS.offsets.map(o => ocv(BMS.soc) + o * (BMS.soc > 90 ? 1.6 : 1) - (kw / 16) * 0.02 + (Math.random() - 0.5) * 0.003);
  BMS.hist = [...BMS.hist.slice(-59), BMS.soc];
  if (curRoute === 'bms') updateSimCard();
  if (curRoute === 'home' && S.settings.feedBms && HOME.res) updateFlow();
}
