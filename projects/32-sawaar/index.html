<script>
'use strict';
/* =====================================================================
   Sawaar — crash detection for motorcyclists (single file, no build)
   utils · i18n · content (lessons, quiz, bikes, maintenance) · state and
   seed · QR encoder · signal chain · crash engine · trace synthesiser ·
   evaluation · sensors and simulator · alarm audio · views (ride HUD,
   crash alarm, engine, Signal Lab, coach, trips, medical ID, garage,
   fleet, hazards, learn, inbox, settings, about) · search, tour, router.
   Honest limits: NOT a certified safety device. A web page cannot send
   SMS or WhatsApp messages by itself and stops reading sensors when the
   screen turns off. Student extension points carry a student TODO marker.
   ===================================================================== */

// ---------- DOM + storage helpers ----------
const NS = 'swr.';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const store = {
  get(k, d) {
    try {
      const v = localStorage.getItem(NS + k);
      return v == null ? d : JSON.parse(v);
    } catch {
      return d;
    }
  },
  set(k, v) {
    try {
      localStorage.setItem(NS + k, JSON.stringify(v));
      return true;
    } catch {
      return false;
    }
  },
  del(k) {
    try {
      localStorage.removeItem(NS + k);
    } catch {
      /* storage blocked */
    }
  },
  keys() {
    const out = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith(NS)) out.push(k.slice(NS.length));
      }
    } catch {
      /* storage blocked */
    }
    return out;
  },
  bytes() {
    let n = 0;
    for (const k of this.keys()) n += k.length + (localStorage.getItem(NS + k) || '').length;
    return n * 2;
  },
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = (p = '') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const now = () => Date.now();
const later = fn => setTimeout(fn, 0);
const sum = a => a.reduce((x, y) => x + y, 0);
const mean = a => (a.length ? sum(a) / a.length : 0);
const round = (v, dp = 0) => Math.round(v * 10 ** dp) / 10 ** dp;
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function debounce(fn, ms = 180) {
  let h = 0;
  return (...a) => {
    clearTimeout(h);
    h = setTimeout(() => fn(...a), ms);
  };
}

// ---------- numbers, dates, durations ----------
const MIN = 60000;
const HOUR = 36e5;
const DAY = 864e5;
const pad2 = n => String(n).padStart(2, '0');
const locale = () => (lang === 'ur' ? 'ur-PK-u-nu-latn' : 'en-PK');
const fmtN = (v, dp = 0) => (v == null || Number.isNaN(v) ? '—' : Number(v).toLocaleString('en-PK', { minimumFractionDigits: dp, maximumFractionDigits: dp }));
const fmtPct = (v, dp = 0) => (v == null || Number.isNaN(v) ? '—' : fmtN(v * 100, dp) + '%');
const fmtRs = v => 'Rs ' + fmtN(Math.round(v));
const fmtDate = (ts, opts = { day: 'numeric', month: 'short', year: 'numeric' }) => new Date(ts).toLocaleDateString(locale(), opts);
const fmtDay = ts => fmtDate(ts, { weekday: 'short', day: 'numeric', month: 'short' });
// Urdu uses a 24-hour clock so no Latin AM/PM is reordered inside right-to-left text.
const fmtTime = ts => new Date(ts).toLocaleTimeString(locale(), { hour: 'numeric', minute: '2-digit', hourCycle: lang === 'ur' ? 'h23' : 'h12' });
const fmtDT = ts => `${fmtDate(ts)} · ${fmtTime(ts)}`;
const isoDay = ts => {
  const d = new Date(ts);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
};
const dayStart = ts => {
  const d = new Date(ts);
  d.setHours(0, 0, 0, 0);
  return d.getTime();
};

function ago(ts) {
  const s = Math.round((now() - ts) / 1000);
  if (s < 60) return t('justNow');
  if (s < 3600) return t('minAgo', { n: Math.round(s / 60) });
  if (s < 86400) return t('hrAgo', { n: Math.round(s / 3600) });
  return t('daysAgo', { n: Math.round(s / 86400) });
}

/** 754 s → "12:34"; 4000 s → "1:06:40". */
function clock(sec) {
  const a = Math.max(0, Math.floor(sec));
  const h = Math.floor(a / 3600);
  const m = Math.floor((a % 3600) / 60);
  return h ? `${h}:${pad2(m)}:${pad2(a % 60)}` : `${pad2(m)}:${pad2(a % 60)}`;
}
const durMin = sec => t('durMin', { n: Math.max(1, Math.round(sec / 60)) });

// ---------- geo maths ----------
const toRad = d => (d * Math.PI) / 180;

/** Great-circle distance in metres (haversine, mean Earth radius 6,371 km). */
function haversine(a, b) {
  const R = 6371000;
  const dLat = toRad(b.lat - a.lat);
  const dLng = toRad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}

/** Initial bearing a → b in degrees clockwise from north. */
function bearing(a, b) {
  const y = Math.sin(toRad(b.lng - a.lng)) * Math.cos(toRad(b.lat));
  const x = Math.cos(toRad(a.lat)) * Math.sin(toRad(b.lat)) - Math.sin(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.cos(toRad(b.lng - a.lng));
  return ((Math.atan2(y, x) * 180) / Math.PI + 360) % 360;
}
const cardinal = deg => ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(((deg % 360) + 360) % 360 / 45) % 8];
const fmtKm = km => t('kmN', { n: fmtN(km, km < 10 ? 1 : 0) });
const mapLink = p => `https://maps.google.com/?q=${p.lat.toFixed(5)},${p.lng.toFixed(5)}`;

// ---------- phone numbers (Pakistani mobiles and international) ----------
const PHONE_RE = /^(03\d{2}-?\d{7}|\+\d{8,15})$/;
const cleanPhone = p => String(p || '').replace(/[\s()]/g, '');
const phoneOk = p => PHONE_RE.test(cleanPhone(p));

/** 0300-1234567 → 923001234567 (digits only, as wa.me expects). */
function phoneIntl(p) {
  const d = cleanPhone(p).replace(/[^\d+]/g, '');
  if (d.startsWith('+')) return d.slice(1);
  if (d.startsWith('0')) return '92' + d.slice(1);
  return d;
}
const phoneDial = p => cleanPhone(p).replace(/-/g, '');

// ---------- feedback: toast, aria-live, vibration ----------
function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.setAttribute('role', 'status');
  el.innerHTML = ic(type === 'ok' ? 'check-circle' : type === 'bad' ? 'alert-circle' : 'info') + '<span></span>';
  el.lastChild.textContent = msg;
  $('#toasts').append(el);
  setTimeout(() => el.classList.add('out'), 2800);
  setTimeout(() => el.remove(), 3150);
}

const announce = msg => {
  $('#live').textContent = '';
  setTimeout(() => ($('#live').textContent = msg), 30);
};

// Browsers refuse vibration before the user has touched the page, so check first instead of logging an error.
function vibrate(pattern) {
  try {
    const active = !navigator.userActivation || navigator.userActivation.hasBeenActive;
    if (navigator.vibrate && S.settings.vibrate && active) navigator.vibrate(pattern);
  } catch {
    /* not supported */
  }
}

// ---------- motion kit ----------
const calm = () => document.documentElement.classList.contains('calm') || matchMedia('(prefers-reduced-motion: reduce)').matches;

function animateIn(root) {
  if (!root) return;
  root.classList.remove('enter');
  void root.offsetWidth;
  root.classList.add('enter');
  $$('.stagger', root).forEach(g => [...g.children].forEach((el, i) => el.style.setProperty('--i', Math.min(i, 14))));
  requestAnimationFrame(() => $$('.bar > i[data-w]', root).forEach(b => (b.style.width = b.dataset.w + '%')));
  $$('[data-count]', root).forEach(el => countUp(el, Number(el.dataset.count), { dp: Number(el.dataset.dp || 0) }));
  $$('path[data-draw], polyline[data-draw]', root).forEach(drawPath);
  $$('circle[data-ring]', root).forEach(fillRing);
}

// Same-route re-renders skip the entrance animation but still need rings, bars and numbers in place.
function settle(root) {
  if (!root) return;
  $$('.bar > i[data-w]', root).forEach(b => (b.style.width = b.dataset.w + '%'));
  $$('[data-count]', root).forEach(el => (el.textContent = fmtN(Number(el.dataset.count), Number(el.dataset.dp || 0))));
  $$('circle[data-ring]', root).forEach(c => {
    const L = 2 * Math.PI * Number(c.getAttribute('r'));
    c.style.transition = 'none';
    c.style.strokeDasharray = L;
    c.style.strokeDashoffset = L * (1 - Number(c.dataset.ring));
  });
}

function countUp(el, to, { dur = 700, dp = 0 } = {}) {
  if (calm()) {
    el.textContent = fmtN(to, dp);
    return;
  }
  const t0 = performance.now();
  const step = nowTs => {
    const p = Math.min(1, (nowTs - t0) / dur);
    el.textContent = fmtN(to * (1 - Math.pow(1 - p, 3)), dp);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function drawPath(p) {
  if (calm()) return;
  const L = p.getTotalLength();
  p.style.strokeDasharray = L;
  p.style.strokeDashoffset = L;
  p.getBoundingClientRect();
  p.style.transition = 'stroke-dashoffset .9s var(--ease)';
  p.style.strokeDashoffset = 0;
}

function fillRing(c) {
  const L = 2 * Math.PI * Number(c.getAttribute('r'));
  c.style.strokeDasharray = L;
  c.style.strokeDashoffset = L;
  c.getBoundingClientRect();
  c.style.strokeDashoffset = L * (1 - Number(c.dataset.ring));
}

function ringSvg(frac, { size = 112, r = 46, color = '' } = {}) {
  const st = color ? ` style="stroke:${color}"` : '';
  return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle class="track" cx="${size / 2}" cy="${size / 2}" r="${r}"/>
      <circle class="val"${st} cx="${size / 2}" cy="${size / 2}" r="${r}" data-ring="${clamp(frac, 0, 1)}"/></svg>`;
}

// ---------- small SVG charts (hand-drawn, theme-aware through CSS classes) ----------
/** Line chart: series = [{ values, cls }]; x is the index. Returns an SVG string. */
function lineChart(series, { w = 600, h = 180, yMin = null, yMax = null, labels = [], unit = '', ref = null } = {}) {
  const all = series.flatMap(s => s.values.filter(v => v != null));
  const lo = yMin ?? Math.min(...all, ref ?? Infinity);
  const hi = yMax ?? Math.max(...all, ref ?? -Infinity);
  const span = hi - lo || 1;
  const n = Math.max(2, ...series.map(s => s.values.length));
  const px = i => 34 + (i / (n - 1)) * (w - 44);
  const py = v => h - 22 - ((v - lo) / span) * (h - 34);
  const grid = [0, 0.5, 1].map(f => {
    const v = lo + span * f;
    return `<line class="gl" x1="34" x2="${w - 10}" y1="${py(v)}" y2="${py(v)}"/>
        <text class="ax" x="28" y="${py(v) + 4}" text-anchor="end">${fmtN(v, span < 5 ? 1 : 0)}</text>`;
  }).join('');
  const refLine = ref != null ? `<line class="refl" x1="34" x2="${w - 10}" y1="${py(ref)}" y2="${py(ref)}"/>` : '';
  const lines = series.map(s => {
    const pts = s.values.map((v, i) => (v == null ? null : `${px(i).toFixed(1)},${py(v).toFixed(1)}`)).filter(Boolean);
    return pts.length ? `<polyline class="ln ${s.cls || ''}" points="${pts.join(' ')}" data-draw/>` : '';
  }).join('');
  const step = Math.max(1, Math.ceil(labels.length / 8));
  const xl = labels.map((l, i) => (i % step ? '' : `<text class="ax" x="${px(i)}" y="${h - 5}" text-anchor="middle">${esc(l)}</text>`)).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(unit)}">${grid}${refLine}${lines}${xl}</svg>`;
}

/** Vertical bar chart: bars = [{ v, label, cls }]. */
function barChart(bars, { w = 600, h = 170, max = null } = {}) {
  const hi = max ?? Math.max(1, ...bars.map(b => b.v));
  const bw = (w - 40) / Math.max(1, bars.length);
  const body = bars.map((b, i) => {
    const bh = ((h - 40) * b.v) / hi;
    const x = 30 + i * bw + bw * 0.15;
    return `<rect class="br ${b.cls || ''}" x="${x.toFixed(1)}" y="${(h - 22 - bh).toFixed(1)}" width="${(bw * 0.7).toFixed(1)}" height="${Math.max(0, bh).toFixed(1)}" rx="3">
        <title>${esc(b.label)}: ${fmtN(b.v, b.v % 1 ? 1 : 0)}</title></rect>
      <text class="ax" x="${(x + bw * 0.35).toFixed(1)}" y="${h - 6}" text-anchor="middle">${esc(b.label)}</text>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img"><line class="gl" x1="26" x2="${w - 6}" y1="${h - 22}" y2="${h - 22}"/>${body}</svg>`;
}

function sparkline(values, { w = 120, h = 34, cls = '' } = {}) {
  if (values.length < 2) return '';
  const lo = Math.min(...values);
  const hi = Math.max(...values);
  const pts = values.map((v, i) => `${((i / (values.length - 1)) * (w - 4) + 2).toFixed(1)},${(h - 3 - ((v - lo) / (hi - lo || 1)) * (h - 6)).toFixed(1)}`);
  return `<svg class="spark ${cls}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts.join(' ')}"/></svg>`;
}

// ---------- modal / bottom sheet ----------
let modalReturn = null;
let modalOnClose = null;

function sheetHead(title, icon = 'info') {
  return `<div class="shead"><h3 id="sheetTitle">${ic(icon)}<span>${title}</span></h3>
      <button class="ibtn" type="button" data-close aria-label="${t('close')}">${ic('x')}</button></div>`;
}

function openModal(html, { wide = false, onClose = null } = {}) {
  if (!$('#modal').classList.contains('on')) modalReturn = document.activeElement;
  const sh = $('#sheet');
  sh.className = 'sheet' + (wide ? ' wide' : '');
  sh.innerHTML = '<div class="grab"></div>' + html;
  sh.scrollTop = 0;
  $('#scrim').classList.add('on');
  $('#modal').classList.add('on');
  modalOnClose = onClose;
  $$('[data-close]', sh).forEach(b => (b.onclick = closeModal));
  const first = sh.querySelector('[autofocus], input:not([type=hidden]):not([type=checkbox]):not([type=file]):not([type=range]):not([readonly]), select, textarea');
  setTimeout(() => (first || sh.querySelector('.shead [data-close]') || sh).focus({ preventScroll: true }), 80);
  return sh;
}

function closeModal() {
  if (!$('#modal').classList.contains('on')) return;
  $('#modal').classList.remove('on');
  $('#scrim').classList.remove('on');
  const cb = modalOnClose;
  modalOnClose = null;
  if (cb) cb();
  if (modalReturn && document.contains(modalReturn)) modalReturn.focus({ preventScroll: true });
}
const modalOpen = () => $('#modal').classList.contains('on');

function askConfirm(msg, { okText = t('confirm'), danger = false, icon = 'help' } = {}) {
  return new Promise(resolve => {
    let answered = false;
    const finish = v => {
      if (answered) return;
      answered = true;
      resolve(v);
    };
    const sh = openModal(`${sheetHead(t('areYouSure'), icon)}<p>${msg}</p>
      <div class="sfoot"><button class="btn ghost" type="button" data-close>${t('cancel')}</button>
      <button class="btn ${danger ? 'r' : 'y'}" type="button" id="cfOk">${okText}</button></div>`, { onClose: () => finish(false) });
    $('#cfOk', sh).onclick = () => {
      finish(true);
      closeModal();
    };
  });
}

// ---------- print, download, files, clipboard ----------
function printDoc(html) {
  $('#printArea').innerHTML = html;
  settle($('#printArea'));
  window.print();
}

function downloadFile(name, text, mime = 'application/json') {
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function pickFile(accept, cb) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = accept;
  inp.onchange = () => {
    const f = inp.files[0];
    if (f) f.text().then(cb);
  };
  inp.click();
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast(t('copied'), 'ok');
  } catch {
    toast(t('copyFailed'), 'bad');
  }
}

/** Form values by name, numbers converted where the input is numeric. */
function formData(root) {
  const out = {};
  $$('[name]', root).forEach(el => {
    if (el.type === 'checkbox') out[el.name] = el.checked;
    else if (el.type === 'number' || el.type === 'range') out[el.name] = el.value === '' ? null : Number(el.value);
    else out[el.name] = el.value.trim();
  });
  return out;
}

  return s.replace(/\{(\w+)\}/g, (m, v) => (vars[v] ?? m));

const EMPTY = {
  settings: () => ({ ...DEFAULT_SETTINGS }),
  engine: () => ({ ...ENGINE_DEFAULTS }),
  profile: () => ({ name: '', blood: '', allergies: '', conditions: '', meds: '', donor: false, notes: '', city: 'lhr' }),

  lab: () => ({ seed: 2026, per: 12, noise: 1, pocket: 0.3, sweep: 'impactG', includeRec: true, cfg: { ...ENGINE_DEFAULTS } }),
  meta: () => ({ version: 1, seededAt: now(), lastBackup: null }),
};
const KEYS = Object.keys(EMPTY);
let S = null;

function loadState() {
  if (!store.get('meta')) return null;
  const s = {};
  KEYS.forEach(k => (s[k] = store.get(k, EMPTY[k]())));
  s.settings = { ...DEFAULT_SETTINGS, ...s.settings };
  s.engine = { ...ENGINE_DEFAULTS, ...s.engine };
  s.lab = { ...EMPTY.lab(), ...s.lab, cfg: { ...ENGINE_DEFAULTS, ...(s.lab && s.lab.cfg) } };
  return s;
}

function persist(...keys) {
  for (const k of keys) {
    if (!store.set(k, S[k])) {
      toast(t('err_storage'), 'bad');
      return false;
    }
  }
  return true;
}

function persistAll() {
  persist(...KEYS);
}

/** Activity log: what the app did, never message contents. */
function logEvent(key, vars = {}, icon = 'activity') {
  S.log.unshift({ id: uid('l'), ts: now(), key, vars, icon });
  S.log.length = Math.min(S.log.length, 250);
  persist('log');
}

/** In-app notification with read state (the inbox). */
function notify(key, vars = {}, { icon = 'bell', route = '', level = '' } = {}) {
  S.inbox.unshift({ id: uid('n'), ts: now(), key, vars, icon, route, level, read: false });
  S.inbox.length = Math.min(S.inbox.length, 120);
  persist('inbox');
  if (typeof updateBadges === 'function') updateBadges();
}
const unreadCount = () => S.inbox.filter(n => !n.read).length;

/** Fresh state: demo seed or an empty app that keeps the user's preferences. */
function seedApp() {
  const keep = S ? S.settings : null;
  S = demoSeed();
  if (keep) S.settings = { ...keep, demo: true };
  persistAll();
}

function emptyApp() {
  const keep = S ? S.settings : { ...DEFAULT_SETTINGS };

// =====================================================================
// SEED — fictional demo data generated deterministically: 30 rides
// around Lahore and Karachi, a fleet of 10 riders with 320 harsh
// events, 18 hazard pins, 14 fuel fills, maintenance history, two
// recorded traces, crash log, notifications and activity log.
// =====================================================================
const pick = (r, a) => a[Math.floor(r() * a.length)];

/** A plausible city route: 3–5 alternating north-south / east-west legs (city blocks), densified about every 80 m. */
function makeRoute(cityId, r, { minKm = 3, maxKm = 11 } = {}) {
  const city = CITIES[cityId];
  let a = city.places[0];
  let b = city.places[1];
  for (let i = 0; i < 60; i++) {
    a = pick(r, city.places);
    b = pick(r, city.places);
    const km = haversine(a, b) / 1000;
    if (a !== b && km >= minKm * 0.7 && km <= maxKm) break;
  }
  const legs = 3 + Math.floor(r() * 3);
  const way = [P(a.lat, a.lng)];
  for (let i = 1; i < legs; i++) {
    const cur = way[way.length - 1];
    const f = i === legs - 1 ? 1 : 0.35 + r() * 0.4;
    way.push(i % 2 ? P(cur.lat + (b.lat - cur.lat) * f, cur.lng + (r() - 0.5) * 0.002) : P(cur.lat + (r() - 0.5) * 0.002, cur.lng + (b.lng - cur.lng) * f));
  }
  way.push(P(b.lat, b.lng));
  const pts = [];
  for (let i = 1; i < way.length; i++) {
    const p = way[i - 1];
    const q = way[i];
    const n = Math.max(1, Math.round(haversine(p, q) / 80));
    for (let k = 0; k < n; k++) pts.push([round(p.lat + ((q.lat - p.lat) * k) / n + gauss(r) * 0.00004, 5), round(p.lng + ((q.lng - p.lng) * k) / n + gauss(r) * 0.00004, 5)]);
  }
  pts.push([b.lat, b.lng]);
  return { from: a.n, to: b.n, pts };
}

function routeKm(pts) {
  let m = 0;
  for (let i = 1; i < pts.length; i++) m += haversine(P(pts[i - 1][0], pts[i - 1][1]), P(pts[i][0], pts[i][1]));
  return m / 1000;
}

/** Turn a route into a timed ride: speed per point, harsh events by the rider's current "style" (risk ≈ 1.4 early, 0.6 later). */
function synthTrip(cityId, r, start, risk) {
  const route = makeRoute(cityId, r);
  const road = pick(r, ['urban', 'urban', 'arterial', 'street', 'ring']);
  const limit = roadType(road).limit;
  const pts = [];
  const events = [];
  let v = 12;
  let tSec = 0;
  let maxKmh = 0;
  let maxLean = 0;
  route.pts.forEach((p, i) => {
    const prev = route.pts[Math.max(0, i - 1)];
    const d = i ? haversine(P(prev[0], prev[1]), P(p[0], p[1])) : 0;
    const stop = r() < 0.025;
    const target = stop ? 0 : limit * (0.6 + r() * 0.42 + (risk - 1) * 0.35);
    v = clamp(v * 0.65 + target * 0.35, 0, 110);
    tSec += d / Math.max(1.2, v / 3.6) + (stop ? 15 + r() * 40 : 0);
    maxKmh = Math.max(maxKmh, v);
    pts.push([p[0], p[1], Math.round(v), Math.round(tSec)]);
    tripEvent(r, risk, { v, limit, d, p, tSec, i, route }, events);
    if (i > 1 && i < route.pts.length - 1) maxLean = Math.max(maxLean, turnLean(route.pts, i, v));
  });
  const km = routeKm(route.pts);
  const hour = new Date(start).getHours();
  const pillion = r() < 0.3;
  const trip = {
    id: uid('t'), city: cityId, from: route.from, to: route.to, start, durS: Math.round(tSec), km: round(km, 2),
    avgKmh: round(km / (tSec / 3600), 1), maxKmh: Math.round(maxKmh), maxLean: Math.round(maxLean), road, pts, events,
    helmet: { rider: r() < 0.92, pillion: pillion ? r() < 0.6 : null }, pillion, night: hour >= 19 || hour < 6, src: 'seed',
  };
  trip.score = rideScore(trip).score;
  return trip;
}

// Lean in a turn from the heading change over the neighbouring points: tan φ = v²/(r·g).
function turnLean(pts, i, kmh) {
  const a = P(pts[i - 1][0], pts[i - 1][1]);
  const b = P(pts[i][0], pts[i][1]);
  const c = P(pts[i + 1][0], pts[i + 1][1]);
  let dh = Math.abs(bearing(b, c) - bearing(a, b));
  if (dh > 180) dh = 360 - dh;
  const len = (haversine(a, b) + haversine(b, c)) / 2;
  if (dh < 5 || len < 1) return 0;
  const radius = len / toRad(dh);
  const v = kmh / 3.6;
  return Math.min(45, (Math.atan((v * v) / (radius * G0)) * 180) / Math.PI);
}

function tripEvent(r, risk, ctx, events) {
  const per = ctx.d / 1000;
  const at = (kind, val) => events.push({ kind, t: ctx.tSec, lat: ctx.p[0], lng: ctx.p[1], val: round(val, 1) });
  if (r() < 0.1 * per * risk * risk) at('brake', 3.5 + r() * 3);
  else if (r() < 0.06 * per * risk * risk) at('accel', 2.6 + r() * 1.4);
  else if (r() < 0.05 * per * risk * risk && ctx.v > 20) at('corner', 3.6 + r() * 2.5);
  else if (ctx.v > ctx.limit * 1.1 && r() < 0.06) at('speed', ctx.v);
  else if (r() < 0.012 * per * risk) at('touch', ctx.v);
}

function seedTrips(r) {
  const trips = [];
  const today = dayStart(now());
  for (let i = 0; i < 30; i++) {
    const daysAgo = Math.round(40 - i * 1.32 - r());
    const slot = pick(r, [8.2, 8.6, 9.1, 13.5, 17.4, 18.1, 18.6, 21.3, 22.4]);
    const start = today - daysAgo * DAY + slot * HOUR + Math.floor(r() * 25) * MIN;
    const risk = clamp(1.45 - (i / 29) * 0.85 + (r() - 0.5) * 0.3, 0.45, 1.6);
    trips.push(synthTrip(i % 3 === 2 ? 'khi' : 'lhr', r, start, risk));
  }
  return trips.sort((a, b) => b.start - a.start);
}

  for (let i = 0; i < c.t.length; i++) {

    out.t.push(round(c.t[i] - from, 3));
