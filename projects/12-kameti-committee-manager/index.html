<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kameti Committee Manager</title>
<meta name="description" content="Run a rotating savings committee (kameti / beesi / ROSCA): payments matrix, lottery draw, payout schedule, default simulator, trust scores and a bilingual printable agreement. Single-file FYP template.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens: forest ledger, mint surfaces, gold payouts ---------- */
:root{
  --forest:#14532d; --forest-deep:#0b3b1f; --forest-soft:#1f6b3a; --mint:#d1fae5; --mint-2:#a7f3d0; --mint-soft:#ecfdf5;
  --gold:#ca8a04; --gold-soft:#fef3c7; --gold-deep:#854d0e;
  --bg:#f8faf7; --surface:#ffffff; --surface-2:#eef4f0; --ink:#0f1f16; --muted:#5b6b62; --line:#d9e4dc;
  --ok:#15803d; --ok-soft:#dcfce7; --late:#b45309; --late-soft:#fef3c7; --bad:#b91c1c; --bad-soft:#fee2e2; --part:#0369a1; --part-soft:#e0f2fe; --waive:#6b7280; --waive-soft:#f1f3f4;
  --radius:14px; --radius-sm:9px; --shadow:0 10px 30px -18px rgba(15,31,22,.35);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace; --font-ur:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;
  --ease:cubic-bezier(.2,.8,.2,1); --dur:.35s;
}
/* ---------- Motion kit ---------- */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(202,138,4,.45)}60%{box-shadow:0 0 0 10px rgba(202,138,4,0)}}
.enter{animation:fadeUp var(--dur) var(--ease) both}
.stagger>*{animation:fadeUp .45s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.btn{transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s}
.btn:hover{transform:translateY(-1px)} .btn:active{transform:translateY(0) scale(.98)}
.card,.tile,.kpi{transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s}
.card:hover,.kpi:hover{transform:translateY(-2px);box-shadow:0 14px 34px -18px rgba(15,31,22,.4)}
.fill,.bar>i{transition:width .6s var(--ease)}
.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite}

/* ---------- Base ---------- */
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--forest)}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.01em}
.ic{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.mono,.num,.matrix,.tbl td.num,.amt{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr}
.muted{color:var(--muted)} .small{font-size:.82rem} .hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ur,[lang=ur]{font-family:var(--font-ur);line-height:1.95;direction:rtl;text-align:right}
html[lang=ur] body{font-family:var(--font-ur);line-height:1.85}
html[lang=ur] .txt,html[lang=ur] .lead,html[lang=ur] .note,html[lang=ur] .faq summary,html[lang=ur] .faq p,html[lang=ur] .todo{direction:rtl;text-align:right}
html[lang=ur] .tabs a,html[lang=ur] .btn,html[lang=ur] .kpi .k,html[lang=ur] h2,html[lang=ur] h3{letter-spacing:0}
html[lang=ur] .mono,html[lang=ur] .num,html[lang=ur] .matrix,html[lang=ur] .amt,html[lang=ur] input,html[lang=ur] select{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--forest-deep),var(--forest));color:#eafff1;display:flex;align-items:center;gap:12px;padding:10px 18px;box-shadow:0 4px 20px -8px rgba(0,0,0,.45)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:11px;background:var(--mint);display:grid;place-items:center;color:var(--forest-deep);flex:none}
.brand h1{font-size:1.02rem;font-weight:700;white-space:nowrap}
.brand small{display:block;font-size:.72rem;opacity:.8;font-weight:500}
.spacer{flex:1}
.switcher{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:4px 6px 4px 10px;min-width:0}
.switcher select{background:transparent;border:0;outline:0;color:#fff;font-weight:600;min-width:0;max-width:260px;padding:6px 2px;cursor:pointer}
.switcher select option{color:var(--ink)}
.tb-btn{background:var(--mint);color:var(--forest-deep);border:0;border-radius:9px;padding:8px 12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-height:40px}
.tb-btn.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2)}
.lang{min-width:64px;justify-content:center}

/* ---------- Pot hero ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px 18px 80px}
.pot{background:linear-gradient(135deg,var(--forest) 0%,var(--forest-soft) 70%,#2a7d47 100%);color:#f1fff6;border-radius:18px;padding:18px 22px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px 24px;align-items:center;box-shadow:0 22px 50px -28px rgba(11,59,31,.7);position:relative;overflow:hidden}
.pot::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(209,250,229,.18),transparent 70%)}
.ring{width:118px;height:118px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .track{stroke:rgba(255,255,255,.18)} .ring .prog{stroke:var(--mint-2);transition:stroke-dashoffset .9s var(--ease)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:1.35rem;font-family:var(--mono)}
.pot .k{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;opacity:.8;font-weight:600}
.pot .big{font-family:var(--mono);font-size:clamp(1.6rem,3vw,2.3rem);font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:4px 0}
.pot .of{opacity:.85;font-size:.95rem}
.pot .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:.8rem;font-weight:600;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);white-space:nowrap}
.pill.gold{background:var(--gold);color:#1f1300;border-color:var(--gold)}
.pill.warn{background:rgba(254,243,199,.2);border-color:rgba(254,243,199,.5)}
.pot .side{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:170px}
.pot .side .btn{justify-content:center}
.pot-empty{display:flex;align-items:center;gap:16px;grid-column:1/-1}

/* ---------- Tabs ---------- */
.tabs{position:relative;display:flex;gap:2px;margin:18px 0 14px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{color:var(--muted);text-decoration:none;padding:10px 14px;font-weight:600;font-size:.92rem;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;border-radius:8px 8px 0 0;min-height:42px}
.tabs a:hover{color:var(--forest);background:var(--mint-soft)}
.tabs a.active{color:var(--forest)}
.tabs .ink{position:absolute;bottom:-1px;left:0;height:3px;width:0;background:var(--forest);border-radius:3px 3px 0 0;transition:transform .3s var(--ease),width .3s var(--ease)}

/* ---------- Cards / KPIs ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:1.05rem;display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--forest-deep)}
.card h2 .ic{color:var(--forest)}
.card .lead{margin:-4px 0 12px;color:var(--muted);font-size:.9rem}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start}
.kpi .icw{width:38px;height:38px;border-radius:10px;background:var(--mint);color:var(--forest);display:grid;place-items:center;flex:none}
.kpi.gold .icw{background:var(--gold-soft);color:var(--gold-deep)} .kpi.bad .icw{background:var(--bad-soft);color:var(--bad)}
.kpi .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.kpi .v{font-size:1.3rem;font-weight:600;font-family:var(--mono);margin-top:2px;letter-spacing:-.01em}
.kpi .s{font-size:.8rem;color:var(--muted)}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .spacer{flex:1}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;background:var(--forest);color:#fff;display:inline-flex;align-items:center;gap:7px;min-height:40px;text-decoration:none;white-space:nowrap}
.btn.gold{background:var(--gold);color:#1f1300}
.btn.ghost{background:var(--surface);color:var(--forest-deep);border:1px solid var(--line)}
.btn.mint{background:var(--mint);color:var(--forest-deep)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:.82rem;border-radius:8px;min-height:36px}
.btn.icon{padding:8px;width:40px;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 8px;font-size:.74rem;font-weight:700;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.late{background:var(--late-soft);color:var(--late)} .badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.part{background:var(--part-soft);color:var(--part)} .badge.waive{background:var(--waive-soft);color:var(--waive)} .badge.gold{background:var(--gold-soft);color:var(--gold-deep)} .badge.mint{background:var(--mint);color:var(--forest-deep)} .badge.muted{background:var(--surface-2);color:var(--muted)}
.note{background:var(--mint-soft);border-left:4px solid var(--forest);padding:10px 12px;border-radius:8px;font-size:.88rem}
.note.gold{background:var(--gold-soft);border-color:var(--gold)}
.note.bad{background:var(--bad-soft);border-color:var(--bad)}
.bar{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--forest);border-radius:999px}
.bar.gold>i{background:var(--gold)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty .ic{width:38px;height:38px;color:var(--forest);opacity:.6}

/* ---------- Tables ---------- */
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--surface-2);font-weight:700;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .15s} .tbl tbody tr:hover{background:var(--mint-soft)}
.tbl td.num,.tbl th.num{text-align:right;white-space:nowrap}
.tbl .acts{display:flex;gap:4px;justify-content:flex-end}
.tbl .acts .btn{min-height:36px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--mint);color:var(--forest-deep);display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none}
.who .n{font-weight:600;white-space:nowrap} .who .p{font-size:.78rem;color:var(--muted);font-family:var(--mono)}
.tring{width:36px;height:36px;position:relative;flex:none}
.tring svg{width:100%;height:100%;transform:rotate(-90deg)} .tring circle{fill:none;stroke-width:4}
.tring .t{stroke:var(--surface-2)} .tring .p{stroke:var(--ok);transition:stroke-dashoffset .8s var(--ease)}
.tring.mid .p{stroke:var(--late)} .tring.low .p{stroke:var(--bad)}
.tring span{position:absolute;inset:0;display:grid;place-items:center;font-size:.62rem;font-weight:700;font-family:var(--mono)}

/* ---------- Payments matrix ---------- */
.matrixwrap{overflow:auto;border:1px solid var(--line);border-radius:12px;max-width:100%;-webkit-overflow-scrolling:touch;direction:ltr}
.matrix{border-collapse:separate;border-spacing:0;font-size:.78rem;min-width:max-content}
.matrix th,.matrix td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;white-space:nowrap;background:var(--surface)}
.matrix thead th{background:var(--surface-2);position:sticky;top:0;z-index:2;padding:8px 10px;font-weight:600;text-align:center;font-size:.72rem;color:var(--muted)}
.matrix thead th.cur{color:var(--forest-deep);background:var(--mint)}
.matrix thead th.sel{box-shadow:inset 0 -3px 0 var(--gold)}
.matrix th.name,.matrix td.name{position:sticky;left:0;z-index:3;text-align:left;padding:6px 12px;font-family:var(--font);font-weight:600;min-width:160px;max-width:200px;box-shadow:2px 0 0 var(--line)}
.matrix thead th.name{z-index:4;background:var(--surface-2)}
.matrix td.name small{display:block;font-weight:400;color:var(--muted);font-family:var(--mono);font-size:.7rem}
.matrix tbody tr:hover td{background:var(--mint-soft)}
.matrix tfoot td{background:var(--surface-2);padding:6px 8px;text-align:center;font-weight:600;color:var(--forest-deep)}
.matrix tfoot td.name{background:var(--surface-2);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.matrix tfoot .bar{height:6px;margin:4px 0 0;width:72px;display:inline-block}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:96px;height:50px;cursor:pointer;user-select:none;border:0;background:transparent;font-family:var(--mono);font-size:.76rem;line-height:1.2;transition:background .15s,transform .1s;padding:0}
.cell:active{transform:scale(.96)}
.cell .st{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:.7rem}
.cell .d{font-size:.64rem;opacity:.75}
.cell.unpaid{color:var(--muted)} .cell.unpaid:hover{background:var(--surface-2)}
.cell.over{background:var(--bad-soft);color:var(--bad)} .cell.paid{background:var(--ok-soft);color:var(--ok)} .cell.late{background:var(--late-soft);color:var(--late)} .cell.partial{background:var(--part-soft);color:var(--part)} .cell.waived{background:var(--waive-soft);color:var(--waive)}
.cell.future{color:#b8c4bc;cursor:default} .cell.future:hover{background:transparent}
.cell.me{box-shadow:inset 0 0 0 2px var(--gold)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.mstats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.mstat{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.mstat .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.mstat .v{font-family:var(--mono);font-weight:600;font-size:1.05rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mstat.gold{background:var(--gold-soft)} .mstat.gold .v{color:var(--gold-deep)}

/* ---------- Charts ---------- */
.chart{position:relative;background:var(--surface-2);border-radius:12px;padding:8px;min-width:0}
.chart svg{width:100%;height:auto;display:block;overflow:visible;font-family:var(--mono);direction:ltr}
.chart .tip{position:absolute;pointer-events:none;background:var(--forest-deep);color:#fff;border-radius:8px;padding:5px 9px;font-size:.76rem;transform:translate(-50%,-115%);white-space:nowrap;display:none;z-index:2;font-family:var(--mono)}
.clegend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;margin:8px 2px 0;color:var(--muted)}
.clegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.hbars{display:flex;flex-direction:column;gap:7px}
.hbar{display:grid;grid-template-columns:120px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:.82rem}
.hbar .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.hbar .bar{height:10px} .hbar .v{text-align:right;font-family:var(--mono);color:var(--muted)}

/* ---------- Schedule timeline ---------- */
.timeline{position:relative;padding-inline-start:26px}
.timeline::before{content:"";position:absolute;inset-inline-start:9px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:11px 14px;margin-bottom:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);transition:transform .2s var(--ease),border-color .2s}
.tl:hover{transform:translateX(2px);border-color:var(--mint-2)}
.tl::before{content:"";position:absolute;inset-inline-start:-22px;top:50%;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--line);transform:translateY(-50%)}
.tl.done::before{background:var(--forest);border-color:var(--forest)}
.tl.current{border-color:var(--gold);background:linear-gradient(90deg,var(--gold-soft),var(--surface) 60%)}
.tl.current::before{background:var(--gold);border-color:var(--gold);animation:pulse 2s infinite}
.tl .m{font-weight:700;color:var(--forest-deep)} .tl .r{font-size:.86rem;color:var(--muted)}
.tl>.amt{font-weight:600;text-align:right;white-space:nowrap} .tl>.amt .small{white-space:normal;font-weight:400}
.tl .bot{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.countdown{display:flex;align-items:baseline;gap:8px}
.countdown .n{font-family:var(--mono);font-size:2.6rem;font-weight:600;color:var(--gold-deep);line-height:1}
.optgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.opt{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2)}
.opt h4{font-size:.9rem;display:flex;align-items:center;gap:6px;margin-bottom:6px;color:var(--forest-deep)}
.opt .v{font-family:var(--mono);font-weight:600;font-size:1.05rem}

/* ---------- Members / order list ---------- */
.orderlist{display:flex;flex-direction:column;gap:6px}
.oitem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);transition:transform .2s var(--ease),box-shadow .2s,border-color .2s}
.oitem:hover{border-color:var(--mint-2)} .oitem.dragging{opacity:.5} .oitem.over{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.oitem .pos{width:30px;height:30px;border-radius:8px;background:var(--mint);color:var(--forest-deep);display:grid;place-items:center;font-weight:700;font-family:var(--mono);font-size:.8rem;flex:none}
.oitem.done .pos{background:var(--surface-2);color:var(--muted)} .oitem.cur .pos{background:var(--gold);color:#1f1300}
.oitem .grip{color:var(--muted);cursor:grab;display:grid;place-items:center;width:28px;height:36px}
.oitem .nm{flex:1;min-width:0;font-weight:600;line-height:1.3} .oitem .nm small{display:block;color:var(--muted);font-weight:400;font-family:var(--mono);font-size:.72rem;margin-top:2px}
.oitem .ud{display:flex;gap:2px}
/* lottery */
.lotto{position:relative;height:var(--h,300px);transition:height .3s}
.litem{position:absolute;left:0;right:0;height:44px;display:flex;align-items:center;gap:10px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);transition:top .28s var(--ease),background .3s,border-color .3s;font-weight:600}
.litem .pos{width:28px;height:28px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--mono);font-size:.78rem;font-weight:700;color:var(--muted)}
.litem.final{border-color:var(--mint-2);background:var(--mint-soft)} .litem.final .pos{background:var(--forest);color:#fff}
.litem.spin{background:var(--gold-soft)}

/* ---------- Forms ---------- */
label.f{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin:10px 0 5px}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=tel],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;outline:0;min-height:40px}
input:focus,select:focus,textarea:focus{border-color:var(--forest);box-shadow:0 0 0 3px var(--mint)}
input.bad{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
textarea{min-height:70px;resize:vertical}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.err{color:var(--bad);font-size:.78rem;margin-top:4px;min-height:1em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:none;padding:8px 11px;cursor:pointer;font-weight:600;font-size:.82rem;min-height:38px;display:inline-flex;align-items:center;gap:5px}
.seg button.on{background:var(--forest);color:#fff}

/* ---------- Modal / popover / toasts ---------- */
.scrim{position:fixed;inset:0;background:rgba(11,59,31,.45);backdrop-filter:blur(2px);z-index:40;opacity:0;pointer-events:none;transition:opacity .22s}
body.modal-open .scrim{opacity:1;pointer-events:auto}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
body.modal-open .modal{display:flex}
.sheet{background:var(--surface);border-radius:16px;width:min(620px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px -30px rgba(0,0,0,.6);animation:pop .25s var(--ease)}
.sheet.wide{width:min(820px,100%)}
.sheet header{display:flex;align-items:center;gap:10px;padding:16px 20px 8px;position:sticky;top:0;background:var(--surface);z-index:1}
.sheet header h2{font-size:1.1rem;flex:1;display:flex;align-items:center;gap:8px;color:var(--forest-deep)}
.sheet .body{padding:4px 20px 18px}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px 18px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line)}
.sheet .foot .left{margin-right:auto}
.close{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;width:38px;height:38px;cursor:pointer;display:grid;place-items:center}
.pop{position:fixed;z-index:55;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px -20px rgba(0,0,0,.45);padding:14px;width:300px;display:none;animation:pop .2s var(--ease)}
.pop.open{display:block}
.pop h4{font-size:.9rem;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.stbtns{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.stbtns button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 9px;font-size:.78rem;font-weight:700;cursor:pointer;min-height:36px;display:inline-flex;align-items:center;gap:4px}
.stbtns button.on.paid{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)} .stbtns button.on.late{background:var(--late-soft);color:var(--late);border-color:var(--late)} .stbtns button.on.partial{background:var(--part-soft);color:var(--part);border-color:var(--part)} .stbtns button.on.waived{background:var(--waive-soft);color:var(--waive);border-color:var(--waive)} .stbtns button.on.unpaid{background:var(--surface-2);border-color:var(--muted)}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;width:max-content;max-width:92vw}
.toast{background:var(--forest-deep);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:toastIn .3s var(--ease) both,toastOut .4s var(--ease) 2.8s both;display:flex;align-items:center;gap:8px}
.toast.ok{background:var(--ok)} .toast.bad{background:var(--bad)} .toast.gold{background:var(--gold);color:#1f1300}

/* ---------- Agreement / FAQ / About ---------- */
.doc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px 32px;max-width:860px;margin:0 auto;font-size:.92rem;direction:ltr;text-align:left}
.doc h3{font-size:1.25rem;text-align:center;letter-spacing:.04em;text-transform:uppercase;color:var(--forest-deep);margin-bottom:4px}
.doc .sub{text-align:center;color:var(--muted);margin-bottom:18px;font-size:.85rem}
.doc ol{padding-left:20px;margin:8px 0} .doc li{margin:6px 0}
.doc .terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px 16px;background:var(--mint-soft);border-radius:10px;padding:12px 14px;margin:12px 0}
.doc .terms div b{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.doc .ur{margin-top:22px;padding-top:18px;border-top:1px dashed var(--line);font-size:1rem}
.doc .ur h3{font-family:var(--font-ur);text-transform:none;font-size:1.3rem}
.doc .ur ol{padding-right:22px;padding-left:0}
.sigs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px 20px;margin-top:20px}
.sig{border-top:1px solid var(--ink);padding-top:6px;font-size:.82rem} .sig b{display:block} .sig span{color:var(--muted)}
.faq details{border:1px solid var(--line);border-radius:10px;padding:0 14px;margin-bottom:8px;background:var(--surface)}
.faq summary{padding:12px 0;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;list-style:none;min-height:44px}
.faq summary::-webkit-details-marker{display:none}
.faq summary .ic{color:var(--forest);transition:transform .25s var(--ease)} .faq details[open] summary .ic{transform:rotate(90deg)}
.faq p{margin:0 0 12px;color:var(--muted);font-size:.9rem}
.todo{border:1px dashed var(--forest);border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.todo h4{margin:0 0 6px;font-size:.95rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.todo .tag{font-size:.7rem;background:var(--forest);color:#fff;border-radius:6px;padding:2px 6px;font-weight:700;font-family:var(--mono)}
.todo .stars{color:var(--gold);letter-spacing:1px;font-size:.8rem}
.list{display:flex;flex-direction:column;gap:10px}
.rowi{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface);transition:background .15s}
.rowi:hover{background:var(--mint-soft)}
.statement .tot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}
.statement .tot div{background:var(--surface-2);border-radius:10px;padding:8px 10px} .statement .tot b{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}

/* ---------- Responsive ---------- */
@media (max-width:1000px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(2,minmax(0,1fr))} .g21{grid-template-columns:minmax(0,1fr)} .mstats{grid-template-columns:repeat(3,minmax(0,1fr))} .optgrid{grid-template-columns:minmax(0,1fr)} }
@media (max-width:700px){
  .topbar{flex-wrap:wrap;row-gap:8px;padding:10px 12px}
  .brand small{display:none} .brand h1{font-size:.95rem}
  .switcher{order:10;flex:1 1 100%;justify-content:space-between} .switcher select{max-width:none;flex:1}
  .topbar .spacer{display:none}
  .tb-btn .lbl{display:none} .tb-btn{padding:8px 10px}
  .wrap{padding:12px 12px 70px}
  .pot{grid-template-columns:auto minmax(0,1fr);padding:16px;gap:12px 14px}
  .pot .side{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;min-width:0} .pot .side .btn{flex:1}
  .ring{width:96px;height:96px} .ring .lbl{font-size:1.1rem}
  .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)} .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mstats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:1.1rem}
  .hbar{grid-template-columns:88px minmax(0,1fr) 46px}
  .doc{padding:18px 16px}
  .sheet .foot .left{margin-right:0;width:100%}
  .statement .tot{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tbl th,.tbl td{padding:8px 10px}
  .matrix th.name,.matrix td.name{min-width:128px;max-width:140px;padding:6px 8px;font-size:.78rem}
  .cell{width:84px}
  .countdown .n{font-size:2rem}
  .tl{grid-template-columns:minmax(0,1fr)} .tl>.amt{text-align:left}
}
@media print{
  body.printing>*:not(#printRoot){display:none!important}
  #printRoot{display:block!important;padding:0}
  .doc{border:0;padding:0;max-width:none;box-shadow:none}
  .btn,.toolbar{display:none!important}
  body{background:#fff}
}
#printRoot{display:none}
.noanim.enter,.noanim .enter,.noanim .stagger>*{animation:none}

// ---------- charts (hand-drawn SVG) ----------
function lineChart(el, series, labels, { fmt = v => nf.format(v), max = null } = {}) {
  const W = 600, H = 230, P = { l: 52, r: 14, t: 14, b: 30 }, n = labels.length;
  const mx = max ?? Math.max(1, ...series.flatMap(s => s.values)) * 1.1;
  const x = i => n > 1 ? P.l + (W - P.l - P.r) * i / (n - 1) : (P.l + W - P.r) / 2, y = v => P.t + (H - P.t - P.b) * (1 - v / mx);
  const grid = [0, .25, .5, .75, 1].map(f => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(mx * f).toFixed(1)}" y2="${y(mx * f).toFixed(1)}" stroke="var(--line)" stroke-dasharray="${f ? '3 4' : '0'}"/><text x="${P.l - 8}" y="${(y(mx * f) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${esc(fmt(mx * f))}</text>`).join('');
  const step = Math.ceil(n / 8);
  const xl = labels.map((l, i) => i % step ? '' : `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(l)}</text>`).join('');
  const paths = series.map(s => { const d = s.values.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' '); return (s.area ? `<path d="${d} L${x(n - 1).toFixed(1)} ${y(0)} L${x(0).toFixed(1)} ${y(0)}Z" fill="${s.color}" opacity=".1"/>` : '') + `<path class="ln" d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`; }).join('');
  const dots = series.map(s => s.values.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.2" fill="#fff" stroke="${s.color}" stroke-width="2"/>`).join('')).join('');
  const hits = labels.map((_, i) => `<rect data-i="${i}" x="${(x(i) - (n > 1 ? (W - P.l - P.r) / (n - 1) / 2 : 40)).toFixed(1)}" y="${P.t}" width="${(n > 1 ? (W - P.l - P.r) / (n - 1) : 80).toFixed(1)}" height="${H - P.t - P.b}" fill="transparent"/>`).join('');
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img">${grid}${xl}${paths}${dots}${hits}</svg><div class="tip"></div>` + (series.length > 1 ? `<div class="clegend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>` : '');
  const tip = $('.tip', el), svg = $('svg', el);
  svg.addEventListener('mousemove', e => { const r = e.target.closest('rect[data-i]'); if (!r) { tip.style.display = 'none'; return; } const i = +r.dataset.i, b = svg.getBoundingClientRect(), pb = el.getBoundingClientRect(); tip.style.display = 'block'; tip.style.left = (b.left - pb.left + x(i) * b.width / W) + 'px'; tip.style.top = (b.top - pb.top + y(Math.max(...series.map(s => s.values[i]))) * b.height / H) + 'px'; tip.innerHTML = `<b>${esc(labels[i])}</b> ` + series.map(s => `${series.length > 1 ? esc(s.name) + ' ' : ''}${esc(fmt(s.values[i]))}`).join(' · '); });
  svg.addEventListener('mouseleave', () => tip.style.display = 'none');
  $$('.ln', el).forEach(drawPath);
}

function lotteryModal(c) {
  if (c.members.length < 2) return toast(t('lot_need'), 'bad');
  const entries = c.order.map((id, k) => ({ id, k, locked: cycleState(c, k) === 'done', name: id ? memberById(c, id).name : t('ord_unassigned'), sl: id && (memberById(c, id).slots || 1) > 1 ? c.order.slice(0, k + 1).filter(x => x === id).length : 0 }));
  const H = 50, free = entries.filter(e => !e.locked).map(e => e.k);
  let slotOf = entries.map(e => e.k), timer = null, finalOrder = null;
  openModal(`${modalHead(t('lot_title'), 'dice')}<div class="body"><p class="lead txt">${t('lot_s')}</p><div class="lotto" id="lotto" style="--h:${entries.length * H}px">${entries.map((e, idx) => `<div class="litem ${e.locked ? 'final' : ''}" data-idx="${idx}" style="top:${e.k * H}px"><span class="pos">${e.k + 1}</span>${e.locked ? ic('lock') : ic('user')}<span>${esc(e.name)}${e.sl ? ` <small class="muted">· ${tf('mem_slot_n', { a: e.sl })}</small>` : ''}</span></div>`).join('')}</div></div>
    <div class="foot"><button class="btn ghost" id="lCancel">${t('cancel')}</button><button class="btn gold" id="lDraw">${ic('shuffle')}${t('lot_draw')}</button><button class="btn" id="lApply" disabled>${ic('check')}${t('lot_apply')}</button></div>`);
  const items = $$('.litem', $('#lotto'));
  const place = () => items.forEach((el, idx) => { el.style.top = slotOf[idx] * H + 'px'; $('.pos', el).textContent = slotOf[idx] + 1; });
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const draw = () => {
    clearTimeout(timer); $('#lApply').disabled = true; $('#lDraw').disabled = true; finalOrder = null;
    items.forEach(el => { if (!entries[+el.dataset.idx].locked) { el.classList.remove('final'); el.classList.add('spin'); } });
    let tick = 0; const total = 14;
    const step = () => { const perm = shuffle(free); entries.forEach((e, idx) => { if (!e.locked) slotOf[idx] = perm[free.indexOf(e.k) >= 0 ? entries.filter(x => !x.locked).indexOf(e) : 0]; }); place(); tick++;
      if (tick < total) timer = setTimeout(step, 90 + tick * tick * 2.2);
      else { finalOrder = slotOf.slice(); items.forEach((el, idx) => { el.classList.remove('spin'); setTimeout(() => el.classList.add('final'), slotOf[idx] * 60); }); $('#lApply').disabled = false; $('#lDraw').disabled = false; $('#lDraw').innerHTML = ic('shuffle') + t('lot_again'); } };
    step();
  };
  $('#lDraw').onclick = draw; $('#lCancel').onclick = () => { clearTimeout(timer); closeModal(); };
  $('#lApply').onclick = () => { if (!finalOrder) return; const o = new Array(c.order.length).fill(null); entries.forEach((e, idx) => o[finalOrder[idx]] = e.id); c.order = o; save(); closeModal(); toast(t('lot_applied'), 'ok'); refresh(); };
}

    <div class="muted small">${esc(c.name)} · ${tf('stm_s', { a: rs(c.contribution) + ' × ' + (m.slots || 1), b: m.slots || 1, c: turns.length ? turns.map(k => '#' + (k + 1)).join(', ') : '—' })}</div>
    <div class="tot"><div><b>${t('stm_paid')}</b><span class="amt">${rs(paid)}</span></div><div><b>${t('stm_fees')}</b><span class="amt">${rs(fees)}</span></div><div><b>${t('stm_received')}</b><span class="amt">${rs(received)}</span></div><div><b>${t('stm_ontime')}</b><span class="amt">${ok}/${due}</span></div></div>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>${t('pay_month')}</th><th>${t('ce_date')}</th><th>${t('mem_month')}</th><th class="num">${t('ce_amount')}</th><th>${t('ce_date')}</th><th>${t('ce_note')}</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function statementModal(c, m) {
  openModal(`${modalHead(t('stm_title'), 'file')}<div class="body" id="stmBody">${statementHTML(c, m)}</div><div class="foot"><button class="btn ghost left" id="stmDispute">${ic('flag')}${t('stm_dispute')}</button><button class="btn ghost" id="stmClose">${t('close')}</button><button class="btn" id="stmPrint">${ic('printer')}${t('stm_print')}</button></div>`, true);
  animRings($('#sheet'));
  $('#stmClose').onclick = closeModal; $('#stmDispute').onclick = openDispute;
  $('#stmPrint').onclick = () => printEl(`<div class="doc"><h3>${esc(c.name)} — ${t('stm_title')}</h3><div class="sub">${dateLabel(iso(today), true)}</div>${statementHTML(c, m)}</div>`);
}

// TODO(student): OTP acknowledgements. Send a one-time code to the member (SMS/WhatsApp API); when they reply with it, mark the cell
// as acknowledged ({ ack: true, ackAt }) so both sides agree the payment happened.
function requestAck() { toast(t('not_built'), 'gold', 'shield-check'); }
function cellEditor(c, i, mid, anchor) {
  const m = memberById(c, mid), p = cell(c, i, mid) || { s: 'unpaid', amt: expectedFor(c, m), date: iso(today), note: '' };
  const html = `<h4>${ic('edit')}${t('ce_title')}</h4><div class="small muted" style="margin-bottom:8px">${esc(m.name)} · ${monthLabel(monthOf(c, i), true)} · ${tf('ce_expected', { a: rs(expectedFor(c, m)) })}</div>
    <div class="stbtns" id="ceSt">${STATES.map(s => `<button type="button" class="${s} ${p.s === s ? 'on' : ''}" data-s="${s}">${t('st_' + s)}</button>`).join('')}</div>
    <label class="f" for="ceAmt">${t('ce_amount')}</label><input id="ceAmt" class="mono" type="number" min="0" step="100" value="${p.amt || 0}">
    <label class="f" for="ceDate">${t('ce_date')}</label><input id="ceDate" class="mono" type="date" value="${p.date || ''}">
    <label class="f" for="ceNote">${t('ce_note')}</label><input id="ceNote" type="text" maxlength="120" value="${esc(p.note || '')}">
    <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap"><button type="button" class="btn sm ghost" id="ceAck">${ic('shield-check')}${t('ce_ack')}</button><span class="spacer"></span><button type="button" class="btn sm ghost" id="ceCancel">${t('cancel')}</button><button type="button" class="btn sm" id="ceSave">${ic('save')}${t('f_save')}</button></div>`;
  const small = window.innerWidth < 760, pop = $('#pop');
  if (small) openModal(`${modalHead(t('ce_title'), 'edit')}<div class="body">${html.replace(/<h4>.*?<\/h4>/, '')}</div>`);
  else { closeModal(); pop.innerHTML = html; pop.classList.add('open'); const r = anchor.getBoundingClientRect(), ph = pop.offsetHeight, pw = pop.offsetWidth; pop.style.left = Math.max(8, Math.min(window.innerWidth - pw - 8, r.left)) + 'px'; pop.style.top = (r.bottom + 6 + ph > window.innerHeight ? Math.max(8, r.top - ph - 6) : r.bottom + 6) + 'px'; }
  let s = p.s;
  $$('#ceSt button').forEach(b => b.onclick = () => { s = b.dataset.s; $$('#ceSt button').forEach(x => x.classList.toggle('on', x === b)); if (s === 'paid' || s === 'late') $('#ceAmt').value = expectedFor(c, m); if (s === 'waived') $('#ceAmt').value = 0; });
  const done = () => { closePop(); closeModal(); };
  $('#ceCancel').onclick = done; $('#ceAck').onclick = requestAck;
  $('#ceSave').onclick = () => { const amt = Math.max(0, +$('#ceAmt').value || 0), date = $('#ceDate').value, note = $('#ceNote').value.trim(); done(); setStatus(c, i, mid, s, { amt, date, note }); };
}

// TODO(student): SMS reminders. Replace this stub with a backend call to an SMS gateway and a daily scheduler that runs on the
// collection day for every unpaid member.
function sendSms() { toast(t('not_built'), 'gold', 'message'); }
function reminderModal(c, i) {
  const list = c.members.filter(m => { const p = cell(c, i, m.id); return !p || p.s === 'unpaid' || p.s === 'partial'; });
  const texts = list.map(m => reminderText(c, i, m));
  openModal(`${modalHead(t('wa_title'), 'whatsapp')}<div class="body"><p class="lead txt">${t('wa_s')}</p>${list.length ? `<div class="list">${list.map((m, k) => `<div class="rowi" style="align-items:flex-start"><div style="min-width:0;flex:1"><div class="who"><div class="avatar">${esc(initials(m.name))}</div><div><div class="n">${esc(m.name)}</div><div class="p">${esc(m.phone)}</div></div></div><p class="small muted txt" style="margin:8px 0 0">${esc(texts[k])}</p></div><div style="display:flex;flex-direction:column;gap:6px"><a class="btn sm" target="_blank" rel="noopener" href="${waLink(m.phone, texts[k])}">${ic('whatsapp')}${t('wa_send')}</a><button class="btn sm ghost" data-sms>${ic('message')}${t('wa_sms')}</button></div></div>`).join('')}</div>` : `<div class="note">${ic('check-circle')} ${t('pay_none_unpaid')}</div>`}</div>
    <div class="foot"><button class="btn ghost" id="waCopy" ${list.length ? '' : 'disabled'}>${ic('copy')}${t('wa_copy')}</button><button class="btn" id="waClose">${t('close')}</button></div>`);
  $('#waClose').onclick = closeModal; $$('[data-sms]').forEach(b => b.onclick = sendSms);
  $('#waCopy').onclick = async () => { try { await navigator.clipboard.writeText(texts.join('\n\n')); toast(t('wa_copied'), 'ok'); } catch { toast(t('ab_import_err'), 'bad'); } };
}

// ---------- router & init ----------
const ROUTES = ['overview', 'members', 'payments', 'schedule', 'agreement', 'about'];
const ICONS = { overview: 'pie-chart', members: 'users', payments: 'grid', schedule: 'calendar', agreement: 'file', about: 'info' };
const currentPage = () => { const h = location.hash.replace('#', ''); return ROUTES.includes(h) ? h : 'overview'; };
function renderTabs() { const page = currentPage(); $('#tabs').innerHTML = ROUTES.map(r => `<a href="#${r}" class="${r === page ? 'active' : ''}">${ic(ICONS[r])}<span>${t('nav_' + r)}</span></a>`).join('') + '<span class="ink"></span>'; moveInk(); }
function moveInk() { const tabs = $('#tabs'), a = $('a.active', tabs), ink = $('.ink', tabs); if (!a || !ink) return; ink.style.width = a.offsetWidth + 'px'; ink.style.transform = `translateX(${a.offsetLeft}px)`; if (a.offsetLeft + a.offsetWidth > tabs.scrollLeft + tabs.clientWidth || a.offsetLeft < tabs.scrollLeft) tabs.scrollLeft = Math.max(0, a.offsetLeft - 16); }
function route(animate = true) {
  const page = currentPage(); document.body.dataset.page = page; renderTabs(); closePop();
  view.classList.toggle('noanim', !animate);
  ({ overview: renderOverview, members: renderMembers, payments: renderPayments, schedule: renderSchedule, agreement: renderAgreement, about: renderAbout })[page]();
  if (animate) { animateIn(view); window.scrollTo({ top: 0, behavior: 'smooth' }); }
}
function renderSwitcher() { const sel = $('#cSel'); sel.innerHTML = DB.committees.map(c => `<option value="${c.id}" ${c.id === DB.activeId ? 'selected' : ''}>${esc(c.name)}</option>`).join('') || `<option>${t('noC')}</option>`; sel.disabled = !DB.committees.length; }
const refresh = () => { renderSwitcher(); renderPot(); route(false); };
const renderAll = () => { renderSwitcher(); renderPot(); route(true); };
function applyLang() { document.documentElement.lang = lang; store.set('lang', lang); document.title = t('title'); $('#appTitle').textContent = t('title'); $('#appTag').textContent = t('tag'); $('#newLbl').textContent = t('newC'); $('#langBtn span').textContent = lang === 'en' ? 'اردو' : 'English'; renderAll(); }
$('#cSel').onchange = e => { DB.activeId = e.target.value; selMonth = null; save(); renderAll(); };
$('#newBtn').onclick = () => committeeForm();
$('#langBtn').onclick = () => { lang = lang === 'en' ? 'ur' : 'en'; applyLang(); };
window.addEventListener('hashchange', () => route(true));
window.addEventListener('resize', moveInk);
applyLang();
</script>
