<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rickshaw Rush</title>
<meta name="description" content="Karachi-at-dusk endless rickshaw runner: three lanes, fares, fuel, truck-art garage, daily seeded challenge. All art drawn procedurally on canvas, single file.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=Poppins:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens: Karachi dusk + truck-art chrome ---------- */
:root{
  --bg:#120a24; --panel:#24113f; --panel-2:#1b0d30; --surface:#2d1850; --surface-2:#3a2066; --line:#4a2a78;
  --magenta:#ff2e88; --yellow:#ffd23f; --cyan:#2ed3f0; --green:#3ddc84; --red:#ff5c5c; --cream:#fff3dc; --muted:#c9b7e4;
  --font:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif; --display:"Righteous","Poppins",sans-serif; --font-ur:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;
  --ease:cubic-bezier(.2,.8,.2,1); --dur:.35s; --radius:18px;
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
html.reduce *,html.reduce *::before,html.reduce *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.enter{animation:fadeUp var(--dur) var(--ease) both}
.stagger>*{animation:fadeUp .45s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.card,.tile{transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s}
.card:hover{transform:translateY(-2px)}
.fill,.bar>i{transition:width .6s var(--ease)}
.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--cream);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.15}
.ur,[lang=ur]{font-family:var(--font-ur);line-height:1.9}
html[lang=ur] .i18n{font-family:var(--font-ur);line-height:1.8}
.muted{color:var(--muted)} .hidden{display:none!important} .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

/* ---------- Stage: letterboxed canvas ---------- */
#stage{position:fixed;inset:0;display:grid;place-items:center;background:
  repeating-linear-gradient(135deg,rgba(255,46,136,.08) 0 14px,transparent 14px 28px),
  radial-gradient(ellipse at 50% 120%,#5a1d6e,transparent 60%),#120a24}
#frame{position:relative;overflow:hidden;box-shadow:0 0 0 1px #000,0 0 80px -10px rgba(255,46,136,.35)}
#c{display:block;touch-action:none;user-select:none;cursor:pointer}

/* ---------- HUD (HTML overlay) ---------- */
.hud{position:absolute;inset:0;pointer-events:none;font-family:var(--display);text-shadow:0 2px 0 #3a0b2a,0 0 12px rgba(0,0,0,.6)}
.hud .tl{position:absolute;left:12px;top:10px}
.hud .score{font-size:clamp(1.6rem,4.5vw,2.2rem);color:var(--yellow);letter-spacing:.02em;line-height:1}
.hud .lab{font:600 .68rem var(--font);text-transform:uppercase;letter-spacing:.14em;color:var(--muted);text-shadow:none}
.hud .dist{font-size:1.1rem;color:var(--cream);margin-top:4px}
.hud .dist small{font:600 .75rem var(--font);color:var(--muted)}
.hud .tr{position:absolute;right:12px;top:10px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.hud .chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hud .chip{display:inline-flex;align-items:center;gap:6px;background:rgba(27,13,48,.75);border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.95rem;color:var(--cream)}
.hud .chip .ic{color:var(--yellow)}
.hud .chip.pax .ic{color:var(--cyan)}
.hud .pause{pointer-events:auto;width:44px;height:44px;border-radius:12px;border:2px solid var(--yellow);background:rgba(27,13,48,.8);color:var(--yellow);display:grid;place-items:center;cursor:pointer}
.hud .pw{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;gap:8px}
.hud .pill{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:58px;padding:5px 8px;border-radius:12px;background:rgba(27,13,48,.8);border:1.5px solid var(--c,var(--cyan));color:var(--c,var(--cyan));font-size:.85rem;animation:pop .25s var(--ease)}
.hud .pill .bar{width:100%;height:5px;border-radius:3px;background:#000a;overflow:hidden}
.hud .pill .bar>i{display:block;height:100%;background:var(--c,var(--cyan));transition:none}
.hud .fuel{position:absolute;left:12px;bottom:14px;width:min(44%,220px)}
.hud .fuel .bar{height:14px;border:2px solid var(--cream);border-radius:9px;background:rgba(0,0,0,.6);overflow:hidden}
.hud .fuel .bar>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--red),var(--yellow) 45%,var(--green));transition:width .25s linear}
.hud .fuel.low .bar{border-color:var(--red);animation:pulse .6s infinite}
.hud .speed{position:absolute;left:12px;bottom:46px;font-size:1rem;color:var(--cream)}
.hud .speed small{font:600 .7rem var(--font);color:var(--muted)}
.hud .combo{position:absolute;right:12px;bottom:14px;text-align:right}
.hud .combo .mult{font-size:2rem;color:var(--magenta);line-height:1;transform-origin:right bottom}
.hud .combo .mult.bump{animation:pulse .3s var(--ease)}
.hud .near{position:absolute;left:50%;top:22%;transform:translateX(-50%);color:var(--cyan);font-size:1.4rem;opacity:0;transition:opacity .2s}
.hud .near.on{opacity:1}
.hint{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);background:rgba(27,13,48,.85);border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;font:500 .85rem var(--font);color:var(--cream);text-align:center;white-space:nowrap;transition:opacity .5s;pointer-events:none}
.hint .ic{color:var(--yellow)}

/* ---------- Screens (truck-art panels) ---------- */
.screen{position:fixed;inset:0;display:none;overflow:auto;padding:22px 16px;background:rgba(14,6,30,.6);backdrop-filter:blur(3px);z-index:20}
.screen.on{display:flex}
.screen.light{background:rgba(14,6,30,.28);backdrop-filter:none}
.panel{position:relative;margin:auto;width:100%;max-width:var(--w,460px);background:linear-gradient(180deg,var(--panel),#160a28);border:3px solid var(--yellow);border-radius:var(--radius);padding:22px 22px 22px;color:var(--cream);box-shadow:0 0 0 5px #160a28,0 0 0 7px var(--magenta),0 30px 70px -20px rgba(0,0,0,.9)}
.panel::before,.panel::after{content:"";position:absolute;left:18px;right:18px;height:10px;pointer-events:none}
.panel::before{top:-12px;background:radial-gradient(circle at 7px 10px,var(--cyan) 0 4px,transparent 4.6px) 0 0/14px 10px repeat-x}
.panel::after{bottom:-12px;background:radial-gradient(circle at 7px 0,var(--cyan) 0 4px,transparent 4.6px) 0 0/14px 10px repeat-x}
.chamak{height:7px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--magenta) 0 12px,var(--yellow) 12px 24px,var(--cyan) 24px 36px);margin:12px 0 16px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
.title{font-family:var(--display);font-size:clamp(2.3rem,8vw,3.6rem);line-height:1;color:var(--yellow);text-shadow:3px 3px 0 var(--magenta),6px 6px 0 #2a0b4a;letter-spacing:.01em}
.title-ur{font-family:var(--font-ur);font-size:1.35rem;color:var(--cyan);direction:rtl;margin-top:6px}
.lead{color:var(--muted);margin:6px 0 0;font-size:.92rem}
.head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.head h2{font-family:var(--display);font-size:1.6rem;color:var(--yellow);letter-spacing:.01em;flex:1;min-width:0}
.head .coinchip{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border:1.5px solid var(--yellow);border-radius:999px;padding:6px 12px;font-family:var(--display);color:var(--yellow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:11px 18px;min-height:44px;font:600 .95rem var(--font);cursor:pointer;background:var(--yellow);color:#2a0b4a;box-shadow:0 4px 0 #b88a00;transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s;text-decoration:none}
.btn:hover{transform:translateY(-1px)} .btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b88a00}
.btn.pink{background:var(--magenta);color:#fff;box-shadow:0 4px 0 #9b0f4e} .btn.pink:active{box-shadow:0 1px 0 #9b0f4e}
.btn.cyan{background:var(--cyan);color:#0b2a30;box-shadow:0 4px 0 #1289a0} .btn.cyan:active{box-shadow:0 1px 0 #1289a0}
.btn.ghost{background:var(--surface);color:var(--cream);border:2px solid var(--line);box-shadow:none} .btn.ghost:active{box-shadow:none}
.btn.big{font-size:1.2rem;padding:14px 26px;font-family:var(--display);letter-spacing:.03em;min-height:54px}
.btn.sm{padding:7px 12px;min-height:40px;font-size:.85rem;border-radius:11px}
.btn.icon{width:44px;padding:0}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.wide{width:100%}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.rowc{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.statchips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.statchip{display:inline-flex;align-items:center;gap:8px;background:var(--panel-2);border:1.5px solid var(--line);border-radius:12px;padding:7px 12px;font-size:.9rem}
.statchip b{font-family:var(--display);color:var(--yellow);font-weight:400;font-size:1.05rem}
.statchip .ic{color:var(--cyan)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.sect{font:700 .72rem var(--font);text-transform:uppercase;letter-spacing:.14em;color:var(--cyan);margin:14px 0 8px}
.uprow{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}
.uprow .uic{width:42px;height:42px;border-radius:12px;background:var(--panel-2);display:grid;place-items:center;color:var(--yellow);font-size:1.3rem}
.uprow .nm{font-weight:600} .uprow .ds{font-size:.8rem;color:var(--muted)}
.segs{display:flex;gap:4px;margin-top:6px} .segs i{flex:1;height:8px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);transition:background .4s var(--ease),border-color .4s}
.segs i.on{background:var(--cyan);border-color:var(--cyan)}
.skins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.skin{position:relative;border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:8px;text-align:center;cursor:pointer;color:var(--cream)}
.skin canvas{width:100%;aspect-ratio:1.1;display:block;border-radius:10px;background:linear-gradient(180deg,#3b1a5c,#ff7a3d)}
.skin .nm{font-size:.8rem;font-weight:600;margin-top:6px;line-height:1.25}
.skin .st{font-size:.72rem;color:var(--muted)}
.skin.sel{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(255,210,63,.25)}
.skin.locked canvas{filter:grayscale(.7) brightness(.6)}
.skin .lk{position:absolute;top:10px;right:10px;color:var(--cream);background:rgba(0,0,0,.5);border-radius:8px;padding:3px 5px;display:flex}
.tabs{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel-2)}
.tabs button{border:0;background:none;padding:9px 16px;cursor:pointer;font-weight:600;color:var(--muted);min-height:40px}
.tabs button.on{background:var(--magenta);color:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{font:700 .7rem var(--font);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .rk{font-family:var(--display);color:var(--muted);width:34px} .tbl tr:nth-child(1) .rk{color:var(--yellow)} .tbl tr:nth-child(2) .rk{color:var(--cyan)} .tbl tr:nth-child(3) .rk{color:var(--magenta)}
.tbl .ini{font-family:var(--display);letter-spacing:.08em;font-size:1rem}
.tbl tr.me td{background:rgba(255,46,136,.12)}
.tblwrap{overflow:auto;border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
.kpi .k{font:600 .68rem var(--font);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)} .kpi .v{font-family:var(--display);font-size:1.35rem;color:var(--yellow);margin-top:2px}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.ach{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:.78rem;line-height:1.3}
.ach .aic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--panel-2);color:var(--muted);flex:none;font-size:1.1rem}
.ach.on{border-color:var(--yellow)} .ach.on .aic{background:var(--yellow);color:#2a0b4a}
.ach .muted{display:block;font-size:.7rem}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.sw .d{font-size:.78rem;color:var(--muted)}
.tog{appearance:none;width:48px;height:28px;border-radius:14px;background:var(--panel-2);border:2px solid var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s,border-color .2s;margin:0}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--cream);transition:transform .2s var(--ease)}
.tog:checked{background:var(--magenta);border-color:var(--magenta)} .tog:checked::after{transform:translateX(20px)}
input[type=range]{width:120px;accent-color:var(--magenta)}
input[type=text]{background:var(--panel-2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--cream);min-height:44px;outline:0;width:100%}
input[type=text]:focus{border-color:var(--cyan)}
.ini-in{font-family:var(--display);font-size:1.6rem;letter-spacing:.3em;text-transform:uppercase;text-align:center;width:150px!important}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:.88rem;align-items:center}
kbd{display:inline-block;min-width:26px;text-align:center;padding:2px 7px;border-radius:7px;background:var(--panel-2);border:1.5px solid var(--line);border-bottom-width:3px;font:600 .78rem var(--font);color:var(--cream)}
.todo{border:1.5px dashed var(--magenta);border-radius:12px;padding:10px 12px;background:var(--surface)}
.todo h4{font-size:.92rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap} .todo .tag{font-size:.66rem;background:var(--magenta);color:#fff;border-radius:6px;padding:2px 6px;font-weight:700;letter-spacing:.04em}
.todo p{margin:4px 0 0;font-size:.84rem;color:var(--muted)}
.over-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.over-stats .kpi .v{font-size:1.25rem}
.reason{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.92rem}
.reason .ic{color:var(--red);font-size:1.3rem}
.record{display:inline-flex;align-items:center;gap:8px;background:var(--yellow);color:#2a0b4a;border-radius:999px;padding:5px 12px;font-family:var(--display);animation:pop .4s var(--ease)}
.dailybox{background:var(--panel-2);border:1.5px solid var(--cyan);border-radius:14px;padding:12px 14px}
.dailybox .seed{font-family:var(--display);letter-spacing:.12em;color:var(--cyan);font-size:1.3rem}
.note{background:rgba(46,211,240,.1);border-left:4px solid var(--cyan);padding:9px 12px;border-radius:8px;font-size:.86rem;color:var(--cream)}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:2px solid var(--yellow);color:var(--cream);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.7);animation:toastIn .3s var(--ease) both;transition:opacity .4s}
.toast .ic{color:var(--yellow)} .toast.ok{border-color:var(--green)} .toast.ok .ic{color:var(--green)} .toast.bad{border-color:var(--red)} .toast.bad .ic{color:var(--red)}
.toast.gone{opacity:0}
.backbtn{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);cursor:pointer;padding:8px 10px 8px 0;min-height:40px;font-weight:600}
.backbtn:hover{color:var(--cream)}

@media (max-width:720px){
  .two{grid-template-columns:1fr}
  .kpis,.over-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .panel{padding:18px 16px 20px}
  .hud .tr .chips{max-width:160px}
  .hud .speed{display:none}
}
@media (max-width:420px){ .skins{grid-template-columns:repeat(2,minmax(0,1fr))} .menu-grid{grid-template-columns:1fr 1fr} }
@media print{#stage,#toasts,.screen:not(#s-board){display:none!important} .screen{position:static;background:#fff;color:#000} .panel{box-shadow:none;background:#fff;color:#000}}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<symbol id="i-play" viewBox="0 0 24 24"><path d="m6 3 14 9-14 9Z"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></symbol>
<symbol id="i-rickshaw" viewBox="0 0 24 24"><path d="M4 16V9a4 4 0 0 1 4-4h6l3 6h3a2 2 0 0 1 2 2v3h-2"/><circle cx="7" cy="17" r="2.5"/><circle cx="17" cy="17" r="2.5"/><path d="M9.5 17h5M4 10h11"/></symbol>

    <div class="dailybox" style="margin-top:12px"><div class="rowc" style="justify-content:space-between"><span>${ic('calendar')} ${d}</span><span class="muted">${t('seed')}</span></div><div class="seed">${seed}</div></div>

}
function renderSettings() {
  const sw = (id, k, label, desc) => `<div class="sw"><div><div>${label}</div>${desc ? `<div class="d">${desc}</div>` : ''}</div><input type="checkbox" class="tog" id="${id}" data-set="${k}" ${P.settings[k] ? 'checked' : ''} aria-label="${esc(label)}"></div>`;
  $('#settingsBody').innerHTML = `${head(t('settings'))}
    ${sw('setSound', 'sound', ic('volume') + ' ' + t('sound'), 'WebAudio engine hum, horn, coins, crash')}

    <div class="sect">${t('controls')}</div><div class="keys"><span><kbd>←</kbd><kbd>→</kbd> <kbd>A</kbd><kbd>D</kbd></span><span>${t('k_lane')} · ${t('k_touch')}</span><span><kbd>↑</kbd> <kbd>W</kbd> <kbd>Space</kbd></span><span>${t('k_horn')} · ${t('k_touchHorn')}</span><span><kbd>P</kbd> <kbd>Esc</kbd></span><span>${t('k_pause')}</span></div>
    <div class="rowc" style="margin-top:18px"><button class="btn ghost sm" id="btnExport">${ic('download')}${t('exportJ')}</button><label class="btn ghost sm" for="impFile">${ic('upload')}${t('importJ')}</label><input type="file" id="impFile" accept="application/json" class="sr"><button class="btn ghost sm" id="btnReset" style="color:var(--red)">${ic('trash')}${t('reset')}</button></div>`;
  $$('[data-set]').forEach(el => el.onchange = () => { P.settings[el.dataset.set] = el.checked; saveP(); applyPrefs(); if (el.dataset.set === 'sound') { if (el.checked) audioInit(); else engineOn(false); } });
  $('#setVol').oninput = e => { P.settings.vol = +e.target.value; saveP(); if (master) master.gain.value = P.settings.vol; };
  $$('[data-lang]').forEach(b => b.onclick = () => setLang(b.dataset.lang));
  $('#btnExport').onclick = () => { const blob = new Blob([JSON.stringify({ profile: P, board: BOARD, boardDaily: BOARD_D, daily: store.get('daily', {}) }, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'rickshaw-rush-save.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); };
  $('#impFile').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(txt => { const j = JSON.parse(txt); if (!j.profile) throw 0; store.set('profile', j.profile); store.set('board', j.board || []); store.set('boardDaily', j.boardDaily || []); store.set('daily', j.daily || {}); toast(t('imported'), 'ok', 'check-circle'); setTimeout(() => location.reload(), 600); }).catch(() => toast(t('badFile'), 'bad', 'alert')); };
  $('#btnReset').onclick = () => { if (!confirm(t('resetQ'))) return; ['profile', 'board', 'boardDaily', 'daily'].forEach(k => store.del(k)); location.hash = '#menu'; location.reload(); };

const TODOS = [   // TODO(student): extension points — each one has a matching TODO(student) comment in the code
  ['Sprite / art pipeline', 'art', 'Replace the procedural drawObj()/drawRickshaw() with real illustrations loaded from a sprite atlas, keeping the same proj() placement.'],

function renderAbout() {
  $('#aboutBody').innerHTML = `${head(t('about_h'))}<div class="two"><div>
    <h3 style="font-size:1rem;margin-bottom:6px">${ic('gamepad')} Rickshaw Rush</h3><p class="muted" style="margin:0 0 10px;font-size:.9rem">An endless three-lane runner set on a Karachi main road at dusk. Dodge buses, pick up passengers at bus stops, keep the tank full, and spend coins in a truck-art garage. Everything on screen is drawn with canvas vectors: no image files, no game engine.</p>
    <h3 style="font-size:1rem;margin-bottom:6px">${ic('code')} How it works</h3><p class="muted" style="margin:0 0 10px;font-size:.9rem">A fixed-timestep loop (120 Hz physics, requestAnimationFrame rendering) moves objects along a pseudo-3D road: an object <code>z</code> metres ahead is projected with scale <code>CAM/(z+PD+CAM)</code>, so lane positions, sizes and the curving skyline all come from one <code>proj()</code> function. Waves of traffic are spawned so at least one lane is always passable; a sweeper removes any wall that moving traffic forms far ahead. The daily challenge seeds three RNG streams (traffic, weather, misc) from the date.</p>
    <h3 style="font-size:1rem;margin-bottom:6px">${ic('settings')} Controls</h3><div class="keys"><span><kbd>←</kbd><kbd>→</kbd></span><span>${t('k_lane')} · ${t('k_touch')}</span><span><kbd>↑</kbd></span><span>${t('k_horn')}</span><span><kbd>P</kbd></span><span>${t('k_pause')}</span></div>
    <p class="note" style="margin-top:14px">Progress is saved in this browser only (<code>localStorage</code>, prefix <code>rush:</code>). Export a JSON backup from Settings.</p></div>
    <div><div class="sect">Left for students</div><div class="stack stagger">${TODOS.map(([h, tag, b]) => `<div class="todo"><h4>${esc(h)} <span class="tag">${tag}</span></h4><p>${esc(b)}</p></div>`).join('')}</div></div></div>`;
}
function qualifies(score, list) { return score > 0 && (list.length < 10 || score > list[list.length - 1].s); }
function showOver(score, earned) {
  const list = G.daily ? BOARD_D : BOARD, q = qualifies(score, list), rec = score >= P.stats.bestScore && score > 0;
  const reason = G.over.reason === 'fuel' ? `${ic('droplet')}<span>${t('nofuel')}</span>` : `${ic('alert')}<span>${t('crashed')} ${lang === 'ur' ? NAMES[G.over.type][1] : NAMES[G.over.type][0]}</span>`;
  const st = [[t('score'), score, 'trophy'], [t('distance'), Math.round(G.dist), 'flag', v => km(v)], [t('fares'), G.fareRs, 'wallet', v => 'Rs ' + nf.format(Math.round(v))], [t('earned'), earned, 'coins', v => '+' + nf.format(Math.round(v))], [t('near'), G.near, 'zap'], [t('bestCombo'), G.bestCombo, 'flame', v => '×' + Math.round(v)]];
  $('#overBody').innerHTML = `<div class="head"><h2 id="overTitle">${t('over')}${G.daily ? ' · ' + t('dailyTab') : ''}</h2>${rec ? `<span class="record">${ic('sparkles')}${t('newrecord')}</span>` : ''}</div><div class="chamak"></div>
    <div class="reason">${reason}</div>
    <div class="over-stats stagger">${st.map(([k, v, i], idx) => `<div class="kpi tile"><div class="k">${ic(i)} ${k}</div><div class="v" id="ov${idx}">0</div></div>`).join('')}</div>
    ${q ? `<form id="iniForm" class="rowc" style="justify-content:center;margin-bottom:12px"><label for="iniIn" class="muted" style="width:100%;text-align:center;font-size:.85rem">${t('initials')}</label><input type="text" id="iniIn" class="ini-in" maxlength="3" value="${esc(store.get('ini', 'YOU'))}" autocomplete="off" aria-label="${t('initials')}"><button class="btn cyan sm" type="submit">${ic('check')}${t('save')}</button></form>` : ''}
    <div class="stack"><button class="btn big pink wide" id="btnRetry">${ic('refresh')}${t('retry')}</button><div class="menu-grid"><a class="btn ghost" href="#garage">${ic('rickshaw')}${t('garage')}</a><a class="btn ghost" href="#menu">${ic('home')}${t('quit')}</a></div></div>`;
  st.forEach(([, v, , f], idx) => countUp($('#ov' + idx), v, f ? { fmt: f } : {}));
  $('#btnRetry').onclick = () => startRun(G.daily);
  const form = $('#iniForm'); if (form) form.onsubmit = e => { e.preventDefault(); const n = ($('#iniIn').value.toUpperCase().replace(/[^A-Z0-9]/g, '') || 'YOU').slice(0, 3); store.set('ini', n); list.forEach(r => delete r.me); list.push({ n, s: score, d: Math.round(G.dist), f: G.fares, date: todayStr(), me: true, seed: G.daily ? G.seed : undefined }); list.sort((a, b) => b.s - a.s); list.length = Math.min(10, list.length); store.set(G.daily ? 'boardDaily' : 'board', list); form.innerHTML = `<span class="record">${ic('trophy')}${n}</span>`; toast(t('save'), 'ok', 'trophy'); };
  $('#s-over').classList.add('on'); animateIn($('#s-over .panel'));
}
function finishRun() {
  G.overShown = true; const s = P.stats, earned = G.coins + Math.floor(G.fareRs / 25), score = Math.round(G.score);
  s.runs++; s.dist += G.dist; s.bestDist = Math.max(s.bestDist, G.dist); const wasBest = s.bestScore; s.bestScore = Math.max(s.bestScore, score); s.bestCombo = Math.max(s.bestCombo, G.bestCombo); s.fares += G.fares; s.coins += earned; s.near += G.near; s.rainDist += G.rainDist; if (G.nightDone) s.nights++;
  P.coins += earned;
  if (G.daily) { s.dailies++; const d = store.get('daily', {}), rec = d[todayStr()] || { best: 0, plays: 0 }; rec.plays++; rec.best = Math.max(rec.best, score); d[todayStr()] = rec; store.set('daily', d); if (s.dailies >= 3) unlockAch('daily3'); }
  if (G.dist >= 5000) unlockAch('km5'); if (s.coins >= 1000) unlockAch('rich'); if (G.fares > 0) unlockAch('first_fare'); if (G.nightDone) unlockAch('night'); if (s.rainDist >= 1000) unlockAch('rain');
  saveP(); checkSkinUnlocks(); $('#hint').classList.add('hidden');
  P.stats.bestScore = Math.max(wasBest, score); showOver(score, earned);
}

// ---------- input & run control ----------
function startRun(daily) { resetRun(daily); G.mode = 'play'; G.paused = false; resetHUD(); $('#hud').classList.remove('hidden'); $('#hint').innerHTML = ic('hand') + ' ' + (touchDevice() ? t('hint') : t('hintKb')); $('#hint').style.opacity = 1; $('#hint').classList.remove('hidden'); show(null); audioInit(); engineOn(true); last = 0; }
function pause() { if (G.mode !== 'play' || G.paused) return; G.paused = true; $('#pauseSound').checked = P.settings.sound; $('#s-pause').classList.add('on'); animateIn($('#s-pause .panel')); engineOn(false); $('#btnResume').focus(); }
function resume() { if (!G.paused) return; G.paused = false; $('#s-pause').classList.remove('on'); last = 0; engineOn(true); }
function leavePlay() { G.mode = 'attract'; G.paused = false; G.objs = []; G.timeScale = 1; G.shake = 0; engineOn(false); $('#hud').classList.add('hidden'); $('#hint').classList.add('hidden'); $('#s-over').classList.remove('on'); $('#s-pause').classList.remove('on'); }
function moveLane(d) { if (G.mode !== 'play' || G.paused) return; G.lane = clamp(G.lane + d, 0, 2); }
$('#btnResume').onclick = resume; $('#btnRestart').onclick = () => startRun(G.daily); $('#btnQuit').onclick = () => { location.hash = '#menu'; };
$('#pauseSound').onchange = e => { P.settings.sound = e.target.checked; saveP(); if (e.target.checked) audioInit(); };
$('#hPause').onclick = pause;
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'text') return; const k = e.key.toLowerCase(); audioInit();
  if (k === 'arrowleft' || k === 'a') { moveLane(-1); e.preventDefault(); } else if (k === 'arrowright' || k === 'd') { moveLane(1); e.preventDefault(); }
  else if (k === 'arrowup' || k === 'w' || k === ' ') { if (G.mode === 'play') { honk(); e.preventDefault(); } }
  else if (k === 'p' || k === 'escape') { if (G.mode === 'play') G.paused ? resume() : pause(); }
  if (G.mode === 'play' && !engine) engineOn(true);
});
let pd = null;
frame.addEventListener('pointerdown', e => { if (e.target.closest('.pause')) return; pd = { x: e.clientX, y: e.clientY }; audioInit(); if (G.mode === 'play' && !engine) engineOn(true); });
frame.addEventListener('pointerup', e => {
  if (!pd) return; const dx = e.clientX - pd.x, dy = e.clientY - pd.y; pd = null; if (G.mode !== 'play' || G.paused) return;
  const r = frame.getBoundingClientRect();
  if (Math.abs(dx) > 28 && Math.abs(dx) > Math.abs(dy)) return moveLane(Math.sign(dx));
  if (Math.abs(dy) > 40) return honk();
  if (e.clientY - r.top < r.height * .28) return honk();
  moveLane(e.clientX - r.left < r.width / 2 ? -1 : 1);
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
addEventListener('resize', resize);

// ---------- loop (fixed-timestep physics, rAF render) ----------
const STEP = 1 / 120; let last = 0, acc = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (!last) last = now; const el = Math.min(.1, (now - last) / 1000); last = now; RDT = el || 1 / 60;
  acc += el; let n = 0; while (acc >= STEP && n < 12) { step(STEP * G.timeScale, STEP); acc -= STEP; n++; } if (n === 12) acc = 0;
  engineTick(); render(); updateHUD();
}

// ---------- router & language ----------
function route() {
  const h = location.hash.slice(1) || 'menu';
  if (h === 'play' || h === 'play-daily') return startRun(h === 'play-daily');
  if (G.mode !== 'attract') leavePlay();
  const name = SCREENS.includes(h) ? h : 'menu';
  ({ menu: renderMenu, garage: renderGarage, board: renderBoard, daily: renderDaily, settings: renderSettings, about: renderAbout })[name]();
  show(name);
}
function applyPrefs() { document.documentElement.classList.toggle('reduce', P.settings.reduce); }
function setLang(l) { lang = l; P.settings.lang = l; saveP(); document.documentElement.lang = l; $$('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n)); $('#langBtn span').textContent = l === 'en' ? 'اردو' : 'English'; resetHUD(); route(); }
$('#langBtn').onclick = () => setLang(lang === 'en' ? 'ur' : 'en');
addEventListener('hashchange', route);
resize(); applyPrefs(); resetRun(false); G.mode = 'attract'; G.speed = 13;
setLang(lang); requestAnimationFrame(loop);

// ---------- test hooks (used by the Playwright harness; harmless in production) ----------
window.game = {
  G, P, step, render, start: startRun, pause, resume, spawnWave, moveLane, honk,
  demoTraffic() { for (const z of [70, 170, 280]) { const n = G.objs.length; spawnWave(); for (let i = n; i < G.objs.length; i++) G.objs[i].z -= (FAR - PD) - z; } render(); },
  forceGameOver(reason = 'crash') { if (G.mode !== 'play') startRun(false); G.score = Math.max(G.score, 1234); G.dist = Math.max(G.dist, 870); G.coins += 12; G.fareRs += 240; G.fares += 2; G.near += 3; if (reason === 'fuel') endFuel(); else crash(G.objs.find(o => o.crash) || add('bus', 1, 0, 0)); G.timeScale = 1; finishRun(); },
  simulate(seconds = 60, o = {}) {
    const dt = o.dt || STEP, n = Math.round(seconds / dt), t0 = performance.now(), errors = []; let crashes = 0, maxStep = 0, lanes = 0, honks = 0;
    if (G.mode !== 'play') startRun(!!o.daily);
    for (let i = 0; i < n; i++) {
      const s0 = performance.now();
      try {
        if (o.randomLanes !== false && Math.random() < dt * 1.6) { moveLane(Math.random() < .5 ? -1 : 1); lanes++; }
        if (o.randomLanes !== false && Math.random() < dt * .3) { honk(); honks++; }
        step(dt * G.timeScale, dt);
        if (G.mode === 'over' && G.overShown) { crashes++; startRun(!!o.daily); }
        if (i % (o.every || 10) === 0) { render(); updateHUD(); }
      } catch (e) { errors.push(String(e && e.stack || e)); if (errors.length > 5) break; }
      maxStep = Math.max(maxStep, performance.now() - s0);
    }
    return { steps: n, dt, fixedStep: true, seconds, crashes, laneChanges: lanes, honks, errors, maxStepMs: +maxStep.toFixed(2), totalMs: Math.round(performance.now() - t0), objs: G.objs.length, wallFixes: G.wallFixes, dist: Math.round(G.dist), waves: G.waves, mode: G.mode };
  },
};
