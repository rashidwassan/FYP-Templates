<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client-Side Image Toolkit</title>
<meta name="description" content="Resize, crop, compress, convert, watermark and strip EXIF from photos entirely in the browser — nothing is uploaded. Passport / CNIC presets, portal requirement checker, target-size compression, print sheets, batch ZIP export. Single-file FYP template.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens: pro-tool neutral grey, white panels, charcoal ink, magenta accent ---------- */
:root{
  --bg:#f2f3f5; --surface:#ffffff; --surface-2:#f7f7f9; --surface-3:#eceef2; --ink:#23262d; --muted:#6b7080; --line:#e3e5ea; --line-2:#d3d6dd;
  --accent:#d61f69; --accent-deep:#b3185a; --accent-soft:#fde7f1; --accent-ink:#8f1247;
  --ok:#1a8a4a; --ok-soft:#e2f5e9; --warn:#b26a00; --warn-soft:#fff1d6; --bad:#c62828; --bad-soft:#fde4e2; --info:#2458c5; --info-soft:#e4ecfb;
  --check-a:#e2e4e9; --check-b:#ffffff; --toast:#23262d; --toast-ink:#ffffff;
  --radius:14px; --radius-sm:9px; --shadow:0 8px 24px -16px rgba(35,38,45,.35);
  --font:"Urbanist",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --topbar:58px;
  color-scheme:light;
}
/* Dark theme: same structure, inverted neutrals, slightly brighter accent for contrast */
:root[data-theme=dark]{
  --bg:#15171c; --surface:#1e2127; --surface-2:#262a31; --surface-3:#2f343c; --ink:#e8eaef; --muted:#9aa1b0; --line:#2f343c; --line-2:#3c424c;
  --accent:#e8368a; --accent-deep:#f25aa0; --accent-soft:#3a1f2d; --accent-ink:#ffb3d3;
  --ok:#4cc37a; --ok-soft:#163a26; --warn:#f0b24a; --warn-soft:#3b2b10; --bad:#f06a60; --bad-soft:#3d1a18; --info:#7aa6ff; --info-soft:#17284a;
  --check-a:#3a3f48; --check-b:#2a2e35; --toast:#e8eaef; --toast-ink:#15171c;
  --shadow:0 8px 24px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body{min-height:100vh;transition:background .25s,color .25s}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-deep)}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.01em}
code{font-family:var(--mono);font-size:.85em;background:var(--surface-3);padding:1px 5px;border-radius:5px}
.muted{color:var(--muted)} .small{font-size:.84rem} .hidden{display:none!important} .mono{font-family:var(--mono);font-size:.82rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--accent-soft);outline-offset:1px;border-radius:6px}
.ic{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.ic.lg{width:1.45em;height:1.45em} .ic.xl{width:2.4em;height:2.4em}

/* ---------- Motion kit ---------- */
:root{--ease:cubic-bezier(.2,.8,.2,1);--dur:.35s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(214,31,105,.35)}70%{box-shadow:0 0 0 18px rgba(214,31,105,0)}100%{box-shadow:0 0 0 0 rgba(214,31,105,0)}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.enter{animation:fadeUp var(--dur) var(--ease) both}
.stagger>*{animation:fadeUp .45s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.btn{transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s,border-color .15s}
.btn:hover{transform:translateY(-1px)} .btn:active{transform:translateY(0) scale(.98)}
.card,.tile{transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s}
.card:hover{transform:translateY(-2px)}
.fill,.bar>i{transition:width .6s var(--ease)}
.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite}
.spin{animation:spin .9s linear infinite}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;height:var(--topbar);background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:36px;height:36px;border-radius:10px;background:var(--ink);display:grid;place-items:center;color:var(--surface);flex:none}
.brand h1{font-size:1rem;font-weight:800;white-space:nowrap} .brand small{display:block;font-size:.72rem;color:var(--muted);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:.78rem;font-weight:700;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.pill.accent{background:var(--accent-soft);color:var(--accent-ink)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.grey{background:var(--surface-3);color:var(--muted)} .pill.info{background:var(--info-soft);color:var(--info)}
.spacer{flex:1}
.topbar .actions{display:flex;gap:8px;align-items:center}
.bell{position:relative}
.bell .n{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:999px;background:var(--accent);color:#fff;font-size:.66rem;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surface)}

/* ---------- Buttons, inputs ---------- */
.btn{border:1px solid transparent;border-radius:10px;min-height:40px;padding:8px 14px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--accent-deep)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line-2)} .btn.ghost:hover{background:var(--surface-2)}
.btn.soft{background:var(--accent-soft);color:var(--accent-ink)} .btn.soft:hover{filter:brightness(.97)}
.btn.dark{background:var(--ink);color:var(--surface)} .btn.dark:hover{filter:brightness(1.15)}
.btn.danger{background:var(--bad-soft);color:var(--bad)} .btn.danger:hover{filter:brightness(.97)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:.84rem;border-radius:8px} .btn.block{width:100%} .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.iconbtn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:10px;width:40px;height:40px;display:inline-grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s,transform .15s var(--ease);text-decoration:none}
.iconbtn:hover{background:var(--surface-2);border-color:var(--accent)} .iconbtn:active{transform:scale(.96)} .iconbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.iconbtn:disabled{opacity:.4;cursor:not-allowed}
label.f{display:block;font-size:.76rem;font-weight:700;color:var(--muted);margin:10px 0 5px;text-transform:uppercase;letter-spacing:.06em}
select,input[type=text],input[type=number],input[type=search],textarea{width:100%;min-height:40px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 10px;outline:0;min-width:0;color:var(--ink)}
textarea{resize:vertical;min-height:64px}
select:focus,input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=range]{width:100%;accent-color:var(--accent);height:28px;margin:0}
input[type=color]{width:40px;height:40px;border:1px solid var(--line-2);border-radius:10px;padding:2px;background:var(--surface);cursor:pointer}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);margin:0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:4px 10px} .cols>*{min-width:0}
.cols.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.rowf{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-weight:600;font-size:.9rem}
.chk.on{border-color:var(--accent);background:var(--accent-soft)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface-2);max-width:100%}
.seg button{border:0;background:none;min-height:38px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:.86rem;color:var(--muted)} .seg button.on{background:var(--ink);color:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;min-height:34px;padding:4px 12px;font-size:.82rem;font-weight:700;cursor:pointer;color:var(--ink);transition:background .15s,border-color .15s;display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff} .chip:disabled{opacity:.45;cursor:not-allowed}
.readout{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;padding:6px 0;border-bottom:1px dashed var(--line)} .readout:last-child{border-bottom:0}
.readout b{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.note{background:var(--info-soft);border-left:4px solid var(--info);padding:9px 12px;border-radius:8px;font-size:.84rem;margin-top:10px}
.note.accent{background:var(--accent-soft);border-color:var(--accent)} .note.warn{background:var(--warn-soft);border-color:var(--warn)} .note.ok{background:var(--ok-soft);border-color:var(--ok)}
.bar{height:8px;background:var(--surface-3);border-radius:999px;overflow:hidden} .bar>i{display:block;height:100%;background:var(--accent);width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.card h3{font-size:1rem;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.kbd{display:inline-block;min-width:22px;padding:2px 7px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:6px;background:var(--surface-2);font-family:var(--mono);font-size:.78rem;font-weight:700;text-align:center}

/* ---------- Empty state ---------- */
.empty{max-width:980px;margin:0 auto;padding:36px 16px 60px}
.drop{border:2px dashed var(--line-2);border-radius:22px;background:var(--surface);padding:48px 24px;text-align:center;transition:border-color .2s,background .2s,transform .2s var(--ease)}
.drop.drag,body.dragging .drop{border-color:var(--accent);background:var(--accent-soft);transform:scale(1.01)}
.drop .ring{width:84px;height:84px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 18px;animation:pulseRing 2.2s var(--ease) infinite}
.drop h2{font-size:1.7rem;font-weight:800} .drop p{color:var(--muted);margin:8px 0 18px}
.drop .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.formats{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.formats span{font-size:.74rem;font-weight:800;border:1px solid var(--line-2);border-radius:6px;padding:3px 8px;color:var(--muted);background:var(--surface-2)}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:22px}
.feat .tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.feat .tile .ic{color:var(--accent)} .feat .tile b{display:block;margin:6px 0 2px}

/* ---------- Workspace ---------- */
.ws{display:grid;grid-template-columns:76px minmax(0,1fr) 352px;grid-template-rows:minmax(0,1fr) auto;height:calc(100vh - var(--topbar));min-height:560px}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:10px 10px;display:flex;flex-direction:column;gap:4px;overflow:auto;scrollbar-width:thin}
.rail button{border:0;background:none;border-radius:12px;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.62rem;font-weight:800;letter-spacing:.02em;color:var(--muted);cursor:pointer;transition:background .15s,color .15s,transform .15s var(--ease);text-transform:uppercase;flex:none}
.rail button .ic{width:21px;height:21px}
.rail button:hover{background:var(--surface-2);color:var(--ink)} .rail button.on{background:var(--accent);color:#fff}
.rail button:active{transform:scale(.96)}
.rail .sep{flex:1}
.centre{min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.stagebar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap;min-height:50px}
.stagebar .dims{font-weight:700;font-variant-numeric:tabular-nums;font-size:.86rem;white-space:nowrap}
.stagebar .zoomv{min-width:46px;text-align:center;font-weight:800;font-size:.84rem;font-variant-numeric:tabular-nums}
.stagebar .iconbtn{width:36px;height:36px;border-radius:9px}
.stage{flex:1;min-height:0;overflow:auto;position:relative;display:grid;place-items:center;padding:24px;background:var(--bg)}
.frame{position:relative;flex:none;overflow:hidden;border-radius:4px;box-shadow:0 12px 30px -16px rgba(0,0,0,.45);background:conic-gradient(var(--check-a) 25%,var(--check-b) 0 50%,var(--check-a) 0 75%,var(--check-b) 0) 0 0/20px 20px;touch-action:none}
.frame canvas{display:block;position:absolute;left:0;top:0;width:100%;height:100%}
.frame.pix canvas{image-rendering:pixelated}
.before{position:absolute;left:0;top:0;height:100%;overflow:hidden;pointer-events:none;background:conic-gradient(var(--check-a) 25%,var(--check-b) 0 50%,var(--check-a) 0 75%,var(--check-b) 0) 0 0/20px 20px}
.before .tag,.aftertag{position:absolute;top:8px;font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:rgba(35,38,45,.78);color:#fff;border-radius:6px;padding:3px 7px;pointer-events:none}
.before .tag{left:8px} .aftertag{right:8px}
.cmp{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);transform:translateX(-1px);cursor:ew-resize;touch-action:none}
.cmp .grip{position:absolute;top:50%;left:50%;width:38px;height:38px;border-radius:50%;background:var(--surface);color:var(--accent);border:2px solid var(--accent);display:grid;place-items:center;transform:translate(-50%,-50%);box-shadow:0 6px 16px -6px rgba(0,0,0,.4);transition:transform .15s var(--ease),background .15s}
.cmp:hover .grip,.cmp.drag .grip{transform:translate(-50%,-50%) scale(1.1);background:var(--accent);color:#fff}
.peek{position:absolute;z-index:5;pointer-events:none;background:rgba(35,38,45,.92);color:#fff;border-radius:9px;padding:7px 9px;font-size:.74rem;font-family:var(--mono);display:none;white-space:nowrap;line-height:1.35}
.peek i{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid rgba(255,255,255,.5);vertical-align:-3px;margin-right:6px}
.shade{position:absolute;left:0;top:0;box-sizing:content-box;border:0 solid rgba(35,38,45,.55);pointer-events:none}
.cropbox{position:absolute;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3);cursor:move;touch-action:none}
.cropbox::before,.cropbox::after{content:"";position:absolute;inset:0;pointer-events:none}
.cropbox.grid::before{background:linear-gradient(to right,transparent calc(33.33% - .5px),rgba(255,255,255,.55) calc(33.33% - .5px),rgba(255,255,255,.55) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.55) calc(66.66% - .5px),rgba(255,255,255,.55) calc(66.66% + .5px),transparent calc(66.66% + .5px))}
.cropbox.grid::after{background:linear-gradient(to bottom,transparent calc(33.33% - .5px),rgba(255,255,255,.55) calc(33.33% - .5px),rgba(255,255,255,.55) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.55) calc(66.66% - .5px),rgba(255,255,255,.55) calc(66.66% + .5px),transparent calc(66.66% + .5px))}
.cropbox .h{position:absolute;width:22px;height:22px;transform:translate(-50%,-50%);display:grid;place-items:center}
.cropbox .h::after{content:"";width:12px;height:12px;background:#fff;border:2px solid var(--accent);border-radius:3px}
.cropbox .h.n{left:50%;top:0;cursor:ns-resize} .cropbox .h.s{left:50%;top:100%;cursor:ns-resize} .cropbox .h.e{left:100%;top:50%;cursor:ew-resize} .cropbox .h.w{left:0;top:50%;cursor:ew-resize}
.cropbox .h.nw{left:0;top:0;cursor:nwse-resize} .cropbox .h.se{left:100%;top:100%;cursor:nwse-resize} .cropbox .h.ne{left:100%;top:0;cursor:nesw-resize} .cropbox .h.sw{left:0;top:100%;cursor:nesw-resize}
.cropbox .lbl{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);background:rgba(35,38,45,.85);color:#fff;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- Properties panel ---------- */
.props{background:var(--surface);border-left:1px solid var(--line);overflow:auto;display:flex;flex-direction:column;min-width:0}
.props .ptitle{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.props .ptitle h2{font-size:1.05rem;font-weight:800} .props .ptitle .ic{color:var(--accent)} .props .ptitle p{margin:0;font-size:.8rem;color:var(--muted)}
.props .body{padding:6px 16px 16px}
.props .sect{padding:10px 0;border-bottom:1px solid var(--line)} .props .sect:last-child{border-bottom:0}
.props h4{font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:4px 0 8px;display:flex;align-items:center;gap:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.export{margin-top:auto;border-top:2px solid var(--line);background:var(--surface-2);padding:14px 16px 16px}
.export .big{font-size:1.75rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.export .est{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:6px 0 10px}
.export .links{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:.8rem}
.export .links a{cursor:pointer;font-weight:700}
.preset{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;cursor:pointer;min-height:44px;transition:border-color .15s,background .15s;color:var(--ink)}
.preset:hover{border-color:var(--accent)} .preset.on{border-color:var(--accent);background:var(--accent-soft)}
.preset b{font-size:.88rem} .preset small{display:block;color:var(--muted);font-size:.74rem} .preset .dim{font-variant-numeric:tabular-nums;font-weight:700;font-size:.8rem;white-space:nowrap;color:var(--accent-ink)}
.presets{display:grid;gap:6px}
.fmtgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fmt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;min-height:62px;transition:border-color .15s,background .15s;color:var(--ink)}
.fmt:hover{border-color:var(--accent)} .fmt.on{border-color:var(--accent);background:var(--accent-soft)} .fmt:disabled{opacity:.5;cursor:not-allowed}
.fmt b{display:block;font-size:.95rem} .fmt small{color:var(--muted);font-size:.74rem;line-height:1.3;display:block}
table.meta{width:100%;border-collapse:collapse;font-size:.86rem} table.meta td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top} table.meta td:first-child{color:var(--muted);width:42%;font-weight:600} table.meta td:last-child{font-variant-numeric:tabular-nums;word-break:break-word}
.hist{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px} .hist svg{width:100%;height:110px;display:block}
.slider{display:grid;grid-template-columns:1fr 56px;gap:8px;align-items:center;margin:4px 0}
.slider .lab{grid-column:1/-1;display:flex;justify-content:space-between;font-size:.82rem;font-weight:700;color:var(--muted)} .slider .lab b{color:var(--ink);font-variant-numeric:tabular-nums}
.slider input[type=number]{min-height:34px;padding:4px 6px;font-size:.84rem}
.results{display:grid;gap:6px;margin-top:10px}
.results .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.84rem;background:var(--surface)}
.results .r .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .results .r .sz{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;grid-column:1/-1}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.kpi .k{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800} .kpi .v{font-size:1.15rem;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px} .kpi.ok .v{color:var(--ok)}
.anchor{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:96px}
.anchor button{aspect-ratio:1;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;cursor:pointer;min-height:28px} .anchor button.on{background:var(--accent);border-color:var(--accent)}
.sheetprev{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;place-items:center;min-height:120px} .sheetprev canvas{max-width:100%;max-height:220px;box-shadow:0 4px 12px -6px rgba(0,0,0,.4)}
.checkrow{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.86rem}
.checkrow:last-child{border-bottom:0} .checkrow .ic{width:20px;height:20px} .checkrow.ok .ic{color:var(--ok)} .checkrow.bad .ic{color:var(--bad)} .checkrow.na .ic{color:var(--muted)}
.checkrow .want{color:var(--muted);font-size:.78rem} .checkrow b{font-variant-numeric:tabular-nums;white-space:nowrap}
.reqlist{display:grid;gap:6px;max-height:300px;overflow:auto;padding-right:2px;scrollbar-width:thin}
.reqlist .preset .org{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block}

/* ---------- Filmstrip ---------- */
.film{grid-column:1/-1;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:6px 12px 4px;min-height:124px}
.film .strip{flex:1;min-width:0;display:flex;gap:10px;overflow-x:auto;padding:4px 2px 4px;scrollbar-width:thin}
.thumb{flex:none;width:118px;border:2px solid var(--line);border-radius:12px;padding:6px;background:var(--surface);cursor:pointer;position:relative;text-align:left;transition:border-color .15s,transform .15s var(--ease),box-shadow .15s}
.thumb:hover{transform:translateY(-2px);box-shadow:var(--shadow)} .thumb.on{border-color:var(--accent)} .thumb.sel .pick{background:var(--accent);color:#fff;border-color:var(--accent)}
.thumb .pic{height:58px;border-radius:8px;overflow:hidden;background:conic-gradient(var(--check-a) 25%,var(--check-b) 0 50%,var(--check-a) 0 75%,var(--check-b) 0) 0 0/12px 12px;display:grid;place-items:center}
.thumb .pic canvas{max-width:100%;max-height:100%;display:block}
.thumb .nm{font-size:.72rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px} .thumb .in{font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb .pick,.thumb .rm{position:absolute;top:3px;width:24px;height:24px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
.thumb .pick{left:3px} .thumb .rm{right:3px} .thumb .rm:hover{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.thumb .pick .ic{width:14px;height:14px}
.thumb .flag{position:absolute;right:30px;top:3px;width:24px;height:24px;border-radius:7px;background:var(--bad-soft);color:var(--bad);display:grid;place-items:center} .thumb .flag .ic{width:14px;height:14px}
.film .side{flex:none;display:flex;flex-direction:column;gap:6px;align-items:flex-end;font-size:.8rem;color:var(--muted);text-align:right;max-width:220px}
.film .side b{color:var(--ink);font-variant-numeric:tabular-nums}
.film .add{flex:none;width:92px;min-height:96px;border:2px dashed var(--line-2);border-radius:12px;background:var(--surface-2);display:grid;place-items:center;cursor:pointer;color:var(--muted);font-weight:800;font-size:.72rem;text-align:center;transition:border-color .15s,color .15s}
.film .add:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- Drawer (About / Settings / Activity / Shortcuts) ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(2px);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100vw);background:var(--surface);z-index:50;transform:translateX(102%);transition:transform .3s var(--ease);box-shadow:-20px 0 60px -30px rgba(0,0,0,.5);display:flex;flex-direction:column}
body.drawer-open .scrim{opacity:1;pointer-events:auto} body.drawer-open .drawer{transform:none}
.drawer header{display:flex;align-items:center;gap:10px;padding:16px 20px 12px;border-bottom:1px solid var(--line)} .drawer header h2{font-size:1.25rem;font-weight:800;flex:1}
.drawer .dbody{padding:16px 20px 30px;overflow:auto}
.todo{border:1px dashed var(--accent);border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.todo h4{margin:0 0 4px;font-size:.95rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap} .todo .tag{font-size:.68rem;background:var(--accent);color:#fff;border-radius:6px;padding:2px 7px;font-weight:800}
.list{display:grid;gap:10px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)} .setrow>div{min-width:0} .setrow b{display:block} .setrow .muted{font-size:.8rem}
.setrow select,.setrow input[type=text]{width:170px}
.switch{position:relative;width:46px;height:26px;border-radius:999px;background:var(--line-2);border:0;cursor:pointer;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.3)} .switch.on{background:var(--accent)} .switch.on::after{transform:translateX(20px)}
.act{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.act .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-3);color:var(--muted)}
.act.unread .ico{background:var(--accent-soft);color:var(--accent-ink)} .act.privacy .ico{background:var(--bad-soft);color:var(--bad)} .act.export .ico{background:var(--ok-soft);color:var(--ok)}
.act .t{font-size:.9rem} .act.unread .t{font-weight:700} .act .when{font-size:.74rem;color:var(--muted);white-space:nowrap}
.daysep{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin:14px 0 2px}
table.keys{width:100%;border-collapse:collapse;font-size:.9rem} table.keys td{padding:8px 4px;border-bottom:1px solid var(--line)} table.keys td:first-child{width:40%;white-space:nowrap}

/* ---------- Report (printable) ---------- */
.report{max-width:1000px;margin:0 auto;padding:24px 16px 60px}
.report .rhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.report .rhead h2{font-size:1.5rem;font-weight:800} .report .rhead p{margin:4px 0 0;color:var(--muted)}
.report table{width:100%;border-collapse:collapse;font-size:.86rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.report th,.report td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.report th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2)}
.report td.num,.report th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.report .th{width:54px;height:40px;border-radius:6px;overflow:hidden;background:conic-gradient(var(--check-a) 25%,var(--check-b) 0 50%,var(--check-a) 0 75%,var(--check-b) 0) 0 0/10px 10px;display:grid;place-items:center} .report .th canvas{max-width:100%;max-height:100%}
.report .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:0 0 16px}
.report .card{margin-top:16px}
.tablewrap{overflow:auto;border-radius:12px}

/* ---------- Tour ---------- */
.tour-shade{position:fixed;left:0;top:0;z-index:70;box-sizing:content-box;border:0 solid rgba(0,0,0,.55);pointer-events:none;transition:all .3s var(--ease);border-radius:10px}
.tour-card{position:fixed;z-index:71;width:min(340px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 20px 50px -20px rgba(0,0,0,.6);animation:pop .3s var(--ease) both}
.tour-card h3{font-size:1rem;margin-bottom:6px;display:flex;align-items:center;gap:8px} .tour-card h3 .ic{color:var(--accent)}
.tour-card p{margin:0;font-size:.88rem;color:var(--muted)}
.tour-card .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.tour-card .dots{display:flex;gap:5px} .tour-card .dots i{width:7px;height:7px;border-radius:50%;background:var(--line-2)} .tour-card .dots i.on{background:var(--accent)}
body.touring{overflow:hidden}

/* ---------- Toasts ---------- */
#toasts{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--toast);color:var(--toast-ink);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);display:flex;align-items:center;gap:10px;animation:toastIn .3s var(--ease) both;font-size:.9rem}
.toast.out{animation:toastOut .3s var(--ease) both} .toast.ok{background:var(--ok);color:#fff} .toast.bad{background:var(--bad);color:#fff} .toast.accent{background:var(--accent);color:#fff}

/* ---------- Responsive ---------- */
@media (max-width:1100px){.ws{grid-template-columns:72px minmax(0,1fr) 312px}}
@media (max-width:900px){
  .ws{display:flex;flex-direction:column;height:auto;min-height:0}
  .rail{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:8px 10px;overflow-x:auto;gap:4px}
  .rail button{flex:none;min-width:62px;min-height:52px} .rail .sep{display:none}
  .centre{height:52vh;min-height:360px}
  .stage{padding:14px}
  .props{border-left:0;border-top:1px solid var(--line)} .props .ptitle{position:static}
  .export{margin-top:0}
  .film{min-height:0} .film .side{display:none}
  .topbar .pill span{display:none} .topbar .pill{padding:8px} .brand small{display:none} .topbar .btn span{display:none} .topbar .btn{padding:8px 10px}
  .topbar{flex-wrap:nowrap;gap:8px;padding:0 12px} .topbar .actions{gap:6px;flex:none} .topbar .iconbtn{width:36px;height:36px} .topbar .btn{min-height:36px}
  .brand{flex:1;min-width:0} .brand h1{overflow:hidden;text-overflow:ellipsis}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  #toasts{bottom:20px}
  .setrow{flex-wrap:wrap} .setrow select,.setrow input[type=text]{width:100%}
}
@media (max-width:480px){.fmtgrid{grid-template-columns:1fr 1fr} .drop{padding:34px 16px} .drop h2{font-size:1.35rem} .topbar #shortcutsBtn,.topbar .pill{display:none} .brand .logo{width:32px;height:32px}}
@media print{
  .topbar,.rail,.props,.film,.stagebar,#toasts,.drawer,.scrim,.peek,.tour-shade,.tour-card,.report .noprint{display:none!important}
  body{background:#fff;color:#000}
  .ws{display:block;height:auto} .stage{overflow:visible;padding:0}
  .report{max-width:none;padding:0} .report table,.report .card{box-shadow:none;break-inside:avoid}
  body.print-sheet #app>*:not(#printSheet){display:none!important}
  #printSheet{display:block!important} #printSheet img{width:100%;height:auto}
}

'use strict';
/* =====================================================================
   Client-Side Image Toolkit — single-file app
   Sections: utils · storage & settings · seed data · state · canvas ops · metadata parsers ·
             encoder & naming · ZIP writer · samples · activity log · input · render root · stage ·
             crop overlay · edits & estimate · filmstrip · panel framework · tool panels (resize, crop,
             compress, convert, adjust, rotate, stamp, metadata, check, sheet, batch) · report ·
             drawers (about, settings, activity, shortcuts) · tour · keyboard · router & boot
   Student extension points are marked with  TODO(student)
   ===================================================================== */

// ---------- utils ----------
const NS = 'imgkit:';
const $ = (selector, root = document) => root.querySelector(selector);
const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

const store = {
  get(key, fallback) {
    try {
      const raw = localStorage.getItem(NS + key);
      return raw == null ? fallback : JSON.parse(raw);
    } catch {
      return fallback;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(NS + key, JSON.stringify(value));
    } catch {
      // storage full or blocked: the app keeps working in memory
    }
  },
  del(key) {
    try {
      localStorage.removeItem(NS + key);
    } catch {
      // ignore
    }
  }
};

const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ESC_MAP[ch]);
const ic = (name, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
const tick = () => new Promise(resolve => setTimeout(resolve, 0));
const today = () => new Date().toISOString().slice(0, 10);

function fmtBytes(n) {
  if (n == null) return '—';
  if (n < 1024) return `${Math.round(n)} B`;
  if (n < 1048576) return `${(n / 1024).toFixed(n < 10240 ? 1 : 0)} KB`;
  return `${(n / 1048576).toFixed(2)} MB`;
}

// Percentage saved when `after` replaces `before` (positive = smaller)
function pct(after, before) {
  if (!before) return 0;
  return Math.round((1 - after / before) * 100);
}

function debounce(fn, ms) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), ms);
  };
}

function toast(message, type = '', icon = 'info') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = ic(icon) + `<span>${esc(message)}</span>`;
  $('#toasts').append(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 320);
  }, 3400);
}

// Motion kit helpers
function animateIn(root) {
  if (!root) return;
  root.classList.remove('enter');
  void root.offsetWidth;
  root.classList.add('enter');
  $$('.stagger', root).forEach(group => {
    [...group.children].forEach((el, i) => el.style.setProperty('--i', i));
  });
}

function countUp(el, to, options = {}) {
  if (!el) return;
  const dur = options.dur ?? 700;
  const from = options.from ?? 0;
  const fmt = options.fmt ?? (v => Math.round(v).toLocaleString('en-PK'));
  const t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(from + (to - from) * eased);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function drawPath(path) {
  const length = path.getTotalLength();
  path.style.strokeDasharray = length;
  path.style.strokeDashoffset = length;
  path.getBoundingClientRect();
  path.style.transition = 'stroke-dashoffset .9s var(--ease)';
  path.style.strokeDashoffset = 0;
}

function mkCanvas(width, height) {
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(width));
  canvas.height = Math.max(1, Math.round(height));
  return canvas;
}

const ctx2d = canvas => canvas.getContext('2d', { willReadFrequently: true });

  ['image/avif', 'AVIF', 'avif', 'Newest codec; encoder support varies by browser.']
];

// Encoder detection: toDataURL silently falls back to PNG for unsupported types
const support = {};
{
  const probe = mkCanvas(1, 1);
  FORMATS.forEach(([type]) => {
    support[type] = probe.toDataURL(type).startsWith('data:' + type);
  });
}
const fmtInfo = type => FORMATS.find(f => f[0] === type) || FORMATS[0];

const DEFAULT_SETTINGS = {

    pipe.resize = Object.assign(PIPE_DEFAULT().resize, saved.resize || {});

// ---------- canvas ops ----------
async function decode(file) {
  let bitmap;
  try {
    bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch {
    bitmap = await decodeWithImage(file);
  }
  const width = bitmap.width || bitmap.naturalWidth;
  const height = bitmap.height || bitmap.naturalHeight;
  if (!width || !height) throw new Error('empty image');
  const canvas = mkCanvas(width, height);
  ctx2d(canvas).drawImage(bitmap, 0, 0);
  if (bitmap.close) bitmap.close();
  return canvas;
}

function decodeWithImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const image = new Image();
    image.onload = () => {
      URL.revokeObjectURL(url);
      resolve(image);
    };
    image.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('decode failed'));
    };
    image.src = url;
  });
}

// High-quality downscale: halve repeatedly (box filter) until within 2× of the target, then one smooth draw.
// Alternative: createImageBitmap(src, { resizeWidth, resizeHeight, resizeQuality: 'high' }) — async, not in every browser.
function resample(src, width, height) {
  let current = src;
  let cw = src.width;
  let ch = src.height;
  while (cw / 2 >= width && ch / 2 >= height) {
    cw = Math.round(cw / 2);
    ch = Math.round(ch / 2);
    const half = mkCanvas(cw, ch);
    const hx = ctx2d(half);
    hx.imageSmoothingQuality = 'high';
    hx.drawImage(current, 0, 0, cw, ch);
    current = half;
  }
  const out = mkCanvas(width, height);
  const ox = ctx2d(out);
  ox.imageSmoothingQuality = 'high';
  ox.drawImage(current, 0, 0, width, height);
  return out;
}

function cropCanvas(src, x, y, width, height) {
  const out = mkCanvas(width, height);
  ctx2d(out).drawImage(src, x, y, width, height, 0, 0, width, height);
  return out;
}

function resizeTo(src, targetW, targetH, fit) {
  const tw = Math.max(1, Math.round(targetW));
  const th = Math.max(1, Math.round(targetH));
  const sw = src.width;
  const sh = src.height;
  if (fit === 'stretch') return resample(src, tw, th);
  if (fit === 'fit') {
    const scale = Math.min(tw / sw, th / sh);
    return resample(src, Math.max(1, Math.round(sw * scale)), Math.max(1, Math.round(sh * scale)));
  }
  // fill = cover the box, then centre-crop to the exact size
  const scale = Math.max(tw / sw, th / sh);
  const cropW = Math.min(sw, Math.round(tw / scale));
  const cropH = Math.min(sh, Math.round(th / scale));
  const cropX = Math.round((sw - cropW) / 2);
  const cropY = Math.round((sh - cropH) / 2);
  return resample(cropCanvas(src, cropX, cropY, cropW, cropH), tw, th);
}

function rotate90(src, direction) {
  const out = mkCanvas(src.height, src.width);
  const x = ctx2d(out);
  x.translate(out.width / 2, out.height / 2);
  x.rotate(direction * Math.PI / 2);
  x.drawImage(src, -src.width / 2, -src.height / 2);
  return out;
}

function flip(src, horizontal) {
  const out = mkCanvas(src.width, src.height);
  const x = ctx2d(out);
  x.translate(horizontal ? src.width : 0, horizontal ? 0 : src.height);
  x.scale(horizontal ? -1 : 1, horizontal ? 1 : -1);
  x.drawImage(src, 0, 0);
  return out;
}

// Free rotation on an auto-expanded canvas so no corner is lost
function rotateFree(src, degrees, background) {
  const rad = degrees * Math.PI / 180;
  const cos = Math.abs(Math.cos(rad));
  const sin = Math.abs(Math.sin(rad));
  const out = mkCanvas(Math.ceil(src.width * cos + src.height * sin), Math.ceil(src.width * sin + src.height * cos));
  const x = ctx2d(out);
  if (background) {
    x.fillStyle = background;
    x.fillRect(0, 0, out.width, out.height);
  }
  x.translate(out.width / 2, out.height / 2);
  x.rotate(rad);
  x.drawImage(src, -src.width / 2, -src.height / 2);
  return out;
}

function flatten(src, background) {
  const out = mkCanvas(src.width, src.height);
  const x = ctx2d(out);
  x.fillStyle = background || '#fff';
  x.fillRect(0, 0, out.width, out.height);
  x.drawImage(src, 0, 0);
  return out;
}

// Sampled alpha detection on a 64×64 copy, cached per canvas
const alphaCache = new WeakMap();
function hasAlpha(src) {
  if (alphaCache.has(src)) return alphaCache.get(src);
  const small = mkCanvas(64, 64);
  const x = ctx2d(small);
  x.drawImage(src, 0, 0, 64, 64);
  const data = x.getImageData(0, 0, 64, 64).data;
  let found = false;
  for (let i = 3; i < data.length; i += 4) {
    if (data[i] < 250) {
      found = true;
      break;
    }
  }
  alphaCache.set(src, found);
  return found;
}

function filterString(adj) {
  const base = `brightness(${adj.brightness}%) contrast(${adj.contrast}%) saturate(${adj.saturate}%) grayscale(${adj.grayscale}%) sepia(${adj.sepia}%)`;
  return adj.blur ? `${base} blur(${adj.blur}px)` : base;
}

function applyFilters(src, adj) {
  const out = mkCanvas(src.width, src.height);
  const x = ctx2d(out);
  if ('filter' in x) {
    x.filter = filterString(adj);
    x.drawImage(src, 0, 0);
    return out;
  }
  // Fallback for browsers without ctx.filter (no blur there)
  x.drawImage(src, 0, 0);
  const image = x.getImageData(0, 0, out.width, out.height);
  pixelAdjust(image.data, adj);
  x.putImageData(image, 0, 0);
  return out;
}

// CSS-filter-equivalent pixel maths
function pixelAdjust(d, adj) {
  const br = adj.brightness / 100;
  const ct = adj.contrast / 100;
  const sa = adj.saturate / 100;
  const gr = adj.grayscale / 100;
  const se = adj.sepia / 100;
  for (let i = 0; i < d.length; i += 4) {
    let r = (d[i] * br - 128) * ct + 128;
    let g = (d[i + 1] * br - 128) * ct + 128;
    let b = (d[i + 2] * br - 128) * ct + 128;
    const luma = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    r = luma + (r - luma) * sa;
    g = luma + (g - luma) * sa;
    b = luma + (b - luma) * sa;
    if (gr) {
      r += (luma - r) * gr;
      g += (luma - g) * gr;
      b += (luma - b) * gr;
    }
    if (se) {
      const sr = 0.393 * r + 0.769 * g + 0.189 * b;
      const sg = 0.349 * r + 0.686 * g + 0.168 * b;
      const sb = 0.272 * r + 0.534 * g + 0.131 * b;
      r += (sr - r) * se;
      g += (sg - g) * se;
      b += (sb - b) * se;
    }
    d[i] = clamp(r, 0, 255);
    d[i + 1] = clamp(g, 0, 255);
    d[i + 2] = clamp(b, 0, 255);
  }
}

// 256 bins × RGB from a ≤ 256×256 downsample
function histogram(src) {
  const scale = Math.min(1, 256 / Math.max(src.width, src.height));
  const small = mkCanvas(src.width * scale, src.height * scale);
  const x = ctx2d(small);
  x.drawImage(src, 0, 0, small.width, small.height);
  const d = x.getImageData(0, 0, small.width, small.height).data;
  const H = [new Uint32Array(256), new Uint32Array(256), new Uint32Array(256)];
  for (let i = 0; i < d.length; i += 4) {
    H[0][d[i]]++;
    H[1][d[i + 1]]++;
    H[2][d[i + 2]]++;
  }
  return { H, n: d.length / 4 };
}

// Histogram stretch per channel, clipping 0.5 % at each end
function autoLevel(src) {
  const out = mkCanvas(src.width, src.height);
  const x = ctx2d(out);
  x.drawImage(src, 0, 0);
  const image = x.getImageData(0, 0, out.width, out.height);
  const d = image.data;
  const H = [new Uint32Array(256), new Uint32Array(256), new Uint32Array(256)];
  for (let i = 0; i < d.length; i += 4) {
    H[0][d[i]]++;
    H[1][d[i + 1]]++;
    H[2][d[i + 2]]++;
  }
  const clip = (d.length / 4) * 0.005;
  const luts = H.map(h => levelLut(h, clip));
  for (let i = 0; i < d.length; i += 4) {
    d[i] = luts[0][d[i]];
    d[i + 1] = luts[1][d[i + 1]];
    d[i + 2] = luts[2][d[i + 2]];
  }
  x.putImageData(image, 0, 0);
  return out;
}

function levelLut(h, clip) {
  let lo = 0;
  let hi = 255;
  let acc = 0;
  while (lo < 255 && (acc += h[lo]) < clip) lo++;
  acc = 0;
  while (hi > 0 && (acc += h[hi]) < clip) hi--;
  if (hi <= lo) {
    lo = 0;
    hi = 255;
  }
  const lut = new Uint8ClampedArray(256);
  for (let v = 0; v < 256; v++) lut[v] = (v - lo) * 255 / (hi - lo);
  return lut;
}

// Median-cut palette quantization (≤ 256 colours). Fewer unique colours make the browser's PNG deflate far smaller.
// TODO(student): write a real indexed PNG (IHDR colour type 3 + PLTE/tRNS + zlib via CompressionStream) so the output is 8-bit, not 32-bit RGBA.
function quantize(src, colours = 256) {
  const out = mkCanvas(src.width, src.height);
  const x = ctx2d(out);
  x.drawImage(src, 0, 0);
  const image = x.getImageData(0, 0, out.width, out.height);
  const d = image.data;
  const palette = medianCut(samplePixels(d), colours);
  mapToPalette(d, palette);
  x.putImageData(image, 0, 0);
  out.colors = palette.length;
  return out;
}

function samplePixels(d) {
  const step = Math.max(1, Math.floor(d.length / 4 / 60000));
  const pixels = [];
  for (let i = 0; i < d.length; i += 4 * step) {
    if (d[i + 3] > 8) pixels.push([d[i], d[i + 1], d[i + 2]]);
  }
  return pixels;
}

function widestBox(boxes) {
  let best = { index: -1, range: -1, channel: 0 };
  boxes.forEach((box, index) => {
    if (box.length < 2) return;
    for (let channel = 0; channel < 3; channel++) {
      let min = 255;
      let max = 0;
      for (const p of box) {
        if (p[channel] < min) min = p[channel];
        if (p[channel] > max) max = p[channel];
      }
      if (max - min > best.range) best = { index, range: max - min, channel };
    }
  });
  return best;
}

function medianCut(pixels, colours) {
  let boxes = [pixels];
  while (boxes.length < colours) {
    const widest = widestBox(boxes);
    if (widest.index < 0 || widest.range === 0) break;
    const box = boxes[widest.index];
    box.sort((p, q) => p[widest.channel] - q[widest.channel]);
    const mid = box.length >> 1;
    boxes.splice(widest.index, 1, box.slice(0, mid), box.slice(mid));
  }
  return boxes.filter(box => box.length).map(box => {
    const sum = box.reduce((acc, p) => [acc[0] + p[0], acc[1] + p[1], acc[2] + p[2]], [0, 0, 0]);
    return sum.map(v => Math.round(v / box.length));
  });
}

function mapToPalette(d, palette) {
  const cache = new Map();
  for (let i = 0; i < d.length; i += 4) {
    const key = (d[i] >> 2) << 12 | (d[i + 1] >> 2) << 6 | (d[i + 2] >> 2);
    let index = cache.get(key);
    if (index === undefined) {
      index = nearestColour(palette, d[i], d[i + 1], d[i + 2]);
      cache.set(key, index);
    }
    d[i] = palette[index][0];
    d[i + 1] = palette[index][1];
    d[i + 2] = palette[index][2];
  }
}

function nearestColour(palette, r, g, b) {
  let best = 0;
  let bestDist = Infinity;
  for (let k = 0; k < palette.length; k++) {
    const p = palette[k];
    const dist = (p[0] - r) ** 2 + (p[1] - g) ** 2 + (p[2] - b) ** 2;
    if (dist < bestDist) {
      bestDist = dist;
      best = k;
    }
  }
  return best;
}

// Text watermark: single anchored stamp or a rotated tiled pattern
function stampCanvas(src, st, imageName = '') {
  const out = mkCanvas(src.width, src.height);
  const x = ctx2d(out);
  x.drawImage(src, 0, 0);
  const fontPx = Math.max(10, Math.round(src.width * st.size / 100));
  const text = st.text.replace('{date}', today()).replace('{name}', imageName.replace(/\.[^.]+$/, ''));
  x.font = `700 ${fontPx}px Urbanist, sans-serif`;
  x.fillStyle = st.color;
  x.globalAlpha = st.opacity / 100;
  x.textBaseline = 'middle';
  if (st.shadow) {
    x.shadowColor = 'rgba(0,0,0,.45)';
    x.shadowBlur = fontPx * 0.12;
  }
  if (st.tile) {
    drawTiledText(x, text, fontPx, st, out.width, out.height);
  } else {
    drawAnchoredText(x, text, fontPx, st, out.width, out.height);
  }
  return out;
}

function drawAnchoredText(x, text, fontPx, st, width, height) {
  const col = st.anchor % 3;
  const row = Math.floor(st.anchor / 3);
  const margin = fontPx;
  const px = col === 0 ? margin : col === 1 ? width / 2 : width - margin;
  const py = row === 0 ? margin : row === 1 ? height / 2 : height - margin;
  x.textAlign = ['left', 'center', 'right'][col];
  x.translate(px, py);
  x.rotate(st.angle * Math.PI / 180);
  x.fillText(text, 0, 0);
}

function drawTiledText(x, text, fontPx, st, width, height) {
  x.textAlign = 'center';
  const textW = x.measureText(text).width;
  const stepX = textW + fontPx * st.gap;
  const stepY = fontPx * (1 + st.gap);
  const radius = Math.hypot(width, height) / 2;
  x.translate(width / 2, height / 2);
  x.rotate(st.angle * Math.PI / 180);
  let rowIndex = 0;
  for (let y = -radius; y <= radius; y += stepY) {
    const offset = (rowIndex % 2) * stepX / 2;
    for (let tx = -radius - offset; tx <= radius; tx += stepX) x.fillText(text, tx, y);
    rowIndex++;
  }
}

// Print sheet: N copies of a photo on a paper size with optional cut marks
function buildSheet(src, options) {
  const paper = PAPERS.find(p => p[0] === options.paper) || PAPERS[0];
  const preset = PRESETS.find(p => p[0] === options.preset) || PRESETS[0];
  const [, , pw, ph] = preset;
  const gap = Math.round(options.gapMm / 25.4 * 300);
  const margin = 36;
  const cols = Math.max(1, Math.floor((paper[2] - 2 * margin + gap) / (pw + gap)));
  const rows = Math.max(1, Math.floor((paper[3] - 2 * margin + gap) / (ph + gap)));
  const capacity = cols * rows;
  const copies = options.copies > 0 ? Math.min(options.copies, capacity) : capacity;
  const out = mkCanvas(paper[2], paper[3]);
  const x = ctx2d(out);
  x.fillStyle = '#fff';
  x.fillRect(0, 0, out.width, out.height);
  const photo = resizeTo(src, pw, ph, 'fill');
  const offsetX = Math.round((paper[2] - (cols * pw + (cols - 1) * gap)) / 2);
  const offsetY = Math.round((paper[3] - (rows * ph + (rows - 1) * gap)) / 2);
  for (let i = 0; i < copies; i++) {
    const px = offsetX + (i % cols) * (pw + gap);
    const py = offsetY + Math.floor(i / cols) * (ph + gap);
    x.drawImage(photo, px, py);
    if (options.marks) drawCutMarks(x, px, py, pw, ph);
  }
  out.copies = copies;
  out.capacity = capacity;
  out.cols = cols;
  out.rows = rows;
  return out;
}

function drawCutMarks(x, px, py, pw, ph) {
  const len = 14;
  const off = 4;
  x.strokeStyle = '#8a8f99';
  x.lineWidth = 1;
  const corners = [[px, py, -1, -1], [px + pw, py, 1, -1], [px, py + ph, -1, 1], [px + pw, py + ph, 1, 1]];
  for (const [cx, cy, dx, dy] of corners) {
    x.beginPath();
    x.moveTo(cx + dx * off, cy);
    x.lineTo(cx + dx * (off + len), cy);
    x.moveTo(cx, cy + dy * off);
    x.lineTo(cx, cy + dy * (off + len));
    x.stroke();
  }
}

// ---------- metadata parsers (JPEG APPn / EXIF, PNG chunks, WebP RIFF, GIF extensions) ----------
const IFD0_TAGS = { 0x010F: 'make', 0x0110: 'model', 0x0112: 'orientation', 0x0131: 'software', 0x0132: 'dateTime', 0x013B: 'artist', 0x8298: 'copyright' };
const EXIF_TAGS = { 0x829A: 'exposure', 0x829D: 'fNumber', 0x8827: 'iso', 0x9003: 'dateOriginal', 0x920A: 'focal', 0xA002: 'pixelX', 0xA003: 'pixelY', 0xA405: 'focal35', 0xA434: 'lens' };
const GPS_TAGS = { 1: 'latRef', 2: 'lat', 3: 'lngRef', 4: 'lng', 5: 'altRef', 6: 'alt' };
const TSIZE = { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8, 7: 1, 9: 4, 10: 8 };
const ORIENT = { 1: 'Normal', 2: 'Mirrored', 3: 'Rotated 180°', 4: 'Mirrored, 180°', 5: 'Mirrored, 90° CCW', 6: 'Rotated 90° CW', 7: 'Mirrored, 90° CW', 8: 'Rotated 90° CCW' };

function ascii(view, offset, length) {
  let s = '';
  for (let i = 0; i < length && offset + i < view.byteLength; i++) {
    const code = view.getUint8(offset + i);
    if (!code) break;
    s += String.fromCharCode(code);
  }
  return s;
}

function segmentKind(marker, head) {
  if (marker === 0xE1 && head.startsWith('Exif')) return 'EXIF';
  if (marker === 0xE1 && head.includes('ns.adobe.com/xap')) return 'XMP';
  if (marker === 0xE2 && head.startsWith('ICC_PROFILE')) return 'ICC profile';
  if (marker === 0xED) return 'IPTC / Photoshop';
  if (marker === 0xE0) return 'JFIF';
  if (marker === 0xFE) return 'Comment';
  return 'APP' + (marker - 0xE0);
}

function parseJpeg(buffer) {
  const view = new DataView(buffer);
  if (view.byteLength < 4 || view.getUint16(0) !== 0xFFD8) return null;
  const out = { kind: 'JPEG', tags: null, segments: [], metaBytes: 0 };
  let offset = 2;
  while (offset + 4 <= view.byteLength && view.getUint8(offset) === 0xFF) {
    const marker = view.getUint8(offset + 1);
    if (marker === 0xDA || marker === 0xD9) break;
    const length = view.getUint16(offset + 2);
    const isApp = (marker >= 0xE0 && marker <= 0xEF) || marker === 0xFE;
    if (isApp) {
      const head = ascii(view, offset + 4, Math.min(28, length - 2));
      const kind = segmentKind(marker, head);
      out.segments.push({ kind, bytes: length + 2 });
      if (kind !== 'JFIF') out.metaBytes += length + 2;
      if (kind === 'EXIF' && !out.tags) out.tags = safeTiff(view, offset + 10, Math.min(view.byteLength, offset + 2 + length));
    }
    offset += 2 + length;
  }
  return out;
}

function safeTiff(view, start, end) {
  try {
    return parseTiff(view, start, end);
  } catch {
    return null;
  }
}

function parseTiff(view, start, end) {
  const little = view.getUint16(start) === 0x4949;
  if (view.getUint16(start + 2, little) !== 42) return null;
  const u16 = o => view.getUint16(start + o, little);
  const u32 = o => view.getUint32(start + o, little);
  const i32 = o => view.getInt32(start + o, little);
  const tags = {};

  const readValue = (type, count, o) => {
    if (type === 2) return ascii(view, start + o, count).trim();
    const one = i => {
      if (type === 1 || type === 7) return view.getUint8(start + o + i);
      if (type === 3) return u16(o + i * 2);
      if (type === 4) return u32(o + i * 4);
      if (type === 9) return i32(o + i * 4);
      if (type === 5) return u32(o + i * 8) / (u32(o + i * 8 + 4) || 1);
      return i32(o + i * 8) / (i32(o + i * 8 + 4) || 1);
    };
    if (count === 1) return one(0);
    return Array.from({ length: Math.min(count, 64) }, (_, i) => one(i));
  };

  const readIfd = (o, map, depth) => {
    if (depth > 2 || o < 8 || start + o + 2 > end) return;
    const entries = Math.min(u16(o), 200);
    for (let i = 0; i < entries; i++) {
      const e = o + 2 + i * 12;
      if (start + e + 12 > end) return;
      const tag = u16(e);
      const type = u16(e + 2);
      const count = u32(e + 4);
      if (!TSIZE[type]) continue;
      const size = TSIZE[type] * count;
      const valueOffset = size > 4 ? u32(e + 8) : e + 8;
      if (start + valueOffset + size > end) continue;
      if (tag === 0x8769) readIfd(u32(e + 8), EXIF_TAGS, depth + 1);
      else if (tag === 0x8825) readIfd(u32(e + 8), GPS_TAGS, depth + 1);
      else if (map[tag]) tags[map[tag]] = readValue(type, count, valueOffset);
    }
  };

  readIfd(u32(4), IFD0_TAGS, 0);
  return tags;
}

const PNG_META_CHUNKS = ['tEXt', 'zTXt', 'iTXt', 'eXIf', 'iCCP', 'tIME', 'pHYs'];
function parsePng(buffer) {
  const view = new DataView(buffer);
  if (view.byteLength < 8 || view.getUint32(0) !== 0x89504E47) return null;
  const out = { kind: 'PNG', tags: null, segments: [], texts: [], metaBytes: 0 };
  let offset = 8;
  while (offset + 8 <= view.byteLength) {
    const length = view.getUint32(offset);
    const type = ascii(view, offset + 4, 4);
    if (PNG_META_CHUNKS.includes(type)) {
      out.segments.push({ kind: type, bytes: length + 12 });
      if (type !== 'pHYs') out.metaBytes += length + 12;
    }
    if (type === 'tEXt' && offset + 8 + length <= view.byteLength) {
      const raw = ascii(view, offset + 8, length);
      const value = ascii(view, offset + 8 + raw.length + 1, length - raw.length - 1);
      out.texts.push([raw, value]);
    }
    if (type === 'eXIf' && offset + 8 + length <= view.byteLength) out.tags = safeTiff(view, offset + 8, offset + 8 + length);
    if (type === 'IEND') break;
    offset += 12 + length;
  }
  return out;
}

function parseWebp(buffer) {
  const view = new DataView(buffer);
  if (view.byteLength < 12 || ascii(view, 0, 4) !== 'RIFF' || ascii(view, 8, 4) !== 'WEBP') return null;
  const out = { kind: 'WebP', tags: null, segments: [], metaBytes: 0 };
  let offset = 12;
  while (offset + 8 <= view.byteLength) {
    const type = ascii(view, offset, 4);
    const length = view.getUint32(offset + 4, true);
    if (type === 'EXIF' || type === 'XMP ' || type === 'ICCP') {
      out.segments.push({ kind: type === 'ICCP' ? 'ICC profile' : type.trim(), bytes: length + 8 });
      out.metaBytes += length + 8;
    }
    if (type === 'EXIF' && !out.tags && offset + 8 + length <= view.byteLength) {
      const hasHeader = ascii(view, offset + 8, 4) === 'Exif';
      out.tags = safeTiff(view, offset + 8 + (hasHeader ? 6 : 0), offset + 8 + length);
    }
    offset += 8 + length + (length % 2);
  }
  return out;
}

function skipGifSubBlocks(view, offset) {
  while (offset < view.byteLength) {
    const size = view.getUint8(offset);
    offset += 1 + size;
    if (size === 0) break;
  }
  return offset;
}

function parseGif(buffer) {
  const view = new DataView(buffer);
  if (view.byteLength < 13 || ascii(view, 0, 3) !== 'GIF') return null;
  const out = { kind: 'GIF', tags: null, segments: [], texts: [], metaBytes: 0, frames: 0 };
  const packed = view.getUint8(10);
  let offset = 13 + ((packed & 0x80) ? 3 << ((packed & 7) + 1) : 0);
  while (offset < view.byteLength) {
    const block = view.getUint8(offset);
    if (block === 0x3B) break;
    if (block === 0x2C) {
      out.frames++;
      const localPacked = view.getUint8(offset + 9);
      offset += 10 + ((localPacked & 0x80) ? 3 << ((localPacked & 7) + 1) : 0) + 1;
      offset = skipGifSubBlocks(view, offset);
      continue;
    }
    if (block !== 0x21) break;
    const label = view.getUint8(offset + 1);
    const start = offset;
    offset = skipGifSubBlocks(view, offset + 2);
    if (label === 0xFE) {
      out.segments.push({ kind: 'Comment', bytes: offset - start });
      out.metaBytes += offset - start;
      out.texts.push(['Comment', ascii(view, start + 3, view.getUint8(start + 2))]);
    } else if (label === 0xFF) {
      const app = ascii(view, start + 3, 11);
      out.segments.push({ kind: app.startsWith('XMP') ? 'XMP' : 'Application: ' + app, bytes: offset - start });
      out.metaBytes += offset - start;
    }
  }
  return out;
}

function parseMetadata(buffer, type, name) {
  const lower = name.toLowerCase();
  if (/jpe?g/.test(type) || /\.jpe?g$/.test(lower)) return parseJpeg(buffer);
  if (type === 'image/png' || lower.endsWith('.png')) return parsePng(buffer);
  if (type === 'image/webp' || lower.endsWith('.webp')) return parseWebp(buffer);
  if (type === 'image/gif' || lower.endsWith('.gif')) return parseGif(buffer);
  return null;
}

const dms = value => Array.isArray(value) ? value[0] + (value[1] || 0) / 60 + (value[2] || 0) / 3600 : +value;

function gpsOf(tags) {
  if (!tags || tags.lat == null || tags.lng == null) return null;
  return {
    lat: dms(tags.lat) * (tags.latRef === 'S' ? -1 : 1),
    lng: dms(tags.lng) * (tags.lngRef === 'W' ? -1 : 1)
  };
}

// ---------- encoder, naming, estimates ----------
const encode = (canvas, type, quality) => new Promise(resolve => canvas.toBlob(resolve, type, quality / 100));
const quantCache = new WeakMap();

// Flatten alpha for JPEG, quantize for PNG — re-encoding pixels only, so no metadata survives
function prepareExport(src, format, options = {}) {
  let canvas = src;
  const background = options.bg ?? pipe.bg;
  if (format === 'image/jpeg' && hasAlpha(canvas)) canvas = flatten(canvas, background);
  const wantQuantize = options.quantize ?? pipe.quantize;
  if (format === 'image/png' && wantQuantize) {
    if (!quantCache.has(src)) quantCache.set(src, quantize(src));
    canvas = quantCache.get(src);
  }
  return canvas;
}

// TODO(student): keep or write chosen metadata — rebuild an APP1 segment (see loadSamples() for the splice) with date / copyright and insert it after SOI of the encoded JPEG.
async function exportBlob(src, format = pipe.format, quality = pipe.quality, options = {}) {
  const canvas = prepareExport(src, format, options);
  const targetOn = options.targetOn ?? pipe.targetOn;
  if (format !== 'image/png' && targetOn) {
    const targetBytes = (options.targetKB ?? pipe.targetKB) * 1024;
    const found = await findQuality(canvas, format, targetBytes);
    return { blob: await encode(canvas, format, found.quality), quality: found.quality, hit: found.hit };
  }
  return { blob: await encode(canvas, format, quality), quality, hit: null };
}

// Binary search the highest quality whose encoded size fits the target (7 encodes max)
async function findQuality(canvas, format, targetBytes) {
  let lo = 1;
  let hi = 100;
  let best = null;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    const blob = await encode(canvas, format, mid);
    if (blob.size <= targetBytes) {
      best = mid;
      lo = mid + 1;
    } else {
      hi = mid - 1;
    }
  }
  if (best == null) return { quality: 1, hit: false };
  return { quality: best, hit: true };
}

function outName(img, canvas, format = pipe.format) {
  const base = img.name.replace(/\.[^.]+$/, '') || 'image';
  const changed = canvas.width !== img.orig.width || canvas.height !== img.orig.height;
  let pattern = settings.pattern || '{name}-{w}x{h}';
  if (settings.suffix && !changed) pattern = '{name}';
  const name = pattern
    .replace(/\{name\}/g, base)
    .replace(/\{w\}/g, canvas.width)
    .replace(/\{h\}/g, canvas.height)
    .replace(/\{fmt\}/g, fmtInfo(format)[1].toLowerCase())
    .replace(/\{date\}/g, today())
    .replace(/\{q\}/g, pipe.quality);
  return `${name}.${fmtInfo(format)[2]}`;
}

function saveBlob(blob, name) {
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = name;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 4000);
}

// Unit helpers for the Resize / Check panels
function fmtUnits(px) {
  if (settings.units === 'mm') return `${(px / settings.dpi * 25.4).toFixed(1)} mm`;
  if (settings.units === 'in') return `${(px / settings.dpi).toFixed(2)} in`;
  return `${px} px`;
}

function ratioText(w, h) {
  const g = gcd(w, h);
  const a = w / g;
  const b = h / g;
  if (a > 50 || b > 50) return (w / h).toFixed(3) + ':1';
  return `${a}:${b}`;
}

function gcd(a, b) {
  return b ? gcd(b, a % b) : a;
}

// ---------- ZIP writer (STORE method, CRC-32, UTF-8 names) — no library ----------
const CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    table[n] = c >>> 0;
  }
  return table;
})();

function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function dosDateTime(date) {
  const time = (date.getHours() << 11) | (date.getMinutes() << 5) | (date.getSeconds() >> 1);
  const day = ((date.getFullYear() - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate();
  return { time, day };
}

function localHeader(name, crc, size, stamp) {
  const view = new DataView(new ArrayBuffer(30));
  view.setUint32(0, 0x04034b50, true);
  view.setUint16(4, 20, true);
  view.setUint16(6, 0x0800, true);
  view.setUint16(8, 0, true);
  view.setUint16(10, stamp.time, true);
  view.setUint16(12, stamp.day, true);
  view.setUint32(14, crc, true);
  view.setUint32(18, size, true);
  view.setUint32(22, size, true);
  view.setUint16(26, name.length, true);
  view.setUint16(28, 0, true);
  return new Uint8Array(view.buffer);
}

function centralHeader(name, crc, size, stamp, offset) {
  const view = new DataView(new ArrayBuffer(46));
  view.setUint32(0, 0x02014b50, true);
  view.setUint16(4, 20, true);
  view.setUint16(6, 20, true);
  view.setUint16(8, 0x0800, true);
  view.setUint16(10, 0, true);
  view.setUint16(12, stamp.time, true);
  view.setUint16(14, stamp.day, true);
  view.setUint32(16, crc, true);
  view.setUint32(20, size, true);
  view.setUint32(24, size, true);
  view.setUint16(28, name.length, true);
  view.setUint32(42, offset, true);
  return new Uint8Array(view.buffer);
}

function makeZip(files) {
  const encoder = new TextEncoder();
  const parts = [];
  const central = [];
  const stampNow = dosDateTime(new Date());
  let offset = 0;
  for (const file of files) {
    const name = encoder.encode(file.name);
    const crc = crc32(file.data);
    parts.push(localHeader(name, crc, file.data.length, stampNow), name, file.data);
    central.push(centralHeader(name, crc, file.data.length, stampNow, offset), name);
    offset += 30 + name.length + file.data.length;
  }
  const centralSize = central.reduce((sum, part) => sum + part.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true);
  end.setUint16(10, files.length, true);
  end.setUint32(12, centralSize, true);
  end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}

function seeded(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };

function addGrain(x, width, height, amount, rnd) {
  const image = x.getImageData(0, 0, width, height);
  const d = image.data;
  for (let i = 0; i < d.length; i += 4) {
    const g = (rnd() - 0.5) * amount;
    d[i] += g;
    d[i + 1] += g;
    d[i + 2] += g;
  }
  x.putImageData(image, 0, 0);
}

// 800×800 PNG with transparency (checkerboard + palette quantization demo)
function drawLogo() {

  x.lineCap = 'round';
  x.beginPath();
  x.arc(400, 400, 190, Math.PI * 0.8, Math.PI * 2.2);
  x.stroke();
  x.fillStyle = '#fff';
  x.beginPath();
  x.arc(400, 400, 70, 0, 7);
  x.fill();
  x.fillStyle = 'rgba(255,255,255,.35)';
  x.beginPath();
  x.arc(560, 230, 60, 0, 7);
  x.fill();
  return canvas;
}

// 1240×1754 "scanned form" (A4 @150 dpi) — the typical 1–3 MB phone scan people need under 200 KB
function drawScan() {
  const canvas = mkCanvas(1240, 1754);
  const x = ctx2d(canvas);
  const rnd = seeded(3);
  x.fillStyle = '#f3efe6';
  x.fillRect(0, 0, 1240, 1754);
  addGrain(x, 1240, 1754, 26, rnd);
  x.fillStyle = '#1d2a4a';
  x.font = '800 44px Urbanist, sans-serif';
  x.fillText('UNIVERSITY ADMISSION FORM 2026', 120, 170);
  x.font = '600 24px Urbanist, sans-serif';
  x.fillStyle = '#44506b';
  x.fillText('Attach passport-size photo (35 × 45 mm) · Upload limit 200 KB', 120, 220);
  const labels = ['Name', 'Father name', 'CNIC / B-Form', 'Date of birth', 'Domicile', 'Programme', 'Matric marks', 'Intermediate marks', 'Mobile', 'Email', 'Address'];
  x.strokeStyle = '#8a92a8';
  x.lineWidth = 2;
  for (let i = 0; i < 22; i++) {
    const y = 320 + i * 60;
    x.beginPath();
    x.moveTo(120, y);
    x.lineTo(1120, y);
    x.stroke();
    x.fillStyle = '#2c3550';
    x.font = '500 22px Urbanist, sans-serif';
    x.fillText(labels[i % labels.length] + ' : ' + '_'.repeat(28), 130, y - 14);
  }
  x.strokeStyle = '#1d2a4a';
  x.lineWidth = 3;
  x.strokeRect(880, 120, 240, 300);
  x.fillStyle = '#6b7080';
  x.font = '600 20px Urbanist, sans-serif';
  x.fillText('PHOTO', 962, 280);
  return canvas;
}

// 1200×900 stylised portrait, stored sideways with EXIF Orientation 6 so it decodes upright as 900×1200
function drawPortrait() {
  const canvas = mkCanvas(1200, 900);
  const x = ctx2d(canvas);
  const rnd = seeded(11);
  const bg = x.createLinearGradient(0, 0, 0, 900);
  bg.addColorStop(0, '#dfe7f1');
  bg.addColorStop(1, '#b9c7d9');
  x.fillStyle = bg;
  x.fillRect(0, 0, 1200, 900);
  // the content is drawn rotated 90° CCW: the camera held sideways
  x.translate(600, 450);
  x.rotate(-Math.PI / 2);
  x.fillStyle = '#5a3d2e';
  x.beginPath();
  x.ellipse(0, -60, 150, 190, 0, 0, 7);
  x.fill();
  x.fillStyle = '#c99a7a';
  x.beginPath();
  x.ellipse(0, -30, 125, 160, 0, 0, 7);
  x.fill();
  x.fillStyle = '#2b4a7a';
  x.beginPath();
  x.moveTo(-260, 420);
  x.quadraticCurveTo(-200, 150, 0, 150);
  x.quadraticCurveTo(200, 150, 260, 420);
  x.closePath();
  x.fill();
  x.fillStyle = '#3a2a22';
  x.beginPath();
  x.ellipse(-45, -60, 12, 16, 0, 0, 7);
  x.ellipse(45, -60, 12, 16, 0, 0, 7);
  x.fill();
  x.strokeStyle = '#8a4a3a';
  x.lineWidth = 6;
  x.beginPath();
  x.arc(0, 20, 40, 0.2, Math.PI - 0.2);
  x.stroke();
  x.setTransform(1, 0, 0, 1, 0, 0);
  addGrain(x, 1200, 900, 10, rnd);
  return canvas;
}

// 1000×700 chart-like screenshot with very few colours (palette reduction shines here)
function drawChart() {
  const canvas = mkCanvas(1000, 700);
  const x = ctx2d(canvas);
  x.fillStyle = '#ffffff';
  x.fillRect(0, 0, 1000, 700);
  x.fillStyle = '#23262d';
  x.font = '800 30px Urbanist, sans-serif';
  x.fillText('Monthly uploads under 200 KB', 60, 70);
  x.strokeStyle = '#e3e5ea';
  x.lineWidth = 2;
  for (let i = 0; i < 6; i++) {
    const y = 150 + i * 90;
    x.beginPath();
    x.moveTo(60, y);
    x.lineTo(940, y);
    x.stroke();
  }
  const values = [38, 52, 61, 48, 75, 83, 91, 70, 95, 88, 97, 99];
  const colours = ['#d61f69', '#5b2a86', '#1a8a4a', '#2458c5'];
  values.forEach((v, i) => {
    const h = v * 4.5;
    x.fillStyle = colours[i % 4];
    x.fillRect(80 + i * 72, 600 - h, 48, h);
  });
  x.fillStyle = '#6b7080';
  x.font = '600 18px Urbanist, sans-serif';
  'JFMAMJJASOND'.split('').forEach((m, i) => x.fillText(m, 98 + i * 72, 640));
  return canvas;
}

// 1400×1050 product photo for the WebP route (only when the browser encodes WebP)
function drawProduct() {
  const canvas = mkCanvas(1400, 1050);
  const x = ctx2d(canvas);
  const rnd = seeded(5);
  const bg = x.createRadialGradient(700, 500, 100, 700, 500, 900);
  bg.addColorStop(0, '#fff7ee');
  bg.addColorStop(1, '#d9c7b2');
  x.fillStyle = bg;
  x.fillRect(0, 0, 1400, 1050);
  x.fillStyle = 'rgba(0,0,0,.18)';
  x.beginPath();
  x.ellipse(700, 820, 380, 60, 0, 0, 7);
  x.fill();
  const body = x.createLinearGradient(400, 0, 1000, 0);
  body.addColorStop(0, '#8b2a4a');
  body.addColorStop(0.5, '#d61f69');
  body.addColorStop(1, '#6a1d3a');
  x.fillStyle = body;
  x.beginPath();
  if (x.roundRect) x.roundRect(420, 260, 560, 560, 80);
  else x.rect(420, 260, 560, 560);
  x.fill();
  x.fillStyle = 'rgba(255,255,255,.55)';
  x.beginPath();
  x.ellipse(560, 380, 70, 130, -0.5, 0, 7);
  x.fill();
  addGrain(x, 1400, 1050, 8, rnd);
  return canvas;
}

// Splice an APP1 EXIF segment right after the JPEG SOI marker
function spliceExif(jpegBytes, base64) {
  const payload = Uint8Array.from(atob(base64), ch => ch.charCodeAt(0));
  const segment = new Uint8Array(4 + payload.length);
  segment.set([0xFF, 0xE1, (payload.length + 2) >> 8, (payload.length + 2) & 255]);
  segment.set(payload, 4);
  return [jpegBytes.slice(0, 2), segment, jpegBytes.slice(2)];
}

// Insert PNG tEXt chunks (keyword\0text) with CRC after IHDR
function splicePngText(pngBytes, entries) {
  const encoder = new TextEncoder();
  const chunks = entries.map(([keyword, text]) => {
    const body = encoder.encode(`${keyword}\0${text}`);
    const chunk = new Uint8Array(12 + body.length);
    const view = new DataView(chunk.buffer);
    view.setUint32(0, body.length);
    chunk.set([0x74, 0x45, 0x58, 0x74], 4);
    chunk.set(body, 8);
    view.setUint32(8 + body.length, crc32(chunk.subarray(4, 8 + body.length)));
    return chunk;
  });
  const ihdrEnd = 8 + 25;
  return [pngBytes.slice(0, ihdrEnd), ...chunks, pngBytes.slice(ihdrEnd)];
}

async function loadSamples() {
  const files = [];
  const photo = new Uint8Array(await (await encode(drawPhoto(), 'image/jpeg', 92)).arrayBuffer());
  files.push(new File(spliceExif(photo, SAMPLE_EXIF_GPS), 'lahore-sunset.jpg', { type: 'image/jpeg' }));
  const portrait = new Uint8Array(await (await encode(drawPortrait(), 'image/jpeg', 90)).arrayBuffer());
  files.push(new File(spliceExif(portrait, SAMPLE_EXIF_ROT), 'ayesha-portrait.jpg', { type: 'image/jpeg' }));
  const logo = new Uint8Array(await (await encode(drawLogo(), 'image/png')).arrayBuffer());
  const logoText = [['Author', 'Design team'], ['Software', 'Image Toolkit sample generator'], ['Comment', 'Transparent logo for palette tests']];
  files.push(new File(splicePngText(logo, logoText), 'logo-transparent.png', { type: 'image/png' }));
  files.push(new File([await encode(drawScan(), 'image/jpeg', 95)], 'admission-form-scan.jpg', { type: 'image/jpeg' }));
  files.push(new File([await encode(drawChart(), 'image/png')], 'uploads-chart.png', { type: 'image/png' }));
  if (support['image/webp']) files.push(new File([await encode(drawProduct(), 'image/webp', 90)], 'product-photo.webp', { type: 'image/webp' }));
  logEvent('system', `Generated ${files.length} sample images`, 'sparkles');
  await addFiles(files);
}

// ---------- activity log (persisted, file names only — never pixels) ----------
let activity = store.get('activity', []);

function logEvent(type, text, icon = 'info') {
  if (!settings.logActivity) return;
  activity.unshift({ id: uid(), t: new Date().toISOString(), type, text, icon, read: false });
  if (activity.length > 150) activity.length = 150;
  store.set('activity', activity);

  if (location.hash === '#activity') renderActivity();
}

function unreadCount() {
  return activity.filter(event => !event.read).length;
}

function renderBadge() {
  const badge = $('#unreadN');
  const count = unreadCount();
  badge.textContent = count > 99 ? '99+' : String(count);
  badge.classList.toggle('hidden', count === 0);
}

function markAllRead() {
  activity.forEach(event => { event.read = true; });

  renderBadge();
}

// ---------- input: files, drag-and-drop, clipboard paste ----------
const IMAGE_EXT = /\.(jpe?g|png|webp|gif|bmp|avif)$/i;

function makeThumb(canvas) {
  const scale = Math.min(104 / canvas.width, 58 / canvas.height, 1);
  return resample(canvas, Math.max(1, canvas.width * scale), Math.max(1, canvas.height * scale));
}

async function importFile(file) {
  const orig = await decode(file);
  const buffer = await file.arrayBuffer();
  const name = file.name || `pasted-${Date.now()}.png`;
  const meta = parseMetadata(buffer, file.type, name);
  return {
    id: uid(),
    name,
    type: file.type || 'image/png',
    size: file.size,
    orig,
    work: orig,
    preview: null,
    history: [],
    meta,
    thumb: makeThumb(orig),
    edits: 0
  };
}

function privacyCheck(img) {
  const tags = img.meta && img.meta.tags;
  const gps = gpsOf(tags);
  if (gps) {
    logEvent('privacy', `${img.name} contains a GPS location (${gps.lat.toFixed(4)}, ${gps.lng.toFixed(4)}) — export strips it`, 'map-pin');
    toast(`${img.name} carries GPS coordinates — exports remove them`, 'bad', 'map-pin');
  } else if (tags && (tags.make || tags.model)) {
    logEvent('privacy', `${img.name} names the device (${[tags.make, tags.model].filter(Boolean).join(' ')})`, 'camera');
  }
}

async function addFiles(list) {
  const files = [...list].filter(file => file && (file.type.startsWith('image/') || IMAGE_EXT.test(file.name)));
  if (!files.length) {
    toast('No supported image files found', 'bad', 'alert');
    return 0;
  }
  let added = 0;
  for (const file of files) {
    try {
      const img = await importFile(file);
      S.images.push(img);
      S.selected.add(img.id);
      if (!S.active) {
        S.active = img.id;
        S.zoomFit = true;
      }
      added++;
      privacyCheck(img);
    } catch {
      toast(`Could not decode ${file.name || 'file'}`, 'bad', 'alert');
    }
  }
  if (added) {
    toast(`${added} image${added > 1 ? 's' : ''} loaded — nothing left your device`, 'ok', 'shield-check');
    logEvent('load', `Loaded ${added} image${added > 1 ? 's' : ''}: ${files.slice(0, 3).map(f => f.name).join(', ')}${files.length > 3 ? '…' : ''}`, 'upload');
    render();
  }
  return added;
}

function bindInput() {
  $('#fileInput').addEventListener('change', event => {
    addFiles(event.target.files);
    event.target.value = '';
  });
  ['#addBtn', '#chooseBtn', '#drop'].forEach(selector => {
    $(selector).addEventListener('click', event => {
      if (event.target.closest('#sampleBtn, #tourBtn')) return;
      $('#fileInput').click();
    });
  });
  $('#drop').addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      $('#fileInput').click();
    }
  });
  $('#sampleBtn').addEventListener('click', async event => {
    event.stopPropagation();
    const button = event.currentTarget;
    button.disabled = true;
    button.innerHTML = ic('refresh', 'spin') + ' Generating…';
    await loadSamples();
    button.disabled = false;
    button.innerHTML = ic('sparkles') + ' Try sample images';
  });
  $('#tourBtn').addEventListener('click', event => {
    event.stopPropagation();
    startTour();
  });
  document.addEventListener('dragover', event => {
    event.preventDefault();
    document.body.classList.add('dragging');
  });
  document.addEventListener('dragleave', event => {
    if (!event.relatedTarget) document.body.classList.remove('dragging');
  });
  document.addEventListener('drop', event => {
    event.preventDefault();
    document.body.classList.remove('dragging');
    if (event.dataTransfer && event.dataTransfer.files.length) addFiles(event.dataTransfer.files);
  });
  document.addEventListener('paste', event => {
    const files = [...((event.clipboardData && event.clipboardData.files) || [])];
    if (!files.length) return;
    event.preventDefault();
    addFiles(files);
  });
}

// ---------- render root, rail, theme ----------
function render() {
  const hasImages = S.images.length > 0;
  $('#empty').classList.toggle('hidden', hasImages || isReportRoute());
  $('#ws').classList.toggle('hidden', !hasImages || isReportRoute());
  if (!hasImages) {
    S.active = null;
    S.beforeId = null;
    animateIn($('#empty'));
    return;
  }
  if (!active()) {
    S.active = S.images[0].id;
    S.zoomFit = true;
  }
  renderRail();
  renderFilm();
  renderStage();
  renderPanel();
  scheduleEstimate();
}

function renderRail() {
  const buttons = TOOLS.map(([id, label, icon, hint], index) => {
    const key = index === 9 ? '0' : index < 9 ? String(index + 1) : '';
    const on = S.tool === id;
    return `<button class="${on ? 'on' : ''}" data-tool="${id}" aria-label="${label} — ${hint}" aria-pressed="${on}" title="${label} — ${hint}${key ? ` (${key})` : ''}">${ic(icon)}<span>${label}</span></button>`;
  });

const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
