<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khoon — Blood Donor Network</title>
<meta name="description" content="Find compatible blood donors in Pakistani cities, post and track emergency requests, run pre-donation screening, organise donation camps, manage a thalassemia rota and browse blood banks. Single-file FYP template.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ---------- */
:root {
  --bg: #fff7f5;
  --surface: #fff;
  --surface-2: #fdeeea;
  --ink: #2a1215;
  --muted: #8a6a6e;
  --line: #f1d6d0;
  --crimson: #b3122e;
  --crimson-deep: #8c0d24;
  --crimson-soft: #fde2e6;
  --rose: #e85d75;
  --gold: #d9a441;
  --gold-soft: #fbf1dc;
  --green: #2e8b57;
  --green-soft: #e2f3ea;
  --slate: #536075;
  --slate-soft: #eef1f5;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 16px 40px -28px rgba(140, 13, 36, .45);
  --font: "Nunito", system-ui, sans-serif;
  --font-ur: "Noto Nastaliq Urdu", serif;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15.5px;
  line-height: 1.5;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.15; }
.ur { font-family: var(--font-ur); line-height: 1.9; }
.muted { color: var(--muted); }
.hidden { display: none !important; }
.spacer { flex: 1; }
.small { font-size: .84rem; }
.tnum { font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.between { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
.mt { margin-top: 14px; }
.mb { margin-bottom: 14px; }
:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; }

/* Urdu mode: Nastaliq for text, Nunito kept for numerals, chips and charts */
html.ur body { font-family: var(--font-ur), var(--font); line-height: 1.9; }
html.ur .bg, html.ur .g, html.ur .phone, html.ur .kpi .v, html.ur .matrix, html.ur .tnum, html.ur .cal .dn, html.ur .kbd, html.ur .heat, html.ur .dcard .grp, html.ur .req .big, html.ur .camp .date, html.ur .cert .who, html.ur .brand h1 { font-family: var(--font); line-height: 1.3; }
html.ur .tabs button, html.ur .btn, html.ur .pill, html.ur .toggle { line-height: 1.6; }

/* ---------- hero ---------- */
.hero {
  background: radial-gradient(120% 140% at 100% 0%, #e03a57 0%, var(--crimson) 45%, var(--crimson-deep) 100%);
  color: #fff;
  padding: 18px 20px 26px;
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: "";
  position: absolute;
  right: -80px;
  top: -80px;
  width: 320px;
  height: 320px;
  border-radius: 50%;
  background: rgba(255, 255, 255, .07);
}
.hero .in { max-width: 1180px; margin: 0 auto; position: relative; }
.top { display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand .drop {
  width: 40px;
  height: 40px;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  background: #fff;
  display: grid;
  place-items: center;
}
.brand .drop span { transform: rotate(45deg); color: var(--crimson); font-weight: 900; font-size: 1.05rem; }
.brand h1 { font-size: 1.25rem; font-weight: 900; letter-spacing: -.01em; }
.brand small { display: block; font-size: .74rem; opacity: .85; }
.lang, .hbtn {
  background: rgba(255, 255, 255, .16);
  border: 1px solid rgba(255, 255, 255, .3);
  color: #fff;
  border-radius: 10px;
  padding: 7px 12px;
  font-weight: 800;
  cursor: pointer;
  min-height: 40px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  position: relative;
}
.hbtn .dot {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--gold);
  color: #3b2a08;
  border-radius: 999px;
  font-size: .68rem;
  min-width: 18px;
  height: 18px;
  display: grid;
  place-items: center;
  padding: 0 4px;
}
.hero h2 {
  font-size: clamp(1.5rem, 3.4vw, 2.3rem);
  font-weight: 900;
  margin-top: 22px;
  letter-spacing: -.02em;
  max-width: 720px;
}
.hero p.sub { margin: 6px 0 0; opacity: .9; max-width: 640px; }
.searchbar {
  margin-top: 18px;
  background: #fff;
  border-radius: 16px;
  padding: 10px;
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(0, 1.3fr) auto;
  gap: 8px;
  box-shadow: 0 20px 50px -20px rgba(0, 0, 0, .5);
  color: var(--ink);
}
.groups { display: flex; gap: 6px; flex-wrap: wrap; }
.g {
  border: 2px solid var(--line);
  background: var(--surface);
  border-radius: 10px;
  min-width: 48px;
  min-height: 40px;
  padding: 6px 8px;
  font-weight: 900;
  cursor: pointer;
  color: var(--crimson);
  text-align: center;
  font-size: .95rem;
}
.g.on { background: var(--crimson); border-color: var(--crimson); color: #fff; }
.g.any { color: var(--slate); }
.g.any.on { background: var(--slate); border-color: var(--slate); color: #fff; }

/* ---------- forms + buttons ---------- */
select, input[type=text], input[type=tel], input[type=number], input[type=date], input[type=time], input[type=month], textarea {
  width: 100%;
  border: 2px solid var(--line);
  background: var(--surface);
  border-radius: 12px;
  padding: 10px 12px;
  outline: 0;
  min-height: 44px;
}
textarea { min-height: 80px; resize: vertical; }
select:focus, input:focus, textarea:focus { border-color: var(--rose); box-shadow: 0 0 0 3px var(--crimson-soft); }
.btn {
  border: 0;
  border-radius: 12px;
  padding: 11px 18px;
  font-weight: 800;
  cursor: pointer;
  background: var(--crimson);
  color: #fff;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  min-height: 40px;
  text-decoration: none;
}
.btn.gold { background: var(--gold); color: #3b2a08; }
.btn.green { background: var(--green); }
.btn.slate { background: var(--slate); }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.outline { background: transparent; border: 2px solid var(--line); color: var(--ink); }
.btn.sm { padding: 7px 11px; font-size: .84rem; border-radius: 10px; }
.btn.icon { padding: 7px 9px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
label.f {
  display: block;
  font-size: .76rem;
  font-weight: 800;
  color: var(--muted);
  margin: 12px 0 5px;
  text-transform: uppercase;
  letter-spacing: .07em;
}
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px 14px; }
.cols3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 14px; }
.toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: .9rem;
  cursor: pointer;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 7px 12px;
  min-height: 40px;
}
.toggle input { accent-color: var(--crimson); width: 16px; height: 16px; }
.toggle.block { border-radius: 12px; width: 100%; }

/* ---------- tabs ---------- */
.tabs { max-width: 1180px; margin: -18px auto 0; padding: 0 20px; position: relative; z-index: 2; }
.tabs .in {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  display: flex;
  flex-wrap: wrap;
  box-shadow: var(--shadow);
  scrollbar-width: none;
}
.tabs button {
  flex: 1 1 auto;
  border: 0;
  background: none;
  padding: 11px 12px;
  font-weight: 800;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  border-bottom: 3px solid transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 44px;
}
.tabs button.on { color: var(--crimson); border-bottom-color: var(--crimson); }
.tabs button .n {
  display: inline-block;
  background: var(--crimson-soft);
  color: var(--crimson);
  border-radius: 999px;
  padding: 0 7px;
  font-size: .72rem;
  margin-left: 2px;
}
.tabs button .n.gold { background: var(--gold-soft); color: #8a6100; }
main { max-width: 1180px; margin: 0 auto; padding: 22px 20px 70px; }
section[data-page] { display: none; }
section[data-page].on { display: block; }

/* ---------- cards + layout ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: var(--shadow);
}
.card h3 { font-size: 1.1rem; font-weight: 900; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card h3 .ic { color: var(--crimson); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 18px; align-items: start; }
.two.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.page-head { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 14px; }
.page-head h2 { font-size: 1.35rem; font-weight: 900; letter-spacing: -.01em; }
.page-head p { margin: 2px 0 0; color: var(--muted); max-width: 640px; }
.list { display: grid; gap: 10px; }
.empty {
  padding: 30px;
  text-align: center;
  color: var(--muted);
  background: var(--surface);
  border: 1px dashed var(--line);
  border-radius: var(--radius);
}
.empty .ic { width: 28px; height: 28px; display: block; margin: 0 auto 8px; color: var(--rose); }
.note { background: var(--gold-soft); border-left: 4px solid var(--gold); border-radius: 10px; padding: 10px 12px; font-size: .88rem; }
.warn { background: var(--crimson-soft); border-left: 4px solid var(--crimson); border-radius: 10px; padding: 10px 12px; font-size: .88rem; }
.good { background: var(--green-soft); border-left: 4px solid var(--green); border-radius: 10px; padding: 10px 12px; font-size: .88rem; }
.info { background: var(--slate-soft); border-left: 4px solid var(--slate); border-radius: 10px; padding: 10px 12px; font-size: .88rem; }
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 999px;
  padding: 3px 9px;
  font-size: .76rem;
  font-weight: 800;
  background: var(--surface-2);
  color: var(--muted);
}
.pill.ok { background: var(--green-soft); color: var(--green); }
.pill.wait { background: var(--gold-soft); color: #8a6100; }
.pill.gold { background: var(--gold-soft); color: #8a6100; }
.pill.red { background: var(--crimson-soft); color: var(--crimson); }
.pill.slate { background: var(--slate-soft); color: var(--slate); }
.pill.btnlike { cursor: pointer; border: 0; min-height: 32px; }
.tags { display: flex; gap: 5px; flex-wrap: wrap; }
.tag { font-size: .68rem; background: var(--crimson); color: #fff; border-radius: 6px; padding: 2px 6px; font-weight: 800; }
.todo { border: 1px dashed var(--crimson); border-radius: 12px; padding: 12px 14px; background: var(--surface); }
.todo h4 { font-size: .95rem; display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
.tbl { width: 100%; border-collapse: collapse; font-size: .86rem; }
.tbl th, .tbl td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.tbl th { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.tbl td.num { text-align: right; font-variant-numeric: tabular-nums; }
.scrollx { overflow-x: auto; }

/* ---------- donor grid ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.donor {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 10px;
  position: relative;
}
.donor .head { display: flex; gap: 12px; align-items: center; }
.avatar {
  width: 46px;
  height: 46px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  font-weight: 900;
  color: #fff;
  background: linear-gradient(135deg, var(--rose), var(--crimson));
  flex: none;
}
.avatar.me { background: linear-gradient(135deg, var(--gold), #b8811a); }
.donor .name { font-weight: 900; }
.donor .meta, .meta { font-size: .84rem; color: var(--muted); }
.bg {
  margin-left: auto;
  background: var(--crimson);
  color: #fff;
  border-radius: 10px;
  padding: 6px 9px;
  font-weight: 900;
  font-size: 1rem;
  letter-spacing: .02em;
}
.bg.compat { background: var(--slate); }
.bg.inline { margin: 0; font-size: .9rem; }
.donor .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; align-items: center; }
.phone { font-variant-numeric: tabular-nums; font-weight: 800; letter-spacing: .03em; }

/* ---------- requests ---------- */
.req {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 6px solid var(--u, var(--rose));
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow);
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 14px;
  align-items: start;
}
.req.fulfilled { opacity: .65; --u: var(--green); }
.req.expired { opacity: .6; --u: var(--slate); }
.req .big {
  font-size: 1.6rem;
  font-weight: 900;
  color: var(--crimson);
  line-height: 1;
  background: var(--crimson-soft);
  border-radius: 14px;
  width: 64px;
  height: 64px;
  display: grid;
  place-items: center;
}
.req .big small { display: block; font-size: .65rem; font-weight: 800; color: var(--muted); }
.req h4 { font-size: 1.05rem; font-weight: 900; }
.req .meta { margin-top: 2px; }
.req .acts { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.u-critical { --u: #b3122e; }
.u-urgent { --u: #e8882e; }
.u-routine { --u: #536075; }
.resp { font-size: .82rem; background: var(--surface-2); border-radius: 10px; padding: 8px 10px; margin-top: 8px; }
.steps { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
.step { display: inline-flex; align-items: center; gap: 4px; font-size: .72rem; font-weight: 800; color: var(--muted); }
.step i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); display: inline-block; }
.step.done { color: var(--green); }
.step.done i { background: var(--green); }
.step.now { color: var(--crimson); }
.step.now i { background: var(--crimson); box-shadow: 0 0 0 3px var(--crimson-soft); }
.timeline { position: relative; padding-left: 22px; margin: 10px 0; }
.timeline::before { content: ""; position: absolute; left: 7px; top: 4px; bottom: 4px; width: 2px; background: var(--line); }
.tl { position: relative; padding: 4px 0 10px; }
.tl::before {
  content: "";
  position: absolute;
  left: -19px;
  top: 9px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--crimson);
  border: 2px solid #fff;
}
.tl.note::before { background: var(--gold); }
.tl b { display: block; font-size: .9rem; }
.tl .meta { font-size: .78rem; }

/* ---------- my card ---------- */
.dcard {
  background: linear-gradient(135deg, var(--crimson), var(--crimson-deep));
  color: #fff;
  border-radius: 22px;
  padding: 22px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 30px 60px -30px rgba(140, 13, 36, .7);
}
.dcard::before {
  content: "";
  position: absolute;
  right: -40px;
  bottom: -60px;
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: rgba(255, 255, 255, .08);
}
.dcard .grp { font-size: 3rem; font-weight: 900; line-height: 1; letter-spacing: -.03em; }
.dcard .row { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; font-size: .85rem; opacity: .95; }
.ring { width: 96px; height: 96px; }
.badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.badge {
  display: flex;
  gap: 8px;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px 10px;
  background: var(--surface);
  font-size: .84rem;
  font-weight: 800;
}
.badge.locked { opacity: .45; filter: grayscale(1); }
.badge .icw { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--gold-soft); color: #8a6100; }
.badge .icw .ic { width: 16px; height: 16px; }
.cert {
  border: 10px double var(--gold);
  border-radius: 14px;
  padding: 28px 30px;
  text-align: center;
  background: #fffdf8;
  color: var(--ink);
  position: relative;
}
.cert .brandline { display: flex; justify-content: center; align-items: center; gap: 8px; font-weight: 900; color: var(--crimson); flex-wrap: wrap; }
.cert h2 { font-size: 1.7rem; letter-spacing: .08em; text-transform: uppercase; margin: 14px 0 6px; color: var(--crimson-deep); }
.cert .who { font-size: 1.9rem; font-weight: 900; margin: 10px 0 4px; }
.cert .facts { display: flex; justify-content: center; gap: 24px; flex-wrap: wrap; margin: 14px 0; font-size: .9rem; }
.cert .facts b { display: block; font-size: 1.2rem; color: var(--crimson); }
.cert .sig { display: flex; justify-content: space-between; margin-top: 22px; font-size: .78rem; color: var(--muted); gap: 10px; flex-wrap: wrap; }
.cert .seal {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  border: 3px solid var(--gold);
  display: grid;
  place-items: center;
  margin: 0 auto;
  color: var(--gold);
}
.cert .seal .ic { width: 30px; height: 30px; }

/* ---------- banks ---------- */
.bank { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.bank h4 { font-weight: 900; font-size: 1rem; }
.bank .meta { margin: 4px 0 8px; }

/* ---------- stats + charts ---------- */
.stat { display: grid; grid-template-columns: 52px 1fr 60px; gap: 10px; align-items: center; margin: 6px 0; font-weight: 800; font-size: .9rem; }
.stat .track { height: 14px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.stat .fill { height: 100%; background: var(--crimson); border-radius: 999px; }
.stat .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.kpi .k { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 800; display: flex; gap: 6px; align-items: center; }
.kpi .v { font-size: 1.7rem; font-weight: 900; letter-spacing: -.02em; color: var(--crimson); }
.kpi .s { font-size: .8rem; color: var(--muted); }
.matrix { border-collapse: collapse; width: 100%; font-size: .82rem; }
.matrix th, .matrix td { border: 1px solid var(--line); padding: 5px; text-align: center; }
.matrix th { background: var(--surface-2); }
.matrix td.y { background: var(--green-soft); color: var(--green); font-weight: 900; }
.matrix td.p { background: var(--gold-soft); color: #8a6100; font-weight: 900; }
.matrix td.me { outline: 2px solid var(--crimson); }
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--font); font-weight: 700; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .8rem; font-weight: 800; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.heat { display: grid; grid-template-columns: 34px repeat(24, minmax(0, 1fr)); gap: 2px; font-size: .62rem; align-items: center; }
.heat .hl { font-weight: 800; color: var(--muted); }
.heat .hc { aspect-ratio: 1 / 1; border-radius: 3px; background: var(--surface-2); }
.heat .hx { text-align: center; color: var(--muted); font-weight: 700; }
.hist { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; align-items: end; height: 140px; margin-top: 10px; }
.hist > div { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 4px; font-size: .72rem; font-weight: 800; color: var(--muted); }
.hist .bar { width: 100%; background: var(--rose); border-radius: 6px 6px 0 0; transition: height .6s var(--ease); }

/* ---------- camps ---------- */
.camp { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 14px; }
.camp .date { background: var(--crimson-soft); color: var(--crimson); border-radius: 14px; text-align: center; padding: 8px 4px; font-weight: 900; line-height: 1.1; }
.camp .date b { display: block; font-size: 1.6rem; }
.camp .date small { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; }
.camp.done .date { background: var(--green-soft); color: var(--green); }
.camp h4 { font-size: 1.05rem; font-weight: 900; }
.slots { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-top: 8px; }
.slots i { display: block; height: 100%; background: var(--crimson); border-radius: 999px; }
.checkrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
.checkrow .who { flex: 1 1 200px; min-width: 0; }
.checkrow .pill.btnlike { font-size: .72rem; }
.checkrow .pill.btnlike.on { background: var(--green); color: #fff; }
.checkrow .pill.btnlike.on.def { background: var(--slate); }

/* ---------- screening ---------- */
.q { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.q .qt { font-weight: 700; font-size: .92rem; }
.q .qh { font-size: .78rem; color: var(--muted); }
.yn { display: inline-flex; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; }
.yn button { border: 0; background: var(--surface); padding: 7px 14px; font-weight: 800; cursor: pointer; color: var(--muted); min-height: 40px; }
.yn button.on { background: var(--crimson); color: #fff; }
.yn button.on.no { background: var(--green); }
.verdict { border-radius: 16px; padding: 18px 20px; color: #fff; display: flex; gap: 14px; align-items: center; }
.verdict .ic { width: 36px; height: 36px; flex: none; }
.verdict.ok { background: linear-gradient(135deg, var(--green), #1f6b41); }
.verdict.temp { background: linear-gradient(135deg, var(--gold), #b8811a); color: #2a1a05; }
.verdict.perm { background: linear-gradient(135deg, var(--crimson), var(--crimson-deep)); }
.verdict.pending { background: linear-gradient(135deg, var(--slate), #3b4556); }
.verdict h4 { font-size: 1.2rem; font-weight: 900; }

/* ---------- rota ---------- */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .dow { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 800; text-align: center; padding: 4px 0; }
.cal .day { min-height: 58px; border: 1px solid var(--line); border-radius: 10px; padding: 4px 5px; font-size: .78rem; background: var(--surface); position: relative; }
.cal .day.pad { background: transparent; border-color: transparent; }
.cal .day.today { border-color: var(--rose); box-shadow: 0 0 0 2px var(--crimson-soft); }
.cal .day .dn { font-weight: 800; color: var(--muted); }
.cal .need { display: block; margin-top: 3px; border-radius: 6px; padding: 2px 5px; font-weight: 800; font-size: .7rem; cursor: pointer; border: 0; width: 100%; text-align: left; min-height: 22px; }
.cal .need.full { background: var(--green-soft); color: var(--green); }
.cal .need.part { background: var(--gold-soft); color: #8a6100; }
.cal .need.none { background: var(--crimson-soft); color: var(--crimson); }
.patient { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.assignee { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }

/* ---------- components ---------- */
.comp { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); border-top: 5px solid var(--c, var(--crimson)); }
.comp h4 { font-weight: 900; font-size: 1.05rem; display: flex; gap: 8px; align-items: center; }
.comp h4 .ic { color: var(--c, var(--crimson)); }
.comp dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 10px 0 0; font-size: .86rem; }
.comp dt { color: var(--muted); font-weight: 800; }
.comp dd { margin: 0; }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 8px 14px; font-weight: 800; cursor: pointer; color: var(--muted); min-height: 40px; }
.seg button.on { background: var(--crimson); color: #fff; }

/* ---------- inbox ---------- */
.msg { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.msg.unread { border-left: 5px solid var(--crimson); background: #fffafa; }
.msg .mi { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--crimson); }
.msg .mi.ok { background: var(--green-soft); color: var(--green); }
.msg .mi.gold { background: var(--gold-soft); color: #8a6100; }
.msg b { display: block; }
.msg .meta { margin-top: 2px; }

/* ---------- settings ---------- */
.setrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.setrow .lbl b { display: block; }
.setrow .lbl span { font-size: .82rem; color: var(--muted); }
.switch { position: relative; width: 46px; height: 26px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch i { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: background .2s; cursor: pointer; }
.switch i::after { content: ""; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .2s var(--ease); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.switch input:checked + i { background: var(--green); }
.switch input:checked + i::after { transform: translateX(20px); }
.switch input:focus-visible + i { outline: 3px solid var(--rose); }
.kbd { display: inline-block; border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 6px; padding: 1px 7px; font-size: .8rem; font-weight: 800; background: var(--surface); min-width: 26px; text-align: center; }

/* ---------- modal + toast + tour ---------- */
.scrim { position: fixed; inset: 0; background: rgba(42, 18, 21, .5); z-index: 50; display: none; align-items: center; justify-content: center; padding: 16px; }
.scrim.on { display: flex; animation: kFadeIn .2s both; }
.modal { background: var(--surface); border-radius: 20px; max-width: 620px; width: 100%; max-height: 92vh; overflow: auto; padding: 22px; animation: kPop .25s var(--ease) both; position: relative; }
.modal.wide { max-width: 860px; }
.modal .close { position: absolute; top: 12px; right: 12px; }
#toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: grid; gap: 8px; z-index: 60; width: max-content; max-width: calc(100vw - 32px); }
.toast { background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 800; animation: pop .25s, kFadeOut .4s 2.8s both; display: flex; gap: 8px; align-items: center; }
.toast.ok { background: var(--green); }
.toast.bad { background: var(--crimson); }
@keyframes pop { from { transform: translateY(8px); opacity: 0; } }
.tour { position: fixed; inset: 0; z-index: 70; display: none; }
.tour.on { display: block; }
.tour .spot { position: absolute; border-radius: 14px; box-shadow: 0 0 0 9999px rgba(42, 18, 21, .62); transition: all .35s var(--ease); pointer-events: none; }
.tour .tip { position: absolute; background: var(--surface); color: var(--ink); border-radius: 16px; padding: 16px 18px; width: min(340px, calc(100vw - 32px)); box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .5); animation: kPop .25s var(--ease) both; }
.tour .tip h4 { font-size: 1.05rem; font-weight: 900; margin-bottom: 4px; }
.tour .tip p { margin: 0 0 10px; color: var(--muted); font-size: .9rem; }
.tour .dots { display: flex; gap: 5px; align-items: center; }
.tour .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.tour .dots i.on { background: var(--crimson); }
#printArea { display: none; }

/* ---------- responsive ---------- */
@media (max-width: 860px) {
  .searchbar { grid-template-columns: 1fr; }
  .two, .two.even { grid-template-columns: minmax(0, 1fr); }
  .req { grid-template-columns: auto minmax(0, 1fr); }
  .req .acts { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; align-items: center; }
  .hero h2 { margin-top: 14px; }
  .tabs .in { flex-wrap: nowrap; overflow: auto; }
  .tabs button { flex: none; }
  .patient { grid-template-columns: 56px minmax(0, 1fr); }
  .patient .row { grid-column: 1 / -1; }
  .donutwrap { grid-template-columns: 1fr !important; justify-items: center; }
  .donutwrap > div { width: 100%; }
  .camp { grid-template-columns: 56px minmax(0, 1fr); }
  .hist { height: 110px; }
  .heat { font-size: .5rem; gap: 1px; grid-template-columns: 26px repeat(24, minmax(0, 1fr)); }
  .cert { padding: 20px 14px; border-width: 6px; }
  .cert .who { font-size: 1.4rem; }
  .cal .day { min-height: 48px; padding: 3px; }
  .cal .need { font-size: .6rem; padding: 1px 3px; }
}

/* ---------- print ---------- */
@media print {
  .hero, .tabs, #toasts, .tour, .scrim { display: none !important; }
  body.printing main { display: none; }
  body.printing #printArea { display: block; padding: 20px; }
  .card, .donor, .req, .camp { box-shadow: none; break-inside: avoid; }
}

/* ---------- icon + motion kit ---------- */
.ic { width: 1.1em; height: 1.1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; flex: none; }
:root { --ease: cubic-bezier(.2, .8, .2, 1); --dur: .35s; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
@keyframes kFadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes kFadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes kFadeOut { from { opacity: 1; } to { opacity: 0; } }
@keyframes kPop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
.enter { animation: kFadeUp var(--dur) var(--ease) both; }
.stagger > * { animation: kFadeUp .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 40ms); }
.btn { transition: transform .15s var(--ease), box-shadow .15s var(--ease), background .2s; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0) scale(.98); }
.card, .donor, .bank, .camp, .comp, .kpi { transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s; }
.donor:hover, .bank:hover, .camp:hover, .comp:hover { transform: translateY(-2px); }
.fill, .slots > i { transition: width .6s var(--ease); }
</style>

// ---------- utils ----------
const NS = 'khoon:';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const store = {
  get(k, d) {
    try {
      const v = localStorage.getItem(NS + k);
      return v == null ? d : JSON.parse(v);
    } catch {
      return d;
    }
  },
  set(k, v) {
    try {
      localStorage.setItem(NS + k, JSON.stringify(v));
      return true;
    } catch {
      return false;
    }
  },
  remove(k) {
    try {
      localStorage.removeItem(NS + k);
    } catch {
      /* storage blocked */
    }
  },
  keys() {
    const out = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(NS)) out.push(k.slice(NS.length));
      }
    } catch {
      /* storage blocked */
    }
    return out;
  },
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const ic = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;

function toast(m, type = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  const icon = type === 'ok' ? 'check-circle' : type === 'bad' ? 'alert-circle' : 'info';
  t.innerHTML = ic(icon) + '<span></span>';
  t.lastChild.textContent = m;
  $('#toasts').append(t);
  setTimeout(() => t.remove(), 3200);
}

// Route enter animation + staggered children for list-like containers.
function animateIn(root) {
  if (!root) return;
  root.classList.remove('enter');
  void root.offsetWidth;
  root.classList.add('enter');
  const groups = root.querySelectorAll('.grid,.list,.kpis,.badges,.hist,.cal');
  groups.forEach(g => {
    g.classList.add('stagger');
    [...g.children].forEach((el, i) => el.style.setProperty('--i', Math.min(i, 14)));
  });
}

// Animated KPI number.
function countUp(el, to, fmt = v => Math.round(v).toLocaleString('en-PK')) {
  const t0 = performance.now();
  const dur = 700;
  const step = nowTs => {
    const p = Math.min(1, (nowTs - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(to * e);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// Deterministic PRNG (mulberry32) so seed data is stable between loads.
function rng(seed) {
  return () => {
    seed |= 0;
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const DAY = 864e5;
const HOUR = 36e5;
const now = Date.now();
const daysAgo = ts => Math.floor((now - ts) / DAY);

function ago(ts) {
  const d = daysAgo(ts);
  if (d === 0) {
    const h = Math.floor((now - ts) / HOUR);
    if (h <= 0) return t('justNow');
    return h + ' ' + t('hAgo');
  }
  if (d === 1) return t('yesterday');
  if (d < 30) return d + ' ' + t('daysAgo');
  if (d < 365) return Math.floor(d / 30) + ' ' + t('moAgo');
  return Math.floor(d / 365) + ' ' + t('yAgo');
}

const dateStr = ts => new Date(ts).toLocaleDateString('en-PK', { day: 'numeric', month: 'short', year: 'numeric' });
const timeStr = ts => new Date(ts).toLocaleTimeString('en-PK', { hour: '2-digit', minute: '2-digit' });
const isoDate = ts => new Date(ts).toISOString().slice(0, 10);
const monthKey = ts => isoDate(ts).slice(0, 7);
const bdi = s => `<bdi>${s}</bdi>`;
const initials = n => n.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
const maskPhone = p => p.slice(0, 4) + '-***-**' + p.slice(-2);
const wa = (phone, text) => `https://wa.me/92${phone.replace(/\D/g, '').slice(1)}?text=${encodeURIComponent(text)}`;
const PHONE_RE = /^03\d{2}-?\d{7}$/;
const normPhone = p => p.replace(/^(\d{4})-?(\d{7})$/, '$1-$2');
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const median = arr => {
  if (!arr.length) return 0;
  const s = [...arr].sort((a, b) => a - b);
  const mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
};

function humanDuration(ms) {
  const h = ms / HOUR;
  if (h < 1) return Math.max(1, Math.round(ms / 6e4)) + ' min';
  if (h < 48) return (Math.round(h * 10) / 10) + ' h';
  return Math.round(h / 24) + ' d';
}

function downloadText(name, text, mime = 'application/json') {
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function plateletGrade(recipient, donor) {
  const sameAbo = ABO(recipient) === ABO(donor);

  if (rhOk || sameAbo) return 'p';
  return '';
}

// Great-circle distance in km between two [lat, lng] pairs.
function haversine(a, b) {
  const R = 6371;
  const toRad = x => (x * Math.PI) / 180;
  const dLat = toRad(b[0] - a[0]);
  const dLng = toRad(b[1] - a[1]);
  const s1 = Math.sin(dLat / 2) ** 2;
  const s2 = Math.cos(toRad(a[0])) * Math.cos(toRad(b[0])) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s1 + s2));
}

function weightedPick(r, table) {
  const total = table.reduce((a, [, w]) => a + w, 0);
  let x = r() * total;
  for (const [v, w] of table) {
    if (x < w) return v;
    x -= w;
  }
  return table[0][0];
}
const pickGroup = r => weightedPick(r, GROUP_W);

    id: 's' + index,

// Older saved requests (before the lifecycle module) lack history/notesLog.
function migrateRequest(r) {
  if (!r.history) r.history = [{ status: 'open', ts: r.ts }];
  if (!r.notesLog) r.notesLog = [];
  if (r.status === 'fulfilled' && !r.history.some(h => h.status === 'fulfilled')) {
    r.history.push({ status: 'fulfilled', ts: r.ts + HOUR });
  }
  return r;
}

function allRequests() {
  // TODO(student): move donors and requests to a backend (Firebase/Supabase/Node) with real-time sync; keep this file as the client.
  let saved = store.get('requests', null);
  if (!saved) {
    saved = SEED_REQUESTS;
    store.set('requests', saved);
  }
  return saved.map(migrateRequest);
}

function mutateRequest(id, fn) {
  const list = allRequests();

  fn(r);
  saveRequests(list);
  return r;
}

// ---------- request lifecycle ----------
const STATUS_FLOW = ['open', 'contacted', 'arranged', 'fulfilled'];
const isClosed = r => r.status === 'fulfilled' || r.status === 'expired';
const nextStatus = r => STATUS_FLOW[STATUS_FLOW.indexOf(r.status) + 1] || null;

function setStatus(id, status, auto = false) {
  return mutateRequest(id, r => {
    r.status = status;
    r.history.push({ status, ts: Date.now(), auto });
  });
}

// Requests whose needed-by date passed 12 h ago without fulfilment expire automatically.
function expireRequests() {
  const list = allRequests();
  let n = 0;
  list.forEach(r => {
    if (isClosed(r)) return;
    if (now > r.by + 12 * HOUR) {
      r.status = 'expired';
      r.history.push({ status: 'expired', ts: now, auto: true });
      n++;
      if (r.mine) notify('alert', 'n_expired', `${r.group} · ${r.patient} · ${r.hospital}`, 'requests', { i18n: 'title' });
    }
  });
  if (n) {
    saveRequests(list);
    toast(`${n} ${t('expiredN')}`);
  }
  return n;
}

// Reference point for the nearest sort: saved geolocation, else the chosen city/area centroid.
function referencePoint() {
  const geo = store.get('geo', null);
  if (geo) return { pt: [geo.lat, geo.lng], label: t('yourLoc') };
  const city = find.city === 'all' ? (settings().city || 'Karachi') : find.city;

}

function requestLocation() {
  if (!navigator.geolocation) {

function filterDonors() {
  const groups = find.group === 'any' ? null : find.compat ? CAN_RECEIVE[find.group] : [find.group];
  const area = find.area.trim().toLowerCase();
  return allDonors().filter(d => {
    if (groups && !groups.includes(d.group)) return false;
    if (find.city !== 'all' && d.city !== find.city) return false;
    if (area && !d.area.toLowerCase().includes(area)) return false;
    if (find.eligible && eligibleIn(d) !== 0) return false;
    return true;
  });
}

function sortDonors(list) {
  if (find.sort === 'count') return list.sort((a, b) => b.count - a.count);
  if (find.sort === 'near') return list.sort((a, b) => a.km - b.km || eligibleIn(a) - eligibleIn(b));
  return list.sort((a, b) => eligibleIn(a) - eligibleIn(b) || b.count - a.count);
}

}

function drawDonors() {
  const groups = find.group === 'any' ? null : find.compat ? CAN_RECEIVE[find.group] : [find.group];
  let list = filterDonors();
  let refLabel = '';
  if (find.sort === 'near') {
    const ref = referencePoint();
    refLabel = ` · ${t('refPoint')} ${ref.label}`;
    list = list.map(d => ({ ...d, km: haversine(ref.pt, geoOf(d.city, d.area)) }));

function lifecycleSteps(r) {
  const idx = STATUS_FLOW.indexOf(r.status);
  const steps = STATUS_FLOW.map((s, i) => {
    const cls = r.status === 'expired' ? (i === 0 ? 'done' : '') : i < idx ? 'done' : i === idx ? 'now' : '';
    return `<span class="step ${cls}"><i></i>${t(s)}</span>`;
  });
  if (r.status === 'expired') steps.push(`<span class="step now"><i></i>${t('expired')}</span>`);
  return `<div class="steps">${steps.join('')}</div>`;
}

function requestCard(r, me) {
  const match = matchingDonors(r).length;
  const responded = me && r.responses.some(x => x.name === me.name);
  const urgPill = `<span class="pill ${r.urgency === 'critical' ? 'red' : r.urgency === 'urgent' ? 'wait' : ''}">${t(r.urgency)}</span>`;
  const statusPill = `<span class="pill ${r.status === 'fulfilled' ? 'ok' : r.status === 'expired' ? 'slate' : r.status === 'open' ? '' : 'gold'}">${t(r.status)}</span>`;
  const responses = r.responses.length ? `<div class="resp">${r.responses.map(x => `${ic('hand')} ${esc(x.name)} · ${bdi(ago(x.ts))}`).join('<br>')}</div>` : '';
  const next = nextStatus(r);

function renderRequests() {

  $('#reqForm').innerHTML = requestForm(me);

  $('#reqBar').innerHTML = `

    reqCity = e.target.value;

  };
  $('#rqStatus').onchange = e => {
    reqStatus = e.target.value;
    renderRequests();
  };
  $('#rqFull').onchange = e => {
    showClosed = e.target.checked;
    renderRequests();
  };

function bindRequestActions(me) {
  $$('[data-resp]').forEach(b => {
    b.onclick = () => {

function timelineHtml(r) {
  const events = [
    ...r.history.map(h => ({ ts: h.ts, kind: 'status', text: h.status === 'open' && h === r.history[0] ? t('created') : h.auto ? t('autoExpired') : `${t('statusChanged')}: ${t(h.status)}` })),
    ...r.responses.map(x => ({ ts: x.ts, kind: 'resp', text: `${t('canDonate')} — ${x.name}` })),
    ...r.notesLog.map(n => ({ ts: n.ts, kind: 'note', text: n.text })),
  ].sort((a, b) => a.ts - b.ts);
  return `<div class="timeline">${events.map(e => `<div class="tl ${e.kind === 'note' ? 'note' : ''}"><b>${e.kind === 'note' ? ic('edit') + ' ' : ''}${esc(e.text)}</b><div class="meta">${bdi(dateStr(e.ts))} · ${bdi(timeStr(e.ts))} · ${bdi(ago(e.ts))}</div></div>`).join('')}</div>`;
}

function openTimeline(id) {
  const r = allRequests().find(x => x.id === id);
  if (!r) return;
  const first = r.responses.length ? humanDuration(Math.min(...r.responses.map(x => x.ts)) - r.ts) : '—';
  openModal(`
    <h3>${ic('list')} ${t('timeline')} · ${r.group} · ${esc(r.patient)}</h3>
    <div class="meta">${esc(r.hospital)}, ${esc(r.city)} · ${t('firstResp')}: <b>${first}</b></div>

  };
}

  const centre = e === 0
    ? `<path d="M36 49l8 8 16-16" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`
    : `<text x="48" y="53" text-anchor="middle" font-size="16" font-weight="900" fill="${color}">${e}d</text>`;

// Short, stable verification code so a printed certificate can be matched to a profile later.
function certCode(me) {
  const s = me.name + '|' + me.phone + '|' + me.count + '|' + me.since;
  let h = 0;
  for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return 'KH-' + h.toString(36).toUpperCase().padStart(7, '0');
}

// ---------- pre-donation screening ----------
const QUESTIONS = DEFERRAL_RULES.map(r => r.id);
const scr = { answers: {}, hb: '', weight: '', bp: '', age: '' };

function prefillScreening() {
  const me = store.get('me', null);
  if (!me) return;
  if (!scr.weight && me.weight) scr.weight = me.weight;
  if (!scr.age && me.dob) scr.age = Math.floor((now - new Date(me.dob).getTime()) / (365.25 * DAY));
  if (scr.answers.interval == null && me.last) scr.answers.interval = eligibleIn(me) > 0;
}

// Combine every triggered rule into one verdict.
function evaluateScreening() {
  const unanswered = QUESTIONS.filter(q => scr.answers[q] == null);
  if (unanswered.length) return { kind: 'pending', unanswered, reasons: [], advisories: [], deferDays: 0 };
  const me = store.get('me', null);
  const reasons = [];
  const advisories = [];
  let perm = false;
  let deferDays = 0;
  DEFERRAL_RULES.forEach(rule => {
    if (!scr.answers[rule.id]) return;
    let days = rule.days;
    if (rule.id === 'interval') days = me ? eligibleIn(me) || 1 : INTERVAL.m;
    if (rule.kind === 'perm') perm = true;
    if (rule.kind === 'advisory') {
      advisories.push({ id: rule.id, days });
      return;
    }
    reasons.push({ id: rule.id, days });
    deferDays = Math.max(deferDays, days);
  });
  const hb = parseFloat(scr.hb);
  if (hb && hb < 12.5) {
    reasons.push({ id: 'hb', days: 30 });
    deferDays = Math.max(deferDays, 30);
  }
  const wt = parseFloat(scr.weight);
  if (wt && wt < 50) reasons.push({ id: 'wt', days: 0 });
  const bp = parseFloat(scr.bp);
  if (bp && (bp < 100 || bp > 160)) {
    reasons.push({ id: 'bp', days: 7 });
    deferDays = Math.max(deferDays, 7);
  }
  const age = parseFloat(scr.age);
  if (age && age < 18) {
    const days = Math.ceil((18 - age) * 365.25);
    reasons.push({ id: 'ageLow', days });
    deferDays = Math.max(deferDays, days);
  }
  if (age && age > 60) {
    reasons.push({ id: 'ageHigh', days: 0 });
    perm = true;
  }
  const kind = perm ? 'perm' : reasons.length ? 'temp' : 'ok';
  return { kind, reasons, advisories, deferDays };
}

function verdictHtml(v, saved = false) {
  if (v.kind === 'pending') {
    return `<div class="verdict pending">${ic('help')}<div><h4>${t('v_pending')}</h4><div>${t('v_pendingd')} (${v.unanswered.length})</div></div></div>`;
  }
  const reasons = v.reasons.length ? `<div class="mt"><b class="small">${t('sc_reasons')}</b><ul style="margin:4px 0 0;padding-left:18px">${v.reasons.map(r => `<li>${t('d_' + r.id)}${r.days ? ` — ${r.days} ${t('days')}` : ''}</li>`).join('')}</ul></div>` : '';
  const adv = v.advisories.length ? `<div class="note mt"><b>${t('sc_advisory')}:</b> ${v.advisories.map(a => a.id === 'aspirin' ? t('sc_plt') : t('d_' + a.id)).join(' · ')}</div>` : '';
  const earliest = v.kind === 'temp' && v.deferDays ? `<div>${t('v_tempd')}: <b>${bdi(dateStr(now + v.deferDays * DAY))}</b></div>` : '';
  const icon = v.kind === 'ok' ? 'check-circle' : v.kind === 'temp' ? 'clock' : 'alert';

function screeningLogHtml() {

  const rows = log.slice(0, 10).map(s => {

function questionRow(q) {

function renderScreening(saved = false) {
  prefillScreening();
  $('#scrHead').innerHTML = `<div><h2>${ic('stethoscope')} ${t('sc_title')}</h2><p>${t('sc_lead')}</p></div>`;
  const v = evaluateScreening();
  $('#screening').innerHTML = `<div class="card">
      <h3>${ic('thermometer')} ${t('sc_vitals')}</h3>
      <div class="cols3">
        <div><label class="f" for="scHb">${t('sc_hb')}</label><input id="scHb" type="number" step="0.1" min="5" max="20" value="${esc(scr.hb)}"></div>
        <div><label class="f" for="scWt">${t('sc_weight')}</label><input id="scWt" type="number" min="30" max="200" value="${esc(scr.weight)}"></div>
        <div><label class="f" for="scBp">${t('sc_bp')}</label><input id="scBp" type="number" min="70" max="220" value="${esc(scr.bp)}"></div>

function bindScreening() {
  const vitals = [['scHb', 'hb'], ['scWt', 'weight'], ['scBp', 'bp'], ['scAge', 'age']];
  vitals.forEach(([id, key]) => {
    $('#' + id).oninput = e => {
      scr[key] = e.target.value;
    };
  });
  $$('[data-q]').forEach(b => {
    b.onclick = () => {
      scr.answers[b.dataset.q] = b.dataset.v === '1';
      const row = b.closest('.yn');
      $$('button', row).forEach(x => x.classList.remove('on', 'no'));
      b.classList.add('on');
      if (b.dataset.v === '0') b.classList.add('no');
      $('#scVerdict').innerHTML = verdictHtml(evaluateScreening());
    };
  });
  $('#scRun').onclick = saveScreening;
  $('#scReset').onclick = () => {
    scr.answers = {};
    renderScreening();
  };
  if ($('#scClear')) {
    $('#scClear').onclick = () => {
      store.set('screenings', []);
      renderScreening();
    };
  }
}

function saveScreening() {
  const v = evaluateScreening();
  if (v.kind === 'pending') {
    toast(t('sc_answerAll'), 'bad');
    return;
  }
  const log = store.get('screenings', []);
  log.unshift({ ts: Date.now(), kind: v.kind, deferDays: v.deferDays, reasons: v.reasons, hb: scr.hb || null, weight: scr.weight || null });
  store.set('screenings', log.slice(0, 20));
  notify(v.kind === 'ok' ? 'ok' : 'alert', 'n_screen', t('v_' + v.kind), 'screening', { i18n: 'title' });
  toast(t('sc_saved'), 'ok');
  renderScreening(true);
}

// ---------- donation camps ----------
let campSel = null;
let campTab = 'upcoming';

function campStats(c) {
  const regs = c.regs.length;
  const checked = c.regs.filter(r => r.checked).length;
  const donated = c.regs.filter(r => r.donated).length;
  const deferred = c.regs.filter(r => r.deferred).length;
  const byGroup = Object.fromEntries(GROUPS.map(g => [g, 0]));
  c.regs.filter(r => r.donated).forEach(r => byGroup[r.group]++);
  return { regs, checked, donated, deferred, noShow: Math.max(0, regs - checked), fill: pct(regs, c.slots), defRate: pct(deferred, checked), byGroup };
}

function campRow(c) {
  const s = campStats(c);
  const d = new Date(c.date);
  const month = d.toLocaleDateString('en-PK', { month: 'short' });
  return `<article class="camp ${c.status} ${campSel === c.id ? 'sel' : ''}" data-camp="${c.id}" style="${campSel === c.id ? 'border-color:var(--rose)' : ''}">

    <div>
      <div class="row"><h4>${esc(c.name)}</h4>${c.status === 'done' ? `<span class="pill ok">${t('cp_past')}</span>` : `<span class="pill wait">${t('cp_upcoming')}</span>`}</div>

  if (!name || !PHONE_RE.test(phone)) {
    toast(t('reg_invalid'), 'bad');

  }
  if (c.regs.length >= c.slots) {
    toast(t('cp_full'), 'bad');

// ---------- thalassemia rota ----------
let rotaMonth = monthKey(now);
const monthParts = key => key.split('-').map(Number);
const monthLabel = key => {
  const [y, m] = monthParts(key);
  return new Date(y, m - 1, 1).toLocaleDateString('en-PK', { month: 'long', year: 'numeric' });
};
const shiftMonth = (key, n) => {
  const [y, m] = monthParts(key);
  return monthKey(new Date(y, m - 1 + n, 1).getTime());
};
const needDate = (p, key) => {
  const [y, m] = monthParts(key);
  return new Date(y, m - 1, p.day, 10).getTime();
};

// Assigned donor ids that still exist (profile may have been deleted, demo may be off).
function assignedFor(p, key) {
  const ids = p.assigned?.[key] || [];
  return ids.map(donorById).filter(Boolean);
}
const coverageClass = (have, need) => (have >= need ? 'full' : have > 0 ? 'part' : 'none');

function rotaCalendar(key) {
  const [y, m] = monthParts(key);
  const first = new Date(y, m - 1, 1);
  const days = new Date(y, m, 0).getDate();
  const pad = (first.getDay() + 6) % 7; // Monday first
  const dows = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div class="dow">${d}</div>`).join('');
  const patients = rota();
  const todayKey = monthKey(now) === key ? new Date(now).getDate() : -1;
  const cells = [];
  for (let i = 0; i < pad; i++) cells.push('<div class="day pad"></div>');
  for (let d = 1; d <= days; d++) {
    const needs = patients.filter(p => p.day === d).map(p => {
      const have = assignedFor(p, key).length;
      return `<button class="need ${coverageClass(have, p.units)}" data-assign="${p.id}" title="${esc(p.name)} · ${esc(p.hospital)}">${esc(p.name.split(' ')[0])} ${p.group} ${have}/${p.units}</button>`;
    }).join('');
    cells.push(`<div class="day ${d === todayKey ? 'today' : ''}"><span class="dn">${d}</span>${needs}</div>`);
  }
  return `<div class="cal">${dows}${cells.join('')}</div>`;
}

function rotaCoverage() {
  const months = [0, 1, 2].map(n => shiftMonth(monthKey(now), n));
  const patients = rota();
  return months.map(key => {
    const need = patients.reduce((a, p) => a + p.units, 0);
    const have = patients.reduce((a, p) => a + Math.min(p.units, assignedFor(p, key).length), 0);
    return `<div class="stat" style="grid-template-columns:110px 1fr 70px"><span>${monthLabel(key).split(' ')[0]}</span><div class="track"><div class="fill" style="width:${pct(have, need)}%;background:${have >= need ? 'var(--green)' : 'var(--gold)'}"></div></div><span class="n">${have}/${need}</span></div>`;
  }).join('');
}

function patientRow(p) {
  const have = assignedFor(p, rotaMonth);
  const cls = coverageClass(have.length, p.units);
  const label = cls === 'full' ? t('ro_full') : cls === 'part' ? t('ro_part') : t('ro_zero');

}

// Donors already used this month by any patient are excluded (one donation per month).
function rotaCandidates(p, key) {
  const date = needDate(p, key);
  const used = new Set(rota().flatMap(x => x.assigned?.[key] || []));
  return allDonors()
    .filter(d => d.city === p.city && CAN_RECEIVE[p.group].includes(d.group))
    .filter(d => !used.has(d.id))
    .map(d => ({ ...d, ok: eligibleOn(d, date) }))
    .sort((a, b) => (b.ok ? 1 : 0) - (a.ok ? 1 : 0) || (b.isMe ? 1 : 0) - (a.isMe ? 1 : 0) || b.count - a.count)
    .slice(0, 12);
}

function openAssign(pid) {
  const p = rota().find(x => x.id === pid);
  if (!p) return;
  const key = rotaMonth;
  const assigned = assignedFor(p, key);
  const candidates = rotaCandidates(p, key);
  const me = store.get('me', null);
  const meOk = me && candidates.some(d => d.isMe && d.ok);
  const assignedRows = assigned.length
    ? assigned.map(d => `<div class="assignee"><span>${ic('check-circle')} ${esc(d.name)} <span class="muted small">${d.group} · ${esc(d.area)}</span></span><button class="btn ghost sm" data-un="${d.id}">${t('ro_unassign')}</button></div>`).join('')
    : `<p class="muted small" style="margin:0">${t('ro_zero')}</p>`;
  const candRows = candidates.length
    ? candidates.map(d => `<div class="assignee"><span>${esc(d.name)} <span class="bg inline" style="font-size:.75rem;padding:2px 6px">${d.group}</span> <span class="muted small">${esc(d.area)} · ${d.count} ${t('donations')}</span>${d.ok ? '' : `<span class="pill wait" style="margin-left:6px">${ic('clock')} ${t('ro_notEligible')}</span>`}</span><button class="btn sm ${d.ok ? '' : 'ghost'}" data-as="${d.id}" ${d.ok ? '' : 'disabled'}>${d.isMe ? t('ro_assignMe') : t('ro_assign')}</button></div>`).join('')
    : `<p class="muted small" style="margin:0">${t('ro_none')}</p>`;
  openModal(`<h3>${ic('heart')} ${esc(p.name)} · ${p.group} · ${p.units} ${t('units')}</h3>
    <div class="meta">${esc(p.hospital)}, ${esc(p.city)} · ${t('ro_due')} ${bdi(dateStr(needDate(p, key)))}</div>
    <h4 class="mt">${t('ro_assigned')} (${assigned.length}/${p.units})</h4>${assignedRows}
    <h4 class="mt">${t('ro_candidates')}</h4>${candRows}
    ${meOk ? '' : me ? '' : `<p class="muted small mt">${t('needProfile')}</p>`}`, true);
  $$('[data-as]').forEach(b => (b.onclick = () => assignDonor(p.id, key, b.dataset.as)));
  $$('[data-un]').forEach(b => {
    b.onclick = () => {
      mutatePatient(p.id, x => {
        x.assigned = x.assigned || {};
        x.assigned[key] = (x.assigned[key] || []).filter(id => id !== b.dataset.un);
      });
      openAssign(p.id);
      renderRota();
    };
  });
}

function assignDonor(pid, key, donorId) {
  const p = rota().find(x => x.id === pid);
  if (assignedFor(p, key).length >= p.units) {
    toast(t('ro_full'), 'bad');
    return;
  }
  mutatePatient(pid, x => {
    x.assigned = x.assigned || {};
    x.assigned[key] = [...(x.assigned[key] || []), donorId];
  });
  if (donorId === 'me') notify('ok', 'n_rota', `${p.name} · ${p.hospital} · ${dateStr(needDate(p, key))}`, 'rota', { i18n: 'title' });
  toast(t('ro_assignedOk'), 'ok');
  openAssign(pid);
  renderRota();
  // TODO(student): send the assigned donor an SMS reminder 2 days before the transfusion date and let them decline so the slot reopens.
}

  return plateletGrade(recipient, donor);
}

// ---------- stats ----------
const GROUP_COLORS = ['#b3122e', '#e85d75', '#d9a441', '#536075', '#2e8b57', '#8c0d24', '#f0a3b2', '#9aa6b8'];

function groupDonut(byG, total) {
  const R = 56;
  const C = 2 * Math.PI * R;
  let off = 0;
  const segs = GROUPS.map((g, i) => {
    const f = total ? byG[g] / total : 0;
    const seg = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${GROUP_COLORS[i]}" stroke-width="22" stroke-dasharray="${C * f} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;
    off += C * f;
    return seg;
  }).join('');
  return `<svg viewBox="0 0 140 140" width="140" height="140" aria-hidden="true">${segs}<text x="70" y="75" text-anchor="middle" font-weight="900" font-size="20" fill="#2a1215">${total}</text></svg>`;
}

function groupBars(byG, total) {
  const maxG = Math.max(1, ...Object.values(byG));
  return GROUPS.map((g, i) => `<div class="stat"><span style="color:${GROUP_COLORS[i]}">${g}</span><div class="track"><div class="fill" style="width:${(byG[g] / maxG) * 100}%;background:${GROUP_COLORS[i]}"></div></div><span class="n">${byG[g]} · ${pct(byG[g], total)}%</span></div>`).join('');
}

function cityCoverage(byC) {
  const maxC = Math.max(1, ...Object.values(byC).map(x => x.n));
  return CITY_LIST.map(c => `<div class="stat" style="grid-template-columns:92px 1fr 70px"><span>${c}</span><div class="track"><div class="fill" style="width:${(byC[c].n / maxC) * 100}%;background:linear-gradient(90deg,var(--crimson) ${pct(byC[c].e, Math.max(1, byC[c].n))}%,var(--rose) 0)"></div></div><span class="n">${byC[c].e}/${byC[c].n}</span></div>`).join('');
}

function renderStats() {
  const donors = allDonors();
  const reqs = requests();
  const byG = Object.fromEntries(GROUPS.map(g => [g, 0]));
  donors.forEach(d => byG[d.group]++);
  const byC = Object.fromEntries(CITY_LIST.map(c => [c, { n: 0, e: 0 }]));
  donors.forEach(d => {
    byC[d.city].n++;
    if (eligibleIn(d) === 0) byC[d.city].e++;
  });
  const elig = donors.filter(d => eligibleIn(d) === 0).length;
  const rare = GROUPS.reduce((a, g) => (byG[g] < byG[a] ? g : a), GROUPS[0]);
  const open = reqs.filter(r => !isClosed(r)).length;
  const critical = reqs.filter(r => !isClosed(r) && r.urgency === 'critical').length;
  const kpi = (k, icon, v, s, num = true) => `<div class="kpi"><div class="k">${ic(icon)} ${t(k)}</div><div class="v" ${num ? `data-count="${v}"` : ''}>${v}</div><div class="s">${s}</div></div>`;
  $('#skpis').innerHTML = kpi('k_donors', 'users', donors.length, CITY_LIST.length + ' ' + t('cities'))
    + kpi('k_eligible', 'check-circle', elig, pct(elig, donors.length) + '%')
    + kpi('k_open', 'siren', open, critical + ' ' + t('critical').toLowerCase())
    + kpi('k_full', 'heart', reqs.filter(r => r.status === 'fulfilled').length, '')
    + kpi('k_rare', 'droplet', rare, byG[rare] + ' ' + t('donorsWord'), false);
  $$('#skpis [data-count]').forEach(el => countUp(el, +el.dataset.count));
  $('#stats').innerHTML = `<div class="card"><h3>${ic('pie-chart')} ${t('s_byGroup')}</h3>
      <div class="donutwrap" style="display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:center">${groupDonut(byG, donors.length)}<div>${groupBars(byG, donors.length)}</div></div>
      <div class="note mt">${t('s_insight')}</div>
    </div>
    <div class="card"><h3>${ic('map')} ${t('s_byCity')}</h3>${cityCoverage(byC)}<p class="muted" style="font-size:.8rem;margin:10px 0 0">${t('s_eligReg')}</p>
      <h3 style="margin-top:18px">${ic('target')} ${t('compatFor')}</h3>${compatTable('rbc')}
    </div>`;
}

// ---------- analytics ----------
// Live board + seeded history, normalised to one shape.
function analyticsRequests() {
  const live = requests().map(r => ({
    id: r.id,
    group: r.group,
    units: r.units,
    city: r.city,
    urgency: r.urgency,
    ts: r.ts,
    firstResp: r.responses.length ? Math.min(...r.responses.map(x => x.ts)) : null,
    status: r.status,
  }));
  const history = demoOn() ? SEED_HISTORY : [];
  return [...history, ...live].filter(r => now - r.ts <= 90 * DAY);
}

function demandSupplyByGroup(reqs, donors) {
  return GROUPS.map(g => {
    const demand = reqs.filter(r => r.group === g).reduce((a, r) => a + r.units, 0);
    const supply = donors.filter(d => d.group === g && eligibleIn(d) === 0).length;
    return { g, demand, supply, ratio: supply ? demand / supply : demand };
  });
}

function groupedBarChart(rows) {
  const W = 640;
  const H = 230;
  const padL = 38;
  const padB = 28;
  const padT = 12;
  const maxV = Math.max(1, ...rows.flatMap(r => [r.demand, r.supply]));
  const bw = (W - padL - 10) / rows.length;
  const y = v => padT + (H - padT - padB) * (1 - v / maxV);
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => {
    const v = Math.round(maxV * f);
    return `<line x1="${padL}" x2="${W - 6}" y1="${y(v)}" y2="${y(v)}" stroke="#f1d6d0"/><text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end" font-size="13" fill="#8a6a6e">${v}</text>`;
  }).join('');
  const bars = rows.map((r, i) => {
    const x0 = padL + i * bw + bw * 0.14;
    const w = bw * 0.32;
    return `<rect x="${x0}" y="${y(r.demand)}" width="${w}" height="${H - padB - y(r.demand)}" rx="4" fill="#b3122e"/>
      <rect x="${x0 + w + 3}" y="${y(r.supply)}" width="${w}" height="${H - padB - y(r.supply)}" rx="4" fill="#2e8b57"/>
      <text x="${padL + i * bw + bw / 2}" y="${H - 9}" text-anchor="middle" font-size="15" fill="#2a1215">${r.g}</text>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('an_dvs')}">${ticks}${bars}</svg>`;
}

function cityDemandTable(reqs, donors) {
  const rows = CITY_LIST.map(c => {
    const cr = reqs.filter(r => r.city === c);
    const demand = cr.reduce((a, r) => a + r.units, 0);
    const supply = donors.filter(d => d.city === c && eligibleIn(d) === 0).length;
    return { c, n: cr.length, demand, supply, ratio: supply ? demand / supply : demand };
  }).sort((a, b) => b.ratio - a.ratio);
  const maxR = Math.max(0.1, ...rows.map(r => r.ratio));
  const tr = rows.map(r => `<tr><td><b>${r.c}</b></td><td class="num">${r.n}</td><td class="num">${r.demand}</td><td class="num">${r.supply}</td><td class="num">${r.ratio.toFixed(1)}</td><td style="min-width:90px"><div class="track" style="height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden"><div class="fill" style="height:100%;width:${(r.ratio / maxR) * 100}%;background:${r.ratio > 2 ? 'var(--crimson)' : r.ratio > 1 ? 'var(--gold)' : 'var(--green)'};border-radius:999px"></div></div></td></tr>`).join('');
  return { html: `<div class="scrollx"><table class="tbl"><thead><tr><th>${t('city')}</th><th>${t('an_requests')}</th><th>${t('an_demand')}</th><th>${t('an_supply')}</th><th>${t('an_ratio')}</th><th></th></tr></thead><tbody>${tr}</tbody></table></div>`, top: rows[0] };
}

function responseHistogram(reqs) {
  const bins = [1, 3, 6, 12, 24, Infinity];
  const counts = bins.map(() => 0);
  let none = 0;
  reqs.forEach(r => {
    if (!r.firstResp) {
      none++;
      return;
    }
    const h = (r.firstResp - r.ts) / HOUR;
    counts[bins.findIndex(b => h < b)]++;
  });
  const max = Math.max(1, ...counts);
  const cols = counts.map((n, i) => `<div><span class="tnum">${n}</span><div class="bar" style="height:${Math.max(3, (n / max) * 100)}%"></div><span>${t('bin' + (i + 1))}</span></div>`).join('');
  return `<div class="hist">${cols}</div><p class="muted small" style="margin:8px 0 0">${none} ${t('an_requests')} ${t('an_noResp')}</p>`;
}

function weekHourHeatmap(reqs) {
  const grid = Array.from({ length: 7 }, () => Array(24).fill(0));
  reqs.forEach(r => {
    const d = new Date(r.ts);
    grid[(d.getDay() + 6) % 7][d.getHours()]++;
  });
  const max = Math.max(1, ...grid.flat());
  const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const header = `<div></div>${Array.from({ length: 24 }, (_, h) => `<div class="hx">${h % 3 === 0 ? h : ''}</div>`).join('')}`;
  const rows = grid.map((row, di) => `<div class="hl">${days[di]}</div>${row.map((n, h) => `<div class="hc" title="${days[di]} ${h}:00 · ${n}" style="background:rgba(179,18,46,${n ? 0.12 + 0.88 * (n / max) : 0.04})"></div>`).join('')}`).join('');
  const hourTotals = Array.from({ length: 24 }, (_, h) => grid.reduce((a, row) => a + row[h], 0));
  const peak = hourTotals.indexOf(Math.max(...hourTotals));
  return { html: `<div class="heat">${header}${rows}</div><p class="muted small" style="margin:8px 0 0">${t('an_peakNote')}</p>`, peak };
}

function urgencyOutcome(reqs) {
  return ['critical', 'urgent', 'routine'].map(u => {
    const list = reqs.filter(r => r.urgency === u);
    const ful = list.filter(r => r.status === 'fulfilled').length;
    const exp = list.filter(r => r.status === 'expired').length;
    const openN = list.length - ful - exp;
    const w = n => pct(n, Math.max(1, list.length));
    return `<div class="stat" style="grid-template-columns:92px 1fr 90px"><span>${t(u)}</span><div class="track" style="display:flex"><div style="width:${w(ful)}%;background:var(--green)"></div><div style="width:${w(exp)}%;background:var(--slate)"></div><div style="width:${w(openN)}%;background:var(--gold)"></div></div><span class="n">${w(ful)}% · ${list.length}</span></div>`;
  }).join('') + `<div class="legend"><span><i style="background:var(--green)"></i>${t('fulfilled')}</span><span><i style="background:var(--slate)"></i>${t('expired')}</span><span><i style="background:var(--gold)"></i>${t('open')}</span></div>`;
}

function renderAnalytics() {
  $('#anaHead').innerHTML = `<div><h2>${ic('bar-chart')} ${t('an_title')}</h2><p>${t('an_lead')}</p></div>`;
  const reqs = analyticsRequests();
  const donors = allDonors();
  const closed = reqs.filter(r => r.status === 'fulfilled' || r.status === 'expired');
  const fulfilRate = pct(closed.filter(r => r.status === 'fulfilled').length, closed.length);
  const med = median(reqs.filter(r => r.firstResp).map(r => r.firstResp - r.ts));
  const heat = weekHourHeatmap(reqs);
  const byGroup = demandSupplyByGroup(reqs, donors);
  const gap = [...byGroup].sort((a, b) => b.ratio - a.ratio)[0];
  const city = cityDemandTable(reqs, donors);
  const kpi = (k, icon, v, s) => `<div class="kpi"><div class="k">${ic(icon)} ${t(k)}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  $('#akpis').innerHTML = kpi('k_reqs', 'siren', reqs.length, `${reqs.reduce((a, r) => a + r.units, 0)} ${t('units')}`)
    + kpi('k_fulfilRate', 'check-circle', fulfilRate + '%', `${closed.length} ${t('an_requests')}`)
    + kpi('k_median', 'timer', humanDuration(med), '')
    + kpi('k_peak', 'clock', `${heat.peak}:00`, '')
    + kpi('an_gap', 'alert', gap ? gap.g : '—', gap ? `${gap.ratio.toFixed(1)} ${t('an_gapd')}` : '');
  $('#analytics').innerHTML = `<div class="two even">
      <div class="card"><h3>${ic('bar-chart')} ${t('an_dvs')}</h3>${groupedBarChart(byGroup)}<div class="legend"><span><i style="background:#b3122e"></i>${t('an_legendD')}</span><span><i style="background:#2e8b57"></i>${t('an_legendS')}</span></div></div>
      <div class="card"><h3>${ic('map')} ${t('an_city')}</h3>${city.html}</div>
    </div>
    <div class="two even mt">
      <div class="card"><h3>${ic('timer')} ${t('an_resp')}</h3>${responseHistogram(reqs)}</div>
      <div class="card"><h3>${ic('flag')} ${t('an_fulfil')}</h3>${urgencyOutcome(reqs)}</div>
    </div>
    <div class="card mt"><h3>${ic('calendar')} ${t('an_heat')}</h3>${heat.html}</div>`;
}

function renderInbox() {

    renderInbox();

    saveInbox([]);

    renderInbox();

function markRead(id) {

function bindSettings() {
  $('#setLang').onchange = e => {
    lang = e.target.value;
    applyLang();
  };
  $('#setCity').onchange = e => saveSettings({ city: e.target.value });
  $$('[data-set]').forEach(el => {
    el.onchange = () => {
      saveSettings({ [el.dataset.set]: el.checked });
      renderTabs();
      updateBell();
    };
  });
  $('#setExport').onclick = exportData;
  $('#setImport').onchange = e => {
    const f = e.target.files[0];
    if (f) importData(f);
  };
  $('#setReset').onclick = () => {
    if (!confirm(t('se_resetConfirm'))) return;
    store.keys().forEach(k => store.remove(k));
    toast(t('se_resetDone'), 'ok');
    setTimeout(() => location.reload(), 600);
  };
  $('#setTour').onclick = () => startTour();
  $('#setKeys').onclick = openShortcuts;
}

function exportData() {
  const data = {};
  store.keys().forEach(k => (data[k] = store.get(k, null)));
  const payload = { app: 'khoon', version: 2, exportedAt: new Date().toISOString(), data };
  downloadText(`khoon-backup-${isoDate(now)}.json`, JSON.stringify(payload, null, 2));
  toast(t('se_exported'), 'ok');
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (parsed.app !== 'khoon' || typeof parsed.data !== 'object') throw new Error('bad');
      Object.entries(parsed.data).forEach(([k, v]) => store.set(k, v));
      toast(t('se_imported'), 'ok');
      lang = store.get('lang', lang);
      applyLang();
      updateBell();
    } catch {
      toast(t('se_importBad'), 'bad');
    }
  };
  reader.readAsText(file);
}

// ---------- onboarding tour ----------
const TOUR_STEPS = [
  { el: '#searchbar', key: 'tour_1' },
  { el: '#tabs', key: 'tour_2' },
  { el: '[data-p="requests"]', key: 'tour_3' },
  { el: '#bellBtn', key: 'tour_4' },
  { el: '[data-p="settings"]', key: 'tour_5' },
];
let tourStep = -1;

function startTour() {
  closeModal();
  tourStep = 0;
  $('#tour').classList.add('on');
  showTourStep();
}

function endTour() {
  tourStep = -1;
  $('#tour').classList.remove('on');
  store.set('tour', { done: true, ts: Date.now() });
}

function positionTip(rect) {
  const tip = $('#tourTip');
  const spot = $('#tourSpot');
  const padR = 8;
  spot.style.left = rect.left - padR + 'px';
  spot.style.top = rect.top - padR + 'px';
  spot.style.width = rect.width + padR * 2 + 'px';
  spot.style.height = rect.height + padR * 2 + 'px';
  const tw = Math.min(340, window.innerWidth - 32);
  const below = rect.bottom + 14;
  const fitsBelow = below + 190 < window.innerHeight;
  const top = fitsBelow ? below : Math.max(12, rect.top - 14 - tip.offsetHeight);
  let left = rect.left + rect.width / 2 - tw / 2;
  left = Math.max(16, Math.min(left, window.innerWidth - tw - 16));
  tip.style.top = top + 'px';
  tip.style.left = left + 'px';
}

function showTourStep() {
  const step = TOUR_STEPS[tourStep];
  if (!step) {
    endTour();
    return;
  }
  const el = $(step.el);
  if (!el) {
    tourStep++;
    showTourStep();
    return;
  }
  el.scrollIntoView({ block: 'center', behavior: 'instant' });
  const rect = el.getBoundingClientRect();
  const last = tourStep === TOUR_STEPS.length - 1;
  const dots = TOUR_STEPS.map((_, i) => `<i class="${i === tourStep ? 'on' : ''}"></i>`).join('');
  $('#tourTip').innerHTML = `<h4>${t(step.key + 't')}</h4><p>${t(step.key + 'b')}</p>
    <div class="between"><div class="dots">${dots}</div><div class="row">
      <button class="btn ghost sm" id="tourSkip">${t('tour_skip')}</button>
      ${tourStep > 0 ? `<button class="btn ghost sm" id="tourBack">${ic('chevron-left')} ${t('tour_back')}</button>` : ''}
      <button class="btn sm" id="tourNext">${last ? t('tour_done') : t('tour_next')} ${last ? ic('check') : ic('chevron-right')}</button>
    </div></div>`;
  positionTip(rect);
  $('#tourSkip').onclick = endTour;
  $('#tourNext').onclick = () => {
    tourStep++;
    showTourStep();
  };
  if ($('#tourBack')) {
    $('#tourBack').onclick = () => {
      tourStep--;
      showTourStep();
    };
  }
  $('#tourNext').focus();
}
window.addEventListener('resize', () => {
  if (tourStep >= 0) showTourStep();
});

// ---------- keyboard shortcuts ----------
function openShortcuts() {
  const row = (keys, k) => `<div class="setrow"><span>${t(k)}</span><span class="row">${keys.map(x => `<span class="kbd">${x}</span>`).join('')}</span></div>`;
  openModal(`<h3>${ic('info')} ${t('ks_title')}</h3>
    ${row(['1', '…', '9', '0'], 'ks_tabs')}
    ${row(['L'], 'ks_lang')}
    ${row(['/'], 'ks_search')}
    ${row(['I'], 'ks_inbox')}
    ${row(['?'], 'ks_help')}
    ${row(['Esc'], 'ks_close')}`);
}

document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = ['input', 'textarea', 'select'].includes(tag);
  if (e.key === 'Escape') {
    if (tourStep >= 0) endTour();
    else closeModal();
    return;
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === '?') return openShortcuts();
  if (e.key === 'l' || e.key === 'L') return $('#langBtn').click();
  if (e.key === 'i' || e.key === 'I') return go('inbox');
  if (e.key === '/') {
    e.preventDefault();
    go('find');
    $('#fArea').focus();
    return;
  }
  if (/^[0-9]$/.test(e.key)) {
    const idx = e.key === '0' ? 9 : +e.key - 1;
    if (PAGES[idx]) go(PAGES[idx]);
  }
});

// ---------- nav / boot ----------
const PAGES = ['find', 'requests', 'register', 'screening', 'camps', 'rota', 'components', 'banks', 'stats', 'analytics', 'inbox', 'settings', 'about'];
const PAGE_ICON = { find: 'search', requests: 'siren', register: 'user', screening: 'stethoscope', camps: 'tent', rota: 'heart', components: 'layers', banks: 'building', stats: 'pie-chart', analytics: 'bar-chart', inbox: 'bell', settings: 'settings', about: 'info' };
const RENDERERS = { find: renderFind, requests: renderRequests, register: () => renderRegister(), screening: () => renderScreening(), camps: renderCamps, rota: renderRota, components: renderComponents, banks: renderBanks, stats: renderStats, analytics: renderAnalytics, inbox: renderInbox, settings: renderSettings, about: renderAbout };
let cur = 'find';

function tabBadge(p) {
  if (p === 'requests') {
    const open = requests().filter(r => !isClosed(r)).length;
    return open ? `<span class="n">${open}</span>` : '';
  }
  if (p === 'inbox') {
    const n = unreadCount();
    return n ? `<span class="n gold">${n}</span>` : '';
  }
  if (p === 'camps') {
    const n = camps().filter(c => c.status !== 'done').length;
    return n ? `<span class="n">${n}</span>` : '';
  }
  if (p === 'register' && store.get('me', null)) return ic('check');
  return '';
}

function renderTabs() {
  $('#tabs').innerHTML = PAGES.map(p => `<button data-p="${p}" class="${cur === p ? 'on' : ''}">${ic(PAGE_ICON[p])}<span>${t('nav_' + p)}</span>${tabBadge(p)}</button>`).join('');
  $$('#tabs button').forEach(b => (b.onclick = () => go(b.dataset.p)));
  const on = $('#tabs button.on');
  if (on && window.innerWidth < 860) on.scrollIntoView({ inline: 'center', block: 'nearest' });
}

function go(page) {
  if (!PAGES.includes(page)) page = 'find';
  cur = page;
  $$('section[data-page]').forEach(s => s.classList.toggle('on', s.dataset.page === page));
  renderTabs();
  RENDERERS[page]();
  animateIn($(`section[data-page="${page}"]`));
  if (location.hash !== '#' + page) history.replaceState(null, '', '#' + page);
}

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.classList.toggle('ur', lang === 'ur');
  store.set('lang', lang);
  $$('[data-i18n]').forEach(el => (el.textContent = t(el.dataset.i18n)));
  $('#langBtn').textContent = lang === 'en' ? 'اردو' : 'English';
  renderHeroSearch();
  go((location.hash || '#find').slice(1));
}

$('#langBtn').onclick = () => {
  lang = lang === 'en' ? 'ur' : 'en';
  applyLang();
};
$('#bellBtn').onclick = () => go('inbox');
$('#helpBtn').onclick = openShortcuts;
window.addEventListener('hashchange', () => go(location.hash.slice(1)));

const freshOpen = !location.hash && !store.get('tour', null);
expireRequests();
bootNotifications();
updateBell();
applyLang();
if (freshOpen) setTimeout(startTour, 900);
