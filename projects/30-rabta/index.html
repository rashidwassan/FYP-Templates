/** Scanned identity: same key as the contact we know → verified; different key for that name → warning. */
async function verifyScanned(code) {
  let info;
  try {
    info = await parseIdentityCode(code);
  } catch {
    return toast(t('id_badCode'), 'bad');
  }
  const known = contactOf(info.id);
  const sameName = Object.values(S.contacts).find(c => c.id !== info.id && c.name === info.name);
  if (sameName) toast(t('id_nameClash', { name: info.name }), 'bad');
  upsertContact({ id: info.id, name: info.name, pk: info.pk, dh: info.dh }, known?.via || 'qr');
  S.contacts[info.id].trust = 2;
  persist('contacts');
  logEvent('lg_verified', { name: info.name }, 'security');
  toast(t('id_verified', { name: info.name }), 'ok');
  go('identity/' + info.id);
}

// Teaching demo: sign a message, change one character, verify both.
async function tamperDemo() {
  if (!ME.keys) return toast(t('err_crypto'), 'bad');
  const ts = Math.floor(now() / 1000) * 1000;
  const m = { v: 1, id: randomHex(8), kind: 'text', ch: '#village', from: ME.id, name: ME.name, to: null, ts, exp: ts + HOUR, hl: 8, prio: 0, body: { t: t('id_tamperMsg') }, enc: null, pk: ME.pk };
  await signMsg(m, ME.keys);
  const forged = structuredClone(m);
  forged.body.t = forged.body.t.replace(/\d/, d => String((Number(d) + 1) % 10));
  const [a, b] = [await verifyMsg(m), await verifyMsg(forged)];

}

// ---------- demo data on/off ----------
async function setDemo(on) {
  if (on) {
    toast(t('loading'));
    await reseedDemo();
  } else {
    VILLAGE.nodes = [];
    store.set('village', []);
    for (const [id, c] of Object.entries(S.contacts)) if (c.demo) delete S.contacts[id];
    ME.core.store.clear();
    ME.boards = Object.fromEntries(BOARD_IDS.map(b => [b, boardNew()]));
    S.conflicts = [];
    S.inbox = S.inbox.filter(n => !String(n.key).startsWith('seed'));
  }
  S.settings.demo = on;
  S.settings.village = on;
  rebuildIndexes();
  persistAll();
  persistMesh();
  logEvent(on ? 'lg_demoOn' : 'lg_demoOff', {}, 'app');
  rerender();
}

async function reseedDemo() {
  await createVillage();
  const done = [];
  for (const spec of SEED_MESSAGES) done.push([spec, await seedMsg(spec)]);
  await seedReceipts(done);
  await seedBoards(done.filter(([s]) => s.sos));
  rebuildIndexes();
  seedLastSeen();
  persistVillage();
}

// ---------- export / import / reset / wipe ----------
function exportData() {
  const data = { app: 'rabta', v: 1, exported: new Date().toISOString(), slot: SLOT, ...Object.fromEntries(KEYS.map(k => [k, S[k]])), store: serializeStore(ME.core), boards: ME.boards, clock: ME.clock.pack(), village: store.get('village', []) };
  downloadFile(`rabta-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(data));
  S.settings.lastBackup = now();
  persist('settings');
  toast(t('set_exported'), 'ok');
}

async function importData(text) {
  let data;
  try {
    data = JSON.parse(text);
  } catch {
    return toast(t('set_importBad'), 'bad');
  }
  if (data.app !== 'rabta' || !data.identity?.signJwk) return toast(t('set_importBad'), 'bad');
  if (!(await askConfirm(t('set_importQ'), { danger: true, okText: t('set_import') }))) return;
  store.clear();
  for (const k of [...KEYS, 'store', 'boards', 'clock', 'village']) if (data[k] !== undefined) store.set(k, data[k]);
  location.reload();
}

async function resetDemo() {
  if (!(await askConfirm(t('set_resetQ'), { danger: true, okText: t('set_reset') }))) return;
  store.clear();
  location.reload();
}

/** Panic option: close every link and erase every Rabta key on this device (all node slots). */
async function wipeDevice() {
  if (!(await askConfirm(t('set_wipeQ'), { danger: true, okText: t('set_wipeBtn'), typed: 'WIPE' }))) return;
  tabsStop();
  RTC.conns.forEach(rtcClose);
  try {
    Object.keys(localStorage).filter(k => k.startsWith('rabta.')).forEach(k => localStorage.removeItem(k));
    sessionStorage.clear();
    sessionStorage.setItem('rabta.fresh', '1');
  } catch {
    /* storage blocked */
  }
  location.replace(location.pathname + location.search + '#chats');
  location.reload();
}

function paletteIndex() {
  const items = [];
  const add = (group, icon, label, sub, run) => items.push({ group, icon, label, sub, run });
  NAV.forEach(r => add('sg_pages', ROUTES[r].icon, t('nav_' + r), '', () => go(r)));
  add('sg_actions', 'siren', t('sos_title'), t('sos_hold'), openSosSheet);
  add('sg_actions', 'qr-code', t('cn_invite'), '', () => go('connect'));
  add('sg_actions', 'rotate', t('lb_title'), '', () => go('connect'));
  add('sg_actions', 'footprints', t('mesh_walk'), '', walkVillage);
  add('sg_actions', 'flask', t('sim_run'), '', () => go('mesh/sim'));
  add('sg_actions', 'printer', t('rp_sitrep'), '', printSitrep);
  add('sg_actions', 'eraser', t('set_wipe'), '', wipeDevice);
  CHANNELS.forEach(c => add('sg_chats', c.icon, '#' + L(c.name), L(c.desc), () => go('chats/' + encodeURIComponent(c.id))));
  Object.values(S.contacts).forEach(c => add('sg_people', 'user', nameOf(c.id), `${shortId(c.id)} · ${t('trust_' + c.trust)}`, () => go('identity/' + c.id)));
  for (const [conv, list] of CONV) {
    list.slice(-60).forEach(e => {
      const b = bodyOf(e.m);
      if (b && msgText(b)) add('sg_messages', 'message', msgText(b), `${convTitle(conv)} · ${nameOf(e.m.from, e.m.name)}`, () => go('chats/' + encodeURIComponent(conv)));
    });
  }
  PAPER_BOARDS.forEach(b => boardItems(ME.boards[b]).forEach(i => add('sg_boards', BOARDS[b].icon, boardTitle(b, i), `${t('bd_' + b)} · ${opt(i.status)}`, () => go('boards/' + b))));
  boardItems(ME.boards.incidents).forEach(i => add('sg_sos', 'siren', incTitle(i), `${opt(i.triage || 'unknown')} · ${t('life_' + incLife(i.id))}`, () => go('sos/incidents/' + i.id)));
  boardItems(ME.boards.roll).forEach(p => add('sg_roll', 'clipboard-check', p.name, `${p.house || ''} · ${t('roll_' + (p.status || 'unknown'))}`, () => go('sos/roll')));
  return items;
}

function openPalette() {
  closeModal();
  const p = $('#palette');
  p.innerHTML = `<div class="palbox"><input class="inp" id="palIn" type="search" placeholder="${t('searchAll')}" aria-label="${t('searchAll')}" autocomplete="off" dir="auto"><div class="palres" id="palRes" role="listbox"></div><div class="palhint">${t('palHint')}</div></div>`;
  p.setAttribute('aria-label', t('searchAll'));
  p.classList.add('on');
  const index = paletteIndex();
  const draw = () => {
    const q = $('#palIn').value.trim().toLowerCase();
    palItems = (q ? index.filter(i => (i.label + ' ' + i.sub).toLowerCase().includes(q)) : index.filter(i => i.group === 'sg_pages' || i.group === 'sg_actions')).slice(0, 40);
    palSel = 0;
    let lastGroup = '';
    $('#palRes').innerHTML = palItems.map((it, i) => {
      const head = it.group !== lastGroup ? `<div class="pg">${t(it.group)}</div>` : '';
      lastGroup = it.group;
      return `${head}<button type="button" role="option" data-i="${i}" class="${i === 0 ? 'on' : ''}">${ic(it.icon)}<span dir="auto">${esc(it.label)}</span><small dir="auto">${esc(it.sub)}</small></button>`;
    }).join('') || `<div class="empty">${t('sg_none')}</div>`;
    $$('#palRes [data-i]').forEach(b => (b.onclick = () => runPal(Number(b.dataset.i))));
    if (q) announce(t('sg_count', { n: palItems.length }));
  };
  $('#palIn').oninput = draw;
  $('#palIn').onkeydown = palKeys;
  p.onclick = e => e.target === p && closePalette();
  draw();
  setTimeout(() => $('#palIn')?.focus(), 30);
}

function palKeys(e) {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    palSel = clamp(palSel + (e.key === 'ArrowDown' ? 1 : -1), 0, palItems.length - 1);
    $$('#palRes [data-i]').forEach(b => b.classList.toggle('on', Number(b.dataset.i) === palSel));
    $('#palRes .on')?.scrollIntoView({ block: 'nearest' });
  }
  if (e.key === 'Enter' && palItems[palSel]) runPal(palSel);
}

function runPal(i) {
  const it = palItems[i];
  closePalette();
  if (it) it.run();
}

function closePalette() {
  const p = $('#palette');
  if (!p.classList.contains('on')) return;
  p.classList.remove('on');
  p.innerHTML = '';
}

  { sel: '#navList [data-nav="sound"], #tabMore', k: 'tour7' },
  { sel: '#langBtn', k: 'tour8' },
];
let tourStep = -1;
const visibleEl = sel => $$(sel).find(el => el.getClientRects().length && getComputedStyle(el).visibility !== 'hidden');

function startTour() {
  closeModal();
  closePalette();
  if (curRoute !== 'chats') go('chats');
  tourStep = 0;
  $('#tour').classList.add('on');
  setTimeout(showTourStep, 380);
}

function endTour() {
  tourStep = -1;
  $('#tour').classList.remove('on');
  S.settings.tourDone = true;
  persist('settings');
}

// Narrow targets (nav items) get the tip beside them; everything else above or below.
function placeTip(el) {
  const rect = el.getBoundingClientRect();
  const tip = $('#tourTip');
  const p = 6;
  Object.assign($('#tourSpot').style, { left: rect.left - p + 'px', top: rect.top - p + 'px', width: rect.width + p * 2 + 'px', height: rect.height + p * 2 + 'px', borderRadius: el.classList.contains('sos-hold') ? '50%' : '12px' });
  const tw = Math.min(340, window.innerWidth - 32);
  const th = tip.offsetHeight;
  let left;
  let top;
  if (rect.width < 120 && rect.right + 16 + tw < window.innerWidth) {
    left = rect.right + 16;
    top = clamp(rect.top - 20, 12, window.innerHeight - th - 12);
  } else {
    left = clamp(rect.left + rect.width / 2 - tw / 2, 16, window.innerWidth - tw - 16);
    top = rect.bottom + 16 + th + 12 < window.innerHeight ? rect.bottom + 16 : Math.max(12, rect.top - 16 - th);
  }
  Object.assign(tip.style, { top: top + 'px', left: left + 'px' });
}

function showTourStep() {
  const step = TOUR[tourStep];
  if (!step) return endTour();
  const el = visibleEl(step.sel);
  if (!el) {
    tourStep++;
    return showTourStep();
  }
  const last = tourStep === TOUR.length - 1;
  $('#tourTip').innerHTML = `<span class="tag">${t('stepXofY', { x: tourStep + 1, y: TOUR.length })}</span><h4>${t(step.k + 't')}</h4><p>${t(step.k + 'b')}</p>
    <div class="between"><div class="dots">${TOUR.map((_, i) => `<i class="${i === tourStep ? 'on' : ''}"></i>`).join('')}</div>
    <div class="row"><button type="button" class="btn ghost sm" id="tourSkip">${t('skip')}</button>${tourStep ? `<button type="button" class="btn ghost sm" id="tourBack" aria-label="${t('back')}">${ic('chevron-left', 'flip')}</button>` : ''}
    <button type="button" class="btn sm go" id="tourNext">${last ? t('done') : t('next')} ${ic(last ? 'check' : 'chevron-right', last ? '' : 'flip')}</button></div></div>`;
  placeTip(el);
  $('#tourSkip').onclick = endTour;
  $('#tourNext').onclick = () => {
    tourStep++;
    showTourStep();
  };
  if ($('#tourBack')) $('#tourBack').onclick = () => {
    tourStep--;
    showTourStep();
  };
  $('#tourNext').focus({ preventScroll: true });
}
window.addEventListener('resize', debounce(() => tourStep >= 0 && showTourStep(), 150));

// ---------- keyboard shortcuts ----------
function openShortcuts() {
  const row = (keys, k) => `<div class="between li"><span>${t(k)}</span><span class="row">${keys.map(x => `<span class="kbd">${x}</span>`).join('')}</span></div>`;
  openModal(`${sheetHead(t('shortcuts'), 'keyboard')}${row(['/', 'Ctrl K'], 'ks_search')}${row(['1', '…', '9'], 'ks_pages')}${row(['N'], 'ks_compose')}${row(['S'], 'ks_sos')}${row(['Space'], 'ks_hold')}${row(['W'], 'ks_walk')}${row(['L'], 'ks_lang')}${row(['T'], 'ks_theme')}${row(['?'], 'ks_help')}${row(['Esc'], 'ks_close')}`);
}

function onKey(e) {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = ['input', 'textarea', 'select'].includes(tag);
  if (e.key === 'Escape') return onEscape();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    return openPalette();
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || modalOpen() || tourStep >= 0) return;
  const k = e.key.toLowerCase();
  if (e.key === '?') return openShortcuts();
  if (e.key === '/') {
    e.preventDefault();
    return openPalette();
  }
  if (k === 'l') return setLang(lang === 'ur' ? 'en' : 'ur');
  if (k === 't') return toggleTheme();
  if (k === 'w' && VILLAGE.nodes.length) return walkVillage();
  if (k === 's') return visibleEl('#sosNavBtn, #sosFabBtn')?.focus();
  if (k === 'n') {
    e.preventDefault();
    if (curRoute !== 'chats') go('chats');
    return later(() => $('#msgIn')?.focus());
  }
  if (/^[1-9]$/.test(k)) go(NAV[Number(k) - 1]);
}

function onEscape() {
  if ($('#sosAlert').classList.contains('on')) return $('#sosAlert').classList.remove('on');
  if (tourStep >= 0) return endTour();
  if ($('#palette').classList.contains('on')) return closePalette();
  if (modalOpen()) return closeModal();
}

// ---------- router, navigation, banner, preferences, boot ----------
const ROUTES = {
  chats: { r: renderChats, icon: 'message' },
  sos: { r: renderSos, icon: 'siren' },
  boards: { r: renderBoards, icon: 'clipboard' },
  mesh: { r: renderMesh, icon: 'network' },
  connect: { r: renderConnect, icon: 'qr-code' },
  sound: { r: renderSound, icon: 'waveform' },
  radio: { r: renderRadio, icon: 'radio-tower' },
  map: { r: renderMap, icon: 'map' },
  identity: { r: renderIdentity, icon: 'fingerprint' },
  diag: { r: renderDiag, icon: 'activity' },
  inbox: { r: renderInbox, icon: 'bell' },
  settings: { r: renderSettings, icon: 'settings' },
  about: { r: renderAbout, icon: 'info' },
};
const NAV = Object.keys(ROUTES);
const BOTTOM_TABS = ['chats', 'mesh', 'boards', 'connect'];
const MORE_ROUTES = NAV.filter(r => !BOTTOM_TABS.includes(r));
const LIVE_ROUTES = ['sos', 'boards', 'map', 'diag', 'inbox', 'connect', 'identity'];
let curRoute = '';
let curArg = '';
let pendingRender = false;

const navLabel = r => (STR['navs_' + r] ? t('navs_' + r) : t('nav_' + r));

function navBadge(r) {
  if (r === 'inbox') return unreadInbox();
  if (r === 'sos') return openIncidents().filter(i => i.from !== ME.id && !i['ack_' + ME.id]).length;
  if (r === 'chats') return [...CHANNELS.map(c => c.id), ...dmPeers().map(p => 'dm:' + p)].reduce((n, c) => n + unreadIn(c), 0);
  return 0;
}

function renderNav() {
  $('#navList').innerHTML = NAV.map(r => {
    const n = navBadge(r);
    return `<a href="#${r}" data-nav="${r}" class="${r === curRoute ? 'on' : ''}" ${r === curRoute ? 'aria-current="page"' : ''} title="${t('nav_' + r)}">${ic(ROUTES[r].icon)}<span>${navLabel(r)}</span>${n ? `<span class="cnt">${n > 99 ? '99+' : n}</span>` : ''}</a>`;
  }).join('');
  const more = MORE_ROUTES.includes(curRoute);
  $('#tabs').innerHTML = BOTTOM_TABS.map(r => {
    const n = navBadge(r);
    return `<a href="#${r}" data-nav="${r}" class="${r === curRoute ? 'on' : ''}" ${r === curRoute ? 'aria-current="page"' : ''}>${ic(ROUTES[r].icon)}<span>${navLabel(r)}</span>${n ? `<span class="tdot">${n > 99 ? '99+' : n}</span>` : ''}</a>`;
  }).join('') + `<button type="button" id="tabMore" class="${more ? 'on' : ''}" aria-label="${t('more')}">${ic('menu')}<span>${t('more')}</span>${unreadInbox() || navBadge('sos') ? `<span class="tdot">${unreadInbox() + navBadge('sos')}</span>` : ''}</button>`;
  $('#tabs').setAttribute('aria-label', t('mainNav'));
  $('#nav').setAttribute('aria-label', t('mainNav'));
  $('#tabMore').onclick = openMoreSheet;
}

function openMoreSheet() {
  const sh = openModal(`${sheetHead(t('more'), 'menu')}<div class="list">${MORE_ROUTES.map(r => `<a class="li chan" href="#${r}" data-close>${ic(ROUTES[r].icon)}<span class="grow"><b>${t('nav_' + r)}</b></span>${navBadge(r) ? `<span class="unread">${navBadge(r)}</span>` : ''}</a>`).join('')}</div>
    <div class="row mt"><button type="button" class="btn ghost sm" id="mSearch">${ic('search')} ${t('search')}</button><button type="button" class="btn ghost sm" id="mTour">${ic('sparkles')} ${t('replayTour')}</button><button type="button" class="btn ghost sm" id="mKeys">${ic('keyboard')} ${t('shortcuts')}</button></div>`);
  $$('[data-close]', sh).forEach(a => (a.onclick = closeModal));
  $('#mSearch', sh).onclick = openPalette;
  $('#mTour', sh).onclick = startTour;
  $('#mKeys', sh).onclick = openShortcuts;
}

function renderBanner() {
  if (!ME) return;
  const mine = openIncidents().filter(i => i.from === ME.id);
  const incoming = openIncidents().filter(i => i.from !== ME.id && now() - (i.at || 0) < 6 * HOUR && !i['ack_' + ME.id] && incLife(i.id) === 'open');
  let html = '';
  if (mine.length) {
    const inc = mine[0];
    html += `<div class="strip">${ic('siren')}<span class="grow">${t('bn_mine', { n: reachOf(inc).n, a: acksOf(inc).length, life: t('life_' + incLife(inc.id)) })}</span><button type="button" class="btn" data-bn="${inc.id}">${t('open')}</button></div>`;
  }
  if (incoming.length && curRoute !== 'sos') {
    const inc = incoming.sort((a, b) => triageRank(a.triage) - triageRank(b.triage))[0];
    const here = myPos();
    const where = here && inc.lat ? ` · ${fmtDist(haversine(here, inc))} ${compass(bearing(here, inc))}` : '';
    html += `<div class="strip calm">${ic('siren')}<span class="grow">${t('bn_in', { name: esc(nameOf(inc.from, inc.name)), n: incoming.length })}${where}</span><button type="button" class="btn" data-bn="${inc.id}">${t('bn_respond')}</button></div>`;
  }
  $('#banner').innerHTML = html;
  $$('#banner [data-bn]').forEach(b => (b.onclick = () => go('sos/incidents/' + b.dataset.bn)));
}

function updateBadges() {
  const n = unreadInbox();
  $('#bellBadge').textContent = n > 99 ? '99+' : n;
  $('#bellBadge').classList.toggle('hidden', !n);
  $('#bellBtn').setAttribute('aria-label', t('notificationsN', { n }));
}

function updateLinkStat() {
  const n = liveSessions().length;
  $('#linkStat').innerHTML = `<span class="led ${n ? 'on' : ''}"></span>${n ? t('ls_n', { n }) : t('ls_none')}${SLOT !== 'A' ? ' · ' + t('nodeSlot', { s: SLOT }) : ''}`;
  $('#linkStat').title = t('ls_title');
}

function go(path) {
  if (location.hash.slice(1) === path) route();
  else location.hash = path;
}

function route() {
  const [name, ...rest] = (location.hash.slice(1) || 'chats').split('/');
  const r = ROUTES[name] ? name : 'chats';
  renderRoute(r, decodeURIComponent(rest.join('/')));
}

function pageTitle(r) {
  if (r === 'chats' && curConv()) return convTitle(curConv());
  return t('nav_' + r);
}

function renderRoute(r, arg) {
  const same = r === curRoute && arg === curArg;
  if (curRoute === 'sound' && r !== 'sound' && LISTEN.ctx) stopListen();
  curRoute = r;
  curArg = arg;
  closePalette();
  if (!same) closeModal();
  $('#app').dataset.route = r;
  $('#view').className = '';
  ROUTES[r].r(arg);
  $('#pageTitle').textContent = pageTitle(r);
  $('#pageSub').textContent = r === 'chats' && curConv() ? (channelOf(curConv()) ? L(channelOf(curConv()).desc) : shortId(dmPeerOf(curConv()))) : t('tagline');
  $('#backBtn').classList.toggle('show', r === 'chats' && !!arg && isNarrow());
  document.body.classList.toggle('chatopen', r === 'chats' && !!curConv());
  document.title = `${pageTitle(r)} — ${t('appName')} | FYP Template`;
  renderNav();
  renderRail();
  renderMeshPanel();
  updateBadges();
  renderBanner();
  if (!same) {
    window.scrollTo(0, 0);
    animateIn($('#view'));
  } else {
    settle($('#view'));
  }
}

function rerender() {
  if (!curRoute) return;
  const y = window.scrollY;
  renderRoute(curRoute, curArg);
  window.scrollTo(0, y);
}

function typingInView() {
  const a = document.activeElement;
  return !!a && $('#view').contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'range' && a.type !== 'checkbox';
}

// Mesh activity refreshes what is on screen without stealing focus or wiping a half-typed message.
const renderSoon = debounce(() => {
  if (!booted) return;
  renderNav();
  renderRail();
  renderMeshPanel();
  updateBadges();
  renderBanner();
  updateLinkStat();
  if (curRoute === 'chats' && curConv()) {
    fillMessages(curConv());
    if (!document.hidden) markRead(curConv());
    return;
  }
  const live = LIVE_ROUTES.includes(curRoute) || (curRoute === 'mesh' && S.ui.meshTab === 'live') || curRoute === 'chats';
  if (!live) return;
  if (typingInView() || modalOpen() || (curRoute === 'boards' && S.ui.boardTab === 'partition')) {
    pendingRender = true;
    return;
  }
  rerender();
}, 150);

function applyPrefs() {
  const h = document.documentElement;
  const s = S.settings;
  h.lang = lang;
  h.dir = lang === 'ur' ? 'rtl' : 'ltr';
  h.dataset.theme = s.theme;
  h.dataset.size = s.size;
  h.classList.toggle('calm', !!s.calm);
  $('#langBtn').textContent = lang === 'ur' ? 'English' : 'اردو';
  $('#langBtn').setAttribute('aria-label', t('switchLang'));
  $('#searchBtn').setAttribute('aria-label', t('searchAll'));
  $('#themeBtn').setAttribute('aria-label', t('switchTheme'));
  $('#themeBtn').innerHTML = ic(s.theme === 'sand' ? 'moon' : 'sun');
  $('#backBtn').setAttribute('aria-label', t('back'));
  $('#skipLink').textContent = t('skipToContent');
  $('#brandLink').setAttribute('aria-label', `${t('appName')} — ${t('tagline')}`);
  $('#rail').setAttribute('aria-label', t('ch_railAria'));
  $('#meshPanel').setAttribute('aria-label', t('mesh_panel'));
  $('meta[name="theme-color"]').content = s.theme === 'sand' ? '#e9dfc8' : '#16181a';
  $$('.sos-hold').forEach(b => {
    b.setAttribute('aria-label', t('sos_holdAria'));
    b.title = t('sos_holdAria');
    $('.face small', b).textContent = t('sos_hold');
  });
}

function setLang(l) {
  lang = l;
  store.set('lang', l);
  applyPrefs();
  rerender();
  if (tourStep >= 0) showTourStep();
}

function toggleTheme() {
  S.settings.theme = S.settings.theme === 'sand' ? 'field' : 'sand';
  persist('settings');
  applyPrefs();
  rerender();
}

function bindShell() {
  $('#searchBtn').onclick = openPalette;
  $('#bellBtn').onclick = () => go('inbox');
  $('#langBtn').onclick = () => setLang(lang === 'ur' ? 'en' : 'ur');
  $('#themeBtn').onclick = toggleTheme;
  $('#backBtn').onclick = () => go('chats');
  $('#scrim').onclick = () => {
    closePalette();
    closeModal();
  };
  $('#modal').addEventListener('click', e => e.target === $('#modal') && closeModal());
  document.addEventListener('keydown', onKey);
  document.addEventListener('focusout', () => setTimeout(() => {
    if (!pendingRender || typingInView() || modalOpen()) return;
    pendingRender = false;
    rerender();
  }, 60));
  window.addEventListener('hashchange', route);
  window.addEventListener('resize', debounce(() => curRoute === 'chats' && rerender(), 200));
  window.addEventListener('pagehide', () => TABNET.on && tabsStop());
}

// TODO(student): register a service worker that caches this file so Rabta opens with no network as an
// installable PWA (service workers need https:// or localhost, not file://); add a web app manifest.
function registerOfflineShell() {
  return false;
}

function bootError(k) {
  $('#view').innerHTML = `<div class="card empty">${ic('alert')}<p>${t(k)}</p></div>`;
}

async function boot() {
  lang = store.get('lang', 'en') === 'ur' ? 'ur' : 'en';
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ur' ? 'rtl' : 'ltr';
  $('#view').innerHTML = `<div class="card"><p class="small muted">${t('loading')}</p><div class="skeleton" style="height:120px"></div></div>`;
  if (!HAS_CRYPTO) return bootError('err_crypto');
  let fresh = false;
  try {
    fresh = sessionStorage.getItem('rabta.fresh') === '1';
    sessionStorage.removeItem('rabta.fresh');
  } catch {
    /* blocked */
  }
  S = loadState();
  if (S) {
    await buildMe();
    await loadVillage();
  } else if (fresh || SLOT !== 'A') {
    await emptyApp(SLOT !== 'A' ? t('defaultName') + ' ' + SLOT : '');
  } else {
    await seedApp();
  }
  applyPrefs();
  mountSosButtons();
  bindShell();
  if (S.settings.tabs) tabsStart();
  if (VILLAGE.nodes.length) villageStart();
  registerOfflineShell();
  route();
  booted = true;
  updateLinkStat();
  decryptPending();
  setInterval(() => storePurge(ME.core, now()), 10 * MIN);
  if (!location.hash && !S.settings.tourDone) setTimeout(startTour, 900);
}

boot();
</script>
