// ---------- input distributions ----------
const DISTS = {
  random: 'Random', nearly: 'Nearly sorted', reversed: 'Reversed', few: 'Few unique', sorted: 'Already sorted',
  organ: 'Organ pipe', sawtooth: 'Sawtooth', single: 'One swap away', custom: 'Custom list'
};

function ramp(size, up = true) {
  const last = Math.max(1, size - 1);
  return Array.from({ length: size }, (_, i) => {
    const t = i / last;
    return Math.round(2 + (up ? t : 1 - t) * 98);
  });
}

function parseCustom(text) {
  const values = text.split(/[,\s]+/)
    .map(Number)
    .filter(v => Number.isFinite(v) && v > 0)
    .map(v => Math.round(v))
    .slice(0, 200);
  return values.length >= 2 ? values : [5, 3, 8, 1];
}

const makeInput = () => inputFor(S.sort);

function inputFor({ size, dist, seed, custom }) {
  const r = rng(seed);
  switch (dist) {
    case 'custom': return parseCustom(custom);
    case 'sorted': return ramp(size, true);
    case 'reversed': return ramp(size, false);
    case 'few': {
      const values = [15, 35, 55, 75, 95];
      return Array.from({ length: size }, () => values[Math.floor(r() * 5)]);
    }
    case 'nearly': {
      const a = ramp(size, true);
      for (let k = 0; k < Math.max(1, size / 8); k++) {
        const i = Math.floor(r() * size);
        const j = Math.min(size - 1, i + 1 + Math.floor(r() * 3));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    case 'organ': {
      const half = Math.ceil(size / 2);
      const up = ramp(half, true);
      const down = ramp(size - half, false);
      return up.concat(down);
    }
    case 'sawtooth': {
      const teeth = Math.max(2, Math.round(size / 10));
      return Array.from({ length: size }, (_, i) => 2 + Math.round((i % teeth) / Math.max(1, teeth - 1) * 98));
    }
    case 'single': {
      const a = ramp(size, true);
      const i = Math.floor(r() * (size - 1));
      const j = Math.min(size - 1, i + 1 + Math.floor(r() * Math.max(1, size / 3)));
      [a[i], a[j]] = [a[j], a[i]];
      return a;
    }
    default:
      return Array.from({ length: size }, () => 2 + Math.floor(r() * 99));
  }
}

// ---------- model: the array the renderer draws, plus counters and marks ----------
function sortModel(input) {
  return { arr: input.slice(), disp: input.slice(), sorted: new Set(), pivot: -1, range: null, cmp: 0, swp: 0, wr: 0 };
}

function sortApply(m, s) {
  switch (s.type) {
    case 'compare':
      m.cmp++;
      break;
    case 'swap':
      [m.arr[s.i], m.arr[s.j]] = [m.arr[s.j], m.arr[s.i]];
      m.swp++;
      break;
    case 'set':
      s.prev = m.arr[s.i];
      m.arr[s.i] = s.v;
      m.wr++;
      break;
    case 'pivot':
      s.prev = m.pivot;
      m.pivot = s.i;
      break;
    case 'range':
      s.prev = m.range;
      m.range = [s.lo, s.hi];
      break;
    case 'sorted': {
      s.added = [];
      const lo = s.lo ?? s.i;
      const hi = s.hi ?? s.i;
      for (let k = lo; k <= hi; k++) {
        if (m.sorted.has(k)) continue;
        m.sorted.add(k);
        s.added.push(k);
      }
      s.prevPivot = m.pivot;
      m.pivot = -1;
      break;
    }
  }
}

function sortUndo(m, s) {
  switch (s.type) {
    case 'compare':
      m.cmp--;
      break;
    case 'swap':
      [m.arr[s.i], m.arr[s.j]] = [m.arr[s.j], m.arr[s.i]];
      m.swp--;
      break;
    case 'set':
      m.arr[s.i] = s.prev;
      m.wr--;
      break;
    case 'pivot':
      m.pivot = s.prev;
      break;
    case 'range':
      m.range = s.prev;
      break;
    case 'sorted':
      s.added.forEach(k => m.sorted.delete(k));
      m.pivot = s.prevPivot;
      break;
  }
}

// ---------- bar renderer ----------
let barAnim = 0;

function barColor(m, i, cur) {
  let color = COL.bar;
  let glow = null;
  if (m.sorted.has(i)) color = COL.srt;
  if (i === m.pivot) color = COL.piv;
  if (!cur) return { color, glow };
  const touchesI = cur.i === i || cur.j === i;
  if ((cur.type === 'compare' || cur.type === 'visit') && touchesI) {
    color = COL.cmp;
    glow = COL.cmp;
  }
  if ((cur.type === 'swap' && touchesI) || (cur.type === 'set' && cur.i === i)) {
    color = COL.swp;
    glow = COL.swp;
  }
  return { color, glow };
}

function tweenHeights(m, fast) {
  let moving = false;
  for (let i = 0; i < m.arr.length; i++) {
    const delta = m.arr[i] - m.disp[i];
    if (fast || Math.abs(delta) < .4) {
      m.disp[i] = m.arr[i];
    } else {
      m.disp[i] += delta * .38;
      moving = true;
    }
  }
  return moving;
}

function showLabels(n) {
  if (S.prefs.labels === 'always') return n <= 60;
  if (S.prefs.labels === 'never') return false;
  return n <= 32;
}

function drawBars(track) {
  const canvas = track.canvas;
  if (!canvas || !canvas.isConnected) return;
  const { ctx, W, H } = fitCanvas(canvas);
  const m = track.model;
  const n = m.arr.length;
  const cur = P.cur(track);
  const fast = sps() > 60 || n > 120;
  const moving = tweenHeights(m, fast);

  ctx.clearRect(0, 0, W, H);
  const max = Math.max(...m.arr, 1);
  const pad = 14;
  const labels = showLabels(n);
  const top = labels ? 34 : 18;
  const bw = (W - pad * 2) / n;
  const gap = n <= 40 ? Math.min(6, bw * .25) : n <= 100 ? 1.5 : .6;

  if (m.range) {
    ctx.fillStyle = 'rgba(196,167,231,.07)';
    ctx.fillRect(pad + m.range[0] * bw, 6, (m.range[1] - m.range[0] + 1) * bw, H - 28);
  }
  ctx.font = `600 ${n <= 16 ? 12 : 10}px "Fira Code", monospace`;
  ctx.textAlign = 'center';

  for (let i = 0; i < n; i++) {
    const { color, glow } = barColor(m, i, cur);
    const h = Math.max(2, (H - top - 26) * m.disp[i] / max);
    const x = pad + i * bw + gap / 2;
    const y = H - 26 - h;
    const w = Math.max(1, bw - gap);
    ctx.shadowBlur = glow ? 18 : 0;
    ctx.shadowColor = glow || 'transparent';
    ctx.fillStyle = color;
    if (w > 3 && ctx.roundRect) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, Math.min(4, w / 2));
      ctx.fill();
    } else {
      ctx.fillRect(x, y, w, h);
    }
    ctx.shadowBlur = 0;
    if (labels) {
      ctx.fillStyle = glow ? color : COL.muted;
      ctx.fillText(m.arr[i], x + w / 2, y - 8);
    }
  }

  if (moving) {
    cancelAnimationFrame(barAnim);
    barAnim = requestAnimationFrame(() => P.tracks.forEach(drawBars));
  }
}

// ---------- sorting view ----------
function sortTrack(algoKey, input, canvasId) {
  const algo = SORTS[algoKey];
  const steps = record(algo.run(input.slice()));
  return { key: algoKey, algo, canvasId, steps, model: sortModel(input), apply: sortApply, undo: sortUndo };
}

function algoOptions(selected) {
  return Object.entries(SORTS)
    .map(([key, algo]) => `<option value="${key}" ${key === selected ? 'selected' : ''}>${esc(algo.name)}</option>`)
    .join('');
}

function sortingControlsHtml(n) {
  const distOptions = Object.entries(DISTS)
    .map(([key, label]) => `<option value="${key}" ${key === S.sort.dist ? 'selected' : ''}>${label}</option>`)
    .join('');
  const raceSelect = S.sort.race ? `<label>vs <select id="sAlgoB">${algoOptions(S.sort.algoB)}</select></label>` : '';
  const custom = S.sort.dist === 'custom'
    ? `<input type="text" id="sCustom" value="${esc(S.sort.custom)}" placeholder="e.g. 12, 5, 31, 8" style="min-width:220px" aria-label="Custom comma-separated values">
       <button class="btn sm" id="sCustomGo">${ic('check')} Use</button>`
    : '';
  return `
    <div class="ctrl">
      <label>Algorithm <select id="sAlgo">${algoOptions(S.sort.algo)}</select></label>
      ${raceSelect}
      <label>Input <select id="sDist">${distOptions}</select></label>
      ${custom}
      <span class="muted" style="font-size:.78rem">n = <b class="mono">${n}</b> · seed <span class="mono">${S.sort.seed}</span></span>
      <span class="spacer"></span>
      <div class="legend">
        <span><i style="background:${COL.cmp}"></i>compare</span>
        <span><i style="background:${COL.swp}"></i>swap / write</span>
        <span><i style="background:${COL.piv}"></i>pivot / key</span>
        <span><i style="background:${COL.srt}"></i>sorted</span>
      </div>
    </div>`;
}

function racerHtml(key, i) {
  const letter = i ? 'B' : 'A';
  return `
    <div class="racer">
      <div class="rh">
        <b>${letter} · ${esc(SORTS[key].name)}</b>
        <span class="c">cmp <span id="rc${i}">0</span></span>
        <span class="c">swaps <span id="rs${i}">0</span></span>
        <span class="c">writes <span id="rw${i}">0</span></span>
        <span class="c">steps <span id="rt${i}">0</span></span>
        <button class="btn sm ghost" data-focus="${i}" aria-pressed="${S.sort.focus === i}">${ic('code')} code</button>
      </div>
      <div class="cv"><canvas id="cv${i}" aria-label="${esc(SORTS[key].name)} bars"></canvas><div id="banner${i}"></div></div>
    </div>`;
}

function sortingStageHtml() {
  if (S.sort.race) {
    return `<div class="race" id="raceWrap">${racerHtml(S.sort.algo, 0)}${racerHtml(S.sort.algoB, 1)}</div>`;
  }
  return `
    <div class="cv">
      <canvas id="cv0" aria-label="Bar chart of the array"></canvas>
      <div id="banner0"></div>
      <div class="hint">Drag the scrubber in the transport bar to rewind any step</div>
    </div>
    <div class="tiles" id="sTiles"></div>`;
}

function bindSortingControls() {
  $('#sAlgo').onchange = e => {
    S.sort.algo = e.target.value;
    saveS();
    renderSorting();
  };
  const algoB = $('#sAlgoB');
  if (algoB) {
    algoB.onchange = e => {
      S.sort.algoB = e.target.value;
      saveS();
      renderSorting();
    };
  }
  $('#sDist').onchange = e => {
    S.sort.dist = e.target.value;
    saveS();
    renderSorting();
  };
  const customGo = $('#sCustomGo');
  if (customGo) {
    customGo.onclick = () => {
      S.sort.custom = $('#sCustom').value;
      saveS();
      renderSorting();
    };
    $('#sCustom').onkeydown = e => {
      if (e.key === 'Enter') customGo.click();
    };
  }
  $$('[data-focus]').forEach(btn => {
    btn.onclick = () => {
      S.sort.focus = +btn.dataset.focus;
      saveS();
      renderSorting();
    };
  });
}

function sortingPane(track, n) {
  const m = track.model;
  const cur = P.cur(track);
  const [best, avg, worst, space, stable] = track.algo.cx;
  showCode({
    title: track.algo.name,
    sub: S.sort.race ? `Racing on the same ${n} values` : `${DISTS[S.sort.dist]} input · ${n} values`,
    code: track.algo.code,
    line: cur ? cur.line : -1,
    note: cur ? cur.note : '',
    noteKind: cur ? kindOf(cur.type) : '',
    badges: [
      { k: 'best', v: 'O(' + best + ')' },
      { k: 'avg', v: 'O(' + avg + ')' },
      { k: 'worst', v: 'O(' + worst + ')' },
      { k: 'space', v: 'O(' + space + ')' },
      { v: stable ? 'stable' : 'not stable', cls: stable ? 'good' : 'bad' }
    ],
    stats: [
      { k: 'comparisons', v: nf(m.cmp), cls: 'cmp' },
      { k: 'swaps', v: nf(m.swp), cls: 'swp' },
      { k: 'array writes', v: nf(m.wr), cls: 'swp' },
      { k: 'steps', v: `${nf(track.pos)} / ${nf(track.steps.length)}`, cls: 'piv' }
    ]
  });
}

function updateRaceHud(tracks) {
  tracks.forEach((track, i) => {
    $('#rc' + i).textContent = nf(track.model.cmp);
    $('#rs' + i).textContent = nf(track.model.swp);
    $('#rw' + i).textContent = nf(track.model.wr);
    $('#rt' + i).textContent = `${nf(track.pos)}/${nf(track.steps.length)}`;
  });
  const winner = tracks[0].steps.length <= tracks[1].steps.length ? 0 : 1;
  const loser = 1 - winner;
  const finished = P.idx >= tracks[winner].steps.length;
  const text = `${esc(tracks[winner].algo.name)} finishes first — ${nf(tracks[winner].steps.length)} steps vs ${nf(tracks[loser].steps.length)}`;
  $('#banner' + winner).innerHTML = finished ? `<div class="banner win">${ic('trophy')} ${text}</div>` : '';
  $('#banner' + loser).innerHTML = '';
}

function updateSingleHud(track) {
  const m = track.model;
  const tiles = [
    ['comparisons', m.cmp, 'cmp'], ['swaps', m.swp, 'swp'], ['array writes', m.wr, 'swp'],
    ['elapsed steps', track.pos, 'piv'], ['total steps', track.steps.length, '']
  ];
  $('#sTiles').innerHTML = tiles
    .map(([k, v, cls]) => `<div class="tile ${cls}"><div class="k">${k}</div><div class="v">${nf(v)}</div></div>`)
    .join('');
  const done = track.steps.length && P.idx >= track.steps.length;
  $('#banner0').innerHTML = done
    ? `<div class="banner">${ic('check-circle')} Sorted in ${nf(track.steps.length)} steps · ${nf(m.cmp)} comparisons</div>`
    : '';
}

function onSortingDone(tracks) {
  if (S.sort.race) {
    const [a, b] = tracks;
    const winner = a.steps.length <= b.steps.length ? a : b;
    const loser = winner === a ? b : a;
    notify('win', `${winner.algo.name} won the race`, `${nf(winner.steps.length)} steps against ${nf(loser.steps.length)} for ${loser.algo.name} on ${a.model.arr.length} ${DISTS[S.sort.dist].toLowerCase()} values.`, location.hash);
    return;
  }
  const track = tracks[0];
  if (S.prefs.runToasts) toast('Sorted!', 'ok');
  notify('ok', `${track.algo.name} finished`, `${nf(track.steps.length)} steps, ${nf(track.model.cmp)} comparisons, ${nf(track.model.swp)} swaps on ${track.model.arr.length} ${DISTS[S.sort.dist].toLowerCase()} values.`, location.hash);
}

function renderSorting() {
  P.pause();
  const stage = $('#stage');
  const input = makeInput();
  const n = input.length;
  stage.innerHTML = sortingControlsHtml(n) + sortingStageHtml();
  animateIn(stage);
  bindSortingControls();

  const keys = S.sort.race ? [S.sort.algo, S.sort.algoB] : [S.sort.algo];
  const tracks = keys.map((key, i) => {
    const track = sortTrack(key, input, 'cv' + i);
    track.canvas = $('#cv' + i);
    return track;
  });

  P.load(tracks, () => {
    tracks.forEach(drawBars);
    const focus = tracks[Math.min(S.sort.focus, tracks.length - 1)];
    sortingPane(focus, n);
    if (S.sort.race) updateRaceHud(tracks);
    else updateSingleHud(focus);
  }, () => onSortingDone(tracks));

  syncHash();
  addHistory(runLabel(), location.hash);
  if (S.prefs.autoplay) P.play();
}

/* =====================================================================
   PATHFINDING — grid model G, generators yield frontier / visit / path cells
   ===================================================================== */
const GRID_SIZES = [[15, 25], [20, 34], [25, 42], [30, 50]];
const gridDims = i => ({ rows: GRID_SIZES[clamp(i, 0, 3)][0], cols: GRID_SIZES[clamp(i, 0, 3)][1] });
const MAZES = {
  division: 'Recursive division', random: 'Random scatter', rooms: 'Two rooms', spiral: 'Spiral',
  bars: 'Vertical bars', diagonal: 'Diagonal wall', cross: 'Crossroads', none: 'Empty grid'
};
const WALL = 1;
const MUD = 2;
const MUD_COST = 5;

let G = null;
const gkey = p => p.r * G.cols + p.c;
const rc = k => `${(k / G.cols) | 0},${k % G.cols}`;

function buildGrid(regen) {
  const { rows, cols } = gridDims(S.pf.size);
  if (G && !regen && G.rows === rows && G.cols === cols) return;
  G = {
    rows, cols,
    cells: new Uint8Array(rows * cols),
    start: { r: rows >> 1, c: 2 },
    end: { r: rows >> 1, c: cols - 3 }
  };
  applyMaze(S.pf.maze);
}

// ---------- map library ----------
function setWall(r, c, value = WALL) {
  if (r < 0 || c < 0 || r >= G.rows || c >= G.cols) return;
  G.cells[r * G.cols + c] = value;
}

function mazeDivision(r) {
  const divide = (r0, c0, r1, c1) => {
    const h = r1 - r0 + 1;
    const w = c1 - c0 + 1;
    if (h < 3 || w < 3) return;
    const horizontal = h > w ? true : w > h ? false : r() < .5;
    if (horizontal) {
      const walls = [];
      for (let rr = r0 + 1; rr < r1; rr++) if (rr % 2 === 1) walls.push(rr);
      if (!walls.length) return;
      const wr = walls[Math.floor(r() * walls.length)];
      const gaps = [];
      for (let cc = c0; cc <= c1; cc++) if (cc % 2 === 0) gaps.push(cc);
      const gc = gaps[Math.floor(r() * gaps.length)];
      for (let cc = c0; cc <= c1; cc++) if (cc !== gc) setWall(wr, cc);
      divide(r0, c0, wr - 1, c1);
      divide(wr + 1, c0, r1, c1);
    } else {
      const walls = [];
      for (let cc = c0 + 1; cc < c1; cc++) if (cc % 2 === 1) walls.push(cc);
      if (!walls.length) return;
      const wc = walls[Math.floor(r() * walls.length)];
      const gaps = [];
      for (let rr = r0; rr <= r1; rr++) if (rr % 2 === 0) gaps.push(rr);
      const gr = gaps[Math.floor(r() * gaps.length)];
      for (let rr = r0; rr <= r1; rr++) if (rr !== gr) setWall(rr, wc);
      divide(r0, c0, r1, wc - 1);
      divide(r0, wc + 1, r1, c1);
    }
  };
  divide(0, 0, G.rows - 1, G.cols - 1);
  sprinkleMud(r, .05);
}

function sprinkleMud(r, ratio) {
  const total = G.rows * G.cols * ratio;
  for (let k = 0; k < total; k++) {
    const i = Math.floor(r() * G.cells.length);
    if (G.cells[i] === 0) G.cells[i] = MUD;
  }
}

function mazeRandom(r) {
  for (let i = 0; i < G.cells.length; i++) {
    const x = r();
    G.cells[i] = x < .27 ? WALL : x < .36 ? MUD : 0;
  }
}

function mazeRooms(r) {
  const mid = G.cols >> 1;
  const door = 2 + Math.floor(r() * (G.rows - 4));
  for (let rr = 0; rr < G.rows; rr++) if (Math.abs(rr - door) > 1) setWall(rr, mid);
  // a mud patch in front of the door so Dijkstra and BFS disagree
  for (let rr = door - 3; rr <= door + 3; rr++) {
    for (let cc = mid + 2; cc < mid + 6; cc++) setWall(rr, cc, MUD);
  }
  const shelf = Math.floor(G.rows / 3);
  for (let cc = 3; cc < mid - 3; cc++) setWall(shelf, cc);
  for (let cc = 3; cc < mid - 3; cc++) setWall(G.rows - 1 - shelf, cc);
}

function mazeSpiral() {
  let top = 1;
  let left = 1;
  let bottom = G.rows - 2;
  let right = G.cols - 2;
  let turn = 0;
  while (top < bottom && left < right) {
    for (let cc = left; cc <= right - 2; cc++) setWall(top, cc);
    for (let rr = top; rr <= bottom - 2; rr++) setWall(rr, right);
    for (let cc = right; cc >= left + 2; cc--) setWall(bottom, cc);
    for (let rr = bottom; rr >= top + 4; rr--) setWall(rr, left);
    top += 2;
    left += 2;
    bottom -= 2;
    right -= 2;
    if (++turn > 6) break;
  }
}

function mazeBars(r) {
  for (let cc = 4; cc < G.cols - 4; cc += 4) {
    const gap = 1 + Math.floor(r() * (G.rows - 2));
    for (let rr = 0; rr < G.rows; rr++) if (rr !== gap && rr !== gap + 1) setWall(rr, cc);
  }
}

function mazeDiagonal(r) {
  const gapAt = 3 + Math.floor(r() * (G.rows - 6));
  for (let rr = 0; rr < G.rows; rr++) {
    const cc = Math.round(rr * (G.cols - 1) / Math.max(1, G.rows - 1));
    if (Math.abs(rr - gapAt) > 0) {
      setWall(rr, cc);
      setWall(rr, cc + 1);
    }
  }
  sprinkleMud(r, .04);
}

function mazeCross(r) {
  const mr = G.rows >> 1;
  const mc = G.cols >> 1;
  const gapR = 1 + Math.floor(r() * (G.rows - 2));
  const gapC = 1 + Math.floor(r() * (G.cols - 2));
  for (let cc = 0; cc < G.cols; cc++) if (Math.abs(cc - gapC) > 1 && Math.abs(cc - 2) > 1 && Math.abs(cc - (G.cols - 3)) > 1) setWall(mr, cc);
  for (let rr = 0; rr < G.rows; rr++) if (Math.abs(rr - gapR) > 1) setWall(rr, mc);
  sprinkleMud(r, .06);
}

function applyMaze(kind) {
  const r = rng(S.pf.seed);
  G.cells.fill(0);
  const builders = { division: mazeDivision, random: mazeRandom, rooms: mazeRooms, spiral: mazeSpiral, bars: mazeBars, diagonal: mazeDiagonal, cross: mazeCross };
  // TODO(student): add more maze generators (recursive backtracker, Prim's maze, cellular automata caves) to `builders`.
  if (builders[kind]) builders[kind](r);
  clearAround(G.start);
  clearAround(G.end);
}

function clearAround(p) {
  const offsets = [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]];
  for (const [dr, dc] of offsets) setWall(p.r + dr, p.c + dc, 0);
}

// ---------- neighbours, heuristics, path emission ----------
const DIRS4 = [[-1, 0], [1, 0], [0, -1], [0, 1]];
const DIRS8 = DIRS4.concat([[-1, -1], [-1, 1], [1, -1], [1, 1]]);

function nbrs(k) {
  const r = (k / G.cols) | 0;
  const c = k % G.cols;
  const out = [];
  const dirs = S.pf.diag ? DIRS8 : DIRS4;
  for (const [dr, dc] of dirs) {
    const nr = r + dr;
    const nc = c + dc;
    if (nr < 0 || nc < 0 || nr >= G.rows || nc >= G.cols) continue;
    const nk = nr * G.cols + nc;
    if (G.cells[nk] === WALL) continue;
    const diagonal = dr !== 0 && dc !== 0;
    // no corner cutting through walls
    if (diagonal && (G.cells[r * G.cols + nc] === WALL || G.cells[nr * G.cols + c] === WALL)) continue;
    const weight = (G.cells[nk] === MUD ? MUD_COST : 1) * (diagonal ? Math.SQRT2 : 1);
    out.push({ k: nk, w: weight });
  }
  return out;
}

function heur(k, t) {
  const dr = Math.abs(((k / G.cols) | 0) - ((t / G.cols) | 0));
  const dc = Math.abs(k % G.cols - t % G.cols);
  return S.pf.h === 'euclid' ? Math.hypot(dr, dc) : dr + dc;
}

const cell = (type, k, line, note) => ({ type, r: (k / G.cols) | 0, c: k % G.cols, k, line, note });
const round1 = v => +v.toFixed(1);

function chainOf(parent, t) {
  const chain = [];
  for (let k = t; k != null && k !== -1; k = parent.get(k)) chain.push(k);
  return chain.reverse();
}

function stepCost(a, b) {
  const diagonal = ((a / G.cols) | 0) !== ((b / G.cols) | 0) && a % G.cols !== b % G.cols;
  return (G.cells[b] === MUD ? MUD_COST : 1) * (diagonal ? Math.SQRT2 : 1);
}

function* emitPath(chain, line) {
  let cost = 0;
  for (let i = 0; i < chain.length; i++) {
    if (i) cost += stepCost(chain[i - 1], chain[i]);
    yield cell('path', chain[i], line, `Path cell ${i + 1} of ${chain.length}`);
  }
  const moves = chain.length - 1;
  yield { type: 'done', found: true, len: moves, cost: round1(cost), line, note: `Path found: ${moves} moves, cost ${fmt1(round1(cost))}` };
}

// ---------- algorithms ----------
function* pfBfs(s, t) {
  const parent = new Map([[s, -1]]);
  const queue = [s];
  yield cell('frontier', s, 0, 'Start goes into the queue');
  while (queue.length) {
    const u = queue.shift();
    yield cell('visit', u, 2, `Dequeue (${rc(u)})`);
    if (u === t) {
      yield* emitPath(chainOf(parent, t), 3);
      return;
    }
    for (const { k } of nbrs(u)) {
      if (parent.has(k)) continue;
      parent.set(k, u);
      queue.push(k);
      yield cell('frontier', k, 6, `Discover (${rc(k)})`);
    }
  }
  yield { type: 'done', found: false, line: 7, note: 'Queue empty — no path exists' };
}

function* pfDfs(s, t) {
  const parent = new Map([[s, -1]]);
  const seen = new Set();
  const stack = [s];
  yield cell('frontier', s, 0, 'Start on the stack');
  while (stack.length) {
    const u = stack.pop();
    if (seen.has(u)) continue;
    seen.add(u);
    yield cell('visit', u, 3, `Pop (${rc(u)})`);
    if (u === t) {
      yield* emitPath(chainOf(parent, t), 4);
      return;
    }
    for (const { k } of nbrs(u)) {
      if (seen.has(k)) continue;
      parent.set(k, u);
      stack.push(k);
      yield cell('frontier', k, 6, `Push (${rc(k)})`);
    }
  }
  yield { type: 'done', found: false, line: 7, note: 'Stack empty — no path' };
}

function* pfDijkstra(s, t) {
  const dist = new Map([[s, 0]]);
  const parent = new Map([[s, -1]]);
  const settled = new Set();
  const pq = new PQ();
  pq.push(0, s);
  yield cell('frontier', s, 0, 'dist[start] = 0');
  while (pq.size) {
    const [d, u] = pq.pop();
    if (settled.has(u)) continue;
    settled.add(u);
    yield cell('visit', u, 2, `Settle (${rc(u)}) at distance ${fmt1(round1(d))}`);
    if (u === t) {
      yield* emitPath(chainOf(parent, t), 3);
      return;
    }
    for (const { k, w } of nbrs(u)) {
      const nd = d + w;
      if (nd >= (dist.get(k) ?? Infinity)) continue;
      dist.set(k, nd);
      parent.set(k, u);
      pq.push(nd, k);
      yield cell('frontier', k, 6, `Relax (${rc(k)}) → ${fmt1(round1(nd))}`);
    }
  }
  yield { type: 'done', found: false, line: 7, note: 'No path' };
}

function* pfAstar(s, t) {
  const g = new Map([[s, 0]]);
  const parent = new Map([[s, -1]]);
  const closed = new Set();
  const open = new PQ();
  open.push(heur(s, t), s);
  yield cell('frontier', s, 0, `g = 0, h = ${fmt1(round1(heur(s, t)))}`);
  while (open.size) {
    const [f, u] = open.pop();
    if (closed.has(u)) continue;
    closed.add(u);
    yield cell('visit', u, 2, `Expand (${rc(u)}) with f = ${fmt1(round1(f))}`);
    if (u === t) {
      yield* emitPath(chainOf(parent, t), 3);
      return;
    }
    for (const { k, w } of nbrs(u)) {
      const ng = g.get(u) + w;
      if (ng >= (g.get(k) ?? Infinity)) continue;
      g.set(k, ng);
      parent.set(k, u);
      const h = heur(k, t);
      open.push(ng + h, k);
      yield cell('frontier', k, 7, `(${rc(k)}): g ${fmt1(round1(ng))} + h ${fmt1(round1(h))}`);
    }
  }
  yield { type: 'done', found: false, line: 8, note: 'Open set empty — no path' };
}

function* pfGreedy(s, t) {
  const parent = new Map([[s, -1]]);
  const seen = new Set([s]);
  const open = new PQ();
  open.push(heur(s, t), s);
  yield cell('frontier', s, 0, 'Start in the open set');
  while (open.size) {
    const [h, u] = open.pop();
    yield cell('visit', u, 2, `Expand (${rc(u)}) h = ${fmt1(round1(h))}`);
    if (u === t) {
      yield* emitPath(chainOf(parent, t), 3);
      return;
    }
    for (const { k } of nbrs(u)) {
      if (seen.has(k)) continue;
      seen.add(k);
      parent.set(k, u);
      open.push(heur(k, t), k);
      yield cell('frontier', k, 5, `(${rc(k)}) h = ${fmt1(round1(heur(k, t)))}`);
    }
  }
  yield { type: 'done', found: false, line: 6, note: 'No path' };
}

function* pfBidirectional(s, t) {
  const parentA = new Map([[s, -1]]);
  const parentB = new Map([[t, -1]]);
  let queueA = [s];
  let queueB = [t];
  yield cell('frontier', s, 0, 'Both ends start a BFS');
  yield cell('frontier', t, 0, 'Both ends start a BFS');
  while (queueA.length && queueB.length) {
    const fromA = queueA.length <= queueB.length;
    const queue = fromA ? queueA : queueB;
    const mine = fromA ? parentA : parentB;
    const other = fromA ? parentB : parentA;
    const next = [];
    for (const u of queue) {
      yield cell('visit', u, 2, `Expand (${rc(u)}) from the ${fromA ? 'start' : 'end'} side`);
      for (const { k } of nbrs(u)) {
        if (other.has(k)) {
          if (!mine.has(k)) mine.set(k, u);
          const half = chainOf(parentA, k);
          const rest = chainOf(parentB, k).reverse().slice(1);
          yield* emitPath(half.concat(rest), 4);
          return;
        }
        if (mine.has(k)) continue;
        mine.set(k, u);
        next.push(k);
        yield cell('frontier', k, 5, `Discover (${rc(k)})`);
      }
    }
    if (fromA) queueA = next;
    else queueB = next;
  }
  yield { type: 'done', found: false, line: 6, note: 'One side ran out — no path' };
}

const PF_ALGOS = {
  bfs: {
    name: 'Breadth-first search', run: pfBfs, tags: [['unweighted', 'good'], ['shortest in moves', 'good'], ['complete', '']],
    code: ['queue = [start]; parent[start] = none', 'while queue not empty:', '  cur = queue.shift()', '  if cur == end: reconstruct path', '  for each neighbour nb of cur:', '    if nb not seen and not a wall:', '      parent[nb] = cur; queue.push(nb)', 'no path']
  },
  dfs: {
    name: 'Depth-first search', run: pfDfs, tags: [['not optimal', 'bad'], ['complete on grids', '']],
    code: ['stack = [start]', 'while stack not empty:', '  cur = stack.pop()', '  if cur visited: continue; mark visited', '  if cur == end: reconstruct path', '  for each neighbour nb not visited:', '    parent[nb] = cur; stack.push(nb)', 'no path']
  },
  dijkstra: {
    name: 'Dijkstra', run: pfDijkstra, tags: [['weighted', 'good'], ['optimal', 'good']],
    code: ['dist[start] = 0; pq = {(0, start)}', 'while pq not empty:', '  (d, cur) = pq.popMin(); skip if already settled', '  if cur == end: reconstruct path', '  for each neighbour nb with weight w:', '    if d + w < dist[nb]:', '      dist[nb] = d + w; parent[nb] = cur; pq.push(nb)', 'no path']
  },
  astar: {
    name: 'A* search', run: pfAstar, tags: [['weighted', 'good'], ['optimal with admissible h', 'good'], ['f = g + h', '']],
    code: ['g[start] = 0; open = {(h(start), start)}', 'while open not empty:', '  cur = open.popMin by f = g + h', '  if cur == end: reconstruct path', '  for each neighbour nb with weight w:', '    if g[cur] + w < g[nb]:', '      g[nb] = g[cur] + w; parent[nb] = cur', '      open.push(nb, f = g[nb] + h(nb))', 'no path']
  },
  greedy: {
    name: 'Greedy best-first', run: pfGreedy, tags: [['very fast', 'good'], ['not optimal', 'bad'], ['f = h only', '']],
    code: ['open = {(h(start), start)}; seen = {start}', 'while open not empty:', '  cur = open.popMin by h only', '  if cur == end: reconstruct path', '  for each unseen neighbour nb:', '    parent[nb] = cur; seen.add(nb); open.push(nb, h(nb))', 'no path']
  },
  bibfs: {
    name: 'Bidirectional BFS', run: pfBidirectional, tags: [['unweighted', 'good'], ['shortest in moves', 'good'], ['two frontiers', '']],
    code: ['qA = [start]; qB = [end]; a parent map per side', 'while both queues are non-empty:', '  expand the smaller frontier by one layer', '  for each neighbour nb of cur:', '    if the other side has seen nb: join the two paths', '    if nb unseen on this side: parent[nb] = cur; next.push(nb)', 'no path']
  }
};
// TODO(student): Jump Point Search, Theta* (any-angle) or D* Lite would slot in here as more generators.

// ---------- model ----------
const EMPTY = 0;
const FRONTIER = 1;
const VISITED = 2;
const PATH = 3;

function pfModel() {
  return { state: new Uint8Array(G.rows * G.cols), visited: 0, frontier: 0, path: [], done: null };
}

function pfApply(m, s) {
  switch (s.type) {
    case 'frontier':
      s.prev = m.state[s.k];
      if (s.prev === EMPTY) {
        m.state[s.k] = FRONTIER;
        m.frontier++;
      }
      break;
    case 'visit':
      s.prev = m.state[s.k];
      if (s.prev === FRONTIER) m.frontier--;
      m.state[s.k] = VISITED;
      m.visited++;
      break;
    case 'path':
      s.prev = m.state[s.k];
      m.state[s.k] = PATH;
      m.path.push(s.k);
      break;
    case 'done':
      s.prev = m.done;
      m.done = s;
      break;
  }
}

function pfUndo(m, s) {
  switch (s.type) {
    case 'frontier':
      if (s.prev === EMPTY) {
        m.state[s.k] = EMPTY;
        m.frontier--;
      }
      break;
    case 'visit':
      m.state[s.k] = s.prev;
      if (s.prev === FRONTIER) m.frontier++;
      m.visited--;
      break;
    case 'path':
      m.state[s.k] = s.prev;
      m.path.pop();
      break;
    case 'done':
      m.done = s.prev;
      break;
  }
}

// ---------- grid renderer ----------
let pfGeom = null;

function cellColor(v, st) {
  if (st === PATH) return COL.pth;
  if (st === VISITED) return v === MUD ? '#2d5a66' : COL.vis;
  if (st === FRONTIER) return 'rgba(156,207,216,.45)';
  if (v === WALL) return COL.wall;
  if (v === MUD) return COL.mud;
  return '#1f1b2d';
}

function drawGrid(track) {
  const canvas = track.canvas;
  if (!canvas || !canvas.isConnected) return;
  const { ctx, W, H } = fitCanvas(canvas);
  const m = track.model;
  const cur = P.cur(track);
  const cs = Math.min((W - 10) / G.cols, (H - 30) / G.rows);
  const ox = (W - cs * G.cols) / 2;
  const oy = 5 + (H - 30 - cs * G.rows) / 2;
  pfGeom = { cs, ox, oy };
  ctx.clearRect(0, 0, W, H);
  const gap = cs > 9 ? 1 : .5;

  for (let r = 0; r < G.rows; r++) {
    for (let c = 0; c < G.cols; c++) {
      const k = r * G.cols + c;
      const v = G.cells[k];
      const st = m.state[k];
      ctx.fillStyle = cellColor(v, st);
      ctx.fillRect(ox + c * cs + gap / 2, oy + r * cs + gap / 2, cs - gap, cs - gap);
      if (v === MUD && st !== PATH) {
        ctx.fillStyle = 'rgba(0,0,0,.25)';
        ctx.beginPath();
        ctx.arc(ox + c * cs + cs / 2, oy + r * cs + cs / 2, cs * .14, 0, 7);
        ctx.fill();
      }
    }
  }
  drawPathLine(ctx, m, cs, ox, oy);
  if (cur && cur.k != null && cur.type !== 'path') {
    ctx.strokeStyle = cur.type === 'visit' ? COL.cmp : COL.fro;
    ctx.lineWidth = 2;
    ctx.shadowColor = ctx.strokeStyle;
    ctx.shadowBlur = 12;
    ctx.strokeRect(ox + cur.c * cs + 1, oy + cur.r * cs + 1, cs - 2, cs - 2);
    ctx.shadowBlur = 0;
  }
  drawEndpoint(ctx, G.start, COL.srt, 'S', cs, ox, oy);
  drawEndpoint(ctx, G.end, COL.swp, 'E', cs, ox, oy);
}

function drawPathLine(ctx, m, cs, ox, oy) {
  if (m.path.length < 2) return;
  ctx.strokeStyle = COL.pth;
  ctx.lineWidth = Math.max(2, cs * .28);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.shadowColor = COL.pth;
  ctx.shadowBlur = 10;
  ctx.beginPath();
  m.path.forEach((k, i) => {
    const x = ox + (k % G.cols) * cs + cs / 2;
    const y = oy + ((k / G.cols) | 0) * cs + cs / 2;
    if (i) ctx.lineTo(x, y);
    else ctx.moveTo(x, y);
  });
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function drawEndpoint(ctx, p, color, letter, cs, ox, oy) {
  const x = ox + p.c * cs + cs / 2;
  const y = oy + p.r * cs + cs / 2;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, cs * .42, 0, 7);
  ctx.fill();
  ctx.fillStyle = '#13111c';
  ctx.font = `700 ${Math.max(8, cs * .55)}px Manrope, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(letter, x, y + 1);
}

function cellAt(e, canvas) {
  if (!pfGeom) return -1;
  const box = canvas.getBoundingClientRect();
  const c = Math.floor((e.clientX - box.left - pfGeom.ox) / pfGeom.cs);
  const r = Math.floor((e.clientY - box.top - pfGeom.oy) / pfGeom.cs);
  if (r < 0 || c < 0 || r >= G.rows || c >= G.cols) return -1;
  return r * G.cols + c;
}

// ---------- pathfinding view ----------
function pfPane(track) {
  const algo = track.algo;
  const m = track.model;
  const cur = P.cur(track);
  const d = m.done;
  const usesHeuristic = ['astar', 'greedy'].includes(S.pf.algo);
  const heuristicText = usesHeuristic ? ` · ${S.pf.h === 'euclid' ? 'Euclidean' : 'Manhattan'} heuristic` : '';
  showCode({
    title: algo.name,
    sub: `${G.rows}×${G.cols} grid · ${S.pf.diag ? '8' : '4'}-connected${heuristicText}`,
    code: algo.code,
    line: cur ? cur.line : -1,
    note: cur ? cur.note : '',
    noteKind: cur ? kindOf(cur.type) : '',
    badges: algo.tags.map(([v, cls]) => ({ v, cls })),
    stats: [
      { k: 'visited', v: nf(m.visited) },
      { k: 'frontier', v: nf(m.frontier), cls: 'srt' },
      { k: 'path length', v: d && d.found ? d.len : '—', cls: 'cmp' },
      { k: 'path cost', v: d && d.found ? fmt1(d.cost) : '—', cls: 'cmp' }
    ]
  });
}

function pfHud(track) {
  const m = track.model;
  const d = m.done;
  const tiles = [
    ['visited cells', nf(m.visited), 'vis'], ['frontier', nf(m.frontier), 'srt'],
    ['path length', d && d.found ? d.len : '—', 'cmp'], ['path cost', d && d.found ? fmt1(d.cost) : '—', 'cmp'],
    ['steps', `${nf(track.pos)} / ${nf(track.steps.length)}`, 'piv']
  ];
  $('#pfTiles').innerHTML = tiles
    .map(([k, v, cls]) => `<div class="tile ${cls}"><div class="k">${k}</div><div class="v">${v}</div></div>`)
    .join('');
  $('#pfBanner').innerHTML = d
    ? `<div class="banner ${d.found ? 'win' : ''}">${ic(d.found ? 'flag' : 'alert')} ${esc(d.note)} · ${nf(m.visited)} cells visited</div>`
    : '';
}

function onPathDone(track) {
  const d = track.model.done;
  if (!d) return;
  if (!d.found) {
    toast('No path between S and E', 'bad');
    notify('bad', `${track.algo.name}: no path`, `The grid blocks every route after ${nf(track.model.visited)} visited cells.`, location.hash);
    return;
  }
  notify('ok', `${track.algo.name} found a path`, `${d.len} moves, cost ${fmt1(d.cost)}, ${nf(track.model.visited)} cells visited on a ${G.rows}×${G.cols} grid.`, location.hash);
}

function pfRebuild(keepEnd) {
  const algo = PF_ALGOS[S.pf.algo];
  const s = gkey(G.start);
  const t = gkey(G.end);
  const track = { algo, canvas: $('#pfCv'), steps: record(algo.run(s, t)), model: pfModel(), apply: pfApply, undo: pfUndo };
  P.load([track], () => {
    drawGrid(track);
    pfPane(track);
    pfHud(track);
  }, () => onPathDone(track));
  if (keepEnd) P.seek(P.total());
}

function pathControlsHtml() {
  const algoOptions = Object.entries(PF_ALGOS)
    .map(([key, algo]) => `<option value="${key}" ${key === S.pf.algo ? 'selected' : ''}>${algo.name}</option>`)
    .join('');
  const mazeOptions = Object.entries(MAZES)
    .map(([key, label]) => `<option value="${key}" ${key === S.pf.maze ? 'selected' : ''}>${label}</option>`)
    .join('');
  const heuristicHidden = ['astar', 'greedy'].includes(S.pf.algo) ? '' : 'class="hidden"';

    .join('');
  return `

      <label ${heuristicHidden}>Heuristic <select id="pH"><option value="manhattan" ${S.pf.h === 'manhattan' ? 'selected' : ''}>Manhattan</option><option value="euclid" ${S.pf.h === 'euclid' ? 'selected' : ''}>Euclidean</option></select></label>
      <label class="sw"><input type="checkbox" id="pDiag" ${S.pf.diag ? 'checked' : ''}> Diagonals</label>

}

function bindPathControls() {

  $('#pH').onchange = e => {

function regenerateMaze(kind) {
  S.pf.maze = kind;
  S.pf.seed = newSeed();
  saveS();
  applyMaze(kind);
  pfRebuild();
  syncHash();
}

let wallsDrawn = 0;

function bindGridEditing(canvas) {
  let drag = null;
  let wasDone = false;
  const paint = k => {
    if (k === gkey(G.start) || k === gkey(G.end)) return;
    if (G.cells[k] !== drag.val) wallsDrawn++;
    G.cells[k] = drag.val;
  };
  canvas.onpointerdown = e => {
    const k = cellAt(e, canvas);
    if (k < 0) return;
    canvas.setPointerCapture(e.pointerId);
    wasDone = P.idx >= P.total() && P.total() > 0;
    P.pause();
    if (k === gkey(G.start)) {
      drag = { kind: 'start' };
    } else if (k === gkey(G.end)) {
      drag = { kind: 'end' };
    } else {
      const toolValue = S.pf.tool === 'wall' ? WALL : S.pf.tool === 'mud' ? MUD : 0;
      drag = { kind: 'paint', val: G.cells[k] === toolValue ? 0 : toolValue };
      paint(k);
      P.seek(0);
    }
  };
  canvas.onpointermove = e => {
    if (!drag) return;
    const k = cellAt(e, canvas);
    if (k < 0) return;
    if (drag.kind === 'paint') {
      paint(k);
      P.seek(0);
      return;
    }
    const p = { r: (k / G.cols) | 0, c: k % G.cols };
    const other = drag.kind === 'start' ? G.end : G.start;
    if (G.cells[k] === WALL || (p.r === other.r && p.c === other.c)) return;
    if (drag.kind === 'start') G.start = p;
    else G.end = p;
    pfRebuild(wasDone);
  };
  canvas.onpointerup = canvas.onpointercancel = () => {
    if (!drag) return;
    const keepEnd = wasDone && drag.kind !== 'paint';
    drag = null;
    pfRebuild(keepEnd);
    if (wallsDrawn >= 50) unlock('cartographer', 'Cartographer', 'You drew fifty cells by hand.');
  };
}

function renderPath() {
  P.pause();
  buildGrid(false);
  const stage = $('#stage');
  stage.innerHTML = pathControlsHtml() + `
    <div class="cv">
      <canvas id="pfCv" aria-label="Pathfinding grid — drag to draw walls, drag S and E to move them"></canvas>
      <div id="pfBanner"></div>
      <div class="hint">Drag on the grid to draw · drag S / E to move them</div>
    </div>
    <div class="tiles" id="pfTiles"></div>`;
  animateIn(stage);
  bindPathControls();
  bindGridEditing($('#pfCv'));
  pfRebuild();
  syncHash();
  addHistory(runLabel(), location.hash);
  if (S.prefs.autoplay) P.play();
}

/* =====================================================================
   GRAPHS — node-link editor + generators over an adjacency list
   ===================================================================== */
const L = i => String.fromCharCode(65 + (i % 26)) + (i >= 26 ? Math.floor(i / 26) : '');

function graphFrom(nodes, edges, directed = false) {
  return {
    directed,
    nodes: nodes.map(([x, y]) => ({ x, y })),
    edges: edges.map(([u, v, w]) => ({ u, v, w }))
  };
}

const GRAPH_PRESETS = {
  weighted: {
    name: 'Weighted graph', hint: 'Nine cities, fourteen roads — the classic MST / shortest-path example.',
    build: () => graphFrom(
      [[90, 120], [250, 60], [430, 60], [600, 130], [560, 300], [380, 340], [160, 320], [330, 190], [500, 200]],
      [[0, 1, 4], [0, 6, 8], [1, 2, 8], [1, 7, 11], [2, 3, 7], [2, 8, 2], [2, 5, 4], [3, 4, 9], [3, 5, 14], [4, 5, 10], [5, 6, 2], [6, 7, 1], [7, 8, 6], [8, 5, 7]])
  },
  dag: {
    name: 'DAG (courses)', hint: 'Directed acyclic graph of course prerequisites — try the topological sort.',
    build: () => graphFrom(
      [[90, 90], [90, 260], [270, 60], [270, 180], [270, 300], [450, 110], [450, 260], [630, 180]],
      [[0, 2, 3], [0, 3, 2], [1, 3, 4], [1, 4, 1], [2, 5, 6], [3, 5, 2], [3, 6, 5], [4, 6, 3], [5, 7, 4], [6, 7, 2]], true)
  },
  tree: {
    name: 'Tree', hint: 'A tree has exactly V − 1 edges, so every MST algorithm keeps all of them.',
    build: () => graphFrom(
      [[360, 50], [200, 150], [520, 150], [120, 260], [280, 260], [440, 260], [600, 260], [60, 360], [180, 360]],
      [[0, 1, 3], [0, 2, 5], [1, 3, 2], [1, 4, 7], [2, 5, 1], [2, 6, 4], [3, 7, 6], [3, 8, 2]])
  },
  mesh: {
    name: '3×3 mesh', hint: 'A lattice where many shortest paths tie — watch Dijkstra settle in waves.',
    build: () => {
      const nodes = [];
      const edges = [];
      for (let r = 0; r < 3; r++) {

          const i = r * 3 + c;

    build: () => {

      }

  },
  bipartite: {
