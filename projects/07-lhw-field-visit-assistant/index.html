<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LHW Field Visit Assistant</title>
<meta name="description" content="Offline-first visit planner for Pakistan's Lady Health Workers: ANC schedule with auto danger-sign flags, printable referral slips, postnatal checks, EPI immunization card, growth screening and a monthly report. Single-file FYP template.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens: field-app high contrast — orange, deep teal, cream ---------- */
:root{
  --bg:#fbf4ea; --surface:#ffffff; --surface-2:#f6ebdc; --ink:#1d1a16; --muted:#665c52; --line:#e6d8c4;
  --orange:#e8590c; --orange-deep:#b8430a; --orange-soft:#fde4d3; --teal:#0b525b; --teal-deep:#073a41; --teal-soft:#d9eef0;
  --red:#b42318; --red-soft:#fde3e0; --amber:#a35a00; --amber-soft:#fdebc8; --green:#1b7a3e; --green-soft:#dcf2e3;
  --radius:18px; --radius-sm:12px; --shadow:0 10px 26px -18px rgba(29,26,22,.45);
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif; --font-ur:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
h1,h2,h3,h4{margin:0;line-height:1.2}
.ur{font-family:var(--font-ur);direction:rtl;text-align:right;line-height:2;font-size:1.02rem}
html[lang=ur] .i18n{font-family:var(--font-ur);line-height:1.9}
html[lang=ur] .task .t span,html[lang=ur] .pitem .t span,html[lang=ur] .pagehead p{unicode-bidi:plaintext}
.muted{color:var(--muted)} .hidden{display:none!important} .small{font-size:.85rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.ic.lg{width:1.5em;height:1.5em} .ic.xl{width:2.2em;height:2.2em}

/* ---------- Motion kit (all under prefers-reduced-motion) ---------- */
:root{--ease:cubic-bezier(.2,.8,.2,1);--dur:.35s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.enter{animation:fadeUp var(--dur) var(--ease) both}
.stagger>*{animation:fadeUp .45s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.spin{animation:spin .9s linear infinite}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted)}

/* ---------- Shell: left rail (desktop) → bottom tabs (phone) ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{background:var(--teal-deep);color:#e8f4f5;padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px}
.brand .logo{width:44px;height:44px;border-radius:14px;background:var(--orange);display:grid;place-items:center;color:#fff;flex:none}
.brand h1{font-size:1.05rem;font-weight:700} .brand small{display:block;font-size:.72rem;opacity:.75}
.rail a.nav{display:flex;align-items:center;gap:12px;min-height:46px;padding:8px 12px;border-radius:12px;color:#cfe3e6;text-decoration:none;font-weight:700;font-size:.95rem}
.rail a.nav:hover{background:rgba(255,255,255,.08);color:#fff} .rail a.nav.on{background:var(--orange);color:#fff}
.rail a.nav .ic{width:24px;text-align:center;font-size:1.1rem} .rail a.nav .n{margin-left:auto;background:#fff;color:var(--orange-deep);border-radius:999px;font-size:.72rem;padding:1px 8px;font-weight:700}
.rail .foot{margin-top:auto;display:grid;gap:8px}
.profile{background:rgba(255,255,255,.08);border-radius:14px;padding:10px 12px;font-size:.82rem;line-height:1.35}
.profile b{display:block;font-size:.95rem}
.lang{border:0;background:#fff;color:var(--teal-deep);border-radius:12px;min-height:44px;padding:8px 12px;font-weight:700;cursor:pointer}
.content{min-width:0;display:flex;flex-direction:column}
.topbar{display:none;position:sticky;top:0;z-index:30;background:var(--teal-deep);color:#fff;align-items:center;gap:10px;padding:10px 14px}
.topbar .brand{padding:0;flex:1;min-width:0} .topbar .brand .logo{width:38px;height:38px} .topbar .brand h1{font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .lang{min-height:40px;padding:6px 10px}
.iconbtn{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:12px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;text-decoration:none;font-size:1.2rem;font-weight:700}
main{padding:24px 26px 100px;max-width:1180px;width:100%}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.pagehead h2{font-size:1.55rem;font-weight:700;letter-spacing:-.01em} .pagehead p{margin:4px 0 0;color:var(--muted)}
.backbtn{display:none;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:0;background:var(--surface-2);border-radius:12px;font-weight:700;cursor:pointer;margin-bottom:12px;text-decoration:none;color:var(--ink)}

/* ---------- Cards, buttons, chips ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.card,.kpi,.pitem,.task,.epi,.row,.todo{transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s,background .2s}
.card:hover,.kpi:hover{transform:translateY(-2px);box-shadow:0 14px 30px -18px rgba(29,26,22,.5)}
.pitem:active,.task:active,.check:active{transform:scale(.99)}
.check{transition:border-color .2s,background .2s,transform .12s}
.card h3{font-size:1.05rem;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card + .card{margin-top:14px}
.stack{display:grid;gap:14px}
.btn{border:0;border-radius:14px;min-height:48px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--orange);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:1rem;line-height:1.2}
.btn{transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s}
.btn:hover{background:var(--orange-deep);transform:translateY(-1px)} .btn:active{transform:translateY(0) scale(.98)}
.btn.teal{background:var(--teal)} .btn.teal:hover{background:var(--teal-deep)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)} .btn.ghost:hover{background:#efe1cd}
.btn.danger{background:var(--red-soft);color:var(--red)} .btn.danger:hover{background:#f9cfcb}
.btn.sm{min-height:40px;padding:6px 12px;font-size:.9rem;border-radius:12px}
.btn.block{width:100%} .btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 11px;font-size:.78rem;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap;line-height:1.3}
.chip.red{background:var(--red-soft);color:var(--red)} .chip.amber{background:var(--amber-soft);color:var(--amber)} .chip.green{background:var(--green-soft);color:var(--green)} .chip.teal{background:var(--teal-soft);color:var(--teal)} .chip.orange{background:var(--orange-soft);color:var(--orange-deep)}
.chip.lg{font-size:.9rem;padding:6px 14px} .chip.wrap{white-space:normal;text-align:left;line-height:1.5}
.alert{border-radius:14px;padding:14px 16px;border:2px solid var(--line);display:flex;gap:12px;align-items:flex-start;background:var(--surface-2)}
.alert .ic{font-size:1.3rem;flex:none;line-height:1.2} .alert > div{flex:1;min-width:0}
.alert.red{background:var(--red-soft);border-color:var(--red)} .alert.amber{background:var(--amber-soft);border-color:#e8a23a} .alert.green{background:var(--green-soft);border-color:var(--green)} .alert.teal{background:var(--teal-soft);border-color:var(--teal)}
.alert .ur{margin-top:4px;font-size:.98rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .v{font-size:1.9rem;font-weight:700;letter-spacing:-.02em;margin-top:2px;line-height:1.1} .kpi .s{font-size:.8rem;color:var(--muted);margin-top:4px}
.kpi.orange .v{color:var(--orange)} .kpi.teal .v{color:var(--teal)} .kpi.red .v{color:var(--red)} .kpi.green .v{color:var(--green)}

/* ---------- Forms ---------- */
label.f{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.06em}
select,input[type=text],input[type=number],input[type=date],input[type=tel],input[type=search],input[type=month],textarea{width:100%;min-height:48px;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;outline:0;font-size:1rem}
textarea{min-height:72px;resize:vertical}
select:focus,input:focus,textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 14px} .cols>*{min-width:0} input,select,textarea{min-width:0;max-width:100%}
.cols.tight{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:16px;align-items:start}
.check{display:flex;gap:12px;align-items:center;min-height:56px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer}
.check input{width:24px;height:24px;flex:none;accent-color:var(--orange);margin:0}
.check .en{flex:1;font-weight:700;font-size:.95rem} .check .ur{flex:1;line-height:1.8;font-size:.98rem}
.check.on{border-color:var(--red);background:var(--red-soft)} .check.ok.on{border-color:var(--green);background:var(--green-soft)} .check.teal.on{border-color:var(--teal);background:var(--teal-soft)}
.checks{display:grid;gap:8px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:none;min-height:44px;padding:6px 16px;cursor:pointer;font-weight:700} .seg button.on{background:var(--teal);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface)}
.row.click{cursor:pointer} .row.click:hover{border-color:var(--orange)}
.list{display:grid;gap:10px}
.note{background:var(--teal-soft);border-left:5px solid var(--teal);padding:10px 14px;border-radius:10px;font-size:.9rem}
.todo{border:2px dashed var(--teal);border-radius:14px;padding:12px 14px;background:var(--surface)}
.todo h4{font-size:.98rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px} .todo .tag{font-size:.68rem;background:var(--teal);color:#fff;border-radius:6px;padding:2px 7px;font-weight:700}
.todo code{background:var(--surface-2);padding:1px 6px;border-radius:6px;font-size:.85em}

/* ---------- Split list + detail ---------- */
.split{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:18px;align-items:start}
.col-list{position:sticky;top:18px}
.plist{display:grid;gap:8px;max-height:calc(100vh - 170px);overflow:auto;padding:2px}
.pitem{display:flex;gap:12px;align-items:center;min-height:64px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;text-decoration:none;color:var(--ink)}
.pitem:hover{border-color:var(--orange)} .pitem.on{border-color:var(--orange);background:var(--orange-soft)}
.pitem .av{width:42px;height:42px;border-radius:12px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-weight:700;flex:none}
.pitem .av.girl{background:#fbe0ea;color:#a8325f} .pitem .av.boy{background:#dbe9f7;color:#1f4f8a}
.pitem .t{flex:1;min-width:0} .pitem .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .pitem .t span{font-size:.82rem;color:var(--muted)}
.detailhead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.detailhead .big{width:58px;height:58px;border-radius:16px;background:var(--orange-soft);color:var(--orange-deep);display:grid;place-items:center;font-size:1.4rem;font-weight:700;flex:none}
.detailhead h2{font-size:1.4rem} .detailhead .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* ---------- Timeline, planner, EPI, growth ---------- */
.tl{display:grid;gap:8px}
.tl .c{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--line);border-left:6px solid var(--line);background:var(--surface)}
.tl .c.done{border-left-color:var(--green)} .tl .c.due{border-left-color:var(--amber);background:#fff9ee} .tl .c.overdue{border-left-color:var(--red);background:#fff4f2} .tl .c.upcoming{opacity:.85} .tl .c.missed{border-left-color:#b9ab98;background:var(--surface-2)}
.tl .wk{font-size:1.2rem;font-weight:700;line-height:1} .tl .wk small{display:block;font-size:.68rem;color:var(--muted);font-weight:700;text-transform:uppercase}
.task{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--line);border-left:6px solid var(--teal);background:var(--surface)}
.task.overdue{border-left-color:var(--red)} .task.due{border-left-color:var(--amber)} .task.alert{border-left-color:var(--red);background:var(--red-soft)}
.task .t{flex:1;min-width:0} .task .t b{display:block} .task .t span{font-size:.84rem;color:var(--muted)}
.task .btn{flex:none}
.epi{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.epi header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:var(--surface-2);flex-wrap:wrap}
.epi header b{font-size:1rem} .epi header span.d{font-size:.82rem;color:var(--muted)}
.epi .vx{display:flex;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.epi .vx .nm{flex:1;min-width:120px;font-weight:700} .epi .vx input[type=date]{min-height:40px;width:auto;flex:none;padding:4px 8px;font-size:.9rem}
.epi.given header{background:var(--green-soft)} .epi.overdue header{background:var(--red-soft)} .epi.due header{background:var(--amber-soft)}
.chart{position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:8px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;margin:8px 2px 0} .legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:.9rem;vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--surface-2)}
tr:last-child td{border-bottom:0} td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow:auto;border-radius:14px}
.progress{height:14px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--line)} .progress i{display:block;height:100%;background:var(--teal);transition:width .3s}

/* ---------- Referral slip ---------- */
.slip{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:22px 24px;max-width:720px}
.slip header{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:12px;flex-wrap:wrap}
.slip header h2{font-size:1.25rem} .slip header .ur{font-size:1.1rem}
.slip .urgency{display:inline-block;border:2px solid currentColor;border-radius:8px;padding:4px 10px;font-weight:700;margin:6px 0}
.slip dl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:0} .slip dt{font-weight:700;color:var(--muted);font-size:.85rem} .slip dd{margin:0}
.slip .sig{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:26px} .slip .sig div{border-top:1px solid var(--ink);padding-top:6px;font-size:.82rem;color:var(--muted)}

/* ---------- Toasts / bottom nav ---------- */
#toasts{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);display:grid;gap:8px;z-index:60;width:max-content;max-width:92vw}
.toast{background:var(--teal-deep);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:toastIn .3s var(--ease) both;display:flex;align-items:center;gap:10px}
.toast.out{animation:toastOut .3s var(--ease) forwards}
.toast.ok{background:var(--green)} .toast.bad{background:var(--red)}
.progress i{transition:width .6s var(--ease)}
.sheet-scrim{position:fixed;inset:0;background:rgba(7,58,65,.45);z-index:50;animation:fadeIn .25s var(--ease) both;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:560px;max-height:88vh;overflow:auto;animation:sheetUp .35s var(--ease) both;box-shadow:0 -20px 60px -20px rgba(0,0,0,.4)}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet-scrim.closing{animation:fadeOut .22s var(--ease) forwards} .sheet-scrim.closing .sheet{animation:sheetDown .22s var(--ease) forwards}
@keyframes fadeOut{to{opacity:0}} @keyframes sheetDown{to{transform:translateY(30px);opacity:0}}
@media (min-width:901px){.sheet-scrim{align-items:center}.sheet{border-radius:22px;animation:popIn .3s var(--ease) both}.sheet-scrim.closing .sheet{animation:fadeOut .2s var(--ease) forwards}}
.bottomnav{display:none;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:35;padding:4px 2px calc(4px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px -16px rgba(0,0,0,.35)}
.bottomnav a{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.66rem;font-weight:700;border-radius:12px;position:relative}
.bottomnav a.on{color:var(--orange-deep);background:var(--orange-soft)} .bottomnav a span.ic{font-size:1.25rem;line-height:1}
.bottomnav a .n{position:absolute;top:4px;right:calc(50% - 22px);background:var(--red);color:#fff;border-radius:999px;font-size:.62rem;padding:0 5px;line-height:1.4}

@media (max-width:900px){
  .shell{grid-template-columns:1fr} .rail{display:none} .topbar{display:flex}
  .bottomnav{display:flex}
  main{padding:14px 16px 96px}
  .two{grid-template-columns:minmax(0,1fr)}
  .split{grid-template-columns:minmax(0,1fr)} .col-list{position:static} .plist{max-height:none;overflow:visible}
  .split.detail-open .col-list{display:none} .split:not(.detail-open) .col-detail{display:none}
  .backbtn{display:inline-flex}
  .pagehead h2{font-size:1.3rem}
  .card{padding:16px}
  .tl .c{grid-template-columns:52px minmax(0,1fr)} .tl .c .chip{grid-column:2}
  .slip dl{grid-template-columns:120px 1fr}
  .check{flex-wrap:wrap} .check .en{min-width:60%} .check .ur{flex-basis:100%;text-align:right}
  .kpi .v{font-size:1.6rem}
  .actions .btn{flex:1 1 auto}
}
@media (max-width:420px){ .bottomnav a{font-size:.6rem} }
@media print{
  .rail,.topbar,.bottomnav,#toasts,.no-print,.backbtn{display:none!important}
  body{background:#fff;color:#000} main{padding:0;max-width:none} .shell{display:block}
  .card,.kpi,.slip{box-shadow:none;break-inside:avoid}
  .slip{border-radius:0;max-width:none}
}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">

// ---------- clinical logic ----------
const ga = (lmp, date = T_ISO) => { const days = diffDays(lmp, date); return { days, w: Math.floor(days / 7), d: days % 7 }; };
const gaStr = (lmp, date = T_ISO) => { const g = ga(lmp, date); return g.days < 0 ? '—' : `${g.w}w ${g.d}d`; };
const eddOf = lmp => iso(addDays(lmp, 280));
const womanOf = p => byId('women', p.womanId) || { name: '?', age: '' };
const hhOf = w => byId('households', w.householdId) || { head: '?', mohalla: '' };
const visitsOf = p => DB.anc.filter(v => v.pregnancyId === p.id).sort((a, b) => a.date < b.date ? -1 : 1);
const pncOf = p => DB.pnc.filter(v => v.pregnancyId === p.id).sort((a, b) => a.day - b.day);
function riskList(p) { const w = womanOf(p); const r = new Set(p.risks || []); if (w.age && (w.age < 18 || w.age > 35)) r.add('age'); return [...r]; }
/** Contact schedule: each contact has a window [due-7, due+14]. Covered if any visit falls in it. */
function schedule(p) {
  const vs = visitsOf(p), today = ga(p.lmp).days;
  return CONTACTS.map(c => {
    const due = c.wk * 7, dueDate = iso(addDays(p.lmp, due));
    const visit = vs.find(v => { const g = ga(p.lmp, v.date).days; return g >= due - 7 && g <= due + 14; });
    let status = 'upcoming';
    const laterVisit = vs.some(v => ga(p.lmp, v.date).days > due + 14);
    if (visit) status = 'done'; else if (p.status !== 'active') status = 'skipped'; else if (today > due + 42 || (today > due + 14 && laterVisit)) status = 'missed'; else if (today > due + 14) status = 'overdue'; else if (today >= due - 7) status = 'due';
    return { ...c, dueDate, visit, status };
  });
}
function pncSchedule(p) {
  if (!p.delivery) return [];
  const vs = pncOf(p);
  return PNC_DAYS.map(day => { const dueDate = iso(addDays(p.delivery.date, day)); const visit = vs.find(v => v.day === day); const late = diffDays(dueDate, T_ISO); const status = visit ? 'done' : late > 3 ? 'overdue' : late >= -1 ? 'due' : 'upcoming'; return { day, dueDate, visit, status }; });
}
/** Auto flags for an ANC visit draft. Returns {flags:[{cls,en,ur}], urg:0-3} */
function assessAnc(p, v) {
  const flags = []; let urg = 0; const signs = new Set(v.signs || []); const g = ga(p.lmp, v.date).w;
  const F = (cls, en, ur, u) => { flags.push({ cls, en, ur }); urg = Math.max(urg, u); };
  if (v.sys >= 140 || v.dia >= 90) {
    const severe = v.sys >= 160 || v.dia >= 110 || signs.has('headache') || signs.has('swelling') || signs.has('fits');
    if (severe) F('red', `BP ${v.sys}/${v.dia} with headache, vision change, swelling or fits — severe pre-eclampsia risk. Urgent referral.`, `بلڈ پریشر ${v.sys}/${v.dia} اور سر درد، نظر، سوجن یا دورے — شدید پری ایکلیمپسیا کا خطرہ۔ فوری ریفرل۔`, 3);
    else F('amber', `BP ${v.sys}/${v.dia} (≥ 140/90) — pre-eclampsia alert. Rest 15 min and recheck; refer the same day if still high or protein in urine.`, `بلڈ پریشر ${v.sys}/${v.dia} — پری ایکلیمپسیا الرٹ۔ 15 منٹ آرام کے بعد دوبارہ چیک کریں؛ زیادہ رہے تو آج ہی ریفر کریں۔`, 2);
  }
  if (v.hb != null && v.hb !== '' && !isNaN(v.hb)) {
    if (v.hb < 7) F('red', `Hb ${v.hb} g/dL — severe anaemia. Refer for treatment.`, `خون ${v.hb} — شدید خون کی کمی۔ علاج کے لیے ریفر کریں۔`, 2);
    else if (v.hb < 11) F('amber', `Hb ${v.hb} g/dL — anaemia. Daily iron/folate, diet counselling, recheck in 4 weeks.`, `خون ${v.hb} — خون کی کمی۔ روزانہ آئرن/فولیٹ، خوراک کا مشورہ، 4 ہفتے بعد دوبارہ چیک۔`, 1);
  }
  if (g >= 24 && v.fh) { const diff = v.fh - g; if (Math.abs(diff) > 3) F('amber', `Fundal height ${v.fh} cm vs ${g} wk (${diff > 0 ? '+' : ''}${diff} cm) — size–dates mismatch. Check LMP; refer for ultrasound (twins, fluid, growth restriction).`, `پیٹ کی پیمائش ${v.fh} سینٹی میٹر بمقابلہ ${g} ہفتے — فرق زیادہ ہے۔ تاریخ چیک کریں؛ الٹراساؤنڈ کے لیے ریفر کریں۔`, 1); }
  if (g >= 28 && (v.fm === 'no' || signs.has('fm'))) F('red', 'Reduced or absent fetal movement after 28 weeks — same-day referral for fetal assessment.', '28 ہفتوں کے بعد بچے کی حرکت کم یا بند — آج ہی ریفر کریں۔', 2);
  if (signs.has('water') && g >= 37) F('amber', 'Membranes ruptured at term — send to facility for delivery today.', 'پانی کی تھیلی پھٹ گئی (مکمل مدت) — زچگی کے لیے آج مرکز بھیجیں۔', 2);
  PREG_DANGER.forEach(s => { if (signs.has(s.id) && !(s.id === 'fm' && g >= 28) && !(s.id === 'water' && g >= 37)) { urg = Math.max(urg, s.urg); } });
  if (urg === 3 && !flags.some(f => f.cls === 'red')) F('red', 'Emergency danger sign present — refer now.', 'ایمرجنسی خطرے کی علامت موجود — فوراً ریفر کریں۔', 3);
  return { flags, urg, signs: [...signs] };
}

const ageMonths = (c, date = T_ISO) => ageDays(c, date) / 30.4375;

function median(sex, months) { const arr = WFA[sex] || WFA.boy; const m = Math.max(0, Math.min(24, months)); const i = Math.floor(m); return i >= 24 ? arr[24] : arr[i] + (arr[i + 1] - arr[i]) * (m - i); }

  const items = [];
  DB.pregnancies.filter(p => p.status === 'active').forEach(p => {

    const next = sch.find(c => c.status === 'due') || sch.find(c => c.status === 'overdue');

  });
  DB.pregnancies.filter(p => p.status === 'delivered' && p.delivery).forEach(p => {
    const w = womanOf(p); const next = pncSchedule(p).find(s => s.status === 'due' || s.status === 'overdue');
    if (next) items.push({ kind: next.status, name: w.name, sub: `${t('td_pnc')} · ${t('pg_day')} ${next.day} · ${relDays(next.dueDate)}`, date: next.dueDate, href: `#pregnancy/${p.id}/pnc`, action: 'td_start', icon: 'baby' });
  });
  DB.children.forEach(c => {
    const g = vaxGroups(c).find(x => x.status === 'due' || x.status === 'overdue' || (x.status === 'upcoming' && diffDays(T_ISO, x.dueDate) <= 7));
    if (g) items.push({ kind: g.status, name: c.name, sub: `${t('td_vacc')} · ${bi(g)}: ${g.vaccines.filter(v => !c.immunizations?.[v]).join(', ')} · ${relDays(g.dueDate)}`, date: g.dueDate, href: `#children/${c.id}`, action: 'td_open', icon: 'syringe' });
    const lw = lastWeight(c);
    if (ageMonths(c) < 24 && (!lw || diffDays(lw.date, T_ISO) > 30)) items.push({ kind: lw && diffDays(lw.date, T_ISO) > 60 ? 'overdue' : 'due', name: c.name, sub: `${t('td_weigh')} · ${lw ? fmtS(lw.date) + ' · ' + lw.kg + ' kg' : '—'}`, date: lw ? iso(addDays(lw.date, 30)) : T_ISO, href: `#children/${c.id}`, action: 'td_open', icon: 'scale' });

  });

}

/** Weight-for-age SVG: median line + 80%/70% screening lines + the child's points. */
function growthChart(el, c, ws) {
  const W = 520, H = 230, P = { l: 36, r: 12, t: 12, b: 28 }, maxM = 24, maxKg = 14;

  const line = (f, color, dash = '') => `<path class="draw" d="${Array.from({ length: 25 }, (_, m) => `${m ? 'L' : 'M'}${x(m).toFixed(1)} ${y(median(c.sex, m) * f).toFixed(1)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="2.5" ${dash ? `stroke-dasharray="${dash}"` : ''}/>`;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('ch_growth')}">`;
  for (let kg = 2; kg <= maxKg; kg += 2) s += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(kg)}" y2="${y(kg)}" stroke="#e6d8c4"/><text x="${P.l - 6}" y="${y(kg) + 4}" font-size="13" text-anchor="end" fill="#665c52">${kg}</text>`;
  for (let m = 0; m <= maxM; m += 3) s += `<text x="${x(m)}" y="${H - 8}" font-size="13" text-anchor="middle" fill="#665c52">${m}${m === 24 ? ' mo' : ''}</text>`;
  s += line(1, '#0b525b') + line(.8, '#a35a00', '5 4') + line(.7, '#b42318', '3 4');
  const pts = ws.filter(w => ageMonths(c, w.date) <= maxM).map(w => [x(ageMonths(c, w.date)), y(Math.min(w.kg, maxKg))]);
  if (pts.length > 1) s += `<path class="draw" d="${pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ')}" fill="none" stroke="#e8590c" stroke-width="2.5"/>`;
  pts.forEach(p => s += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="5" fill="#e8590c" stroke="#fff" stroke-width="2"/>`);
  el.innerHTML = s + '</svg>';
  $$('.draw', el).forEach(drawPath);
}

  let s = `<svg viewBox="0 0 ${W} ${H}">`;
  [0, .5, 1].forEach(f => s += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(mx * f)}" y2="${y(mx * f)}" stroke="#e6d8c4"/><text x="${P.l - 6}" y="${y(mx * f) + 4}" font-size="13" fill="#665c52" text-anchor="end">${Math.round(mx * f)}</text>`);
  data.forEach((d, i) => { const x0 = P.l + i * gw + gw * .14; series.forEach(([, col, f], k) => { const v = f(d); s += `<rect class="bar" x="${(x0 + k * (bw + 3)).toFixed(1)}" y="${y(v)}" width="${bw}" height="${Math.max(0, H - P.b - y(v))}" rx="3" fill="${col}" style="transform-origin:${(x0 + k * (bw + 3) + bw / 2).toFixed(1)}px ${H - P.b}px"><title>${d.label}: ${v}</title></rect>`; }); s += `<text x="${(x0 + gw * .36).toFixed(1)}" y="${H - 9}" font-size="13" fill="#665c52" text-anchor="middle">${d.label}</text>`; });
  el.innerHTML = s + '</svg>';
  $$('rect.bar', el).forEach((r, i) => { r.style.transform = 'scaleY(0)'; r.style.transition = `transform .6s var(--ease) ${i * 25}ms`; requestAnimationFrame(() => requestAnimationFrame(() => r.style.transform = 'scaleY(1)')); });
}
function download(name, text, type = 'application/json') { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }

// ---------- Sync (simulated) ----------
let syncing = false;
function renderSync() {
  const q = unsynced(); const last = store.get('lastSync', null);
  const groups = TABLES.map(k => [k, q.filter(x => x.table === k).length]).filter(([, n]) => n);
  view.innerHTML = pagehead(t('sy_title'), t('sy_lead')) + `<div class="two"><div class="card"><div class="detailhead"><div class="big" style="${q.length ? '' : 'background:var(--green-soft);color:var(--green)'}">${ic(q.length ? 'cloud-off' : 'cloud-check', 'lg')}</div><div style="flex:1"><div class="eyebrow">${t('sy_queue')}</div><h2 id="syCount">${q.length}</h2><div class="small muted">${t('sy_last')}: ${last ? new Date(last).toLocaleString('en-PK') : t('sy_never')}</div></div></div>
      <div class="progress" style="margin:14px 0 6px"><i id="syBar" style="width:${q.length ? 0 : 100}%"></i></div><div class="small muted" id="syMsg">${q.length ? '' : t('sy_done')}</div>
      <div class="actions"><button class="btn" id="syNow" ${q.length ? '' : 'disabled'}>${ic('refresh')} ${t('sy_now')}</button><button class="btn ghost" id="syExport">${ic('download')} ${t('sy_export')}</button><label class="btn ghost" style="cursor:pointer">${ic('upload')} ${t('sy_import')}<input type="file" id="syImport" accept="application/json" class="hidden"></label><button class="btn danger" id="syReset">${ic('trash')} ${t('sy_reset')}</button></div>
      <div class="note" style="margin-top:14px">${lang === 'ur' ? 'یہ سنک نمونہ ہے: ریکارڈ 2 سیکنڈ بعد "سنک شدہ" نشان زد ہو جاتے ہیں۔ حقیقی سرور طلبہ کا کام ہے (تعارف دیکھیں)۔' : 'This sync is simulated: records are marked synced after a short delay. The real server, conflict handling and retry queue are a student extension (see About).'}</div></div>
    <div class="card"><h3>${ic('list')} ${t('sy_queue')}</h3>${q.length ? `<div class="list stagger">${groups.map(([k, n]) => `<div class="row"><b>${t('sy_type_' + k)}</b><span class="chip orange">${n} ${t('sy_records')}</span></div>`).join('')}${q.slice(0, 12).map(({ table, rec }) => `<div class="row" style="padding:8px 12px"><span class="small">${ic('file')} ${t('sy_type_' + table)} · <code>${rec.id}</code></span><span class="small muted">${new Date(rec.updatedAt).toLocaleDateString('en-PK')}</span></div>`).join('')}${q.length > 12 ? `<div class="small muted">… +${q.length - 12}</div>` : ''}</div>` : `<div class="note">${ic('check-circle')} ${t('sy_done')}</div>`}</div></div>`;
  $('#syNow').onclick = syncNow;
  $('#syExport').onclick = () => { download(`lhw-backup-${T_ISO}.json`, JSON.stringify(Object.fromEntries(TABLES.map(k => [k, DB[k]])), null, 1)); toast(t('sy_export'), 'ok', 'download'); };
  $('#syImport').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (!TABLES.every(k => Array.isArray(d[k]))) throw 0; TABLES.forEach(k => { DB[k] = d[k]; save(k); }); toast(t('sy_imported'), 'ok'); route(); } catch { toast(t('sy_badFile'), 'bad'); } }; r.readAsText(f); };
  $('#syReset').onclick = () => { if (!confirm(t('sy_resetConfirm'))) return; seed(); toast(t('sy_reset'), 'ok'); route(); };
}
// TODO(student): real sync backend. Replace this simulation with PouchDB → CouchDB replication (or a REST endpoint) that pushes unsynced records, pulls changes from the LHS/district server, resolves conflicts by updatedAt (or a merge policy per table), retries with exponential back-off, and runs automatically when `navigator.onLine` becomes true.
async function syncNow() {
  if (syncing) return; syncing = true; const q = unsynced(); const btn = $('#syNow'); btn.disabled = true; btn.innerHTML = `${ic('refresh', 'spin')} ${t('sy_syncing')}`;
  for (let i = 0; i < q.length; i++) { await new Promise(r => setTimeout(r, Math.min(300, 1800 / q.length))); q[i].rec.synced = true; if ($('#syBar')) { $('#syBar').style.width = `${(i + 1) / q.length * 100}%`; $('#syCount').textContent = q.length - i - 1; $('#syMsg').textContent = `${i + 1}/${q.length}`; } }
  TABLES.forEach(save); store.set('lastSync', Date.now()); syncing = false; toast(t('sy_ok'), 'ok', 'cloud-check'); renderSync(); renderNav();
}

  ['Supervisor dashboard', 'A separate LHS view that aggregates many LHWs: coverage of the 4 mandatory ANC visits, referral follow-up, immunization drop-out rate, map of overdue children.', 'product', 'monthCounts() as the data source'],

      <p class="muted small" style="margin:0">Clinical rules: Naegele EDD (LMP + 280 d) · WHO 2016 eight ANC contacts + Pakistan MNCH four mandatory visits · pre-eclampsia (BP ≥ 140/90), anaemia (Hb &lt; 7 / &lt; 11), fundal height ±3 cm after 24 wk, fetal movement after 28 wk · WHO/IMNCI pregnancy, postnatal and newborn danger signs · Pakistan EPI 2024 schedule · weight-for-age screening as % of WHO median (not z-scores). A decision aid for trained LHWs, not a replacement for clinical judgement or the official register.</p>
      <p class="muted small" style="margin:10px 0 0">Stack: one HTML file, vanilla JS, hand-drawn SVG charts, localStorage (<code>lhw:</code>). Works from file:// with no network.</p></div>
    <div class="card"><h3>${ic('settings')} ${t('ab_profile')}</h3><div class="cols">${field(t('ab_name'), `<input id="pfName" value="${esc(profile.name)}">`)}${field(t('ab_code'), `<input id="pfCode" value="${esc(profile.code)}">`)}</div>${field(t('ab_village'), `<input id="pfVillage" value="${esc(profile.village)}">`)}<div class="cols">${field(t('ab_bhu'), `<input id="pfBhu" value="${esc(profile.bhu)}">`)}${field(t('ab_rhc'), `<input id="pfRhc" value="${esc(profile.rhc)}">`)}${field(t('ab_dhq'), `<input id="pfDhq" value="${esc(profile.dhq)}">`)}${field(t('ab_lhs'), `<input id="pfLhs" type="tel" value="${esc(profile.lhs)}">`)}</div><div class="actions"><button class="btn" id="pfSave">${ic('check')} ${t('save')}</button></div></div></div>

// ---------- nav / router / boot ----------
const NAV = [['today', 'calendar'], ['households', 'home'], ['pregnancy', 'heart'], ['children', 'baby'], ['report', 'bar-chart'], ['sync', 'refresh']];
const navKey = p => p === 'pregnancy' ? 'nav_pregnancies' : 'nav_' + p;
function renderNav() {
  const cur = (location.hash.slice(1) || 'today').split('/')[0]; const q = unsynced().length; const od = planner().filter(i => i.kind === 'overdue' || i.kind === 'alert').length;
  const badge = p => p === 'sync' && q ? `<span class="n">${q}</span>` : p === 'today' && od ? `<span class="n">${od}</span>` : '';
  $('#railnav').innerHTML = NAV.map(([p, i]) => `<a class="nav ${cur === p ? 'on' : ''}" href="#${p}"><span class="ic">${ic(i)}</span>${t(navKey(p))}${badge(p)}</a>`).join('') + `<a class="nav ${cur === 'about' ? 'on' : ''}" href="#about"><span class="ic">${ic('info')}</span>${t('nav_about')}</a>`;
  $('#bottomnav').innerHTML = NAV.map(([p, i]) => `<a class="${cur === p ? 'on' : ''}" href="#${p}"><span class="ic">${ic(i)}</span>${t(navKey(p))}${badge(p)}</a>`).join('');
  $('#profileBox').innerHTML = `<b>${esc(profile.name)}</b>${esc(profile.code)}<br>${esc(profile.village)}`;
}
function route() {
  closeSheet(true);
  const [page, id, sub, vid] = (location.hash.slice(1) || 'today').split('/');
  renderNav();
  const fn = { today: renderToday, households: () => renderHouseholds(id), pregnancy: () => renderPregnancies(id, sub, vid), children: () => renderChildren(id), report: renderReport, sync: renderSync, about: renderAbout }[page];
  (fn || renderToday)();
  animateIn(view); window.scrollTo({ top: 0 });
}
function applyLang() {
  document.documentElement.lang = lang; store.set('lang', lang);
  $$('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  $$('#langBtn,#langBtn2').forEach(b => b.textContent = lang === 'en' ? 'اردو' : 'English');
  route();
}
$$('#langBtn,#langBtn2').forEach(b => b.onclick = () => { lang = lang === 'en' ? 'ur' : 'en'; applyLang(); });
window.addEventListener('hashchange', route);
load(); applyLang();
