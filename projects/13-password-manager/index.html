<!doctype html>
<html lang="en" data-accent="cyan">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Vault — Privacy-First Password Manager</title>
<meta name="description" content="Zero-knowledge, offline, single-file password manager: PBKDF2 + AES-GCM vault, TOTP codes, explainable strength analyzer, generator, health dashboard and k-anonymity breach check UI. FYP template.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens: security console ---------- */
:root{
  --bg:#0b0f14; --panel:#121922; --panel-2:#182230; --field:#0e141b; --line:#1f2a38; --line-2:#2a3749;
  --ink:#e6edf3; --muted:#8b98a8; --dim:#5b687a;
  --accent:#22d3ee; --accent-ink:#06202a; --accent-soft:rgba(34,211,238,.12);
  --ok:#34d399; --ok-soft:rgba(52,211,153,.14); --danger:#fb7185; --danger-soft:rgba(251,113,133,.14); --warn:#fbbf24; --warn-soft:rgba(251,191,36,.14);
  --surface:var(--panel); --surface-2:var(--panel-2);
  --radius:12px; --font:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --dur:.35s;
}
:root[data-accent=green]{--accent:#34d399;--accent-ink:#052e1f;--accent-soft:rgba(52,211,153,.14)}
:root[data-accent=violet]{--accent:#a78bfa;--accent-ink:#1e1340;--accent-soft:rgba(167,139,250,.16)}
:root[data-accent=amber]{--accent:#fbbf24;--accent-ink:#2b1d02;--accent-soft:rgba(251,191,36,.16)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes toastIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(6px)}}
@keyframes lockOut{to{opacity:0;transform:translateY(-10px) scale(.97)}}
.enter{animation:fadeUp var(--dur) var(--ease) both}
.stagger>*{animation:fadeUp .45s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.btn{transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s,border-color .15s}
.btn:hover{transform:translateY(-1px)} .btn:active{transform:translateY(0) scale(.98)}
.card,.tile{transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s}
.card:hover{transform:translateY(-2px);border-color:var(--line-2)}
.fill,.bar>i{transition:width .6s var(--ease)}
.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(1100px 520px at 85% -10%,var(--accent-soft),transparent 60%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.01em}
p{margin:0 0 8px}
code,.mono{font-family:var(--mono);font-size:.93em}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:.82rem} .hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.ic.big{width:44px;height:44px;stroke-width:1.5}
.ok{color:var(--ok)} .bad{color:var(--danger)} .warnc{color:var(--warn)} .acc{color:var(--accent)}

/* ---------- Buttons & inputs ---------- */
.btn{border:1px solid transparent;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;background:var(--panel-2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:var(--line-2)}
.btn.danger{background:var(--danger-soft);color:var(--danger);border-color:rgba(251,113,133,.3)}
.btn.sm{padding:6px 10px;font-size:.84rem;min-height:36px;border-radius:8px}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);display:inline-grid;place-items:center;cursor:pointer;flex:none;transition:color .15s,border-color .15s,background .15s,transform .15s}
.iconbtn:hover{color:var(--ink);border-color:var(--line-2)} .iconbtn:active{transform:scale(.94)}
.iconbtn.on{color:var(--warn);border-color:rgba(251,191,36,.45);background:var(--warn-soft)}
.iconbtn.danger:hover{color:var(--danger);border-color:rgba(251,113,133,.45)}
.iconbtn.copied{color:var(--ok);border-color:rgba(52,211,153,.5);background:var(--ok-soft)}
.iconbtn.sm{width:32px;height:32px;border-radius:8px}
input:not([type]),input[type=text],input[type=password],input[type=search],input[type=number],input[type=url],input[type=email],select,textarea{width:100%;background:var(--field);border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;outline:0;color:var(--ink);min-height:42px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input::placeholder,textarea::placeholder{color:var(--dim)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{min-height:88px;resize:vertical}
label.f{display:block;font-size:.76rem;font-weight:700;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.07em}
label.f:first-child{margin-top:0}
.pwwrap{position:relative} .pwwrap input{padding-right:84px;font-family:var(--mono)} .pwwrap.one input{padding-right:48px}
.pwwrap .tools{position:absolute;right:5px;top:50%;transform:translateY(-50%);display:flex;gap:4px}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer;min-height:40px;font-weight:500}
.chk input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.range{width:100%;accent-color:var(--accent);min-height:40px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--field)}
.seg button{border:0;background:none;padding:8px 14px;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--muted);min-height:40px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.swatches{display:flex;gap:8px;flex-wrap:wrap} .sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;background:var(--c)} .sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--c)}
.note{border-radius:10px;padding:10px 12px;font-size:.88rem;display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line-2);background:var(--panel-2)}
.note.ok{border-color:rgba(52,211,153,.35);background:var(--ok-soft)} .note.warn{border-color:rgba(251,191,36,.35);background:var(--warn-soft)} .note.bad{border-color:rgba(251,113,133,.35);background:var(--danger-soft)}
.note .ic{margin-top:3px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.86rem} .kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}

/* ---------- Cards / chips / meter ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;min-width:0}
.card h3{font-size:1rem;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card p.lead{color:var(--muted);margin:-4px 0 12px;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--panel-2);border-radius:999px;padding:4px 11px;font-size:.8rem;font-weight:600;color:var(--muted);text-decoration:none;cursor:pointer;min-height:32px}
.chip.on,.chip:hover{color:var(--accent);border-color:var(--accent)}
.chip.bad{color:var(--danger);border-color:rgba(251,113,133,.4)} .chip.warn{color:var(--warn);border-color:rgba(251,191,36,.4)}
.meter{display:flex;gap:4px;margin-top:8px} .meter i{flex:1;height:6px;border-radius:3px;background:var(--line-2);transition:background .35s var(--ease)}
.meter[data-s="0"] i:nth-child(1),.meter[data-s="1"] i:nth-child(-n+2){background:var(--danger)}
.meter[data-s="2"] i:nth-child(-n+3){background:var(--warn)}
.meter[data-s="3"] i:nth-child(-n+4){background:var(--accent)}
.meter[data-s="4"] i{background:var(--ok)}
.verdict{font-weight:700} .v0,.v1{color:var(--danger)} .v2{color:var(--warn)} .v3{color:var(--accent)} .v4{color:var(--ok)}
.sline{display:flex;justify-content:space-between;gap:10px;font-size:.84rem;margin-top:6px;color:var(--muted);flex-wrap:wrap}
.reasons{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:5px;font-size:.86rem}
.reasons li{display:flex;gap:8px;align-items:flex-start} .reasons li .ic{margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:2px 7px;font-size:.72rem;font-weight:700;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.pill.bad{background:var(--danger-soft);color:var(--danger)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.acc{background:var(--accent-soft);color:var(--accent)}

/* ---------- Lock screen ---------- */
#lock{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
#lock.out{animation:lockOut .3s var(--ease) both;pointer-events:none}
.lockcard{width:min(480px,100%);background:var(--panel);border:1px solid var(--line-2);border-radius:20px;padding:28px;box-shadow:0 40px 90px -50px var(--accent)}
.lock-brand{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.lock-brand h1{font-size:1.5rem;font-weight:800}
.logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--accent),#0e7490);display:grid;place-items:center;color:#fff;flex:none}
.logo svg{width:30px;height:30px}
.lock-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
details.protect{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
details.protect summary{cursor:pointer;font-weight:600;color:var(--muted);display:flex;gap:8px;align-items:center;min-height:36px;list-style:none}
details.protect summary::-webkit-details-marker{display:none}
details.protect[open] summary{color:var(--ink)}
.cryptoflow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:6px;align-items:center;margin:12px 0;font-size:.78rem;text-align:center}
.cryptoflow .step{background:var(--field);border:1px solid var(--line-2);border-radius:10px;padding:8px 6px}
.cryptoflow .step b{display:block;font-size:.8rem;color:var(--accent)}
.cryptoflow .ic{color:var(--dim)}
.mobilebar{display:none}

/* ---------- App shell ---------- */
#app{display:none;height:100vh;grid-template-columns:240px 360px minmax(0,1fr)}
#app.on{display:grid}
.rail{background:#0d131a;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;overflow:auto;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 14px}
.brand .logo{width:38px;height:38px;border-radius:11px} .brand .logo svg{width:22px;height:22px}
.brand b{display:block;font-size:1.05rem} .brand small{display:block;font-size:.72rem;color:var(--muted)}
.rail nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;min-height:40px}
.rail nav a:hover{background:var(--panel-2);color:var(--ink)}
.rail nav a.active{background:var(--accent-soft);color:var(--accent)}
.rail nav a .n{margin-left:auto;font-size:.74rem;color:var(--dim);font-family:var(--mono)}
.rail nav a .tdot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent));flex:none;margin:0 3px}
.rail h4{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin:14px 10px 6px}
.rail-foot{margin-top:auto;padding-top:14px;display:grid;gap:8px}
.autolock{font-size:.76rem;color:var(--dim);display:flex;gap:6px;align-items:center;padding:0 4px}
.list-pane{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 8px}
.list-head h2{font-size:1.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-tools{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:8px;padding:0 16px 10px}
.search{position:relative} .search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim)} .search input{padding-left:34px}
.rows{overflow:auto;flex:1;padding:0 8px 16px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:12px;padding:9px 10px;cursor:pointer;color:var(--ink);min-height:58px}
.row:hover{background:var(--panel)} .row.active{background:var(--panel);border-color:var(--line-2)}
.row .txt{min-width:0;flex:1} .row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .row .s{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .badges{display:flex;gap:6px;align-items:center;color:var(--dim)}
.avatar{width:38px;height:38px;border-radius:10px;background:var(--c,var(--accent));color:#06161c;display:grid;place-items:center;font-weight:800;flex:none}
.avatar.lg{width:54px;height:54px;font-size:1.35rem;border-radius:15px}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--line-2)} .sdot.s0,.sdot.s1{background:var(--danger)} .sdot.s2{background:var(--warn)} .sdot.s3{background:var(--accent)} .sdot.s4{background:var(--ok)}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}
.empty .ic.big{color:var(--dim);margin-bottom:10px}
.detail-pane{overflow:auto;padding:24px 28px;min-width:0}
.d-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.d-title{flex:1 1 220px;min-width:0} .d-title h2{font-size:1.4rem;overflow-wrap:break-word} .d-title a{text-decoration:none;font-size:.86rem}
.d-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.back{display:none}
.d-body{margin-top:18px;display:grid;gap:10px;max-width:780px}
.fld{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.fld .main{flex:1;min-width:0}
.fl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:700;display:flex;gap:6px;align-items:center}
.fv{margin-top:3px;overflow-wrap:anywhere;font-size:.98rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap} .fv.pre{white-space:pre-wrap;display:block}
.secret{letter-spacing:.06em}
.code{font-size:1.55rem;font-weight:700;letter-spacing:.14em;color:var(--accent)}
.ring{width:34px;height:34px;transform:rotate(-90deg);flex:none} .ring circle{fill:none;stroke-width:3} .ring .bg{stroke:var(--line-2)} .ring .fg{stroke:var(--accent);stroke-dasharray:94.25;transition:stroke-dashoffset 1s linear} .ring.warn .fg{stroke:var(--warn)}
.hist{display:grid;gap:6px} .hist .hrow{display:flex;align-items:center;gap:10px;font-size:.88rem;border-top:1px solid var(--line);padding-top:6px} .hist .hrow:first-child{border-top:0;padding-top:0}
.content-pane{overflow:auto;padding:24px 28px;grid-column:2/4;min-width:0}
body:not([data-page=vault]) .list-pane,body:not([data-page=vault]) .detail-pane{display:none!important} body[data-page=vault] .content-pane{display:none}
.page{max-width:1060px;display:grid;gap:16px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap} .page-head h2{font-size:1.5rem} .page-head p{margin:4px 0 0;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;gap:12px;align-items:center}
.kpi .kic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--panel-2);flex:none}
.kpi .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700} .kpi .v{font-size:1.5rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.health-top{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:stretch}
.scorecard{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.scorering{width:150px;height:150px;position:relative} .scorering svg{transform:rotate(-90deg);width:100%;height:100%} .scorering circle{fill:none;stroke-width:9} .scorering .bg{stroke:var(--panel-2)} .scorering .fg{transition:stroke-dashoffset 1s var(--ease)}
.scorering .num{position:absolute;inset:0;display:grid;place-items:center;font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums}
.hbar{display:grid;grid-template-columns:92px 1fr 30px;align-items:center;gap:10px;font-size:.84rem;margin:7px 0}
.hbar .bar{height:10px;background:var(--panel-2);border-radius:5px;overflow:hidden} .hbar .bar>i{display:block;height:100%;border-radius:5px;background:var(--c);width:0}
.hbar .n{text-align:right;font-family:var(--mono);color:var(--muted)}
.fixrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap} .fixrow:first-child{border-top:0}
.fixrow .txt{flex:1;min-width:140px}
.hashbox{font-family:var(--mono);font-size:.86rem;overflow-wrap:anywhere;background:var(--field);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;line-height:1.7}
.hashbox .pre{background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:0 4px;font-weight:700}
.genout{font-family:var(--mono);font-size:1.25rem;font-weight:500;background:var(--field);border:1px solid var(--line-2);border-radius:12px;padding:14px 16px;overflow-wrap:anywhere;min-height:56px;line-height:1.5}
.genout .d{color:var(--accent)} .genout .s{color:var(--warn)}
.gen-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px}
.todo{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px} .todo h4{font-size:.95rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap} .todo .tag{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 6px} .todo code{font-size:.78rem;color:var(--muted)}
.list{display:grid;gap:10px}
.cf{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto auto;gap:6px;align-items:center;margin-bottom:6px}
.ed-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px} .span2{grid-column:1/-1}
.ed-grid label.f{margin-top:10px}

/* ---------- Modal / toasts ---------- */
.scrim{position:fixed;inset:0;background:rgba(3,6,10,.72);backdrop-filter:blur(3px);z-index:50;display:none;animation:fadeIn .2s}
.scrim.open{display:block}
.modal{position:fixed;inset:0;display:none;place-items:center;z-index:51;padding:16px;overflow:auto}
.modal.open{display:grid}
.modal .box{background:var(--panel);border:1px solid var(--line-2);border-radius:16px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px 22px;animation:pop .25s var(--ease);box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
.modal .box.wide{width:min(760px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px} .modal-head h2{font-size:1.2rem}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:70;max-width:min(380px,calc(100vw - 24px))}
.toast{background:#1b2634;border:1px solid var(--line-2);color:var(--ink);padding:10px 14px;border-radius:10px;font-weight:500;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.7);animation:toastIn .3s var(--ease);font-size:.9rem}
.toast.out{animation:toastOut .3s var(--ease) both}
.toast.ok{border-color:rgba(52,211,153,.45)} .toast.ok .ic{color:var(--ok)} .toast.bad{border-color:rgba(251,113,133,.5)} .toast.bad .ic{color:var(--danger)}

/* ---------- Item types / bank card face ---------- */
.typeseg{display:flex;gap:6px;flex-wrap:wrap}
.typeseg button{border:1px solid var(--line-2);background:var(--field);color:var(--muted);border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.typeseg button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.cardface{background:linear-gradient(135deg,var(--c,#334155),#0b0f14 140%);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:18px 20px;color:#fff;max-width:420px;position:relative;overflow:hidden;box-shadow:0 20px 40px -24px rgba(0,0,0,.9)}
.cardface::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
.cardface .bank{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;opacity:.85;display:flex;justify-content:space-between}
.cardface .num{font-family:var(--mono);font-size:1.3rem;letter-spacing:.14em;margin:22px 0 14px;overflow-wrap:anywhere}
.cardface .meta{display:flex;justify-content:space-between;font-size:.8rem;gap:12px}
.cardface .meta b{display:block;font-size:.65rem;opacity:.7;font-weight:600;letter-spacing:.08em}
.cardface .chip{width:36px;height:26px;border-radius:6px;background:linear-gradient(135deg,#fde68a,#b45309);border:0;padding:0;min-height:0}
.brandpill{font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.15);border-radius:6px;padding:2px 7px}

/* ---------- Inbox / activity log / trash ---------- */
.nrow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.nrow:first-child{border-top:0;padding-top:0}
.nrow .nic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--panel-2);flex:none}
.nrow .nic.bad{background:var(--danger-soft);color:var(--danger)} .nrow .nic.warn{background:var(--warn-soft);color:var(--warn)} .nrow .nic.ok{background:var(--ok-soft);color:var(--ok)} .nrow .nic.acc{background:var(--accent-soft);color:var(--accent)}
.nrow .ntxt{flex:1;min-width:0} .nrow .ntxt b{display:block} .nrow .ntxt .small{margin-top:2px}
.nrow.unread .ntxt b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:middle}
.nrow.read{opacity:.7}
.nrow .nact{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line-2)}
.tl{position:relative;padding:6px 0 10px;font-size:.88rem}
.tl::before{content:"";position:absolute;left:-19px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--panel-2);border:2px solid var(--accent)}
.tl.bad::before{border-color:var(--danger)} .tl.warn::before{border-color:var(--warn)} .tl.ok::before{border-color:var(--ok)}
.tl .when{color:var(--dim);font-size:.76rem;font-family:var(--mono)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:.68rem;font-weight:800;padding:0 5px;font-family:var(--mono)}
.rail nav a .badge{margin-left:auto}
.mobilebar .badge{position:absolute;top:4px;right:4px}
.mobilebar .iconbtn{position:relative}

/* ---------- Command palette / shortcuts / tour ---------- */
.palette .box{padding:12px;width:min(640px,100%)}
.palette input{font-size:1.05rem;padding:12px 14px 12px 42px}
.pal-results{max-height:min(60vh,420px);overflow:auto;margin-top:8px;display:grid;gap:2px}
.pal-item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--ink);border:1px solid transparent;text-align:left;background:none;width:100%;min-height:44px}
.pal-item .sub{color:var(--muted);font-size:.8rem;margin-left:auto;white-space:nowrap}
.pal-item.active,.pal-item:hover{background:var(--panel-2);border-color:var(--line-2)}
.pal-group{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);padding:8px 10px 2px;font-weight:700}
kbd{font-family:var(--mono);font-size:.76rem;background:var(--field);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:6px;padding:2px 7px;color:var(--ink)}
.shortcuts{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center;font-size:.9rem}
.tour-spot{position:fixed;z-index:80;border-radius:14px;box-shadow:0 0 0 9999px rgba(3,6,10,.74),0 0 0 3px var(--accent);pointer-events:none;transition:all .35s var(--ease)}
.tour-card{position:fixed;z-index:81;width:min(340px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line-2);border-radius:14px;padding:16px 18px;box-shadow:0 30px 60px -30px rgba(0,0,0,.9);animation:pop .3s var(--ease)}
.tour-card h3{font-size:1rem;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.tour-card .steps{font-size:.76rem;color:var(--dim);font-family:var(--mono)}
.tour-card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}

/* ---------- Crypto lab / reports ---------- */
.labgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px}
.bench .tile{background:var(--field);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px}
.bench .tile b{display:block;font-size:1.1rem;font-family:var(--mono)} .bench .tile span{font-size:.74rem;color:var(--muted)}
.steps-list{display:grid;gap:8px;margin-top:10px}
.step-row{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:.86rem}
.step-row .no{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:.78rem}
.step-row code{display:block;overflow-wrap:anywhere;margin-top:2px;color:var(--muted)}
.bitdiff{display:flex;flex-wrap:wrap;gap:2px;margin-top:8px} .bitdiff i{width:6px;height:6px;border-radius:1px;background:var(--line-2)} .bitdiff i.on{background:var(--accent)}
.report table{width:100%;min-width:640px;border-collapse:collapse;font-size:.86rem}
.report th,.report td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.report th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.report .rhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.report .rhead .small{color:var(--muted)}
.wrapx{overflow:auto}
.empty-inline{padding:14px;border:1px dashed var(--line-2);border-radius:12px;color:var(--muted);text-align:center;font-size:.9rem}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .spacer{flex:1}
@media print{body.printing .report:not(.print-only){display:none!important} .noprint,.page-head a.btn{display:none!important} .report{border:0;padding:0;box-shadow:none} .report th,.report td{border-bottom:1px solid #ccc;color:#000} .report .small,.report .muted{color:#444} .page{display:block}}

/* ---------- Responsive ---------- */
@media (max-width:1100px){#app{grid-template-columns:220px 320px minmax(0,1fr)} .health-top{grid-template-columns:1fr}}
@media (max-width:900px){
  .mobilebar{display:flex;position:sticky;top:0;z-index:40;align-items:center;gap:10px;padding:8px 12px;background:#0d131a;border-bottom:1px solid var(--line)}
  .mobilebar .mt{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #app.on{display:block;height:auto;min-height:100vh}
  .rail{position:fixed;top:0;bottom:0;left:0;width:min(300px,85vw);z-index:60;transform:translateX(-105%);transition:transform .3s var(--ease);box-shadow:0 0 60px rgba(0,0,0,.6)}
  body.rail-open .rail{transform:none}
  .list-pane{border-right:0}
  .detail-pane{display:none;padding:16px}
  body.detail-open .list-pane{display:none} body.detail-open .detail-pane{display:block}
  .back{display:inline-grid}
  .d-actions{flex-basis:100%;justify-content:flex-start}
  .content-pane{padding:16px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ed-grid{grid-template-columns:1fr}
  .cf{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-auto-rows:auto} .cf .chk{grid-column:1} .cf .iconbtn{grid-column:2;justify-self:end}
  .list-tools{grid-template-columns:minmax(0,1fr) 120px}
  #toasts{left:12px;right:12px;bottom:12px;max-width:none}
  .cryptoflow{grid-template-columns:1fr} .cryptoflow .ic{transform:rotate(90deg);justify-self:center}
  .nrow{flex-wrap:wrap} .nrow .ntxt{flex:1 1 180px} .nrow .nact{flex-basis:100%;justify-content:flex-start}
  .labgrid{grid-template-columns:1fr}
}
@media print{.rail,.mobilebar,#toasts,.list-pane,.scrim,.modal{display:none!important} body{background:#fff;color:#000} #app.on{display:block} .detail-pane,.content-pane{overflow:visible;padding:0}}
</style>

'use strict';
/* =====================================================================
   Vault — privacy-first password manager (single file)
   Sections: utils · crypto · wordlists · strength analyzer · generator ·

             demo data · modal · lock screen · onboarding tour · command palette ·

   Student extension points are marked with  TODO(student)

// ---------- utils ----------
const NS = 'pfpm:';
const $ = (selector, root = document) => root.querySelector(selector);
const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

const store = {
  get(key, fallback) {
    try {
      const raw = localStorage.getItem(NS + key);
      return raw == null ? fallback : JSON.parse(raw);
    } catch {
      return fallback;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(NS + key, JSON.stringify(value));
    } catch {
      /* quota or private mode: the app keeps working in memory */
    }
  },
  del(key) {
    try {
      localStorage.removeItem(NS + key);
    } catch {
      /* ignore */
    }
  }
};

const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ESC_MAP[c]);
const uid = () => 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ic = (name, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const DAY = 86400000;
const now = () => Date.now();
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

const fmtDate = ts => new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const fmtTime = ts => new Date(ts).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

function ago(ts) {
  const days = Math.round((now() - ts) / DAY);
  if (days < 1) return 'today';
  if (days === 1) return 'yesterday';
  if (days < 30) return days + ' days ago';
  const months = Math.round(days / 30);
  if (months < 12) return months + ' months ago';
  return (days / 365).toFixed(1) + ' years ago';
}

function inDays(ts) {
  const days = Math.ceil((ts - now()) / DAY);
  if (days < 0) return `${plural(-days, 'day')} overdue`;
  if (days === 0) return 'due today';
  return `in ${plural(days, 'day')}`;
}

const normUrl = url => (/^[a-z]+:\/\//i.test(url) ? url : 'https://' + url);

function host(url) {
  try {
    return new URL(normUrl(url)).host;
  } catch {
    return url;
  }
}

const initial = title => ((title || '?').trim()[0] || '?').toUpperCase();

function toast(message, type = '', icon) {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const fallbackIcon = type === 'ok' ? 'check-circle' : type === 'bad' ? 'alert-circle' : 'info';
  el.innerHTML = ic(icon || fallbackIcon);
  const text = document.createElement('span');
  text.textContent = message;
  el.append(text);
  $('#toasts').append(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 320);
  }, 3400);
}

// motion kit: route enter + staggered children; the class removes itself so no transform lingers
function animateIn(root) {
  root.classList.remove('enter');
  void root.offsetWidth;
  root.classList.add('enter');
  root.addEventListener('animationend', e => {
    if (e.target === root) root.classList.remove('enter');
  }, { once: true });
  $$('.stagger', root).forEach(group => {
    [...group.children].forEach((child, i) => child.style.setProperty('--i', i));
  });
}

function countUp(el, to, { dur = 700, fmt = v => Math.round(v).toLocaleString('en-PK') } = {}) {
  const start = performance.now();
  const step = time => {
    const p = Math.min(1, (time - start) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(to * eased);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function download(name, text, type = 'application/json') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function pickFile(accept, onText) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = accept;
  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => onText(String(reader.result), file.name);
    reader.readAsText(file);
  };
  input.click();
}

function debounce(fn, ms) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), ms);
  };
}

// ---------- crypto (WebCrypto only) ----------
const enc = new TextEncoder();
const dec = new TextDecoder();
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
const KDF_MIN = 600000;

function b64(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) {
    s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  }
  return btoa(s);
}

const unb64 = text => Uint8Array.from(atob(text), c => c.charCodeAt(0));
const hex = bytes => [...bytes].map(b => b.toString(16).padStart(2, '0')).join('');

/** master password → AES-GCM-256 key. PBKDF2-SHA-256 with a random 16-byte salt. */
async function deriveKey(password, salt, iterations) {
  // TODO(student): Argon2id via WASM (argon2-browser / hash-wasm). Memory-hard KDFs resist GPU cracking far better
  // than PBKDF2. Keep this signature, store kdf:'argon2id' + its parameters in the vault record, migrate on next unlock.
  const material = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  const params = { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' };
  return crypto.subtle.deriveKey(params, material, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}

async function encryptJSON(key, value) {
  const iv = rnd(12);
  const plaintext = enc.encode(JSON.stringify(value));
  const ciphertext = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plaintext));
  return { iv: b64(iv), ct: b64(ciphertext) };
}

async function decryptJSON(key, box) {
  const plaintext = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(box.iv) }, key, unb64(box.ct));
  return JSON.parse(dec.decode(plaintext));
}

async function digestHex(algorithm, text) {
  const bytes = new Uint8Array(await crypto.subtle.digest(algorithm, enc.encode(text)));
  return hex(bytes);
}

const sha1Hex = async text => (await digestHex('SHA-1', text)).toUpperCase();

function base32Decode(text) {
  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  const clean = (text || '').toUpperCase().replace(/[^A-Z2-7]/g, '');
  let bits = 0;
  let value = 0;
  const out = [];
  for (const ch of clean) {
    value = (value << 5) | alphabet.indexOf(ch);
    bits += 5;
    if (bits >= 8) {
      out.push((value >>> (bits - 8)) & 255);
      bits -= 8;
    }
  }
  return new Uint8Array(out);
}

/** RFC 6238 TOTP with every intermediate value exposed (used by the detail pane and the crypto lab). */
async function totpSteps(secret, time = now(), step = 30, digits = 6) {
  const keyBytes = base32Decode(secret);
  if (!keyBytes.length) return null;
  const counter = Math.floor(time / 1000 / step);
  const counterBuf = new ArrayBuffer(8);
  const view = new DataView(counterBuf);
  view.setUint32(0, Math.floor(counter / 4294967296));
  view.setUint32(4, counter >>> 0);
  const hmacKey = await crypto.subtle.importKey('raw', keyBytes, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
  const mac = new Uint8Array(await crypto.subtle.sign('HMAC', hmacKey, counterBuf));
  const offset = mac[19] & 15;
  const binary = ((mac[offset] & 127) << 24) | (mac[offset + 1] << 16) | (mac[offset + 2] << 8) | mac[offset + 3];
  const code = String(binary % 10 ** digits).padStart(digits, '0');
  return { keyBytes, counter, counterHex: hex(new Uint8Array(counterBuf)), mac, offset, binary, code, secondsLeft: step - (time / 1000) % step };
}

async function totp(secret, time = now()) {
  const steps = await totpSteps(secret, time);
  return steps ? steps.code : null;
}

const KNOWN_2FA = ['google', 'gmail', 'github', 'facebook', 'instagram', 'microsoft', 'outlook', 'apple', 'amazon', 'netflix', 'dropbox', 'paypal', 'twitter', 'x.com', 'linkedin', 'discord', 'jazzcash', 'easypaisa', 'hbl', 'ubl', 'meezan', 'daraz', 'nadra', 'binance', 'telegram', 'whatsapp', 'zoom', 'careem', 'fbr'];

// ---------- strength analyzer (explainable) ----------
const LEET = { '0': 'o', '1': 'i', '3': 'e', '4': 'a', '5': 's', '7': 't', '8': 'b', '@': 'a', '$': 's', '!': 'i', '|': 'l', '+': 't' };
const KB_ROWS = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm', '1234567890', '0987654321', 'poiuytrewq', 'lkjhgfdsa', 'mnbvcxz', '!@#$%^&*()'];
const VERDICTS = ['Very weak', 'Weak', 'Fair', 'Strong', 'Very strong'];
const analyzeCache = new Map();

function analyze(password) {
  const pw = password || '';
  if (analyzeCache.has(pw)) return analyzeCache.get(pw);
  const result = analyzeRaw(pw);
  if (analyzeCache.size > 600) analyzeCache.clear();
  analyzeCache.set(pw, result);
  return result;
}

function charClasses(pw) {
  return {
    lower: /[a-z]/.test(pw),
    upper: /[A-Z]/.test(pw),
    digit: /\d/.test(pw),
    symbol: /[^A-Za-z0-9]/.test(pw)
  };
}

function poolSize(classes) {
  return (classes.lower ? 26 : 0) + (classes.upper ? 26 : 0) + (classes.digit ? 10 : 0) + (classes.symbol ? 33 : 0);
}

// Dictionary words and common-password fragments (longest match first, l33t-normalised)
function findDictionary(pw, lower, unleet) {
  const matches = [];
  for (let i = 0; i < pw.length; i++) {
    for (let j = Math.min(pw.length, i + 20); j >= i + 4; j--) {
      const sub = unleet.slice(i, j);
      if (!DICT.has(sub)) continue;
      const rank = COMMON_RANK.get(sub);
      const leet = sub !== lower.slice(i, j);
      const caps = /[A-Z]/.test(pw.slice(i, j));
      const base = rank != null ? Math.log2(rank + 2) : Math.log2(WORDS.length);
      const label = rank != null ? 'Common password fragment' : 'Dictionary word';
      matches.push({ i, j, bits: base + (leet ? 1 : 0) + (caps ? 1 : 0), text: `${label} “${pw.slice(i, j)}”${leet ? ' (l33t spelling)' : ''}`, dict: true });
      i = j - 1;
      break;
    }
  }
  return matches;
}

function findKeyboardWalks(pw, lower) {
  const matches = [];
  for (let i = 0; i < pw.length; i++) {
    for (let j = Math.min(pw.length, i + 12); j >= i + 4; j--) {
      const sub = lower.slice(i, j);
      if (!KB_ROWS.some(row => row.includes(sub))) continue;
      matches.push({ i, j, bits: 5 + Math.log2(j - i), text: `Keyboard walk “${pw.slice(i, j)}”` });
      i = j - 1;
      break;
    }
  }
  return matches;
}

function findSequences(pw) {
  const matches = [];
  const alnum = ch => /[a-z0-9]/i.test(ch);
  for (let i = 0; i < pw.length - 2; i++) {
    const delta = pw.charCodeAt(i + 1) - pw.charCodeAt(i);
    if (Math.abs(delta) !== 1 || !alnum(pw[i])) continue;
    let j = i + 1;
    while (j < pw.length && pw.charCodeAt(j) - pw.charCodeAt(j - 1) === delta && alnum(pw[j])) j++;
    if (j - i >= 3) {
      matches.push({ i, j, bits: 4 + Math.log2(j - i), text: `Sequence “${pw.slice(i, j)}”` });
      i = j - 1;
    }
  }
  return matches;
}

function findRepeatsAndNumbers(pw, perChar) {
  const matches = [];
  for (const r of pw.matchAll(/(.+?)\1+/g)) {
    if (r[0].length < 3) continue;
    const times = r[0].length / r[1].length;
    matches.push({ i: r.index, j: r.index + r[0].length, bits: r[1].length * perChar + Math.log2(times), text: `Repeated “${r[1]}” ×${times}` });
  }
  for (const r of pw.matchAll(/(19|20)\d{2}/g)) {
    matches.push({ i: r.index, j: r.index + 4, bits: 7, text: `Year ${r[0]}` });
  }
  for (const r of pw.matchAll(/\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}/g)) {
    matches.push({ i: r.index, j: r.index + r[0].length, bits: 15, text: `Date-like “${r[0]}”` });
  }
  for (const r of pw.matchAll(/\d{7,}/g)) {
    matches.push({ i: r.index, j: r.index + r[0].length, bits: 10 + Math.log2(r[0].length), text: `Long digit run “${r[0]}” (phone/date?)` });
  }
  return matches;
}

// "word-word-word": the repeated separator carries no new entropy after the first one
function findSeparatorRepeats(pw, matches) {
  const words = matches.filter(m => m.dict).sort((a, b) => a.i - b.i);
  const extra = [];
  let separator = null;
  for (let k = 1; k < words.length; k++) {
    const prev = words[k - 1];
    const next = words[k];
    const between = pw[prev.j];
    if (next.i !== prev.j + 1 || !/[^a-z0-9]/i.test(between)) continue;
    if (separator === null) separator = between;
    else if (between === separator) extra.push({ i: prev.j, j: prev.j + 1, bits: 0, text: '' });
  }
  if (extra.length) extra.push({ i: -1, j: -1, bits: 0, text: `Same separator “${separator}” between words` });
  return extra;
}

function resolveOverlaps(matches) {
  matches.sort((a, b) => a.i - b.i || (b.j - b.i) - (a.j - a.i));
  const kept = [];
  let end = 0;
  for (const m of matches) {
    if (m.i < 0) kept.push(m);
    else if (m.i >= end) {
      kept.push(m);
      end = m.j;
    }
  }
  return kept;
}

function buildReasons(pw, classes, kept, bits, pool) {
  const reasons = [];
  const len = pw.length;
  if (len < 8) reasons.push({ kind: 'bad', text: `Very short (${len} characters)` });
  else if (len < 12) reasons.push({ kind: 'bad', text: `Short (${len} characters) — 14+ recommended` });
  else reasons.push({ kind: 'ok', text: `Good length (${len} characters)` });

  const names = { lower: 'lowercase', upper: 'uppercase', digit: 'digits', symbol: 'symbols' };
  const missing = Object.entries(classes).filter(([, present]) => !present).map(([k]) => names[k]);
  const used = 4 - missing.length;
  if (used === 1) reasons.push({ kind: 'bad', text: 'Only one character class' });
  else if (used < 3) reasons.push({ kind: 'bad', text: `Only ${used} character classes — add ${missing.join(' or ')}` });
  else reasons.push({ kind: 'ok', text: `${used} of 4 character classes${missing.length ? ' (no ' + missing.join(', ') + ')' : ''}` });

  kept.filter(m => m.text).forEach(m => reasons.push({ kind: 'bad', text: m.text }));
  if (!kept.length) reasons.push({ kind: 'ok', text: 'No dictionary words, walks or patterns found' });
  reasons.push({ kind: 'info', text: `Guess space ≈ 2^${Math.round(bits)} · alphabet of ${pool} symbols` });
  return reasons;
}

function analyzeRaw(pw) {
  if (!pw.length) {
    return { bits: 0, score: 0, verdict: 'Empty', crack: '—', reasons: [{ kind: 'info', text: 'Type a password to analyse it' }], pool: 0, len: 0 };
  }
  const classes = charClasses(pw);
  const pool = poolSize(classes);
  const perChar = Math.log2(pool);
  const lower = pw.toLowerCase();
  const unleet = [...lower].map(c => LEET[c] || c).join('');

  let matches = [];
  const whole = COMMON_RANK.has(lower) ? lower : COMMON_RANK.has(unleet) ? unleet : null;
  if (whole) {
    const rank = COMMON_RANK.get(whole);
    matches.push({ i: 0, j: pw.length, bits: Math.log2(rank + 2) + (whole !== lower ? 1 : 0), text: `“${pw}” is #${rank + 1} in the common-password list` });
  } else {
    matches = [...findDictionary(pw, lower, unleet), ...findKeyboardWalks(pw, lower), ...findSequences(pw), ...findRepeatsAndNumbers(pw, perChar)];
    matches.push(...findSeparatorRepeats(pw, matches));
  }

  const kept = resolveOverlaps(matches);
  const covered = kept.reduce((sum, m) => sum + Math.max(0, m.j - m.i), 0);
  const patternBits = kept.reduce((sum, m) => sum + m.bits, 0);
  const bits = Math.max(0, patternBits + (pw.length - covered) * perChar);
  const score = bits < 30 ? 0 : bits < 45 ? 1 : bits < 60 ? 2 : bits < 80 ? 3 : 4;
  return { bits, score, verdict: VERDICTS[score], crack: crackTime(bits), reasons: buildReasons(pw, classes, kept, bits, pool), pool, len: pw.length };
}

/** Average time to find the password at 10^10 guesses/s (half the keyspace). */
function crackTime(bits) {
  const seconds = Math.pow(2, bits - 1) / 1e10;
  if (seconds < 1) return 'instantly';
  if (seconds < 60) return Math.round(seconds) + ' seconds';
  if (seconds < 3600) return Math.round(seconds / 60) + ' minutes';
  if (seconds < 86400) return Math.round(seconds / 3600) + ' hours';
  if (seconds < 31557600) return Math.round(seconds / 86400) + ' days';
  const years = seconds / 31557600;
  if (years < 1000) return Math.round(years) + ' years';
  if (years < 1e6) return Math.round(years / 1e3) + ' thousand years';
  if (years < 1e9) return Math.round(years / 1e6) + ' million years';
  if (years < 1e12) return Math.round(years / 1e9) + ' billion years';
  return 'longer than the age of the universe';
}

function meterHTML(a) {
  return `<div class="meter" data-s="${a.len ? a.score : -1}" aria-label="Strength: ${a.verdict}"><i></i><i></i><i></i><i></i><i></i></div>`;
}

function strengthLine(a) {

}

function reasonsHTML(a) {

// ---------- generator (crypto.getRandomValues, unbiased) ----------
function randInt(n) {
  const limit = Math.floor(4294967296 / n) * n;
  let x;
  do {
    x = crypto.getRandomValues(new Uint32Array(1))[0];
  } while (x >= limit);
  return x % n;
}

const pick = list => list[randInt(list.length)];

function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = randInt(i + 1);
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}

const SETS = { lower: 'abcdefghijklmnopqrstuvwxyz', upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', digit: '0123456789', symbol: '!@#$%^&*()-_=+[]{};:,.<>?/~' };
const AMBIG = 'Il1O0o|`\'"{}[]();:,.';
const gen = { mode: 'random', length: 20, lower: true, upper: true, digit: true, symbol: true, noAmbig: false, requireEach: true, words: 5, sep: '-', caps: 'title', suffix: true, plen: 14, pcaps: true, pdigits: true, pinLen: 6 };

function genRandom(o) {
  let sets = ['lower', 'upper', 'digit', 'symbol'].filter(k => o[k]).map(k => SETS[k]);
  if (o.noAmbig) sets = sets.map(s => [...s].filter(c => !AMBIG.includes(c)).join(''));
  sets = sets.filter(Boolean);
  if (!sets.length) sets = [SETS.lower];
  const all = sets.join('');
  const out = [];
  if (o.requireEach) sets.forEach(s => out.push(s[randInt(s.length)]));
  while (out.length < o.length) out.push(all[randInt(all.length)]);
  return { pw: shuffle(out).join(''), bits: o.length * Math.log2(all.length) };
}

function genPassphrase(o) {
  const words = Array.from({ length: o.words }, () => pick(WORDS));
  let bits = o.words * Math.log2(WORDS.length);
  const cased = words.map(w => {
    if (o.caps === 'title') return w[0].toUpperCase() + w.slice(1);
    if (o.caps === 'random') return randInt(2) ? w.toUpperCase() : w;
    return w;
  });
  if (o.caps === 'random') bits += o.words;
  let pw = cased.join(o.sep);
  if (o.suffix) {
    pw += o.sep + randInt(100);
    bits += Math.log2(100);
  }
  return { pw, bits };
}

function genPronounceable(o) {
  const consonants = 'bcdfghjklmnprstvwz';
  const vowels = 'aeiou';
  let pw = '';
  let bits = 0;
  while (pw.length < o.plen) {
    pw += pick(consonants) + pick(vowels);
    bits += Math.log2(consonants.length) + Math.log2(vowels.length);
    if (randInt(2)) {
      pw += pick(consonants);
      bits += Math.log2(consonants.length);
    }
    bits += 1;
  }
  pw = pw.slice(0, o.plen);
  if (o.pcaps) {
    const i = randInt(pw.length);
    pw = pw.slice(0, i) + pw[i].toUpperCase() + pw.slice(i + 1);
    bits += Math.log2(pw.length);
  }
  if (o.pdigits) {
    pw += String(randInt(100)).padStart(2, '0');
    bits += Math.log2(100);
  }
  return { pw, bits };
}

function genPin(o) {
  let pw = '';
  while (pw.length < o.pinLen) pw += randInt(10);
  return { pw, bits: o.pinLen * Math.log2(10) };
}

function generate() {
  if (gen.mode === 'passphrase') return genPassphrase(gen);
  if (gen.mode === 'pronounce') return genPronounceable(gen);
  if (gen.mode === 'pin') return genPin(gen);
  return genRandom(gen);
}

function colorizePw(pw) {
  return [...pw].map(c => {
    if (/\d/.test(c)) return `<span class="d">${esc(c)}</span>`;
    if (/[^a-z0-9]/i.test(c)) return `<span class="s">${esc(c)}</span>`;
    return esc(c);
  }).join('');
}

const VERIFIER = { v: 'pfpm-verifier-1' };

const entries = () => (session.data ? session.data.entries : []);
const trash = () => (session.data ? session.data.trash : []);
const findEntry = id => entries().find(e => e.id === id);

/** Fill defaults so imports and older records have every field the UI expects. */
function normalizeEntry(e) {
  const t = now();
  return {
    id: e.id || uid(), type: TYPES[e.type] ? e.type : 'login', title: e.title || 'Untitled', username: e.username || '', password: e.password || '',
    url: e.url || '', notes: e.notes || '', tags: Array.isArray(e.tags) ? e.tags : [], fav: !!e.fav, color: e.color || COLORS[0],
    fields: Array.isArray(e.fields) ? e.fields : [], history: Array.isArray(e.history) ? e.history : [], totp: e.totp || '',
    rotateDays: Number(e.rotateDays) || 0, created: e.created || t, updated: e.updated || t, pwAt: e.pwAt || e.updated || t, extra: e.extra || {}
  };
}

function ensureDataShape(data) {
  data.entries = (data.entries || []).map(normalizeEntry);
  data.trash = (data.trash || []).map(x => ({ ...normalizeEntry(x), deletedAt: x.deletedAt || now() }));
  data.log = data.log || [];
  data.notices = data.notices || [];
  data.createdAt = data.createdAt || now();
  return data;
}

/** Build a fresh encrypted vault record for `data` under `password` and store it. */
async function createVault(password, data, iterations = prefs.iterations) {
  const salt = rnd(16);
  const key = await deriveKey(password, salt, iterations);
  const rec = {
    format: 'pfpm-vault', version: 2, kdf: 'PBKDF2-SHA-256', iterations, salt: b64(salt), cipher: 'AES-GCM-256',
    verifier: await encryptJSON(key, VERIFIER), data: await encryptJSON(key, ensureDataShape(data)), createdAt: now(), savedAt: now()
  };
  store.set('vault', rec);
  return { key, rec };
}

async function unlockVault(password) {
  const rec = store.get('vault');
  if (!rec) throw new Error('No vault on this device');
  const key = await deriveKey(password, unb64(rec.salt), rec.iterations);
  try {
    const verifier = await decryptJSON(key, rec.verifier);
    if (verifier.v !== VERIFIER.v) throw new Error('bad verifier');
  } catch {
    rememberFailedAttempt();
    throw new Error('Wrong master password');
  }
  session.key = key;
  session.data = ensureDataShape(await decryptJSON(key, rec.data));
  afterUnlock();
}

function rememberFailedAttempt() {
  prefs.failedAttempts = [...(prefs.failedAttempts || []), now()].slice(-20);
  savePrefs();
}

/** Housekeeping that runs with the key in hand: failed-attempt report, trash purge, notices. */
function afterUnlock() {
  const failed = prefs.failedAttempts || [];
  if (failed.length) {
    logEvent('fail', `${plural(failed.length, 'failed unlock attempt')} before this unlock (last ${fmtTime(failed[failed.length - 1])})`);
    addNotice('failed:' + failed[failed.length - 1], 'bad', 'Failed unlock attempts', `${plural(failed.length, 'wrong master password')} was entered while the vault was locked. If that was not you, change the master password.`, null, 'settings');
    prefs.failedAttempts = [];
    savePrefs();
  }
  logEvent('unlock', 'Vault unlocked');
  purgeExpiredTrash();
  refreshNotices();
}

/** Re-encrypt the whole vault JSON with a fresh random IV and persist. */
async function saveVault() {
  if (!session.key) return;
  const rec = store.get('vault');
  if (!rec) return;
  rec.data = await encryptJSON(session.key, session.data);
  rec.savedAt = now();
  store.set('vault', rec);
}

async function changeMasterPassword(oldPw, newPw, iterations) {
  const rec = store.get('vault');
  const oldKey = await deriveKey(oldPw, unb64(rec.salt), rec.iterations);
  try {
    await decryptJSON(oldKey, rec.verifier);
  } catch {
    throw new Error('Current master password is wrong');
  }
  logEvent('master', `Master password changed · ${iterations.toLocaleString('en-PK')} PBKDF2 iterations`);
  const { key } = await createVault(newPw, session.data, iterations);
  session.key = key;
  prefs.iterations = iterations;
  savePrefs();
}

function lock(reason = '') {
  if (session.key) {
    logEvent('lock', reason || 'Vault locked');
    saveVault();
  }
  stopTotp();
  closeModal();
  endTour();
  document.body.classList.remove('rail-open', 'detail-open');

  state.selected = null;

  ['#rows', '#detailPane', '#contentPane', '#railNav'].forEach(sel => { $(sel).innerHTML = ''; });
  $('#q').value = '';

}

// clipboard with timed clear and button feedback
async function copyText(text, label = 'Value', btn) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.append(ta);
    ta.select();
    try { document.execCommand('copy'); } catch { /* ignore */ }
    ta.remove();
  }
  toast(`${label} copied · clipboard clears in ${prefs.clipClear}s`, 'ok', 'copy');
  if (btn) {
    btn.classList.add('copied');
    btn.innerHTML = ic('check');
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = ic('copy');
    }, 1400);
  }
  clearTimeout(clipTimer);
  clipTimer = setTimeout(() => navigator.clipboard.writeText('').catch(() => {}), prefs.clipClear * 1000);
}

const LOG_TONE = { fail: 'bad', delete: 'warn', export: 'warn', unlock: 'ok', restore: 'ok', master: 'ok', item: '', lock: '', import: 'ok', settings: '', copy: '', notice: '' };
const LOG_ICON = { fail: 'alert', delete: 'trash', export: 'download', unlock: 'unlock', restore: 'refresh', master: 'key', item: 'edit', lock: 'lock', import: 'upload', settings: 'settings', copy: 'copy', notice: 'bell' };

function logEvent(kind, text, entryId = null) {
  if (!session.data) return;
  session.data.log.unshift({ id: uid(), at: now(), kind, text, entryId });
  if (session.data.log.length > 400) session.data.log.length = 400;
}

function addNotice(key, tone, title, body, entryId = null, route = null) {
  const list = session.data.notices;
  if (list.some(n => n.key === key)) return;
  list.unshift({ id: uid(), key, tone, title, body, entryId, route, at: now(), read: false, dismissed: false });
}

function cardExpiryState(entry) {
  if (entry.type !== 'card' || !entry.extra.expiry) return null;
  const m = /^(\d{1,2})\s*\/\s*(\d{2,4})$/.exec(entry.extra.expiry.trim());
  if (!m) return null;
  const year = m[2].length === 2 ? 2000 + Number(m[2]) : Number(m[2]);
  const end = new Date(year, Number(m[1]), 0, 23, 59).getTime();
  return { end, expired: end < now(), soon: end - now() < 60 * DAY };
}

/** Rule-based notices (missing-2FA stays on the Health page to keep the inbox focused). Existing notices keep their read state; resolved ones disappear. */
function refreshNotices() {
  if (!session.data) return;
  const active = new Set();
  const want = [];
  const es = entries().filter(e => e.type !== 'note');
  const byPassword = new Map();
  es.forEach(e => {
    if (!e.password) return;
    if (!byPassword.has(e.password)) byPassword.set(e.password, []);
    byPassword.get(e.password).push(e);
  });

  es.forEach(e => {
    if (e.rotateDays > 0) {
      const due = e.pwAt + e.rotateDays * DAY;
      if (due - now() < 7 * DAY) {
        const overdue = due < now();
        want.push(['rotate:' + e.id, overdue ? 'bad' : 'warn', `Rotate password: ${e.title}`, `Scheduled every ${e.rotateDays} days — ${inDays(due)}.`, e.id, 'all/' + e.id]);
      }
    }
    const weak = e.password && (e.type === 'login' || e.type === 'wifi') && analyze(e.password).score <= 1;
    if (weak) {
      want.push(['weak:' + e.id, 'bad', `Weak password: ${e.title}`, `${analyze(e.password).verdict} — cracked ${analyze(e.password).crack}. Generate a new one from the editor.`, e.id, 'all/' + e.id]);
    } else if (!e.rotateDays && e.password && now() - e.pwAt > 365 * DAY) {
      want.push(['old:' + e.id, 'warn', `Old password: ${e.title}`, `Last changed ${ago(e.pwAt)}. Consider rotating it.`, e.id, 'all/' + e.id]);
    }
    const exp = cardExpiryState(e);
    if (exp && exp.expired) want.push(['expired-card:' + e.id, 'warn', `Card expired: ${e.title}`, `Expiry ${e.extra.expiry} has passed. Update the item when the new card arrives.`, e.id, 'all/' + e.id]);
    else if (exp && exp.soon) want.push(['expiring-card:' + e.id, 'acc', `Card expires soon: ${e.title}`, `Expiry ${e.extra.expiry} — ${inDays(exp.end)}.`, e.id, 'all/' + e.id]);
  });

  [...byPassword.values()].filter(g => g.length > 1).forEach(group => {
    const key = 'reused:' + group.map(e => e.id).sort().join(',');
    want.push([key, 'bad', `Password reused ${group.length}×`, `${group.map(e => e.title).join(', ')} share one password — a leak at one site unlocks the others.`, group[0].id, 'health']);
  });

  trash().forEach(t => {
    const purgeAt = t.deletedAt + prefs.trashDays * DAY;
    if (purgeAt - now() < 5 * DAY) want.push(['trash:' + t.id, 'warn', `Trash purge: ${t.title}`, `Deleted ${ago(t.deletedAt)}; it is removed for good ${inDays(purgeAt)}.`, null, 'trash']);
  });

  if (now() - (prefs.lastExport || 0) > 30 * DAY) {
    want.push(['backup', 'acc', 'Make an encrypted backup', prefs.lastExport ? `Last export ${ago(prefs.lastExport)}. Export from Settings and keep the file somewhere safe.` : 'No encrypted export yet. Export from Settings and keep the file somewhere safe.', null, 'settings']);
  }

  want.forEach(([key, tone, title, body, entryId, route]) => {
    active.add(key);
    addNotice(key, tone, title, body, entryId, route);
  });
  session.data.notices = session.data.notices.filter(n => active.has(n.key) || n.key.startsWith('failed:'));
}

function restoreFromTrash(id) {

}

// ---------- item helpers (cards, identities, Wi-Fi) ----------
function luhnValid(number) {
  const digits = (number || '').replace(/\D/g, '');
  if (digits.length < 12) return false;
  let sum = 0;
  let double = false;
  for (let i = digits.length - 1; i >= 0; i--) {
    let d = Number(digits[i]);
    if (double) {
      d *= 2;
      if (d > 9) d -= 9;
    }
    sum += d;
    double = !double;
  }
  return sum % 10 === 0;
}

function cardBrand(number) {
  const d = (number || '').replace(/\D/g, '');
  const two = Number(d.slice(0, 2));
  const four = Number(d.slice(0, 4));
  if (d.startsWith('4')) return 'Visa';
  if (two === 34 || two === 37) return 'American Express';
  if ((two >= 51 && two <= 55) || (four >= 2221 && four <= 2720)) return 'Mastercard';
  if (two === 62) return 'UnionPay';
  if (d.startsWith('22')) return 'PayPak';
  return 'Card';
}

const formatCardNumber = number => (number || '').replace(/\D/g, '').replace(/(.{4})/g, '$1 ').trim();
const maskCardNumber = number => '•••• •••• •••• ' + (number || '').replace(/\D/g, '').slice(-4);
const cnicValid = cnic => /^\d{5}-\d{7}-\d$/.test((cnic || '').trim());

// ---------- modal system ----------
function openModal(html, { wide = false, onClose = null, cls = '' } = {}) {
  const modal = $('#modal');
  const box = $('#modal .box');
  box.innerHTML = html;
  box.classList.toggle('wide', wide);
  modal.className = 'modal open ' + cls;
  $('#scrim').classList.add('open');
  modalClose = onClose;
  const first = box.querySelector('input:not([type=hidden]),select,textarea,button');
  if (first) setTimeout(() => first.focus(), 30);
}

function closeModal() {
  const modal = $('#modal');
  if (!modal.classList.contains('open')) return;
  modal.className = 'modal';
  $('#scrim').classList.remove('open');
  $('#modal .box').innerHTML = '';
  const callback = modalClose;
  modalClose = null;
  if (callback) callback();
}

function modalHead(title, icon = '') {
  return `<div class="modal-head"><h2>${icon ? ic(icon) + ' ' : ''}${title}</h2><button type="button" class="iconbtn" data-close aria-label="Close">${ic('x')}</button></div>`;
}

/** Promise<boolean> confirm dialog; `typed` requires the user to type a word (e.g. DELETE). */
function confirmModal({ title, body, ok = 'Confirm', danger = false, typed = null, icon = 'help' }) {
  return new Promise(resolve => {
    const typedField = typed ? `<label class="f" for="cfType">Type ${esc(typed)} to confirm</label><input id="cfType" class="mono" autocomplete="off" spellcheck="false">` : '';
    openModal(`${modalHead(esc(title), icon)}<div class="muted" style="margin:6px 0 10px">${body}</div>${typedField}
      <div class="modal-foot"><button type="button" class="btn ghost" data-close>Cancel</button><button type="button" class="btn ${danger ? 'danger' : 'primary'}" id="cfOk" ${typed ? 'disabled' : ''}>${esc(ok)}</button></div>`, { onClose: () => resolve(false) });
    if (typed) {
      $('#cfType').addEventListener('input', e => { $('#cfOk').disabled = e.target.value.trim() !== typed; });
    }
    $('#cfOk').onclick = () => {
      modalClose = null;
      closeModal();
      resolve(true);
    };
  });
}

// delegated clicks: close buttons and show/hide toggles for password inputs
document.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) closeModal();
  const toggle = e.target.closest('[data-toggle]');
  if (!toggle) return;
  const input = $('#' + toggle.dataset.toggle);
  if (!input) return;
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  toggle.innerHTML = ic(show ? 'eye-off' : 'eye');
  toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
});

$('#scrim').onclick = () => {
  closeModal();
  document.body.classList.remove('rail-open');
  $('#scrim').classList.remove('open');
};

function protectHTML() {
  const rec = store.get('vault');
  const iterations = rec ? rec.iterations : prefs.iterations;
  const flow = `<div class="cryptoflow">
    <div class="step"><b>Master password</b>never stored</div>${ic('arrow-right')}
    <div class="step"><b>PBKDF2-SHA-256</b>${iterations.toLocaleString('en-PK')} iterations<br>16-byte random salt</div>${ic('arrow-right')}
    <div class="step"><b>AES-GCM-256</b>whole vault = one blob<br>new 12-byte IV per save</div></div>`;
  if (!rec) {
    return flow + '<p class="small muted">No vault yet. The parameters above will be used when you create one.</p>';
  }
  const details = `<dl class="kv">
    <dt>KDF</dt><dd>${esc(rec.kdf)} · ${rec.iterations.toLocaleString('en-PK')} iterations</dd>
    <dt>Salt</dt><dd class="mono">${hex(unb64(rec.salt))}</dd>
    <dt>Cipher</dt><dd>${esc(rec.cipher)} (authenticated — tampering is detected)</dd>
    <dt>Current IV</dt><dd class="mono">${hex(unb64(rec.data.iv))}</dd>
    <dt>Ciphertext</dt><dd>${unb64(rec.data.ct).length.toLocaleString('en-PK')} bytes in <code>localStorage["${NS}vault"]</code></dd>
    <dt>Verifier</dt><dd>AES-GCM encryption of a constant — checkable only with the derived key; no password hash is stored</dd>
    <dt>Last saved</dt><dd>${fmtTime(rec.savedAt)}</dd></dl>`;
  return flow + details + '<p class="small muted" style="margin:10px 0 0">Zero-knowledge: nothing leaves this device, there is no server and no account. Forgetting the master password means the data is gone — by design.</p>';
}

function bindCreateForm() {
  const check = () => {
    const pw = $('#newPw').value;
    const a = analyze(pw);
    $('#newMeter').innerHTML = meterHTML(a) + (a.len ? strengthLine(a) : '');
    const strongEnough = a.len >= 12 && a.score >= 2;
    const match = pw === $('#newPw2').value;
    $('#createBtn').disabled = !(strongEnough && match);
    let info = 'Requirement: 12+ characters and at least a Fair rating.';
    if (a.len && !strongEnough) {
      const firstBad = a.reasons.find(r => r.kind === 'bad');
      info = a.len < 12 ? `Too short — ${plural(12 - a.len, 'more character')} needed.` : 'Too weak — ' + (firstBad ? firstBad.text : '');
    } else if (a.len && !match) {
      info = 'Passwords do not match yet.';
    } else if (a.len) {
      info = 'Looks good. Remember it — there is no reset.';
    }
    $('#newInfo').textContent = info;
  };
  $('#newPw').addEventListener('input', check);
  $('#newPw2').addEventListener('input', check);
  $('#createForm').onsubmit = async ev => {
    ev.preventDefault();
    const btn = $('#createBtn');
    btn.disabled = true;
    btn.innerHTML = `${ic('refresh')} Deriving key…`;
    try {
      const data = { entries: [], trash: [], log: [], notices: [], createdAt: now() };
      const { key } = await createVault($('#newPw').value, data);
      session.key = key;
      session.data = ensureDataShape(data);
      logEvent('unlock', 'Vault created');
      refreshNotices();
      enterApp('Vault created. Add your first item.');
    } catch (err) {
      toast(err.message, 'bad');
      btn.disabled = false;
      btn.innerHTML = `${ic('shield-check')} Create vault`;
    }
  };
}

function bindUnlockForm() {
  $('#unlockForm').onsubmit = async ev => {
    ev.preventDefault();
    const btn = $('#unlockBtn');
    btn.disabled = true;
    btn.innerHTML = `${ic('refresh')} Deriving key…`;
    $('#unlockErr').textContent = '';
    try {
      await unlockVault($('#unlockPw').value);
      demoHint = false;
      lockReason = '';
      enterApp();
    } catch (err) {
      $('#unlockErr').textContent = err.message;
      btn.disabled = false;
      btn.innerHTML = `${ic('unlock')} Unlock`;
      $('#unlockPw').select();
    }
  };
}

  $('#lock').classList.add('out');
  setTimeout(() => {
    $('#lock').style.display = 'none';
    $('#app').classList.add('on');
    route();
    animateIn($('#listPane'));
    if (message) toast(message, 'ok', 'shield-check');
    if (!prefs.tourDone) setTimeout(startTour, 600);
  }, 280);
}

// ---------- onboarding tour (spotlight steps) ----------
const TOUR_STEPS = [
  { target: '#railNav', icon: 'layers', title: 'Everything in one rail', body: 'All items, favourites, item types and tags on top; Health, Generator, Inbox, Trash, the crypto lab and reports below. Counts update live.' },
  { target: '#q', icon: 'search', title: 'Search as you type', body: 'Matches titles, usernames, URLs and tags. Sort by name, recency, weakest password or oldest password with the dropdown.' },
  { target: '#newBtn', icon: 'plus', title: 'Five item types', body: 'Logins, bank cards (with Luhn check and expiry alerts), secure notes, identities and Wi-Fi networks — each with custom fields, tags and history.' },
  { target: '#detailPane', icon: 'shield-check', title: 'Details, codes and analysis', body: 'Reveal or copy a field (the clipboard clears itself), watch live TOTP codes, read the explainable strength verdict and browse password history.' },
  { target: 'a[href="#health"]', icon: 'activity', title: 'Health and the inbox', body: 'The health score, reused-password groups and items to fix. Findings also arrive as inbox notices, and every action is kept in an encrypted activity log.' },
  { target: '#paletteBtn', icon: 'search', title: 'Quick open', body: 'Press Ctrl K (⌘ K) anywhere to jump to an item or run an action. Press ? for all keyboard shortcuts.' },
  { target: '#lockBtn', icon: 'lock', title: 'Lock early, lock often', body: 'Lock manually, after idle minutes or when the tab is hidden. Locking throws the key and the decrypted data away — only ciphertext stays on disk.' }
];
let tourIndex = -1;

function tourTargetVisible(selector) {
  const el = $(selector);
  if (!el) return false;
  const rect = el.getBoundingClientRect();
  return rect.width > 0 && rect.height > 0;
}

function startTour() {
  if (!session.key) return;
  tourIndex = -1;
  closeModal();
  $('#tour').classList.remove('hidden');
  nextTourStep(1);
}

function endTour() {
  tourIndex = -1;
  const tour = $('#tour');
  tour.innerHTML = '';
  tour.classList.add('hidden');
  if (window.innerWidth <= 900) document.body.classList.remove('rail-open');
  window.removeEventListener('resize', positionTour);
}

function finishTour() {
  prefs.tourDone = true;
  savePrefs();
  endTour();
  toast('Tour finished — replay it any time from Settings', 'ok', 'check-circle');
}

function nextTourStep(direction) {
  let next = tourIndex + direction;
  while (next >= 0 && next < TOUR_STEPS.length) {
    const step = TOUR_STEPS[next];
    const needsRail = step.target.startsWith('#rail') || step.target.startsWith('a[href') || step.target === '#lockBtn' || step.target === '#paletteBtn';
    if (window.innerWidth <= 900) document.body.classList.toggle('rail-open', needsRail);
    if (tourTargetVisible(step.target)) break;
    next += direction;
  }
  if (next < 0 || next >= TOUR_STEPS.length) {
    finishTour();
    return;
  }
  tourIndex = next;
  showTourStep();
}

function showTourStep() {
  const step = TOUR_STEPS[tourIndex];
  $('#tour').innerHTML = `<div class="tour-spot" id="tourSpot"></div>
    <div class="tour-card" id="tourCard" role="dialog" aria-label="Tour step">
      <div class="steps">Step ${tourIndex + 1} of ${TOUR_STEPS.length}</div>
      <h3>${ic(step.icon)} ${esc(step.title)}</h3>
      <p class="small muted" style="margin:0">${esc(step.body)}</p>
      <div class="foot"><button class="btn ghost sm" id="tourSkip">Skip tour</button>
        <div style="display:flex;gap:6px"><button class="btn ghost sm" id="tourBack" ${tourIndex === 0 ? 'disabled' : ''}>${ic('arrow-left')} Back</button>
        <button class="btn primary sm" id="tourNext">${tourIndex === TOUR_STEPS.length - 1 ? 'Done' : 'Next'} ${ic('arrow-right')}</button></div></div></div>`;
  $('#tourSkip').onclick = finishTour;
  $('#tourBack').onclick = () => nextTourStep(-1);
  $('#tourNext').onclick = () => nextTourStep(1);
  window.addEventListener('resize', positionTour);
  requestAnimationFrame(positionTour);
}

function positionTour() {
  if (tourIndex < 0) return;
  const target = $(TOUR_STEPS[tourIndex].target);
  const spot = $('#tourSpot');
  const card = $('#tourCard');
  if (!target || !spot || !card) return;
  const r = target.getBoundingClientRect();
  const pad = 6;
  Object.assign(spot.style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + pad * 2 + 'px', height: r.height + pad * 2 + 'px' });
  const cardW = card.offsetWidth;
  const cardH = card.offsetHeight;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  let left = r.right + 16;
  let top = r.top;
  if (r.height > vh * 0.5 || vw <= 900) {
    // tall targets (the rail) or phones: pin the card to the bottom so the spotlight stays visible
    left = clamp((vw - cardW) / 2, 12, vw - cardW - 12);
    top = vh - cardH - 12;
  } else if (left + cardW > vw - 12) {
    left = clamp(r.left, 12, vw - cardW - 12);
    top = r.bottom + 14;
    if (top + cardH > vh - 12) top = Math.max(12, r.top - cardH - 14);
  }
  top = clamp(top, 12, Math.max(12, vh - cardH - 12));
  card.style.left = left + 'px';
  card.style.top = top + 'px';
}

const SHORTCUTS = [
  ['Ctrl K', 'Quick open: jump to an item or run an action'],
  ['N', 'New item (in a vault view)'],
  ['/', 'Focus the search box'],
  ['L', 'Lock the vault'],

    { icon: 'dice', label: 'Password generator', run: () => { location.hash = 'generator'; } },

    { icon: 'trash', label: 'Trash', run: () => { location.hash = 'trash'; } },
