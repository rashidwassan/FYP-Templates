<style>
/* ---------- tokens: editorial (navy, gold, paper cream) ---------- */
:root {
  --paper: #f6f0e2;
  --paper-2: #eee5cf;
  --card: #fffcf4;
  --card-2: #faf4e6;
  --ink: #17213a;
  --ink-2: #34405c;
  --muted: #6c6857;
  --line: #dccfb2;
  --line-2: #c4b089;
  --navy: #152a4e;
  --navy-2: #1f3a6b;
  --navy-soft: #e2e7f1;
  --gold: #a87a22;
  --gold-2: #c99a3e;
  --gold-soft: #f4e6c3;
  --red: #9e3a2b;
  --red-soft: #f5e0d8;
  --green: #36664a;
  --green-soft: #dfebdd;
  --amber: #9a6410;
  --amber-soft: #f7e7c8;
  --violet: #5b4a86;
  --violet-soft: #e9e4f3;
  --primary: var(--navy);
  --on-primary: #fbf6ea;
  --focus: #c99a3e;
  --radius: 6px;
  --radius-lg: 10px;
  --shadow: 0 1px 0 rgba(23, 33, 58, .04), 0 14px 28px -22px rgba(23, 33, 58, .45);
  --shadow-lg: 0 30px 60px -30px rgba(15, 24, 44, .55);
  --serif: "Fraunces", Georgia, "Times New Roman", serif;
  --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --urdu: "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --dur: .35s;
}

/* Night edition (dark theme) */
:root[data-theme="dark"] {
  --paper: #0e1424;
  --paper-2: #131b30;
  --card: #172038;
  --card-2: #1b2541;
  --ink: #efe7d2;
  --ink-2: #cfc6ae;
  --muted: #a39d86;
  --line: #2b3655;
  --line-2: #3d4a70;
  --navy: #9fb6e6;
  --navy-2: #c2d2f3;
  --navy-soft: #1e2a49;
  --gold: #dcae55;
  --gold-2: #e9c072;
  --gold-soft: #3a3020;
  --red: #e58a76;
  --red-soft: #3c2224;
  --green: #8cc59c;
  --green-soft: #1d3329;
  --amber: #e7b056;
  --amber-soft: #3a2e17;
  --violet: #b9a8e8;
  --violet-soft: #2a2442;
  --primary: #dcae55;
  --on-primary: #141a2c;
  --shadow: 0 1px 0 rgba(0, 0, 0, .2), 0 14px 28px -22px rgba(0, 0, 0, .8);
}

:root[data-size="sm"] { font-size: 14.5px; }
:root[data-size="md"] { font-size: 15.5px; }
:root[data-size="lg"] { font-size: 17.5px; }

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { font-size: 15.5px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  line-height: 1.55;
  min-height: 100vh;
  overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.15; font-family: var(--serif); font-weight: 600; letter-spacing: -.01em; }
p { margin: 0 0 .8em; }
a { color: var(--navy-2); text-underline-offset: 3px; }
code, .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: .88em; }
img, svg { max-width: 100%; }
.ic {
  width: 1.1em;
  height: 1.1em;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  vertical-align: -.2em;
  flex: none;
}
.ic.lg { width: 1.6em; height: 1.6em; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.tiny { font-size: .76rem; }
.tnum { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }
.spacer { flex: 1; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.between { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack > * + * { margin-top: 12px; }
.mt { margin-top: 14px; }
.mt2 { margin-top: 24px; }
.mb { margin-bottom: 14px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
::selection { background: var(--gold-soft); }

/* Urdu: Nastaliq for text, sans kept for numerals, dates, codes and charts */
html.ur body { font-family: var(--urdu), var(--sans); line-height: 2; }
html.ur h1, html.ur h2, html.ur h3, html.ur h4 { font-family: var(--urdu), var(--serif); line-height: 1.8; letter-spacing: 0; font-weight: 700; }
html.ur .tnum, html.ur .num, html.ur .kpi .v, html.ur .chart, html.ur .cal .dn, html.ur .kbd, html.ur code, html.ur .ltr { font-family: var(--sans); line-height: 1.35; }
html.ur .brand-name { font-family: var(--serif); line-height: 1.1; }
html.ur .kicker { letter-spacing: 0; text-transform: none; }
html.ur .btn, html.ur .chip, html.ur .seg button, html.ur .sections a { line-height: 1.7; }
html.ur input, html.ur textarea, html.ur select { line-height: 1.9; }
.ur-text { font-family: var(--urdu); direction: rtl; line-height: 2.1; }
.ltr { direction: ltr; unicode-bidi: isolate; }

/* ---------- motion kit ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
html.rm *, html.rm *::before, html.rm *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
@keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }
@keyframes slideIn { from { transform: translateX(var(--from, 100%)); } to { transform: none; } }
@keyframes toastIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(8px); } }
.enter { animation: fadeUp var(--dur) var(--ease) both; }
.stagger > * { animation: fadeUp .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
.btn { transition: transform .15s var(--ease), box-shadow .15s var(--ease), background .15s, border-color .15s; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0) scale(.98); }
.card, .tile { transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s; }
.card.lift:hover, .tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.fill, .bar > i { transition: width .6s var(--ease); }
.skeleton {
  background: linear-gradient(90deg, var(--paper-2) 25%, var(--card) 50%, var(--paper-2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.2s infinite;
}

/* ---------- buttons, chips, forms ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 40px;
  padding: 8px 15px;
  border-radius: var(--radius);
  border: 1px solid var(--primary);
  background: var(--primary);
  color: var(--on-primary);
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
}
.btn:hover { box-shadow: 0 8px 18px -12px rgba(21, 42, 78, .7); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-2); }
.btn.ghost:hover { border-color: var(--ink-2); background: var(--card); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #fffaf0; }
.btn.danger { background: transparent; color: var(--red); border-color: var(--red); }
.btn.sm { min-height: 34px; padding: 5px 11px; font-size: .86rem; }
.btn.icon { padding: 0; width: 40px; }
.btn.sm.icon { width: 34px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--navy-2); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 999px;
  border: 1px solid var(--line-2);
  background: var(--card);
  font-size: .8rem;
  font-weight: 600;
  white-space: nowrap;
  color: var(--ink-2);
}
button.chip { cursor: pointer; min-height: 32px; }
button.chip.on { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.chip.gold { background: var(--gold-soft); border-color: transparent; color: var(--gold); }
.chip.navy { background: var(--navy-soft); border-color: transparent; color: var(--navy-2); }
.chip.green { background: var(--green-soft); border-color: transparent; color: var(--green); }
.chip.red { background: var(--red-soft); border-color: transparent; color: var(--red); }
.chip.amber { background: var(--amber-soft); border-color: transparent; color: var(--amber); }
.chip.violet { background: var(--violet-soft); border-color: transparent; color: var(--violet); }
.tag { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--gold); }
.verify {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: .74rem;
  font-style: italic;
  color: var(--amber);
}
label.field, .field { display: grid; gap: 5px; font-size: .85rem; font-weight: 600; color: var(--ink-2); min-width: 0; }
.field .hint { font-weight: 400; color: var(--muted); font-size: .78rem; }
input[type="text"], input[type="search"], input[type="number"], input[type="date"], input[type="email"], input[type="url"], input[type="month"], select, textarea {
  width: 100%;
  min-height: 40px;
  padding: 8px 11px;
  border: 1px solid var(--line-2);
  border-radius: var(--radius);
  background: var(--card);
  color: var(--ink);
  font-weight: 400;
  min-width: 0;
}
textarea { resize: vertical; line-height: 1.6; }
input:focus, select:focus, textarea:focus { border-color: var(--gold-2); outline: 2px solid var(--gold-soft); outline-offset: 0; }
input[type="checkbox"], input[type="radio"] { width: 18px; height: 18px; accent-color: var(--navy); }
:root[data-theme="dark"] input[type="checkbox"], :root[data-theme="dark"] input[type="radio"] { accent-color: var(--gold); }
input[type="range"] { width: 100%; accent-color: var(--gold); }
.check { display: flex; gap: 9px; align-items: flex-start; font-weight: 500; cursor: pointer; }
.check input { margin-top: 3px; flex: none; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--radius); overflow: hidden; background: var(--card); max-width: 100%; }
.seg button { border: 0; background: transparent; padding: 7px 13px; cursor: pointer; font-weight: 600; font-size: .86rem; min-height: 36px; white-space: nowrap; }
.seg button + button { border-inline-start: 1px solid var(--line); }
.seg button.on { background: var(--primary); color: var(--on-primary); }
.switch { position: relative; display: inline-block; width: 46px; height: 26px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line-2); cursor: pointer; transition: background .2s; }
.switch span::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s var(--ease); }
.switch input:checked + span { background: var(--green); }
.switch input:checked + span::after { transform: translateX(20px); }
[dir="rtl"] .switch input:checked + span::after { transform: translateX(-20px); }
.switch input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
.kbd { display: inline-block; min-width: 26px; padding: 2px 7px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; background: var(--card); font-size: .78rem; font-weight: 700; text-align: center; }

/* ---------- surfaces ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.card h3 { font-size: 1.15rem; margin-bottom: 10px; display: flex; gap: 8px; align-items: center; }
.card h3 .ic { color: var(--gold); }
.panel { border-top: 2px solid var(--ink); padding-top: 12px; min-width: 0; }
.panel > h3 { font-size: 1.05rem; text-transform: uppercase; letter-spacing: .06em; font-family: var(--sans); font-weight: 700; margin-bottom: 10px; display: flex; gap: 8px; align-items: center; }
html.ur .panel > h3 { text-transform: none; letter-spacing: 0; font-family: var(--urdu); }
.kicker { font-size: .74rem; text-transform: uppercase; letter-spacing: .14em; font-weight: 700; color: var(--gold); display: inline-flex; gap: 6px; align-items: center; }
.rule { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
.rule.double { border-top: 3px double var(--ink); }
.empty { text-align: center; padding: 30px 16px; color: var(--muted); }
.empty .ic { width: 2.2em; height: 2.2em; color: var(--line-2); display: block; margin: 0 auto 8px; }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: var(--radius); background: var(--amber-soft); color: var(--ink); font-size: .86rem; border-inline-start: 3px solid var(--amber); }
.notice .ic { color: var(--amber); margin-top: 3px; }
.notice.info { background: var(--navy-soft); border-color: var(--navy-2); }
.notice.info .ic { color: var(--navy-2); }
.bar { height: 8px; border-radius: 999px; background: var(--paper-2); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--gold); border-radius: inherit; }
.bar.navy > i { background: var(--navy-2); }
.bar.green > i { background: var(--green); }
.bar.red > i { background: var(--red); }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 14px 16px; min-width: 0; }
.kpi .k { font-size: .76rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; display: flex; gap: 6px; align-items: center; }
html.ur .kpi .k { text-transform: none; letter-spacing: 0; }
.kpi .k .ic { color: var(--gold); }
.kpi .v { font-family: var(--serif); font-size: 2rem; font-weight: 600; line-height: 1.1; margin-top: 6px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi .s { font-size: .78rem; color: var(--muted); }

/* ---------- masthead + nav ---------- */
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }
.masthead { background: var(--paper); }
.dateline { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .78rem; color: var(--muted); }
.dateline .ed { font-style: italic; font-family: var(--serif); }
html.ur .dateline .ed { font-family: var(--urdu); font-style: normal; }
.tools { display: flex; gap: 6px; align-items: center; margin-inline-start: auto; }
.tbtn {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 5px 10px;
  border: 1px solid transparent;
  border-radius: var(--radius);
  background: transparent;
  color: var(--ink-2);
  font-weight: 600;
  font-size: .82rem;
  cursor: pointer;
}
.tbtn:hover { border-color: var(--line-2); background: var(--card); }
.tbtn .dot {
  position: absolute;
  top: -3px;
  inset-inline-end: -3px;
  min-width: 18px;
  height: 18px;
  padding: 0 4px;
  border-radius: 999px;
  background: var(--red);
  color: #fff;
  font-size: .68rem;
  display: grid;
  place-items: center;
  font-family: var(--sans);
  direction: ltr;
}
.tbtn .kbd { padding: 0 5px; min-width: 0; font-size: .7rem; }
.brandrow { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 16px 0 12px; text-align: center; }
.crest { width: 46px; height: 46px; flex: none; }
.brand-name { font-family: var(--serif); font-size: clamp(1.9rem, 4vw, 2.9rem); font-weight: 600; letter-spacing: -.02em; line-height: 1; color: var(--ink); text-decoration: none; }
.brand-name em { font-style: italic; color: var(--gold); font-weight: 500; }
.brand-sub { font-family: var(--serif); font-style: italic; color: var(--muted); font-size: .92rem; margin-top: 3px; }
html.ur .brand-sub { font-family: var(--urdu); font-style: normal; }
.sections {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--paper);
  border-top: 3px double var(--ink);
  border-bottom: 1px solid var(--ink);
}
.sections nav { display: flex; justify-content: center; gap: 2px; flex-wrap: wrap; }
.sections a {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 11px;
  font-size: .78rem;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--ink-2);
  text-decoration: none;
  border-bottom: 3px solid transparent;
  margin-bottom: -1px;
  white-space: nowrap;
}
html.ur .sections a { text-transform: none; letter-spacing: 0; font-size: .86rem; padding: 6px 10px; }
.sections a .ic { color: var(--gold); }
.sections a:hover { color: var(--ink); }
.sections a.on { color: var(--ink); border-bottom-color: var(--gold); }
.sections a .n { background: var(--navy); color: var(--on-primary); border-radius: 999px; font-size: .66rem; padding: 0 6px; letter-spacing: 0; }
main#view { padding: 26px 0 70px; min-height: 60vh; }
.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-bottom: 14px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
.pagehead h1 { font-size: clamp(1.7rem, 3vw, 2.4rem); }
.pagehead .dek { font-family: var(--serif); font-style: italic; color: var(--muted); font-size: 1.02rem; margin-top: 6px; max-width: 760px; }
html.ur .pagehead .dek { font-family: var(--urdu); font-style: normal; }
.pagehead .actions { display: flex; gap: 8px; flex-wrap: wrap; }
footer.colophon { border-top: 3px double var(--ink); padding: 18px 0 90px; font-size: .8rem; color: var(--muted); }
footer.colophon p { margin: 0 0 4px; }

/* ---------- mobile chrome: bottom bar + section drawer ---------- */
.bottombar { display: none; }
.scrim { position: fixed; inset: 0; background: rgba(12, 18, 33, .45); z-index: 80; animation: fadeIn .2s var(--ease); }
.drawer {
  position: fixed;
  top: 0;
  bottom: 0;
  inset-inline-end: 0;
  width: min(560px, 100%);
  background: var(--paper);
  z-index: 90;
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  --from: 100%;
  animation: slideIn .32s var(--ease);
}
[dir="rtl"] .drawer { --from: -100%; }
.drawer .dhead { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 3px double var(--ink); }
.drawer .dhead h2 { font-size: 1.3rem; flex: 1; min-width: 0; }
.drawer .dbody { flex: 1; overflow-y: auto; padding: 18px; }
.drawer.left { inset-inline-end: auto; inset-inline-start: 0; width: min(320px, 86%); --from: -100%; }
[dir="rtl"] .drawer.left { --from: 100%; }
.menu-list a { display: flex; align-items: center; gap: 10px; padding: 11px 6px; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; font-weight: 600; }
.menu-list a.on { color: var(--gold); }
.menu-list a .ic { color: var(--gold); }

/* ---------- small helpers ---------- */
.skip { position: absolute; inset-inline-start: 12px; top: -60px; z-index: 200; }
.skip:focus { top: 10px; }
.grow { flex: 1; min-width: 0; }
.nowrap { flex-wrap: nowrap; }
.mt-s { margin-top: 8px; }
.center { text-align: center; }
.red-t { color: var(--red); }
.chip-txt.red { color: var(--red); }
.chip-txt.amber { color: var(--amber); }
.chip-txt.green { color: var(--green); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.inline { width: auto; min-height: 36px; padding: 5px 9px; }
.num { width: 90px; }
.narrow { max-width: 420px; }
.printonly { display: none; }
.inputicon { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--card); padding: 0 10px; min-width: 0; }
.inputicon input { border: 0; background: transparent; padding-inline: 0; outline: 0; }
.inputicon:focus-within { border-color: var(--gold-2); outline: 2px solid var(--gold-soft); }
.inputicon .ic { color: var(--muted); }
.inputicon.big input { font-size: 1.1rem; min-height: 50px; }
input.invalid { border-color: var(--red); background: var(--red-soft); }
.seg.full { display: flex; width: 100%; }
.seg.full button { flex: 1; padding-inline: 6px; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 4px 0; border-bottom: 1px dotted var(--line); }
ul.plain li:last-child { border-bottom: 0; }
h4.sub { font-size: .95rem; display: flex; align-items: center; gap: 7px; margin-bottom: 8px; font-family: var(--sans); font-weight: 700; }
h4.sub .ic { color: var(--gold); }
.swrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: .86rem; font-weight: 600; cursor: pointer; }
.rowlink { background: none; border: 0; padding: 0; text-align: start; font: inherit; font-weight: 700; color: var(--ink); cursor: pointer; font-family: var(--serif); font-size: 1.02rem; line-height: 1.3; }
html.ur .rowlink { font-family: var(--urdu); line-height: 1.9; }
.rowlink:hover { color: var(--navy-2); text-decoration: underline; text-underline-offset: 3px; }
.cover { position: absolute; inset: 0; z-index: 1; border-radius: inherit; }
.star.on { color: var(--gold); border-color: var(--gold); }
.star.on .ic { fill: var(--gold); }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 18px 0 16px; overflow-x: auto; scrollbar-width: none; }
.tabs a { padding: 9px 14px; text-decoration: none; color: var(--muted); font-weight: 700; font-size: .9rem; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tabs a.on { color: var(--ink); border-bottom-color: var(--gold); }
.tabs a:hover { color: var(--ink); }
.pagehead.slim { margin-bottom: 12px; padding-bottom: 8px; }

/* ---------- database ---------- */
.db-layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 22px; align-items: start; }
.filters { position: sticky; top: 56px; }
.filters > summary { display: flex; gap: 8px; align-items: center; font-weight: 700; cursor: pointer; list-style: none; }
.filters > summary::-webkit-details-marker { display: none; }
.filters > summary .ic { color: var(--gold); }
.fbody { display: grid; gap: 14px; margin-top: 12px; }
.covicons { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.cov { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--navy-soft); color: var(--navy-2); }
.cov .ic { width: .95em; height: .95em; }
.cov-T, .cov-S { background: var(--navy-2); color: var(--on-primary); }
:root[data-theme="dark"] .cov-T, :root[data-theme="dark"] .cov-S { color: #141a2c; }
.covkey { display: grid; gap: 4px; padding-top: 8px; border-top: 1px solid var(--line); }
.covkey span { display: flex; gap: 6px; align-items: center; }
.covkey .ic { color: var(--navy-2); }
.switches { display: grid; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--card); }
table.data { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.data th { text-align: start; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 10px 10px; border-bottom: 2px solid var(--ink); background: var(--card-2); white-space: nowrap; position: sticky; top: 0; }
html.ur table.data th { text-transform: none; letter-spacing: 0; font-size: .8rem; }
table.data td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.data tbody tr:hover td { background: var(--card-2); }
table.data tr:last-child td { border-bottom: 0; }
.c-cmp { width: 34px; text-align: center; }
.c-name { min-width: 230px; }
.ctry { display: inline-flex; gap: 4px; align-items: center; font-weight: 700; color: var(--ink-2); }
.c-act { white-space: nowrap; text-align: end; }
table.data td.tnum, .nowrap-t { white-space: nowrap; }
.c-act .btn + .btn { margin-inline-start: 4px; }
.opendot { display: inline-flex; align-items: center; gap: 4px; font-size: .72rem; font-weight: 700; color: var(--green); }
.opendot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
.match { min-width: 70px; }
.match b { font-size: .9rem; }
.match .bar { height: 5px; margin-top: 3px; }
.match.green b { color: var(--green); }
.match.red b { color: var(--red); }
.drawer ul.plain li { font-size: .9rem; }
.drawer-actions { position: sticky; bottom: -18px; background: var(--paper); padding: 14px 0 4px; margin-top: 18px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; }
ul.reasons { list-style: none; padding: 0; margin: 0; display: grid; gap: 5px; }
ul.reasons li { display: flex; gap: 8px; align-items: flex-start; font-size: .86rem; line-height: 1.45; }
ul.reasons li .ic { margin-top: 3px; }
ul.reasons li.pass .ic { color: var(--green); }
ul.reasons li.fail { color: var(--red); }
ul.reasons li.warn .ic { color: var(--amber); }
ul.reasons li.info .ic { color: var(--navy-2); }
html.ur ul.reasons li { line-height: 1.9; }
table.compare th, table.compare td { min-width: 200px; }
table.compare th[scope="row"] { min-width: 140px; position: static; background: var(--card-2); border-bottom: 1px solid var(--line); }

/* ---------- quiz ---------- */
.quiz { max-width: 860px; margin: 0 auto; }
.steps { list-style: none; padding: 0; margin: 16px 0 6px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.steps li { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--muted); font-weight: 600; }
.steps li b, .steps li .ic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line-2); flex: none; font-size: .8rem; padding: 4px; }
.steps li.on { color: var(--ink); }
.steps li.on b { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.steps li.done .ic { background: var(--green); color: #fff; border-color: var(--green); }
.qtitle { font-size: 1.5rem; margin: 18px 0 14px; }
.radiocards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.rcard { position: relative; display: grid; justify-items: center; gap: 6px; padding: 14px 8px; border: 1px solid var(--line-2); border-radius: var(--radius-lg); background: var(--card); text-align: center; cursor: pointer; font-weight: 600; font-size: .85rem; transition: border-color .15s, background .15s, transform .15s var(--ease); }
.rcard:hover { transform: translateY(-1px); }
.rcard input { position: absolute; opacity: 0; }
.rcard .ic { width: 1.6em; height: 1.6em; color: var(--gold); }
.rcard.on { border-color: var(--primary); background: var(--navy-soft); box-shadow: inset 0 0 0 1px var(--primary); }
.rcard:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.quiz-res { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 24px; align-items: start; }
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.mcard.inel { opacity: .82; }
.mhead { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.mcard details summary { cursor: pointer; color: var(--navy-2); margin: 8px 0 4px; font-weight: 600; }
.ring { width: 54px; height: 54px; flex: none; }
.ring circle { fill: none; stroke-width: 6; }
.ring .track { stroke: var(--paper-2); }
.ring .val { stroke: var(--navy-2); stroke-linecap: round; transition: stroke-dashoffset .8s var(--ease); }
.ring.green .val { stroke: var(--green); }
.ring.red .val { stroke: var(--red); }
.ring text { font: 700 14px var(--sans); fill: var(--ink); }
.bands { display: flex; gap: 10px; align-items: flex-end; height: 120px; }
.band { flex: 1; display: grid; justify-items: center; gap: 2px; height: 100%; grid-template-rows: 1fr auto auto; }
.bcol { width: 100%; height: 100%; display: flex; align-items: flex-end; background: var(--paper-2); border-radius: 4px; overflow: hidden; }
.bcol i { display: block; width: 100%; background: var(--navy-2); border-radius: 4px 4px 0 0; transition: height .6s var(--ease); }
.band:last-child .bcol i { background: var(--green); }

/* ---------- pipeline ---------- */
.toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.stagetabs { display: none; margin-bottom: 12px; }
.kanban { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; align-items: start; }
.kcol { background: var(--paper-2); border-radius: var(--radius-lg); padding: 10px; min-height: 300px; border: 1px dashed transparent; transition: border-color .15s, background .15s; min-width: 0; }
.kcol.over { border-color: var(--gold); background: var(--gold-soft); }
.kcol header { display: flex; align-items: center; gap: 7px; }
.kcol header .ic { color: var(--gold); }
.kcol header h3 { font-size: 1rem; flex: 1; }
.kcol header .count { font-size: .78rem; font-weight: 700; background: var(--card); border-radius: 999px; padding: 1px 9px; border: 1px solid var(--line); }
.kcol > p { margin: 2px 0 8px; }
.kcards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 9px; }
.kcard { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 11px 8px; box-shadow: var(--shadow); cursor: grab; border-inline-start: 4px solid var(--line-2); display: grid; gap: 6px; min-width: 0; transition: transform .15s var(--ease), box-shadow .15s; }
.kcard:hover { transform: translateY(-2px); }
.kcard.pr-1 { border-inline-start-color: var(--gold); }
.kcard.pr-2 { border-inline-start-color: var(--navy-2); }
.kcard.dragging { opacity: .45; }
.kcard h4 { font-size: 1rem; line-height: 1.25; }
html.ur .kcard h4 { line-height: 1.8; }
.kcard h4 a { color: var(--ink); text-decoration: none; }
.kcard h4 a:hover { text-decoration: underline; }
.kcard .between { gap: 4px; }
.kcard .chip { font-size: .72rem; padding: 2px 7px; }
.kmeta { display: flex; gap: 10px; flex-wrap: wrap; font-size: .76rem; color: var(--muted); }
.kmeta b { color: var(--ink); }
.kcard .bar { height: 5px; }
.kmove { display: flex; justify-content: space-between; align-items: center; }
.kmove .btn.icon { width: 30px; min-height: 30px; }
.grip { color: var(--line-2); }
.kempty { border: 1px dashed var(--line-2); border-radius: var(--radius); padding: 18px 8px; text-align: center; font-size: .8rem; color: var(--muted); }

/* ---------- application detail ---------- */
.stepper { list-style: none; padding: 0; margin: 0 0 6px; display: grid; grid-template-columns: repeat(5, 1fr); position: relative; }
.stepper li { display: grid; justify-items: center; gap: 2px; text-align: center; position: relative; font-size: .82rem; font-weight: 600; color: var(--muted); }
.stepper li::before { content: ""; position: absolute; top: 19px; inset-inline-start: -50%; width: 100%; height: 2px; background: var(--line-2); z-index: 0; }
.stepper li:first-child::before { display: none; }
.stepper li.done::before, .stepper li.on::before { background: var(--gold); }
.stepper button { position: relative; z-index: 1; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line-2); background: var(--card); color: var(--muted); display: grid; place-items: center; cursor: pointer; transition: transform .15s var(--ease); }
.stepper button:hover { transform: scale(1.06); }
.stepper li.done button { background: var(--gold); border-color: var(--gold); color: #fff; }
.stepper li.on button { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.stepper li.on { color: var(--ink); }
.timeline { list-style: none; padding: 0; margin: 0; border-inline-start: 2px solid var(--line); }
.timeline li { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0 12px; margin-inline-start: -15px; }
.tl-ic { width: 28px; height: 28px; border-radius: 50%; background: var(--card); border: 2px solid var(--gold); display: grid; place-items: center; flex: none; color: var(--gold); }
.timeline li.note .tl-ic { border-color: var(--navy-2); color: var(--navy-2); }
.timeline li > div { flex: 1; min-width: 0; }

/* ---------- documents ---------- */
.doclist { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.clhead { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 14px; }
.clhead > .grow { flex: 1 1 240px; }
.docrow { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); border-inline-start: 4px solid var(--line-2); }
.docrow.st-ready { border-inline-start-color: var(--green); }
.docrow.st-submitted { border-inline-start-color: var(--navy-2); }
.docrow.st-missing { border-inline-start-color: var(--red); }
.docrow.st-progress { border-inline-start-color: var(--amber); }
.docrow.st-na { opacity: .6; }
.docic { width: 34px; height: 34px; border-radius: 8px; background: var(--paper-2); display: grid; place-items: center; color: var(--gold); flex: none; }
.docname { font-weight: 700; }
.docnote { margin-top: 6px; min-height: 32px; padding: 4px 8px; font-size: .82rem; background: transparent; border-style: dashed; }
.warnline { color: var(--red); font-weight: 600; margin-top: 2px; }
select.st-ready, select.st-submitted { color: var(--green); font-weight: 700; }
select.st-missing { color: var(--red); font-weight: 700; }
select.st-progress, select.st-asked { color: var(--amber); font-weight: 700; }
details.acc summary { display: flex; gap: 10px; align-items: center; cursor: pointer; list-style: none; padding: 2px 0 10px; }
details.acc summary::-webkit-details-marker { display: none; }
details.acc summary::before { content: ""; width: 8px; height: 8px; border-inline-end: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .2s; flex: none; }
[dir="rtl"] details.acc summary::before { transform: rotate(45deg); }
details.acc[open] summary::before { transform: rotate(45deg); }
[dir="rtl"] details.acc[open] summary::before { transform: rotate(45deg); }
.remlist { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.rem { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); font-size: .88rem; }
.rem a { color: var(--ink); text-decoration: none; font-weight: 600; }
.rem a:hover { text-decoration: underline; }
.remic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--navy-soft); color: var(--navy-2); }
.rem.deadline .remic, .rem.overdue .remic, .rem.expired .remic { background: var(--red-soft); color: var(--red); }
.rem.expiring .remic, .rem.intake .remic, .rem.docs .remic { background: var(--amber-soft); color: var(--amber); }
.rem.referee .remic { background: var(--violet-soft); color: var(--violet); }
.ic.ok { color: var(--green); }

/* ---------- essays ---------- */
.egrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.ecard { position: relative; display: grid; gap: 8px; align-content: start; }
.ecard h3 { font-size: 1.15rem; margin: 0; display: block; }
.ecard .excerpt { font-family: var(--serif); color: var(--ink-2); font-size: .92rem; margin: 0; min-height: 4.2em; }
.ecard .bar { height: 5px; }
.bankgrid { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.bankitem { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 12px 14px; display: grid; gap: 6px; }
.bankitem p { margin: 0; font-family: var(--serif); color: var(--ink-2); }
.banklist { list-style: none; padding: 0; margin: 0 0 10px; display: grid; gap: 8px; max-height: 62vh; overflow-y: auto; }
.editor { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 22px; align-items: start; }
.ed-side { position: sticky; top: 56px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 12px; max-height: calc(100vh - 80px); overflow-y: auto; }
.prompt { background: var(--gold-soft); border-radius: var(--radius); padding: 8px 12px; margin-bottom: 10px; font-size: .9rem; }
.prompt summary { font-weight: 700; cursor: pointer; }
.prompt p { margin: 6px 0 2px; font-style: italic; }
.ed-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
textarea.paper {
  min-height: 56vh;
  padding: 26px 30px;
  font-family: var(--serif);
  font-size: 1.06rem;
  line-height: 1.8;
  background: var(--card);
  border-color: var(--line);
  border-inline-start: 4px double var(--gold-2);
  box-shadow: var(--shadow);
}
.meter { position: sticky; bottom: 0; background: var(--paper); padding: 10px 2px 8px; display: grid; gap: 5px; border-top: 1px solid var(--line); margin-top: 8px; }
.structure { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.structure li { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; padding: 7px 4px; border-bottom: 1px dotted var(--line); }
.structure li .check > span { display: grid; gap: 1px; }
.structure li.done b { color: var(--green); }
.gauge { width: 170px; height: 100px; }
.gauge path { fill: none; stroke-width: 10; stroke-linecap: round; }
.gauge .track { stroke: var(--paper-2); }
.gauge .val { stroke: var(--gold); }
.gauge text { font: 700 20px var(--serif); fill: var(--ink); }
.statrow { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dotted var(--line); font-size: .88rem; }
.statrow.bad b { color: var(--red); }
.versions { list-style: none; padding: 0; margin: 12px 0 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.versions li { display: grid; gap: 6px; padding: 8px 0; border-bottom: 1px dotted var(--line); }
.diff { font-family: var(--serif); line-height: 1.8; white-space: pre-wrap; max-height: 60vh; overflow-y: auto; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.diff ins { background: var(--green-soft); color: var(--green); text-decoration: none; border-radius: 3px; }
.diff del { background: var(--red-soft); color: var(--red); border-radius: 3px; }

/* ---------- referees ---------- */
.ref-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; align-items: start; }
.refgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
.refcard h3 { margin-bottom: 2px; }
.refcard > .between { flex-wrap: nowrap; align-items: flex-start; }
.refcard > .between > div:first-child { min-width: 0; flex: 1; }
.reqs { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; margin: 12px 0; }
.refreq { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card-2); }
.refreq .grow { min-width: 160px; }
.list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.tips { padding-inline-start: 20px; margin: 0 0 10px; display: grid; gap: 8px; font-size: .88rem; }
textarea.ur-text { font-family: var(--urdu); line-height: 2.2; }

/* ---------- calendar ---------- */
.cal-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; align-items: start; }
.calmonth { font-size: 1.6rem; }
.kchip.on.k-deadline { background: var(--red); border-color: var(--red); color: #fff; }
.kchip.on.k-estimate { background: var(--line-2); border-color: var(--line-2); color: var(--ink); }
.kchip.on.k-interview { background: var(--navy-2); border-color: var(--navy-2); color: var(--on-primary); }
.kchip.on.k-expiry { background: var(--amber); border-color: var(--amber); color: #fff; }
.kchip.on.k-referee { background: var(--violet); border-color: var(--violet); color: #fff; }
.kchip.on.k-custom, .kchip.on.k-test { background: var(--green); border-color: var(--green); color: #fff; }
.cal { border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; background: var(--card); }
.cal-head, .cal-body { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cal-head div { padding: 7px; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--muted); background: var(--card-2); border-bottom: 2px solid var(--ink); text-align: center; }
html.ur .cal-head div { text-transform: none; letter-spacing: 0; font-size: .82rem; }
.cell { min-height: 92px; border-inline-end: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cell:nth-child(7n) { border-inline-end: 0; }
.cell.empty { background: var(--paper-2); opacity: .5; }
.cell .dn { align-self: flex-start; border: 0; background: none; font: 600 .82rem var(--sans); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; color: var(--ink-2); }
.cell .dn:hover { background: var(--paper-2); }
.cell.today .dn { background: var(--gold); color: #fff; }
.cell.sel { background: var(--navy-soft); }
.pills { display: grid; gap: 2px; min-width: 0; }
.pill { display: flex; gap: 4px; align-items: center; font-size: .7rem; font-weight: 600; padding: 2px 5px; border-radius: 4px; text-decoration: none; color: var(--ink); background: var(--paper-2); min-width: 0; line-height: 1.3; }
.pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pill .ic { width: .95em; height: .95em; flex: none; }
.pill.k-deadline { background: var(--red-soft); color: var(--red); }
.pill.k-estimate { background: transparent; border: 1px dashed var(--line-2); color: var(--muted); }
.pill.k-interview { background: var(--navy-soft); color: var(--navy-2); }
.pill.k-expiry { background: var(--amber-soft); color: var(--amber); }
.pill.k-referee { background: var(--violet-soft); color: var(--violet); }
.pill.k-custom, .pill.k-test { background: var(--green-soft); color: var(--green); }
.more { border: 0; background: none; color: var(--navy-2); cursor: pointer; text-align: start; padding: 0 4px; }
.dots { display: none; gap: 3px; flex-wrap: wrap; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.dots i.k-deadline { background: var(--red); }
.dots i.k-interview { background: var(--navy-2); }
.dots i.k-expiry { background: var(--amber); }
.dots i.k-referee { background: var(--violet); }
.dots i.k-custom, .dots i.k-test { background: var(--green); }
.agenda { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; }
.agrow { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; border-bottom: 1px dotted var(--line); font-size: .88rem; }
.agrow a { color: var(--ink); font-weight: 600; text-decoration: none; }
.agrow a:hover { text-decoration: underline; }
.agic { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; flex: none; background: var(--paper-2); color: var(--muted); }
.agrow.k-deadline .agic { background: var(--red-soft); color: var(--red); }
.agrow.k-interview .agic { background: var(--navy-soft); color: var(--navy-2); }
.agrow.k-expiry .agic { background: var(--amber-soft); color: var(--amber); }
.agrow.k-referee .agic { background: var(--violet-soft); color: var(--violet); }
.agrow.k-custom .agic, .agrow.k-test .agic { background: var(--green-soft); color: var(--green); }
.agday + .agday { margin-top: 10px; }
.agdate { font-size: .82rem; border-bottom: 1px solid var(--ink); padding-bottom: 2px; }
.agdate2 { display: grid; justify-items: center; min-width: 38px; padding: 2px 4px; border: 1px solid var(--line-2); border-radius: 6px; line-height: 1.1; background: var(--card); }
.agdate2 b { font-family: var(--serif); font-size: 1.15rem; }
.planner { display: grid; gap: 3px; margin-top: 10px; overflow-x: auto; }
.wrow { display: grid; grid-template-columns: 200px minmax(360px, 1fr); gap: 8px; align-items: center; }
.wname { min-width: 0; overflow: hidden; }
.wname .rowlink { font-size: .84rem; font-family: var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; max-width: 100%; }
.wcells { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 2px; }
.wm { font-size: .68rem; color: var(--muted); text-align: center; font-weight: 700; }
.wc { height: 16px; background: var(--paper-2); border-radius: 3px; }
.wc.on { background: var(--navy-2); }
.wc.on.close { background: var(--gold); }

/* ---------- statistics + charts ---------- */
.kpis.six { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.kpis.col { grid-template-columns: 1fr 1fr; }
.funnel, .hbars { display: grid; gap: 10px; }
.frow, .hrow { display: grid; grid-template-columns: 150px minmax(0, 1fr) 70px; gap: 10px; align-items: center; font-size: .86rem; }
.frow b, .hrow b { text-align: end; }
.flabel { display: flex; gap: 6px; align-items: center; }
.flabel .ic { color: var(--gold); }
.hlabel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fbar { height: 14px; }
.donutwrap { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.donut { width: 150px; height: 150px; flex: none; }
.donut circle { fill: none; stroke-width: 16; }
.donut .track { stroke: var(--paper-2); }
.donut text { font: 600 22px var(--serif); fill: var(--ink); }
.seg-awarded, .sw.seg-awarded { stroke: var(--green); background: var(--green); }
.seg-waitlist, .sw.seg-waitlist { stroke: var(--amber); background: var(--amber); }
.seg-rejected, .sw.seg-rejected { stroke: var(--red); background: var(--red); }
.seg-pending, .sw.seg-pending { stroke: var(--navy-2); background: var(--navy-2); }
.legend { list-style: none; padding: 0; margin: 0; display: grid; gap: 5px; font-size: .86rem; }
.legend li { display: flex; gap: 7px; align-items: center; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }
svg.line { width: 100%; height: auto; }
svg.line .grid { stroke: var(--line); stroke-dasharray: 3 4; }
svg.line .axis { font: 600 11px var(--sans); fill: var(--muted); }
svg.line .stroke { fill: none; stroke: var(--navy-2); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
svg.line .area { fill: var(--navy-soft); opacity: .7; }
svg.line .dot { fill: var(--card); stroke: var(--gold); stroke-width: 2; }

/* ---------- funding ---------- */
.fund-layout { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 22px; align-items: start; }
.fund-layout aside { position: sticky; top: 56px; }
.verdict { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--radius-lg); font-weight: 600; }
.verdict p { margin: 0; }
.verdict .ic { width: 1.5em; height: 1.5em; flex: none; }
.verdict.ok { background: var(--green-soft); color: var(--green); }
.verdict.gap { background: var(--red-soft); color: var(--red); }
.fund-layout .kpi .v { font-size: 1.35rem; }
.sbrow { display: grid; grid-template-columns: 80px minmax(0, 1fr) 80px; gap: 10px; align-items: center; margin: 8px 0; font-size: .86rem; }
.sbrow b { text-align: end; }
.stackbar { display: flex; height: 18px; border-radius: 4px; overflow: hidden; background: var(--paper-2); }
.stackbar i { display: block; height: 100%; transition: width .6s var(--ease); }
.s1 { background: var(--navy-2); }
.s2 { background: var(--gold); }
.s3 { background: var(--violet); }
.s4 { background: var(--red); }
.s5 { background: var(--muted); }
.i1 { background: var(--green); }
.i2 { background: #8cb89a; }
.fund-layout .legend { grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 10px 0; }

/* ---------- guides ---------- */
.ggrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.gcard { position: relative; display: grid; gap: 8px; align-content: start; }
.gcard h3 { font-size: 1.2rem; margin: 0; display: block; }
.gcard p { margin: 0; color: var(--ink-2); font-family: var(--serif); }
.gcard.featured { grid-column: span 2; grid-row: span 2; background: var(--navy); color: var(--on-primary); border-color: var(--navy); }
:root[data-theme="dark"] .gcard.featured { background: var(--card-2); color: var(--ink); }
.gcard.featured h3 { font-size: clamp(1.6rem, 3vw, 2.3rem); }
.gcard.featured p, .gcard.featured .muted { color: inherit; opacity: .9; }
.gcard.featured .kicker { color: var(--gold-2); }
.dropcap::first-letter { float: inline-start; font-family: var(--serif); font-size: 3.3em; line-height: .85; padding-inline-end: 8px; padding-top: 4px; color: var(--gold); font-weight: 600; }
html.ur .dropcap::first-letter { float: none; font-size: inherit; padding: 0; color: inherit; }
.guide { max-width: 1060px; margin: 0 auto; }
.ghead { border-bottom: 3px double var(--ink); padding-bottom: 14px; margin-bottom: 20px; }
.ghead h1 { font-size: clamp(2rem, 4vw, 3rem); margin: 8px 0; }
.ghead .dek { font-family: var(--serif); font-style: italic; font-size: 1.15rem; color: var(--muted); }
html.ur .ghead .dek { font-family: var(--urdu); font-style: normal; }
.gbody { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 30px; align-items: start; }
.gtext { font-family: var(--serif); font-size: 1.08rem; line-height: 1.75; max-width: 680px; }
html.ur .gtext { font-family: var(--urdu); line-height: 2.2; }
.gtext h2 { font-size: 1.35rem; margin: 22px 0 8px; }
.gtext section:first-child h2 { margin-top: 0; }
.twin { color: var(--muted); font-size: .95em; border-inline-start: 3px solid var(--gold-soft); padding-inline-start: 12px; }
.twin.ur-text { font-family: var(--urdu); }
.gcheck { position: sticky; top: 56px; }
.gnav { display: flex; justify-content: space-between; gap: 14px; margin-top: 30px; border-top: 1px solid var(--line); padding-top: 14px; }
.gnav a { display: flex; gap: 10px; align-items: center; color: var(--ink); text-decoration: none; font-weight: 600; max-width: 48%; }
.gnav a.nx { text-align: end; }

/* ---------- front page ---------- */
.front { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 30px; align-items: center; }
.headline { font-size: clamp(2rem, 4.4vw, 3.4rem); line-height: 1.05; margin: 10px 0 12px; letter-spacing: -.02em; }
html.ur .headline { line-height: 1.7; }
.lead .dek { font-family: var(--serif); font-style: italic; font-size: 1.12rem; color: var(--ink-2); }
html.ur .lead .dek { font-family: var(--urdu); font-style: normal; }
.u-red { color: var(--red); }
.u-amber { color: var(--amber); }
.u-green { color: var(--green); }
.leadbar { max-width: 520px; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 26px; }
.agenda.compact .agrow { align-items: center; }
.matches { padding-inline-start: 18px; margin: 0 0 8px; display: grid; gap: 6px; }
.matches li { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.matches .rowlink { font-size: .95rem; }
.glance { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; height: 150px; }
.gcol { display: grid; grid-template-rows: auto 1fr auto; justify-items: center; gap: 4px; text-decoration: none; color: var(--ink-2); text-align: center; min-width: 0; }
.gv { font-family: var(--serif); font-size: 1.4rem; font-weight: 600; color: var(--ink); }
.gbar { width: 70%; background: var(--paper-2); border-radius: 4px; display: flex; align-items: flex-end; overflow: hidden; }
.gbar i { display: block; width: 100%; background: var(--navy-2); border-radius: 4px 4px 0 0; }
.gcol:last-child .gbar i { background: var(--gold); }
.opening li { display: grid; gap: 1px; }
.opening .rowlink { font-size: .95rem; }
.feature .ftitle { font-size: 1.35rem; margin: 6px 0; }

/* ---------- inbox, report, settings, palette, about ---------- */
.notices { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.notice-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
.notice-row.unread { border-inline-start: 4px solid var(--gold); background: var(--card-2); }
.notice-row a { color: var(--ink); font-weight: 600; text-decoration: none; }
.notice-row.unread a { font-weight: 700; }
.actlog { list-style: none; padding: 0; margin: 0; }
.actlog li { display: grid; grid-template-columns: 120px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px dotted var(--line); font-size: .9rem; }
.report { max-width: 920px; margin: 0 auto; padding: 28px 34px; }
.report section { margin-top: 20px; }
.report h3 { font-size: 1.1rem; border-bottom: 2px solid var(--ink); padding-bottom: 4px; margin-bottom: 10px; }
.rhead { border-bottom: 3px double var(--ink); padding-bottom: 12px; }
.rhead .brand-name { font-size: 1.6rem; }
.rhead h2 { font-size: 1.5rem; margin: 6px 0 2px; }
.small-v { font-size: 1.2rem !important; }
.settings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px; }
.setrow { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px dotted var(--line); }
.setrow .sl { font-weight: 600; }
.modal .setrow { padding: 7px 0; }
.palette { display: grid; gap: 10px; padding-top: 34px; }
.gfeat { display: grid; gap: 6px; margin-top: 8px; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, .25); }
.gfeat h4 { font-size: 1.1rem; }
.gfeat ul { margin: 4px 0 0; padding-inline-start: 18px; display: grid; gap: 3px; font-size: .9rem; opacity: .9; }
.pslist { list-style: none; padding: 0; margin: 0; max-height: 52vh; overflow-y: auto; }
.psgroup { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; color: var(--gold); padding: 8px 8px 2px; }
html.ur .psgroup { text-transform: none; letter-spacing: 0; font-size: .82rem; }
.psitem { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: var(--radius); cursor: pointer; }
.psitem.on, .psitem:hover { background: var(--navy-soft); }
.psitem .ic { color: var(--gold); }
.about { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 30px; align-items: start; }
.todos { padding-inline-start: 18px; margin: 0; display: grid; gap: 12px; }
.todos p { margin: 4px 0; }

/* ---------- modal, toast, tour ---------- */
.modal {
  position: fixed;
  z-index: 95;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(560px, calc(100% - 28px));
  max-height: calc(100vh - 40px);
  overflow-y: auto;
  background: var(--paper);
  border-radius: var(--radius-lg);
  border-top: 4px solid var(--gold);
  box-shadow: var(--shadow-lg);
  padding: 22px;
  animation: modalIn .28s var(--ease);
}
@keyframes modalIn { from { opacity: 0; transform: translate(-50%, -48%) scale(.97); } to { opacity: 1; transform: translate(-50%, -50%); } }
.modal.wide { width: min(860px, calc(100% - 28px)); }
.modal h3 { font-size: 1.3rem; margin-bottom: 12px; display: flex; gap: 8px; align-items: center; padding-inline-end: 40px; }
.modal h3 .ic { color: var(--gold); }
.mclose { position: absolute; top: 12px; inset-inline-end: 12px; }
.toasts { position: fixed; bottom: 22px; inset-inline-end: 22px; z-index: 120; display: grid; gap: 8px; max-width: calc(100% - 44px); }
.toast { display: flex; gap: 9px; align-items: center; background: var(--ink); color: var(--paper); padding: 11px 15px; border-radius: var(--radius); box-shadow: var(--shadow-lg); font-weight: 600; font-size: .9rem; animation: toastIn .3s var(--ease); }
.toast.ok .ic { color: #8fd3a5; }
.toast.bad .ic { color: #f0a090; }
.toast.out { animation: toastOut .35s var(--ease) forwards; }
.tour { display: none; position: fixed; inset: 0; z-index: 150; }
.tour.on { display: block; }
#tourSpot { position: fixed; border-radius: 10px; box-shadow: 0 0 0 9999px rgba(12, 18, 33, .62); transition: all .3s var(--ease); pointer-events: none; outline: 2px solid var(--gold-2); }
#tourTip { position: fixed; background: var(--paper); border-radius: var(--radius-lg); border-top: 4px solid var(--gold); padding: 16px 18px; box-shadow: var(--shadow-lg); animation: pop .25s var(--ease); }
#tourTip h4 { font-size: 1.2rem; margin: 4px 0 6px; }
#tourTip p { font-size: .92rem; color: var(--ink-2); }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .kpis.six { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .kanban { grid-template-columns: repeat(5, minmax(200px, 1fr)); overflow-x: auto; padding-bottom: 8px; }
  .front { grid-template-columns: minmax(0, 1fr) 320px; }
  .editor { grid-template-columns: minmax(0, 1fr) 290px; }
}
@media (max-width: 980px) {
  .db-layout, .quiz-res, .cal-layout, .fund-layout, .ref-layout, .gbody, .about, .front { grid-template-columns: minmax(0, 1fr); }
  .filters, .fund-layout aside, .gcheck { position: static; }
  .fund-layout aside { order: -1; }
  .cols3 { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .settings { grid-template-columns: minmax(0, 1fr); }
  .ggrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .editor { grid-template-columns: minmax(0, 1fr); }
  .ed-side { position: static; max-height: none; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpis.col { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .sections { display: none; }
  .bottombar {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 60;
    background: var(--paper);
    border-top: 3px double var(--ink);
    padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
  }
  .bottombar a, .bottombar button { position: relative; display: grid; justify-items: center; gap: 1px; padding: 6px 2px; font-size: .68rem; font-weight: 700; color: var(--muted); text-decoration: none; background: none; border: 0; cursor: pointer; min-height: 48px; }
  .bottombar .ic { width: 1.35em; height: 1.35em; }
  .bottombar .on { color: var(--ink); }
  .bottombar .on .ic { color: var(--gold); }
  .bottombar .n { position: absolute; top: 2px; inset-inline-end: 22%; background: var(--red); color: #fff; border-radius: 999px; font-size: .62rem; padding: 0 5px; }
  html.ur .bottombar a, html.ur .bottombar button { font-size: .74rem; line-height: 1.5; }
  .stagetabs { display: flex; overflow-x: auto; }
  .kanban { display: block; overflow: visible; }
  .kcol { display: none; min-height: 0; }
  .kcol.on { display: block; }
  .toasts { bottom: 80px; }
}
@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  main#view { padding-top: 18px; }
  .hide-sm, .tbtn .lbl, .tbtn .kbd { display: none; }
  .dateline { font-size: .72rem; gap: 6px; }
  .dateline .ed { display: none; }
  .brandrow { padding: 10px 0 8px; gap: 10px; }
  .crest { width: 36px; height: 36px; }
  .brand-sub { font-size: .8rem; }
  .pagehead h1 { font-size: 1.6rem; }
  .pagehead .actions { width: 100%; }
  .card { padding: 14px; }
  .kpis, .kpis.col, .kpis.six { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .kpi { padding: 10px 12px; }
  .kpi .v { font-size: 1.55rem; }
  .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); }
  .radiocards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .steps { grid-template-columns: repeat(4, auto); }
  .steps li span { display: none; }
  .ggrid { grid-template-columns: minmax(0, 1fr); }
  .gcard.featured { grid-column: auto; grid-row: auto; }
  .mgrid, .egrid, .bankgrid, .refgrid { grid-template-columns: minmax(0, 1fr); }
  .tablewrap { border: 0; background: transparent; overflow: visible; }
  table.data:not(.compare) thead { display: none; }
  table.data:not(.compare), table.data:not(.compare) tbody, table.data:not(.compare) tr, table.data:not(.compare) td { display: block; width: 100%; }
  table.data:not(.compare) tr { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg); margin-bottom: 10px; padding: 8px 12px; position: relative; }
  table.data:not(.compare) td { border: 0; padding: 4px 0; display: flex; gap: 10px; justify-content: space-between; align-items: center; text-align: end; }
  table.data:not(.compare) td[data-label]::before { content: attr(data-label); font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; text-align: start; flex: none; }
  html.ur table.data:not(.compare) td[data-label]::before { text-transform: none; letter-spacing: 0; }
  table.data:not(.compare) td.c-name { display: block; text-align: start; padding-inline-end: 30px; }
  table.data:not(.compare) td.c-cmp { position: absolute; top: 10px; inset-inline-end: 8px; width: auto; padding: 0; }
  table.data:not(.compare) td.c-act { justify-content: flex-end; border-top: 1px dotted var(--line); padding-top: 8px; margin-top: 4px; }
  table.data:not(.compare) td .chips { justify-content: flex-end; }
  .tablewrap:has(table.compare) { border: 1px solid var(--line); background: var(--card); overflow-x: auto; }
  table.compare th, table.compare td { min-width: 170px; }
  table.compare th[scope="row"] { min-width: 100px; }
  .docrow { flex-wrap: wrap; }
  .docrow > .grow { flex: 1 1 calc(100% - 50px); }
  .docrow > select { flex: 1; margin-inline-start: 44px; }
  textarea.paper { padding: 16px; font-size: 1rem; min-height: 50vh; }
  .cell { min-height: 54px; padding: 2px; }
  .cell .pills { display: none; }
  .dots { display: flex; justify-content: center; }
  .cell .dn { align-self: center; }
  .calmonth { font-size: 1.3rem; }
  .wrow { grid-template-columns: 110px minmax(300px, 1fr); }
  .frow, .hrow { grid-template-columns: 110px minmax(0, 1fr) 54px; }
  .sbrow { grid-template-columns: 64px minmax(0, 1fr) 64px; }
  .stepper li { font-size: .68rem; }
  .stepper li > span.tiny { display: none; }
  .stepper button { width: 34px; height: 34px; }
  .stepper li::before { top: 16px; }
  .glance { height: 130px; }
  .actlog li { grid-template-columns: 1fr; gap: 0; }
  .report { padding: 18px 14px; }
  .modal { padding: 18px 16px; }
  .gnav { flex-direction: column; }
  .gnav a { max-width: 100%; }
  .headline { font-size: 2rem; }
  .toolbar .inline { width: 100%; }
}

/* ---------- print ---------- */
@media print {
  @page { margin: 14mm; }
  :root { --paper: #fff; --card: #fff; --card-2: #fff; --ink: #000; --line: #bbb; }

  main#view { padding: 0; }
  .card, .kpi, .panel, .tablewrap { box-shadow: none; break-inside: avoid; }
  .editor .ed-main { display: none; }
  .printonly { display: block !important; }

  .kcol { display: block !important; break-inside: avoid; margin-bottom: 8pt; }
  details { display: block; }
  details > summary { list-style: none; }
  .enter, .stagger > * { animation: none !important; }
}

/* =====================================================================
   ScholarTrack — Scholarship Tracker & Application Manager (single file)
   utils · i18n · scholarship catalogue · guides · state + seed · matcher ·
   database · compare · quiz · pipeline · application detail · documents ·
   essays · referees · calendar (.ics) · statistics · funding calculator ·
   guides reader · front page · inbox · report · search palette ·
   settings · tour · shortcuts · about · router / boot
   Student extension points are marked with  TODO(student)

'use strict';

// ---------- utils ----------
// TODO(student): cloud sync and accounts — keep this `store` interface but back it with an authenticated API
//   (Supabase, Firebase or Node + Postgres). Give every record an `updated` timestamp, push changes in the background,
//   pull on boot, and resolve conflicts per record (newest wins, or a merge dialog for essays). Keep localStorage as
//   the offline cache so the app still opens without a connection.
const NS = 'st:';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const store = {
  get(k, d) {
    try {
      const v = localStorage.getItem(NS + k);
      return v == null ? d : JSON.parse(v);
    } catch {
      return d;
    }
  },
  set(k, v) {
    try {
      localStorage.setItem(NS + k, JSON.stringify(v));
      return true;
    } catch {
      return false;
    }
  },
  remove(k) {
    try {
      localStorage.removeItem(NS + k);
    } catch {
      /* storage blocked */
    }
  },
  keys() {
    const out = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(NS)) out.push(k.slice(NS.length));
      }
    } catch {
      /* storage blocked */
    }
    return out;
  },
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const ic = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const sum = arr => arr.reduce((a, b) => a + (+b || 0), 0);
const bdi = s => `<bdi class="tnum">${s}</bdi>`;

function debounce(fn, ms = 200) {
  let timer = 0;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), ms);
  };
}

// FNV-1a string hash and mulberry32 PRNG for deterministic seed data.
function hashStr(text) {
  let h = 2166136261;
  for (let i = 0; i < text.length; i++) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let x = a;
    x = Math.imul(x ^ (x >>> 15), x | 1);
    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- dates ----------
const DAY = 864e5;
const startOfDay = d => {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  return x;
};
const TODAY = startOfDay(Date.now());
const iso = d => {
  const x = new Date(d);
  const m = String(x.getMonth() + 1).padStart(2, '0');
  const day = String(x.getDate()).padStart(2, '0');
  return `${x.getFullYear()}-${m}-${day}`;
};
const parseISO = s => {
  if (!s) return null;
  const [y, m, d] = String(s).slice(0, 10).split('-').map(Number);
  if (!y || !m || !d) return null;
  return new Date(y, m - 1, d);
};
const addDays = (d, n) => {
  const x = new Date(d);
  x.setDate(x.getDate() + n);
  return x;
};
const isoIn = n => iso(addDays(TODAY, n));
const daysUntil = s => {
  const d = parseISO(s);
  return d ? Math.round((startOfDay(d) - TODAY) / DAY) : null;
};
const lastDayOfMonth = (y, m) => new Date(y, m, 0).getDate();

// ---------- download / files / clipboard ----------
function downloadText(name, text, mime = 'application/json') {
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function pickFile(accept, onText) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = accept;
  input.onchange = () => {
    const f = input.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => onText(String(reader.result), f);
    reader.readAsText(f);
  };
  input.click();
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast(t('copied'), 'ok');
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.append(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    toast(t('copied'), 'ok');
  }
}

// ---------- feedback: toast + aria-live ----------
function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icon = type === 'ok' ? 'check-circle' : type === 'bad' ? 'alert-circle' : 'info';
  el.innerHTML = ic(icon) + '<span></span>';
  el.lastChild.textContent = msg;
  $('#toasts').append(el);
  setTimeout(() => el.classList.add('out'), 2900);
  setTimeout(() => el.remove(), 3300);
}

function announce(msg) {
  const live = $('#live');
  live.textContent = '';
  setTimeout(() => (live.textContent = msg), 30);
}

// ---------- motion helpers ----------
function animateIn(root) {
  if (!root) return;
  root.classList.remove('enter');
  void root.offsetWidth;
  root.classList.add('enter');
  $$('.stagger', root).forEach(g => [...g.children].forEach((el, i) => el.style.setProperty('--i', Math.min(i, 14))));
  animateMetrics(root);
}

function countUp(el, to, fmt = v => Math.round(v).toLocaleString('en-PK')) {
  const reduce = document.documentElement.classList.contains('rm') || matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    el.textContent = fmt(to);
    return;
  }
  const t0 = performance.now();
  const step = nowTs => {
    const p = Math.min(1, (nowTs - t0) / 700);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(to * e);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function drawPath(p) {
  const len = p.getTotalLength();
  p.style.strokeDasharray = len;
  p.style.strokeDashoffset = len;
  p.getBoundingClientRect();
  p.style.transition = 'stroke-dashoffset .9s var(--ease)';
  p.style.strokeDashoffset = 0;
}

// Animate KPI numbers, progress bars and chart lines inside a freshly rendered root (each element only once).
function animateMetrics(root) {
  const fresh = sel => $$(sel, root).filter(el => !el.dataset.anim && (el.dataset.anim = '1'));
  fresh('[data-count]').forEach(el => {
    const fmts = { money: v => fmtMoney(v), compact: v => fmtCompactPKR(v), pct: v => Math.round(v) + '%' };
    const fmt = fmts[el.dataset.fmt];
    countUp(el, +el.dataset.count, fmt);
  });
  fresh('.bar > i[data-w]').forEach(i => requestAnimationFrame(() => (i.style.width = i.dataset.w + '%')));
  fresh('path.draw').forEach(drawPath);
}

// ---------- modal / drawer / confirm ----------
let lastFocus = null;

function openModal(html, { wide = false, onClose = null } = {}) {
  closeModal(true);
  lastFocus = document.activeElement;
  const root = $('#overlay');
  root.innerHTML = `<div class="scrim" data-close></div>
    <div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">
      <button class="btn ghost sm icon mclose" data-close aria-label="${t('close')}">${ic('x')}</button>
      ${html}
    </div>`;
  root.dataset.kind = 'modal';
  root._onClose = onClose;
  $$('[data-close]', root).forEach(b => (b.onclick = () => closeModal()));
  const first = $('.modal input, .modal select, .modal textarea, .modal button:not(.mclose)', root);
  (first || $('.mclose', root)).focus();
  return $('.modal', root);
}

function openDrawer(title, html, { side = 'end', onClose = null } = {}) {
  closeModal(true);
  lastFocus = document.activeElement;
  const root = $('#overlay');
  root.innerHTML = `<div class="scrim" data-close></div>
    <aside class="drawer ${side === 'start' ? 'left' : ''}" role="dialog" aria-modal="true" aria-label="${title}">
      <div class="dhead"><h2>${title}</h2><button class="btn ghost sm icon" data-close aria-label="${t('close')}">${ic('x')}</button></div>
      <div class="dbody">${html}</div>
    </aside>`;
  root.dataset.kind = 'drawer';
  root._onClose = onClose;
  $$('[data-close]', root).forEach(b => (b.onclick = () => closeModal()));
  const btn = $('.drawer [data-close]', root);
  if (btn) btn.focus();
  return $('.drawer', root);
}

function closeModal(silent = false) {
  const root = $('#overlay');
  if (!root || !root.innerHTML) return;
  const cb = root._onClose;
  root.innerHTML = '';
  root.dataset.kind = '';
  root._onClose = null;
  if (cb && !silent) cb();
  if (!silent && lastFocus && document.contains(lastFocus)) lastFocus.focus();
}

const isOverlayOpen = () => !!$('#overlay').innerHTML;

// Confirmation modal; `typed` requires the user to type a word (e.g. RESET).
function confirmBox(message, onYes, { typed = '', yesLabel = '' } = {}) {
  const field = typed ? `<label class="field mt">${t('typeToConfirm', { w: typed })}<input type="text" id="cfType" autocomplete="off"></label>` : '';
  openModal(`<h3>${ic('alert')} ${t('areYouSure')}</h3><p class="muted">${message}</p>${field}
    <div class="row mt"><span class="spacer"></span><button class="btn ghost" data-close>${t('cancel')}</button><button class="btn danger" id="cfYes">${yesLabel || t('confirm')}</button></div>`);
  $$('#overlay [data-close]').forEach(b => (b.onclick = () => closeModal()));
  $('#cfYes').onclick = () => {
    if (typed && $('#cfType').value.trim() !== typed) {
      toast(t('typeToConfirm', { w: typed }), 'bad');
      return;
    }
    closeModal(true);
    onYes();
  };
}

// Focus trap for open dialogs (Tab cycles inside the overlay).
document.addEventListener('keydown', e => {
  if (e.key !== 'Tab' || !isOverlayOpen()) return;
  const items = $$('#overlay button, #overlay input, #overlay select, #overlay textarea, #overlay a[href]').filter(el => !el.disabled && el.offsetParent !== null);
  if (!items.length) return;
  const first = items[0];
  const last = items[items.length - 1];
  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault();
    last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
  }
});

// ---------- i18n ----------
// Strings are [English, Urdu] pairs. Each module registers its own strings with defineStrings().
const STR = {};
let lang = store.get('lang', 'en') === 'ur' ? 'ur' : 'en';

function defineStrings(obj) {
  Object.assign(STR, obj);
}

function t(key, vars) {
  const pair = STR[key];
  if (!pair) {
    console.warn('i18n: missing key', key);
    return key;
  }
  let s = pair[lang === 'ur' ? 1 : 0] ?? pair[0];
  if (vars) s = s.replace(/\{(\w+)\}/g, (_, k) => (vars[k] ?? ''));
  return s;
}

// Translate in a specific language (used for stored bilingual notices).
function tIn(l, key, vars) {
  const prev = lang;
  lang = l;
  try {
    return t(key, vars);
  } finally {
    lang = prev;
  }
}

// [en, ur] pair for a key; varsFor(l) supplies language-specific variables.
const both = (key, varsFor = () => ({})) => ['en', 'ur'].map(l => tIn(l, key, varsFor(l)));

// Bilingual data values: [en, ur] arrays or {en, ur} objects.
function tr(v) {
  if (v == null) return '';
  if (Array.isArray(v)) return v[lang === 'ur' ? 1 : 0] || v[0];
  if (typeof v === 'object') return v[lang] || v.en || '';
  return String(v);
}

const MONTHS = {
  en: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'],
  ur: ['جنوری', 'فروری', 'مارچ', 'اپریل', 'مئی', 'جون', 'جولائی', 'اگست', 'ستمبر', 'اکتوبر', 'نومبر', 'دسمبر'],
};
const WEEKDAYS = {
  en: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
  ur: ['پیر', 'منگل', 'بدھ', 'جمعرات', 'جمعہ', 'ہفتہ', 'اتوار'],
};
const WEEKDAYS_LONG = {
  en: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'],
  ur: ['پیر', 'منگل', 'بدھ', 'جمعرات', 'جمعہ', 'ہفتہ', 'اتوار'],
};
const monthName = m => MONTHS[lang][(m + 12) % 12];
const monthShort = m => (lang === 'ur' ? MONTHS.ur[(m + 12) % 12] : MONTHS.en[(m + 12) % 12].slice(0, 3));

function fmtDate(v, long = false) {
  const d = v instanceof Date ? v : parseISO(v);
  if (!d) return '—';
  const month = long ? monthName(d.getMonth()) : monthShort(d.getMonth());
  return `${d.getDate()} ${month} ${d.getFullYear()}`;
}

function fmtDateLong(d) {
  const wd = WEEKDAYS_LONG[lang][(d.getDay() + 6) % 7];
  return `${wd}, ${fmtDate(d, true)}`;
}

// Relative day label: today / tomorrow / in N days / N days ago.
function relDays(n) {
  if (n == null) return '—';
  if (n === 0) return t('today');
  if (n === 1) return t('tomorrow');
  if (n === -1) return t('yesterday');
  return n > 0 ? t('inDays', { n }) : t('daysAgo', { n: -n });
}

// Urgency class for a number of days remaining.
const urgency = n => (n == null ? '' : n < 0 ? 'red' : n <= 7 ? 'red' : n <= 21 ? 'amber' : 'green');

const fmtNum = n => Math.round(+n || 0).toLocaleString('en-PK');
const fmtMoney = (n, cur = 'PKR') => `${cur} ${fmtNum(n)}`;

function fmtCompactPKR(n) {
  const v = Math.round(+n || 0);
  if (Math.abs(v) >= 1e7) return 'PKR ' + (v / 1e7).toFixed(2).replace(/\.?0+$/, '') + (lang === 'ur' ? ' کروڑ' : ' cr');
  if (Math.abs(v) >= 1e5) return 'PKR ' + (v / 1e5).toFixed(1).replace(/\.0$/, '') + (lang === 'ur' ? ' لاکھ' : ' lakh');
  return fmtMoney(v);
}

// ---------- typical windows and estimated deadlines ----------
function inWindow(s, month) {
  if (!s.w) return true;
  const [open, close] = s.w;
  return open <= close ? month >= open && month <= close : month >= open || month <= close;
}

const isOpenNow = s => inWindow(s, TODAY.getMonth() + 1);

// Last day of the closing month, on or after today (rolling windows have no estimate).
function typicalDeadline(s) {
  if (!s || !s.w) return '';
  const close = s.w[1];
  let year = TODAY.getFullYear();
  let d = new Date(year, close - 1, lastDayOfMonth(year, close));
  if (d < TODAY) {
    year += 1;
    d = new Date(year, close - 1, lastDayOfMonth(year, close));
  }
  return iso(d);
}

function windowText(s) {
  if (!s.w) return t('rolling');
  return `${monthShort(s.w[0] - 1)} – ${monthShort(s.w[1] - 1)}`;
}

const appSch = a => schById(a.sch) || { id: a.sch, n: [a.sch, a.sch], p: ['', ''], c: 'MULTI', lv: [], f: ['any'], e: {}, docs: '', cov: '' };
const appDeadline = a => a.deadline || typicalDeadline(appSch(a));
const appName = a => tr(appSch(a).n);
const intakeDate = a => (a.intake ? parseISO(a.intake + '-01') : null);

function fmtIntake(v) {
  const d = v ? parseISO(v + '-01') : null;
  return d ? `${monthShort(d.getMonth())} ${d.getFullYear()}` : '—';
}

// ---------- activity log ----------
function logActivity(key, vars = {}) {
  const log = store.get('activity', []);
  log.unshift({ ts: Date.now(), key, vars });
  store.set('activity', log.slice(0, 200));
}

function activityText(entry) {
  const vars = { ...entry.vars };
  if (vars.s) vars.s = schById(vars.s) ? tr(schById(vars.s).n) : vars.s;
  if (vars.stage) vars.stage = t('st_' + vars.stage);
  return t(entry.key, vars);
}
