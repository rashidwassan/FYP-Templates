// ---------- the farm page ----------
function renderFarm() {
  view.innerHTML = `<div class="game">
    <div class="hud paper" id="hud">${hudHTML()}</div>
    <div class="farmstage paper" id="farmBox">${farmSVG()}</div>
    <aside class="panel paper" id="panel" aria-label="${t('farm_actions')}">${panelHTML()}</aside>
    <section class="ticker paper" id="logBox">${logHTML()}</section>
  </div>`;
  $('#fabs').innerHTML = `<button class="btn soil" id="fabSheet">${ic('grid')} ${t('plot')}</button>
    <button class="btn gold" id="fabEnd" ${g.over ? 'disabled' : ''}>${ic('arrow-right')} ${t('end_month')}</button>`;
  $('#fabs').style.display = '';
  bindFarm();
  animateIn(view);
  if (ui.prevCash != null && ui.prevCash !== g.cash) {
    countUp($('#hudCash'), g.cash, { from: ui.prevCash, fmt: rsk });
    ui.prevCash = null;
  }
}
// Re-render only the farm parts when the farm page is showing (keeps the panel scroll position).
function refreshFarm() {
  if (!$('#hud')) return renderFarm();
  const panel = $('#panel');
  const scroll = panel.scrollTop;
  $('#hud').innerHTML = hudHTML();
  $('#farmBox').innerHTML = farmSVG();
  panel.innerHTML = panelHTML();
  panel.scrollTop = scroll;
  $('#logBox').innerHTML = logHTML();
  $('#fabEnd')?.toggleAttribute('disabled', g.over);
  bindFarm();
  if (ui.prevCash != null && ui.prevCash !== g.cash) {
    countUp($('#hudCash'), g.cash, { from: ui.prevCash, fmt: rsk });
    ui.prevCash = null;
  }
}
function selectPlot(i) {
  ui.sel = i;
  ui.sowOpen = false;
  ui.confirmClear = null;
  if (window.innerWidth <= 980 && S.sheetOnTap) openSheet();
  refreshFarm();
}
function openSheet() {
  document.body.classList.add('sheet-open');
}
function closeSheet() {
  document.body.classList.remove('sheet-open');
}
function bindFarm() {
  $$('.plot', view).forEach(el => {
    el.onclick = () => selectPlot(+el.dataset.i);
    el.onkeydown = e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        selectPlot(+el.dataset.i);
      }
    };
  });
  const end = $('#endBtn');
  if (end) end.onclick = endMonth;
  const fabEnd = $('#fabEnd');
  if (fabEnd) fabEnd.onclick = endMonth;
  const fabSheet = $('#fabSheet');
  if (fabSheet) fabSheet.onclick = () => document.body.classList.toggle('sheet-open');
  const sheetClose = $('#sheetClose');
  if (sheetClose) sheetClose.onclick = closeSheet;
  const panel = $('#panel');
  if (panel) panel.onclick = e => { if (e.target === panel && window.innerWidth <= 980) closeSheet(); };
  const sowOpen = $('#sowOpen');
  if (sowOpen) sowOpen.onclick = () => { ui.sowOpen = true; refreshFarm(); };
  const sowBack = $('#sowBack');
  if (sowBack) sowBack.onclick = () => { ui.sowOpen = false; refreshFarm(); };
  $$('[data-sow]', view).forEach(b => { b.onclick = () => sow(ui.sel, b.dataset.sow); });
  $$('[data-act]', view).forEach(b => { b.onclick = () => plotAction(b.dataset.act); });
  $$('[data-tip]', view).forEach(b => { b.onclick = () => dismissTip(b.dataset.tip); });
  const waterBtn = $('#waterBtn');
  if (waterBtn) waterBtn.onclick = openWaterModal;
  const saveBtn = $('#saveBtn');
  if (saveBtn) saveBtn.onclick = openSaveModal;
}
function plotAction(act) {
  const i = ui.sel;
  if (i == null) return;
  if (act === 'harvest') harvest(i);
  else if (act === 'irrigate') irrigate(i);
  else if (act === 'fertilize') fertilize(i);
  else if (act === 'spray') spray(i);
  else if (act === 'clear') {
    if (!S.confirmClear) return fallow(i);
    ui.confirmClear = i;
    refreshFarm();
  } else if (act === 'fallow') fallow(i);
}

// ---------- game motion: coin burst, month sweep, event cards ----------
function fxCoins(i) {
  const el = $(`.plot[data-i="${i}"]`);
  if (!el) return;
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  for (let k = 0; k < 9; k++) {
    const coin = document.createElement('span');
    coin.className = 'coin';
    coin.innerHTML = ic('coins');
    coin.style.left = cx - 9 + 'px';
    coin.style.top = cy - 9 + 'px';
    const angle = (k / 9) * Math.PI * 2;
    coin.style.setProperty('--dx', Math.round(Math.cos(angle) * 70) + 'px');
    coin.style.setProperty('--dy', Math.round(Math.sin(angle) * 50 - 50) + 'px');
    $('#fx').append(coin);
    setTimeout(() => coin.remove(), 900);
  }
}
function fxSweep() {
  const box = $('#farmBox');
  if (!box) return;
  const sweep = document.createElement('div');
  sweep.className = 'sweep';
  box.append(sweep);
  setTimeout(() => sweep.remove(), 800);
}
function showCards(cards) {
  const host = $('#events');
  cards.forEach((card, k) => {
    const el = document.createElement('div');
    el.className = 'ecard ' + card.type;
    el.style.animationDelay = (k * 120) + 'ms';
    el.innerHTML = `<div class="eic">${ic(card.icon)}</div><div><h4></h4><p></p></div>`;
    $('h4', el).textContent = card.title;
    $('p', el).textContent = card.body;
    el.onclick = () => el.remove();
    host.append(el);
    setTimeout(() => el.remove(), 9000);
  });
}

// ---------- market page ----------
function deltaHtml(now, before) {
  if (!before) return '<span class="muted">—</span>';
  const pct = 100 * (now - before) / before;
  const cls = pct > .5 ? 'ok' : pct < -.5 ? 'bad' : 'muted';
  const icon = pct > .5 ? 'trending-up' : pct < -.5 ? 'trending-down' : 'minus-dash';
  const sign = pct > 0 ? '+' : '';
  return `<span class="num" style="color:var(--${cls === 'muted' ? 'muted' : cls})">${cls === 'muted' ? '' : ic(icon)} ${sign}${nf1.format(pct)} %</span>`;
}
function seasonTag(c) {
  const m = mOf(g.turn);
  const f = seasonal(c, m);
  if (f < 1) return `<span class="tag bad">${t('glut')}</span>`;
  if (f > 1) return `<span class="tag">${t('lean')}</span>`;
  return `<span class="tag soil">${t('normal')}</span>`;
}
function marketRow(c) {
  const cr = CROPS[c];
  const hist = g.prices[c].hist;
  const now = hist[hist.length - 1];
  const before = hist[hist.length - 2];
  const stock = g.inv.find(x => x.crop === c);
  const qty = stock ? Math.floor(stock.qty) : 0;
  const sellCell = cr.mill

function downloadJSON(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importJSON(file, onData) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      onData(JSON.parse(reader.result));
    } catch {
      toast(t('bad_file'), 'bad');
    }
  };
  reader.readAsText(file);
}

// ---------- hand-drawn SVG charts ----------
function sparkline(data, color = '#5b7f2a', w = 110, h = 30) {
  if (!data || data.length < 2) return '';
  const lo = Math.min(...data);
  const hi = Math.max(...data);
  const span = hi - lo || 1;
  const pts = data.map((v, i) => `${(i / (data.length - 1)) * w},${h - 3 - ((v - lo) / span) * (h - 6)}`).join(' ');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

// Multi-series line chart with grid, axis labels, draw-in animation and a hover tooltip.
function lineChart(el, series, labels, { height = 220, fmt = v => nf.format(v) } = {}) {
  const W = 640;
  const H = height;
  const padL = 56;
  const padR = 12;
  const padT = 12;
  const padB = 28;
  const all = series.flatMap(s => s.data).filter(v => Number.isFinite(v));
  if (!all.length) {
    el.innerHTML = `<div class="muted small" style="padding:40px;text-align:center">—</div>`;
    return;
  }
  const lo = Math.min(0, ...all);
  const hi = Math.max(...all) * 1.08 || 1;
  const n = Math.max(...series.map(s => s.data.length));
  const x = i => padL + (n > 1 ? i / (n - 1) : 0) * (W - padL - padR);
  const y = v => padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB);

  let grid = '';
  for (let k = 0; k <= 4; k++) {
    const v = lo + (hi - lo) * k / 4;
    grid += `<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(0,0,0,.08)"/>`;
    grid += `<text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="#6f6352">${fmt(v)}</text>`;
  }
  const step = Math.max(1, Math.ceil(n / 8));
  let xlabels = '';
  for (let i = 0; i < n; i += step) {
    xlabels += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#6f6352">${esc(labels[i] ?? i)}</text>`;
  }
  const paths = series.map(s => {
    const d = s.data.map((v, i) => `${i ? 'L' : 'M'}${x(i)} ${y(v)}`).join(' ');
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" data-line/>`;
  }).join('');
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">${grid}${xlabels}${paths}
    <line id="hoverLine" x1="0" x2="0" y1="${padT}" y2="${H - padB}" stroke="#4e3219" stroke-dasharray="3 3" style="display:none"/></svg><div class="tip"></div>`;
  $$('[data-line]', el).forEach(drawPath);

  const svg = $('svg', el);
  const tip = $('.tip', el);
  const hover = $('#hoverLine', el);
  svg.onmousemove = e => {
    const rect = svg.getBoundingClientRect();
    const fx = (e.clientX - rect.left) / rect.width * W;
    const i = clamp(Math.round((fx - padL) / (W - padL - padR) * (n - 1)), 0, n - 1);
    hover.style.display = '';
    hover.setAttribute('x1', x(i));
    hover.setAttribute('x2', x(i));
    tip.style.display = 'block';
    tip.style.left = (x(i) / W * rect.width) + 'px';
    tip.style.top = '14px';
    tip.innerHTML = `<b>${esc(labels[i] ?? i)}</b><br>` + series.map(s => `${esc(s.label)}: ${fmt(s.data[i] ?? 0)}`).join('<br>');
  };
  svg.onmouseleave = () => {
    tip.style.display = 'none';
    hover.style.display = 'none';
  };
}

// Vertical bars, one per item, heights animated from zero.
function barChart(el, items, { height = 200, max = null, fmt = v => nf.format(v) } = {}) {
  const W = 640;
  const H = height;
  const padB = 26;
  const padT = 14;
  const top = max ?? Math.max(1, ...items.map(it => it.value)) * 1.1;
  const bw = (W - 20) / items.length;
  let html = '';
  items.forEach((it, i) => {
    const h = Math.max(0, (it.value / top) * (H - padT - padB));
    const bx = 10 + i * bw + bw * .15;
    html += `<rect x="${bx}" y="${H - padB - h}" width="${bw * .7}" height="${h}" rx="4" fill="${it.color}" class="bar-anim" style="transform-origin:${bx}px ${H - padB}px"/>`;
    html += `<text x="${bx + bw * .35}" y="${H - padB - h - 4}" text-anchor="middle" font-size="10" fill="#2a2419">${fmt(it.value)}</text>`;
    html += `<text x="${bx + bw * .35}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#6f6352">${esc(it.label)}</text>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px"><line x1="10" x2="${W - 10}" y1="${H - padB}" y2="${H - padB}" stroke="rgba(0,0,0,.2)"/>${html}</svg>`;
  $$('.bar-anim', el).forEach(r => {
    r.style.transform = 'scaleY(0)';
    r.getBoundingClientRect();
    r.style.transition = 'transform .6s var(--ease)';
    r.style.transform = 'scaleY(1)';
  });
}

// Paired bars (a vs b) per label, e.g. water used vs canal share per month.
function pairBars(el, labels, a, b, colors, { height = 200 } = {}) {
  const W = 640;
  const H = height;
  const padB = 26;
  const padT = 14;
  const top = Math.max(1, ...a, ...b) * 1.1;
  const gw = (W - 20) / labels.length;
  let html = '';
  labels.forEach((lab, i) => {
    const ha = (a[i] / top) * (H - padT - padB);
    const hb = (b[i] / top) * (H - padT - padB);
    const x0 = 10 + i * gw + gw * .12;
    html += `<rect x="${x0}" y="${H - padB - ha}" width="${gw * .34}" height="${ha}" rx="3" fill="${colors[0]}" class="bar-anim" style="transform-origin:${x0}px ${H - padB}px"/>`;
    html += `<rect x="${x0 + gw * .4}" y="${H - padB - hb}" width="${gw * .34}" height="${hb}" rx="3" fill="${colors[1]}" class="bar-anim" style="transform-origin:${x0}px ${H - padB}px"/>`;
    html += `<text x="${x0 + gw * .37}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#6f6352">${esc(lab)}</text>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px"><line x1="10" x2="${W - 10}" y1="${H - padB}" y2="${H - padB}" stroke="rgba(0,0,0,.2)"/>${html}</svg>`;
  $$('.bar-anim', el).forEach(r => {
    r.style.transform = 'scaleY(0)';
    r.getBoundingClientRect();
    r.style.transition = 'transform .6s var(--ease)';
    r.style.transform = 'scaleY(1)';
  });
}

// Horizontal share bars for a breakdown (income by crop, spending by category).
function shareBars(el, items) {
  const total = sum(items.map(it => it.value)) || 1;
  const sorted = [...items].sort((p, q) => q.value - p.value);
  el.innerHTML = sorted.map(it => `<div class="stat"><span>${it.swatch ? `<i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${it.color};margin-right:6px"></i>` : ''}${esc(it.label)}</span>
    <b class="num">${rsk(it.value)} <span class="muted small">${Math.round(100 * it.value / total)} %</span></b></div>
    <div class="bar" style="margin:2px 0 6px"><i style="width:${Math.round(100 * it.value / total)}%;background:${it.color}"></i></div>`).join('') || `<div class="muted small">—</div>`;
}

function monthLabels(count, endTurn = g.turn) {
  const out = [];
  for (let k = count - 1; k >= 0; k--) {
    const turn = endTurn - k;
    out.push(turn < 0 ? '' : mName(mOf(turn)));
  }
  return out;
}

// Price history with selectable crops (up to 3), shared by the Market and Reports pages.
function drawPriceHistory(chartEl, chipsEl, legendEl) {
  const palette = ['#5b7f2a', '#d9a521', '#b3342a'];
  const render = () => {
    const series = ui.priceSel.map((c, k) => ({ label: tx(CROPS[c]), color: palette[k], data: g.prices[c].hist }));
    const labels = g.prices.wheat.hist.map((_, i) => mName(mOf(i)) + (mOf(i) === 0 || i === 0 ? ` Y${yOf(i)}` : ''));
    lineChart(chartEl, series, labels);
    legendEl.innerHTML = series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.label)}: <b class="num">${rs(s.data[s.data.length - 1])}</b></span>`).join('');
    chipsEl.innerHTML = `<span class="small muted" style="align-self:center">${t('pick3')}:</span>` + CASH_CROPS.map(c => `
      <button class="chip ${ui.priceSel.includes(c) ? 'on' : ''}" data-pc="${c}">${tx(CROPS[c])}</button>`).join('');
    $$('[data-pc]', chipsEl).forEach(b => {
      b.onclick = () => {
        const c = b.dataset.pc;
        if (ui.priceSel.includes(c)) {
          if (ui.priceSel.length > 1) ui.priceSel = ui.priceSel.filter(x => x !== c);
        } else {
          if (ui.priceSel.length >= 3) ui.priceSel.shift();
          ui.priceSel.push(c);
        }
        render();
      };
    });
  };
  render();
}

// ---------- season planner & advisor ----------
// Crops a plot could take within the next three months (sowing windows), used to fill the planner selects.
function plannableCrops() {
  const m = mOf(g.turn);
  const soon = [m, (m + 1) % 12, (m + 2) % 12];
  return CROP_IDS.filter(c => CROPS[c].sow.some(x => soon.includes(x)));
}
function nextWindowMonth(c) {
  const m = mOf(g.turn);
  for (let k = 0; k < 12; k++) {
    if (CROPS[c].sow.includes((m + k) % 12)) return k;
  }
  return 12;
}
// Projects the next six months of water need (current crops plus planned sowings) against the expected canal share.
function planWater() {
  const months = [];
  for (let k = 0; k < 6; k++) {
    const turn = g.turn + k;
    const m = mOf(turn);
    let need = 0;
    g.plots.forEach(p => {
      const planned = g.plan[p.i];
      const current = CROPS[p.crop];
      if (current) {
        const stillGrowing = current.orchard || p.stage + k < current.dur;
        if (stillGrowing) need += current.water;
      }
      if (planned && planned !== 'fallow' && (!current || (!current.orchard && p.stage + k >= current.dur))) {
        const start = nextWindowMonth(planned);
        if (k >= start && k < start + CROPS[planned].dur) need += CROPS[planned].water;
      }
    });
    months.push({ label: mName(m), need: Math.round(need), share: Math.round(CANAL[m] * DIFF[g.diff].water) });
  }
  return months;
}
function planSummary() {
  let cost = 0;
  let revenue = 0;
  let mono = 0;
  let perishAcres = 0;
  let riceAcres = 0;
  Object.entries(g.plan).forEach(([i, c]) => {
    if (!c || c === 'fallow') return;
    const p = g.plots[+i];
    const cr = CROPS[c];
    cost += sowCost(c);
    const soilF = .55 + .45 * p.soil / 100;
    const harvestMonth = (mOf(g.turn) + nextWindowMonth(c) + cr.dur) % 12;
    revenue += cr.yield * soilF * cr.price * seasonal(c, harvestMonth) * g.prices[c].lvl;
    if (p.hist[p.hist.length - 1] === c && !cr.green) mono++;
    if (cr.perish) perishAcres++;
    if (c === 'rice') riceAcres++;
  });
  return { cost: Math.round(cost), revenue: Math.round(revenue), mono, perishAcres, riceAcres };
}
function planAdvice(summary, water) {
  const notes = [];
  water.forEach(w => {
    if (w.need > w.share * 1.05) notes.push({ cls: 'warn', text: t('pl_w_deficit', { m: w.label, n: w.need, s: w.share }) });
  });
  if (summary.cost > g.cash) notes.push({ cls: 'danger-note', text: t('pl_cash', { c: rsk(summary.cost), k: rsk(g.cash) }) });
  if (summary.mono) notes.push({ cls: 'warn', text: t('pl_mono', { n: summary.mono }) });
  if (summary.perishAcres > 4) notes.push({ cls: 'warn', text: t('pl_perish') });
  if (summary.riceAcres && summary.riceAcres * 12 > Math.max(...CANAL) * DIFF[g.diff].water) notes.push({ cls: 'warn', text: t('pl_rice', { n: summary.riceAcres, w: summary.riceAcres * 12 }) });
  if (!notes.length && Object.keys(g.plan).length) notes.push({ cls: 'note', text: t('pl_ok') });
  return notes;
}
function applyPlan() {
  let n = 0;
  const m = mOf(g.turn);
  Object.entries(g.plan).forEach(([i, c]) => {
    const p = g.plots[+i];
    if (!c || c === 'fallow' || p.crop || !CROPS[c].sow.includes(m)) return;
    if (g.cash >= sowCost(c) && sow(+i, c)) n++;
  });
  toast(n ? t('pl_applied', { n }) : t('pl_nothing'), n ? 'ok' : '');
  renderPlanner();
}
function plannerRow(p) {
  const current = CROPS[p.crop];
  const planned = g.plan[p.i] || '';
  const options = plannableCrops().map(c => {
    const k = nextWindowMonth(c);
    const when = k === 0 ? t('pl_fits') : `${t('pl_wait')} ${k} ${t('mo')}`;
    return `<option value="${c}" ${planned === c ? 'selected' : ''}>${tx(CROPS[c])} · ${when}</option>`;
  }).join('');
  const currentLabel = current ? `${tx(current)} 
    <span class="small muted num">${current.orchard ? `${p.age} ${t('mo')}` : `${Math.min(p.stage, current.dur)}/${current.dur}`}</span>` : `
    <span class="muted">${t('empty')}</span>`;
  return `<tr><td><b>${p.name}</b></td><td>${currentLabel}</td><td class="num">${Math.round(p.soil)}</td>
    <td><select data-plan="${p.i}" aria-label="${t('pl_plan')} ${p.name}"><option value="">${t('pl_keep')}</option>
      <option value="fallow" ${planned === 'fallow' ? 'selected' : ''}>${t('pl_fallow')}</option>${options}</select></td>
    <td class="num">${planned && planned !== 'fallow' ? rs(sowCost(planned)) : '—'}</td></tr>`;
}

  $$('[data-read]', view).forEach(b => {
    b.onclick = () => {
      markRead(b.dataset.read);
      renderInbox();
      renderNav();
    };
  });
  $('#markAll').onclick = () => {
    markAllRead();
    renderInbox();
    renderNav();
  };
  animateIn(view);
}

// ---------- settings ----------
function storageUsed() {
  let bytes = 0;
  store.keys().forEach(k => {
    try {
      bytes += (localStorage.getItem(NS + k) || '').length * 2;
    } catch {
      /* ignore */
    }
  });
  return bytes;
}
function settingRow(label, control) {
  return `<label class="row" style="cursor:pointer"><span class="txt small">${label}</span>${control}</label>`;
}
function exportAll() {
  const data = {};
  store.keys().forEach(k => { data[k] = store.get(k); });
  downloadJSON({ app: 'zameendar', exported: new Date().toISOString(), data }, 'zameendar-all-data.json');
  toast(t('st_exported'), 'ok');
}
function importAll(file) {
  importJSON(file, payload => {
    if (!payload || payload.app !== 'zameendar' || typeof payload.data !== 'object') return toast(t('bad_file'), 'bad');
    Object.entries(payload.data).forEach(([k, v]) => store.set(k, v));
    S = Object.assign({}, DEFAULT_SETTINGS, store.get('settings', {}));
    lang = store.get('lang', lang);
    const auto = store.get('auto');
    if (auto) adoptGame(auto);
    toast(t('st_imported'), 'ok');
    applyLang();
  });
}
function resetAll() {
  if (!confirm(t('st_reset_confirm'))) return;
  store.keys().forEach(k => store.del(k));
  g = null;
  S = Object.assign({}, DEFAULT_SETTINGS);
  toast(t('st_reset_done'));
  location.hash = 'new';
  route();
}
function renderSettings() {
  const kb = Math.round(storageUsed() / 1024);
  view.innerHTML = `<div class="wrap"><div class="two">
    <div class="panelbox paper"><h2>${ic('settings')} ${t('st_title')}</h2><p class="lead txt">${t('st_lead')}</p>
      <div class="list">
        ${settingRow(t('st_lang'), `<select id="setLang" style="width:auto"><option value="en" ${lang === 'en' ? 'selected' : ''}>English</option>
          <option value="ur" ${lang === 'ur' ? 'selected' : ''}>اردو</option></select>`)}
        ${settingRow(t('st_compact'), `<input type="checkbox" id="setCompact" ${S.compact ? 'checked' : ''}>`)}
        ${settingRow(t('st_water'), `<select id="setWater" style="width:auto"><option value="acin" ${S.waterUnit === 'acin' ? 'selected' : ''}>${t('st_acin')}</option>
          <option value="m3" ${S.waterUnit === 'm3' ? 'selected' : ''}>${t('st_m3')}</option></select>`)}
        ${settingRow(t('st_motion'), `<select id="setMotion" style="width:auto">
          <option value="auto" ${S.motion === 'auto' ? 'selected' : ''}>${t('st_motion_auto')}</option>
          <option value="reduced" ${S.motion === 'reduced' ? 'selected' : ''}>${t('st_motion_reduced')}</option></select>`)}
        ${settingRow(t('st_tips'), `<input type="checkbox" id="setTips" ${S.tips ? 'checked' : ''}>`)}
        ${settingRow(t('st_confirm'), `<input type="checkbox" id="setConfirm" ${S.confirmClear ? 'checked' : ''}>`)}
        ${settingRow(t('st_cards'), `<input type="checkbox" id="setCards" ${S.cards ? 'checked' : ''}>`)}
        ${settingRow(t('st_tour'), `<input type="checkbox" id="setTour" ${S.autoTour ? 'checked' : ''}>`)}
        ${settingRow(t('st_sheet'), `<input type="checkbox" id="setSheet" ${S.sheetOnTap ? 'checked' : ''}>`)}
      </div>
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn ghost" id="setTourBtn">${ic('play')} ${t('st_tour_btn')}</button>
        <button class="btn ghost" id="setKeys">${ic('keyboard')} ${t('st_keys')}</button></div></div>
    <div class="panelbox paper"><h3>${ic('folder')} ${t('st_data')}</h3>
      <div class="stat"><span>${t('st_storage')}</span><b class="num">${kb} KB · ${store.keys().length} keys</b></div>
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
        <button class="btn" id="setExport">${ic('download')} ${t('st_export_all')}</button>
        <label class="btn ghost" style="cursor:pointer">${ic('upload')} ${t('st_import_all')}<input type="file" id="setImport" accept="application/json" class="sr"></label>
        <button class="btn danger" id="setReset">${ic('trash')} ${t('st_reset')}</button></div>
      <div class="note small txt" style="margin-top:12px">${t('ab_data_t')}</div></div>
  </div></div>`;
  $('#setLang').onchange = e => { lang = e.target.value; applyLang(); };
  const bind = (id, key, map = v => v) => {
    $(id).onchange = e => {
      S[key] = map(e.target.type === 'checkbox' ? e.target.checked : e.target.value);
      saveSettings();
      renderSettings();
    };
  };
  bind('#setCompact', 'compact');
  bind('#setWater', 'waterUnit');
  bind('#setMotion', 'motion');
  bind('#setTips', 'tips');
  bind('#setConfirm', 'confirmClear');
  bind('#setCards', 'cards');
  bind('#setTour', 'autoTour');
  bind('#setSheet', 'sheetOnTap');
  $('#setTourBtn').onclick = () => {
    if (!g) return toast(t('n_start'));
    location.hash = 'farm';
    setTimeout(startTour, 200);
  };
  $('#setKeys').onclick = openShortcuts;
  $('#setExport').onclick = exportAll;
  $('#setImport').onchange = e => importAll(e.target.files[0]);
  $('#setReset').onclick = resetAll;
  animateIn(view);
}

// ---------- guided tour (spotlight steps over the farm page) ----------
function maybeStartTour() {
  if (!S.autoTour || store.get('tourDone')) return;
  setTimeout(startTour, 400);
}
function startTour() {
  if (!$('#hud')) return;
  ui.tourStep = 0;
  let host = $('#tour');
  if (!host) {
    host = document.createElement('div');
    host.id = 'tour';
    document.body.append(host);
  }
  showTourStep();
}
function endTour() {
  const host = $('#tour');
  if (host) host.remove();
  if (ui.tourStep >= 0) store.set('tourDone', true);
  ui.tourStep = -1;
}
function showTourStep() {
  const step = TOUR[ui.tourStep];
  const host = $('#tour');
  if (!step || !host) return endTour();
  const target = $(step.sel);
  if (!target) return endTour();
  target.scrollIntoView({ block: 'center', behavior: 'smooth' });
  const r = target.getBoundingClientRect();
  const pad = 8;
  const last = ui.tourStep === TOUR.length - 1;
  host.innerHTML = `<div class="tour-hole" style="left:${r.left - pad}px;top:${r.top - pad}px;width:${r.width + pad * 2}px;height:${r.height + pad * 2}px"></div>
    <div class="tour-card paper" role="dialog" aria-live="polite">
      <div class="small muted num">${ui.tourStep + 1} / ${TOUR.length}</div><h3>${t(step.title)}</h3><p class="txt" style="margin:6px 0 10px">${t(step.body)}</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" id="tourSkip">${t('tour_skip')}</button><span class="spacer"></span>
      <button class="btn ghost sm" id="tourBack" ${ui.tourStep ? '' : 'disabled'}>${ic('chevron-left')} ${t('tour_back')}</button>
      <button class="btn gold sm" id="tourNext">${last ? t('tour_done') : t('tour_next')} ${ic(last ? 'check' : 'chevron-right')}</button></div></div>`;
  const card = $('.tour-card', host);
  const below = r.bottom + 12;
  const fitsBelow = below + 190 < window.innerHeight;
  card.style.top = (fitsBelow ? below : Math.max(12, r.top - 200)) + 'px';
  card.style.left = clamp(r.left, 12, window.innerWidth - 352) + 'px';
  $('#tourSkip').onclick = endTour;
  $('#tourBack').onclick = () => { ui.tourStep--; showTourStep(); };
  $('#tourNext').onclick = () => {
    ui.tourStep++;
    if (ui.tourStep >= TOUR.length) endTour();
    else showTourStep();
  };
  $('#tourNext').focus();
}

// ---------- keyboard shortcuts ----------
function openShortcuts() {
  const rows = [
    ['E', t('k_end')], ['F · M · B · P · R', t('k_nav')], ['1 – 9, 0', t('k_plot')], ['← ↑ → ↓', t('k_move')],
    ['S', t('k_sow')], ['H', t('k_harvest')], ['I', t('k_irrig')], ['?', t('k_sheet')], ['Esc', t('k_esc')]
  ];
  openModal(`${modalHead(t('k_title'), 'keyboard')}<div class="list">${rows.map(([k, d]) => `
    <div class="row"><span class="txt">${d}</span><kbd class="tag soil num" style="font-size:.85rem">${k}</kbd></div>`).join('')}</div>`);
}
function handleKeys(e) {
  if (!g || e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input', 'select', 'textarea'].includes(tag)) return;
  if (document.body.classList.contains('modal-open') || ui.tourStep >= 0) return;
  const key = e.key;
  const onFarm = !!$('#hud');
  if (key === '?') return openShortcuts();
  if (key === 'e' || key === 'E') return onFarm && endMonth();
  const nav = { f: 'farm', m: 'market', b: 'bank', p: 'planner', r: 'reports' };
  if (nav[key.toLowerCase()] && key.length === 1) {
    location.hash = nav[key.toLowerCase()];
    return;
  }
  if (!onFarm) return;
  if (/^[0-9]$/.test(key)) {
    const i = key === '0' ? 9 : +key - 1;
    return selectPlot(i);
  }
  const moves = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -4, ArrowDown: 4 };
  if (moves[key] !== undefined) {
    e.preventDefault();
    const cur = ui.sel == null ? 0 : ui.sel;
    return selectPlot(clamp(cur + moves[key], 0, 15));
  }
  if (ui.sel == null) return;
  if (key === 's' || key === 'S') {
    ui.sowOpen = !g.plots[ui.sel].crop;
    return refreshFarm();
  }
  if (key === 'h' || key === 'H') return harvest(ui.sel);
  if (key === 'i' || key === 'I') return irrigate(ui.sel);
}
document.addEventListener('keydown', handleKeys);

// ---------- navigation & router ----------
const view = $('#view');
const NAV = [
  ['farm', 'nav_farm', 'home'], ['market', 'nav_market', 'coins'], ['bank', 'nav_bank', 'building'], ['planner', 'nav_planner', 'layers'],
  ['reports', 'nav_reports', 'bar-chart'], ['almanac', 'nav_almanac', 'book'], ['challenges', 'nav_challenges', 'target'],
  ['inbox', 'nav_inbox', 'bell'], ['settings', 'nav_settings', 'settings'], ['about', 'nav_about', 'info']
];
const MOBILE_NAV = ['farm', 'market', 'bank', 'planner', 'inbox'];
const ROUTES = {
  new: renderNew, farm: renderFarm, market: renderMarket, bank: renderBank, planner: renderPlanner, reports: renderReports, print: renderPrint,
  almanac: renderAlmanac, challenges: renderChallenges, inbox: renderInbox, settings: renderSettings, about: renderAbout
};
const NEEDS_GAME = ['farm', 'market', 'bank', 'planner', 'reports', 'print', 'inbox'];

function currentPage() {
  return (location.hash.slice(1) || (g ? 'farm' : 'new')).split('?')[0];
}
function renderNav() {
  const cur = currentPage();
  const unread = unreadCount();
  const badge = unread ? ` <span class="tag bad">${unread}</span>` : '';
  const secondary = ['almanac', 'challenges', 'settings', 'about'];
  $('#topnav').innerHTML = NAV.map(([id, key, icon]) => `
    <a href="#${id}" class="${cur === id ? 'active' : ''} ${secondary.includes(id) ? 'sec' : ''}" title="${t(key)}">${ic(icon)} <span>${t(key)}</span>${id === 'inbox' ? badge : ''}</a>`).join('') +
    `<a href="#new" class="${cur === 'new' ? 'active' : ''}">${ic('plus')} <span>${t('nav_new')}</span></a>`;
  $('#mobilebar').innerHTML = MOBILE_NAV.map(id => {
    const [, key, icon] = NAV.find(n => n[0] === id);
    return `<a href="#${id}" class="${cur === id ? 'active' : ''}">${ic(icon)}${t(key)}${id === 'inbox' && unread ? ` <span class="tag bad">${unread}</span>` : ''}</a>`;
  }).join('') + `<a href="#about" class="${['about', 'settings', 'almanac', 'challenges', 'new'].includes(cur) ? 'active' : ''}">${ic('more')}${t('nav_more')}</a>`;
  $('#saveTop').innerHTML = `${ic('save')} <span class="small">${t('save_btn')}</span>`;
  $('#saveTop').style.display = g ? '' : 'none';
}
function route() {
  let page = currentPage();
  if (NEEDS_GAME.includes(page) && !g) page = 'new';
  if (!ROUTES[page]) page = g ? 'farm' : 'new';
  document.body.dataset.page = page;
  closeSheet();
  closeModal();
  renderNav();
  if (page !== 'farm') $('#fabs').style.display = 'none';
  ROUTES[page]();
  window.scrollTo({ top: 0 });
}
// Re-render whatever is on screen after a state change (used by every action).
function refresh() {
  const page = currentPage();
  if (page === 'farm') refreshFarm();
  else if (ROUTES[page]) ROUTES[page]();
  renderNav();
}
function applyLang() {
  document.documentElement.lang = lang;
  store.set('lang', lang);
  $$('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $('#langBtn').textContent = lang === 'en' ? 'اردو' : 'English';
  route();
}

$('#langBtn').onclick = () => {
  lang = lang === 'en' ? 'ur' : 'en';
  applyLang();
};
$('#saveTop').onclick = () => { if (g) openSaveModal(); };
window.addEventListener('hashchange', route);
window.addEventListener('resize', () => {
  if (ui.tourStep >= 0) showTourStep();
});

// ---------- public API (used by the test harness and by students' scripts) ----------
window.game = {
  get state() { return g; },
  newGame, sow, irrigate, fertilize, spray, harvest, fallow, endMonth, sell,
  takeLoan, repayLoan, takeAdvance, repayAdvance, buyInsurance, buySolar, setOption,
  save: saveSlot, load: loadSlot, select: selectPlot, price, netWorth, sustainability, grade, achievements,
  notify, markAllRead, startTour, endTour, openShortcuts, applyLang,
  setLang(code) { lang = code; applyLang(); },
  CROPS, PESTS, EVENTS, CHALLENGES, CANAL, RAIN, DIFF, TURNS,
  mOf, yOf, seasonOf, estimate, plotNeed, farmNeed
};

// ---------- boot ----------
(function init() {
  saveSettings();
  const auto = store.get('auto');
  if (auto && Array.isArray(auto.plots) && auto.plots.length === 16) adoptGame(auto);
  applyLang();
})();
</script>
