/** Depth chart: readings (dots), outliers (rings), the simulated depth and monsoon bands. */
function readingsChart(v, list, z) {
  const run = cachedRun(v);
  const w = wellById(v, READ.well);
  const pts = list.filter(r => !r.excluded).map(r => [dateK(r.d), toUnit(r.v)]);
  const sim = run && w ? run.steps.slice(0, HIST_MONTHS).map(s => [s.k, toUnit(depthAt(run, w.cell, s.k))]) : [];
  const markers = list.filter(r => isOutlier(z.get(r.id))).map(r => ({ x: dateK(r.d), y: toUnit(r.v), tip: `<b>${r.d}</b> ${fmtDepth(r.v, 2)}<br>z = ${fmtN(z.get(r.id), 1)}` }));
  const byK = new Map(list.map(r => [dateK(r.d), r]));
  const xs = [...Array(HIST_MONTHS).keys()];
  return chartBox('rdMain', {
    aria: t('rdChartTitle', { w: READ.well }),
    series: [{ name: 'sim', color: 'var(--clay)', pts: sim, width: 2, dash: '6 4' }, { name: 'obs', color: 'var(--aq5)', pts, width: 1.4, dots: true, r: 3 }],
    x: { min: 0, max: HIST_MONTHS - 1, ticks: yearTicks(0, HIST_MONTHS - 1) },
    y: { invert: true, title: `${t('depthToWater')} (${t('u_' + depthUnit())})` },
    bands: monsoonBands(0, HIST_MONTHS - 1),
    markers,
    hover: { xs, tip: i => `<b>${simLabel(i)}</b><br>${byK.has(i) ? `${t('lgReading')}: ${fmtDepth(byK.get(i).v, 2)}` : t('noReading')}${sim[i] ? `<br>${t('lgSimulated')}: ${fmtN(sim[i][1], 2)} ${t('u_' + depthUnit())}` : ''}` },
  }, 280);
}

function wellStatTiles(list, z) {
  const ok = list.filter(r => !r.excluded && !isOutlier(z.get(r.id)));
  if (ok.length < 3) return `<div class="empty">${t('tooFewReadings')}</div>`;
  const last = ok[ok.length - 1];
  const yearAgo = ok.filter(r => dateK(r.d) <= dateK(last.d) - 12).at(-1);
  const fit = linreg(ok.map(r => yearOfK(dateK(r.d))), ok.map(r => r.v));
  const reb = monsoonRows(ok).filter(r => Number.isFinite(r.rebound)).map(r => r.rebound);
  const tile = (icon, lbl, val, note) => `<div class="kpi"><div class="lbl">${ic(icon)}${lbl}</div><div class="val" style="font-size:1.35rem">${val}</div><div class="note">${note}</div></div>`;
  return [
    tile('arrow-down', t('latest'), fmtDepth(last.v, 2), last.d),
    tile('calendar', t('change12'), yearAgo ? `${last.v - yearAgo.v > 0 ? '+' : ''}${fmtDepth(last.v - yearAgo.v, 2)}` : '–', t('change12Note')),
    tile('trending-down', t('trendYr'), `${fit.b > 0 ? '+' : ''}${fmtDepth(fit.b, 2)}`, t('trendYrNote')),
    tile('cloud-rain', t('avgRebound'), reb.length ? fmtDepth(mean(reb), 2) : '–', t('avgReboundNote')),
  ].join('');
}

/** Pre-monsoon (May-June) and post-monsoon (October-November) means per year. */
function monsoonRows(list) {
  const years = [...new Set(list.map(r => Number(r.d.slice(0, 4))))].sort();
  return years.map(y => {
    const pick = ms => list.filter(r => Number(r.d.slice(0, 4)) === y && ms.includes(Number(r.d.slice(5, 7)))).map(r => r.v);
    const pre = pick([5, 6]);
    const post = pick([9, 10]);
    return { y, pre: pre.length ? mean(pre) : NaN, post: post.length ? mean(post) : NaN, rebound: pre.length && post.length ? mean(pre) - mean(post) : NaN };
  });
}

function monsoonTable(list) {
  const rows = monsoonRows(list.filter(r => !r.excluded));
  const cell = x => (Number.isFinite(x) ? fmtN(toUnit(x), 2) : '–');
  return `<div class="tblwrap"><table class="tbl"><thead><tr><th>${t('year')}</th><th class="n">${t('preMonsoon')}</th><th class="n">${t('postMonsoon')}</th><th class="n">${t('rebound')}</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${r.y}</td><td class="n">${cell(r.pre)}</td><td class="n">${cell(r.post)}</td><td class="n"><b class="${r.rebound > 0 ? 'delta down' : 'delta up'}">${Number.isFinite(r.rebound) ? (r.rebound > 0 ? '+' : '') + cell(r.rebound) : '–'}</b></td></tr>`).join('')}</tbody></table></div>`;
}

/** Mean rebound per year across all monitored wells (bar chart). */
function reboundSpec(v) {
  const z = villageOutliers(v);
  const per = monWells(v).map(w => monsoonRows(wellReadings(v, w.id).filter(r => !r.excluded && !isOutlier(z.get(r.id)))));
  const rows = [...new Set(per.flat().map(r => r.y))].sort().map(y => {
    const vals = per.map(list => list.find(r => r.y === y)?.rebound).filter(Number.isFinite);
    return { y, m: vals.length ? toUnit(mean(vals)) : NaN, n: vals.length };
  }).filter(r => Number.isFinite(r.m));
  const lo = Math.min(0, ...rows.map(r => r.m));
  const hi = Math.max(0.2, ...rows.map(r => r.m));
  return {
    aria: t('meanRebound'), series: [{ color: 'var(--aq5)', pts: rows.map(r => [r.y, r.m]), dots: true, r: 5 }], refs: [{ y: 0, color: 'var(--line-2)', label: '' }],
    x: { min: rows[0]?.y - 0.3, max: rows.at(-1)?.y + 0.3, ticks: rows.map(r => [r.y, String(r.y)]) }, y: { min: lo - 0.1, max: hi + 0.1, title: `${t('meanRebound')} (${t('u_' + depthUnit())})`, fmt: x => fmtN(x, 1) },
    hover: { xs: rows.map(r => r.y), tip: i => `<b>${rows[i].y}</b><br>${t('rebound')}: ${fmtN(rows[i].m, 2)} ${t('u_' + depthUnit())}<br>${t('nWells', { n: rows[i].n })}` },
  };
}

function outlierList(v, z) {
  const flagged = readingsOf(v.id).filter(r => isOutlier(z.get(r.id)) || r.excluded).sort((a, b) => Math.abs(z.get(b.id)) - Math.abs(z.get(a.id)));
  if (!flagged.length) return `<div class="empty">${ic('check-circle')}${t('noOutliers')}</div>`;
  return `<div style="max-height:430px;overflow:auto">${flagged.map(r => {
    const used = !(r.excluded || (S.settings.excludeOutliers && isOutlier(z.get(r.id)) && !r.keep));
    return `<div class="lrow"><span class="av ${used ? 'leaf' : 'bad'}">${ic(used ? 'check' : 'x')}</span><div class="meta"><b>${esc(r.w)} · ${r.d}</b><small>${fmtDepth(r.v, 2)} · z = ${fmtN(z.get(r.id), 1)} · ${t('rm_' + r.m)}</small></div><button class="btn ghost sm" type="button" data-rtoggle="${r.id}">${used ? t('exclude') : t('include')}</button></div>`;
  }).join('')}</div>`;
}

function readingsTable(list, z) {
  const rows = [...list].reverse();
  const pages = Math.max(1, Math.ceil(rows.length / PER_PAGE));
  READ.page = clamp(READ.page, 0, pages - 1);
  const page = rows.slice(READ.page * PER_PAGE, (READ.page + 1) * PER_PAGE);
  const pager = pages > 1 ? `<div class="row mt"><button class="btn ghost sm" type="button" data-page="${READ.page - 1}" ${READ.page ? '' : 'disabled'}>${ic('chevron-left', 'flip')}</button><span class="small">${t('pageXofY', { x: READ.page + 1, y: pages })}</span><button class="btn ghost sm" type="button" data-page="${READ.page + 1}" ${READ.page < pages - 1 ? '' : 'disabled'}>${ic('chevron-right', 'flip')}</button></div>` : '';
  return `<div class="tblwrap"><table class="tbl"><thead><tr><th>${t('date')}</th><th class="n">${t('depthShort')}</th><th>${t('method')}</th><th>${t('recorder')}</th><th></th></tr></thead><tbody>
    ${page.map(r => `<tr class="${isOutlier(z.get(r.id)) ? 'flag' : ''}"><td class="nowrap">${r.d}</td><td class="n">${fmtDepth(r.v, 2)}</td><td>${t('rm_' + r.m)}</td><td>${t('rc_' + r.r)}</td><td><div class="acts"><button class="ibtn sm" type="button" data-redit="${r.id}" aria-label="${t('edit')}">${ic('edit')}</button></div></td></tr>`).join('')}</tbody></table></div>${pager}`;
}

function toggleReading(v, id) {
  const r = readingsOf(v.id).find(x => x.id === id);
  if (!r) return;
  const z = villageOutliers(v).get(id);
  const used = !(r.excluded || (S.settings.excludeOutliers && isOutlier(z) && !r.keep));
  if (used) {
    r.excluded = true;
    r.keep = false;
  } else {
    r.excluded = false;
    r.keep = true;
  }
  persist('readings');
  logEvent(used ? 'lg_rdExclude' : 'lg_rdInclude', { w: r.w, d: r.d }, 'readings');
  rerender();
}

/** A fresh reading that looks like an outlier, or below the pump intake, raises a notice. */
function checkNewReading(v, rd) {
  const z = villageOutliers(v).get(rd.id);
  if (isOutlier(z)) notify('nt_outlier', { w: rd.w, d: rd.d, z: fmtN(z, 1) }, { route: 'readings', level: 'warn', key: 'out-' + rd.id });
  const w = wellById(v, rd.w);
  if (w && w.use === 'irr' && rd.v > w.pump - 1) notify('nt_readingDry', { w: w.id, d: fmtDepth(rd.v) }, { route: 'readings', level: 'bad', key: 'rdry-' + rd.id });
}

function exportReadingsCsv(v) {
  const rows = [['well_id', 'date', 'depth_m', 'method', 'recorder', 'excluded']];
  readingsOf(v.id).slice().sort((a, b) => a.w.localeCompare(b.w) || a.d.localeCompare(b.d)).forEach(r => rows.push([r.w, r.d, r.v, r.m, r.r, r.excluded ? 1 : 0]));
  downloadFile(`readings-${v.id}.csv`, toCsv(rows), 'text/csv');
  logEvent('lg_rdExport', { n: rows.length - 1 }, 'readings');
}

/** Map CSV headers (well, date, depth in m or ft, method, recorder) to column indexes. */
function csvColumns(head) {
  const h = head.map(x => x.trim().toLowerCase());
  const find = re => h.findIndex(x => re.test(x));
  return { w: find(/^well/), d: find(/^date/), m: find(/depth.*m$|^depth$|depth_m/), ft: find(/depth.*ft/), method: find(/^method/), rec: find(/^record/) };
}

function importReadingsCsv(v, text) {
  const rows = parseCsv(text);
  if (rows.length < 2) return toast(t('importFailed'), 'bad');
  const c = csvColumns(rows[0]);
  if (c.w < 0 || c.d < 0 || (c.m < 0 && c.ft < 0)) return toast(t('csvHeaders'), 'bad');
  const known = new Set(monWells(v).map(w => w.id));
  const list = readingsOf(v.id);
  const seen = new Set(list.map(r => r.w + r.d));
  let added = 0;
  let skipped = 0;
  rows.slice(1).forEach(row => {
    const w = (row[c.w] || '').trim().toUpperCase();
    const d = (row[c.d] || '').trim();
    const raw = Number(c.m >= 0 ? row[c.m] : row[c.ft]);
    const depth = c.m >= 0 ? raw : raw / FT_PER_M;
    const ok = known.has(w) && /^\d{4}-\d{2}-\d{2}$/.test(d) && d <= TODAY && Number.isFinite(depth) && depth >= 0 && depth < 200 && !seen.has(w + d);
    if (!ok) return skipped++;
    const method = METHODS_READ.includes(row[c.method]) ? row[c.method] : 'tape';
    const rec = RECORDERS.includes(row[c.rec]) ? row[c.rec] : 'committee';
    list.push({ id: uid('r'), w, d, v: round(depth, 2), m: method, r: rec });
    seen.add(w + d);
    added++;
  });
  persist('readings');
  logEvent('lg_rdImport', { n: added, s: skipped }, 'readings');
  rerender();
  toast(t('csvImported', { n: added, s: skipped }), added ? 'ok' : 'bad');
}

function bindModel(v, run) {
  $('#mdRerun').onclick = () => {
    markStale(v);
    rerender();
  };
  $('#mdVerify').onclick = () => runVerification(run);
  if ($('#mdVerify2')) $('#mdVerify2').onclick = () => runVerification(run);
  $('#mdCapture').onclick = () => irrWells(v)[0] && traceCaptureZone(v, run, irrWells(v)[0]);
  $('#mdSaline').onclick = () => salinityFront(v, run);
  $$('#mdLayer button').forEach(b => (b.onclick = async () => {
    MODEL.layer = b.dataset.l;
    $$('#mdLayer button').forEach(x => x.classList.toggle('on', x === b));
    if (MODEL.layer === 'pumping') await ensureNoPumpRun(v);
    updateModelView();
  }));
  $('#mdSlider').oninput = e => {
    MODEL.k = Number(e.target.value);
    updateModelView();
  };
  $('#mdResetSec').onclick = () => {
    delete v.section;
    persist('villages');
    updateModelView();
  };
  bindSectionDraw(v, run);
  bindSolver(v);
}

/** Counterfactual run without any pumping: the difference is the drawdown caused by wells. */
async function ensureNoPumpRun(v) {
  const key = 'nopump:' + v.id;
  if (RUNS.has(key)) return RUNS.get(key);
  runBusy++;
  setRunChip();
  await nextFrame();
  const r = simulate(v, { months: TOTAL_MONTHS, levers: { noPump: true } });
  RUNS.set(key, r);
  runBusy--;
  setRunChip();
  return r;
}

function modelLayer(v, run, k) {
  if (MODEL.layer === 'head') {
    const h = headsAt(run, k);
    const vals = Float32Array.from(h, (x, i) => (run.spec.ib[i] ? x : NaN));
    const [lo, hi] = fieldRange(vals);
    return { vals, stops: [...SCALE_DEPTH].reverse(), lo, hi, label: t('headMasl'), unit: false };
  }
  if (MODEL.layer === 'pumping' && RUNS.has('nopump:' + v.id)) {
    const np = RUNS.get('nopump:' + v.id);
    const a = depthField(run, k);
    const b = depthField(np, k);
    const vals = a.map((x, i) => x - b[i]);
    const hi = Math.max(0.5, Math.ceil(Math.max(...[...vals].filter(Number.isFinite))));
    return { vals, stops: ['#f6efe4', '#e7c3a3', '#cf8a5c', '#a8552f', '#6e2f16'], lo: 0, hi, label: t('layer_pumping'), unit: true };
  }
  return { ...planLayer(v, run, k, MODEL.layer === 'change' ? 'change' : 'depth'), unit: true };
}

function updateModelView() {
  const v = V();
  const run = cachedRun(v);
  if (!run || !$('#mdXsec')) return;
  const k = MODEL.k;
  const L = modelLayer(v, run, k);
  const fmt = x => fmtN(L.unit ? toUnit(x) : x, 1);
  paintPlan('model', { v, vals: L.vals, stops: L.stops, lo: L.lo, hi: L.hi, marks: runMarks(v, run, k), section: sectionOf(v), fmt });
  $('#mdScale').innerHTML = scaleLegend(L.stops, L.lo, L.hi, L.label, x => fmtN(L.unit ? toUnit(x) : x, 0));
  $('#mdWhen').textContent = k < 0 ? t('startOf', { m: simLabel(0) }) : simLabel(k);
  const box = $('#mdXsec');
  box.innerHTML = crossSectionSvg({ v, run, k, line: sectionOf(v), w: Math.max(300, box.clientWidth), h: innerWidth < 760 ? 240 : 300, id: 'mx' });
}

/** Drag across the plan view to draw a new section line; a tap inspects the cell. */
function bindSectionDraw(v, run) {
  const box = $('#pl-model');
  box.onpointerdown = e => {
    const p = cellFromEvent(e, box, v);
    MODEL.drag = { a: [p.x, p.y], b: [p.x, p.y] };
    box.setPointerCapture(e.pointerId);
  };
  box.onpointermove = e => {
    if (!MODEL.drag) return;
    const p = cellFromEvent(e, box, v);
    MODEL.drag.b = [p.x, p.y];
    const line = $('.secline', box);
    if (line) ['x1', 'y1', 'x2', 'y2'].forEach((a, i) => line.setAttribute(a, [MODEL.drag.a[0], MODEL.drag.a[1], p.x, p.y][i]));
  };
  box.onpointerup = () => {
    const d = MODEL.drag;
    MODEL.drag = null;
    if (!d) return;
    if (Math.hypot(d.b[0] - d.a[0], d.b[1] - d.a[1]) < 3) return inspectCell(v, run, Math.floor(d.a[1]) * v.nx + Math.floor(d.a[0]));
    v.section = [d.a.map(x => round(x, 2)), d.b.map(x => round(x, 2))];
    persist('villages');
    updateModelView();
    announce(t('sectionDrawn'));
  };
}

function inspectCell(v, run, i) {
  const [x, y] = cellXY(v, i);
  const k = MODEL.k;
  const h = headsAt(run, k)[i];
  const row = (a, b) => `<dt>${a}</dt><dd>${b}</dd>`;
  $('#mdCell').innerHTML = `<b>${t('cellXY', { x: x + 1, y: y + 1 })} · ${t('ct_' + CELL_TYPES[v.cells[i]].id)}</b><dl class="mt">${row(t('groundElev'), `${fmtN(run.spec.zs[i], 2)} ${t('u_masl')}`)}${row(t('headMasl'), fmtN(h, 2))}${row(t('depthToWater'), fmtDepth(run.spec.zs[i] - h, 2))}${row('Sy', fmtN(run.spec.sy[i], 3))}${row('T', `${fmtN(run.spec.T0[i])} m²/d`)}${row(t('baseElev'), `${fmtN(run.spec.base[i], 1)} ${t('u_masl')}`)}${row(t('cellRole'), t(run.spec.ib[i] === IB_CHD ? 'role_chd' : run.spec.ib[i] ? 'role_active' : 'role_off'))}</dl>`;
}

// ---------- water balance ----------
const BUD_IN = ['rain', 'canal', 'wc', 'ret', 'pond', 'chd', 'storage'];
const BUD_OUT = ['pump', 'et', 'chd', 'canal', 'storage'];

/** Sum the monthly budget of each water year (Nov-Oct). */
function yearBudgets(run) {
  const out = [];
  run.steps.forEach((s, i) => {
    const y = Math.floor(i / 12);
    if (!out[y]) out[y] = { wy: y, inn: {}, out: {}, IN: 0, OUT: 0, err: 0 };
    const o = out[y];
    BUD_IN.forEach(k => (o.inn[k] = (o.inn[k] || 0) + s.bud.inn[k]));
    BUD_OUT.forEach(k => (o.out[k] = (o.out[k] || 0) + s.bud.out[k]));
    o.IN += s.bud.IN;
    o.OUT += s.bud.OUT;
    o.err = Math.max(o.err, Math.abs(s.err));
  });
  return out;
}
const wyLabel = wy => `${calYear(wy * 12)}-${String(calYear(wy * 12 + 11)).slice(2)}`;

function balanceTable(run) {

const SUP = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
const pow10Label = p => '×10' + String(p).split('').map(c => SUP[c]).join('');

/** Closure error per month, scaled to a power of ten so the axis labels stay distinct. */
function errSpec(run) {
  const mx = Math.max(1e-9, ...run.steps.map(s => Math.abs(s.err)));
  const p = Math.floor(Math.log10(mx));
  const sc = 10 ** p;
  return { aria: t('errChart'), series: [{ color: 'var(--leaf)', pts: run.steps.map(s => [s.k, Math.abs(s.err) / sc]) }], x: { min: 0, max: TOTAL_MONTHS - 1, ticks: yearTicks(0, TOTAL_MONTHS - 1, 3) }, y: { min: 0, max: (mx / sc) * 1.2, title: `${t('errChart')} ${pow10Label(p)}`, fmt: x => fmtN(x, 1) }, hover: { xs: run.steps.map(s => s.k), tip: i => `<b>${simLabel(i)}</b><br>${t('closure')}: ${Math.abs(run.steps[i].err).toExponential(2)}%` } };
}

function iterSpec(run) {
  return { aria: t('iterChart'), series: [{ color: 'var(--aq5)', pts: run.steps.map(s => [s.k, s.iters]) }], x: { min: 0, max: TOTAL_MONTHS - 1, ticks: yearTicks(0, TOTAL_MONTHS - 1, 3) }, y: { min: 0, max: Math.max(...run.steps.map(s => s.iters)) * 1.2, title: t('iterChart') }, hover: { xs: run.steps.map(s => s.k), tip: i => `<b>${simLabel(i)}</b><br>${t('iterations')}: ${run.steps[i].iters}` } };
}

/** Iterations and time for one history year at several relaxation factors (Gauss-Seidel is omega = 1). */
async function compareOmega(v) {
  const box = $('#svCmp');
  box.innerHTML = `<div class="progress"><i style="width:30%"></i></div>`;
  await nextFrame();
  const rows = [];
  for (const omega of [1, 1.4, 1.6, 1.8, 1.9]) {
    const t0 = performance.now();
    const r = simulate(v, { months: 12, record: false, solver: { omega } });
    rows.push({ omega, iters: mean(r.steps.map(s => s.iters)), ms: performance.now() - t0, dtw: r.steps.at(-1).dtw });
    await nextFrame();
  }
  MODEL.cmp = rows;
  box.innerHTML = omegaTable(rows);
}

}

/** Grid search: one 60-month run per (Sy, T) pair, a paint between runs so the bar moves. */
async function autoCalibrate(v) {
  if (CAL.busy) return;
  CAL.busy = true;
  CAL.done = 0;
  CAL.grid = SY_GRID.map(() => T_GRID.map(() => NaN));
  CAL.best = null;
  rerender();
  const obs = observations(v);
  for (let i = 0; i < SY_GRID.length; i++) {
    for (let j = 0; j < T_GRID.length; j++) {
      await nextFrame();
      if (V() !== v) {
        CAL.busy = false;
        return;
      }
      const r = calibStats(v, { sy: SY_GRID[i], t: T_GRID[j] }, obs).rmse;
      CAL.grid[i][j] = r;
      if (!CAL.best || r < CAL.best.rmse) CAL.best = { sy: SY_GRID[i], t: T_GRID[j], rmse: r };
      CAL.done++;
      paintCalProgress(v);
    }
  }
  CAL.busy = false;
  logEvent('lg_autoCalib', { sy: CAL.best.sy, t: CAL.best.t }, 'calib');
  if (curRoute === 'calib') rerender();
}

function paintCalProgress(v) {
  if (curRoute !== 'calib' || !$('#calGrid')) return;
  const total = SY_GRID.length * T_GRID.length;
  $('#calBar').style.width = (CAL.done / total) * 100 + '%';
  $('#calProg').textContent = t('calRunning', { n: CAL.done, m: total });
  $('#calGrid').innerHTML = rmseGridHtml(v);
}

/** RMSE surface as a coloured table: rows Sy multipliers, columns T multipliers. */
function rmseGridHtml(v) {
  const g = CAL.grid;
  const vals = g ? g.flat().filter(Number.isFinite) : [];
  const lo = vals.length ? Math.min(...vals) : 0;
  const hi = vals.length ? Math.max(...vals) : 1;
  const cur = v.calib;
  let html = `<div class="rmse-grid" style="grid-template-columns:auto repeat(${T_GRID.length},minmax(0,1fr))"><div class="hd">Sy \\ T</div>${T_GRID.map(x => `<div class="hd">×${x}</div>`).join('')}`;
  SY_GRID.forEach((sy, i) => {
    html += `<div class="hd">×${sy}</div>`;
    T_GRID.forEach((tt, j) => {
      const r = g ? g[i][j] : NaN;
      const col = Number.isFinite(r) ? rgbStr(rampColor(['#2f7d4a', '#9ccf7f', '#f3e4b3', '#e3a06f', '#b0332a'], Math.sqrt((r - lo) / (hi - lo || 1)))) : 'var(--card-2)';
      const best = CAL.best && CAL.best.sy === sy && CAL.best.t === tt && !CAL.busy;
      const isCur = cur.sy === sy && cur.t === tt;
      html += `<div class="${best ? 'best' : ''} ${isCur ? 'cur' : ''}" style="background:${col}" data-tip="Sy ×${sy}, T ×${tt}<br>RMSE ${Number.isFinite(r) ? fmtN(r, 3) + ' m' : '–'}">${Number.isFinite(r) ? fmtN(r, 2) : ''}</div>`;
    });
  });
  return html + '</div>' + `<p class="tiny muted mt">${t('calGridLegend')}</p>`;
}

function calLogList(v) {
  const log = S.calibLog[v.id] || [];
  if (!log.length) return `<p class="small muted">${t('calLogEmpty')}</p>`;
  return log.slice(0, 5).map(l => `<div class="lrow"><span class="av">${ic(l.method === 'grid' ? 'grid' : 'sliders')}</span><div class="meta"><b>Sy ×${fmtN(l.sy, 2)} · T ×${fmtN(l.t, 2)}</b><small>${fmtDT(l.ts)}${l.rmse ? ' · RMSE ' + fmtN(l.rmse, 3) + ' m' : ''}</small></div></div>`).join('');

const CROP_GROUPS = [['wheat', ['wheat']], ['rice', ['rice']], ['cotton', ['cotton']], ['sugarcane', ['sugarcane']], ['maize', ['maize']], ['fodder', ['fodder_r', 'fodder_k']], ['veg', ['veg_r', 'veg_k']]];

const groupOf = c => CROP_GROUPS.findIndex(([, list]) => list.includes(c));

/** Average-year demand of every field by calendar month (normals, today's crops and methods). */
function demandTable(v) {
  const clim = climateTable(v.district, v.lat);
  const parcels = parcelsOf(v);
  const fields = v.fields.map(f => {
    const area = (parcels.get(f.n) || []).length * CELL_AREA;
    const coeffs = fieldMonthlyCoeffs(f);
    const months = clim.map((c, m) => {
      const nd = fieldNeedMm(coeffs, clim, m, 1);
      const gross = nd.net / coeffs.eff + (nd.need - nd.net);
      const canal = f.canal ? Math.min(gross, canalMmAtField(v.canal, m)) : 0;
      const gw = gross - canal;
      const crop = fieldCrops(f).find(cc => cropMonthly(cc).kc[m] > 0.01) || null;
      return { ...nd, gross, canal, gw, gwM3: (gw / 1000) * area, crop };
    });
    return { f, area, months };
  });
  return { clim, fields };
}

/** Crop card with its Kc curve over the season. */
function cropCard(c) {
  const crop = CROPS[c];
  const total = crop.len.reduce((a, b) => a + b, 0);
  const W = 220;
  const H = 54;
  const pts = [];
  for (let d = 0; d <= total; d += 3) pts.push(`${round((d / total) * W, 1)},${round(H - 4 - (kcOnSeasonDay(crop, Math.min(d, total - 1)) / 1.3) * (H - 8), 1)}`);
  const sow = `${crop.sow[1]} ${monthName(crop.sow[0])}`;
  return `<button type="button" class="card lift guide-card" data-crop="${c}"><div class="between"><b>${cropName(c)}</b><span class="chip">${t('season_' + crop.season)}</span></div>
    <svg class="kcmini" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%" aria-hidden="true"><polyline points="${pts.join(' ')}" fill="none" stroke="${crop.color}" stroke-width="2.5"/></svg>
    <p class="small muted" style="margin:0">${t('sowOn', { d: sow })} · ${t('daysN', { n: total })} · Kc ${crop.kc.map(x => fmtN(x, 2)).join(' / ')}</p></button>`;
}

function demandSpec(dt) {
  const cats = dt.clim.map(c => {
    const vals = CROP_GROUPS.map(() => 0);
    dt.fields.forEach(r => {
      const mo = r.months[c.m];
      if (mo.crop && mo.gwM3 > 0) vals[groupOf(mo.crop)] += mo.gwM3 / 1e6;
    });
    return { label: monthName(c.m).slice(0, 3), values: vals, tip: `<b>${monthName(c.m)}</b><br>${CROP_GROUPS.map(([g], i) => (vals[i] > 0.0005 ? `${t('cg_' + g)}: ${fmtN(vals[i], 2)} ${t('u_mm3')}` : '')).filter(Boolean).join('<br>')}` };
  });
  return { type: 'bar', cats, colors: GROUP_COLORS, y: { title: t('gwDemandMm3'), fmt: x => fmtN(x, 1) }, aria: t('demandTitle') };
}

function hoursTable(v, dt) {
  const wells = irrWells(v);
  const parcels = parcelsOf(v);
  const servedBy = new Map(dt.fields.map(r => [r.f.n, wellById(v, r.f.well)?.use === 'irr' ? r.f.well : nearestWell(v, parcels.get(r.f.n)?.[0] ?? 0)?.id]));
  const rows = wells.map(w => {
    const served = dt.fields.filter(r => servedBy.get(r.f.n) === w.id);
    const hrs = dt.clim.map(c => sum(served.map(r => r.months[c.m].gwM3)) / m3hOf(w));
    const cap = dt.clim.map(c => wellHoursCap(w.type, c.m));
    return { w, hrs, cap };
  });
  return `<div class="tblwrap" style="max-height:420px"><table class="tbl"><thead><tr><th>${t('well')}</th><th>${t('pumpType')}</th>${dt.clim.map(c => `<th class="n">${monthName(c.m).slice(0, 3)}</th>`).join('')}<th class="n">${t('total')}</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td><b>${esc(r.w.id)}</b></td><td>${t('pt_' + r.w.type)}</td>${r.hrs.map((h, m) => `<td class="n" ${h > r.cap[m] ? `style="background:var(--danger-soft);color:var(--danger);font-weight:800" data-tip="${esc(t('overCap', { c: fmtN(r.cap[m]) }))}"` : ''}>${fmtN(h)}</td>`).join('')}<td class="n"><b>${fmtN(sum(r.hrs))}</b></td></tr>`).join('')}</tbody></table></div><p class="tiny muted">${t('hoursNote')}</p>`;
}

function leverSummary(lv) {
  const parts = [];
  if (lv.riceToMaize) parts.push(t('lv_riceToMaize') + ' ' + fmtPct(lv.riceToMaize * 100));
  if (lv.solarShare) parts.push(t('lv_solarShare') + ' ' + fmtPct(lv.solarShare * 100));
  if (lv.quota) parts.push(t('lv_quota') + ' ' + fmtN(lv.quota) + ' mm');
  if (lv.rotation) parts.push(t('lv_rotation') + ' ' + fmtPct(lv.rotation * 100));
  if (lv.efficiency) parts.push(t('lv_efficiency') + ' ' + fmtPct(lv.efficiency * 100));
  if (lv.ponds) parts.push(t('lv_ponds') + ' ' + lv.ponds);
  if (lv.drought) parts.push(t('lv_drought'));
  return parts.join(' · ') || t('lvNone');
}

function scenCard(v, s) {
  const st = scenState(v);
  const lv = scenLevers(v, s.id);
  const on = st.picked.includes(s.id);
  const custom = s.id === 'custom' ? `<div class="fgrid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${LEVERS_UI.map(([k, min, max, step, kind]) => {

function bindScenarios(v) {
  const st = scenState(v);
  $$('[data-pick]').forEach(cb => (cb.onchange = () => {
    st.picked = cb.checked ? [...new Set([...st.picked, cb.dataset.pick])] : st.picked.filter(x => x !== cb.dataset.pick);
    persist('scen');
    rerender();
  }));
  $$('[data-lv]').forEach(r => {
    r.oninput = () => {
      const k = r.dataset.lv;
      const val = Number(r.value);
      st.custom[k] = val;

async function runLab(v) {
  const st = scenState(v);
  const ids = st.picked.includes('bau') ? st.picked : ['bau', ...st.picked];
  if (!ids.length || LAB.busy) return;
  LAB.busy = true;
  rerender();
  await runScenarios(v, ids, (i, n, id) => {
    Object.assign(LAB, { i, n, cur: id });
    if (!$('#scBar')) return;
    $('#scBar').style.width = (i / n) * 100 + '%';
    $('#scProg').textContent = id ? t('scRunning', { s: scenName(id), i: i + 1, n }) : '';
  });
  LAB.busy = false;
  logEvent('lg_scen', { n: ids.length }, 'scenarios');
  notify('nt_scenDone', { n: ids.length }, { route: 'scenarios', level: 'ok' });
  if (curRoute === 'scenarios') rerender();
  toast(t('scDone'), 'ok');
}

/** One summary row per scenario, with a 0-100 score: 40 % water table, 30 % net income, 30 % wells kept wet. */
function rankRows(v, ids) {
  const st = scenState(v);
  const rows = ids.map(id => {
    const ys = st.results[id].years;
    const avg = k => mean(ys.map(y => y[k]));
    return { id, dtw: ys.at(-1).dtw, dry: ys.at(-1).dry, pump: avg('pump'), cost: avg('cost'), income: avg('income'), net: avg('income') - avg('cost') };
  });
  const norm = (k, better) => {
    const vals = rows.map(r => r[k]);
    const a = Math.min(...vals);
    const b = Math.max(...vals);
    rows.forEach(r => (r['n_' + k] = b > a ? (better === 'low' ? (b - r[k]) / (b - a) : (r[k] - a) / (b - a)) : 1));
  };
  norm('dtw', 'low');
  norm('net', 'high');
  norm('dry', 'low');
  rows.forEach(r => (r.score = Math.round(100 * (0.4 * r.n_dtw + 0.3 * r.n_net + 0.3 * r.n_dry))));
  return rows;
}

function rankTable(v, ids) {
  const rows = rankRows(v, ids);
  const bau = rows.find(r => r.id === 'bau');
  const dir = { score: -1, dtw: 1, dry: 1, pump: 1, cost: 1, income: -1, net: -1 }[LAB.sort] || -1;
  rows.sort((a, b) => dir * (a[LAB.sort] - b[LAB.sort]));
  const th = (k, lbl) => `<th class="n"><button type="button" data-sort="${k}">${lbl}${LAB.sort === k ? ic('sort') : ''}</button></th>`;
  const html = `<div class="tblwrap"><table class="tbl rank"><thead><tr><th>#</th><th>${t('scenario')}</th>${th('dtw', t('y10Depth'))}<th class="n">${t('vsBau')}</th>${th('dry', t('dryY10'))}${th('pump', t('pumpYr'))}${th('cost', t('energyYr'))}${th('income', t('incomeYr'))}${th('net', t('netYr'))}${th('score', t('score'))}</tr></thead><tbody>
    ${rows.map((r, i) => `<tr><td>${i + 1}</td><td class="nowrap"><span class="swatchdot" style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${SCENARIOS.find(s => s.id === r.id).color}"></span> ${scenName(r.id)}</td><td class="n">${fmtDepth(r.dtw)}</td><td class="n">${bau && r.id !== 'bau' ? `<span class="delta ${r.dtw > bau.dtw ? 'up' : 'down'}">${r.dtw > bau.dtw ? '+' : ''}${fmtN(toUnit(r.dtw - bau.dtw), 2)}</span>` : '–'}</td><td class="n">${r.dry}</td><td class="n">${fmtN(r.pump / 1e6, 2)}</td><td class="n">${fmtRs(r.cost)}</td><td class="n">${fmtRs(r.income)}</td><td class="n">${fmtRs(r.net)}</td><td class="n"><span class="chip ${r.score >= 66 ? 'leaf' : r.score >= 33 ? 'wheat' : 'bad'}">${r.score}</span></td></tr>`).join('')}</tbody></table></div>`;
  later(() => $$('[data-sort]').forEach(b => (b.onclick = () => {
    LAB.sort = b.dataset.sort;
    rerender();
  })));
  return html;
}

function dryBarSpec(v, ids) {

// ---------- water budget (Sankey), sustainable yield and a fair quota allocator ----------

function budgetList(y, areaM2) {

  return `${BUD_IN.filter(k => y.inn[k] > 1).map(k => row(k, y.inn[k], IN_COLORS[k], 'in')).join('')}<hr style="border:0;border-top:1px dashed var(--line-2)">${BUD_OUT.filter(k => y.out[k] > 1).map(k => row(k, y.out[k], OUT_COLORS[k], 'out')).join('')}
    <p class="small mt"><b>${t('closure')}:</b> ${fmtN(y.err, 5)}% · IN ${fmtMm3(y.IN)} · OUT ${fmtMm3(y.OUT)}</p>`;
}

/** Sankey: inflows on the left, the aquifer in the middle, outflows on the right. */
function sankeyChart(o) {
  const { w, h, y } = o;
  const ins = BUD_IN.filter(k => y.inn[k] > 1).map(k => ({ k, v: y.inn[k], c: IN_COLORS[k], label: t('bi_' + k) }));
  const outs = BUD_OUT.filter(k => y.out[k] > 1).map(k => ({ k, v: y.out[k], c: OUT_COLORS[k], label: t('bo_' + k) }));
  const gap = 10;
  const total = Math.max(y.IN, y.OUT);
  const scale = (h - 30 - gap * Math.max(ins.length, outs.length)) / total;
  const nodeW = 12;
  const narrow = w < 560;
  const xL = narrow ? 4 : 130;
  const xR = w - (narrow ? 16 : 140);
  const cx = w / 2 - nodeW / 2;
  let svg = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" class="sankey" aria-hidden="true">`;
  const lay = (list, x, side) => {
    let yy = 15;
    let lastLab = -Infinity;
    let cy = 15 + (h - 30 - (side === 'in' ? y.IN : y.OUT) * scale) / 2;
    list.forEach(n => {
      const hh = Math.max(2, n.v * scale);
      const band = side === 'in' ? flowBand(x + nodeW, yy, cx, cy, hh) : flowBand(cx + nodeW, cy, x, yy, hh);
      svg += `<path d="${band}" fill="${n.c}" opacity=".55" data-tip="${esc(`<b>${n.label}</b><br>${fmtMm3(n.v)}`)}"/>`;
      svg += `<rect x="${x}" y="${yy}" width="${nodeW}" height="${hh}" rx="3" fill="${n.c}"/>`;
      const tx = side === 'in' ? (narrow ? x + nodeW + 4 : x - 6) : narrow ? x - 4 : x + nodeW + 6;
      const anchor = side === 'in' ? (narrow ? 'start' : 'end') : narrow ? 'end' : 'start';
      const ly = Math.max(yy + hh / 2 - 1, lastLab + 26);
      if (hh > 9 || !narrow) {
        svg += `<text x="${tx}" y="${ly}" text-anchor="${anchor}">${esc(n.label)}</text><text class="v" x="${tx}" y="${ly + 12}" text-anchor="${anchor}">${fmtN(n.v / 1e6, 2)}</text>`;
        lastLab = ly;
      }
      yy += hh + gap;
      cy += hh;
    });
  };
  lay(ins, xL, 'in');
  lay(outs, xR, 'out');
  const ch = total * scale;
  svg += `<rect x="${cx}" y="${15 + (h - 30 - ch) / 2}" width="${nodeW}" height="${ch}" rx="4" fill="#143e63"/><text x="${cx + nodeW / 2}" y="${10 + (h - 30 - ch) / 2}" text-anchor="middle">${t('aquifer')}</text>`;
  return svg + '</svg>';
}

/** A curved band of constant thickness from (x0, y0) to (x1, y1). */
function flowBand(x0, y0, x1, y1, hh) {
  const mx = (x0 + x1) / 2;
  return `M${x0} ${y0}C${mx} ${y0} ${mx} ${y1} ${x1} ${y1}L${x1} ${y1 + hh}C${mx} ${y1 + hh} ${mx} ${y0 + hh} ${x0} ${y0 + hh}Z`;
}

/** Pumping that would have left storage unchanged, averaged over the history years. */
function sustainableYield(run) {
  const hist = yearBudgets(run).slice(0, HIST_MONTHS / 12);
  const per = hist.map(y => y.out.pump + (y.out.storage - y.inn.storage));
  const pump = mean(hist.map(y => y.out.pump));
  return { sy: mean(per), pump, deficit: pump - mean(per) };
}

function syTiles(sy, run) {
  const tile = (icon, lbl, val, note, cls = '') => `<div class="kpi ${cls}"><div class="lbl">${ic(icon)}${lbl}</div><div class="val">${val}</div><div class="note">${note}</div></div>`;
  const drop = run.steps[HIST_MONTHS - 1].dtw - run.steps[0].dtw;
  return [
    tile('droplet', t('avgPumping'), fmtMm3(sy.pump), t('perYearHist')),
    tile('scale', t('safeYield'), fmtMm3(sy.sy), t('safeYieldNote'), 'good'),
    tile('alert', t('overdraft'), fmtMm3(Math.max(0, sy.deficit)), t('overdraftNote', { p: fmtPct((100 * Math.max(0, sy.deficit)) / sy.pump) }), sy.deficit > 0 ? 'bad' : 'good'),
    tile('arrow-down', t('dropHist'), fmtDepth(drop, 2), t('dropHistNote')),
  ].join('');
}

function allocControls(v) {

    <div class="row mt"><button class="btn ghost" type="button" id="qaTest" ${BUDGET.testing ? 'disabled' : ''}>${ic('play')} ${t('testAlloc')}</button><span class="small muted">${t('testAllocHint')}</span></div><div id="qaTestOut" class="mt">${BUDGET.test && BUDGET.test.vid === v.id ? testResultHtml(BUDGET.test) : ''}</div>`;

/** Each farmer's acres, groundwater need (average year) and recent use. */
function farmerNeeds(v, run) {
  const dt = demandTable(v);
  const totalNeed = sum(dt.fields.map(r => sum(r.months.map(m => m.gwM3))));
  const last = run.years[HIST_MONTHS / 12 - 1];
  const useRatio = totalNeed ? last.pump / totalNeed : 0;
  return v.farmers.map(f => {
    const mine = dt.fields.filter(r => r.f.owner === f.id);
    const need = sum(mine.map(r => sum(r.months.map(m => m.gwM3))));
    return { id: f.id, acres: sum(mine.map(r => r.area)) / ACRE_M2, need, use: need * useRatio };
  }).filter(x => x.acres > 0);
}

/** Weighted shares by acreage and need, a per-acre floor, then the reserve held back. */
function allocate(v, run, sy) {
  const q = quotaCfg(v);
  const rows = farmerNeeds(v, run);
  const pool = Math.max(0, sy.sy) * (1 - q.reserve);
  const A = sum(rows.map(r => r.acres));
  const N = sum(rows.map(r => r.need)) || 1;
  rows.forEach(r => (r.alloc = pool * (q.wAcre * (r.acres / A) + (1 - q.wAcre) * (r.need / N))));
  const floorOf = r => q.floor * pool * (r.acres / A);
  const short = sum(rows.map(r => Math.max(0, floorOf(r) - r.alloc)));
  const above = rows.filter(r => r.alloc > floorOf(r));
  const spare = sum(above.map(r => r.alloc - floorOf(r))) || 1;
  rows.forEach(r => {
    if (r.alloc < floorOf(r)) r.alloc = floorOf(r);
    else r.alloc -= (short * (r.alloc - floorOf(r))) / spare;
  });
  rows.forEach(r => (r.balance = r.alloc - r.use));
  return { rows, pool };
}

function renderAllocation(v, run, sy) {
  const { rows, pool } = allocate(v, run, sy);
  const trades = tradeTotals(v);
  const acreIn = m3 => m3 / (ACRE_M2 * 0.0254);
  $('#bgAlloc').innerHTML = `<p class="small"><b>${t('pool')}:</b> ${fmtMm3(pool)} · ${t('poolNote')}</p>
    <div class="tblwrap" style="max-height:440px"><table class="tbl"><thead><tr><th>${t('farmer')}</th><th class="n">${t('u_acres')}</th><th class="n">${t('needM3')}</th><th class="n">${t('allocM3')}</th><th class="n">${t('acreInches')}</th><th class="n">${t('useM3')}</th><th class="n">${t('balanceM3')}</th><th class="n">${t('afterTrades')}</th></tr></thead><tbody>
    ${rows.map(r => {
      const net = r.balance + (trades.get(r.id) || 0);
      return `<tr><td><b>${esc(farmerName(v, r.id))}</b></td><td class="n">${fmtN(r.acres, 0)}</td><td class="n">${fmtN(r.need)}</td><td class="n">${fmtN(r.alloc)}</td><td class="n">${fmtN(acreIn(r.alloc) / r.acres, 1)}</td><td class="n">${fmtN(r.use)}</td><td class="n"><span class="chip ${r.balance >= 0 ? 'leaf' : 'bad'}">${r.balance >= 0 ? '+' : ''}${fmtN(r.balance)}</span></td><td class="n"><b class="${net >= 0 ? 'delta down' : 'delta up'}">${net >= 0 ? '+' : ''}${fmtN(net)}</b></td></tr>`;
    }).join('')}</tbody></table></div><p class="tiny muted">${t('allocNote')}</p>`;
}

function bindBudget(v, run, sy) {
  $('#bgYear').onchange = e => {

}

/** Per-well yearly quotas from the farmer allocations (split by the area each well serves). */
function wellQuotas(v, run, sy) {
  const { rows } = allocate(v, run, sy);
  const parcels = parcelsOf(v);
  const out = {};
  rows.forEach(r => {
    const fields = v.fields.filter(f => f.owner === r.id);
    const area = sum(fields.map(f => (parcels.get(f.n) || []).length)) || 1;
    fields.forEach(f => {
      const wid = wellById(v, f.well)?.use === 'irr' ? f.well : nearestWell(v, (parcels.get(f.n) || [0])[0])?.id;
      if (wid) out[wid] = (out[wid] || 0) + (r.alloc * (parcels.get(f.n) || []).length) / area;
    });
  });
  return out;
}

async function testAllocation(v, run, sy) {

}

function testResultHtml(tr) {

// ---------- tradable water credits ledger ----------

/** Net credits moved per farmer: + bought, - sold (m3). */
function tradeTotals(v) {
  const m = new Map();
  ledgerOf(v.id).forEach(tr => {
    m.set(tr.to, (m.get(tr.to) || 0) + tr.vol);
    m.set(tr.from, (m.get(tr.from) || 0) - tr.vol);
  });
  return m;
}

function renderLedger(v, run, sy) {
  const box = $('#bgLedger');
  if (!box) return;
  const list = [...ledgerOf(v.id)].sort((a, b) => b.date.localeCompare(a.date));
  const vol = sum(list.map(x => x.vol));
  const value = sum(list.map(x => x.vol * x.price));
  box.innerHTML = `<div class="between"><h3>${ic('wallet')} ${t('ledgerTitle')}</h3><div class="row"><button class="btn ghost sm" type="button" id="lgCsv">${ic('download')} ${t('exportCsv')}</button><button class="btn sm" type="button" id="lgAdd">${ic('plus')} ${t('newTrade')}</button></div></div>
    <p class="sub">${t('ledgerSub')}</p><div class="row" style="margin-bottom:.6rem"><span class="chip aq">${t('tradesN', { n: list.length })}</span><span class="chip">${fmtN(vol)} ${t('u_m3')}</span><span class="chip wheat">${fmtRs(value)}</span><span class="chip illus">${t('pricesIllustrative')}</span></div>
    ${list.length ? `<div class="tblwrap" style="max-height:360px"><table class="tbl"><thead><tr><th>${t('date')}</th><th>${t('seller')}</th><th>${t('buyer')}</th><th class="n">${t('u_m3')}</th><th class="n">${t('rsPerM3')}</th><th class="n">${t('value')}</th><th>${t('note')}</th><th></th></tr></thead><tbody>
    ${list.map(tr => `<tr><td class="nowrap">${tr.date}</td><td>${esc(farmerName(v, tr.from))}</td><td>${esc(farmerName(v, tr.to))}</td><td class="n">${fmtN(tr.vol)}</td><td class="n">${fmtN(tr.price, 2)}</td><td class="n">${fmtRs(tr.vol * tr.price)}</td><td class="small">${esc(txtOf(tr, 'note'))}</td><td><button class="ibtn sm" type="button" data-deltr="${tr.id}" aria-label="${t('delete')}">${ic('trash')}</button></td></tr>`).join('')}</tbody></table></div>` : `<div class="empty">${ic('wallet')}<p>${t('noTrades')}</p></div>`}`;
  $('#lgAdd', box).onclick = () => openTradeForm(v, run, sy);
  $('#lgCsv', box).onclick = () => downloadFile(`credits-${v.id}.csv`, toCsv([['date', 'seller', 'buyer', 'volume_m3', 'price_rs_per_m3', 'note'], ...list.map(x => [x.date, farmerName(v, x.from), farmerName(v, x.to), x.vol, x.price, txtOf(x, 'note')])]), 'text/csv');
  $$('[data-deltr]', box).forEach(b => (b.onclick = () => deleteTrade(v, b.dataset.deltr, run, sy)));
}

/** Credits a farmer can still sell: allocation minus use, plus net trades. */
function availableCredits(v, run, sy, fid) {
  const r = allocate(v, run, sy).rows.find(x => x.id === fid);
  return r ? r.balance + (tradeTotals(v).get(fid) || 0) : 0;
}

function openTradeForm(v, run, sy) {
  const sellers = allocate(v, run, sy).rows.map(r => [r.id, `${farmerName(v, r.id)} (${fmtN(availableCredits(v, run, sy, r.id))} ${t('u_m3')})`]);
  const sh = openModal(`${sheetHead(t('newTrade'), 'wallet')}<p class="small muted">${t('tradeHint')}</p><div class="fgrid">
    ${selectField('trFrom', t('seller'), sellers, sellers[0]?.[0])}${selectField('trTo', t('buyer'), v.farmers.map(f => [f.id, farmerName(v, f.id)]), v.farmers[1]?.id)}
    ${numField('trVol', t('volumeM3'), 5000, { min: 100, max: 1e6, step: 100 })}${numField('trPrice', t('rsPerM3'), 3, { min: 0, max: 100, step: 0.1 })}
    <label class="field"><span>${t('date')}</span><input id="trDate" type="date" value="${TODAY}" max="${TODAY}"></label><label class="field"><span>${t('note')}</span><input id="trNote" maxlength="80"></label></div>
    <div class="sfoot"><button class="btn ghost" type="button" data-close>${t('cancel')}</button><button class="btn" type="button" id="trSave">${ic('check')} ${t('recordTrade')}</button></div>`);
  $('#trSave', sh).onclick = () => {
    const vol = readNum(sh, 'trVol', 100, 1e6);
    const price = readNum(sh, 'trPrice', 0, 100);
    const from = $('#trFrom', sh).value;
    const to = $('#trTo', sh).value;
    if (vol == null || price == null) return;
    if (from === to) return toast(t('tradeSame'), 'bad');
    const avail = availableCredits(v, run, sy, from);
    if (vol > avail) return toast(t('tradeTooBig', { a: fmtN(Math.max(0, avail)) }), 'bad');
    ledgerOf(v.id).push({ id: uid('t'), date: $('#trDate', sh).value || TODAY, from, to, vol, price, note: $('#trNote', sh).value.trim() });
    persist('ledger');
    logEvent('lg_trade', { a: farmerName(v, from), b: farmerName(v, to), n: fmtN(vol) }, 'budget');
    closeModal();
    renderAllocation(v, run, sy);
    renderLedger(v, run, sy);
    toast(t('tradeSaved'), 'ok');
  };
}

async function deleteTrade(v, id, run, sy) {
  if (!(await askConfirm(t('confirmDelTrade'), { danger: true, okText: t('delete') }))) return;
  S.ledger[v.id] = ledgerOf(v.id).filter(x => x.id !== id);
  persist('ledger');
  renderAllocation(v, run, sy);
  renderLedger(v, run, sy);
}

// ---------- village meeting: agenda, options, vote tally, full-screen story and minutes ----------
const MEET = { draftOptions: null, slide: 0, mid: '' };
const SLIDES = ['title', 'stand', 'history', 'flows', 'future', 'options', 'vote', 'decision'];

/** The open (not yet closed) meeting of this village, created on demand. */
function openMeeting(v) {
  let m = meetingsOf(v.id).find(x => !x.closed);
  if (!m) {
    m = { id: uid('m'), date: TODAY, title: t('defaultMeetingTitle'), place: t('defaultMeetingPlace'), chair: v.farmers[0] ? farmerName(v, v.farmers[0].id) : '', attendees: 30, options: ['bau', 'rice', 'quota', 'ponds'], votes: {}, decision: '', actions: '', agenda: t('defaultAgenda'), closed: false };
    meetingsOf(v.id).unshift(m);
    persist('meetings');
  }
  if (MEET.draftOptions) {
    m.options = MEET.draftOptions;
    MEET.draftOptions = null;
    persist('meetings');
  }
  return m;
}

function renderMeeting() {
  const v = V();
  const m = openMeeting(v);
  const st = scenState(v);
  const past = meetingsOf(v.id).filter(x => x.closed);
  $('#view').innerHTML = `${pageHead(t('nav_meeting'), t('mtSub'), `<button class="btn soil" type="button" id="mtStart">${ic('maximize')} ${t('startPresentation')}</button>`)}

function readMeetingForm(m) {
  const att = Number($('#mtAtt').value);

function bindMeeting(v, m) {
  $$('#mtOpts [data-o]').forEach(b => (b.onclick = () => {
    const o = b.dataset.o;
    m.options = m.options.includes(o) ? m.options.filter(x => x !== o) : [...m.options, o];
    b.classList.toggle('on');
    b.setAttribute('aria-pressed', m.options.includes(o));
    persist('meetings');
    $('#mtVotes').innerHTML = voteRows(m);
    bindVotes(m, $('#view'));
    settle($('#mtVotes'));
  }));
  $('#mtSave').onclick = () => {
    readMeetingForm(m);
    persist('meetings');
    toast(t('saved'), 'ok');
  };
  $('#mtStart').onclick = () => {
    readMeetingForm(m);
    persist('meetings');
    startStage(v, m);
  };
  $('#mtClose').onclick = () => closeVote(v, m);
  bindVotes(m, $('#view'));
  $$('[data-print]').forEach(b => (b.onclick = () => printMinutes(v, meetingsOf(v.id).find(x => x.id === b.dataset.print))));
  $$('[data-delm]').forEach(b => (b.onclick = async () => {
    if (!(await askConfirm(t('confirmDelMeeting'), { danger: true, okText: t('delete') }))) return;
    S.meetings[v.id] = meetingsOf(v.id).filter(x => x.id !== b.dataset.delm);
    persist('meetings');
    rerender();
  }));
}

function bindVotes(m, root) {
  $$('[data-vote]', root).forEach(b => (b.onclick = () => {
    const o = b.dataset.vote;
    m.votes[o] = Math.max(0, (m.votes[o] || 0) + Number(b.dataset.d));
    persist('meetings');
    const box = $('#stage').classList.contains('on') ? $('#stVotes') : $('#mtVotes');
    if (!box) return;
    box.innerHTML = $('#stage').classList.contains('on') ? stageVoteRows(m) : voteRows(m);
    bindVotes(m, box.parentElement);
    settle(box);
  }));
}

async function closeVote(v, m) {
  if ($('#mtActions')) readMeetingForm(m);
  const total = sum(m.options.map(o => m.votes[o] || 0));
  if (!total) return toast(t('noVotes'), 'bad');
  if (!(await askConfirm(t('confirmCloseVote'), { okText: t('mtCloseVote') }))) return;
  m.decision = m.options.reduce((a, b) => ((m.votes[b] || 0) > (m.votes[a] || 0) ? b : a));
  m.closed = true;
  persist('meetings');
  logEvent('lg_meeting', { d: scenName(m.decision) }, 'meeting');
  notify('nt_decision', { d: scenName(m.decision) }, { route: 'meeting', level: 'ok' });
  closeStage();
  rerender();
  toast(t('decisionSaved', { d: scenName(m.decision) }), 'ok');
}

// ---------- full-screen meeting presentation (big visuals, short Urdu captions) ----------

async function startStage(v, m) {
  const st = scenState(v);
  const missing = m.options.filter(o => !st.results[o] || st.stale);
  if (missing.length) {
    toast(t('preparingOptions', { n: missing.length }));
    await runScenarios(v, [...new Set(['bau', ...missing])], () => {});
  }
  await ensureRun(v);
  MEET.slide = 0;
  MEET.mid = m.id;
  $('#stage').classList.add('on');
  document.body.style.overflow = 'hidden';
  renderStage();
  if (document.documentElement.requestFullscreen && !calm()) document.documentElement.requestFullscreen().catch(() => {});
}

function closeStage() {
  if (!$('#stage').classList.contains('on')) return;
  $('#stage').classList.remove('on');
  $('#stage').innerHTML = '';
  document.body.style.overflow = '';
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}

function stageMove(d) {
  MEET.slide = clamp(MEET.slide + d, 0, SLIDES.length - 1);
  renderStage();
}

const stageCap = k => `<p class="cap ur" lang="ur">${tIn('ur', k)}</p>${lang === 'en' ? `<p class="cap">${tIn('en', k)}</p>` : ''}`;

    <div class="row"><button class="btn wheat" type="button" id="stDecide" ${total ? '' : 'disabled'}>${ic('check')} ${t('mtCloseVote')}</button></div>`;

// ---------- map: offline schematic always; Leaflet 1.9.4 street map only when asked ----------
const LEAFLET_JS = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
const LEAFLET_CSS = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
const MAPV = { mode: 'schematic', lmap: null, loading: false };

/** Corner coordinates of the village grid from its centre (flat-earth approximation, fine at 4 km). */
function villageBounds(v) {
  const w = v.nx * v.cell;
  const h = v.ny * v.cell;
  const dLat = h / 2 / 111320;
  const dLng = w / 2 / (111320 * Math.cos(deg2rad(v.lat)));
  return { n: v.lat + dLat, s: v.lat - dLat, e: v.lng + dLng, w: v.lng - dLng };
}
const cellLatLng = (v, i) => {
  const b = villageBounds(v);
  const [x, y] = cellXY(v, i);
  return [b.n - ((y + 0.5) / v.ny) * (b.n - b.s), b.w + ((x + 0.5) / v.nx) * (b.e - b.w)];
};

function renderMap() {
  const v = V();
  const b = villageBounds(v);

/** The village grid, canals, abadi, wells, a north arrow and a 1 km scale bar. */
function schematicSvg(v, b) {
  const W = v.nx * 10;
  const H = v.ny * 10;
  let s = `<svg viewBox="-52 -22 ${W + 80} ${H + 56}" role="img" aria-label="${t('schematicAria')}" style="background:var(--card-2);border-radius:12px">`;
  v.cells.forEach((c, i) => {
    const [x, y] = cellXY(v, i);
    s += `<rect x="${x * 10}" y="${y * 10}" width="10.4" height="10.4" fill="${CELL_COLORS[c]}"/>`;
  });
  v.wells.forEach(w => {
    const [x, y] = cellXY(v, w.cell);
    s += `<circle cx="${x * 10 + 5}" cy="${y * 10 + 5}" r="3.2" fill="${w.use === 'mon' ? '#fff' : '#2a1d14'}" stroke="#fff" stroke-width="1" data-tip="${esc(`<b>${w.id}</b><br>${fmtN(cellLatLng(v, w.cell)[0], 5)}, ${fmtN(cellLatLng(v, w.cell)[1], 5)}`)}"/>`;
  });
  s += `<rect x="0" y="0" width="${W}" height="${H}" fill="none" stroke="var(--ink)" stroke-width="1.5"/>`;
  s += `<g font-size="9" fill="var(--muted)" font-family="var(--font)"><text x="0" y="-6">${fmtN(b.w, 3)}°E</text><text x="${W}" y="-6" text-anchor="end">${fmtN(b.e, 3)}°E</text><text x="-4" y="8" text-anchor="end">${fmtN(b.n, 3)}°</text><text x="-4" y="${H}" text-anchor="end">${fmtN(b.s, 3)}°</text></g>`;
  const km = 1000 / v.cell * 10;
  s += `<g transform="translate(0 ${H + 16})"><rect width="${km}" height="5" fill="var(--ink)"/><rect x="${km / 2}" width="${km / 2}" height="5" fill="var(--card)" stroke="var(--ink)" stroke-width=".8"/><text x="${km}" y="16" font-size="9" fill="var(--muted)" text-anchor="end">1 km</text></g>`;
  s += `<g transform="translate(${W + 14} 6)"><path d="M0 14 6 -4 12 14 6 9z" fill="var(--ink)"/><text x="6" y="26" font-size="10" text-anchor="middle" fill="var(--ink)" font-weight="800">N</text></g>`;
  return s + '</svg>';
}

function setVillageCentre(v, lat, lng) {
  v.lat = round(lat, 5);
  v.lng = round(lng, 5);
  persist('villages');
  markStale(v);
  logEvent('lg_mapMove', { lat: v.lat, lng: v.lng }, 'map');
  rerender();
  toast(t('saved'), 'ok');
}

function locateMe(v) {
  if (!('geolocation' in navigator)) return toast(t('geoMissing'), 'bad');
  navigator.geolocation.getCurrentPosition(p => setVillageCentre(v, p.coords.latitude, p.coords.longitude), () => toast(t('geoDenied'), 'bad'), { timeout: 10000 });
}

/** Load a script or stylesheet once, with a timeout. */
function loadAsset(url, kind) {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`[data-src="${url}"]`)) return resolve();
    const el = document.createElement(kind === 'css' ? 'link' : 'script');
    el.dataset.src = url;
    if (kind === 'css') Object.assign(el, { rel: 'stylesheet', href: url });
    else Object.assign(el, { src: url, async: true });
    const timer = setTimeout(() => reject(new Error('timeout')), 9000);
    el.onload = () => {
      clearTimeout(timer);
      resolve();
    };
    el.onerror = () => {
      clearTimeout(timer);
      el.remove();
      reject(new Error('load'));
    };
    document.head.append(el);
  });
}

async function loadLeaflet(v) {
  MAPV.loading = true;
  $('#mpLoad').disabled = true;
  try {
    await Promise.all([loadAsset(LEAFLET_CSS, 'css'), loadAsset(LEAFLET_JS, 'js')]);
    if (!window.L) throw new Error('no L');
    MAPV.mode = 'leaflet';
    logEvent('lg_leaflet', {}, 'map');
  } catch {
    MAPV.mode = 'schematic';
    toast(t('leafletFailed'), 'bad');
  }
  MAPV.loading = false;
  if (curRoute === 'map') rerender();
}

function mountLeaflet(v) {
  const el = $('#leafMap');
  if (!el || !window.L) return;
  dropLeaflet();
  const b = villageBounds(v);
  const map = window.L.map(el, { scrollWheelZoom: false }).setView([v.lat, v.lng], 14);
  window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
  window.L.rectangle([[b.s, b.w], [b.n, b.e]], { color: '#22608f', weight: 2, fillOpacity: 0.08 }).addTo(map).bindTooltip(esc(vName(v)));
  v.wells.forEach(w => window.L.circleMarker(cellLatLng(v, w.cell), { radius: 5, color: '#fff', weight: 1, fillColor: w.use === 'mon' ? '#22608f' : '#2a1d14', fillOpacity: 1 }).addTo(map).bindPopup(`<b>${esc(w.id)}</b><br>${esc(farmerName(v, w.owner))}`));
  map.on('click', async e => {
    if (await askConfirm(t('moveVillageHere'), { okText: t('confirm') })) setVillageCentre(v, e.latlng.lat, e.latlng.lng);
  });
  MAPV.lmap = map;
}

function dropLeaflet() {
  if (MAPV.lmap) {
    MAPV.lmap.remove();
    MAPV.lmap = null;
  }
}

function showSchematic() {
  dropLeaflet();
  MAPV.mode = 'schematic';
  rerender();
}

function renderQuiz() {
  const q = QUIZ[QZ.i];
  if (QZ.done) return renderQuizResult();
  const pick = QZ.picks[QZ.i];
  const answered = pick != null;
  $('#view').innerHTML = `${pageHead(t('quizTitle'), t('quizSub'), `<a class="btn ghost" href="#learn">${ic('chevron-left', 'flip')} ${t('allGuides')}</a>`)}

    rerender();
  }));

    if (QZ.i === QUIZ.length - 1) finishQuiz();
    else QZ.i++;

  };

function finishQuiz() {
  const score = QUIZ.filter((q, i) => QZ.picks[i] === q.a).length;
  S.quiz.unshift({ ts: now(), score });
  S.quiz = S.quiz.slice(0, 20);
  persist('quiz');
  logEvent('lg_quiz', { s: score, n: QUIZ.length }, 'learn');
  QZ.done = true;
}

function renderQuizResult() {
  const score = S.quiz[0]?.score ?? 0;
  $('#view').innerHTML = `${pageHead(t('quizTitle'), '')}<section class="card core article" style="text-align:center">${ringScore(score / QUIZ.length)}
    <h3 style="justify-content:center">${t('yourScore', { s: score, n: QUIZ.length })}</h3><p>${score >= 10 ? t('quizGreat') : score >= 6 ? t('quizGood') : t('quizTry')}</p>

function ringScore(frac) {
  const r = 46;
  const L2 = 2 * Math.PI * r;
  return `<svg viewBox="0 0 112 112" width="120" height="120" aria-hidden="true"><circle cx="56" cy="56" r="${r}" fill="none" stroke="var(--card-2)" stroke-width="10"/><circle cx="56" cy="56" r="${r}" fill="none" stroke="var(--leaf)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${L2}" stroke-dashoffset="${L2 * (1 - frac)}" transform="rotate(-90 56 56)" style="transition:stroke-dashoffset .8s var(--ease)"/><text x="56" y="62" text-anchor="middle" font-size="20" font-weight="800" fill="var(--ink)" font-family="var(--font-head)">${Math.round(frac * 100)}%</text></svg>`;
}

function importAll(text) {
  try {
    const pack = JSON.parse(text);
    if (pack.app !== 'zer-e-zameen' || !Array.isArray(pack.data?.villages) || !pack.data.villages.length) throw new Error('shape');
    KEYS.forEach(k => pack.data[k] !== undefined && store.set(k, pack.data[k]));
    S = loadState();
    if (!S) throw new Error('load');
    applyCropOverrides();
    RUNS.clear();
    applyPrefs();
    logEvent('lg_import', {}, 'settings');
    rerender();
    ensureRun(V());
    toast(t('importDone'), 'ok');
  } catch {
    toast(t('importFailed'), 'bad');
  }
}

async function resetAll() {

  seedApp();

}

function openPalette() {
  if ($('#stage').classList.contains('on')) return;
  closeModal();
  const p = $('#palette');
  p.innerHTML = `<div class="palbox"><input class="inp" id="palIn" type="search" placeholder="${t('searchAll')}" aria-label="${t('searchAll')}" autocomplete="off" dir="auto"><div class="palres" id="palRes" role="listbox"></div><div class="palhint">${t('palHint')}</div></div>`;
  p.classList.add('on');
  const index = paletteIndex();
  const draw = () => {
    const q = $('#palIn').value.trim().toLowerCase();
    palItems = (q ? index.filter(i => (i.label + ' ' + i.sub).toLowerCase().includes(q)) : index.filter(i => ['sg_pages', 'sg_actions'].includes(i.group))).slice(0, 40);
    palSel = 0;
    let last = '';
    $('#palRes').innerHTML = palItems.map((it, i) => {
      const head = it.group !== last ? `<div class="pg">${t(it.group)}</div>` : '';
      last = it.group;
      return `${head}<button type="button" role="option" data-i="${i}" class="${i === 0 ? 'on' : ''}" aria-selected="${i === 0}">${ic(it.icon)}<span dir="auto">${esc(it.label)}</span><small dir="auto">${esc(it.sub)}</small></button>`;
    }).join('') || `<div class="empty">${t('sg_none')}</div>`;
    $$('#palRes [data-i]').forEach(b => (b.onclick = () => runPal(Number(b.dataset.i))));
    if (q) announce(t('sg_count', { n: palItems.length }));
  };
  $('#palIn').oninput = draw;
  $('#palIn').onkeydown = palKeys;
  p.onclick = e => e.target === p && closePalette();
  draw();
  setTimeout(() => $('#palIn').focus(), 30);
}

function palKeys(e) {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    palSel = clamp(palSel + (e.key === 'ArrowDown' ? 1 : -1), 0, palItems.length - 1);
    $$('#palRes [data-i]').forEach(b => {
      const on = Number(b.dataset.i) === palSel;
      b.classList.toggle('on', on);
      b.setAttribute('aria-selected', on);
    });
    $('#palRes .on')?.scrollIntoView({ block: 'nearest' });
  }
  if (e.key === 'Enter' && palItems[palSel]) runPal(palSel);
}

function runPal(i) {
  const it = palItems[i];
  closePalette();
  if (it) it.run();
}

function closePalette() {
  const p = $('#palette');
  if (!p.classList.contains('on')) return false;
  p.classList.remove('on');
  p.innerHTML = '';
  return true;
}

const TOUR = [
  { sel: '#vSwitch', k: 'tour1' },
  { sel: '#hmXsec', k: 'tour2' },

  { sel: '#hmPlay', k: 'tour4' },

  { sel: '[data-nav="scenarios"]', k: 'tour7' },
  { sel: '#langBtn', k: 'tour8' },
];
let tourStep = -1;
const visibleEl = sel => $$(sel).find(el => el.getClientRects().length && getComputedStyle(el).visibility !== 'hidden');

function startTour() {
  closeModal();
  closePalette();
  if (curRoute !== 'home') go('home');
  tourStep = 0;
  $('#tour').classList.add('on');
  setTimeout(showTourStep, 450);
}

function endTour() {
  tourStep = -1;
  $('#tour').classList.remove('on');
  S.settings.tourDone = true;
  persist('settings');
}

function placeTip(el) {
  const rect = el.getBoundingClientRect();
  const tip = $('#tourTip');
  const p = 6;
  Object.assign($('#tourSpot').style, { left: rect.left - p + 'px', top: rect.top - p + 'px', width: rect.width + p * 2 + 'px', height: rect.height + p * 2 + 'px' });
  const tw = Math.min(340, innerWidth - 32);
  const below = rect.bottom + 16;
  const top = below + tip.offsetHeight + 12 < innerHeight ? below : Math.max(12, rect.top - 16 - tip.offsetHeight);
  const left = clamp(rect.left + rect.width / 2 - tw / 2, 16, innerWidth - tw - 16);
  Object.assign(tip.style, { top: clamp(top, 12, innerHeight - tip.offsetHeight - 12) + 'px', left: left + 'px' });
}

function showTourStep() {
  const step = TOUR[tourStep];
  if (!step) return endTour();
  const el = visibleEl(step.sel);
  if (!el) {
    tourStep++;
    return showTourStep();
  }
  if (!el.closest('.top, .strata, .tabs')) el.scrollIntoView({ block: 'center', behavior: 'instant' });
  const last = tourStep === TOUR.length - 1;
  $('#tourTip').innerHTML = `<span class="tag">${t('stepXofY', { x: tourStep + 1, y: TOUR.length })}</span><h4>${t(step.k + 't')}</h4><p>${t(step.k + 'b')}</p>
    <div class="between"><div class="dots">${TOUR.map((_, i) => `<i class="${i === tourStep ? 'on' : ''}"></i>`).join('')}</div>
    <div class="row"><button type="button" class="btn ghost sm" id="tourSkip">${t('skip')}</button>${tourStep ? `<button type="button" class="btn ghost sm" id="tourBack" aria-label="${t('back')}">${ic('chevron-left', 'flip')}</button>` : ''}
    <button type="button" class="btn sm" id="tourNext">${last ? t('done') : t('next')} ${ic(last ? 'check' : 'chevron-right', last ? '' : 'flip')}</button></div></div>`;
  placeTip(el);
  $('#tourSkip').onclick = endTour;
  $('#tourNext').onclick = () => {
    tourStep++;
    showTourStep();
  };
  if ($('#tourBack')) $('#tourBack').onclick = () => {
    tourStep--;
    showTourStep();
  };
  $('#tourNext').focus({ preventScroll: true });
}

// ---------- keyboard shortcuts ----------
const KEY_PAGES = ['home', 'setup', 'readings', 'model', 'calib', 'crops', 'scenarios', 'budget', 'meeting'];

function openShortcuts() {
  const row = (keys, k) => `<div class="setrow"><span>${t(k)}</span><span class="row">${keys.map(x => `<span class="kbd">${x}</span>`).join('')}</span></div>`;
  openModal(`${sheetHead(t('shortcuts'), 'hash')}
    ${row(['/', 'Ctrl K'], 'ks_search')}${row(['1', '…', '9'], 'ks_pages')}${row(['P'], 'ks_play')}${row(['R'], 'ks_run')}${row(['M'], 'ks_meeting')}${row(['T'], 'ks_theme')}${row(['L'], 'ks_lang')}${row(['?'], 'ks_help')}${row(['←', '→'], 'ks_slides')}${row(['Esc'], 'ks_close')}`);
}

function onKey(e) {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = ['input', 'textarea', 'select'].includes(tag) && e.target.type !== 'range';
  if (e.key === 'Escape') return onEscape();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    return openPalette();
  }
  if ($('#stage').classList.contains('on') && !typing) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') return stageMove(lang === 'ur' ? -1 : 1);
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') return stageMove(lang === 'ur' ? 1 : -1);
    return;
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || modalOpen() || tourStep >= 0 || $('#palette').classList.contains('on')) return;
  const k = e.key.toLowerCase();
  if (e.key === '?') return openShortcuts();
  if (e.key === '/') {
    e.preventDefault();
    return openPalette();
  }
  if (k === 'l') return setLang(lang === 'ur' ? 'en' : 'ur');
  if (k === 't') return toggleTheme();
  if (k === 'm') return go('meeting');
  if (k === 'r') {
    markStale(V());
    return rerender();
  }
  if (k === 'p' && curRoute === 'home' && cachedRun()) return TWIN.playing ? stopPlay() : startPlay(V(), cachedRun());
  if (/^[1-9]$/.test(k)) go(KEY_PAGES[Number(k) - 1]);
}

function onEscape() {
  if (tourStep >= 0) return endTour();
  if (closeMenu()) return;
  if (closePalette()) return;
  if (modalOpen()) return closeModal();
  if ($('#stage').classList.contains('on')) return closeStage();
}

    <h2>${t('decision')}</h2><p><b>${m.decision ? scenName(m.decision) : '–'}</b></p><p class="ur" lang="ur">${tIn('ur', 'minutesUr', { d: m.decision ? tIn('ur', 'sc_' + m.decision) : '–' })}</p>
    ${txtOf(m, 'actions') ? `<h2>${t('mtActions')}</h2><p>${esc(txtOf(m, 'actions')).replace(/\n/g, '<br>')}</p>` : ''}
    <div class="sig"><div>${t('mtChair')}</div><div>${t('secretary')}</div></div>${reportFoot()}`;
  logEvent('lg_print', { r: t('minutesTitle') }, 'meeting');
  printDoc(html);
}

// ---------- router, navigation, preferences, village switcher, boot ----------
const ROUTES = {
  home: { r: renderHome, icon: 'layers', run: true },
  setup: { r: renderSetup, icon: 'grid' },
  readings: { r: renderReadings, icon: 'activity', run: true },
  model: { r: renderModel, icon: 'waves', run: true },
  calib: { r: renderCalib, icon: 'target', run: true },
  crops: { r: renderCrops, icon: 'sprout' },
  scenarios: { r: renderScenarios, icon: 'git-branch', run: true },
  budget: { r: renderBudget, icon: 'scale', run: true },
  meeting: { r: renderMeeting, icon: 'users', run: true },
  map: { r: renderMap, icon: 'map' },
  learn: { r: renderLearn, icon: 'book' },
  inbox: { r: renderInbox, icon: 'bell' },
  settings: { r: renderSettings, icon: 'settings' },
  about: { r: renderAbout, icon: 'info' },
};
const NAV_MAIN = ['home', 'setup', 'readings', 'model', 'calib', 'crops', 'scenarios', 'budget', 'meeting', 'map', 'learn'];
const NAV_APP = ['settings', 'about'];
const TAB_ROUTES = ['home', 'readings', 'model', 'scenarios'];
let curRoute = '';
let curArg = '';

function renderNav() {
  const a = (r, ico = false) => `<a href="#${r}" data-nav="${r}" class="${r === curRoute ? 'on' : ''} ${ico ? 'ico' : ''}" ${r === curRoute ? 'aria-current="page"' : ''} ${ico ? `aria-label="${t('nav_' + r)}" data-tip="${t('nav_' + r)}"` : ''}>${ic(ROUTES[r].icon)}<span>${t('nav_' + r)}</span></a>`;
  $('#nav').innerHTML = NAV_MAIN.map(r => a(r)).join('') + '<span class="sep" aria-hidden="true"></span>' + NAV_APP.map(r => a(r, true)).join('');
  $('#nav').setAttribute('aria-label', t('mainNav'));
  const more = !TAB_ROUTES.includes(curRoute);
  $('#tabs').innerHTML = TAB_ROUTES.map(r => `<a href="#${r}" data-nav="${r}" class="${r === curRoute ? 'on' : ''}" ${r === curRoute ? 'aria-current="page"' : ''}>${ic(ROUTES[r].icon)}<span>${t('tab_' + r)}</span></a>`).join('') + `<button type="button" id="tabMore" class="${more ? 'on' : ''}">${ic('menu')}<span>${t('more')}</span></button>`;
  $('#tabs').setAttribute('aria-label', t('mainNav'));
  $('#tabMore').onclick = openMoreSheet;
  const on = $('#nav a.on');
  if (on) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

function openMoreSheet() {
  const list = [...NAV_MAIN.filter(r => !TAB_ROUTES.includes(r)), 'inbox', ...NAV_APP];
  const sh = openModal(`${sheetHead(t('more'), 'menu')}<div class="guide-grid" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem">${list.map(r => `<a class="btn ghost" style="justify-content:flex-start" href="#${r}" data-close>${ic(ROUTES[r].icon)} ${t('nav_' + r)}</a>`).join('')}</div>
    <div class="row mt"><button type="button" class="btn ghost sm" id="mSearch">${ic('search')} ${t('search')}</button><button type="button" class="btn ghost sm" id="mTheme">${ic('moon')} ${t('switchTheme')}</button><button type="button" class="btn ghost sm" id="mTour">${ic('sparkles')} ${t('replayTour')}</button><button type="button" class="btn ghost sm" id="mKeys">${ic('hash')} ${t('shortcuts')}</button></div>`);
  $('#mSearch', sh).onclick = openPalette;
  $('#mTheme', sh).onclick = toggleTheme;
  $('#mTour', sh).onclick = startTour;
  $('#mKeys', sh).onclick = openShortcuts;
}

function go(path) {
  if (location.hash.slice(1) === path) route();
  else location.hash = path;
}

function route() {
  const [name, ...rest] = (location.hash.slice(1) || 'home').split('/');
  const r = ROUTES[name] ? name : 'home';
  renderRoute(r, decodeURIComponent(rest.join('/')));
}

function renderRoute(r, arg) {
  const same = r === curRoute && arg === curArg;
  if (curRoute === 'home' && r !== 'home') stopPlay();
  if (curRoute === 'map' && r !== 'map') dropLeaflet();
  curRoute = r;
  curArg = arg;
  closePalette();
  closeMenu();
  if (!same) closeModal();
  CHART_SPECS.clear();
  ROUTES[r].r(arg);
  document.title = r === 'home' ? `${t('appName')} — ${t('tagline')} | FYP Template` : `${t('nav_' + r)} — ${t('appName')} | FYP Template`;
  renderNav();
  updateBadges();
  setRunChip();
  drawCharts($('#view'));
  if (!same) {
    window.scrollTo(0, 0);
    animateIn($('#view'));
  } else settle($('#view'));
}

function rerender() {
  if (!curRoute) return;
  const y = window.scrollY;
  renderRoute(curRoute, curArg);
  window.scrollTo(0, y);
}

/** Views that show model output re-render once a background run finishes. */
function rerenderIfNeeds() {
  if (ROUTES[curRoute]?.run && !modalOpen() && !$('#stage').classList.contains('on')) rerender();
}

function updateBadges() {
  const n = unreadCount();
  $('#bellBadge').textContent = n > 99 ? '99+' : n;
  $('#bellBadge').classList.toggle('hidden', !n);
  $('#bellBtn').setAttribute('aria-label', t('notificationsN', { n }));
}

function applyPrefs() {
  const h = document.documentElement;
  const s = S.settings;
  h.lang = lang;
  h.dir = lang === 'ur' ? 'rtl' : 'ltr';
  h.dataset.theme = s.theme;
  h.dataset.size = s.size;
  h.classList.toggle('calm', !!s.calm);
  $$('[data-i18n]').forEach(el => (el.textContent = t(el.dataset.i18n)));
  $('#langBtn').textContent = lang === 'ur' ? 'English' : 'اردو';
  $('#langBtn').setAttribute('aria-label', t('switchLang'));
  $('#searchBtn').setAttribute('aria-label', t('searchAll'));
  $('#themeBtn').setAttribute('aria-label', t('switchTheme'));
  $('#themeBtn').innerHTML = ic(s.theme === 'dark' ? 'sun' : 'moon');
  $('#skipLink').textContent = t('skipToContent');
  $('#vSwitch').setAttribute('aria-label', t('villageSwitch') + ': ' + vName(V()));
  $('#vName').textContent = vName(V());
  $('#vFict').textContent = V().fictional ? t('fictionalShort') : '';
  $('#vFict').classList.toggle('hidden', !V().fictional);
  $('meta[name="theme-color"]').content = s.theme === 'dark' ? '#0f0b08' : '#3a2417';
}

function setLang(l) {
  lang = l;
  store.set('lang', l);
  applyPrefs();
  rerender();
  if ($('#stage').classList.contains('on')) renderStage();
  if (tourStep >= 0) showTourStep();
}

function toggleTheme() {
  S.settings.theme = S.settings.theme === 'dark' ? 'light' : 'dark';
  persist('settings');
  applyPrefs();
  rerender();
}

function openVillageMenu() {
  const items = S.villages.map(v => ({ icon: 'map-pin', label: esc(vName(v)), sub: `${t('dist_' + v.district)}${v.fictional ? ' · ' + t('fictionalShort') : ''}`, on: v.id === S.cur, run: () => switchVillage(v.id) }));
  items.push('-', { icon: 'plus', label: t('vNew'), run: newVillage }, { icon: 'copy', label: t('vDuplicate'), run: duplicateVillage }, { icon: 'grid', label: t('nav_setup'), run: () => go('setup') });
  openMenu($('#vSwitch'), items);
}

function switchVillage(id) {
  if (id === S.cur) return;
  S.cur = id;
  persist('cur');
  stopPlay();
  TWIN.k = NOW_K;
  applyPrefs();
  logEvent('lg_switch', { v: vName(V()) });
  rerender();
  ensureRun(V());
  toast(t('switchedTo', { v: vName(V()) }), 'ok');
}

function bindShell() {
  $('#searchBtn').onclick = openPalette;
  $('#bellBtn').onclick = () => go('inbox');
  $('#langBtn').onclick = () => setLang(lang === 'ur' ? 'en' : 'ur');
  $('#themeBtn').onclick = toggleTheme;
  $('#vSwitch').onclick = openVillageMenu;
  $('#scrim').onclick = () => {
    closePalette();
    closeModal();
  };
  $('#modal').addEventListener('click', e => e.target === $('#modal') && closeModal());
  document.addEventListener('keydown', onKey);
  document.addEventListener('keydown', trapFocus);
  window.addEventListener('hashchange', route);
  window.addEventListener('resize', debounce(onResize, 200));
  bindTooltips();
}

function onResize() {
  drawCharts($('#view'));
  if (curRoute === 'home' && cachedRun()) updateTwin(V(), cachedRun());
  if (curRoute === 'model' && cachedRun()) updateModelView();
  if (tourStep >= 0) showTourStep();
}

function boot() {
  lang = store.get('lang', 'en') === 'ur' ? 'ur' : 'en';
  S = loadState();
  if (!S) seedApp();
  applyCropOverrides();
  applyPrefs();
  bindShell();
  route();
  setRunChip();
  ensureRun(V());
  if (!location.hash && !S.settings.tourDone) setTimeout(startTour, 1400);
}

boot();
</script>
</body>
</html>
