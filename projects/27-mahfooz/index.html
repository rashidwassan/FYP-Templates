/** SOS text from the user's template (or the default) with location, time and battery filled in. */
function sosMessage({ loc, battery, practice = false }) {
  const l = msgLang();
  const custom = (S.settings.sosTemplate[l] || '').trim();
  const where = loc && !loc.error ? tm('m_locLine', { map: mapLink(loc), acc: loc.acc }) : tm('m_noLoc');
  const vars = {
    name: myName(),
    where,
    map: loc && !loc.error ? mapLink(loc) : tm('m_noLoc'),
    time: hhmm(now()),
    battery: battery == null ? '' : tm('m_battery', { n: battery }),
  };
  let text = custom ? custom.replace(/\{(\w+)\}/g, (m, v) => vars[v] ?? m) : tm('m_sos', vars);
  if (practice) text = tm('m_practicePrefix') + ' ' + text;
  return text.replace(/\s+\n/g, '\n').trim();
}

function journeyStartMessage(j) {
  const parts = [tm('m_jStart', { name: myName(), dest: mDest(j), eta: hhmm(j.etaAt) })];
  if (j.vehicle || j.driver) parts.push(tm('m_jVehicle', { mode: tIn(msgLang(), 'mode_' + j.mode), vehicle: j.vehicle || '-', driver: j.driver || '-' }));
  if (j.ref) parts.push(tm('m_jRef', { ref: j.ref }));
  parts.push(tm('m_jStartEnd'));
  return parts.join('\n');
}

function journeyOverdueMessage(j, loc) {
  const parts = [tm('m_jOverdue', { name: myName(), dest: mDest(j), eta: hhmm(j.etaAt) })];
  if (j.vehicle || j.driver) parts.push(tm('m_jVehicle', { mode: tIn(msgLang(), 'mode_' + j.mode), vehicle: j.vehicle || '-', driver: j.driver || '-' }));

// ---------- SOS: press-and-hold control → cancel countdown → active alert screen ----------
const HOLD_MS = 3000;
const RING_C = 2 * Math.PI * 46;
const SOS = { phase: 'idle', practice: false, left: 0, total: 0, timer: 0, loc: null, battery: null, rec: null, watchId: null, msg: '', edited: false, hidden: false, hold: null, ending: false, startedAt: 0 };

function sosButtonHtml() {
  return `<button type="button" class="sos-hold" data-sos aria-label="${t('sosAria')}">
    <svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="46"/><circle class="prog" cx="50" cy="50" r="46" stroke-dasharray="${RING_C}" stroke-dashoffset="${RING_C}"/></svg>
    <span class="face"><b>${t('sosWord')}</b><small>${t('sosHold')}</small></span></button>`;
}

function bindSosButton(btn) {
  btn.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    e.preventDefault();
    try {
      btn.setPointerCapture(e.pointerId);
    } catch {
      /* synthetic pointer */
    }
    holdStart(btn);
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => btn.addEventListener(ev, () => holdEnd(btn)));
  btn.addEventListener('keydown', e => {
    if (e.key !== ' ' && e.key !== 'Enter') return;
    e.preventDefault();
    if (!e.repeat) holdStart(btn);
  });
  btn.addEventListener('keyup', e => (e.key === ' ' || e.key === 'Enter') && holdEnd(btn));
  btn.addEventListener('contextmenu', e => e.preventDefault());
  btn.addEventListener('click', e => e.preventDefault());
}

function holdStart(btn) {
  if (SOS.phase !== 'idle') return openSosLayer();
  if (SOS.hold) return;
  const prog = $('.prog', btn);
  const label = $('.face small', btn);
  SOS.hold = { btn, t0: performance.now(), raf: 0 };
  btn.classList.add('holding');
  vibrate(40);
  const step = ts => {
    if (!SOS.hold) return;
    const held = ts - SOS.hold.t0;
    const p = Math.min(1, held / HOLD_MS);
    prog.style.strokeDashoffset = RING_C * (1 - p);
    label.textContent = String(Math.max(1, Math.ceil((HOLD_MS - held) / 1000)));
    if (p >= 1) {
      holdReset(btn);
      vibrate([90, 60, 90]);
      startSos({ practice: false });
      return;
    }
    SOS.hold.raf = requestAnimationFrame(step);
  };
  SOS.hold.raf = requestAnimationFrame(step);
}

function holdReset(btn) {
  if (SOS.hold) cancelAnimationFrame(SOS.hold.raf);
  SOS.hold = null;
  btn.classList.remove('holding');
  $('.prog', btn).style.strokeDashoffset = RING_C;
  $('.face small', btn).textContent = t('sosHold');
}

function holdEnd(btn) {
  if (!SOS.hold || SOS.hold.btn !== btn) return;
  holdReset(btn);
  toast(t('keepHolding'));
  announce(t('keepHolding'));
}

// ---------- countdown ----------
function startSos({ practice = false } = {}) {
  if (SOS.phase !== 'idle') return openSosLayer();
  closeModal();
  closePalette();
  if (tourStep >= 0) endTour();
  Object.assign(SOS, { phase: 'count', practice, left: S.settings.sosCountdown, total: S.settings.sosCountdown, loc: null, battery: null, msg: '', edited: false, hidden: false, rec: null, ending: false });
  document.documentElement.classList.add('sos-on');
  openSosLayer();
  fetchSosLocation();
  batteryLevel().then(b => {
    SOS.battery = S.settings.includeBattery ? b : null;
    refreshSosMessage();
  });
  if (SOS.left <= 0) return activateSos();
  renderSosLayer();
  if (!S.settings.silentCountdown) tick();
  SOS.timer = setInterval(sosCountTick, 1000);
}

function sosCountTick() {
  SOS.left -= 1;
  if (SOS.left <= 0) {
    clearInterval(SOS.timer);
    activateSos();
    return;
  }
  if (!S.settings.silentCountdown) tick();
  vibrate(50);
  const ring = $('#sosRing');
  if (ring) ring.style.strokeDashoffset = 628.3 * (1 - SOS.left / SOS.total);
  if ($('#sosLeft')) $('#sosLeft').textContent = SOS.left;
}

function cancelSos() {
  clearInterval(SOS.timer);
  logEvent(SOS.practice ? 'lg_sosPracticeCancel' : 'lg_sosCancelled', {}, 'sos');
  resetSos();
  toast(t('sos_cancelled'), 'ok');
}

function resetSos() {
  clearInterval(SOS.timer);
  clearWatch(SOS.watchId);
  siren.stop();
  strobe.stop();
  keepAwake(!!S.active);
  Object.assign(SOS, { phase: 'idle', watchId: null, rec: null, hidden: false, ending: false });
  document.documentElement.classList.remove('sos-on');
  $('#sosLayer').classList.remove('on');
  $('#sosLayer').innerHTML = '';
  renderBanner();
  if (curRoute === 'home' || curRoute === 'sos') rerender();
}

async function fetchSosLocation() {
  SOS.loc = null;
  updateSosLocation();
  const loc = await getPosition({ timeout: 15000 });
  if (SOS.phase === 'idle') return;
  SOS.loc = loc;
  if (SOS.rec && !loc.error) {
    SOS.rec.loc = loc;
    persist('sosLog');
  }
  refreshSosMessage();
  updateSosLocation();
}

// ---------- active SOS ----------
function activateSos() {
  clearInterval(SOS.timer);
  SOS.phase = 'active';
  SOS.startedAt = now();
  SOS.rec = { id: uid('x'), practice: SOS.practice, startedAt: now(), endedAt: 0, loc: SOS.loc && !SOS.loc.error ? SOS.loc : null, sent: [], endedReason: '' };
  S.sosLog.unshift(SOS.rec);
  persist('sosLog');
  logEvent(SOS.practice ? 'lg_sosPracticeStart' : 'lg_sosStart', {}, 'sos');
  if (!SOS.practice) {
    notify('nt_sosStarted', { time: hhmm(now()) }, { kind: 'sos', route: 'sos', level: 'warn' });
    if (S.settings.sosSiren) siren.start();
    if (S.settings.sosStrobe) strobe.start();
    SOS.watchId = watchPosition(loc => {
      SOS.loc = loc;
      SOS.rec.loc = loc;
      persist('sosLog');
      refreshSosMessage();
      updateSosLocation();
    });
  }
  keepAwake(true);
  refreshSosMessage();
  renderSosLayer();
  renderBanner();
  announce(t('sos_activeAnnounce'));
}

function openSosLayer() {
  SOS.hidden = false;
  $('#sosLayer').classList.add('on');
  if (SOS.phase !== 'idle') renderSosLayer();
  renderBanner();
}

function minimiseSos() {
  SOS.hidden = true;
  $('#sosLayer').classList.remove('on');
  renderBanner();
}

function renderSosLayer() {
  const el = $('#sosLayer');
  if (SOS.phase === 'count') el.innerHTML = sosCountdownHtml();
  else if (SOS.phase === 'active') el.innerHTML = SOS.ending ? sosEndHtml() : sosActiveHtml();
  bindSosLayer(el);
  const focus = $('#sosCancel', el) || $('#sosMsg', el) || $('#sosEndClose', el);
  if (focus && SOS.phase === 'count') focus.focus({ preventScroll: true });
}

const practiceBadge = () => (SOS.practice ? `<span class="practice-badge">${ic('play', 'flip')} ${t('sos_practiceBadge')}</span>` : '');

function sosCountdownHtml() {
  const frac = SOS.total ? 1 - SOS.left / SOS.total : 1;
  return `<div class="sos-count"><div>

    <h2 id="sosTitle" class="mt">${t('sos_countTitle')}</h2>

function locLineHtml() {
  if (!SOS.loc) return `${ic('locate')} ${t('loc_getting')}`;
  if (SOS.loc.error) return `${ic('alert')} ${geoErrorText(SOS.loc.error)}`;
  return `${ic('map-pin')} ${t('loc_found', { acc: SOS.loc.acc })}${SOS.loc.sim ? ' · ' + t('simulated') : ''}`;
}

function sosLocationCard() {
  const l = SOS.loc;
  let body;
  if (!l) body = `<p class="muted">${ic('locate')} ${t('loc_getting')}</p>`;
  else if (l.error) body = `<p>${ic('alert')} ${geoErrorText(l.error)}</p><p class="small muted">${t('sos_noLocTip')}</p>`;
  else {
    body = `<dl class="kv"><dt>${t('loc_coords')}</dt><dd class="ltr num">${fmtCoord(l)}</dd><dt>${t('loc_acc')}</dt><dd>${t('distM', { n: l.acc })}</dd><dt>${t('loc_time')}</dt><dd>${fmtTime(l.t)}</dd></dl>

function sosSendRows() {
  const list = sosContacts();

      <label class="sr" for="sosMsg">${t('message')}</label><textarea id="sosMsg" dir="auto">${esc(SOS.msg)}</textarea></div>
    <div class="sos-card"><h3>${ic('users')} ${t('sos_sendTo')}</h3><div id="sosSendRows">${sosSendRows()}</div></div>

function sosEndHtml() {
  const rec = SOS.rec;
  const messaged = rec.sent.filter(s => s.cid !== '*').map(s => contactById(s.cid)).filter(Boolean);
  const unique = [...new Map(messaged.map(c => [c.id, c])).values()];
  const body = imSafeMessage();
  return `<div class="sos-wrap"><div class="sos-head"><span class="dot" aria-hidden="true" style="background:#8fe0d6;box-shadow:none"></span><div class="grow"><h2 id="sosTitle">${t('sos_endTitle')}</h2><small class="muted">${t('sos_endSub')}</small></div></div>
    ${unique.length ? `<div class="sos-card"><h3>${ic('user-check')} ${t('sos_tellSafe')}</h3>${unique.map(c => `<div class="sos-send"><div class="meta"><b>${esc(contactName(c))}</b></div><div class="row">${contactSendButtons(c, body, { dark: true, call: false })}</div></div>`).join('')}</div>` : ''}
    <div class="sos-card"><p style="margin:0">${t('sos_endJournal')}</p><div class="row mt"><button type="button" class="btn glass" id="sosToJournal">${ic('lock')} ${t('sos_addJournal')}</button></div></div>
    <button type="button" class="btn white lg block mt" id="sosEndClose">${ic('check')} ${t('done')}</button></div>`;
}

function bindSosLayer(el) {
  const on = (id, fn) => $(id, el) && ($(id, el).onclick = fn);
  on('#sosCancel', cancelSos);
  on('#sosNow', activateSos);
  on('#sosHide', minimiseSos);
  on('#sosRefresh', fetchSosLocation);
  on('#sosCopy', () => copyText($('#sosMsg', el).value));
  on('#sosSiren', () => {
    if (siren.on) siren.stop();
    else siren.start();
    renderSosLayer();
  });
  on('#sosStrobe', () => strobe.start());
  on('#sosEnd', endSos);
  on('#sosEndClose', resetSos);
  on('#sosToJournal', () => {
    const loc = SOS.rec && SOS.rec.loc;
    resetSos();
    pendingDraft = { when: now(), place: loc ? fmtCoord(loc) : '', category: 'other' };
    go('journal/new');
  });
  on('#sosToCircle', () => minimiseSos());
  if ($('#sosMsg', el)) $('#sosMsg', el).addEventListener('input', debounce(e => {
    SOS.msg = e.target.value;
    SOS.edited = true;
    $('#sosSendRows', el).innerHTML = sosSendRows();
    bindSendLinks($('#sosSendRows', el), markSosSent);
  }, 250));
  bindSendLinks(el, markSosSent);
  bindHelplineLinks(el);
}

function refreshSosMessage() {
  if (SOS.phase === 'idle' || SOS.edited) return;
  SOS.msg = sosMessage({ loc: SOS.loc, battery: SOS.battery, practice: SOS.practice });
  const box = $('#sosMsg');
  if (box && document.activeElement !== box) box.value = SOS.msg;
  const rows = $('#sosSendRows');
  if (rows) {
    rows.innerHTML = sosSendRows();
    bindSendLinks(rows, markSosSent);
  }
}

function updateSosLocation() {
  if (SOS.phase === 'count' && $('#sosLocLine')) $('#sosLocLine').innerHTML = locLineHtml();
  if (SOS.phase === 'active' && $('#sosLocCard')) {
    $('#sosLocCard').outerHTML = sosLocationCard();
    $('#sosRefresh').onclick = fetchSosLocation;
  }
}

function markSosSent(cid, via) {
  if (!SOS.rec) return;
  SOS.rec.sent.push({ cid, via, t: now() });
  persist('sosLog');
  logEvent('lg_sosOpened', { via: t(via === 'wa' ? 'whatsapp' : via === 'call' ? 'call' : 'sms') }, 'sos');
}

function endSos() {
  clearWatch(SOS.watchId);
  SOS.watchId = null;
  siren.stop();
  strobe.stop();
  if (SOS.rec) {
    SOS.rec.endedAt = now();
    SOS.rec.endedReason = 'safe';
    persist('sosLog');
  }
  logEvent(SOS.practice ? 'lg_sosPractice' : 'lg_sosEnded', { d: dur(now() - SOS.startedAt) }, 'sos');
  if (SOS.practice) {
    resetSos();
    toast(t('sos_practiceDone'), 'ok');
    return;
  }
  SOS.ending = true;
  renderSosLayer();
}

function openSendSheet({ title, icon = 'send', intro = '', body, contacts, onSent = () => {}, call = false }) {
  const sh = openModal(`${sheetHead(title, icon)}${intro}

// ---------- safe journey: expected arrival, check-ins, overdue escalation ----------
// Escalation ladder (grace g = settings.journeyGrace minutes):
//   stage 0 on the way · stage 1 at ETA (reminder) · stage 2 at ETA + g (louder reminder)
//   stage 3 at ETA + 2g (alert prepared for the shared contacts; the user still presses send).
const SPEEDS = [1, 10, 60];
let journeyWatchId = null;
let lastStageSheet = 0;

/** Virtual clock: simulated demo journeys may run 10x or 60x faster than real time. */
function journeyNow(j) {
  if (!j.sim || !j.speed || j.speed <= 1) return now();
  return j.virtBase + (now() - j.realBase) * j.speed;
}

function setJourneySpeed(j, speed) {
  j.virtBase = journeyNow(j);
  j.realBase = now();
  j.speed = speed;
  persist('active');
}

function stageTag(stage) {
  const map = [['teal', 'jr_st0'], ['amber', 'jr_st1'], ['amber', 'jr_st2'], ['berry', 'jr_st3']];
  const [cls, k] = map[stage] || map[0];
  return `<span class="tag ${cls}">${t(k)}</span>`;
}

function journeyStage(j, v) {
  const over = v - j.etaAt;
  const g = S.settings.journeyGrace * MIN;
  if (over < 0) return 0;
  if (over < g) return 1;
  return over < 2 * g ? 2 : 3;
}

// A destination point for the simulated path: 1.5-3.5 km from the start in a seeded direction.
function simDestination(from, seed) {
  const r = rng(seed);
  const ang = r() * Math.PI * 2;
  const km = 1.5 + r() * 2;
  return { lat: from.lat + (Math.cos(ang) * km) / 111, lng: from.lng + (Math.sin(ang) * km) / (111 * Math.cos(toRad(from.lat))) };
}

function pushCrumb(j, p) {
  const last = j.crumbs[j.crumbs.length - 1];
  if (last && haversine(last, p) < 15 && p.t - last.t < 60000) return;
  j.crumbs.push({ t: p.t, lat: +p.lat.toFixed(6), lng: +p.lng.toFixed(6), acc: p.acc || 0, sim: !!p.sim });
  if (j.crumbs.length > 600) j.crumbs.splice(1, 1);
  persist('active');
}

function addSimCrumb(j, v) {
  if (!j.sim || !j.simPath) return;
  const last = j.crumbs[j.crumbs.length - 1];
  if (last && v - last.t < 30000) return;
  const f = clamp((v - j.startedAt) / (j.etaAt - j.startedAt), 0, 1);
  const path = j.simPath;
  const x = f * (path.length - 1);
  const i = Math.min(path.length - 2, Math.floor(x));
  const k = x - i;
  const jitter = f >= 1 ? 0.00015 : 0.00004;
  const r = rng(Math.round(v / 1000));
  pushCrumb(j, {
    t: v,
    lat: path[i].lat + (path[i + 1].lat - path[i].lat) * k + (r() - 0.5) * jitter,
    lng: path[i].lng + (path[i + 1].lng - path[i].lng) * k + (r() - 0.5) * jitter,
    acc: 8 + Math.round(r() * 12),
    sim: true,
  });
}

// ---------- the 1-second loop while a journey is active ----------
function journeyTick() {
  const j = S.active;
  if (!j) return;
  const v = journeyNow(j);
  addSimCrumb(j, v);
  const stage = journeyStage(j, v);
  if (stage > j.stage) escalate(j, stage, v);
  checkinTick(j, v);
  updateJourneyLive(j, v);
}

function escalate(j, stage, v) {
  j.stage = stage;
  j.peak = Math.max(j.peak || 0, stage);
  j.events.push({ t: v, k: 'ev_stage' + stage });
  persist('active');
  const vars = { dest: j.dest, destUr: j.destUr || '' };
  logEvent('lg_stage' + stage, vars, 'journey');
  notify('nt_stage' + stage, vars, { kind: 'journey', route: 'journey', level: stage >= 2 ? 'warn' : 'info' });
  chime(stage);
  systemNotify(t('nt_stage' + stage, { dest: jDest(j) }));
  renderBanner();
  if (SOS.phase === 'idle' && !callActive()) openStageSheet(j, stage);
  // TODO(student): scheduleServerWatchdog() — this ladder only runs while the page is open. Post the journey
  // (ETA, contacts, last position) to a server that escalates on its own if the phone dies or the tab is closed.
}

function openStageSheet(j, stage) {
  lastStageSheet = stage;
  if (stage >= 3) return openPreparedAlert(j);
  const sh = openModal(`${sheetHead(t(stage === 1 ? 'jr_dueTitle' : 'jr_overdueTitle'), 'clock')}
    <p>${t(stage === 1 ? 'jr_dueBody' : 'jr_overdueBody', { dest: esc(jDest(j)), eta: fmtTime(j.etaAt) })}</p>
    <div class="stack" style="display:grid">
      <button type="button" class="btn teal lg" id="stArrived">${ic('check-circle')} ${t('jr_arrived')}</button>
      <div class="row"><button type="button" class="btn ghost grow" id="stPlus10">${ic('plus')} ${t('jr_plus', { n: 10 })}</button><button type="button" class="btn ghost grow" id="stPlus30">${ic('plus')} ${t('jr_plus', { n: 30 })}</button></div>
      <button type="button" class="btn berry" id="stHelp">${ic('siren')} ${t('jr_needHelp')}</button></div>`);
  $('#stArrived', sh).onclick = () => {
    closeModal();
    arriveJourney();
  };
  $('#stPlus10', sh).onclick = () => extendJourney(10);
  $('#stPlus30', sh).onclick = () => extendJourney(30);
  $('#stHelp', sh).onclick = () => startSos({ practice: false });
}

function openPreparedAlert(j) {
  const contacts = journeyContacts(j);
  const sh = openSendSheet({
    title: t('jr_alertTitle'),
    icon: 'alert',

    body: journeyOverdueMessage(j),
    contacts,
    call: true,
    onSent: (cid, via) => {

  });
  $('#paSafe', sh).onclick = () => {
    closeModal();
    arriveJourney();
  };
  $('#paSos', sh).onclick = () => startSos({ practice: false });
}

const journeyContacts = j => {
  const shared = j.shared.map(contactById).filter(Boolean);
  return shared.length ? shared : sosContacts();
};

// Optional periodic "are you OK?" prompts during the journey; a missed prompt raises a reminder.
function checkinTick(j, v) {
  const every = S.settings.checkinEvery * MIN;
  if (!every || j.stage >= 1) return;
  if (j.pendingCheck && v - j.pendingCheck > 2 * MIN) {
    j.pendingCheck = 0;
    j.events.push({ t: v, k: 'ev_missed' });
    persist('active');
    chime(2);
    notify('nt_missedCheckin', { dest: j.dest, destUr: j.destUr || '' }, { kind: 'journey', route: 'journey', level: 'warn' });
    return;
  }
  if (!j.pendingCheck && v - j.lastCheckin >= every) {
    j.pendingCheck = v;
    chime(1);
    if (SOS.phase === 'idle' && !callActive() && !modalOpen()) openCheckPrompt(j);
  }
}

function openCheckPrompt(j) {
  const sh = openModal(`${sheetHead(t('jr_checkTitle'), 'user-check')}<p>${t('jr_checkBody')}</p>
    <div class="row"><button type="button" class="btn teal grow" id="ckOk">${ic('check')} ${t('jr_checkOk')}</button><button type="button" class="btn berry grow" id="ckHelp">${ic('siren')} ${t('jr_needHelp')}</button></div>`);
  $('#ckOk', sh).onclick = () => {
    j.pendingCheck = 0;
    j.lastCheckin = journeyNow(j);
    j.events.push({ t: j.lastCheckin, k: 'ev_checkin' });
    persist('active');
    closeModal();
    toast(t('jr_checkThanks'), 'ok');
  };
  $('#ckHelp', sh).onclick = () => startSos({ practice: false });
}

function systemNotify(body) {
  try {
    if ('Notification' in window && Notification.permission === 'granted' && document.hidden) new Notification(t('appName'), { body, tag: 'mahfooz-journey' });
  } catch {
    /* notifications unavailable */
  }
}

// ---------- start / extend / arrive / cancel ----------
function startJourney(f) {
  const t0 = now();
  const seed = Math.floor(Math.random() * 1e6);
  const from = refPoint();
  const j = {
    id: uid('j'), dest: f.dest, from: f.from, mode: f.mode, vehicle: f.vehicle, driver: f.driver, driverPhone: f.driverPhone, app: f.app, ref: f.ref,
    startedAt: t0, etaAt: t0 + f.minutes * MIN, endedAt: 0, status: 'active', stage: 0, sim: f.sim, speed: f.sim ? f.speed : 1,
    realBase: t0, virtBase: t0, crumbs: [], events: [{ t: t0, k: 'ev_started' }], shared: f.shared, extended: 0, lastCheckin: t0, pendingCheck: 0,
  };
  if (f.sim) j.simPath = simRoute(from, simDestination(from, seed), 40, seed).map(p => ({ lat: +p.lat.toFixed(6), lng: +p.lng.toFixed(6) }));
  S.active = j;
  persist('active');
  logEvent('lg_journeyStart', { dest: j.dest }, 'journey');
  startJourneyTracking(j);
  keepAwake(true);
  go('journey');
  renderBanner();
  const shared = j.shared.map(contactById).filter(Boolean);
  if (shared.length) openSendSheet({ title: t('jr_shareTitle'), icon: 'route', body: journeyStartMessage(j), contacts: shared, onSent: () => logEvent('lg_journeyShared', { dest: j.dest }, 'journey') });
}

function startJourneyTracking(j) {
  if (j.sim) {
    addSimCrumb(j, journeyNow(j));
    return;
  }
  getPosition().then(p => !p.error && S.active === j && pushCrumb(j, p));
  journeyWatchId = watchPosition(p => S.active === j && pushCrumb(j, p));
}

function extendJourney(minutes) {
  const j = S.active;
  if (!j) return;
  j.etaAt += minutes * MIN;
  j.extended += minutes;
  j.stage = journeyStage(j, journeyNow(j));
  j.events.push({ t: journeyNow(j), k: 'ev_extended', n: minutes });
  persist('active');
  closeModal();
  toast(t('jr_extendedToast', { time: fmtTime(j.etaAt) }), 'ok');
  logEvent('lg_journeyExtended', { n: minutes }, 'journey');
  renderBanner();
  if (curRoute === 'journey' || curRoute === 'home') rerender();
}

function finishJourney(j) {
  clearWatch(journeyWatchId);
  journeyWatchId = null;
  delete j.simPath;
  delete j.pendingCheck;
  S.journeys.unshift(j);
  S.active = null;
  persist('active', 'journeys');
  keepAwake(SOS.phase !== 'idle');
  renderBanner();
  rerender();
}

function arriveJourney() {
  const j = S.active;
  if (!j) return;
  const v = journeyNow(j);
  j.endedAt = v;
  // The peak stage is kept, so extending an overdue journey still records that an alert was prepared.
  j.status = (j.peak || j.stage) >= 3 ? 'escalated' : v > j.etaAt || (j.peak || 0) >= 1 ? 'late' : 'arrived';
  j.events.push({ t: v, k: 'ev_arrived' });
  const vars = { dest: j.dest, destUr: j.destUr || '' };
  logEvent('lg_journeyEnd', vars, 'journey');
  if (j.status !== 'arrived') notify('nt_arrivedLate', { ...vars, n: Math.max(1, Math.round((v - j.etaAt) / MIN)) }, { kind: 'journey', route: 'journey' });
  finishJourney(j);
  toast(t('jr_arrivedToast'), 'ok');
  const shared = j.shared.map(contactById).filter(Boolean);
  if (shared.length || j.stage >= 1) openSendSheet({ title: t('jr_tellArrived'), icon: 'check-circle', body: arrivedMessage(j), contacts: journeyContacts(j) });
}

async function cancelJourney() {
  const j = S.active;
  if (!j || !(await askConfirm(t('jr_cancelConfirm'), { okText: t('jr_cancel'), icon: 'x-circle' }))) return;
  j.endedAt = journeyNow(j);
  j.status = 'cancelled';
  j.events.push({ t: j.endedAt, k: 'ev_cancelled' });
  logEvent('lg_journeyCancelled', { dest: j.dest }, 'journey');
  finishJourney(j);
}

// Light-weight refresh every second: only numbers and the crumb list, so focus is never lost.
function updateJourneyLive(j, v) {
  if (curRoute !== 'journey' || !$('#jrLive')) return;
  const left = j.etaAt - v;
  if ($('#jrLeft')) $('#jrLeft').textContent = left >= 0 ? clock(left) : '+' + clock(-left);
  const ring = $('#jrLive circle.val');
  if (ring) {
    const L = 2 * Math.PI * 46;
    ring.style.strokeDasharray = L;
    ring.style.strokeDashoffset = L * (1 - clamp((v - j.startedAt) / (j.etaAt - j.startedAt), 0, 1));
  }
  const box = $('#jrCrumbs');
  if (box && box.dataset.n !== String(j.crumbs.length)) {
    box.dataset.n = j.crumbs.length;
    box.innerHTML = crumbsBlock(j);
  }
  if ($('#jrLive').dataset.stage !== String(j.stage)) {
    $('#jrLive').dataset.stage = j.stage;
    $('#jrLive').innerHTML = journeyLiveHtml(j, v);
    bindActiveJourney(j);
  }
}

/** Breadcrumb trail drawn on a local equirectangular projection with a scale bar. */
function crumbSvg(c, { w = 600, h = 230 } = {}) {
  const pad = 22;
  const lats = c.map(p => p.lat);
  const lngs = c.map(p => p.lng);
  const kx = Math.cos(toRad((Math.min(...lats) + Math.max(...lats)) / 2));
  const spanX = Math.max((Math.max(...lngs) - Math.min(...lngs)) * kx, 0.002);
  const spanY = Math.max(Math.max(...lats) - Math.min(...lats), 0.002);
  const s = Math.min((w - 2 * pad) / spanX, (h - 2 * pad) / spanY);
  const cx = (Math.min(...lngs) + Math.max(...lngs)) / 2;
  const cy = (Math.min(...lats) + Math.max(...lats)) / 2;
  const X = p => (w / 2 + (p.lng - cx) * kx * s).toFixed(1);
  const Y = p => (h / 2 - (p.lat - cy) * s).toFixed(1);
  const pxPerM = s / 111320;
  const bar = [100, 200, 500, 1000, 2000, 5000].find(m => m * pxPerM > w / 8) || 5000;
  const first = c[0];
  const last = c[c.length - 1];
  return `<svg viewBox="0 0 ${w} ${h}" class="crumbs" role="img" aria-label="${t('jr_mapAria', { n: c.length })}">
    <polyline points="${c.map(p => `${X(p)},${Y(p)}`).join(' ')}" fill="none" stroke="var(--teal)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" data-draw/>
    ${c.map(p => `<circle cx="${X(p)}" cy="${Y(p)}" r="2.6" fill="var(--teal)" opacity=".45"/>`).join('')}
    <circle cx="${X(first)}" cy="${Y(first)}" r="7" fill="var(--card)" stroke="var(--teal)" stroke-width="3"/>
    <circle cx="${X(last)}" cy="${Y(last)}" r="8" fill="var(--plum-2)" stroke="#fff" stroke-width="2"/>

// ---------- fake incoming call: a believable reason to leave an uncomfortable situation ----------
const CALL = { state: 'idle', at: 0, timer: 0, missTimer: 0, tickTimer: 0, lineTimer: 0, started: 0, caller: null };
const callActive = () => CALL.state === 'ringing' || CALL.state === 'talking';
const CALL_DELAYS = [0, 10, 30, 60, 300];

function callerInfo() {
  const k = S.settings.callCaller;
  if (k === 'custom') return { key: k, name: S.settings.callCustom || t('fc_unknown'), color: '#5a5f73', lines: CALLERS.office.lines };
  const c = CALLERS[k] || CALLERS.ammi;
  return { key: k, name: c.n[lang === 'ur' ? 1 : 0], color: c.color, lines: c.lines };
}

function scheduleFakeCall(delaySec = S.settings.callDelay) {
  clearTimeout(CALL.timer);
  if (callActive()) return;
  CALL.state = 'scheduled';
  CALL.at = now() + delaySec * 1000;
  CALL.timer = setTimeout(ringFakeCall, delaySec * 1000);
  logEvent('lg_callScheduled', { n: delaySec }, 'call');
  if (delaySec) toast(t('fc_scheduledToast', { d: dur(delaySec * 1000) }), 'ok');
  renderBanner();
  if (curRoute === 'fakecall') rerender();
}

function cancelFakeCall() {
  clearTimeout(CALL.timer);
  if (CALL.state === 'scheduled') CALL.state = 'idle';
  renderBanner();
  toast(t('fc_cancelled'));
  if (curRoute === 'fakecall') rerender();
}

function ringFakeCall() {
  if (SOS.phase !== 'idle') {
    CALL.state = 'idle';
    renderBanner();
    return;
  }
  CALL.state = 'ringing';
  CALL.caller = callerInfo();
  closeModal();
  closePalette();
  $('#callLayer').classList.add('on');
  document.documentElement.classList.add('call-on');
  renderCallLayer();
  ringer.start(S.settings.callTone);
  CALL.missTimer = setTimeout(() => endFakeCall('missed'), 45000);
  renderBanner();
}

function renderCallLayer() {
  const c = CALL.caller;
  const el = $('#callLayer');
  if (CALL.state === 'ringing') {
    el.innerHTML = `<div class="call-top"><small>${t('fc_incoming')}</small><h2 id="callName" dir="auto">${esc(c.name)}</h2><small>${t('fc_mobile')}</small>
      <div class="call-av" style="background:${c.color}">${esc(initials(c.name))}</div></div>
      <div class="call-btns"><div><button type="button" class="call-decline" id="callDecline" aria-label="${t('fc_decline')}">${ic('phone-off')}</button><label>${t('fc_decline')}</label></div>
      <div><button type="button" class="call-accept" id="callAccept" aria-label="${t('fc_accept')}">${ic('phone')}</button><label>${t('fc_accept')}</label></div></div>`;
    $('#callDecline').onclick = () => endFakeCall('declined');
    $('#callAccept').onclick = acceptFakeCall;
    $('#callAccept').focus({ preventScroll: true });
    return;
  }
  const keys = [['mic-off', 'fc_mute'], ['grid', 'fc_keypad'], ['volume', 'fc_speaker'], ['plus', 'fc_add'], ['video', 'fc_video'], ['users', 'fc_contacts']];
  el.innerHTML = `<div class="call-top"><h2 id="callName" dir="auto">${esc(c.name)}</h2><small id="callTimer" class="num">00:00</small><div class="call-caption" id="callCaption" dir="auto" aria-live="polite"></div></div>
    <div class="call-keys">${keys.map(([i, k]) => `<div><span role="button" tabindex="0" aria-pressed="false" data-key>${ic(i)}</span>${t(k)}</div>`).join('')}</div>
    <button type="button" class="call-end" id="callEnd" aria-label="${t('fc_end')}">${ic('phone-off')}</button>`;
  $('#callEnd').onclick = () => endFakeCall('ended');
  $$('[data-key]', el).forEach(k => (k.onclick = () => {
    const on = k.getAttribute('aria-pressed') !== 'true';
    k.setAttribute('aria-pressed', on);
    k.style.background = on ? 'rgba(255,255,255,.85)' : '';
    k.style.color = on ? '#15111b' : '';
  }));
  $('#callEnd').focus({ preventScroll: true });
}

function acceptFakeCall() {
  ringer.stop();
  clearTimeout(CALL.missTimer);
  CALL.state = 'talking';
  CALL.started = now();
  renderCallLayer();
  CALL.tickTimer = setInterval(() => $('#callTimer') && ($('#callTimer').textContent = clock(now() - CALL.started)), 1000);
  let i = 0;
  const say = () => {
    const line = CALL.caller.lines[i % CALL.caller.lines.length];
    const text = line[lang === 'ur' ? 1 : 0];
    if ($('#callCaption')) $('#callCaption').textContent = '"' + text + '"';
    speakLine(text);
    i++;
  };
  setTimeout(say, 1200);
  CALL.lineTimer = setInterval(say, 5200);
}

function speakLine(text) {
  if (!S.settings.callVoice || !window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang === 'ur' ? 'ur-PK' : 'en-GB';
  u.rate = 0.95;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function endFakeCall(reason) {
  ringer.stop();
  [CALL.missTimer, CALL.tickTimer, CALL.lineTimer].forEach(h => {
    clearTimeout(h);
    clearInterval(h);
  });
  if (window.speechSynthesis) speechSynthesis.cancel();
  const talked = CALL.state === 'talking' ? now() - CALL.started : 0;
  CALL.state = 'idle';
  $('#callLayer').classList.remove('on');
  document.documentElement.classList.remove('call-on');
  $('#callLayer').innerHTML = '';
  logEvent('lg_callUsed', { how: t('fc_' + reason), d: dur(talked) }, 'call');
  renderBanner();
  if (curRoute === 'fakecall') rerender();
}

function bindPinPad() {
  const inp = $('#pinInput');
  const dots = () => ($('#pinDots').innerHTML = Array.from({ length: Math.max(4, inp.value.length) }, (_, i) => `<i class="${i < inp.value.length ? 'on' : ''}"></i>`).join(''));
  $$('.pinpad button').forEach(b => (b.onclick = () => {
    const k = b.dataset.k;
    if (k === 'del') inp.value = inp.value.slice(0, -1);
    else if (k === 'clear') inp.value = '';
    else if (inp.value.length < 12) inp.value += k;
    dots();
  }));
  inp.oninput = dots;
  dots();
  $('#pinForm').onsubmit = async e => {
    e.preventDefault();
    await tryUnlock(inp.value);
  };
}

async function tryUnlock(pin) {
  const err = $('#pinErr');
  if (!pin) return;
  $('#pinGo').disabled = true;
  err.textContent = t('jn_unlocking');
  try {
    await unlockJournal(pin);
    toast(t('jn_unlocked'), 'ok');
    rerender();
  } catch (ex) {
    const g = guard();
    const wait = guardWait();
    if (!$('#pinErr')) return;
    $('#pinGo').disabled = false;
    $('#pinInput').value = '';
    $('#pinInput').dispatchEvent(new Event('input'));
    err.textContent = ex.message === 'wait' || wait ? t('jn_wait', { s: Math.ceil(wait / 1000) }) : t('jn_wrong', { n: Math.max(0, 5 - g.fails) });
    $('.lockcard').classList.remove('shake');
    void $('.lockcard').offsetWidth;
    $('.lockcard').classList.add('shake');
    vibrate([60, 40, 60]);
  }
}

function openOwnJournal(afterErase = false) {

    <form id="npForm" class="stack" autocomplete="off">

      <p class="err" id="npErr"></p><div class="notice plain">${ic('info')}<span>${t('jn_pinAdvice')}</span></div>

  $('#npForm', sh).onsubmit = async e => {
    e.preventDefault();
    const a = $('#np1', sh).value;
    const b = $('#np2', sh).value;
    const msg = pinProblem(a, b);

    if (msg) return;
    await startOwnJournal(a);
    closeModal();
    toast(t('jn_created'), 'ok');
    rerender();
  };

function pinProblem(a, b) {
  if (a.length < 4 || a.length > 12) return t('jn_pinLen');
  if (/^(\d)\1+$/.test(a) || '0123456789'.includes(a) || '9876543210'.includes(a)) return t('jn_pinWeak');
  if (a !== b) return t('jn_pinMatch');
  return '';
}

      ${area('enEv', 'jn_evidence', draft.evidence, t('jn_evidencePh'))}
      <div class="field"><span>${t('jn_photos')} <small>(${t('jn_photoLimit', { n: MAX_PHOTOS })})</small></span><div class="thumbs" id="enThumbs"></div>
        <div class="row"><button type="button" class="btn ghost sm" id="enAddPhoto">${ic('camera')} ${t('jn_addPhoto')}</button><small class="muted" id="enPhotoInfo"></small></div></div>
      <div class="grid2"><label class="field"><span>${t('jn_reported')}</span><select id="enRep">${opt(REPORTED, draft.reported, reportedName)}</select></label>
        <label class="field"><span>${t('jn_ref')} <small>(${t('optional')})</small></span><input id="enRef" dir="auto" value="${esc(draft.ref)}"></label></div>

      ${area('enFeel', 'jn_feelings', draft.feelings, t('jn_feelingsPh'))}
      <div class="notice plain">${ic('lock')}<span>${t('jn_encryptedNote')}</span></div>
      <div class="sfoot"><button type="button" class="btn ghost" data-close>${t('cancel')}</button><button class="btn teal" type="submit" id="enSave">${ic('lock')} ${t('jn_saveEncrypted')}</button></div>
    </form>`, { wide: true });

}

function drawThumbs(sh, draft) {
  $('#enThumbs', sh).innerHTML = draft.photos.map((p, i) => `<figure><img src="${p}" alt="${t('jn_photoAlt', { n: i + 1 })}"><button type="button" data-rm="${i}" aria-label="${t('remove')}">${ic('x')}</button></figure>`).join('');
  $$('[data-rm]', sh).forEach(b => (b.onclick = () => {
    draft.photos.splice(Number(b.dataset.rm), 1);
    drawThumbs(sh, draft);
  }));
  const kb = draft.photos.reduce((a, p) => a + p.length, 0) / 1024;
  $('#enPhotoInfo', sh).textContent = draft.photos.length ? t('jn_photoSize', { n: Math.round(kb) }) : '';
  $('#enAddPhoto', sh).disabled = draft.photos.length >= MAX_PHOTOS;
}

function bindEntryEditor(sh, e, draft) {
  drawThumbs(sh, draft);
  $$('#enSev button', sh).forEach(b => (b.onclick = () => {
    draft.severity = Number(b.dataset.n);
    $$('#enSev button', sh).forEach(x => x.classList.toggle('on', x === b));
  }));
  $('#enAddPhoto', sh).onclick = () => pickFile('image/*', files => addPhotos(files, sh, draft), { multiple: true, asText: false });
  // TODO(student): recordAudioEvidence() — add a "record audio" button using MediaRecorder (getUserMedia audio),
  // store the clip as a base64 data URL inside the entry so it is encrypted with everything else, and cap its length.
  $('#enForm', sh).onsubmit = async ev => {
    ev.preventDefault();
    await saveEntry(sh, e, draft);
  };
}

async function addPhotos(files, sh, draft) {
  for (const f of files) {
    if (draft.photos.length >= MAX_PHOTOS) break;
    try {
      draft.photos.push(await resizeImage(f, 1024, 0.72));
    } catch {
      toast(t('jn_photoErr'), 'bad');
    }
  }
  if ($('#enThumbs', sh)) drawThumbs(sh, draft);
}

async function saveEntry(sh, e, draft) {
  const what = $('#enWhat', sh).value.trim();
  const whenVal = $('#enWhen', sh).value;
  $('#enWhatErr', sh).textContent = what.length < 5 ? t('jn_whatErr') : '';
  if (what.length < 5) return;
  const fields = {
    when: whenVal ? new Date(whenVal).getTime() : now(), category: $('#enCat', sh).value, place: $('#enPlace', sh).value.trim(), what,
    who: $('#enWho', sh).value.trim(), witnesses: $('#enWit', sh).value.trim(), evidence: $('#enEv', sh).value.trim(), reported: $('#enRep', sh).value,
    ref: $('#enRef', sh).value.trim(), severity: draft.severity, feelings: $('#enFeel', sh).value.trim(), photos: draft.photos, updatedAt: now(),
  };
  $('#enSave', sh).disabled = true;
  const before = e ? { ...e } : null;
  if (e) Object.assign(e, fields);
  else J.data.entries.push({ id: uid('e'), createdAt: now(), ...fields });
  const ok = await saveJournal();
  if (!ok) {
    if (e) Object.assign(e, before);
    else J.data.entries.pop();
    $('#enSave', sh).disabled = false;
    return;
  }
  logEvent(e ? 'lg_entryEdited' : 'lg_entryAdded', {}, 'journal');
  closeModal();
  toast(t('jn_savedEncrypted'), 'ok');
  rerender();
}

// ---------- complaint report: police (FIR application), workplace inquiry committee, cyber harassment ----------
// A draft built from the decrypted entries. The exported file is NOT encrypted, and the UI says so.
const RP_TYPES = { police: 'file-text', workplace: 'briefcase', cyber: 'smartphone' };
const rp = { type: 'police', lng: 'en', ids: new Set(), photos: true, form: null, reliefEdited: false, accusedEdited: false };

function defaultReportIds(type) {
  const es = J.data.entries;
  const pick = type === 'workplace' ? es.filter(e => e.category === 'workplace') : type === 'cyber' ? es.filter(e => e.category === 'online') : es.filter(e => e.category !== 'online');
  return (pick.length ? pick : es).map(e => e.id);
}

function openReportBuilder(preIds = null) {
  if (!journalUnlocked()) return go('journal');
  if (!J.data.entries.length) {
    toast(t('jn_empty'));
    return;
  }
  rp.lng = lang;
  if (preIds) {
    const e = J.data.entries.find(x => x.id === preIds[0]);
    rp.type = e && e.category === 'workplace' ? 'workplace' : e && e.category === 'online' ? 'cyber' : 'police';
  }
  rp.ids = new Set(preIds || defaultReportIds(rp.type));
  rp.form = rp.form || { name: S.profile.name || '', guardian: '', cnic: '', phone: '', address: S.profile.city || '', station: '', org: '', designation: '', platform: '', accused: '', relief: '' };
  rp.reliefEdited = false;
  rp.accusedEdited = false;
  prefillReport();
  drawReportBuilder();
}

function prefillReport() {
  if (!rp.reliefEdited) rp.form.relief = tIn(rp.lng, 'rp_relief_' + rp.type);
  if (!rp.accusedEdited) {
    const who = [...new Set(J.data.entries.filter(e => rp.ids.has(e.id)).map(e => e.who).filter(Boolean))];
    rp.form.accused = who.join('\n');
  }
}

function reportFieldsHtml() {
  const f = rp.form;
  const inp = (id, k, extra = '') => `<label class="field"><span>${t(k)}</span><input data-f="${id}" value="${esc(f[id])}" dir="auto" ${extra}></label>`;
  const typeFields = { police: inp('station', 'rp_station'), workplace: inp('org', 'rp_org') + inp('designation', 'rp_designation'), cyber: inp('platform', 'rp_platform') };
  return `<div class="grid2">${inp('name', 'rp_name')}${inp('guardian', 'rp_guardian')}${inp('cnic', 'rp_cnic', 'class="ltr" placeholder="35202-0000000-0"')}${inp('phone', 'rp_phone', 'class="ltr"')}${inp('address', 'rp_address')}${typeFields[rp.type]}</div>
    <label class="field mt"><span>${t('rp_accused')}</span><textarea data-f="accused" dir="auto" style="min-height:64px">${esc(f.accused)}</textarea></label>
    <label class="field mt"><span>${t('rp_reliefLbl')}</span><textarea data-f="relief" dir="auto" style="min-height:64px">${esc(f.relief)}</textarea></label>`;
}

function drawReportBuilder() {
  const entries = [...J.data.entries].sort((a, b) => a.when - b.when);
  const sh = openModal(`${sheetHead(t('rp_title'), 'file-text')}
    <div class="notice amber mb">${ic('alert')}<span>${t('rp_warning')}</span></div>
    <div class="row"><div class="seg" id="rpType">${Object.keys(RP_TYPES).map(k => `<button type="button" data-k="${k}" class="${rp.type === k ? 'on' : ''}">${ic(RP_TYPES[k])} ${t('rp_type_' + k)}</button>`).join('')}</div>
      <div class="seg" id="rpLang"><button type="button" data-l="en" class="${rp.lng === 'en' ? 'on' : ''}">English</button><button type="button" data-l="ur" class="${rp.lng === 'ur' ? 'on' : ''}">اردو</button></div></div>
    <div class="cols half mt"><div class="stack"><div id="rpFields">${reportFieldsHtml()}</div>
      <fieldset style="border:0;padding:0;margin:0"><legend class="small" style="font-weight:650">${t('rp_entries')}</legend>
        ${entries.map(e => `<label class="check"><input type="checkbox" data-rid="${e.id}" ${rp.ids.has(e.id) ? 'checked' : ''}><span>${fmtDate(e.when)} · ${catName(e.category)}<br><small class="muted" dir="auto">${esc((e.place || '').slice(0, 60))}</small></span></label>`).join('')}</fieldset>
      <label class="check"><input type="checkbox" id="rpPhotos" ${rp.photos ? 'checked' : ''}><span>${t('rp_includePhotos')}</span></label></div>
      <div><div class="between mb"><b>${t('rp_preview')}</b><span class="tag amber">${t('rp_draft')}</span></div><div class="report-doc" id="rpPreview"></div></div></div>
    <div class="sfoot"><button type="button" class="btn ghost" id="rpCopy">${ic('copy')} ${t('rp_copy')}</button><button type="button" class="btn ghost" id="rpDownload">${ic('download')} ${t('rp_download')}</button><button type="button" class="btn" id="rpPrint">${ic('printer')} ${t('print')}</button></div>`, { wide: true });
  bindReportBuilder(sh);
  drawReportPreview();
}

function bindReportBuilder(sh) {
  const redraw = () => {
    $('#rpFields', sh).innerHTML = reportFieldsHtml();
    bindReportFields(sh);
    drawReportPreview();
  };
  $$('#rpType button', sh).forEach(b => (b.onclick = () => {
    rp.type = b.dataset.k;
    rp.ids = new Set(defaultReportIds(rp.type));
    prefillReport();
    drawReportBuilder();
  }));
  $$('#rpLang button', sh).forEach(b => (b.onclick = () => {
    rp.lng = b.dataset.l;
    $$('#rpLang button', sh).forEach(x => x.classList.toggle('on', x === b));
    prefillReport();
    redraw();
  }));
  $$('[data-rid]', sh).forEach(c => (c.onchange = () => {
    if (c.checked) rp.ids.add(c.dataset.rid);
    else rp.ids.delete(c.dataset.rid);
    prefillReport();
    redraw();
  }));
  $('#rpPhotos', sh).onchange = e => {
    rp.photos = e.target.checked;
    drawReportPreview();
  };
  bindReportFields(sh);
  $('#rpCopy', sh).onclick = () => copyText($('#rpPreview').innerText);
  $('#rpDownload', sh).onclick = downloadReport;
  $('#rpPrint', sh).onclick = () => {
    logEvent('lg_reportMade', { type: t('rp_type_' + rp.type) }, 'journal');
    printDoc(`<div class="print-doc" dir="${rp.lng === 'ur' ? 'rtl' : 'ltr'}">${reportHtml()}</div>`);
  };
}

function bindReportFields(sh) {
  $$('[data-f]', sh).forEach(inp => inp.addEventListener('input', debounce(() => {
    rp.form[inp.dataset.f] = inp.value;
    if (inp.dataset.f === 'relief') rp.reliefEdited = true;
    if (inp.dataset.f === 'accused') rp.accusedEdited = true;
    drawReportPreview();
  }, 200)));
}

function drawReportPreview() {
  const box = $('#rpPreview');
  if (!box) return;
  box.setAttribute('dir', rp.lng === 'ur' ? 'rtl' : 'ltr');
  box.innerHTML = reportHtml();
}

/** The complaint document itself, in the chosen report language. */
function reportHtml() {
  const l = rp.lng;
  const T = (k, v) => esc(tIn(l, k, v));
  const f = rp.form;
  const loc = l === 'ur' ? 'ur-PK-u-nu-latn' : 'en-PK';
  const d = ts => new Date(ts).toLocaleDateString(loc, { day: 'numeric', month: 'long', year: 'numeric' });
  const tm2 = ts => new Date(ts).toLocaleTimeString(loc, { hour: 'numeric', minute: '2-digit', hourCycle: l === 'ur' ? 'h23' : 'h12' });
  const cat = k => (CATEGORIES[k] || CATEGORIES.other).n[l === 'ur' ? 1 : 0];
  const rep = k => (REPORTED[k] || REPORTED.none)[l === 'ur' ? 1 : 0];
  const es = J.data.entries.filter(e => rp.ids.has(e.id)).sort((a, b) => a.when - b.when);
  const blank = '________';
  const guardian = f.guardian ? T('rp_guardianOf', { g: f.guardian }) : '';
  const to = { police: T('rp_to_police', { station: f.station || blank }), workplace: T('rp_to_workplace', { org: f.org || blank }), cyber: T('rp_to_cyber') }[rp.type];
  const open = { police: T('rp_open_police', { name: f.name || blank, guardian, address: f.address || blank }), workplace: T('rp_open_workplace', { name: f.name || blank, designation: f.designation || blank, org: f.org || blank }), cyber: T('rp_open_cyber', { name: f.name || blank, platform: f.platform || blank }) }[rp.type];

// ---------- personal safety map: offline schematic by default, Leaflet street map on request ----------
const MAP = { sel: '', adding: false, filter: new Set(Object.keys(SPOT_TYPES)), mode: 'schematic', vb: null, proj: null, lmap: null, drag: null };
const LEAFLET = {
  css: 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css',
  js: 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',
  cssSri: 'sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=',
  jsSri: 'sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=',
};
let leafletPromise = null;

/** Load Leaflet 1.9.4 once, with subresource integrity; rejects after 10 s or when offline. */
function loadLeaflet() {
  if (window.L && window.L.map) return Promise.resolve(window.L);
  if (leafletPromise) return leafletPromise;
  leafletPromise = new Promise((resolve, reject) => {
    const link = Object.assign(document.createElement('link'), { rel: 'stylesheet', href: LEAFLET.css, integrity: LEAFLET.cssSri, crossOrigin: '' });
    document.head.append(link);
    const s = Object.assign(document.createElement('script'), { src: LEAFLET.js, integrity: LEAFLET.jsSri, crossOrigin: '' });
    const timer = setTimeout(() => reject(new Error('timeout')), 10000);
    s.onload = () => {
      clearTimeout(timer);
      if (window.L && window.L.map) resolve(window.L);
      else reject(new Error('missing'));
    };
    s.onerror = () => {
      clearTimeout(timer);
      reject(new Error('offline'));
    };
    document.head.append(s);
  }).catch(err => {
    leafletPromise = null;
    throw err;
  });
  return leafletPromise;
}

const visibleSpots = () => S.spots.filter(s => MAP.filter.has(s.type));
const spotById = id => S.spots.find(s => s.id === id);

// ---------- local projection (equirectangular around the data's centre) ----------
function mapProjection(W, H) {
  const pts = [...S.spots, refPoint()];
  const lats = pts.map(p => p.lat);
  const lngs = pts.map(p => p.lng);
  const cy = (Math.min(...lats) + Math.max(...lats)) / 2;
  const cx = (Math.min(...lngs) + Math.max(...lngs)) / 2;
  const kx = Math.cos(toRad(cy));
  const spanX = Math.max((Math.max(...lngs) - Math.min(...lngs)) * kx, 0.004);
  const spanY = Math.max(Math.max(...lats) - Math.min(...lats), 0.004);
  // Extra room at the bottom keeps markers clear of the view switch and the scale labels.
  const pad = 48;
  const bottom = 46;
  const s = Math.min((W - 2 * pad) / spanX, (H - 2 * pad - bottom) / spanY);
  const midY = (H - bottom) / 2;
  return {
    W, H, s,
    x: p => W / 2 + (p.lng - cx) * kx * s,
    y: p => midY - (p.lat - cy) * s,
    inv: (x, y) => ({ lng: cx + (x - W / 2) / (kx * s), lat: cy - (y - midY) / s }),
  };
}

function gridLines(P) {
  const pxPerM = P.s / 111320;
  const step = 500 * pxPerM;
  let out = '';
  for (let x = -P.W; x <= 2 * P.W; x += step) out += `<path d="M${x.toFixed(1)} ${-P.H}V${2 * P.H}"/>`;
  for (let y = -P.H; y <= 2 * P.H; y += step) out += `<path d="M${-P.W} ${y.toFixed(1)}H${2 * P.W}"/>`;
  return `<g stroke="var(--line)" stroke-width="1">${out}</g>`;
}

function pinSvg(sp, P, k) {
  const ty = SPOT_TYPES[sp.type] || SPOT_TYPES.help;
  const sel = MAP.sel === sp.id;
  return `<g class="spot-pin ${sel ? 'sel' : ''}" data-sid="${sp.id}" transform="translate(${P.x(sp).toFixed(1)},${P.y(sp).toFixed(1)}) scale(${k})" tabindex="0" role="button" aria-label="${esc(spotName(sp))}, ${spotTypeName(sp.type)}">
    <circle class="halo" r="22" fill="${ty.color}" opacity="${sel ? 0.25 : 0}"/>
    <circle r="14" fill="${ty.color}" stroke="#fff" stroke-width="2.5"/>
    <use href="#i-${ty.icon}" x="-8" y="-8" width="16" height="16" style="stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"/>
    ${sel ? `<text y="-24" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)" stroke="var(--card)" stroke-width="4" paint-order="stroke">${esc(spotName(sp).slice(0, 34))}</text>` : ''}</g>`;
}

function schematicSvg(W, H) {
  const P = mapProjection(W, H);
  MAP.proj = P;
  if (!MAP.vb || MAP.vb.W !== W || MAP.vb.H !== H) MAP.vb = { x: 0, y: 0, w: W, h: H, W, H };
  const vb = MAP.vb;
  const k = vb.w / W;
  const ref = refPoint();
  const pxPerM = P.s / 111320;
  // Ring labels are skipped when they would sit closer than 40 px to the previous one.
  let lastLabel = -99;
  const rings = [500, 1000, 2000].map(m => {
    const r = m * pxPerM;
    const showLabel = r / k - lastLabel > 40;
    if (showLabel) lastLabel = r / k;
    const cx = P.x(ref);
    const cy = P.y(ref);
    const label = showLabel ? `<text x="${(cx + r + 4).toFixed(1)}" y="${cy - 4}" font-size="${11 * k}" fill="var(--muted)">${m >= 1000 ? m / 1000 + ' km' : m + ' m'}</text>` : '';
    return `<circle cx="${cx}" cy="${cy}" r="${r.toFixed(1)}" fill="none" stroke="var(--teal)" stroke-opacity=".22" stroke-dasharray="5 6"/>${label}`;
  }).join('');
  return `<svg class="schem ${MAP.adding ? 'adding' : ''}" id="schem" viewBox="${vb.x} ${vb.y} ${vb.w} ${vb.h}" role="application" aria-label="${t('mp_aria')}">
    <rect x="${-W}" y="${-H}" width="${3 * W}" height="${3 * H}" fill="var(--card-2)"/>${gridLines(P)}${rings}
    <g transform="translate(${P.x(ref)},${P.y(ref)}) scale(${k})"><circle r="9" fill="var(--teal)" stroke="#fff" stroke-width="3"/><text y="26" text-anchor="middle" font-size="12" font-weight="700" fill="var(--teal)" stroke="var(--card)" stroke-width="4" paint-order="stroke">${t(GEO.last ? 'mp_you' : 'mp_ref')}</text></g>
    ${visibleSpots().sort((a, b) => (a.id === MAP.sel) - (b.id === MAP.sel)).map(sp => pinSvg(sp, P, k)).join('')}</svg>`;
}

async function locateOnMap() {
  toast(t('loc_getting'));
  const p = await getPosition();
  if (p.error) {
    toast(geoErrorText(p.error), 'bad');
    return;
  }
  MAP.vb = null;
  if (curRoute === 'map') rerender();
}

function zoomSchematic(f, cx, cy) {
  const vb = MAP.vb;
  const nw = clamp(vb.w * f, vb.W / 8, vb.W * 2);
  const k = nw / vb.w;
  const px = cx ?? vb.x + vb.w / 2;
  const py = cy ?? vb.y + vb.h / 2;
  MAP.vb = { ...vb, x: px - (px - vb.x) * k, y: py - (py - vb.y) * k, w: nw, h: vb.h * k };
  refreshSchematic();
}

function refreshSchematic() {
  const box = $('#mapBox');
  const svg = $('#schem');
  if (!svg) return;
  svg.outerHTML = schematicSvg(box.clientWidth, box.clientHeight);
  bindSchematic();
}

// Pointer handling: drag pans, a click selects a pin or (in add mode) drops a new spot.
function bindSchematic() {
  const svg = $('#schem');
  if (!svg) return;
  const toSvg = e => {
    const r = svg.getBoundingClientRect();
    const vb = MAP.vb;
    return { x: vb.x + ((e.clientX - r.left) / r.width) * vb.w, y: vb.y + ((e.clientY - r.top) / r.height) * vb.h };
  };
  svg.addEventListener('pointerdown', e => {
    MAP.drag = { x: e.clientX, y: e.clientY, vb: { ...MAP.vb }, moved: false };
  });
  svg.addEventListener('pointermove', e => {
    const d = MAP.drag;
    if (!d) return;
    const dx = e.clientX - d.x;
    const dy = e.clientY - d.y;
    if (!d.moved && Math.hypot(dx, dy) < 5) return;
    d.moved = true;
    const r = svg.getBoundingClientRect();
    MAP.vb = { ...d.vb, x: d.vb.x - (dx / r.width) * d.vb.w, y: d.vb.y - (dy / r.height) * d.vb.h };
    svg.setAttribute('viewBox', `${MAP.vb.x} ${MAP.vb.y} ${MAP.vb.w} ${MAP.vb.h}`);
  });
  svg.addEventListener('pointerup', e => {
    const d = MAP.drag;
    MAP.drag = null;
    if (!d || d.moved) return;
    const pin = e.target.closest('[data-sid]');
    if (pin) return selectSpot(pin.dataset.sid);
    if (MAP.adding) {
      const pt = toSvg(e);
      openSpotForm(null, MAP.proj.inv(pt.x, pt.y));
    }
  });
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const pt = toSvg(e);
    zoomSchematic(e.deltaY > 0 ? 1.15 : 1 / 1.15, pt.x, pt.y);
  }, { passive: false });
  $$('[data-sid]', svg).forEach(g => g.addEventListener('keydown', e => (e.key === 'Enter' || e.key === ' ') && (e.preventDefault(), selectSpot(g.dataset.sid))));
}

function selectSpot(id) {
  MAP.sel = id;
  if (MAP.mode === 'schematic') refreshSchematic();
  else if (MAP.lmap) {
    const sp = spotById(id);
    if (sp) MAP.lmap.panTo([sp.lat, sp.lng]);
  }
  drawSpotInfo();
}

function saveSpot(sp, sh, state) {
  const name = $('#spName', sh).value.trim();
  const lat = Number($('#spLat', sh).value);
  const lng = Number($('#spLng', sh).value);
  $('#spNameErr', sh).textContent = name.length < 2 ? t('err_name') : '';
  if (name.length < 2 || !(Math.abs(lat) <= 90 && Math.abs(lng) <= 180)) return;
  const fields = { name, type: state.type, when: state.when, note: $('#spNote', sh).value.trim(), lat, lng };
  if (sp) {
    Object.assign(sp, fields, { nameUr: '', noteUr: '' });
  } else {
    const id = uid('s');
    S.spots.push({ id, ...fields, addedAt: now(), demo: false });
    MAP.sel = id;
    logEvent('lg_spotAdded', { name }, 'map');
  }
  persist('spots');
  MAP.adding = false;
  closeModal();
  toast(t('saved'), 'ok');
  rerender();
}

async function deleteSpot(sp) {
  if (!(await askConfirm(t('mp_delConfirm', { name: esc(spotName(sp)) }), { danger: true, okText: t('delete'), icon: 'trash' }))) return;
  S.spots = S.spots.filter(s => s.id !== sp.id);
  MAP.sel = '';
  persist('spots');
  rerender();
}

// ---------- street map (OpenStreetMap tiles through Leaflet) ----------
async function showStreetMap() {
  try {
    const Lf = await loadLeaflet();
    const box = $('#leafletBox');
    if (!box || MAP.mode !== 'street') return;
    box.innerHTML = '';
    const ref = refPoint();
    MAP.lmap = Lf.map(box, { zoomControl: false });
    // TODO(student): cacheMapTiles() — register a service worker that caches the tiles of the user's own area
    // (with the tile server's usage policy in mind) so the street map works offline and the app installs as a PWA.
    Lf.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(MAP.lmap);
    Lf.circleMarker([ref.lat, ref.lng], { radius: 8, color: '#fff', weight: 3, fillColor: '#16716d', fillOpacity: 1 }).addTo(MAP.lmap);
    const pts = visibleSpots().map(sp => {
      Lf.circleMarker([sp.lat, sp.lng], { radius: 10, color: '#fff', weight: 2, fillColor: SPOT_TYPES[sp.type].color, fillOpacity: 1 })
        .bindTooltip(spotName(sp))
        .on('click', () => selectSpot(sp.id))
        .addTo(MAP.lmap);
      return [sp.lat, sp.lng];
    });
    if (pts.length) MAP.lmap.fitBounds([...pts, [ref.lat, ref.lng]], { padding: [30, 30] });
    else MAP.lmap.setView([ref.lat, ref.lng], 15);
    MAP.lmap.on('click', e => MAP.adding && openSpotForm(null, { lat: e.latlng.lat, lng: e.latlng.lng }));
  } catch {
    MAP.mode = 'schematic';
    toast(t('mp_offline'), 'bad');
    if (curRoute === 'map') rerender();
  }
}

// ---------- discreet mode: a working calculator disguise unlocked by a PIN, quick exit, clear traces ----------
const CALC = { toks: [], justEval: false, busy: false };
const FAVICONS = {
  calc: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='2' width='22' height='28' rx='4' fill='%23555'/%3E%3Crect x='8' y='5' width='16' height='7' rx='1' fill='%23cfe3d0'/%3E%3Cg fill='%23eee'%3E%3Crect x='8' y='15' width='4' height='4'/%3E%3Crect x='14' y='15' width='4' height='4'/%3E%3Crect x='20' y='15' width='4' height='4'/%3E%3Crect x='8' y='21' width='4' height='4'/%3E%3Crect x='14' y='21' width='4' height='4'/%3E%3Crect x='20' y='21' width='4' height='4' fill='%23f90'/%3E%3C/g%3E%3C/svg%3E",
  neutral: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23e8dcc4'/%3E%3Cpath d='M9 17h14a7 7 0 0 1-14 0Z' fill='%23a5652c'/%3E%3C/svg%3E",
};
let appFavicon = '';
const setFavicon = kind => ($('#favicon').href = kind ? FAVICONS[kind] : appFavicon);

// ---------- calculator: tokens [{n:'12.5'} | {o:'+'}], evaluated with operator precedence (no eval) ----------
const CALC_KEYS = [['C', 'fn'], ['±', 'fn'], ['%', 'fn'], ['/', 'op'], ['7'], ['8'], ['9'], ['*', 'op'], ['4'], ['5'], ['6'], ['-', 'op'], ['1'], ['2'], ['3'], ['+', 'op'], ['del', 'fn'], ['0'], ['.'], ['=', 'eq']];
const OPS = { '+': '+', '-': '−', '*': '×', '/': '÷' };
const lastTok = () => CALC.toks[CALC.toks.length - 1];

function calcPress(k) {
  if (CALC.busy) return;
  if (/^\d$/.test(k) || k === '.') return calcDigit(k);
  if (OPS[k]) return calcOp(k);
  if (k === 'C') CALC.toks = [];
  if (k === 'del') calcDelete();
  if (k === '±' && lastTok() && lastTok().n) lastTok().n = lastTok().n.startsWith('-') ? lastTok().n.slice(1) : '-' + lastTok().n;
  if (k === '%' && lastTok() && lastTok().n) lastTok().n = String(Number(lastTok().n) / 100);
  if (k === '=') return calcEquals();
  CALC.justEval = false;
  drawCalc();
}

function calcDigit(k) {
  if (CALC.justEval) CALC.toks = [];
  CALC.justEval = false;
  const last = lastTok();
  if (last && last.n != null) {
    if (k === '.' && last.n.includes('.')) return;
    if (last.n.replace(/\D/g, '').length >= 12) return;
    last.n = last.n === '0' && k !== '.' ? k : last.n + k;
  } else CALC.toks.push({ n: k === '.' ? '0.' : k });
  drawCalc();
}

function calcOp(k) {
  CALC.justEval = false;
  const last = lastTok();
  if (!last) CALC.toks.push({ n: '0' });
  if (last && last.o) last.o = k;
  else CALC.toks.push({ o: k });
  drawCalc();
}

function calcDelete() {
  const last = lastTok();
  if (!last) return;
  if (last.o || last.n.length <= 1) CALC.toks.pop();
  else last.n = last.n.slice(0, -1);
}

/** Two-pass evaluation: × and ÷ first, then + and −. Returns NaN on division by zero. */
function calcValue(toks) {
  const nums = [];
  const ops = [];
  toks.forEach(tk => (tk.o ? ops.push(tk.o) : nums.push(Number(tk.n))));
  if (ops.length >= nums.length) ops.pop();
  const n2 = [nums[0]];
  const o2 = [];
  ops.forEach((o, i) => {
    const b = nums[i + 1];
    if (o === '*') n2.push(n2.pop() * b);
    else if (o === '/') {
      const a = n2.pop();
      n2.push(b === 0 ? NaN : a / b);
    }
    else {
      o2.push(o);
      n2.push(b);
    }
  });
  return o2.reduce((acc, o, i) => (o === '+' ? acc + n2[i + 1] : acc - n2[i + 1]), n2[0]);
}

const fmtCalc = v => (Number.isFinite(v) ? String(Number(v.toPrecision(12))) : 'Error');

async function calcEquals() {
  if (!CALC.toks.length) return;
  const typed = CALC.toks.length === 1 && CALC.toks[0].n;
  const v = calcValue(CALC.toks);
  $('#calcExpr').textContent = calcText() + ' =';
  CALC.toks = Number.isFinite(v) ? [{ n: fmtCalc(v) }] : [];
  CALC.justEval = true;
  $('#calcOut').textContent = fmtCalc(v);
  if (typed && /^\d{4,12}$/.test(typed) && S.settings.disguisePin) {
    CALC.busy = true;
    const ok = await checkDisguisePin(typed);
    CALC.busy = false;
    if (ok) unlockDisguise();
  }
}

const calcText = () => CALC.toks.map(tk => (tk.o ? ` ${OPS[tk.o]} ` : tk.n.replace(/^-/, '−'))).join('');

function drawCalc() {
  $('#calcExpr').textContent = CALC.justEval ? $('#calcExpr').textContent : '';
  $('#calcOut').textContent = calcText() || '0';
}

function calcHtml() {
  const label = k => (k === 'del' ? ic('arrow-left') : OPS[k] || k);
  return `<div class="calc" role="application" aria-label="Calculator"><header><span>Calculator</span><span>Standard</span></header>
    <div class="screen"><div class="expr" id="calcExpr"></div><div class="out" id="calcOut" aria-live="polite">0</div></div>
    <div class="keys">${CALC_KEYS.map(([k, cls = '']) => `<button type="button" class="${cls}" data-k="${k}" aria-label="${k === 'del' ? 'Delete' : k === '*' ? 'times' : k === '/' ? 'divide' : k === '-' ? 'minus' : k}">${label(k)}</button>`).join('')}</div></div>`;
}

function showDisguise() {
  document.documentElement.classList.add('disguised');
  document.title = 'Calculator';
  setFavicon('calc');
  CALC.toks = [];
  CALC.justEval = false;
  $('#disguise').innerHTML = calcHtml();
  $('#disguise').classList.add('on');
  $$('#disguise [data-k]').forEach(b => (b.onclick = () => calcPress(b.dataset.k)));
}

function unlockDisguise() {
  $('#disguise').classList.remove('on');
  $('#disguise').innerHTML = '';
  document.documentElement.classList.remove('disguised');
  setFavicon('');
  if (!S.settings.tourDone) S.settings.tourDone = true;
  route();
}

const disguised = () => document.documentElement.classList.contains('disguised');
const neutralOn = () => document.documentElement.classList.contains('neutral-on');

function calcKey(e) {
  const map = { Enter: '=', '=': '=', Backspace: 'del', Escape: 'C', Delete: 'C', x: '*', X: '*' };
  const k = map[e.key] || e.key;
  if (/^[\d.+\-*/%=]$/.test(k) || ['del', 'C'].includes(k)) {
    e.preventDefault();
    calcPress(k);
  }
}

// ---------- quick exit ----------
function quickExit() {
  stopAllSound();
  strobe.stop();
  if (SOS.phase !== 'idle') resetSos();
  if (callActive()) endFakeCall('ended');

  closePalette();

  }

function showNeutral() {
  document.documentElement.classList.add('neutral-on');
  document.title = 'Recipe notes';
  setFavicon('neutral');
  $('#neutral').innerHTML = `<div class="neutral-wrap"><h1 id="nTitle">Recipe notes</h1><p>Simple everyday recipes, saved for later.</p>

  $('#neutral').classList.add('on');
  bindNeutralReturn($('#nTitle'));

// The way back is hidden on purpose: press and hold the heading for 2 seconds, or tap it five times.
function bindNeutralReturn(h) {
  let timer = 0;
  let taps = [];
  const back = () => {
    clearTimeout(timer);
    leaveNeutral();
  };
  h.addEventListener('pointerdown', () => (timer = setTimeout(back, 2000)));
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => h.addEventListener(ev, () => clearTimeout(timer)));
  h.addEventListener('click', () => {
    taps = [...taps.filter(x => now() - x < 3000), now()];
    if (taps.length >= 5) back();
  });
}

function leaveNeutral() {
  $('#neutral').classList.remove('on');
  $('#neutral').innerHTML = '';
  document.documentElement.classList.remove('neutral-on');
  if (S.settings.disguisePin && (S.settings.disguise || S.settings.exitMode === 'calculator')) return showDisguise();
  setFavicon('');
  route();
}

// ---------- clear traces ----------
function openClearTraces() {
  const opts = [['trLog', 'tr_log', true], ['trJourneys', 'tr_journeys', true], ['trSos', 'tr_sos', true], ['trCheckins', 'tr_checkins', true], ['trAll', 'tr_all', false]];
  const sh = openModal(`${sheetHead(t('tr_title'), 'eraser')}<p class="small">${t('tr_sub')}</p>
    ${opts.map(([id, k, on]) => `<label class="check"><input type="checkbox" id="${id}" ${on ? 'checked' : ''}><span>${t(k)}</span></label>`).join('')}
    <div class="notice amber mt">${ic('alert')}<span>${t('tr_cannot')}</span></div>
    <details class="mt"><summary class="small" style="cursor:pointer">${t('tr_howBrowser')}</summary><ul class="small">${['tr_b1', 'tr_b2', 'tr_b3', 'tr_b4'].map(k => `<li>${t(k)}</li>`).join('')}</ul></details>
    <div class="sfoot"><button type="button" class="btn ghost" data-close>${t('cancel')}</button><button type="button" class="btn berry" id="trGo">${ic('eraser')} ${t('tr_go')}</button></div>`);
  $('#trGo', sh).onclick = async () => {
    const pick = id => $('#' + id, sh).checked;
    if (pick('trAll')) {
      closeModal();
      if (await askConfirm(t('tr_allConfirm'), { danger: true, okText: t('tr_wipe'), icon: 'eraser', typed: 'ERASE' })) wipeEverything();
      return;
    }
    clearTraces({ log: pick('trLog'), journeys: pick('trJourneys'), sos: pick('trSos'), checkins: pick('trCheckins') });
    closeModal();
  };
}

function clearTraces({ log, journeys, sos, checkins }) {
  if (log) {
    S.log = [];
    S.inbox = [];
  }
  if (journeys) S.journeys = [];
  if (sos) S.sosLog = [];
  if (checkins) S.checkins = [];
  persistAll();
  try {
    sessionStorage.clear();
  } catch {
    /* blocked */
  }
  history.replaceState(null, '', location.pathname + location.search + '#home');
  toast(t('tr_done'), 'ok');
  route();
}

/** Remove every Mahfooz key from this browser, then reload into an empty app (no demo data). */
function wipeEverything() {
  stopAllSound();
  lockJournal(true);
  store.keys().forEach(k => store.del(k));
  try {
    sessionStorage.setItem(NS + 'fresh', '1');
  } catch {
    /* blocked */
  }
  location.replace(location.pathname + location.search);
}

// ---------- disguise setup (called from Settings) ----------
function openDisguiseSetup() {
  const sh = openModal(`${sheetHead(t('dz_setupTitle'), 'calculator')}<p class="small">${t('dz_setupSub')}</p>
    <form id="dzForm" class="stack" autocomplete="off">
      <label class="field"><span>${t('dz_pin')}</span><input id="dz1" type="password" inputmode="numeric" class="ltr" maxlength="12" autocomplete="new-password"></label>
      <label class="field"><span>${t('jn_newPin2')}</span><input id="dz2" type="password" inputmode="numeric" class="ltr" maxlength="12" autocomplete="new-password"></label>
      <p class="err" id="dzErr"></p><div class="notice plain">${ic('info')}<span>${t('dz_howUnlock')}</span></div>
      <div class="sfoot"><button type="button" class="btn ghost" data-close>${t('cancel')}</button><button class="btn teal" type="submit">${ic('check')} ${t('dz_enable')}</button></div></form>`);
  $('#dzForm', sh).onsubmit = async e => {
    e.preventDefault();
    const a = $('#dz1', sh).value;
    const b = $('#dz2', sh).value;
    let msg = /^\d{4,12}$/.test(a) ? '' : t('dz_digits');
    if (!msg && a !== b) msg = t('jn_pinMatch');
    $('#dzErr', sh).textContent = msg;
    if (msg) return;
    await setDisguisePin(a);
    S.settings.disguise = true;
    persist('settings');
    logEvent('lg_disguiseOn', {}, 'discreet');
    closeModal();
    toast(t('dz_enabled'), 'ok');
    rerender();
  };
}

function disableDisguise() {
  S.settings.disguise = false;
  S.settings.disguisePin = null;
  if (S.settings.exitMode === 'calculator') S.settings.exitMode = 'neutral';
  persist('settings');
  logEvent('lg_disguiseOff', {}, 'discreet');
  rerender();
}

// ---------- notifications inbox and activity log ----------
const NT_ICONS = { journey: 'route', sos: 'siren', setup: 'shield-check', journal: 'lock', backup: 'download', circle: 'users', app: 'bell' };
let logKind = 'all';

const noteText = n => t(n.k, { ...n.vars, dest: urVar(n.vars, 'dest'), name: urVar(n.vars, 'name') });

function renderInbox(arg) {
  const tab = arg === 'log' ? 'log' : 'notes';
  const unread = unreadCount();
  const actions = tab === 'notes'
    ? `<button type="button" class="btn ghost" id="ibRead" ${unread ? '' : 'disabled'}>${ic('check')} ${t('ib_markAll')}</button><button type="button" class="btn ghost" id="ibClear">${ic('trash')} ${t('ib_clear')}</button>`
    : `<button type="button" class="btn ghost" id="lgPrint">${ic('printer')} ${t('print')}</button><button type="button" class="btn ghost" id="lgExport">${ic('download')} ${t('ib_export')}</button><button type="button" class="btn ghost" id="lgClear">${ic('eraser')} ${t('ib_clearLog')}</button>`;
  $('#view').innerHTML = `${pageHead(t('nav_inbox'), t('ib_sub'), actions)}
    <div class="seg mb" role="tablist"><a href="#inbox" role="tab" aria-selected="${tab === 'notes'}" class="${tab === 'notes' ? 'on' : ''}" style="text-decoration:none;padding:6px 12px;border-radius:10px;color:inherit">${ic('bell')} ${t('ib_notes')}${unread ? ` <span class="tag teal">${unread}</span>` : ''}</a><a href="#inbox/log" role="tab" aria-selected="${tab === 'log'}" class="${tab === 'log' ? 'on' : ''}" style="text-decoration:none;padding:6px 12px;border-radius:10px;color:inherit">${ic('activity')} ${t('ib_log')}</a></div>
    ${tab === 'notes' ? notesHtml() : logHtml()}`;
  if (tab === 'notes') bindNotes();
  else bindLog();
}

function notesHtml() {
  if (!S.inbox.length) return `<section class="card empty">${ic('bell')}<p>${t('ib_empty')}</p></section>`;
  return `<section class="card stagger">${S.inbox.map(n => `<button type="button" class="lrow rowbtn" data-nid="${n.id}">
    <span class="av ${n.level === 'warn' ? 'amber' : 'teal'}">${ic(NT_ICONS[n.kind] || 'bell')}</span>
    <div class="meta"><b style="white-space:normal;font-weight:${n.read ? 500 : 750}">${esc(noteText(n))}</b><small>${ago(n.ts)}</small></div>
    ${n.read ? '' : `<span class="tag teal">${t('ib_new')}</span>`}</button>`).join('')}</section>`;
}

function bindNotes() {
  $$('[data-nid]').forEach(b => (b.onclick = () => {
    const n = S.inbox.find(x => x.id === b.dataset.nid);
    n.read = true;
    persist('inbox');
    updateBadges();
    if (n.route) go(n.route);
    else rerender();
  }));
  if ($('#ibRead')) $('#ibRead').onclick = () => {
    S.inbox.forEach(n => (n.read = true));
    persist('inbox');
    updateBadges();
    rerender();
  };
  $('#ibClear').onclick = async () => {
    if (!(await askConfirm(t('ib_clearConfirm'), { icon: 'trash', okText: t('ib_clear') }))) return;
    S.inbox = [];
    persist('inbox');
    updateBadges();
    rerender();
  };
}

function logHtml() {
  const kinds = ['all', ...new Set(S.log.map(e => e.kind))];
  const list = S.log.filter(e => logKind === 'all' || e.kind === logKind);
  const groups = new Map();
  list.forEach(e => {
    const day = new Date(e.ts).toDateString();
    if (!groups.has(day)) groups.set(day, []);
    groups.get(day).push(e);
  });
  const body = [...groups.values()].map(es => `<h4 class="small muted mt">${fmtLong(es[0].ts)}</h4><ul class="timeline mt">${es.map(e => `<li class="${e.kind === 'sos' ? 'berry' : e.kind === 'journal' ? 'plum' : ''}"><span>${ic(LOG_ICONS[e.kind] || 'activity')} ${esc(logText(e))}</span><small>${fmtTime(e.ts)}</small></li>`).join('')}</ul>`).join('');
  return `<div class="seg mb" id="lgKinds">${kinds.map(k => `<button type="button" data-k="${k}" class="${logKind === k ? 'on' : ''}">${t('lk_' + k)}</button>`).join('')}</div>
    <section class="card">${body || `<div class="empty">${ic('activity')}<p>${t('noActivity')}</p></div>`}</section>
    <p class="tiny muted mt">${t('ib_logNote')}</p>`;
}

function bindLog() {
  $$('#lgKinds button').forEach(b => (b.onclick = () => {
    logKind = b.dataset.k;
    rerender();
  }));
  $('#lgExport').onclick = () => downloadFile(`mahfooz-activity-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(S.log.map(e => ({ time: new Date(e.ts).toISOString(), kind: e.kind, event: tIn('en', e.k, e.vars) })), null, 1));
  $('#lgPrint').onclick = () => printDoc(`<div class="print-doc" dir="${lang === 'ur' ? 'rtl' : 'ltr'}"><h1>${t('ib_log')}</h1><table><tr><th>${t('loc_time')}</th><th>${t('ib_event')}</th></tr>${S.log.map(e => `<tr><td>${fmtDT(e.ts)}</td><td>${esc(logText(e))}</td></tr>`).join('')}</table></div>`);
  $('#lgClear').onclick = async () => {
    if (!(await askConfirm(t('ib_clearLogConfirm'), { icon: 'eraser', okText: t('ib_clearLog'), danger: true }))) return;
    S.log = [];
    persist('log');
    rerender();
  };
}

// ---------- rule-based reminders (run at boot and hourly) ----------
function refreshNotices() {
  const real = S.contacts.filter(c => !c.demo);
  if (!real.length && !S.settings.demo) notify('nt_noContacts', {}, { kind: 'setup', route: 'circle', level: 'warn', key: 'noContacts' });
  real.filter(c => c.sos && (!c.lastTested || now() - c.lastTested > 60 * DAY)).forEach(c => notify('nt_untested', { name: c.name }, { kind: 'circle', route: 'circle', key: 'untested:' + c.id + ':' + Math.floor(now() / (30 * DAY)) }));
  if (journalOwn() && (!S.settings.lastBackup || now() - S.settings.lastBackup > 30 * DAY)) notify('nt_noBackup', {}, { kind: 'backup', route: 'settings', key: 'backup:' + Math.floor(now() / (30 * DAY)) });
}

function bindSettings() {
  const st = S.settings;
  const save = (k, v, re = true) => {
    st[k] = v;
    persist('settings');
    applyPrefs();
    if (re) rerender();
  };
  const seg = (id, fn) => $$(`#${id} button`).forEach(b => (b.onclick = () => fn(b.dataset.v)));
  const sw = (id, fn) => ($('#' + id).onchange = e => fn(e.target.checked));
  seg('stLang', v => setLang(v));
  seg('stTheme', v => save('theme', v));
  seg('stSize', v => save('size', v));
  sw('stCalm', v => save('calm', v, false));
  sw('stVib', v => save('vibrate', v, false));
  seg('stCount', v => save('sosCountdown', Number(v)));
  sw('stSiren', v => save('sosSiren', v, false));
  sw('stStrobe', v => save('sosStrobe', v, false));
  sw('stSilent', v => save('silentCountdown', v, false));
  sw('stBattery', v => save('includeBattery', v, false));
  seg('stMsgLang', v => save('msgLang', v));
  seg('stMapProv', v => save('mapProvider', v));
  sw('stLoc', v => save('useLocation', v));
  sw('stSim', v => save('simLocation', v));
  seg('stGrace', v => save('journeyGrace', Number(v)));
  seg('stEvery', v => save('checkinEvery', Number(v)));
  seg('stAuto', v => save('journalAutoLock', Number(v)));
  sw('stHide', v => save('lockOnHide', v, false));
  seg('stExit', v => save('exitMode', v === 'calculator' && !st.disguisePin ? 'neutral' : v));
  sw('stEsc', v => save('escExit', v, false));
  sw('stDemo', v => {
    setDemo(v);
    rerender();
  });
  bindSettingsActions(st);
}

function bindSettingsActions(st) {
  const on = (id, fn) => $('#' + id) && ($('#' + id).onclick = fn);
  on('stTplSave', () => {
    st.sosTemplate[lang] = $('#stTpl').value.trim();
    persist('settings');
    toast(t('saved'), 'ok');
  });
  on('stTplReset', () => {
    st.sosTemplate[lang] = '';
    persist('settings');
    rerender();
  });
  if ($('#stUrl')) $('#stUrl').onchange = e => {
    st.exitUrl = e.target.value.trim();
    persist('settings');
  };
  on('stTestLoc', testLocation);
  on('stNotif', () => Notification.requestPermission().then(() => rerender()));
  on('stPin', openChangePin);
  on('stLockNow', () => {
    lockJournal();
    rerender();
  });
  on('stOwn', openOwnJournal);
  on('stErase', forgotPin);
  on('stDzOn', openDisguiseSetup);
  on('stDzOff', disableDisguise);
  on('stTryExit', quickExit);
  on('stTraces', openClearTraces);
  on('stExport', exportData);
  on('stImport', () => pickFile('application/json,.json', importData));
  on('stReset', resetAll);
  on('stTour', startTour);
  on('stKeys', openShortcuts);
}

async function testLocation() {
  $('#stLocResult').textContent = t('loc_getting');
  const p = await getPosition();
  await refreshGeoPermission();
  if (!$('#stLocResult')) return;
  $('#stLocResult').textContent = p.error ? geoErrorText(p.error) : t('set_locOk', { c: fmtCoord(p), acc: p.acc }) + (p.sim ? ' · ' + t('simulated') : '');
}

// ---------- export / import / reset ----------
function exportData() {
  const data = {};
  for (const k of KEYS) data[k] = S[k];
  const out = { app: 'mahfooz', version: 1, exportedAt: new Date().toISOString(), data, journal: journalRec() };
  downloadFile(`mahfooz-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(out, null, 1));
  S.settings.lastBackup = now();
  persist('settings');
  S.inbox = S.inbox.filter(n => n.k !== 'nt_noBackup');
  persist('inbox');
  logEvent('lg_exported', {}, 'settings');
  rerender();
}

async function importData(text) {
  let obj;
  try {
    obj = JSON.parse(text);
  } catch {
    obj = null;
  }
  if (!obj || obj.app !== 'mahfooz' || !obj.data) {
    toast(t('set_badFile'), 'bad');
    return;
  }
  if (!(await askConfirm(t('set_importConfirm'), { okText: t('set_import'), icon: 'upload' }))) return;
  for (const k of KEYS) if (obj.data[k] !== undefined) store.set(k, obj.data[k]);
  if (obj.journal && obj.journal.format === 'mahfooz-journal') store.set('vault', obj.journal);
  lockJournal(true);
  S = loadState();
  logEvent('lg_imported', {}, 'settings');
  applyPrefs();
  toast(t('set_imported'), 'ok');
  go('home');
}

async function resetAll() {
  if (!(await askConfirm(t('set_resetConfirm'), { danger: true, okText: t('set_reset'), icon: 'refresh', typed: 'RESET' }))) return;
  stopAllSound();
  lockJournal(true);
  store.keys().forEach(k => store.del(k));
  location.replace(location.pathname + location.search);
}

function openPalette() {

function palKeys(e) {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    palSel = clamp(palSel + (e.key === 'ArrowDown' ? 1 : -1), 0, palItems.length - 1);
    $$('#palRes [data-i]').forEach(b => b.classList.toggle('on', Number(b.dataset.i) === palSel));
    const on = $('#palRes .on');
    if (on) on.scrollIntoView({ block: 'nearest' });
  }
  if (e.key === 'Enter' && palItems[palSel]) runPal(palSel);
}

function runPal(i) {
  const it = palItems[i];
  closePalette();
  if (it) it.run();
}

function closePalette() {

function startTour() {

function placeTip(el) {
  const rect = el.getBoundingClientRect();
  const tip = $('#tourTip');
  const p = 6;
  Object.assign($('#tourSpot').style, { left: rect.left - p + 'px', top: rect.top - p + 'px', width: rect.width + p * 2 + 'px', height: rect.height + p * 2 + 'px', borderRadius: el.classList.contains('sos-hold') ? '50%' : '16px' });
  const tw = Math.min(340, window.innerWidth - 32);
  const below = rect.bottom + 16;
  const top = below + tip.offsetHeight + 12 < window.innerHeight ? below : Math.max(12, rect.top - 16 - tip.offsetHeight);
  const left = clamp(rect.left + rect.width / 2 - tw / 2, 16, window.innerWidth - tw - 16);
  Object.assign(tip.style, { top: top + 'px', left: left + 'px' });
}

function showTourStep() {
  const step = TOUR[tourStep];
  if (!step) return endTour();
  const el = visibleEl(step.sel);
  if (!el) {
    tourStep++;
    return showTourStep();
  }
  if (getComputedStyle(el).position !== 'fixed' && !el.closest('.tabs, .side, .top, .sos-fab')) el.scrollIntoView({ block: 'center', behavior: 'instant' });
  const last = tourStep === TOUR.length - 1;
  $('#tourTip').innerHTML = `<span class="tag">${t('stepXofY', { x: tourStep + 1, y: TOUR.length })}</span><h4>${t(step.k + 't')}</h4><p>${t(step.k + 'b')}</p>
    <div class="between"><div class="dots">${TOUR.map((_, i) => `<i class="${i === tourStep ? 'on' : ''}"></i>`).join('')}</div>
    <div class="row"><button type="button" class="btn ghost sm" id="tourSkip">${t('skip')}</button>${tourStep ? `<button type="button" class="btn ghost sm" id="tourBack" aria-label="${t('back')}">${ic('chevron-left', 'flip')}</button>` : ''}
    <button type="button" class="btn sm teal" id="tourNext">${last ? t('done') : t('next')} ${ic(last ? 'check' : 'chevron-right', last ? '' : 'flip')}</button></div></div>`;
  placeTip(el);
  $('#tourSkip').onclick = endTour;
  $('#tourNext').onclick = () => {
    tourStep++;
    showTourStep();
  };
  if ($('#tourBack')) $('#tourBack').onclick = () => {
    tourStep--;
    showTourStep();
  };
  $('#tourNext').focus({ preventScroll: true });
}
window.addEventListener('resize', debounce(() => tourStep >= 0 && showTourStep(), 150));
