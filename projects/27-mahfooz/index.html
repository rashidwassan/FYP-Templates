<style>
/* ---------- tokens: deep plum, soft lavender, calm teal; safety coral is reserved for SOS ---------- */
:root {
  --plum: #3f1d52;
  --plum-2: #5a2b72;
  --plum-deep: #27112f;
  --plum-soft: #efe6f8;
  --lav: #f6f2fb;
  --lav-2: #ede5f7;
  --lav-3: #dccdee;
  --card: #ffffff;
  --card-2: #fbf9fe;
  --ink: #251a2e;
  --ink-2: #4a3d56;
  --muted: #6c6177;
  --line: #e4daef;
  --line-2: #cbbbdf;
  --teal: #16716d;
  --teal-2: #1d8a84;
  --teal-soft: #dcf0ed;
  --amber: #93560a;
  --amber-soft: #fbedd6;
  --berry: #a12f58;
  --berry-soft: #f9e2eb;
  --coral: #ff5a4a;
  --coral-deep: #e2412f;
  --coral-glow: rgba(255, 90, 74, .32);
  --focus: #6a3fd1;
  --shadow: 0 1px 2px rgba(39, 17, 47, .05), 0 12px 30px -20px rgba(39, 17, 47, .45);
  --shadow-lg: 0 28px 70px -28px rgba(39, 17, 47, .6);
  --radius: 18px;
  --radius-sm: 12px;
  --font: "Albert Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-ur: "Noto Nastaliq Urdu", "Albert Sans", serif;
  --top-h: 58px;
  --tab-h: 70px;
  --side-w: 264px;
  --fs: 15px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --dur: .35s;
}
html[data-theme="night"] {
  --plum-soft: #2c1c3a;
  --lav: #140b1b;
  --lav-2: #21152b;
  --lav-3: #34234a;
  --card: #1d1226;
  --card-2: #241830;
  --ink: #f2ebf9;
  --ink-2: #d6c9e4;
  --muted: #ab9dbb;
  --line: #352646;
  --line-2: #4a3760;
  --teal: #62c9bf;
  --teal-2: #7ad6cd;
  --teal-soft: #12302e;
  --amber: #e9b465;
  --amber-soft: #36270f;
  --berry: #f191b3;
  --berry-soft: #3a1626;
  --focus: #b79cff;
  --shadow: 0 12px 30px -20px rgba(0, 0, 0, .85);
}
html[data-size="lg"] { --fs: 17px; }
html[data-size="xl"] { --fs: 19px; }

/* ---------- motion kit ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
html.calm *, html.calm *::before, html.calm *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
@keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }
@keyframes breathe { 0%, 100% { box-shadow: 0 0 0 6px var(--coral-glow), 0 12px 26px -10px rgba(226, 65, 47, .8); } 50% { box-shadow: 0 0 0 12px rgba(255, 90, 74, .12), 0 12px 26px -10px rgba(226, 65, 47, .8); } }
@keyframes ripple { from { transform: scale(.6); opacity: .7; } to { transform: scale(1.6); opacity: 0; } }
.enter { animation: fadeUp var(--dur) var(--ease) both; }
.stagger > * { animation: fadeUp .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
.btn { transition: transform .15s var(--ease), box-shadow .15s var(--ease), background .15s, border-color .15s; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0) scale(.98); }
.card, .tile { transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s; }
.tile:hover { transform: translateY(-2px); }
.fill, .bar > i { transition: width .6s var(--ease); }
.skeleton { background: linear-gradient(90deg, var(--lav-2) 25%, var(--card) 50%, var(--lav-2) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 10px; }

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { font-size: var(--fs); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: var(--font);
  line-height: 1.5;
  background: radial-gradient(1200px 500px at 85% -10%, var(--lav-2), transparent 70%), var(--lav);
  overflow-x: hidden;
}
html[lang="ur"] body { font-family: var(--font-ur); line-height: 2.05; font-size: 1rem; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; font-weight: 750; letter-spacing: -.012em; }
html[lang="ur"] h1, html[lang="ur"] h2, html[lang="ur"] h3, html[lang="ur"] h4 { font-weight: 700; line-height: 1.95; letter-spacing: 0; }
p { margin: 0 0 .6em; }
a { color: var(--teal); }
code, kbd { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: .86em; }
.num, .kbd, code, time, input[type="number"], input[type="time"], input[type="datetime-local"], input[type="tel"] {
  font-family: var(--font);
  font-variant-numeric: tabular-nums lining-nums;
}
html[lang="ur"] .num { line-height: 1.4; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.tiny { font-size: .76rem; }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.grow.wide { min-width: min(100%, 250px); }
.stack > * + * { margin-top: 12px; }
.mt { margin-top: 14px; }
.mb { margin-bottom: 14px; }
.nowrap { white-space: nowrap; }
.ltr { direction: ltr; unicode-bidi: isolate; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
.skip { position: absolute; inset-inline-start: 12px; top: -60px; z-index: 400; background: var(--card); padding: 8px 14px; border-radius: 10px; }
.skip:focus { top: 10px; }
html[dir="rtl"] .flip { transform: scaleX(-1); }

/* ---------- icons ---------- */
.ic { width: 1.1em; height: 1.1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; flex: none; }
.ic.lg { width: 1.5em; height: 1.5em; }
.ic.xl { width: 2.2em; height: 2.2em; }

/* ---------- shell: side rail (desktop), top bar, view, bottom tab bar (phone) ---------- */
.side { display: none; }
.main { min-width: 0; min-height: 100vh; }
.top {
  position: sticky;
  top: 0;
  z-index: 50;
  height: var(--top-h);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px 0 14px;
  background: linear-gradient(180deg, var(--plum), #361849);
  color: #f6effc;
  box-shadow: 0 8px 22px -18px rgba(39, 17, 47, .9);
}
html[dir="rtl"] .top { padding: 0 14px 0 10px; }
.brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; min-width: 0; }
.brand .mark { width: 34px; height: 34px; flex: none; display: grid; place-items: center; }
.brand .mark svg { width: 34px; height: 34px; }
.brand b { display: block; font-size: 1.08rem; letter-spacing: .01em; line-height: 1.1; }
.brand small { display: block; font-size: .72rem; opacity: .78; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
html[lang="ur"] .brand b { line-height: 1.7; font-size: 1.02rem; }
html[lang="ur"] .brand small { line-height: 1.7; }
.top .title { display: none; }
.top .brand { flex: 1; }
.top-actions { display: flex; gap: 4px; align-items: center; }
.tbtn {
  height: 40px;
  min-width: 40px;
  border: 0;
  border-radius: 12px;
  background: rgba(255, 255, 255, .1);
  color: inherit;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 0 10px;
  cursor: pointer;
  position: relative;
}
.tbtn:hover { background: rgba(255, 255, 255, .18); }
.tbtn.lang { font-weight: 700; font-size: .86rem; }
.tbtn.exit { background: #f6effc; color: var(--plum); font-weight: 700; font-size: .84rem; }
.tbtn.exit:hover { background: #fff; }
.tbtn .lbl { display: none; }
.tbtn.exit .lbl { display: inline; }
.badge {
  position: absolute;
  top: 3px;
  inset-inline-end: 3px;
  min-width: 17px;
  height: 17px;
  padding: 0 4px;
  border-radius: 9px;
  background: var(--teal-2);
  color: #fff;
  font: 700 .66rem/17px var(--font);
  text-align: center;
}
#banner:empty { display: none; }
#view { padding: 16px 16px calc(var(--tab-h) + 56px + env(safe-area-inset-bottom)); max-width: 1180px; margin: 0 auto; outline: none; }

/* bottom tab bar with the raised SOS control in the centre */
.tabs {
  position: fixed;
  inset: auto 0 0 0;
  z-index: 60;
  height: calc(var(--tab-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  align-items: stretch;
  background: var(--card);
  border-top: 1px solid var(--line);
  box-shadow: 0 -10px 30px -22px rgba(39, 17, 47, .6);
}
.tabs a, .tabs button {
  border: 0;
  background: none;
  color: var(--muted);
  text-decoration: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-size: .72rem;
  font-weight: 600;
  cursor: pointer;
  position: relative;
  min-width: 0;
}
.tabs a .ic, .tabs > button .ic { width: 1.45em; height: 1.45em; }
.tabs a.on, .tabs > button.on { color: var(--plum); }
html[data-theme="night"] .tabs a.on, html[data-theme="night"] .tabs > button.on { color: var(--lav-3); filter: brightness(1.8); }
.tabs a.on::before { content: ""; position: absolute; top: 0; width: 28px; height: 3px; border-radius: 0 0 4px 4px; background: var(--teal); }
html[lang="ur"] .tabs a, html[lang="ur"] .tabs button { font-size: .7rem; line-height: 1.6; }
.tabs .sos-slot { position: relative; display: flex; justify-content: center; }
.tabs .sos-slot .sos-hold { position: absolute; top: -26px; width: 80px; height: 80px; }
.tdot { position: absolute; top: 8px; inset-inline-end: calc(50% - 20px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--teal); color: #fff; font: 700 .62rem/16px var(--font); padding: 0 4px; }

/* ---------- the SOS press-and-hold control (the only coral element outside SOS screens) ---------- */
.sos-hold {
  border: 0;
  border-radius: 50%;
  padding: 0;
  background: radial-gradient(circle at 35% 28%, #ff8f80, var(--coral) 55%, var(--coral-deep));
  color: #fff;
  cursor: pointer;
  display: grid;
  place-items: center;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  animation: breathe 3.2s ease-in-out infinite;
  z-index: 2;
}
.sos-hold .ring { position: absolute; inset: -7px; width: calc(100% + 14px); height: calc(100% + 14px); transform: rotate(-90deg); pointer-events: none; }
.sos-hold .ring circle { fill: none; stroke-width: 5; }
.sos-hold .ring .track { stroke: rgba(255, 90, 74, .18); }
.sos-hold .ring .prog { stroke: var(--coral-deep); stroke-linecap: round; }
.sos-hold .face { display: grid; place-items: center; line-height: 1; pointer-events: none; }
.sos-hold .face b { font: 800 1.35rem/1 var(--font); letter-spacing: .08em; }
.sos-hold .face small { font: 600 .62rem/1.2 var(--font); opacity: .92; margin-top: 3px; letter-spacing: .02em; }
html[lang="ur"] .sos-hold .face small { font-family: var(--font-ur); font-size: .6rem; line-height: 1.6; margin-top: 0; }
.sos-hold.holding { animation: none; transform: scale(.96); box-shadow: 0 0 0 14px rgba(255, 90, 74, .22); }
.sos-hold.holding .face small { opacity: 1; }
.sos-hold::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--coral); opacity: 0; pointer-events: none; }
.sos-hold.holding::after { animation: ripple 1s ease-out infinite; }
html.sos-on .sos-hold { animation: none; }

/* ---------- desktop: plum side rail with the large SOS pad ---------- */
@media (min-width: 1000px) {
  .app { display: grid; grid-template-columns: var(--side-w) 1fr; }
  .side {
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    padding: 16px 14px 14px;
    background: linear-gradient(185deg, var(--plum-2), var(--plum) 45%, var(--plum-deep));
    color: #f3ebfa;
    overflow: hidden;
  }
  .side .brand { padding: 2px 8px 10px; flex: none; }
  .snav { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .25) transparent; }
  .side .brand .mark, .side .brand .mark svg { width: 40px; height: 40px; }
  .snav { display: flex; flex-direction: column; gap: 2px; }
  .snav .grp { font-size: .66rem; text-transform: uppercase; letter-spacing: .1em; opacity: .6; margin: 9px 10px 2px; }
  html[lang="ur"] .snav .grp { text-transform: none; letter-spacing: 0; font-size: .74rem; }
  .snav a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px;
    border-radius: 12px;
    color: inherit;
    text-decoration: none;
    font-weight: 600;
    font-size: .92rem;
    opacity: .88;
  }
  html[lang="ur"] .snav a { padding: 2px 12px; font-weight: 500; font-size: .86rem; line-height: 2.05; }
  html[lang="ur"] .snav .grp { margin: 4px 10px 0; line-height: 1.6; }
  html[lang="ur"] .side-sos p { font-size: .7rem; line-height: 1.7; }
  .snav a:hover { background: rgba(255, 255, 255, .08); opacity: 1; }
  .snav a.on { background: rgba(255, 255, 255, .14); opacity: 1; box-shadow: inset 3px 0 0 #8fe0d6; }
  html[dir="rtl"] .snav a.on { box-shadow: inset -3px 0 0 #8fe0d6; }
  .snav .cnt { margin-inline-start: auto; background: #8fe0d6; color: var(--plum-deep); border-radius: 10px; padding: 0 7px; font: 700 .72rem/18px var(--font); }
  .side-sos { flex: none; padding: 16px 8px 2px; display: grid; justify-items: center; gap: 8px; text-align: center; border-top: 1px solid rgba(255, 255, 255, .1); }
  .side-sos .sos-hold { position: relative; width: 104px; height: 104px; }
  .side-sos .sos-hold .face b { font-size: 2rem; }
  .side-sos .sos-hold .face small { font-size: .74rem; }
  .side-sos p { margin: 0; font-size: .72rem; opacity: .75; max-width: 220px; line-height: 1.4; }
  .top {
    background: transparent;
    color: var(--ink);
    box-shadow: none;
    padding: 0 24px;
    height: 66px;
    backdrop-filter: blur(8px);
    background: color-mix(in srgb, var(--lav) 82%, transparent);
    border-bottom: 1px solid var(--line);
  }
  html[dir="rtl"] .top { padding: 0 24px; }
  .top .brand { display: none; }
  .top .title { display: block; flex: 1; min-width: 0; }
  .top .title h1 { font-size: 1.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tbtn { background: var(--card); border: 1px solid var(--line); color: var(--ink-2); }
  .tbtn:hover { background: var(--lav-2); }
  .tbtn.exit { background: var(--plum); color: #fff; border-color: var(--plum); }
  .tbtn.exit:hover { background: var(--plum-2); }
  .tbtn .lbl { display: inline; }
  .tabs { display: none; }
  #view { padding: 22px 28px 60px; }
}

/* ---------- buttons, tags, fields ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 18px;
  border-radius: 14px;
  border: 1px solid var(--plum);
  background: var(--plum);
  color: #fff;
  font-weight: 650;
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
}
.btn:hover { box-shadow: 0 10px 20px -14px rgba(39, 17, 47, .9); }
.btn.teal { background: var(--teal); border-color: var(--teal); }
html[data-theme="night"] .btn.teal { color: #08201e; }
.btn.ghost { background: transparent; color: var(--ink-2); border-color: var(--line-2); }
.btn.ghost:hover { background: var(--lav-2); }
.btn.soft { background: var(--plum-soft); color: var(--plum); border-color: transparent; }
html[data-theme="night"] .btn.soft { color: var(--ink); }
.btn.berry { background: var(--berry); border-color: var(--berry); }
html[data-theme="night"] .btn.berry { color: #2a0b16; }
.btn.white { background: #fff; color: var(--plum); border-color: #fff; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: .86rem; border-radius: 11px; }
.btn.lg { min-height: 54px; padding: 0 24px; font-size: 1.05rem; border-radius: 16px; }
.btn.block { width: 100%; }
.btn[disabled], .btn.off { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
html[lang="ur"] .btn { font-weight: 600; }
.ibtn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink-2);
  display: inline-grid;
  place-items: center;
  cursor: pointer;
  flex: none;
  text-decoration: none;
}
.ibtn:hover { background: var(--lav-2); }
.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 10px;
  border-radius: 999px;
  background: var(--lav-2);
  color: var(--ink-2);
  font-size: .74rem;
  font-weight: 650;
  white-space: nowrap;
}
html[lang="ur"] .tag { font-weight: 500; line-height: 1.9; }
.tag.teal { background: var(--teal-soft); color: var(--teal); }
.tag.amber { background: var(--amber-soft); color: var(--amber); }
.tag.berry { background: var(--berry-soft); color: var(--berry); }
.tag.plum { background: var(--plum); color: #fff; }
.tag.demo { background: transparent; border: 1px dashed var(--line-2); color: var(--muted); }
.field { display: grid; gap: 5px; min-width: 0; align-content: start; }
.field > span { font-size: .84rem; font-weight: 650; color: var(--ink-2); }
html[lang="ur"] .field > span { font-weight: 500; }
.field small { color: var(--muted); font-size: .76rem; }
.inp, .field input:not([type="checkbox"]):not([type="radio"]):not([type="range"]), .field select, .field textarea {
  width: 100%;
  min-height: 44px;
  padding: 9px 12px;
  border-radius: 12px;
  border: 1px solid var(--line-2);
  background: var(--card);
  color: var(--ink);
  outline: none;
}
.field textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
html[lang="ur"] .field textarea { line-height: 2; }
.inp:focus, .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
.field.bad input, .field.bad select, .field.bad textarea { border-color: var(--berry); }
.err { color: var(--berry); font-size: .78rem; min-height: 1em; }
.grid2 { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.grid3 { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 640px) {
  .grid2 { grid-template-columns: 1fr 1fr; }
  .grid3 { grid-template-columns: repeat(3, 1fr); }
}
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; padding: 6px 0; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--teal); flex: none; }
html[lang="ur"] .check input { margin-top: 8px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 14px; background: var(--lav-2); max-width: 100%; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: .86rem; color: var(--ink-2); min-height: 34px; }
.seg button.on { background: var(--card); color: var(--plum); box-shadow: var(--shadow); }
html[data-theme="night"] .seg button.on { color: var(--ink); }
.switch { position: relative; width: 46px; height: 28px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 14px; background: var(--line-2); transition: background .2s; }
.switch i::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s var(--ease); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.switch input:checked + i { background: var(--teal); }
.switch input:checked + i::after { transform: translateX(18px); }
html[dir="rtl"] .switch input:checked + i::after { transform: translateX(-18px); }
.switch input:focus-visible + i { outline: 3px solid var(--focus); outline-offset: 2px; }

/* ---------- cards, page heads, lists ---------- */
.pagehead { display: flex; gap: 12px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; margin-bottom: 16px; }
.pagehead h2 { font-size: 1.45rem; }
.pagehead p { margin: 2px 0 0; color: var(--muted); max-width: 640px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card h3 { font-size: 1.04rem; display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.card h3 .ic { color: var(--teal); }
.card.soft { background: var(--card-2); box-shadow: none; }
.card.plum { background: linear-gradient(150deg, var(--plum-2), var(--plum) 60%, var(--plum-deep)); color: #f5eefc; border-color: transparent; }
.card.plum h3 .ic { color: #8fe0d6; }
.card.plum .muted { color: #d9c9ea; }
.cols { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.cols > *, .grid2 > *, .grid3 > *, .qa > *, .kpis > *, .guide-grid > *, .helpgrid > * { min-width: 0; }
@media (min-width: 900px) {
  .cols.half { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .cols.side-r { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
  .cols.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
.notice { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--teal-soft); color: var(--ink); font-size: .88rem; }
.notice .ic { color: var(--teal); margin-top: 2px; }
.notice > span { flex: 1; min-width: min(200px, 100%); }
.notice.amber { background: var(--amber-soft); }
.notice.amber .ic { color: var(--amber); }
.notice.plain { background: var(--lav-2); }
.notice.plain .ic { color: var(--plum); }
html[data-theme="night"] .notice.plain .ic { color: var(--lav-3); filter: brightness(2); }
html[lang="ur"] .notice .ic { margin-top: 9px; }
.lrow { display: flex; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.lrow:last-child { border-bottom: 0; }
.lrow .meta { flex: 1; min-width: 0; }
.lrow .meta b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .meta small { display: block; color: var(--muted); font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.av { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-weight: 800; flex: none; background: var(--plum-soft); color: var(--plum); }
html[data-theme="night"] .av { color: var(--ink); }
.av.teal { background: var(--teal-soft); color: var(--teal); }
.av.amber { background: var(--amber-soft); color: var(--amber); }
.av.berry { background: var(--berry-soft); color: var(--berry); }
.empty { text-align: center; padding: 26px 12px; color: var(--muted); }
.empty .ic { width: 2.4em; height: 2.4em; color: var(--line-2); margin-bottom: 6px; }
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(2, 1fr); }
@media (min-width: 760px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.kpi small { color: var(--muted); font-size: .78rem; display: flex; gap: 6px; align-items: center; }
.kpi b { display: block; font: 800 1.5rem/1.2 var(--font); margin-top: 4px; }
.bar { height: 8px; border-radius: 6px; background: var(--lav-2); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; border-radius: 6px; background: var(--teal); }
.bar.plum > i { background: var(--plum-2); }
.bar.amber > i { background: var(--amber); }
.qa { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 760px) { .qa { grid-template-columns: repeat(4, 1fr); } }
.qa button, .qa a {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  padding: 14px;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  cursor: pointer;
  text-align: start;
  text-decoration: none;
  font-weight: 650;
  min-height: 96px;
}
.qa button:hover, .qa a:hover { border-color: var(--line-2); transform: translateY(-2px); box-shadow: var(--shadow); }
.qa .ico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--teal-soft); color: var(--teal); }
.qa .ico.plum { background: var(--plum-soft); color: var(--plum); }
html[data-theme="night"] .qa .ico.plum { color: var(--ink); }
.qa small { color: var(--muted); font-weight: 500; font-size: .76rem; line-height: 1.3; }
html[lang="ur"] .qa small { line-height: 1.9; }
.ringwrap { position: relative; width: 112px; height: 112px; flex: none; }
.ringwrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ringwrap circle { fill: none; stroke-width: 10; }
.ringwrap .track { stroke: rgba(255, 255, 255, .16); }
.ringwrap .val { stroke: #8fe0d6; stroke-linecap: round; transition: stroke-dashoffset .9s var(--ease); }
.ringwrap.dark .track { stroke: var(--lav-2); }
.ringwrap.dark .val { stroke: var(--teal); }
.ringwrap .lbl { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.1; }
.ringwrap .lbl b { font: 800 1.6rem/1 var(--font); display: block; }
.ringwrap .lbl small { font-size: .7rem; opacity: .8; }
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.steps li { display: flex; gap: 10px; align-items: flex-start; font-size: .9rem; }
.steps li .ic { margin-top: 3px; }
html[lang="ur"] .steps li .ic { margin-top: 9px; }
.steps li.ok .ic { color: #8fe0d6; }
.steps li.todo .ic { opacity: .6; }
.card:not(.plum) .steps li.ok .ic { color: var(--teal); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 14px;
  background: var(--card);
  border: 1px solid var(--line);
  text-decoration: none;
  color: var(--ink);
  white-space: nowrap;
  font-weight: 600;
  flex: none;
}
.chip b { font: 800 1rem/1 var(--font); color: var(--teal); }
.chip small { color: var(--muted); font-weight: 500; }
.verify { font-size: .72rem; color: var(--amber); display: inline-flex; gap: 4px; align-items: center; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: .9rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline li { position: relative; padding: 0 0 14px 26px; }
html[dir="rtl"] .timeline li { padding: 0 26px 14px 0; }
.timeline li::before { content: ""; position: absolute; inset-inline-start: 7px; top: 8px; bottom: -4px; width: 2px; background: var(--line); }
.timeline li:last-child::before { display: none; }
.timeline li::after { content: ""; position: absolute; inset-inline-start: 2px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--card); border: 3px solid var(--teal); }
.timeline li.plum::after { border-color: var(--plum-2); }
.timeline li.amber::after { border-color: var(--amber); }
.timeline li.berry::after { border-color: var(--berry); }
html[lang="ur"] .timeline li::after { top: 12px; }
.timeline small { color: var(--muted); display: block; font-size: .78rem; }

/* ---------- modal sheet, palette, tour, toasts ---------- */
#scrim { position: fixed; inset: 0; background: rgba(23, 10, 30, .5); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 150; }
#scrim.on { opacity: 1; pointer-events: auto; }
#modal { position: fixed; inset: 0; z-index: 160; display: flex; align-items: flex-end; justify-content: center; pointer-events: none; }
#modal.on { pointer-events: auto; }
.sheet {
  width: 100%;
  max-height: 92vh;
  overflow: auto;
  background: var(--card);
  border-radius: 22px 22px 0 0;
  padding: 8px 18px calc(18px + env(safe-area-inset-bottom));
  transform: translateY(100%);
  transition: transform .32s var(--ease);
  box-shadow: var(--shadow-lg);
}
#modal.on .sheet { transform: none; }
#modal:not(.on) .sheet { visibility: hidden; transition: transform .32s var(--ease), opacity .25s, visibility 0s .32s; }
.grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line-2); margin: 4px auto 10px; }
.shead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.shead h3 { display: flex; gap: 8px; align-items: center; font-size: 1.12rem; min-width: 0; }
.shead h3 .ic { color: var(--teal); }
.sfoot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px; }
@media (min-width: 700px) {
  #modal { align-items: center; }
  .sheet { width: min(560px, 92vw); border-radius: 22px; transform: scale(.96); opacity: 0; transition: transform .25s var(--ease), opacity .25s; padding: 18px 22px 22px; }
  .sheet.wide { width: min(860px, 94vw); }
  #modal.on .sheet { transform: none; opacity: 1; }
  .grab { display: none; }
}
.palette { position: fixed; inset: 0; z-index: 170; display: none; align-items: flex-start; justify-content: center; padding: 70px 14px 14px; background: rgba(23, 10, 30, .5); }
.palette.on { display: flex; animation: fadeIn .18s both; }
.palbox { width: min(600px, 100%); background: var(--card); border-radius: 18px; box-shadow: var(--shadow-lg); overflow: hidden; animation: pop .22s var(--ease) both; }
.palbox .inp { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; min-height: 54px; padding: 0 16px; font-size: 1.02rem; }
.palres { max-height: 60vh; overflow: auto; padding: 6px; }
.palres .pg { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 8px 10px 2px; }
html[lang="ur"] .palres .pg { text-transform: none; letter-spacing: 0; }
.palres button { display: flex; width: 100%; gap: 10px; align-items: center; padding: 9px 10px; border: 0; background: none; border-radius: 10px; cursor: pointer; text-align: start; }
.palres button.on, .palres button:hover { background: var(--lav-2); }
.palres button small { color: var(--muted); margin-inline-start: auto; font-size: .76rem; }
.palhint { padding: 8px 14px; font-size: .74rem; color: var(--muted); border-top: 1px solid var(--line); }
#tour { position: fixed; inset: 0; z-index: 180; display: none; }
#tour.on { display: block; }
#tourSpot { position: fixed; border-radius: 16px; box-shadow: 0 0 0 9999px rgba(23, 10, 30, .62); transition: all .3s var(--ease); pointer-events: none; }
#tourTip { position: fixed; width: min(340px, calc(100vw - 32px)); background: var(--card); border-radius: 18px; padding: 16px; box-shadow: var(--shadow-lg); animation: pop .25s var(--ease) both; }
#tourTip h4 { font-size: 1.05rem; margin: 6px 0 4px; }
#tourTip p { font-size: .9rem; color: var(--ink-2); }
.dots { display: flex; gap: 5px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); }
.dots i.on { background: var(--teal); width: 18px; border-radius: 4px; }
#toasts { position: fixed; inset-inline: 0; bottom: calc(var(--tab-h) + 30px); z-index: 260; display: grid; justify-items: center; gap: 8px; pointer-events: none; padding: 0 14px; }
@media (min-width: 1000px) { #toasts { bottom: 24px; } }
.toast { display: flex; gap: 10px; align-items: center; max-width: 440px; padding: 11px 16px; border-radius: 14px; background: var(--plum-deep); color: #fff; box-shadow: var(--shadow-lg); animation: fadeUp .3s var(--ease) both; transition: opacity .3s, transform .3s; font-size: .92rem; }
.toast.ok .ic { color: #8fe0d6; }
.toast.bad .ic { color: #ffc56b; }
.toast.out { opacity: 0; transform: translateY(8px); }
.kbd { display: inline-block; min-width: 26px; padding: 2px 7px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--card-2); font-size: .78rem; text-align: center; box-shadow: 0 2px 0 var(--line); }
.setrow { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); }
.setrow:last-child { border-bottom: 0; }
.setrow > div:first-child { min-width: 0; }
.setrow small { display: block; color: var(--muted); font-size: .78rem; }

/* ---------- banner strip (active journey / SOS / scheduled call) ---------- */
.strip { display: flex; gap: 10px; align-items: center; padding: 9px 16px; background: var(--teal); color: #fff; font-size: .88rem; font-weight: 600; }
.strip.amber { background: var(--amber); }
html[data-theme="night"] .strip.amber { color: #2a1a04; }
.strip .grow { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.strip .btn { min-height: 32px; padding: 0 10px; font-size: .8rem; background: rgba(255, 255, 255, .18); border-color: transparent; }
.strip + .strip { border-top: 1px solid rgba(255, 255, 255, .2); }

/* ---------- SOS layer: countdown and active alert (coral lives here) ---------- */
#sosLayer {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: none;
  overflow-y: auto;
  color: #fbf4ff;
  background: radial-gradient(900px 600px at 50% -10%, #5a2140, transparent 70%), linear-gradient(170deg, #2b1236, #160a1e);
}
#sosLayer.on { display: block; animation: fadeIn .25s both; }
.sos-wrap { max-width: 720px; margin: 0 auto; padding: 22px 16px 40px; }
.sos-count { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 30px 16px; }
.sos-count h2 { font-size: 1.5rem; }
.bigring { position: relative; width: 220px; height: 220px; margin: 22px auto; }
.bigring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.bigring circle { fill: none; stroke-width: 12; }
.bigring .track { stroke: rgba(255, 255, 255, .1); }
.bigring .prog { stroke: var(--coral); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
.bigring b { position: absolute; inset: 0; display: grid; place-items: center; font: 800 5rem/1 var(--font); color: #fff; }
.sos-count .btn.white { min-width: 240px; }
.sos-head { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
.sos-head .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 6px var(--coral-glow); flex: none; animation: breathe 1.6s infinite; }
.sos-head h2 { font-size: 1.4rem; }
.sos-card { background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .12); border-radius: 18px; padding: 14px; margin-top: 12px; }
.sos-card h3 { font-size: 1rem; display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.sos-card h3 .ic { color: #ffb3a8; }
.sos-card .muted, #sosLayer .muted { color: #d4c2e3; }
.sos-card textarea { width: 100%; min-height: 110px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, .2); background: rgba(0, 0, 0, .25); color: #fff; padding: 10px; line-height: 1.5; }
html[lang="ur"] .sos-card textarea { line-height: 2; }
.sos-send { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, .1); }
#sosLayer .kv dt { color: #cdb9dd; }
#sosLayer .tag.demo { color: #d4c2e3; border-color: rgba(255, 255, 255, .3); white-space: normal; }
html.sos-on body, html.call-on body, html.disguised body, html.neutral-on body { overflow: hidden; }
.sos-send:last-child { border-bottom: 0; }
.sos-send .meta { flex: 1; min-width: 150px; }
.sos-send .meta b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sos-send .meta small { color: #d4c2e3; font-size: .78rem; }
.btn.coral { background: var(--coral); border-color: var(--coral); color: #fff; }
.btn.coral:hover { background: var(--coral-deep); }
.btn.glass { background: rgba(255, 255, 255, .1); border-color: rgba(255, 255, 255, .22); color: #fff; }
.btn.glass.on { background: #fff; color: var(--coral-deep); }
.helpgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
@media (min-width: 560px) { .helpgrid { grid-template-columns: repeat(3, 1fr); } }
.helpgrid a { display: grid; gap: 2px; padding: 10px 12px; border-radius: 14px; background: rgba(255, 255, 255, .08); color: #fff; text-decoration: none; border: 1px solid rgba(255, 255, 255, .12); min-width: 0; }
.helpgrid a b { font: 800 1.2rem/1.2 var(--font); }
.helpgrid a span { font-size: .78rem; opacity: .85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.practice-badge { display: inline-flex; gap: 6px; align-items: center; padding: 3px 10px; border-radius: 999px; border: 1px dashed #ffb3a8; color: #ffd2cb; font-size: .76rem; font-weight: 700; }
#strobe { position: fixed; inset: 0; z-index: 240; display: none; background: #fff; cursor: pointer; }
#strobe.on { display: grid; place-items: end center; padding-bottom: 60px; }
#strobe.flash { background: var(--coral); }
#strobe span { background: rgba(0, 0, 0, .7); color: #fff; padding: 10px 18px; border-radius: 14px; font-weight: 700; }

/* ---------- fake incoming call ---------- */
#callLayer { position: fixed; inset: 0; z-index: 210; display: none; color: #fff; background: linear-gradient(180deg, #2c2238 0%, #15111b 70%); }
#callLayer.on { display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 64px 24px calc(48px + env(safe-area-inset-bottom)); animation: fadeIn .3s both; }
.call-top { text-align: center; }
.call-top small { opacity: .75; font-size: .9rem; display: block; }
.call-top h2 { font-size: 2rem; font-weight: 600; margin: 6px 0 4px; letter-spacing: 0; }
.call-av { width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center; margin: 26px auto 0; font: 700 2.6rem/1 var(--font); color: #fff; position: relative; }
.call-av::before, .call-av::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .25); animation: ripple 2s ease-out infinite; }
.call-av::after { animation-delay: 1s; }
.call-btns { display: flex; gap: 70px; justify-content: center; }
.call-btns button, .call-end { width: 72px; height: 72px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; color: #fff; }
.call-btns .ic, .call-end .ic { width: 30px; height: 30px; }
.call-btns label { display: block; text-align: center; margin-top: 8px; font-size: .85rem; opacity: .85; }
.call-accept { background: #2fb36b; }
.call-decline, .call-end { background: #d93b4f; }
.call-keys { display: grid; grid-template-columns: repeat(3, 72px); gap: 18px 26px; justify-content: center; }
.call-keys div { text-align: center; font-size: .78rem; opacity: .85; }
.call-keys .ic { width: 24px; height: 24px; }
#callLayer :focus-visible { outline: 2px solid rgba(255, 255, 255, .7); outline-offset: 4px; }
.call-keys span { width: 64px; height: 64px; border-radius: 50%; background: rgba(255, 255, 255, .12); display: grid; place-items: center; margin: 0 auto 6px; }
.call-caption { min-height: 64px; max-width: 420px; text-align: center; font-size: 1.02rem; opacity: .92; margin-top: 16px; }

/* ---------- discreet: calculator disguise and neutral page ---------- */
#disguise { position: fixed; inset: 0; z-index: 300; display: none; background: #f2f2f3; color: #1d1d1f; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; direction: ltr; }
#disguise.on { display: flex; justify-content: center; align-items: stretch; }
.calc { width: 100%; max-width: 420px; display: flex; flex-direction: column; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
.calc header { display: flex; justify-content: space-between; align-items: center; color: #6b6b70; font-size: .9rem; }
.calc .screen { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; padding: 10px 6px 18px; min-height: 150px; overflow: hidden; }
.calc .expr { color: #77777c; font-size: 1.1rem; min-height: 1.6em; word-break: break-all; text-align: end; }
.calc .out { font-size: 3.4rem; font-weight: 300; line-height: 1.1; word-break: break-all; text-align: end; font-variant-numeric: tabular-nums; }
.calc .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.calc .keys button { height: 68px; border: 0; border-radius: 20px; background: #fff; font-size: 1.5rem; cursor: pointer; color: #1d1d1f; box-shadow: 0 1px 0 rgba(0, 0, 0, .06); }
.calc .keys button.fn { background: #e3e3e6; }
.calc .keys button.op { background: #dfe7f5; color: #2b56b5; }
.calc .keys button.eq { background: #2b56b5; color: #fff; }
.calc .keys button:active { filter: brightness(.92); }
#neutral { position: fixed; inset: 0; z-index: 300; display: none; overflow-y: auto; background: #fffdf8; color: #2d2a26; font-family: Georgia, "Times New Roman", serif; direction: ltr; }
#neutral.on { display: block; }
.neutral-wrap { max-width: 720px; margin: 0 auto; padding: 28px 20px 60px; }
.neutral-wrap h1 { font-size: 2rem; font-weight: 400; border-bottom: 1px solid #e8e1d4; padding-bottom: 12px; user-select: none; }
.neutral-wrap h2 { font-size: 1.3rem; font-weight: 400; margin-top: 26px; }
.neutral-wrap li { margin: 4px 0; }

/* ---------- journal ---------- */
.lockcard { max-width: 420px; margin: 10px auto; text-align: center; }
.lockcard .padlock { width: 66px; height: 66px; border-radius: 20px; margin: 4px auto 10px; display: grid; place-items: center; background: var(--plum); color: #fff; }
.pindots { display: flex; gap: 12px; justify-content: center; margin: 14px 0 6px; direction: ltr; }
.pindots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--plum-2); }
.pindots i.on { background: var(--plum-2); }
html[data-theme="night"] .pindots i { border-color: var(--lav-3); }
html[data-theme="night"] .pindots i.on { background: var(--lav-3); }
.pinpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 290px; margin: 10px auto 0; direction: ltr; }
.pinpad button { height: 58px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); font: 600 1.35rem/1 var(--font); cursor: pointer; color: var(--ink); }
.pinpad button:hover { background: var(--lav-2); }
.pinpad button.fn { font-size: .9rem; color: var(--muted); }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.entry { border: 1px solid var(--line); border-radius: 16px; padding: 14px; background: var(--card); cursor: pointer; text-align: start; width: 100%; color: inherit; display: block; }
.entry:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
.entry h4 { font-size: 1rem; margin: 4px 0; }
.entry p { color: var(--ink-2); font-size: .88rem; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumbs figure { margin: 0; position: relative; }
.thumbs img { width: 84px; height: 64px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); display: block; }
.thumbs figure button { position: absolute; top: -6px; inset-inline-end: -6px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: var(--plum-deep); color: #fff; display: grid; place-items: center; cursor: pointer; }
.thumbs figure button .ic { width: 14px; height: 14px; }
.ciphertext { font-family: ui-monospace, Menlo, monospace; font-size: .72rem; word-break: break-all; color: var(--muted); max-height: 82px; overflow: hidden; background: var(--card-2); border: 1px dashed var(--line-2); border-radius: 10px; padding: 8px; direction: ltr; text-align: left; }
.report-doc { background: #fff; color: #1d1820; border: 1px solid var(--line); border-radius: 12px; padding: 22px; font-family: Georgia, "Times New Roman", serif; line-height: 1.55; max-height: 60vh; overflow: auto; }
.report-doc h1 { font-size: 1.3rem; }
.report-doc h2 { font-size: 1.05rem; margin: 16px 0 6px; }
.report-doc table { width: 100%; border-collapse: collapse; font-size: .85rem; margin: 8px 0; }
.report-doc th, .report-doc td { border: 1px solid #cfc6d8; padding: 6px 8px; text-align: start; vertical-align: top; }
.report-doc img { max-width: 220px; max-height: 160px; border: 1px solid #ccc; margin: 4px; }
.report-doc[dir="rtl"] { font-family: var(--font-ur); line-height: 2.1; }

/* ---------- safety map ---------- */
.mapbox { position: relative; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: var(--card-2); height: 380px; touch-action: none; }
@media (min-width: 900px) { .mapbox { height: 470px; } }
.mapbox svg.schem { width: 100%; height: 100%; display: block; cursor: grab; }
.mapbox svg.schem.adding { cursor: crosshair; }
.mapbox .ctl { position: absolute; top: 10px; inset-inline-end: 10px; display: grid; gap: 6px; z-index: 500; }
.mapbox .mode { position: absolute; bottom: 10px; inset-inline-start: 10px; z-index: 500; }
#leafletBox { position: absolute; inset: 0; }
.spot-pin { cursor: pointer; }
.spot-pin:hover circle.halo, .spot-pin.sel circle.halo { opacity: 1; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .8rem; color: var(--ink-2); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.sw { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
.leaflet-container { font: inherit; }

/* ---------- rights guides and quiz ---------- */
.guide-grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 700px) { .guide-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1100px) { .guide-grid { grid-template-columns: repeat(3, 1fr); } }
.guide-card { display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit; }
.guide-card:hover { transform: translateY(-2px); border-color: var(--line-2); }
.guide-body h3 { font-size: 1.08rem; margin: 18px 0 8px; }
.guide-body h3:first-child { margin-top: 0; }
.guide-body ul, .guide-body ol { padding-inline-start: 22px; margin: 6px 0; }
.guide-body li { margin: 5px 0; }
.disclaimer { border-inline-start: 4px solid var(--amber); }
.qopt { display: block; width: 100%; text-align: start; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--card); cursor: pointer; margin-top: 8px; color: var(--ink); }
.qopt:hover { background: var(--lav-2); }
.qopt.right { border-color: var(--teal); background: var(--teal-soft); }
.qopt.wrong { border-color: var(--berry); background: var(--berry-soft); }
.qopt[disabled] { cursor: default; }

/* ---------- printable layouts ---------- */
#printArea { display: none; }
.wallet { width: 86mm; min-height: 54mm; border: 1px solid #999; border-radius: 4mm; padding: 4mm; font: 9pt/1.35 var(--font); color: #111; display: inline-block; vertical-align: top; margin: 3mm; }
.wallet h4 { font-size: 10pt; margin: 0 0 2mm; }
.wallet table { width: 100%; border-collapse: collapse; }
.wallet td { padding: .6mm 0; vertical-align: top; }
.print-doc { font: 11pt/1.5 Georgia, "Times New Roman", serif; color: #111; }
.print-doc h1 { font-size: 16pt; }
.print-doc h2 { font-size: 12.5pt; margin: 12pt 0 4pt; }
.print-doc table { width: 100%; border-collapse: collapse; font-size: 9.5pt; }
.print-doc th, .print-doc td { border: 1px solid #999; padding: 4pt 6pt; text-align: start; vertical-align: top; }
.print-doc img { max-width: 60mm; max-height: 45mm; margin: 2mm; border: 1px solid #ccc; }
.print-doc[dir="rtl"] { font-family: var(--font-ur); line-height: 2.1; }
@media print {
  body { background: #fff !important; }
  .app, #toasts, #scrim, #modal, .palette, #tour, #sosLayer, #callLayer, #strobe, #disguise, #neutral, .skip { display: none !important; }
  #printArea { display: block !important; }
  .pb { page-break-before: always; }
}


/* ---------- shared extras: row buttons, wrapping rows, floating SOS, sticky banner ---------- */
.rowbtn { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); cursor: pointer; text-align: start; color: inherit; font: inherit; }
.rowbtn:last-child { border-bottom: 0; }
.rowbtn:hover { background: var(--card-2); }
.lrow.wrap { flex-wrap: wrap; }
@media (max-width: 560px) {
  .lrow.wrap > .acts { width: 100%; padding-inline-start: 54px; }
}
.qa.three { grid-template-columns: repeat(2, 1fr); }
@media (min-width: 760px) { .qa.three { grid-template-columns: repeat(3, 1fr); } }
.seg a { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: .86rem; color: var(--ink-2); min-height: 34px; }
.seg a.on { background: var(--card); color: var(--plum); box-shadow: var(--shadow); }
html[data-theme="night"] .seg a.on { color: var(--ink); }
.berry-text { color: var(--berry); }
.crumbs { width: 100%; height: auto; display: block; border-radius: 14px; border: 1px solid var(--line); background-color: var(--card-2); background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 30px 30px; }
.card .wallet { max-width: 100%; margin: 0; }
.sos-fab { position: fixed; z-index: 61; left: 50%; bottom: calc(var(--tab-h) - 38px + env(safe-area-inset-bottom)); width: 80px; height: 80px; margin-left: -40px; }
.sos-fab .sos-hold { position: relative; width: 80px; height: 80px; }
@media (min-width: 1000px) { .sos-fab { display: none; } }
#banner { position: sticky; top: var(--top-h); z-index: 45; }
@media (min-width: 1000px) { #banner { top: 66px; } }
.strip.sos { background: var(--coral-deep); }
html.disguised .sos-fab, html.neutral-on .sos-fab { display: none; }

/* ---------- discreet states hide the real app completely ---------- */
html.disguised .app, html.neutral-on .app { display: none !important; }
html.disguised #toasts, html.neutral-on #toasts { display: none; }
</style>

<script>
'use strict';
/* =====================================================================
   Mahfooz — women's safety companion (single file, no build)
   utils · i18n · content (helplines, guides, quiz, call scripts) · state
   and seed · crypto (PIN-derived AES-GCM journal) · audio (siren,
   ringtone, chimes) · location (geolocation, simulation, haversine) ·
   messages (sms:, wa.me, tel:) · views (home, SOS, circle, plan,
   journey, fake call, journal, map, rights, quiz, inbox, settings,
   about) · discreet mode (calculator, quick exit, clear traces) ·
   search, tour, shortcuts, router and boot.
   Honest limits: a web page cannot send SMS, place calls or track
   location in the background, and Mahfooz never contacts emergency
   services by itself. Student extension points are marked TODO(student).
   ===================================================================== */

// ---------- DOM + storage helpers ----------
const NS = 'mhf:';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const store = {
  get(k, d) {
    try {
      const v = localStorage.getItem(NS + k);
      return v == null ? d : JSON.parse(v);
    } catch {
      return d;
    }
  },
  set(k, v) {
    try {
      localStorage.setItem(NS + k, JSON.stringify(v));
      return true;
    } catch {
      return false;
    }
  },
  del(k) {
    try {
      localStorage.removeItem(NS + k);
    } catch {
      /* storage blocked */
    }
  },
  keys() {
    const out = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith(NS)) out.push(k.slice(NS.length));
      }
    } catch {
      /* storage blocked */
    }
    return out;
  },
  bytes() {
    let n = 0;
    for (const k of this.keys()) n += k.length + (localStorage.getItem(NS + k) || '').length;
    return n * 2;
  },
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const initials = n => String(n || '?').replace(/[^\p{L}\p{N}\s]/gu, ' ').trim().split(/\s+/).map(w => w[0] || '').slice(0, 2).join('').toUpperCase() || '?';
const uid = (p = '') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const now = () => Date.now();
const later = fn => setTimeout(fn, 0);

function debounce(fn, ms = 180) {
  let h = 0;
  return (...a) => {
    clearTimeout(h);
    h = setTimeout(() => fn(...a), ms);
  };
}

// Deterministic PRNG (mulberry32) so seeded journeys look the same on every machine.
function rng(seed) {
  return () => {
    seed |= 0;
    seed = (seed + 0x6d2b79f5) | 0;
    let x = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- dates and durations ----------
const MIN = 60000;
const HOUR = 36e5;
const DAY = 864e5;
const pad2 = n => String(n).padStart(2, '0');
const locale = () => (lang === 'ur' ? 'ur-PK-u-nu-latn' : 'en-PK');
const fmtDate = (ts, opts = { day: 'numeric', month: 'short', year: 'numeric' }) => new Date(ts).toLocaleDateString(locale(), opts);
// Urdu uses a 24-hour clock so no Latin AM/PM is reordered inside right-to-left text.
const fmtTime = ts => new Date(ts).toLocaleTimeString(locale(), { hour: 'numeric', minute: '2-digit', hourCycle: lang === 'ur' ? 'h23' : 'h12' });
const fmtDT = ts => `${fmtDate(ts)} · ${fmtTime(ts)}`;
const fmtLong = ts => fmtDate(ts, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const isoLocal = ts => {
  const d = new Date(ts);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
};
const hhmm = ts => {
  const d = new Date(ts);
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
};

function ago(ts) {
  const s = Math.round((now() - ts) / 1000);
  if (s < 60) return t('justNow');
  if (s < 3600) return t('minAgo', { n: Math.round(s / 60) });
  if (s < 86400) return t('hrAgo', { n: Math.round(s / 3600) });
  return t('daysAgo', { n: Math.round(s / 86400) });
}

// "1 h 05 min" / "4 min" / "45 s" for countdowns and journey durations.
function dur(ms) {
  const neg = ms < 0;
  const a = Math.abs(ms);
  const h = Math.floor(a / HOUR);
  const m = Math.floor((a % HOUR) / MIN);
  const s = Math.floor((a % MIN) / 1000);
  let out;
  if (h) out = t('durHM', { h, m: pad2(m) });
  else if (m) out = t('durM', { m });
  else out = t('durS', { s });
  return neg ? '−' + out : out;
}
const clock = ms => {
  const a = Math.max(0, Math.floor(ms / 1000));
  return `${pad2(Math.floor(a / 60))}:${pad2(a % 60)}`;
};

// ---------- geo maths ----------
const toRad = d => (d * Math.PI) / 180;

/** Great-circle distance in metres (haversine, mean Earth radius 6,371 km). */
function haversine(a, b) {
  const R = 6371000;
  const dLat = toRad(b.lat - a.lat);
  const dLng = toRad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}
const fmtDist = m => (m < 1000 ? t('distM', { n: Math.round(m) }) : t('distKm', { n: (m / 1000).toFixed(m < 10000 ? 1 : 0) }));
const fmtCoord = p => `${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`;

// ---------- phone numbers (Pakistani mobiles and international) ----------
const PHONE_RE = /^(03\d{2}-?\d{7}|\+\d{8,15})$/;
const cleanPhone = p => String(p || '').replace(/[\s()]/g, '');
const phoneOk = p => PHONE_RE.test(cleanPhone(p));

/** 0300-1234567 → 923001234567 (digits only, as wa.me expects). */
function phoneIntl(p) {
  const d = cleanPhone(p).replace(/[^\d+]/g, '');
  if (d.startsWith('+')) return d.slice(1);
  if (d.startsWith('0')) return '92' + d.slice(1);
  return d;
}
const phoneDial = p => cleanPhone(p).replace(/-/g, '');

// ---------- feedback: toast, aria-live, motion ----------
function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.setAttribute('role', 'status');
  el.innerHTML = ic(type === 'ok' ? 'check-circle' : type === 'bad' ? 'alert-circle' : 'info') + '<span></span>';
  el.lastChild.textContent = msg;
  $('#toasts').append(el);
  setTimeout(() => el.classList.add('out'), 2800);
  setTimeout(() => el.remove(), 3150);
}

const announce = msg => {
  $('#live').textContent = '';
  setTimeout(() => ($('#live').textContent = msg), 30);
};
const calm = () => document.documentElement.classList.contains('calm') || matchMedia('(prefers-reduced-motion: reduce)').matches;

function animateIn(root) {
  if (!root) return;
  root.classList.remove('enter');
  void root.offsetWidth;
  root.classList.add('enter');
  $$('.stagger', root).forEach(g => [...g.children].forEach((el, i) => el.style.setProperty('--i', Math.min(i, 14))));
  requestAnimationFrame(() => $$('.bar > i[data-w]', root).forEach(b => (b.style.width = b.dataset.w + '%')));
  $$('[data-count]', root).forEach(el => countUp(el, Number(el.dataset.count)));
  $$('path[data-draw], polyline[data-draw]', root).forEach(drawPath);
  $$('circle[data-ring]', root).forEach(fillRing);
}

// Same-route re-renders skip the entrance animation but still need rings, bars and numbers in place.
function settle(root) {
  if (!root) return;
  $$('.bar > i[data-w]', root).forEach(b => (b.style.width = b.dataset.w + '%'));
  $$('circle[data-ring]', root).forEach(c => {
    const L = 2 * Math.PI * Number(c.getAttribute('r'));
    c.style.transition = 'none';
    c.style.strokeDasharray = L;
    c.style.strokeDashoffset = L * (1 - Number(c.dataset.ring));
  });
}

function countUp(el, to, { dur: ms = 700, fmt = v => Math.round(v).toLocaleString('en-PK') } = {}) {
  if (calm()) {
    el.textContent = fmt(to);
    return;
  }
  const t0 = performance.now();
  const step = nowTs => {
    const p = Math.min(1, (nowTs - t0) / ms);
    el.textContent = fmt(to * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function drawPath(p) {
  const L = p.getTotalLength();
  p.style.strokeDasharray = L;
  p.style.strokeDashoffset = L;
  p.getBoundingClientRect();
  p.style.transition = 'stroke-dashoffset .9s var(--ease)';
  p.style.strokeDashoffset = 0;
}

// A progress ring: circle with r and data-ring="0..1" animates its dash from empty.
function fillRing(c) {
  const L = 2 * Math.PI * Number(c.getAttribute('r'));
  c.style.strokeDasharray = L;
  c.style.strokeDashoffset = L;
  c.getBoundingClientRect();
  c.style.strokeDashoffset = L * (1 - Number(c.dataset.ring));
}

function ringSvg(frac, { size = 112, r = 46, cls = '' } = {}) {
  return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true" class="${cls}"><circle class="track" cx="${size / 2}" cy="${size / 2}" r="${r}"/><circle class="val" cx="${size / 2}" cy="${size / 2}" r="${r}" data-ring="${clamp(frac, 0, 1)}"/></svg>`;
}

// ---------- modal / bottom sheet ----------
let modalReturn = null;
let modalOnClose = null;

function sheetHead(title, icon = 'info') {
  return `<div class="shead"><h3 id="sheetTitle">${ic(icon)}<span>${title}</span></h3><button class="ibtn" type="button" data-close aria-label="${t('close')}">${ic('x')}</button></div>`;
}

function openModal(html, { wide = false, onClose = null } = {}) {
  if (!$('#modal').classList.contains('on')) modalReturn = document.activeElement;
  const sh = $('#sheet');
  sh.className = 'sheet' + (wide ? ' wide' : '');
  sh.innerHTML = '<div class="grab"></div>' + html;
  sh.scrollTop = 0;
  $('#scrim').classList.add('on');
  $('#modal').classList.add('on');
  modalOnClose = onClose;
  $$('[data-close]', sh).forEach(b => (b.onclick = closeModal));
  // Focus the first field, otherwise the neutral close button (never a destructive action).
  const first = sh.querySelector('[autofocus], input:not([type=hidden]):not([type=checkbox]):not([type=file]):not([readonly]), select, textarea');
  setTimeout(() => (first || sh.querySelector('.shead [data-close]') || sh).focus({ preventScroll: true }), 80);
  return sh;
}

function closeModal() {
  if (!$('#modal').classList.contains('on')) return;
  $('#modal').classList.remove('on');
  $('#scrim').classList.remove('on');
  const cb = modalOnClose;
  modalOnClose = null;
  if (cb) cb();
  if (modalReturn && document.contains(modalReturn)) modalReturn.focus({ preventScroll: true });
}
const modalOpen = () => $('#modal').classList.contains('on');

function askConfirm(msg, { okText = t('confirm'), danger = false, icon = 'help', typed = '' } = {}) {
  return new Promise(resolve => {
    let answered = false;
    const finish = v => {
      if (answered) return;
      answered = true;
      resolve(v);
    };
    const typedHtml = typed ? `<label class="field mt"><span>${t('typeToConfirm', { w: typed })}</span><input id="cfTyped" autocomplete="off" class="ltr"></label>` : '';
    const sh = openModal(`${sheetHead(t('areYouSure'), icon)}<p>${msg}</p>${typedHtml}
      <div class="sfoot"><button class="btn ghost" type="button" data-close>${t('cancel')}</button>
      <button class="btn ${danger ? 'berry' : ''}" type="button" id="cfOk">${okText}</button></div>`, { onClose: () => finish(false) });
    $('#cfOk', sh).onclick = () => {
      if (typed && $('#cfTyped', sh).value.trim().toUpperCase() !== typed) {
        $('#cfTyped', sh).closest('.field').classList.add('bad');
        return;
      }
      finish(true);
      closeModal();
    };
  });
}

// ---------- print, download, files, clipboard ----------
function printDoc(html, size = 'a4') {
  const rule = size === 'card' ? '@page { size: A4; margin: 10mm; }' : '@page { size: A4; margin: 14mm; }';
  $('#pageRule').textContent = '@media print { ' + rule + ' }';
  $('#printArea').innerHTML = html;
  window.print();
}

function downloadFile(name, text, mime = 'application/json') {
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function pickFile(accept, cb, { multiple = false, asText = true } = {}) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = accept;
  inp.multiple = multiple;
  inp.onchange = () => {
    const files = [...inp.files];
    if (!files.length) return;
    if (asText) files[0].text().then(cb);
    else cb(files);
  };
  inp.click();
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast(t('copied'), 'ok');
  } catch {
    toast(t('copyFailed'), 'bad');
  }
}

/** Resize an image file to a JPEG data URL no larger than maxSide pixels (evidence photos). */
function resizeImage(file, maxSide = 1024, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('image'));
    };
    img.src = url;
  });
}

const vibrate = pattern => {
  try {
    if (navigator.vibrate && S.settings.vibrate) navigator.vibrate(pattern);
  } catch {
    /* not supported */
  }
};

function loadState() {
  const meta = store.get('meta', null);

  for (const k of KEYS) st[k] = store.get(k, null);
  st.settings = { ...DEFAULT_SETTINGS, ...(st.settings || {}) };

function persist(...keys) {

}

const dayAt = (daysBack, h, m = 0) => {
  const d = new Date();
  d.setDate(d.getDate() - daysBack);
  d.setHours(h, m, 0, 0);
  return d.getTime();
};

/** A gently curved, slightly noisy path between two points: stands in for real GPS fixes in demo mode. */
function simRoute(a, b, n, seed) {
  const r = rng(seed);
  const bend = (r() - 0.5) * 0.35;
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const f = i / n;
    const off = Math.sin(Math.PI * f) * bend;
    const edge = i === 0 || i === n ? 0 : 1;
    pts.push({
      lat: a.lat + (b.lat - a.lat) * f - (b.lng - a.lng) * off + edge * (r() - 0.5) * 0.00025,
      lng: a.lng + (b.lng - a.lng) * f + (b.lat - a.lat) * off + edge * (r() - 0.5) * 0.00025,
    });
  }
  return pts;
}

function seedJourney(id, from, to, opts) {
  const { day, h, m, mins, late, status, seed } = opts;
  const startedAt = dayAt(day, h, m);
  const etaAt = startedAt + mins * MIN;
  const endedAt = status === 'cancelled' ? startedAt + 3 * MIN : etaAt + late * MIN;
  const n = status === 'cancelled' ? 3 : 18;
  const r = rng(seed + 7);
  const path = simRoute(PLACES[from], PLACES[to], n, seed);
  const crumbs = path.map((p, i) => ({ t: Math.round(startedAt + ((endedAt - startedAt) * i) / n), lat: p.lat, lng: p.lng, acc: 6 + Math.round(r() * 18), sim: true }));
  const events = [{ t: startedAt, k: 'ev_started' }];
  if (status === 'late' || status === 'escalated') events.push({ t: etaAt, k: 'ev_stage1' });
  if (status === 'escalated') {
    events.push({ t: etaAt + 10 * MIN, k: 'ev_stage2' });
    events.push({ t: etaAt + 20 * MIN, k: 'ev_stage3' });
  }
  events.push({ t: endedAt, k: status === 'cancelled' ? 'ev_cancelled' : 'ev_arrived' });
  return {
    id, demo: true, from: PLACES[from].en, fromUr: PLACES[from].ur, dest: PLACES[to].en, destUr: PLACES[to].ur,
    startedAt, etaAt, endedAt, status, stage: status === 'escalated' ? 3 : status === 'late' ? 1 : 0,
    sim: true, speed: 1, crumbs, events, shared: opts.shared || [], extended: 0, lastCheckin: startedAt,
    mode: opts.mode, vehicle: opts.vehicle || '', driver: opts.driver || '', driverPhone: '', app: opts.app || '', ref: opts.ref || '',
  };
}

// ---------- crypto: PIN → PBKDF2-SHA-256 → AES-GCM-256 (WebCrypto only, no library) ----------
const enc = new TextEncoder();
const dec = new TextDecoder();
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
const KDF_ITER = 310000;
const VERIFIER = { v: 'mahfooz-journal-1' };

function b64(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
const unb64 = text => Uint8Array.from(atob(text), c => c.charCodeAt(0));
const hex = bytes => [...bytes].map(b => b.toString(16).padStart(2, '0')).join('');

/** PIN or passcode → non-extractable AES-GCM key. A random 16-byte salt makes every journal's key unique. */
async function deriveKey(pin, salt, iterations = KDF_ITER) {
  const material = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
  const params = { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' };
  return crypto.subtle.deriveKey(params, material, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}

async function encryptJSON(key, value) {
  const iv = rnd(12);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(value))));
  return { iv: b64(iv), ct: b64(ct) };
}

async function decryptJSON(key, box) {
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(box.iv) }, key, unb64(box.ct));
  return JSON.parse(dec.decode(plain));
}

// ---------- journal session: the key and the decrypted entries live only in memory ----------
const J = { key: null, data: null, lastActive: 0, ready: false };
const journalRec = () => store.get('vault', null);
const journalUnlocked = () => !!J.key;
const journalIsDemo = () => !!(journalRec() || {}).demo;
const journalOwn = () => !!journalRec() && !journalIsDemo();

async function createJournal(pin, data, { demo = false } = {}) {
  const salt = rnd(16);
  const key = await deriveKey(pin, salt);
  const rec = {
    format: 'mahfooz-journal', version: 1, kdf: 'PBKDF2-SHA-256', iterations: KDF_ITER, salt: b64(salt), cipher: 'AES-GCM-256',
    verifier: await encryptJSON(key, VERIFIER), data: await encryptJSON(key, data), createdAt: now(), savedAt: now(), demo,
  };
  if (!store.set('vault', rec)) throw new Error('storage');
  return key;
}

// ---------- wrong-PIN guard: 5 free tries, then a doubling wait ----------
const guard = () => store.get('pinGuard', { fails: 0, lockUntil: 0, last: 0 });

function guardWait() {
  const g = guard();
  return Math.max(0, g.lockUntil - now());
}

function guardFail() {
  const g = guard();
  g.fails += 1;
  g.last = now();
  if (g.fails >= 5) g.lockUntil = now() + 30000 * 2 ** (g.fails - 5);
  store.set('pinGuard', g);
  return g;
}

async function unlockJournal(pin) {
  // TODO(student): unlockJournalWithPasskey() — add WebAuthn (passkey) unlock: use the PRF extension to derive a
  // wrapping key, store the AES key wrapped with it next to this record, and keep the PIN as a fallback.
  const rec = journalRec();
  if (!rec) throw new Error('missing');
  if (guardWait() > 0) throw new Error('wait');
  const key = await deriveKey(pin, unb64(rec.salt), rec.iterations);
  try {
    const v = await decryptJSON(key, rec.verifier);
    if (v.v !== VERIFIER.v) throw new Error('verifier');
  } catch {
    guardFail();
    throw new Error('wrong');
  }
  const g = guard();
  if (g.fails) notify('nt_failedPins', { n: g.fails }, { kind: 'journal', route: 'journal', level: 'warn' });
  store.set('pinGuard', { fails: 0, lockUntil: 0, last: 0 });
  J.key = key;
  J.data = await decryptJSON(key, rec.data);
  J.data.entries = J.data.entries || [];
  J.lastActive = now();
  logEvent('lg_journalUnlocked', {}, 'journal');
}

/** Re-encrypt the whole journal with a fresh random IV. */
async function saveJournal() {
  if (!J.key) return false;
  const rec = journalRec();
  rec.data = await encryptJSON(J.key, J.data);
  rec.savedAt = now();
  const ok = store.set('vault', rec);
  if (!ok) toast(t('err_storage'), 'bad');
  return ok;
}

function lockJournal(silent = false) {
  if (!J.key) return;
  J.key = null;
  J.data = null;
  if (!silent) logEvent('lg_journalLocked', {}, 'journal');
  if (curRoute === 'journal') rerender();
}

async function changePin(oldPin, newPin) {
  const rec = journalRec();
  const oldKey = await deriveKey(oldPin, unb64(rec.salt), rec.iterations);
  try {
    await decryptJSON(oldKey, rec.verifier);
  } catch {
    guardFail();
    throw new Error('wrong');
  }
  const data = await decryptJSON(oldKey, rec.data);
  J.key = await createJournal(newPin, data, { demo: false });
  J.data = data;
  logEvent('lg_pinChanged', {}, 'journal');
}

// ---------- disguise PIN: only a salted PBKDF2 hash is stored ----------
async function pinHash(pin, saltB64) {
  const material = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: unb64(saltB64), iterations: 100000, hash: 'SHA-256' }, material, 256);
  return hex(new Uint8Array(bits));
}

async function setDisguisePin(pin) {
  const salt = b64(rnd(16));
  S.settings.disguisePin = { salt, hash: await pinHash(pin, salt) };
  persist('settings');
}

async function checkDisguisePin(pin) {
  const d = S.settings.disguisePin;
  if (!d) return false;
  return (await pinHash(pin, d.salt)) === d.hash;
}

// ---------- WebAudio: siren, fake-call ringtones, reminder chimes (all synthesised, no files) ----------
let AC = null;

function audioCtx() {
  if (!AC) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    AC = new Ctx();
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}

/** A wailing siren: a sawtooth whose pitch is swept by a slow triangle LFO, through a compressor. */
const siren = {
  nodes: null,
  on: false,
  start() {
    const ac = audioCtx();
    if (!ac || this.on) return;
    const osc = ac.createOscillator();
    const osc2 = ac.createOscillator();
    const lfo = ac.createOscillator();
    const depth = ac.createGain();
    const gain = ac.createGain();
    const comp = ac.createDynamicsCompressor();
    osc.type = 'sawtooth';
    osc2.type = 'square';
    osc.frequency.value = 1000;
    osc2.frequency.value = 1003;
    lfo.type = 'triangle';
    lfo.frequency.value = 0.55;
    depth.gain.value = 420;
    lfo.connect(depth);
    depth.connect(osc.frequency);
    depth.connect(osc2.frequency);
    gain.gain.setValueAtTime(0, ac.currentTime);
    gain.gain.linearRampToValueAtTime(0.5, ac.currentTime + 0.15);
    osc.connect(gain);
    osc2.connect(gain);
    gain.connect(comp);
    comp.connect(ac.destination);
    [osc, osc2, lfo].forEach(o => o.start());
    this.nodes = { osc, osc2, lfo, gain };
    this.on = true;
  },
  stop() {
    if (!this.nodes) return;
    const { osc, osc2, lfo, gain } = this.nodes;
    const ac = audioCtx();
    gain.gain.linearRampToValueAtTime(0, ac.currentTime + 0.08);
    [osc, osc2, lfo].forEach(o => o.stop(ac.currentTime + 0.1));
    this.nodes = null;
    this.on = false;
  },
};

// One short tone with an exponential decay (used for ringtones, chimes and countdown ticks).
function tone(freq, start, length, { type = 'sine', vol = 0.25 } = {}) {
  const ac = audioCtx();
  if (!ac) return;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(vol, start + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, start + length);
  o.connect(g);
  g.connect(ac.destination);
  o.start(start);
  o.stop(start + length + 0.05);
}

const RINGTONES = {
  // Telephone-style ring: two close frequencies trilling for 2 s, then a pause.
  classic: ac => {
    const t0 = ac.currentTime + 0.02;
    for (let i = 0; i < 20; i++) {
      tone(440, t0 + i * 0.1, 0.09, { type: 'sine', vol: 0.18 });
      tone(480, t0 + i * 0.1, 0.09, { type: 'sine', vol: 0.18 });
    }
  },
  // A short marimba-like phrase.
  marimba: ac => {
    const t0 = ac.currentTime + 0.02;
    [659, 784, 988, 784, 659, 523, 659, 784].forEach((f, i) => tone(f, t0 + i * 0.16, 0.35, { vol: 0.3 }));
  },
  // Soft rising chime.
  soft: ac => {
    const t0 = ac.currentTime + 0.02;
    [523, 659, 784, 1047].forEach((f, i) => tone(f, t0 + i * 0.22, 0.6, { vol: 0.2 }));
  },
};

const ringer = {
  timer: 0,
  start(style = 'classic') {
    const ac = audioCtx();
    this.stop();
    const play = () => {
      if (ac) (RINGTONES[style] || RINGTONES.classic)(ac);
      vibrate([600, 300, 600]);
    };
    play();
    this.timer = setInterval(play, 3200);
  },
  stop() {
    clearInterval(this.timer);
    this.timer = 0;
    vibrate(0);
  },
};

/** Reminder chime; level 1-3 plays more and higher notes for overdue journeys. */
function chime(level = 1) {
  const ac = audioCtx();
  if (!ac) return;
  const t0 = ac.currentTime + 0.02;
  const notes = level >= 3 ? [880, 1175, 880, 1175, 880] : level === 2 ? [784, 988, 784] : [659, 880];
  notes.forEach((f, i) => tone(f, t0 + i * 0.22, 0.4, { vol: 0.3 }));
  vibrate(level >= 2 ? [300, 150, 300, 150, 300] : [200]);
}

const tick = () => {
  const ac = audioCtx();
  if (ac) tone(880, ac.currentTime + 0.01, 0.12, { type: 'square', vol: 0.08 });
};

// ---------- screen strobe: alternates white and coral; slower when reduced motion is on ----------

    $('#strobeLbl').textContent = t('tapToStopStrobe');

    this.timer = setInterval(() => el.classList.toggle('flash'), period);
    this.on = true;

// ---------- location: geolocation only on explicit actions; simulation for demos ----------
const GEO = { last: null, perm: 'unknown' };

/** Ask the Permissions API for the current state without ever showing a prompt. */
async function refreshGeoPermission() {
  try {
    const st = await navigator.permissions.query({ name: 'geolocation' });
    GEO.perm = st.state;
    st.onchange = () => (GEO.perm = st.state);
  } catch {
    GEO.perm = 'unknown';
  }
  return GEO.perm;
}

// A plausible position near the demo home that drifts slowly, used when simulation mode is on.
function simPosition() {
  const k = now() / 60000;
  return {
    lat: PLACES.home.lat + Math.sin(k / 3) * 0.0012,
    lng: PLACES.home.lng + Math.cos(k / 4) * 0.0012,
    acc: 12,
    t: now(),
    sim: true,
  };
}

/**
 * One position fix. Resolves to {lat, lng, acc, t, sim} or {error}. Never throws.
 * The browser shows its own permission prompt the first time; Mahfooz never calls this on page load.
 */
function getPosition({ timeout = 12000 } = {}) {
  if (S.settings.simLocation) {
    GEO.last = simPosition();
    return Promise.resolve(GEO.last);
  }
  if (!S.settings.useLocation) return Promise.resolve({ error: 'off' });
  if (!navigator.geolocation) return Promise.resolve({ error: 'unsupported' });
  return new Promise(resolve => {
    navigator.geolocation.getCurrentPosition(
      p => {
        GEO.last = { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy), t: p.timestamp || now(), sim: false };
        GEO.perm = 'granted';
        resolve(GEO.last);
      },
      err => resolve({ error: err.code === 1 ? 'denied' : err.code === 3 ? 'timeout' : 'unavailable' }),
      { enableHighAccuracy: true, timeout, maximumAge: 30000 },
    );
  });
}

/** Foreground-only position watch (stops when the page is closed or the phone sleeps). */
function watchPosition(cb) {
  if (S.settings.simLocation || !S.settings.useLocation || !navigator.geolocation) return null;
  // TODO(student): startBackgroundTracking() — a web page cannot track location in the background. Wrap Mahfooz in
  // Capacitor or a native Android app with a foreground service, or have the phone post fixes to a server.
  return navigator.geolocation.watchPosition(
    p => {
      GEO.last = { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy), t: p.timestamp || now(), sim: false };
      cb(GEO.last);
    },
    () => {},
    { enableHighAccuracy: true, maximumAge: 15000, timeout: 30000 },
  );
}
const clearWatch = id => id != null && navigator.geolocation && navigator.geolocation.clearWatch(id);

const geoErrorText = e => t('geo_' + (e || 'unavailable'));

function mapLink(p) {
  if (!p || p.error) return '';
  const lat = p.lat.toFixed(6);
  const lng = p.lng.toFixed(6);
  if (S.settings.mapProvider === 'osm') return `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=17/${lat}/${lng}`;
  return `https://maps.google.com/?q=${lat},${lng}`;
}

// Keep the screen awake during SOS and journeys so the page keeps running (where supported).
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen');
    if (!on && wakeLock) {
      await wakeLock.release();
      wakeLock = null;
    }
  } catch {
    wakeLock = null;
  }
}

function smsHref(phones, body) {
  const nums = phones.map(phoneDial).join(',');
  if (isIOS) return `sms:/open?addresses=${nums}&body=${encodeURIComponent(body)}`;
  return `sms:${nums}?body=${encodeURIComponent(body)}`;
}
