<!doctype html>
<html lang="en" data-accent="cyan">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Vault — Privacy-First Password Manager</title>
<meta name="description" content="Zero-knowledge, offline, single-file password manager: PBKDF2 + AES-GCM vault, TOTP codes, explainable strength analyzer, generator, health dashboard and k-anonymity breach check UI. FYP template.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens: security console ---------- */
:root{
  --bg:#0b0f14; --panel:#121922; --panel-2:#182230; --field:#0e141b; --line:#1f2a38; --line-2:#2a3749;
  --ink:#e6edf3; --muted:#8b98a8; --dim:#5b687a;
  --accent:#22d3ee; --accent-ink:#06202a; --accent-soft:rgba(34,211,238,.12);
  --ok:#34d399; --ok-soft:rgba(52,211,153,.14); --danger:#fb7185; --danger-soft:rgba(251,113,133,.14); --warn:#fbbf24; --warn-soft:rgba(251,191,36,.14);
  --surface:var(--panel); --surface-2:var(--panel-2);
  --radius:12px; --font:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --dur:.35s;
}
:root[data-accent=green]{--accent:#34d399;--accent-ink:#052e1f;--accent-soft:rgba(52,211,153,.14)}
:root[data-accent=violet]{--accent:#a78bfa;--accent-ink:#1e1340;--accent-soft:rgba(167,139,250,.16)}
:root[data-accent=amber]{--accent:#fbbf24;--accent-ink:#2b1d02;--accent-soft:rgba(251,191,36,.16)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes toastIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(6px)}}
@keyframes lockOut{to{opacity:0;transform:translateY(-10px) scale(.97)}}
.enter{animation:fadeUp var(--dur) var(--ease) both}
.stagger>*{animation:fadeUp .45s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.btn{transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s,border-color .15s}
.btn:hover{transform:translateY(-1px)} .btn:active{transform:translateY(0) scale(.98)}
.card,.tile{transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s}
.card:hover{transform:translateY(-2px);border-color:var(--line-2)}
.fill,.bar>i{transition:width .6s var(--ease)}
.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(1100px 520px at 85% -10%,var(--accent-soft),transparent 60%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.01em}
p{margin:0 0 8px}
code,.mono{font-family:var(--mono);font-size:.93em}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:.82rem} .hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.ic.big{width:44px;height:44px;stroke-width:1.5}
.ok{color:var(--ok)} .bad{color:var(--danger)} .warnc{color:var(--warn)} .acc{color:var(--accent)}

/* ---------- Buttons & inputs ---------- */
.btn{border:1px solid transparent;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;background:var(--panel-2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:var(--line-2)}
.btn.danger{background:var(--danger-soft);color:var(--danger);border-color:rgba(251,113,133,.3)}
.btn.sm{padding:6px 10px;font-size:.84rem;min-height:36px;border-radius:8px}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);display:inline-grid;place-items:center;cursor:pointer;flex:none;transition:color .15s,border-color .15s,background .15s,transform .15s}
.iconbtn:hover{color:var(--ink);border-color:var(--line-2)} .iconbtn:active{transform:scale(.94)}
.iconbtn.on{color:var(--warn);border-color:rgba(251,191,36,.45);background:var(--warn-soft)}
.iconbtn.danger:hover{color:var(--danger);border-color:rgba(251,113,133,.45)}
.iconbtn.copied{color:var(--ok);border-color:rgba(52,211,153,.5);background:var(--ok-soft)}
.iconbtn.sm{width:32px;height:32px;border-radius:8px}
input[type=text],input[type=password],input[type=search],input[type=number],input[type=url],input[type=email],select,textarea{width:100%;background:var(--field);border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;outline:0;color:var(--ink);min-height:42px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input::placeholder,textarea::placeholder{color:var(--dim)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{min-height:88px;resize:vertical}
label.f{display:block;font-size:.76rem;font-weight:700;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.07em}
label.f:first-child{margin-top:0}
.pwwrap{position:relative} .pwwrap input{padding-right:84px;font-family:var(--mono)} .pwwrap.one input{padding-right:48px}
.pwwrap .tools{position:absolute;right:5px;top:50%;transform:translateY(-50%);display:flex;gap:4px}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer;min-height:40px;font-weight:500}
.chk input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.range{width:100%;accent-color:var(--accent);min-height:40px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--field)}
.seg button{border:0;background:none;padding:8px 14px;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--muted);min-height:40px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.swatches{display:flex;gap:8px;flex-wrap:wrap} .sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;background:var(--c)} .sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--c)}
.note{border-radius:10px;padding:10px 12px;font-size:.88rem;display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line-2);background:var(--panel-2)}
.note.ok{border-color:rgba(52,211,153,.35);background:var(--ok-soft)} .note.warn{border-color:rgba(251,191,36,.35);background:var(--warn-soft)} .note.bad{border-color:rgba(251,113,133,.35);background:var(--danger-soft)}
.note .ic{margin-top:3px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.86rem} .kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}

/* ---------- Cards / chips / meter ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;min-width:0}
.card h3{font-size:1rem;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card p.lead{color:var(--muted);margin:-4px 0 12px;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--panel-2);border-radius:999px;padding:4px 11px;font-size:.8rem;font-weight:600;color:var(--muted);text-decoration:none;cursor:pointer;min-height:32px}
.chip.on,.chip:hover{color:var(--accent);border-color:var(--accent)}
.chip.bad{color:var(--danger);border-color:rgba(251,113,133,.4)} .chip.warn{color:var(--warn);border-color:rgba(251,191,36,.4)}
.meter{display:flex;gap:4px;margin-top:8px} .meter i{flex:1;height:6px;border-radius:3px;background:var(--line-2);transition:background .35s var(--ease)}
.meter[data-s="0"] i:nth-child(1),.meter[data-s="1"] i:nth-child(-n+2){background:var(--danger)}
.meter[data-s="2"] i:nth-child(-n+3){background:var(--warn)}
.meter[data-s="3"] i:nth-child(-n+4){background:var(--accent)}
.meter[data-s="4"] i{background:var(--ok)}
.verdict{font-weight:700} .v0,.v1{color:var(--danger)} .v2{color:var(--warn)} .v3{color:var(--accent)} .v4{color:var(--ok)}
.sline{display:flex;justify-content:space-between;gap:10px;font-size:.84rem;margin-top:6px;color:var(--muted);flex-wrap:wrap}
.reasons{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:5px;font-size:.86rem}
.reasons li{display:flex;gap:8px;align-items:flex-start} .reasons li .ic{margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:2px 7px;font-size:.72rem;font-weight:700;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.pill.bad{background:var(--danger-soft);color:var(--danger)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.acc{background:var(--accent-soft);color:var(--accent)}

/* ---------- Lock screen ---------- */
#lock{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
#lock.out{animation:lockOut .3s var(--ease) both;pointer-events:none}
.lockcard{width:min(480px,100%);background:var(--panel);border:1px solid var(--line-2);border-radius:20px;padding:28px;box-shadow:0 40px 90px -50px var(--accent)}
.lock-brand{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.lock-brand h1{font-size:1.5rem;font-weight:800}
.logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--accent),#0e7490);display:grid;place-items:center;color:#fff;flex:none}
.logo svg{width:30px;height:30px}
.lock-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
details.protect{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
details.protect summary{cursor:pointer;font-weight:600;color:var(--muted);display:flex;gap:8px;align-items:center;min-height:36px;list-style:none}
details.protect summary::-webkit-details-marker{display:none}
details.protect[open] summary{color:var(--ink)}
.cryptoflow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:6px;align-items:center;margin:12px 0;font-size:.78rem;text-align:center}
.cryptoflow .step{background:var(--field);border:1px solid var(--line-2);border-radius:10px;padding:8px 6px}
.cryptoflow .step b{display:block;font-size:.8rem;color:var(--accent)}
.cryptoflow .ic{color:var(--dim)}
.mobilebar{display:none}

/* ---------- App shell ---------- */
#app{display:none;height:100vh;grid-template-columns:240px 360px minmax(0,1fr)}
#app.on{display:grid}
.rail{background:#0d131a;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;overflow:auto;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 14px}
.brand .logo{width:38px;height:38px;border-radius:11px} .brand .logo svg{width:22px;height:22px}
.brand b{display:block;font-size:1.05rem} .brand small{display:block;font-size:.72rem;color:var(--muted)}
.rail nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;min-height:40px}
.rail nav a:hover{background:var(--panel-2);color:var(--ink)}
.rail nav a.active{background:var(--accent-soft);color:var(--accent)}
.rail nav a .n{margin-left:auto;font-size:.74rem;color:var(--dim);font-family:var(--mono)}
.rail nav a .tdot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent));flex:none;margin:0 3px}
.rail h4{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin:14px 10px 6px}
.rail-foot{margin-top:auto;padding-top:14px;display:grid;gap:8px}
.autolock{font-size:.76rem;color:var(--dim);display:flex;gap:6px;align-items:center;padding:0 4px}
.list-pane{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 8px}
.list-head h2{font-size:1.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-tools{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:8px;padding:0 16px 10px}
.search{position:relative} .search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim)} .search input{padding-left:34px}
.rows{overflow:auto;flex:1;padding:0 8px 16px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:12px;padding:9px 10px;cursor:pointer;color:var(--ink);min-height:58px}
.row:hover{background:var(--panel)} .row.active{background:var(--panel);border-color:var(--line-2)}
.row .txt{min-width:0;flex:1} .row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .row .s{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .badges{display:flex;gap:6px;align-items:center;color:var(--dim)}
.avatar{width:38px;height:38px;border-radius:10px;background:var(--c,var(--accent));color:#06161c;display:grid;place-items:center;font-weight:800;flex:none}
.avatar.lg{width:54px;height:54px;font-size:1.35rem;border-radius:15px}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--line-2)} .sdot.s0,.sdot.s1{background:var(--danger)} .sdot.s2{background:var(--warn)} .sdot.s3{background:var(--accent)} .sdot.s4{background:var(--ok)}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}
.empty .ic.big{color:var(--dim);margin-bottom:10px}
.detail-pane{overflow:auto;padding:24px 28px;min-width:0}
.d-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.d-title{flex:1 1 220px;min-width:0} .d-title h2{font-size:1.4rem;overflow-wrap:break-word} .d-title a{text-decoration:none;font-size:.86rem}
.d-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.back{display:none}
.d-body{margin-top:18px;display:grid;gap:10px;max-width:780px}
.fld{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.fld .main{flex:1;min-width:0}
.fl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:700;display:flex;gap:6px;align-items:center}
.fv{margin-top:3px;overflow-wrap:anywhere;font-size:.98rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap} .fv.pre{white-space:pre-wrap;display:block}
.secret{letter-spacing:.06em}
.code{font-size:1.55rem;font-weight:700;letter-spacing:.14em;color:var(--accent)}
.ring{width:34px;height:34px;transform:rotate(-90deg);flex:none} .ring circle{fill:none;stroke-width:3} .ring .bg{stroke:var(--line-2)} .ring .fg{stroke:var(--accent);stroke-dasharray:94.25;transition:stroke-dashoffset 1s linear} .ring.warn .fg{stroke:var(--warn)}
.hist{display:grid;gap:6px} .hist .hrow{display:flex;align-items:center;gap:10px;font-size:.88rem;border-top:1px solid var(--line);padding-top:6px} .hist .hrow:first-child{border-top:0;padding-top:0}
.content-pane{overflow:auto;padding:24px 28px;grid-column:2/4;min-width:0}
body:not([data-page=vault]) .list-pane,body:not([data-page=vault]) .detail-pane{display:none!important} body[data-page=vault] .content-pane{display:none}
.page{max-width:1060px;display:grid;gap:16px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap} .page-head h2{font-size:1.5rem} .page-head p{margin:4px 0 0;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;gap:12px;align-items:center}
.kpi .kic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--panel-2);flex:none}
.kpi .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700} .kpi .v{font-size:1.5rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.health-top{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:stretch}
.scorecard{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.scorering{width:150px;height:150px;position:relative} .scorering svg{transform:rotate(-90deg);width:100%;height:100%} .scorering circle{fill:none;stroke-width:9} .scorering .bg{stroke:var(--panel-2)} .scorering .fg{transition:stroke-dashoffset 1s var(--ease)}
.scorering .num{position:absolute;inset:0;display:grid;place-items:center;font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums}
.hbar{display:grid;grid-template-columns:92px 1fr 30px;align-items:center;gap:10px;font-size:.84rem;margin:7px 0}
.hbar .bar{height:10px;background:var(--panel-2);border-radius:5px;overflow:hidden} .hbar .bar>i{display:block;height:100%;border-radius:5px;background:var(--c);width:0}
.hbar .n{text-align:right;font-family:var(--mono);color:var(--muted)}
.fixrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap} .fixrow:first-child{border-top:0}
.fixrow .txt{flex:1;min-width:140px}
.hashbox{font-family:var(--mono);font-size:.86rem;overflow-wrap:anywhere;background:var(--field);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;line-height:1.7}
.hashbox .pre{background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:0 4px;font-weight:700}
.genout{font-family:var(--mono);font-size:1.25rem;font-weight:500;background:var(--field);border:1px solid var(--line-2);border-radius:12px;padding:14px 16px;overflow-wrap:anywhere;min-height:56px;line-height:1.5}
.genout .d{color:var(--accent)} .genout .s{color:var(--warn)}
.gen-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px}
.todo{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px} .todo h4{font-size:.95rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap} .todo .tag{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 6px} .todo code{font-size:.78rem;color:var(--muted)}
.list{display:grid;gap:10px}
.cf{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto auto;gap:6px;align-items:center;margin-bottom:6px}
.ed-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px} .span2{grid-column:1/-1}
.ed-grid label.f{margin-top:10px}

/* ---------- Modal / toasts ---------- */
.scrim{position:fixed;inset:0;background:rgba(3,6,10,.72);backdrop-filter:blur(3px);z-index:50;display:none;animation:fadeIn .2s}
.scrim.open{display:block}
.modal{position:fixed;inset:0;display:none;place-items:center;z-index:51;padding:16px;overflow:auto}
.modal.open{display:grid}
.modal .box{background:var(--panel);border:1px solid var(--line-2);border-radius:16px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px 22px;animation:pop .25s var(--ease);box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
.modal .box.wide{width:min(760px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px} .modal-head h2{font-size:1.2rem}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:70;max-width:min(380px,calc(100vw - 24px))}
.toast{background:#1b2634;border:1px solid var(--line-2);color:var(--ink);padding:10px 14px;border-radius:10px;font-weight:500;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.7);animation:toastIn .3s var(--ease);font-size:.9rem}
.toast.out{animation:toastOut .3s var(--ease) both}
.toast.ok{border-color:rgba(52,211,153,.45)} .toast.ok .ic{color:var(--ok)} .toast.bad{border-color:rgba(251,113,133,.5)} .toast.bad .ic{color:var(--danger)}

/* ---------- Responsive ---------- */
@media (max-width:1100px){#app{grid-template-columns:220px 320px minmax(0,1fr)} .health-top{grid-template-columns:1fr}}
@media (max-width:900px){
  .mobilebar{display:flex;position:sticky;top:0;z-index:40;align-items:center;gap:10px;padding:8px 12px;background:#0d131a;border-bottom:1px solid var(--line)}
  .mobilebar .mt{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #app.on{display:block;height:auto;min-height:100vh}
  .rail{position:fixed;top:0;bottom:0;left:0;width:min(300px,85vw);z-index:60;transform:translateX(-105%);transition:transform .3s var(--ease);box-shadow:0 0 60px rgba(0,0,0,.6)}

  .content-pane{padding:16px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}

}

<script>
'use strict';
/* =====================================================================
   Vault — privacy-first password manager (single file)
   Sections: utils · crypto · wordlists · strength analyzer · generator ·
             vault state & persistence · demo data · lock screen · rail/list/detail ·
             editor · health · generator page · settings · about · import/export · router
   Student extension points are marked with  TODO(student)
   ===================================================================== */
// ---------- utils ----------
const NS = 'pfpm:';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const store = {
  get(k, d) { try { const v = localStorage.getItem(NS + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(NS + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(NS + k); } catch {} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ic = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const DAY = 86400000;
const now = () => Date.now();
const fmtDate = ts => new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const fmtTime = ts => new Date(ts).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const ago = ts => { const d = Math.round((now() - ts) / DAY); if (d < 1) return 'today'; if (d === 1) return 'yesterday'; if (d < 30) return d + ' days ago'; const m = Math.round(d / 30); if (m < 12) return m + ' months ago'; return (d / 365).toFixed(1) + ' years ago'; };
const normUrl = u => /^[a-z]+:\/\//i.test(u) ? u : 'https://' + u;
const host = u => { try { return new URL(normUrl(u)).host; } catch { return u; } };
const initial = t => ((t || '?').trim()[0] || '?').toUpperCase();
const toast = (msg, type = '', icon) => {
  const t = document.createElement('div'); t.className = 'toast ' + type;
  t.innerHTML = ic(icon || (type === 'ok' ? 'check-circle' : type === 'bad' ? 'alert-circle' : 'info'));
  const s = document.createElement('span'); s.textContent = msg; t.append(s); $('#toasts').append(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, 3400);
};
const animateIn = root => { root.classList.remove('enter'); void root.offsetWidth; root.classList.add('enter'); $$('.stagger', root).forEach(g => [...g.children].forEach((el, i) => el.style.setProperty('--i', i))); };
const countUp = (el, to, { dur = 700, fmt = v => Math.round(v).toLocaleString('en-PK') } = {}) => { const t0 = performance.now(); const step = n => { const p = Math.min(1, (n - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = fmt(to * e); if (p < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); };
const download = (name, text, type = 'application/json') => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); };
const pickFile = (accept, cb) => { const i = document.createElement('input'); i.type = 'file'; i.accept = accept; i.onchange = () => { const f = i.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => cb(String(r.result), f.name); r.readAsText(f); }; i.click(); };

// ---------- crypto (WebCrypto only) ----------
const enc = new TextEncoder(), dec = new TextDecoder();
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = u8 => [...u8].map(b => b.toString(16).padStart(2, '0')).join('');
const KDF_MIN = 600000;
/** master password → AES-GCM-256 key. PBKDF2-SHA-256 with a random 16-byte salt. */
async function deriveKey(password, salt, iterations) {
  // TODO(student): Argon2id via WASM (e.g. argon2-browser / hash-wasm): memory-hard KDFs resist GPU cracking far better than PBKDF2.
  // Keep the same signature, store kdf:'argon2id' + its parameters in the vault record, and migrate on next unlock.
  const km = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encryptJSON(key, obj) { const iv = rnd(12); const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(obj)))); return { iv: b64(iv), ct: b64(ct) }; }
async function decryptJSON(key, box) { const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(box.iv) }, key, unb64(box.ct)); return JSON.parse(dec.decode(pt)); }
async function sha1Hex(str) { return hex(new Uint8Array(await crypto.subtle.digest('SHA-1', enc.encode(str)))).toUpperCase(); }
function base32Decode(s) {
  const A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567'; s = (s || '').toUpperCase().replace(/[^A-Z2-7]/g, '');
  let bits = 0, val = 0; const out = [];
  for (const c of s) { val = (val << 5) | A.indexOf(c); bits += 5; if (bits >= 8) { out.push((val >>> (bits - 8)) & 255); bits -= 8; } }
  return new Uint8Array(out);
}
/** RFC 6238 TOTP: HMAC-SHA-1 over the 30-second counter, dynamic truncation, 6 digits. */
async function totp(secret, t = now(), step = 30, digits = 6) {
  const keyBytes = base32Decode(secret); if (!keyBytes.length) return null;
  const counter = Math.floor(t / 1000 / step); const buf = new ArrayBuffer(8); const v = new DataView(buf);
  v.setUint32(0, Math.floor(counter / 4294967296)); v.setUint32(4, counter >>> 0);
  const k = await crypto.subtle.importKey('raw', keyBytes, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
  const h = new Uint8Array(await crypto.subtle.sign('HMAC', k, buf)); const off = h[19] & 15;
  const code = (((h[off] & 127) << 24) | (h[off + 1] << 16) | (h[off + 2] << 8) | h[off + 3]) % 10 ** digits;
  return String(code).padStart(digits, '0');
}

// ---------- health ----------
function healthReport() {
  const es = entries(); const byPw = new Map();
  es.forEach(e => { if (!e.password) return; if (!byPw.has(e.password)) byPw.set(e.password, []); byPw.get(e.password).push(e); });
  const groups = [...byPw.values()].filter(g => g.length > 1); const reusedIds = new Set(groups.flat().map(e => e.id));
  const weak = es.filter(e => analyze(e.password).score <= 1);
  const old = es.filter(e => now() - (e.pwAt || e.updated || e.created) > 365 * DAY);
  const no2fa = es.filter(e => !e.totp && KNOWN_2FA.some(k => ((e.url || '') + ' ' + e.title).toLowerCase().includes(k)));
  const n = es.length || 1;
  const score = es.length ? Math.round(100 * (1 - (0.45 * weak.length / n + 0.3 * reusedIds.size / n + 0.15 * old.length / n + 0.1 * no2fa.length / n))) : 100;
  const dist = [0, 0, 0, 0, 0]; es.forEach(e => dist[analyze(e.password).score]++);
  const fixes = es.map(e => ({ e, why: [weak.includes(e) && 'weak', reusedIds.has(e.id) && 'reused', old.includes(e) && 'old', no2fa.includes(e) && 'no 2FA'].filter(Boolean) })).filter(f => f.why.length).sort((a, b) => b.why.length - a.why.length || analyze(a.e.password).bits - analyze(b.e.password).bits);
  return { score, weak, groups, reusedIds, old, no2fa, dist, fixes, n: es.length };
}

    </div>

  animateIn(root);

  let hashInfo = null;

    $('#brOut').innerHTML = `<div class="hashbox">SHA-1 = <span class="pre">${hashInfo.prefix}</span>${hashInfo.suffix}</div><div class="small muted" style="margin-top:8px">Only <code class="mono">${hashInfo.prefix}</code> would leave this device → <code class="mono">GET https://api.pwnedpasswords.com/range/${hashInfo.prefix}</code>. The 35-character suffix stays here and is compared against the returned list. 16⁵ = 1,048,576 possible prefixes, so the server learns nearly nothing about your password.</div>`; $('#brCheck').disabled = false; };

}

  const save = () => { prefs.autoLock = +$('#sAuto').value; prefs.lockOnHide = $('#sHide').checked; prefs.clipClear = Math.min(120, Math.max(5, +$('#sClip').value || 20)); prefs.iterations = Math.max(KDF_MIN, +$('#sIter').value || KDF_MIN); savePrefs(); };
  ['sAuto', 'sHide', 'sClip', 'sIter'].forEach(id => $('#' + id).addEventListener('change', () => { save(); toast('Settings saved', 'ok', 'settings'); }));
  $$('[data-accent]', root).forEach(b => b.onclick = () => { prefs.accent = b.dataset.accent; savePrefs(); applyAccent(); $$('[data-accent]', root).forEach(x => x.classList.toggle('on', x === b)); });
  $('#sChangePw').onclick = openChangeMaster; $('#sRecovery').onclick = recoveryKit; $('#sSync').onclick = syncVault;
  $('#sExpEnc').onclick = exportEncrypted; $('#sImpEnc').onclick = () => importEncrypted(false); $('#sImpCsv').onclick = importCSV; $('#sExpCsv').onclick = exportCSV;
  $('#sWipe').onclick = async () => { if (await confirmModal({ title: 'Wipe this vault?', body: 'Every item, its history and the encrypted record are deleted from this browser. There is no undo.', ok: 'Wipe vault', danger: true, typed: 'DELETE', icon: 'trash' })) { store.del('vault'); lock('Vault wiped from this device'); toast('Vault wiped', 'ok', 'trash'); } };
}
const applyAccent = () => document.documentElement.dataset.accent = prefs.accent;
function openChangeMaster() {
  openModal(`${modalHead('Change master password', 'key')}<form id="cmForm" autocomplete="off">
    <label class="f" for="cmOld">Current master password</label><input id="cmOld" type="password" autocomplete="off" required>
    <label class="f" for="cmNew">New master password</label><div class="pwwrap one"><input id="cmNew" type="password" autocomplete="off" required><div class="tools"><button type="button" class="iconbtn sm" data-toggle="cmNew" aria-label="Show password">${ic('eye')}</button></div></div><div id="cmMeter">${meterHTML(analyze(''))}</div>
    <label class="f" for="cmNew2">Confirm new master password</label><input id="cmNew2" type="password" autocomplete="off" required>
    <label class="f" for="cmIter">PBKDF2 iterations</label><input id="cmIter" type="number" min="${KDF_MIN}" step="100000" value="${prefs.iterations}">
    <div id="cmErr" class="small bad" style="margin-top:6px;min-height:1.2em"></div>
    <div class="modal-foot"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn primary" id="cmOk">${ic('key')} Re-encrypt vault</button></div></form>`);
  $('#cmNew').addEventListener('input', () => { const a = analyze($('#cmNew').value); $('#cmMeter').innerHTML = meterHTML(a) + (a.len ? strengthLine(a) : ''); });
  $('#cmForm').onsubmit = async ev => { ev.preventDefault(); const a = analyze($('#cmNew').value); const err = $('#cmErr');
    if ($('#cmNew').value.length < 12 || a.score < 2) { err.textContent = 'New password must be 12+ characters and at least Fair.'; return; }
    if ($('#cmNew').value !== $('#cmNew2').value) { err.textContent = 'New passwords do not match.'; return; }
    const it = Math.max(KDF_MIN, +$('#cmIter').value || KDF_MIN); $('#cmOk').disabled = true; $('#cmOk').innerHTML = `${ic('refresh')} Re-encrypting…`;
    try { await changeMasterPassword($('#cmOld').value, $('#cmNew').value, it); modalClose = null; closeModal(); toast('Master password changed — vault re-encrypted', 'ok', 'shield-check'); renderPage('settings'); } catch (e) { err.textContent = e.message; $('#cmOk').disabled = false; $('#cmOk').innerHTML = `${ic('key')} Re-encrypt vault`; } };
}

// ---------- import / export ----------
function exportEncrypted() { const rec = store.get('vault'); download(`vault-export-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ ...rec, exportedAt: now() }, null, 2)); toast('Encrypted export downloaded', 'ok', 'download'); }
function importEncrypted(fromLockScreen) {
  pickFile('.json,application/json', async text => {
    let rec; try { rec = JSON.parse(text); } catch { toast('Not a JSON file', 'bad'); return; }
    if (!rec || rec.format !== 'pfpm-vault' || !rec.data || !rec.salt) { toast('Not a Vault export', 'bad'); return; }
    openModal(`${modalHead('Unlock the imported file', 'upload')}<form id="imForm" autocomplete="off"><p class="small muted">The file was encrypted with its own master password (${rec.iterations.toLocaleString('en-PK')} iterations). Enter it to decrypt the export.</p>
      <label class="f" for="imPw">Export's master password</label><input id="imPw" type="password" autocomplete="off" required>
      ${fromLockScreen ? '' : `<label class="f">Mode</label><label class="chk"><input type="radio" name="imMode" value="merge" checked> Merge — add items that are not already here</label><label class="chk"><input type="radio" name="imMode" value="replace"> Replace — discard current items</label>`}
      <div id="imErr" class="small bad" style="min-height:1.2em"></div><div class="modal-foot"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn primary">${ic('unlock')} Decrypt &amp; import</button></div></form>`);
    $('#imForm').onsubmit = async ev => { ev.preventDefault(); try {
      const key = await deriveKey($('#imPw').value, unb64(rec.salt), rec.iterations); await decryptJSON(key, rec.verifier); const data = await decryptJSON(key, rec.data);
      if (fromLockScreen) { store.set('vault', { ...rec, savedAt: now() }); modalClose = null; closeModal(); demoHint = false; lockReason = 'Export restored — unlock with its master password'; renderLock('unlock'); return; }
      const mode = $('input[name=imMode]:checked').value; const incoming = data.entries || [];
      if (mode === 'replace') session.data.entries = incoming; else { const ids = new Set(entries().map(e => e.id)); incoming.forEach(e => { if (!ids.has(e.id)) entries().push(e); }); }
      await saveVault(); modalClose = null; closeModal(); toast(`Imported ${incoming.length} item${incoming.length === 1 ? '' : 's'}`, 'ok', 'upload'); state.listKey = ''; location.hash = 'all';
    } catch { $('#imErr').textContent = 'Wrong password for this export.'; } };
  });
}
/** RFC 4180-ish CSV parser: quoted fields, doubled quotes, newlines inside quotes. */
function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) { const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(cell); cell = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; } else cell += c; }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
function importCSV() {
  pickFile('.csv,text/csv', async text => {
    const rows = parseCSV(text.replace(/^﻿/, '')); if (!rows.length) { toast('Empty CSV', 'bad'); return; }
    const ALIAS = { title: ['name', 'title', 'account'], url: ['url', 'website', 'login_uri', 'web site'], username: ['username', 'login', 'user', 'email', 'login_username'], password: ['password', 'login_password', 'pass'], notes: ['note', 'notes', 'extra', 'comments'] };
    const head = rows[0].map(h => h.trim().toLowerCase()); const idx = {}; let hasHeader = false;
    Object.entries(ALIAS).forEach(([k, al]) => { const i = head.findIndex(h => al.includes(h)); if (i >= 0) { idx[k] = i; hasHeader = true; } });
    if (!hasHeader) Object.assign(idx, { title: 0, url: 1, username: 2, password: 3, notes: 4 });
    const body = hasHeader ? rows.slice(1) : rows; const t = now();
    const items = body.map(r => { const g = k => idx[k] != null ? (r[idx[k]] || '').trim() : ''; return { id: uid(), title: g('title') || host(g('url')) || 'Imported item', username: g('username'), password: g('password'), url: g('url'), notes: g('notes'), tags: ['imported'], fav: false, color: COLORS[7], fields: [], history: [], totp: '', created: t, updated: t, pwAt: t }; }).filter(x => x.password || x.username);
    if (!items.length) { toast('No usable rows found', 'bad'); return; }
    if (await confirmModal({ title: `Import ${items.length} item${items.length === 1 ? '' : 's'}?`, body: `Detected columns: <code>${esc(Object.keys(idx).join(', '))}</code>${hasHeader ? '' : ' (no header row — positional mapping)'}. Items get the tag <b>imported</b>. Delete the CSV file afterwards — it is plaintext.`, ok: 'Import', icon: 'file' })) { entries().push(...items); await saveVault(); toast(`Imported ${items.length} items`, 'ok', 'upload'); state.listKey = ''; location.hash = 'tag/imported'; }
  });
}
async function exportCSV() {
  if (!(await confirmModal({ title: 'Export plaintext CSV?', body: `<div class="note bad">${ic('alert')}<span>The file will contain every password <b>unencrypted</b>. Anyone who opens it can read everything. Use it only to migrate, then delete it securely.</span></div>`, ok: 'I understand, export', danger: true, typed: 'EXPORT', icon: 'alert' }))) return;
  const csv = ['name,url,username,password,note', ...entries().map(e => [e.title, e.url, e.username, e.password, e.notes].map(v => '"' + String(v || '').replace(/"/g, '""') + '"').join(','))].join('\r\n');
  download(`vault-plaintext-${new Date().toISOString().slice(0, 10)}.csv`, csv, 'text/csv'); toast('Plaintext CSV downloaded — delete it after use', 'bad', 'alert');
}

// ---------- about ----------
const TODOS = [
  ['Argon2id KDF via WASM', 'deriveKey()', 'crypto', 'Memory-hard hashing resists GPU/ASIC cracking far better than PBKDF2; store the KDF name + parameters in the vault record and migrate on unlock.'],
  ['WebAuthn / passkey unlock', 'unlockWithPasskey()', 'auth', 'Wrap the vault key with a secret derived from the authenticator (PRF or largeBlob extension) so a fingerprint or security key unlocks the vault.'],
  ['Browser-extension autofill', 'autofillBridge()', 'platform', 'WebExtension content script that matches the active tab origin to an entry and fills username + password + TOTP.'],
  ['End-to-end-encrypted sync', 'syncVault()', 'sync', 'Push only the encrypted record to a dumb backend (S3, Firebase, your own API); resolve conflicts per entry by `updated` timestamp.'],
  ['Secure sharing with public-key crypto', 'shareEntry()', 'crypto', 'ECDH (X25519/P-256) key pair per user; encrypt an entry with a random AES key and wrap that key for each recipient.'],
  ['Live HIBP range API check', 'checkRangeAPI()', 'network', 'Fetch https://api.pwnedpasswords.com/range/{prefix}, parse SUFFIX:COUNT lines, match locally — the UI and k-anonymity explainer already exist.'],
  ['Emergency access / recovery kit', 'recoveryKit()', 'ux', 'Printable recovery key that wraps the vault key; optional Shamir secret sharing between trusted contacts with a waiting period.'],
];
function aboutHTML(compact = false) {
  return `<div class="${compact ? 'list' : 'two'}">
    <div class="list">
      <div class="card"><h3>${ic('alert')} The problem</h3><p class="small muted" style="margin:0">People reuse one weak password across banking apps, JazzCash/Easypaisa, email and social accounts. Cloud password managers cost money or ask for trust in a company; this is a zero-knowledge, offline, single-file vault that also <b>teaches</b> the cryptography it uses.</p></div>
      <div class="card"><h3>${ic('shield-check')} Threat model — what this protects against</h3><ul class="reasons"><li class="ok">${ic('check-circle')}<span><b>Device theft / lost laptop</b> while the vault is locked: the attacker only gets AES-GCM ciphertext and must brute-force your master password through 600,000 PBKDF2 rounds per guess.</span></li><li class="ok">${ic('check-circle')}<span><b>Cloud or provider leaks</b>: there is no server, account or sync, so nothing can leak from one.</span></li><li class="ok">${ic('check-circle')}<span><b>Casual snooping</b> in DevTools / localStorage: no plaintext, no password hash — only salt, parameters and ciphertext.</span></li><li class="ok">${ic('check-circle')}<span><b>Tampering</b>: AES-GCM is authenticated; a modified blob fails to decrypt instead of returning garbage.</span></li></ul></div>
      <div class="card"><h3>${ic('alert-circle')} …and what it does not</h3><ul class="reasons"><li class="bad">${ic('alert-circle')}<span><b>Malware, keyloggers or a malicious extension</b> on this device can read the master password or the unlocked DOM.</span></li><li class="bad">${ic('alert-circle')}<span><b>Shoulder surfing</b> while a secret is revealed, and <b>clipboard sniffers</b> during the ${prefs.clipClear}-second copy window.</span></li><li class="bad">${ic('alert-circle')}<span><b>A weak master password</b> — 600k iterations only multiply an attacker's cost; they do not fix 20 bits of entropy.</span></li><li class="bad">${ic('alert-circle')}<span><b>Forgetting the master password</b>: there is no recovery (a recovery kit is a student TODO).</span></li><li class="bad">${ic('alert-circle')}<span><b>A tampered copy of this HTML file</b>: verify where you got it. Inline scripts mean a strict CSP cannot be applied; a bundled build with hashes would allow one.</span></li></ul></div>
    </div>
    <div class="list">
      <div class="card"><h3>${ic('cpu')} How it works</h3><p class="small muted" style="margin:0">Master password → PBKDF2-SHA-256 (600,000 iterations, 16-byte random salt) → AES-GCM-256 key. The whole vault JSON is encrypted as one blob with a fresh 12-byte IV on every save and stored in <code>localStorage</code> beside the salt, iteration count and a verifier. TOTP codes use HMAC-SHA-1 (RFC 6238); the breach check uses SHA-1 k-anonymity. Everything is WebCrypto — no crypto library is loaded.</p></div>
      <div class="card"><h3>${ic('graduation')} Left for students to build</h3><div class="list">${TODOS.map(([h, fn, tag, b]) => `<div class="todo"><h4>${esc(h)} <span class="tag">${tag}</span> <code>${esc(fn)}</code></h4><div class="small muted">${esc(b)}</div></div>`).join('')}</div><p class="small muted" style="margin:10px 0 0">Search the source for <code>TODO(student)</code> to find each stub.</p></div>
      <div class="card"><h3>${ic('code')} Hygiene in the code</h3><ul class="reasons"><li class="muted">${ic('check')}<span>Secrets are rendered with <code>esc()</code>/<code>textContent</code>; copy buttons look values up by key, never from attributes.</span></li><li class="muted">${ic('check')}<span>Password inputs have <code>autocomplete="off"</code>; the key and decrypted data are nulled on lock; the strength cache is cleared.</span></li><li class="muted">${ic('check')}<span><code>referrer: no-referrer</code>, links open with <code>rel="noopener noreferrer"</code>, no analytics, no third-party script.</span></li></ul></div>
    </div></div>`;
}
const renderAbout = root => { root.innerHTML = `<div class="page"><div class="page-head"><div><h2>About Vault</h2><p>Privacy-first password manager · FYP template #13 · idea #51</p></div></div>${aboutHTML()}</div>`; animateIn(root); };

// ---------- router ----------
function parseHash() { const p = (location.hash.slice(1) || 'all').split('/'); if (p[0] === 'tag') return { view: 'tag', tag: decodeURIComponent(p[1] || ''), id: p[2] || null }; return { view: p[0], tag: null, id: p[1] || null }; }
function renderPage(view) { const root = $('#contentPane'); ({ health: renderHealth, generator: renderGenerator, settings: renderSettings, about: renderAbout }[view])(root); root.scrollTop = 0; }
function route() {
  if (!session.key) return;
  const r = parseHash(); const vaultView = ['all', 'fav', 'tag'].includes(r.view);
  if (!vaultView && !PAGES[r.view]) { location.hash = 'all'; return; }
  if (r.view === 'tag' && !allTags().some(([t]) => t === r.tag)) { location.hash = 'all'; return; }
  if (r.id !== state.selected) state.revealed.clear();
  state.view = r.view; state.tag = r.tag; state.selected = vaultView ? r.id : null;
  document.body.dataset.page = vaultView ? 'vault' : r.view; document.body.classList.toggle('detail-open', vaultView && !!r.id); document.body.classList.remove('rail-open'); $('#scrim').classList.remove('open');
  renderRail();
  if (vaultView) { renderList(); renderDetail(); } else { stopTotp(); renderPage(r.view); }
}
window.addEventListener('hashchange', route);
$('#q').addEventListener('input', e => { state.q = e.target.value; renderList(); });
$('#sortSel').addEventListener('change', e => { state.sort = e.target.value; state.listKey = ''; renderList(); });
$('#newBtn').onclick = () => openEditor(null);
$('#lockBtn').onclick = () => lock('Locked');
$('#mLockBtn').onclick = () => lock('Locked');
$('#menuBtn').onclick = () => { document.body.classList.add('rail-open'); $('#scrim').classList.add('open'); };
$('#railNav').addEventListener('click', e => { if (e.target.closest('a')) { document.body.classList.remove('rail-open'); $('#scrim').classList.remove('open'); } });
applyAccent();
renderLock();
</script>
