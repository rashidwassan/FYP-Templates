}

function saveMovement(det, item, cfg, type) {
  const raw = $('#suQty').value;
  const qty = +raw;
  const date = $('#suDate').value;
  cfg.min = Math.max(0, +$('#suMin').value || 0);
  cfg.expiry = $('#suExp').value || null;
  store.set('supplies', supplies);
  if (raw !== '' && date && date <= T_ISO && (qty > 0 || type === 'count')) {
    if (type === 'out' && qty > stockLevel(item.id)) toast(t('su_notEnough'), 'bad', 'box');
    put('stock', { item: item.id, type, qty, date, note: $('#suNote').value.trim() });
  }
  toast(t('su_saved'), 'ok', 'box');
  renderSupplies(item.id);
  renderNav();
}

/** Request sheet: items below minimum with quantity to reach two months of stock (or 2 × minimum when unused). */
function requestLines() {
  return SUPPLY_ITEMS.map(i => {
    const st = stockStatus(i.id);
    const targetQty = Math.max(st.min * 2, Math.ceil(st.amc * 2));
    return { item: i, st, need: Math.max(0, targetQty - st.qty) };
  }).filter(r => r.st.status !== 'ok' && r.need > 0);
}

function renderRequestSheet(det) {
  const lines = requestLines();
  const rows = lines.map(r => `<tr><td>${esc(r.item.en)}<div class="ur small" style="text-align:left">${esc(r.item.ur)}</div></td><td class="num">${r.st.qty}</td><td class="num">${r.st.amc.toFixed(1)}</td><td class="num"><b>${r.need}</b> ${esc(r.item.unit)}</td></tr>`).join('');
  det.innerHTML = backBtn('#supplies') + `<div class="actions no-print" style="margin:0 0 14px"><button class="btn" onclick="window.print()">${ic('printer')} ${t('print')}</button><button class="btn teal" id="suCsv">${ic('download')} CSV</button></div>
    <div class="card"><div class="eyebrow">${esc(profile.name)} · ${esc(profile.code)} · ${esc(profile.bhu)}</div><h3 style="font-size:1.25rem;margin-top:4px">${ic('file')} ${t('su_request')} · ${fmtD(T_ISO)}</h3>
    <p class="muted small" style="margin:0 0 10px">${t('su_requestLead')}</p>
    ${lines.length ? `<div class="tablewrap"><table><thead><tr><th>${t('su_item')}</th><th class="num">${t('su_stock')}</th><th class="num">${t('su_amc')}</th><th class="num">${t('su_need')}</th></tr></thead><tbody>${rows}</tbody></table></div>` : `<div class="note">${ic('check-circle')} ${t('su_noRequest')}</div>`}
    <div class="slip" style="border:0;padding:0;margin-top:10px"><div class="sig"><div>${t('s_sig')}</div><div>${esc(profile.bhu)}</div></div></div></div>`;
  $('#suCsv').onclick = () => {
    const head = 'Item,Unit,In stock,Avg monthly use,Requested\n';
    download(`lhw-request-${T_ISO}.csv`, head + lines.map(r => [r.item.en, r.item.unit, r.st.qty, r.st.amc.toFixed(1), r.need].map(csvCell).join(',')).join('\n'), 'text/csv');
    toast('CSV', 'ok', 'download');
  };
}

// ---------- Polio NID tally: campaigns, big-button daily tally, missed-children list ----------
let nidDay = null;

const nidTotals = k => {
  const out = Object.fromEntries(NID_METRICS.map(m => [m.id, 0]));
  Object.values(k.tally || {}).forEach(day => NID_METRICS.forEach(m => (out[m.id] += day[m.id] || 0)));
  out.vaccinated = out.u1 + out.u5;
  return out;
};
const nidDates = k => Array.from({ length: k.days }, (_, i) => iso(addDays(k.start, i)));

function nidItem(k, selId) {
  const tot = nidTotals(k);
  const cov = pct(tot.vaccinated, k.target);
  return `<a class="pitem ${selId === k.id ? 'on' : ''}" href="#nid/${k.id}"><div class="av">${ic('droplet')}</div><div class="t"><b>${esc(k.name)}</b><span>${fmtS(k.start)} · ${k.days} ${t('ni_days').toLowerCase()} · ${esc(k.vaccine)} · ${tot.vaccinated}/${k.target}</span></div><span class="chip ${cov >= 95 ? 'green' : k.status === 'active' ? 'orange' : 'amber'}">${cov ?? 0}%</span></a>`;
}

function renderNid(id) {
  const list = DB.nid.slice().sort((a, b) => (a.start < b.start ? 1 : -1));
  const sel = id && id !== 'new' ? byId('nid', id) : id === 'new' ? null : list.find(k => k.status === 'active') || null;
  view.innerHTML = pagehead(t('ni_title'), t('ni_lead'), `<a class="btn no-print" href="#nid/new">${ic('plus')} ${t('ni_new')}</a>`) +
    `<div class="split ${id ? 'detail-open' : ''}"><div class="col-list"><div class="plist stagger">${list.length ? list.map(k => nidItem(k, sel && sel.id)).join('') : `<div class="card muted">${t('ni_none')}</div>`}</div></div><div class="col-detail" id="niDetail"></div></div>`;
  const det = $('#niDetail');
  if (id === 'new') renderNidForm(det);
  else if (sel) renderNidCampaign(det, sel);
  else det.innerHTML = emptyCard('droplet', t('ni_pick'));
}

function renderNidForm(det) {
  det.innerHTML = backBtn('#nid') + `<div class="card" style="max-width:640px"><h3>${ic('plus')} ${t('ni_new')}</h3>
    ${field(t('ni_name'), `<input id="niName" type="text" maxlength="60" value="${esc(fmtMonth(monthKey(T_ISO)))} NID">`)}
    <div class="cols">${field(t('ni_start'), `<input id="niStart" type="date" value="${T_ISO}">`)}${field(t('ni_days'), `<input id="niDays" type="number" min="1" max="7" value="3">`)}${field(t('ni_vaccine'), `<select id="niVac"><option>bOPV</option><option>nOPV2</option><option>fIPV + bOPV</option></select>`)}</div>
    <div class="cols">${field(t('ni_team'), `<input id="niTeam" type="text" maxlength="12" value="T-14">`)}${field(t('ni_target'), `<input id="niTarget" type="number" min="1" value="${Math.max(DB.children.length, 180)}">`)}</div>
    <div class="actions"><button class="btn" id="niSave">${ic('check')} ${t('save')}</button><a class="btn ghost" href="#nid">${t('cancel')}</a></div></div>`;
  $('#niSave').onclick = () => {
    const name = $('#niName').value.trim();
    const start = $('#niStart').value;
    const days = clamp(+$('#niDays').value || 3, 1, 7);
    const target = +$('#niTarget').value || 0;
    if (!name || !start || !target) return toast(t('ni_name'), 'bad');
    const rec = put('nid', { name, start, days, team: $('#niTeam').value.trim(), target, vaccine: $('#niVac').value, status: 'active', tally: {}, missed: [] });
    nidDay = null;
    toast(t('ni_saved'), 'ok');
    location.hash = `nid/${rec.id}`;
  };
}

function nidSummaryCard(k) {
  const tot = nidTotals(k);
  const cov = pct(tot.vaccinated, k.target) ?? 0;
  const open = (k.missed || []).filter(m => !m.covered).length;
  return `<div class="card"><div class="detailhead"><div class="big">${ic('droplet', 'lg')}</div><div style="flex:1;min-width:0"><div class="eyebrow">${t('ni_team')} ${esc(k.team)}</div><h2>${esc(k.name)}</h2>
      <div class="meta">${chip(k.status)}<span class="chip lg">${fmtD(k.start)} · ${k.days} ${t('ni_days').toLowerCase()}</span><span class="chip teal lg">${ic('droplet')} ${esc(k.vaccine)}</span><span class="chip ${open ? 'red' : 'green'} lg">${open} ${t('ni_missedShort')}</span></div></div>
      <button class="btn ghost sm no-print" id="niToggle">${ic(k.status === 'active' ? 'lock' : 'unlock')} ${t(k.status === 'active' ? 'ni_close' : 'ni_reopen')}</button></div>
      <div style="display:flex;align-items:center;gap:12px;margin-top:14px"><div class="progress" style="flex:1"><i class="${cov >= 95 ? 'green' : cov >= 80 ? '' : 'amber'}" data-grow="${Math.min(100, cov)}%" style="width:0"></i></div><b style="white-space:nowrap"><span data-count="${tot.vaccinated}">0</span> / ${k.target} · ${cov}% ${t('ni_coverage')}</b></div></div>`;
}

function nidTallyCard(k) {
  const dates = nidDates(k);
  if (!nidDay || !dates.includes(nidDay)) nidDay = dates.includes(T_ISO) ? T_ISO : dates[dates.length - 1];
  const day = (k.tally || {})[nidDay] || {};
  const locked = k.status !== 'active' || nidDay > T_ISO;
  const boxes = NID_METRICS.map(m => `<div class="box ${m.cls}"><div class="lbl">${t(m.key)}</div><div class="cnt" id="cnt-${m.id}">${day[m.id] || 0}</div><div class="pm no-print"><button class="minus" data-dec="${m.id}" aria-label="${t(m.key)} −1" ${locked ? 'disabled' : ''}>${ic('minus')}</button><button data-inc="${m.id}" aria-label="${t(m.key)} +1" ${locked ? 'disabled' : ''}>${ic('plus')}</button></div></div>`).join('');
  return `<div class="card"><h3>${ic('hash')} ${t('ni_pickDay')}</h3><div class="seg" id="niDays" style="margin-bottom:12px">${dates.map((d, i) => `<button data-v="${d}">${t('ni_day')} ${i + 1} · ${fmtS(d)}</button>`).join('')}</div>
    <div class="tally">${boxes}</div></div>`;
}

function nidByDayCard(k) {
  const dates = nidDates(k);
  const head = NID_METRICS.map(m => `<th class="num">${t(m.key)}</th>`).join('');
  const body = dates.map((d, i) => {
    const row = (k.tally || {})[d] || {};
    return `<tr><td style="white-space:nowrap">${t('ni_day')} ${i + 1} · ${fmtS(d)}</td>${NID_METRICS.map(m => `<td class="num">${row[m.id] || 0}</td>`).join('')}</tr>`;
  }).join('');
  const tot = nidTotals(k);
  return `<div class="card"><h3>${ic('list')} ${t('ni_byDay')}</h3><div class="tablewrap"><table><thead><tr><th>${t('ni_day')}</th>${head}</tr></thead><tbody>${body}<tr><td><b>${t('ni_total')}</b></td>${NID_METRICS.map(m => `<td class="num"><b>${tot[m.id]}</b></td>`).join('')}</tr></tbody></table></div></div>`;
}

function nidMissedCard(k) {
  const rows = (k.missed || []).map(m => {
    const reason = NID_MISS_REASONS.find(r => r.id === m.reason) || { en: m.reason, ur: m.reason };
    return `<label class="check ok ${m.covered ? 'on' : ''}"><input type="checkbox" data-miss="${m.id}" ${m.covered ? 'checked' : ''}><span class="en">${esc(m.name)} <span class="small muted" style="font-weight:400">· ${esc(m.house)} · ${t('ni_day')} ${m.day} · ${esc(reason.en)}</span></span></label>`;
  }).join('');
  return `<div class="card"><h3>${ic('footprints')} ${t('ni_missed')}<button class="btn teal sm no-print" id="niAddMiss" style="margin-left:auto">${ic('plus')} ${t('ni_addMissed')}</button></h3><div class="checks" id="niMissed">${rows || '<div class="muted small">—</div>'}</div></div>`;
}

function renderNidCampaign(det, k) {
  det.innerHTML = backBtn('#nid') + nidSummaryCard(k) + nidTallyCard(k) + nidMissedCard(k) + nidByDayCard(k);
  runCounters(det);
  requestAnimationFrame(() => animateBars(det));
  segControl($('#niDays'), nidDay, v => {
    nidDay = v;
    renderNidCampaign(det, k);
  });
  const step = (metric, delta) => {
    k.tally = k.tally || {};
    const day = (k.tally[nidDay] = k.tally[nidDay] || {});
    day[metric] = Math.max(0, (day[metric] || 0) + delta);
    put('nid', k);
    const el = $('#cnt-' + metric);
    el.textContent = day[metric];
    bump(el);
  };
  $$('[data-inc]', det).forEach(b => (b.onclick = () => step(b.dataset.inc, 1)));
  $$('[data-dec]', det).forEach(b => (b.onclick = () => step(b.dataset.dec, -1)));
  $$('[data-miss]', det).forEach(i => i.addEventListener('change', () => {
    const m = k.missed.find(x => x.id === i.dataset.miss);
    m.covered = i.checked;
    i.closest('.check').classList.toggle('on', i.checked);
    put('nid', k);
  }));
  $('#niAddMiss').onclick = () => openMissedSheet(det, k);
  $('#niToggle').onclick = () => {
    put('nid', Object.assign(k, { status: k.status === 'active' ? 'closed' : 'active' }));
    toast(t('ni_saved'), 'ok');
    renderNid(k.id);
  };
}

function openMissedSheet(det, k) {
  const dayIndex = Math.max(1, nidDates(k).indexOf(nidDay) + 1);
  const html = sheetHead(t('ni_addMissed')) + field(t('name'), `<input id="mName" type="text" maxlength="60">`) +
    field(t('ni_house'), `<input id="mHouse" type="text" maxlength="80">`) +
    field(t('ni_reason'), `<select id="mReason">${NID_MISS_REASONS.map(r => `<option value="${r.id}">${esc(bi(r))}</option>`).join('')}</select>`) +
    `<div class="actions"><button class="btn block" id="mSave">${ic('check')} ${t('save')}</button></div>`;
  openSheet(html, s => {
    $('#mSave', s).onclick = () => {
      const name = $('#mName', s).value.trim();
      if (!name) return toast(t('name'), 'bad');
      k.missed = k.missed || [];
      k.missed.push({ id: uid(), name, house: $('#mHouse', s).value.trim(), reason: $('#mReason', s).value, day: dayIndex, covered: false });
      put('nid', k);
      closeSheet();
      toast(t('ni_saved'), 'ok');
      renderNidCampaign(det, k);
    };
  });
}

// ---------- Birth & death registration log ----------
let vtFilter = 'all';
const VT_ICON = { birth: 'baby', still: 'heart', death: 'file' };

function vitalRow(e) {
  const h = e.householdId && byId('households', e.householdId);
  const cat = deathCategory(e);
  const step = nextVitalStep(e);
  const stepIdx = VITAL_STEPS.indexOf(e.status);
  const cause = e.type === 'death' ? DEATH_CAUSES.find(c => c.id === e.cause) : null;
  const steps = VITAL_STEPS.map((s, i) => `<span class="${i < stepIdx ? 'done' : i === stepIdx ? (s === 'registered' ? 'done' : 'cur') : ''}">${t('vt_' + s)}${e.statusDates?.[s] ? ' · ' + fmtS(e.statusDates[s]) : ''}</span>`).join('');
  const catChip = cat === 'maternal' || cat === 'neonatal' ? `<span class="chip red">${cat === 'maternal' ? bi({ en: 'Maternal', ur: 'زچگی' }) : bi({ en: 'Neonatal', ur: 'نومولود' })}</span>` : '';
  const sub = [fmtD(e.date), esc(e.place), e.type === 'death' ? vitalAgeStr(e) : t(e.sex), cause ? esc(bi(cause)) : '', e.motherName ? `${t('vt_mother')} ${esc(e.motherName)}` : '', h ? esc(h.head) : ''].filter(Boolean).join(' · ');
  return `<div class="card" style="padding:14px 16px"><div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap"><div class="big" style="width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:${e.type === 'birth' ? 'var(--green-soft);color:var(--green)' : 'var(--surface-2);color:var(--muted)'}">${ic(VT_ICON[e.type])}</div>
      <div style="flex:1;min-width:0"><b>${esc(e.name)}</b> <span class="chip ${e.type === 'birth' ? 'green' : ''}">${t('vt_' + e.type)}</span> ${catChip}<div class="small muted" style="margin-top:2px">${sub}</div>${e.notes ? `<div class="small" style="margin-top:2px">${esc(e.notes)}</div>` : ''}</div>
</div>
    <div class="steps" style="margin-top:10px">${steps}</div>
    <div class="no-print" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-top:10px">${step ? `<button class="btn teal sm" data-step="${e.id}">${ic('arrow-right')} ${t('vt_mark')}: ${t('vt_' + step)}</button>` : ''}<button class="btn danger sm" data-vdel="${e.id}" aria-label="${t('delete')}">${ic('trash')}</button></div>
    ${cat === 'maternal' ? `<div class="alert red" style="margin-top:10px">${ic('siren')}<div><b>${t('vt_maternal')}</b><div class="ur">${esc(L.ur.vt_maternal)}</div></div></div>` : cat === 'neonatal' && e.status === 'recorded' ? `<div class="alert amber" style="margin-top:10px">${ic('alert')}<div><b>${t('vt_neonatal')}</b><div class="ur">${esc(L.ur.vt_neonatal)}</div></div></div>` : ''}</div>`;
}

// TODO(student): verbal autopsy. For deaths where deathCategory() is 'maternal' or 'neonatal', open the WHO 2022 verbal-autopsy questionnaire, save it on the event, add an LHS review step and a printable summary.
function renderVitals() {
  const mk = monthKey(T_ISO);
  const inM = e => e.date.slice(0, 7) === mk;
  const births = DB.vitals.filter(e => e.type === 'birth' && inM(e)).length;
  const deaths = DB.vitals.filter(e => e.type !== 'birth' && inM(e)).length;
  const pending = DB.vitals.filter(e => e.status !== 'registered').length;
  const severe = DB.vitals.filter(e => ['maternal', 'neonatal'].includes(deathCategory(e)) && diffDays(e.date, T_ISO) <= 365).length;
  const list = DB.vitals.filter(e => vtFilter === 'all' || (vtFilter === 'pending' ? e.status !== 'registered' : e.type === vtFilter)).sort((a, b) => (a.date < b.date ? 1 : -1));
  const filters = [['all', t('all')], ['birth', t('vt_birth')], ['still', t('vt_still')], ['death', t('vt_death')], ['pending', t('vt_kpi_pending')]];
  view.innerHTML = pagehead(t('vt_title'), t('vt_lead'), `<button class="btn no-print" id="vtNew">${ic('plus')} ${t('vt_new')}</button>`) +
    `<div class="kpis stagger" style="margin-bottom:16px">${kpi('green', t('vt_kpi_births'), births, 'baby')}${kpi(deaths ? 'red' : 'teal', t('vt_kpi_deaths'), deaths, 'file')}${kpi(pending ? 'orange' : 'green', t('vt_kpi_pending'), pending, 'clock')}${kpi(severe ? 'red' : 'green', t('vt_kpi_mat'), severe, 'siren')}</div>
    <div class="seg no-print" id="vtFilter" style="margin-bottom:12px">${filters.map(([v, l]) => `<button data-v="${v}">${l}</button>`).join('')}</div>
    <div class="stack stagger">${list.length ? list.map(vitalRow).join('') : `<div class="card muted">${t('vt_none')}</div>`}</div>`;
  runCounters(view);
  segControl($('#vtFilter'), vtFilter, v => {
    vtFilter = v;
    renderVitals();
  });
  $('#vtNew').onclick = openVitalSheet;
  $$('[data-step]').forEach(b => (b.onclick = () => {
    const e = byId('vitals', b.dataset.step);
    const next = nextVitalStep(e);
    e.status = next;
    e.statusDates = Object.assign({}, e.statusDates, { [next]: T_ISO });
    put('vitals', e);
    toast(t('vt_saved'), 'ok');
    renderVitals();
  }));
  $$('[data-vdel]').forEach(b => (b.onclick = () => {
    if (!confirm(t('delete') + '?')) return;
    remove('vitals', b.dataset.vdel);
    renderVitals();
  }));
}

}

// ---------- Monthly report (MNCH + programme counts, trend chart, line list, CSV, DHIS2-style JSON) ----------
let reportMonth = monthKey(T_ISO);
const REPORT_MNCH = [['r_newreg', 'newreg', 'plus', 'orange'], ['r_anc', 'anc', 'stethoscope', 'teal'], ['r_pnc', 'pnc', 'baby', 'teal'], ['r_ref', 'ref', 'siren', 'red'], ['r_del', 'del', 'heart', 'orange'], ['r_imm', 'imm', 'syringe', 'teal'], ['r_weighed', 'weighed', 'scale', 'teal']];
const REPORT_PROG = [['r_fp', 'fp', 'pill', 'teal'], ['r_muac', 'muac', 'leaf', 'teal'], ['r_sam', 'sam', 'alert', 'red'], ['r_tb', 'tb', 'activity', 'amber'], ['r_mal', 'mal', 'thermometer', 'amber'], ['r_vitA', 'vitA', 'droplet', 'teal'], ['r_deworm', 'deworm', 'droplet', 'teal'], ['r_births', 'births', 'baby', 'green'], ['r_deaths', 'deaths', 'file', 'red'], ['r_stockout', 'stockouts', 'box', 'red']];

function lineList(mk) {
  const inM = d => d && d.slice(0, 7) === mk;
  const rows = [];
  DB.anc.filter(v => inM(v.date)).forEach(v => {
    const p = byId('pregnancies', v.pregnancyId);
    if (p) rows.push({ type: 'ANC', name: womanOf(p).name, date: v.date, detail: `${gaStr(p.lmp, v.date)} · BP ${v.sys}/${v.dia}${v.hb ? ' · Hb ' + v.hb : ''}${v.referral ? ' · REFERRED ' + v.referral.dest : ''}` });
  });
  DB.pnc.filter(v => inM(v.date)).forEach(v => {
    const p = byId('pregnancies', v.pregnancyId);
    if (p) rows.push({ type: 'PNC', name: womanOf(p).name, date: v.date, detail: `Day ${v.day}${v.referral ? ' · REFERRED ' + v.referral.dest : ''}` });
  });
  DB.pregnancies.filter(p => p.delivery && inM(p.delivery.date)).forEach(p => {
    rows.push({ type: 'Delivery', name: womanOf(p).name, date: p.delivery.date, detail: `${p.delivery.place} · ${p.delivery.mode} · ${p.delivery.outcome}` });
  });
  DB.children.forEach(c => {
    Object.entries(c.immunizations || {}).filter(([, d]) => inM(d)).forEach(([v, d]) => rows.push({ type: 'Vaccine', name: c.name, date: d, detail: v }));
    (c.weights || []).filter(w => inM(w.date)).forEach(w => rows.push({ type: 'Weight', name: c.name, date: w.date, detail: `${w.kg} kg` }));
    SUPPLEMENTS.forEach(s => ((c.supplements || {})[s.id] || []).filter(inM).forEach(d => rows.push({ type: 'Supplement', name: c.name, date: d, detail: s.en })));
  });
  DB.fp.filter(r => inM(r.date)).forEach(r => {
    const w = byId('women', r.womanId);
    rows.push({ type: 'FP', name: w ? w.name : '?', date: r.date, detail: r.method ? fpMethod(r.method).en : 'Counselled' });
  });
  DB.nutrition.filter(r => inM(r.date)).forEach(r => {
    const c = byId('children', r.childId);
    rows.push({ type: 'MUAC', name: c ? c.name : '?', date: r.date, detail: `${r.muac} cm · ${r.cls.toUpperCase()}${r.referral ? ' · REFERRED OTP' : ''}` });
  });
  DB.screenings.filter(s => inM(s.date)).forEach(s => rows.push({ type: s.type === 'tb' ? 'TB screen' : 'Malaria screen', name: s.name, date: s.date, detail: `${s.result}${s.referral ? ' · REFERRED ' + s.referral.dest : ''}` }));
  DB.vitals.filter(e => inM(e.date)).forEach(e => rows.push({ type: e.type === 'birth' ? 'Birth' : e.type === 'still' ? 'Stillbirth' : 'Death', name: e.name, date: e.date, detail: `${e.place} · ${e.status}` }));
  return rows.sort((a, b) => (a.date < b.date ? -1 : 1));
}

const TYPE_CHIP = { ANC: 'teal', Vaccine: 'orange', Delivery: 'green', FP: 'teal', MUAC: 'amber', Birth: 'green', Death: 'red', Stillbirth: 'red' };

/** DHIS2-style dataValueSet for the report month. Codes are illustrative; mapping them to real UIDs is a student TODO. */
function dhisPayload(mk) {
  const c = monthCounts(mk);
  const ind = indicatorsFor(mk);
  const values = Object.entries(DHIS_MAP).map(([k, code]) => ({ dataElement: code, value: String(c[k] ?? 0) }));
  INDICATORS.filter(i => i.kind === 'pct' && ind[i.id] != null).forEach(i => values.push({ dataElement: i.dhis, value: String(ind[i.id]) }));
  return {
    dataSet: 'LHW_MONTHLY_REPORT',
    period: mk.replace('-', ''),
    orgUnit: profile.code,
    completeDate: T_ISO,
    attributeOptionCombo: 'default',
    comment: `${profile.name} · ${profile.village}`,
    dataValues: values
  };
}

// ---------- Sync (simulated) ----------
let syncing = false;

function renderSync() {
  const q = unsynced();
  const last = store.get('lastSync', null);

      <div class="progress" style="margin:14px 0 6px"><i id="syBar" style="width:${q.length ? 0 : 100}%"></i></div><div class="small muted" id="syMsg">${q.length ? '' : t('sy_done')}</div>
      <div class="actions"><button class="btn" id="syNow" ${q.length ? '' : 'disabled'}>${ic('refresh')} ${t('sy_now')}</button><button class="btn ghost" id="syExport">${ic('download')} ${t('sy_export')}</button><label class="btn ghost" style="cursor:pointer">${ic('upload')} ${t('sy_import')}<input type="file" id="syImport" accept="application/json" class="hidden"></label><button class="btn danger" id="syReset">${ic('trash')} ${t('sy_reset')}</button></div>
      <div class="note" style="margin-top:14px">${t('sy_note')}</div></div>
    <div class="card"><h3>${ic('list')} ${t('sy_queue')}</h3>${q.length ? `<div class="list stagger">${queueRows}${recRows}${q.length > 12 ? `<div class="small muted">… +${q.length - 12}</div>` : ''}</div>` : `<div class="note">${ic('check-circle')} ${t('sy_done')}</div>`}</div></div>`;
  $('#syNow').onclick = syncNow;
  $('#syExport').onclick = exportBackup;
  $('#syImport').onchange = importBackup;
  $('#syReset').onclick = () => {
    if (!confirm(t('sy_resetConfirm'))) return;
    seed();
    toast(t('sy_reset'), 'ok');
    route();
  };
}

function exportBackup() {
  const data = Object.fromEntries(TABLES.map(k => [k, DB[k]]));
  Object.assign(data, { profile, supplies, lhws, summaries, exportedAt: new Date().toISOString() });
  download(`lhw-backup-${T_ISO}.json`, JSON.stringify(data, null, 1));
  toast(t('sy_export'), 'ok', 'download');
}

/** Import a backup. MNCH tables are required (older backups have only those); programme tables are optional. */
function importBackup(e) {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (!MNCH_TABLES.every(k => Array.isArray(d[k]))) throw new Error('bad');
      TABLES.forEach(k => {
        DB[k] = Array.isArray(d[k]) ? d[k] : [];
        save(k);
      });
      if (Array.isArray(d.supplies)) store.set('supplies', (supplies = d.supplies));
      if (Array.isArray(d.lhws) && d.lhws.length) store.set('lhws', (lhws = d.lhws));
      if (Array.isArray(d.summaries)) store.set('summaries', (summaries = d.summaries));
      if (d.profile) store.set('profile', (profile = Object.assign({}, DEFAULT_PROFILE, d.profile)));
      toast(t('sy_imported'), 'ok');
      route();
    } catch {
      toast(t('sy_badFile'), 'bad');
    }
  };
  reader.readAsText(f);
}

// TODO(student): real sync backend. Replace this simulation with PouchDB → CouchDB replication (or a REST endpoint) that pushes unsynced records, pulls changes from the LHS/district server, resolves conflicts by updatedAt (or a merge policy per table), retries with exponential back-off, and runs automatically when `navigator.onLine` becomes true.
async function syncNow() {
  if (syncing) return;
  syncing = true;
  const q = unsynced();
  const btn = $('#syNow');
  btn.disabled = true;
  btn.innerHTML = `${ic('refresh', 'spin')} ${t('sy_syncing')}`;
  for (let i = 0; i < q.length; i++) {
    await new Promise(r => setTimeout(r, Math.min(300, 1800 / q.length)));
    q[i].rec.synced = true;
    if ($('#syBar')) {
      $('#syBar').style.width = `${((i + 1) / q.length) * 100}%`;
      $('#syCount').textContent = q.length - i - 1;
      $('#syMsg').textContent = `${i + 1}/${q.length}`;
    }
  }
  TABLES.forEach(save);
  store.set('lastSync', Date.now());
  syncing = false;
  toast(t('sy_ok'), 'ok', 'cloud-check');
  if ((location.hash.slice(1) || 'today').startsWith('sync')) renderSync();
  renderNav();
}

// TODO(student): supervisor data from the server. Other LHWs' rows come from seedSummaries(); fetch real monthly summaries per LHW from the sync backend (and cache them here) instead.
/** Values for every LHW for a month: the active LHW live from this phone, others from synced summaries. */
function lhwValues(mk) {
  return lhws.map(l => {
    const live = l.id === profile.id;
    return { lhw: l, live, vals: live ? indicatorsFor(mk) : summaryFor(l.id, mk) };
  });
}

function indicatorCell(ind, v) {
  if (v == null) return '<td class="num muted">—</td>';
  if (ind.kind === 'count') return `<td class="num">${v}</td>`;
  const cls = indicatorCls(ind, v);
  return `<td class="num">${v}%<div class="bar"><i class="${cls}" data-grow="${Math.min(100, v)}%" style="width:0"></i></div></td>`;
}

function indicatorTable(mk) {
  const cols = lhwValues(mk);
  const head = cols.map(c => `<th class="num">${esc(c.lhw.name.split(' ')[0])}${c.live ? ` <span class="chip orange" style="padding:0 6px">${ic('zap')}</span>` : ''}</th>`).join('');
  const body = INDICATORS.map(ind => `<tr><td>${t(ind.key)}</td><td class="num muted">${ind.target != null ? (ind.lowerBetter ? '≤ ' : '≥ ') + ind.target + (ind.kind === 'pct' ? '%' : '') : '—'}</td>${cols.map(c => indicatorCell(ind, c.vals ? c.vals[ind.id] : null)).join('')}</tr>`).join('');
  return `<div class="tablewrap"><table class="ind"><thead><tr><th>${t('sv_indicator')}</th><th class="num">${t('sv_target')}</th>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function rankingRows(mk) {
  const ranked = lhwValues(mk).map(c => ({ ...c, score: c.vals ? indicatorScore(c.vals) : null })).sort((a, b) => (b.score ?? -1) - (a.score ?? -1));
  return ranked.map((c, i) => {
    const cls = c.score == null ? '' : c.score >= 85 ? 'green' : c.score >= 65 ? '' : 'red';
    return `<div class="r"><span class="chip ${i === 0 ? 'orange' : ''}">${i + 1}</span><div style="min-width:0"><div class="nm">${esc(c.lhw.name)} <span class="small muted" style="font-weight:400">${esc(c.lhw.code)}</span></div><div class="progress" style="height:10px;margin-top:4px"><i class="${cls}" data-grow="${c.score ?? 0}%" style="width:0"></i></div><div class="small muted">${c.live ? t('sv_live') : t('sv_synced')}</div></div><span class="score">${c.score ?? '—'}</span></div>`;
  }).join('');
}

function lhwRow(l) {
  const active = l.id === profile.id;
  return `<div class="row" style="flex-wrap:wrap"><div style="min-width:0;flex:1"><b>${esc(l.name)}</b> ${active ? `<span class="chip orange">${t('sv_active')}</span>` : ''}<div class="small muted">${esc(l.code)} · ${esc(l.village)}${l.phone ? ' · ' + esc(l.phone) : ''}</div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">${active ? '' : `<button class="btn teal sm" data-switch="${l.id}">${ic('user')} ${t('sv_switch')}</button>`}<button class="btn ghost sm" data-editlhw="${l.id}" aria-label="${t('edit')}">${ic('edit')}</button>${active ? '' : `<button class="btn danger sm" data-rmlhw="${l.id}" aria-label="${t('sv_remove')}">${ic('trash')}</button>`}</div></div>`;
}

function switchLhw(id) {
  const l = lhws.find(x => x.id === id);
  if (!l) return;
  profile = Object.assign({}, DEFAULT_PROFILE, l);
  store.set('profile', profile);
  toast(`${t('sv_switched')}: ${l.name}`, 'ok', 'user');
  renderNav();
  renderSupervisor();
}

function removeLhw(id) {
  if (id === profile.id) return toast(t('sv_cannotRemove'), 'bad');
  if (!confirm(t('sv_remove') + '?')) return;
  lhws = lhws.filter(l => l.id !== id);
  store.set('lhws', lhws);
  renderSupervisor();
}

  openSheet(html, s => {
    $('#lSave', s).onclick = () => {
      const name = $('#lName', s).value.trim();
      const code = $('#lCode', s).value.trim();
      if (!name || !code) return toast(t('ab_name') + ' / ' + t('ab_code'), 'bad');
      const rec = Object.assign(l || { id: 'l' + uid(), bhu: profile.bhu, rhc: profile.rhc, dhq: profile.dhq, otp: profile.otp, lhs: profile.lhs }, { name, code, village: $('#lVillage', s).value.trim(), phone: $('#lPhone', s).value.trim() });
      if (!l) lhws.push(rec);
      store.set('lhws', lhws);
      if (rec.id === profile.id) {
        profile = Object.assign({}, profile, rec);
        store.set('profile', profile);
        renderNav();
      }
      closeSheet();
      toast(t('sv_saved'), 'ok');
      renderSupervisor();
    };
  });
}

function openPinSheet() {
  const html = sheetHead(t('sv_changePin')) + field(t('sv_newPin'), `<input id="pNew" type="password" inputmode="numeric" maxlength="6" autocomplete="off">`) + `<div class="actions"><button class="btn block" id="pSave">${ic('key')} ${t('save')}</button></div>`;
  openSheet(html, s => {
    $('#pSave', s).onclick = () => {
      const pin = $('#pNew', s).value.trim();
      if (!/^\d{4,6}$/.test(pin)) return toast(t('sv_pinRule'), 'bad');
      store.set('pin', hashStr(pin));
      closeSheet();
      toast(t('sv_pinSaved'), 'ok', 'key');
    };
  });
}

// ---------- More (module hub for phones) ----------
/** Badge counts per module so the hub and the rail show what needs attention. */
function moduleBadges() {
  const fpDue = DB.women.filter(w => {
    const r = currentFp(w.id);
    return r && ['due', 'overdue'].includes(fpStatus(r).status);
  }).length;
  const nuDue = DB.children.filter(c => SUPPLEMENTS.some(s => ['due', 'overdue'].includes(suppStatus(c, s).status)) || latestNutrition(c.id)?.cls === 'sam').length;
  return {
    fp: fpDue,
    nutrition: nuDue,
    screening: DB.screenings.filter(s => s.referral && s.outcome === 'pending').length,
    supplies: SUPPLY_ITEMS.filter(i => stockStatus(i.id).status !== 'ok').length,
    nid: DB.nid.filter(k => k.status === 'active').length,
    vitals: DB.vitals.filter(e => e.status === 'recorded').length,
    sync: unsynced().length
  };
}

const MODULES = [
  { id: 'fp', icon: 'pill', cls: 'teal', ur: 'خاندانی منصوبہ بندی' },
  { id: 'nutrition', icon: 'leaf', cls: 'green', ur: 'غذائیت' },
  { id: 'screening', icon: 'clipboard', cls: 'orange', ur: 'ٹی بی اور ملیریا' },
  { id: 'supplies', icon: 'box', cls: 'teal', ur: 'سامان' },
  { id: 'nid', icon: 'droplet', cls: 'orange', ur: 'پولیو مہم' },
  { id: 'vitals', icon: 'file', cls: 'teal', ur: 'پیدائش و اموات' },
  { id: 'report', icon: 'bar-chart', cls: 'teal', ur: 'رپورٹ' },
  { id: 'sync', icon: 'refresh', cls: 'green', ur: 'سنک' },

function renderMore() {
  const badges = moduleBadges();
  const tile = m => {
    const n = badges[m.id];
    return `<a class="tile ${m.cls}" href="#${m.id}"><span class="ico">${ic(m.icon, 'lg')}</span><b>${L.en['nav_' + m.id]}</b><span class="ur">${esc(m.ur)}</span>${n ? `<span class="chip ${m.id === 'supplies' ? 'red' : 'orange'} n">${n}</span>` : ''}</a>`;
  };
  view.innerHTML = pagehead(t('mo_title'), t('mo_lead')) + `<div class="tiles stagger">${MODULES.map(tile).join('')}</div>`;
}

function profileCard() {
  const inp = (id, key, val, type = 'text') => field(t(key), `<input id="${id}" type="${type}" value="${esc(val || '')}">`);
  return `<div class="card"><h3>${ic('settings')} ${t('ab_profile')}</h3>
    <div class="cols">${inp('pfName', 'ab_name', profile.name)}${inp('pfCode', 'ab_code', profile.code)}</div>
    ${inp('pfVillage', 'ab_village', profile.village)}
    <div class="cols">${inp('pfBhu', 'ab_bhu', profile.bhu)}${inp('pfRhc', 'ab_rhc', profile.rhc)}${inp('pfDhq', 'ab_dhq', profile.dhq)}${inp('pfOtp', 'ab_otp', profile.otp)}${inp('pfLhs', 'ab_lhs', profile.lhs, 'tel')}</div>
    <div class="actions"><button class="btn" id="pfSave">${ic('check')} ${t('save')}</button></div></div>`;
}

function renderAbout() {
  const intro = lang === 'ur'
    ? 'پاکستان کی تقریباً ایک لاکھ لیڈی ہیلتھ ورکرز ماؤں اور بچوں کے وزٹ کاغذی رجسٹر میں لکھتی ہیں؛ خطرے کی علامات رہ جاتی ہیں، تاریخیں غلط نکلتی ہیں، ریفرل غیر رسمی ہوتے ہیں اور ماہانہ رپورٹ ہاتھ سے بنتی ہے۔ یہ ایپ فون پر، بغیر انٹرنیٹ، یہ سب کام اور خاندانی منصوبہ بندی، غذائیت، ٹی بی و ملیریا، سامان، پولیو مہم اور پیدائش و اموات کا ریکارڈ سنبھالتی ہے۔'
    : "Pakistan's ~100,000 Lady Health Workers record maternal and child visits in paper registers. Danger signs are missed, due dates are miscalculated, referrals are informal and the monthly report is compiled by hand. This offline-first app plans visits, flags danger signs automatically, prints referral slips, tracks the EPI card and growth, and covers family planning, nutrition, TB/malaria screening, kit supplies, polio campaigns and vital registration.";
  const todo = ([h, b, tag, where]) => `<div class="todo"><h4>${esc(h)} <span class="tag">${tag}</span></h4><div class="muted small">${esc(b)}</div><div class="small" style="margin-top:6px">${t('ab_start')}: <code>${esc(where)}</code></div></div>`;
  view.innerHTML = pagehead(t('ab_title')) + `<div class="two"><div class="stack">
    <div class="card"><h3>${ic('info')} LHW Field Visit Assistant</h3><p class="muted" style="margin:0 0 10px">${intro}</p>
      <p class="muted small" style="margin:0">Clinical rules: Naegele EDD (LMP + 280 d) · WHO 2016 eight ANC contacts + Pakistan MNCH four mandatory visits · pre-eclampsia (BP ≥ 140/90), anaemia (Hb &lt; 7 / &lt; 11), fundal height ±3 cm after 24 wk, fetal movement after 28 wk · WHO/IMNCI danger signs · Pakistan EPI 2024 schedule · weight-for-age as % of WHO median · MUAC SAM &lt; 11.5 / MAM &lt; 12.5 cm · simplified MEC family-planning wheel · TB/malaria symptom screens.</p>
      <div class="note warn" style="margin-top:10px">${ic('alert')} ${bi({ en: 'All thresholds, schedules and suitability rules in this template are illustrative training values. The programme’s official guidelines and clinical judgement at the facility override them.', ur: 'اس ایپ کی تمام حدیں، شیڈول اور اصول تربیتی مثال ہیں۔ پروگرام کی سرکاری ہدایات اور مرکز پر ڈاکٹر کا فیصلہ حتمی ہے۔' })}</div>

    ${profileCard()}</div>
    <div><h3 style="margin:0 0 10px;display:flex;gap:8px;align-items:center">${ic('code')} ${t('ab_todo')}</h3><div class="list stagger">${TODOS.map(todo).join('')}</div></div></div>`;
  $('#pfSave').onclick = saveProfile;
}

function saveProfile() {
  const val = id => $('#' + id).value.trim();
  profile = Object.assign({}, profile, { name: val('pfName') || DEFAULT_PROFILE.name, code: val('pfCode'), village: val('pfVillage'), bhu: val('pfBhu'), rhc: val('pfRhc'), dhq: val('pfDhq'), otp: val('pfOtp'), lhs: val('pfLhs') });
  store.set('profile', profile);
  // keep the roster entry for the active LHW in step with the profile
  const i = lhws.findIndex(l => l.id === profile.id);
  if (i >= 0) lhws[i] = Object.assign({}, lhws[i], profile);
  else lhws.push(Object.assign({}, profile));
  store.set('lhws', lhws);
  toast(t('ab_saved'), 'ok');
  renderNav();
}

// ---------- nav / router / boot ----------
// Rail (desktop) groups every module; the phone bottom bar keeps five daily tabs plus "More".
const NAV_GROUPS = [
  ['sec_daily', [['today', 'calendar'], ['households', 'home'], ['pregnancy', 'heart'], ['children', 'baby']]],
  ['sec_prog', [['fp', 'pill'], ['nutrition', 'leaf'], ['screening', 'clipboard'], ['supplies', 'box'], ['nid', 'droplet'], ['vitals', 'file']]],
  ['sec_admin', [['report', 'bar-chart'], ['sync', 'refresh'], ['supervisor', 'lock'], ['about', 'info']]]
];
const BOTTOM_NAV = [['today', 'calendar'], ['households', 'home'], ['pregnancy', 'heart'], ['children', 'baby'], ['report', 'bar-chart'], ['more', 'grid']];
const MORE_PAGES = ['fp', 'nutrition', 'screening', 'supplies', 'nid', 'vitals', 'sync', 'supervisor', 'about', 'more'];
const navKey = p => (p === 'pregnancy' ? 'nav_pregnancies' : 'nav_' + p);

function renderNav() {
  const cur = (location.hash.slice(1) || 'today').split('/')[0];
  const mod = moduleBadges();
  const od = planner().filter(i => i.kind === 'overdue' || i.kind === 'alert').length;
  const count = p => (p === 'today' ? od : mod[p] || 0);
  const badge = p => (count(p) ? `<span class="n">${count(p)}</span>` : '');
  $('#railnav').innerHTML = NAV_GROUPS.map(([sec, items]) => `<div class="sec">${t(sec)}</div>` + items.map(([p, i]) => `<a class="nav ${cur === p ? 'on' : ''}" href="#${p}"><span class="ic">${ic(i)}</span>${t(navKey(p))}${badge(p)}</a>`).join('')).join('');
  const moreCount = mod.sync + mod.supplies;
  $('#bottomnav').innerHTML = BOTTOM_NAV.map(([p, i]) => {
    const on = cur === p || (p === 'more' && MORE_PAGES.includes(cur));
    const n = p === 'more' ? (moreCount ? `<span class="n">${moreCount}</span>` : '') : p === 'today' ? badge('today') : '';
    return `<a class="${on ? 'on' : ''}" href="#${p}"><span class="ic">${ic(i)}</span>${t(navKey(p))}${n}</a>`;
  }).join('');
  $('#profileBox').innerHTML = `<b>${esc(profile.name)}</b>${esc(profile.code)}<br>${esc(profile.village)}`;
}

function route() {
  closeSheet(true);
  const [page, id, sub, vid] = (location.hash.slice(1) || 'today').split('/');
  renderNav();
  const routes = {
    today: renderToday,
    households: () => renderHouseholds(id),
    pregnancy: () => renderPregnancies(id, sub, vid),
    children: () => renderChildren(id),
    fp: () => renderFp(id),
    nutrition: () => renderNutrition(id, sub, vid),
    screening: () => renderScreening(id, sub),
    supplies: () => renderSupplies(id),
    nid: () => renderNid(id),
    vitals: renderVitals,
    report: renderReport,
    sync: renderSync,
    supervisor: renderSupervisor,
    more: renderMore,
    about: renderAbout
  };
  (routes[page] || renderToday)();
  animateIn(view);
  window.scrollTo({ top: 0 });
}

function applyLang() {
  document.documentElement.lang = lang;
  store.set('lang', lang);
  $$('[data-i18n]').forEach(el => (el.textContent = t(el.dataset.i18n)));
  $$('#langBtn,#langBtn2').forEach(b => (b.textContent = lang === 'en' ? 'اردو' : 'English'));
  route();
}

$$('#langBtn,#langBtn2').forEach(b => (b.onclick = () => {
  lang = lang === 'en' ? 'ur' : 'en';
  applyLang();
}));
window.addEventListener('hashchange', route);
load();
applyLang();
</script>
