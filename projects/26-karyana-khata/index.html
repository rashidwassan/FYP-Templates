<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karyana Khata — Shop Inventory &amp; Udhaar Ledger | FYP Template</title>
<meta name="description" content="Karyana Khata: an Urdu-first shop inventory and udhaar ledger for Pakistani grocery stores. Quick-sale POS with 58 mm receipts, loose-weight stock with average cost, customer credit with ageing and WhatsApp reminders, suppliers and reorder suggestions, a daily cash book with day close, reports with month-end profit and loss, owner PIN and helper mode. Single-file FYP template.">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#7d1b1b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- tokens: red cloth-bound khata, ruled cream paper, ink blue, ledger green ---------- */
:root {
  --binding: #7d1b1b;
  --binding-2: #9a2622;
  --binding-deep: #561010;
  --thread: #e2c27c;
  --paper: #f6eed8;
  --paper-2: #ede1c2;
  --card: #fffaee;
  --card-2: #fbf3df;
  --rule: rgba(36, 78, 152, .12);
  --margin: rgba(186, 38, 38, .42);
  --ink: #1b2946;
  --ink-2: #3f4d72;
  --muted: #776f5b;
  --blue: #1f4f9c;
  --blue-soft: #e2eaf7;
  --green: #1b6a3f;
  --green-soft: #dbeedd;
  --red: #b3261e;
  --red-soft: #f7ded9;
  --amber: #a86c12;
  --amber-soft: #f9ecd0;
  --line: #e0d1a8;
  --line-2: #cdb987;
  --shadow: 0 1px 0 rgba(86, 16, 16, .05), 0 12px 26px -20px rgba(60, 30, 10, .55);
  --shadow-lg: 0 24px 60px -24px rgba(40, 18, 6, .55);
  --radius: 14px;
  --radius-sm: 10px;
  --font: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-ur: "Noto Nastaliq Urdu", "Hanken Grotesk", serif;
  --top-h: 58px;
  --tab-h: 68px;
  --spine-w: 252px;
  --fs: 15px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --dur: .35s;
}
html[data-theme="night"] {
  --paper: #16140f;
  --paper-2: #201d16;
  --card: #232019;
  --card-2: #2a261e;
  --rule: rgba(140, 170, 230, .07);
  --margin: rgba(220, 90, 80, .32);
  --ink: #f0e7d0;
  --ink-2: #cfc4a8;
  --muted: #a69d86;
  --blue: #93b6f2;
  --blue-soft: #1c2940;
  --green: #74cc96;
  --green-soft: #15301f;
  --red: #f39184;
  --red-soft: #3b1a16;
  --amber: #e9b85d;
  --amber-soft: #392b12;
  --line: #3a3428;
  --line-2: #4c4433;
  --binding: #641616;
  --binding-2: #76201c;
  --binding-deep: #430d0d;
  --shadow: 0 12px 26px -20px rgba(0, 0, 0, .8);
}
html[data-size="lg"] { --fs: 17px; }
html[data-size="xl"] { --fs: 19px; }

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { font-size: var(--fs); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: var(--font);
  line-height: 1.5;
  background-color: var(--paper);
  background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px);
  overflow-x: hidden;
}
html[lang="ur"] body { font-family: var(--font-ur); line-height: 2; font-size: 1.02rem; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; font-weight: 800; letter-spacing: -.01em; }
html[lang="ur"] h1, html[lang="ur"] h2, html[lang="ur"] h3, html[lang="ur"] h4 { font-weight: 700; line-height: 1.9; letter-spacing: 0; }
p { margin: 0 0 .6em; }
a { color: var(--blue); }
code, kbd { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: .86em; }
.num, .money, .kbd, code, input[type="number"], input[inputmode="decimal"], input[inputmode="numeric"] {
  font-family: var(--font);
  font-variant-numeric: tabular-nums lining-nums;
}
html[lang="ur"] .num, html[lang="ur"] .money { line-height: 1.4; }
.money { font-weight: 700; white-space: nowrap; }
.dr { color: var(--red); }
.cr { color: var(--green); }
.muted { color: var(--muted); }
.small { font-size: .84rem; }
.tiny { font-size: .74rem; }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 12px; }
.mt { margin-top: 14px; }
.mb { margin-bottom: 14px; }
.nowrap { white-space: nowrap; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
.skip { position: absolute; inset-inline-start: 12px; top: -60px; z-index: 90; background: var(--card); padding: 8px 14px; border-radius: 10px; }
.skip:focus { top: 10px; }
html[dir="rtl"] .flip { transform: scaleX(-1); }

/* ---------- icons ---------- */
.ic { width: 1.1em; height: 1.1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; flex: none; }
.ic.lg { width: 1.5em; height: 1.5em; }
.ic.xl { width: 2.2em; height: 2.2em; }

/* ---------- shell: spine (desktop sidebar), top bar, page, bottom tab bar ---------- */
.cloth {
  background-color: var(--binding);
  background-image:
    repeating-linear-gradient(45deg, rgba(255, 255, 255, .035) 0 2px, transparent 2px 5px),
    repeating-linear-gradient(-45deg, rgba(0, 0, 0, .07) 0 2px, transparent 2px 5px),
    linear-gradient(180deg, var(--binding-2), var(--binding) 40%, var(--binding-deep));
  color: #fbefe0;
}
.spine { display: none; }
.page { position: relative; min-height: 100vh; }
.page::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  inset-inline-start: 7px;
  width: 5px;
  border-inline: 1px solid var(--margin);
  pointer-events: none;
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  height: var(--top-h);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px 0 12px;
  box-shadow: 0 6px 18px -12px rgba(40, 10, 10, .7);
}
.topbar::after {
  content: "";
  position: absolute;
  inset-inline: 0;
  bottom: 4px;
  border-bottom: 1.5px dashed rgba(226, 194, 124, .55);
  pointer-events: none;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; color: inherit; text-decoration: none; }
.brand .mark {
  width: 36px;
  height: 36px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, .1);
  border: 1px solid rgba(226, 194, 124, .55);
  flex: none;
}
.brand .mark svg { width: 24px; height: 24px; }
.brand b { display: block; font-size: 1.02rem; font-weight: 800; line-height: 1.15; white-space: nowrap; }
.brand small { display: block; font-size: .72rem; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
html[lang="ur"] .brand b { font-weight: 700; line-height: 1.6; font-size: .98rem; }
html[lang="ur"] .brand small { line-height: 1.7; }
.topbar .title { flex: 1; min-width: 0; }
.topbar .title h1 { font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: none; }
.top-actions { display: flex; align-items: center; gap: 4px; }
.tbtn {
  position: relative;
  min-width: 40px;
  height: 40px;
  border-radius: 11px;
  border: 1px solid rgba(255, 255, 255, .18);
  background: rgba(255, 255, 255, .08);
  color: #fbefe0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 0 9px;
  cursor: pointer;
  transition: background .15s, transform .15s var(--ease);
}
.tbtn:hover { background: rgba(255, 255, 255, .16); }
.tbtn:active { transform: scale(.96); }
.tbtn .badge {
  position: absolute;
  top: -5px;
  inset-inline-end: -4px;
  min-width: 18px;
  height: 18px;
  border-radius: 9px;
  background: var(--thread);
  color: #3b2507;
  font: 800 .66rem/18px var(--font);
  padding: 0 4px;
  text-align: center;
}
.tbtn.lang { font-weight: 700; font-size: .86rem; }
html[lang="en"] .tbtn.lang { font-family: var(--font-ur); line-height: 1; padding-bottom: 3px; }
.role-chip { font-size: .78rem; font-weight: 700; }
.role-chip.helper { background: var(--thread); color: #3b2507; border-color: transparent; }
.role-chip .lbl { display: none; }
.daybar {
  margin: 10px 14px 0;
  padding: 8px 12px;
  border-radius: 10px;
  background: var(--amber-soft);
  border: 1px solid color-mix(in srgb, var(--amber) 35%, transparent);
  color: var(--ink);
  font-size: .86rem;
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.daybar .btn { margin-inline-start: auto; }
main#view { padding: 14px 14px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom)); max-width: 1240px; margin: 0 auto; outline: none; }
.tabbar {
  position: fixed;
  inset-inline: 0;
  bottom: 0;
  z-index: 35;
  height: calc(var(--tab-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--card);
  border-top: 1px solid var(--line);
  box-shadow: 0 -10px 24px -18px rgba(60, 30, 10, .5);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  align-items: stretch;
}
.tabbar a, .tabbar button {
  appearance: none;
  border: 0;
  background: none;
  color: var(--muted);
  text-decoration: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-size: .72rem;
  font-weight: 700;
  cursor: pointer;
  position: relative;
  min-height: 44px;
}
html[lang="ur"] .tabbar a, html[lang="ur"] .tabbar button { font-size: .74rem; line-height: 1.5; font-weight: 600; gap: 0; }
.tabbar .ic { width: 1.45em; height: 1.45em; }
.tabbar .on { color: var(--blue); }
.tabbar .on::before {
  content: "";
  position: absolute;
  top: 0;
  width: 34px;
  height: 3px;
  border-radius: 0 0 3px 3px;
  background: var(--blue);
}
.tabbar .sale-tab { color: var(--binding); }
html[data-theme="night"] .tabbar .sale-tab { color: var(--thread); }
.tabbar .sale-tab .disc {
  width: 58px;
  height: 58px;
  margin-top: -26px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: #fff6e6;
  box-shadow: 0 0 0 4px var(--card), 0 10px 20px -8px rgba(86, 16, 16, .7);
  outline: 1.5px dashed rgba(226, 194, 124, .8);
  outline-offset: -6px;
  transition: transform .2s var(--ease);
}
.tabbar .sale-tab:active .disc { transform: scale(.94); }
.tabbar .sale-tab .ic { width: 1.6em; height: 1.6em; }
.tabbar .sale-tab.on::before { display: none; }
.tabbar .tdot {
  position: absolute;
  top: 6px;
  inset-inline-end: calc(50% - 20px);
  min-width: 16px;
  height: 16px;
  border-radius: 8px;
  background: var(--red);
  color: #fff;
  font: 800 .62rem/16px var(--font);
  padding: 0 4px;
}

/* ---------- desktop: binding spine on the inline-start side ---------- */
@media (min-width: 1024px) {
  .spine {
    display: flex;
    flex-direction: column;
    position: fixed;
    inset-block: 0;
    inset-inline-start: 0;
    width: var(--spine-w);
    z-index: 40;
    padding: 18px 14px 14px;
    overflow-y: auto;
  }
  .spine::after {
    content: "";
    position: absolute;
    inset-block: 0;
    inset-inline-end: 9px;
    border-inline-end: 1.5px dashed rgba(226, 194, 124, .5);
    pointer-events: none;
  }
  .spine .brand { margin: 0 4px 18px; }
  .spine .brand small { max-width: 170px; }
  .snav { display: flex; flex-direction: column; gap: 2px; }
  .snav .grp { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; opacity: .6; margin: 12px 10px 4px; font-weight: 700; }
  html[lang="ur"] .snav .grp { letter-spacing: 0; font-size: .74rem; text-transform: none; }
  .snav a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 10px;
    color: #f7e7d3;
    text-decoration: none;
    font-weight: 600;
    font-size: .92rem;
    transition: background .15s, transform .15s var(--ease);
    margin-inline-end: 14px;
  }
  html[lang="ur"] .snav a { padding: 4px 10px; }
  .snav a:hover { background: rgba(255, 255, 255, .08); }
  .snav a.on { background: var(--card); color: var(--binding); box-shadow: 0 6px 14px -10px rgba(0, 0, 0, .6); }
  .snav a .cnt { margin-inline-start: auto; font: 800 .7rem/1 var(--font); background: var(--thread); color: #3b2507; border-radius: 9px; padding: 3px 6px; }
  .snav a.on .cnt { background: var(--red-soft); color: var(--red); }
  .snav a.sale { background: rgba(226, 194, 124, .18); border: 1px dashed rgba(226, 194, 124, .6); margin-bottom: 6px; }
  .snav a.sale.on { background: var(--card); }
  .spine-foot { margin-top: auto; padding: 12px 6px 0; font-size: .74rem; opacity: .75; }
  .page { margin-inline-start: var(--spine-w); }
  .page::before { inset-inline-start: 22px; }
  .topbar { background: none; color: var(--ink); box-shadow: none; padding: 0 28px 0 40px; height: 64px; border-bottom: 1px solid var(--line); background-color: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(6px); }
  .topbar::after { display: none; }
  .topbar .brand { display: none; }
  .topbar .title h1 { display: block; font-size: 1.25rem; }
  html[lang="ur"] .topbar .title h1 { font-size: 1.2rem; }
  .tbtn { color: var(--ink); background: var(--card); border-color: var(--line); }
  .tbtn:hover { background: var(--card-2); }
  .role-chip .lbl { display: inline; }
  .role-chip.helper { background: var(--amber-soft); color: var(--amber); border-color: var(--amber); }
  .tabbar { display: none; }
  .daybar { margin: 14px 28px 0 40px; }
  main#view { padding: 22px 28px 48px 40px; }
}

/* ---------- buttons, inputs, chips ---------- */
.btn {
  appearance: none;
  border: 1px solid transparent;
  background: var(--blue);
  color: #fff;
  min-height: 44px;
  padding: 0 16px;
  border-radius: 12px;
  font-weight: 700;
  font-size: .93rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
  transition: transform .15s var(--ease), box-shadow .15s var(--ease), background .15s, opacity .15s;
}
html[lang="ur"] .btn { font-weight: 600; line-height: 1.8; padding-bottom: 2px; }
.btn:hover { transform: translateY(-1px); box-shadow: 0 8px 18px -12px rgba(20, 40, 90, .8); }
.btn:active { transform: translateY(0) scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.btn.red { background: var(--red); }
.btn.binding { background: var(--binding); }
.btn.green { background: var(--green); }
.btn.ghost { background: var(--card); color: var(--ink); border-color: var(--line-2); }
.btn.ghost:hover { background: var(--card-2); }
.btn.sm { min-height: 36px; padding: 0 11px; font-size: .84rem; border-radius: 10px; }
.btn.lg { min-height: 54px; font-size: 1.05rem; padding: 0 22px; border-radius: 14px; }
.btn.block { width: 100%; }
.btn.icon { padding: 0; width: 44px; }
.btn.sm.icon { width: 36px; }
.ibtn {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--card);
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: inline-grid;
  place-items: center;
  color: var(--ink-2);
  cursor: pointer;
  flex: none;
}
.ibtn:hover { background: var(--card-2); }
label.fld { display: block; }
label.fld > span { display: block; font-size: .8rem; font-weight: 700; color: var(--ink-2); margin-bottom: 4px; }
html[lang="ur"] label.fld > span { font-weight: 600; font-size: .84rem; }
.inp, select.inp, textarea.inp {
  width: 100%;
  min-height: 44px;
  padding: 8px 12px;
  border-radius: 11px;
  border: 1px solid var(--line-2);
  background: var(--card);
  color: var(--ink);
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
html[lang="ur"] .inp { line-height: 1.9; padding-top: 4px; padding-bottom: 4px; }
.inp:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.inp.money-in { font-family: var(--font); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.1rem; }
.inp.bad { border-color: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
textarea.inp { min-height: 80px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: end; }
@media (max-width: 600px) { .hide-sm { display: none; } }
.hint { font-size: .78rem; color: var(--muted); margin-top: 3px; }
.err { font-size: .8rem; color: var(--red); margin-top: 4px; font-weight: 600; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  appearance: none;
  border: 1px solid var(--line-2);
  background: var(--card);
  color: var(--ink-2);
  border-radius: 999px;
  min-height: 36px;
  padding: 0 13px;
  font-size: .82rem;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: background .15s, color .15s, border-color .15s;
}
html[lang="ur"] .chip { font-weight: 600; line-height: 1.8; }
.chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
a.chip { text-decoration: none; }
.chip .n { font-family: var(--font); font-size: .72rem; opacity: .75; }
.seg { display: inline-flex; background: var(--paper-2); border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button {
  border: 0;
  background: none;
  min-height: 38px;
  padding: 0 12px;
  border-radius: 9px;
  font-weight: 700;
  font-size: .84rem;
  cursor: pointer;
  color: var(--ink-2);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
html[lang="ur"] .seg button { font-weight: 600; }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 2px 6px -3px rgba(0, 0, 0, .35); }
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: .72rem;
  font-weight: 700;
  border-radius: 999px;
  padding: 1px 8px;
  background: var(--paper-2);
  color: var(--ink-2);
  white-space: nowrap;
}
html[lang="ur"] .tag { font-weight: 600; line-height: 1.8; }
.tag.red { background: var(--red-soft); color: var(--red); }
.tag.green { background: var(--green-soft); color: var(--green); }
.tag.amber { background: var(--amber-soft); color: var(--amber); }
.tag.blue { background: var(--blue-soft); color: var(--blue); }
.switch { position: relative; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; min-height: 40px; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { width: 44px; height: 26px; border-radius: 13px; background: var(--line-2); position: relative; transition: background .2s; flex: none; }
.switch .track::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s var(--ease); box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }
.switch input:checked + .track { background: var(--green); }
.switch input:checked + .track::after { transform: translateX(18px); }
html[dir="rtl"] .switch input:checked + .track::after { transform: translateX(-18px); }
.switch input:focus-visible + .track { outline: 3px solid var(--blue); outline-offset: 2px; }

/* ---------- cards ("slips" on the ruled page), KPIs, lists ---------- */
.slip {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px;
  min-width: 0;
}
.slip.tight { padding: 10px; }
.slip h3 { font-size: 1rem; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.slip h3 .ic { color: var(--binding); }
html[data-theme="night"] .slip h3 .ic { color: var(--thread); }
.pagehead { display: flex; align-items: flex-end; gap: 10px; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; }
.pagehead h2 { font-size: 1.35rem; }
.pagehead p { margin: 2px 0 0; color: var(--muted); font-size: .88rem; }
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.kpi {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
  box-shadow: var(--shadow);
  min-width: 0;
  position: relative;
  overflow: hidden;
}
.kpi .k { font-size: .76rem; font-weight: 700; color: var(--muted); display: flex; gap: 6px; align-items: center; }
html[lang="ur"] .kpi .k { font-weight: 600; font-size: .8rem; }
.kpi .v { font: 800 1.35rem/1.25 var(--font); font-variant-numeric: tabular-nums; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .s { font-size: .74rem; color: var(--muted); margin-top: 2px; }
.kpi.red .v { color: var(--red); }
.kpi.green .v { color: var(--green); }
.kpi.blue .v { color: var(--blue); }
.kpi::after { content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: 3px; background: var(--line-2); }
.kpi.red::after { background: var(--red); }
.kpi.green::after { background: var(--green); }
.kpi.blue::after { background: var(--blue); }
.list { display: flex; flex-direction: column; }
.lrow {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 4px;
  border-bottom: 1px solid var(--rule);
  min-height: 52px;
  color: inherit;
  text-decoration: none;
  cursor: pointer;
  transition: background .15s;
  border-radius: 8px;
}
.lrow:last-child { border-bottom: 0; }
.lrow:hover { background: var(--card-2); }
.lrow .av {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: var(--paper-2);
  display: grid;
  place-items: center;
  font: 800 .85rem var(--font);
  color: var(--ink-2);
  flex: none;
}
.lrow .main { flex: 1; min-width: 0; }
.lrow .main b { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
html[lang="ur"] .lrow .main b { font-weight: 600; }
.lrow .main .sub { font-size: .78rem; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.lrow .end { text-align: end; flex: none; }
.empty { text-align: center; padding: 30px 12px; color: var(--muted); }
.empty .ic { width: 2.4em; height: 2.4em; color: var(--line-2); display: block; margin: 0 auto 8px; }
.cols { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 760px) {
  .kpis { grid-template-columns: repeat(4, 1fr); }
  .cols.two { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
  .cols.half { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
}
.bar { height: 8px; border-radius: 4px; background: var(--paper-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 4px; background: var(--blue); width: 0; transition: width .6s var(--ease); }
.bar.red > i { background: var(--red); }
.bar.amber > i { background: var(--amber); }
.bar.green > i { background: var(--green); }
.qa { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.qa button {
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 14px;
  min-height: 78px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-weight: 700;
  font-size: .8rem;
  cursor: pointer;
  color: var(--ink);
  padding: 8px 4px;
  text-align: center;
  transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s;
}
html[lang="ur"] .qa button { font-weight: 600; line-height: 1.7; }
.qa button:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--line-2); }
.qa button .ic { width: 1.6em; height: 1.6em; }
.qa .red .ic { color: var(--red); }
.qa .green .ic { color: var(--green); }
.qa .blue .ic { color: var(--blue); }
.qa .amber .ic { color: var(--amber); }
@media (min-width: 760px) { .qa { grid-template-columns: repeat(6, 1fr); } }

/* ---------- ledger table: rows sit on the paper's ruling ---------- */
.ledger { width: 100%; border-collapse: collapse; font-size: .9rem; }
.ledger th {
  text-align: start;
  font-size: .72rem;
  text-transform: uppercase;
  letter-spacing: .05em;
  color: var(--muted);
  font-weight: 800;
  padding: 8px 8px;
  border-bottom: 2px solid var(--margin);
  white-space: nowrap;
}
html[lang="ur"] .ledger th { text-transform: none; letter-spacing: 0; font-size: .8rem; font-weight: 600; }
.ledger td { padding: 8px 8px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
.ledger tr:hover td { background: color-mix(in srgb, var(--card-2) 70%, transparent); }
.ledger .r { text-align: end; }
.ledger td.r { font-family: var(--font); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ledger tfoot td { font-weight: 800; border-top: 2px solid var(--ink); border-bottom: 3px double var(--ink); }
.ledger .dim td { color: var(--muted); }
.ledger .void td { text-decoration: line-through; color: var(--muted); }
.tablewrap { overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch; }

/* ---------- quick sale (POS) ---------- */
.pos { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.pos-search { display: flex; gap: 8px; }
.searchbox { position: relative; flex: 1; min-width: 0; }
.searchbox .ic { position: absolute; inset-inline-start: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.searchbox .inp { padding-inline-start: 38px; min-height: 48px; font-size: 1rem; }
.suggest { margin-top: 6px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.tile {
  appearance: none;
  position: relative;
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 14px;
  padding: 9px 9px 8px;
  min-height: 96px;
  text-align: start;
  cursor: pointer;
  color: var(--ink);
  display: flex;
  flex-direction: column;
  gap: 4px;
  box-shadow: var(--shadow);
  transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s;
}
.tile:hover { transform: translateY(-2px); border-color: var(--line-2); }
.tile:active { transform: scale(.97); }
.tile .nm { font-weight: 700; font-size: .84rem; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
html[lang="ur"] .tile .nm { font-weight: 600; font-size: .86rem; line-height: 1.85; -webkit-line-clamp: 2; }
.tile .pr { margin-top: auto; font: 800 .9rem/1.2 var(--font); font-variant-numeric: tabular-nums; color: var(--blue); }
.tile .pr small { font-weight: 600; color: var(--muted); font-size: .7rem; }
.tile .st { font-size: .7rem; color: var(--muted); font-family: var(--font); }
.tile .st.low { color: var(--red); font-weight: 700; }
.tile .incart {
  position: absolute;
  top: -7px;
  inset-inline-end: -6px;
  min-width: 24px;
  height: 24px;
  border-radius: 12px;
  background: var(--binding);
  color: #fff;
  font: 800 .72rem/24px var(--font);
  text-align: center;
  padding: 0 6px;
  animation: pop .25s var(--ease) both;
}
.tile.loose::before {
  content: "";
  position: absolute;
  top: 8px;
  inset-inline-end: 8px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--amber);
}
.tile.out { opacity: .5; }
.cart { display: none; }
.cart-lines { display: flex; flex-direction: column; }
.cline { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); align-items: center; }
.cline .nm { font-weight: 700; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
html[lang="ur"] .cline .nm { font-weight: 600; }
.cline .meta { font-size: .76rem; color: var(--muted); font-family: var(--font); }
.cline .amt { font: 800 .95rem var(--font); font-variant-numeric: tabular-nums; text-align: end; }
.cline .ctl { display: flex; gap: 6px; align-items: center; grid-column: 1 / -1; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; }
.stepper button { border: 0; background: var(--card-2); width: 38px; height: 36px; cursor: pointer; color: var(--ink); display: grid; place-items: center; }
.stepper .q { min-width: 72px; text-align: center; font: 700 .86rem var(--font); font-variant-numeric: tabular-nums; padding: 0 6px; background: var(--card); border: 0; height: 36px; cursor: pointer; color: var(--ink); }
.totals { margin-top: 10px; font-size: .9rem; }
.totals .tr { display: flex; justify-content: space-between; padding: 3px 0; gap: 10px; }
.totals .tr b, .totals .tr .money { font-family: var(--font); font-variant-numeric: tabular-nums; }
.totals .grand { font-size: 1.25rem; font-weight: 800; border-top: 2px solid var(--ink); margin-top: 6px; padding-top: 8px; }
.cartbar {
  position: fixed;
  inset-inline: 10px;
  bottom: calc(var(--tab-h) + 10px + env(safe-area-inset-bottom));
  z-index: 34;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 8px 8px 14px;
  border-radius: 16px;
  background: var(--ink);
  color: var(--paper);
  box-shadow: var(--shadow-lg);
  animation: fadeUp .3s var(--ease) both;
}
.cartbar .info { flex: 1; min-width: 0; cursor: pointer; background: none; border: 0; color: inherit; text-align: start; padding: 0; }
.cartbar .info b { font: 800 1.15rem var(--font); font-variant-numeric: tabular-nums; display: block; }
.cartbar .info span { font-size: .76rem; opacity: .8; }
.cartbar .btn { background: var(--thread); color: #3b2507; }
@media (min-width: 1024px) {
  .pos { grid-template-columns: minmax(0, 1fr) 380px; align-items: start; }
  .cart { display: block; position: sticky; top: 84px; max-height: calc(100vh - 104px); overflow: auto; }
  .cartbar { display: none; }
}
/* phone-style keypads stay 1-2-3 left to right in Urdu too */
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; direction: ltr; }
.keypad button {
  min-height: 56px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--card);
  font: 800 1.35rem var(--font);
  cursor: pointer;
  color: var(--ink);
  display: grid;
  place-items: center;
  transition: transform .12s var(--ease), background .12s;
}
.keypad button:active { transform: scale(.95); background: var(--paper-2); }
.qtyshow { text-align: center; padding: 6px 0 10px; }
.qtyshow .big { font: 800 2.2rem/1.1 var(--font); font-variant-numeric: tabular-nums; }
.qtyshow .sub { color: var(--muted); font-size: .86rem; }
.paymethods { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.paym {
  border: 2px solid var(--line);
  background: var(--card);
  border-radius: 14px;
  min-height: 64px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  cursor: pointer;
  font-weight: 700;
  color: var(--ink);
  text-align: start;
}
html[lang="ur"] .paym { font-weight: 600; }
.paym .ic { width: 1.5em; height: 1.5em; }
.paym.on { border-color: var(--blue); background: var(--blue-soft); }
.paym.udhaar.on { border-color: var(--red); background: var(--red-soft); }
.notes { display: flex; gap: 6px; flex-wrap: wrap; }
.change { font: 800 1.4rem var(--font); font-variant-numeric: tabular-nums; color: var(--green); }

/* ---------- receipt (screen preview + 58 mm print) ---------- */
.receipt {
  width: 232px;
  max-width: 100%;
  margin: 0 auto;
  background: #fffef9;
  color: #111;
  padding: 14px 12px 18px;
  font-family: var(--font);
  font-size: 11.5px;
  line-height: 1.35;
  box-shadow: 0 10px 30px -18px rgba(0, 0, 0, .6);
  position: relative;
}
.receipt::after {
  content: "";
  position: absolute;
  inset-inline: 0;
  bottom: -6px;
  height: 6px;
  background: linear-gradient(-45deg, transparent 4px, #fffef9 0) 0 0 / 8px 6px repeat-x, linear-gradient(45deg, transparent 4px, #fffef9 0) 0 0 / 8px 6px repeat-x;
}
.receipt .c { text-align: center; }
.receipt .shop { font-size: 14px; font-weight: 800; }
.receipt .ur { font-family: var(--font-ur); line-height: 1.9; font-size: 11px; }
.receipt hr { border: 0; border-top: 1px dashed #777; margin: 6px 0; }
.receipt table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.receipt td { padding: 1px 0; vertical-align: top; }
.receipt td.r { text-align: end; white-space: nowrap; padding-inline-start: 6px; }
.receipt .it { font-weight: 700; }
.receipt .q { color: #444; font-size: 10.5px; }
.receipt .tot td { font-weight: 800; font-size: 13px; }
.receipt .foot { text-align: center; margin-top: 8px; font-size: 10.5px; }
.receipt-wrap { background: var(--paper-2); border-radius: 14px; padding: 16px 8px; }

/* ---------- inventory ---------- */
.stockrow .main b small { font-weight: 500; color: var(--muted); }
.qtybadge { font: 800 .92rem var(--font); font-variant-numeric: tabular-nums; }
.qtybadge.low { color: var(--red); }
.qtybadge.zero { color: var(--red); text-decoration: underline wavy; }
.minibar { width: 64px; height: 5px; border-radius: 3px; background: var(--paper-2); overflow: hidden; margin-top: 4px; margin-inline-start: auto; }
.minibar i { display: block; height: 100%; background: var(--green); }
.minibar.low i { background: var(--red); }
.calc { font-family: var(--font); font-size: .82rem; background: var(--paper-2); border-radius: 10px; padding: 10px 12px; line-height: 1.6; font-variant-numeric: tabular-nums; }
.calc b { color: var(--blue); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.fact { background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.fact .k { font-size: .72rem; color: var(--muted); font-weight: 700; }
html[lang="ur"] .fact .k { font-weight: 600; }
.fact .v { font: 800 1rem var(--font); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (min-width: 760px) { .facts { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

/* ---------- udhaar: customer header, ageing, risk ---------- */
.custhead { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.custhead .av { width: 54px; height: 54px; border-radius: 16px; background: var(--paper-2); display: grid; place-items: center; font: 800 1.1rem var(--font); color: var(--binding); flex: none; border: 1px dashed var(--line-2); }
.bigbal { font: 800 1.9rem/1.1 var(--font); font-variant-numeric: tabular-nums; }
.bigbal.dr { color: var(--red); }
.bigbal.cr { color: var(--green); }
.ageing { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--paper-2); }
.ageing i { display: block; height: 100%; transition: width .6s var(--ease); }
.ageing .a0 { background: #6a9fd8; }
.ageing .a1 { background: #d9a441; }
.ageing .a2 { background: #d0702f; }
.ageing .a3 { background: #a3221f; }
.agelegend { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 4px 14px; margin-top: 8px; font-size: .78rem; }
.agelegend span { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
.agelegend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.agelegend em { font-style: normal; display: flex; align-items: center; gap: 6px; }
@media (max-width: 600px) { .ledger .lnote { display: none; } }
.searchbox.grow { min-width: 180px; }
.gotgave { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.gotgave .btn { min-height: 54px; font-size: 1rem; }
.risk { display: inline-flex; align-items: center; gap: 4px; }

/* ---------- cash book: denominations ---------- */
.denoms { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.denom { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 6px; align-items: center; background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; min-width: 0; }
.denom b { font: 800 .9rem var(--font); }
.denom .inp { min-height: 36px; padding: 4px 6px; text-align: center; font-family: var(--font); min-width: 0; }
.denom span { font: 700 .78rem var(--font); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 44px; text-align: end; }
.diffbox { border-radius: 12px; padding: 12px; text-align: center; font-weight: 700; }
.diffbox.ok { background: var(--green-soft); color: var(--green); }
.diffbox.bad { background: var(--red-soft); color: var(--red); }
.diffbox .money { font-size: 1.4rem; display: block; }
.diffbox .sub { display: block; font-size: 1.05rem; margin-top: 2px; }
@media (min-width: 760px) { .denoms { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* ---------- charts (hand-coded SVG) ---------- */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font: 600 10.5px var(--font); fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart .grid { stroke: var(--rule); stroke-width: 1; }
.chart .cbar { fill: var(--blue); opacity: .88; transition: opacity .15s; }
.chart .cbar:hover { opacity: 1; }
.chart rect.cbar { transform-box: fill-box; transform-origin: 50% 100%; animation: growY .6s var(--ease) both; }
@keyframes growY { from { transform: scaleY(0); } to { transform: none; } }
.chart .cbar.alt { fill: var(--green); }
.chart .cbar.today { fill: var(--binding); }
.chart .line { fill: none; stroke: var(--red); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--red-soft); opacity: .7; }
.chart .dot { fill: var(--card); stroke: var(--red); stroke-width: 2; }
.chart .val { fill: var(--ink-2); font-weight: 700; }
.hbars { display: flex; flex-direction: column; gap: 8px; }
.hbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; font-size: .84rem; }
.hbar .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .vv { font: 700 .82rem var(--font); font-variant-numeric: tabular-nums; }
.hbar .bar { grid-column: 1 / -1; }
.pl td:first-child { width: 70%; }
.pl .sec td { font-weight: 800; background: var(--card-2); }
.pl .net td { font-size: 1.05rem; }

/* ---------- modal / bottom sheet, toast, tour, search, PIN ---------- */
#scrim { position: fixed; inset: 0; background: rgba(28, 16, 8, .5); z-index: 60; opacity: 0; pointer-events: none; transition: opacity .25s var(--ease); }
#scrim.on { opacity: 1; pointer-events: auto; }
#modal { position: fixed; inset: 0; z-index: 61; display: flex; align-items: flex-end; justify-content: center; pointer-events: none; }
#modal.on { pointer-events: auto; }
.sheet {
  background: var(--card);
  width: 100%;
  max-height: 92vh;
  overflow: auto;
  border-radius: 20px 20px 0 0;
  padding: 8px 16px calc(18px + env(safe-area-inset-bottom));
  box-shadow: var(--shadow-lg);
  transform: translateY(105%);
  transition: transform .32s var(--ease);
  overscroll-behavior: contain;
}
#modal.on .sheet { transform: none; }
.sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line-2); margin: 4px auto 10px; }
.sheet .shead { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; position: sticky; top: -8px; background: var(--card); padding: 6px 0; z-index: 2; }
.sheet .shead h3 { flex: 1; font-size: 1.1rem; display: flex; gap: 8px; align-items: center; min-width: 0; }
.sheet .sfoot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; position: sticky; bottom: -18px; background: var(--card); padding: 10px 0 4px; }
@media (min-width: 700px) {
  #modal { align-items: center; padding: 20px; }
  .sheet { max-width: 560px; border-radius: 20px; padding: 10px 22px 22px; transform: scale(.96); opacity: 0; transition: transform .25s var(--ease), opacity .25s var(--ease); }
  .sheet.wide { max-width: 860px; }
  #modal.on .sheet { transform: none; opacity: 1; }
  .sheet .grab { display: none; }
}
#toasts { position: fixed; z-index: 80; inset-inline: 12px; top: calc(var(--top-h) + 10px); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast {
  background: var(--ink);
  color: var(--paper);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  gap: 8px;
  align-items: center;
  box-shadow: var(--shadow-lg);
  font-size: .9rem;
  max-width: 420px;
  animation: toastIn .3s var(--ease) both;
}
.toast.ok .ic { color: #8fe0ae; }
.toast.bad .ic { color: #ff9f93; }
.toast.out { animation: toastOut .3s var(--ease) both; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(8px); } }
@media (min-width: 1024px) { #toasts { top: auto; bottom: 24px; inset-inline-start: calc(var(--spine-w) + 12px); } }
#tour { position: fixed; inset: 0; z-index: 70; display: none; }
#tour.on { display: block; }
#tourSpot { position: fixed; border-radius: 14px; box-shadow: 0 0 0 9999px rgba(24, 12, 6, .62); transition: all .35s var(--ease); pointer-events: none; outline: 2px dashed var(--thread); outline-offset: 3px; }
#tourTip {
  position: fixed;
  width: min(340px, calc(100vw - 32px));
  background: var(--card);
  border-radius: 16px;
  padding: 14px 16px;
  box-shadow: var(--shadow-lg);
  border-top: 4px solid var(--binding);
  animation: pop .3s var(--ease) both;
}
#tourTip h4 { font-size: 1.02rem; margin-bottom: 4px; }
#tourTip p { font-size: .88rem; color: var(--ink-2); }
.dots { display: flex; gap: 4px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); }
.dots i.on { background: var(--binding); width: 18px; border-radius: 4px; }
.palette { position: fixed; z-index: 66; inset-inline: 10px; top: 10px; max-width: 620px; margin: 0 auto; background: var(--card); border-radius: 18px; box-shadow: var(--shadow-lg); padding: 10px; display: none; animation: pop .22s var(--ease) both; }
.palette.on { display: block; }
.palette .res { max-height: min(60vh, 460px); overflow: auto; margin-top: 8px; }
.palette .grp { font-size: .7rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 8px 8px 2px; }
html[lang="ur"] .palette .grp { text-transform: none; letter-spacing: 0; font-size: .78rem; font-weight: 600; }
.palette .lrow.sel { background: var(--blue-soft); }
.pinpad { max-width: 300px; margin: 0 auto; }
.pindots { display: flex; justify-content: center; gap: 14px; margin: 8px 0 16px; }
.pindots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink-2); transition: background .15s, transform .15s var(--ease); }
.pindots i.on { background: var(--ink); transform: scale(1.1); }
.pindots.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.kbd { display: inline-block; min-width: 26px; padding: 2px 7px; border-radius: 7px; border: 1px solid var(--line-2); border-bottom-width: 3px; background: var(--card-2); font-size: .8rem; font-weight: 700; text-align: center; }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.setrow:last-child { border-bottom: 0; }
.setrow .lbl { flex: 1; min-width: 180px; }
.setrow .lbl b { display: block; font-weight: 700; }
html[lang="ur"] .setrow .lbl b { font-weight: 600; }
.setrow .lbl small { color: var(--muted); font-size: .8rem; display: block; }
.alert { display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); align-items: flex-start; }
.alert + .alert { margin-top: 8px; }
.alert .ic { margin-top: 3px; }
.alert.red { border-color: color-mix(in srgb, var(--red) 40%, transparent); background: var(--red-soft); }
.alert.red > .ic { color: var(--red); }
.alert.amber { border-color: color-mix(in srgb, var(--amber) 40%, transparent); background: var(--amber-soft); }
.alert.amber > .ic { color: var(--amber); }
.alert.green { border-color: color-mix(in srgb, var(--green) 40%, transparent); background: var(--green-soft); }
.alert.green > .ic { color: var(--green); }
.alert.blue { border-color: color-mix(in srgb, var(--blue) 35%, transparent); background: var(--blue-soft); }
.alert.blue > .ic { color: var(--blue); }
.alert.read { opacity: .62; }
.amber { color: var(--amber); }
.alert .main { flex: 1; min-width: 0; }
.notice { font-size: .78rem; color: var(--muted); border: 1px dashed var(--line-2); border-radius: 10px; padding: 8px 10px; display: flex; gap: 8px; align-items: flex-start; }
.todo { border-inline-start: 3px solid var(--binding); padding: 8px 12px; background: var(--card-2); border-radius: 0 10px 10px 0; }
html[dir="rtl"] .todo { border-radius: 10px 0 0 10px; }
.todo + .todo { margin-top: 8px; }
.todo h4 { font-size: .94rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
html.helper .owner-only { display: none !important; }
.scanbox { position: relative; border-radius: 14px; overflow: hidden; background: #000; aspect-ratio: 4 / 3; }
.scanbox video { width: 100%; height: 100%; object-fit: cover; display: block; }
.scanbox::after { content: ""; position: absolute; inset: 30% 12%; border: 2px solid var(--thread); border-radius: 10px; box-shadow: 0 0 0 999px rgba(0, 0, 0, .35); }
.timeline { position: relative; padding-inline-start: 18px; }
.timeline::before { content: ""; position: absolute; inset-block: 4px; inset-inline-start: 5px; border-inline-start: 2px dotted var(--line-2); }
.tl { position: relative; padding: 6px 0 10px; }
.tl::before { content: ""; position: absolute; inset-inline-start: -17px; top: 14px; width: 10px; height: 10px; border-radius: 50%; background: var(--card); border: 2px solid var(--blue); }
.tl.helper::before { border-color: var(--amber); }
.tl .when { font-size: .74rem; color: var(--muted); font-family: var(--font); }

/* ---------- motion kit ---------- */
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
html.calm *, html.calm *::before, html.calm *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
@keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }
.enter { animation: fadeUp var(--dur) var(--ease) both; }
.stagger > * { animation: fadeUp .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 40ms); }
.card, .tile { transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s; }
.fill, .bar > i { transition: width .6s var(--ease); }
.skeleton { background: linear-gradient(90deg, var(--paper-2) 25%, var(--card) 50%, var(--paper-2) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 10px; min-height: 60px; }

/* ---------- small phones ---------- */
@media (max-width: 380px) {
  .tiles { grid-template-columns: repeat(3, 1fr); }
  .qa { grid-template-columns: repeat(3, 1fr); }
  .kpi .v { font-size: 1.15rem; }
  .grid2 { grid-template-columns: 1fr; }
}

/* ---------- print: only #printArea, sized by the injected @page rule ---------- */
#printArea { display: none; }
@media print {
  body { background: #fff !important; color: #000; }
  body > *:not(#printArea) { display: none !important; }
  #printArea { display: block; }
  #printArea .receipt { box-shadow: none; width: 100%; padding: 0; font-size: 10.5px; }
  #printArea .receipt::after { display: none; }
  .doc { font-family: var(--font); color: #000; font-size: 11.5px; }
  .doc h1 { font-size: 18px; margin-bottom: 2px; }
  .doc h2 { font-size: 14px; margin: 14px 0 6px; }
  .doc .ur { font-family: var(--font-ur); line-height: 1.9; }
  .doc table { width: 100%; border-collapse: collapse; }
  .doc th, .doc td { border-bottom: 1px solid #bbb; padding: 4px 6px; text-align: start; }
  .doc td.r, .doc th.r { text-align: end; font-variant-numeric: tabular-nums; }
  .doc tfoot td { font-weight: 800; border-top: 2px solid #000; }
  .doc .meta { color: #444; font-size: 10.5px; }
  .doc .note { margin-top: 14px; font-size: 10px; color: #555; border-top: 1px dashed #999; padding-top: 6px; }
  .doc svg { max-width: 100%; }
}
</style>

<script>
'use strict';
/* =====================================================================
   Karyana Khata — shop inventory & udhaar ledger (single file, no build)
   utils · i18n · catalogue · state · seed simulation · domain (stock and
   average cost, sales, udhaar and ageing, suppliers, cash book, reorder,
   books audit) · views (home, quick sale, receipt, stock, udhaar,
   suppliers, purchases, reorder, cash book, reports, bills, alerts,
   activity, search, settings, roles, tour, about) · router and boot.
   Money is stored as integer paisa and quantities as integer base units
   (grams, millilitres, pieces), so floating-point drift can never show.
   Student extension points are marked TODO(student).
   ===================================================================== */

// ---------- DOM + storage helpers ----------
const NS = 'kk:';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const store = {
  get(k, d) {
    try {
      const v = localStorage.getItem(NS + k);
      return v == null ? d : JSON.parse(v);
    } catch {
      return d;
    }
  },
  set(k, v) {
    try {
      localStorage.setItem(NS + k, JSON.stringify(v));
      return true;
    } catch {
      return false;
    }
  },
  bytes() {
    let n = 0;
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith(NS)) n += k.length + (localStorage.getItem(k) || '').length;
      }
    } catch {
      /* storage blocked */
    }
    return n * 2;
  },
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const sum = (arr, f = x => x) => arr.reduce((a, x) => a + f(x), 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const initials = n => String(n || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);

function debounce(fn, ms = 180) {
  let h = 0;
  return (...a) => {
    clearTimeout(h);
    h = setTimeout(() => fn(...a), ms);
  };
}

// Re-render after the current event: a change event can fire while its own input is being
// removed (blur), and replacing that container synchronously would throw.
const later = fn => setTimeout(fn, 0);

function groupBy(arr, keyFn) {
  const m = new Map();
  for (const x of arr) {
    const k = keyFn(x);
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(x);
  }
  return m;
}

// Deterministic PRNG (mulberry32) so the seeded shop is identical on every machine.
function rng(seed) {
  return () => {
    seed |= 0;
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- dates (local calendar days, keyed YYYY-MM-DD) ----------
const DAY = 864e5;
const pad2 = n => String(n).padStart(2, '0');
const dkey = ts => {
  const d = new Date(ts);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
};
const mkey = ts => dkey(ts).slice(0, 7);
const dayStartOf = key => {
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m - 1, d).getTime();
};
const addDays = (key, n) => {
  const d = new Date(dayStartOf(key));
  d.setDate(d.getDate() + n);
  return dkey(d.getTime());
};
const daysBetween = (aTs, bTs) => Math.round((dayStartOf(dkey(bTs)) - dayStartOf(dkey(aTs))) / DAY);
const todayKey = () => dkey(Date.now());
const locale = () => (lang === 'ur' ? 'ur-PK-u-nu-latn' : 'en-PK');
const fmtDate = (ts, opts = { day: 'numeric', month: 'short' }) => new Date(ts).toLocaleDateString(locale(), opts);
const fmtDay = key => fmtDate(dayStartOf(key), { weekday: 'short', day: 'numeric', month: 'short' });
const fmtExp = key => fmtDate(dayStartOf(key), { day: 'numeric', month: 'short', year: 'numeric' });
const fmtLong = ts => fmtDate(ts, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
// Urdu uses a 24-hour clock so no Latin AM/PM gets reordered inside right-to-left text.
const fmtTime = ts => new Date(ts).toLocaleTimeString(locale(), { hour: 'numeric', minute: '2-digit', hourCycle: lang === 'ur' ? 'h23' : 'h12' });
const fmtMonth = key => new Date(dayStartOf(key + '-01')).toLocaleDateString(locale(), { month: 'long', year: 'numeric' });
const fmtDT = ts => `${fmtDate(ts, { day: 'numeric', month: 'short', year: 'numeric' })} · ${fmtTime(ts)}`;

function ago(ts) {
  const d = daysBetween(ts, Date.now());
  if (d <= 0) return t('today');
  if (d === 1) return t('yesterday');
  return t('daysAgo', { n: d });
}

// ---------- money: integer paisa in, formatted rupees out ----------
function groupDigits(s) {
  if (S && S.settings.grouping === 'lakh' && s.length > 3) {
    const head = s.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ',');
    return head + ',' + s.slice(-3);
  }
  return s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

// A left-to-right mark before the minus keeps "−700" from turning into "700−" in Urdu (RTL) text.
const NEG = '\u200e−';

function amt(p, always = false) {
  const a = Math.abs(p);
  const paisa = a % 100;
  let out = groupDigits(String((a - paisa) / 100));
  if (paisa || always) out += '.' + pad2(paisa);
  return (p < 0 ? NEG : '') + out;
}

const rs = (p, always = false) => 'Rs ' + amt(p, always);
const money = (p, cls = '') => `<bdi class="money ${cls}">${rs(p)}</bdi>`;

// Parse "1,250.5" to 125050 paisa without touching floating point.
function parseRs(v) {
  const s = String(v ?? '').replace(/[,\s]/g, '').replace(/^rs\.?/i, '');
  if (!/^\d+(\.\d{0,2})?$/.test(s)) return NaN;
  const [w, f = ''] = s.split('.');
  return Number(w) * 100 + Number((f + '00').slice(0, 2));
}
const rsInput = p => (p % 100 ? (p / 100).toFixed(2) : String(p / 100));

// ---------- quantities: integer base units per selling unit ----------
const UNITS = {
  kg: { base: 1000, dec: 3, loose: true },
  litre: { base: 1000, dec: 3, loose: true },
  dozen: { base: 12, dec: 2, loose: true },
  packet: { base: 1, dec: 0, loose: false },
  piece: { base: 1, dec: 0, loose: false },
};
const trimNum = (n, d) => String(Number(n.toFixed(d)));

function qtyStr(unit, b) {
  const sign = b < 0 ? NEG : '';
  const a = Math.abs(b);
  if (unit === 'kg') return sign + (a < 1000 ? `${a} ${t('u_g')}` : `${trimNum(a / 1000, 3)} ${t('u_kg')}`);
  if (unit === 'litre') return sign + (a < 1000 ? `${a} ${t('u_ml')}` : `${trimNum(a / 1000, 3)} ${t('u_l')}`);
  if (unit === 'dozen') {
    if (a % 12 === 0) return `${sign}${a / 12} ${t('u_dz')}`;
    if (a < 12) return `${sign}${a} ${t('u_pc')}`;
    return `${sign}${Math.floor(a / 12)} ${t('u_dz')} ${a % 12} ${t('u_pc')}`;
  }
  return `${sign}${a} ${t(unit === 'packet' ? 'u_pkt' : 'u_pc')}`;
}
const qtyHtml = (unit, b, cls = '') => `<bdi class="num ${cls}">${qtyStr(unit, b)}</bdi>`;
const unitName = unit => t('un_' + unit);

// Display units ("1.25" kg) to integer base units (1250 g). NaN when invalid.
function parseQty(v, unit) {
  const s = String(v ?? '').trim();
  if (!/^\d*(\.\d+)?$/.test(s) || s === '' || s === '.') return NaN;
  const b = Math.round(Number(s) * UNITS[unit].base);
  return b > 0 ? b : NaN;
}
const qtyInput = (unit, b) => trimNum(b / UNITS[unit].base, UNITS[unit].dec);
const lineAmount = (priceP, qty, unit) => Math.round((priceP * qty) / UNITS[unit].base);

// ---------- EAN-13 / EAN-8 barcode check digit ----------
function eanValid(code) {
  if (!/^(\d{8}|\d{12,13})$/.test(code)) return false;
  const digits = code.padStart(13, '0').split('').map(Number);
  const check = digits.pop();
  const s = digits.reduce((a, d, i) => a + d * (i % 2 ? 3 : 1), 0);
  return (10 - (s % 10)) % 10 === check;
}
function eanWithCheck(twelve) {
  const s = twelve.split('').map(Number).reduce((a, d, i) => a + d * (i % 2 ? 3 : 1), 0);
  return twelve + ((10 - (s % 10)) % 10);
}

// ---------- SHA-256 (pure JS, synchronous) for the owner PIN hash ----------
const SHA_K = [];
const SHA_H0 = [];
(() => {
  const primes = [];
  for (let n = 2; primes.length < 64; n++) if (primes.every(p => n % p)) primes.push(n);
  const frac = x => ((x - Math.floor(x)) * 2 ** 32) | 0;
  primes.forEach((p, i) => {
    SHA_K.push(frac(Math.cbrt(p)));
    if (i < 8) SHA_H0.push(frac(Math.sqrt(p)));
  });
})();
const rotr = (v, n) => (v >>> n) | (v << (32 - n));

function sha256Hex(text) {
  const bytes = [...new TextEncoder().encode(text)];
  const bitLen = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push(i > 3 ? 0 : (bitLen >>> (i * 8)) & 255);
  let h = SHA_H0.slice();
  const w = new Array(64);
  for (let off = 0; off < bytes.length; off += 64) {
    for (let i = 0; i < 16; i++) w[i] = (bytes[off + 4 * i] << 24) | (bytes[off + 4 * i + 1] << 16) | (bytes[off + 4 * i + 2] << 8) | bytes[off + 4 * i + 3];
    for (let i = 16; i < 64; i++) {
      const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
      const s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, k] = h;
    for (let i = 0; i < 64; i++) {
      const t1 = (k + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + SHA_K[i] + w[i]) | 0;
      const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      [k, g, f, e, d, c, b, a] = [g, f, e, (d + t1) | 0, c, b, a, (t1 + t2) | 0];
    }
    h = h.map((v, i) => (v + [a, b, c, d, e, f, g, k][i]) | 0);
  }
  return h.map(v => (v >>> 0).toString(16).padStart(8, '0')).join('');
}

// ---------- feedback: toast, aria-live, motion ----------
function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = ic(type === 'ok' ? 'check-circle' : type === 'bad' ? 'alert-circle' : 'info') + '<span></span>';
  el.lastChild.textContent = msg;
  $('#toasts').append(el);
  setTimeout(() => el.classList.add('out'), 2800);
  setTimeout(() => el.remove(), 3150);
}
const announce = msg => {
  $('#live').textContent = '';
  setTimeout(() => ($('#live').textContent = msg), 30);
};

function animateIn(root) {
  if (!root) return;
  root.classList.remove('enter');
  void root.offsetWidth;
  root.classList.add('enter');
  $$('.stagger', root).forEach(g => [...g.children].forEach((el, i) => el.style.setProperty('--i', Math.min(i, 16))));
  requestAnimationFrame(() => $$('.bar > i[data-w], .ageing > i[data-w]', root).forEach(b => (b.style.width = b.dataset.w + '%')));
  $$('[data-count]', root).forEach(el => countUp(el, Number(el.dataset.count), el.dataset.fmt));
  $$('path[data-draw]', root).forEach(drawPath);
}

function countUp(el, to, fmt = 'rs') {
  const f = fmt === 'n' ? v => Math.round(v).toLocaleString('en-PK') : v => rs(Math.round(v / 100) * 100);
  const done = () => (el.textContent = fmt === 'n' ? f(to) : rs(to));
  if (document.documentElement.classList.contains('calm')) return done();
  const t0 = performance.now();
  const step = nowTs => {
    const p = Math.min(1, (nowTs - t0) / 650);
    if (p >= 1) return done();
    el.textContent = f(to * (1 - Math.pow(1 - p, 3)));
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function drawPath(p) {
  const L = p.getTotalLength();
  p.style.strokeDasharray = L;
  p.style.strokeDashoffset = L;
  p.getBoundingClientRect();
  p.style.transition = 'stroke-dashoffset .9s var(--ease)';
  p.style.strokeDashoffset = 0;
}

// ---------- modal / bottom sheet ----------
let modalReturn = null;
let modalOnClose = null;

function sheetHead(title, icon = 'info') {
  return `<div class="shead"><h3 id="sheetTitle">${ic(icon)}<span>${title}</span></h3><button class="ibtn" type="button" data-close aria-label="${t('close')}">${ic('x')}</button></div>`;
}

function openModal(html, { wide = false, onClose = null } = {}) {
  if (!$('#modal').classList.contains('on')) modalReturn = document.activeElement;
  const sh = $('#sheet');
  sh.className = 'sheet' + (wide ? ' wide' : '');
  sh.innerHTML = '<div class="grab"></div>' + html;
  sh.scrollTop = 0;
  $('#scrim').classList.add('on');
  $('#modal').classList.add('on');
  modalOnClose = onClose;
  $$('[data-close]', sh).forEach(b => (b.onclick = closeModal));
  const first = sh.querySelector('[autofocus], input:not([type=hidden]):not([type=checkbox]):not([readonly]), select, textarea');
  setTimeout(() => (first || sh.querySelector('button.btn') || sh).focus({ preventScroll: true }), 80);
  return sh;
}

function closeModal() {
  if (!$('#modal').classList.contains('on')) return;
  $('#modal').classList.remove('on');
  $('#scrim').classList.remove('on');
  const cb = modalOnClose;
  modalOnClose = null;
  if (cb) cb();
  if (modalReturn && document.contains(modalReturn)) modalReturn.focus({ preventScroll: true });
}
const modalOpen = () => $('#modal').classList.contains('on');

function askConfirm(msg, { okText = t('confirm'), danger = false, icon = 'help' } = {}) {
  return new Promise(resolve => {
    let answered = false;
    const finish = v => {
      if (answered) return;
      answered = true;
      resolve(v);
    };
    const sh = openModal(`${sheetHead(t('areYouSure'), icon)}<p>${msg}</p>
      <div class="sfoot"><button class="btn ghost" data-close>${t('cancel')}</button>
      <button class="btn ${danger ? 'red' : ''}" id="cfOk">${okText}</button></div>`, { onClose: () => finish(false) });
    $('#cfOk', sh).onclick = () => {
      finish(true);
      closeModal();
    };
  });
}

function printDoc(html, size = 'a4') {
  const rule = size === 'receipt' ? '@page { size: 58mm auto; margin: 2mm 3mm; }' : '@page { size: A4; margin: 12mm; }';
  $('#pageRule').textContent = '@media print { ' + rule + ' }';
  $('#printArea').innerHTML = html;
  window.print();
}

function downloadFile(name, text, mime = 'application/json') {
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

const csvCell = v => {
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};
// UTF-8 BOM so spreadsheet apps show Urdu names correctly.
const toCsv = rows => '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
const csvRs = p => (p / 100).toFixed(2);

function pickFile(accept, cb) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = accept;
  inp.onchange = () => inp.files[0] && inp.files[0].text().then(cb);
  inp.click();
}

// A key ending in "1" (nLines1) is used automatically when the count {n} is exactly 1.
function tIn(lng, k, vars = {}) {
  const e = (vars.n === 1 && STR[k + '1']) || STR[k];
  const s = e ? e[lng === 'ur' ? 1 : 0] || e[0] : k;
  return s.replace(/\{(\w+)\}/g, (m, v) => (vars[v] ?? m));
}
const t = (k, vars) => tIn(lang, k, vars);

    toast(t('err_generic'), 'bad');
  }
};

function blankState() {
  return {
    meta: { v: 1, seq: 0, nextBill: 1001, nextPo: 501, startKey: todayKey(), openingFloatP: 500000, ver: 0, seeded: false },
    settings: { ...DEFAULT_SETTINGS },
    items: [],
    customers: [],
    suppliers: [],

    ledger: [],
    supLedger: [],
    purchases: [],
    cash: [],
    adjust: [],
    closes: [],
    activity: [],
