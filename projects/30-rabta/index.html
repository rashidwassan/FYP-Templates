  S = { settings: { ...DEFAULT_SETTINGS }, identity: ident, profile: { nameUr: 'حنا شاہ', pos: offsetPos(ME_OFFSET.dx, ME_OFFSET.dy), sos: { people: 5, injured: 0, needs: ['rescue'] } }, contacts: {}, conflicts: [], inbox: [], log: [], ui: { ...DEFAULT_UI }, sim: null, meta: { created: now(), v: 1, demo: true } };
  await buildMe();
  await createVillage();
  const done = [];
  for (const spec of SEED_MESSAGES) done.push([spec, await seedMsg(spec)]);
  await seedReceipts(done);
  await seedBoards(done.filter(([s]) => s.sos));
  rebuildIndexes();
  seedLastSeen();
  S.ui.read = { '#village': now() - 130 * MIN, '#medical': now() - 390 * MIN, '#rescue': now() - 600 * MIN, '#lost-found': now() - 200 * MIN, ['dm:' + idOfKey('ayesha')]: now() - 184 * MIN };
  seedNotices();
  persistAll();
  persistMesh();
  persistVillage();
}

// A villager was last "seen" when the newest copy that passed through them reached this phone.
function seedLastSeen() {
  for (const v of VILLAGE.nodes) {
    const times = [...ME.core.store.values()].filter(e => e.path.includes(v.ctx.id)).map(e => e.rx);
    S.contacts[v.ctx.id].lastSeen = Math.min(now(), Math.max(now() - 30 * HOUR, ...times));
    v.lastMet = S.contacts[v.ctx.id].lastSeen;
  }
}

function seedNotices() {
  notify('nt_welcome', {}, { route: 'about', key: 'seed-welcome' });
  notify('nt_conflict', { n: 1 }, { route: 'boards/conflicts', level: 'warn', key: 'seed-conf' });
  notify('nt_sos', { name: nameOf(idOfKey('gul')) }, { route: 'sos', level: 'sos', key: 'seed-sos' });
  logEvent('lg_seed', {}, 'app');
}

/** An empty device: fresh identity, no demo village, no messages (Settings → demo data off). */
async function emptyApp(name) {
  const ident = await newIdentity(name || t('defaultName'));
  S = { settings: { ...DEFAULT_SETTINGS, demo: false, village: false, autoMeet: false }, identity: ident, profile: { pos: null, sos: { people: 1, injured: 0, needs: [] } }, contacts: {}, conflicts: [], inbox: [], log: [], ui: { ...DEFAULT_UI }, sim: null, meta: { created: now(), v: 1, demo: false } };
  await buildMe();
  VILLAGE.nodes = [];
  persistAll();
  persistMesh();
  store.set('village', []);
}

// ---------- demo village: in-page nodes with their own keys, stores and board replicas ----------
// Without a second phone the app would be silent, so eight fictional villagers live in this page. Every
// encounter runs the real protocol (hello, summary vectors, signed msg frames, CRDT board states) over an
// in-memory link; nothing is faked except the radio.
const VILLAGE = { nodes: [], timer: 0, tick: 0, script: 0, edges: [] };
const EVLOG = [];
const VILLAGE_TICK_MS = 12000;

const villager = key => VILLAGE.nodes.find(v => v.key === key);
const villagerById = id => VILLAGE.nodes.find(v => v.ctx.id === id);
const idOfKey = key => (key === 'me' ? ME.id : villager(key).ctx.id);

function evPush(k, vars = {}) {
  EVLOG.unshift({ ts: now(), k, vars });
  EVLOG.length = Math.min(EVLOG.length, 60);
  if (curRoute === 'chats' || curRoute === 'mesh') renderMeshSoon();
}

async function villageNode(rec) {
  const keys = HAS_CRYPTO ? await loadKeys(rec.ident) : null;
  const person = VILLAGE_PEOPLE.find(p => p.key === rec.key);
  const ctx = makeNodeCtx(rec.ident, keys, { clock: rec.clock || '', pos: offsetPos(person.dx, person.dy), cap: 600 });
  ctx.idRec = rec.ident;
  restoreStore(ctx.core, rec.store);
  restoreBoards(ctx, rec.boards);
  return { key: rec.key, person, ctx, lastMet: rec.lastMet || 0, busy: false };
}

async function createVillage() {
  VILLAGE.nodes = [];
  for (const p of VILLAGE_PEOPLE) {
    const ident = await newIdentity(p.name[0]);
    VILLAGE.nodes.push(await villageNode({ key: p.key, ident }));
    upsertContact({ id: ident.id, name: p.name[0], nameUr: p.name[1], pk: ident.pk, dh: ident.dh, pos: offsetPos(p.dx, p.dy) }, 'demo');
    Object.assign(S.contacts[ident.id], { demo: true, key: p.key, av: p.av, trust: p.key === 'ayesha' || p.key === 'imran' ? 2 : 1 });
  }
  persist('contacts');
}

async function loadVillage() {
  const saved = store.get('village', null);
  VILLAGE.nodes = [];
  if (!saved || !HAS_CRYPTO) return;
  for (const rec of saved) VILLAGE.nodes.push(await villageNode(rec));
}

const persistVillage = debounce(() => {
  const data = VILLAGE.nodes.map(v => ({ key: v.key, ident: v.ctx.idRec, clock: v.ctx.clock.pack(), store: serializeStore(v.ctx.core), boards: v.ctx.boards, lastMet: v.lastMet }));
  if (!store.set('village', data)) toast(t('err_storage'), 'bad');
}, 800);

/** This phone meets a villager: the real sync protocol runs both ways, then the link closes. */
async function meetVillager(v, quiet = false) {
  if (!v || v.busy) return null;
  v.busy = true;
  evPush('ev_meetStart', { name: nameOf(v.ctx.id) });
  renderMeshSoon();
  const r = await encounter(ME, v.ctx, { kind: 'demo' });
  v.busy = false;
  v.lastMet = now();
  VILLAGE.edges.unshift({ a: ME.id, b: v.ctx.id, ts: now() });
  evPush('ev_met', { name: nameOf(v.ctx.id), got: r.got, sent: r.sent, kb: (r.bytes / 1024).toFixed(1) });
  logEvent('lg_met', { name: v.person.name[0], got: r.got, sent: r.sent }, 'mesh');
  if (!quiet) toast(t('mesh_metToast', { name: nameOf(v.ctx.id), got: r.got, sent: r.sent }), r.got ? 'ok' : '');
  persistVillage();
  renderSoon();
  return r;
}

async function walkVillage() {
  const order = [...VILLAGE.nodes].sort((a, b) => haversine(ME.pos, a.ctx.pos) - haversine(ME.pos, b.ctx.pos)).slice(0, 4);
  for (const v of order) await meetVillager(v, true);
  toast(t('mesh_walkDone', { n: order.length }), 'ok');
}

async function villagersMeet(a, b) {
  if (a.busy || b.busy) return;
  a.busy = b.busy = true;
  const r = await encounter(a.ctx, b.ctx, { kind: 'demo', quietMs: 200 });
  a.busy = b.busy = false;
  VILLAGE.edges.unshift({ a: a.ctx.id, b: b.ctx.id, ts: now() });
  VILLAGE.edges.length = Math.min(VILLAGE.edges.length, 30);
  if (r.got || r.sent) evPush('ev_vmet', { a: nameOf(a.ctx.id), b: nameOf(b.ctx.id), n: r.got + r.sent });
  persistVillage();
}

async function villagePost() {
  const line = VILLAGE_SCRIPT[VILLAGE.script++ % VILLAGE_SCRIPT.length];
  const v = villager(line.who);
  if (!v) return;
  await createMsg(v.ctx, { kind: 'text', ch: line.ch, body: { t: line.t[0], tu: line.t[1] }, ttlH: 24, hl: 8 });
  evPush('ev_post', { name: nameOf(v.ctx.id), ch: line.ch });
  persistVillage();
}

// Demo responders: a villager with a matching skill acknowledges an open SOS, then sets off.
async function villageRespond() {
  for (const v of VILLAGE.nodes) {
    if (!v.person.skills.length || v.busy) continue;
    for (const inc of boardItems(v.ctx.boards.incidents)) {
      const life = v.ctx.boards.incidents.f[inc.id]?.life?.v || 'open';
      const ack = inc['ack_' + v.ctx.id];
      if (life === 'resolved' || inc.from === v.ctx.id || !skillMatch(v.person.skills, inc)) continue;
      if (!ack && life === 'open') return respondAs(v, inc, 'coming', 'acknowledged');
      if (ack?.st === 'coming' && now() - ack.at > 60000) return respondAs(v, inc, 'enroute', 'enroute');
    }
  }
}

async function respondAs(v, inc, st, life) {
  const b = v.ctx.boards.incidents;
  const eta = haversine(v.ctx.pos, { lat: inc.lat, lng: inc.lng }) < 800 ? 10 : 20;
  let delta = boardSetDelta(b, v.ctx.clock, inc.id, { ['ack_' + v.ctx.id]: { st, eta, at: now(), n: v.ctx.name } });
  delta = boardMerge(delta, boardLifeDelta(b, v.ctx.clock, inc.id, life));
  v.ctx.boards.incidents = boardMerge(b, delta);
  await publishBoard(v.ctx, 'incidents', delta, 1);
  evPush('ev_respond', { name: nameOf(v.ctx.id), st: t('ack_' + st) });
  persistVillage();
}

const skillMatch = (skills, inc) => (inc.needs || []).some(n => (NEED_SKILLS[n] || []).some(s => skills.includes(s))) || (inc.injured > 0 && skills.some(s => s === 'firstaid' || s === 'medical'));

async function villageTick() {
  if (!S.settings.village || !VILLAGE.nodes.length || document.hidden) return;
  VILLAGE.tick++;
  const r = rng(VILLAGE.tick * 7919 + Date.now() % 1000);
  const pick = () => VILLAGE.nodes[Math.floor(r() * VILLAGE.nodes.length)];
  await villageRespond();
  const roll = r();
  if (roll < 0.45) {
    const a = pick();
    const b = pick();
    if (a !== b) await villagersMeet(a, b);
  } else if (roll < 0.7 && S.settings.autoMeet) {
    await meetVillager(pick(), true);
  } else if (roll < 0.85) {
    await villagePost();
  }
}

function villageStart() {
  clearInterval(VILLAGE.timer);
  VILLAGE.timer = setInterval(villageTick, VILLAGE_TICK_MS);
}

// ---------- this node's protocol hooks: contacts, packet ticker, diagnostics, alerts ----------
const DIAG = { peers: {}, frames: [], rejected: 0 };
const TICKER = [];
const FRAME_LOG_MAX = 400;
let booted = false;

function diagPeer(s) {
  const id = s.peer.id;
  if (!DIAG.peers[id]) DIAG.peers[id] = { id, kind: s.link.kind, bytesIn: 0, bytesOut: 0, framesIn: 0, framesOut: 0, msgsIn: 0, msgsOut: 0, rtt: null, rtts: [], first: now(), last: now() };
  return DIAG.peers[id];
}

function onFrame(s, dir, f, len) {
  DIAG.frames.unshift({ ts: now(), dir, t: f.t, len, peer: s.peer?.id || '', kind: s.link.kind, id: f.m?.id || f.b || '' });
  DIAG.frames.length = Math.min(DIAG.frames.length, FRAME_LOG_MAX);
  if (s.peer) {
    const d = diagPeer(s);
    d[dir === 'in' ? 'bytesIn' : 'bytesOut'] += len;
    d[dir === 'in' ? 'framesIn' : 'framesOut']++;
    if (f.t === 'msg') d[dir === 'in' ? 'msgsIn' : 'msgsOut']++;
    d.last = now();
  }
  TICKER.unshift(`<span class="${dir}">${dir === 'in' ? 'RX' : 'TX'} ${esc(f.t)} ${len}B</span>`);
  TICKER.length = Math.min(TICKER.length, 8);
  tickerSoon();
}
const tickerSoon = debounce(() => ($('#ticker').innerHTML = TICKER.slice(0, 6).join('')), 120);

function onPeer(s, f) {
  if (s.link.kind === 'selftest') return;
  const fresh = upsertContact({ id: f.id, name: f.name, pk: f.pk, dh: f.dh, pos: f.pos }, s.link.kind);
  evPush('ev_hello', { name: nameOf(f.id, f.name), via: t('via_' + s.link.kind) });
  if (fresh && booted) {
    notify('nt_newPeer', { name: f.name, via: t('via_' + s.link.kind) }, { route: 'identity' });
    toast(t('nt_newPeer', { name: f.name, via: t('via_' + s.link.kind) }), 'ok');
  }
  logEvent('lg_hello', { name: f.name, via: s.link.kind }, 'mesh');
  renderSoon();
}

function onSession(s, state, why) {
  if (s.link.kind === 'selftest') return;
  if (state === 'closed' && s.peer) evPush('ev_closed', { name: nameOf(s.peer.id), why: t('why_' + (why || 'local')) });
  updateLinkStat();
  renderMeshSoon();
}

function onStored(entry, s) {
  const m = entry.m;
  addToIndex(entry);
  persistMesh();
  if (m.from !== ME.id && booted && s?.link.kind !== 'selftest') announceArrival(entry);
  if (m.enc) decryptPending();
  renderSoon();
}

function announceArrival(entry) {
  const m = entry.m;
  if (m.kind === 'sos') return onSosArrived(entry);
  if (!VISIBLE_KINDS.includes(m.kind)) return;
  const conv = convOf(m);
  if (m.to === ME.id && S.settings.receipts) sendReceipts(m.from, 'd');
  const watching = curRoute === 'chats' && curConv() === conv && !document.hidden;
  if (watching) return;
  if (m.to === ME.id) notify('nt_dm', { name: nameOf(m.from, m.name) }, { route: 'chats/' + conv, key: 'dm-' + m.id });
  if (m.to === ME.id || m.prio > 0) toast(t('nt_msgFrom', { name: nameOf(m.from, m.name), conv: convTitle(conv) }));
}

function onSosArrived(entry) {
  const m = entry.m;
  notify('nt_sos', { name: nameOf(m.from, m.name) }, { route: 'sos/incidents/' + (m.body?.inc || ''), level: 'sos', key: 'sos-' + m.id });
  logEvent('lg_sosIn', { name: m.name, hops: entry.path.length - 1 }, 'sos');
  if (now() - m.ts < 6 * HOUR) showSosAlert(entry);
}

function onBoardChange(b, conflicts, from) {
  for (const c of conflicts) {
    const key = [b, c.item, c.field, c.win.t, c.lose.t].join('|');
    if (S.conflicts.some(x => x.key === key)) continue;
    S.conflicts.unshift({ id: uid('cf'), key, b, item: c.item, field: c.field, win: c.win, lose: c.lose, ts: now(), from });
    if (booted) notify('nt_conflict', { n: 1 }, { route: 'boards/' + b, level: 'warn', key: 'conf-' + key });
  }
  if (conflicts.length) persist('conflicts');
  if (b === 'incidents' && booted) checkAssigned();
  persistMesh();
  renderSoon();
}

// A coordinator assigned this phone to an incident: tell the user once.
function checkAssigned() {
  for (const inc of boardItems(ME.boards.incidents)) {
    if (inc.assigned?.id !== ME.id || incLife(inc.id) === 'resolved') continue;
    notify('nt_assigned', { title: incTitle(inc) }, { route: 'sos/incidents/' + inc.id, level: 'sos', key: 'assign-' + inc.id + inc._t.assigned });
  }
}

const ME_HOOKS = {
  session: onSession,
  peer: onPeer,
  frame: onFrame,
  stored: onStored,
  board: onBoardChange,
  rejected: (s, why) => {
    DIAG.rejected++;
    evPush('ev_rejected', { why: t('why_' + why) });
    logEvent('lg_rejected', { why }, 'security');
  },
  rtt: (s, ms) => {
    if (!s.peer) return;
    const d = diagPeer(s);
    d.rtt = ms;
    d.rtts = [...d.rtts.slice(-29), ms];
    if (curRoute === 'diag') renderSoon();
  },
  rtc: () => curRoute === 'connect' && renderSoon(),
  flushed: (s, n) => s.peer && evPush('ev_sent', { n, name: nameOf(s.peer.id) }),
  linkError: s => evPush('ev_linkError', { kind: t('via_' + s.link.kind) }),
};

// ---------- chats: channel rail, conversation, message bubbles, hop path ----------
const curConv = () => (curRoute === 'chats' ? curArg || (isNarrow() ? '' : S.ui.conv) : '');
const isNarrow = () => matchMedia('(max-width: 999px)').matches;
const channelOf = conv => CHANNELS.find(c => c.id === conv);
const dmPeerOf = conv => (conv.startsWith('dm:') ? conv.slice(3) : '');

function convTitle(conv) {
  if (conv.startsWith('dm:')) return nameOf(conv.slice(3));
  const ch = channelOf(conv);
  return ch ? '#' + L(ch.name) : conv;
}

function lastText(conv) {
  const list = convMessages(conv);
  const e = list[list.length - 1];
  if (!e) return t('ch_noMessages');
  const b = bodyOf(e.m);
  const who = e.m.from === ME.id ? t('you') : firstName(e.m.from);
  const kindLabel = { loc: t('k_loc'), photo: t('k_photo'), voice: t('k_voice'), sos: 'SOS', safe: t('k_safe') }[e.m.kind];
  return `${who}: ${kindLabel || (b ? msgText(b) : t('ch_encrypted'))}`;
}

const msgText = b => (lang === 'ur' && b.tu ? b.tu : b.t || '');

function chanBtn(conv) {
  const dm = dmPeerOf(conv);
  const ch = channelOf(conv);
  const n = unreadIn(conv);
  const sos = sosUnread(conv);
  const icon = dm ? avatar(dm, 'sm', true) : `<span class="hash ${ch?.sos ? 'sosh' : ''}">${ic(ch?.icon || 'hash')}</span>`;
  const on = curRoute === 'chats' && curConv() === conv ? 'on' : '';
  return `<a class="chan ${on}" href="#chats/${encodeURIComponent(conv)}" data-conv="${esc(conv)}">${icon}<span class="grow"><b dir="auto">${esc(convTitle(conv))}</b><small dir="auto">${esc(lastText(conv))}</small></span>${n ? `<span class="unread ${sos ? 'sos' : ''}">${n}</span>` : ''}</a>`;
}

function railHtml() {
  const live = liveSessions().length;
  const dms = [...new Set([...dmPeers(), ...Object.values(S.contacts).filter(c => c.trust >= 2).map(c => c.id)])].sort((a, b) => (contactOf(b)?.lastSeen || 0) - (contactOf(a)?.lastSeen || 0));
  return `<a class="mynode" href="#identity">${avatar(ME.id)}<span class="grow"><b dir="auto">${esc(myName())}</b><small>${shortId(ME.id)} · ${t(SLOT === 'A' ? 'ls_n' : 'nodeSlot', { n: live, s: SLOT })}</small></span><span class="signal s${clamp(live, 0, 4)}"><i></i><i></i><i></i><i></i></span></a>
    <div class="railh"><span>${t('ch_channels')}</span></div>${CHANNELS.map(c => chanBtn(c.id)).join('')}
    <div class="railh"><span>${t('ch_direct')}</span><button class="ibtn" type="button" id="newDm" aria-label="${t('ch_newDm')}" title="${t('ch_newDm')}">${ic('plus')}</button></div>
    ${dms.map(id => chanBtn('dm:' + id)).join('') || `<p class="small muted" style="padding:0 8px">${t('ch_noDms')}</p>`}
    <div class="railh"><span>${t('ch_tools')}</span></div>
    <a class="chan" href="#sos">${'<span class="hash sosh">' + ic('siren') + '</span>'}<span class="grow"><b>${t('nav_sos')}</b><small>${t('ch_sosOpen', { n: openIncidents().length })}</small></span></a>
    <a class="chan" href="#connect"><span class="hash">${ic('qr-code')}</span><span class="grow"><b>${t('ch_addPhone')}</b><small>${t('ch_addPhoneSub')}</small></span></a>`;
}

function bindRail(root) {
  const btn = $('#newDm', root);
  if (btn) btn.onclick = openNewDm;
}

function renderRail() {
  if (curRoute !== 'chats' || isNarrow()) return;
  $('#rail').innerHTML = railHtml();
  bindRail($('#rail'));
}

function openNewDm() {
  const people = Object.values(S.contacts).filter(c => c.trust < 3).sort((a, b) => (b.lastSeen || 0) - (a.lastSeen || 0));
  const sh = openModal(`${sheetHead(t('ch_newDm'), 'message')}<p class="small muted">${t('ch_newDmSub')}</p>
    <div class="list">${people.map(c => `<button type="button" class="li chan" data-dm="${c.id}">${avatar(c.id, 'sm', true)}<span class="grow"><b dir="auto">${esc(nameOf(c.id))}</b>
        <small>${shortId(c.id)} · ${trustLabel(c.trust)}</small></span>${c.dh ? ic('lock') : ''}</button>`).join('') || `<div class="empty">${ic('users')}${t('ch_noPeers')}</div>`}</div>`);
  $$('[data-dm]', sh).forEach(b => (b.onclick = () => {
    closeModal();
    go('chats/' + encodeURIComponent('dm:' + b.dataset.dm));
  }));
}

// ---------- conversation ----------
function renderChats(arg) {
  const conv = arg || (isNarrow() ? '' : S.ui.conv);
  const view = $('#view');
  if (!conv) {
    view.className = '';
    view.innerHTML = `<div class="stack">${railHtml()}</div>`;
    bindRail(view);
    return;
  }
  S.ui.conv = conv;
  persist('ui');
  view.className = 'chatview';
  view.innerHTML = `${convHeadHtml(conv)}<div class="msgs" id="msgs" role="log" aria-live="polite" aria-label="${esc(convTitle(conv))}"></div>${composerHtml(conv)}`;
  fillMessages(conv, true);
  bindComposer(conv);
  markRead(conv);
}

function convHeadHtml(conv) {
  const dm = dmPeerOf(conv);
  const ch = channelOf(conv);
  const c = dm ? contactOf(dm) : null;
  const sub = dm
    ? `${shortId(dm)} · ${t('trust_' + (c?.trust || 0))} · ${c?.dh && S.settings.encryptDm ? t('ch_e2e') : t('ch_signedOnly')}`
    : `${L(ch?.desc || ['', ''])} · ${t('ch_nMsgs', { n: convMessages(conv).length })}`;
  return `<div class="convhead">${dm ? avatar(dm, '', true) : `<span class="chan" style="width:auto;padding:0"><span class="hash ${ch?.sos ? 'sosh' : ''}">${ic(ch?.icon || 'hash')}</span></span>`}
    <div class="grow"><b dir="auto">${esc(convTitle(conv))}</b><small dir="auto">${esc(sub)}</small></div>
    <span class="tag mono" title="${t('ch_ttlHint')}">TTL ${S.settings.ttlH}h · HOP ${S.settings.hl}</span>
    ${dm ? `<a class="btn ghost sm" href="#identity/${dm}" aria-label="${t('ch_verify')}">${ic('fingerprint')}<span class="lbl">${t('ch_verify')}</span></a>` : ''}</div>`;
}

function fillMessages(conv, scroll = false) {
  const box = $('#msgs');
  if (!box) return;
  const list = convMessages(conv);
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  let lastDay = '';
  box.innerHTML = list.map(e => {
    const day = new Date(e.m.ts).toDateString();
    const sep = day !== lastDay ? `<div class="daysep">${fmtDate(e.m.ts, { weekday: 'short', day: 'numeric', month: 'short' })}</div>` : '';
    lastDay = day;
    return sep + bubbleHtml(e);
  }).join('') || `<div class="empty">${ic('message')}${t('ch_empty')}</div>`;
  $$('[data-hops]', box).forEach(b => (b.onclick = () => openHopSheet(b.dataset.hops)));
  $$('[data-inc]', box).forEach(b => (b.onclick = () => go('sos/incidents/' + b.dataset.inc)));
  $$('[data-mapto]', box).forEach(b => (b.onclick = () => go('map/' + b.dataset.mapto)));
  if (scroll || atBottom) box.scrollTop = box.scrollHeight;
}

function verifyBadge(e) {
  if (e.verified === 'ok') return `<span class="ok" title="${t('ch_sigOk')}">${ic('shield-check')}</span>`;
  if (e.verified === 'bad') return `<span class="bad" title="${t('ch_sigBad')}">${ic('alert')}</span>`;
  return `<span title="${t('ch_sigNone')}">${ic('shield')}</span>`;
}

function receiptIcon(m) {
  const st = receiptOf(m);
  const icon = { read: 'check-double', delivered: 'check-double', relayed: 'check', queued: 'clock' }[st];
  return st ? `<span class="${st === 'read' ? 'ok' : ''}" title="${t('rc_' + st)}">${ic(icon)}</span>` : '';
}

function bubbleBody(m, b) {
  if (!b) return `<div class="txt muted">${ic('lock')} ${t('ch_decrypting')}</div>`;
  const txt = esc(msgText(b));
  if (m.kind === 'sos') return sosBubble(b, txt);
  if (m.kind === 'safe') return `<div class="txt"><b>${ic('shield-check')} ${t('k_safeTitle')}</b>${b.n > 1 ? ` · ${t('k_safeN', { n: b.n })}` : ''}${txt ? '<br>' + txt : ''}</div>`;

function sosBubble(b, txt) {

function locCard(b) {

function bubbleHtml(e) {
  const m = e.m;

// ---------- composer: text, quick templates, location, photo, voice note, "I am safe", SOS ----------
const HAS_GEO = 'geolocation' in navigator;
const HAS_REC = typeof MediaRecorder === 'function' && !!navigator.mediaDevices?.getUserMedia;
const VOICE_MAX_MS = 15000;
const REC = { rec: null, chunks: [], t0: 0, timer: 0, conv: '' };
let composePrio = 0;

function composerHtml(conv) {
  const dm = dmPeerOf(conv);
  const enc = dm && S.settings.encryptDm && contactOf(dm)?.dh;
  return `<div class="composer"><div class="tplrow" role="group" aria-label="${t('cp_templates')}">${TEMPLATES.map(tp => `<button type="button" class="chip" data-tpl="${tp.k}">${ic(tp.icon)} ${L(tp.text)}</button>`).join('')}</div>
    <div id="recBar"></div>
    <div class="tools">${[['cpLoc', 'map-pin', 'cp_loc'], ['cpPhoto', 'camera', 'cp_photo'], ['cpVoice', 'mic', 'cp_voice'], ['cpSafe', 'shield-check', 'cp_safe'], ['cpPrio', 'flag', 'cp_prio']].map(([id, icon, k]) => `<button type="button" class="btn ghost sm" id="${id}" aria-label="${t(k)}" title="${t(k)}" ${id === 'cpPrio' ? `aria-pressed="${composePrio ? 'true' : 'false'}"` : ''}>${ic(icon)}<span class="lbl">${t(k)}</span></button>`).join('')}
      <button type="button" class="btn soft sm" id="cpSos">${ic('siren')} SOS</button></div>
    <div class="inrow"><textarea id="msgIn" rows="1" dir="auto" placeholder="${esc(t('cp_placeholder', { c: convTitle(conv) }))}" aria-label="${esc(t('cp_placeholder', { c: convTitle(conv) }))}"></textarea>
      <button type="button" class="btn go" id="cpSend" aria-label="${t('send')}">${ic('send', 'flip')}</button></div>
    <div class="tiny muted cphint">${enc ? ic('lock') + ' ' + t('cp_hintEnc') : ic('shield-check') + ' ' + t('cp_hintSigned')}</div></div>`;
}

function bindComposer(conv) {
  const input = $('#msgIn');
  const draftKey = 'draft:' + conv;
  input.value = sessionDraft(draftKey);
  input.oninput = () => {
    input.style.height = 'auto';
    input.style.height = Math.min(140, input.scrollHeight) + 'px';
    sessionDraft(draftKey, input.value);
  };
  input.onkeydown = e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendText(conv);
    }
  };
  $('#cpSend').onclick = () => sendText(conv);
  $$('[data-tpl]').forEach(b => (b.onclick = () => useTemplate(b.dataset.tpl)));
  $('#cpLoc').onclick = () => sendLocation(conv);
  $('#cpPhoto').onclick = () => pickFile('image/*', f => sendPhoto(conv, f), false);
  $('#cpVoice').onclick = () => (REC.rec ? stopVoice() : startVoice(conv));
  $('#cpSafe').onclick = () => sendSafe(conv);
  $('#cpSos').onclick = () => openSosSheet();
  $('#cpPrio').onclick = () => {
    composePrio = composePrio ? 0 : 1;
    $('#cpPrio').setAttribute('aria-pressed', composePrio ? 'true' : 'false');
    $('#cpPrio').classList.toggle('soft', !!composePrio);
  };
  $('#cpPrio').classList.toggle('soft', !!composePrio);
}

function sessionDraft(key, value) {
  try {
    if (value === undefined) return sessionStorage.getItem(NS + key) || '';
    sessionStorage.setItem(NS + key, value);
  } catch {
    /* session storage blocked */
  }
  return '';
}

function useTemplate(k) {
  const tp = TEMPLATES.find(x => x.k === k);
  const input = $('#msgIn');
  input.value = S.settings.tplBoth ? `${tp.text[0]} / ${tp.text[1]}` : L(tp.text);
  if (tp.prio) {
    composePrio = tp.prio;
    $('#cpPrio').classList.add('soft');
  }
  input.dispatchEvent(new Event('input'));
  input.focus();
}

/** Every outgoing message: DMs are encrypted for the peer when possible; all are signed. */
async function sendTo(conv, kind, body, { prio = composePrio, ttlH = S.settings.ttlH, hl = S.settings.hl } = {}) {
  if (!ME.keys) return toast(t('err_crypto'), 'bad');
  const dm = dmPeerOf(conv);
  const peer = dm ? contactOf(dm) : null;
  const encryptFor = dm && S.settings.encryptDm && peer?.dh ? peer.dh : null;
  const m = await createMsg(ME, { kind, ch: dm ? 'dm' : conv, to: dm || null, body, prio, ttlH, hl, encryptFor });
  if (encryptFor) PLAIN.set(m.id, body);
  composePrio = 0;
  logEvent('lg_sent', { kind, conv: convTitle(conv) }, 'chat');
  markRead(conv);
  renderSoon();
  return m;
}

async function sendText(conv) {
  const input = $('#msgIn');
  const text = input.value.trim();
  if (!text) return input.focus();
  if (byteLen(text) > 4000) return toast(t('cp_tooLong'), 'bad');
  input.value = '';
  sessionDraft('draft:' + conv, '');
  input.style.height = 'auto';
  await sendTo(conv, 'text', { t: text });
  input.focus();
}

// ---------- location: a real fix when allowed, otherwise the last known (or demo) position, labelled ----------
function getFix(timeout = 8000) {
  return new Promise(resolve => {
    if (!HAS_GEO) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }),
      () => resolve(null),
      { enableHighAccuracy: true, timeout, maximumAge: 30000 },
    );
  });
}

async function currentPosition() {
  const fix = await getFix();
  if (fix) {
    S.profile.pos = { lat: fix.lat, lng: fix.lng };
    ME.pos = S.profile.pos;
    persist('profile');
    return { ...fix, sim: false };
  }
  const p = myPos();
  toast(t(HAS_GEO ? 'cp_locFallback' : 'cp_locNone'));
  return p ? { lat: p.lat, lng: p.lng, acc: 50, sim: true } : null;
}

async function sendLocation(conv) {
  toast(t('cp_locating'));
  const pos = await currentPosition();
  if (!pos) return;
  const label = $('#msgIn')?.value.trim() || '';
  if (label) $('#msgIn').value = '';
  await sendTo(conv, 'loc', { ...pos, label, t: label });
}

async function sendPhoto(conv, file) {
  try {
    const img = await compressImage(file);
    const caption = $('#msgIn')?.value.trim() || '';
    if (caption) $('#msgIn').value = '';
    await sendTo(conv, 'photo', { img, t: caption, bytes: Math.round((img.length * 3) / 4) });
    toast(t('cp_photoSent', { kb: Math.round((img.length * 0.75) / 1024) }), 'ok');
  } catch {
    toast(t('cp_photoErr'), 'bad');
  }
}

// ---------- voice note: MediaRecorder, capped at 15 s, stored as a data URL ----------
async function startVoice(conv) {
  if (!HAS_REC) return toast(t('cp_noRec'), 'bad');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    REC.rec = new MediaRecorder(stream, { audioBitsPerSecond: 16000 });
    REC.chunks = [];
    REC.conv = conv;
    REC.t0 = now();
    REC.rec.ondataavailable = e => e.data.size && REC.chunks.push(e.data);
    REC.rec.onstop = () => finishVoice(stream);
    REC.rec.start();
    REC.timer = setInterval(voiceTick, 250);
    voiceTick();
  } catch {
    REC.rec = null;
    toast(t('cp_micDenied'), 'bad');
  }
}

function voiceTick() {
  const ms = now() - REC.t0;
  if ($('#recBar')) $('#recBar').innerHTML = `<div class="recbar"><span class="led bad"></span>${t('cp_recording')} ${(ms / 1000).toFixed(1)} / 15 s<span class="grow"></span><button type="button" class="btn sm" id="recStop">${ic('square')} ${t('cp_stop')}</button></div>`;
  if ($('#recStop')) $('#recStop').onclick = stopVoice;
  if (ms >= VOICE_MAX_MS) stopVoice();
}

function stopVoice() {
  clearInterval(REC.timer);
  if (REC.rec && REC.rec.state !== 'inactive') REC.rec.stop();
}

function finishVoice(stream) {
  stream.getTracks().forEach(tr => tr.stop());
  const ms = Math.min(VOICE_MAX_MS, now() - REC.t0);
  const blob = new Blob(REC.chunks, { type: REC.rec.mimeType || 'audio/webm' });
  REC.rec = null;
  if ($('#recBar')) $('#recBar').innerHTML = '';
  const reader = new FileReader();
  reader.onload = () => sendTo(REC.conv, 'voice', { audio: reader.result, ms, t: '' });
  reader.readAsDataURL(blob);
}

// ---------- "I am safe": a message plus my row on the roll call board ----------
async function sendSafe(conv) {
  const text = $('#msgIn')?.value.trim() || '';
  if (text) $('#msgIn').value = '';
  await sendTo(conv, 'safe', { t: text || t('k_safeTitle'), n: S.profile.sos?.people || 1 });
  await markRollSafe();
  toast(t('cp_safeSent'), 'ok');
}

async function markRollSafe() {
  const mine = boardItems(ME.boards.roll).find(p => p.node === ME.id);
  if (!mine) return;
  const delta = boardSetDelta(ME.boards.roll, ME.clock, mine.id, { status: 'safe', last: now() });
  ME.boards.roll = boardMerge(ME.boards.roll, delta);
  await publishBoard(ME, 'roll', delta);
}

// ---------- community SOS: press-and-hold, the SOS sheet, incidents as CRDT state, incoming alerts ----------
// An SOS is two things that travel together: a top-priority signed message (TTL 72 h, 16 hops, sent
// before anything else) and an incident on the shared board, where responders, acknowledgements,
// triage, the lifecycle and the reach (who has seen it) merge across peers.
const SOS_HOLD_MS = 1500;
const HOLD = { t0: 0, raf: 0, el: null };

function sosButtonHtml(id) {
  return `<button type="button" class="sos-hold" id="${id}" aria-label="${t('sos_holdAria')}" title="${t('sos_holdAria')}"><svg class="ring" viewBox="0 0 70 70" aria-hidden="true"><circle cx="35" cy="35" r="32" stroke-dasharray="201" stroke-dashoffset="201"/></svg><span class="face"><b>SOS</b>
      <small>${t('sos_hold')}</small></span></button>`;
}

function mountSosButtons() {
  $('#navSos').innerHTML = sosButtonHtml('sosNavBtn');
  $('#sosFab').innerHTML = sosButtonHtml('sosFabBtn');
  $$('.sos-hold').forEach(bindSosHold);
}

function bindSosHold(btn) {
  const start = e => {
    if (e.type === 'keydown' && e.key !== ' ' && e.key !== 'Enter') return;
    if (e.type === 'keydown' && e.repeat) return e.preventDefault();
    e.preventDefault();
    holdStart(btn);
  };
  btn.addEventListener('pointerdown', start);
  btn.addEventListener('keydown', start);
  ['pointerup', 'pointerleave', 'pointercancel', 'keyup', 'blur'].forEach(ev => btn.addEventListener(ev, holdEnd));
  btn.addEventListener('click', e => e.preventDefault());
}

function holdStart(btn) {
  if (HOLD.raf) return;
  HOLD.t0 = performance.now();
  HOLD.el = btn;
  btn.classList.add('holding');
  const ring = $('circle', btn);
  const step = ts => {
    const p = Math.min(1, (ts - HOLD.t0) / SOS_HOLD_MS);
    ring.style.strokeDashoffset = String(201 * (1 - p));
    if (p >= 1) {
      holdEnd();
      vibrate([120, 60, 120]);
      return openSosSheet();
    }
    HOLD.raf = requestAnimationFrame(step);
  };
  HOLD.raf = requestAnimationFrame(step);
}

function holdEnd() {
  if (!HOLD.el) return;
  cancelAnimationFrame(HOLD.raf);
  const short = performance.now() - HOLD.t0 < SOS_HOLD_MS;
  HOLD.raf = 0;
  HOLD.el.classList.remove('holding');
  $('circle', HOLD.el).style.strokeDashoffset = '201';
  HOLD.el = null;
  if (short) toast(t('sos_keepHolding'));
}

// ---------- the SOS sheet: details prefilled, location in the background, a short countdown ----------

function openSosSheet() {

    <div class="field mt"><span>${t('sos_triageSelf')}</span><div class="seg" id="sfTriage">${TRIAGE.filter(x => x !== 'deceased').map(x => `<button type="button" data-v="${x}" class="${x === d.triage ? 'on' : ''}">${opt(x)}</button>`).join('')}</div></div>

    <p class="small mt" id="sfLoc">${ic('locate')} ${t('sos_locating')}</p>
    <div class="note sos mt">${ic('info')}<div>${t('sos_honest')}</div></div>
    <div class="sfoot"><button type="button" class="btn ghost" data-close>${t('cancel')}</button><button type="button" class="btn sos" id="sfSend" autofocus>${ic('send', 'flip')} ${t('sos_sendNow')}</button></div>`, { cls: 'sossheet', onClose: stopSosCountdown });
  bindSosSheet(sh);

  });
  SOSF.timer = setInterval(sosTick, 1000);

const stepper = (id, label, v) => `<div class="field"><span>${label}</span><div class="row"><button type="button" class="btn sm" data-step="${id}" data-d="-1" aria-label="−1">${ic('minus')}</button><input id="${id}" type="number" min="0" max="99" value="${v}" class="mono" style="width:70px;text-align:center" aria-label="${label}">
    <button type="button" class="btn sm" data-step="${id}" data-d="1" aria-label="+1">${ic('plus')}</button></div></div>`;

function bindSosSheet(sh) {
  const pause = () => {
    SOSF.paused = true;
    sosTick(true);
  };
  $$('[data-step]', sh).forEach(b => (b.onclick = () => {
    const inp = $('#' + b.dataset.step, sh);
    inp.value = clamp(Number(inp.value || 0) + Number(b.dataset.d), 0, 99);
    pause();
  }));
  $$('[data-need]', sh).forEach(b => (b.onclick = () => {
    b.classList.toggle('on');
    b.setAttribute('aria-pressed', b.classList.contains('on'));
    pause();
  }));
  $$('#sfTriage button', sh).forEach(b => (b.onclick = () => {
    $$('#sfTriage button', sh).forEach(x => x.classList.toggle('on', x === b));
    pause();
  }));
  $$('input, textarea', sh).forEach(i => i.addEventListener('input', pause));
  $('#sfSend', sh).onclick = () => submitSosSheet(sh);
}

function sosTick(redraw = false) {
  if (!$('#sosCount')) return stopSosCountdown();
  if (!SOSF.paused && !redraw) SOSF.left--;
  $('#sosCount').textContent = SOSF.paused ? t('sos_paused') : String(Math.max(0, SOSF.left));
  $('#sosCountSub').textContent = SOSF.paused ? t('sos_pausedSub') : t('sos_countSub', { n: SOSF.left });
  if (!SOSF.paused && SOSF.left <= 0) submitSosSheet($('#sheet'));
}

function stopSosCountdown() {
  clearInterval(SOSF.timer);
  SOSF.timer = 0;
}

async function submitSosSheet(sh) {
  stopSosCountdown();
  const details = {
    people: clamp(Number($('#sfPeople', sh).value || 1), 0, 99),
    injured: clamp(Number($('#sfInjured', sh).value || 0), 0, 99),
    needs: $$('[data-need].on', sh).map(b => b.dataset.need),
    triage: $('#sfTriage .on', sh)?.dataset.v || 'unknown',
    note: $('#sfNote', sh).value.trim(),
  };
  closeModal();
  const pos = SOSF.pos || (await currentPosition());
  await sendSos(details, pos);
}

/** Create the incident (board delta, priority 2) and the SOS message; mark me "needs help" on the roll. */
async function sendSos(d, pos) {
  if (!ME.keys) return toast(t('err_crypto'), 'bad');
  const id = 'inc-' + randomHex(4);
  const title = d.note || t('sos_defaultTitle', { n: d.people });
  const m = await createMsg(ME, { kind: 'sos', ch: '#rescue', body: { t: title, people: d.people, injured: d.injured, needs: d.needs, triage: d.triage, inc: id, ...(pos || {}) }, prio: PRIO_SOS, ttlH: S.settings.sosTtlH, hl: S.settings.sosHl });
  let delta = boardAddDelta(ME.boards.incidents, ME.clock, id, { title, ...(pos ? { lat: pos.lat, lng: pos.lng, acc: pos.acc, sim: !!pos.sim } : {}), people: d.people, injured: d.injured, needs: d.needs, triage: d.triage, from: ME.id, name: ME.name, at: m.ts, msg: m.id });
  delta = boardMerge(delta, boardLifeDelta(ME.boards.incidents, ME.clock, id, 'open'));
  ME.boards.incidents = boardMerge(ME.boards.incidents, delta);
  await publishBoard(ME, 'incidents', delta, PRIO_SOS);
  S.profile.sos = { people: d.people, injured: d.injured, needs: d.needs, triage: d.triage };
  persist('profile');
  await setMyRoll('help');
  logEvent('lg_sosOut', { people: d.people }, 'sos');
  notify('nt_sosSent', {}, { route: 'sos/incidents/' + id, level: 'sos' });
  toast(t('sos_sent', { n: liveSessions().length }), 'sos');
  vibrate([200, 100, 200]);
  go('sos/incidents/' + id);
}

async function setMyRoll(status) {
  const mine = boardItems(ME.boards.roll).find(p => p.node === ME.id);
  if (!mine) return;
  const delta = boardSetDelta(ME.boards.roll, ME.clock, mine.id, { status, last: now() });

// ---------- incident helpers and responder actions (all writes are CRDT deltas) ----------
const incById = id => boardItems(ME.boards.incidents).find(i => i.id === id);
const incLife = id => ME.boards.incidents.f[id]?.life?.v || 'open';
const incTitle = inc => (lang === 'ur' && inc.titleUr) || inc.title || t('sos_untitled');
const incActive = inc => incLife(inc.id) !== 'resolved';
const openIncidents = () => boardItems(ME.boards.incidents).filter(incActive);
const triageRank = tr => (TRIAGE.indexOf(tr) + 5) % 5;
const fieldsWith = (inc, prefix) => Object.keys(inc).filter(k => k.startsWith(prefix) && inc[k]).map(k => ({ id: k.slice(prefix.length), ...inc[k] }));
const acksOf = inc => fieldsWith(inc, 'ack_').sort((a, b) => a.at - b.at);

function reachOf(inc) {
  const seen = fieldsWith(inc, 'seen_');
  return { n: seen.length, hops: seen.reduce((mx, s) => Math.max(mx, s.h || 0), 0), list: seen };
}

async function writeIncident(id, fields, life = null, reopen = false) {
  const b = ME.boards.incidents;
  let delta = Object.keys(fields).length ? boardSetDelta(b, ME.clock, id, fields) : { items: orNew(), f: {} };
  if (life) delta = boardMerge(delta, boardLifeDelta(b, ME.clock, id, life, reopen));
  ME.boards.incidents = boardMerge(b, delta);
  await publishBoard(ME, 'incidents', delta, 1);
  persistMesh();
  renderSoon();
}

async function ackIncident(id, st, eta = 20) {
  const life = incLife(id);
  const next = st === 'enroute' ? 'enroute' : life === 'open' ? 'acknowledged' : null;
  await writeIncident(id, { ['ack_' + ME.id]: { st, eta, at: now(), n: ME.name } }, next && LIFECYCLE.indexOf(next) > LIFECYCLE.indexOf(life) ? next : null);
  logEvent('lg_ack', { st }, 'sos');
  toast(t('sos_ackSent', { st: t('ack_' + st) }), 'ok');
}

const resolveIncident = id => writeIncident(id, {}, 'resolved').then(() => toast(t('sos_resolved'), 'ok'));
const reopenIncident = id => writeIncident(id, {}, 'open', true);
const setTriage = (id, triage) => writeIncident(id, { triage });
const assignResponder = (id, r) => writeIncident(id, { assigned: { id: r.id, n: r.name, by: ME.id } }).then(() => toast(t('co_assigned', { name: r.name }), 'ok'));

// ---------- incoming SOS alert ----------
let alertBeepCtx = null;

function beep() {
  try {
    alertBeepCtx = alertBeepCtx || new AudioContext();
    const ctx = alertBeepCtx;
    [880, 660, 880].forEach((f, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + i * 0.22);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + i * 0.22 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.22 + 0.2);
      o.connect(g).connect(ctx.destination);
      o.start(ctx.currentTime + i * 0.22);
      o.stop(ctx.currentTime + i * 0.22 + 0.21);
    });
  } catch {
    /* audio blocked until the user interacts */
  }
}

// ---------- coordinator: nearest available responder with the right skills ----------
function requiredSkills(inc) {
  const need = new Set((inc.needs || []).flatMap(n => NEED_SKILLS[n] || []));
  if (inc.injured > 0) need.add('firstaid');
  return [...need];
}

const responders = () => boardItems(ME.boards.responders).map(r => ({ ...r, skills: r.skills || [] }));
const activeLoad = rid => openIncidents().filter(i => i.assigned?.id === rid).length;

/** score = distance in km + 1.5 per required skill the responder lacks + 1 per incident already assigned. */
function suggestResponders(inc) {
  const need = requiredSkills(inc);
  return responders().filter(r => r.avail && r.id !== inc.from).map(r => {
    const d = inc.lat && r.lat ? haversine(r, inc) : 5000;
    const match = need.filter(s => r.skills.includes(s)).length;
    const load = activeLoad(r.id);
    return { r, d, match, load, score: d / 1000 + (need.length - match) * 1.5 + load };
  }).filter(x => x.match > 0 || !need.length).sort((a, b) => a.score - b.score);
}

function coordinateTab() {
  const list = openIncidents().sort((a, b) => triageRank(a.triage) - triageRank(b.triage) || a.at - b.at);
  const rows = list.map(inc => {
    const sug = suggestResponders(inc).slice(0, 3);
    const need = requiredSkills(inc);
    return `<tr><td><span class="tri ${esc(inc.triage || 'unknown')}">${opt(inc.triage || 'unknown')}</span><br><b dir="auto">${esc(incTitle(inc))}</b><br><small class="muted">${t('life_' + incLife(inc.id))} · ${ago(inc.at)}</small></td>

  }).join('');
  const avail = responders().filter(r => r.avail).length;
  return `<div class="tiles stagger"><div class="tile o"><small>${ic('siren')} ${t('inc_active')}</small><b data-count="${list.length}">0</b></div>

}

const BOARDV = { q: '', status: 'all' };

function renderBoards(arg) {

const boardTitle = (b, item) => item[BOARDS[b].title] || item.name || item.title || '—';
const statusTag = (b, st) => `<span class="tag ${BOARDS[b].good.includes(st) ? 'ok' : BOARDS[b].bad.includes(st) ? 'bad' : 'warn'}">${opt(st)}</span>`;

function boardHtml(b) {
  const def = BOARDS[b];
  const statuses = def.fields.find(f => f.k === 'status').opts;

  const items = boardItems(ME.boards[b])
    .filter(i => BOARDV.status === 'all' || i.status === BOARDV.status)
    .filter(i => !q || JSON.stringify(i).toLowerCase().includes(q))
    .sort((a, b2) => def.bad.includes(b2.status) - def.bad.includes(a.status) || (latestOf(b2) > latestOf(a) ? 1 : -1));

const latestOf = item => Object.values(item._t).sort().pop() || '';
const fieldLabel = (b, k) => (STR[`f_${b}_${k}`] ? t(`f_${b}_${k}`) : t('f_' + k));

function fieldText(f, v) {
  if (f.type === 'sel') return opt(v);
  if (f.type === 'dt') return fmtDT(v);
  return String(v);
}

function bindBoard(b) {
  $('#bdSearch').oninput = debounce(e => {
    BOARDV.q = e.target.value;
    rerender();
    $('#bdSearch').focus();
    $('#bdSearch').setSelectionRange(BOARDV.q.length, BOARDV.q.length);
  }, 250);

    BOARDV.status = x.dataset.v;
    rerender();
  }));

  $('#bdPrint').onclick = printSitrep;

  $$('[data-cf]').forEach(x => (x.onclick = () => go('boards/conflicts')));

function fieldInput(f, v) {
  const id = 'bf_' + f.k;
  if (f.type === 'sel') return `<select id="${id}">${f.opts.map(o => `<option value="${o}" ${o === v ? 'selected' : ''}>${opt(o)}</option>`).join('')}</select>`;
  if (f.type === 'area') return `<textarea id="${id}" dir="auto">${esc(v ?? '')}</textarea>`;
  if (f.type === 'dt') return `<input id="${id}" type="datetime-local" value="${v ? new Date(v - new Date().getTimezoneOffset() * MIN).toISOString().slice(0, 16) : ''}">`;
  return `<input id="${id}" type="${f.type === 'num' ? 'number' : 'text'}" dir="auto" value="${esc(v ?? '')}" ${f.req ? 'required' : ''}>`;
}

function readField(f, sh) {
  const v = $('#bf_' + f.k, sh).value.trim();
  if (f.type === 'num') return v === '' ? '' : Number(v);
  if (f.type === 'dt') return v ? new Date(v).getTime() : '';
  return v;
}

function openBoardForm(b, id = '') {
  const item = id ? boardItems(ME.boards[b]).find(i => i.id === id) : {};
  const fields = BOARDS[b].fields;
  const sh = openModal(`${sheetHead(t(id ? 'bd_edit' : 'bd_add_' + b), BOARDS[b].icon)}<div class="grid2">${fields.map(f => `<label class="field" ${f.type === 'area' ? 'style="grid-column:1/-1"' : ''}><span>${fieldLabel(b, f.k)}${f.req ? ' *' : ''}</span>${fieldInput(f, item[f.k] ?? (f.type === 'sel' ? f.opts[0] : ''))}</label>`).join('')}</div>
    <p class="tiny muted mt">${t('bd_formNote')}</p>
    <div class="sfoot">${id ? `<button type="button" class="btn ghost" id="bfDel">${ic('trash')} ${t('remove')}</button>` : ''}<button type="button" class="btn ghost" data-close>${t('cancel')}</button><button type="button" class="btn go" id="bfSave">${t('save')}</button></div>`, { wide: true });
  $('#bfSave', sh).onclick = () => {
    const vals = Object.fromEntries(fields.map(f => [f.k, readField(f, sh)]));
    const missing = fields.find(f => f.req && !vals[f.k]);
    if (missing) return $('#bf_' + missing.k, sh).closest('.field').classList.add('bad');
    const changed = id ? Object.fromEntries(Object.entries(vals).filter(([k, v]) => canon(v) !== canon(item[k] ?? ''))) : vals;
    closeModal();
    if (id) saveBoardFields(b, id, changed);
    else addBoardItem(b, vals);
  };
  if (id) $('#bfDel', sh).onclick = () => removeBoardItem(b, id);
}

async function addBoardItem(b, vals) {
  const id = b.slice(0, 1) + '-' + randomHex(4);
  const delta = boardAddDelta(ME.boards[b], ME.clock, id, vals);
  ME.boards[b] = boardMerge(ME.boards[b], delta);
  await publishBoard(ME, b, delta, b === 'missing' ? 1 : 0);
  logEvent('lg_boardAdd', { b }, 'boards');
  toast(t('bd_added'), 'ok');
  rerender();
}

async function saveBoardFields(b, id, fields) {
  if (!Object.keys(fields).length) return;
  const delta = boardSetDelta(ME.boards[b], ME.clock, id, fields);
  ME.boards[b] = boardMerge(ME.boards[b], delta);
  await publishBoard(ME, b, delta);
  toast(t('bd_saved'), 'ok');
  rerender();
}

async function removeBoardItem(b, id) {
  if (!(await askConfirm(t('bd_removeQ'), { danger: true, okText: t('remove') }))) return;
  const delta = boardRemoveDelta(ME.boards[b], id);
  ME.boards[b] = boardMerge(ME.boards[b], delta);
  await publishBoard(ME, b, delta);
  rerender();
}

// ---------- partition demo: two replicas edit while cut off, then merge ----------
const PART = { a: null, b: null, ca: null, cb: null, merged: null, conflicts: [] };

function partitionReset() {
  PART.a = structuredClone(ME.boards.needs);
  PART.b = structuredClone(ME.boards.needs);
  PART.ca = new Hlc('replica-A');
  PART.cb = new Hlc('replica-B');
  PART.merged = null;
  PART.conflicts = [];
}

function partitionCol(key) {
  const items = boardItems(PART[key]);
  return `<div class="replica"><div class="between"><b>${t('pt_replica', { k: key.toUpperCase() })}</b><span class="mono tiny">${boardDigest(PART[key])}</span></div>
    ${items.map(i => `<div class="li"><span class="grow"><b dir="auto">${esc(i.title)}</b><small>${opt(i.status)} · ${esc(i.qty || '')}</small></span>
        <select class="inp" style="width:auto;min-height:32px" data-pt="${key}" data-id="${i.id}" aria-label="${t('inc_status')}">${BOARDS.needs.fields.find(f => f.k === 'status').opts.map(s => `<option value="${s}" ${s === i.status ? 'selected' : ''}>${opt(s)}</option>`).join('')}</select>
        <button type="button" class="ibtn" data-ptdel="${key}" data-id="${i.id}" aria-label="${t('remove')}">${ic('trash')}</button></div>`).join('')}
    <div class="row mt"><input class="inp" id="ptNew${key}" placeholder="${t('pt_newPh')}" dir="auto" style="flex:1"><button type="button" class="btn sm" data-ptadd="${key}">${ic('plus')}</button></div></div>`;
}

function partitionHtml() {
  if (!PART.a) partitionReset();
  const m = PART.merged;
  const check = m ? canon(boardMerge(PART.a, PART.b)) === canon(boardMerge(PART.b, PART.a)) : null;
  return `<div class="note">${ic('split')}<div>${t('pt_intro')}</div></div>
    <div class="cols even mt">${partitionCol('a')}${partitionCol('b')}</div>
    <div class="row mt"><button type="button" class="btn" id="ptRandom">${ic('shuffle')} ${t('pt_random')}</button><button type="button" class="btn go" id="ptMerge">${ic('merge')} ${t('pt_merge')}</button>
        <button type="button" class="btn ghost" id="ptReset">${ic('rotate')} ${t('pt_reset')}</button></div>
    ${m ? `<section class="card mt"><h3>${ic('merge')} ${t('pt_result')}</h3><p class="small">${t('pt_digests', { a: boardDigest(boardMerge(PART.a, PART.b)), b: boardDigest(boardMerge(PART.b, PART.a)) })} · <span class="tag ${check ? 'ok' : 'bad'}">${t(check ? 'pt_same' : 'pt_diff')}</span></p>
      <div class="list">${boardItems(m).map(i => `<div class="li"><span class="grow"><b dir="auto">${esc(i.title)}</b><small>${opt(i.status)} · ${t('bd_lastBy', { name: esc(hlcParse(latestOf(i)).n), t: '' })}</small></span></div>`).join('')}</div>
      <h4 class="mt">${t('pt_conflicts', { n: PART.conflicts.length })}</h4>${PART.conflicts.map(c => `<div class="ackrow">
          <span class="grow">${esc(boardItems(m).find(i => i.id === c.item)?.title || c.item)} · ${t('f_' + c.field)}</span><span class="tag ok">${esc(String(c.win.v))}</span>
          <span class="tag">${esc(String(c.lose.v))}</span></div>`).join('') || `<p class="small muted">${t('pt_noConflicts')}</p>`}</section>` : ''}`;
}

function partitionEdit(key, fn) {
  const clock = key === 'a' ? PART.ca : PART.cb;
  PART[key] = boardMerge(PART[key], fn(PART[key], clock));
  PART.merged = null;
  rerender();
}

// Random edits on both sides: status changes, new items and removals, chosen so conflicts are likely.
function partitionRandom() {
  const r = rng(Date.now() % 100000);
  for (const key of ['a', 'b']) {
    const clock = key === 'a' ? PART.ca : PART.cb;
    for (let i = 0; i < 4; i++) {
      const items = boardItems(PART[key]);
      const it = items[Math.floor(r() * items.length)];
      const roll = r();
      if (roll < 0.6 && it) PART[key] = boardMerge(PART[key], boardSetDelta(PART[key], clock, it.id, { status: ['open', 'progress', 'met'][Math.floor(r() * 3)] }));
      else if (roll < 0.85) PART[key] = boardMerge(PART[key], boardAddDelta(PART[key], clock, 'n-' + randomHex(3), { title: t('pt_randItem', { k: key.toUpperCase(), n: Math.floor(r() * 90 + 10) }), what: 'other', status: 'open', qty: '1' }));
      else if (it) PART[key] = boardMerge(PART[key], boardRemoveDelta(PART[key], it.id));
    }
  }
  PART.merged = null;
  rerender();
}

function bindPartition() {
  $$('[data-pt]').forEach(s => (s.onchange = () => partitionEdit(s.dataset.pt, (st, c) => boardSetDelta(st, c, s.dataset.id, { status: s.value }))));
  $$('[data-ptdel]').forEach(b => (b.onclick = () => partitionEdit(b.dataset.ptdel, st => boardRemoveDelta(st, b.dataset.id))));
  $$('[data-ptadd]').forEach(b => (b.onclick = () => {
    const title = $('#ptNew' + b.dataset.ptadd).value.trim();
    if (title) partitionEdit(b.dataset.ptadd, (st, c) => boardAddDelta(st, c, 'n-' + randomHex(3), { title, what: 'other', status: 'open', qty: '1' }));
  }));
  $('#ptRandom').onclick = partitionRandom;
  $('#ptReset').onclick = () => {
    partitionReset();
    rerender();
  };
  $('#ptMerge').onclick = () => {
    PART.conflicts = [];
    PART.merged = boardMerge(PART.a, PART.b, PART.conflicts);
    rerender();
  };
}

// ---------- hand-drawn SVG charts (no chart library) ----------
const STRAT_COLOR = { direct: '#9aa0a6', flood: '#6cc3ff', epidemic: '#ff7a1a', spray: '#3ddc84' };

function niceMax(v) {
  if (v <= 0) return 1;
  const p = 10 ** Math.floor(Math.log10(v));
  return [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].map(m => m * p).find(m => m >= v * 0.999) || v;
}

/** Horizontal bars: rows of { label, value, color }. */
function barChart(rows, { max = null, fmt = v => fmtNum(v, 2), w = 520, log = false } = {}) {
  const rowH = 30;
  const h = rows.length * rowH + 10;
  const labelW = 92;
  const top = max ?? niceMax(Math.max(...rows.map(r => r.value), 0));
  const scale = v => (log ? Math.log10(1 + v) / Math.log10(1 + top) : v / top);
  const bars = rows.map((r, i) => {
    const y = 6 + i * rowH;
    const bw = Math.max(2, (w - labelW - 70) * clamp(scale(r.value), 0, 1));
    return `<text x="0" y="${y + 17}">${esc(r.label)}</text><rect x="${labelW}" y="${y + 4}" width="${bw.toFixed(1)}" height="18" rx="4" fill="${r.color}"><animate attributeName="width" from="0" to="${bw.toFixed(1)}" dur=".6s" fill="freeze"/></rect><text class="val" x="${labelW + bw + 6}" y="${y + 17}">${esc(fmt(r.value))}</text>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">${bars}</svg>`;
}

function axisTicks(max, n = 4) {
  return Array.from({ length: n + 1 }, (_, i) => (max * i) / n);
}

/** Line chart: series [{ name, color, pts: [[x, y]] }]. */
function lineChart(series, { w = 520, h = 220, xMax = null, yMax = null, xFmt = v => fmtNum(v), yFmt = v => fmtNum(v, 2), xLabel = '', yLabel = '' } = {}) {
  const pad = { l: 46, r: 12, t: 12, b: 34 };
  const all = series.flatMap(s => s.pts);
  const xm = xMax ?? niceMax(Math.max(...all.map(p => p[0]), 0));
  const ym = yMax ?? niceMax(Math.max(...all.map(p => p[1]), 0));
  const X = v => pad.l + (v / xm) * (w - pad.l - pad.r);
  const Y = v => h - pad.b - (v / ym) * (h - pad.t - pad.b);
  const grid = axisTicks(ym).map(v => `<line class="gridl" x1="${pad.l}" x2="${w - pad.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pad.l - 6}" y="${Y(v) + 3}" text-anchor="end">${esc(yFmt(v))}</text>`).join('');
  const xt = axisTicks(xm).map(v => `<text x="${X(v)}" y="${h - pad.b + 14}" text-anchor="middle">${esc(xFmt(v))}</text>`).join('');
  const lines = series.map(s => `<path data-draw d="${s.pts.map((p, i) => `${i ? 'L' : 'M'}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('')}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round"/>${s.dots ? s.pts.map(p => `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3" fill="${s.color}"/>`).join('') : ''}`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">${grid}<line class="axis" x1="${pad.l}" x2="${w - pad.r}" y1="${h - pad.b}" y2="${h - pad.b}"/>${xt}${lines}
    <text x="${(w + pad.l) / 2}" y="${h - 4}" text-anchor="middle">${esc(xLabel)}</text><text x="10" y="${pad.t + 4}" transform="rotate(-90 10 ${pad.t + 4})" text-anchor="end">${esc(yLabel)}</text></svg>`;
}

const legendHtml = items => `<div class="legend">${items.map(([label, color]) => `<span><i style="background:${color}"></i>${esc(label)}</span>`).join('')}</div>`;

/** Tiny sparkline for RTT history and similar series. */
function sparkline(vals, { w = 120, h = 28, color = 'var(--green)' } = {}) {
  if (vals.length < 2) return '';
  const mx = Math.max(...vals) || 1;
  const pts = vals.map((v, i) => `${((i / (vals.length - 1)) * w).toFixed(1)},${(h - (v / mx) * (h - 4) - 2).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6"/></svg>`;
}

// ---------- mesh: live graph of this node's neighbourhood, encounter log, store and queue ----------
function meshNodes() {
  const peers = Object.values(S.contacts).filter(c => c.trust < 3 && (c.pos || isLive(c.id)));
  return peers.map(c => ({ id: c.id, pos: c.pos, live: isLive(c.id), demo: c.demo, v: villagerById(c.id) }));
}

/** Schematic graph: this node in the centre, peers placed by real bearing and a log-scaled distance. */
function meshGraphSvg(size = 300) {
  const c = size / 2;
  const here = myPos();
  const nodes = meshNodes();
  const sosFrom = new Set(openIncidents().map(i => i.from));
  const place = n => {
    if (!here || !n.pos) return { x: c, y: c - size * 0.38 };
    const d = haversine(here, n.pos);
    const r = clamp((Math.log10(1 + d) / Math.log10(1 + 2500)) * size * 0.42, 34, size * 0.44);
    const a = toRad(bearing(here, n.pos));
    return { x: c + Math.sin(a) * r, y: c - Math.cos(a) * r };
  };
  const pts = new Map(nodes.map(n => [n.id, place(n)]));
  pts.set(ME.id, { x: c, y: c });
  const recent = VILLAGE.edges.filter(e => now() - e.ts < 15 * MIN && pts.has(e.a) && pts.has(e.b));
  const edges = [...recent.map(e => ({ ...e, live: false })), ...nodes.filter(n => n.live).map(n => ({ a: ME.id, b: n.id, live: true }))];
  const rings = [0.18, 0.31, 0.44].map(f => `<circle class="ringg" cx="${c}" cy="${c}" r="${size * f}"/>`).join('');
  const lines = edges.map(e => `<line class="edge ${e.live ? 'live' : ''}" x1="${pts.get(e.a).x}" y1="${pts.get(e.a).y}" x2="${pts.get(e.b).x}" y2="${pts.get(e.b).y}"/>`).join('');
  const dots = nodes.map(n => {
    const p = pts.get(n.id);
    const r = 7 + Math.min(6, (n.v?.ctx.core.store.size || 0) / 12);
    return `<g data-node="${n.id}" style="cursor:pointer"><circle class="nodec ${n.live ? 'live' : ''} ${sosFrom.has(n.id) ? 'sos' : ''}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r.toFixed(1)}"/>${n.v?.busy ? `<circle class="pulse" cx="${p.x}" cy="${p.y}" r="3"/>` : ''}<text x="${p.x.toFixed(1)}" y="${(p.y + r + 10).toFixed(1)}">${esc(firstName(n.id).slice(0, 10))}</text></g>`;
  }).join('');
  return `<svg class="meshsvg" viewBox="0 0 ${size} ${size}" role="img" aria-label="${t('mesh_graphAria', { n: nodes.length })}">${rings}${lines}${dots}<circle class="nodec me" cx="${c}" cy="${c}" r="10"/><text x="${c}" y="${c + 22}">${esc(t('you'))}</text></svg>`;
}

function bindSim() {
  $$('[data-param]').forEach(inp => (inp.oninput = () => {
    SIMV.params[inp.dataset.param] = Number(inp.value);
    $('#pv_' + inp.dataset.param).textContent = paramText(inp.dataset.param, Number(inp.value));

    rerender();
  };
  if ($('#simCsv')) $('#simCsv').onclick = exportSimCsv;

  if (SIMV.res) bindReplay();

const simProgress = f => $('#simProg') && ($('#simProg').style.width = Math.round(f * 100) + '%');

async function runSimUI() {
  SIMV.running = true;
  $('#simRun').disabled = true;
  simProgress(0.02);
  await sleep(30);
  const p = { ...SIM_DEFAULTS, ...SIMV.params };
  const tr = simMobility(p);
  simProgress(0.15);
  await sleep(0);
  const ct = simContacts(p, tr);
  simProgress(0.3);
  await sleep(0);
  const work = simWorkload(p);
  const results = [];
  for (const [i, s] of STRATEGIES.entries()) {
    results.push(simRun(p, s, tr, ct, work));
    simProgress(0.3 + (0.7 * (i + 1)) / STRATEGIES.length);
    await sleep(0);
  }
  SIMV.res = { p, tr, ct, work, results };
  SIMV.play = { s: 0, raf: 0, strategy: 'epidemic', track: null, msg: (work.find(w => w.sos) || work[0])?.i };
  S.sim = { at: now(), p, results: results.map(r => ({ strategy: r.strategy, ratio: r.ratio, sosRatio: r.sosRatio, latMean: r.latMean, latP90: r.latP90, tx: r.tx, overhead: r.overhead, meanHops: r.meanHops })) };
  persist('sim');
  logEvent('lg_sim', { n: p.nodes }, 'sim');
  SIMV.running = false;
  rerender();
  announce(t('sim_done'));
}

function exportSimCsv() {
  const r = SIMV.res;
  const head = [['# Rabta mesh simulator', ...Object.entries(r.p).map(([k, v]) => `${k}=${v}`)], ['strategy', 'delivery_ratio', 'sos_delivery_ratio', 'mean_latency_min', 'median_latency_min', 'p90_latency_min', 'transmissions', 'overhead_copies_per_delivered', 'mean_hops', 'peak_buffer']];
  const rows = r.results.map(x => [x.strategy, x.ratio.toFixed(4), x.sosRatio.toFixed(4), (x.latMean / 60).toFixed(2), (x.latMedian / 60).toFixed(2), (x.latP90 / 60).toFixed(2), x.tx, x.overhead.toFixed(2), x.meanHops.toFixed(2), x.peakBuf]);
  downloadFile(`rabta-sim-${r.p.nodes}n-seed${r.p.seed}.csv`, toCsv([...head, ...rows]), 'text/csv');
}

function ensureTrack() {
  const P = SIMV.play;
  if (P.track && P.track.strategy === P.strategy) return P.track;
  const r = SIMV.res;
  P.track = simRun(r.p, P.strategy, r.tr, r.ct, r.work, 'sim' + P.msg);
  P.track.strategy = P.strategy;
  return P.track;
}

function drawReplay() {
  const cv = $('#rpCanvas');
  if (!cv) return;
  const { p, tr, ct, work } = SIMV.res;
  const P = SIMV.play;
  const track = ensureTrack();
  const g = cv.getContext('2d');
  const k = cv.width / p.area;
  const o = P.s * p.nodes;
  const w = work.find(x => x.i === P.msg);
  g.clearRect(0, 0, cv.width, cv.height);
  g.strokeStyle = 'rgba(61,220,132,.55)';
  g.lineWidth = 1.5;
  const pairs = ct.pairs[P.s];
  for (let i = 0; i < pairs.length; i += 2) {
    g.beginPath();
    g.moveTo(tr.xs[o + pairs[i]] * k, tr.ys[o + pairs[i]] * k);
    g.lineTo(tr.xs[o + pairs[i + 1]] * k, tr.ys[o + pairs[i + 1]] * k);
    g.stroke();
  }
  const holders = track.track[P.s] || [];
  for (let i = 0; i < p.nodes; i++) {
    g.fillStyle = holders[i] ? '#ff7a1a' : '#5b636a';
    g.beginPath();
    g.arc(tr.xs[o + i] * k, tr.ys[o + i] * k, holders[i] ? 7 : 5, 0, Math.PI * 2);
    g.fill();
  }
  replayMarks(g, k, o, w, tr);
  const held = [...holders].reduce((a, b) => a + b, 0);
  $('#rpTime').textContent = fmtMin(P.s * p.dt);
  $('#rpInfo').innerHTML = t('rp_info', { held, n: p.nodes, created: fmtMin(w.t), src: w.src, dst: w.dst, sos: w.sos ? 'SOS' : '' });
}

function replayMarks(g, k, o, w, tr) {
  g.strokeStyle = '#ffffff';
  g.lineWidth = 2.5;
  g.beginPath();
  g.arc(tr.xs[o + w.dst] * k, tr.ys[o + w.dst] * k, 11, 0, Math.PI * 2);
  g.stroke();
  g.strokeStyle = '#ff7a1a';
  g.strokeRect(tr.xs[o + w.src] * k - 9, tr.ys[o + w.src] * k - 9, 18, 18);
}

function playReplay() {
  const P = SIMV.play;
  if (P.raf) {
    cancelAnimationFrame(P.raf);
    P.raf = 0;
    return rerenderReplayBtn();
  }
  let last = 0;
  const step = ts => {
    if (!$('#rpCanvas')) return (P.raf = 0);
    if (ts - last > 33) {
      last = ts;
      P.s = (P.s + 1) % SIMV.res.tr.steps;
      $('#rpScrub').value = P.s;
      drawReplay();
    }
    P.raf = requestAnimationFrame(step);
  };
  P.raf = requestAnimationFrame(step);
  rerenderReplayBtn();
}

function rerenderReplayBtn() {
  const b = $('#rpPlay');
  if (b) b.innerHTML = `${ic(SIMV.play.raf ? 'pause' : 'play')} ${t(SIMV.play.raf ? 'rp_pause' : 'rp_play')}`;
}

function bindReplay() {
  const P = SIMV.play;
  $('#rpStrat').onchange = e => {
    P.strategy = e.target.value;
    drawReplay();
  };
  $('#rpPlay').onclick = playReplay;
  $('#rpScrub').oninput = e => {
    P.s = Number(e.target.value);
    drawReplay();
  };
  drawReplay();
}

function sweepHtml() {

        <div>${lineChart(series('overhead'), { xFmt: v => fmtNum(v), yFmt: v => fmtNum(v), xLabel: t('sp_' + sw.key), yLabel: t('sr_overhead') })}</div></div>${legendHtml(STRATEGIES.map(s => [t('rt_' + s), STRAT_COLOR[s]]))}` : ''}</section>`;
}

async function runSweep() {
  const key = SIMV.sweepKey;
  const rows = [];
  for (const [i, v] of SWEEPS[key].entries()) {
    const run = simCompare({ ...SIMV.params, [key]: v });
    const row = { v };
    run.results.forEach(r => (row[r.strategy] = { ratio: r.ratio, overhead: r.overhead, lat: r.latMean / 60 }));
    rows.push(row);
    if ($('#swProg')) $('#swProg').style.width = Math.round(((i + 1) / SWEEPS[key].length) * 100) + '%';
    await sleep(0);
  }
  SIMV.sweep = { key, rows };
  rerender();
}

function bindSweep() {
  $('#swKey').onchange = e => {
    SIMV.sweepKey = e.target.value;
    SIMV.sweep = null;
    rerender();
  };
  $('#swRun').onclick = e => {
    e.target.disabled = true;
    runSweep();
  };
  if ($('#swCsv')) $('#swCsv').onclick = () => {
    const sw = SIMV.sweep;
    const rows = sw.rows.flatMap(r => STRATEGIES.map(s => [sw.key, r.v, s, r[s].ratio.toFixed(4), r[s].overhead.toFixed(2), r[s].lat.toFixed(2)]));
    downloadFile(`rabta-sweep-${sw.key}.csv`, toCsv([['param', 'value', 'strategy', 'delivery_ratio', 'overhead', 'mean_latency_min'], ...rows]), 'text/csv');
  };
}

const SCAN = { stream: null, raf: 0 };

function stopScan() {
  cancelAnimationFrame(SCAN.raf);
  SCAN.raf = 0;
  if (SCAN.stream) SCAN.stream.getTracks().forEach(tr => tr.stop());
  SCAN.stream = null;
}

function scanQr(onText, title) {
  const camOk = HAS_BD && HAS_CAM;
  const sh = openModal(`${sheetHead(title, 'scan')}${camOk ? `<video id="scanVid" playsinline muted style="width:100%;border-radius:12px;background:#000;max-height:50vh"></video>
      <p class="small muted mt" id="scanMsg">${t('sc_point')}</p>` : `<div class="note warn">${ic('info')}<div>${t('sc_noDetector')}</div></div>`}

  $('#scanUse', sh).onclick = () => {
    const v = $('#scanText', sh).value.trim();
    if (!v) return;
    closeModal();
    onText(v);
  };
  if (camOk) startScanLoop(sh, onText);
}

async function startScanLoop(sh, onText) {
  try {
    SCAN.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const vid = $('#scanVid', sh);
    vid.srcObject = SCAN.stream;
    await vid.play();
    const det = new BarcodeDetector({ formats: ['qr_code'] });
    const loop = async () => {
      if (!SCAN.stream) return;
      const codes = await det.detect(vid).catch(() => []);
      if (codes.length) {
        closeModal();
        return onText(codes[0].rawValue);
      }
      SCAN.raf = requestAnimationFrame(loop);
    };
    loop();
  } catch {
    if ($('#scanMsg', sh)) $('#scanMsg', sh).textContent = t('sc_camDenied');
  }
}

}

/** Offline loopback: encode → random silence → AWGN at the chosen SNR → decode. No audio hardware used. */
function runSoundLoopback(text, snrDb, seed = Date.now() % 100000, fs = 48000) {
  const full = fitBytes(soundPayload(text), FSK.maxLen);
  const payload = utf8(full);
  const clean = fskModulate(fskFrameBits(payload), fs, { lead: 0.1 + (seed % 7) / 10 });
  const noisy = addNoise(clean, snrDb, seed);
  const t0 = performance.now();
  const r = fskDecode(noisy, fs);
  const ms = performance.now() - t0;
  let bitErrors = 0;
  const got = r.bytes || new Uint8Array(0);
  for (let i = 0; i < payload.length; i++) {
    let x = payload[i] ^ (got[i] ?? 0);
    while (x) {
      bitErrors += x & 1;
      x >>= 1;
    }
  }
  const ok = r.ok && r.text === full;
  return { ...r, text: ok ? r.text.split('|').slice(1).join('|') : '', ok, bitErrors, bits: payload.length * 8, air: clean.length / fs, ms, samples: noisy, fs };
}

function soundTrials(text) {
  return [-14, -11, -8, -5, -2, 1].map(snr => {
    let ok = 0;
    for (let i = 0; i < 8; i++) if (runSoundLoopback(text, snr, snr * 1000 + i * 37 + 11).ok) ok++;
    return { snr, rate: ok / 8 };
  });
}

function drawWaterfall(cv, samples, fs) {
  const spec = spectrogram(samples, fs, 240);
  const g = cv.getContext('2d');
  const max = Math.max(...spec.flat(), 1e-9);
  const cw = cv.width / spec.length;
  const ch = cv.height / 24;
  g.fillStyle = '#0d0f10';
  g.fillRect(0, 0, cv.width, cv.height);
  spec.forEach((col, x) => col.forEach((p, y) => {
    const v = Math.sqrt(p / max);
    g.fillStyle = v > 0.6 ? `rgba(255,122,26,${v})` : `rgba(61,220,132,${Math.min(1, v * 1.6)})`;
    g.fillRect(x * cw, cv.height - (y + 1) * ch, cw + 0.5, ch + 0.5);
  }));
  g.fillStyle = '#959a9f';
  g.font = '11px Space Mono, monospace';
  g.fillText('3.3 kHz', 6, 12);
  g.fillText('1 kHz', 6, cv.height - 4);
}

async function playSound() {
  const text = $('#sdText').value.trim();
  if (!text || SOUNDV.playing) return;
  const payload = utf8(soundPayload(text));
  if (payload.length > FSK.maxLen) return toast(t('sd_tooLong'), 'bad');
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const samples = fskModulate(fskFrameBits(payload), ctx.sampleRate);
    const buf = ctx.createBuffer(1, samples.length, ctx.sampleRate);
    buf.copyToChannel(samples, 0);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    SOUNDV.playing = true;
    src.onended = () => {
      SOUNDV.playing = false;
      ctx.close();
    };
    src.start();
    drawWaterfall($('#sdWave'), samples, ctx.sampleRate);
    toast(t('sd_playing', { s: (samples.length / ctx.sampleRate).toFixed(1) }));
    logEvent('lg_soundTx', { n: payload.length }, 'sound');
  } catch {
    toast(t('sd_audioErr'), 'bad');
  }
}

// ---------- listening: mic samples into an 8-second ring buffer, decoded every 0.7 s ----------
async function startListen() {
  try {
    LISTEN.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  } catch {
    return toast(t('cp_micDenied'), 'bad');
  }
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  LISTEN.ctx = ctx;
  LISTEN.buf = new Float32Array(ctx.sampleRate * 8);
  LISTEN.len = 0;
  const src = ctx.createMediaStreamSource(LISTEN.stream);
  LISTEN.proc = ctx.createScriptProcessor(4096, 1, 1);
  LISTEN.proc.onaudioprocess = e => listenPush(e.inputBuffer.getChannelData(0));
  src.connect(LISTEN.proc);
  LISTEN.proc.connect(ctx.destination);
  LISTEN.timer = setInterval(listenDecode, 700);
  rerender();
}

function listenPush(chunk) {
  const b = LISTEN.buf;
  if (LISTEN.len + chunk.length > b.length) {
    const drop = LISTEN.len + chunk.length - b.length;
    b.copyWithin(0, drop, LISTEN.len);
    LISTEN.len -= drop;
  }
  b.set(chunk, LISTEN.len);
  LISTEN.len += chunk.length;
  let s = 0;
  for (const x of chunk) s += x * x;
  LISTEN.level = Math.sqrt(s / chunk.length);
}

function listenDecode() {
  const lv = $('#sdLevel');
  if (lv) lv.innerHTML = `<div class="bar"><i style="width:${Math.min(100, LISTEN.level * 400).toFixed(0)}%"></i></div><p class="tiny muted">${t('sd_listening')}</p>`;
  if (LISTEN.len < LISTEN.ctx.sampleRate * 1.5) return;
  const r = fskDecode(LISTEN.buf.subarray(0, LISTEN.len), LISTEN.ctx.sampleRate);
  if (!r.ok) return;
  LISTEN.buf.copyWithin(0, Math.min(LISTEN.len, r.end), LISTEN.len);
  LISTEN.len -= Math.min(LISTEN.len, r.end);
  deliverSound(r);
}

function stopListen() {
  clearInterval(LISTEN.timer);
  if (LISTEN.stream) LISTEN.stream.getTracks().forEach(tr => tr.stop());
  if (LISTEN.ctx) LISTEN.ctx.close();
  Object.assign(LISTEN, { ctx: null, stream: null, proc: null, len: 0 });
  if (curRoute === 'sound') rerender();
}

/** A decoded sound frame becomes an (unsigned) message in #village, marked as heard over sound. */
function deliverSound(r) {
  const [prefix, ...rest] = r.text.split('|');
  const text = rest.join('|');
  const known = Object.values(S.contacts).find(c => c.id.startsWith(prefix));
  const from = known?.id || prefix.padEnd(16, '0');
  const ts = Math.floor(now() / 1000) * 1000;
  const m = { v: 1, id: randomHex(8), kind: 'text', ch: '#village', from, name: known?.name || t('sd_unknown', { p: prefix }), to: null, ts, exp: ts + S.settings.ttlH * HOUR, hl: S.settings.hl, prio: 0, body: { t: text, sound: true }, enc: null };
  if (storeAccept(ME.core, m, [from, ME.id], now()) === 'stored') {
    const entry = ME.core.store.get(m.id);
    Object.assign(entry, { verified: 'none', via: 'sound' });
    afterStored(ME, entry);
  }
  SOUNDV.heard.unshift({ text, from: m.name, ts: now(), snr: r.snr });
  toast(t('sd_got', { text }), 'ok');
  if (curRoute === 'sound') rerender();
}

// ---------- Web Serial ----------
async function serialConnect() {
  try {
    RADIO.port = await navigator.serial.requestPort();
    await RADIO.port.open({ baudRate: RADIO.baud });
    RADIO.writer = RADIO.port.writable.getWriter();
    RADIO.parser = new FrameParser();
    radioRecord({ type: 'log', text: t('rd_opened', { b: RADIO.baud }) });
    logEvent('lg_serial', {}, 'radio');
    serialReadLoop();
    if (RADIO.mode === 'meshtastic') radioWrite(new Uint8Array(32).fill(MT_START2));
  } catch (e) {
    RADIO.port = null;
    toast(t('rd_err', { e: e.message }), 'bad');
  }
  rerender();
}

async function serialReadLoop() {
  RADIO.reader = RADIO.port.readable.getReader();
  try {
    for (;;) {
      const { value, done } = await RADIO.reader.read();
      if (done) break;
      radioBytes(value);
    }
  } catch (e) {
    radioRecord({ type: 'error', text: e.message });
  } finally {
    RADIO.reader.releaseLock();
  }
}

async function serialClose() {
  try {
    await RADIO.reader?.cancel();
    RADIO.writer?.releaseLock();
    await RADIO.port?.close();
  } catch {
    /* already closed */
  }
  RADIO.port = null;
  rerender();
}

async function radioWrite(bytes) {
  if (RADIO.sim) return simRadioHear(bytes);
  if (RADIO.writer) await RADIO.writer.write(bytes);
}
const radioWriteLine = text => {
  radioRecord({ type: 'out', text });
  return radioWrite(utf8(text + '\n'));
};

function radioBytes(bytes) {
  if (RADIO.mode === 'meshtastic') {
    for (const ev of RADIO.parser.push(bytes)) radioRecord(ev.type === 'frame' ? { type: 'frame', bytes: ev.payload } : ev);
    return;
  }
  RADIO.lineBuf += fromUtf8(bytes);
  const lines = RADIO.lineBuf.split('\n');
  RADIO.lineBuf = lines.pop();
  lines.filter(l => l.trim()).forEach(radioLine);
}

/** DIY board says "RX <rssi> <snr> <base64url>": unpack, verify the signature, store like any copy. */
async function radioLine(line) {
  const p = parseRadioLine(line);
  if (p.type !== 'rx') return radioRecord({ type: p.type === 'log' ? 'log' : 'line', text: line.trim() });
  const rec = { type: 'rx', rssi: p.rssi, snr: p.snr, size: 0 };
  try {
    const bytes = fromB64u(p.data);
    const { m } = unpackMsg(bytes);
    if (!m.pk && contactOf(m.from)?.pk) m.pk = contactOf(m.from).pk;
    rec.msg = m;
    rec.size = bytes.length;
    rec.verdict = await verifyMsg(m);
    if (rec.verdict !== 'bad' && storeAccept(ME.core, m, [m.from, ME.id], now()) === 'stored') {
      const entry = ME.core.store.get(m.id);
      Object.assign(entry, { verified: rec.verdict, via: 'radio', radio: { rssi: p.rssi, snr: p.snr } });
      afterStored(ME, entry);
    }
  } catch {
    rec.msg = null;
  }
  radioRecord(rec);
}

async function radioSendText(text) {
  if (!text || !ME.keys) return;
  const m = await createMsg(ME, { kind: 'text', ch: '#village', body: { t: text }, ttlH: S.settings.ttlH, hl: S.settings.hl });
  let bytes;
  try {
    bytes = packMsg(m);
  } catch {
    return toast(t('rd_tooBig', { n: byteLen(JSON.stringify(m.body)) + 120 }), 'bad');
  }
  await radioWriteLine('TX ' + b64u(bytes));
  $('#rdSize').textContent = t('rd_sent', { n: bytes.length, max: LORA_MAX });
}

// Short texts a distant villager might send over LoRa (kept short: the whole signed packet must fit 240 bytes).
const RADIO_TEXTS = [
  ['Water at the lower bridge is 2 m deep', 'نچلے پل پر پانی 2 میٹر گہرا ہے'],
  ['Need diesel at the health unit', 'مرکز صحت پر ڈیزل چاہیے'],
  ['Upper road open for jeeps', 'اوپر والا راستہ جیپوں کے لیے کھلا ہے'],
  ['Two boats at the school side', 'اسکول کی طرف دو کشتیاں ہیں'],
];

// A villager signs a fresh short message and the fake board reports it as received over LoRa.
async function simRadioPacket(v) {
  const ts = Math.floor(now() / 1000) * 1000;
  const m = { v: 1, id: randomHex(8), kind: 'text', ch: '#village', from: v.ctx.id, name: v.ctx.name, to: null, ts, exp: ts + 24 * HOUR, hl: 8, prio: 0, body: { t: L(RADIO_TEXTS[RADIO.simTick % RADIO_TEXTS.length]) }, enc: null, pk: v.ctx.pk };
  await signMsg(m, v.ctx.keys);
  return packMsg(m, 2);
}

// DIY mode streams RX lines; Meshtastic mode streams debug text plus framed protobuf packets.
async function simRadioTick() {
  RADIO.simTick++;
  const v = VILLAGE.nodes[RADIO.simTick % Math.max(1, VILLAGE.nodes.length)];
  if (RADIO.mode === 'diy') {
    const packed = v && RADIO.simTick % 3 ? await simRadioPacket(v) : null;
    const line = packed ? `RX ${-80 - (RADIO.simTick % 30)} ${(9.5 - (RADIO.simTick % 12)).toFixed(1)} ${b64u(packed)}\n` : `INFO 433.175 MHz SF9 BW125 (simulated)\n`;
    return radioBytes(utf8(line));
  }
  const text = L(RADIO_TEXTS[RADIO.simTick % RADIO_TEXTS.length]);
  const packet = [[1, 'fixed32', 0xa1b20000 + RADIO.simTick], [2, 'fixed32', 0xffffffff], [4, 'msg', [[1, 'varint', 1], [2, 'string', text]]], [6, 'fixed32', (Math.random() * 2 ** 32) >>> 0], [7, 'fixed32', Math.floor(now() / 1000)], [8, 'float', 6.25], [9, 'varint', 3], [12, 'varint', 87]];
  const frame = mtWrap(pbEncode([[1, 'varint', RADIO.simTick], [2, 'msg', packet]]));
  radioBytes(concatBytes(utf8(`DEBUG | ${hhmm(now())} [Router] Received packet (simulated)\n`), frame));
}

// ---------- offline map: peers and incidents on a relative grid (no tiles), optional Leaflet when online ----------
const MAPV = { layers: { peers: true, incidents: true, responders: false }, pin: null, leaflet: null, sel: '' };

const LEAFLET_CSS = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';

// Metres east (x) and north (y) of a centre point: an equirectangular projection is exact enough at village scale.
function enu(center, p) {
  return { x: toRad(p.lng - center.lng) * 6371000 * Math.cos(toRad(center.lat)), y: toRad(p.lat - center.lat) * 6371000 };
}

function gridStep(extent) {
  return [50, 100, 250, 500, 1000, 2500, 5000].find(s => extent / s <= 5) || 10000;
}

/** Points [{ id, lat, lng, color, label, shape, ring }] around this node; returns an SVG string. */
function gridMapSvg(points, { size = 460, selectable = false } = {}) {
  const center = myPos() || PLACE;
  const xy = points.map(p => ({ ...p, ...enu(center, p) }));
  const extent = Math.max(200, ...xy.map(p => Math.max(Math.abs(p.x), Math.abs(p.y)))) * 1.15;
  const step = gridStep(extent);
  const k = size / 2 / extent;
  const c = size / 2;
  const lines = [];
  for (let v = -Math.floor(extent / step) * step; v <= extent; v += step) {
    lines.push(`<line class="grid" x1="${c + v * k}" y1="0" x2="${c + v * k}" y2="${size}"/><line class="grid" x1="0" y1="${c - v * k}" x2="${size}" y2="${c - v * k}"/>`);
  }
  const rings = [1, 2].map(i => `<circle class="ring" cx="${c}" cy="${c}" r="${step * i * k}"/><text x="${c + step * i * k + 3}" y="${c - 3}">${fmtDist(step * i)}</text>`).join('');
  const marks = xy.map(p => {
    const px = c + p.x * k;
    const py = c - p.y * k;
    const shape = p.shape === 'tri' ? `<path d="M${px} ${py - 8} L${px + 7} ${py + 5} L${px - 7} ${py + 5}Z" fill="${p.color}"/>` : `<circle cx="${px}" cy="${py}" r="${p.ring ? 9 : 7}" fill="${p.color}" stroke="${p.ring ? 'var(--ink)' : 'var(--bg)'}" stroke-width="2"/>`;
    const flip = px > size - 80;
    return `<g ${selectable ? `data-mappt="${esc(p.id)}" style="cursor:pointer"` : ''}>${shape}<text class="lbl" x="${flip ? px - 10 : px + 10}" y="${py + 4}" text-anchor="${flip ? 'end' : 'start'}">${esc(p.label || '')}</text></g>`;
  }).join('');
  const me = `<circle cx="${c}" cy="${c}" r="8" fill="var(--orange)" stroke="var(--ink)" stroke-width="2"/><text class="lbl" x="${c + 11}" y="${c + 16}">${esc(t('you'))}</text>`;
  const north = `<g transform="translate(${size - 26} 26)"><path d="M0 -14 L6 6 L0 2 L-6 6Z" fill="var(--ink)"/><text x="0" y="18" text-anchor="middle">N</text></g>`;
  return `<svg class="mapsvg" viewBox="0 0 ${size} ${size}" role="img" aria-label="${t('map_aria', { n: points.length })}">${lines.join('')}${rings}${marks}${me}${north}</svg>`;
}

function mapPoints() {

function loadLeaflet() {
  if (window.L?.map) return Promise.resolve(window.L);
  return new Promise((resolve, reject) => {
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = LEAFLET_CSS;
    document.head.append(css);
    const s = document.createElement('script');
    s.src = LEAFLET_JS;
    s.onload = () => resolve(window.L);
    s.onerror = () => reject(new Error('offline'));
    document.head.append(s);
  });
}

// ---------- identity: keys, fingerprint words, identity QR, in-person verification, trust levels ----------
const ID_PREFIX = 'RBID';

function identityCode() {
  const body = new ByteWriter().u8(1).str(ME.name).bytes(fromB64u(ME.pk)).bytes(fromB64u(ME.dh)).out();
  const crc = crc16(body);
  return ID_PREFIX + base32(concatBytes(body, Uint8Array.of(crc >> 8, crc & 255)));
}

async function parseIdentityCode(code) {
  const clean = String(code).toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!clean.startsWith(ID_PREFIX)) throw new Error('prefix');
  const bytes = fromBase32(clean.slice(ID_PREFIX.length));
  const body = bytes.slice(0, -2);
  if (crc16(body) !== ((bytes[bytes.length - 2] << 8) | bytes[bytes.length - 1])) throw new Error('crc');
  const r = new ByteReader(body);
  r.u8();
  const name = r.str();
  const pk = b64u(r.bytes(33));
  const dh = b64u(r.bytes(33));
  return { name, pk, dh, id: await idFromPub(pk) };
}
