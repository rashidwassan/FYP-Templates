function learnGrowth() {
  const W = Math.max(300, ($('#lBody').clientWidth || 720) - 34);
  const H = W < 520 ? 300 : 380;
  const pl = 50;
  const pr = 16;
  const pt = 16;
  const pb = 36;
  const N = 32;
  const yMax = Math.log10(2 ** N);
  const X = n => pl + (n - 1) / (N - 1) * (W - pl - pr);
  const Y = v => pt + (H - pt - pb) * (1 - Math.log10(Math.max(1, v)) / yMax);
  const superscripts = '⁰¹²³⁴⁵⁶⁷⁸⁹';
  const grid = Array.from({ length: 10 }, (_, i) =>
    `<line x1="${pl}" x2="${W - pr}" y1="${Y(10 ** i)}" y2="${Y(10 ** i)}" stroke="${COL.line}" stroke-dasharray="3 4"/><text x="${pl - 8}" y="${Y(10 ** i) + 4}" fill="${COL.muted}" font-size="11" text-anchor="end" font-family="Fira Code,monospace">10${superscripts[i]}</text>`
  ).join('');
  const xTicks = [1, 4, 8, 12, 16, 20, 24, 28, 32].map(n => `<text x="${X(n)}" y="${H - pb + 18}" fill="${COL.muted}" font-size="11" text-anchor="middle" font-family="Fira Code,monospace">${n}</text>`).join('');
  const paths = GROWTH_FN.map(([, f, color], i) => {
    const d = Array.from({ length: N }, (_, k) => `${k ? 'L' : 'M'}${X(k + 1).toFixed(1)},${Y(f(k + 1)).toFixed(1)}`).join(' ');
    return `<path data-f="${i}" d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  }).join('');
  const legend = GROWTH_FN.map(([label, , color]) => `<span><i style="background:${color}"></i>${label}</span>`).join('');
  const dots = GROWTH_FN.map(([, , color]) => `<circle r="4" fill="${color}" stroke="#13111c" stroke-width="2" visibility="hidden"/>`).join('');
  $('#lBody').innerHTML = `
    <div class="panel chart enter" style="position:relative">
      <h3>${ic('trending-up')} Growth of common complexities (log scale)</h3>
      <div class="legend" style="margin-bottom:8px">${legend}</div>
      <svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="Growth rate chart">${grid}${xTicks}<text x="${(pl + W - pr) / 2}" y="${H - 4}" fill="${COL.muted}" font-size="11" text-anchor="middle" font-family="Manrope">n (input size)</text>${paths}<line id="gCursor" x1="0" x2="0" y1="${pt}" y2="${H - pb}" stroke="${COL.ink}" stroke-opacity=".5" visibility="hidden"/><g id="gDots">${dots}</g></svg>
      <div class="tip hidden" id="gTip"></div>
      <p class="muted" style="font-size:.84rem;margin:10px 0 0">Hover or touch the chart. The y-axis is logarithmic: every grid line is 10× the one below. At n = 32, 2ⁿ is already over four billion while n log n is 160 — this is why exponential brute force fails and O(n log n) sorting feels instant.</p>
    </div>`;
  const svg = $('.chart svg.plot');
  $$('path[data-f]', svg).forEach(drawPath);
  bindGrowthHover(svg, { W, pl, pr, N, X, Y });
}

function bindGrowthHover(svg, geom) {
  const { W, pl, pr, N, X, Y } = geom;
  const dots = [...$('#gDots').children];
  const show = e => {
    const box = svg.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const mx = (clientX - box.left) * W / box.width;
    const n = clamp(Math.round(1 + (mx - pl) / (W - pl - pr) * (N - 1)), 1, N);
    const cursor = $('#gCursor');
    cursor.setAttribute('x1', X(n));
    cursor.setAttribute('x2', X(n));
    cursor.setAttribute('visibility', 'visible');
    dots.forEach((dot, i) => {
      dot.setAttribute('cx', X(n));
      dot.setAttribute('cy', Y(GROWTH_FN[i][1](n)));
      dot.setAttribute('visibility', 'visible');
    });
    const tip = $('#gTip');
    tip.classList.remove('hidden');
    const rows = GROWTH_FN.map(([label, f, color]) => {
      const value = f(n);
      const text = value >= 1e6 ? value.toExponential(2) : nf(Math.round(value * 10) / 10);
      return `<span style="color:${color}">${label}</span> = ${text}`;
    });
    tip.innerHTML = `<b>n = ${n}</b><br>${rows.join('<br>')}`;
    const panel = svg.parentElement.getBoundingClientRect();
    tip.style.left = Math.min(panel.width - 190, Math.max(0, clientX - panel.left + 14)) + 'px';
    tip.style.top = (box.top - panel.top + 20) + 'px';
  };
  const hide = () => {
    $('#gTip').classList.add('hidden');
    $('#gCursor').setAttribute('visibility', 'hidden');
    dots.forEach(dot => dot.setAttribute('visibility', 'hidden'));
  };
  svg.addEventListener('mousemove', show);
  svg.addEventListener('touchstart', show, { passive: true });
  svg.addEventListener('touchmove', show, { passive: true });
  svg.addEventListener('mouseleave', hide);
}

/* =====================================================================
   REPORTS — printable lab reports built from the current model
   ===================================================================== */
function reportHeader(title, subtitle) {
  const date = new Date().toLocaleString('en-GB', { dateStyle: 'long', timeStyle: 'short' });
  return `<h1>${esc(title)}</h1><div class="sub">${esc(subtitle)} · generated ${esc(date)} · Algorithm Visualizer</div>`;
}

function reportKpis(items) {
  return `<div class="kpis">${items.map(([k, v]) => `<div class="kpi"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('')}</div>`;
}

function reportCode(code) {
  return `<ol class="code">${code.map(l => `<li><span class="src">${hlLine(l)}</span></li>`).join('')}</ol>`;
}

function stepDetail(step) {
  if (step.type === 'set') return `a[${step.i}] = ${step.v}`;
  if (step.i != null && step.j != null) return `${step.i} ↔ ${step.j}`;
  if (step.k != null) return `(${step.r}, ${step.c})`;
  if (step.n != null) return L(step.n);
  if (step.e != null) return `edge ${step.e}`;
  if (step.lo != null) return `${step.lo}..${step.hi}`;
  return step.i != null ? String(step.i) : '';
}

function stepsTable(steps, limit = 30) {
  const rows = steps.slice(0, limit)
    .map((step, i) => `<tr><td class="n">${i + 1}</td><td>${esc(step.type)}</td><td class="n">${esc(stepDetail(step))}</td><td>${esc(step.note || '')}</td></tr>`)
    .join('');
  const more = steps.length > limit ? `<tr><td colspan="4" class="sub">… ${nf(steps.length - limit)} more steps</td></tr>` : '';
  return `<table><thead><tr><th class="n">#</th><th>Type</th><th class="n">Detail</th><th>Explanation</th></tr></thead><tbody>${rows}${more}</tbody></table>`;
}

function barsSvg(model) {
  const W = 640;
  const H = 180;
  const n = model.arr.length;
  const max = Math.max(...model.arr, 1);
  const bw = (W - 20) / n;
  const bars = model.arr.map((v, i) => {
    const h = Math.max(1, (H - 20) * v / max);
    const color = model.sorted.has(i) ? COL.srt : i === model.pivot ? COL.piv : '#8a86a8';
    return `<rect x="${(10 + i * bw).toFixed(1)}" y="${(H - 10 - h).toFixed(1)}" width="${Math.max(1, bw - 1).toFixed(1)}" height="${h.toFixed(1)}" fill="${color}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${bars}</svg>`;
}

function gridSvg(track) {
  const cs = Math.min(640 / G.cols, 360 / G.rows);
  const W = cs * G.cols;
  const H = cs * G.rows;
  const m = track.model;
  let cells = '';
  for (let k = 0; k < G.cells.length; k++) {
    const v = G.cells[k];
    const st = m.state[k];
    let fill = '#f3f2f8';
    if (v === WALL) fill = '#3d3856';
    else if (v === MUD) fill = '#c9b79c';
    if (st === VISITED) fill = '#8dbdd0';
    else if (st === FRONTIER) fill = '#d7eef3';
    if (st === PATH) fill = '#f0b454';
    cells += `<rect x="${((k % G.cols) * cs).toFixed(1)}" y="${(((k / G.cols) | 0) * cs).toFixed(1)}" width="${(cs - .5).toFixed(1)}" height="${(cs - .5).toFixed(1)}" fill="${fill}"/>`;
  }
  const dot = (p, color, letter) => `<circle cx="${(p.c + .5) * cs}" cy="${(p.r + .5) * cs}" r="${cs * .42}" fill="${color}"/><text x="${(p.c + .5) * cs}" y="${(p.r + .5) * cs + 1}" font-size="${cs * .55}" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#fff" font-family="Manrope">${letter}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W.toFixed(0)}" height="${H.toFixed(0)}">${cells}${dot(G.start, '#2a9d8f', 'S')}${dot(G.end, '#d23c6e', 'E')}</svg>`;
}

function graphSvg(track) {
  if (!GR.nodes.length) return '<p class="sub">Empty graph.</p>';
  const m = track.model;
  const xs = GR.nodes.map(n => n.x);
  const ys = GR.nodes.map(n => n.y);
  const x0 = Math.min(...xs) - 30;
  const y0 = Math.min(...ys) - 30;
  const W = Math.max(...xs) - x0 + 30;
  const H = Math.max(...ys) - y0 + 30;
  const edges = GR.edges.map((E, e) => {
    const a = GR.nodes[E.u];
    const b = GR.nodes[E.v];
    const color = m.es[e] === ES.TREE ? '#2a9d8f' : m.es[e] === ES.REJECT ? '#e9b4c4' : '#9a96b4';
    const width = m.es[e] === ES.TREE ? 3 : 1.5;
    return `<line x1="${a.x - x0}" y1="${a.y - y0}" x2="${b.x - x0}" y2="${b.y - y0}" stroke="${color}" stroke-width="${width}"/><text x="${(a.x + b.x) / 2 - x0}" y="${(a.y + b.y) / 2 - y0 - 4}" font-size="11" text-anchor="middle" fill="#555" font-family="Fira Code,monospace">${E.w}</text>`;
  }).join('');
  const nodes = GR.nodes.map((n, i) => {
    const fill = m.comp[i] ? compColor(m.comp[i]) : m.ns[i] === 2 ? '#8dbdd0' : '#fff';
    return `<circle cx="${n.x - x0}" cy="${n.y - y0}" r="16" fill="${fill}" stroke="#444" stroke-width="1.5"/><text x="${n.x - x0}" y="${n.y - y0 + 1}" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#111" font-family="Manrope">${L(i)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="${Math.min(640, W)}" height="${Math.min(640, W) * H / W}">${edges}${nodes}</svg>`;
}

function sortingReport() {
  const tracks = P.tracks;
  if (!tracks.length) return '';
  const first = tracks[0];
  const input = first.steps.length ? makeInput() : first.model.arr;
  const rows = tracks.map(track => {
    const m = track.model;
    const [best, avg, worst, space, stable] = track.algo.cx;
    return `<tr><td>${esc(track.algo.name)}</td><td class="n">${nf(m.cmp)}</td><td class="n">${nf(m.swp)}</td><td class="n">${nf(m.wr)}</td><td class="n">${nf(track.pos)} / ${nf(track.steps.length)}</td><td class="n">O(${best}) / O(${avg}) / O(${worst})</td><td class="n">O(${space})</td><td>${stable ? 'yes' : 'no'}</td></tr>`;
  }).join('');
  const kpis = reportKpis([['input size', input.length], ['distribution', DISTS[S.sort.dist]], ['seed', S.sort.seed], ['position', `step ${nf(P.idx)} of ${nf(P.total())}`]]);
  const sections = tracks.map(track => `
    <h2>${esc(track.algo.name)} — array at this step</h2>${barsSvg(track.model)}
    <h2>Pseudo-code</h2>${reportCode(track.algo.code)}
    <h2>Step trace (first 30)</h2>${stepsTable(track.steps)}`).join('');
  return `${reportHeader(S.sort.race ? 'Sorting race report' : 'Sorting lab report', tracks.map(t => t.algo.name).join(' vs '))}${kpis}
    <h2>Input</h2><div class="mono">${esc(input.join(', '))}</div>
    <h2>Counters</h2><table><thead><tr><th>Algorithm</th><th class="n">Comparisons</th><th class="n">Swaps</th><th class="n">Writes</th><th class="n">Steps</th><th class="n">Best / avg / worst</th><th class="n">Space</th><th>Stable</th></tr></thead><tbody>${rows}</tbody></table>
    ${sections}<div class="foot">Share link: ${esc(location.href)}</div>`;
}

function pathReport() {
  const track = P.tracks[0];
  if (!track) return '';
  const m = track.model;
  const d = m.done;
  const kpis = reportKpis([['grid', `${G.rows}×${G.cols}`], ['map', MAZES[S.pf.maze] || 'custom'], ['visited', nf(m.visited)], ['path length', d && d.found ? d.len : '—'], ['path cost', d && d.found ? fmt1(d.cost) : '—'], ['moves', S.pf.diag ? '8-way' : '4-way']]);
  return `${reportHeader('Pathfinding lab report', track.algo.name)}${kpis}
    <h2>Grid at this step</h2>${gridSvg(track)}
    <h2>Pseudo-code</h2>${reportCode(track.algo.code)}
    <h2>Step trace (first 30)</h2>${stepsTable(track.steps)}
    <div class="foot">Legend: dark = wall, tan = mud (cost ${MUD_COST}), blue = visited, orange = path. Share link: ${esc(location.href)}</div>`;
}

function graphReport() {
  const track = P.tracks[0];
  if (!track) return '';
  const adjacency = GR.nodes.map((_, u) => `${L(u)} → ${adjOf(u).map(({ v, w }) => `${L(v)}(${w})`).join(' ') || '∅'}`).join('\n');
  const kpis = reportKpis([['nodes', GR.nodes.length], ['edges', GR.edges.length], ['type', GR.directed ? 'directed' : 'undirected'], ['source', GR.nodes.length ? L(S.gr.src) : '—'], ['steps', `${nf(track.pos)} / ${nf(track.steps.length)}`]]);
  const table = grTable(track.model, track.algo).replace(/class="twrap"/g, '');
  return `${reportHeader('Graph lab report', track.algo.name)}${kpis}
    <h2>Graph at this step</h2>${graphSvg(track)}
    <h2>Adjacency list</h2><div class="mono">${esc(adjacency)}</div>
    <h2>Result table</h2>${table}
    <h2>Pseudo-code</h2>${reportCode(track.algo.code)}
    <h2>Step trace (first 30)</h2>${stepsTable(track.steps)}
    <div class="foot">Share link: ${esc(location.href)}</div>`;
}

function benchReport() {
  if (!benchResults) return '';
  const metric = S.bench.metric;
  const header = benchResults.sizes.map(n => `<th class="n">n = ${n}</th>`).join('');
  const rows = benchResults.rows.map(row => `<tr><td>${esc(row.name)}</td>${row.cells.map(c => `<td class="n">${nf(c[metric])}</td>`).join('')}<td>${growthLabel(row, metric, benchResults.sizes)}</td></tr>`).join('');
  return `${reportHeader('Benchmark report', `${BENCH_METRICS[metric]} · ${DISTS[benchResults.dist]} input`)}
    ${reportKpis([['algorithms', benchResults.rows.length], ['sizes', benchResults.sizes.join(', ')], ['metric', BENCH_METRICS[metric]]])}
    <h2>Results</h2><table><thead><tr><th>Algorithm</th>${header}<th>Growth</th></tr></thead><tbody>${rows}</tbody></table>
    <h2>Reading the growth column</h2><p class="sub">Doubling n should roughly double a linear algorithm (×2), multiply an n log n algorithm by about ×2.2 and a quadratic one by ×4. Compare each row with the theoretical class in the Learn table.</p>
    <div class="foot">Counted without animation by iterating each generator and tallying step types.</div>`;
}

function quizReport() {
  const saved = quizStore();
  if (!saved.attempts.length) return '';
  const last = saved.attempts[saved.attempts.length - 1];
  const rows = saved.attempts.slice().reverse().map(a => `<tr><td>${esc(a.date)}</td><td class="n">${a.score} / ${a.total || QUIZ_LEN}</td></tr>`).join('');
  return `${reportHeader('Quiz certificate', '"Which algorithm?" quiz')}
    ${reportKpis([['latest score', `${last.score} / ${last.total || QUIZ_LEN}`], ['best score', `${saved.best} / ${QUIZ_LEN}`], ['attempts', saved.attempts.length]])}
    <h2>Attempts</h2><table><thead><tr><th>Date</th><th class="n">Score</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="foot">Each attempt draws ${QUIZ_LEN} questions from a bank of ${QUIZ.length}.</div>`;
}

function openReport(kind) {
  const type = kind || S.cat;
  const builders = { sorting: sortingReport, path: pathReport, graph: graphReport, bench: benchReport, quiz: quizReport };
  const html = builders[type] ? builders[type]() : '';
  if (!html) {
    toast('Nothing to report yet — run something first');
    return;
  }
  $('#reportBox').innerHTML = `
    <div class="head">
      <h2 id="reportTitle">${ic('printer')} Lab report</h2>
      <div style="display:flex;gap:8px">
        <button class="btn primary" id="repPrint">${ic('printer')} Print / save as PDF</button>
        <button class="iconbtn" id="repClose" aria-label="Close report">${ic('x')}</button>
      </div>
    </div>
    <div class="report" id="report">${html}</div>`;
  const modal = $('#reportModal');
  modal.hidden = false;
  document.body.classList.add('report-open');
  $('#repPrint').onclick = () => window.print();
  $('#repClose').onclick = closeReport;
  modal.onclick = e => {
    if (e.target === modal) closeReport();
  };
  $('#repPrint').focus();
  unlock('printer', 'Lab reporter', 'You generated your first printable report.');
}

function closeReport() {
  $('#reportModal').hidden = true;
  document.body.classList.remove('report-open');
}

/* =====================================================================

   ===================================================================== */
const EXPORT_KEYS = ['settings', 'graph', 'quiz', 'inbox', 'library', 'history', 'achv', 'tour'];

function applyPrefs() {
  applyPalette(S.prefs.palette);
  const root = document.documentElement;
  root.dataset.motion = S.prefs.motion === 'off' ? 'off' : 'on';
  root.dataset.hints = S.prefs.hints ? 'on' : 'off';
  root.dataset.text = S.prefs.text;
  root.style.setProperty('--code-size', S.prefs.codeSize === 'large' ? '.9rem' : '.76rem');
}

function exportData() {
  const data = {};
  for (const key of EXPORT_KEYS) {
    const value = store.get(key, undefined);
    if (value !== undefined) data[key] = value;
  }
  const payload = { app: 'algoviz', version: 2, exported: new Date().toISOString(), data };
  downloadText(`algoviz-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(payload, null, 2));
  toast('Backup downloaded', 'ok');
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let parsed = null;
    try {
      parsed = JSON.parse(reader.result);
    } catch {
      parsed = null;
    }
    if (!parsed || parsed.app !== 'algoviz' || !parsed.data || typeof parsed.data !== 'object') {
      toast('Not an Algorithm Visualizer backup file', 'bad');
      return;
    }
    let count = 0;
    for (const key of EXPORT_KEYS) {
      if (!(key in parsed.data)) continue;
      store.set(key, parsed.data[key]);
      count++;
    }
    toast(`Imported ${count} data set${count === 1 ? '' : 's'} — reloading`, 'ok');
    setTimeout(() => location.reload(), 700);
  };
  reader.readAsText(file);
}

function wipeData() {
  Object.keys(localStorage).filter(k => k.startsWith(NS)).forEach(k => localStorage.removeItem(k));
  location.hash = '';
  location.reload();
}

function storageRows() {
  return EXPORT_KEYS.map(key => {
    let bytes = 0;
    try {
      bytes = (localStorage.getItem(NS + key) || '').length;
    } catch {
      bytes = 0;
    }
    return `<span>${NS}${key}</span><span>${bytes ? nf(bytes) + ' B' : '—'}</span>`;
  }).join('');
}

function searchIndex() {
  const items = [];
  for (const [key, algo] of Object.entries(SORTS)) items.push({ k: 'Sorting', t: algo.name, s: `O(${algo.cx[1]}) average · ${algo.cx[4] ? 'stable' : 'not stable'}`, link: `#sorting/${key}` });
  for (const [key, algo] of Object.entries(PF_ALGOS)) items.push({ k: 'Pathfinding', t: algo.name, s: algo.tags.map(t => t[0]).join(' · '), link: `#path/${key}` });
  for (const [key, algo] of Object.entries(GR_ALGOS)) items.push({ k: 'Graphs', t: algo.name, s: algo.cx.join(' · '), link: `#graph/${key}` });
  for (const [key, , label] of DS_TABS) items.push({ k: 'Structure', t: label, s: 'Data structures lab', link: `#ds/${key}` });
  for (const [key, preset] of Object.entries(GRAPH_PRESETS)) items.push({ k: 'Preset', t: preset.name, s: preset.hint, link: `#graph/${S.gr.algo}?preset=${key}&src=0` });
  for (const [key, label] of Object.entries(MAZES)) items.push({ k: 'Map', t: label, s: 'Pathfinding map', link: `#path/${S.pf.algo}?size=${S.pf.size}&seed=${newSeed()}&maze=${key}&h=${S.pf.h}&diag=${S.pf.diag ? 1 : 0}` });
  for (const [term, def] of GLOSSARY) items.push({ k: 'Glossary', t: term, s: def.slice(0, 70) + '…', link: '#learn/glossary', hit: term });
  for (const card of ALGO_CARDS) items.push({ k: 'Card', t: `${card.name} — history`, s: card.who, link: '#learn/cards', hit: card.name });
  items.push({ k: 'Page', t: 'Compare · benchmark', s: 'Count comparisons across sizes', link: '#bench' });
  items.push({ k: 'Page', t: 'Quiz', s: `${QUIZ.length}-question bank`, link: '#learn/quiz' });
  items.push({ k: 'Page', t: 'Growth rates chart', s: 'n, log n, n log n, n², 2ⁿ', link: '#learn/growth' });
  items.push({ k: 'Page', t: 'Settings', s: 'Palette, motion, export / import', link: '#settings' });
  for (const run of libraryList()) items.push({ k: 'Saved', t: run.name, s: run.hash, link: run.hash });
  return items;
}

let searchSel = 0;

function runSearch(query) {
  const q = query.trim().toLowerCase();
  const box = $('#qRes');
  if (!q) {
    box.classList.add('hidden');
    return;
  }
  const results = searchIndex()
    .filter(item => item.t.toLowerCase().includes(q) || item.s.toLowerCase().includes(q) || item.k.toLowerCase().includes(q))
    .slice(0, 8);
  searchSel = 0;
  box.classList.remove('hidden');
  if (!results.length) {
    box.innerHTML = '<div class="empty">No matches — try "heap", "stable" or "maze".</div>';
    return;
  }
  box.innerHTML = results.map((item, i) => `<button role="option" class="${i === 0 ? 'sel' : ''}" data-i="${i}"><span class="k">${esc(item.k)}</span><span style="min-width:0"><div class="t">${esc(item.t)}</div><div class="s">${esc(item.s)}</div></span></button>`).join('');
  $$('#qRes button').forEach((btn, i) => {
    btn.onclick = () => openSearchResult(results[i]);
  });
  box.dataset.count = results.length;
  box.results = results;
}

function openSearchResult(item) {
  if (item.hit) learnHit = item.hit.toLowerCase();
  $('#q').value = '';
  $('#qRes').classList.add('hidden');
  $('#search').classList.remove('open');
  if (location.hash === item.link) route();
  else location.hash = item.link;
}

function bindSearch() {
  const input = $('#q');
  input.addEventListener('input', () => runSearch(input.value));
  input.addEventListener('focus', () => runSearch(input.value));
  input.addEventListener('keydown', e => {
    const box = $('#qRes');
    const results = box.results || [];
    if (e.key === 'Escape') {
      box.classList.add('hidden');
      input.blur();
      return;
    }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!results.length) return;
      searchSel = (searchSel + (e.key === 'ArrowDown' ? 1 : results.length - 1)) % results.length;
      $$('#qRes button').forEach((btn, i) => btn.classList.toggle('sel', i === searchSel));
      return;
    }
    if (e.key === 'Enter' && results.length) {
      e.preventDefault();
      openSearchResult(results[searchSel]);
    }
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#search')) $('#qRes').classList.add('hidden');
  });
  $('#searchBtn').onclick = () => {
    const box = $('#search');
    box.classList.toggle('open');
    if (box.classList.contains('open')) input.focus();
  };
}

let tourIndex = -1;

function startTour() {
  tourIndex = 0;
  $('#tour').hidden = false;
  showTourStep();
}

function endTour() {
  tourIndex = -1;
  $('#tour').hidden = true;
  store.set('tour', { done: true, ts: Date.now() });
}

function tourCardHtml(step) {
  const dots = TOUR_STEPS.map((_, i) => `<i class="${i === tourIndex ? 'on' : ''}"></i>`).join('');
  const last = tourIndex === TOUR_STEPS.length - 1;
  return `
    <div class="tour-card" id="tourCard" role="dialog" aria-label="Tour step ${tourIndex + 1}">
      <h3>${ic('footprints')} ${esc(step.title)}</h3>
      <p>${esc(step.body)}</p>
      <div class="row">
        <div class="dots">${dots}</div>
        <button class="btn sm ghost" id="tourSkip">Skip</button>
        ${tourIndex > 0 ? `<button class="btn sm" id="tourBack">${ic('chevron-left')} Back</button>` : ''}
        <button class="btn sm primary" id="tourNext">${last ? 'Done' : 'Next'} ${ic(last ? 'check' : 'chevron-right')}</button>
      </div>
    </div>`;
}

function showTourStep() {
  const step = TOUR_STEPS[tourIndex];
  const target = $(step.target);
  const tour = $('#tour');
  if (!target) {
    endTour();
    return;
  }
  tour.innerHTML = `<div class="spot" id="tourSpot"></div>${tourCardHtml(step)}`;
  positionTour(target);
  $('#tourSkip').onclick = endTour;
  $('#tourNext').onclick = () => {
    if (tourIndex >= TOUR_STEPS.length - 1) {
      endTour();
      toast('Tour finished — enjoy the lab', 'ok');
      return;
    }
    tourIndex++;
    showTourStep();
  };
  const back = $('#tourBack');
  if (back) back.onclick = () => {
    tourIndex--;
    showTourStep();
  };
  $('#tourNext').focus();
}

function positionTour(target) {
  const rect = target.getBoundingClientRect();
  const spot = $('#tourSpot');
  const pad = 6;
  spot.style.left = (rect.left - pad) + 'px';
  spot.style.top = (rect.top - pad) + 'px';
  spot.style.width = (rect.width + pad * 2) + 'px';
  spot.style.height = (rect.height + pad * 2) + 'px';
  const card = $('#tourCard');
  const cardW = Math.min(320, window.innerWidth - 24);
  const cardH = card.offsetHeight || 170;
  let left = clamp(rect.left + rect.width / 2 - cardW / 2, 12, window.innerWidth - cardW - 12);
  let top = rect.bottom + 14;
  if (top + cardH > window.innerHeight - 12) top = rect.top - cardH - 14;
  if (top < 12) top = clamp(window.innerHeight / 2 - cardH / 2, 12, window.innerHeight - cardH - 12);
  card.style.left = left + 'px';
  card.style.top = top + 'px';
}

function renderTabs() {
  $('#tabs').innerHTML = CATS
    .map(([key, icon, label]) => `<a href="#${key}" data-cat="${key}" class="${S.cat === key ? 'active' : ''}" ${S.cat === key ? 'aria-current="page"' : ''}>${ic(icon)}<span>${label}</span></a>`)
    .join('') + '<span class="inkbar"></span>';
  positionInk();
}

function positionInk() {
  const active = $('#tabs a.active');
  const ink = $('#tabs .inkbar');
  if (!ink) return;
  if (!active) {
    ink.style.width = '0px';
    return;
  }
  ink.style.left = active.offsetLeft + 'px';
  ink.style.width = active.offsetWidth + 'px';
}

function parseHash() {
  const raw = location.hash.slice(1);
  if (!raw) return null;
  const [path, query = ''] = raw.split('?');
  const [cat, algo] = path.split('/');
  return { cat, algo, q: Object.fromEntries(new URLSearchParams(query)) };
}

function applySortingHash(algo, q) {
  if (SORTS[algo]) S.sort.algo = algo;
  if (q.size) S.sort.size = clamp(+q.size || 40, 10, 200);
  if (q.seed) S.sort.seed = +q.seed || S.sort.seed;
  if (DISTS[q.dist]) S.sort.dist = q.dist;
  if (q.race && SORTS[q.race]) {
    S.sort.race = true;
    S.sort.algoB = q.race;
  } else if ('race' in q || algo) {
    S.sort.race = false;
  }
}

function applyPathHash(algo, q) {
  if (PF_ALGOS[algo]) S.pf.algo = algo;
  if (q.size != null) S.pf.size = clamp(+q.size || 0, 0, 3);
  if (q.seed) S.pf.seed = +q.seed || S.pf.seed;
  if (MAZES[q.maze]) S.pf.maze = q.maze;
  if (['manhattan', 'euclid'].includes(q.h)) S.pf.h = q.h;
  if (q.diag != null) S.pf.diag = q.diag === '1';
  if (q.seed || q.maze || q.size != null) G = null;
}

function applyGraphHash(algo, q) {
  if (GR_ALGOS[algo]) S.gr.algo = algo;
  if (q.preset && GRAPH_PRESETS[q.preset] && q.preset !== S.gr.preset) {
    GR = presetGraph(q.preset);
    S.gr.preset = q.preset;
    saveGraph();
  }
  if (q.src) S.gr.src = +q.src || 0;
}

function applyHash() {
  const parsed = parseHash();
  if (!parsed) return;
  const { cat, algo, q } = parsed;
  if (!VIEWS[cat]) return;
  S.cat = cat;
  if (cat === 'sorting') applySortingHash(algo, q);
  if (cat === 'path') applyPathHash(algo, q);
  if (cat === 'graph') applyGraphHash(algo, q);
  if (cat === 'ds' && DS_TABS.some(t => t[0] === algo)) S.ds.tab = algo;
  if (cat === 'learn' && LEARN_TABS.some(t => t[0] === algo)) S.learn.tab = algo;
}

function syncHash() {
  let h = '#' + S.cat;
  if (S.cat === 'sorting') {
    h += `/${S.sort.algo}?size=${S.sort.size}&seed=${S.sort.seed}&dist=${S.sort.dist}`;
    if (S.sort.race) h += `&race=${S.sort.algoB}`;
  } else if (S.cat === 'path') {
    h += `/${S.pf.algo}?size=${S.pf.size}&seed=${S.pf.seed}&maze=${S.pf.maze}&h=${S.pf.h}&diag=${S.pf.diag ? 1 : 0}`;
  } else if (S.cat === 'graph') {
    h += `/${S.gr.algo}?preset=${S.gr.preset}&src=${S.gr.src}`;
  } else if (S.cat === 'ds') {
    h += `/${S.ds.tab}`;
  } else if (S.cat === 'learn') {
    h += `/${S.learn.tab}`;
  }
  if (location.hash !== h) history.replaceState(null, '', h);
}

function route() {
  applyHash();
  mini.stop();
  P.pause();
  closeReport();
  document.body.dataset.cat = S.cat;
  renderTabs();
  (VIEWS[S.cat] || renderSorting)();
  markSeen(S.cat);
  saveS();
  updateTransport();
  $('#stage').scrollTop = 0;
  if (tourIndex >= 0) showTourStep();
}

function closeOverlays() {
  if (!$('#about').hidden) {
    closeAbout();
    return true;
  }
  if (!$('#sheet').hidden) {
    $('#sheet').hidden = true;
    return true;
  }
  if (!$('#reportModal').hidden) {
    closeReport();
    return true;
  }
  if (drawerOpen) {
    closeDrawer();
    return true;
  }
  if (tourIndex >= 0) {
    endTour();
    return true;
  }
  return false;
}

function onKey(e) {
  if (e.key === 'Escape') {
    closeOverlays();
    return;
  }
  const el = e.target;
  const typing = el && (el.tagName === 'INPUT' || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
  if (typing && !(el.type === 'range' && e.key === ' ')) return;
  if (el && el.tagName === 'BUTTON' && e.key === ' ') return;
  if (e.key === '/') {
    e.preventDefault();
    $('#search').classList.add('open');
    $('#q').focus();
    return;
  }
  if (e.key === '?') {
    openSheet();
    return;
  }
  if (/^[1-6]$/.test(e.key)) {
    location.hash = '#' + CATS[+e.key - 1][0];
    return;
  }
  const key = e.key.toLowerCase();
  if (key === 'i') openDrawer('inbox');
  else if (key === 'b') saveCurrentRun();
  else if (!['sorting', 'path', 'graph', 'ds'].includes(S.cat)) return;
  else if (e.key === ' ') { e.preventDefault(); $('#tPlay').click(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); $('#tFwd').click(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); if (!$('#tBack').disabled) $('#tBack').click(); }
  else if (key === 'r') resetCurrent();
  else if (key === 's') shuffleCurrent();
  else if (key === 'p') openReport();
}

let resizeTimer = 0;
function onResize() {
  positionInk();
  if (P.tracks.length) P.render();
  if (tourIndex >= 0) showTourStep();
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (S.cat === 'learn' && S.learn.tab === 'growth') learnGrowth();
    if (S.cat === 'bench' && benchResults) renderBench();
  }, 150);
}

function bindHeader() {
  $('#aboutBtn').onclick = openAbout;
  $('#inboxBtn').onclick = () => (drawerOpen ? closeDrawer() : openDrawer('inbox'));
  $('#saveBtn').onclick = saveCurrentRun;
  $('#scrim').onclick = closeDrawer;
  $('#shareBtn').onclick = async () => {
    syncHash();
    try {
      await navigator.clipboard.writeText(location.href);
      toast('Link copied — it reproduces this exact run', 'ok');
    } catch {
      prompt('Copy this link', location.href);
    }
  };
  $('#cpToggle').onclick = () => {
    const pane = $('#codepane');
    pane.classList.toggle('open');
    $('#cpToggle').setAttribute('aria-expanded', pane.classList.contains('open'));
  };
}

function boot() {
  applyPrefs();
  bindTransport();
  bindHeader();
  bindSearch();
  renderInboxDot();
  $('#tSpeed').value = S.speed;
  window.addEventListener('hashchange', route);
  window.addEventListener('resize', onResize);
  document.addEventListener('keydown', onKey);
  route();
  const tour = store.get('tour', null);
  if (!tour) setTimeout(startTour, 900);
}

boot();
</script>
</body>
</html>
