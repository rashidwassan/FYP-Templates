<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thalassemia Care Companion</title>
<meta name="description" content="Transfusion log with next-transfusion prediction, ferritin / MRI iron and chelation tracking, lab panel, growth charts, medicine inventory, costs and support programmes, daily adherence calendar, carrier screening tools, education library and a printable clinician summary for thalassemia patients in Pakistan. Single-file FYP template.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens: lavender, teal, calm clinical ---------- */
:root{
  --bg:#f5f3fb; --surface:#ffffff; --surface-2:#f0ecf9; --ink:#231d3b; --muted:#6c6684; --line:#e3deef;
  --violet:#6d4fc2; --violet-deep:#51389c; --violet-soft:#ebe5fa; --violet-ink:#3f2b7d;
  --teal:#128f80; --teal-deep:#0d6f63; --teal-soft:#dff3ef;
  --ok:#2e7d4f; --ok-soft:#e2f3e8; --warn:#a9640a; --warn-soft:#fdf0d8; --bad:#c23b32; --bad-soft:#fbe4e1; --info:#3b5bdb; --info-soft:#e6eafb;
  --rose:#b3457a; --amber:#c98a1c;
  --radius:16px; --radius-sm:10px; --shadow:0 12px 32px -22px rgba(61,43,125,.35);
  --font:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --font-ur:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;
}
*{box-sizing:border-box}
html{font-size:15px}
html[data-text=large]{font-size:17px}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--violet-deep)}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.01em}
.ur{font-family:var(--font-ur);line-height:1.9;font-weight:400}
.rtl{direction:rtl;text-align:right}
.muted{color:var(--muted)}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.ic.lg{width:1.5em;height:1.5em}
.kicon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--violet-soft);color:var(--violet-deep);flex:none}
.kicon.teal{background:var(--teal-soft);color:var(--teal-deep)} .kicon.warn{background:var(--warn-soft);color:var(--warn)} .kicon.bad{background:var(--bad-soft);color:var(--bad)} .kicon.ok{background:var(--ok-soft);color:var(--ok)} .kicon.info{background:var(--info-soft);color:var(--info)}
.emptyic{width:48px;height:48px;border-radius:14px;background:var(--violet-soft);color:var(--violet-deep);display:grid;place-items:center;margin:0 auto 10px}
.emptyic .ic{width:24px;height:24px}

/* ---------- Motion kit ---------- */
:root{--ease:cubic-bezier(.2,.8,.2,1);--dur:.35s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
html[data-motion=off] *,html[data-motion=off] *::before,html[data-motion=off] *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
.enter{animation:fadeUp var(--dur) var(--ease) both}
.stagger>*{animation:fadeUp .45s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.fine{font-size:.8rem;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 18px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--violet),var(--violet-deep));display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 8px 18px -10px rgba(109,79,194,.8)}
.brand h1{font-size:1.05rem;font-weight:700;white-space:nowrap;color:var(--violet-ink)}
.brand small{display:block;font-size:.74rem;color:var(--muted);font-weight:500}
.brand h1.ur{font-size:1.05rem;line-height:2.2;font-weight:700;padding-top:6px} .brand small.ur{line-height:1.9;font-size:.78rem;padding-bottom:4px}
.kpi .k .ur,.tabs a .ur,.btn .ur,.pill .ur,.chip .ur{line-height:1.6}
.spacer{flex:1}
.datebadge{font-size:.8rem;color:var(--muted);white-space:nowrap;background:var(--surface-2);border-radius:999px;padding:6px 12px}
.lang{background:var(--violet);color:#fff;border:0;border-radius:10px;padding:8px 13px;font-weight:700;cursor:pointer;min-height:38px}
.iconbtn{position:relative;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:7px 11px;cursor:pointer;min-height:38px;min-width:40px;font-weight:600}
.iconbtn .cnt{position:absolute;top:-7px;right:-7px;background:var(--bad);color:#fff;border-radius:999px;font-size:.68rem;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px;font-weight:700;border:2px solid #fff}

/* ---------- Layout: patient rail + main ---------- */
.layout{display:grid;grid-template-columns:268px minmax(0,1fr);gap:22px;max-width:1380px;margin:0 auto;padding:20px 18px 70px;min-width:0}
.rail{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:10px;min-width:0}
.railhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px}
.railhead h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.pcard{display:flex;gap:11px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid transparent;border-radius:14px;padding:11px 12px;cursor:pointer;text-align:left;width:100%;box-shadow:var(--shadow);transition:border-color .15s,transform .15s;min-width:0}
.pcard:hover{transform:translateY(-1px);border-color:var(--violet-soft);border-left-color:var(--violet-soft)}
.pcard.on{border-left-color:var(--violet);background:linear-gradient(90deg,var(--violet-soft),var(--surface) 70%)}
.pcard .nm{font-weight:700;font-size:.97rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .sub{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .who{min-width:0;flex:1;display:flex;flex-direction:column}
.pcard .nm,.pcard .sub{display:block}
.pcard .dots{display:flex;gap:3px;margin-top:4px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)} .dot.info{background:var(--info)} .dot.ok{background:var(--ok)}
.avatar{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--violet),var(--violet-deep));flex:none;font-size:.95rem}
.avatar.f{background:linear-gradient(135deg,#c75d9b,var(--rose))}
.avatar.big{width:56px;height:56px;border-radius:16px;font-size:1.2rem}
.bgtag{display:inline-block;background:var(--violet-ink);color:#fff;border-radius:8px;padding:2px 8px;font-weight:700;font-size:.82rem;letter-spacing:.02em}
.railnote{font-size:.8rem;color:var(--muted);padding:6px 4px}
.railnote a{font-weight:600}

/* ---------- Patient header + tabs ---------- */
.phead{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;box-shadow:var(--shadow);margin-bottom:14px;flex-wrap:wrap}
.phead h2{font-size:1.3rem;font-weight:700}
.phead .meta{font-size:.86rem;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.phead .who{flex:1;min-width:200px}
.phead .acts{display:flex;gap:8px;flex-wrap:wrap}
.phead .meta .pill{white-space:normal;text-align:left}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:10px 12px;white-space:nowrap;font-weight:600;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;font-size:.9rem;min-height:42px;display:inline-flex;align-items:center;gap:6px}
.tabs a:hover{color:var(--violet-ink)}
.tabs a.on{color:var(--violet-deep);border-bottom-color:var(--violet)}
.tabs .sep{width:1px;background:var(--line);margin:8px 6px;flex:none}

/* ---------- Components ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.panel h3{font-size:1.05rem;font-weight:700;margin-bottom:6px}
.panel p.lead{margin:0 0 12px;color:var(--muted);font-size:.92rem}
.panel+.panel,.stack>*+*{margin-top:14px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:16px;align-items:start}
.two.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.two.wide{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 14px}
.cols.tight{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpis.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.kpi .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.kpi .v{font-size:1.55rem;font-weight:700;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v small{font-size:.85rem;font-weight:600;color:var(--muted);letter-spacing:0}
.kpi .s{font-size:.8rem;color:var(--muted);margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:.75rem;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.violet{background:var(--violet-soft);color:var(--violet-deep)} .pill.teal{background:var(--teal-soft);color:var(--teal-deep)}
label.f{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin:10px 0 5px}
select,input[type=number],input[type=text],input[type=date],input[type=time],input[type=tel],input[type=search],textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;outline:0;min-height:40px}
select:focus,input:focus,textarea:focus{border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-soft)}
textarea{min-height:70px;resize:vertical}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--violet);color:#fff;display:inline-flex;align-items:center;gap:8px;min-height:40px;white-space:nowrap;text-decoration:none;transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s,filter .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px -12px rgba(61,43,125,.6)} .btn:active{transform:translateY(0) scale(.98)}
.btn:focus-visible,.chip:focus-visible,.tabs a:focus-visible,.pcard:focus-visible,.heat .c:focus-visible,.switch:focus-visible,.opt:focus-visible,.libcard:focus-visible{outline:3px solid var(--violet-soft);outline-offset:1px}
.panel,.kpi{transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 16px 36px -22px rgba(61,43,125,.5)}
.fill,.riskbar span{transition:width .6s var(--ease),flex-basis .6s var(--ease)}
.heat .c{transition:transform .15s var(--ease),filter .15s}
.heat .c:not(.f):active{transform:scale(.9)}
.tabs a{transition:color .15s,border-color .2s var(--ease)}
.chip{transition:background .15s,color .15s,transform .15s var(--ease)} .chip:active{transform:scale(.97)}
.btn.teal{background:var(--teal)} .btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)} .btn.danger{background:var(--bad-soft);color:var(--bad)} .btn.ok{background:var(--ok-soft);color:var(--ok)}
.btn.sm{padding:6px 11px;font-size:.82rem;border-radius:8px;min-height:34px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:none;padding:8px 12px;cursor:pointer;font-weight:600;font-size:.85rem;min-height:40px}
.seg button.on{background:var(--violet);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 12px;font-size:.84rem;font-weight:600;cursor:pointer;min-height:36px}
.chip.on{background:var(--violet);border-color:var(--violet);color:#fff}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--surface);flex-wrap:wrap}
.row.done{opacity:.6}
.row.unread{border-left:4px solid var(--violet)}
.row .l{min-width:0;flex:1 1 240px}
.medcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.medcard .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.medcard .top .st{margin-left:auto}
.medcard .bar{grid-template-columns:1fr 80px;margin:10px 0 4px}
.medcard .acts{margin-top:10px}
.libcard .ex{font-size:.84rem;color:var(--muted);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:26px;text-align:center;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);border-radius:12px}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 12px;border-left:4px solid;font-size:.9rem}
.alert.bad{background:var(--bad-soft);border-color:var(--bad)} .alert.warn{background:var(--warn-soft);border-color:var(--warn)} .alert.info{background:var(--info-soft);border-color:var(--info)} .alert.ok{background:var(--ok-soft);border-color:var(--ok)}
.alert b{display:block}
.note{background:var(--violet-soft);border-left:4px solid var(--violet);padding:10px 12px;border-radius:10px;font-size:.88rem}
.warnbox{background:var(--warn-soft);border-left:4px solid var(--warn);padding:10px 12px;border-radius:10px;font-size:.88rem}
.edu{background:linear-gradient(135deg,var(--violet-soft),var(--teal-soft));border-radius:14px;padding:14px 16px;margin-top:14px}
.edu h4{font-size:.98rem;margin-bottom:4px;color:var(--violet-ink)}
.edu p{margin:0;font-size:.9rem}
.edu.ur h4{font-size:1.1rem}
.edu.ur p{font-size:1rem}
.todo{border:1px dashed var(--violet);border-radius:12px;padding:12px 14px;background:var(--surface)}
.todo h4{margin:0 0 4px;font-size:.95rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.todo .tag{font-size:.68rem;background:var(--violet);color:#fff;border-radius:6px;padding:2px 6px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.todo code{background:var(--surface-2);border-radius:5px;padding:1px 5px;font-size:.82rem}
.bigstat{font-size:2rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.switch{position:relative;width:46px;height:26px;border-radius:999px;background:var(--line);border:0;cursor:pointer;flex:none;transition:background .2s;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s var(--ease)}
.switch.on{background:var(--teal)}
.switch.on::after{transform:translateX(20px)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.setrow:last-child{border-bottom:0}
.setrow .l{min-width:0;flex:1}
.setrow .l b{display:block}
.setrow .l .fine{display:block;margin-top:2px}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 7px;font-size:.78rem;font-weight:700;background:var(--surface-2);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* ---------- Tables ---------- */
.tablewrap{overflow:auto;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;background:var(--surface)}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);font-size:.88rem;vertical-align:middle}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.bad{color:var(--bad);font-weight:700}
td.warn{color:var(--warn);font-weight:700}
tr.sel td{background:var(--violet-soft)}
.spark{width:84px;height:26px;display:block}

/* ---------- Charts ---------- */
.chart{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 4px 2px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart svg text{font-family:var(--font)}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:8px;padding:6px 9px;font-size:.78rem;transform:translate(-50%,-112%);white-space:nowrap;display:none;z-index:2;line-height:1.4}
.chart .pt{transition:r .15s var(--ease)} .chart .pt.hot{r:7}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;margin:8px 4px 0;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.legend i.sq{border-radius:2px}
.legend i.ln{width:14px;height:0;border-top:2px dashed var(--muted);border-radius:0}
.legend i.solid{width:14px;height:0;border-top:2px solid var(--muted);border-radius:0}
.heat{display:grid;gap:4px;align-items:center}
.heat .hl,.heat .dl{font-size:.68rem;color:var(--muted);text-align:center;white-space:nowrap}
.heat .dl{text-align:right;padding-right:4px}
.heat .c{aspect-ratio:1;border-radius:5px;border:0;background:var(--surface-2);cursor:pointer;padding:0;min-width:0;width:100%}
.heat .c.t{background:var(--teal)} .heat .c.m{background:var(--rose)} .heat .c.f{background:transparent;border:1px dashed var(--line);cursor:default} .heat .c.today{outline:2px solid var(--violet);outline-offset:1px}
.heat .c:not(.f):hover{filter:brightness(.9)}
.bar{display:grid;grid-template-columns:130px 1fr 56px;gap:10px;align-items:center;margin:8px 0;font-size:.88rem}
.bar .lbl{display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .lbl i{width:10px;height:10px;border-radius:3px;flex:none}
.bar .track{height:14px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar .fill{height:100%;border-radius:999px}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;white-space:nowrap}
.punnett{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;max-width:360px;margin:10px 0}
.punnett .h{display:grid;place-items:center;font-weight:700;color:var(--muted);font-size:.9rem;padding:6px}
.punnett .cell{border-radius:12px;padding:12px 8px;text-align:center;font-weight:700;border:1px solid var(--line)}
.punnett .cell small{display:block;font-weight:600;font-size:.74rem;color:var(--muted);margin-top:2px}
.punnett .cell.AA{background:var(--ok-soft)} .punnett .cell.Aa{background:var(--warn-soft)} .punnett .cell.aa{background:var(--bad-soft)}
.riskbar{display:flex;height:22px;border-radius:999px;overflow:hidden;margin-top:10px;gap:2px;background:var(--surface)}
.riskbar span{display:grid;place-items:center;font-size:.72rem;font-weight:700;color:#fff;min-width:0}
.riskbar .AA{background:var(--ok)} .riskbar .Aa{background:var(--warn)} .riskbar .aa{background:var(--bad)}
.verdict{border-radius:14px;padding:14px 16px;margin-top:12px;border:1px solid var(--line)}
.verdict.ok{background:var(--ok-soft)} .verdict.warn{background:var(--warn-soft)} .verdict.bad{background:var(--bad-soft)} .verdict.info{background:var(--info-soft)}
.verdict .big{font-size:1.5rem;font-weight:700;letter-spacing:-.02em}

/* ---------- Library, quiz, notes, programmes ---------- */
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.libcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:120px;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.libcard:hover{transform:translateY(-2px)}
.libcard h4{font-size:.98rem}
.libcard .cat{align-self:flex-start}
.article h4{font-size:1.25rem;margin-bottom:8px}
.article p{font-size:.95rem;margin:0 0 12px}
.article ul{margin:0;padding-left:20px;font-size:.92rem}
.article.ur ul{padding-left:0;padding-right:20px}
.article li{margin:4px 0}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;cursor:pointer;font-weight:600;margin-top:8px;min-height:44px;transition:background .15s,border-color .15s}
.opt:hover{border-color:var(--violet)}
.opt .n{width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:.8rem;flex:none}
.opt.right{background:var(--ok-soft);border-color:var(--ok)} .opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.progress{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin:10px 0}
.progress .fill{height:100%;background:var(--violet);border-radius:999px}
.notecard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.notecard.pinned{border-color:var(--violet);background:linear-gradient(90deg,var(--violet-soft),var(--surface) 60%)}
.notecard .txt{white-space:pre-wrap;font-size:.92rem;margin:6px 0}
.notecard .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.stagepill{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:6px 10px;font-weight:700;font-size:.85rem}
.stagepill.ok{background:var(--ok-soft);color:var(--ok)} .stagepill.warn{background:var(--warn-soft);color:var(--warn)} .stagepill.bad{background:var(--bad-soft);color:var(--bad)} .stagepill.info{background:var(--info-soft);color:var(--info)}

/* ---------- Summary sheet ---------- */
.sheet{padding:24px 28px}
.sheethead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--violet);padding-bottom:12px;margin-bottom:14px}
.sheet h3{font-size:.95rem;text-transform:uppercase;letter-spacing:.07em;color:var(--violet-ink);margin:18px 0 8px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px 16px}
.facts div{font-size:.9rem} .facts .eyebrow{margin-bottom:2px}

/* ---------- Modal / toasts / tour ---------- */
.scrim{position:fixed;inset:0;background:rgba(35,29,59,.45);backdrop-filter:blur(2px);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:620px;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 30px 80px -30px rgba(0,0,0,.5);transform:translateY(12px) scale(.97);transition:transform .3s var(--ease)}
.scrim.on .modal{transform:none}
.modal h3{font-size:1.2rem;margin-bottom:4px}
.modal .acts{margin-top:16px;justify-content:flex-end}
.share{white-space:pre-wrap;background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:.88rem;border:1px solid var(--line);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;max-width:calc(100vw - 32px)}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:toastIn .3s var(--ease) both;font-size:.9rem;display:flex;align-items:center;gap:8px}
.toast.ok{background:var(--teal)} .toast.bad{background:var(--bad)}
.toast.out{animation:toastOut .3s var(--ease) forwards}
.tourhole{position:fixed;z-index:70;border-radius:14px;box-shadow:0 0 0 9999px rgba(35,29,59,.62);pointer-events:none;transition:top .3s var(--ease),left .3s var(--ease),width .3s var(--ease),height .3s var(--ease)}
.tourcard{position:fixed;z-index:71;background:var(--surface);border-radius:14px;padding:16px 18px;width:min(340px,calc(100vw - 32px));box-shadow:0 30px 80px -30px rgba(0,0,0,.6);animation:popIn .3s var(--ease) both}
.tourcard h4{font-size:1.05rem;margin-bottom:6px}
.tourcard p{margin:0 0 12px;font-size:.92rem;color:var(--muted)}
.tourcard .acts{justify-content:space-between}
.tourcard .step{font-size:.75rem;color:var(--muted);font-weight:700}

/* ---------- Responsive ---------- */
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))} .kpis.four{grid-template-columns:repeat(4,minmax(0,1fr))} .three{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr);gap:14px;padding:14px 14px 60px}
  .rail{position:static;flex-direction:row;overflow-x:auto;align-items:center;padding-bottom:6px;scrollbar-width:thin}
  .railhead{flex:none;flex-direction:column;align-items:flex-start;gap:6px}
  .railhead h3{display:none}
  .pcard{flex:none;width:220px}
  .railnote{display:none}
  .two,.two.even,.two.wide,.three{grid-template-columns:minmax(0,1fr)}
  .kpis,.kpis.four,.kpis.three{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tabs{flex-wrap:nowrap;overflow-x:auto}
  .datebadge{display:none}
  .brand small{display:none}
  .brand h1{font-size:.95rem;white-space:normal}
  .phead{padding:12px 14px}
  .bar{grid-template-columns:100px 1fr 52px}
  .sheet{padding:16px}
  .topbar{padding:10px 12px;gap:8px}
}
@media (max-width:480px){.kpi .v{font-size:1.3rem}}

/* ---------- Print ---------- */
@media print{
  .topbar,.rail,.tabs,.phead .acts,#toasts,.scrim,.noprint,.tourhole,.tourcard{display:none!important}
  .layout{display:block;padding:0;max-width:none}
  body{background:#fff;font-size:12px;color:#000}
  .panel,.kpi,.chart,.sheet,.tablewrap{box-shadow:none;border-color:#bbb;break-inside:avoid}
  .phead{border:0;padding:0 0 8px;margin-bottom:8px}
  .edu{background:#f3f3f3}
  a{color:inherit;text-decoration:none}
}
</style>

// ---------- utils ----------
const NS = 'thal:';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const store = {
  get(k, d) {
    try {
      const v = localStorage.getItem(NS + k);
      return v == null ? d : JSON.parse(v);
    } catch {
      return d;
    }
  },
  set(k, v) {
    try {
      localStorage.setItem(NS + k, JSON.stringify(v));
      return true;
    } catch {
      return false;
    }
  },
  remove(k) {
    try {
      localStorage.removeItem(NS + k);
    } catch {
      /* storage unavailable */
    }
  },
  keys() {
    const out = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(NS)) out.push(k.slice(NS.length));
      }
    } catch {
      /* storage unavailable */
    }
    return out;
  }
};

const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ESC_MAP[c]);
const uid = () => Math.random().toString(36).slice(2, 9);
const ic = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;

function toast(msg, type = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  const icon = type === 'ok' ? 'check-circle' : type === 'bad' ? 'alert-circle' : 'info';
  t.innerHTML = ic(icon) + `<span>${esc(msg)}</span>`;
  $('#toasts').append(t);
  setTimeout(() => {
    t.classList.add('out');
    setTimeout(() => t.remove(), 320);
  }, 3200);
}

// motion helpers (all honour prefers-reduced-motion through the CSS block)
function animateIn(root) {
  root.classList.remove('enter');
  void root.offsetWidth;
  root.classList.add('enter');
  $$('.stagger', root).forEach(g => {
    [...g.children].forEach((el, i) => el.style.setProperty('--i', i));
  });
}

function countUp(el, to, { dur = 700, fmt = v => Math.round(v).toLocaleString('en-PK') } = {}) {
  if (!el) return;
  const t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(to * e);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function drawPath(p) {
  try {
    const L = p.getTotalLength();
    if (!L) return;
    p.style.strokeDasharray = L;
    p.style.strokeDashoffset = L;
    p.getBoundingClientRect();
    p.style.transition = 'stroke-dashoffset .9s var(--ease)';
    p.style.strokeDashoffset = 0;
  } catch {
    /* path not rendered yet */
  }
}

function animateFills(root) {
  $$('.fill[data-w], .riskbar span[data-w]', root).forEach(el => {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.style.width = el.dataset.w;
    }));
  });
}

// deterministic PRNG (mulberry32) so the demo data is identical on every device
function rng(seed) {
  return () => {
    seed |= 0;
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// dates
const DAY = 864e5;
const today = new Date();
today.setHours(0, 0, 0, 0);
const pad = n => String(n).padStart(2, '0');
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDate = k => {
  const [y, m, d] = String(k).split('-').map(Number);
  return new Date(y, m - 1, d);
};
const addDays = (d, n) => {
  const x = new Date(d);
  x.setDate(x.getDate() + n);
  return x;
};
const addMonths = (d, n) => {
  const x = new Date(d);
  x.setMonth(x.getMonth() + n);
  return x;
};
const daysBetween = (a, b) => Math.round((b - a) / DAY);
const TODAY = dateKey(today);
const monthKey = k => String(k).slice(0, 7);
const fmtDate = (k, o) => (k instanceof Date ? k : parseDate(k)).toLocaleDateString('en-GB', o || { day: 'numeric', month: 'short', year: 'numeric' });
const fmtShort = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const fmtMonth = k => parseDate(k + '-01').toLocaleDateString('en-GB', { month: 'short', year: '2-digit' });

// numbers
const r1 = n => Math.round(n * 10) / 10;
const r2 = n => Math.round(n * 100) / 100;
const nf = new Intl.NumberFormat('en-PK', { maximumFractionDigits: 0 });
const pkr = n => 'Rs ' + nf.format(Math.round(n));
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const sum = arr => arr.reduce((a, b) => a + b, 0);

// misc
const initials = n => String(n).trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const ageOf = dob => {
  const b = parseDate(dob);
  let y = today.getFullYear() - b.getFullYear();
  const m = today.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && today.getDate() < b.getDate())) y--;
  return Math.max(0, y);
};
// decimal age in years at a given date (used by the growth reference curves)
const ageAt = (dob, when) => Math.max(0, (parseDate(when) - parseDate(dob)) / (365.25 * DAY));
const debounce = (fn, ms) => {
  let h;
  return (...a) => {
    clearTimeout(h);
    h = setTimeout(() => fn(...a), ms);
  };
};

function downloadFile(name, text, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: mime }));
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/** Transfusion episodes walking backwards from the most recent one. */
function seedEpisodes(r, { interval, jitter, vol, unit, pre, post, lastDaysAgo, n, centre }) {
  const out = [];
  let d = addDays(today, -lastDaysAgo);
  for (let i = 0; i < n; i++) {
    // draw order (pre, post, notes) matches v1 so the demo values are unchanged
    const preHb = r1(pre + (r() - .5) * 1.2);
    const postHb = r1(post + (r() - .5) * 1.0);
    const notes = SEED_TX_NOTES[Math.floor(r() * SEED_TX_NOTES.length)];
    out.unshift({ id: uid(), date: dateKey(d), vol, unit, pre: preHb, post: postHb, centre, notes });
    d = addDays(d, -(interval + Math.round((r() - .5) * jitter)));
  }
  return out;
}

/** 100 days of dose ticks; missed days get a reason drawn from the weighted map. */
function seedDoseLog(r, pTaken, weights) {
  const out = {};
  const keys = Object.keys(weights);
  for (let i = 1; i <= 100; i++) {
    const k = dateKey(addDays(today, -i));
    if (r() < pTaken) {
      out[k] = { t: true };
      continue;
    }
    let x = r();
    let reason = keys[0];
    for (const key of keys) {
      if (x < weights[key]) {
        reason = key;
        break;
      }
      x -= weights[key];
    }
    out[k] = { t: false, r: reason };
  }
  return out;
}

// ---------- computations: transfusions & iron ----------
/** Hb decline rate from consecutive episodes, averaged over the last 3; predicted date = last date + (last post − target) / rate */
function predictor(eps, target) {
  const rates = [];
  for (let i = 1; i < eps.length; i++) {
    const a = eps[i - 1];
    const b = eps[i];
    if (a.post == null || b.pre == null) continue;
    const d = daysBetween(parseDate(a.date), parseDate(b.date));
    if (d > 0 && a.post > b.pre) rates.push({ r: (a.post - b.pre) / d, d });
  }
  const last = eps[eps.length - 1];
  if (!last || last.post == null || !rates.length) return null;
  const use = rates.slice(-3);
  const rate = sum(use.map(x => x.r)) / use.length;
  const days = Math.max(0, (last.post - target) / rate);
  return {
    rate,
    days,
    predicted: addDays(parseDate(last.date), Math.round(days)),
    n: use.length,
    avgInterval: sum(use.map(x => x.d)) / use.length,
    last
  };
}
function annualReq(p) {
  const eps = txOf(p.id).filter(e => daysBetween(parseDate(e.date), today) <= 365);
  if (!eps.length || !p.weight) return null;
  const ml = sum(eps.map(volMl));
  return { ml, perKg: ml / p.weight, n: eps.length };
}

// ---------- computations: adherence ----------
function adherenceStats(pid) {
  const d = dosesOf(pid);
  const keys = Object.keys(d).sort();
  const out = { pct30: null, pct84: null, streak: 0, reasons: {}, missed84: 0, todayMarked: !!d[TODAY], today: d[TODAY] || null };
  if (!keys.length) return out;
  const end = out.todayMarked ? 0 : 1; // if today is not ticked yet, do not count it as missed
  const firstDay = parseDate(keys[0]);
  const span = Math.max(1, Math.min(30, daysBetween(firstDay, today) + 1 - end));
  let taken = 0;
  for (let i = end; i < end + span; i++) {
    const v = d[dateKey(addDays(today, -i))];
    if (v && v.t) taken++;
  }
  out.pct30 = Math.round(taken / span * 100);
  for (let i = end; i < 4000; i++) {
    const v = d[dateKey(addDays(today, -i))];
    if (v && v.t) out.streak++;
    else break;
  }
  const span84 = Math.max(1, Math.min(84, daysBetween(firstDay, today) + 1 - end));
  let t84 = 0;
  for (let i = end; i < end + span84; i++) {
    const v = d[dateKey(addDays(today, -i))];
    if (v && v.t) {
      t84++;
    } else if (v && v.t === false) {
      out.missed84++;
      const reason = v.r || 'forgot';
      out.reasons[reason] = (out.reasons[reason] || 0) + 1;
    }
  }
  out.pct84 = Math.round(t84 / span84 * 100);
  return out;
}

// ---------- computations: growth ----------
/** Linear interpolation of the approximate reference median for a decimal age; null outside 1–18 y. */
function growthMedian(sex, kind, age) {
  const table = (GROWTH_REF[sex] || GROWTH_REF.M)[kind];
  if (age < 1 || age > GROWTH_MAX_AGE) return null;
  const lo = Math.floor(age);
  const hi = Math.min(GROWTH_MAX_AGE, lo + 1);
  const f = age - lo;
  return table[lo] + (table[hi] - table[lo]) * f;
}
const growthP3 = (sex, kind, age) => {
  const m = growthMedian(sex, kind, age);
  return m == null ? null : m * P3_FRACTION[kind];
};
const bmiOf = (h, w) => h > 0 ? w / Math.pow(h / 100, 2) : null;

/** Assess one measurement against the reference: % of median and below-P3 flags. */
function growthAssess(p, rec) {
  const age = ageAt(p.dob, rec.date);
  const mh = growthMedian(p.sex, 'h', age);
  const mw = growthMedian(p.sex, 'w', age);
  return {
    age,
    hPct: mh ? Math.round(rec.h / mh * 100) : null,
    wPct: mw ? Math.round(rec.w / mw * 100) : null,
    hLow: mh ? rec.h < mh * P3_FRACTION.h : false,
    wLow: mw ? rec.w < mw * P3_FRACTION.w : false,
    bmi: bmiOf(rec.h, rec.w)
  };
}
/** Height velocity (cm/year) from the two most recent measurements at least ~5 months apart. */
function heightVelocity(rows) {
  if (rows.length < 2) return null;
  const last = rows[rows.length - 1];
  for (let i = rows.length - 2; i >= 0; i--) {
    const days = daysBetween(parseDate(rows[i].date), parseDate(last.date));
    if (days >= 150) return r1((last.h - rows[i].h) / days * 365.25);
  }
  return null;
}
function growthFlags(p) {
  const rows = growthOf(p.id);
  const last = rows[rows.length - 1];
  if (!last) return [];
  const a = growthAssess(p, last);
  const flags = [];
  if (a.hLow) flags.push({ k: 'gr_flag_short', cls: 'warn' });
  if (a.wLow) flags.push({ k: 'gr_flag_light', cls: 'warn' });
  const vel = heightVelocity(rows);
  if (vel != null && vel < 4 && a.age >= 4 && a.age <= 10) flags.push({ k: 'gr_flag_slow', cls: 'warn' });
  return flags;
}

/** Approximate reference range; creatinine is lower in young children. */
function labRange(test, p) {
  const def = LAB_TESTS[test];

  if (def.byAge && p && ageOf(p.dob) < 12) return { lo: 0.3, hi: 0.7 };
  return { lo: def.lo, hi: def.hi };
}
function labFlag(test, value, p) {

  if (value < r.lo) return 'low';

  return 'ok';
}
const labFmt = (test, v) => Number(v).toFixed(LAB_TESTS[test] ? LAB_TESTS[test].dec : 1);
/** Latest result per test plus a due status against the typical interval. */
function labSummary(p) {

    const mine = rows.filter(r => r.test === test);
    const last = mine[mine.length - 1] || null;

    if (last) {

    return { test, last, mine, daysSince, due, flag: last ? labFlag(test, last.value, p) : null };

}

// ---------- computations: medicines ----------
/** Stock is estimated from the last count minus the daily use since then. */
function medStatus(m) {
  const since = Math.max(0, daysBetween(parseDate(m.countedOn || TODAY), today));
  const left = Math.max(0, m.stock - m.perDay * since);
  const daysLeft = m.perDay > 0 ? Math.floor(left / m.perDay) : null;
  const runOut = daysLeft == null ? null : addDays(today, daysLeft);
  const refillBy = runOut ? addDays(runOut, -REFILL_BUFFER_DAYS) : null;
  let level = 'ok';
  if (daysLeft != null) {
    if (daysLeft <= 0) level = 'out';
    else if (daysLeft <= REFILL_BUFFER_DAYS) level = 'urgent';
    else if (daysLeft <= 14) level = 'soon';
  }
  const monthly = m.perDay * 30;
  const packsMonth = m.pack > 0 ? Math.ceil(monthly / m.pack) : null;
  const costMonth = m.price > 0 && m.pack > 0 ? monthly / m.pack * m.price : 0;
  return { left: Math.round(left * 10) / 10, daysLeft, runOut, refillBy, level, monthly, packsMonth, costMonth };
}
const MED_LEVEL_CLS = { ok: 'ok', soon: 'info', urgent: 'warn', out: 'bad' };
const MED_LEVEL_KEY = { ok: 'med_ok', soon: 'med_soon', urgent: 'med_urgent', out: 'med_out' };
function refillPlan(pid, horizonDays = 90) {
  return medsOf(pid)
    .map(m => ({ m, s: medStatus(m) }))
    .filter(x => x.s.daysLeft != null && x.s.daysLeft <= horizonDays)
    .sort((a, b) => a.s.daysLeft - b.s.daysLeft);
}

function reactionStats(pid) {
  const year = reactionsOf(pid).filter(r => daysBetween(parseDate(r.date), today) <= 365);
  const txYear = txOf(pid).filter(e => daysBetween(parseDate(e.date), today) <= 365).length;
  const minor = year.filter(r => RX_TYPES[r.type] && RX_TYPES[r.type].group === 'minor').length;
  return { n: year.length, txYear, rate: txYear ? year.length / txYear : null, recurrentMinor: minor >= 2 };
}
function costStats(pid) {
  const rows = costsOf(pid);
  const cutoff = dateKey(addMonths(today, -6));
  const six = rows.filter(c => c.date >= cutoff);
  const thisMonth = rows.filter(c => monthKey(c.date) === monthKey(TODAY));
  const oop = six.filter(c => !c.covered);
  const byCat = {};
  six.forEach(c => { byCat[c.cat] = (byCat[c.cat] || 0) + c.amount; });
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const mk = monthKey(dateKey(addMonths(today, -i)));
    const mine = six.filter(c => monthKey(c.date) === mk);
    months.push({ mk, oop: sum(mine.filter(c => !c.covered).map(c => c.amount)), cov: sum(mine.filter(c => c.covered).map(c => c.amount)) });
  }
  const oopTotal = sum(oop.map(c => c.amount));
  return {
    six,
    thisMonth: sum(thisMonth.filter(c => !c.covered).map(c => c.amount)),
    oop6: oopTotal,
    cov6: sum(six.filter(c => c.covered).map(c => c.amount)),
    projYear: Math.round(oopTotal * 2),
    byCat,
    months
  };
}

// ---------- computations: alerts ----------
function alertsFor(p) {
  const a = [];
  const eps = txOf(p.id);
  const last = eps[eps.length - 1];
  const f = ferOf(p.id);
  const lf = f[f.length - 1];
  if (lf && lf.value > 2500) a.push({ lvl: 'bad', k: 'al_ferritin', v: nf.format(lf.value), ic: 'alert' });
  if (last && last.pre != null && last.pre < 7) a.push({ lvl: 'bad', k: 'al_hbLow', v: last.pre, ic: 'droplet' });
  const pr = predictor(eps, p.targetHb);
  if (pr && pr.predicted < today) a.push({ lvl: 'warn', k: 'al_overdue', v: daysBetween(pr.predicted, today), ic: 'clock' });
  const ad = adherenceStats(p.id);
  if (ad.pct30 != null && ad.pct30 < 80) a.push({ lvl: 'warn', k: 'al_adherence', v: ad.pct30, ic: 'pill' });
  const req = annualReq(p);
  if (req && req.perKg > 200) a.push({ lvl: 'info', k: 'al_hyper', v: Math.round(req.perKg), ic: 'info' });
  // MRI iron
  const m = latestMri(p.id);
  if (m && m.cardiac != null && m.cardiac < 20) a.push({ lvl: m.cardiac < 10 ? 'bad' : 'warn', k: 'al_cardiac', v: m.cardiac, ic: 'heart' });
  if (m && m.lic != null && m.lic > 15) a.push({ lvl: 'warn', k: 'al_lic', v: m.lic, ic: 'magnet' });
  // labs
  const labs = labSummary(p);
  const creat = labs.find(s => s.test === 'creat');
  if (creat && creat.flag === 'high') a.push({ lvl: 'warn', k: 'al_creat', v: labFmt('creat', creat.last.value), ic: 'flask' });
  const alt = labs.find(s => s.test === 'alt');
  if (alt && alt.last && alt.last.value > LAB_TESTS.alt.hi * 2) a.push({ lvl: 'warn', k: 'al_alt', v: alt.last.value, ic: 'flask' });
  const over = labsOverdue(p);
  if (over) a.push({ lvl: 'info', k: 'al_labsDue', v: over, ic: 'calendar' });
  // medicines
  medsOf(p.id).forEach(med => {
    const s = medStatus(med);
    if (s.level === 'urgent' || s.level === 'out') a.push({ lvl: 'warn', k: 'al_refill', v: med.name, ic: 'box' });
  });
  // growth
  const gr = growthOf(p.id);
  if (gr.length) {
    const ga = growthAssess(p, gr[gr.length - 1]);
    if (ga.hLow) a.push({ lvl: 'info', k: 'al_growth', v: ga.hPct, ic: 'ruler' });
  }
  return a;
}
function relDays(d) {
  const n = daysBetween(today, d);
  if (n === 0) return t('todayW');
  if (n === 1) return t('tomorrow');
  if (n > 1) return t('inDays', { n });
  return t('overdueBy', { n: -n });
}
const doseTotal = p => p.chelator && p.chelator !== 'none' && p.weight && p.dose ? Math.round(p.dose * p.weight) : null;

// ---------- computations: notifications inbox ----------
/** Derived notifications for every patient; ids are stable per day so read-state survives re-renders. */
function buildInbox() {
  const items = [];
  patients().forEach(p => {
    alertsFor(p).forEach(a => {
      items.push({ id: `${p.id}|${a.k}|${TODAY}`, pid: p.id, who: p.name, lvl: a.lvl, ic: a.ic, title: t(a.k), body: t(a.k + '_t', { v: a.v }), tab: alertTab(a.k) });
    });
    apptOf(p.id).filter(ap => !ap.done && ap.date >= TODAY && daysBetween(today, parseDate(ap.date)) <= 2).forEach(ap => {
      items.push({ id: `${p.id}|appt|${ap.id}`, pid: p.id, who: p.name, lvl: 'info', ic: APPT[ap.type].ic, title: t('ib_appt', { d: relDays(parseDate(ap.date)), t: nm(APPT[ap.type]) }), body: ap.note || '', tab: 'appointments' });
    });
    refillPlan(p.id, 14).forEach(({ m, s }) => {
      if (s.level === 'soon') items.push({ id: `${p.id}|refill|${m.id}|${TODAY}`, pid: p.id, who: p.name, lvl: 'info', ic: 'box', title: t('ib_refill', { m: m.name, n: s.daysLeft }), body: t('med_refillBy') + ': ' + fmtDate(s.refillBy), tab: 'meds' });
    });
  });
  const read = store.get('inboxRead', {});
  items.forEach(it => { it.read = !!read[it.id]; });
  return items;
}
function alertTab(k) {
  if (k === 'al_cardiac' || k === 'al_lic' || k === 'al_ferritin') return 'iron';
  if (k === 'al_creat' || k === 'al_alt' || k === 'al_labsDue') return 'labs';
  if (k === 'al_refill') return 'meds';
  if (k === 'al_adherence') return 'adherence';
  if (k === 'al_growth') return 'growth';
  return 'transfusions';
}
function markInboxRead(ids) {
  const read = store.get('inboxRead', {});
  ids.forEach(id => { read[id] = TODAY; });
  // prune entries older than a week so the map does not grow forever
  Object.keys(read).forEach(id => {
    if (daysBetween(parseDate(read[id]), today) > 7) delete read[id];
  });
  store.set('inboxRead', read);
}

// ---------- SVG charts (hand-drawn, no library) ----------
const INK = '#231d3b';
const MUTED = '#6c6684';
const GRID = '#e3deef';
const chartWidth = el => Math.max(300, (el.clientWidth || 600) - 10);
const axisText = (x, y, txt, anchor = 'middle', size = 11, extra = '') => `<text x="${x}" y="${y}" font-size="${size}" text-anchor="${anchor}" fill="${MUTED}" ${extra}>${txt}</text>`;

function monthTicks(t0, t1, x, H) {
  const months = (t1 - t0) / (30.4 * DAY);
  const every = months > 30 ? 6 : months > 14 ? 3 : months > 7 ? 2 : 1;
  const d = new Date(t0);
  d.setDate(1);
  d.setMonth(d.getMonth() + 1);
  let i = 0;
  let out = '';
  while (d.getTime() <= t1) {
    if (i % every === 0) {
      const label = d.toLocaleDateString('en-GB', { month: 'short' }) + (d.getMonth() === 0 ? ' ' + d.getFullYear() : '');
      out += axisText(x(d.getTime()).toFixed(1), H - 8, label);
    }
    d.setMonth(d.getMonth() + 1);
    i++;
  }
  return out;
}

/** Nearest-point hover/touch tooltip shared by every line chart. */
function attachHover(el, items, W, H, render) {
  const svgEl = $('svg', el);
  const tip = $('.tip', el);
  const marks = $$('[data-hit]', el);
  if (!svgEl || !tip || !items.length) return;
  const show = ev => {
    const rect = svgEl.getBoundingClientRect();
    const px = (ev.clientX - rect.left) / rect.width * W;
    let best = 0;
    let bd = 1e9;
    items.forEach((it, i) => {
      const d = Math.abs(it.x - px);
      if (d < bd) {
        bd = d;
        best = i;
      }
    });
    const it = items[best];
    marks.forEach(m => m.classList.toggle('hot', +m.dataset.hit === best));
    tip.style.display = 'block';
    tip.style.left = (it.x / W * rect.width) + 'px';
    tip.style.top = (it.y / H * rect.height) + 'px';
    tip.innerHTML = render(it);
  };
  const hide = () => {
    tip.style.display = 'none';
    marks.forEach(m => m.classList.remove('hot'));
  };
  svgEl.addEventListener('mousemove', show);
  svgEl.addEventListener('touchmove', e => {
    show(e.touches[0]);
    e.preventDefault();
  }, { passive: false });
  svgEl.addEventListener('touchstart', e => show(e.touches[0]), { passive: true });
  svgEl.addEventListener('mouseleave', hide);
}

/** Hb chart: pre/post points per episode, target band, decline connectors, prediction */
function hbChart(el, eps, target, pred) {
  const inYear = eps.filter(e => daysBetween(parseDate(e.date), today) <= 365);
  const data = inYear.length >= 3 ? inYear : eps.slice(-12);
  if (!data.length) {
    el.innerHTML = `<div class="empty"><div class="emptyic">${ic('droplet')}</div>${T('noTx')}</div>`;
    return;
  }
  const W = chartWidth(el);
  const H = 250;
  const P = { l: 36, r: 18, t: 18, b: 30 };
  const t0 = parseDate(data[0].date).getTime() - 3 * DAY;
  let t1 = today.getTime() + 3 * DAY;
  if (pred && pred.predicted > today) t1 = pred.predicted.getTime() + 4 * DAY;
  const x = ts => P.l + (ts - t0) / ((t1 - t0) || 1) * (W - P.l - P.r);
  const vals = data.flatMap(e => [e.pre, e.post]).filter(v => v != null);
  const lo = Math.min(6, Math.floor(Math.min(...vals)) - 1);
  const hi = Math.max(14, Math.ceil(Math.max(...vals)) + 1);
  const y = v => P.t + (1 - (v - lo) / (hi - lo)) * (H - P.t - P.b);

  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(t('tx_chart'))}">`;
  for (let g = lo; g <= hi; g += 2) {
    s += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(g)}" y2="${y(g)}" stroke="${GRID}"/>` + axisText(P.l - 8, y(g) + 4, g, 'end');
  }
  s += `<rect x="${P.l}" y="${y(TARGET_BAND[1])}" width="${W - P.l - P.r}" height="${y(TARGET_BAND[0]) - y(TARGET_BAND[1])}" fill="#128f80" opacity=".10"/>`;
  s += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(target)}" y2="${y(target)}" stroke="#128f80" stroke-width="1.5"/>`;
  s += axisText(P.l + 6, y(TARGET_BAND[1]) - 5, `${esc(t('target'))} ${target} · ${TARGET_BAND[0]}–${TARGET_BAND[1]}`, 'start', 10.5);
  s += monthTicks(t0, t1, x, H);
  const tx = x(today.getTime());
  s += `<line x1="${tx}" x2="${tx}" y1="${P.t}" y2="${H - P.b}" stroke="#c9c2dd" stroke-width="1"/>` + axisText(tx, P.t - 6, esc(t('todayW')), 'middle', 10);

  const items = data.map((e, i) => ({ e, i, x: x(parseDate(e.date).getTime()), y: y(e.post ?? e.pre), prev: data[i - 1] }));
  let decl = '';
  items.forEach(it => {
    if (it.prev && it.prev.post != null && it.e.pre != null) {
      decl += `M${x(parseDate(it.prev.date).getTime()).toFixed(1)} ${y(it.prev.post).toFixed(1)} L${it.x.toFixed(1)} ${y(it.e.pre).toFixed(1)} `;
    }
  });
  s += `<path class="draw" d="${decl}" fill="none" stroke="#9b93b8" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  items.forEach(it => {
    if (it.e.pre != null && it.e.post != null) s += `<line x1="${it.x}" x2="${it.x}" y1="${y(it.e.pre)}" y2="${y(it.e.post)}" stroke="#6d4fc2" stroke-width="2" opacity=".55"/>`;
  });
  if (pred) {
    const px = x(pred.predicted.getTime());
    const py = y(target);
    const lx = x(parseDate(pred.last.date).getTime());
    const ly = y(pred.last.post);
    s += `<path class="draw" d="M${lx} ${ly} L${px} ${py}" fill="none" stroke="#6d4fc2" stroke-width="2" stroke-dasharray="5 4"/>`;
    s += `<circle cx="${px}" cy="${py}" r="6" fill="#fff" stroke="#6d4fc2" stroke-width="2"/>`;
    s += axisText(px, py + 20, `${esc(t('lg_pred'))} ${fmtShort(pred.predicted)}`, 'middle', 10.5);
  }
  items.forEach(it => {
    if (it.e.pre != null) s += `<circle data-hit="${it.i}" class="pt" cx="${it.x}" cy="${y(it.e.pre)}" r="4.5" fill="#6d4fc2" stroke="#fff" stroke-width="2"/>`;
    if (it.e.post != null) s += `<circle data-hit="${it.i}" class="pt" cx="${it.x}" cy="${y(it.e.post)}" r="4.5" fill="#128f80" stroke="#fff" stroke-width="2"/>`;
  });
  s += `</svg><div class="tip"></div>`;
  el.innerHTML = s;
  $$('path.draw', el).forEach(drawPath);
  attachHover(el, items, W, H, it => {
    const interval = it.prev ? ` · ${esc(t('tx_interval'))} ${daysBetween(parseDate(it.prev.date), parseDate(it.e.date))} ${esc(t('pred_days'))}` : '';
    return `<b>${fmtDate(it.e.date)}</b><br>${esc(t('tx_pre'))}: ${it.e.pre ?? '—'} · ${esc(t('tx_post'))}: ${it.e.post ?? '—'}<br>${volLabel(it.e)}${interval}`;
  });
}

/** Ferritin line chart with 1000 / 2500 thresholds */
function ferritinChart(el, rows, compact = false) {

  s += `</svg><div class="tip"></div>`;

  $$('path.draw', el).forEach(drawPath);

/**
 * Generic dated series chart with optional reference band and threshold lines.
 * rows: [{date, value}], opts: {label, unit, color, band:[lo,hi], thresholds:[{v,color,label}], yMin, yMax, height, dec}
 */
function seriesChart(el, rows, opts) {
  if (!rows.length) {
    el.innerHTML = `<div class="empty"><div class="emptyic">${ic(opts.emptyIcon || 'activity')}</div>${esc(opts.emptyText || t('noData'))}</div>`;
    return;
  }
  const W = chartWidth(el);
  const H = opts.height || 200;
  const P = { l: 44, r: 16, t: 16, b: 30 };
  const color = opts.color || '#6d4fc2';
  const t0 = parseDate(rows[0].date).getTime() - 10 * DAY;
  const t1 = Math.max(today.getTime(), parseDate(rows[rows.length - 1].date).getTime()) + 10 * DAY;
  const x = ts => P.l + (ts - t0) / ((t1 - t0) || 1) * (W - P.l - P.r);
  const vals = rows.map(r => r.value).concat(opts.band || [], (opts.thresholds || []).map(th => th.v));
  const dataHi = Math.max(...rows.map(r => r.value));
  const rawLo = opts.yMin != null ? opts.yMin : Math.max(0, Math.min(...vals) * 0.85);
  const rawHi = opts.yMax != null ? Math.max(opts.yMax, dataHi) : (Math.max(...vals) * 1.15 || 1);
  // round the axis to a nice step so tick labels are whole numbers (e.g. 0, 10, 20 rather than 12.5)
  const step = niceStep((rawHi - rawLo) / 4);
  const lo = Math.floor(rawLo / step) * step;
  const hi = Math.ceil(rawHi / step) * step;
  const y = v => P.t + (1 - (v - lo) / ((hi - lo) || 1)) * (H - P.t - P.b);
  const dec = opts.dec == null ? 0 : opts.dec;

  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(opts.label || '')}">`;
  for (let g = lo; g <= hi + step / 1000; g += step) {
    s += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(g)}" y2="${y(g)}" stroke="${GRID}"/>` + axisText(P.l - 8, y(g) + 4, String(Number(g.toFixed(3))), 'end');
  }
  if (opts.band) {
    const [b0, b1] = opts.band;
    s += `<rect x="${P.l}" y="${y(b1)}" width="${W - P.l - P.r}" height="${Math.max(0, y(b0) - y(b1))}" fill="#128f80" opacity=".10"/>`;
  }
  (opts.thresholds || []).forEach(th => {
    s += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(th.v)}" y2="${y(th.v)}" stroke="${th.color}" stroke-width="1.5" stroke-dasharray="${th.dash ? '5 4' : '0'}"/>`;
    if (th.label) s += axisText(W - P.r, y(th.v) - 5, esc(th.label), 'end', 10.5);
  });
  s += monthTicks(t0, t1, x, H);
  const pts = rows.map((r, i) => ({ r, i, x: x(parseDate(r.date).getTime()), y: y(r.value) }));
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
  s += `<path class="draw" d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach(p => {
    s += `<circle data-hit="${p.i}" class="pt" cx="${p.x}" cy="${p.y}" r="4.5" fill="${color}" stroke="#fff" stroke-width="2"/>`;
  });
  const lp = pts[pts.length - 1];
  s += `<text x="${lp.x}" y="${lp.y - 10}" font-size="11" font-weight="700" text-anchor="middle" fill="${INK}">${lp.r.value.toFixed(dec)}</text>`;
  s += `</svg><div class="tip"></div>`;
  el.innerHTML = s;
  $$('path.draw', el).forEach(drawPath);
  attachHover(el, pts, W, H, p => `<b>${fmtDate(p.r.date)}</b><br>${p.r.value.toFixed(dec)} ${esc(opts.unit || '')}${p.r.extra ? '<br>' + p.r.extra : ''}`);
}

/** Growth chart: patient points over age with approximate median and 3rd-percentile reference curves. */
function growthChart(el, p, rows, kind) {
  if (!rows.length) {
    el.innerHTML = `<div class="empty"><div class="emptyic">${ic('ruler')}</div>${T('gr_none')}</div>`;
    return;
  }
  const W = chartWidth(el);
  const H = 260;
  const P = { l: 40, r: 16, t: 16, b: 30 };
  const ages = rows.map(r => ageAt(p.dob, r.date));
  const a0 = Math.max(0.5, Math.floor(Math.min(...ages) - 1));
  const a1 = Math.min(GROWTH_MAX_AGE, Math.ceil(Math.max(...ages) + 1.5));
  const x = age => P.l + (age - a0) / ((a1 - a0) || 1) * (W - P.l - P.r);
  const ref = [];
  for (let a = Math.max(1, a0); a <= a1; a += 0.5) {
    const m = growthMedian(p.sex, kind, a);
    if (m != null) ref.push({ a, m, p3: m * P3_FRACTION[kind] });
  }
  const vals = rows.map(r => r[kind]).concat(ref.flatMap(q => [q.m, q.p3]));
  const lo = Math.floor(Math.min(...vals) * 0.9);
  const hi = Math.ceil(Math.max(...vals) * 1.08);
  const y = v => P.t + (1 - (v - lo) / ((hi - lo) || 1)) * (H - P.t - P.b);
  const unit = kind === 'h' ? 'cm' : 'kg';

  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(t('gr_chart'))}">`;
  for (let i = 0; i <= 5; i++) {
    const g = lo + (hi - lo) * i / 5;
    s += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(g)}" y2="${y(g)}" stroke="${GRID}"/>` + axisText(P.l - 8, y(g) + 4, Math.round(g), 'end');
  }
  for (let a = Math.ceil(a0); a <= a1; a++) s += axisText(x(a), H - 8, a + ' ' + esc(t('years')));
  if (ref.length) {
    const path = pts => pts.map((q, i) => (i ? 'L' : 'M') + x(q.a).toFixed(1) + ' ' + y(q.v).toFixed(1)).join(' ');
    s += `<path d="${path(ref.map(q => ({ a: q.a, v: q.m })))}" fill="none" stroke="#128f80" stroke-width="2"/>`;
    s += `<path d="${path(ref.map(q => ({ a: q.a, v: q.p3 })))}" fill="none" stroke="#c98a1c" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  }
  const pts = rows.map((r, i) => ({ r, i, age: ages[i], x: x(ages[i]), y: y(r[kind]) }));
  const d = pts.map((q, i) => (i ? 'L' : 'M') + q.x.toFixed(1) + ' ' + q.y.toFixed(1)).join(' ');
  s += `<path class="draw" d="${d}" fill="none" stroke="#6d4fc2" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach(q => {
    s += `<circle data-hit="${q.i}" class="pt" cx="${q.x}" cy="${q.y}" r="5" fill="#6d4fc2" stroke="#fff" stroke-width="2"/>`;
  });
  s += `</svg><div class="tip"></div>`;
  el.innerHTML = s;
  $$('path.draw', el).forEach(drawPath);
  attachHover(el, pts, W, H, q => {
    const a = growthAssess(p, q.r);
    const pct = kind === 'h' ? a.hPct : a.wPct;
    return `<b>${fmtDate(q.r.date)}</b> · ${q.age.toFixed(1)} ${esc(t('years'))}<br>${q.r[kind]} ${unit}${pct != null ? ' · ' + esc(t('gr_pctMedian', { v: pct })) : ''}`;
  });
}

/** A "nice" axis step (1, 2, 2.5 or 5 × 10^n) so tick labels are round numbers. */
function niceStep(raw) {
  const mag = Math.pow(10, Math.floor(Math.log10(raw || 1)));
  const f = raw / mag;
  const nice = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
  return nice * mag;
}
const kLabel = v => v >= 1000 ? `${Math.round(v / 100) / 10}K` : String(Math.round(v));

/** Monthly stacked bars (out-of-pocket vs covered) for the cost tracker. */
function monthBars(el, months) {
  const W = chartWidth(el);
  const H = 200;
  const P = { l: 48, r: 12, t: 16, b: 30 };
  const step = niceStep(Math.max(1000, ...months.map(m => m.oop + m.cov)) / 4);
  const max = step * Math.ceil(Math.max(1000, ...months.map(m => m.oop + m.cov)) / step);
  const y = v => P.t + (1 - v / max) * (H - P.t - P.b);
  const slot = (W - P.l - P.r) / months.length;
  const bw = Math.min(56, slot * 0.6);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(t('cost_byMonth'))}">`;
  for (let g = 0; g <= max + 1e-9; g += step) {
    s += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(g)}" y2="${y(g)}" stroke="${GRID}"/>` + axisText(P.l - 8, y(g) + 4, kLabel(g), 'end');
  }
  months.forEach((m, i) => {
    const cx = P.l + slot * i + slot / 2;
    const x0 = cx - bw / 2;
    const yOop = y(m.oop);
    const yTop = y(m.oop + m.cov);
    s += `<rect x="${x0}" y="${yOop}" width="${bw}" height="${Math.max(0, y(0) - yOop)}" rx="4" fill="#6d4fc2"><title>${esc(t('cost_oop'))}: ${pkr(m.oop)}</title></rect>`;
    s += `<rect x="${x0}" y="${yTop}" width="${bw}" height="${Math.max(0, yOop - yTop)}" rx="4" fill="#128f80" opacity=".75"><title>${esc(t('cost_cov'))}: ${pkr(m.cov)}</title></rect>`;
    if (m.oop + m.cov > 0) s += `<text x="${cx}" y="${yTop - 5}" font-size="10.5" font-weight="700" text-anchor="middle" fill="${INK}">${kLabel(m.oop + m.cov)}</text>`;
    s += axisText(cx, H - 8, fmtMonth(m.mk));
  });
  s += '</svg>';
  el.innerHTML = s;
}

/** Tiny inline sparkline for table rows. */
function sparkline(values, color = '#6d4fc2') {
  if (values.length < 2) return '';
  const W = 84;
  const H = 26;
  const lo = Math.min(...values);
  const hi = Math.max(...values);
  const x = i => 3 + i / (values.length - 1) * (W - 6);
  const y = v => 3 + (1 - (v - lo) / ((hi - lo) || 1)) * (H - 6);
  const d = values.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  const last = values.length - 1;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round"/><circle cx="${x(last)}" cy="${y(values[last])}" r="2.5" fill="${color}"/></svg>`;
}

/** 12-week dose calendar (CSS grid heatmap) */
function heatmap(pid, weeks = 12) {
  const d = dosesOf(pid);
  const dow = (today.getDay() + 6) % 7;
  const start = addDays(today, -dow - (weeks - 1) * 7);
  let h = `<div class="heat" style="grid-template-columns:auto repeat(${weeks},minmax(0,1fr))"><div></div>`;
  for (let w = 0; w < weeks; w++) {
    const ds = addDays(start, w * 7);
    h += `<div class="hl">${w % 3 === 0 ? fmtShort(ds) : ''}</div>`;
  }
  const DN = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  for (let r = 0; r < 7; r++) {
    h += `<div class="dl">${r % 2 === 0 ? DN[r] : ''}</div>`;
    for (let w = 0; w < weeks; w++) {
      const day = addDays(start, w * 7 + r);
      const k = dateKey(day);
      const fut = day > today;
      const v = d[k];
      const cls = fut ? 'f' : v ? (v.t ? 't' : 'm') : 'n';
      let title = fmtDate(k);
      if (v) title += ': ' + (v.t ? t('taken') : t('missed') + (v.r ? ' · ' + nm(REASONS[v.r] || REASONS.forgot) : ''));
      h += `<button type="button" class="c ${cls} ${k === TODAY ? 'today' : ''}" data-day="${k}" ${fut ? 'disabled tabindex="-1"' : ''} title="${esc(title)}" aria-label="${esc(title)}"></button>`;
    }
  }
  return h + '</div>';
}

/** Horizontal bars: generic {label, value, colour} list scaled to the max. */
function hBars(items, fmt = v => v) {
  const max = Math.max(...items.map(i => i.value), 1);
  return items.map(i => `<div class="bar"><span class="lbl"><i style="background:${i.c}"></i>${i.label}</span><div class="track"><div class="fill" data-w="${i.value / max * 100}%" style="width:0;background:${i.c}"></div></div><span class="n">${fmt(i.value)}</span></div>`).join('');
}
/** Missed-dose reason bars */
function reasonBars(reasons) {
  const total = sum(Object.values(reasons));
  if (!total) return `<div class="empty">${T('adh_noMiss')}</div>`;
  const items = Object.entries(REASONS)
    .sort((a, b) => (reasons[b[0]] || 0) - (reasons[a[0]] || 0))
    .map(([k, r]) => ({ label: NM(r), value: reasons[k] || 0, c: r.c }));
  return hBars(items);
}

/** Dose range bar for the chelator helper */
function doseBar(ch, dose) {
  const W = 360;
  const H = 58;
  const max = ch.max * 1.35;
  const x = v => 10 + Math.min(1, v / max) * (W - 20);
  const cls = dose < ch.min ? 'warn' : dose > ch.max ? 'bad' : 'ok';
  const col = { ok: '#2e7d4f', warn: '#a9640a', bad: '#c23b32' }[cls];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto;display:block" aria-hidden="true">
    <line x1="10" x2="${W - 10}" y1="34" y2="34" stroke="${GRID}" stroke-width="8" stroke-linecap="round"/>
    <line x1="${x(ch.min)}" x2="${x(ch.max)}" y1="34" y2="34" stroke="#128f80" stroke-width="8" stroke-linecap="round" opacity=".8"/>
    ${axisText(x(ch.min), 54, ch.min)}${axisText(x(ch.max), 54, ch.max)}
    <circle cx="${x(dose)}" cy="34" r="8" fill="${col}" stroke="#fff" stroke-width="3"/>
    <text x="${x(dose)}" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="${INK}">${dose} mg/kg</text></svg>`;
}

    <div class="top"><b>${ic('box')} ${esc(m.name)}</b><span class="pill violet">${T('med_t_' + m.type)}</span><span class="pill">${T('med_src_' + (m.source || 'pharmacy'))}</span><span class="pill st ${MED_LEVEL_CLS[s.level]}">${T(MED_LEVEL_KEY[s.level])}</span></div>

function renderMeds(p) {

  }

    return `${panelTitle('award', 'qz_t')}<div class="verdict ${pct >= 0.8 ? 'ok' : pct >= 0.5 ? 'info' : 'warn'} enter"><div class="eyebrow">${T('qz_score')}</div><div class="big"><span id="qzFinal">0</span> / ${QUIZ.length}</div><p class="${urCls()}" style="margin:6px 0 0">${T(msg)}</p></div>${stats}<button class="btn" id="qzStart">${ic('refresh')} ${T('qz_restart')}</button>`;

function renderLearn() {

function bindLearn() {
  $$('[data-open]').forEach(b => { b.onclick = () => { libOpen = b.dataset.open; renderLearn(); }; });
  if ($('#libBack')) $('#libBack').onclick = () => { libOpen = null; renderLearn(); };
  $$('[data-cat]').forEach(c => { c.onclick = () => { libCat = c.dataset.cat; renderLearn(); }; });
  if ($('#libSearch')) {
    $('#libSearch').oninput = debounce(e => {
      libQuery = e.target.value;
      renderLearn();
      const box = $('#libSearch');
      if (box) {
        box.focus();
        box.setSelectionRange(box.value.length, box.value.length);
      }
    }, 200);
  }

}
function bindQuiz() {
  const box = $('#quizBox');
  const refresh = () => {
    box.innerHTML = quizPanel();
    animateFills(box);
    bindQuiz();
  };
  if ($('#qzStart')) {
    $('#qzStart').onclick = () => {
      quiz.active = true;
      quiz.i = 0;
      quiz.score = 0;
      quiz.answered = null;
      quiz.order = QUIZ.map((_, i) => i).sort(() => Math.random() - 0.5);
      refresh();
    };
  }
  $$('[data-ans]', box).forEach(b => {
    b.onclick = () => {
      quiz.answered = +b.dataset.ans;
      if (quiz.answered === QUIZ[quiz.order[quiz.i]].a) quiz.score++;
      refresh();
    };
  });
  if ($('#qzNext')) {
    $('#qzNext').onclick = () => {
      quiz.i++;
      quiz.answered = null;
      if (quiz.i >= QUIZ.length) {
        const saved = store.get('quiz', { best: null, attempts: 0 });
        saved.attempts++;
        saved.best = saved.best == null ? quiz.score : Math.max(saved.best, quiz.score);
        saved.last = TODAY;
        store.set('quiz', saved);
      }
      refresh();
      if ($('#qzFinal')) countUp($('#qzFinal'), quiz.score);
    };
  }
}

const settings = () => Object.assign({ text: 'normal', motion: 'on' }, store.get('settings', {}));

  document.documentElement.dataset.motion = s.motion;

function saveSetting(k, v) {
  const s = settings();
  s[k] = v;
  store.set('settings', s);
  applySettings();

function storageStats() {
  let bytes = 0;
  let records = 0;
  store.keys().forEach(k => {
    const raw = localStorage.getItem(NS + k) || '';
    bytes += raw.length * 2;
    const v = store.get(k, null);
    if (Array.isArray(v)) records += v.length;
    else if (v && typeof v === 'object') Object.values(v).forEach(x => { records += Array.isArray(x) ? x.length : (x && typeof x === 'object' ? Object.keys(x).length : 0); });
  });
  return { kb: Math.round(bytes / 1024 * 10) / 10, records };
}

// ---------- backup: export / import of every thal:* key ----------
function exportBackup() {
  const data = {};
  store.keys().forEach(k => { data[k] = store.get(k, null); });
  const payload = { app: 'thalassemia-care-companion', version: SEED_VERSION, exported: new Date().toISOString(), data };
  downloadFile(`thal-backup-${TODAY}.json`, JSON.stringify(payload, null, 2), 'application/json');
  toast(t('st_exported'), 'ok');
}
function importBackup(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let payload;
    try {
      payload = JSON.parse(reader.result);
    } catch {
      return toast(t('st_importBad'), 'bad');
    }
    const ok = payload && payload.app === 'thalassemia-care-companion' && payload.data && Array.isArray(payload.data.patients);
    if (!ok) return toast(t('st_importBad'), 'bad');
    if (!confirm(t('st_importConfirm'))) return;
    store.keys().forEach(k => store.remove(k));
    Object.entries(payload.data).forEach(([k, v]) => { if (v != null) store.set(k, v); });
    store.set('seeded', SEED_VERSION);
    lang = store.get('lang', 'en');
    toast(t('st_imported'), 'ok');
    location.hash = 'overview';
    applyLang();
  };
  reader.readAsText(file);
}
$('#importFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (f) importBackup(f);
  e.target.value = '';
});

function mentzer() {
  const hb = +$('#mzHb').value;
  const mcv = +$('#mzMcv').value;
  const mch = +$('#mzMch').value;
  const rbc = +$('#mzRbc').value;
  Object.assign(scr, { hb, mcv, mch, rbc });
  store.set('screen', scr);
  if (!(mcv > 0) || !(rbc > 0)) {
    $('#mzOut').innerHTML = `<div class="warnbox" style="margin-top:12px">${T('mz_invalid')}</div>`;
    return;
  }
  const mi = mcv / rbc;
  const sl = mcv * mcv * mch / 100;
  const cls = mcv >= 80 ? 'info' : mi < 12.5 ? 'warn' : mi > 13.5 ? 'bad' : 'info';
  const verdict = mcv >= 80 ? 'mz_normal' : mi < 12.5 ? 'mz_low' : mi > 13.5 ? 'mz_high' : 'mz_border';
  $('#mzOut').innerHTML = `<div class="verdict ${cls} enter"><div class="eyebrow">${T('mz_index')}</div><div class="big num" id="mzVal">0</div><div><b>${T(verdict)}</b></div>
    <div class="cols tight" style="margin-top:10px;font-size:.88rem"><div><div class="eyebrow">${T('mz_sl')}</div><b class="num">${nf.format(sl)}</b> <span class="muted">${sl < 1530 ? '< 1530 → ' + esc(t('mz_low').toLowerCase()) : '≥ 1530'}</span></div><div><div class="eyebrow">MCV / MCH</div><b>${mcv} fL / ${mch} pg</b> <span class="muted">${mcv < 80 ? 'microcytic' : 'normocytic'}${mch < 27 ? ', hypochromic' : ''}</span></div><div><div class="eyebrow">Hb</div><b>${hb} g/dL</b></div></div></div>`;
  countUp($('#mzVal'), mi, { fmt: v => v.toFixed(1) });
}
function punnett() {
  scr.mother = $('#pqM').value;
  scr.father = $('#pqF').value;
  store.set('screen', scr);
  const m = ALLELES[scr.mother];
  const f = ALLELES[scr.father];
  const counts = { AA: 0, Aa: 0, aa: 0 };
  const cells = [];
  m.forEach(a => f.forEach(b => {
    const g = [a, b].sort().join('');
    const key = g === 'AA' ? 'AA' : g === 'aa' ? 'aa' : 'Aa';
    counts[key]++;
    cells.push(key);
  }));
  const lbl = { AA: 'pq_unaffected', Aa: 'pq_carrier', aa: 'pq_major' };
  const grid = [0, 1].map(i => `<div class="h">${m[i]}</div>${[0, 1].map(j => {
    const k = cells[i * 2 + j];
    return `<div class="cell ${k}">${k}<small>${T(lbl[k])}</small></div>`;
  }).join('')}`).join('');
  $('#pqOut').innerHTML = `<div class="punnett"><div></div><div class="h">${f[0]}</div><div class="h">${f[1]}</div>${grid}</div>
    <div class="eyebrow">${T('pq_each')}</div>
    <div class="riskbar">${['aa', 'Aa', 'AA'].filter(k => counts[k]).map(k => `<span class="${k}" data-w="${counts[k] * 25}%" style="width:0" title="${esc(t(lbl[k]))}">${counts[k] * 25}%</span>`).join('')}</div>
    <div class="legend" style="margin-top:8px"><span><i class="sq" style="background:var(--bad)"></i>${T('pq_major')} ${counts.aa * 25}%</span><span><i class="sq" style="background:var(--warn)"></i>${T('pq_carrier')} ${counts.Aa * 25}%</span><span><i class="sq" style="background:var(--ok)"></i>${T('pq_unaffected')} ${counts.AA * 25}%</span></div>`;
  animateFills($('#pqOut'));
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast(t('copied'), 'ok');
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.append(ta);
    ta.select();
    try {
      document.execCommand('copy');
      toast(t('copied'), 'ok');
    } catch {
      toast(t('invalid'), 'bad');
    }
    ta.remove();
  }
}
