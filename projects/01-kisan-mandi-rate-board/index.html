<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kisan Mandi Rate Board</title>
<meta name="description" content="Daily crop rates across Pakistani mandis, a sell advisor that ranks mandis by net revenue, cost-of-production calculator, schematic mandi map, seasonal analytics, farmer portfolio, buyer directory, SMS rate sheets, alerts and community reports. Single-file FYP template.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens: wheat, soil, leaf ---------- */
:root{
  --bg:#f6f1e7; --surface:#fffdf8; --surface-2:#f1eadb; --ink:#2b2118; --muted:#7a6a5a; --line:#e7dccb;
  --wheat:#e0a526; --wheat-deep:#b8811a; --wheat-soft:#fbf0d6; --soil:#6b4226; --soil-deep:#4a2d19;
  --leaf:#2f7d32; --leaf-soft:#e3f1e4; --rise:#1f7a3a; --rise-soft:#e4f3e8; --fall:#b23a2f; --fall-soft:#fbe6e3;
  --radius:14px; --radius-sm:9px; --shadow:0 10px 30px -18px rgba(43,33,24,.35);
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --font-ur:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;
  --ease:cubic-bezier(.2,.8,.2,1); --dur:.35s;
}
/* Night theme: same palette family, darker surfaces (chosen in Settings) */
html[data-theme=dark]{
  --bg:#1b1511; --surface:#251c16; --surface-2:#30261d; --ink:#f3e9d9; --muted:#b7a48f; --line:#41342a;
  --wheat-soft:#3b2f17; --wheat-deep:#e6b03a; --leaf:#4a9e4e; --leaf-soft:#1f3321; --rise:#5fc27a; --rise-soft:#1c3323; --fall:#e4776c; --fall-soft:#3b201c;
  --shadow:0 10px 30px -18px rgba(0,0,0,.8);
}
html[data-theme=dark] .chip,html[data-theme=dark] .seg button{color:var(--ink)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--soil)}
html[data-theme=dark] a{color:var(--wheat)}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
.ur,[lang=ur]{font-family:var(--font-ur);line-height:1.9}
html[lang=ur] .i18n{font-family:var(--font-ur);line-height:1.9}
html[lang=ur] .card .name{font-size:1.15rem}
.muted{color:var(--muted)}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.small{font-size:.8rem}
.tiny{font-size:.75rem}
.b{font-weight:800}
.mt{margin-top:12px}
.mb{margin-bottom:12px}
.flex{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.right{text-align:right}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--soil-deep),var(--soil));color:#fff4e0;display:flex;align-items:center;gap:10px;padding:10px 18px;box-shadow:0 4px 20px -8px rgba(0,0,0,.45)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:11px;background:var(--wheat);display:grid;place-items:center;color:var(--soil-deep);flex:none}
.brand h1{font-size:1.02rem;font-weight:800;white-space:nowrap}
.brand small{display:block;font-size:.72rem;opacity:.8;font-weight:500;white-space:nowrap}
.topnav{display:flex;gap:2px;margin-left:8px;align-items:center}
.topnav a,.topnav button{color:#fff4e0;text-decoration:none;padding:7px 10px;border-radius:9px;font-weight:600;font-size:.86rem;opacity:.85;display:inline-flex;align-items:center;gap:6px;background:none;border:0;cursor:pointer;white-space:nowrap}
.topnav a:hover,.topnav button:hover{background:rgba(255,255,255,.08);opacity:1}
.topnav a.active{background:var(--wheat);color:var(--soil-deep);opacity:1}
.morewrap{position:relative}
.moremenu{position:absolute;top:calc(100% + 8px);left:0;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 50px -20px rgba(0,0,0,.5);padding:6px;min-width:230px;display:none;z-index:40;animation:kPop .18s var(--ease)}
.morewrap.open .moremenu{display:block}
.moremenu a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--ink);text-decoration:none;font-weight:600;font-size:.9rem}
.moremenu a:hover{background:var(--wheat-soft)}
.moremenu a.active{background:var(--leaf-soft);color:var(--leaf)}
.spacer{flex:1}
.qwrap{position:relative;min-width:0}
.search{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:6px 10px;min-width:0}
.search input{background:none;border:0;outline:0;color:#fff;width:170px;max-width:40vw}
.search input::placeholder{color:rgba(255,244,224,.7)}
.qres{position:absolute;top:calc(100% + 8px);right:0;width:min(360px,92vw);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 50px -20px rgba(0,0,0,.5);padding:6px;display:none;z-index:40;max-height:60vh;overflow:auto}
.qres.open{display:block}
.qres .grp{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;padding:8px 10px 4px}
.qres button{display:flex;width:100%;align-items:center;gap:10px;padding:8px 10px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left}
.qres button:hover,.qres button.sel{background:var(--wheat-soft)}
.qres button .ic{color:var(--muted)}
.lang{background:var(--wheat);color:var(--soil-deep);border:0;border-radius:9px;padding:7px 11px;font-weight:800;cursor:pointer}
.datebadge{font-size:.78rem;opacity:.85;white-space:nowrap}
.iconbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:9px;padding:7px 10px;cursor:pointer;display:none}
.bellbtn{position:relative;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:9px;width:38px;height:38px;cursor:pointer;display:grid;place-items:center}
.bellbtn .ic{width:1.2em;height:1.2em}
.badgeN{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--fall);color:#fff;font-size:.68rem;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--soil)}
.badgeN.zero{display:none}
.moremenu .badgeN,.bottomnav .badgeN{position:static;border:0;margin-left:auto}
.bottomnav a{position:relative}
.bottomnav a .badgeN{position:absolute;top:2px;right:calc(50% - 22px);margin:0}

/* ---------- Layout ---------- */
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;max-width:1360px;margin:0 auto;padding:22px 18px 90px}
.sidebar{position:sticky;top:76px;align-self:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.sidebar h3{font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 8px}
.sidebar h3:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 11px;font-size:.84rem;font-weight:600;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.chip.wheat.on{background:var(--wheat);border-color:var(--wheat);color:var(--soil-deep)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2);flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 11px;cursor:pointer;font-weight:600;font-size:.85rem}
.seg button.on{background:var(--soil);color:#fff}
select,input[type=number],input[type=text],input[type=date],input[type=tel],input[type=search].plain,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;outline:0}
select:focus,input:focus,textarea:focus{border-color:var(--wheat);box-shadow:0 0 0 3px var(--wheat-soft)}
textarea{min-height:120px;resize:vertical}
textarea.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.84rem;line-height:1.5}
label.f{display:block;font-size:.82rem;font-weight:700;color:var(--muted);margin:10px 0 5px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--leaf);color:#fff;display:inline-flex;align-items:center;gap:8px;transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .2s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.wheat{background:var(--wheat);color:var(--soil-deep)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--fall-soft);color:var(--fall)}
.btn.sm{padding:6px 10px;font-size:.82rem;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.on{outline:2px solid var(--wheat)}
input[type=range]{width:100%;accent-color:var(--leaf);margin:6px 0}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--leaf);vertical-align:middle}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch .lbl{font-weight:700}
.switch .hint{font-size:.8rem;color:var(--muted)}

body:not([data-page=rates]) .sidebar,body:not([data-page=rates]) #filterBtn{display:none}
body:not([data-page=rates]) .layout{grid-template-columns:minmax(0,1fr)}

/* ---------- KPI strip ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpis.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.kpi .k{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:1.25rem;font-weight:800;margin-top:4px;overflow-wrap:anywhere}
.kpi .s{font-size:.82rem;color:var(--muted)}
.kpi.rise .v{color:var(--rise)}
.kpi.fall .v{color:var(--fall)}
.kpi.wheat{border-color:var(--wheat)}

/* ---------- Commodity cards ---------- */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .count{font-weight:700;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px 12px;box-shadow:var(--shadow);cursor:pointer;transition:transform .2s var(--ease),border-color .2s,box-shadow .2s var(--ease);position:relative;overflow:hidden}
.card:hover{transform:translateY(-2px);border-color:var(--wheat)}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--cat,var(--leaf))}
.card .head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .name{font-weight:800;font-size:1.02rem}
.card .sub{font-size:.8rem;color:var(--muted)}
.card .price{font-size:1.45rem;font-weight:800;margin-top:8px;letter-spacing:-.02em}
.card .unit{font-size:.78rem;color:var(--muted);font-weight:600}
.card .foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:6px;gap:8px}
.card .range{font-size:.78rem;color:var(--muted)}
.card.off{opacity:.65;background:var(--surface-2)}
.card.static{cursor:default}
.card.static:hover{transform:none;border-color:var(--line)}
.delta{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;border-radius:999px;padding:3px 8px;font-size:.78rem;font-weight:800}
.delta.up{background:var(--rise-soft);color:var(--rise)}
.delta.down{background:var(--fall-soft);color:var(--fall)}
.delta.flat{background:var(--surface-2);color:var(--muted)}
.spark{width:110px;height:34px;display:block}
.badge{display:inline-block;border-radius:6px;padding:2px 7px;font-size:.72rem;font-weight:800;background:var(--wheat-soft);color:var(--wheat-deep)}
.badge.leaf{background:var(--leaf-soft);color:var(--leaf)}
.badge.fall{background:var(--fall-soft);color:var(--fall)}
.badge.soil{background:var(--soil);color:#fff}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:.74rem;font-weight:700;border:1px solid var(--line);background:var(--surface-2)}

/* ---------- Table ---------- */
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:.9rem;vertical-align:middle}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--wheat-soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.best td{background:var(--leaf-soft)}
tr.dim td{opacity:.55}
.tablewrap{overflow:auto;border-radius:var(--radius)}
table.compact th,table.compact td{padding:7px 10px;font-size:.84rem}

/* ---------- Panels / forms ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.panel h2{font-size:1.2rem;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.panel h3{font-size:1rem;margin:14px 0 8px}
.panel p.lead{margin:0 0 12px;color:var(--muted)}
.panel.leafy{border-color:var(--leaf);background:linear-gradient(135deg,var(--leaf-soft),var(--surface))}
.panel.wheaty{border-color:var(--wheat);background:linear-gradient(135deg,var(--wheat-soft),var(--surface))}
.panel.sad{border-color:var(--fall);background:linear-gradient(135deg,var(--fall-soft),var(--surface))}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px}
.cols.tight{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:18px;align-items:start}
.two.rev{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.two.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.note{background:var(--wheat-soft);border-left:4px solid var(--wheat);padding:10px 12px;border-radius:8px;font-size:.88rem}
.warn{background:var(--fall-soft);border-left:4px solid var(--fall);padding:10px 12px;border-radius:8px;font-size:.88rem}
.good{background:var(--rise-soft);border-left:4px solid var(--rise);padding:10px 12px;border-radius:8px;font-size:.88rem}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);min-width:0}
.row.hit{border-color:var(--rise);background:var(--rise-soft)}
.row.unread{border-color:var(--wheat);background:var(--wheat-soft)}
.row.click{cursor:pointer}
.row.click:hover{border-color:var(--wheat)}
.row > div{min-width:0}
.todo{border:1px dashed var(--soil);border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.todo h4{margin:0 0 6px;font-size:.95rem;display:flex;align-items:center;gap:8px}
.todo .tag{font-size:.7rem;background:var(--soil);color:#fff;border-radius:6px;padding:2px 6px;font-weight:800}
.bigstat{font-size:2rem;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:.9rem}
.kv dt{color:var(--muted);margin:0}
.kv dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:34px 18px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius);background:var(--surface-2)}
.empty .ic{width:2.2em;height:2.2em;display:block;margin:0 auto 8px;color:var(--wheat-deep)}
.sect{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.sect:first-child{margin-top:0}

/* ---------- Horizontal bars (cost breakdown, rankings) ---------- */
.bars{display:flex;flex-direction:column;gap:8px}
.bars .brow{display:grid;grid-template-columns:minmax(130px,1fr) minmax(0,1.6fr) auto;gap:10px;align-items:center;font-size:.85rem}
.bars .brow .lbl{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--leaf);border-radius:6px;transition:width .6s var(--ease)}
.bar>i.wheat{background:var(--wheat)}
.bar>i.fall{background:var(--fall)}
.bars .val{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- Drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(43,33,24,.4);backdrop-filter:blur(2px);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surface);z-index:50;transform:translateX(102%);transition:transform .25s var(--ease);box-shadow:-20px 0 60px -30px rgba(0,0,0,.5);display:flex;flex-direction:column}
body.drawer-open .scrim{opacity:1;pointer-events:auto}
body.drawer-open .drawer{transform:none}
.drawer header{display:flex;align-items:flex-start;gap:10px;padding:18px 20px 10px;border-bottom:1px solid var(--line)}
.drawer header h2{font-size:1.3rem}
.drawer .body{padding:16px 20px 30px;overflow:auto}
.close{margin-left:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;width:36px;height:36px;cursor:pointer;display:grid;place-items:center;flex:none}

/* ---------- Charts ---------- */
.chart{position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px}
.chart svg{width:100%;height:240px;display:block;overflow:visible}
.chart.tall svg{height:300px}
.chart .tip{position:absolute;pointer-events:none;background:var(--soil-deep);color:#fff;border-radius:8px;padding:6px 9px;font-size:.78rem;transform:translate(-50%,-110%);white-space:nowrap;display:none;z-index:2}
.chart .tip .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;margin:8px 2px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.legend i.dash{height:0;border-top:2px dashed currentColor;border-radius:0}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.chart .vbar{transform-box:fill-box;transform-origin:bottom;animation:growY .6s var(--ease) both}

/* ---------- Schematic map ---------- */
.mapwrap{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:10px;position:relative}
.mapwrap svg{width:100%;height:auto;display:block;max-height:560px}
.prov{fill:var(--surface);stroke:var(--soil);stroke-width:1.6;stroke-linejoin:round;transition:fill .2s}
.prov.north{fill:var(--bg);stroke-dasharray:4 3;opacity:.8}
.prov.hot{fill:var(--wheat-soft)}
.plabel{font-size:12px;font-weight:800;fill:var(--muted);letter-spacing:.06em;text-transform:uppercase;pointer-events:none}
.mdot{cursor:pointer;stroke:#fff;stroke-width:1.5;transition:r .2s var(--ease)}
.mdot:hover{stroke:var(--ink)}
.mdot.off{fill:var(--muted);opacity:.5}
.mlabel{font-size:10px;font-weight:700;fill:var(--ink);pointer-events:none}
.mapwrap .tip{position:absolute;pointer-events:none;background:var(--soil-deep);color:#fff;border-radius:8px;padding:6px 9px;font-size:.78rem;transform:translate(-50%,-115%);white-space:nowrap;display:none;z-index:2}
.gradlegend{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.gradlegend .g{flex:1;min-width:120px;height:10px;border-radius:6px;background:linear-gradient(90deg,#1f7a3a,#e0a526,#b23a2f)}

/* ---------- Buyers / portfolio / inbox ---------- */
.buyer{display:flex;flex-direction:column;gap:8px}
.buyer .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.buyer .name{font-weight:800;font-size:1rem}
.buyer .meta{font-size:.8rem;color:var(--muted)}
.stars{display:inline-flex;gap:1px;color:var(--wheat-deep)}
.stars .ic{width:1em;height:1em}
.stars .ic.dim{opacity:.3}
.stars .ic:not(.dim){fill:currentColor}
.stars.pick .ic{cursor:pointer;width:1.5em;height:1.5em}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.notif{display:flex;gap:12px;align-items:flex-start}
.notif .dot{width:10px;height:10px;border-radius:50%;background:var(--wheat);flex:none;margin-top:6px}
.notif.read .dot{background:var(--line)}
.notif .ic.type{width:1.4em;height:1.4em;color:var(--soil);flex:none;margin-top:2px}
.verdict{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;font-weight:700}
.verdict .ic{width:1.6em;height:1.6em;flex:none}
.verdict.ok{background:var(--rise-soft);color:var(--rise)}
.verdict.mid{background:var(--wheat-soft);color:var(--wheat-deep)}
.verdict.bad{background:var(--fall-soft);color:var(--fall)}
.monthgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
.monthgrid .m{text-align:center;border-radius:8px;padding:8px 2px;font-size:.72rem;font-weight:700;background:var(--surface-2);border:1px solid var(--line);min-width:0}
.monthgrid .m b{display:block;font-size:.8rem}
.monthgrid .m.best{background:var(--rise-soft);border-color:var(--rise);color:var(--rise)}
.monthgrid .m.worst{background:var(--fall-soft);border-color:var(--fall);color:var(--fall)}
.monthgrid .m.now{outline:2px solid var(--wheat)}

/* ---------- Modal / sheet / tour ---------- */
.modal{position:fixed;inset:0;z-index:70;display:none;place-items:center;padding:16px;background:rgba(43,33,24,.45);backdrop-filter:blur(2px)}
.modal.open{display:grid}
.modalbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:20px 22px;box-shadow:0 30px 80px -30px rgba(0,0,0,.6);animation:kPop .22s var(--ease)}
.modalbox h2{font-size:1.15rem;display:flex;align-items:center;gap:8px}
.modalbox .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;font-size:.9rem}
kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;background:var(--surface-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:2px 7px;font-weight:700}
.moresheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-radius:18px 18px 0 0;z-index:46;padding:14px 14px 90px;transform:translateY(105%);transition:transform .25s var(--ease);box-shadow:0 -20px 60px -30px rgba(0,0,0,.6);max-height:80vh;overflow:auto}
body.more-open .moresheet{transform:none}
.moresheet .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.moresheet .tiles a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:700;font-size:.78rem;text-align:center}
.moresheet .tiles a.active{background:var(--wheat-soft);border-color:var(--wheat)}
.moresheet .tiles a .ic{width:1.5em;height:1.5em;color:var(--soil)}
.tourspot{position:fixed;z-index:80;border-radius:12px;box-shadow:0 0 0 9999px rgba(43,33,24,.6);pointer-events:none;transition:all .3s var(--ease);display:none}
.tourcard{position:fixed;z-index:81;width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);display:none;animation:kPop .25s var(--ease)}
body.tour-on .tourspot,body.tour-on .tourcard{display:block}
.tourcard h3{font-size:1rem;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.tourcard p{margin:0 0 12px;color:var(--muted);font-size:.9rem}
.tourcard .steps{display:flex;gap:4px;margin-right:auto}
.tourcard .steps i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
.tourcard .steps i.on{background:var(--wheat)}
.tourcard .actions{display:flex;gap:6px;align-items:center}

/* ---------- SMS / print sheet ---------- */
.smsmeta{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:6px}
.printsheet{background:#fff;color:#1b1511;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.printsheet h2{font-size:1.2rem}
.printsheet table{box-shadow:none;border-radius:0;background:#fff;color:#1b1511}
.printsheet th{background:#f1eadb;color:#5a4a3a}
.printsheet td,.printsheet th{border-color:#ddd}
.printsheet .foot{font-size:.75rem;color:#6a5a4a;margin-top:10px}

/* ---------- Toasts / bottom nav ---------- */
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;max-width:calc(100vw - 24px)}
.toast{background:var(--soil-deep);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:kPopUp .25s var(--ease);display:flex;align-items:center;gap:8px}
.toast.ok{background:var(--leaf)}
.toast.bad{background:var(--fall)}
.toast.out{opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s}
@keyframes kPopUp{from{transform:translateY(10px);opacity:0}}
@keyframes kPop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.bottomnav{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:35;padding:6px 4px env(safe-area-inset-bottom)}
.bottomnav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:700;padding:6px 2px;border-radius:8px;min-width:0}
.bottomnav a.active{color:var(--soil);background:var(--wheat-soft)}
.bottomnav a span{display:block;font-size:1.15rem}
.bottomnav a span .ic{width:1.3em;height:1.3em}

@media (max-width:1180px){
  .datebadge{display:none}
  .brand small{display:none}
}
@media (max-width:980px){
  .layout{grid-template-columns:minmax(0,1fr);padding-top:14px}
  #view{min-width:0}
  .sidebar{position:fixed;inset:auto 0 0 0;top:auto;max-height:80vh;overflow:auto;border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .25s;z-index:45}
  body.filters-open .sidebar{transform:none}
  .iconbtn{display:inline-block}
  .topnav{display:none}
  .bottomnav{display:flex}
  .kpis,.kpis.three{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two,.two.rev,.two.even{grid-template-columns:minmax(0,1fr)}
  .topbar{flex-wrap:wrap;row-gap:8px}
  .qwrap{order:10;flex-basis:100%}
  .search input{width:100%;max-width:none}
  .qres{left:0;right:auto;width:100%}
  .brand h1{font-size:.95rem}
  .monthgrid{grid-template-columns:repeat(6,minmax(0,1fr))}
  .bars .brow{grid-template-columns:minmax(96px,.9fr) minmax(0,1.6fr) auto}
}
@media (max-width:600px){
  .mlabel{display:none}
}
@media (max-width:480px){
  .kpi .v{font-size:1.05rem}
  .bigstat{font-size:1.5rem}
  .moresheet .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media print{
  .topbar,.sidebar,.bottomnav,#toasts,.drawer,.scrim,.tourspot,.tourcard,.modal,.moresheet,.no-print{display:none!important}
  body{background:#fff;color:#000}
  .layout{display:block;padding:0;max-width:none}
  .panel,.printsheet{box-shadow:none;border:0;padding:0}
  .two,.two.rev{display:block}
}

/* ---------- icon + motion kit ---------- */
.ic{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@keyframes kFadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.enter{animation:kFadeUp var(--dur) var(--ease) both}
.stagger>*{animation:kFadeUp .45s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
</style>

const NS = 'kmrb:';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

/** Namespaced localStorage wrapper. Every key is prefixed with "kmrb:". */
const store = {
  get(k, d) {
    try {
      const v = localStorage.getItem(NS + k);
      return v == null ? d : JSON.parse(v);
    } catch {
      return d;
    }
  },
  set(k, v) {
    try {
      localStorage.setItem(NS + k, JSON.stringify(v));
    } catch {
      /* private mode or quota: the app keeps working in memory */
    }
  },
  remove(k) {
    try {
      localStorage.removeItem(NS + k);
    } catch {
      /* ignore */
    }
  },
  keys() {
    const out = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(NS)) out.push(k.slice(NS.length));
      }
    } catch {
      /* ignore */
    }
    return out;
  }
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const sum = arr => arr.reduce((a, b) => a + b, 0);
const mean = arr => (arr.length ? sum(arr) / arr.length : 0);

const ic = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;

/** Route-enter animation + staggered children for grids and lists. */
const animateIn = root => {
  if (!root) return;
  root.classList.remove('enter');
  void root.offsetWidth;
  root.classList.add('enter');
  const groups = root.querySelectorAll('.grid,.list,.kpis,.tiles,.bars,.monthgrid');
  groups.forEach(g => {
    g.classList.add('stagger');
    [...g.children].forEach((el, i) => el.style.setProperty('--i', Math.min(i, 14)));
  });
};

/** SVG line draw-in for every .series path inside root. */
const drawPaths = root => {
  if (!root) return;
  root.querySelectorAll('.series').forEach(p => {
    try {
      const len = p.getTotalLength();
      p.style.strokeDasharray = len;
      p.style.strokeDashoffset = len;
      p.getBoundingClientRect();
      p.style.transition = 'stroke-dashoffset .9s var(--ease)';
      p.style.strokeDashoffset = 0;
    } catch {
      /* detached node */
    }
  });
};

/** Animated number: eases from 0 to `to` inside el using fmt(). */
const countUp = (el, to, fmt = v => nf.format(Math.round(v)), dur = 650) => {
  if (!el) return;
  const t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(to * e);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
};

const nf = new Intl.NumberFormat('en-PK', { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat('en-PK', { maximumFractionDigits: 1 });
const rs = n => 'Rs ' + nf.format(Math.round(n));
const rsk = n => (Math.abs(n) >= 100000 ? 'Rs ' + nf1.format(n / 100000) + ' lakh' : rs(n));
const pct = n => (n > 0 ? '+' : '') + nf1.format(n) + '%';

const toast = (msg, type = '') => {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icon = type === 'ok' ? 'check-circle' : type === 'bad' ? 'alert-circle' : 'info';
  el.innerHTML = ic(icon) + '<span></span>';
  el.lastElementChild.textContent = msg;
  $('#toasts').append(el);
  setTimeout(() => el.classList.add('out'), 2800);
  setTimeout(() => el.remove(), 3200);
};

/** FNV-1a string hash → 32-bit unsigned. */
function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

/** Mulberry32 seeded PRNG → function returning [0,1). */
function rng(seed) {
  return () => {
    seed |= 0;
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Great-circle distance in km between {lat,lng} points. */
const haversine = (a, b) => {
  const R = 6371;
  const d = x => (x * Math.PI) / 180;
  const dLat = d(b.lat - a.lat);
  const dLng = d(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(d(a.lat)) * Math.cos(d(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
};

/** Download a string as a file (JSON / text exports). */
function downloadText(filename, text, mime = 'application/json') {
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.append(ta);
    ta.select();
    let ok = false;
    try {
      ok = document.execCommand('copy');
    } catch {
      ok = false;
    }
    ta.remove();
    return ok;
  }
}

const DAYS = 30;
const today = new Date();
today.setHours(0, 0, 0, 0);
const curMonth = today.getMonth();
const curYear = today.getFullYear();
const dayKey = d => d.toISOString().slice(0, 10);
const dateOf = i => {
  const d = new Date(today);
  d.setDate(d.getDate() - (DAYS - 1 - i));
  return d;
};
const inSeason = c => !c.season || c.season.includes(curMonth + 1);
const cache = new Map();

/** Target (fair) price of a commodity in a mandi before the random walk. */
const targetPrice = (cId, mId) => {
  const c = CM[cId];
  const m = MM[mId];
  return c.base * m.mult * ((m.over || {})[cId] ?? 1);
};

/** 30-day series for a commodity in a mandi. Deterministic for a given calendar day. */
function series(cId, mId) {
  const key = cId + '|' + mId;
  if (cache.has(key)) return cache.get(key);
  const c = CM[cId];
  const target = targetPrice(cId, mId);
  const r = rng(hash(key + '|' + dayKey(today)));
  let p = target * (.94 + r() * .12);
  const out = [];
  for (let i = 0; i < DAYS; i++) {
    const shock = (r() - .5) * 2 * c.vol;
    const revert = ((target - p) / target) * .08;
    p = p * (1 + shock + revert);
    out.push(Math.max(5, Math.round(p / 5) * 5));
  }
  cache.set(key, out);
  return out;
}

const todayPrice = (c, m) => series(c, m)[DAYS - 1];
const change = (arr, back) => ((arr[DAYS - 1] - arr[DAYS - 1 - back]) / arr[DAYS - 1 - back]) * 100;
function mandisFor(region) {
  return MANDIS.filter(m => region === 'all' || m.prov === region);
}

/** Cross-mandi summary of one commodity inside a region. */
function summary(c, region) {
  const ms = mandisFor(region);
  const rows = ms.map(m => ({ m, s: series(c.id, m.id) }));
  const prices = rows.map(r => r.s[DAYS - 1]);
  const avgSeries = Array.from({ length: DAYS }, (_, i) => mean(rows.map(r => r.s[i])));
  const mu = mean(avgSeries);
  const sd = Math.sqrt(mean(avgSeries.map(v => (v - mu) ** 2)));
  const min = Math.min(...prices);
  const max = Math.max(...prices);
  return {
    c,
    rows,
    avg: avgSeries[DAYS - 1],
    min,
    max,
    d1: change(avgSeries, 1),
    d7: change(avgSeries, 7),
    avgSeries,
    vol: (sd / mu) * 100,
    low: rows.find(r => r.s[DAYS - 1] === min).m,
    high: rows.find(r => r.s[DAYS - 1] === max).m
  };
}

// ---------- analytics engine: seasonal pattern, year-over-year, moving average, sell timing ----------
/** 12 monthly national-average prices for a commodity in a year. Deterministic per (commodity, year). */
function monthlySeries(cId, year) {
  const c = CM[cId];
  const level = YEAR_LEVEL[year] ?? 1;
  const r = rng(hash(cId + '|' + year));
  const natAvg = mean(MANDIS.map(m => c.base * m.mult * ((m.over || {})[cId] ?? 1)));
  return SEASONAL[cId].map(idx => {
    const noise = 1 + (r() - .5) * .06;
    return Math.round((natAvg * level * idx * noise) / 5) * 5;
  });
}
/** Index of the first month that is a projection (pattern only) for the given year. */
const projectedFrom = year => (year === curYear ? curMonth + 1 : 12);

function seasonalProfile(cId) {
  const idx = SEASONAL[cId];
  const hi = Math.max(...idx);
  const lo = Math.min(...idx);
  return { idx, best: idx.indexOf(hi), worst: idx.indexOf(lo), swing: (hi / lo - 1) * 100 };
}
function yoyChange(cId) {
  const now = monthlySeries(cId, curYear)[curMonth];
  const then = monthlySeries(cId, curYear - 1)[curMonth];
  return ((now - then) / then) * 100;
}
function movingAverage(arr, win) {
  return arr.map((_, i) => (i < win - 1 ? null : mean(arr.slice(i - win + 1, i + 1))));
}
function volatilityRanking(region) {
  return COMMODITIES.filter(inSeason)
    .map(c => summary(c, region))
    .sort((a, b) => b.vol - a.vol);
}
/** Months from now until the seasonal peak (0 = this month is the peak). */
function monthsToPeak(cId) {
  const { best } = seasonalProfile(cId);
  return (best - curMonth + 12) % 12;
}
/**
 * Sell-timing advice for a crop held in store. Combines the 7-day trend, the seasonal outlook
 * (how much higher the next peak is) and how long the crop can be kept.
 */
function sellTiming(cId, region = 'all') {
  const c = CM[cId];
  const s = summary(c, region);
  const toPeak = monthsToPeak(cId);
  const idx = SEASONAL[cId];
  const upside = (idx[(curMonth + toPeak) % 12] / idx[curMonth] - 1) * 100;
  const out = { upside, toPeak, d7: s.d7 };
  if (!inSeason(c)) return { ...out, key: 'st_off', tone: 'mid' };
  if (c.perish <= 10) return { ...out, key: 'st_perish', tone: 'bad' };
  if (s.d7 < -2 && upside < 5) return { ...out, key: 'st_sellnow', tone: 'bad' };
  if (toPeak > 0 && toPeak * 30 < c.perish && upside >= 5) return { ...out, key: 'st_hold', tone: 'ok' };
  if (s.d7 > 2) return { ...out, key: 'st_rising', tone: 'ok' };
  return { ...out, key: 'st_neutral', tone: 'mid' };
}

// ---------- SVG charts (hand-drawn, no library) ----------
function sparkline(arr, color) {
  const w = 110;
  const h = 34;
  const min = Math.min(...arr);
  const max = Math.max(...arr);
  const span = max - min || 1;
  const pts = arr.map((v, i) => [(i / (arr.length - 1)) * w, h - 3 - ((v - min) / span) * (h - 6)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d} L${w} ${h} L0 ${h}Z" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/></svg>`;
}

/** Path string for a series that may contain null gaps. */
function seriesPath(data, x, y) {
  let d = '';
  let pen = false;
  data.forEach((v, i) => {
    if (v == null) {
      pen = false;
      return;
    }
    d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1) + ' ';
    pen = true;
  });
  return d.trim();
}

/**
 * Multi-series line chart with hover tooltip.
 * seriesList: [{label, color, data:number[] (nulls allowed), dash?:boolean}]
 * opts.fmt formats values in tooltip (defaults to the unit-aware price formatter).
 */
function lineChart(el, seriesList, labels, opts = {}) {
  const W = 600;
  const H = 240;
  const P = { l: 56, r: 12, t: 12, b: 28 };
  const fmt = opts.fmt || fmtP;
  const scale = opts.scale ?? UNITS[state.unit];
  const all = seriesList.flatMap(s => s.data).filter(v => v != null);
  let min = Math.min(...all);
  let max = Math.max(...all);
  const pad = (max - min || max * .05) * .15;
  min -= pad;
  max += pad;
  const x = i => P.l + (i / (labels.length - 1)) * (W - P.l - P.r);
  const y = v => P.t + (1 - (v - min) / (max - min)) * (H - P.t - P.b);
  const grid = Array.from({ length: 5 }, (_, i) => min + ((max - min) * i) / 4);
  let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
  grid.forEach(g => {
    svg += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(g)}" y2="${y(g)}" style="stroke:var(--line)"/>`;
    svg += `<text x="${P.l - 8}" y="${y(g) + 4}" font-size="11" text-anchor="end" style="fill:var(--muted)">${nf.format(g * scale)}</text>`;
  });
  [0, Math.floor(labels.length / 2), labels.length - 1].forEach(i => {
    svg += `<text x="${x(i)}" y="${H - 8}" font-size="11" text-anchor="middle" style="fill:var(--muted)">${labels[i]}</text>`;
  });
  seriesList.forEach(s => {
    const dash = s.dash ? ' stroke-dasharray="6 5"' : '';
    svg += `<path class="series" d="${seriesPath(s.data, x, y)}" fill="none" stroke="${s.color}" stroke-width="${s.dash ? 2 : 2.5}" stroke-linejoin="round"${dash}/>`;
  });
  svg += `<line class="cursor" x1="0" x2="0" y1="${P.t}" y2="${H - P.b}" style="stroke:var(--soil);display:none" stroke-dasharray="3 3"/>`;
  seriesList.forEach((s, k) => {
    svg += `<circle class="dot" data-k="${k}" r="4" fill="${s.color}" stroke="#fff" stroke-width="2" style="display:none"/>`;
  });
  svg += '</svg><div class="tip"></div>';
  el.innerHTML = svg;
  drawPaths(el);
  bindLineHover(el, seriesList, labels, { W, H, P, x, y, fmt });
}

/** Hover / touch handling for lineChart: moves the cursor line, dots and tooltip to the nearest point. */
function bindLineHover(el, seriesList, labels, g) {
  const svgEl = $('svg', el);
  const tip = $('.tip', el);
  const cursor = $('.cursor', el);
  const dots = $$('.dot', el);
  const show = ev => {
    const rect = svgEl.getBoundingClientRect();
    const px = ((ev.clientX - rect.left) / rect.width) * g.W;
    const i = clamp(Math.round(((px - g.P.l) / (g.W - g.P.l - g.P.r)) * (labels.length - 1)), 0, labels.length - 1);
    cursor.setAttribute('x1', g.x(i));
    cursor.setAttribute('x2', g.x(i));
    cursor.style.display = '';
    const present = seriesList.map(s => s.data[i]).filter(v => v != null);
    dots.forEach((d, k) => {
      const v = seriesList[k].data[i];
      d.style.display = v == null ? 'none' : '';
      if (v == null) return;
      d.setAttribute('cx', g.x(i));
      d.setAttribute('cy', g.y(v));
    });
    tip.style.display = 'block';
    tip.style.left = (g.x(i) / g.W) * rect.width + 'px';
    tip.style.top = (g.y(Math.max(...present)) / g.H) * rect.height + 'px';
    const lines = seriesList
      .filter(s => s.data[i] != null)
      .map(s => `<span class="sw" style="background:${s.color}"></span>${esc(s.label)}: ${g.fmt(s.data[i])}`);
    tip.innerHTML = `<b>${labels[i]}</b><br>` + lines.join('<br>');
  };
  const hide = () => {
    tip.style.display = 'none';
    cursor.style.display = 'none';
    dots.forEach(d => (d.style.display = 'none'));
  };
  svgEl.addEventListener('mousemove', show);
  svgEl.addEventListener('touchmove', e => {
    show(e.touches[0]);
    e.preventDefault();
  }, { passive: false });
  svgEl.addEventListener('mouseleave', hide);
}

/**
 * Grouped vertical bar chart (e.g. this year vs last year per month).
 * groups: [{label, color, data:number[]}]; labels: category labels; opts.fade = index from which bars are drawn hatched (projection).
 */
function barChart(el, groups, labels, opts = {}) {
  const W = 600;
  const H = 240;
  const P = { l: 56, r: 12, t: 12, b: 28 };
  const fmt = opts.fmt || rs;
  const max = Math.max(...groups.flatMap(g => g.data)) * 1.1;
  const slot = (W - P.l - P.r) / labels.length;
  const bw = (slot * .7) / groups.length;
  const y = v => P.t + (1 - v / max) * (H - P.t - P.b);
  let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
  for (let i = 0; i <= 4; i++) {
    const g = (max * i) / 4;
    svg += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(g)}" y2="${y(g)}" style="stroke:var(--line)"/>`;
    svg += `<text x="${P.l - 8}" y="${y(g) + 4}" font-size="11" text-anchor="end" style="fill:var(--muted)">${nf.format(g)}</text>`;
  }
  labels.forEach((lb, i) => {
    const x0 = P.l + i * slot + slot * .15;
    groups.forEach((g, k) => {
      const v = g.data[i];
      const faded = opts.fade != null && i >= opts.fade && k === groups.length - 1;
      svg += `<rect class="vbar" data-i="${i}" x="${(x0 + k * bw).toFixed(1)}" y="${y(v).toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${(H - P.b - y(v)).toFixed(1)}" rx="2" fill="${g.color}" opacity="${faded ? .45 : 1}" style="animation-delay:${i * 30}ms"/>`;
    });
    svg += `<text x="${x0 + (slot * .7) / 2}" y="${H - 8}" font-size="10" text-anchor="middle" style="fill:var(--muted)">${lb}</text>`;
  });
  svg += '</svg><div class="tip"></div>';
  el.innerHTML = svg;
  const tip = $('.tip', el);
  const svgEl = $('svg', el);
  svgEl.addEventListener('mousemove', ev => {
    const rect = svgEl.getBoundingClientRect();
    const px = ((ev.clientX - rect.left) / rect.width) * W;
    const i = clamp(Math.floor((px - P.l) / slot), 0, labels.length - 1);
    tip.style.display = 'block';
    tip.style.left = ((P.l + i * slot + slot / 2) / W) * rect.width + 'px';
    tip.style.top = (y(Math.max(...groups.map(g => g.data[i]))) / H) * rect.height + 'px';
    tip.innerHTML = `<b>${labels[i]}</b><br>` + groups.map(g => `<span class="sw" style="background:${g.color}"></span>${esc(g.label)}: ${fmt(g.data[i])}`).join('<br>');
  });
  svgEl.addEventListener('mouseleave', () => (tip.style.display = 'none'));
}

/** Horizontal bar list. items: [{label, icon?, value, text, cls?}] — widths relative to the largest value. */

/** Add an inbox entry. `key` de-duplicates (e.g. one entry per alert per day). Returns true when created. */

  if (n.key && list.some(x => x.key === n.key)) return false;
  list.unshift({ id: uid(), ts: Date.now(), read: false, ...n });
  store.set('notifs', list.slice(0, NOTIF_MAX));
  return true;
}

/** Evaluate alerts, portfolio targets and big daily movers; create inbox entries once per day. */
function syncNotifications() {
  const day = dayKey(today);
  let created = 0;
  store.get('alerts', []).forEach(al => {
    const r = evalAlert(al);
    if (!r.hit) return;
    const where = al.m === 'any' ? t('al_any') : name(MM[al.m]);
    const title = `${name(CM[al.c])} ${t(al.cond === 'above' ? 'al_above' : 'al_below')} ${rs(al.price)}`;
    if (pushNotif({ key: `al:${al.id}:${day}`, type: 'alert', title, body: `${where} · ${t('al_now')}: ${rs(r.now)}`, link: '#alerts' })) created++;
  });
  store.get('portfolio', []).forEach(h => {
    if (!h.target) return;
    const v = holdingValue(h);
    if (v.value < h.target) return;
    const title = `${name(CM[h.c])}: ${t('pf_targetHit')}`;
    if (pushNotif({ key: `pf:${h.id}:${day}`, type: 'value', title, body: `${rs(v.value)} ≥ ${rs(h.target)}`, link: '#portfolio' })) created++;
  });
  const movers = COMMODITIES.filter(inSeason)
    .map(c => summary(c, 'all'))
    .filter(s => Math.abs(s.d1) >= 2.5)
    .sort((a, b) => Math.abs(b.d1) - Math.abs(a.d1))
    .slice(0, 2);
  movers.forEach(s => {
    const title = `${name(s.c)} ${pct(s.d1)} ${t('nf_today')}`;
    if (pushNotif({ key: `mv:${s.c.id}:${day}`, type: 'market', title, body: `${t('avg')}: ${fmtP(s.avg)}`, link: '#rates' })) created++;
  });
  if (pushNotif({ key: 'welcome', type: 'system', title: t('nf_welcome'), body: t('nf_welcome_b'), link: '#about' })) created++;
  updateBadges();
  return created;
}

const fieldHtml = (label, inner) => `<label class="f">${label}</label>${inner}`;
const emptyHtml = (icon, text) => `<div class="empty">${ic(icon)}<div>${text}</div></div>`;
const kpiHtml = (cls, k, v, s, icon = '') => `<div class="kpi ${cls}"><div class="k">${icon ? ic(icon) : ''}${t(k)}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;

/** Query parameters of the current hash, e.g. #map?c=wheat → {c:'wheat'}. */
function routeParams() {
  const q = location.hash.split('?')[1] || '';
  return Object.fromEntries(new URLSearchParams(q).entries());
}
const currentPage = () => (location.hash.slice(1) || 'rates').split('?')[0];

// ---------- rates board ----------
function visibleCommodities() {
  const q = state.q.trim().toLowerCase();
  const matches = c => !q || c.en.toLowerCase().includes(q) || c.ur.includes(q) || c.id.includes(q);
  let list = COMMODITIES.filter(c => (state.cat === 'all' || c.cat === state.cat) && matches(c));
  if (!settings.showOff) list = list.filter(inSeason);
  const sums = list.map(c => summary(c, state.region));
  const sorters = {
    name: (a, b) => name(a.c).localeCompare(name(b.c)),
    price: (a, b) => b.avg - a.avg,
    change: (a, b) => b.d7 - a.d7
  };
  const key = sorters[state.sort] || sorters.name;
  sums.sort((a, b) => inSeason(b.c) - inSeason(a.c) || key(a, b));
  return sums;
}

function ratesKpis(sums) {
  const live = sums.filter(s => inSeason(s.c));
  const gainer = [...live].sort((a, b) => b.d7 - a.d7)[0];
  const loser = [...live].sort((a, b) => a.d7 - b.d7)[0];
  const volat = [...live].sort((a, b) => b.vol - a.vol)[0];
  let html = '<div class="kpis">';
  if (gainer) html += kpiHtml('rise', 'kpi_gainer', esc(name(gainer.c)), pct(gainer.d7) + ' · ' + fmtP(gainer.avg), 'trending-up');
  if (loser) html += kpiHtml('fall', 'kpi_loser', esc(name(loser.c)), pct(loser.d7) + ' · ' + fmtP(loser.avg), 'trending-down');
  if (volat) html += kpiHtml('', 'kpi_volatile', esc(name(volat.c)), '±' + nf1.format(volat.vol) + '% · 30d', 'activity');
  html += kpiHtml('', 'kpi_updated', t('today'), lastSyncLabel(), 'refresh');
  return html + '</div>';
}

function rateCard(s) {
  const off = !inSeason(s.c);
  const sub = t('cat_' + s.c.cat) + (off ? ` · <span class="badge">${t('offseason')}</span>` : '');
  const body = off
    ? `<div class="price muted" style="font-size:1rem;margin-top:14px">${t('offseason')}</div>`

function rateRow(s) {
  if (!inSeason(s.c)) {
    return `<tr class="click dim" data-c="${s.c.id}"><td><b>${esc(name(s.c))}</b> <span class="badge">${t('offseason')}</span></td><td colspan="6" class="muted">—</td></tr>`;

function ratesTable(sums) {

function renderRates() {
  const sums = visibleCommodities();
  let html = ratesKpis(sums);
  html += `<div class="toolbar"><span class="count">${sums.length} ${t('commodities')} · ${mandisFor(state.region).length} ${t('mandis')} · ${unitLabel()}</span><span class="spacer"></span>

/** Chart of the selected mandis plus an optional dashed moving-average overlay of the first one. */

  const sel = drawerSel.map((id, i) => ({ label: name(MM[id]), color: colors[i], data: series(cId, id) }));

  }

function bindDrawer(cId) {
  $$('#mChips .chip').forEach(ch => (ch.onclick = () => {
    const id = ch.dataset.m;
    if (drawerSel.includes(id)) drawerSel = drawerSel.filter(x => x !== id);
    else {

      drawerSel.push(id);
    }
    $$('#mChips .chip').forEach(x => x.classList.toggle('on', drawerSel.includes(x.dataset.m)));
    drawDrawerChart(cId);
  }));
  $('#maToggle').onclick = () => {
    store.set('ma', !store.get('ma', true));

/** Net revenue per mandi: gross − transport (trips × km × rate) − commission − fees. */
function advisorRows(p) {
  const c = CM[p.c];
  const from = DISTRICTS.find(d => d.id === p.loc);
  const v = VEHICLES.find(x => x.id === p.veh);
  const trips = Math.ceil((p.qty * 40) / v.cap);
  const rows = MANDIS.map(m => {
    const km = haversine(from, m) * 1.25;
    const s = series(c.id, m.id);
    const price = s[DAYS - 1];
    const gross = price * p.qty;
    const transport = km < 8 ? 0 : trips * km * v.rate;
    const deduct = (gross * p.comm) / 100 + p.fees * p.qty;
    return { m, km, price, gross, transport, deduct, net: gross - transport - deduct, d7: change(s, 7) };
  });
  return { trips, rows: rows.filter(r => r.km <= p.maxd).sort((a, b) => b.net - a.net) };
}

function advisorBest(best, nearest, p, trips) {
  const trend = best.d7 > 2 ? 'rising' : best.d7 < -2 ? 'falling' : 'stable';
  const hintKey = trend === 'rising' ? 'a_hint_rise' : trend === 'falling' ? 'a_hint_fall' : 'a_hint_stable';
  const diff = best.net - nearest.net;
  const topBuyer = allBuyers().filter(b => b.m === best.m.id && b.cs.includes(p.c)).sort((a, b) => b.rating - a.rating)[0];
  const buyerHtml = topBuyer ? `<div class="row mt"><span>${ic('users')} <b>${esc(name(topBuyer))}</b> · ${t('by_' + topBuyer.type)} · ${starsHtml(topBuyer.rating)}</span><a class="btn ghost sm" href="#buyers?m=${best.m.id}&c=${p.c}">${t('a_buyers')}</a></div>` : '';
  const cell = (k, v, extra = '') => `<div><div class="muted tiny">${k}</div><b>${v}</b> ${extra}</div>`;
  return `<div class="panel leafy">
    <div class="muted b tiny" style="text-transform:uppercase;letter-spacing:.08em">${t('a_best')}</div>
    <h2 style="font-size:1.5rem;margin:4px 0">${esc(name(best.m))} <span class="muted" style="font-size:.9rem;font-weight:600">· ${nf.format(best.km)} km · ${trips} ${t('a_trips')}</span></h2>
    <div class="bigstat" style="color:var(--leaf)"><span id="aNet">${rs(best.net)}</span> <span class="muted" style="font-size:.95rem;font-weight:600">${t('a_net')} · ${rs(best.net / p.qty)} ${t('a_netPer')}</span></div>
    <div class="cols mt">
      ${cell(t('a_gross'), rs(best.gross), `<span class="muted">(${rs(best.price)}/40kg)</span>`)}
      ${cell(t('a_transport'), '− ' + rs(best.transport))}
      ${cell(t('a_deduct'), '− ' + rs(best.deduct))}
      ${cell(`${t('a_vsNearest')} (${esc(name(nearest.m))})`, `<span style="color:${diff > 0 ? 'var(--rise)' : 'var(--muted)'}">${diff > 0 ? '+' : ''}${rs(diff)}</span>`)}
    </div>
    <div class="note mt"><b>${t('a_trend')}: ${t(trend)} (${pct(best.d7)})</b> — ${t(hintKey)}</div>
    ${buyerHtml}
  </div>`;
}

function advisorTable(rows, p) {
  const head = ['a_rank', 'col_mandi', 'a_dist', 'col_price', 'a_transport', 'a_deduct', 'a_net'].map((k, i) => `<th class="${i > 1 ? 'num' : ''}">${t(k)}</th>`).join('');
  const perMaund = t('a_netPer').replace(/^(per|فی) /, '');
  const body = rows.map((r, i) => `<tr class="${i === 0 ? 'best' : ''}">
      <td>${i + 1}</td>
      <td><b>${esc(name(r.m))}</b><br><span class="muted tiny">${t(r.m.prov)} · ${deltaHtml(r.d7)}</span></td>
      <td class="num">${nf.format(r.km)} km</td>
      <td class="num">${rs(r.price)}</td>
      <td class="num">${rs(r.transport)}</td>
      <td class="num">${rs(r.deduct)}</td>
      <td class="num"><b>${rs(r.net)}</b><br><span class="muted tiny">${rs(r.net / p.qty)}/${perMaund}</span></td>
    </tr>`).join('');
  return `<div class="tablewrap mt"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function renderAdvisor() {
  const a = Object.assign({}, ADVISOR_DEFAULT, store.get('advisor', {}));
  const params = routeParams();
  if (params.c && CM[params.c] && inSeason(CM[params.c])) a.c = params.c;
  view.innerHTML = `<div class="two">${advisorForm(a)}<div id="aOut"></div></div>`;

      out.innerHTML = `<div class="warn">${t('a_none')}</div>`;

    }
    const best = rows[0];
    const nearest = [...rows].sort((a, b) => a.km - b.km)[0];
    out.innerHTML = advisorBest(best, nearest, p, trips) + advisorTable(rows, p);
    countUp($('#aNet'), best.net, v => rs(v));

// ---------- cost-of-production & profit calculator ----------
function calcDefaults(cId) {
  const prof = COST_PROFILES[cId] || COST_PROFILES.wheat;
  const costs = Object.fromEntries(COST_ITEMS.map(([k]) => [k, prof[k]]));
  return { c: cId, acres: 5, costs, yield: prof.yield, fy: 100, fp: 100, fc: 100 };
}
function calcLoad() {
  const params = routeParams();
  const saved = store.get('calc');
  if (params.c && CM[params.c] && (!saved || saved.c !== params.c)) return calcDefaults(params.c);
  if (saved && CM[saved.c]) return Object.assign(calcDefaults(saved.c), saved);
  return calcDefaults('wheat');
}

/** Break-even, revenue and profit for one configuration. Factors fy/fp/fc are the sensitivity sliders (100 = as entered). */
function calcCompute(cfg, region) {
  const c = CM[cfg.c];
  const costPerAcre = (sum(COST_ITEMS.map(([k]) => +cfg.costs[k] || 0)) * cfg.fc) / 100;
  const yieldPerAcre = (cfg.yield * cfg.fy) / 100;
  const totalCost = costPerAcre * cfg.acres;
  const totalYield = yieldPerAcre * cfg.acres;
  const breakEven = yieldPerAcre ? costPerAcre / yieldPerAcre : 0;
  const s = summary(c, region);
  const avgPrice = (s.avg * cfg.fp) / 100;
  const bestPrice = (s.max * cfg.fp) / 100;
  const revenueAvg = totalYield * avgPrice;
  const revenueBest = totalYield * bestPrice;
  return {
    c, s, costPerAcre, yieldPerAcre, totalCost, totalYield, breakEven, avgPrice, bestPrice,
    bestMandi: s.high, revenueAvg, revenueBest,
    profitAvg: revenueAvg - totalCost,
    profitBest: revenueBest - totalCost,
    marginAvg: revenueAvg ? ((revenueAvg - totalCost) / revenueAvg) * 100 : 0
  };
}

function calcVerdict(res) {

  return `<div class="verdict bad">${ic('trending-down')}<span>${t('cc_v_bad').replace('{p}', rs(res.breakEven - res.avgPrice))}</span></div>`;
}

function calcBreakdown(cfg) {
  const items = COST_ITEMS.map(([k, label, icon]) => ({ label: t(label), icon, value: +cfg.costs[k] || 0 }));

// ---------- schematic mandi map ----------
const MAP_W = 612;
const MAP_H = 588;
const project = (lng, lat) => [(lng - 60.5) * 36, (37.5 - lat) * 42];
const ringPath = ring => ring.map(([lng, lat], i) => (i ? 'L' : 'M') + project(lng, lat).map(v => v.toFixed(1)).join(' ')).join(' ') + 'Z';
const MAP_LABEL_SIDE = { sahiwal: 'left', multan: 'left', dgk: 'left', sargodha: 'left', peshawar: 'left', faisalabad: 'top', karachi: 'bottom' };

/** Colour for price index (price ÷ national average): leaf = cheap, wheat = average, red = dear. */
function indexColor(idx) {
  const stops = [[.92, [31, 122, 58]], [1, [224, 165, 38]], [1.08, [178, 58, 47]]];
  const v = clamp(idx, .92, 1.08);
  const [a, b] = v <= 1 ? [stops[0], stops[1]] : [stops[1], stops[2]];
  const f = (v - a[0]) / (b[0] - a[0]);
  const rgb = a[1].map((x, i) => Math.round(x + (b[1][i] - x) * f));
  return `rgb(${rgb.join(',')})`;
}

function mapDot(m, cId, avg, off) {
  const price = todayPrice(cId, m.id);
  const idx = price / avg;
  const [x, y] = project(m.lng, m.lat);
  const r = (6 + clamp((idx - 1) * 60, -2.5, 5)).toFixed(1);
  const side = MAP_LABEL_SIDE[m.id] || 'right';
  const short = esc(name(m).replace(/ \(.*\)/, ''));
  const pos = { right: [x + 11, y + 4, 'start'], left: [x - 11, y + 4, 'end'], top: [x, y - 11, 'middle'], bottom: [x, y + 19, 'middle'] }[side];
  return `<circle class="mdot ${off ? 'off' : ''}" data-m="${m.id}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${indexColor(idx)}" tabindex="0" role="button" aria-label="${short} ${rs(price)}"/>
    <text class="mlabel" x="${pos[0].toFixed(1)}" y="${pos[1].toFixed(1)}" text-anchor="${pos[2]}">${short}</text>`;
}

function mapSvg(cId, hot) {
  const avg = nationalAvg(cId);
  const off = !inSeason(CM[cId]);
  let svg = `<svg viewBox="-12 -12 ${MAP_W + 24} ${MAP_H + 24}" role="img" aria-label="${t('mp_aria')}">`;
  PROVINCES.forEach(p => {
    svg += `<path class="prov ${p.north ? 'north' : ''} ${hot === p.id ? 'hot' : ''}" d="${ringPath(p.ring)}"/>`;
  });
  PROVINCES.forEach(p => {
    const [x, y] = project(p.label[0], p.label[1]);
    svg += `<text class="plabel" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle">${p.north ? t('mp_north') : t(p.id)}</text>`;
  });
  MANDIS.forEach(m => (svg += mapDot(m, cId, avg, off)));
  return svg + '</svg><div class="tip"></div>';
}

function mapSide(cId) {
  const avg = nationalAvg(cId);
  const rows = MANDIS.map(m => ({ m, p: todayPrice(cId, m.id) })).sort((a, b) => a.p - b.p);
  const line = r => `<div class="row click" data-m="${r.m.id}"><span><span class="sw" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${indexColor(r.p / avg)};margin-right:6px"></span><b>${esc(name(r.m))}</b> <span class="muted tiny">${t(r.m.prov)}</span></span><span><b>${fmtP(r.p)}</b> <span class="muted tiny">${pct((r.p / avg - 1) * 100)}</span></span></div>`;
  const provs = REGIONS.slice(1).map(pv => ({ pv, avg: mean(mandisFor(pv).map(m => todayPrice(cId, m.id))) })).sort((a, b) => a.avg - b.avg);
  return `<div class="panel">
    <div class="sect">${ic('trending-down')}${t('mp_cheapest')}</div><div class="list">${rows.slice(0, 3).map(line).join('')}</div>
    <div class="sect">${ic('trending-up')}${t('mp_dearest')}</div><div class="list">${rows.slice(-3).reverse().map(line).join('')}</div>
    <div class="sect">${ic('map')}${t('mp_byProvince')}</div>
    <div class="tablewrap"><table class="compact"><tbody>${provs.map(p => `<tr><td>${t(p.pv)}</td><td class="num"><b>${fmtP(p.avg)}</b></td><td class="num">${pct((p.avg / avg - 1) * 100)}</td></tr>`).join('')}</tbody></table></div>
    <div class="muted tiny mt">${t('mp_natAvg')}: <b>${fmtP(avg)}</b> · ${t('mp_disclaimer')}</div>
  </div>`;
}

function bindMap(cId) {
  const wrap = $('#mapWrap');
  const tip = $('.tip', wrap);
  const svg = $('svg', wrap);
  const avg = nationalAvg(cId);
  const showTip = dot => {
    const m = MM[dot.dataset.m];
    const price = todayPrice(cId, m.id);
    const rect = svg.getBoundingClientRect();
    const box = wrap.getBoundingClientRect();
    const [x, y] = project(m.lng, m.lat);
    tip.style.display = 'block';
    tip.style.left = rect.left - box.left + ((x + 12) / (MAP_W + 24)) * rect.width + 'px';
    tip.style.top = rect.top - box.top + ((y + 12) / (MAP_H + 24)) * rect.height - 6 + 'px';
    tip.innerHTML = `<b>${esc(name(m))}</b><br>${fmtP(price)} · ${pct((price / avg - 1) * 100)} ${t('mp_vsAvg')}`;
  };
  $$('.mdot', wrap).forEach(dot => {
    dot.addEventListener('mouseenter', () => showTip(dot));
    dot.addEventListener('focus', () => showTip(dot));
    dot.addEventListener('mouseleave', () => (tip.style.display = 'none'));
    dot.addEventListener('blur', () => (tip.style.display = 'none'));
    dot.addEventListener('click', () => openDrawer(cId, dot.dataset.m));
    dot.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') openDrawer(cId, dot.dataset.m);
    });
  });
  $$('.row[data-m]', view).forEach(r => (r.onclick = () => openDrawer(cId, r.dataset.m)));
  $('#mpC').onchange = () => {
    location.hash = 'map?c=' + $('#mpC').value;
  };
}

// ---------- farmer's store / portfolio ----------
const holdings = () => store.get('portfolio', []);

/** Current value of a holding: qty × today's price at the chosen mandi (or the best mandi when m = 'best'). */
function holdingValue(h) {
  const rows = MANDIS.map(m => ({ m, s: series(h.c, m.id) }));
  const byPrice = [...rows].sort((a, b) => b.s[DAYS - 1] - a.s[DAYS - 1]);
  const pick = h.m === 'best' ? byPrice[0] : rows.find(r => r.m.id === h.m) || byPrice[0];
  const price = pick.s[DAYS - 1];
  const value = price * h.qty;
  const cost = h.cost ? h.cost * h.qty : null;
  return {
    price,
    value,
    d1: (price - pick.s[DAYS - 2]) * h.qty,
    d7: (price - pick.s[DAYS - 8]) * h.qty,
    mandi: pick.m,
    cost,
    gain: cost != null ? value - cost : null
  };
}

function portfolioKpis(list) {
  const vals = list.map(holdingValue);
  const total = sum(vals.map(v => v.value));
  const d1 = sum(vals.map(v => v.d1));
  const d7 = sum(vals.map(v => v.d7));
  const qty = sum(list.map(h => +h.qty));
  const withCost = vals.filter(v => v.gain != null);
  const gain = sum(withCost.map(v => v.gain));
  const d1pct = total - d1 ? (d1 / (total - d1)) * 100 : 0;
  const d7pct = total - d7 ? (d7 / (total - d7)) * 100 : 0;
  return `<div class="kpis">
    ${kpiHtml('wheat', 'pf_total', `<span id="pfTotal">${rsk(total)}</span>`, `${list.length} ${t('pf_holdings')} · ${nf.format(qty)} ${t('pf_maunds')}`, 'wallet')}
    ${kpiHtml(d1 >= 0 ? 'rise' : 'fall', 'pf_d1', (d1 >= 0 ? '+' : '') + rsk(d1), pct(d1pct), d1 >= 0 ? 'trending-up' : 'trending-down')}
    ${kpiHtml(d7 >= 0 ? 'rise' : 'fall', 'pf_d7', (d7 >= 0 ? '+' : '') + rsk(d7), pct(d7pct), 'calendar')}
    ${kpiHtml(gain >= 0 ? 'rise' : 'fall', 'pf_gain', withCost.length ? (gain >= 0 ? '+' : '') + rsk(gain) : '—', withCost.length ? `${withCost.length} ${t('pf_withCost')}` : t('pf_noCost'), 'coins')}

function filteredBuyers(f) {

// ---------- SMS rate sheet + printable daily sheet ----------
function sheetConfig() {
  const def = { cs: COMMODITIES.filter(inSeason).slice(0, 8).map(c => c.id), ms: settings.sheetMandis, mode: 'mandi' };
  return Object.assign(def, store.get('sheet', {}));
}

/** Plain-text rate sheet sized for SMS: one line per commodity, 3-letter mandi codes, Rs per 40 kg. */
function smsText(cfg) {
  const date = today.toLocaleDateString(lang === 'ur' ? 'ur-PK' : 'en-PK', { day: 'numeric', month: 'short' });
  const lines = [`${t('sh_header')} ${date} (Rs/40kg)`];
  cfg.cs.filter(id => CM[id]).forEach(id => {
    const c = CM[id];
    if (!inSeason(c)) return;
    if (cfg.mode === 'avg') {
      const s = summary(c, 'all');
      lines.push(`${name(c).replace(/ \(.*\)/, '')} ${nf.format(s.avg)} ${pct(s.d1)}`);
      return;
    }
    const parts = cfg.ms.filter(m => MM[m]).map(m => `${lang === 'ur' ? name(MM[m]).replace(/ \(.*\)/, '') : MANDI_CODES[m]} ${nf.format(todayPrice(id, m))}`);
    lines.push(`${name(c).replace(/ \(.*\)/, '')}: ${parts.join(', ')}`);
  });
  lines.push(t('sh_footer'));
  return lines.join('\n');
}
function smsParts(text) {
  const unicode = /[^\u0000-\u007f]/.test(text);
  const per = unicode ? 70 : 160;
  return { chars: text.length, parts: Math.max(1, Math.ceil(text.length / per)), per };
}

function printTable(cfg) {
  const ms = cfg.ms.filter(m => MM[m]);
  const head = ms.map(m => `<th class="num">${esc(name(MM[m]).replace(/ \(.*\)/, ''))}</th>`).join('');
  const body = cfg.cs.filter(id => CM[id]).map(id => {
    const c = CM[id];
    if (!inSeason(c)) return `<tr class="dim"><td>${esc(name(c))}</td><td colspan="${ms.length + 2}" class="muted">${t('offseason')}</td></tr>`;
    const s = summary(c, 'all');
    return `<tr><td><b>${esc(name(c))}</b></td>${ms.map(m => `<td class="num">${nf.format(todayPrice(id, m))}</td>`).join('')}<td class="num">${nf.format(s.avg)}</td><td class="num">${pct(s.d1)}</td></tr>`;
  }).join('');
  const dateText = today.toLocaleDateString(lang === 'ur' ? 'ur-PK' : 'en-PK', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  return `<div class="printsheet" id="printSheet">
    <div class="flex" style="justify-content:space-between"><h2>${t('sh_printTitle')}</h2><span class="small">${dateText}</span></div>
    <div class="small" style="margin:4px 0 10px;color:#6a5a4a">${t('sh_unitNote')}</div>
    <div class="tablewrap"><table class="compact"><thead><tr><th>${t('col_commodity')}</th>${head}<th class="num">${t('col_avg')}</th><th class="num">${t('col_d1')}</th></tr></thead><tbody>${body}</tbody></table></div>
    <div class="foot">${t('sh_printFoot')}</div>
  </div>`;
}

function sheetForm(cfg) {
  const cChips = COMMODITIES.map(c => `<button class="chip ${cfg.cs.includes(c.id) ? 'on' : ''} ${inSeason(c) ? '' : 'off'}" data-sc="${c.id}">${esc(name(c))}</button>`).join('');
  const mChips = MANDIS.map(m => `<button class="chip wheat ${cfg.ms.includes(m.id) ? 'on' : ''}" data-sm="${m.id}">${esc(name(m).replace(/ \(.*\)/, ''))}</button>`).join('');

    <label class="f">${t('commodities')}</label><div class="chips">${cChips}</div>
    <label class="f">${t('mandis')} <span class="muted">(${t('sh_max4')})</span></label><div class="chips">${mChips}</div>
    <label class="f">${t('sh_output')}</label><textarea id="shOut" class="mono" readonly></textarea>
    <div class="smsmeta" id="shMeta"></div>
    <div class="flex mt"><button class="btn wheat" id="shCopy">${ic('copy')} ${t('copy')}</button><a class="btn ghost" id="shSms" href="#">${ic('send')} ${t('sh_openSms')}</a><button class="btn ghost" id="shShare">${ic('share')} ${t('share')}</button></div>
    <!-- TODO(student): deliver this sheet automatically through an SMS gateway / WhatsApp Business API and offer an IVR or USSD menu for feature phones. -->
  </div>`;
}

function renderSheet() {
  const cfg = sheetConfig();
  view.innerHTML = `<div class="two">${sheetForm(cfg)}<div><div class="flex no-print mb" style="justify-content:space-between"><div class="sect" style="margin:0">${ic('printer')}${t('sh_printTitle')}</div><button class="btn ghost sm" id="shPrint">${ic('printer')} ${t('print')}</button></div><div id="shPrintWrap">${printTable(cfg)}</div></div></div>`;
  const update = () => {
    store.set('sheet', cfg);
    const text = smsText(cfg);
    const meta = smsParts(text);
    $('#shOut').value = text;
    $('#shMeta').innerHTML = `<span>${ic('hash')} ${meta.chars} ${t('sh_chars')}</span><span>${ic('message')} ${meta.parts} ${t('sh_parts')} (${meta.per}/${t('sh_part')})</span>`;
    $('#shSms').href = 'sms:?body=' + encodeURIComponent(text);
    $('#shPrintWrap').innerHTML = printTable(cfg);
  };
  $$('[data-sc]').forEach(ch => (ch.onclick = () => {
    cfg.cs = cfg.cs.includes(ch.dataset.sc) ? cfg.cs.filter(x => x !== ch.dataset.sc) : [...cfg.cs, ch.dataset.sc];
    ch.classList.toggle('on');
    update();
  }));
  $$('[data-sm]').forEach(ch => (ch.onclick = () => {
    if (cfg.ms.includes(ch.dataset.sm)) cfg.ms = cfg.ms.filter(x => x !== ch.dataset.sm);
    else if (cfg.ms.length < 4) cfg.ms.push(ch.dataset.sm);
    else {
      toast(t('sh_max4'), 'bad');
      return;
    }
    ch.classList.toggle('on', cfg.ms.includes(ch.dataset.sm));
    update();
  }));
  $$('#shMode button').forEach(b => (b.onclick = () => {
    cfg.mode = b.dataset.mode;
    $$('#shMode button').forEach(x => x.classList.toggle('on', x === b));
    update();
  }));
  $('#shCopy').onclick = async () => toast((await copyText($('#shOut').value)) ? t('copied') : t('copyFail'), 'ok');
  $('#shShare').onclick = async () => {
    if (!navigator.share) {
      toast(t('shareNA'), 'bad');
      return;
    }
    try {
      await navigator.share({ title: t('sh_header'), text: $('#shOut').value });
    } catch {
      /* user cancelled */
    }
  };
  $('#shPrint').onclick = () => window.print();
  update();
}

// ---------- alerts ----------
function evalAlert(al) {
  const c = CM[al.c];
  if (!c || !inSeason(c)) return { hit: false, now: null };
  const ms = al.m === 'any' ? MANDIS : [MM[al.m]].filter(Boolean);
  const prices = ms.map(m => todayPrice(al.c, m.id));
  const now = al.cond === 'above' ? Math.max(...prices) : Math.min(...prices);
  return { hit: al.cond === 'above' ? now >= al.price : now <= al.price, now };
}

function checkAlertsOnLoad() {
  const hits = store.get('alerts', []).filter(a => evalAlert(a).hit).length;
  if (hits && settings.toastOnLoad) toast(`${hits} ${t('al_hit')}`, 'ok');
  // TODO(student): deliver alerts by SMS/WhatsApp/push. Requires a backend + a scheduler that evaluates alerts daily when the farmer is offline.
}

function alertRow(a) {
  const r = evalAlert(a);
  const where = a.m === 'any' ? t('al_any') : esc(name(MM[a.m]));
  const status = r.hit ? ic('check') + ' ' + t('al_triggered') : t('al_waiting');
  return `<div class="row ${r.hit ? 'hit' : ''}">
    <div><b>${esc(name(CM[a.c]))}</b> · ${where}<br><span class="muted small">${t(a.cond === 'above' ? 'al_above' : 'al_below')} <b>${rs(a.price)}</b> · ${t('al_now')}: ${r.now == null ? t('offseason') : rs(r.now)}</span></div>
    <div class="flex" style="flex:none"><span class="delta ${r.hit ? 'up' : 'flat'}">${status}</span><button class="btn danger sm" data-del="${a.id}" aria-label="${t('delete')}">${ic('trash')} ${t('delete')}</button></div>
  </div>`;

function storageUsage() {
  let bytes = 0;
  const keys = store.keys();
  keys.forEach(k => {
    try {
      bytes += (localStorage.getItem(NS + k) || '').length * 2;
    } catch {
      /* ignore */
    }
  });
  return { keys: keys.length, kb: bytes / 1024 };
}
function exportAll() {
  const data = Object.fromEntries(store.keys().map(k => [k, store.get(k)]));
  const payload = { app: 'kisan-mandi-rate-board', version: 2, exported: new Date().toISOString(), data };
  downloadText(`kisan-mandi-${dayKey(today)}.json`, JSON.stringify(payload, null, 2));
  toast(t('st_exported'), 'ok');
}
function importAll(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const data = parsed && parsed.app === 'kisan-mandi-rate-board' ? parsed.data : parsed;
      if (!data || typeof data !== 'object') throw new Error('bad');
      Object.entries(data).forEach(([k, v]) => store.set(k, v));
      toast(t('st_imported'), 'ok');
      setTimeout(() => location.reload(), 600);
    } catch {
      toast(t('st_importBad'), 'bad');
    }
  };
  reader.readAsText(file);
}
function resetAll() {
  store.keys().forEach(k => store.remove(k));
  location.hash = 'rates';
  location.reload();
}

// ---------- onboarding tour (spotlight steps) ----------
const TOUR_STEPS = [
  { sel: ['#langBtn'], k: 'tr_lang' },
  { sel: ['#topnav a[href="#rates"]', '#bottomnav a[href="#rates"]'], k: 'tr_rates' },
  { sel: ['#catChips', '#filterBtn'], k: 'tr_filters' },
  { sel: ['.kpis'], k: 'tr_kpis' },
  { sel: ['.card', '.tablewrap'], k: 'tr_card' },
  { sel: ['#topnav a[href="#advisor"]', '#bottomnav a[href="#advisor"]'], k: 'tr_advisor' },
  { sel: ['#topnav a[href="#calculator"]', '#bottomnav a[href="#map"]'], k: 'tr_calc' },
  { sel: ['#bellBtn'], k: 'tr_inbox' },
  { sel: ['#moreBtn', '#moreMobile'], k: 'tr_more' },
];
let tourI = 0;

/** First selector whose element is actually on screen (sidebar is off-screen on mobile, topnav hidden, etc.). */
function visibleEl(sels) {
  for (const s of sels) {
    const el = $(s);
    if (!el) continue;
    const r = el.getBoundingClientRect();
    const onScreen = r.width > 0 && r.height > 0 && r.left < window.innerWidth && r.right > 0;
    if (onScreen && getComputedStyle(el).visibility !== 'hidden') return el;
  }
  return null;
}
function startTour() {
  if (currentPage() !== 'rates') location.hash = 'rates';
  tourI = 0;
  document.body.classList.add('tour-on');
  setTimeout(showTourStep, 60);
}
function endTour() {
  document.body.classList.remove('tour-on');
  store.set('tourDone', true);
}
function showTourStep() {
  const step = TOUR_STEPS[tourI];
  if (!step) {
    endTour();
    return;
  }
  const el = visibleEl(step.sel);
  if (!el) {
    tourI++;
    showTourStep();
    return;
  }
  el.scrollIntoView({ block: 'center' });
  setTimeout(() => positionTour(el, step), 80);
}
function positionTour(el, step) {
  const r = el.getBoundingClientRect();
  const pad = 6;
  Object.assign($('#tourSpot').style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + pad * 2 + 'px', height: r.height + pad * 2 + 'px' });
  const card = $('#tourCard');
  const last = tourI === TOUR_STEPS.length - 1;
  card.innerHTML = `<h3>${ic('lightbulb')}${t(step.k)}</h3><p>${t(step.k + '_b')}</p>
    <div class="actions"><div class="steps">${TOUR_STEPS.map((_, i) => `<i class="${i === tourI ? 'on' : ''}"></i>`).join('')}</div>
      <button class="btn ghost sm" id="trSkip">${t('tr_skip')}</button>
      ${tourI ? `<button class="btn ghost sm" id="trBack" aria-label="${t('tr_back')}">${ic('chevron-left')}</button>` : ''}
      <button class="btn wheat sm" id="trNext">${last ? t('tr_done') : t('tr_next')} ${last ? ic('check') : ic('chevron-right')}</button></div>`;
  const cw = Math.min(340, window.innerWidth - 32);
  const ch = card.offsetHeight || 170;
  let top = r.bottom + 14;
  if (top + ch > window.innerHeight - 16) top = r.top - ch - 14;
  top = clamp(top, 16, Math.max(16, window.innerHeight - ch - 16));
  const left = clamp(r.left + r.width / 2 - cw / 2, 16, window.innerWidth - cw - 16);
  card.style.top = top + 'px';
  card.style.left = left + 'px';
  $('#trSkip').onclick = endTour;
  $('#trNext').onclick = () => {
    tourI++;
    showTourStep();
  };
  const back = $('#trBack');
  if (back) back.onclick = () => {
    tourI--;
    showTourStep();
  };
}
window.addEventListener('resize', () => {
  if (document.body.classList.contains('tour-on')) showTourStep();
});
