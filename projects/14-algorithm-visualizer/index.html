<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Algorithm Visualizer</title>
<meta name="description" content="Offline, single-file visual lab for sorting, pathfinding, graph and data-structure algorithms. Every algorithm is a JavaScript generator; a generic player records steps so you can scrub, step back and race two algorithms. FYP template.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens: IDE purple-black + syntax palette ---------- */
:root{
  --bg:#13111c; --panel:#1b1826; --panel-2:#221e30; --panel-3:#2a2640; --line:#2a2640; --line-2:#3a3554;
  --ink:#e0def4; --muted:#908caa; --dim:#6e6a86; --bar:#5b5775;
  --cmp:#f6c177; --swp:#eb6f92; --srt:#9ccfd8; --piv:#c4a7e7; --vis:#31748f; --pth:#f6c177; --fro:#9ccfd8;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Fira Code",ui-monospace,Menlo,Consolas,monospace;
  --radius:12px; --radius-sm:8px; --ease:cubic-bezier(.2,.8,.2,1); --dur:.35s;
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(246,193,119,.6)}100%{box-shadow:0 0 0 10px rgba(246,193,119,0)}}
.enter{animation:fadeUp var(--dur) var(--ease) both}
.stagger>*{animation:fadeUp .45s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.btn{transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s,border-color .15s}
.btn:hover{transform:translateY(-1px)} .btn:active{transform:translateY(0) scale(.98)}
.card,.tile{transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s}
.card:hover{transform:translateY(-2px);border-color:var(--line-2)}
.fill,.bar>i{transition:width .6s var(--ease)}
.skeleton{background:linear-gradient(90deg,var(--panel-2) 25%,var(--panel) 50%,var(--panel-2) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.01em}
a{color:var(--srt)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
:focus-visible{outline:2px solid var(--piv);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:8px} ::-webkit-scrollbar-track{background:transparent}

/* ---------- App frame ---------- */
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:0 16px;height:56px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;min-width:0}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--piv),var(--srt));display:grid;place-items:center;color:#13111c;flex:none}
.brand .logo svg{width:20px;height:20px;stroke:#13111c;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.brand h1{font-size:.98rem;font-weight:800;white-space:nowrap}
.brand small{display:block;font-size:.7rem;color:var(--muted);font-weight:600;letter-spacing:.04em}
.tabs{display:flex;gap:2px;position:relative;margin-left:10px;height:56px;align-items:stretch}
.tabs a{display:flex;align-items:center;gap:7px;padding:0 13px;color:var(--muted);text-decoration:none;font-weight:700;font-size:.88rem;white-space:nowrap;transition:color .2s}
.tabs a:hover{color:var(--ink)} .tabs a.active{color:var(--ink)}
.tabs .inkbar{position:absolute;bottom:-1px;height:2px;background:var(--piv);border-radius:2px;transition:left .3s var(--ease),width .3s var(--ease);box-shadow:0 0 12px var(--piv)}
.spacer{flex:1}
.kbd-hint{font-size:.74rem;color:var(--dim);white-space:nowrap}
.kbd-hint kbd{font-family:var(--mono);background:var(--panel-2);border:1px solid var(--line-2);border-radius:5px;padding:1px 5px;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{color:var(--ink);border-color:var(--line-2)}
.work{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
.stage{padding:14px 18px 14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.codepane{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-width:0}
.cp-toggle{display:none}
.cp-body{display:flex;flex-direction:column;min-height:0;flex:1}
.cp-head{padding:14px 14px 8px;border-bottom:1px solid var(--line)}
.cp-head h2{font-size:.98rem;font-weight:800;display:flex;align-items:center;gap:8px}
.cp-head .sub{font-size:.76rem;color:var(--muted);margin-top:2px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.badge{font-family:var(--mono);font-size:.68rem;padding:3px 7px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.badge b{color:var(--ink);font-weight:600}
.badge.good{border-color:rgba(156,207,216,.5);color:var(--srt)} .badge.bad{border-color:rgba(235,111,146,.5);color:var(--swp)}
.code{list-style:none;margin:0;padding:8px 0;font-family:var(--mono);font-size:.76rem;line-height:1.6;counter-reset:ln;overflow:auto;flex:0 1 auto;min-height:90px}
.code li{display:flex;gap:10px;padding:1px 12px 1px 0;border-left:3px solid transparent;transition:background .2s,border-color .2s}
.code li .src{white-space:pre;min-width:0}
.code li::before{counter-increment:ln;content:counter(ln);width:2em;text-align:right;color:var(--dim);flex:none;padding-left:6px}
.code li.on{background:rgba(196,167,231,.14);border-left-color:var(--piv)}
.code li.on::before{color:var(--piv)}
.kw{color:var(--piv)} .num{color:var(--cmp)} .fn{color:var(--srt)} .cm{color:var(--dim);font-style:italic}
.cp-note{margin:10px 12px;padding:10px 12px;background:var(--panel-2);border-left:3px solid var(--cmp);border-radius:8px;font-size:.85rem;min-height:3.4em;transition:border-color .2s}
.cp-note.swap{border-left-color:var(--swp)} .cp-note.sorted{border-left-color:var(--srt)} .cp-note.pivot{border-left-color:var(--piv)} .cp-note.visit{border-left-color:var(--vis)} .cp-note.path{border-left-color:var(--pth)}
.cp-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:0 12px 12px}
.stat{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.stat .k{font-size:.64rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--mono);font-size:1rem;font-weight:600}
.stat.cmp .v{color:var(--cmp)} .stat.swp .v{color:var(--swp)} .stat.srt .v{color:var(--srt)} .stat.piv .v{color:var(--piv)}

/* ---------- Controls ---------- */
.ctrl{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.ctrl label,.f{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);font-weight:700}
select,input[type=text],input[type=number]{background:var(--panel-2);border:1px solid var(--line-2);color:var(--ink);border-radius:8px;padding:7px 9px;min-height:40px;outline:0}
select:focus,input:focus{border-color:var(--piv);box-shadow:0 0 0 3px rgba(196,167,231,.18)}
input[type=range]{accent-color:var(--piv);height:40px;margin:0}
.btn{border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);border-radius:9px;padding:0 12px;min-height:40px;font-weight:700;font-size:.84rem;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn.primary{background:var(--piv);color:#13111c;border-color:var(--piv)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--swp);border-color:rgba(235,111,146,.4)}
.btn.sm{min-height:34px;padding:0 10px;font-size:.78rem}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn[aria-pressed=true]{background:rgba(196,167,231,.18);border-color:var(--piv);color:var(--piv)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--panel-2);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;padding:0 12px;min-height:40px;cursor:pointer;font-weight:700;font-size:.82rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.seg button.on{background:var(--panel-3);color:var(--ink)}
.seg.sm button{min-height:34px;padding:0 10px;font-size:.76rem}
.sw{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:.78rem;color:var(--muted);font-weight:700;min-height:40px}
.sw input{appearance:none;width:36px;height:20px;border-radius:999px;background:var(--panel-3);position:relative;margin:0;cursor:pointer;transition:background .2s}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .2s var(--ease),background .2s}
.sw input:checked{background:var(--piv)} .sw input:checked::after{transform:translateX(16px);background:#13111c}

/* ---------- Stage pieces ---------- */
.cv{position:relative;flex:1;min-height:280px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.cv .hint{position:absolute;left:12px;bottom:6px;font-size:.72rem;color:var(--dim);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 24px)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.74rem;color:var(--muted);font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.tile .k{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;white-space:nowrap}
.tile .v{font-family:var(--mono);font-size:1.15rem;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.cmp .v{color:var(--cmp)} .tile.swp .v{color:var(--swp)} .tile.srt .v{color:var(--srt)} .tile.piv .v{color:var(--piv)} .tile.vis .v{color:#5ab0cc}
.race{display:grid;grid-template-rows:1fr 1fr;gap:10px;flex:1;min-height:0}
.racer{display:flex;flex-direction:column;min-height:0;gap:6px}
.racer .rh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.8rem}
.racer .rh b{font-size:.9rem}
.racer .rh .c{font-family:var(--mono);color:var(--muted)} .racer .rh .c span{color:var(--ink)}
.racer .cv{min-height:150px}
.banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--piv);color:var(--ink);padding:8px 14px;border-radius:10px;font-weight:700;font-size:.85rem;display:flex;align-items:center;gap:8px;animation:pop .3s var(--ease);box-shadow:0 10px 30px -10px rgba(0,0,0,.6);max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner.win{border-color:var(--cmp);color:var(--cmp)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;min-width:0}
.panel h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.adj{font-family:var(--mono);font-size:.76rem;line-height:1.7;max-height:150px;overflow:auto;white-space:pre}
.adj b{color:var(--piv);font-weight:600}
table.t{width:100%;border-collapse:collapse;font-size:.8rem}
table.t th,table.t td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
table.t td.n{font-family:var(--mono);text-align:right}
table.t tr.hl td{background:rgba(246,193,119,.1)}
.twrap{overflow:auto;max-height:150px}
.twrap.tall{max-height:none}

/* ---------- Data structures ---------- */
.ds-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;flex:1}
.ds-view{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-height:320px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.cells{display:flex;gap:30px 6px;align-items:flex-end;flex-wrap:wrap;padding-top:18px}
.cell{width:46px;height:46px;border-radius:9px;background:var(--panel-3);border:1px solid var(--line-2);display:grid;place-items:center;font-family:var(--mono);font-weight:600;transition:transform .3s var(--ease),opacity .3s,background .2s,border-color .2s;position:relative}
.cell.enter{animation:fadeUp .3s var(--ease) both}
.cell.leave{opacity:0;transform:translateY(-14px) scale(.9)}
.cell.lo{border-color:var(--srt);color:var(--srt)} .cell.hi{border-color:var(--swp);color:var(--swp)} .cell.mid{background:var(--cmp);color:#13111c;border-color:var(--cmp)} .cell.found{background:var(--srt);color:#13111c} .cell.dead{opacity:.3}
.cell .tag{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:.62rem;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.stack-col{display:flex;flex-direction:column-reverse;gap:6px;width:120px;min-height:260px;justify-content:flex-start;border:1px dashed var(--line-2);border-top:0;border-radius:0 0 10px 10px;padding:8px}
.stack-col .cell{width:100%;height:38px}
.stack-col .cell .tag{top:50%;left:auto;right:-36px;transform:translateY(-50%)}
.queue-row{display:flex;gap:6px;min-height:60px;align-items:center;border:1px dashed var(--line-2);border-left:0;border-right:0;padding:26px 8px;overflow-x:auto}
.ptr{font-size:.7rem;color:var(--muted);font-family:var(--mono)}
svg.tree{width:100%;height:auto;max-height:520px;display:block}
svg.tree .node{transition:transform .45s var(--ease)}
svg.tree .node circle{fill:var(--panel-3);stroke:var(--line-2);stroke-width:2;transition:fill .25s,stroke .25s}
svg.tree .node text{fill:var(--ink);font-family:var(--mono);font-size:13px;font-weight:600;text-anchor:middle;dominant-baseline:central}
svg.tree .node.visit circle{stroke:var(--cmp);fill:rgba(246,193,119,.18)}
svg.tree .node.found circle{fill:var(--srt);stroke:var(--srt)} svg.tree .node.found text{fill:#13111c}
svg.tree .node.new circle{fill:var(--piv);stroke:var(--piv)} svg.tree .node.new text{fill:#13111c}
svg.tree .node.del circle{fill:var(--swp);stroke:var(--swp)} svg.tree .node.del text{fill:#13111c}
svg.tree .node.order circle{fill:var(--vis);stroke:var(--vis)}
svg.tree .node .ord{font-size:10px;fill:var(--cmp)}
svg.tree line{stroke:var(--line-2);stroke-width:2;transition:all .45s var(--ease)}
.ds-ctrl input[type=number]{width:90px}

/* ---------- Learn ---------- */
.learn{display:flex;flex-direction:column;gap:12px}
.quiz .opt{display:block;width:100%;text-align:left;margin-top:8px;padding:12px 14px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line-2);cursor:pointer;font-weight:600}
.quiz .opt:hover{border-color:var(--piv)}
.quiz .opt.right{border-color:var(--srt);background:rgba(156,207,216,.14)} .quiz .opt.wrong{border-color:var(--swp);background:rgba(235,111,146,.14)}
.bar{height:8px;background:var(--panel-3);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--piv);width:0}
.score{font-family:var(--mono);font-size:2.4rem;font-weight:600;color:var(--cmp)}
.growth svg.chart{width:100%;height:auto;display:block}
.growth .tip{position:absolute;pointer-events:none;background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:.72rem;line-height:1.6;white-space:nowrap;box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}

/* ---------- Transport ---------- */
.transport{display:flex;align-items:center;gap:14px;padding:8px 16px;border-top:1px solid var(--line);background:var(--panel);position:sticky;bottom:0;z-index:20;flex-wrap:wrap}
.t-btns{display:flex;gap:6px}
.tb{width:40px;height:40px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);display:grid;place-items:center;cursor:pointer;font-size:1.05rem}
.tb.primary{background:var(--piv);color:#13111c;border-color:var(--piv);width:48px}
.tb[aria-pressed=true]{background:rgba(235,111,146,.18);border-color:var(--swp);color:var(--swp)}
.tb:disabled{opacity:.4;cursor:not-allowed;transform:none}
.t-scrub{flex:1;display:flex;align-items:center;gap:10px;min-width:180px}
.t-scrub input{flex:1;min-width:0}
.t-scrub span{font-family:var(--mono);font-size:.74rem;color:var(--muted);white-space:nowrap;min-width:9ch;text-align:right}
.t-slider{display:flex;align-items:center;gap:7px;font-size:.76rem;color:var(--muted);font-weight:700;white-space:nowrap}
.t-slider input{width:110px}
.t-slider span{font-family:var(--mono);color:var(--ink);min-width:4ch}
body[data-cat=learn] .transport,body[data-cat=learn] .codepane{display:none}
body[data-cat=learn] .work{grid-template-columns:minmax(0,1fr)}
body:not([data-cat=sorting]) #tRace,body:not([data-cat=sorting]):not([data-cat=path]) #tSizeWrap{display:none}

/* ---------- Modal / toasts ---------- */
.modal{position:fixed;inset:0;background:rgba(5,4,10,.6);display:grid;place-items:center;z-index:50;animation:fadeIn .2s;padding:16px}
.modal[hidden]{display:none}
.modal .box{background:var(--panel);border:1px solid var(--line-2);border-radius:16px;max-width:780px;width:100%;max-height:88vh;overflow:auto;padding:20px 22px;animation:pop .25s var(--ease);box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
.modal h2{font-size:1.15rem;display:flex;align-items:center;gap:8px}
.todo{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;background:var(--panel-2)}
.todo h4{font-size:.9rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.todo .tag{font-family:var(--mono);font-size:.64rem;padding:2px 6px;border-radius:5px;background:rgba(196,167,231,.15);color:var(--piv)}
.todo p{margin:4px 0 0;font-size:.82rem;color:var(--muted)}
#toasts{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;pointer-events:none}
.toast{background:var(--panel-3);color:var(--ink);border:1px solid var(--line-2);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.86rem;box-shadow:0 10px 30px -10px rgba(0,0,0,.7);animation:toastIn .3s var(--ease),toastOut .3s var(--ease) 2.8s forwards;display:flex;align-items:center;gap:8px}
.toast.ok{border-color:var(--srt);color:var(--srt)} .toast.bad{border-color:var(--swp);color:var(--swp)}

/* ---------- Responsive ---------- */
@media (min-width:901px){
  .app{height:100vh}
  .work{overflow:hidden}
  .stage{overflow:auto}
  .codepane{overflow:hidden}
  .cp-body{overflow:hidden}
}
@media (max-width:1100px){.kbd-hint{display:none}.work{grid-template-columns:minmax(0,1fr) 310px}}
@media (max-width:900px){
  .work{display:block}
  .topbar{gap:8px;padding:0 10px;height:auto;flex-wrap:wrap;padding-bottom:0}
  .brand{padding:8px 0} .brand small{display:none}

<script>
'use strict';
/* =====================================================================
   Algorithm Visualizer — single-file app
   Sections: utils · player (generator recorder) · code pane · transport
             sorting · pathfinding · graphs · data structures · learn · router
   Extension pattern: an algorithm is a generator that yields step objects
   { type, i, j, line, note, … }. The player records the steps into an array,
   applies / undoes them on a model, and the renderer draws the model.
   Student extension points are marked with  TODO(student)
   ===================================================================== */

// ---------- utils ----------
const NS = 'algoviz:';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const store = {
  get(k, d) { try { const v = localStorage.getItem(NS + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(NS + k, JSON.stringify(v)); } catch {} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const nf = n => Number(n).toLocaleString('en-US');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const toast = (msg, type = '') => { const t = document.createElement('div'); t.className = 'toast ' + type; t.innerHTML = ic(type === 'bad' ? 'alert' : type === 'ok' ? 'check-circle' : 'info') + esc(msg); $('#toasts').append(t); setTimeout(() => t.remove(), 3200); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const newSeed = () => Math.floor(Math.random() * 9e5) + 1000;
const animateIn = root => { root.classList.remove('enter'); void root.offsetWidth; root.classList.add('enter'); $$('.stagger', root).forEach(g => [...g.children].forEach((el, i) => el.style.setProperty('--i', i))); };
const countUp = (el, to, { dur = 700, fmt = v => nf(Math.round(v)) } = {}) => { const t0 = performance.now(); const step = now => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = fmt(to * e); if (p < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); };
const drawPath = p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; p.getBoundingClientRect(); p.style.transition = 'stroke-dashoffset .9s var(--ease)'; p.style.strokeDashoffset = 0; };
const COL = { bar: '#5b5775', cmp: '#f6c177', swp: '#eb6f92', srt: '#9ccfd8', piv: '#c4a7e7', vis: '#31748f', pth: '#f6c177', fro: '#9ccfd8', wall: '#3d3856', mud: '#5c4a3a', ink: '#e0def4', muted: '#908caa', panel: '#1b1826', panel2: '#221e30', line: '#2a2640' };
const fitCanvas = cv => { const r = cv.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1); const w = Math.max(1, Math.round(r.width * d)), h = Math.max(1, Math.round(r.height * d)); if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; } const ctx = cv.getContext('2d'); ctx.setTransform(d, 0, 0, d, 0, 0); return { ctx, W: r.width, H: r.height }; };
class PQ { constructor() { this.h = []; } get size() { return this.h.length; } push(p, v) { const h = this.h; h.push([p, v]); let i = h.length - 1; while (i > 0) { const q = (i - 1) >> 1; if (h[q][0] <= h[i][0]) break; [h[q], h[i]] = [h[i], h[q]]; i = q; } } pop() { const h = this.h, top = h[0], last = h.pop(); if (h.length) { h[0] = last; let i = 0; for (;;) { let l = 2 * i + 1, r = l + 1, m = i; if (l < h.length && h[l][0] < h[m][0]) m = l; if (r < h.length && h[r][0] < h[m][0]) m = r; if (m === i) break; [h[m], h[i]] = [h[i], h[m]]; i = m; } } return top; } }

// ---------- app state ----------
const DEFAULTS = {
  cat: 'sorting', speed: 5,
  sort: { algo: 'quick', algoB: 'merge', size: 40, dist: 'random', seed: 4242, custom: '12, 5, 31, 8, 20, 3, 27, 15', race: false, focus: 0 },
  pf: { algo: 'astar', h: 'manhattan', diag: false, tool: 'wall', size: 1, seed: 77, maze: 'division' },
  gr: { algo: 'dijkstra', preset: 'weighted', mode: 'edge', src: 0, w: 4 },
  ds: { tab: 'stack' }, learn: { tab: 'table' }
};
const SAVED = store.get('settings', {});
const S = Object.fromEntries(Object.entries(DEFAULTS).map(([k, v]) => [k, typeof v === 'object' ? { ...v, ...(SAVED[k] || {}) } : (SAVED[k] ?? v)]));
const saveS = () => store.set('settings', { speed: S.speed, sort: S.sort, pf: { ...S.pf }, gr: { algo: S.gr.algo, preset: S.gr.preset, mode: S.gr.mode, src: S.gr.src, w: S.gr.w }, ds: S.ds, learn: S.learn });

// ---------- generic player: records generator steps, applies/undoes them on a model ----------
const SPS = [1, 2, 4, 8, 15, 30, 60, 120, 250, 500];
const sps = () => SPS[clamp(S.speed, 1, 10) - 1];
function record(gen, cap = 150000) {
  const steps = [];
  for (const s of gen) { steps.push(s); if (steps.length >= cap) { steps.push({ type: 'done', line: -1, note: 'Step limit reached — recording truncated' }); break; } }
  return steps;
}
const P = {
  tracks: [], idx: 0, playing: false, raf: 0, acc: 0, last: 0, onDone: null, onRender: null,
  load(tracks, onRender, onDone) { this.pause(); this.tracks = tracks; this.onRender = onRender; this.onDone = onDone; this.idx = 0; tracks.forEach(t => t.pos = 0); this.render(); },
  total() { return this.tracks.length ? Math.max(...this.tracks.map(t => t.steps.length)) : 0; },
  seek(i) {
    i = clamp(i, 0, this.total());
    for (const t of this.tracks) { const target = Math.min(i, t.steps.length); while (t.pos < target) t.apply(t.model, t.steps[t.pos++]); while (t.pos > target) t.undo(t.model, t.steps[--t.pos]); }
    this.idx = i; this.render();
  },
  cur(t) { return t.steps[t.pos - 1] || null; },
  render() { this.onRender && this.onRender(); updateTransport(); },
  play() { if (this.playing || !this.tracks.length) return; if (this.idx >= this.total()) this.seek(0); this.playing = true; this.last = performance.now(); this.acc = 0; this.raf = requestAnimationFrame(ts => this.loop(ts)); updateTransport(); },
  pause() { this.playing = false; cancelAnimationFrame(this.raf); updateTransport(); },
  toggle() { this.playing ? this.pause() : this.play(); },
  step(d) { this.pause(); this.seek(this.idx + d); },
  loop(ts) {
    if (!this.playing) return;
    const dt = Math.min(.1, (ts - this.last) / 1000); this.last = ts; this.acc += dt * sps();
    const n = Math.floor(this.acc); if (n > 0) { this.acc -= n; this.seek(this.idx + n); }
    if (this.idx >= this.total()) { this.pause(); this.onDone && this.onDone(); } else this.raf = requestAnimationFrame(t => this.loop(t));
  }
};

// ---------- code pane ----------
const KW = /\b(for|while|if|else|return|in|and|or|not|break|continue|skip|output|mark|swap|push|pop|shift|add|popMin|reconstruct|copy|sort|union|find|dfs|BFS|queue|stack|pq|open)\b/g;
function hlLine(s) {
  let out = esc(s);
  const ci = out.indexOf('//'); let cm = ''; if (ci >= 0) { cm = `<span class="cm">${out.slice(ci)}</span>`; out = out.slice(0, ci); }
  out = out.replace(/\b(\d+(\.\d+)?)\b/g, '<span class="num">$1</span>').replace(KW, '<span class="kw">$1</span>').replace(/\b([a-zA-Z_]\w*)(?=\()/g, '<span class="fn">$1</span>');
  return out + cm;
}
let cpLinesKey = '';
function showCode({ title = '', sub = '', badges = [], code = [], line = -1, note = '', noteKind = '', stats = [] }) {
  $('#cpTitle').innerHTML = ic('code') + esc(title); $('#cpSub').textContent = sub;
  $('#cpBadges').innerHTML = badges.map(b => `<span class="badge ${b.cls || ''}">${b.k ? esc(b.k) + ' <b>' + esc(b.v) + '</b>' : esc(b.v)}</span>`).join('');
  const key = title + '|' + code.join('\n');
  if (key !== cpLinesKey) { cpLinesKey = key; $('#cpCode').innerHTML = code.map(l => `<li><span class="src">${hlLine(l)}</span></li>`).join(''); }
  $$('#cpCode li').forEach((li, i) => li.classList.toggle('on', i === line));
  const on = $('#cpCode li.on'), box = $('#cpCode'); if (on && (on.offsetTop < box.scrollTop || on.offsetTop + on.offsetHeight > box.scrollTop + box.clientHeight)) box.scrollTop = on.offsetTop - box.clientHeight / 2;
  const nt = $('#cpNote'); nt.textContent = note || 'Press play or step forward to begin.'; nt.className = 'cp-note ' + noteKind;

  body.innerHTML = `<div class="panel quiz enter" style="max-width:720px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h3 style="margin:0">${ic('lightbulb')} Question ${QZ.i + 1} of ${QUIZ.length}</h3><span class="mono muted" style="font-size:.8rem">score ${QZ.score} · best ${saved.best}</span></div><div class="bar" style="margin:10px 0 14px"><i style="width:${QZ.i / QUIZ.length * 100}%"></i></div><p style="font-size:1.02rem;font-weight:600;margin:0 0 6px">${esc(q.q)}</p><div id="qOpts">${q.o.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div><div id="qWhy" class="cp-note hidden" style="margin:12px 0 0"></div><div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn primary hidden" id="qNext">${QZ.i === QUIZ.length - 1 ? 'See result' : 'Next'} ${ic('arrow-right')}</button></div></div>`;
  $$('#qOpts .opt').forEach(b => b.onclick = () => {
    if (QZ.picked != null) return; QZ.picked = +b.dataset.i; const ok = QZ.picked === q.a; if (ok) QZ.score++;
    $$('#qOpts .opt').forEach(x => { const i = +x.dataset.i; x.classList.toggle('right', i === q.a); x.classList.toggle('wrong', i === QZ.picked && !ok); x.disabled = true; });
    const w = $('#qWhy'); w.classList.remove('hidden'); w.className = 'cp-note ' + (ok ? 'sorted' : 'swap'); w.innerHTML = `<b>${ok ? 'Correct.' : 'Not quite.'}</b> ${esc(q.why)}`; $('#qNext').classList.remove('hidden');
  });
  $('#qNext').onclick = () => {
    QZ.i++; QZ.picked = null;
    if (QZ.i >= QUIZ.length) { QZ.done = true; const s = store.get('quiz', { best: 0, attempts: [] }); s.best = Math.max(s.best, QZ.score); s.attempts.push({ date: new Date().toISOString().slice(0, 10), score: QZ.score }); s.attempts = s.attempts.slice(-20); store.set('quiz', s); toast(`Quiz finished: ${QZ.score} / ${QUIZ.length}`, 'ok'); }
    learnQuiz();
  };
}
function learnGrowth() {
  const FN = [['n', n => n, COL.srt], ['log₂ n', n => Math.max(1, Math.log2(n)), COL.piv], ['n log₂ n', n => Math.max(1, n * Math.log2(n)), COL.cmp], ['n²', n => n * n, COL.swp], ['2ⁿ', n => 2 ** n, '#f0a0c0']];
  const W = Math.max(300, ($('#lBody').clientWidth || 720) - 34), H = W < 520 ? 300 : 380, pl = 50, pr = 16, pt = 16, pb = 36, N = 32, ymax = Math.log10(2 ** N);
  const X = n => pl + (n - 1) / (N - 1) * (W - pl - pr), Y = v => pt + (H - pt - pb) * (1 - Math.log10(Math.max(1, v)) / ymax);
  const grid = Array.from({ length: 10 }, (_, i) => i).map(i => `<line x1="${pl}" x2="${W - pr}" y1="${Y(10 ** i)}" y2="${Y(10 ** i)}" stroke="${COL.line}" stroke-dasharray="3 4"/><text x="${pl - 8}" y="${Y(10 ** i) + 4}" fill="${COL.muted}" font-size="11" text-anchor="end" font-family="Fira Code,monospace">10${'⁰¹²³⁴⁵⁶⁷⁸⁹'[i]}</text>`).join('');
  const xt = [1, 4, 8, 12, 16, 20, 24, 28, 32].map(n => `<text x="${X(n)}" y="${H - pb + 18}" fill="${COL.muted}" font-size="11" text-anchor="middle" font-family="Fira Code,monospace">${n}</text>`).join('');
  const paths = FN.map(([lab, f, c], i) => `<path data-f="${i}" d="${Array.from({ length: N }, (_, k) => `${k ? 'L' : 'M'}${X(k + 1).toFixed(1)},${Y(f(k + 1)).toFixed(1)}`).join(' ')}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`).join('');
  const legend = FN.map(([lab, , c]) => `<span><i style="background:${c}"></i>${lab}</span>`).join('');
  $('#lBody').innerHTML = `<div class="panel growth enter" style="position:relative"><h3>${ic('trending-up')} Growth of common complexities (log scale)</h3><div class="legend" style="margin-bottom:8px">${legend}</div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Growth rate chart">${grid}${xt}<text x="${(pl + W - pr) / 2}" y="${H - 4}" fill="${COL.muted}" font-size="11" text-anchor="middle" font-family="Manrope">n (input size)</text>${paths}<line id="gCursor" x1="0" x2="0" y1="${pt}" y2="${H - pb}" stroke="${COL.ink}" stroke-opacity=".5" visibility="hidden"/><g id="gDots"></g></svg><div class="tip hidden" id="gTip"></div><p class="muted" style="font-size:.84rem;margin:10px 0 0">Hover or touch the chart. The y-axis is logarithmic: every grid line is 10× the one below. At n = 32, 2ⁿ is already over four billion while n log n is 160 — this is why exponential brute force fails and O(n log n) sorting feels instant.</p></div>`;
  const svg = $('.growth svg.chart'); $$('path[data-f]', svg).forEach(drawPath);
  const dots = $('#gDots'); dots.innerHTML = FN.map(([, , c]) => `<circle r="4" fill="${c}" stroke="#13111c" stroke-width="2" visibility="hidden"/>`).join('');
  const show = e => {
    const b = svg.getBoundingClientRect(), cx = e.touches ? e.touches[0].clientX : e.clientX, mx = (cx - b.left) * W / b.width, n = clamp(Math.round(1 + (mx - pl) / (W - pl - pr) * (N - 1)), 1, N);
    $('#gCursor').setAttribute('x1', X(n)); $('#gCursor').setAttribute('x2', X(n)); $('#gCursor').setAttribute('visibility', 'visible');
    [...dots.children].forEach((d, i) => { d.setAttribute('cx', X(n)); d.setAttribute('cy', Y(FN[i][1](n))); d.setAttribute('visibility', 'visible'); });
    const tip = $('#gTip'); tip.classList.remove('hidden'); tip.innerHTML = `<b>n = ${n}</b><br>` + FN.map(([lab, f, c]) => `<span style="color:${c}">${lab}</span> = ${f(n) >= 1e6 ? f(n).toExponential(2) : nf(Math.round(f(n) * 10) / 10)}`).join('<br>');
    const px = (cx - b.left), box = svg.parentElement.getBoundingClientRect(); tip.style.left = Math.min(box.width - 190, Math.max(0, px + (b.left - box.left) + 14)) + 'px'; tip.style.top = (b.top - box.top + 20) + 'px';
  };
  svg.addEventListener('mousemove', show); svg.addEventListener('touchstart', show, { passive: true }); svg.addEventListener('touchmove', show, { passive: true });
  svg.addEventListener('mouseleave', () => { $('#gTip').classList.add('hidden'); $('#gCursor').setAttribute('visibility', 'hidden'); [...dots.children].forEach(d => d.setAttribute('visibility', 'hidden')); });
}

/* =====================================================================
   ABOUT · ROUTER · SHORTCUTS · BOOT
   ===================================================================== */
const TODOS = [
  ['Dynamic-programming tables', 'DP', 'LCS and 0/1 knapsack as a filled grid: yield {type:"set", r, c, v} per cell and render a table instead of bars.'],
  ['String matching', 'KMP · Rabin-Karp', 'Show text, pattern window, failure function and rolling hash as step objects in a new category tab.'],
  ['Run the user\'s own JavaScript', 'instrumentation', 'runUserCode(): execute a student sort in a Web Worker over a Proxy array that counts reads/writes and emits steps automatically.'],
  ['Urdu step explanations & narration', 'i18n · speech', 'narrate(): translate each step note (template dictionary) and read it with speechSynthesis using an ur-PK voice.'],
  ['Auto-graded exercises', 'assessment', '"Predict the next swap" and "which line runs next?" drills scored against the recorded step list.'],
  ['GIF / video export of a run', 'export', 'exportRun(): replay the step list off-screen and capture with canvas.captureStream() + MediaRecorder.'],
  ['More algorithms', 'generators', 'Shell / Tim sort, Bellman-Ford, Floyd–Warshall, Jump Point Search — one generator each, nothing else to wire.']
];
function openAbout() {
  $('#aboutBox').innerHTML = `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><h2 id="aboutTitle">${ic('info')} Algorithm Visualizer</h2><button class="iconbtn" id="aboutClose" aria-label="Close">${ic('x')}</button></div>
    <p class="muted" style="margin:8px 0 0">An offline, single-file visual lab. Students memorise Big-O tables without ever seeing an algorithm move; here every algorithm is a JavaScript <b>generator</b> that yields step objects, a generic player records them, and the canvas is drawn from the current step — so you can scrub, step back and race two algorithms on identical input.</p>
    <h3 style="margin:16px 0 6px;font-size:.95rem">${ic('code')} Extension pattern</h3>
    <pre class="mono" style="background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:.74rem;line-height:1.6;overflow:auto;margin:0">${esc(`SORTS.shell = { name: 'Shell sort', cx: ['n log n', 'n^1.3', 'n²', '1', false],
  code: ['for gap in n/2 .. 1:', '  insertion sort every gap-th element'],
  *run(a) { /* mutate a, and for each action: */
    yield { type: 'compare', i, j, line: 1, note: 'why' };
    yield { type: 'swap', i, j, line: 1, note: '…' };   // or {type:'set', i, v}
  } };   // → appears in dropdowns, race mode and the Learn table`)}</pre>
    <h3 style="margin:16px 0 6px;font-size:.95rem">${ic('keyboard')} Shortcuts</h3>
    <p class="muted" style="margin:0;font-size:.88rem"><kbd class="mono">Space</kbd> play / pause · <kbd class="mono">←</kbd> <kbd class="mono">→</kbd> step · <kbd class="mono">R</kbd> reset · the URL hash carries category, algorithm, size and seed, so the Share button reproduces the exact run.</p>
    <h3 style="margin:16px 0 4px;font-size:.95rem">${ic('lightbulb')} Left for students</h3>
    <div class="stagger">${TODOS.map(([h, tag, hint]) => `<div class="todo"><h4>${esc(h)} <span class="tag">${esc(tag)}</span></h4><p>${esc(hint)}</p></div>`).join('')}</div>
    <p class="muted" style="font-size:.8rem;margin:14px 0 0">Search the source for <span class="mono">TODO(student)</span>. Settings, your graph and quiz results live in localStorage under <span class="mono">algoviz:</span>. <button class="btn sm ghost" id="wipe" style="margin-left:6px">${ic('trash')} Reset saved data</button></p>`;
  const m = $('#about'); m.hidden = false; animateIn($('#aboutBox')); $('#aboutClose').focus();
  $('#aboutClose').onclick = closeAbout; m.onclick = e => { if (e.target === m) closeAbout(); };
  $('#wipe').onclick = () => { Object.keys(localStorage).filter(k => k.startsWith(NS)).forEach(k => localStorage.removeItem(k)); location.hash = ''; location.reload(); };
}
function closeAbout() { $('#about').hidden = true; $('#aboutBtn').focus(); }
$('#aboutBtn').onclick = openAbout;
$('#shareBtn').onclick = async () => { syncHash(); try { await navigator.clipboard.writeText(location.href); toast('Link copied — it reproduces this exact run', 'ok'); } catch { prompt('Copy this link', location.href); } };
$('#cpToggle').onclick = () => { const cp = $('#codepane'); cp.classList.toggle('open'); $('#cpToggle').setAttribute('aria-expanded', cp.classList.contains('open')); };

const CATS = [['sorting', 'sort', 'Sorting'], ['path', 'map', 'Pathfinding'], ['graph', 'git-branch', 'Graphs'], ['ds', 'layers', 'Data structures'], ['learn', 'book', 'Learn']];
function renderTabs() {
  $('#tabs').innerHTML = CATS.map(([k, i, l]) => `<a href="#${k}" data-cat="${k}" class="${S.cat === k ? 'active' : ''}" ${S.cat === k ? 'aria-current="page"' : ''}>${ic(i)}<span>${l}</span></a>`).join('') + '<span class="inkbar"></span>';
  positionInk();
}
function positionInk() { const a = $('#tabs a.active'), ink = $('#tabs .inkbar'); if (a && ink) { ink.style.left = a.offsetLeft + 'px'; ink.style.width = a.offsetWidth + 'px'; } }
function parseHash() { const h = location.hash.slice(1); if (!h) return null; const [p, qs = ''] = h.split('?'); const [cat, algo] = p.split('/'); return { cat, algo, q: Object.fromEntries(new URLSearchParams(qs)) }; }
function applyHash() {
  const p = parseHash(); if (!p) return; const { cat, algo, q } = p;
  if (!CATS.some(c => c[0] === cat)) return; S.cat = cat;
  if (cat === 'sorting') { if (SORTS[algo]) S.sort.algo = algo; if (q.size) S.sort.size = clamp(+q.size || 40, 10, 200); if (q.seed) S.sort.seed = +q.seed || S.sort.seed; if (DISTS[q.dist]) S.sort.dist = q.dist; if (q.race && SORTS[q.race]) { S.sort.race = true; S.sort.algoB = q.race; } else if ('race' in q || algo) S.sort.race = !!(q.race && SORTS[q.race]); }
  if (cat === 'path') { if (PF_ALGOS[algo]) S.pf.algo = algo; if (q.size != null) S.pf.size = clamp(+q.size || 0, 0, 3); if (q.seed) S.pf.seed = +q.seed || S.pf.seed; if (['division', 'random', 'none'].includes(q.maze)) S.pf.maze = q.maze; if (['manhattan', 'euclid'].includes(q.h)) S.pf.h = q.h; if (q.diag != null) S.pf.diag = q.diag === '1'; if (q.seed || q.maze || q.size != null) G = null; }
  if (cat === 'graph') { if (GR_ALGOS[algo]) S.gr.algo = algo; if (q.preset && q.preset !== S.gr.preset && ['weighted', 'dag', 'tree'].includes(q.preset)) { GR = presetGraph(q.preset); S.gr.preset = q.preset; saveGraph(); } if (q.src) S.gr.src = +q.src || 0; }
  if (cat === 'ds' && DS_TABS.some(t => t[0] === algo)) S.ds.tab = algo;
  if (cat === 'learn' && ['table', 'quiz', 'growth'].includes(algo)) S.learn.tab = algo;
}
function syncHash() {
  let h = '#' + S.cat;
  if (S.cat === 'sorting') h += `/${S.sort.algo}?size=${S.sort.size}&seed=${S.sort.seed}&dist=${S.sort.dist}` + (S.sort.race ? `&race=${S.sort.algoB}` : '');
  else if (S.cat === 'path') h += `/${S.pf.algo}?size=${S.pf.size}&seed=${S.pf.seed}&maze=${S.pf.maze}&h=${S.pf.h}&diag=${S.pf.diag ? 1 : 0}`;
  else if (S.cat === 'graph') h += `/${S.gr.algo}?preset=${S.gr.preset}&src=${S.gr.src}`;
  else if (S.cat === 'ds') h += `/${S.ds.tab}`; else h += `/${S.learn.tab}`;
  if (location.hash !== h) history.replaceState(null, '', h);
}
function route() {
  applyHash(); mini.stop(); P.pause(); document.body.dataset.cat = S.cat; renderTabs();
  ({ sorting: renderSorting, path: renderPath, graph: renderGraph, ds: renderDS, learn: renderLearn }[S.cat] || renderSorting)();
  saveS(); updateTransport(); $('#stage').scrollTop = 0;
}
window.addEventListener('hashchange', route);
let rsT = 0; window.addEventListener('resize', () => { positionInk(); if (P.tracks.length) P.render(); clearTimeout(rsT); rsT = setTimeout(() => { if (S.cat === 'learn' && S.learn.tab === 'growth') learnGrowth(); }, 150); });
document.addEventListener('keydown', e => {
  if (!$('#about').hidden) { if (e.key === 'Escape') closeAbout(); return; }
  const t = e.target, form = t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA' || t.tagName === 'BUTTON');
  if (form && !(t.type === 'range' && e.key === ' ')) return;
  if (S.cat === 'learn') return;
  if (e.key === ' ') { e.preventDefault(); $('#tPlay').click(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); $('#tFwd').click(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); if (!$('#tBack').disabled) $('#tBack').click(); }
  else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); resetCurrent(); }
});
$('#tSpeed').value = S.speed;
route();
