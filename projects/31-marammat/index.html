const serialFor = (ts, n) => {
  const d = new Date(ts);
  return `MR-${String(d.getFullYear()).slice(2)}${pad2(d.getMonth() + 1)}-${String(n).padStart(4, '0')}`;
};

function nextSerial() {
  S.meta.seq = (S.meta.seq || 60) + 1;
  persist('meta');
  return serialFor(now(), S.meta.seq);
}

const valueInputs = (sess, grade) => ({ modelId: sess.claimed.modelId, storage: sess.claimed.storage, grade, pta: sess.imei.pta, battery: sess.battery.health,
  box: sess.extras.box, charger: sess.extras.charger, warranty: sess.extras.warranty, clone: checkStatus(sess, 'specMatch') === 'fail' });

/** The certificate document: only summaries, a masked IMEI and its salted hash — never photos or the full IMEI. */
async function buildCertDoc(sess, o) {
  const m = modelById(sess.claimed.modelId);
  const g = computeGrade(sess);
  const v = valueEstimate(valueInputs(sess, g.grade));
  const imei = sess.imei.imei1 || '';
  const issued = o.issued || now();
  const days = o.expiryDays || S?.settings?.expiryDays || 30;
  return {
    v: 1,
    serial: o.serial,
    issued: new Date(issued).toISOString(),
    expires: new Date(issued + days * DAY).toISOString(),
    shop: { name: o.shop.name, city: o.shop.city, kid: o.kid },
    tester: o.shop.tester || '',
    device: { brand: m?.brand || '', model: m?.name || '', modelId: m?.id || '', storage: Number(sess.claimed.storage) || 0, ram: Number(sess.claimed.ram) || 0,
      colour: sess.claimed.colour || '', os: sess.claimed.os || '' },
    imei: { masked: maskImei(imei), hash: imei && hasCrypto() ? await imeiHash(imei) : '', luhn: luhnValid(imei), brand: imeiInfo(imei).tacEntry?.brand || '', pta: sess.imei.pta },
    tests: Object.fromEntries(STEPS.filter(s => s.id !== 'summary').map(s => [s.id, stepStatus(sess, s.id)])),
    counts: { pass: g.counts.pass, warn: g.counts.warn, fail: g.counts.fail, skip: g.counts.skip + g.counts.pending },
    evidence: sess.physical.photos.map(p => p.hash).filter(Boolean),
    battery: { health: sess.battery.health === '' ? null : Number(sess.battery.health), source: sess.battery.source },
    grade: g.grade,
    score: g.score,
    value: v ? { lo: v.lo, hi: v.hi, currency: 'PKR' } : { lo: 0, hi: 0, currency: 'PKR' },
    notes: sess.extras.notes || '',
  };
}

async function issueCertificate() {
  if (!hasCrypto()) return toast(t('err_secure'), 'bad');
  if (!sessModel()) return toast(t('sm_needModel'), 'bad');
  const shop = S.settings.shop;
  if (!shop.name) return toast(t('sm_needShop'), 'bad');
  $('#smIssue').disabled = true;
  $('#smIssue').innerHTML = `${ic('key')} ${t('sm_issuing')}`;
  await ensureShopKey();
  const doc = await buildCertDoc(S.session, { serial: nextSerial(), shop, kid: S.shopKey.kid });
  const qr = await signCertificate(doc, S.shopKey);
  const cert = { id: uid('c'), doc, qr, issuedAt: now(), mine: true, sessionId: S.session.id, jobId: S.session.jobId || '' };
  S.certs.unshift(cert);
  persist('certs');
  const job = S.jobs.find(j => j.id === cert.jobId);
  if (job) {
    job.certId = cert.id;
    persist('jobs');
  }
  logEvent('lg_certIssued', { serial: doc.serial }, 'certs');
  toast(t('sm_issued', { serial: doc.serial }), 'ok');
  go('certs/' + cert.id);
  return cert;
}

async function ensureShopKey() {
  if (S.shopKey) return S.shopKey;
  S.shopKey = await generateShopKey();
  S.trust.unshift({ id: 'k-' + S.shopKey.kid, kid: S.shopKey.kid, pub: S.shopKey.pub, name: S.settings.shop.name, city: S.settings.shop.city, status: 'trusted', mine: true, addedAt: now() });
  persist('shopKey', 'trust');
  logEvent('lg_keyCreated', {}, 'settings');
  toast(t('sm_keyMade'), 'ok');
  return S.shopKey;
}

// ---------- seal, value breakdown ----------
function sealSvg(grade, score, { paper = false } = {}) {
  const col = paper ? { A: '#15703a', B: '#0b6c7a', C: '#8f5b00', D: '#b42323' }[grade] : `var(--${{ A: 'pass', B: 'cyan', C: 'warn', D: 'fail' }[grade]})`;
  const rim = paper ? '#a35426' : 'var(--copper)';
  const rays = Array.from({ length: 36 }, (_, i) => {
    const a = (i * 10 * Math.PI) / 180;
    const r0 = i % 2 ? 84 : 88;
    return `${(100 + r0 * Math.cos(a)).toFixed(1)},${(100 + r0 * Math.sin(a)).toFixed(1)}`;
  }).join(' ');
  return `<svg viewBox="0 0 200 200" class="gseal" role="img" aria-label="${t('sm_grade')} ${grade}">
    <polygon points="${rays}" fill="none" stroke="${rim}" stroke-width="2"/><circle cx="100" cy="100" r="74" fill="none" stroke="${rim}" stroke-width="1.5"/>
    <circle cx="100" cy="100" r="79" fill="none" stroke="${rim}" stroke-width=".8" stroke-dasharray="2 3"/>
    <defs><path id="sealArc${grade}" d="M38 100a62 62 0 0 1 124 0"/></defs>
    <text font-size="9.5" letter-spacing="1.6" fill="${rim}" font-family="Azeret Mono"><textPath href="#sealArc${grade}" startOffset="50%" text-anchor="middle">MARAMMAT · CERTIFIED</textPath></text>
    <text x="100" y="124" text-anchor="middle" font-size="68" font-weight="700" fill="${col}" font-family="Azeret Mono">${grade}</text>
    <text x="100" y="152" text-anchor="middle" font-size="13" fill="${rim}" font-family="Azeret Mono">${score}/100</text></svg>`;
}

function valueBreakdownHtml(v) {
  if (!v) return '';
  let run = v.base;
  const rows = [`<tr><td>${t('vf_base', { model: esc(v.model.name), gb: v.model.storage[0] })}</td><td class="num mono"></td><td class="num mono">${rs(run)}</td></tr>`];
  for (const f of v.factors) {
    run *= f.mult;
    rows.push(`<tr><td>${t(f.k, f.vars)}</td><td class="num mono ${f.mult < 1 ? 'c-fail' : 'c-pass'}">× ${f.mult.toFixed(2)}</td><td class="num mono">${rs(run)}</td></tr>`);
  }
  return `<div class="tbl-wrap"><table class="tbl"><tbody>${rows.join('')}</tbody></table></div>${waterfallSvg(v)}`;
}

/** Running value after each factor, as a hand-drawn bar chart. */
function waterfallSvg(v) {
  const pts = [v.base];
  v.factors.forEach(f => pts.push(pts[pts.length - 1] * f.mult));
  const max = Math.max(...pts) * 1.1;
  const W = 380;
  const bh = 16;
  const H = pts.length * (bh + 8) + 6;
  const bars = pts.map((p, i) => {
    const w = (p / max) * (W - 120);
    const col = i === 0 ? 'var(--line-2)' : pts[i] < pts[i - 1] ? 'var(--fail)' : 'var(--pass)';
    return `<rect x="0" y="${i * (bh + 8) + 4}" width="${w.toFixed(1)}" height="${bh}" rx="4" fill="${col}" opacity=".75"/><text x="${(w + 6).toFixed(1)}" y="${i * (bh + 8) + 16}">${rs(p)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="waterfall mt" role="img" aria-label="${t('sm_value')}">${bars}</svg>`;
}

function suggestedParts(sess) {
  const set = new Set();
  for (const [id, part] of Object.entries(CHECK_TO_PART)) if (checkStatus(sess, id) === 'fail') set.add(part);
  if (Number(sess.battery.health) && Number(sess.battery.health) < 80) set.add('battery');
  return [...set];
}

const allCerts = () => [...S.certs, ...S.received.map(c => ({ ...c, received: true }))];
const certById = id => allCerts().find(c => c.id === id);
const isRevoked = c => S.revoked.some(r => r.serial === c.doc.serial && r.kid === c.doc.shop.kid) || S.trust.some(k => k.kid === c.doc.shop.kid && k.status === 'revoked');

function certState(c) {
  if (isRevoked(c)) return 'revoked';
  const left = Date.parse(c.doc.expires) - now();
  if (left < 0) return 'expired';
  return left < 10 * DAY ? 'expiring' : 'valid';
}
const STATE_CHIP = { valid: 'pass', expiring: 'warn', expired: 'skip', revoked: 'fail' };
const certChip = c => {
  const s = certState(c);
  return `<span class="chip ${STATE_CHIP[s]}">${t('ce_' + s)}</span>`;
};
const certDevice = d => `${d.brand} ${d.model}`.trim();
let CERT_FILTER = 'all';

function renderCerts(arg) {
  if (arg) return renderCertDoc(arg);
  const list = allCerts().filter(c => CERT_FILTER === 'all' || (CERT_FILTER === 'mine' ? c.mine : CERT_FILTER === 'received' ? c.received : certState(c) === CERT_FILTER))
    .sort((a, b) => b.issuedAt - a.issuedAt);
  const n = s => allCerts().filter(c => certState(c) === s).length;
  $('#view').innerHTML = `<div class="phead"><div><div class="eyebrow">${ic('seal')} ${t('nav_certs')}</div><h2>${t('nav_certs')}</h2><p>${t('ce_sub')}</p></div>

    <div class="grid g4 stagger mb">${tile('seal', 'ce_mine', S.certs.length)}${tile('download', 'ce_received', S.received.length)}${tile('check-circle', 'ce_valid', n('valid') + n('expiring'))}${tile('ban', 'ce_revoked', n('revoked'))}</div>
    <div class="seg mb" id="ceFilter">${['all', 'mine', 'received', 'valid', 'expiring', 'expired', 'revoked'].map(f => `<button type="button" data-v="${f}" class="${CERT_FILTER === f ? 'on' : ''}">${t(f === 'all' ? 'all' : 'ce_' + f)}</button>`).join('')}</div>
    <div class="grid g3 stagger">${list.map(certCard).join('') || `<div class="empty card">${ic('seal')}${t('ce_none')}</div>`}</div>`;
  $$('#ceFilter button').forEach(b => (b.onclick = () => {

}

const tile = (icon, k, v, sub = '', fmt = '') => tileL(icon, t(k), v, sub, fmt);

function tileL(icon, label, v, sub = '', fmt = '') {
  return `<div class="tile"><span class="k">${ic(icon)} ${label}</span><span class="v" data-count="${Number(v) || 0}" ${fmt ? `data-fmt="${fmt}"` : ''}>${fmt === 'rs' ? rs(v) : fmtNum(v)}</span>${sub ? `<span class="s">${sub}</span>` : ''}</div>`;
}

function certCard(c) {

// ---------- the document ----------
function guillocheSvg() {
  const lines = [];
  for (let k = 0; k < 9; k++) {
    const pts = [];
    for (let i = 0; i <= 360; i += 3) {
      const a = (i * Math.PI) / 180;
      const r = 120 + 26 * Math.cos(7 * a + k * 0.7);
      pts.push(`${(160 + r * Math.cos(a)).toFixed(1)},${(160 + r * Math.sin(a)).toFixed(1)}`);
    }
    lines.push(`<polyline points="${pts.join(' ')}"/>`);
  }
  return `<svg class="guil" viewBox="0 0 320 320" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g fill="none" stroke="#c99a74" stroke-width=".35" opacity=".55">${lines.join('')}</g></svg>`;
}

const qrCache = new Map();
function certQr(c) {
  if (!qrCache.has(c.qr)) qrCache.set(c.qr, QR.encode(c.qr, { ecc: 'M' }));
  return qrCache.get(c.qr);
}

const RES_IC = { pass: 'check-circle', warn: 'alert', fail: 'x-circle', skip: 'minus', pending: 'minus' };

function certDocHtml(c, hash = '') {
  const d = c.doc;
  const q = certQr(c);
  const tests = Object.entries(d.tests).map(([k, v]) => `<tr><td>${t('st_' + k)}</td><td><span class="res ${v === 'pending' ? 'skip' : v}">${ic(RES_IC[v] || 'minus')} ${t('s_' + v)}</span></td></tr>`).join('');
  const meta = (k, v, mono = false) => `<div><small>${t(k)}</small><b class="${mono ? 'mono' : ''}">${v}</b></div>`;
  const sig = c.qr.split('|')[5] || '';
  return `<article class="cert ${isRevoked(c) ? 'stamp-void' : ''}">${guillocheSvg()}${isRevoked(c) ? `<div class="void">${t('ce_void')}</div>` : ''}
    <div class="cert-head"><div class="ttl"><small>${t('ce_docEyebrow')}</small><h2>${t('ce_docTitle')}</h2><div class="${lang === 'ur' ? 'en' : 'ur'}">${lang === 'ur' ? 'Device Health Certificate · Marammat' : 'ڈیوائس ہیلتھ سرٹیفکیٹ · مرمت'}</div>
      <div class="mono" style="font-size:.8rem">${esc(d.shop.name)} · ${esc(d.shop.city)}</div></div><div class="seal">${sealSvg(d.grade, d.score, { paper: true })}</div></div>
    <div class="cert-meta">${meta('ce_serial', esc(d.serial), true)}${meta('ce_issued', fmtDate(Date.parse(d.issued)))}${meta('ce_expires', fmtDate(Date.parse(d.expires)))}${meta('ce_tester', esc(d.tester || '—'))}
      ${meta('ce_device', esc(certDevice(d.device)))}${meta('ce_storage', `${d.device.storage} GB / ${d.device.ram} GB`, true)}${meta('ce_imei', esc(d.imei.masked || '—'), true)}
      ${meta('ce_pta', t('pta_' + d.imei.pta))}${meta('id_colour', esc(d.device.colour || '—'))}${meta('id_os', esc(d.device.os || '—'))}
      ${meta('ce_battery', d.battery.health != null ? d.battery.health + ' %' : t('ce_batteryNA'), d.battery.health != null)}${meta('sm_grade', `${d.grade} · ${t('gd_' + d.grade)}`)}</div>
    <div class="cert-body"><div><table><thead><tr><th>${t('ce_test')}</th><th>${t('ce_result')}</th></tr></thead><tbody>${tests}</tbody></table>
      <p class="fine">${t('ce_counts', { p: d.counts.pass, w: d.counts.warn, f: d.counts.fail, s: d.counts.skip })}${d.evidence.length ? ' · ' + t('ce_evidence', { n: d.evidence.length }) : ''}</p></div>
      <div class="cert-qr">${QR.toSvg(q, { border: 2, dark: '#1d232b', light: '#fbf8f1', label: t('ce_scan') })}<div class="code">${esc(hash ? shareCode(hash) : '')}</div><small>${t('ce_scan')}</small></div></div>
    <div class="cert-value"><span>${t('ce_valueLbl')}</span><b>${rsRange(d.value.lo, d.value.hi)}</b></div>
    ${d.notes ? `<p class="fine" style="font-size:.8rem;color:var(--c-ink)">${t('notes')}: ${esc(d.notes)}</p>` : ''}
    <div class="cert-foot"><div><div class="sig">${t('ce_signature', { kid: esc(d.shop.kid) })}<br>${esc(sig)}</div></div>
      <div><div class="sigline">${t('ce_tester')}: ${[d.tester, d.shop.name].filter(Boolean).map(esc).join(' · ')}</div></div></div>
    <p class="fine">${t('ce_fine')}</p></article>`;
}

function renderCertDoc(id) {
  const c = certById(id);
  if (!c) {
    $('#view').innerHTML = `<div class="empty card">${ic('alert')}${t('ce_unknownCert')}</div>`;
    return;
  }
  const hash = c.qr.split('|')[3];
  const q = certQr(c);
  $('#view').innerHTML = `<div class="phead"><div><div class="eyebrow">${ic('seal')} <a href="#certs">${t('nav_certs')}</a> / ${esc(c.doc.serial)}</div><h2>${esc(certDevice(c.doc.device))}</h2></div>${certChip(c)}</div>
    <div class="certwrap"><div id="certDoc">${certDocHtml(c, hash)}</div>
    <aside class="stack"><section class="card"><h3>${ic('shield-check')} ${t('nav_verify')}</h3><div id="ceVerify"><div class="skeleton" style="height:48px"></div></div>
        <button type="button" class="btn ghost sm mt" id="ceVerifyBtn">${ic('scan')} ${t('ce_verifyNow')}</button></section>
      <section class="card"><h3>${ic('share')} ${t('ce_actions')}</h3><div class="stack">

        <button type="button" class="btn ghost" id="ceJson">${ic('download')} ${t('ce_json')}</button>
        <button type="button" class="btn ghost" id="cePng">${ic('qr')} ${t('ce_qrPng')}</button>
        <a class="btn ghost" id="ceWa" target="_blank" rel="noopener">${ic('message')} ${t('ce_wa')}</a>
        ${c.mine && !isRevoked(c) ? `<button type="button" class="btn danger" id="ceRevoke">${ic('ban')} ${t('ce_revoke')}</button>` : ''}</div>
        <p class="tiny muted mt">${t('ce_bundleHint')}</p></section>
      <section class="card"><h3>${ic('qr')} ${t('ce_qrInfo', { n: c.qr.length, v: q.version })}</h3><div class="keycard">${esc(c.qr)}</div>
        <p class="small mt-s">${t('ce_shareCode')}: <b class="mono">${shareCode(hash)}</b></p></section></aside></div>`;
  bindCertDoc(c, hash);
}

function bindCertDoc(c, hash) {
  const d = c.doc;
  $('#cePrint').onclick = () => printDoc(certDocHtml(c, hash));
  $('#ceBundle').onclick = () => copyText(bundleOf(c));
  $('#ceJson').onclick = () => downloadFile(`marammat-${d.serial}.json`, JSON.stringify({ app: 'marammat', type: 'certificate', doc: d, qr: c.qr }, null, 1));
  $('#cePng').onclick = () => QR.toCanvas(certQr(c), document.createElement('canvas'), { scale: 8 }).toBlob(b => downloadFile(`marammat-${d.serial}-qr.png`, b));
  $('#ceWa').href = 'https://wa.me/?text=' + encodeURIComponent(t('ce_waText', { serial: d.serial, device: certDevice(d.device), grade: d.grade, score: d.score,
    value: rsRange(d.value.lo, d.value.hi), shop: d.shop.name, date: fmtDate(Date.parse(d.issued)), code: shareCode(hash) }));
  $('#ceVerifyBtn').onclick = () => {
    VER.input = bundleOf(c);
    VER.result = null;
    go('verify');
  };
  if ($('#ceRevoke')) $('#ceRevoke').onclick = () => revokeCert(c);
  verifyCertificate(c.qr, d).then(r => $('#ceVerify') && ($('#ceVerify').innerHTML = verdictBanner(r, true)));
}

async function revokeCert(c) {
  // TODO(student): publish a signed revocation list (JSON or a small API) that other devices fetch before verifying.
  if (!(await askConfirm(t('ce_revokeAsk', { serial: esc(c.doc.serial) }), { danger: true, okText: t('ce_revoke'), icon: 'ban' }))) return;
  S.revoked.push({ id: uid('r'), serial: c.doc.serial, kid: c.doc.shop.kid, at: now(), reason: '' });
  persist('revoked');
  logEvent('lg_certRevoked', { serial: c.doc.serial }, 'certs');
  toast(t('ce_revokedOk'), 'ok');
  rerender();
}

const VER = { input: '', tab: 'paste', result: null, doc: null, original: null, qr: '', scanStream: null };
const TAMPER_PATHS = ['serial', 'issued', 'expires', 'shop.name', 'shop.city', 'tester', 'device.brand', 'device.model', 'device.storage', 'device.ram', 'device.colour',
  'device.os', 'imei.masked', 'imei.pta', 'tests.display', 'tests.touch', 'tests.audio', 'tests.camera', 'tests.imei', 'counts.fail', 'battery.health', 'grade', 'score',
  'value.lo', 'value.hi', 'notes'];
const getPath = (o, p) => p.split('.').reduce((x, k) => (x == null ? x : x[k]), o);
const setPath = (o, p, v) => {
  const ks = p.split('.');
  const last = ks.pop();
  ks.reduce((x, k) => x[k], o)[last] = v;
};
const groupOfPath = p => FIELD_GROUPS.find(([, keys]) => keys.includes(p.split('.')[0]))[0];

/** Accept a bundle, a raw QR payload, a share code or a JSON file; find the document locally when only the QR is given. */
function parseVerifyInput(text) {
  const s = String(text || '').trim();
  const b = parseBundle(s);
  if (b) return { qr: b.qr, doc: b.doc, from: 'bundle' };
  try {
    const o = JSON.parse(s);
    if (o && o.doc && o.qr) return { qr: o.qr, doc: o.doc, from: 'file' };
  } catch {
    /* not JSON */
  }
  const p = parsePayload(s);
  if (p) {
    const local = allCerts().find(c => c.doc.serial === p.serial && c.doc.shop.kid === p.kid);
    return { qr: s, doc: local ? structuredClone(local.doc) : null, from: local ? 'local' : 'qr' };
  }
  const code = s.toUpperCase();
  if (/^MR-[0-9A-Z]{4}-[0-9A-Z]{4}$/.test(code)) {
    const c = allCerts().find(x => shareCode(x.qr.split('|')[3]) === code);
    if (c) return { qr: c.qr, doc: structuredClone(c.doc), from: 'local' };
  }
  return null;
}

async function runVerify(text = VER.input) {
  VER.input = text;
  const parsed = parseVerifyInput(text);
  if (!parsed) {
    VER.result = { verdict: 'invalid', format: false, groups: [] };
    VER.doc = VER.original = null;
  } else {
    VER.qr = parsed.qr;
    VER.from = parsed.from;
    VER.original = parsed.doc ? structuredClone(parsed.doc) : null;
    VER.doc = parsed.doc ? structuredClone(parsed.doc) : null;
    VER.result = await verifyCertificate(parsed.qr, parsed.doc);
    VER.localOriginal = allCerts().find(c => c.doc.serial === VER.result.serial && c.doc.shop?.kid === VER.result.kid)?.doc || null;
    logEvent('lg_verified', { serial: VER.result.serial || '?', v: VER.result.verdict }, 'verify');
  }
  if (curRoute === 'verify') drawVerifyResult();
  return VER.result;
}

const VERDICT_TONE = { valid: 'ok', expired: 'warn', qronly: 'warn', untrusted: 'warn', tampered: 'bad', forged: 'bad', revoked: 'bad', invalid: 'bad' };
const VERDICT_IC = { ok: 'shield-check', warn: 'alert', bad: 'x-circle' };

function verdictBanner(r, compact = false) {
  const tone = VERDICT_TONE[r.verdict];
  const shop = esc(r.issuer?.name || '');
  const yes = ok => (ok == null ? `<span class="muted">${ic('minus')}</span>` : ok ? `<span class="c-pass">${ic('check-circle')}</span>` : `<span class="c-fail">${ic('x-circle')}</span>`);
  const rows = [['vc_format', r.format], ['vc_issuer', r.format ? !!r.issuer && r.trusted : null], ['vc_sig', r.issuer ? r.sigOk : null],
    ['vc_hash', r.hashOk], ['vc_expiry', r.hashOk == null ? null : !r.expired], ['vc_revoked', r.format && r.issuer ? !r.revoked : null]];
  return `<div class="vres ${tone}"><div class="big">${ic(VERDICT_IC[tone])}</div><div><h3>${t('v_' + r.verdict)}</h3>
      <p class="small" style="margin:0">${t('v_' + r.verdict + 'Sub', { shop, kid: esc(r.kid || '') })}</p>${r.serial ? `<p class="tiny mono muted" style="margin:4px 0 0">${esc(r.serial)} · ${esc(r.kid || '')}</p>` : ''}</div></div>
    ${compact ? '' : `<ul class="vlist">${rows.map(([k, ok]) => `<li>${yes(ok)}<span>${t(k)}</span></li>`).join('')}</ul>`}`;
}

function groupsHtml(r) {
  if (!r.groups.length) return '';
  return `<h4 class="small mt">${t('vf_groups')}</h4><div class="groups mt-s">${r.groups.map(g => `<span class="${g.ok ? '' : 'bad'}">${ic(g.ok ? 'check' : 'x')} ${t('fg_' + g.id)}</span>`).join('')}</div>`;
}

/** Field-level diff against the shop's own record (only possible when that record is on this device). */
function diffHtml() {
  const orig = VER.localOriginal;
  if (!orig || !VER.doc || VER.result.verdict !== 'tampered') return '';
  const rows = TAMPER_PATHS.filter(p => JSON.stringify(getPath(orig, p)) !== JSON.stringify(getPath(VER.doc, p)));
  if (!rows.length) return '';
  return `<h4 class="small mt">${t('vf_diff')}</h4><div class="tbl-wrap mt-s"><table class="tbl"><thead><tr><th></th><th>${t('vf_was')}</th><th>${t('vf_now')}</th></tr></thead><tbody>
    ${rows.map(p => `<tr><td class="mono small">${p}</td><td class="mono small c-pass">${esc(getPath(orig, p))}</td><td class="mono small c-fail">${esc(getPath(VER.doc, p))}</td></tr>`).join('')}</tbody></table></div>`;
}

// ---------- tamper lab ----------
function drawTamperLab() {
  const box = $('#vfLab');
  if (!box) return;
  if (!VER.doc) {
    box.innerHTML = '';
    return;
  }
  const changed = p => VER.original && JSON.stringify(getPath(VER.original, p)) !== JSON.stringify(getPath(VER.doc, p));
  box.innerHTML = `<section class="card mt"><div class="between"><h3>${ic('edit')} ${t('vf_lab')}</h3><div class="row">
      <button type="button" class="btn ghost sm" id="labReset">${ic('undo')} ${t('vf_labReset')}</button><button type="button" class="btn sm" id="labRun">${ic('shield-check')} ${t('vf_labRun')}</button></div></div>
    <p class="small muted">${t('vf_labSub')}</p><div class="fgrid three mt">${TAMPER_PATHS.map(p => `<label class="field ${changed(p) ? 'changed' : ''}"><span class="mono" style="font-size:.72rem">${p}</span>
      <input data-path="${p}" value="${esc(getPath(VER.doc, p) ?? '')}" class="mono" dir="auto"></label>`).join('')}</div></section>`;
  $$('[data-path]', box).forEach(inp => (inp.onchange = () => {
    const p = inp.dataset.path;
    const before = getPath(VER.original, p);
    setPath(VER.doc, p, typeof before === 'number' ? Number(inp.value) : before === null && inp.value === '' ? null : inp.value);
    inp.closest('.field').classList.toggle('changed', changed(p));
  }));
  $('#labRun').onclick = async () => {
    VER.result = await verifyCertificate(VER.qr, VER.doc);
    drawVerifyResult();
  };
  $('#labReset').onclick = () => {
    VER.doc = structuredClone(VER.original);
    runVerifyDoc();
  };

// ---------- scanning with BarcodeDetector, and QR photos ----------
async function startScan() {
  if (!('BarcodeDetector' in window)) return;
  try {
    VER.scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  } catch (e) {
    return toast(t('err_perm'), 'bad');
  }
  const v = $('#vfVideo');
  v.srcObject = VER.scanStream;
  await v.play().catch(() => {});
  const det = new BarcodeDetector({ formats: ['qr_code'] });
  const timer = setInterval(async () => {
    try {
      const codes = await det.detect(v);
      if (!codes.length) return;
      LIVE.run(stop);
      $('#vfInput').value = codes[0].rawValue;
      runVerify(codes[0].rawValue);
    } catch {
      /* frame not ready */
    }
  }, 300);
  const stop = LIVE.add(() => {
    clearInterval(timer);
    stopStream(VER.scanStream);
    VER.scanStream = null;
  });
}

async function verifyFile(f) {
  if (/json|text/.test(f.type) || /\.json$/i.test(f.name)) {
    const text = await f.text();
    $('#vfInput').value = text.slice(0, 4000);
    return runVerify(text);
  }
  if (!('BarcodeDetector' in window)) return toast(t('vf_scanNo'), 'bad');
  const bmp = await createImageBitmap(f);
  const codes = await new BarcodeDetector({ formats: ['qr_code'] }).detect(bmp);
  if (!codes.length) return toast(t('vf_noQrInImage'), 'bad');
  $('#vfInput').value = codes[0].rawValue;
  runVerify(codes[0].rawValue);
}

/** Demo: take a seeded certificate's bundle and quietly raise its value — the classic used-phone fraud. */
function tamperedSample() {
  const c = S.certs.find(x => x.demo && x.doc.grade !== 'A' && !isRevoked(x)) || S.certs[0];
  if (!c) return;
  const doc = structuredClone(c.doc);
  doc.value.hi += 15000;
  doc.grade = GRADES[Math.max(0, GRADES.indexOf(doc.grade) - 1)];
  return 'MRMT1B.' + b64u(enc.encode(JSON.stringify({ doc, qr: c.qr })));
}

function gradeChartSvg(m, storage) {
  const W = 520;
  const H = 210;
  const vals = GRADES.map(g => ['approved', 'nonpta'].map(pta => valueEstimate({ modelId: m.id, storage, grade: g, pta }).mid));
  const max = Math.max(...vals.flat()) * 1.12;
  const gw = (W - 50) / 4;
  const y = v => H - 26 - (v / max) * (H - 46);
  const ticks = [0.25, 0.5, 0.75, 1].map(f => `<line class="gl" x1="44" x2="${W}" y1="${y(max * f)}" y2="${y(max * f)}"/><text x="40" y="${y(max * f) + 4}" text-anchor="end">${Math.round((max * f) / 1000)}k</text>`).join('');
  const bars = vals.map((pair, i) => pair.map((v, j) => {
    const x = 52 + i * gw + j * (gw / 2 - 4) + 6;
    return `<rect x="${x}" y="${y(v)}" width="${gw / 2 - 14}" height="${H - 26 - y(v)}" rx="4" fill="${j ? 'var(--warn)' : 'var(--cyan)'}" opacity=".85"><title>${GRADES[i]} ${j ? t('va_non') : t('va_approved')}: ${rs(v)}</title></rect>`;

const REP = { modelId: 'iphone-11', items: [{ part: 'battery', grade: 'copy' }, { part: 'screen', grade: 'copy' }] };

function repairValues(est) {
  const major = est.lines.some(l => l.part === 'screen' || l.part === 'port');
  const asIsGrade = major ? 'D' : 'C';
  const afterGrade = 'B';
  const base = { modelId: est.model.id, storage: est.model.storage[0], pta: 'approved' };
  const asIs = valueEstimate({ ...base, grade: asIsGrade }).mid;
  const copyScreen = est.lines.some(l => l.part === 'screen' && l.grade === 'copy');
  const after = valueEstimate({ ...base, grade: afterGrade }).mid * (copyScreen ? 0.92 : 1);
  return { asIs, after, asIsGrade, afterGrade };
}

function bindRepair(est) {
  $('#rpModel').onchange = e => {
    REP.modelId = e.target.value;
    rerender();

  $$('[data-part]').forEach(c => (c.onchange = () => {
    const p = c.dataset.part;
    REP.items = c.checked ? [...REP.items, { part: p, grade: 'orig' }] : REP.items.filter(i => i.part !== p);
    rerender();

  $$('[data-grade]').forEach(seg => $$('button', seg).forEach(b => (b.onclick = () => {

    <h4 class="small mt">${t('sh_timeline')}</h4><ul class="tl mt-s">${j.history.map(h => `<li>${t('js_' + h.st)}<small>${fmtDT(h.ts)}</small></li>`).join('')}</ul>
    <div class="sfoot">${c ? `<a class="btn ghost sm" target="_blank" rel="noopener" href="${waJobLink(j, c)}">${ic('message')} ${t('sh_wa')}</a>` : ''}
      <button type="button" class="btn ghost sm" id="jbPrint">${ic('printer')} ${t('sh_print')}</button>
      ${['repaired', 'qc'].includes(j.status) ? `<button type="button" class="btn ghost sm" id="jbQc">${ic('activity')} ${t('sh_qc')}</button>` : ''}
      ${j.certId ? `<a class="btn ghost sm" href="#certs/${j.certId}" data-close>${ic('seal')} ${t('sh_viewCert')}</a>` : ''}
      ${inv ? `<button type="button" class="btn ghost sm" id="jbInvView">${ic('receipt')} ${t('sh_viewInvoice')}</button>` : idx >= 3 ? `<button type="button" class="btn ghost sm" id="jbInv">${ic('receipt')} ${t('sh_invoice')}</button>` : ''}
      ${next ? `<button type="button" class="btn sm" id="jbNext">${ic('arrow-right', 'flip')} ${t('sh_moveNext', { st: t('js_' + next) })}</button>` : ''}</div>`, { wide: true });
  bindJob(sh, j, next, inv);
}

function bindJob(sh, j, next, inv) {
  const on = (id, fn) => $('#' + id, sh) && ($('#' + id, sh).onclick = fn);
  on('jbNext', () => moveJob(j, next));
  on('jbQc', () => startQc(j));
  on('jbInv', () => {
    const invoice = createInvoice(j);
    showInvoice(invoice.id);
  });
  on('jbInvView', () => showInvoice(inv.id));
  on('jbPrint', () => printDoc(jobCardPrint(j)));
  $('#jbPartSel', sh).onchange = e => e.target.value && addPartToJob(j, e.target.value);
  $$('[data-rm-part]', sh).forEach(b => (b.onclick = () => removePartFromJob(j, Number(b.dataset.rmPart))));
  $$('[data-close]', sh).forEach(a => (a.onclick = closeModal));
}

function moveJob(j, st) {
  j.status = st;
  j.history.push({ st, ts: now() });
  if (st === 'delivered') j.paid = true;
  persist('jobs');
  logEvent('lg_jobMoved', { id: j.id, st }, 'shop');
  if (st === 'repaired') notify('nt_jobReady', { id: j.id }, { route: 'shop', key: 'ready-' + j.id });
  openJob(j.id);
  if (curRoute === 'shop') renderJobs();
}

function addPartToJob(j, pid) {
  const p = partById(pid);
  if (!p) return;
  if (p.stock <= 0) return toast(t('sh_outOfStock', { part: p.name }), 'bad');
  p.stock--;
  const line = j.parts.find(x => x.pid === pid);
  if (line) line.qty++;
  else j.parts.push({ pid, qty: 1 });
  persist('jobs', 'parts');
  logEvent('lg_partsUsed', { id: j.id, n: 1 }, 'shop');
  if (p.stock <= p.reorder) notify('nt_lowStock', { part: p.name }, { route: 'shop/parts', level: 'warn', key: 'low-' + p.id + '-' + p.stock });
  openJob(j.id);
}

function removePartFromJob(j, i) {
  const line = j.parts[i];
  const p = partById(line.pid);
  if (p) p.stock += line.qty;
  j.parts.splice(i, 1);
  persist('jobs', 'parts');
  openJob(j.id);
}

/** QC re-test: a fresh diagnostic session linked to the job, with the device pre-filled. */
function startQc(j) {
  const m = modelById(j.modelId);
  LIVE.stopAll();
  S.session = newSession({ jobId: j.id, customer: j.customer });
  if (m) S.session.claimed = { brand: m.brand, modelId: m.id, storage: m.storage[0], ram: m.ram[0], colour: '', os: '' };
  if (j.status === 'repaired') moveJobQuiet(j, 'qc');
  persist('session');
  closeModal();
  toast(t('sh_qcStarted', { id: j.id }), 'ok');
  go('diagnose/identify');
}

function moveJobQuiet(j, st) {
  j.status = st;
  j.history.push({ st, ts: now() });
  persist('jobs');
}

function waJobLink(j, c) {
  // TODO(student): sync job cards across counters and send updates through an SMS / WhatsApp Business API after staff approval.
  const tpl = S.templates[j.status] || S.templates.intake;
  const inv = S.invoices.find(i => i.jobId === j.id);
  const text = L(tpl).replace(/\{(\w+)\}/g, (m, k) => ({ name: c.name, id: j.id, device: jobDevice(j), amount: rs(inv?.total || j.estimate || 0), shop: S.settings.shop.name, phone: S.settings.shop.phone }[k] ?? m));
  return `https://wa.me/${phoneIntl(c.phone)}?text=${encodeURIComponent(text)}`;
}

async function saveJobForm(sh) {
  let cust = $('#jfCust', sh).value;
  const issue = $('#jfIssue', sh).value.trim();
  if (!issue) return toast(t('sh_needIssue'), 'bad');
  if (cust === '__new') {
    const name = $('#jfName', sh).value.trim();
    if (!name) return toast(t('sh_needCustomer'), 'bad');
    cust = uid('cu');
    S.customers.push({ id: cust, name, phone: $('#jfPhone', sh).value.trim(), area: '' });
  }
  if (!cust) return toast(t('sh_needCustomer'), 'bad');
  const imei = $('#jfImei', sh).value.replace(/\D/g, '');
  const n = Math.max(1059, ...S.jobs.map(j => Number(String(j.id).replace(/\D/g, '')) || 0)) + 1;
  const job = { id: 'J-' + n, customer: cust, modelId: $('#jfModel', sh).value, issue, status: 'intake', opened: now(), history: [{ st: 'intake', ts: now() }], parts: [],
    labour: Number($('#jfLab', sh).value) || 0, estimate: Number($('#jfEst', sh).value) || 0, imeiMasked: maskImei(imei), imeiHash: imei && hasCrypto() ? await imeiHash(imei) : '', notes: '', paid: false };
  S.jobs.push(job);
  persist('jobs', 'customers');
  logEvent('lg_jobCreated', { id: job.id }, 'shop');
  toast(t('sh_jobSaved', { id: job.id }), 'ok');
  closeModal();
  go('shop/jobs');
}

// ---------- invoices ----------
function invoiceFromJob(j, parts = S.parts) {
  const lines = j.parts.map(x => {
    const p = parts.find(q => q.id === x.pid);
    return { name: p ? p.name : x.pid, qty: x.qty, price: p ? p.price : 0 };
  });
  if (j.labour) lines.push({ name: 'labour', qty: 1, price: j.labour });
  const total = sum(lines.map(l => l.qty * l.price));
  return { jobId: j.id, customer: j.customer, lines, total, paid: j.paid };
}

function createInvoice(j) {
  const n = Math.max(300, ...S.invoices.map(i => Number(i.id.replace(/\D/g, '')) || 0)) + 1;

/** Group certificates and job cards by IMEI hash. */
function passports() {
  const map = new Map();
  const get = (hash, masked) => {
    if (!map.has(hash)) map.set(hash, { hash, masked, certs: [], jobs: [] });
    return map.get(hash);
  };
  for (const c of allCerts()) if (c.doc.imei?.hash) get(c.doc.imei.hash, c.doc.imei.masked).certs.push(c);
  for (const j of S.jobs) if (j.imeiHash) get(j.imeiHash, j.imeiMasked).jobs.push(j);
  return [...map.values()].map(p => {
    p.certs.sort((a, b) => Date.parse(a.doc.issued) - Date.parse(b.doc.issued));
    const last = p.certs[p.certs.length - 1];
    p.device = last ? certDevice(last.doc.device) : jobDevice(p.jobs[0]);
    p.updated = Math.max(0, ...p.certs.map(c => Date.parse(c.doc.issued)), ...p.jobs.map(j => j.history[j.history.length - 1].ts));
    return p;
  }).sort((a, b) => b.certs.length - a.certs.length || b.updated - a.updated);
}

function sparkSvg(scores) {
  if (scores.length < 2) return '';
  const W = 240;
  const H = 46;
  const pts = scores.map((s, i) => `${((i / (scores.length - 1)) * (W - 10) + 5).toFixed(1)},${(H - 6 - (s / 100) * (H - 12)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" class="spark" aria-label="${t('pp_trend')}"><polyline points="${pts}" fill="none" stroke="var(--copper)" stroke-width="2.2" data-draw stroke-linejoin="round"/>
    ${scores.map((s, i) => `<circle cx="${((i / (scores.length - 1)) * (W - 10) + 5).toFixed(1)}" cy="${(H - 6 - (s / 100) * (H - 12)).toFixed(1)}" r="3" fill="var(--copper)"/>`).join('')}</svg>`;
}

function passportCard(p) {
  const last = p.certs[p.certs.length - 1];
  return `<button type="button" class="card hov" data-pp="${p.hash}" style="text-align:start;cursor:pointer;color:inherit;font:inherit">
    <div class="row" style="flex-wrap:nowrap">${last ? `<span class="mini-seal g-${last.doc.grade}">${last.doc.grade}</span>` : `<span class="mini-seal">${ic('wrench')}</span>`}
      <div class="grow"><b>${esc(p.device)}</b><div class="tiny mono muted">${esc(p.masked || '')} · ${esc(p.hash.slice(0, 10))}…</div></div></div>
    <div class="row mt-s"><span class="chip">${t('pp_certs', { n: p.certs.length })}</span><span class="chip copper">${t('pp_repairs', { n: p.jobs.length })}</span></div>
    ${sparkSvg(p.certs.map(c => c.doc.score))}</button>`;
}

function renderPassport() {
  const list = passports();
  $('#view').innerHTML = `<div class="phead"><div><div class="eyebrow">${ic('passport')} ${t('nav_passport')}</div><h2>${t('nav_passport')}</h2><p>${t('pp_sub')}</p></div>
      <button type="button" class="btn ghost" id="ppImport">${ic('upload')} ${t('pp_import')}</button></div>
    <section class="card mb"><h3>${ic('search')} ${t('pp_lookup')}</h3><div class="row"><input class="inp mono ltr" id="ppImei" inputmode="numeric" maxlength="15" style="max-width:280px" aria-label="${t('im_1')}" placeholder="35…">
      <button type="button" class="btn" id="ppFind">${ic('search')} ${t('pp_lookupBtn')}</button><span class="small" id="ppMsg" aria-live="polite"></span></div>
      <p class="tiny muted mt-s">${t('pp_hashNote')}</p></section>
    <div class="ppl stagger" id="ppList">${list.map(passportCard).join('') || `<div class="empty card">${ic('passport')}${t('pp_none')}</div>`}</div>`;
  $$('[data-pp]').forEach(b => (b.onclick = () => openPassport(b.dataset.pp)));
  $('#ppFind').onclick = findPassport;
  $('#ppImport').onclick = () => pickFile('application/json,.json', importPassport);
}

async function findPassport() {
  const imei = $('#ppImei').value.replace(/\D/g, '');
  if (!hasCrypto() || imei.length < 14) return;
  const h = await imeiHash(imei);
  const p = passports().find(x => x.hash === h);
  $('#ppMsg').textContent = p ? t('pp_found', { n: p.certs.length + p.jobs.length }) : t('pp_notFound');
  if (p) openPassport(h);
}

function openPassport(hash) {
  const p = passports().find(x => x.hash === hash);
  if (!p) return;
  const events = [...p.certs.map(c => ({ ts: Date.parse(c.doc.issued), html: `<a href="#certs/${c.id}" data-close>${t('pp_cert', { serial: esc(c.doc.serial), g: c.doc.grade })}</a> · ${esc(c.doc.shop.name)}` })),
    ...p.jobs.map(j => ({ ts: j.opened, html: `${t('pp_job', { id: esc(j.id), issue: esc(j.issue) })} · ${t('js_' + j.status)}` }))].sort((a, b) => a.ts - b.ts);
  const sh = openModal(`${sheetHead(esc(p.device), 'passport')}<p class="small mono muted">${esc(p.masked)} · ${esc(p.hash)}</p>
    ${p.certs.length > 1 ? `<h4 class="small">${t('pp_trend')}</h4>${sparkSvg(p.certs.map(c => c.doc.score))}` : ''}
    <h4 class="small mt">${t('pp_history')}</h4><ul class="tl mt-s">${events.map(e => `<li>${e.html}<small>${fmtDT(e.ts)}</small></li>`).join('')}</ul>
    <div class="sfoot"><button type="button" class="btn ghost" data-close>${t('close')}</button><button type="button" class="btn" id="ppExport">${ic('download')} ${t('pp_export')}</button></div>`);
  $$('a[data-close]', sh).forEach(a => (a.onclick = closeModal));
  $('#ppExport', sh).onclick = () => exportPassport(p);
  $$('polyline[data-draw]', sh).forEach(drawPath);
}

function exportPassport(p) {
  const out = { app: 'marammat', type: 'passport', version: 1, exportedAt: new Date().toISOString(), imeiHash: p.hash, masked: p.masked, device: p.device,
    certificates: p.certs.map(c => ({ doc: c.doc, qr: c.qr })), repairs: p.jobs.map(j => ({ id: j.id, issue: j.issue, status: j.status, opened: j.opened, shop: S.settings.shop.name })) };
  downloadFile(`marammat-passport-${p.hash.slice(0, 8)}.json`, JSON.stringify(out, null, 1));
  logEvent('lg_passportExported', { h: p.hash.slice(0, 8) }, 'passport');
}

/** Import: every certificate is verified against the trusted directory before it is listed as received. */
async function importPassport(text) {
  let o;
  try {
    o = JSON.parse(text);
  } catch {
    o = null;
  }
  if (!o || o.app !== 'marammat' || o.type !== 'passport' || !Array.isArray(o.certificates)) return toast(t('pp_badFile'), 'bad');
  let added = 0;
  let ok = 0;
  for (const c of o.certificates) {
    if (allCerts().some(x => x.qr === c.qr)) continue;
    const r = await verifyCertificate(c.qr, c.doc);
    if (['valid', 'expired'].includes(r.verdict)) ok++;
    S.received.push({ id: uid('rc'), doc: c.doc, qr: c.qr, issuedAt: Date.parse(c.doc.issued), receivedAt: now(), verdict: r.verdict });
    added++;
  }
  persist('received');
  logEvent('lg_passportImported', { n: added }, 'passport');
  toast(t('pp_imported', { n: added, ok }), 'ok');
  rerender();
}

function inboxAlerts() {
  const lvl = { warn: 'alert', info: 'info', bad: 'alert-circle' };
  $('#ibBody').innerHTML = `<section class="card"><div class="between mb"><h3>${ic('bell')} ${t('ib_alerts')}</h3><div class="row"><button type="button" class="btn ghost sm" id="ibRead">${ic('check')} ${t('ib_markAll')}</button>
      <button type="button" class="btn ghost sm" id="ibClear">${ic('trash')} ${t('ib_clear')}</button></div></div>
    <div class="list-rows stagger">${S.inbox.map(n => `<a href="#${n.route || 'inbox'}" data-n="${n.id}">${ic(lvl[n.level] || 'info', n.level === 'warn' ? 'c-warn' : 'c-cyan')}
      <div class="grow"><div class="t" style="font-weight:${n.read ? 500 : 750};white-space:normal">${t(n.k, n.vars)}</div><div class="sub">${ago(n.ts)}</div></div>${n.read ? '' : '<span class="dot live"></span>'}</a>`).join('') || `<div class="empty">${ic('bell')}${t('ib_empty')}</div>`}</div></section>`;
  $$('[data-n]').forEach(a => (a.onclick = () => {
    const n = S.inbox.find(x => x.id === a.dataset.n);
    n.read = true;
    persist('inbox');
    updateBadges();
  }));
  $('#ibRead').onclick = () => {
    S.inbox.forEach(n => (n.read = true));
    persist('inbox');
    rerender();
  };
  $('#ibClear').onclick = () => {
    S.inbox = [];
    persist('inbox');
    rerender();
  };
}

function inboxLog() {
  const byDay = {};
  for (const e of S.log) (byDay[isoDay(e.ts)] = byDay[isoDay(e.ts)] || []).push(e);
  $('#ibBody').innerHTML = `<section class="card"><div class="between mb"><h3>${ic('history')} ${t('ib_log')}</h3><div class="row"><button type="button" class="btn ghost sm" id="ibCsv">${ic('download')} ${t('ib_csv')}</button>
      <button type="button" class="btn ghost sm" id="ibPrint">${ic('printer')} ${t('ib_print')}</button></div></div>
    ${Object.entries(byDay).map(([d, list]) => `<h4 class="small muted mt">${fmtDate(Date.parse(d))}</h4><ul class="tl mt-s">${list.map(e => `<li>${esc(logText(e))}<small>${fmtTime(e.ts)} · ${esc(e.kind)}</small></li>`).join('')}</ul>`).join('') || `<div class="empty">${ic('history')}${t('ib_empty')}</div>`}</section>`;
  $('#ibCsv').onclick = () => downloadFile('marammat-log.csv', 'time,kind,event\n' + S.log.map(e => [new Date(e.ts).toISOString(), e.kind, '"' + logText(e).replace(/"/g, '""') + '"'].join(',')).join('\n'), 'text/csv');
  $('#ibPrint').onclick = () => printDoc(`<div class="pdoc"><h1>${t('ib_log')} — ${esc(S.settings.shop.name)}</h1><table><tbody>${S.log.map(e => `<tr><td>${fmtDT(e.ts)}</td><td>${esc(e.kind)}</td><td>${esc(logText(e))}</td></tr>`).join('')}</tbody></table></div>`);
}

/** Periodic shop checks: certificates near expiry and jobs stuck waiting for parts. */
function refreshNotices() {
  for (const c of S.certs) {
    const left = Date.parse(c.doc.expires) - now();
    if (left > 0 && left < 10 * DAY && !isRevoked(c)) notify('nt_certExpiring', { serial: c.doc.serial }, { route: 'certs/' + c.id, level: 'warn', key: 'exp-' + c.doc.serial });
  }
  for (const j of S.jobs) if (j.status === 'waiting' && jobDays(j) >= 5) notify('nt_waiting', { id: j.id, d: jobDays(j) }, { route: 'shop', level: 'warn', key: 'wait-' + j.id });
  if (!S.settings.lastBackup || now() - S.settings.lastBackup > 7 * DAY) notify('nt_backup', {}, { route: 'settings', key: 'backup-' + isoDay(now()).slice(0, 7) });
}

function bindSettings() {
  const st = S.settings;
  const save = (k, v) => {
    st[k] = v;
    persist('settings');
    applyPrefs();
    rerender();
  };
  const seg = (id, fn) => $$(`#${id} button`).forEach(b => (b.onclick = () => fn(b.dataset.v)));
  seg('stLang', v => setLang(v));
  seg('stTheme', v => save('theme', v));
  seg('stSize', v => save('size', v));
  $('#stCalm').onchange = e => save('calm', e.target.checked);
  const shopField = (id, k) => ($('#' + id).onchange = e => {
    st.shop[k] = e.target.value.trim();
    persist('settings');
    const mine = S.trust.find(x => x.mine && x.kid === S.shopKey?.kid);
    if (mine && (k === 'name' || k === 'city')) (mine[k] = st.shop[k]), persist('trust');
    toast(t('saved'), 'ok');
  });
  shopField('stName', 'name');
  shopField('stCity', 'city');
  shopField('stPhone', 'phone');
  shopField('stTester', 'tester');
  $('#stExpiry').onchange = e => ((st.expiryDays = clamp(Number(e.target.value) || 30, 1, 365)), persist('settings'));
  $('#stDemo').onchange = async e => {
    await setDemo(e.target.checked);
    rerender();
  };
  $('#stRotate').onclick = rotateKey;
  $('#stExport').onclick = exportData;
  $('#stImport').onclick = () => pickFile('application/json,.json', importData);
  $('#stReset').onclick = resetAll;
  $('#stTour').onclick = startTour;
  $('#stKeys').onclick = openShortcuts;
}

async function showPermissions() {
  const box = $('#stPerms');
  const rows = [];
  for (const name of ['camera', 'microphone', 'geolocation']) {
    let state = 'unknown';
    try {
      state = (await navigator.permissions.query({ name })).state;
    } catch {
      state = 'unknown';
    }
    rows.push(`<div class="lr">${ic({ camera: 'camera', microphone: 'mic', geolocation: 'locate' }[name])}<span class="grow">${t('perm_' + name)}</span>
      <span class="chip ${{ granted: 'pass', denied: 'fail', prompt: 'cyan' }[state] || ''}">${t('perm_' + state)}</span></div>`);
  }
  if (box) box.innerHTML = rows.join('');
}

async function rotateKey() {
  if (!(await askConfirm(t('set_rotateAsk'), { okText: t('set_rotate'), icon: 'key' }))) return;
  S.shopKey = null;
  const k = await ensureShopKey();
  toast(t('set_rotated', { kid: k.kid }), 'ok');
  rerender();
}

// ---------- export / import / reset ----------
function exportData() {
  const data = {};
  for (const k of KEYS) data[k] = S[k];
  downloadFile(`marammat-backup-${isoDay(now())}.json`, JSON.stringify({ app: 'marammat', version: 1, exportedAt: new Date().toISOString(), data }, null, 1));
  S.settings.lastBackup = now();
  persist('settings');
  logEvent('lg_exported', {}, 'settings');
  rerender();
}

async function importData(text) {
  let o;
  try {
    o = JSON.parse(text);
  } catch {
    o = null;
  }
  if (!o || o.app !== 'marammat' || !o.data) return toast(t('set_badFile'), 'bad');
  if (!(await askConfirm(t('set_importAsk'), { okText: t('set_import'), icon: 'upload' }))) return;
  for (const k of KEYS) if (o.data[k] !== undefined) store.set(k, o.data[k]);
  S = loadState();
  logEvent('lg_imported', {}, 'settings');
  applyPrefs();
  toast(t('set_imported'), 'ok');
  go('home');
}

async function resetAll() {
  if (!(await askConfirm(t('set_resetAsk'), { danger: true, okText: t('set_reset'), icon: 'refresh', typed: 'RESET' }))) return;
  LIVE.stopAll();
  for (const k of store.keys()) if (k !== 'lang') store.del(k);
  await seedApp();
  applyPrefs();
  go('home');
}

function paletteIndex() {
  const items = [];
  const add = (group, icon, label, sub, run) => items.push({ group, icon, label, sub, run });
  Object.keys(ROUTES).forEach(r => add('sg_pages', ROUTES[r].icon, t('nav_' + r), '', () => go(r)));
  STEPS.forEach((s, i) => add('sg_steps', s.icon, `${i + 1}. ${t('st_' + s.id)}`, t('nav_diagnose'), () => go('diagnose/' + s.id)));
  add('sg_actions', 'kanban', t('hm_job'), '', () => openJobForm());
  add('sg_actions', 'refresh', t('wz_newSession'), '', () => startNewSession());
  add('sg_actions', 'alert', t('vf_sample'), t('nav_verify'), () => {
    VER.input = tamperedSample() || '';
    VER.result = null;
    go('verify');
  });
  add('sg_actions', 'sparkles', t('replayTour'), '', startTour);
  add('sg_actions', 'keyboard', t('shortcuts'), '?', openShortcuts);
  allCerts().forEach(c => add('sg_certs', 'seal', `${c.doc.serial} · ${certDevice(c.doc.device)}`, `${c.doc.grade} · ${c.doc.shop.name}`, () => go('certs/' + c.id)));
  S.jobs.forEach(j => add('sg_jobs', 'wrench', `${j.id} · ${jobDevice(j)}`, `${custById(j.customer)?.name || ''} · ${t('js_' + j.status)}`, () => {
    go('shop');
    setTimeout(() => openJob(j.id), 80);
  }));
  S.customers.forEach(c => add('sg_people', 'user', c.name, c.phone, () => go('shop/customers')));
  S.parts.forEach(p => add('sg_parts', 'package', p.name, `${t('pa_stock')}: ${p.stock}`, () => go('shop/parts')));
  MODELS.forEach(m => add('sg_models', 'smartphone', `${m.brand} ${m.name}`, rs(m.price), () => {
    VAL.modelId = m.id;
    go('value');
  }));
  return items;
}

  const draw = () => {
    const q = $('#palIn').value.trim().toLowerCase();
    palItems = (q ? index.filter(i => (i.label + ' ' + i.sub).toLowerCase().includes(q)) : index.filter(i => ['sg_pages', 'sg_actions'].includes(i.group))).slice(0, 40);
    palSel = 0;
    let last = '';
    $('#palRes').innerHTML = palItems.map((it, i) => {
      const head = it.group !== last ? `<div class="pg">${t(it.group)}</div>` : '';
      last = it.group;
      return `${head}<button type="button" role="option" data-i="${i}" class="${i === 0 ? 'on' : ''}">${ic(it.icon)}<span dir="auto">${esc(it.label)}</span><small dir="auto">${esc(it.sub)}</small></button>`;
    }).join('') || `<div class="empty">${t('sg_none')}</div>`;
    $$('#palRes [data-i]').forEach(b => (b.onclick = () => runPal(Number(b.dataset.i))));
    if (q) announce(t('sg_count', { n: palItems.length }));
  };
  $('#palIn').oninput = draw;
  $('#palIn').onkeydown = palKeys;
  p.onclick = e => e.target === p && closePalette();
  draw();
  setTimeout(() => $('#palIn').focus(), 30);
}

function palKeys(e) {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    palSel = clamp(palSel + (e.key === 'ArrowDown' ? 1 : -1), 0, palItems.length - 1);
    $$('#palRes [data-i]').forEach(b => b.classList.toggle('on', Number(b.dataset.i) === palSel));
    $('#palRes .on')?.scrollIntoView({ block: 'nearest' });
  }
  if (e.key === 'Enter' && palItems[palSel]) runPal(palSel);
}

function runPal(i) {
  const it = palItems[i];
  closePalette();
  if (it) it.run();
}

function closePalette() {
  const p = $('#palette');
  if (!p.classList.contains('on')) return;
  p.classList.remove('on');
  p.innerHTML = '';
}

// ---------- onboarding spotlight tour ----------
const TOUR = [
  { sel: '#railNav [data-nav="diagnose"], #tabs [data-nav="diagnose"]', k: 'tour1' },
  { sel: '#homeDut', k: 'tour2' },
  { sel: '#homeCaps', k: 'tour3' },
  { sel: '#railNav [data-nav="certs"], #tabs [data-nav="certs"]', k: 'tour4' },
  { sel: '#railNav [data-nav="verify"], #tabs [data-nav="verify"]', k: 'tour5' },
  { sel: '#railNav [data-nav="shop"], #tabMore', k: 'tour6' },
  { sel: '#langBtn', k: 'tour7' },
  { sel: '#searchBtn', k: 'tour8' },
];
let tourStep = -1;
const visibleEl = sel => $$(sel).find(el => el.getClientRects().length && getComputedStyle(el).visibility !== 'hidden');

function startTour() {
  closeModal();
  closePalette();
  if (curRoute !== 'home') go('home');
  tourStep = 0;
  $('#tour').classList.add('on');
  setTimeout(showTourStep, 380);
}

function endTour() {
  tourStep = -1;
  $('#tour').classList.remove('on');
  S.settings.tourDone = true;
  persist('settings');
}

function placeTip(el) {
  const rect = el.getBoundingClientRect();
  const tip = $('#tourTip');
  const p = 6;
  Object.assign($('#tourSpot').style, { left: rect.left - p + 'px', top: rect.top - p + 'px', width: rect.width + p * 2 + 'px', height: rect.height + p * 2 + 'px' });
  const tw = Math.min(340, window.innerWidth - 32);
  const below = rect.bottom + 16;
  const top = below + tip.offsetHeight + 12 < window.innerHeight ? below : Math.max(12, rect.top - 16 - tip.offsetHeight);
  const left = clamp(rect.left + rect.width / 2 - tw / 2, 16, window.innerWidth - tw - 16);
  Object.assign(tip.style, { top: top + 'px', left: left + 'px' });
}

function showTourStep() {
  const step = TOUR[tourStep];
  if (!step) return endTour();
  const el = visibleEl(step.sel);
  if (!el) {
    tourStep++;
    return showTourStep();
  }
  if (!el.closest('.tabs, .rail, .top')) el.scrollIntoView({ block: 'center', behavior: 'instant' });
  const last = tourStep === TOUR.length - 1;
  $('#tourTip').innerHTML = `<span class="tag">${t('stepXofY', { x: tourStep + 1, y: TOUR.length })}</span><h4>${t(step.k + 't')}</h4><p>${t(step.k + 'b')}</p>
    <div class="between"><div class="dots">${TOUR.map((_, i) => `<i class="${i === tourStep ? 'on' : ''}"></i>`).join('')}</div>
    <div class="row"><button type="button" class="btn ghost sm" id="tourSkip">${t('skip')}</button>${tourStep ? `<button type="button" class="btn ghost sm" id="tourBack" aria-label="${t('back')}">${ic('chevron-left', 'flip')}</button>` : ''}
    <button type="button" class="btn sm" id="tourNext">${last ? t('done') : t('next')} ${ic(last ? 'check' : 'chevron-right', last ? '' : 'flip')}</button></div></div>`;
  placeTip(el);
  $('#tourSkip').onclick = endTour;
  $('#tourNext').onclick = () => {
    tourStep++;
    showTourStep();
  };
  if ($('#tourBack')) $('#tourBack').onclick = () => {
    tourStep--;
    showTourStep();
  };
  $('#tourNext').focus({ preventScroll: true });
}
window.addEventListener('resize', debounce(() => tourStep >= 0 && showTourStep(), 150));

// ---------- keyboard shortcuts ----------
const KEY_PAGES = ['home', 'diagnose', 'certs', 'verify', 'value', 'repair', 'shop', 'passport', 'safety'];

function openShortcuts() {
  const row = (keys, k) => `<div class="setrow"><span>${t(k)}</span><span class="row">${keys.map(x => `<span class="kbd">${x}</span>`).join('')}</span></div>`;
  openModal(`${sheetHead(t('shortcuts'), 'keyboard')}${row(['/', 'Ctrl K'], 'ks_search')}${row(['1', '…', '9'], 'ks_pages')}${row(['D'], 'ks_diag')}${row(['V'], 'ks_verify')}
    ${row(['N'], 'ks_job')}${row(['[', ']'], 'ks_steps')}${row(['L'], 'ks_lang')}${row(['T'], 'ks_theme')}${row(['?'], 'ks_help')}${row(['Esc'], 'ks_close')}`);
}

function onKey(e) {
  if (FS.on) {
    if (e.key === 'Escape') return closeFs();
    return FS.onKey?.(e);
  }
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = ['input', 'textarea', 'select'].includes(tag);
  if (e.key === 'Escape') {
    if (tourStep >= 0) return endTour();
    if ($('#palette').classList.contains('on')) return closePalette();
    return closeModal();
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    return openPalette();
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || modalOpen() || tourStep >= 0) return;
  shortcutKey(e);
}

function shortcutKey(e) {
  const k = e.key.toLowerCase();
  if (e.key === '?') return openShortcuts();
  if (e.key === '/') {
    e.preventDefault();
    return openPalette();
  }
  if (k === 'd') return go('diagnose');
  if (k === 'v') return go('verify');
  if (k === 'n') return openJobForm();
  if (k === 'l') return setLang(lang === 'ur' ? 'en' : 'ur');
  if (k === 't') return toggleTheme();
  if ((e.key === '[' || e.key === ']') && curRoute === 'diagnose') {
    const s = STEPS[stepIndex(WZ.step) + (e.key === ']' ? 1 : -1)];
    if (s) go('diagnose/' + s.id);
  }
  if (/^[1-9]$/.test(k)) go(KEY_PAGES[Number(k) - 1]);
}

function go(path) {
  if (location.hash.slice(1) === path) route();
  else location.hash = path;
}

function route() {
  const [name, ...rest] = (location.hash.slice(1) || 'home').split('/');
  const r = ROUTES[name] ? name : 'home';
  renderRoute(r, decodeURIComponent(rest.join('/')));
}

function renderRoute(r, arg) {
  const same = r === curRoute && arg === curArg;
  LIVE.stopAll();
  closeFs();
  curRoute = r;
  curArg = arg;
  closePalette();
  if (!same) closeModal();
  ROUTES[r].r(arg || undefined);
  $('#pageTitle').textContent = r === 'diagnose' ? `${t('nav_diagnose')} · ${t('st_' + WZ.step)}` : t('nav_' + r);
  document.title = r === 'home' ? `${t('appName')} — ${t('tagline')} | FYP Template` : `${t('nav_' + r)} — ${t('appName')} | FYP Template`;
  renderNav();
  updateBadges();
  renderBanner();
  if (!same) {
    window.scrollTo(0, 0);
    animateIn($('#view'));
  } else settle($('#view'));
}

function rerender() {
  if (!curRoute) return;
  const y = window.scrollY;
  renderRoute(curRoute, curArg);
  window.scrollTo(0, y);
}

function updateBadges() {
  const n = unreadCount();
  $('#bellBadge').textContent = n > 99 ? '99+' : n;
  $('#bellBadge').classList.toggle('hidden', !n);
  $('#bellBtn').setAttribute('aria-label', t('notificationsN', { n }));
}

  h.classList.toggle('calm', !!s.calm);
  $$('[data-i18n]').forEach(el => (el.textContent = t(el.dataset.i18n)));
  $('#langBtn').textContent = lang === 'ur' ? 'EN' : 'اردو';
  $('#langBtn').setAttribute('aria-label', t('switchLang'));
  $('#searchBtn').setAttribute('aria-label', t('searchAll'));
  $('#themeBtn').setAttribute('aria-label', t('switchTheme'));
  $('#themeBtn').innerHTML = ic(s.theme === 'bench' ? 'sun' : 'moon');
  $('#skipLink').textContent = t('skipToContent');
  $('#palette').setAttribute('aria-label', t('search'));
  $('#fs').setAttribute('aria-label', t('fsLabel'));
  $('meta[name="theme-color"]').content = s.theme === 'bench' ? '#121519' : '#f3f1ec';
}

function setLang(l) {
  lang = l;
  store.set('lang', l);
  applyPrefs();
  rerender();
  if (tourStep >= 0) showTourStep();
}

function toggleTheme() {
  S.settings.theme = S.settings.theme === 'bench' ? 'workshop' : 'bench';
  persist('settings');
  applyPrefs();
  if (curRoute === 'certs' || curRoute === 'settings' || curRoute === 'home') rerender();
}

function bindShell() {
  $('#searchBtn').onclick = openPalette;
  $('#bellBtn').onclick = () => go('inbox');
  $('#langBtn').onclick = () => setLang(lang === 'ur' ? 'en' : 'ur');
  $('#themeBtn').onclick = toggleTheme;
  $('#scrim').onclick = () => {
    closePalette();
    closeModal();
  };
  $('#modal').addEventListener('click', e => e.target === $('#modal') && closeModal());
  document.addEventListener('keydown', onKey);
  window.addEventListener('hashchange', route);
  window.addEventListener('afterprint', () => ($('#printArea').innerHTML = ''));
}

/** First run: build the demo bench (keys, signed certificates, jobs, parts) and store it. */
async function seedApp() {
  const seed = await demoSeed();
  S = {
    settings: { ...DEFAULT_SETTINGS, shop: { ...seed.shop } },
    session: demoSession(),
    certs: seed.certs,
    received: [],
    trust: seed.trust,
    shopKey: seed.shopKey,
    revoked: seed.revoked,
    jobs: seed.jobs,
    customers: seed.customers,
    parts: seed.parts,
    invoices: seed.invoices,
    templates: defaultTemplates(),
    buyer: {},
    inbox: seed.inbox,
    log: seed.log,
    meta: { created: now(), seq: 60, version: 1 },
  };
  persistAll();
}

async function boot() {
  lang = store.get('lang', 'en') === 'ur' ? 'ur' : 'en';
  $('#view').innerHTML = `<div class="card"><div class="skeleton" style="height:120px;border-radius:12px"></div><p class="muted mt">${t('loading')}</p></div>`;
  S = loadState();
  if (!S) await seedApp();
  applyPrefs();
  bindShell();
  refreshNotices();
  setInterval(refreshNotices, HOUR);
  route();
  if (!location.hash && !S.settings.tourDone) setTimeout(startTour, 900);
}

boot();
</script>
</body>
</html>
