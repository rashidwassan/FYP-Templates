<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual Science Lab</title>
<meta name="description" content="Fourteen interactive physics, chemistry and biology simulations for schools without laboratories: pendulum, projectile, Ohm's law, waves, lenses, Hooke's law, Newton's second law, electromagnetic induction, titration, gas laws, reaction rate, electrolysis, osmosis and enzyme activity, with measurement tools, data tables with regression, live graphs, bilingual theory, worksheets, quizzes, a printable lab manual and a local teacher mode.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#f4f4f1;--paper:#fff;--ink:#15161a;--muted:#6b6e78;--line:#dcdde3;
  --graphite:#23252d;--graphite-2:#2f323c;--graphite-3:#3b3f4b;
  --acid:#c8e24a;--acid-deep:#8da315;--acid-soft:#f1f7d3;
  --blue:#3b82f6;--blue-soft:#dbeafe;--red:#ef4444;--red-soft:#fee2e2;--amber:#f59e0b;--amber-soft:#fef3c7;
  --violet:#8b5cf6;--violet-soft:#ede9fe;--green:#22c55e;--green-soft:#dcfce7;
  --radius:16px;--shadow:0 16px 40px -28px rgba(21,22,26,.35);
  --font:"Figtree",system-ui,sans-serif;--display:"Space Grotesk","Figtree",sans-serif;--font-ur:"Noto Nastaliq Urdu",serif;
  --ease:cubic-bezier(.2,.8,.2,1);--dur:.35s;
}
/* settings: high contrast and large text */
:root[data-contrast=on]{--bg:#ffffff;--muted:#3a3d47;--line:#8a8e9a;--acid-deep:#5f7004;--shadow:none}
:root[data-text=large]{font-size:17px}
:root[data-motion=off] *,:root[data-motion=off] *::before,:root[data-motion=off] *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}

*{box-sizing:border-box}
html{font-size:15px}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--display);line-height:1.15;letter-spacing:-.01em}
.ur{font-family:var(--font-ur);line-height:1.9;direction:rtl;text-align:right}
.muted{color:var(--muted)}
.hidden{display:none!important}
.small{font-size:.84rem}
.ic{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}

/* ---------- motion kit ---------- */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.enter{animation:fadeUp var(--dur) var(--ease) both}
.stagger>*{animation:fadeUp .45s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
.card,.tile{transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s}
.card:hover{transform:translateY(-2px)}
.fill,.bar>i{transition:width .6s var(--ease)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
.side{background:var(--graphite);color:#e9eaee;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brand .logo{width:40px;height:40px;border-radius:12px;background:var(--acid);display:grid;place-items:center;color:var(--graphite);flex:none}
.brand h1{font-size:1.05rem;color:#fff}
.brand small{display:block;font-size:.72rem;color:#aab0bf;font-family:var(--font)}
.side h3{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:#8d93a3;margin:12px 8px 4px;font-family:var(--font)}
.exp{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;color:#d7dae2;cursor:pointer;border:1px solid transparent;transition:background .2s,transform .15s;min-height:44px}
.exp:hover{background:var(--graphite-2)}
.exp.on{background:var(--graphite-3);border-color:#4a4f5e;color:#fff}
.exp .icw{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--graphite-2);color:var(--acid);flex:none}
.exp.on .icw{background:var(--acid);color:var(--graphite)}
.exp b{display:block;font-size:.92rem;font-weight:600}
.exp small{color:#9aa0b0;font-size:.74rem}
.exp .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:#4a4f5e;flex:none}
.exp .dot.done{background:var(--acid)}
.exp .badge{margin-left:auto;background:var(--acid);color:var(--graphite);border-radius:999px;font-size:.7rem;font-weight:800;padding:1px 7px;flex:none}
.side .foot{margin-top:auto;display:grid;gap:8px;padding-top:12px}
.sbtn{border:1px solid #4a4f5e;background:var(--graphite-2);color:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center;font-weight:600;min-height:40px}

/* ---------- main ---------- */
main{padding:20px 22px 60px;max-width:1240px;min-width:0}
.view{display:none}
.view.on{display:block}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.head h2{font-size:1.6rem}
.head p{margin:4px 0 0;color:var(--muted);max-width:720px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.74rem;font-weight:700;background:var(--paper);border:1px solid var(--line);color:var(--muted)}
.pill.phys{color:#2563eb}
.pill.chem{color:#b45309}
.pill.bio{color:#15803d}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.stage{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);position:relative}
.stage canvas{display:block;width:100%;height:auto}
.stage canvas.tooling{cursor:grab;touch-action:none}
.transport{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:#fafaf8;flex-wrap:wrap}
.btn{border:0;border-radius:11px;padding:9px 14px;font-weight:700;cursor:pointer;background:var(--graphite);color:#fff;display:inline-flex;align-items:center;gap:8px;min-height:40px;transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.acid{background:var(--acid);color:var(--graphite)}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#b91c1c}
.btn.sm{padding:6px 10px;font-size:.84rem;border-radius:9px;min-height:36px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.on{background:var(--graphite);color:var(--acid)}
.speed{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);margin-left:auto}
.speed input{width:90px;accent-color:var(--acid-deep)}
.assign{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--acid-soft);border:1px solid #d6e39a;border-radius:12px;padding:8px 12px;margin-bottom:12px;font-size:.9rem}
.assign b{font-family:var(--display)}

/* ---------- controls ---------- */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
aside>.panel+.panel{margin-top:12px}
.panel h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-family:var(--font);margin-bottom:10px}
.panel h3.plain{text-transform:none;letter-spacing:0;font-size:1.1rem;color:var(--ink);font-family:var(--display)}
.ctl{margin-bottom:12px}
.ctl label{display:flex;justify-content:space-between;gap:8px;font-size:.86rem;font-weight:600;margin-bottom:4px}
.ctl label span.v{font-family:var(--display);color:var(--acid-deep);font-variant-numeric:tabular-nums}
.ctl input[type=range]{width:100%;accent-color:var(--acid-deep)}
.ctl select{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);min-height:40px}
.ctl.locked{opacity:.7}
.ctl.locked label span.v{color:var(--muted)}
.reads{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.read{background:var(--bg);border-radius:12px;padding:10px 12px;min-width:0}
.read .l{font-size:.72rem;color:var(--muted);font-weight:600}
.read .v{font-family:var(--display);font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums;transition:color .2s;overflow-wrap:anywhere}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.laps{margin:8px 0 0;padding:0;list-style:none;font-size:.84rem;display:grid;gap:4px;font-variant-numeric:tabular-nums}
.laps li{display:flex;justify-content:space-between;background:var(--bg);border-radius:8px;padding:4px 10px}
.swatch{display:flex;gap:8px;align-items:center;font-size:.84rem;margin-top:8px;flex-wrap:wrap}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;margin:16px 0 10px;border-bottom:1px solid var(--line);overflow:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;display:inline-flex;gap:7px;align-items:center;white-space:nowrap;min-height:44px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acid)}
.tabpane{display:none}
.tabpane.on{display:block;animation:fadeIn .3s var(--ease)}
.graphwrap{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
.graphwrap canvas{width:100%;height:260px;display:block}
.graphbar{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.fitinfo{font-family:var(--display);font-size:.9rem;color:#b45309;background:var(--amber-soft);border-radius:8px;padding:3px 8px}
.theory{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr 1fr;gap:18px}
.theory .f{font-family:var(--display);font-size:1.15rem;background:var(--acid-soft);border-radius:10px;padding:8px 12px;display:inline-block;margin:6px 0}
.theory .model{border-left:3px solid var(--acid);padding:6px 12px;margin-top:10px;font-size:.9rem;color:var(--muted);background:var(--bg);border-radius:0 10px 10px 0}
.theory .ur .model{border-left:0;border-right:3px solid var(--acid);border-radius:10px 0 0 10px}
.termlinks{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.termlinks button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px;font-size:.8rem;cursor:pointer;font-weight:600}

/* ---------- data table ---------- */
.dtable{overflow:auto;border:1px solid var(--line);border-radius:12px;margin-top:10px}
table.data{width:100%;border-collapse:collapse;font-size:.84rem;min-width:520px}
table.data th,table.data td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
table.data th{background:var(--bg);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
table.data tr:last-child td{border-bottom:0}
table.data .x{border:0;background:none;cursor:pointer;color:var(--muted);padding:2px;min-height:0}
.regrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px;align-items:end}
.regrow label{font-size:.8rem;font-weight:600;display:grid;gap:4px}
.regrow select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);min-height:40px;max-width:100%}
.stat{background:var(--bg);border-radius:12px;padding:10px 12px}
.stat .l{font-size:.72rem;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--display);font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}

/* ---------- worksheet & quiz ---------- */
.q{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:36px 1fr;gap:12px}
.q .n{width:32px;height:32px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700;font-family:var(--display)}
.q.ok{border-color:var(--green)}
.q.ok .n{background:var(--green-soft);color:#15803d}
.q.bad{border-color:var(--red)}
.q.bad .n{background:var(--red-soft);color:#b91c1c}
.q input[type=number]{width:140px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px}
.q .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.q .why{margin-top:8px;font-size:.86rem;background:var(--bg);border-radius:10px;padding:8px 10px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:600;min-height:40px}
.opt.on{background:var(--graphite);color:#fff;border-color:var(--graphite)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.miss{border-color:var(--red);background:var(--red-soft)}
.score{display:flex;align-items:center;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.ring{width:64px;height:64px;flex:none}
.quizhead{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:12px;box-shadow:var(--shadow)}
.quizhead .big{font-family:var(--display);font-size:1.6rem;font-weight:700}

/* ---------- report ---------- */
.report{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.report table{width:100%;border-collapse:collapse;font-size:.9rem}
.report td,.report th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.report input[type=text]{border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:260px;max-width:100%;min-height:40px}
.report h3{font-size:1rem;margin:14px 0 6px}

/* ---------- about ---------- */
.todo{border:1px dashed var(--graphite);border-radius:12px;padding:12px 14px;background:var(--paper)}
.todo h4{font-size:.95rem;display:flex;gap:8px;align-items:center;margin-bottom:4px;font-family:var(--font)}
.tag{font-size:.68rem;background:var(--graphite);color:var(--acid);border-radius:6px;padding:2px 6px;font-weight:700}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px;align-items:start}
.list{display:grid;gap:10px}

/* ---------- pages (glossary, manual, teacher, log, settings) ---------- */
.page{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.page>*,.two>*,.lab>*{min-width:0}
.pagehead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.pagehead h2{font-size:1.5rem}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search],.toolbar input[type=text],.toolbar input[type=date],.toolbar select,.field input,.field select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper);min-height:40px;max-width:100%}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.84rem;min-height:36px}
.chip.on{background:var(--graphite);color:#fff;border-color:var(--graphite)}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.term{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.term h4{font-size:1rem;display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.term h4 .ur{font-size:1rem;font-weight:400}
.term p{margin:6px 0 0;font-size:.9rem}
.term .ur{margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .l{font-size:.74rem;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--display);font-size:1.5rem;font-weight:700}
.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--acid-deep)}
.field{display:grid;gap:4px;font-size:.84rem;font-weight:600}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end}
.checks{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.checks label{display:flex;gap:8px;align-items:center;font-size:.88rem;background:var(--bg);border-radius:10px;padding:8px 10px;cursor:pointer;min-height:40px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.code{font-family:var(--display);font-weight:700;letter-spacing:.08em;background:var(--graphite);color:var(--acid);border-radius:8px;padding:3px 10px}
.pin{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pin input{width:120px;font-family:var(--display);font-size:1.3rem;letter-spacing:.3em;text-align:center}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch .t{font-weight:600}
.switch .d{font-size:.82rem;color:var(--muted)}
.tog{width:46px;height:26px;border-radius:999px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}
.tog.on{background:var(--acid-deep)}
.tog.on::after{transform:translateX(20px)}
.logrow{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.logrow .icw{width:36px;height:36px;border-radius:10px;background:var(--acid-soft);color:var(--acid-deep);display:grid;place-items:center}
.logrow time{font-size:.78rem;color:var(--muted);white-space:nowrap}
.manual{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.manual article{padding:18px 0;border-top:1px solid var(--line)}
.manual article:first-of-type{border-top:0}
.manual h3{font-size:1.2rem}
.manual h4{font-size:.86rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 0 4px;font-family:var(--font)}
.manual ol,.manual ul{margin:4px 0;padding-left:22px}
.manual .ur ol,.manual .ur ul{padding-left:0;padding-right:22px}
.manual table{width:100%;border-collapse:collapse;font-size:.86rem;margin-top:6px;table-layout:fixed}
.manual th{font-size:.76rem;overflow-wrap:anywhere;vertical-align:bottom}
.manual th:first-child{width:56px}
.manual td,.manual th{border:1px solid var(--line);padding:6px 8px;text-align:left;height:30px}
.manual .cover{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;padding-bottom:16px}
.manual .cover .f{display:inline-block;min-width:160px;border-bottom:1px solid var(--ink);margin-left:6px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;font-size:.9rem}
kbd{font-family:var(--display);font-size:.8rem;background:var(--bg);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:2px 7px;min-width:28px;text-align:center;display:inline-block}

/* ---------- toasts, modal, tour ---------- */
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:grid;gap:8px;z-index:80;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--graphite);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;animation:fadeUp .25s var(--ease);display:flex;gap:8px;align-items:center}
.toast.ok{background:#15803d}
.toast.bad{background:#b91c1c}
.toast.out{opacity:0;transition:opacity .3s}
.modal{position:fixed;inset:0;background:rgba(21,22,26,.55);display:none;place-items:center;z-index:70;padding:16px}
.modal.on{display:grid;animation:fadeIn .2s}
.sheet{background:var(--paper);border-radius:16px;padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto;animation:pop .25s var(--ease);box-shadow:0 30px 80px -30px rgba(0,0,0,.5)}
.sheet h3{font-size:1.15rem;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#tour{position:fixed;inset:0;z-index:75;display:none}
#tour.on{display:block}
.spot{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgba(21,22,26,.62);transition:top .3s var(--ease),left .3s var(--ease),width .3s var(--ease),height .3s var(--ease);pointer-events:none;border:2px solid var(--acid)}
.tcard{position:fixed;background:var(--paper);border-radius:14px;padding:16px 18px;width:min(340px,calc(100vw - 32px));box-shadow:0 30px 60px -20px rgba(0,0,0,.5);animation:pop .3s var(--ease)}
.tcard h4{font-size:1.05rem;margin-bottom:6px}
.tcard p{margin:0 0 12px;font-size:.9rem;color:var(--muted)}
.tcard .steps{font-size:.76rem;color:var(--muted);margin-left:auto;font-family:var(--display)}

/* ---------- links, mobile nav, dashboard charts ---------- */
a.exp{text-decoration:none}
a{color:#2563eb}
.code{white-space:nowrap}
.mnav{display:none;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin:0 0 10px}
.mnav a{display:grid;justify-items:center;gap:2px;padding:6px 2px;border-radius:10px;background:var(--paper);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:.68rem;font-weight:700;min-height:44px;min-width:0}
.mnav a span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mnav a.on{background:var(--graphite);color:var(--acid);border-color:var(--graphite)}
.hbar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 44px;gap:8px;align-items:center;font-size:.84rem;margin-bottom:6px}
.hbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar b{text-align:right;font-family:var(--display)}
.cols{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:4px}
.cols .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:.74rem;min-width:0}
.cols .col i{display:block;width:100%;background:var(--acid-deep);border-radius:6px 6px 0 0;transition:height .6s var(--ease);min-height:2px}
.cols .col span{color:var(--muted);white-space:nowrap}
.pagehead h2 .ic,.panel h3 .ic{color:var(--acid-deep)}
.page .panel h3{display:flex;gap:8px;align-items:center}

/* ---------- mobile ---------- */
.mobilebar{display:none;gap:6px;overflow:auto;padding:0 0 10px;scrollbar-width:none}
.mobilebar::-webkit-scrollbar{display:none}
.mobilebar .exp{flex:none;background:var(--paper);color:var(--ink);border:1px solid var(--line);padding:7px 10px}
.mobilebar .exp .icw{background:var(--bg);color:var(--acid-deep)}
.mobilebar .exp.on{background:var(--graphite);color:#fff}
.mobilebar .exp.on .icw{background:var(--acid);color:var(--graphite)}
.mobilebar .exp small,.mobilebar .exp .dot,.mobilebar .exp .badge{display:none}
@media (max-width:1000px){
  .shell{grid-template-columns:minmax(0,1fr)}
  main{min-width:0;padding:14px 14px 60px}
  .side{display:none}
  .mobilebar{display:flex}
  .mnav{display:grid}
  .lab{grid-template-columns:minmax(0,1fr)}
  .theory{grid-template-columns:1fr}
  .reads{grid-template-columns:1fr 1fr}
  .manual{padding:14px}
}
@media (max-width:480px){
  .head h2{font-size:1.3rem}
  .speed{margin-left:0;width:100%}
  .speed input{flex:1}
}

/* ---------- print ---------- */
@media print{
  body.printing *{visibility:hidden}
  body.printing .print-target,body.printing .print-target *{visibility:visible}
  body.printing .print-target{position:absolute;left:0;top:0;width:100%;border:0;box-shadow:none;padding:0}
  .noprint{display:none!important}
  .manual article{break-inside:avoid}
}

<script>
'use strict';
/* =====================================================================
   Virtual Science Lab — single file, vanilla JS, canvas 2D, localStorage
   Sections: utils · i18n · drawing helpers · EXPS (14 experiments) · quiz bank ·
   glossary · runner · measurement tools · graph + regression · data table ·
   tabs (theory, worksheet, quiz, report, about) · pages (glossary, manual,
   teacher, log, settings) · tour + shortcuts · navigation + routing · boot
   Student extension points are listed in the About tab and README.
   ===================================================================== */
// ---------- utils ----------
const NS = 'vlab:';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

// namespaced localStorage wrapper; every key below lives under "vlab:"
const store = {
  get(k, d) {
    try {
      const v = localStorage.getItem(NS + k);
      return v == null ? d : JSON.parse(v);
    } catch {
      return d;
    }
  },
  set(k, v) {
    try {
      localStorage.setItem(NS + k, JSON.stringify(v));
    } catch {
      /* storage full or blocked: the app keeps working in memory */
    }
  },
  del(k) {
    try {
      localStorage.removeItem(NS + k);
    } catch {}
  },
  keys() {
    const out = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(NS)) out.push(k.slice(NS.length));
      }
    } catch {}
    return out;
  },
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const ic = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const fmt = (v, d = 2) => (Number.isFinite(v) ? (Math.abs(v) >= 1000 ? v.toFixed(0) : v.toFixed(d)) : '—');
const rad = d => (d * Math.PI) / 180;
const deg = r => (r * 180) / Math.PI;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// first number inside a readout string such as "2.00 s" or "—"
function numOf(v) {
  if (typeof v === 'number') return Number.isFinite(v) ? v : NaN;
  const m = String(v ?? '')
    .replace('−', '-')
    .match(/-?\d+(\.\d+)?(e[-+]?\d+)?/i);
  return m ? parseFloat(m[0]) : NaN;
}

function toast(m, type = '', icon = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = (icon ? ic(icon) : '') + esc(m);
  $('#toasts').append(el);
  setTimeout(() => el.classList.add('out'), 2300);
  setTimeout(() => el.remove(), 2700);
}

function download(name, text, type = 'text/plain') {
  const blob = new Blob([text], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// seeded pseudo-random generator so demo data is identical on every device
function seededRandom(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

// least-squares straight line through {x, y} points
function linreg(points) {
  const pts = points.filter(p => Number.isFinite(p.x) && Number.isFinite(p.y));
  const n = pts.length;
  if (n < 2) return null;
  let sx = 0;
  let sy = 0;
  let sxx = 0;
  let sxy = 0;
  let syy = 0;
  for (const p of pts) {
    sx += p.x;
    sy += p.y;
    sxx += p.x * p.x;
    sxy += p.x * p.y;
    syy += p.y * p.y;
  }
  const den = n * sxx - sx * sx;
  if (Math.abs(den) < 1e-12) return null;
  const m = (n * sxy - sx * sy) / den;
  const c = (sy - m * sx) / n;
  const ssTot = syy - (sy * sy) / n;
  let ssRes = 0;
  for (const p of pts) ssRes += (p.y - (m * p.x + c)) ** 2;
  const r2 = ssTot > 1e-12 ? 1 - ssRes / ssTot : 1;
  return { m, c, r2, n };
}

// mark an element for printing: only .print-target is visible in print CSS
function printSection(el) {
  el.classList.add('print-target');
  document.body.classList.add('printing');
  const cleanup = () => {
    el.classList.remove('print-target');
    document.body.classList.remove('printing');
    window.removeEventListener('afterprint', cleanup);
  };
  window.addEventListener('afterprint', cleanup);
  setTimeout(cleanup, 4000);
  window.print();
}

const settings = store.get('settings', {});

function grid(ctx, W, H, step = 20) {
  ctx.save();
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);
  if (settings.grid !== false) {
    ctx.lineWidth = 1;
    gridLines(ctx, W, H, step, '#eef0f3');
    gridLines(ctx, W, H, step * 5, '#e1e4ea');
  }
  ctx.restore();
}

function gridLines(ctx, W, H, step, color) {
  ctx.strokeStyle = color;
  for (let x = 0; x <= W; x += step) {
    ctx.beginPath();
    ctx.moveTo(x + 0.5, 0);
    ctx.lineTo(x + 0.5, H);
    ctx.stroke();
  }
  for (let y = 0; y <= H; y += step) {
    ctx.beginPath();
    ctx.moveTo(0, y + 0.5);
    ctx.lineTo(W, y + 0.5);
    ctx.stroke();
  }
}

function line(ctx, x1, y1, x2, y2, color = '#23252d', w = 2) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = w;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.restore();
}

function arrow(ctx, x1, y1, x2, y2, color, w = 2) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  const h = 9;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = w;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - h * Math.cos(a - 0.4), y2 - h * Math.sin(a - 0.4));
  ctx.lineTo(x2 - h * Math.cos(a + 0.4), y2 - h * Math.sin(a + 0.4));
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function label(ctx, text, x, y, color = '#15161a', size = 12, align = 'left') {
  ctx.save();
  ctx.fillStyle = color;
  ctx.font = `600 ${size}px Figtree, "Noto Nastaliq Urdu", system-ui, sans-serif`;
  ctx.textAlign = align;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function dashed(ctx, x1, y1, x2, y2, color, w = 1.5) {
  ctx.save();
  ctx.setLineDash([5, 5]);
  ctx.strokeStyle = color;
  ctx.lineWidth = w;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.restore();
}

function circle(ctx, x, y, r, fill, stroke, w = 2) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) {
    ctx.fillStyle = fill;
    ctx.fill();
  }
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = w;
    ctx.stroke();
  }
  ctx.restore();
}

function box(ctx, x, y, w, h, fill, stroke, r = 0, lw = 2) {
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  if (fill) {
    ctx.fillStyle = fill;
    ctx.fill();
  }
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lw;
    ctx.stroke();
  }
  ctx.restore();
}

// zig-zag spring between (x, y0) and (x, y1)
function spring(ctx, x, y0, y1, width = 22, turns = 14, color = '#3b3f4b') {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(x, y0);
  const len = y1 - y0;
  const lead = Math.min(14, len * 0.1);
  ctx.lineTo(x, y0 + lead);
  const body = len - 2 * lead;
  for (let i = 0; i < turns; i++) {
    const yy = y0 + lead + (body * (i + 0.5)) / turns;
    ctx.lineTo(x + (i % 2 ? width / 2 : -width / 2), yy);
  }
  ctx.lineTo(x, y1 - lead);
  ctx.lineTo(x, y1);
  ctx.stroke();
  ctx.restore();
}

// cold-to-hot colour as rgb string for a 0..1 fraction
function heatColor(frac, alpha = 1) {
  const f = clamp(frac, 0, 1);
  const r = Math.round(239 * f + 59 * (1 - f));
  const g = Math.round(68 * f + 130 * (1 - f));
  const b = Math.round(68 * f + 246 * (1 - f));
  return `rgba(${r},${g},${b},${alpha})`;
}

// small analogue meter with a needle; frac in -1..1
function meter(ctx, x, y, r, frac, title, color = '#2563eb') {
  ctx.save();
  circle(ctx, x, y, r, '#fff', '#23252d', 2.5);
  ctx.strokeStyle = '#dcdde3';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(x, y, r - 8, Math.PI * 1.2, Math.PI * 1.8);
  ctx.stroke();
  const a = Math.PI * 1.5 + clamp(frac, -1, 1) * Math.PI * 0.3;
  line(ctx, x, y, x + (r - 10) * Math.cos(a), y + (r - 10) * Math.sin(a), color, 2.5);
  circle(ctx, x, y, 3, '#23252d');
  label(ctx, title, x, y + r - 8, '#23252d', 12, 'center');
  ctx.restore();
}

EXPS.push({
  id: 'pendulum',
  subject: 'physics',
  icon: 'timer',
  title: { en: 'Simple pendulum', ur: 'سادہ پینڈولم' },
  intro: {
    en: 'Measure the period of a swinging bob and discover how it depends on length and gravity, not on mass.',
    ur: 'جھولتے بوب کا دورانیہ ناپیں اور دیکھیں کہ یہ لمبائی اور کششِ ثقل پر منحصر ہے، کمیت پر نہیں۔',
  },
  params: [
    { k: 'L', label: { en: 'Length L (m)', ur: 'لمبائی L (میٹر)' }, min: 0.5, max: 3, step: 0.1, def: 1, reinit: true },
    {
      k: 'g',
      type: 'select',
      label: { en: 'Gravity g', ur: 'کششِ ثقل g' },
      options: [
        ['9.81', 'Earth 9.81'],
        ['1.62', 'Moon 1.62'],
        ['3.71', 'Mars 3.71'],
        ['24.79', 'Jupiter 24.79'],
      ],
      def: '9.81',
      reinit: true,
    },
    { k: 'th0', label: { en: 'Release angle (°)', ur: 'چھوڑنے کا زاویہ (°)' }, min: 5, max: 70, step: 1, def: 20, reinit: true },
    { k: 'b', label: { en: 'Damping', ur: 'رگڑ' }, min: 0, max: 0.5, step: 0.01, def: 0.02 },
  ],
  init(p) {
    return { th: rad(p.th0), w: 0, t: 0, series: [], last: null, periods: [], trail: [] };
  },
  step(s, p, dt) {
    const g = +p.g;
    const a = -(g / p.L) * Math.sin(s.th) - p.b * s.w;
    const prev = s.th;
    s.w += a * dt;
    s.th += s.w * dt;
    s.t += dt;
    // zero crossing from negative to positive marks one full period
    if (prev < 0 && s.th >= 0) {
      if (s.last != null) s.periods.push(s.t - s.last);
      s.last = s.t;
      if (s.periods.length > 5) s.periods.shift();
    }
    if (s.series.length === 0 || s.t - s.series[s.series.length - 1].x > 0.03) {
      s.series.push({ x: s.t, y: deg(s.th) });
    }
    if (s.series.length > 400) s.series.shift();
  },
  ppm(H) {
    return (H - 110) / 3.2;
  },
  scaleOf(s, p, W, H) {
    return { ppu: this.ppm(H) / 100, unit: 'cm' };
  },
  draw(ctx, s, p, W, H) {
    grid(ctx, W, H);
    const px = W / 2;
    const py = 40;
    const len = p.L * this.ppm(H);
    const bx = px + len * Math.sin(s.th);
    const by = py + len * Math.cos(s.th);
    dashed(ctx, px, py, px, py + len + 10, '#b9bec9');
    ctx.strokeStyle = '#8d93a3';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(px, py, 26, Math.PI / 2 - 0.6, Math.PI / 2 + 0.6);
    ctx.stroke();
    ctx.fillStyle = '#23252d';
    ctx.fillRect(px - 50, py - 10, 100, 8);
    s.trail.push([bx, by]);
    if (s.trail.length > 70) s.trail.shift();
    s.trail.forEach(([x, y], i) => circle(ctx, x, y, 3, `rgba(141,163,21,${(i / s.trail.length) * 0.5})`));
    line(ctx, px, py, bx, by, '#3b3f4b', 2);
    const gr = ctx.createRadialGradient(bx - 5, by - 5, 2, bx, by, 16);
    gr.addColorStop(0, '#dff08a');
    gr.addColorStop(1, '#8da315');
    circle(ctx, bx, by, 15, gr);
    label(ctx, `θ = ${deg(s.th).toFixed(1)}°`, px + 34, py + 22, '#6b6e78');
    label(ctx, `L = ${p.L} m`, 14, H - 14, '#6b6e78');
  },
  readouts(s, p) {
    const g = +p.g;

    return [
      { l: { en: 'Measured period', ur: 'ناپا گیا دورانیہ' }, v: Tm ? fmt(Tm) + ' s' : '…' },
      { l: { en: 'T = 2π√(L/g)', ur: 'T = 2π√(L/g)' }, v: fmt(T0) + ' s' },
      { l: { en: 'Large-angle T', ur: 'بڑے زاویے کا T' }, v: fmt(Tc) + ' s' },
      { l: { en: 'Time', ur: 'وقت' }, v: fmt(s.t, 1) + ' s' },
    ];
  },
  graph: { x: { en: 'time (s)', ur: 'وقت (s)' }, y: { en: 'angle (°)', ur: 'زاویہ (°)' }, window: 10 },
  theory: {
    en: 'For small angles the restoring force is proportional to displacement, so the motion is simple harmonic with period T = 2π√(L/g). The period does not depend on the mass of the bob or (for small angles) on the amplitude. Doubling L multiplies T by √2. Measure T over several swings and rearrange to find g = 4π²L/T².',
    ur: 'چھوٹے زاویوں پر بحالی قوت ہٹاؤ کے متناسب ہوتی ہے، اس لیے حرکت سادہ ہارمونک ہے اور دورانیہ T = 2π√(L/g) ہے۔ دورانیہ بوب کی کمیت یا (چھوٹے زاویوں پر) جھولے کی وسعت پر منحصر نہیں۔ L دگنا کریں تو T √2 گنا ہو جاتا ہے۔ کئی جھولوں پر T ناپ کر g = 4π²L/T² نکالیں۔',
    f: 'T = 2π √(L / g)',
  },

  launch(s, p) {

  step(s, p, dt) {
    if (!s.flying) return;
    const g = +p.g;

    s.vy += (-g - p.k * sp * s.vy) * dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;

  drawField(ctx, ox, oy, sc, W, H, p) {

EXPS.push({
  id: 'ohm',
  subject: 'physics',
  icon: 'zap',
  title: { en: "Ohm's law circuit", ur: 'اوہم کا قانون — سرکٹ' },
  intro: {
    en: 'Change the voltage and resistors, watch the current and bulb brightness respond, and verify V = IR for series and parallel combinations.',
    ur: 'وولٹیج اور مزاحمت بدلیں، کرنٹ اور بلب کی روشنی دیکھیں، اور V = IR کو سیریز اور پیرالل میں جانچیں۔',
  },
  params: [
    { k: 'V', label: { en: 'Battery V (volt)', ur: 'بیٹری V (وولٹ)' }, min: 0, max: 12, step: 0.5, def: 6 },
    {
      k: 'mode',
      type: 'select',
      label: { en: 'Circuit', ur: 'سرکٹ' },
      options: [
        ['single', 'Single resistor'],
        ['series', 'R1 + R2 in series'],
        ['parallel', 'R1 ∥ R2 parallel'],
      ],
      def: 'single',
    },
    { k: 'R1', label: { en: 'R1 (Ω)', ur: 'R1 (Ω)' }, min: 1, max: 100, step: 1, def: 10 },
    { k: 'R2', label: { en: 'R2 (Ω)', ur: 'R2 (Ω)' }, min: 1, max: 100, step: 1, def: 20 },
  ],
  R(p) {
    if (p.mode === 'single') return p.R1;
    if (p.mode === 'series') return p.R1 + p.R2;
    return (p.R1 * p.R2) / (p.R1 + p.R2);
  },
  init() {
    return { t: 0, e: Array.from({ length: 28 }, (_, i) => i / 28), series: [] };
  },
  step(s, p, dt) {
    const I = p.V / this.R(p);
    s.t += dt;
    s.e = s.e.map(u => (u + I * 0.04 * dt + 1) % 1);
    s.series = Array.from({ length: 25 }, (_, i) => ({ x: i * 0.5, y: (i * 0.5) / this.R(p) }));
  },
  draw(ctx, s, p, W, H) {
    grid(ctx, W, H);
    const x0 = 70;
    const y0 = 70;
    const x1 = W - 70;
    const y1 = H - 70;
    const I = p.V / this.R(p);
    ctx.strokeStyle = '#23252d';
    ctx.lineWidth = 3;
    ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
    this.drawBattery(ctx, x0, (y0 + y1) / 2, p);
    this.drawResistors(ctx, (x0 + x1) / 2, y0, p);
    this.drawBulb(ctx, x1, (y0 + y1) / 2, p.V * I, p);
    const mid = (x0 + x1) / 2;
    circle(ctx, mid, y1, 22, '#fff', '#23252d', 3);
    label(ctx, 'A', mid, y1 + 5, '#23252d', 14, 'center');
    label(ctx, `I = ${I.toFixed(2)} A`, mid, y1 + 40, '#2563eb', 13, 'center');
    label(ctx, `V = ${p.V.toFixed(1)} V across R`, mid, y0 - 44, '#b45309', 12, 'center');
    this.drawElectrons(ctx, s, x0, y0, x1, y1);
  },
  drawBattery(ctx, x0, cy, p) {
    ctx.fillStyle = '#fff';
    ctx.fillRect(x0 - 16, cy - 24, 32, 48);
    line(ctx, x0 - 14, cy - 10, x0 + 14, cy - 10, '#23252d', 4);
    line(ctx, x0 - 7, cy + 10, x0 + 7, cy + 10, '#23252d', 8);
    label(ctx, `${p.V} V`, x0 - 24, cy - 30, '#23252d', 13, 'center');
  },
  zigzag(ctx, x, y, len, lab) {
    ctx.save();
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 4, y - 12, len + 8, 24);
    ctx.strokeStyle = '#8da315';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x, y);
    for (let i = 0; i < 8; i++) ctx.lineTo(x + (len * (i + 0.5)) / 8, y + (i % 2 ? 10 : -10));
    ctx.lineTo(x + len, y);
    ctx.stroke();
    ctx.restore();
    label(ctx, lab, x + len / 2, y - 18, '#6b6e78', 12, 'center');
  },
  drawResistors(ctx, mid, y0, p) {
    const len = 90;
    if (p.mode === 'single') {
      this.zigzag(ctx, mid - len / 2, y0, len, `R1 = ${p.R1} Ω`);
    } else if (p.mode === 'series') {
      this.zigzag(ctx, mid - len - 20, y0, len, `R1 = ${p.R1} Ω`);
      this.zigzag(ctx, mid + 20, y0, len, `R2 = ${p.R2} Ω`);
    } else {
      ctx.fillStyle = '#fff';
      ctx.fillRect(mid - 110, y0 - 2, 220, 4);
      ctx.strokeStyle = '#23252d';
      ctx.lineWidth = 3;
      ctx.strokeRect(mid - 100, y0 - 30, 200, 60);
      this.zigzag(ctx, mid - len / 2, y0 - 30, len, `R1 = ${p.R1} Ω`);
      this.zigzag(ctx, mid - len / 2, y0 + 30, len, `R2 = ${p.R2} Ω`);
    }
  },
  drawBulb(ctx, x1, by, P, p) {
    const glow = Math.min(1, P / (P + 6));
    if (p.V > 0) {
      const gr = ctx.createRadialGradient(x1, by, 10, x1, by, 70);
      gr.addColorStop(0, `rgba(255,220,80,${0.9 * glow})`);
      gr.addColorStop(1, 'rgba(255,220,80,0)');
      circle(ctx, x1, by, 70, gr);
    }
    circle(ctx, x1, by, 22, `rgba(255,${200 + 55 * glow},${120 + 120 * (1 - glow)},1)`, '#23252d', 3);
    line(ctx, x1 - 12, by - 12, x1 + 12, by + 12, '#23252d', 3);
    line(ctx, x1 + 12, by - 12, x1 - 12, by + 12, '#23252d', 3);
    label(ctx, `${P.toFixed(2)} W`, x1 + 30, by + 4, '#6b6e78', 12);
  },
  drawElectrons(ctx, s, x0, y0, x1, y1) {
    const w = x1 - x0;
    const h = y1 - y0;
    const per = 2 * w + 2 * h;
    s.e.forEach(u => {
      const d = u * per;
      let x;
      let y;
      if (d < w) {
        x = x1 - d;
        y = y1;
      } else if (d < w + h) {
        x = x0;
        y = y1 - (d - w);
      } else if (d < 2 * w + h) {
        x = x0 + (d - w - h);
        y = y0;
      } else {
        x = x1;
        y = y0 + (d - 2 * w - h);
      }
      circle(ctx, x, y, 4, '#3b82f6');
    });
  },
  readouts(s, p) {
    const R = this.R(p);
    const I = p.V / R;
    return [
      { l: { en: 'Total resistance', ur: 'کل مزاحمت' }, v: fmt(R, 1) + ' Ω' },

  init() {
    return { t: 0, series: [] };
  },
  calc(p) {
    const f = p.type === 'convex' ? p.f : -p.f;
    const di = Math.abs(p.do - f) < 1e-6 ? Infinity : 1 / (1 / f - 1 / p.do);
    const m = Number.isFinite(di) ? -di / p.do : Infinity;
    return { f, di, m, hi: Number.isFinite(di) ? m * p.ho : Infinity };
  },
  step(s, p, dt) {
    s.t += dt;
    const f = p.type === 'convex' ? p.f : -p.f;
    s.series = [];
    for (let i = 0; i < 50; i++) {
      const d = 3 + i * 1.2;
      if (Math.abs(d - f) < 0.01) continue;
      const di = 1 / (1 / f - 1 / d);
      if (Math.abs(di) <= 200) s.series.push({ x: d, y: di });

  geom(p, W, H) {

      ctx.quadraticCurveTo(cx + 4, cy, cx - 14, top);

  },
  drawImage(ctx, p, g, di, hi, ox, oy, H) {

    const nature = virtual ? { en: 'virtual image', ur: 'مجازی عکس' } : { en: 'real image', ur: 'حقیقی عکس' };
    label(ctx, L(nature), ix, iy + (hi > 0 ? -8 : 16), virtual ? '#b45309' : '#b91c1c', 11, 'center');

  flux(x, p) {
    return ((p.B / 1000) * this.A) / (1 + (x / this.w) ** 2);

  dflux(x, p) {
    const u = x / this.w;

    let vInst = 0;
    if (p.mode === 'osc') {
      const amp = 0.12;

      vInst = amp * om * Math.cos(om * s.t);
      s.moving = true;
    } else if (s.moving) {
      s.x += s.dir * p.v * dt;
      vInst = s.dir * p.v;

        s.moving = false;

    s.t += dt;
    s.vNow = vInst;
    s.emf = -p.N * s.pol * this.dflux(s.x, p) * vInst;

  R: 8.314,
  init(p) {
    const r = Math.random;
    const parts = Array.from({ length: 60 }, (_, i) => ({ x: r(), y: r(), a: r() * Math.PI * 2, kind: i % 2 ? 'B' : 'A', done: false }));

  eaEff(p) {

  k(p) {
    return this.A0 * Math.exp(-this.eaEff(p) / (this.R * p.T));

  conc(t, p) {
    return p.c0 / (1 + this.k(p) * p.c0 * t);

    s.t += dt;

      if (q.x < 0 || q.x > 1) {
        q.a = Math.PI - q.a;
        q.x = clamp(q.x, 0, 1);
      }
      if (q.y < 0 || q.y > 1) {
        q.a = -q.a;
        q.y = clamp(q.y, 0, 1);
      }

    // the number of product pairs follows the analytic second-order curve exactly

          best = [a, b];

    best[0].done = true;
    best[1].done = true;

    best[1].y = best[0].y;
    best[1].a = best[0].a;

// ---------- runner state ----------
const cv = $('#cv');
const gv = $('#gv');
let ctx = cv.getContext('2d');
let gctx = gv.getContext('2d');
const STEP = 1 / 240;
const sim = { exp: null, s: null, p: {}, running: true, speed: settings.speed || 1, acc: 0, last: 0, W: 800, H: 500, GW: 0, readAt: 0 };
const labView = $('#labView');
const labVisible = () => labView.classList.contains('on');

// ---------- motion helpers ----------
function animateIn(root) {
  root.classList.remove('enter');
  void root.offsetWidth;
  root.classList.add('enter');
  $$('.stagger', root).forEach(g => [...g.children].forEach((el, i) => el.style.setProperty('--i', Math.min(i, 12))));
}

function countUp(el, to, { dur = 700, dec = 0, suffix = '' } = {}) {
  const t0 = performance.now();
  const tick = now => {
    const k = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    el.textContent = (to * e).toFixed(dec) + suffix;
    if (k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

// ---------- activity log helper ----------
const LOG_MAX = 300;
// exp: an experiment id, null for app-wide events, or omitted to use the current experiment
function logEvent(type, msg, exp) {
  const log = store.get('log', []);
  log.unshift({ at: nowIso(), type, msg, exp: exp === undefined ? (sim.exp?.id ?? null) : exp });
  if (log.length > LOG_MAX) log.length = LOG_MAX;
  store.set('log', log);
}

// ---------- teacher locks & assignments (read by the runner) ----------
const teacherStore = () => store.get('teacher', { pin: null, locks: {}, assignments: [] });

function activeAssignment() {
  const code = store.get('assign', null);
  if (!code) return null;
  return teacherStore().assignments.find(a => a.code === code) || null;
}

// locks set by the teacher for everyone, plus the locks carried by the active assignment
function locksFor(id) {
  const out = { ...(teacherStore().locks?.[id] || {}) };
  const a = activeAssignment();
  if (a && a.exp === id) Object.assign(out, a.locks || {});
  return out;
}

// ---------- parameters ----------
function paramsFor(e) {
  const saved = store.get('p:' + e.id, {});
  const locks = locksFor(e.id);
  const p = {};
  e.params.forEach(q => {
    const v = locks[q.k] ?? saved[q.k] ?? q.def;
    p[q.k] = q.type === 'select' ? String(v) : clampParam(q, +v);
  });
  return p;
}

function clampParam(q, v) {
  return Number.isFinite(v) ? clamp(v, q.min, q.max) : q.def;
}

function enforceLocks() {
  const locks = locksFor(sim.exp.id);
  Object.entries(locks).forEach(([k, v]) => {
    const q = sim.exp.params.find(x => x.k === k);
    if (q) sim.p[k] = q.type === 'select' ? String(v) : +v;
  });
}

// re-read parameters after locks or the assignment change
function reloadParams() {
  if (!sim.exp) return;
  sim.p = paramsFor(sim.exp);
  renderControls();
  renderAssignBar();
  reset();
}

// ---------- lifecycle ----------
function resize() {
  const wrap = cv.parentElement;
  if (!wrap.clientWidth) return;
  const dpr = Math.min(2, devicePixelRatio || 1);
  const W = wrap.clientWidth;
  const H = Math.round(Math.max(320, Math.min(520, W * 0.6)));
  cv.width = W * dpr;
  cv.height = H * dpr;
  cv.style.height = H + 'px';
  ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sim.W = W;
  sim.H = H;
  const gw = gv.parentElement.clientWidth - 24;
  if (gw > 0) {
    gv.width = gw * dpr;
    gv.height = 260 * dpr;
    gctx = gv.getContext('2d');
    gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sim.GW = gw;
  }
}

function loadExp(id) {
  if (!EXP[id]) id = EXPS[0].id;
  sim.exp = EXP[id];
  sim.p = paramsFor(sim.exp);
  sim.s = sim.exp.init(sim.p);
  sim.running = true;
  sim.acc = 0;
  graphFit.on = false;
  store.set('cur', id);
  renderHead();
  renderControls();
  renderActions();
  renderTabs();
  renderSide();
  renderTools();
  renderAssignBar();
  updatePlay();
  resize();
  animateIn(labView);
}

function reset() {
  sim.s = sim.exp.init(sim.p);
  sim.running = true;
  sim.acc = 0;
  updatePlay();
}

function updatePlay() {
  $('#playBtn').innerHTML = sim.running ? `${ic('pause')} ${t('pause')}` : `${ic('play')} ${t('play')}`;
}

function togglePlay() {
  sim.running = !sim.running;
  updatePlay();
}

// fixed-step integration: real time × speed is consumed in 1/240 s steps
function advance(seconds) {
  sim.acc += seconds;
  let n = 0;
  while (sim.acc > STEP && n++ < 2000) {
    sim.exp.step.call(sim.exp, sim.s, sim.p, STEP);
    sim.acc -= STEP;
    if (tools.sw.running) tools.sw.t += STEP;
  }
}

function frame(ts) {
  const dt = Math.min(0.05, (ts - sim.last) / 1000 || 0);
  sim.last = ts;
  if (sim.exp && labVisible()) {
    if (sim.running) advance(dt * sim.speed);
    sim.exp.draw.call(sim.exp, ctx, sim.s, sim.p, sim.W, sim.H);
    drawTools(ctx, sim.W, sim.H);
    if (ts - sim.readAt > 100) {
      sim.readAt = ts;
      renderReads();
      updateStopwatch();
    }
    if (curTab === 'graph') drawGraph();
  }
  requestAnimationFrame(frame);
}

// ---------- side panels ----------
let readCache = '';
function renderReads() {
  const r = sim.exp.readouts.call(sim.exp, sim.s, sim.p);
  const html = r.map(x => `<div class="read"><div class="l">${esc(L(x.l))}</div><div class="v">${esc(x.v)}</div></div>`).join('');
  if (html !== readCache) {
    $('#reads').innerHTML = html;
    readCache = html;
  }
  // TODO(student): accessibility — announce the main readout through an aria-live region on demand
  // and add graph sonification (pitch follows y) for visually impaired students.
}

function controlHtml(q, v, locked) {
  const lock = locked ? ` <span title="${esc(t('as_locked'))}">${ic('lock')}</span>` : '';
  const dis = locked ? ' disabled' : '';
  const cls = locked ? 'ctl locked' : 'ctl';
  const id = 'c-' + q.k;
  if (q.type === 'select') {
    const opts = q.options.map(([val, l]) => `<option value="${val}" ${String(v) === val ? 'selected' : ''}>${esc(l)}</option>`).join('');
    return `<div class="${cls}"><label for="${id}"><span>${esc(L(q.label))}${lock}</span></label><select id="${id}" data-k="${q.k}"${dis}>${opts}</select></div>`;
  }
  return `<div class="${cls}"><label for="${id}"><span>${esc(L(q.label))}${lock}</span><span class="v">${v}</span></label><input id="${id}" type="range" data-k="${q.k}" min="${q.min}" max="${q.max}" step="${q.step}" value="${v}"${dis}></div>`;
}

function renderControls() {
  const e = sim.exp;
  const locks = locksFor(e.id);
  $('#ctls').innerHTML = e.params.map(q => controlHtml(q, sim.p[q.k], q.k in locks)).join('');
  $$('#ctls [data-k]').forEach(el => {
    el.oninput = () => onParam(el);
  });
}

function onParam(el) {
  const q = sim.exp.params.find(x => x.k === el.dataset.k);
  sim.p[q.k] = q.type === 'select' ? el.value : +el.value;
  const v = el.parentElement.querySelector('.v');
  if (v) v.textContent = sim.p[q.k];
  store.set('p:' + sim.exp.id, sim.p);
  if (q.reinit) reset();
}

function renderActions() {
  const acts = sim.exp.actions || [];
  $('#actBtns').innerHTML = acts.map((a, i) => `<button class="btn sm" data-a="${i}">${ic(a.icon)} ${esc(L(a.l))}</button>`).join('');
  $$('#actBtns [data-a]').forEach(b => {
    b.onclick = () => {
      acts[+b.dataset.a].fn(sim.s, sim.p, sim);
      enforceLocks();
      store.set('p:' + sim.exp.id, sim.p);
      renderControls();
      sim.running = true;
      updatePlay();
    };
  });
}

function renderHead() {
  const e = sim.exp;
  const cls = { physics: 'phys', chemistry: 'chem', biology: 'bio' }[e.subject];
  $('#subjPill').className = 'pill ' + cls;
  $('#subjPill').innerHTML = `${ic(e.icon)} ${t(e.subject)}`;
  $('#expTitle').textContent = L(e.title);

function renderAssignBar() {
  const a = activeAssignment();
  const bar = $('#assignBar');
  if (!a) {
    bar.classList.add('hidden');
    return;
  }
  bar.classList.remove('hidden');
  const exp = EXP[a.exp];
  bar.innerHTML = `${ic('flag')} <span>${t('as_active')}: <b>${esc(a.title)}</b> <span class="code">${esc(a.code)}</span> · ${esc(L(exp?.title))}${a.due ? ` · ${t('as_due')} ${esc(a.due)}` : ''}</span>
    <span style="margin-left:auto" class="row">
      ${sim.exp?.id !== a.exp ? `<button class="btn ghost sm" id="asOpen">${ic('arrow-right')} ${t('as_open')}</button>` : ''}
      <button class="btn ghost sm" id="asLeave">${ic('x')} ${t('as_leave')}</button>
    </span>`;
  const open = $('#asOpen');
  if (open) open.onclick = () => go('exp/' + a.exp);

function applyAssignment(raw) {
  const code = String(raw || '')
    .trim()
    .toUpperCase();
  const a = teacherStore().assignments.find(x => x.code === code);
  if (!a) {
    toast(t('as_bad'), 'bad', 'alert');
    return false;
  }
  store.set('assign', code);
  logEvent('teacher', { en: `Joined assignment ${code}`, ur: `اسائنمنٹ ${code} میں شامل` }, a.exp);
  toast(t('as_on'), 'ok', 'flag');
  if (sim.exp?.id === a.exp) reloadParams();
  go('exp/' + a.exp);
  return true;
}

function leaveAssignment() {
  store.del('assign');
  toast(t('as_off'), '', 'flag');
  reloadParams();
}
// ---------- measurement tools: ruler, protractor, stopwatch ----------
// Positions are stored as fractions of the stage size so they survive resizes.
const TOOL_DEFAULT = {
  ruler: { on: false, a: { x: 0.2, y: 0.82 }, b: { x: 0.62, y: 0.82 } },
  prot: { on: false, c: { x: 0.5, y: 0.55 }, a: { x: 0.75, y: 0.55 }, b: { x: 0.62, y: 0.3 } },
  sw: { on: false, running: false, t: 0, laps: [] },
};

const tools = (() => {
  const saved = store.get('tools', {});
  const base = JSON.parse(JSON.stringify(TOOL_DEFAULT));
  Object.assign(base.ruler, saved.ruler || {});
  Object.assign(base.prot, saved.prot || {});
  base.sw.on = !!saved.sw?.on;
  return base;
})();
let toolDrag = null;

function saveTools() {
  store.set('tools', { ruler: tools.ruler, prot: tools.prot, sw: { on: tools.sw.on } });
}

function anyTool() {
  return tools.ruler.on || tools.prot.on;
}

function fmtClock(sec) {
  const m = Math.floor(sec / 60);
  const s = sec - m * 60;
  return m ? `${m}:${s.toFixed(2).padStart(5, '0')}` : `${s.toFixed(2)} s`;
}

// pixels per real unit, if the experiment knows its own scale
function currentScale(W, H) {
  const e = sim.exp;
  if (!e?.scaleOf) return null;
  const sc = e.scaleOf.call(e, sim.s, sim.p, W, H);
  return sc && Number.isFinite(sc.ppu) && sc.ppu > 0 ? sc : null;
}

function niceStep(v) {
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 2, 5, 10]) if (m * p >= v) return m * p;
  return 10 * p;
}

function tagLabel(c, text, x, y, color = '#23252d') {
  c.save();
  c.font = '700 12px Figtree, system-ui, sans-serif';
  const w = c.measureText(text).width + 14;
  const left = clamp(x - w / 2, 2, sim.W - w - 2);
  box(c, left, y - 15, w, 22, 'rgba(255,255,255,.92)', color, 6, 1.5);
  c.fillStyle = color;
  c.textAlign = 'left';
  c.fillText(text, left + 7, y + 1);
  c.restore();
}

function handle(c, x, y, color = '#23252d') {
  circle(c, x, y, 8, '#fff', color, 2.5);
  circle(c, x, y, 2.5, color);
}

function drawRuler(c, W, H) {
  const R = tools.ruler;
  const ax = R.a.x * W;
  const ay = R.a.y * H;
  const bx = R.b.x * W;
  const by = R.b.y * H;
  const len = Math.hypot(bx - ax, by - ay);
  const sc = currentScale(W, H);
  const ppu = sc ? sc.ppu : 1;
  const step = niceStep(7 / ppu);
  c.save();
  c.translate(ax, ay);
  c.rotate(Math.atan2(by - ay, bx - ax));
  c.fillStyle = 'rgba(250,204,21,.30)';
  c.strokeStyle = 'rgba(161,98,7,.85)';
  c.lineWidth = 1;
  c.fillRect(0, -12, len, 24);
  c.strokeRect(0, -12, len, 24);
  for (let i = 0; i * step * ppu <= len + 0.5 && i < 600; i++) {
    const x = i * step * ppu;
    c.beginPath();
    c.moveTo(x, -12);
    c.lineTo(x, -12 + (i % 5 === 0 ? 11 : 5));
    c.stroke();
  }
  c.restore();
  const val = len / ppu;
  const dec = val >= 100 ? 0 : val >= 10 ? 1 : 2;
  const txt = sc ? `${val.toFixed(dec)} ${sc.unit}` : `${len.toFixed(0)} px`;
  tagLabel(c, txt, (ax + bx) / 2, Math.min(ay, by) - 22, '#a16207');
  handle(c, ax, ay, '#a16207');
  handle(c, bx, by, '#a16207');
  circle(c, (ax + bx) / 2, (ay + by) / 2, 5, '#a16207');
}

function drawProtractor(c, W, H) {
  const P = tools.prot;
  const cx = P.c.x * W;
  const cy = P.c.y * H;
  const a1 = Math.atan2(P.a.y * H - cy, P.a.x * W - cx);
  const a2 = Math.atan2(P.b.y * H - cy, P.b.x * W - cx);
  let d = a2 - a1;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d <= -Math.PI) d += 2 * Math.PI;
  const r = 64;
  c.save();
  c.strokeStyle = 'rgba(37,99,235,.55)';
  c.lineWidth = 1;
  for (let i = 0; i < 36; i++) {
    const a = a1 + rad(i * 10) * Math.sign(d || 1);
    const len = i % 3 === 0 ? 10 : 5;
    c.beginPath();
    c.moveTo(cx + (r - len) * Math.cos(a), cy + (r - len) * Math.sin(a));
    c.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
    c.stroke();
  }
  c.fillStyle = 'rgba(59,130,246,.16)';
  c.beginPath();
  c.moveTo(cx, cy);
  c.arc(cx, cy, r, a1, a2, d < 0);
  c.closePath();
  c.fill();
  c.restore();
  line(c, cx, cy, P.a.x * W, P.a.y * H, '#2563eb', 2);
  line(c, cx, cy, P.b.x * W, P.b.y * H, '#2563eb', 2);
  const mid = a1 + d / 2;
  tagLabel(c, `θ = ${Math.abs(deg(d)).toFixed(1)}°`, cx + (r + 26) * Math.cos(mid), cy + (r + 26) * Math.sin(mid) + 4, '#2563eb');
  handle(c, cx, cy, '#2563eb');
  handle(c, P.a.x * W, P.a.y * H, '#2563eb');
  handle(c, P.b.x * W, P.b.y * H, '#2563eb');
}

function drawStopwatchBadge(c, W, H) {
  const txt = fmtClock(tools.sw.t);
  box(c, W - 122, H - 40, 112, 30, '#23252d', null, 8);
  circle(c, W - 108, H - 25, 5, tools.sw.running ? '#c8e24a' : '#6b6e78');
  label(c, txt, W - 18, H - 20, '#fff', 14, 'right');
}

function drawTools(c, W, H) {
  if (tools.ruler.on) drawRuler(c, W, H);
  if (tools.prot.on) drawProtractor(c, W, H);
  if (tools.sw.on) drawStopwatchBadge(c, W, H);
}

// ---------- tool dragging ----------
function toolHandles() {
  const out = [];
  const add = (tool, k, x, y) => out.push({ tool, k, x: x * sim.W, y: y * sim.H });
  if (tools.ruler.on) {
    const R = tools.ruler;
    add('ruler', 'a', R.a.x, R.a.y);
    add('ruler', 'b', R.b.x, R.b.y);
    add('ruler', 'm', (R.a.x + R.b.x) / 2, (R.a.y + R.b.y) / 2);
  }
  if (tools.prot.on) {
    const P = tools.prot;
    add('prot', 'c', P.c.x, P.c.y);
    add('prot', 'a', P.a.x, P.a.y);
    add('prot', 'b', P.b.x, P.b.y);
  }
  return out;
}

function canvasPoint(ev) {
  const r = cv.getBoundingClientRect();
  return { x: ev.clientX - r.left, y: ev.clientY - r.top };
}

function onToolDown(ev) {
  if (!anyTool()) return;
  const pt = canvasPoint(ev);
  const hits = toolHandles()
    .map(h => ({ ...h, d: Math.hypot(h.x - pt.x, h.y - pt.y) }))
    .filter(h => h.d < 22)
    .sort((a, b) => a.d - b.d);
  if (!hits.length) return;
  const h = hits[0];
  toolDrag = { ...h, start: pt, orig: JSON.parse(JSON.stringify(tools[h.tool])) };
  cv.setPointerCapture(ev.pointerId);
  ev.preventDefault();
}

function onToolMove(ev) {
  if (!toolDrag) return;
  const pt = canvasPoint(ev);
  const T = tools[toolDrag.tool];
  const whole = toolDrag.k === 'm' || (toolDrag.tool === 'prot' && toolDrag.k === 'c');
  if (whole) {
    const dx = (pt.x - toolDrag.start.x) / sim.W;
    const dy = (pt.y - toolDrag.start.y) / sim.H;
    Object.entries(toolDrag.orig).forEach(([k, v]) => {
      if (v && typeof v === 'object') T[k] = { x: clamp(v.x + dx, 0, 1), y: clamp(v.y + dy, 0, 1) };
    });
  } else {
    T[toolDrag.k] = { x: clamp(pt.x / sim.W, 0, 1), y: clamp(pt.y / sim.H, 0, 1) };
  }
}

function onToolUp() {
  if (!toolDrag) return;
  toolDrag = null;
  saveTools();
}

function bindToolPointer() {
  cv.addEventListener('pointerdown', onToolDown);
  cv.addEventListener('pointermove', onToolMove);
  cv.addEventListener('pointerup', onToolUp);
  cv.addEventListener('pointercancel', onToolUp);
}

      <p class="muted small" style="margin:8px 0 0">${t('tl_simtime')}</p>

function toggleTool(id) {
  tools[id].on = !tools[id].on;
  if (id === 'sw' && !tools.sw.on) tools.sw.running = false;
  saveTools();
  renderTools();
}

function stopwatchAction(a) {
  const sw = tools.sw;
  if (a === 'toggle') {
    sw.running = !sw.running;
    if (sw.running && !sim.running) togglePlay();
  } else if (a === 'lap') {
    sw.laps.push(sw.t);
    if (sw.laps.length > 10) sw.laps.shift();
  } else {
    sw.running = false;
    sw.t = 0;
    sw.laps = [];
  }
  renderTools();
}

function updateStopwatch() {
  if (!tools.sw.on) return;

}
// ---------- graph (live series) ----------
const graphFit = { on: false, res: null };
const PAD = { l: 52, r: 16, t: 14, b: 34 };

function windowed(data, win) {
  if (!win || !data.length) return data;
  const xmax = data[data.length - 1].x;
  return data.filter(d => d.x >= xmax - win);
}

function graphBounds(points, fixedY) {
  const xs = points.map(d => d.x);
  const ys = points.map(d => d.y);
  let xmin = Math.min(...xs);
  let xmax = Math.max(...xs);
  let ymin = fixedY ? fixedY[0] : Math.min(...ys);
  let ymax = fixedY ? fixedY[1] : Math.max(...ys);
  if (xmax - xmin < 1e-9) xmax = xmin + 1;
  if (ymax - ymin < 1e-9) {
    ymax += 1;
    ymin -= 1;
  }
  if (!fixedY) {
    const pad = (ymax - ymin) * 0.1;
    ymin -= pad;
    ymax += pad;
  }
  return { xmin, xmax, ymin, ymax };
}

function axesMap(W, H, b) {
  return {
    X: x => PAD.l + ((x - b.xmin) / (b.xmax - b.xmin)) * (W - PAD.l - PAD.r),
    Y: y => PAD.t + (1 - (y - b.ymin) / (b.ymax - b.ymin)) * (H - PAD.t - PAD.b),
  };
}

function drawAxes(c, W, H, b, xl, yl) {
  // values within a millionth of the span of zero are printed as 0 (avoids 3.6e-15 tick labels)
  const snapY = v => (Math.abs(v) < (b.ymax - b.ymin) * 1e-6 ? 0 : v);
  const snapX = v => (Math.abs(v) < (b.xmax - b.xmin) * 1e-6 ? 0 : v);
  c.save();
  c.strokeStyle = '#eef0f3';
  c.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = PAD.t + ((H - PAD.t - PAD.b) * i) / 4;
    c.beginPath();
    c.moveTo(PAD.l, y);
    c.lineTo(W - PAD.r, y);
    c.stroke();
    label(c, fmtAxis(snapY(b.ymax - ((b.ymax - b.ymin) * i) / 4)), PAD.l - 6, y + 4, '#6b6e78', 10, 'right');
  }
  const nx = W < 420 ? 3 : 5;
  for (let i = 0; i <= nx; i++) {
    const x = PAD.l + ((W - PAD.l - PAD.r) * i) / nx;
    c.beginPath();
    c.moveTo(x, PAD.t);
    c.lineTo(x, H - PAD.b);
    c.stroke();
    label(c, fmtAxis(snapX(b.xmin + ((b.xmax - b.xmin) * i) / nx)), x, H - PAD.b + 14, '#6b6e78', 10, 'center');
  }
  label(c, xl, W - PAD.r, H - 4, '#6b6e78', 11, 'right');
  c.translate(12, PAD.t + 4);
  c.rotate(-Math.PI / 2);
  label(c, yl, -(H - PAD.t - PAD.b) / 2 - 10, 0, '#6b6e78', 11, 'center');
  c.restore();
}

function fmtAxis(v) {
  const a = Math.abs(v);
  if (a !== 0 && (a < 0.01 || a >= 1e5)) return v.toExponential(1);
  return a >= 100 ? v.toFixed(0) : a >= 10 ? v.toFixed(1) : v.toFixed(2);
}

function plotLine(c, data, m, color, w = 2.5) {
  c.save();
  c.strokeStyle = color;
  c.lineWidth = w;
  c.lineJoin = 'round';
  c.beginPath();
  data.forEach((d, i) => (i ? c.lineTo(m.X(d.x), m.Y(d.y)) : c.moveTo(m.X(d.x), m.Y(d.y))));
  c.stroke();
  c.restore();
}

function plotFit(c, fit, m, b) {
  c.save();
  c.setLineDash([7, 5]);
  c.strokeStyle = '#d97706';
  c.lineWidth = 2;
  c.beginPath();
  c.moveTo(m.X(b.xmin), m.Y(fit.m * b.xmin + fit.c));
  c.lineTo(m.X(b.xmax), m.Y(fit.m * b.xmax + fit.c));
  c.stroke();
  c.restore();
}

function fitText(fit, yl = 'y', xl = 'x') {
  const sign = fit.c < 0 ? '−' : '+';
  return `${yl} = ${fmtNum(fit.m)}·${xl} ${sign} ${fmtNum(Math.abs(fit.c))} · r² = ${fit.r2.toFixed(4)}`;
}

function fmtNum(v) {
  if (!Number.isFinite(v)) return '—';
  const a = Math.abs(v);
  if (a !== 0 && (a < 0.001 || a >= 1e6)) return v.toExponential(3);
  return String(+v.toPrecision(4));
}

function drawGraph() {
  if (!sim.GW) return;
  const g = sim.exp.graph;
  const W = sim.GW;
  const H = 260;
  const data = windowed(sim.s.series || [], g.window);
  gctx.clearRect(0, 0, W, H);
  gctx.fillStyle = '#fff';
  gctx.fillRect(0, 0, W, H);
  if (!data.length) {
    label(gctx, t('gRun'), W / 2, H / 2, '#8d93a3', 13, 'center');
    $('#gInfo').textContent = '';
    return;
  }
  const mk = g.marker ? g.marker(sim.s, sim.p) : null;
  const b = graphBounds(mk ? data.concat([mk]) : data, g.fixedY);
  const m = axesMap(W, H, b);
  drawAxes(gctx, W, H, b, L(g.x), L(g.y));
  plotLine(gctx, data, m, '#8da315');
  graphFit.res = graphFit.on && data.length >= 3 ? linreg(data) : null;
  if (graphFit.res) plotFit(gctx, graphFit.res, m, b);
  if (mk) {
    circle(gctx, m.X(mk.x), m.Y(mk.y), 6, '#ef4444');
    const right = m.X(mk.x) > W - 120;
    label(gctx, `(${fmt(mk.x, 1)}, ${fmt(mk.y, 2)})`, m.X(mk.x) + (right ? -10 : 10), m.Y(mk.y) - 8, '#b91c1c', 11, right ? 'right' : 'left');
  }
  $('#gInfo').textContent = `${data.length} ${t('points')}`;
  const info = $('#fitInfo');
  info.classList.toggle('hidden', !graphFit.res);
  if (graphFit.res) info.textContent = fitText(graphFit.res);
}

function toggleGraphFit() {
  const n = windowed(sim.s.series || [], sim.exp.graph.window).length;
  if (!graphFit.on && n < 3) {
    toast(t('fitNeed'), 'bad', 'alert');
    return;
  }
  graphFit.on = !graphFit.on;
  $('#fitBtn').classList.toggle('on', graphFit.on);
}

function exportSeriesCsv() {
  const g = sim.exp.graph;
  const rows = [[L(g.x), L(g.y)], ...(sim.s.series || []).map(d => [d.x, d.y])];
  download(`${sim.exp.id}-data.csv`, rows.map(r => r.join(',')).join('\n'), 'text/csv');
  logEvent('export', { en: `Graph CSV — ${sim.exp.title.en}`, ur: `گراف CSV — ${sim.exp.title.ur}` });
  toast(t('csvDone'), 'ok', 'check');
}

// ---------- readings table ----------
// Default regression columns per experiment: 'p.<param>', 'r.<readout index>' or 't' (sim time).
const DEFAULT_FIT = {
  pendulum: { x: 'p.L', y: 'r.0', yT: 'sq' },
  projectile: { x: 'p.ang', y: 'r.0' },
  ohm: { x: 'p.V', y: 'r.1' },
  waves: { x: 'p.f1', y: 'r.0' },
  lens: { x: 'p.do', xT: 'inv', y: 'r.0', yT: 'inv' },
  hooke: { x: 'r.1', y: 'r.0' },
  newton: { x: 'r.0', y: 'r.4' },
  induction: { x: 'p.v', y: 'r.2' },
  titration: { x: 'r.0', y: 'r.1' },
  gas: { x: 'p.V', xT: 'inv', y: 'r.0' },
  rate: { x: 'p.T', xT: 'inv', y: 'r.0', yT: 'log' },
  electrolysis: { x: 'r.0', y: 'r.2' },
  osmosis: { x: 't', y: 'r.2' },
  enzyme: { x: 'p.T', y: 'r.1' },
};
const TRANSFORMS = { none: v => v, sq: v => v * v, inv: v => (v === 0 ? NaN : 1 / v), log: v => (v > 0 ? Math.log(v) : NaN) };

function readingsFor(id) {
  const saved = store.get('readings:' + id, null);
  return { rows: [], x: 't', y: 'r.0', xT: 'none', yT: 'none', ...DEFAULT_FIT[id], ...(saved || {}) };
}

function saveReadings(id, rec) {
  store.set('readings:' + id, rec);
}

function takeReading() {
  const e = sim.exp;
  const r = e.readouts.call(e, sim.s, sim.p).map(x => {
    const v = numOf(x.v);
    return { l: x.l, v: Number.isFinite(v) ? v : null, s: String(x.v) };
  });
  const rec = readingsFor(e.id);
  const n = rec.rows.length ? rec.rows[rec.rows.length - 1].n + 1 : 1;
  rec.rows.push({ n, at: nowIso(), t: +(+sim.s.t || 0).toFixed(3), p: { ...sim.p }, r });
  if (rec.rows.length > 200) rec.rows.shift();
  saveReadings(e.id, rec);
  logEvent('reading', { en: `Reading #${n} — ${e.title.en}`, ur: `پیمائش #${n} — ${e.title.ur}` });
  toast(`${t('d_took')} #${n}`, 'ok', 'camera');
  renderTabs();
}

function colValue(row, key) {
  if (key === 't') return row.t;
  const [kind, k] = key.split('.');
  if (kind === 'p') return row.p[k];
  return row.r[+k]?.v ?? null;
}

// every parameter and readout becomes a column; numeric columns can be regressed
function readingColumns(e, rows) {
  const cols = [{ key: 't', label: t('d_time') }];
  e.params.forEach(q => cols.push({ key: 'p.' + q.k, label: L(q.label) }));
  const last = rows[rows.length - 1];
  const nr = Math.max(0, ...rows.map(r => r.r.length));
  for (let i = 0; i < nr; i++) cols.push({ key: 'r.' + i, label: L(last?.r[i]?.l) || `#${i + 1}` });
  cols.forEach(c => {
    c.num = rows.some(r => Number.isFinite(+colValue(r, c.key)) && colValue(r, c.key) !== null && colValue(r, c.key) !== '');
  });
  return cols;
}

function cellText(row, key) {
  if (key.startsWith('r.')) return row.r[+key.slice(2)]?.s ?? '—';
  const v = colValue(row, key);
  return typeof v === 'number' ? fmtNum(v) : String(v ?? '—');
}

function transformLabel(lab, T) {
  if (T === 'sq') return `(${lab})²`;
  if (T === 'inv') return `1/(${lab})`;
  if (T === 'log') return `ln(${lab})`;
  return lab;
}

// a cell counts only when it holds a real number: a blank readout ("…") must not become 0
function numAt(row, key) {
  const v = colValue(row, key);
  if (v === null || v === undefined || v === '') return NaN;
  return +v;
}

// the saved axis choice may point at a column with no numbers yet (e.g. the period
// before one full swing); fall back to numeric columns without overwriting the choice
function fitAxes(rec, cols) {
  const nums = cols.filter(c => c.num).map(c => c.key);
  const x = nums.includes(rec.x) ? rec.x : nums[0];
  const yPick = nums.includes(rec.y) && rec.y !== x ? rec.y : nums.filter(k => k !== x).pop();
  return { x, y: yPick ?? x };
}

function regressionPoints(rec, axes) {
  const fx = TRANSFORMS[rec.xT] || TRANSFORMS.none;
  const fy = TRANSFORMS[rec.yT] || TRANSFORMS.none;
  return rec.rows
    .map(r => ({ x: fx(numAt(r, axes.x)), y: fy(numAt(r, axes.y)) }))
    .filter(p => Number.isFinite(p.x) && Number.isFinite(p.y));
}

// regression summary for the report and the data tab
// TODO(student): add the standard error of the slope and intercept (and error bars on the scatter plot)
// so students can quote g, k or Ea with an uncertainty.
function readingsFit(e) {
  const rec = readingsFor(e.id);
  if (rec.rows.length < 2) return null;
  const cols = readingColumns(e, rec.rows);
  const axes = fitAxes(rec, cols);
  const pts = regressionPoints(rec, axes);
  const fit = linreg(pts);
  if (!fit) return null;
  const lab = key => cols.find(c => c.key === key)?.label || key;
  return { fit, pts, xl: transformLabel(lab(axes.x), rec.xT), yl: transformLabel(lab(axes.y), rec.yT) };
}

function dataTableHtml(cols, rows) {
  const head = `<tr><th>#</th>${cols.map(c => `<th>${esc(c.label)}</th>`).join('')}<th><span class="hidden">${t('delete')}</span></th></tr>`;
  const body = rows
    .map(
      (r, i) =>
        `<tr><td>${r.n}</td>${cols.map(c => `<td>${esc(cellText(r, c.key))}</td>`).join('')}<td><button class="x" data-del="${i}" aria-label="${t('delete')} #${r.n}">${ic('x')}</button></td></tr>`,
    )
    .join('');
  return `<div class="dtable"><table class="data">${head}${body}</table></div>`;
}

function regressionControlsHtml(rec, cols) {
  const numCols = cols.filter(c => c.num);
  const axes = fitAxes(rec, cols);
  const colSel = (id, val) =>
    `<select id="${id}">${numCols.map(c => `<option value="${c.key}" ${c.key === val ? 'selected' : ''}>${esc(c.label)}</option>`).join('')}</select>`;
  const trSel = (id, val, v) => {
    const opts = [
      ['none', t('tr_none')],
      ['sq', `${v}²`],
      ['inv', `1/${v}`],
      ['log', `ln ${v}`],
    ];
    return `<select id="${id}">${opts.map(([k, l]) => `<option value="${k}" ${k === val ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  };
  return `<div class="regrow">
    <label>${t('d_x')}${colSel('dX', axes.x)}</label>
    <label>${t('d_x')} f(x)${trSel('dXT', rec.xT, 'x')}</label>
    <label>${t('d_y')}${colSel('dY', axes.y)}</label>
    <label>${t('d_y')} f(y)${trSel('dYT', rec.yT, 'y')}</label>
  </div>`;
}

function renderData() {
  const e = sim.exp;
  const rec = readingsFor(e.id);
  const cols = readingColumns(e, rec.rows);
  const top = `<div class="pagehead"><h3 style="font-size:1.05rem">${ic('table')} ${t('d_title')} <span class="pill">${rec.rows.length} ${t('d_rows')}</span></h3>
    <div class="toolbar">
      <button class="btn acid sm" id="dTake">${ic('camera')} ${t('takeReading')}</button>
      <button class="btn ghost sm" id="dCsv" ${rec.rows.length ? '' : 'disabled'}>${ic('download')} CSV</button>
      <button class="btn ghost sm" id="dClear" ${rec.rows.length ? '' : 'disabled'}>${ic('trash')} ${t('clear')}</button>
    </div></div>`;
  if (!rec.rows.length) {
    $('#data').innerHTML = `${top}<p class="muted ${urClass()}">${t('d_none')}</p>`;
  } else {
    $('#data').innerHTML = `${top}${dataTableHtml(cols, rec.rows)}
      <h3 style="font-size:1rem;margin:16px 0 4px">${ic('trending-up')} ${t('d_reg')}</h3>
      ${regressionControlsHtml(rec, cols)}
      <div class="stats" id="dStats"></div>
      <canvas id="dv" style="margin-top:10px"></canvas>
      <p class="muted small ${urClass()}">${t('d_hint')}</p>`;
  }
  bindData(e, rec);
  drawRegression();
}

function bindData(e, rec) {
  $('#dTake').onclick = takeReading;
  const csv = $('#dCsv');
  if (csv) csv.onclick = () => exportReadingsCsv(e);
  const clr = $('#dClear');
  if (clr)
    clr.onclick = () => {
      if (!confirm(t('s_confirm'))) return;
      store.del('readings:' + e.id);
      toast(t('d_cleared'), '', 'trash');
      renderTabs();
    };
  $$('#data [data-del]').forEach(b => {
    b.onclick = () => {
      rec.rows.splice(+b.dataset.del, 1);
      saveReadings(e.id, rec);
      toast(t('d_deleted'), '', 'trash');
      renderTabs();
    };
  });
  [
    ['dX', 'x'],
    ['dXT', 'xT'],
    ['dY', 'y'],
    ['dYT', 'yT'],
  ].forEach(([id, k]) => {
    const el = $('#' + id);
    if (el)
      el.onchange = () => {
        rec[k] = el.value;
        saveReadings(e.id, rec);
        drawRegression();
      };
  });
}

function drawRegression() {
  const dv = $('#dv');
  if (!dv || !dv.clientWidth) return;
  const res = readingsFit(sim.exp);
  const stat = (l, v) => `<div class="stat"><div class="l">${l}</div><div class="v">${v}</div></div>`;
  $('#dStats').innerHTML = res
    ? stat(t('d_slope'), fmtNum(res.fit.m)) + stat(t('d_int'), fmtNum(res.fit.c)) + stat(t('d_r2'), res.fit.r2.toFixed(4)) + stat(t('d_n'), res.fit.n)
    : stat(t('d_n'), 0) + `<div class="stat"><div class="l">${t('fitNeed')}</div></div>`;
  const dpr = Math.min(2, devicePixelRatio || 1);
  const W = dv.clientWidth;
  const H = 260;
  dv.width = W * dpr;
  dv.height = H * dpr;
  const c = dv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.fillStyle = '#fff';
  c.fillRect(0, 0, W, H);
  if (!res) return;
  const b = graphBounds(res.pts, null);
  const m = axesMap(W, H, b);
  drawAxes(c, W, H, b, res.xl, res.yl);
  plotFit(c, res.fit, m, b);
  res.pts.forEach(p => circle(c, m.X(p.x), m.Y(p.y), 5, '#8da315', '#5f7004', 1.5));
}

function exportReadingsCsv(e) {
  const rec = readingsFor(e.id);
  const cols = readingColumns(e, rec.rows);
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  const lines = [['#', ...cols.map(c => c.label)].map(q).join(',')];
  rec.rows.forEach(r => lines.push([r.n, ...cols.map(c => colValue(r, c.key) ?? '')].map(q).join(',')));
  download(`${e.id}-readings.csv`, lines.join('\n'), 'text/csv');
  logEvent('export', { en: `Readings CSV — ${e.title.en}`, ur: `پیمائشیں CSV — ${e.title.ur}` });
  toast(t('csvDone'), 'ok', 'check');
}

const pillHtml = v => ` <span class="pill" style="padding:1px 7px">${v}</span>`;

function tabBadge(id, e) {
  if (id === 'worksheet') return pillHtml(`${wsScore(e).ok}/${e.worksheet.length}`);
  if (id === 'data') {
    const n = readingsFor(e.id).rows.length;
    return n ? pillHtml(n) : '';
  }
  if (id === 'quiz') {
    const q = store.get('quiz:' + e.id, null);
    return q?.best != null ? pillHtml(`${q.best}/${(QUIZ[e.id] || []).length}`) : '';
  }
  return '';
}

function renderTabs() {
  const e = sim.exp;
  $('#tabs').innerHTML = TABS.map(
    ([id, k, i]) =>
      `<button data-tab="${id}" role="tab" aria-selected="${curTab === id}" class="${curTab === id ? 'on' : ''}">${ic(i)} ${t(k)}${tabBadge(id, e)}</button>`,
  ).join('');
  $$('#tabs button').forEach(b => {
    b.onclick = () => setTab(b.dataset.tab);
  });
  $$('.tabpane').forEach(p => p.classList.toggle('on', p.dataset.tab === curTab));
  const panes = {
    graph: () => setTimeout(resize, 0),
    data: renderData,
    theory: renderTheory,
    worksheet: renderWS,
    quiz: renderQuiz,
    report: renderReport,
    about: renderAbout,
  };
  panes[curTab]();
}

function setTab(id) {
  curTab = id;
  store.set('tab', id);
  renderTabs();
  if (sim.exp) history.replaceState(null, '', `#exp/${sim.exp.id}/${id}`);
}
