// Record a report; hide automatically once enough distinct people report the same post.
function reportContent(type, id, reason, note = '') {
  const def = TARGETS[type];
  const x = def.find(id);
  if (!x) return false;
  x.reports = x.reports || [];
  x.reports.push({ userId: meId(), reason, note, ts: Date.now() });
  const reporters = unique(openReports(x).map(r => r.userId)).length;
  const k = settings().autoHide;
  if (reporters >= k && !(x.mod && x.mod.hidden)) {
    x.mod = { hidden: true, auto: true, ts: Date.now() };
    audit('auto_hide', type, id, t('autoHideDetail', { n: reporters, k }), 'system');
    notify(PERSONAS.staff, 'mod', 'n_autoHide', { title: def.title(x) }, 'moderation');
  }
  def.save();
  const soc = targetSociety(type, x);
  if (soc) soc.members.filter(m => SOC_ADMIN_ROLES.includes(m.role)).forEach(m => notify(m.userId, 'mod', 'n_reportSoc', { soc: tx(soc.name) }, 'moderation'));
  toast(t('reportThanks'), 'ok');
  updateNavBadges();
  return true;
}

// Apply a moderator decision, close the open reports, log it and tell the author.
function modAction(type, id, action, reason = '') {
  const def = TARGETS[type];
  const x = def.find(id);
  if (!x) return;
  const closeAs = action === 'dismiss' ? 'dismissed' : 'actioned';
  openReports(x).forEach(r => {
    r.closed = closeAs;
    r.closedAt = Date.now();
  });
  if (action === 'dismiss' || action === 'restore') delete x.mod;
  if (action === 'hide') x.mod = { hidden: true, by: meId(), ts: Date.now() };
  if (action === 'remove') x.mod = { hidden: true, removed: true, by: meId(), ts: Date.now() };
  def.save();
  audit(action, type, id, reason || def.title(x));
  const owner = def.owner(x);
  if (owner && action === 'warn') notify(owner, 'mod', 'n_warn', { title: def.title(x) }, def.link(x));
  if (owner && ['hide', 'remove', 'restore'].includes(action)) notify(owner, 'mod', 'n_contentAction', { title: def.title(x), action: t('act_' + action) }, def.link(x));
  updateNavBadges();
}

// Everything with open reports that the current role may moderate.
function modQueue() {
  const out = [];
  Object.keys(TARGETS).forEach(type => {
    allTargetIds(type).forEach(id => {
      const x = TARGETS[type].find(id);
      if (!x || !openReports(x).length) return;
      if (!canModerate(type, x)) return;
      out.push({ type, id, obj: x, reports: openReports(x) });
    });
  });
  return out.sort((a, b) => b.reports.length - a.reports.length || b.reports[0].ts - a.reports[0].ts);
}

// ---------- lost & found: matching (category · words · place · date) ----------
const MATCH_WEIGHTS = { cat: 0.3, text: 0.3, place: 0.2, date: 0.2 };
const LIKELY = 0.6;
const POSSIBLE = 0.4;

function catScore(a, b) {
  if (a === b) return 1;
  return RELATED_CATS.some(([x, y]) => (x === a && y === b) || (x === b && y === a)) ? 0.5 : 0;
}

function placeScore(lost, found) {
  if (lost.place === found.place) return 1;
  return clamp(1 - (pinDistance(lost.pin, found.pin) - 40) / 360, 0, 1);
}

// Found should not be earlier than lost (one day of slack for late reports); decays over two weeks.
function dateScore(lost, found) {
  const gap = daysBetween(parseDate(lost.date), parseDate(found.date));
  if (gap < -1) return 0;
  return clamp(1 - Math.max(0, gap) / 14, 0, 1);
}

const titleText = it => [typeof it.title === 'string' ? it.title : it.title.en, it.colour, it.brand].join(' ');
const itemText = it => [titleText(it), it.desc].join(' ');

// Titles carry most of the signal; descriptions add context but dilute overlap, so they weigh less.
const textScore = (a, b) => 0.6 * tokenSimilarity(tokens(titleText(a)), tokens(titleText(b))) + 0.4 * tokenSimilarity(tokens(itemText(a)), tokens(itemText(b)));

function matchScore(lost, found) {
  const parts = {
    cat: catScore(lost.cat, found.cat),
    text: textScore(lost, found),
    place: placeScore(lost, found),
    date: dateScore(lost, found),
  };
  // TODO(student): add a photo-similarity signal (average/difference hash of the two photos, Hamming distance) and re-tune MATCH_WEIGHTS on labelled pairs.
  let score = sum(Object.entries(MATCH_WEIGHTS).map(([k, w]) => w * parts[k]));
  if (parts.cat === 0) score *= 0.6;
  if (parts.date === 0) score *= 0.5;
  return { score: Math.round(score * 100) / 100, parts };
}

const matchable = it => ['open', 'matched', 'claim_pending'].includes(it.status) && viewable(it, it.userId) && !(it.mod && it.mod.hidden);

function matchesFor(it, min = POSSIBLE) {
  const others = visible(db('items')).filter(x => x.type !== it.type && matchable(x));
  return others
    .map(x => {
      const pair = it.type === 'lost' ? matchScore(it, x) : matchScore(x, it);
      return { other: x, ...pair };
    })
    .filter(m => m.score >= min)
    .sort((a, b) => b.score - a.score);
}

// Pairs worth showing: mine for students and society admins, all of them for staff.
function matchPairs(min = POSSIBLE) {
  const lostList = visible(db('items')).filter(x => x.type === 'lost' && ['open', 'matched'].includes(x.status));
  const pairs = [];
  lostList.forEach(l => {
    matchesFor(l, min).forEach(m => pairs.push({ lost: l, found: m.other, score: m.score, parts: m.parts }));
  });
  const mine = p => p.lost.userId === meId() || p.found.userId === meId();
  return (isStaff() ? pairs : pairs.filter(mine)).sort((a, b) => b.score - a.score);
}

function notifyMatches(it) {
  if (!settings().matchAlerts) return 0;
  const found = matchesFor(it, LIKELY);
  found.forEach(m => {
    const lost = it.type === 'lost' ? it : m.other;
    const fnd = it.type === 'found' ? it : m.other;
    if (lost.userId !== meId()) notify(lost.userId, 'match', 'n_match', { item: itemTitle(lost) }, 'lostfound/matches');
    if (fnd.userId !== meId()) notify(fnd.userId, 'match', 'n_matchFound', { item: itemTitle(fnd) }, 'lostfound/' + fnd.id);
  });
  return found.length;
}

function whyHtml(parts) {
  return `<div class="why">${Object.keys(MATCH_WEIGHTS)
    .map(k => `<div class="meter"><span>${t('m_' + k)}</span>${barHtml(parts[k] * 100, k === 'cat' ? 'maroon' : '')}<span class="tnum">${Math.round(parts[k] * 100)}%</span></div>`)
    .join('')}</div>`;
}

const LF_TABS = ['browse', 'map', 'matches', 'mine', 'log'];

const saveLfUi = () => store.set('ui.lf', { ...lfUi, q: '', place: '' });

function renderLostFound(arg) {
  if (LF_TABS.includes(arg)) lfUi.tab = arg;
  const mine = visible(db('items')).filter(x => x.userId === meId()).length;
  const tabs = [
    ['browse', t('lfBrowse'), 'grid'],
    ['map', t('lfMap'), 'map'],
    ['matches', t('lfMatches'), 'swap', matchPairs().length],
    ['mine', t('lfMine'), 'user', mine],
    ['log', t('lfLog'), 'handshake'],
  ];
  const actions = `<button class="btn" id="lfLost">${ic('plus')} ${t('reportLost')}</button><button class="btn teal" id="lfFound">${ic('plus')} ${t('reportFound')}</button>`;
  $('#page').innerHTML = pageHead('search', t('nav_lostfound'), t('lfTitle'), t('lfSub'), actions) + tabsLine('lfTabs', tabs, lfUi.tab) + '<div id="lfBody"></div>';
  $('#lfLost').onclick = () => openItemForm('lost');
  $('#lfFound').onclick = () => openItemForm('found');
  bindTabs($('#lfTabs'), tab => {
    lfUi.tab = tab;
    saveLfUi();
    setHash('lostfound/' + tab);
  });

}

function drawLfTab() {
  const body = $('#lfBody');
  const draw = { browse: drawLfBrowse, map: drawLfMap, matches: drawLfMatches, mine: drawLfMine, log: drawLfLog }[lfUi.tab];
  draw(body);
  animateIn(body);
  animateFigures(body);
}

function lfToolbar() {
  const sel = (id, opts, v) => `<select id="${id}" aria-label="${esc(t('filter'))}">${opts.map(([k, l]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  return `<div class="toolbar">
    <input class="grow" type="search" id="lfQ" placeholder="${esc(t('lfSearch'))}" aria-label="${esc(t('lfSearch'))}" value="${esc(lfUi.q)}">
    ${sel('lfType', [['all', t('allTypes')], ['lost', t('lost')], ['found', t('found')]], lfUi.type)}
    ${sel('lfCat', [['all', t('allCats')], ...LF_CATS.map(c => [c.id, tx(c)])], lfUi.cat)}
    ${sel('lfStatus', [['active', t('stActive')], ['closed', t('stClosed')], ['expired', t('st_expired')], ['all', t('stAll')]], lfUi.status)}
    ${sel('lfSort', [['new', t('newest')], ['old', t('oldest')], ['date', t('sortEventDate')]], lfUi.sort)}
  </div>`;
}

function bindLfToolbar(redraw) {
  $('#lfQ').oninput = debounce(e => {
    lfUi.q = e.target.value;
    redraw();
  }, 200);
  ['Type', 'Cat', 'Status', 'Sort'].forEach(k => {
    $('#lf' + k).onchange = e => {
      lfUi[k.toLowerCase()] = e.target.value;
      saveLfUi();
      redraw();
    };
  });
}

function clearLfPlace() {
  lfUi.place = '';
  drawLfTab();
}

function filteredItems() {
  const q = lfUi.q.trim().toLowerCase();
  const statusOk = it => lfUi.status === 'all' || (lfUi.status === 'active' ? ACTIVE_STATUSES.includes(it.status) : lfUi.status === 'closed' ? ['returned', 'resolved'].includes(it.status) : it.status === 'expired');
  const text = it => [it.title.en || it.title, it.title.ur || '', it.desc, it.colour, it.brand, placeName(it.place), tx(catById(it.cat))].join(' ').toLowerCase();
  const sorter = { new: (a, b) => b.createdAt - a.createdAt, old: (a, b) => a.createdAt - b.createdAt, date: (a, b) => (a.date < b.date ? 1 : -1) }[lfUi.sort];
  return visible(db('items'))
    .filter(it => viewable(it, it.userId))
    .filter(it => lfUi.type === 'all' || it.type === lfUi.type)
    .filter(it => lfUi.cat === 'all' || it.cat === lfUi.cat)
    .filter(it => !lfUi.place || it.place === lfUi.place)
    .filter(statusOk)
    .filter(it => !q || text(it).includes(q))
    .sort(sorter);
}

const itemArt = (it, cls = 'art') => (it.photo ? `<img src="${it.photo}" alt="${esc(itemTitle(it))}">` : `<svg class="${cls}" aria-hidden="true" viewBox="0 0 24 24" style="stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round"><use href="#i-${catById(it.cat).icon}"/></svg>`);

function itemCard(it) {
  const mCount = it.userId === meId() && ACTIVE_STATUSES.includes(it.status) ? matchesFor(it).length : 0;
  const hiddenTag = it.mod && it.mod.hidden ? chip(it.mod.removed ? t('removed') : t('hidden'), 'bad', 'eye-off') : '';
  return `<button class="item ${it.type} ${it.mod && it.mod.hidden ? 'hidden-mod' : ''}" data-item="${it.id}">
    <div class="ph-img">${itemArt(it)}<span class="chip type type-${it.type}">${t(it.type)}</span><span class="st">${statusChip(it.status)}</span></div>
    <div class="in"><span class="t">${esc(itemTitle(it))}</span>
      <div class="meta"><span>${ic('map-pin')}${esc(placeName(it.place))}</span><span>${ic('calendar')}${esc(fmtDate(parseDate(it.date), { day: 'numeric', month: 'short' }))}</span><span>${ic(catById(it.cat).icon)}${esc(tx(catById(it.cat)))}</span></div>
      <div class="chips">${mCount ? chip(t('nMatches', { n: mCount }), 'ochre', 'swap') : ''}${hiddenTag}</div>
    </div></button>`;
}

function drawLfMap(body) {
  const list = filteredItems();
  const pins = list.map(it => ({ ...it.pin, kind: it.type, id: it.id, title: `${t(it.type)}: ${itemTitle(it)}` }));
  const counts = {};
  list.forEach(it => (counts[it.place] = (counts[it.place] || 0) + 1));
  body.innerHTML = lfToolbar() + `<div class="cols"><div><div class="map-wrap" id="lfMapBox">${campusMap({ pins, badges: counts, highlight: lfUi.place ? [lfUi.place] : [] })}${mapLegend()}</div><p class="map-hint">${ic('info')} ${t('mapTip')} ${t('mapNote')}</p></div>
    <div class="card"><div class="card-h"><h3>${ic('list')} ${lfUi.place ? esc(placeName(lfUi.place)) : t('nItems', { n: list.length })}</h3>${lfUi.place ? `<button class="btn ghost xs" id="lfClearPlace">${t('clearPlace')}</button>` : ''}</div>
    <div class="list">${list.filter(it => !lfUi.place || it.place === lfUi.place).slice(0, 12).map(miniItemRow).join('') || emptyState('map-pin', t('noItems'))}</div></div></div>`;
  bindLfToolbar(() => drawLfTab());
  bindMap($('#lfMapBox'), {
    onPin: id => openItem(id),
    onPlace: place => {
      lfUi.place = lfUi.place === place ? '' : place;
      drawLfTab();

  $$('[data-item]', body).forEach(b => (b.onclick = () => openItem(b.dataset.item)));

  const canClaim = p.lost.userId === meId() && p.found.userId !== meId() && ['open', 'claim_pending'].includes(p.found.status);
  const canNotify = (p.found.userId === meId() || isStaff()) && p.lost.userId !== meId();
  return `<div class="match"><div>${side(p.lost)}</div>
    <div class="score">${ringSvg(p.score)}<span class="chip ${p.score >= LIKELY ? 'ok' : 'ochre'}">${scoreLabel(p.score)}</span>${whyHtml(p.parts)}</div>

      <button class="btn ghost xs" data-item="${p.found.id}">${ic('eye')} ${t('view')}</button>

}

  const pairs = matchPairs();

    .map(([title, list]) => `<h2 class="mb" style="margin-top:6px">${esc(title)}</h2>${list.length ? `<div class="list stagger">${list.slice(0, 20).map(matchCard).join('')}</div>` : emptyState('swap', t('noMatches'), t('noMatchesSub'))}`)

  $$('[data-item]', body).forEach(b => (b.onclick = () => openItem(b.dataset.item)));
  $$('[data-claim]', body).forEach(b => (b.onclick = () => openClaimModal(b.dataset.claim, b.dataset.lost)));
  $$('[data-notify]', body).forEach(b => {
    b.onclick = () => {
      const lost = itemById(b.dataset.notify);

function openItem(id) {
  const it = itemById(id);
  if (!it || !viewable(it, it.userId)) return toast(t('noItems'));
  const mine = it.userId === meId();
  const c = catById(it.cat);
  const kv = [
    [t(it.type === 'lost' ? 'whenLost' : 'whenFound'), `${fmtDate(parseDate(it.date))}${it.time ? ', ' + fmtTime(it.time) : ''}`],
    [t('where'), placeName(it.place)],
    [t('category'), tx(c)],
    it.colour ? [t('colour'), it.colour] : null,
    it.brand ? [t('brand'), it.brand] : null,
    [t('postedBy'), mine ? `${userName(it.userId)} (${t('you')})` : userName(it.userId)],
    [t('posted'), ago(it.createdAt)],
  ].filter(Boolean);
  const html = `<h2 id="mTitle"><span class="chip type-${it.type}">${t(it.type)}</span> ${esc(itemTitle(it))}</h2>
    <div class="row mb">${statusChip(it.status)}${it.mod && it.mod.hidden ? chip(it.mod.removed ? t('removed') : t('hidden'), 'bad', 'eye-off') : ''}</div>
    ${stepsHtml(it)}
    <div class="lf-detail mt">
      <div class="stack"><div class="lf-photo ${it.type}">${itemArt(it)}</div>
        <div class="map-wrap">${campusMap({ pins: [{ ...it.pin, kind: it.type }], highlight: [it.place], labels: false })}</div></div>
      <div class="stack">
        <dl class="kv">${kv.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
        <div><h3 class="small muted">${t('description')}</h3><p>${esc(it.desc)}</p></div>
        ${it.type === 'found' && it.questions ? `<div class="note teal">${ic('lock')}<span>${t('verifyQsNote', { n: it.questions.length })}</span></div>` : ''}
        <div class="row" id="itActions">${itemActions(it)}</div>
        ${claimsSection(it)}
        ${handoverSection(it)}
      </div>
    </div>
    ${suggestionsSection(it)}
    ${historySection(it)}`;
  openModal(html, { wide: true });
  bindItemActions(it);
}

function itemActions(it) {
  const mine = it.userId === meId();
  const out = [];
  const myClaim = (it.claims || []).find(c => c.userId === meId() && c.status !== 'withdrawn');
  if (it.type === 'found' && !mine && ['open', 'claim_pending'].includes(it.status) && !myClaim) {
    out.push((it.attempts || {})[meId()] >= 3 ? `<div class="note bad">${ic('lock')}<span>${t('claimLocked')}</span></div>` : `<button class="btn" data-act="claim">${ic('hand')} ${t('claimThis')}</button>`);
  }
  if (myClaim) out.push(chip(t('yourClaim', { status: t('cl_' + myClaim.status) }), myClaim.status === 'approved' ? 'ok' : myClaim.status === 'rejected' ? 'bad' : 'ochre', 'hand'));
  if (mine && it.type === 'lost' && ['open', 'matched'].includes(it.status)) out.push(`<button class="btn soft teal sm" data-act="resolve">${ic('check-circle')} ${t('foundMyself')}</button>`);
  if ((mine || isStaff()) && !['returned', 'approved'].includes(it.status)) out.push(`<button class="btn danger sm" data-act="delete">${ic('trash')} ${t('deletePost')}</button>`);
  if (!mine) out.push(`<button class="btn ghost sm" data-act="report">${ic('flag')} ${t('report')}</button>`);
  return out.join('');
}

function bindItemActions(it) {
  const m = $('#modal');
  $$('[data-act]', m).forEach(b => {
    b.onclick = async () => {
      const act = b.dataset.act;
      if (act === 'claim') return openClaimModal(it.id);
      if (act === 'report') return openReportModal('item', it.id);
      if (act === 'resolve') return resolveLost(it);
      if (act === 'delete') return deleteItem(it);
    };
  });
  $$('[data-decide]', m).forEach(b => (b.onclick = () => decideClaimPrompt(it.id, b.dataset.claim, b.dataset.decide === 'yes')));
  $$('[data-ho]', m).forEach(b => (b.onclick = () => (b.dataset.ho === 'schedule' ? openScheduleHandover(it.id) : openConfirmHandover(it.id))));
  $$('[data-open]', m).forEach(b => (b.onclick = () => openItem(b.dataset.open)));
}

function resolveLost(it) {
  setItemStatus(it, 'resolved', 'found-myself');
  commit('items');
  toast(t('resolvedOk'), 'ok');
  closeModal();
  rerender();
}

async function deleteItem(it) {
  const ok = await confirmBox(t('deleteQ'), t('deleteBody'), { ok: t('delete'), danger: true });
  if (!ok) return;
  const list = db('items');
  list.splice(list.indexOf(it), 1);
  commit('items');
  if (it.userId !== meId()) audit('remove', 'item', it.id, itemTitle(it));
  toast(t('deleted'), 'ok');
  rerender();
}

function claimsSection(it) {
  if (it.type !== 'found' || !(it.userId === meId() || isStaff())) return '';
  const claims = it.claims || [];
  const qn = (it.questions || []).length;
  const rows = claims
    .map(c => {
      const res = c.results.map((ok, i) => `<span class="qres ${ok ? 'y' : 'n'}">${ic(ok ? 'check' : 'x')} Q${i + 1}</span>`).join(' ');
      const act = c.status === 'pending' && canDecideClaim(it) ? `<div class="row mt"><button class="btn xs teal" data-decide="yes" data-claim="${c.id}">${ic('check')} ${t('approve')}</button><button class="btn xs danger" data-decide="no" data-claim="${c.id}">${ic('x')} ${t('reject')}</button></div>` : '';
      return `<div class="claim"><div class="between"><span class="row">${avatar(c.userId)}<b>${esc(userName(c.userId))}</b></span>${chip(t('cl_' + c.status), c.status === 'approved' ? 'ok' : c.status === 'rejected' ? 'bad' : 'ochre')}</div>
        <div class="row mt">${res}<span class="small muted">${t('answersMatched', { k: c.results.filter(Boolean).length, n: qn })}</span></div>
        ${c.message ? `<p class="small mt">${esc(c.message)}</p>` : ''}<div class="tiny muted">${esc(ago(c.ts))}</div>${act}</div>`;
    })
    .join('');
  return `<div><h3 class="mb">${ic('hand')} ${t('claims')}</h3>${rows || `<p class="small muted">${t('noClaims')}</p>`}</div>`;
}

function handoverSection(it) {
  if (it.type !== 'found' || !['approved', 'returned'].includes(it.status)) return '';
  const claim = (it.claims || []).find(c => c.status === 'approved');
  const party = claim && (claim.userId === meId() || it.userId === meId() || isStaff());
  if (!party) return '';
  const h = it.handover;
  const when = h ? `${fmtDate(parseDate(h.date))}, ${fmtTime(h.time)}` : '';
  const info = h ? `<p class="small">${ic('calendar')} ${t('hoScheduled', { when, place: placeName(h.place) })}${h.witness ? '<br>' + ic('user') + ' ' + esc(t('hoWitnessLbl', { name: h.witness })) : ''}</p>` : '';
  const manage = it.status === 'approved' && canDecideClaim(it) ? `<div class="row"><button class="btn ghost sm" data-ho="schedule">${ic('calendar')} ${t(h ? 'reschedule' : 'scheduleHo')}</button><button class="btn teal sm" data-ho="confirm">${ic('handshake')} ${t('confirmHo')}</button></div>` : '';
  const done = it.status === 'returned' ? `<div class="note ok">${ic('check-circle')}<span>${t('returnedNote')}</span></div>` : '';
  return `<div class="card flat"><h3 class="mb">${ic('handshake')} ${t('handover')}</h3>${info}${done}${manage}<p class="tiny muted mt">${t('privacyFinder')}</p></div>`;
}

function suggestionsSection(it) {
  if (!(it.userId === meId() || isStaff()) || !ACTIVE_STATUSES.includes(it.status)) return '';
  const list = matchesFor(it).slice(0, 3);
  if (!list.length) return '';
  return `<h3 class="mt mb">${ic('swap')} ${t('suggestions')}</h3><div class="list">${list
    .map(m => `<div class="li"><span class="bub">${ic(catById(m.other.cat).icon)}</span><span class="body"><b>${esc(itemTitle(m.other))}</b><span class="small muted">${esc(placeName(m.other.place))} · ${esc(fmtDate(parseDate(m.other.date), { day: 'numeric', month: 'short' }))}</span>${whyHtml(m.parts)}</span><span class="stack" style="text-align:center">${ringSvg(m.score)}<button class="btn ghost xs" data-open="${m.other.id}">${t('open')}</button></span></div>`)
    .join('')}</div>`;
}

function historySection(it) {
  const rows = (it.history || [])
    .slice()
    .reverse()
    .map(h => `<div class="li"><span class="bub">${ic(STATUS_META[h.status]?.icon || 'clock')}</span><span class="body"><b>${t('hist_' + h.status)}</b><span class="small muted">${esc(fmtDateTime(h.ts))} · ${esc(userName(h.by))}</span></span></div>`)
    .join('');
  return `<details class="mt"><summary class="small" style="cursor:pointer;font-weight:600">${ic('history')} ${t('history')}</summary><div class="list mt">${rows}</div></details>`;
}

function drawFormMap() {
  $('#fMap').innerHTML = campusMap({ pins: [{ ...formState.pin, kind: 'pick', drop: true }], highlight: [formState.place] }) + mapLegend(['pick']);
  bindMap($('#fMap'), {
    onPick: p => {
      formState.pin = { x: p.x, y: p.y };
      formState.place = p.placeId;
      $('#fPlace').value = p.placeId;
      drawFormMap();
    },
  });
}

function drawQuestions() {
  const box = $('#fQs');
  if ($('#fType').value !== 'found') {
    box.innerHTML = '';
    return;
  }
  const presets = ['qp1', 'qp2', 'qp3', 'qp4', 'qp5'];
  let rows = '';
  for (let i = 1; i <= formState.qCount; i++) {
    rows += `<div class="grid2"><label class="f" for="fQ${i}"><span>${t('fQ', { n: i })}</span><input type="text" id="fQ${i}" maxlength="120"></label><label class="f" for="fA${i}"><span>${t('fA')}</span><input type="text" id="fA${i}" maxlength="120" autocomplete="off"></label></div>`;
  }
  box.innerHTML = `<div class="card flat mt" style="background:var(--surface-2)"><h3 class="mb">${ic('lock')} ${t('fQuestions')}</h3><p class="small muted">${t('fQuestionsHint')}</p>
    <div class="chips mb"><span class="small muted">${t('fQPresets')}</span>${presets.map(k => `<button type="button" class="chip line" data-preset="${k}" style="cursor:pointer">${esc(t(k))}</button>`).join('')}</div>
    ${rows}${formState.qCount < 3 ? `<button type="button" class="btn ghost sm" id="fAddQ">${ic('plus')} ${t('fAddQ')}</button>` : ''}</div>`;
  if ($('#fAddQ')) $('#fAddQ').onclick = () => {
    keepQuestionValues(() => formState.qCount++);
  };
  $$('[data-preset]', box).forEach(b => {
    b.onclick = () => {
      const empty = [1, 2, 3].map(i => $('#fQ' + i)).find(inp => inp && !inp.value.trim());
      if (empty) {
        empty.value = t(b.dataset.preset);
        $('#fA' + empty.id.slice(2)).focus();
      }
    };
  });
}

// Re-render the question rows without losing what was typed.
function keepQuestionValues(change) {
  const vals = [1, 2, 3].map(i => [$('#fQ' + i)?.value || '', $('#fA' + i)?.value || '']);
  change();
  drawQuestions();
  vals.forEach(([q, a], i) => {
    if ($('#fQ' + (i + 1))) {
      $('#fQ' + (i + 1)).value = q;
      $('#fA' + (i + 1)).value = a;
    }
  });
}

function bindItemForm() {
  const typeBtns = $$('#itemForm .seg [data-type]');
  typeBtns.forEach(b => {
    b.onclick = () => {
      $('#fType').value = b.dataset.type;
      typeBtns.forEach(x => x.setAttribute('aria-pressed', x === b));
      $('#fHead').textContent = t(b.dataset.type === 'lost' ? 'newLost' : 'newFound');
      $('#fDescHint').textContent = t(b.dataset.type === 'lost' ? 'fDescLost' : 'fDescFound');
      drawQuestions();
    };
  });
  $('#fPlace').onchange = e => {
    formState.place = e.target.value;
    formState.pin = placeCenter(e.target.value);
    drawFormMap();
  };
  $('#fDrop').onclick = () => $('#fPhotoIn').click();
  $('#fDrop').onkeydown = e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    $('#fPhotoIn').click();
  };
  $('#fDrop').ondragover = e => {
    e.preventDefault();
    $('#fDrop').classList.add('over');
  };
  $('#fDrop').ondragleave = () => $('#fDrop').classList.remove('over');
  $('#fDrop').ondrop = e => {
    e.preventDefault();
    $('#fDrop').classList.remove('over');
    setFormPhoto(e.dataTransfer.files[0]);
  };
  $('#fPhotoIn').onchange = e => setFormPhoto(e.target.files[0]);
  $('#fCancel').onclick = closeModal;
  $('#itemForm').onsubmit = e => {
    e.preventDefault();
    saveItemForm();
  };
}

async function setFormPhoto(file) {
  if (!file) return;
  try {
    formState.photo = await resizeImage(file);
    $('#fPhotoPrev').innerHTML = `<img src="${formState.photo}" alt="">`;
    $('#fDrop').insertAdjacentHTML('beforeend', `<button type="button" class="btn ghost xs" id="fPhotoDel">${ic('trash')} ${t('fPhotoRemove')}</button>`);
    $('#fPhotoDel').onclick = ev => {
      ev.stopPropagation();
      formState.photo = null;
      $('#fPhotoPrev').innerHTML = ic('camera');
      ev.currentTarget.remove();
    };
  } catch {
    toast(t('fPhotoBad'), 'bad');
  }
}

function fail(input, msg) {
  setError(input, msg);
  input.focus();
  return false;
}

// Extra checks beyond required fields: future dates, abuse/PII, missing or leaked verification answers.
function checkItemForm(type) {
  const text = $('#fTitle').value + ' ' + $('#fDesc').value;
  if (parseDate($('#fDate').value) > TODAY) return fail($('#fDate'), t('futureDate'));
  const scr = screenText(text);
  if (scr.level === 'severe' || scr.hits.length) return fail($('#fDesc'), t('abusiveText'));
  if (scr.pii.some(p => ['phone', 'email', 'cnic'].includes(p))) return fail($('#fDesc'), t('piiText'));
  if (type !== 'found') return true;
  const qs = [1, 2, 3].map(i => [$('#fQ' + i), $('#fA' + i)]).filter(([q, a]) => q && (q.value.trim() || a.value.trim()));
  if (!qs.length || qs.some(([q, a]) => !q.value.trim() || !a.value.trim())) return fail($('#fQ1'), t('needQuestion'));
  const haystack = ' ' + normaliseAnswer(text) + ' ';
  for (const [, a] of qs) {
    const leak = splitAlternatives(a.value).map(normaliseAnswer).find(v => v.length >= 3 && haystack.includes(' ' + v + ' '));
    if (leak) return fail(a, t('answerLeak'));
  }
  return true;
}

async function saveItemForm() {
  const form = $('#itemForm');
  const type = $('#fType').value;
  if (!validate(form) || !checkItemForm(type)) return;
  $('#fSave').disabled = true;
  const id = uid(type === 'lost' ? 'l' : 'f');
  const it = {
    id,
    type,
    userId: meId(),
    cat: $('#fCat').value,
    title: $('#fTitle').value.trim(),
    desc: $('#fDesc').value.trim(),
    colour: $('#fColour').value.trim(),
    brand: $('#fBrand').value.trim(),
    date: $('#fDate').value,
    time: $('#fTime').value,
    place: $('#fPlace').value,
    pin: formState.pin,
    photo: formState.photo,
    status: 'open',
    createdAt: Date.now(),
    claims: [],
    attempts: {},
    reports: [],
    history: [{ status: 'open', ts: Date.now(), by: meId() }],
  };
  if (type === 'found') it.questions = await buildQuestions(id);
  db('items').unshift(it);
  if (!commit('items')) {
    db('items').shift();
    $('#fSave').disabled = false;
    return;
  }
  const n = notifyMatches(it);
  closeModal();
  toast(n ? t('postedOk', { n }) : t('postedOk0'), 'ok');
  lfUi.tab = 'mine';
  setHash('lostfound/' + id);
}

async function buildQuestions(id) {
  const out = [];
  for (let i = 1; i <= 3; i++) {
    const q = $('#fQ' + i);
    if (!q || !q.value.trim() || !$('#fA' + i).value.trim()) continue;
    out.push({ q: q.value.trim(), hashes: await hashAlternatives(id, $('#fA' + i).value) });
  }
  return out;
}

const MAX_ATTEMPTS = 3;

function openClaimModal(itemId, lostId = null) {
  const it = itemById(itemId);
  if (!it || it.type !== 'found' || !['open', 'claim_pending'].includes(it.status) || it.userId === meId()) return toast(t('claimNotAllowed'));
  const used = (it.attempts || {})[meId()] || 0;
  if (used >= MAX_ATTEMPTS) return toast(t('claimLocked'), 'bad');
  const qs = it.questions || [];
  openModal(`<h2 id="mTitle">${ic('hand')} ${t('claimTitle')}</h2>
    <p class="muted small">${esc(itemTitle(it))} · ${esc(placeName(it.place))}</p>
    <div class="note teal mb">${ic('lock')}<span>${t('claimHow')}</span></div>
    <form id="claimForm" novalidate>
      ${qs.map((q, i) => `<div class="qa"><label for="cA${i}"><b>${esc(q.q)}</b></label><input type="text" id="cA${i}" data-req autocomplete="off"></div>`).join('')}
      <label class="f" for="cMsg"><span>${t('claimMsg')}</span><textarea id="cMsg" maxlength="400" data-req data-min="10"></textarea><small>${t('claimMsgHint')}</small></label>
      <label class="check"><input type="checkbox" id="cOath"> <span>${t('claimOath')}</span></label>
      <p class="small muted" id="cLeft">${t('attemptsLeft', { n: MAX_ATTEMPTS - used })}</p>
      <div class="foot"><button type="button" class="btn ghost" id="cCancel">${t('cancel')}</button><button type="submit" class="btn" id="cSend">${ic('send')} ${t('submit')}</button></div>
    </form>`);
  $('#cCancel').onclick = closeModal;
  $('#claimForm').onsubmit = e => {
    e.preventDefault();
    submitClaim(it, lostId);
  };
}

async function submitClaim(it, lostId) {
  const form = $('#claimForm');
  if (!validate(form)) return;
  if (!$('#cOath').checked) return fail($('#cOath'), t('oathNeeded'));
  $('#cSend').disabled = true;
  $('#cLeft').textContent = t('checking');
  const results = [];
  for (let i = 0; i < (it.questions || []).length; i++) {
    const h = await hashAnswer(it.id, $('#cA' + i).value);
    results.push(it.questions[i].hashes.includes(h));
  }
  const k = results.filter(Boolean).length;
  it.attempts = it.attempts || {};
  if (k < results.length) it.attempts[meId()] = (it.attempts[meId()] || 0) + 1;
  if (results.length && k === 0) return claimFailed(it);
  recordClaim(it, results, $('#cMsg').value.trim(), lostId);
  closeModal();
  toast(t('claimSent'), 'ok');
  rerender();
}

// A claim with no correct answers is not forwarded; it only uses up an attempt.
function claimFailed(it) {
  commit('items');
  const left = MAX_ATTEMPTS - it.attempts[meId()];
  if (left <= 0) {
    closeModal();
    toast(t('claimLocked'), 'bad');
    return;
  }
  $('#cSend').disabled = false;
  $('#cLeft').textContent = t('attemptsLeft', { n: left });
  setError($('#cA0'), t('noneMatched', { n: left }));
  $('#cA0').focus();
}

function recordClaim(it, results, message, lostId) {
  const score = results.length ? results.filter(Boolean).length / results.length : 0;
  it.claims = it.claims || [];
  it.claims.push({ id: uid('c'), userId: meId(), results, score, message, ts: Date.now(), status: 'pending', lostId });
  if (it.status === 'open') setItemStatus(it, 'claim_pending');
  const lost = lostId && itemById(lostId);
  if (lost && lost.status === 'open') setItemStatus(lost, 'matched');
  commit('items');
  const vars = { name: me().name, item: itemTitle(it) };
  notify(it.userId, 'claim', 'n_claimNew', vars, 'lostfound/' + it.id);
  if (userById(it.userId).staff && it.userId !== PERSONAS.staff) notify(PERSONAS.staff, 'claim', 'n_claimNew', vars, 'lostfound/' + it.id);
}

function decideClaimPrompt(itemId, claimId, approve) {
  const it = itemById(itemId);
  const claim = it && it.claims.find(c => c.id === claimId);
  if (!claim || !canDecideClaim(it)) return;
  if (approve) {
    confirmBox(t('approveQ'), t('approveBody'), { ok: t('approve') }).then(ok => ok && decideClaim(it, claim, true, ''));
    return;
  }
  openModal(`<h2 id="mTitle">${ic('x')} ${t('rejectTitle')}</h2><p class="small muted">${esc(t('claimantIs', { name: userName(claim.userId) }))}</p>
    <label class="f" for="rjWhy"><span>${t('rejectWhy')}</span><select id="rjWhy">${['answers', 'proof', 'other'].map(k => `<option value="${k}">${t('rr_' + k)}</option>`).join('')}</select></label>
    <div class="foot"><button class="btn ghost" id="rjCancel">${t('cancel')}</button><button class="btn danger" id="rjOk">${t('reject')}</button></div>`);
  $('#rjCancel').onclick = () => openItem(itemId);
  $('#rjOk').onclick = () => decideClaim(it, claim, false, $('#rjWhy').value);
}

function decideClaim(it, claim, approve, reason) {
  claim.status = approve ? 'approved' : 'rejected';
  Object.assign(claim, { decidedBy: meId(), decidedAt: Date.now(), reason });
  const title = itemTitle(it);
  if (approve) {
    it.claims.filter(c => c !== claim && c.status === 'pending').forEach(c => {
      Object.assign(c, { status: 'rejected', reason: 'other', decidedBy: meId(), decidedAt: Date.now() });
      notify(c.userId, 'claim', 'n_claimNo', { item: title }, 'lostfound/' + it.id);
    });
    setItemStatus(it, 'approved');
  } else if (!it.claims.some(c => c.status === 'pending')) {
    setItemStatus(it, 'open');
    const lost = claim.lostId && itemById(claim.lostId);
    if (lost && lost.status === 'matched') setItemStatus(lost, 'open');
  }
  commit('items');
  notify(claim.userId, 'claim', approve ? 'n_claimOk' : 'n_claimNo', { item: title }, 'lostfound/' + it.id);
  audit(approve ? 'claim_approve' : 'claim_reject', 'item', it.id, `${userName(claim.userId)} · ${t('answersMatched', { k: claim.results.filter(Boolean).length, n: claim.results.length })}`);
  toast(t(approve ? 'claimApproved' : 'claimRejected'), 'ok');
  openItem(it.id);
  rerender();
}

const normRoll = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');

function openConfirmHandover(itemId) {
  const it = itemById(itemId);
  const claim = it.claims.find(c => c.status === 'approved');
  const h = it.handover || {};
  openModal(`<h2 id="mTitle">${ic('handshake')} ${t('confirmHo')}</h2><p class="small muted">${esc(itemTitle(it))} · ${esc(t('claimantIs', { name: userName(claim.userId) }))}</p>
    <form id="hcForm" novalidate>

      <label class="check"><input type="checkbox" id="hcIn"> <span>${t('hoInPerson')}</span></label>
      <div class="foot"><button type="button" class="btn ghost" id="hcBack">${t('back')}</button><button type="submit" class="btn teal">${ic('check')} ${t('confirmHo')}</button></div>
    </form>`);
  $('#hcBack').onclick = () => openItem(itemId);
  $('#hcForm').onsubmit = e => {
    e.preventDefault();
    if (!validate($('#hcForm'))) return;
    if (normRoll($('#hcRoll').value) !== normRoll(userById(claim.userId).roll)) return fail($('#hcRoll'), t('hoRollBad'));
    if (!$('#hcIn').checked) return fail($('#hcIn'), t('oathNeeded'));
    completeHandover(it, claim, { witness: $('#hcWit').value.trim(), note: $('#hcNote').value.trim(), place: h.place || 'security' });
  };
}

function completeHandover(it, claim, { witness, note, place }) {
  // TODO(student): issue a signed QR handover receipt (item id, claim id, timestamp, HMAC) that the owner scans to confirm receipt on their own phone.
  db('handovers').unshift({ id: uid('h'), itemId: it.id, lostId: claim.lostId || null, from: it.userId, to: claim.userId, witness, place, ts: Date.now(), confirmedBy: meId(), rollCheck: true, note });
  setItemStatus(it, 'returned');
  const lost = claim.lostId && itemById(claim.lostId);
  if (lost && lost.status !== 'resolved') setItemStatus(lost, 'resolved');
  commit('items');
  commit('handovers');
  [claim.userId, it.userId].filter(u => u !== meId()).forEach(u => notify(u, 'claim', 'n_returned', { item: itemTitle(it) }, 'lostfound/log'));
  audit('handover', 'item', it.id, `${itemTitle(it)} to ${userName(claim.userId)} (${witness})`);
  toast(t('hoDone'), 'ok');
  openItem(it.id);
  rerender();
}

  ntDeleted: ['Notice deleted', 'نوٹس حذف ہو گیا'],
  ntDeleteQ: ['Delete this notice?', 'یہ نوٹس حذف کریں؟'],
  ntExpiryPast: ['The expiry date must be today or later.', 'میعاد کی تاریخ آج یا بعد کی ہونی چاہیے۔'],
});

const ntUi = { q: '', cat: 'all', unread: false, expired: false, open: {} };

const noticeExpired = n => parseDate(n.expires) < TODAY;
const audienceLabel = a => (DEPTS[a] ? tx(DEPTS[a]) : t('aud_' + a));

function audienceUsers(a) {
  const students = db('users').filter(u => !u.staff);
  if (a === 'all') return students;
  if (a === 'hostel') return students.filter(u => u.hostel);
  if (/^year\d$/.test(a)) return students.filter(u => u.year === +a.slice(4));
  return students.filter(u => u.dept === a);
}
const inAudience = (n, uid0 = meId()) => isStaff() || audienceUsers(n.audience).some(u => u.id === uid0);
const isRead = (n, uid0 = meId()) => !!(db('reads')[n.id] || {})[uid0];

function markRead(n) {
  const reads = db('reads');
  reads[n.id] = reads[n.id] || {};
  if (reads[n.id][meId()]) return;
  reads[n.id][meId()] = Date.now();
  commit('reads');
  updateNavBadges();
}

const myNotices = () => visible(db('notices')).filter(n => inAudience(n));
const unreadNotices = () => myNotices().filter(n => !noticeExpired(n) && !isRead(n));

function renderNotices(arg) {
  const linked = arg && db('notices').find(n => n.id === arg);
  if (linked) {
    ntUi.open[arg] = true;
    markRead(linked);
  }
  const actions = (unreadNotices().length ? `<button class="btn ghost" id="ntAllRead">${ic('check-check')} ${t('ntAllRead')}</button>` : '') + (canPostNotice() ? `<button class="btn" id="ntNew">${ic('plus')} ${t('ntNew')}</button>` : '');
  $('#page').innerHTML = pageHead('megaphone', t('nav_notices'), t('ntTitle'), t('ntSub'), actions) + '<div id="ntBody"></div>';
  if ($('#ntNew')) $('#ntNew').onclick = openNoticeForm;
  if ($('#ntAllRead')) {
    $('#ntAllRead').onclick = () => {
      unreadNotices().forEach(markRead);
      renderNotices();
    };
  }
  drawNotices();
  if (arg) {
    const el = $(`[data-notice="${arg}"]`);
    if (el) el.scrollIntoView({ block: 'center' });
  }
}

function noticeList() {
  const q = ntUi.q.toLowerCase();
  return myNotices()
    .filter(n => ntUi.expired || !noticeExpired(n))
    .filter(n => ntUi.cat === 'all' || n.cat === ntUi.cat)
    .filter(n => !ntUi.unread || !isRead(n))
    .filter(n => !q || [tx(n.title), tx(n.body), n.title.en || '', n.body.en || ''].join(' ').toLowerCase().includes(q))
    .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.posted - a.posted);
}

function drawNotices() {
  const base = myNotices().filter(n => ntUi.expired || !noticeExpired(n));
  const counts = cat => base.filter(n => cat === 'all' || n.cat === cat).length;
  const list = noticeList();
  const chips = [{ id: 'all', en: 'All', ur: 'تمام', icon: 'list' }, ...NOTICE_CATS]
    .map(c => `<button data-ncat="${c.id}" aria-pressed="${ntUi.cat === c.id}">${ic(c.icon)}${esc(tx(c))}<span class="n">${counts(c.id)}</span></button>`)
    .join('');
  $('#ntBody').innerHTML = `<div class="toolbar"><input class="grow" type="search" id="ntQ" placeholder="${esc(t('ntSearch'))}" aria-label="${esc(t('ntSearch'))}" value="${esc(ntUi.q)}">
      <label class="switch"><input type="checkbox" id="ntUnread" ${ntUi.unread ? 'checked' : ''}><i></i>${t('ntUnreadOnly')}</label>
      <label class="switch"><input type="checkbox" id="ntExpired" ${ntUi.expired ? 'checked' : ''}><i></i>${t('ntShowExpired')}</label></div>
    <div class="filter-chips mb">${chips}</div>
    ${list.length ? `<div class="list stagger">${list.map(noticeCard).join('')}</div>` : emptyState('megaphone', t('ntNone'), t('ntNoneSub'))}`;
  bindNotices();
  animateIn($('#ntBody'));
  animateFigures($('#ntBody'));
  announce(list.length + ' ' + t('nav_notices'));
}

function expiryChip(n) {
  const left = daysBetween(TODAY, parseDate(n.expires));
  if (left < 0) return chip(t('expired'), '', 'hourglass');
  if (left === 0) return chip(t('ntExpiresToday'), 'bad', 'hourglass');
  if (left <= 3) return chip(t('ntExpiresSoon', { n: left }), 'ochre', 'hourglass');
  return chip(t('ntExpires', { date: fmtDate(parseDate(n.expires), { day: 'numeric', month: 'short' }) }), 'line', 'hourglass');
}

function noticeCard(n) {
  const cat = NOTICE_CATS.find(c => c.id === n.cat) || NOTICE_CATS[0];
  const read = isRead(n);
  const open = ntUi.open[n.id];
  const body = tx(n.body);
  const short = body.length > 220 && !open ? body.slice(0, 220).trim() + '…' : body;
  const audience = audienceUsers(n.audience);
  const readers = audience.filter(u => isRead(n, u.id)).length;
  const staffRow = isStaff()
    ? `<div class="row mt"><button class="btn ghost xs" data-nact="receipts">${ic('eye')} ${t('ntReadBy', { k: readers, n: audience.length })}</button><div style="flex:1;min-width:100px;max-width:200px">${barHtml(pct(readers, audience.length))}</div>
       <button class="btn ghost xs" data-nact="pin">${ic('pin')} ${t(n.pinned ? 'ntUnpin' : 'ntPin')}</button><button class="btn ghost xs" data-nact="extend">${ic('hourglass')} ${t('ntExtend')}</button><button class="btn danger xs" data-nact="delete">${ic('trash')} ${t('delete')}</button></div>`
    : '';
  const files = (n.attachments || []).map(f => `<span class="att" title="${esc(t('ntAttachMeta'))}">${ic('paperclip')}<span class="ltr">${esc(f.name)}</span><span class="muted tnum">${fileSize(f.size)}</span></span>`).join('');
  return `<article class="notice ${n.pinned ? 'pinned' : ''} ${read ? '' : 'unread'} ${noticeExpired(n) ? 'expired' : ''}" data-notice="${n.id}">
    <div class="row">${n.pinned ? chip(t('ntPinned'), 'maroon', 'pin') : ''}${chip(tx(cat), 'teal', cat.icon)}${read ? '' : chip(t('ntNewBadge'), 'maroon')}${expiryChip(n)}<span class="small muted">${esc(ago(n.posted))} · ${esc(audienceLabel(n.audience))}</span></div>
    <h3>${esc(tx(n.title))}</h3><div class="body">${esc(short)}</div>
    ${files ? `<div class="row mt">${files}</div>` : ''}
    <div class="row mt">${body.length > 220 && !open ? `<button class="btn ghost xs" data-nact="more">${t('ntReadMore')}</button>` : ''}${read ? '' : `<button class="btn soft teal xs" data-nact="read">${ic('check')} ${t('ntMarkRead')}</button>`}</div>
    ${staffRow}</article>`;
}

function bindNotices() {
  $('#ntQ').oninput = debounce(e => {
    ntUi.q = e.target.value;
    drawNotices();
    $('#ntQ').focus();
  }, 200);
  $('#ntUnread').onchange = e => {
    ntUi.unread = e.target.checked;
    drawNotices();
  };
  $('#ntExpired').onchange = e => {
    ntUi.expired = e.target.checked;
    drawNotices();
  };
  $$('[data-ncat]').forEach(b => {
    b.onclick = () => {
      ntUi.cat = b.dataset.ncat;
      drawNotices();
    };
  });
  $$('[data-nact]').forEach(b => {
    b.onclick = () => {
      const n = db('notices').find(x => x.id === b.closest('[data-notice]').dataset.notice);
      noticeAction(n, b.dataset.nact);
    };
  });
}

async function noticeAction(n, act) {
  if (act === 'more' || act === 'read') {
    ntUi.open[n.id] = true;
    markRead(n);
  }
  if (act === 'receipts') return openReceipts(n);
  if (act === 'pin') {
    n.pinned = !n.pinned;
    audit(n.pinned ? 'notice_pin' : 'notice_unpin', 'notice', n.id, tx(n.title));
  }
  if (act === 'extend') {
    n.expires = isoDate(Math.max(parseDate(n.expires), TODAY) + 7 * DAY + 2 * HOUR);
    audit('notice_extend', 'notice', n.id, n.expires);
  }
  if (act === 'delete') {
    if (!(await confirmBox(t('ntDeleteQ'), tx(n.title), { ok: t('delete'), danger: true }))) return;
    db('notices').splice(db('notices').indexOf(n), 1);
    audit('notice_delete', 'notice', n.id, tx(n.title));
    toast(t('ntDeleted'), 'ok');
  }
  commit('notices');
  drawNotices();
}

function openReceipts(n) {
  const audience = audienceUsers(n.audience);
  const rows = audience
    .map(u => ({ u, ts: (db('reads')[n.id] || {})[u.id] }))
    .sort((a, b) => (b.ts || 0) - (a.ts || 0))
    .map(({ u, ts }) => `<div class="r ${ts ? '' : 'no'}">${avatar(u.id)}<span><b class="small">${esc(u.name)}</b><br><span class="tiny muted">${ts ? esc(fmtDateTime(ts)) : t('ntNotRead')}</span></span></div>`)
    .join('');
  const k = audience.filter(u => isRead(n, u.id)).length;
  openModal(`<h2 id="mTitle">${ic('check-check')} ${t('ntReceipts')}</h2><p class="small muted">${esc(tx(n.title))}</p>
    <div class="row mb"><b class="tnum">${t('ntReadBy', { k, n: audience.length })}</b><div style="flex:1">${barHtml(pct(k, audience.length))}</div></div><div class="receipts">${rows}</div>`);
}

function openNoticeForm() {
  const auds = ['all', 'hostel', 'year1', 'year4', ...Object.keys(DEPTS).filter(d => !['sao', 'sec'].includes(d))];
  openModal(`<h2 id="mTitle">${ic('megaphone')} ${t('ntNew')}</h2><form id="ntForm" novalidate>
    <label class="f" for="nfTitle"><span>${t('ntFormTitle')}</span><input type="text" id="nfTitle" data-req data-min="6" maxlength="120"></label>
    <label class="f" for="nfBody"><span>${t('ntFormBody')}</span><textarea id="nfBody" data-req data-min="20" maxlength="1500"></textarea></label>
    <label class="f" for="nfTitleUr"><span>${t('ntFormTitleUr')}</span><input type="text" id="nfTitleUr" dir="rtl" maxlength="120"></label>
    <label class="f" for="nfBodyUr"><span>${t('ntFormBodyUr')}</span><textarea id="nfBodyUr" dir="rtl" maxlength="1500"></textarea></label>
    <div class="grid3"><label class="f" for="nfCat"><span>${t('category')}</span><select id="nfCat">${optionList(NOTICE_CATS, 'academic')}</select></label>
      <label class="f" for="nfAud"><span>${t('ntAudience')}</span><select id="nfAud">${auds.map(a => `<option value="${a}">${esc(audienceLabel(a))}</option>`).join('')}</select></label>
      <label class="f" for="nfExp"><span>${t('ntFormExpiry')}</span><input type="date" id="nfExp" data-req value="${dayOffset(14)}" min="${isoDate(Date.now())}"></label></div>
    <label class="check"><input type="checkbox" id="nfPin"> <span>${t('ntFormPin')}</span></label>
    <label class="f mt" for="nfFiles"><span>${t('ntFormFiles')}</span><input type="file" id="nfFiles" multiple><small>${t('ntAttachMeta')}</small></label>
    <div class="foot"><button type="button" class="btn ghost" id="nfCancel">${t('cancel')}</button><button type="submit" class="btn">${ic('send')} ${t('post')}</button></div></form>`, { wide: true });
  $('#nfCancel').onclick = closeModal;
  $('#ntForm').onsubmit = e => {
    e.preventDefault();
    saveNotice();
  };
}

function saveNotice() {
  if (!validate($('#ntForm'))) return;
  if (parseDate($('#nfExp').value) < TODAY) return fail($('#nfExp'), t('ntExpiryPast'));
  const en = [$('#nfTitle').value.trim(), $('#nfBody').value.trim()];
  const ur = [$('#nfTitleUr').value.trim() || en[0], $('#nfBodyUr').value.trim() || en[1]];
  const n = {
    id: uid('n'),
    cat: $('#nfCat').value,
    posted: Date.now(),
    expires: $('#nfExp').value,
    title: { en: en[0], ur: ur[0] },
    body: { en: en[1], ur: ur[1] },
    author: meId(),
    audience: $('#nfAud').value,
    pinned: $('#nfPin').checked,
    attachments: [...$('#nfFiles').files].map(f => ({ name: f.name, size: f.size, type: f.type || 'application/octet-stream' })),
  };
  db('notices').unshift(n);
  commit('notices');
  const people = audienceUsers(n.audience);
  people.forEach(u => notify(u.id, 'notice', 'n_newNotice', { title: n.title.en }, 'notices/' + n.id));
  audit('notice_post', 'notice', n.id, `${n.title.en} · ${audienceLabel(n.audience)}`);
  closeModal();
  toast(t('ntPosted', { n: people.length }), 'ok');
  renderNotices();
}

const evUi = { view: 'month', month: isoDate(TODAY).slice(0, 7), sel: null, cat: 'all', soc: 'all', mine: false };
const eventById = id => db('events').find(e => e.id === id);
const eventStart = e => parseDate(e.date) + toMin(e.start) * MIN;
const eventPast = e => parseDate(e.date) + toMin(e.end) * MIN < Date.now();
const goingCount = e => e.base + Object.values(e.rsvp).filter(r => r.s === 'going').length;
const myRsvp = e => (e.rsvp[meId()] || {}).s || 'none';
const hostName = e => (e.society ? tx((db('societies').find(s => s.id === e.society) || {}).name) : tx(e.host) || t('evFUni'));
const evCat = id => EVENT_CATS.find(c => c.id === id) || EVENT_CATS[0];

function waitlist(e) {
  return Object.entries(e.rsvp)
    .filter(([, r]) => r.s === 'waitlist')
    .sort((a, b) => a[1].ts - b[1].ts)
    .map(([userId]) => userId);
}

function eventsFiltered() {
  return visible(db('events'))
    .filter(e => viewable(e, e.createdBy))
    .filter(e => evUi.cat === 'all' || e.cat === evUi.cat)
    .filter(e => evUi.soc === 'all' || (e.society || 'uni') === evUi.soc)
    .filter(e => !evUi.mine || ['going', 'interested', 'waitlist'].includes(myRsvp(e)))
    .sort((a, b) => eventStart(a) - eventStart(b));
}

// Set an RSVP; full events put you on the waitlist; leaving promotes the next waitlisted person.
function setRsvp(e, status) {
  const prev = myRsvp(e);
  if (status === 'going' && prev !== 'going' && goingCount(e) >= e.capacity) status = 'waitlist';
  if (status === 'none') delete e.rsvp[meId()];
  else e.rsvp[meId()] = { s: status, ts: Date.now() };
  let promoted = null;
  if (prev === 'going' && status !== 'going' && goingCount(e) < e.capacity) {
    promoted = waitlist(e)[0] || null;
    if (promoted) {
      e.rsvp[promoted] = { s: 'going', ts: Date.now() };
      notify(promoted, 'event', 'n_waitlistUp', { event: tx(e.title) }, 'events/' + e.id);
    }
  }
  commit('events');
  if (status === 'waitlist') toast(t('evFullWait', { n: waitlist(e).indexOf(meId()) + 1 }));
  else toast(promoted ? t('evPromoted', { name: userName(promoted) }) : t('evRsvpSaved'), 'ok');
  return status;
}

function evToolbar() {

  };

function monthView() {
  const [y, m] = evUi.month.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const lead = (first.getDay() + 6) % 7;
  const start = first.getTime() - lead * DAY;
  const list = eventsFiltered();
  const byDate = {};
  list.forEach(e => (byDate[e.date] = byDate[e.date] || []).push(e));
  let cells = [1, 2, 3, 4, 5, 6, 0].map(d => `<div class="dow">${t('dow_' + d)}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const ts = startOfDay(start + i * DAY + 2 * HOUR);
    const iso = isoDate(ts);
    const evs = byDate[iso] || [];
    const cls = ['day', new Date(ts).getMonth() !== m - 1 ? 'out' : '', ts === TODAY ? 'today' : '', evUi.sel === iso ? 'sel' : ''].join(' ');
    const chips = evs.slice(0, 2).map(e => `<span class="ev ${myRsvp(e) === 'going' ? 'going' : ''}">${esc(tx(e.title))}</span>`).join('');
    cells += `<button class="${cls}" data-day="${iso}" aria-label="${esc(fmtDate(ts))}: ${evs.length}"><span class="dn">${new Date(ts).getDate()}</span>${chips}${evs.length > 2 ? `<span class="more">+${evs.length - 2} ${t('more')}</span>` : ''}</button>`;
  }
  const title = first.toLocaleDateString(locale(), { month: 'long', year: 'numeric', numberingSystem: 'latn' });
  const dayList = evUi.sel ? (byDate[evUi.sel] || []) : list.filter(e => e.date.startsWith(evUi.month) && !eventPast(e)).slice(0, 4);
  const dayTitle = evUi.sel ? t('evOnDay', { date: fmtDate(parseDate(evUi.sel)) }) : t('evUpcoming');
  return `<div class="card"><div class="cal-head"><button class="btn ghost sm icon" id="evPrev" aria-label="${esc(t('evPrev'))}">${ic('chevron-left', 'flip')}</button><h2>${esc(title)}</h2><button class="btn ghost sm icon" id="evNextM" aria-label="${esc(t('evNext'))}">${ic('chevron-right', 'flip')}</button><button class="btn ghost sm" id="evTodayBtn">${t('evToday')}</button></div>

}

// ---------- events: iCalendar (.ics) export ----------
const icsEscape = s => String(s ?? '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');

// Fold content lines at 75 octets as RFC 5545 requires (multi-byte safe for Urdu text).
function icsFold(line) {
  const enc = new TextEncoder();
  const out = [];
  let cur = '';
  let bytes = 0;
  for (const ch of line) {
    const b = enc.encode(ch).length;
    if (bytes + b > 75) {
      out.push(cur);
      cur = ' ' + ch;
      bytes = 1 + b;
    } else {
      cur += ch;
      bytes += b;
    }
  }
  out.push(cur);
  return out.join('\r\n');
}

// Campus times are Pakistan Standard Time (UTC+5, no daylight saving), converted to UTC "Z" stamps.
function icsStamp(date, hm) {
  const [y, m, d] = date.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d, 0, toMin(hm) - 300)).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
}

function icsCalendar(vevents) {
  const head = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//CampusHub//Student Portal//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:CampusHub'];
  return [...head, ...vevents.flat(), 'END:VCALENDAR'].map(icsFold).join('\r\n') + '\r\n';
}

function eventIcs(events) {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const vevents = events.map(e => [
    'BEGIN:VEVENT',
    `UID:${e.id}@campushub.local`,
    `DTSTAMP:${stamp}`,
    `DTSTART:${icsStamp(e.date, e.start)}`,
    `DTEND:${icsStamp(e.date, e.end)}`,
    `SUMMARY:${icsEscape(tx(e.title))}`,
    `DESCRIPTION:${icsEscape(tx(e.desc) + '\n' + t('evHost') + ': ' + hostName(e))}`,
    `LOCATION:${icsEscape(placeName(e.place))}`,
    'STATUS:CONFIRMED',
    'BEGIN:VALARM',
    'TRIGGER:-PT1H',
    'ACTION:DISPLAY',
    `DESCRIPTION:${icsEscape(tx(e.title))}`,
    'END:VALARM',
    'END:VEVENT',
  ]);
  return icsCalendar(vevents);
}

function myTt() {

function blocksFor(tt) {
  const out = [];
  tt.sections.forEach(id => {
    const s = sectionById(id);
    if (!s) return;
    s.meetings.forEach((m, i) => out.push({ key: `${id}#${i}`, kind: 'section', id, code: s.code, label: `${s.code}-${s.section}`, title: tx(s.title), room: s.room, lab: s.kind === 'lab', ...m }));
  });
  tt.personal.forEach(p => out.push({ key: p.id, kind: 'personal', id: p.id, code: p.title, label: p.title, title: p.title, room: '', day: p.day, start: p.start, end: p.end }));
  return out;
}

const overlaps = (a, b) => a.day === b.day && toMin(a.start) < toMin(b.end) && toMin(b.start) < toMin(a.end);

// Pairwise clash detection over all meetings (O(n²) is fine for a student week).
function findClashes(blocks) {
  const pairs = [];
  for (let i = 0; i < blocks.length; i++) {
    for (let j = i + 1; j < blocks.length; j++) {
      if (blocks[i].id !== blocks[j].id && overlaps(blocks[i], blocks[j])) pairs.push([blocks[i], blocks[j]]);
    }
  }
  return pairs;
}

function clashesForSection(sec, blocks) {
  const hits = blocks.filter(b => b.id !== sec.id && sec.meetings.some(m => overlaps(m, b)));
  return unique(hits.map(b => b.label));
}

const myCredits = tt => sum(tt.sections.map(id => (sectionById(id) || {}).credits || 0));

function renderTimetable(arg) {
  if (['week', 'courses', 'rooms'].includes(arg)) ttUi.tab = arg;
  const tabs = [
    ['week', t('ttWeek'), 'calendar'],
    ['courses', t('ttCourses'), 'book', myTt().sections.length],
    ['rooms', t('ttRooms'), 'door'],
  ];
  $('#page').innerHTML = pageHead('clock', t('nav_timetable'), t('ttTitle'), t('ttSub')) + tabsLine('ttTabs', tabs, ttUi.tab) + '<div id="ttBody"></div>';
  bindTabs($('#ttTabs'), tab => setHash('timetable/' + tab));
  const draw = { week: drawWeek, courses: drawCatalogue, rooms: drawRoomFinder }[ttUi.tab];
  draw($('#ttBody'));
  animateIn($('#ttBody'));
  animateFigures($('#ttBody'));
}

function drawWeek(body) {
  const tt = myTt();
  const blocks = blocksFor(tt);
  const clashes = findClashes(blocks);
  const credits = myCredits(tt);
  const kpis = `<div class="kpis mb"><div class="kpi"><span class="bub">${ic('book')}</span><div><div class="v" data-count="${tt.sections.length}">0</div><div class="l">${t('ttSections')}</div></div></div>
    <div class="kpi teal"><span class="bub">${ic('award')}</span><div><div class="v" data-count="${credits}">0</div><div class="l">${t('ttCredits')}</div></div></div>
    <div class="kpi ${clashes.length ? '' : 'ok'}"><span class="bub">${ic(clashes.length ? 'alert' : 'check-circle')}</span><div><div class="v" data-count="${clashes.length}">0</div><div class="l">${t('ttClashes')}</div></div></div></div>`;
  const clashNote = clashes.length
    ? `<div class="note bad mb" role="alert">${ic('alert')}<span>${clashes.map(([a, b]) => esc(t('ttClashList', { a: a.label, b: b.label, day: dayName(a.day) }))).join('<br>')}</span></div>`
    : `<div class="note ok mb">${ic('check-circle')}<span>${t('ttNoClash')}</span></div>`;
  const credNote = credits > 21 ? `<div class="note mb">${ic('info')}<span>${t('ttCreditWarnHigh')}</span></div>` : credits && credits < 12 ? `<div class="note mb">${ic('info')}<span>${t('ttCreditWarnLow')}</span></div>` : '';
  const actions = `<div class="toolbar"><button class="btn ghost sm" id="ttPersonal">${ic('plus')} ${t('ttAddPersonal')}</button><span class="spacer"></span><button class="btn ghost sm" id="ttIcs">${ic('download')} ${t('ttExportIcs')}</button><button class="btn ghost sm" id="ttPrint">${ic('printer')} ${t('ttPrint')}</button></div>`;
  body.innerHTML = kpis + clashNote + credNote + actions + (blocks.length ? weekGrid(blocks, clashes) : emptyState('calendar', t('ttEmpty'), t('ttEmptySub'))) + gapsCard(blocks);
  $('#ttPersonal').onclick = openPersonalForm;
  $('#ttIcs').onclick = () => downloadText('campushub-timetable.ics', timetableIcs(blocks), 'text/calendar');
  $('#ttPrint').onclick = () => printDoc(timetableReportHtml());
  $$('[data-blk]', body).forEach(b => (b.onclick = () => blockAction(b.dataset.blk)));
  announce(clashes.length ? t('ttClashes') + ': ' + clashes.length : t('ttNoClash'));
}

function weekGrid(blocks, clashes) {
  const clashKeys = new Set(clashes.flatMap(([a, b]) => [a.key, b.key]));
  const firstOf = new Set(clashes.map(([a]) => a.key));
  const height = (TT_END - TT_START) * TT_PX;
  let times = '';
  for (let m = TT_START; m < TT_END; m += 60) times += `<span style="top:${(m - TT_START) * TT_PX}px">${fmtTime(fromMin(m)).replace(':00', '')}</span>`;
  const cols = DAYS.map(d => {
    const items = blocks
      .filter(b => b.day === d)
      .map(b => {
        const top = (toMin(b.start) - TT_START) * TT_PX;
        const h = (toMin(b.end) - toMin(b.start)) * TT_PX;
        const half = clashKeys.has(b.key) ? (firstOf.has(b.key) ? 'half-a' : 'half-b') : '';
        const cls = ['blk', b.kind === 'personal' ? 'personal' : '', b.lab ? 'lab' : '', clashKeys.has(b.key) ? 'clash' : '', half].join(' ');
        return `<button class="${cls}" style="top:${top}px;height:${h}px" data-blk="${esc(b.id)}" title="${esc(b.title)}"><b>${esc(b.label)}</b><span class="tt-time">${fmtTime(b.start)}</span><span class="room"> · <bdi>${esc(b.room)}</bdi></span></button>`;
      })
      .join('');
    return `<div class="tt-col" style="min-height:${height}px">${items}</div>`;
  }).join('');
  const heads = DAYS.map(d => `<div class="hd ${d === new Date().getDay() ? 'today' : ''}">${dayName(d)}</div>`).join('');
  return `<div class="tt-grid"><div class="hd"></div>${heads}<div class="tt-times" style="min-height:${height}px">${times}</div>${cols}</div>`;
}

// Gaps of at least an hour between 8:00 and 17:00 on today's (or Monday's) schedule.
function freeGaps(blocks, day) {
  const busy = blocks
    .filter(b => b.day === day)
    .map(b => [toMin(b.start), toMin(b.end)])
    .sort((a, b) => a[0] - b[0]);
  const gaps = [];
  let cursor = TT_START;
  busy.forEach(([s, e]) => {
    if (s - cursor >= 60) gaps.push([cursor, s]);
    cursor = Math.max(cursor, e);
  });
  if (17 * 60 - cursor >= 60) gaps.push([cursor, 17 * 60]);
  return gaps;
}

function gapsCard(blocks) {
  const d = todayDow();
  const gaps = freeGaps(blocks, d);
  const weekend = [0, 6].includes(new Date().getDay());
  return `<div class="card mt"><h3 class="mb">${ic('clock')} ${t('ttFreeGaps')} · ${dayName(d)}</h3>${weekend ? `<p class="small muted">${t('ttWeekend')}</p>` : ''}
    <div class="chips">${gaps.map(([s, e]) => chip(`${fmtTime(fromMin(s))} – ${fmtTime(fromMin(e))}`, 'teal', 'clock')).join('') || `<span class="small muted">${t('ttNoGaps')}</span>`}</div></div>`;
}

function blockAction(id) {
  const sec = sectionById(id);
  if (sec) {
    ttUi.q = sec.code;
    setHash('timetable/courses');
    return;
  }
  const tt = myTt();
  const p = tt.personal.find(x => x.id === id);
  if (!p) return;
  confirmBox(t('ttRemove') + ': ' + p.title, `${dayName(p.day)} ${fmtTime(p.start)} – ${fmtTime(p.end)}`, { ok: t('ttRemove'), danger: true }).then(ok => {
    if (!ok) return;
    tt.personal = tt.personal.filter(x => x.id !== id);
    commit('timetable');
    renderTimetable('week');
  });
}

  openModal(`<h2 id="mTitle">${ic('plus')} ${t('ttAddPersonal')}</h2><form id="ttpForm" novalidate>
    <label class="f" for="tpTitle"><span>${t('ttPTitle')}</span><input type="text" id="tpTitle" data-req data-min="3" maxlength="40" placeholder="${esc(t('ttPTitlePh'))}"></label>
    <div class="grid3"><label class="f" for="tpDay"><span>${t('ttDay')}</span><select id="tpDay">${DAYS.map(d => `<option value="${d}">${dayName(d)}</option>`).join('')}</select></label>
      <label class="f" for="tpStart"><span>${t('ttStart')}</span><input type="time" id="tpStart" value="16:00" data-req></label>
      <label class="f" for="tpEnd"><span>${t('ttEnd')}</span><input type="time" id="tpEnd" value="17:30" data-req></label></div>
    <div class="foot"><button type="button" class="btn ghost" id="tpCancel">${t('cancel')}</button><button type="submit" class="btn">${ic('save')} ${t('save')}</button></div></form>`);
  $('#tpCancel').onclick = closeModal;
  $('#ttpForm').onsubmit = e => {
    e.preventDefault();
    if (!validate($('#ttpForm'))) return;
    const p = { id: uid('p'), title: $('#tpTitle').value.trim(), day: +$('#tpDay').value, start: $('#tpStart').value, end: $('#tpEnd').value };
    if (toMin(p.end) <= toMin(p.start)) return fail($('#tpEnd'), t('evEndBeforeStart'));
    if (toMin(p.start) < TT_START || toMin(p.end) > TT_END) return fail($('#tpStart'), t('ttOutside'));
    myTt().personal.push(p);
    commit('timetable');
    closeModal();
    const hits = blocksFor(myTt()).filter(b => b.id !== p.id && overlaps(b, p));
    toast(hits.length ? t('ttWouldClash', { list: hits.map(h => h.label).join(', ') }) : t('saved'), hits.length ? 'bad' : 'ok');
    renderTimetable('week');
  };
}

function drawCatalogue(body) {
  const tt = myTt();
  const blocks = blocksFor(tt);
  const q = ttUi.q.toLowerCase();
  const list = SECTIONS.filter(s => !q || [s.code, s.title.en, s.title.ur, s.instructor].join(' ').toLowerCase().includes(q));
  const rows = list.map(s => {
    const mine = tt.sections.includes(s.id);
    const hits = mine ? [] : clashesForSection(s, blocks);
    const when = s.meetings.map(m => `${dayName(m.day)} ${fmtTime(m.start)}–${fmtTime(m.end)}`).join(', ');
    return `<div class="course-row ${mine ? 'in' : ''} ${hits.length ? 'warn' : ''}"><div><b>${esc(s.code)}-${esc(s.section)}</b> · ${esc(tx(s.title))} ${s.kind === 'lab' ? chip(t('ttLab'), 'ochre') : ''} ${chip(t('ttCr', { n: s.credits }), 'line')}

    $('#ttQ').focus();

async function toggleSection(id) {
  const tt = myTt();
  const s = sectionById(id);
  if (tt.sections.includes(id)) {
    tt.sections = tt.sections.filter(x => x !== id);
    commit('timetable');
    toast(t('ttRemoved', { code: s.code }), 'ok');
    return renderTimetable('courses');
  }
  const other = tt.sections.map(sectionById).find(x => x && x.code === s.code);
  if (other) return toast(t('ttSameCourse', { code: s.code }), 'bad');
  const hits = clashesForSection(s, blocksFor(tt));
  if (hits.length && !(await confirmBox(t('ttClashTitle'), t('ttClashBody', { code: `${s.code}-${s.section}`, list: hits.join(', ') }), { ok: t('ttAddAnyway'), danger: true }))) return;
  tt.sections.push(id);
  commit('timetable');
  toast(t('ttAdded', { code: s.code }), hits.length ? 'bad' : 'ok');
  renderTimetable('courses');
}

// ---------- timetable: free-classroom finder (rooms × slots matrix) ----------
function roomBusy(roomId, day, slot) {
  return SECTIONS.find(s => s.room === roomId && s.meetings.some(m => m.day === day && toMin(m.start) < toMin(slot.end) && toMin(slot.start) < toMin(m.end))) || null;
}

// "Right now" maps to the current weekday and slot; weekends and after-hours roll forward to the next slot.
function currentSlot() {
  const d = new Date();
  const mins = d.getHours() * 60 + d.getMinutes();
  let day = d.getDay();
  let slot = SLOTS.find(s => toMin(s.end) > mins);
  if (day < 1 || day > 5 || !slot) {
    day = day >= 5 || day === 0 ? 1 : day + 1;
    slot = SLOTS[0];
    return { day, slot: slot.id, rolled: true };
  }
  return { day, slot: slot.id, rolled: toMin(slot.start) > mins };
}

function freeRooms(day, slotId, type = 'all', minCap = 0) {
  const slot = SLOTS.find(s => s.id === slotId);
  return ROOMS.filter(r => (type === 'all' || r.type === type) && r.cap >= minCap && !roomBusy(r.id, day, slot));
}

function drawRoomFinder(body) {
  if (!ttUi.day) Object.assign(ttUi, currentSlot());
  const free = freeRooms(ttUi.day, ttUi.slot, ttUi.type, ttUi.minCap);
  const badges = {};
  free.forEach(r => (badges[r.place] = (badges[r.place] || 0) + 1));
  const slotOpts = SLOTS.map(s => `<option value="${s.id}" ${s.id === ttUi.slot ? 'selected' : ''}>${fmtTime(s.start)} – ${fmtTime(s.end)}</option>`).join('');
  body.innerHTML = `<div class="toolbar">
      <label class="f" style="margin:0" for="rfDay"><span>${t('rfDay')}</span><select id="rfDay">${DAYS.map(d => `<option value="${d}" ${d === ttUi.day ? 'selected' : ''}>${dayName(d)}</option>`).join('')}</select></label>
      <label class="f" style="margin:0" for="rfSlot"><span>${t('rfSlot')}</span><select id="rfSlot">${slotOpts}</select></label>
      <label class="f" style="margin:0" for="rfType"><span>${t('rfType')}</span><select id="rfType">${['all', 'lecture', 'lab', 'seminar'].map(k => `<option value="${k}" ${k === ttUi.type ? 'selected' : ''}>${t('rt_' + k)}</option>`).join('')}</select></label>
      <label class="f" style="margin:0;max-width:130px" for="rfCap"><span>${t('rfMinCap')}</span><input type="number" id="rfCap" min="0" max="300" value="${ttUi.minCap}"></label>
      <button class="btn ghost" id="rfNow" style="align-self:flex-end">${ic('clock')} ${t('rfNow')}</button></div>
    ${ttUi.rolled ? `<div class="note teal mb">${ic('info')}<span>${t('rfOutside')}</span></div>` : ''}
    <div class="cols"><div class="card"><div class="card-h"><h3>${ic('door')} ${t('rfFree', { n: free.length })}</h3></div>
      ${free.length ? `<div class="rooms-grid stagger">${free.map(roomCard).join('')}</div>` : emptyState('door', t('rfNone'), t('rfNoneSub'))}</div>
      <div><div class="map-wrap">${campusMap({ badges, highlight: Object.keys(badges), dimOthers: true })}</div><p class="map-hint">${ic('info')} ${t('rfMapNote')}</p></div></div>
    ${roomMatrix(ttUi.day)}<p class="tiny muted mt">${t('rfDisclaimer')}</p>`;
  bindRoomFinder(body);
  announce(t('rfFree', { n: free.length }));
}

const roomCard = r => `<div class="room-card"><span class="bub">${ic(r.type === 'lab' ? 'cpu' : r.type === 'seminar' ? 'users' : 'door')}</span><div style="flex:1"><b>${esc(r.id)}</b><div class="small muted">${esc(placeName(r.place))} · ${t('rt_' + r.type)}</div></div>${chip(t('rfSeats', { n: r.cap }), 'teal', 'users')}</div>`;

function roomMatrix(day) {
  let used = 0;
  const rows = ROOMS.map(r => {
    const cells = SLOTS.map(s => {
      const busy = roomBusy(r.id, day, s);
      if (busy) used++;
      const pick = s.id === ttUi.slot ? 'pick' : '';
      return busy ? `<td class="busy" title="${esc(tx(busy.title))}">${esc(busy.code)}</td>` : `<td class="free ${pick}" data-slot="${s.id}" tabindex="0" role="button" aria-label="${esc(r.id)} ${fmtTime(s.start)} ${t('rfFreeCell')}">${t('rfFreeCell')}</td>`;
    }).join('');
    return `<tr><th class="rm" scope="row">${esc(r.id)} <span class="muted tnum">(${r.cap})</span></th>${cells}</tr>`;
  }).join('');
  const util = pct(used, ROOMS.length * SLOTS.length);
  return `<div class="card mt"><div class="card-h"><h3>${ic('grid')} ${t('rfMatrix', { day: dayName(day) })}</h3><span class="small muted">${t('rfUtil', { p: util })}</span></div>
    <div class="mx-wrap"><table class="mx"><thead><tr><th></th>${SLOTS.map(s => `<th>${fmtTime(s.start)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function bindRoomFinder(body) {
  const redraw = () => drawRoomFinder(body);
  $('#rfDay').onchange = e => {
    ttUi.day = +e.target.value;
    ttUi.rolled = false;
    redraw();
  };
  $('#rfSlot').onchange = e => {
    ttUi.slot = e.target.value;
    ttUi.rolled = false;
    redraw();
  };
  $('#rfType').onchange = e => {
    ttUi.type = e.target.value;
    redraw();
  };
  $('#rfCap').onchange = e => {
    ttUi.minCap = Math.max(0, +e.target.value || 0);
    redraw();
  };
  $('#rfNow').onclick = () => {
    Object.assign(ttUi, currentSlot());
    redraw();
  };
  $$('td.free', body).forEach(td => {
    const pick = () => {
      ttUi.slot = td.dataset.slot;
      ttUi.rolled = false;
      redraw();
    };
    td.onclick = pick;
    td.onkeydown = e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        pick();
      }
    };
  });
  // TODO(student): let students request a free room for a study group (slot hold, then department approval, then the room shows as booked in this matrix).
}

// ---------- timetable: weekly .ics (16-week semester) and print ----------
function nextWeekday(day) {
  const d = new Date(TODAY);
  while (d.getDay() !== day) d.setDate(d.getDate() + 1);
  return isoDate(d.getTime());
}

function timetableIcs(blocks) {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const vevents = blocks.map(b => {
    const date = nextWeekday(b.day);
    return ['BEGIN:VEVENT', `UID:${b.key.replace(/[^\w-]/g, '')}-${meId()}@campushub.local`, `DTSTAMP:${stamp}`, `DTSTART:${icsStamp(date, b.start)}`, `DTEND:${icsStamp(date, b.end)}`, 'RRULE:FREQ=WEEKLY;COUNT=16', `SUMMARY:${icsEscape(b.label + (b.kind === 'section' ? ' ' + b.title : ''))}`, `LOCATION:${icsEscape(b.room)}`, 'END:VEVENT'];
  });
  return icsCalendar(vevents);
}

function timetableReportHtml() {
  const tt = myTt();
  const blocks = blocksFor(tt).sort((a, b) => a.day - b.day || toMin(a.start) - toMin(b.start));
  const clashes = findClashes(blocks);
  const rows = blocks.map(b => `<tr><td>${dayName(b.day)}</td><td>${fmtTime(b.start)} – ${fmtTime(b.end)}</td><td>${esc(b.label)}</td><td>${esc(b.title)}</td><td>${esc(b.room)}</td><td>${b.kind === 'section' ? esc(sectionById(b.id).instructor) : t('ttPersonal')}</td></tr>`).join('');
  return `<h1>${t('ttTitle')} — ${esc(me().name)}</h1><div class="meta"><bdi>${esc(me().roll)}</bdi> · ${esc(deptName(me().dept))} · ${t('ttCredits')}: ${myCredits(tt)} · ${fmtDate(Date.now())}</div>
    <table><thead><tr><th>${t('ttDay')}</th><th>${t('rfSlot')}</th><th>${t('ttSections')}</th><th>${t('fTitle')}</th><th>${t('hoPlace')}</th><th>${t('ttInstructor')}</th></tr></thead><tbody>${rows}</tbody></table>
    <h2>${t('ttClashes')}: ${clashes.length}</h2>${clashes.map(([a, b]) => `<p>${esc(t('ttClashList', { a: a.label, b: b.label, day: dayName(a.day) }))}</p>`).join('')}
    <div class="foot">CampusHub · ${t('illustrative')}</div>`;
}
