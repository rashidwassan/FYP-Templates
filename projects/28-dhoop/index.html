function shuffled(arr, r) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  const r = rng(now() & 0xffff);
  QZ.order = QUIZ.map(() => shuffled([0, 1, 2, 3], r));
  QZ.i = 0;
  QZ.picks = [];
  QZ.done = false;
}

function renderQuiz() {
  if (!QZ.order) startQuiz();
  if (QZ.done) return renderQuizResult();
  const q = QUIZ[QZ.i];
  const pick = QZ.picks[QZ.i];
  const answered = pick != null;
  $('#view').innerHTML = `
    <a class="btn link sm back" href="#learn">${ic('arrow-left', 'flip')}${t('le_all')}</a>
    <section class="card quiz"><div class="between"><span class="tag">${t('le_qOf', { i: QZ.i + 1, n: QUIZ.length })}</span><span class="chip">${t('le_score', { n: quizScore() })}</span></div>
      <div class="bar sun mt-s"><i data-w="${(100 * (QZ.i + (answered ? 1 : 0))) / QUIZ.length}"></i></div>
      <h3 class="q">${esc(L(q.q))}</h3>
      <div class="opts stagger" role="radiogroup">${QZ.order[QZ.i].map(oi => {
        const cls = !answered ? '' : oi === q.a ? 'right' : oi === pick ? 'wrong' : 'dim';
        const icon = { right: 'check-circle', wrong: 'x-circle' }[cls] || 'circle';
        return `<button type="button" class="opt ${cls}" data-o="${oi}" role="radio" aria-checked="${oi === pick}" ${answered ? 'disabled' : ''}>${ic(icon)}<span>${esc(L(q.o[oi]))}</span></button>`;
      }).join('')}</div>
      ${answered ? `${noteHtml(pick === q.a ? 'ok' : 'bad', pick === q.a ? 'check-circle' : 'info', `<b>${pick === q.a ? t('le_right') : t('le_wrong')}</b> ${esc(L(q.why))}`, 'mt')}
        <div class="row mt"><button class="btn" type="button" id="qNext">${QZ.i + 1 < QUIZ.length ? t('next') : t('le_finish')} ${ic('arrow-right', 'flip')}</button></div>` : ''}</section>`;
  $$('[data-o]').forEach(b => (b.onclick = () => {
    QZ.picks[QZ.i] = Number(b.dataset.o);
    announce(QZ.picks[QZ.i] === q.a ? t('le_right') : t('le_wrong'));
    renderQuiz();
    settle($('#view'));
    $('#qNext') && $('#qNext').focus();
  }));
  if ($('#qNext')) $('#qNext').onclick = () => {
    if (QZ.i + 1 < QUIZ.length) QZ.i++;
    else finishQuiz();
    renderQuiz();
    animateIn($('#view'));
  };
}

function finishQuiz() {
  QZ.done = true;
  const score = quizScore();
  S.quiz.attempts = [{ at: now(), score }, ...S.quiz.attempts].slice(0, 20);
  S.quiz.best = Math.max(S.quiz.best || 0, score);
  persist('quiz');
  logEvent('ev_quiz', { n: score, t: QUIZ.length }, 'award');
}

const quizScore = () => QZ.picks.filter((p, i) => p === QUIZ[i].a).length;
const reviewItem = q => `<li><b>${esc(L(q.q))}</b><span>${esc(L(q.o[q.a]))}</span><small class="muted">${esc(L(q.why))}</small></li>`;

function renderQuizResult() {
  const score = quizScore();
  const missed = QUIZ.map((q, i) => ({ q, i })).filter(({ q, i }) => QZ.picks[i] !== q.a);
  const r = 46;
  const L2 = 2 * Math.PI * r;
  $('#view').innerHTML = `
    <a class="btn link sm back" href="#learn">${ic('arrow-left', 'flip')}${t('le_all')}</a>
    <section class="card quiz result"><div class="ring-wrap"><svg viewBox="0 0 112 112" class="ring" aria-hidden="true"><circle class="track" cx="56" cy="56" r="${r}"/>
      <circle class="val" cx="56" cy="56" r="${r}" style="stroke-dasharray:${L2};stroke-dashoffset:${L2 * (1 - score / QUIZ.length)}"/></svg><b class="num">${score}/${QUIZ.length}</b></div>
      <h3>${t(score === QUIZ.length ? 'le_perfect' : score >= 9 ? 'le_good' : 'le_more')}</h3>
      ${missed.length ? `<h4 class="mt">${t('le_review')}</h4><ul class="review">${missed.map(({ q }) => reviewItem(q)).join('')}</ul>` : ''}
      <div class="row mt"><button class="btn" type="button" id="qAgain">${ic('refresh')}${t('le_again')}</button><a class="btn ghost" href="#learn">${t('le_all')}</a></div></section>`;
  $('#qAgain').onclick = () => {
    startQuiz();
    renderQuiz();
  };
}

async function setDemo(on) {

  if (on) seedApp();
  else emptyApp();

function exportData() {
  const data = Object.fromEntries(STATE_KEYS.map(k => [k, S[k]]));
  downloadFile(`dhoop-backup-${isoDate()}.json`, JSON.stringify({ app: 'dhoop', v: SEED_VERSION, exportedAt: new Date().toISOString(), lang, data }, null, 1));

function importData(text) {
  let j;
  try {
    j = JSON.parse(text);
  } catch {
    return toast(t('st_importBad'), 'bad');
  }
  if (!j || j.app !== 'dhoop' || !j.data || !j.data.system || !j.data.loads || !j.data.tariff) return toast(t('st_importBad'), 'bad');
  for (const k of STATE_KEYS) if (j.data[k] != null) S[k] = j.data[k];
  S.settings = { ...DEFAULT_SETTINGS, ...S.settings };
  S.tariff = { ...defaultTariff(), ...S.tariff };
  persist(...STATE_KEYS);
  logEvent('ev_import', {}, 'upload');
  toast(t('st_imported'), 'ok');
  applyPrefs();
  rerender();
}

async function resetAll() {
  if (!(await askConfirm(t('st_resetQ'), { danger: true, okText: t('st_reset') }))) return;
  store.keys().forEach(k => store.del(k));
  seedApp();

}

function openPalette() {
  closeModal();
  const p = $('#palette');
  const input = `<input class="inp" id="palIn" type="search" placeholder="${t('searchAll')}" aria-label="${t('searchAll')}" autocomplete="off" dir="auto">`;
  p.innerHTML = `<div class="palbox">${input}<div class="palres" id="palRes" role="listbox"></div><div class="palhint">${t('palHint')}</div></div>`;
  p.classList.add('on');
  const index = paletteIndex();
  const draw = () => {
    const q = $('#palIn').value.trim().toLowerCase();
    palItems = (q ? index.filter(i => (i.label + ' ' + i.sub).toLowerCase().includes(q)) : index.filter(i => i.group === 'sg_pages' || i.group === 'sg_actions')).slice(0, 40);
    palSel = 0;
    let lastGroup = '';
    $('#palRes').innerHTML = palItems.map((it, i) => {
      const head = it.group !== lastGroup ? `<div class="pg">${t(it.group)}</div>` : '';
      lastGroup = it.group;
      const text = `<span dir="auto">${esc(it.label)}</span><small dir="auto">${esc(it.sub)}</small>`;
      return `${head}<button type="button" role="option" data-i="${i}" class="${i === 0 ? 'on' : ''}" aria-selected="${i === 0}">${ic(it.icon)}${text}</button>`;
    }).join('') || `<div class="empty">${t('sg_none')}</div>`;
    $$('#palRes [data-i]').forEach(b => (b.onclick = () => runPal(Number(b.dataset.i))));
    if (q) announce(t('sg_count', { n: palItems.length }));
  };
  $('#palIn').oninput = draw;
  $('#palIn').onkeydown = palKeys;
  p.onclick = e => e.target === p && closePalette();
  draw();
  $('#palIn').focus();
}

function palKeys(e) {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    palSel = clamp(palSel + (e.key === 'ArrowDown' ? 1 : -1), 0, palItems.length - 1);
    $$('#palRes [data-i]').forEach(b => {
      const on = Number(b.dataset.i) === palSel;
      b.classList.toggle('on', on);
      b.setAttribute('aria-selected', on);
    });
    const on = $('#palRes .on');
    if (on) on.scrollIntoView({ block: 'nearest' });
  }
  if (e.key === 'Enter' && palItems[palSel]) runPal(palSel);
}

function runPal(i) {
  const it = palItems[i];
  closePalette();
  if (it) it.run();
}

function closePalette() {
  const p = $('#palette');
  if (!p.classList.contains('on')) return;
  p.classList.remove('on');
  p.innerHTML = '';
}

  { sel: '#homeKpis', k: 'tour3' },
  { sel: '#dayPlan', k: 'tour4' },
  { sel: '[data-nav="system"], #tabMore', k: 'tour5' },
  { sel: '[data-nav="plan"]', k: 'tour6' },
  { sel: '#langBtn', k: 'tour7' },
  { sel: '#themeBtn', k: 'tour8' },
];
let tourStep = -1;
const visibleEl = sel => $$(sel).find(el => el.getClientRects().length && getComputedStyle(el).visibility !== 'hidden');

function startTour() {
  closeModal();
  closePalette();
  if (curRoute !== 'home') go('home');
  tourStep = 0;
  $('#tour').classList.add('on');
  getPlan().then(() => setTimeout(showTourStep, 450));
}

function endTour() {
  tourStep = -1;
  $('#tour').classList.remove('on');
  S.settings.tourDone = true;
  store.set('settings', S.settings);
}

function placeTip(el) {
  const rect = el.getBoundingClientRect();
  const tip = $('#tourTip');
  const p = 6;
  Object.assign($('#tourSpot').style, { left: rect.left - p + 'px', top: rect.top - p + 'px', width: rect.width + p * 2 + 'px', height: rect.height + p * 2 + 'px' });
  const tw = Math.min(340, window.innerWidth - 32);
  const below = rect.bottom + 16;
  let top = below + tip.offsetHeight + 12 < window.innerHeight ? below : rect.top - 16 - tip.offsetHeight;
  if (top < 12) top = Math.max(12, window.innerHeight - tip.offsetHeight - 16);
  const left = clamp(rect.left + rect.width / 2 - tw / 2, 16, window.innerWidth - tw - 16);
  Object.assign(tip.style, { top: top + 'px', left: left + 'px' });
}

function showTourStep() {
  const step = TOUR[tourStep];
  if (!step) return endTour();
  const el = visibleEl(step.sel);
  if (!el) {
    tourStep++;
    return showTourStep();
  }
  if (!el.closest('.rail, .top, .tabs')) el.scrollIntoView({ block: el.offsetHeight > window.innerHeight * 0.6 ? 'start' : 'center', behavior: 'instant' });
  const last = tourStep === TOUR.length - 1;
  $('#tourTip').innerHTML = `<span class="tag">${t('stepXofY', { x: tourStep + 1, y: TOUR.length })}</span><h4>${t(step.k + 't')}</h4><p>${t(step.k + 'b')}</p>
    <div class="between"><div class="dots">${TOUR.map((_, i) => `<i class="${i === tourStep ? 'on' : ''}"></i>`).join('')}</div>
    <div class="row"><button type="button" class="btn ghost sm" id="tourSkip">${t('skip')}</button>
    ${tourStep ? `<button type="button" class="btn ghost sm" id="tourBack" aria-label="${t('back')}">${ic('chevron-left', 'flip')}</button>` : ''}
    <button type="button" class="btn sm" id="tourNext">${last ? t('done') : t('next')} ${ic(last ? 'check' : 'chevron-right', last ? '' : 'flip')}</button></div></div>`;
  requestAnimationFrame(() => placeTip(el));
  $('#tourSkip').onclick = endTour;
  $('#tourNext').onclick = () => {
    tourStep++;
    showTourStep();
  };
  if ($('#tourBack')) $('#tourBack').onclick = () => {
    tourStep--;
    showTourStep();
  };
  setTimeout(() => $('#tourNext') && $('#tourNext').focus({ preventScroll: true }), 50);
}

// ---------- keyboard shortcuts ----------
const SHORTCUTS = [
  ['/', 'ks_search'], ['?', 'ks_help'], ['1–9', 'ks_nav'], ['Space', 'ks_play'], ['← →', 'ks_scrub'],
  ['L', 'ks_lang'], ['T', 'ks_theme'], ['N', 'ks_inbox'], ['P', 'ks_print'], ['Esc', 'ks_esc'],
];

function openShortcuts() {
  openModal(`${sheetHead(t('shortcuts'), 'keyboard')}<dl class="keys">${SHORTCUTS.map(([k, d]) => `<dt><kbd>${k}</kbd></dt><dd>${t(d)}</dd>`).join('')}</dl>`);
}

const typing = el => el && (el.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT'].includes(el.tagName));

function onKey(e) {
  if (e.key === 'Escape') return onEscape();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    return openPalette();
  }
  if (e.ctrlKey || e.metaKey || e.altKey || typing(e.target) || modalOpen() || $('#palette').classList.contains('on') || tourStep >= 0) return;
  const k = e.key;
  if (k === '/') {
    e.preventDefault();
    openPalette();
  } else if (k === '?') openShortcuts();
  else if (/^[1-9]$/.test(k)) go(NAV_ORDER[Number(k) - 1]);
  else if (k.toLowerCase() === 'l') setLang(lang === 'ur' ? 'en' : 'ur');
  else if (k.toLowerCase() === 't') toggleTheme();
  else if (k.toLowerCase() === 'n') go('inbox');
  else if (k.toLowerCase() === 'p') printCurrent();
  else if (curRoute === 'home' && HOME.res && (k === ' ' || k === 'ArrowLeft' || k === 'ArrowRight') && !e.target.closest('button, a')) {
    e.preventDefault();
    if (k === ' ') togglePlay();
    else setStep(HOME.k + ((k === 'ArrowRight') !== (document.documentElement.dir === 'rtl') ? 1 : -1));
  }
}

function onEscape() {
  if (tourStep >= 0) return endTour();
  if ($('#palette').classList.contains('on')) return closePalette();
  if (modalOpen()) return closeModal();
  hideTip();
}

const PRINT_W = 680;

function reportHead(titleKey, sub) {

  return `<header class="r-head"><div><b class="r-brand">${t('appName')}</b><span>${t('tagline')}</span></div><div class="r-meta">${meta}</div></header>
    <h1>${t(titleKey)}</h1><p class="r-sub">${sub}</p>`;
}
const reportFoot = () => `<footer class="r-foot">${t('rp_foot')}</footer>`;
const svgOf = out => (out.svg || out);

function printPlanReport(res) {
  const s = S.system;
  const html = `<div class="doc">${reportHead('rp_plan', t('rp_planSub', { day: fmtLongDate(res.ctx.iso), kwp: s.pv.kwp, kwh: s.batt.kwh, r: t('rg_' + res.ctx.regime) }))}
    ${strategyTable(res)}
    <div class="r-chart">${svgOf(planEnergyChart(res, PRINT_W, { h: 240 }))}${svgOf(planGridChart(res, PRINT_W, { h: 80 }))}${planGantt(res, PRINT_W)}</div>
    <h2>${t('pl_reasons')}</h2><ol class="r-list">${planReasons(res).map(r => `<li><b>${hhmm(r.h % 24)}</b> ${esc(r.text)}</li>`).join('')}</ol>
    <h2>${t('pl_table')}</h2>${scheduleTable(res)}${reportFoot()}</div>`;
  printDoc(html);
  logEvent('ev_print', { what: t('rp_plan') }, 'printer');
}

function printBillReport(months) {
  const capex = investment(S.system, S.tariff);
  const html = `<div class="doc">${reportHead('rp_bill', t('rp_billSub'))}
    ${tableHtml([t('tr_regime'), [t('tr_units')], [t('tr_energy')], [t('tr_credit')], [t('tr_total')], [t('tr_pbYears')], [t('tr_npv', { y: S.tariff.years })]], months.map(m => billRow(m, capex)))}
    <p>${t('rp_billNote', { no: fRs(months[0].noSolar.total), capex: fRsK(capex) })}</p>${reportFoot()}</div>`;
  printDoc(html);
  logEvent('ev_print', { what: t('rp_bill') }, 'printer');
}

function billRow(m, capex) {
  const annual = m.saving * 12;
  const pb = simplePayback(capex, annual);
  return [t('rg_' + m.regime), nf(m.bill.units), fRs(m.bill.energy), fRs(m.bill.credit), fRs(m.bill.total + m.genRs), Number.isFinite(pb) ? nf(pb, 1) : '—', fRsK(npvOver(capex, annual, S.tariff))];
}

function printHealthReport(h, days) {
  const html = `<div class="doc">${reportHead('rp_health', t('rp_healthSub', { n: days.length, chem: L(h.chem.name), kwh: S.system.batt.kwh }))}
    <table class="r-tbl"><tbody><tr><td>${t('bh_kSoh')}</td><td>${nf(h.soh, 1)}%</td></tr><tr><td>${t('bh_kEfc')}</td><td>${nf(h.efc, 1)}</td></tr>
      <tr><td>${t('bh_kThru')}</td><td>${nf(h.thru, 1)}</td></tr><tr><td>${t('bh_kEol')}</td><td>${h.eolYears ?? '15+'}</td></tr>
      <tr><td>${t('bh_cycleLoss')}</td><td>${nf(h.cycleLoss, 2)}%</td></tr><tr><td>${t('bh_calLoss')}</td><td>${nf(h.calLoss, 2)}%</td></tr></tbody></table>
    <div class="r-chart">${svgOf(xyChart(PRINT_W, { h: 200, n: 10, unit: t('bh_cyclesUnit'), xLabels: i => `${i * 10}`, series: [{ type: 'bars', vals: h.hist, cls: 'hist-bar' }] }))}
      ${svgOf(xyChart(PRINT_W, { ...fadeSpec(h), h: 200, xLabels: i => String(i) }))}</div>
    <h2>${t('bh_advice')}</h2><ul class="r-list">${healthAdvice(h, S.system).map(a => `<li>${esc(t(a.key, a.vars))}</li>`).join('')}</ul>
    <p>${t('bh_approx')}</p>${reportFoot()}</div>`;
  printDoc(html);
  logEvent('ev_print', { what: t('rp_health') }, 'printer');
}

function printCurrent() {
  if (curRoute === 'tariff') return printBillReport(regimeMonths());
  if (curRoute === 'health' && S.logs.days.length > 1) return printHealthReport(batteryHealth(S.system, S.logs.days.slice(-60)), S.logs.days.slice(-60));
  if (curRoute === 'learn' && $('#gPrint')) return $('#gPrint').click();
  getPlan().then(printPlanReport);
}

// ---------- router, navigation rail, phone tabs, preferences, boot ----------
const ROUTES = {
  home: { r: renderHome, icon: 'flow' },
  plan: { r: renderPlan, icon: 'gantt' },
  forecast: { r: renderForecast, icon: 'cloud-sun' },
  system: { r: renderSystem, icon: 'panel' },
  loads: { r: renderLoads, icon: 'plug' },
  tariff: { r: renderTariff, icon: 'receipt' },
  outage: { r: renderOutage, icon: 'plug-off' },
  logs: { r: renderLogs, icon: 'database' },
  health: { r: renderHealth, icon: 'gauge' },
  whatif: { r: renderWhatIf, icon: 'scale' },
  bms: { r: renderBms, icon: 'bluetooth' },
  learn: { r: renderLearn, icon: 'book' },
  inbox: { r: renderInbox, icon: 'bell' },
  settings: { r: renderSettings, icon: 'settings' },
  about: { r: renderAbout, icon: 'info' },
};
const NAV_GROUPS = [
  ['ng_live', ['home', 'plan', 'forecast']],
  ['ng_setup', ['system', 'loads', 'tariff', 'outage']],
  ['ng_insight', ['logs', 'health', 'whatif', 'bms']],
  ['ng_help', ['learn', 'inbox', 'settings', 'about']],
];
const NAV_ORDER = NAV_GROUPS.flatMap(g => g[1]);
const TABS = [['home', 'flow'], ['plan', 'gantt'], ['forecast', 'cloud-sun'], ['logs', 'database']];
let curRoute = '';
let curArg = '';

function renderNav() {
  const unread = unreadCount();
  const cur = r => (r === curRoute ? 'class="on" aria-current="page"' : '');
  const cnt = r => (r === 'inbox' && unread ? `<span class="cnt">${unread}</span>` : '');
  const link = r => `<a href="#${r}" data-nav="${r}" ${cur(r)} title="${t('nav_' + r)}">${ic(ROUTES[r].icon)}<span>${t('nav_' + r)}</span>${cnt(r)}</a>`;
  $('#railNav').innerHTML = NAV_GROUPS.map(([g, list]) => `<div class="grp">${t(g)}</div>` + list.map(link).join('')).join('');
  const more = !TABS.some(([r]) => r === curRoute);
  $('#tabs').innerHTML = TABS.map(([r, icon]) => `<a href="#${r}" data-tab="${r}" ${cur(r)}>${ic(icon)}<span>${t('tab_' + r)}</span></a>`).join('')
    + `<button type="button" id="tabMore" class="${more ? 'on' : ''}" aria-label="${t('more')}">${ic('menu')}<span>${t('more')}</span>${unread ? `<span class="tdot">${unread}</span>` : ''}</button>`;
  $('#tabs').setAttribute('aria-label', t('mainNav'));
  $('#rail').setAttribute('aria-label', t('mainNav'));
  $('#tabMore').onclick = openMoreSheet;
  renderRailFoot();
}

/** City, sunrise / sunset and a mini sun clock at the foot of the rail. */
function renderRailFoot() {
  const s = S.system;
  const st = sunTimes(isoDate(), s.lat, s.lon);
  const f = clamp((nowHour() - st.rise) / (st.set - st.rise), 0, 1);
  const ang = Math.PI * (1 - f);
  const up = nowHour() > st.rise && nowHour() < st.set;
  const dot = `<circle cx="${(29 + 24 * Math.cos(ang)).toFixed(1)}" cy="${(28 - 24 * Math.sin(ang)).toFixed(1)}" r="4" fill="${up ? '#f5b43a' : '#7d8bab'}"/>`;
  $('#railFoot').innerHTML = `<div class="sunclock"><svg viewBox="0 0 58 32" aria-hidden="true">
    <path d="M5 28A24 24 0 0 1 53 28" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="2 3"/>
    <line x1="1" x2="57" y1="28" y2="28" stroke="currentColor" stroke-opacity=".35"/>${dot}</svg>
    <div><b>${esc(L(cityById(s.city).name))}</b><div class="num">${hhmm(st.rise)} · ${hhmm(st.set)}</div></div></div>`;
}

function openMoreSheet() {
  const extra = NAV_ORDER.filter(r => !TABS.some(([x]) => x === r));
  const sh = openModal(`${sheetHead(t('more'), 'menu')}<div class="qa">${extra.map(r => `<a href="#${r}" data-close>${ic(ROUTES[r].icon)}<span>${t('nav_' + r)}</span></a>`).join('')}</div>
    <div class="row mt">${btnHtml('mSearch', 'search', t('search'))}${btnHtml('mTour', 'sparkles', t('st_tour'))}${btnHtml('mKeys', 'keyboard', t('shortcuts'))}</div>`);
  $$('[data-close]', sh).forEach(a => (a.onclick = closeModal));
  $('#mSearch', sh).onclick = openPalette;
  $('#mTour', sh).onclick = startTour;
  $('#mKeys', sh).onclick = openShortcuts;
}

function go(path) {
  if (location.hash.slice(1) === path) route();
  else location.hash = path;
}

function route() {
  const [name, ...rest] = (location.hash.slice(1) || 'home').split('/');
  const r = ROUTES[name] ? name : 'home';
  renderRoute(r, decodeURIComponent(rest.join('/')));
}

function renderRoute(r, arg) {
  const same = r === curRoute && arg === curArg;
  if (curRoute === 'home' && r !== 'home') stopPlay();
  if (chartRO && !same) chartRO.disconnect();
  curRoute = r;
  curArg = arg;
  closePalette();
  hideTip();
  if (!same) closeModal();
  ROUTES[r].r(arg);
  $('#pageTitle').textContent = t('nav_' + r);
  $('#pageSub').textContent = `${L(cityById(S.system.city).name)} · ${fmtDate(isoDate(), { weekday: 'short', day: 'numeric', month: 'short' })} · ${t('rg_' + S.system.grid.regime)}`;
  document.title = r === 'home' ? `${t('appName')} — ${t('tagline')} | FYP Template` : `${t('nav_' + r)} — ${t('appName')} | FYP Template`;
  renderNav();
  updateBadges();
  if (!same) {
    window.scrollTo(0, 0);
    animateIn($('#view'));
  } else settle($('#view'));
}

function rerender() {
  if (!curRoute) return;
  const y = window.scrollY;
  renderRoute(curRoute, curArg);
  window.scrollTo(0, y);
}

const effectiveTheme = () => (S.settings.theme === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : S.settings.theme);

function toggleTheme() {
  setPref('theme', effectiveTheme() === 'dark' ? 'light' : 'dark');
}

function applyPrefs() {
  const h = document.documentElement;
  const s = S.settings;
  const theme = effectiveTheme();
  h.lang = lang;
  h.dir = lang === 'ur' ? 'rtl' : 'ltr';
  h.dataset.theme = theme;
  h.dataset.size = s.size;
  h.classList.toggle('calm', !!s.calm);
  $$('[data-i18n]').forEach(el => (el.textContent = t(el.dataset.i18n)));
  $('#langBtn').textContent = lang === 'ur' ? 'English' : 'اردو';
  $('#langBtn').setAttribute('aria-label', t('switchLang'));
  $('#searchBtn').setAttribute('aria-label', t('searchAll'));
  $('#themeBtn').setAttribute('aria-label', t(theme === 'dark' ? 'st_light' : 'st_dark'));
  $('#themeIcon').setAttribute('href', theme === 'dark' ? '#i-sun' : '#i-moon');
  $('#skipLink').textContent = t('skipToContent');
  $('meta[name="theme-color"]').content = theme === 'dark' ? '#060c1d' : '#132a2d';
}

function setLang(l) {
  lang = l === 'ur' ? 'ur' : 'en';
  store.set('lang', lang);
  applyPrefs();
  rerender();
  if (tourStep >= 0) showTourStep();
}

function bindShell() {
  $('#searchBtn').onclick = openPalette;
  $('#bellBtn').onclick = () => go('inbox');
  $('#langBtn').onclick = () => setLang(lang === 'ur' ? 'en' : 'ur');
  $('#themeBtn').onclick = toggleTheme;
  $('#scrim').onclick = () => {
    closePalette();
    closeModal();
  };
  $('#modal').addEventListener('click', e => e.target === $('#modal') && closeModal());
  document.addEventListener('keydown', onKey);
  window.addEventListener('hashchange', route);
  window.addEventListener('scroll', hideTip, { passive: true });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => S.settings.theme === 'auto' && applyPrefs());
  window.addEventListener('afterprint', () => ($('#printArea').innerHTML = ''));
  setInterval(renderRailFoot, 5 * MIN);
}

function boot() {
  buildTxt();
  lang = store.get('lang', 'en') === 'ur' ? 'ur' : 'en';
  S = loadState();
  if (!S) seedApp();
  applyPrefs();
  bindShell();
  route();
  if (!location.hash && !S.settings.tourDone) setTimeout(startTour, 900);
  window.dhoopReady = true;
}

boot();
