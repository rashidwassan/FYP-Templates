<style>
/* =====================================================================
   FraudShield — security console theme
   Red Hat Display + Red Hat Mono · dark slate · signal amber · alert red · safe green
   ===================================================================== */

/* ---------- tokens ---------- */
:root {
  --bg: #0a1017;
  --bg-2: #0d151e;
  --panel: #111b25;
  --panel-2: #16222f;
  --panel-3: #1c2a39;
  --line: #213040;
  --line-2: #2d3f52;
  --ink: #e6edf3;
  --ink-2: #b6c4d2;
  --muted: #8396aa;
  --amber: #f5b014;
  --amber-2: #ffca52;
  --amber-ink: #1b1300;
  --amber-soft: rgba(245, 176, 20, .13);
  --red: #ff5b52;
  --red-soft: rgba(255, 91, 82, .14);
  --green: #33d17a;
  --green-soft: rgba(51, 209, 122, .13);
  --blue: #5ea3ff;
  --blue-soft: rgba(94, 163, 255, .13);
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --grid: rgba(150, 175, 200, .045);
  --scrim: rgba(3, 7, 12, .66);
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 18px 44px -26px rgba(0, 0, 0, .85);
  --font: "Red Hat Display", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Red Hat Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --font-ur: "Noto Nastaliq Urdu", "Red Hat Display", serif;
  --rail: 236px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #edf1f5;
  --bg-2: #e4e9ef;
  --panel: #ffffff;
  --panel-2: #f5f7fa;
  --panel-3: #e9eef4;
  --line: #d6dee7;
  --line-2: #c0cbd8;
  --ink: #0f1a24;
  --ink-2: #2b3947;
  --muted: #5a6a7b;
  --amber: #a86b00;
  --amber-2: #c27d00;
  --amber-ink: #ffffff;
  --amber-soft: rgba(194, 125, 0, .12);
  --red: #c9302a;
  --red-soft: rgba(201, 48, 42, .1);
  --green: #127a45;
  --green-soft: rgba(18, 122, 69, .1);
  --blue: #2a6fc4;
  --blue-soft: rgba(42, 111, 196, .1);
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --grid: rgba(30, 60, 90, .05);
  --scrim: rgba(15, 26, 36, .45);
  --shadow: 0 18px 40px -28px rgba(15, 26, 36, .45);
  color-scheme: light;
}
:root[data-size="s"] { font-size: 14px; }
:root[data-size="m"] { font-size: 15.5px; }
:root[data-size="l"] { font-size: 17.5px; }

/* ---------- motion kit ---------- */
:root { --ease: cubic-bezier(.2, .8, .2, 1); --dur: .35s; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
:root[data-motion="off"] *, :root[data-motion="off"] *::before, :root[data-motion="off"] *::after {
  animation-duration: .01ms !important;
  transition-duration: .01ms !important;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
@keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }
@keyframes slideIn { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.enter { animation: fadeUp var(--dur) var(--ease) both; }
.stagger > * { animation: fadeUp .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
.btn { transition: transform .15s var(--ease), box-shadow .15s var(--ease), background .15s, border-color .15s; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0) scale(.98); }
.card, .tile { transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s; }
.card:hover { transform: translateY(-2px); }
.fill, .bar > i { transition: width .6s var(--ease); }
.skeleton {
  background: linear-gradient(90deg, var(--panel-2) 25%, var(--panel) 50%, var(--panel-2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.2s infinite;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { font-size: 15.5px; -webkit-text-size-adjust: 100%; }
html, body { margin: 0; }
body {
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--ink);
  font-family: var(--font);
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; letter-spacing: -.01em; }
p { margin: 0 0 .6em; }
a { color: var(--amber); }
code, kbd, .mono { font-family: var(--mono); }
kbd {
  display: inline-block;
  min-width: 1.6em;
  padding: 1px 6px;
  border: 1px solid var(--line-2);
  border-bottom-width: 2px;
  border-radius: 6px;
  background: var(--panel-2);
  font-size: .78em;
  text-align: center;
}
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
::selection { background: var(--amber); color: var(--amber-ink); }
.ic {
  width: 1.1em;
  height: 1.1em;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  vertical-align: -.2em;
  flex: none;
}
.ic.lg { width: 1.5em; height: 1.5em; }
.ic.xl { width: 2.2em; height: 2.2em; }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
.skip {
  position: absolute;
  inset-inline-start: 8px;
  top: -60px;
  z-index: 100;
  background: var(--amber);
  color: var(--amber-ink);
  padding: 8px 14px;
  border-radius: 8px;
  font-weight: 700;
}
.skip:focus { top: 8px; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.tiny { font-size: .75rem; }
.tnum { font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.between { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack > * + * { margin-top: 12px; }
.spacer { flex: 1; }
.mt { margin-top: 14px; }
.mb { margin-bottom: 14px; }
.grow { flex: 1; min-width: 0; }
.nowrap { white-space: nowrap; }
.ltr { direction: ltr; unicode-bidi: isolate; }
.label {
  font-family: var(--mono);
  font-size: .7rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
}
.kicker { font-family: var(--mono); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--amber); }

/* Urdu mode: Nastaliq for prose, Red Hat Mono kept for numbers, codes and data */
html[lang="ur"] body { font-family: var(--font-ur); line-height: 2.05; }
html[lang="ur"] h1, html[lang="ur"] h2, html[lang="ur"] h3, html[lang="ur"] h4 { line-height: 1.9; letter-spacing: 0; }
html[lang="ur"] .label, html[lang="ur"] .kicker { font-family: var(--font-ur); letter-spacing: 0; text-transform: none; font-size: .78rem; }
html[lang="ur"] .btn, html[lang="ur"] .chip, html[lang="ur"] .badge, html[lang="ur"] .tab { line-height: 1.7; }
html[lang="ur"] .mono, html[lang="ur"] code, html[lang="ur"] kbd, html[lang="ur"] .num { font-family: var(--mono); line-height: 1.5; }
.ur-text { font-family: var(--font-ur); line-height: 2.1; }
.msg-text { white-space: pre-wrap; overflow-wrap: anywhere; unicode-bidi: plaintext; font-family: var(--font), var(--font-ur); }
html[lang="ur"] .msg-text { line-height: 1.95; }
.msg-text:lang(ur), .msg-text[data-script="ur"] { font-family: var(--font-ur); line-height: 2.2; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100vh; }
.rail {
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  background: linear-gradient(180deg, var(--bg-2), var(--bg));
  border-inline-end: 1px solid var(--line);
  padding: 16px 12px 18px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  z-index: 30;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; text-decoration: none; color: var(--ink); }
.brand svg.logo { width: 34px; height: 34px; flex: none; }
.brand b { display: block; font-size: 1.12rem; font-weight: 800; letter-spacing: -.02em; }
.brand small { display: block; font-family: var(--mono); font-size: .64rem; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
html[lang="ur"] .brand small { font-family: var(--font-ur); letter-spacing: 0; text-transform: none; font-size: .7rem; }
.nav-group { margin-top: 10px; }
.nav-group > .label { padding: 0 10px 6px; display: block; }
.nav a {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 38px;
  padding: 6px 10px;
  border-radius: 8px;
  color: var(--ink-2);
  text-decoration: none;
  font-weight: 500;
  position: relative;
  transition: background .15s, color .15s;
}
.nav a:hover { background: var(--panel-2); color: var(--ink); }
.nav a.on { background: var(--amber-soft); color: var(--amber-2); font-weight: 700; }
:root[data-theme="light"] .nav a.on { color: var(--amber); }
.nav a.on::before {
  content: "";
  position: absolute;
  inset-inline-start: -12px;
  top: 8px;
  bottom: 8px;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: var(--amber);
}
.nav a .count {
  margin-inline-start: auto;
  font-family: var(--mono);
  font-size: .7rem;
  background: var(--red);
  color: #fff;
  border-radius: 999px;
  padding: 0 7px;
  line-height: 1.6;
}
.nav a .count.amber { background: var(--amber); color: var(--amber-ink); }
.rail-foot {
  margin-top: auto;
  padding: 12px 10px 0;
  border-top: 1px dashed var(--line-2);
  font-family: var(--mono);
  font-size: .7rem;
  color: var(--muted);
  display: grid;
  gap: 4px;
}
.led { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); margin-inline-end: 6px; vertical-align: 1px; }
.led.amber { background: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }
.led.red { background: var(--red); box-shadow: 0 0 0 3px var(--red-soft); animation: pulse 1.6s infinite; }

.main-col { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 22px;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.crumb { min-width: 0; flex: 1; }
.crumb .label { display: block; }
.crumb h1 { font-size: 1.15rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-btn {
  min-width: 40px;
  min-height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 0 10px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink-2);
  cursor: pointer;
  position: relative;
}
.tb-btn:hover { border-color: var(--line-2); color: var(--ink); }
.tb-btn .dot {
  position: absolute;
  top: -4px;
  inset-inline-end: -4px;
  min-width: 18px;
  height: 18px;
  padding: 0 4px;
  border-radius: 999px;
  background: var(--red);
  color: #fff;
  font: 600 .66rem/18px var(--mono);
  text-align: center;
}
.tb-search { min-width: 220px; justify-content: flex-start; color: var(--muted); }
.tb-search kbd { margin-inline-start: auto; }
#menuBtn { display: none; }
main { padding: 22px 22px 40px; outline: none; flex: 1; }
.page { max-width: 1320px; margin: 0 auto; }
.page-head { display: flex; gap: 14px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; margin-bottom: 18px; }
.page-head h2 { font-size: 1.6rem; font-weight: 800; }
.page-head p { color: var(--muted); max-width: 70ch; margin: 4px 0 0; }
.tabbar { display: none; }
.disclaimer {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 10px 14px;
  border: 1px dashed var(--line-2);
  border-radius: var(--radius-sm);
  color: var(--muted);
  font-size: .85rem;
  margin-top: 18px;
}
.disclaimer .ic { color: var(--amber); margin-top: 3px; }

/* ---------- panels ---------- */
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  position: relative;
  min-width: 0;
}
.panel::before {
  content: "";
  position: absolute;
  top: -1px;
  inset-inline-start: -1px;
  width: 14px;
  height: 14px;
  border-top: 2px solid var(--amber);
  border-inline-start: 2px solid var(--amber);
  border-start-start-radius: var(--radius);
  opacity: .8;
  pointer-events: none;
}
.ph {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.ph .num { font-family: var(--mono); font-size: .72rem; color: var(--amber); letter-spacing: .08em; }
.ph h3 { font-size: 1rem; font-weight: 700; }
.ph .meta { margin-inline-start: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pb { padding: 16px; }
.pb.tight { padding: 10px 12px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; }
.split.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }


/* ---------- KPI tiles ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: grid;
  gap: 4px;
  min-width: 0;
}
.tile:hover { border-color: var(--line-2); }
.tile .k { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .84rem; }
.tile .v { font-family: var(--mono); font-size: 1.7rem; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; }
.tile .s { font-size: .78rem; color: var(--muted); }
.tile.red .v { color: var(--red); }
.tile.amber .v { color: var(--amber); }
.tile.green .v { color: var(--green); }

/* ---------- buttons, inputs ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 40px;
  padding: 0 14px;
  border-radius: 9px;
  border: 1px solid var(--line-2);
  background: var(--panel-2);
  color: var(--ink);
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); }
.btn.primary:hover { box-shadow: 0 8px 22px -12px var(--amber); }
.btn kbd { background: rgba(0, 0, 0, .14); border-color: rgba(0, 0, 0, .22); color: inherit; }
.btn:not(.primary) kbd { background: var(--bg-2); border-color: var(--line-2); }
.btn.danger { border-color: color-mix(in srgb, var(--red) 55%, transparent); color: var(--red); background: var(--red-soft); }
.btn.good { border-color: color-mix(in srgb, var(--green) 55%, transparent); color: var(--green); background: var(--green-soft); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--panel-2); }
.btn.sm { min-height: 32px; padding: 0 10px; font-size: .85rem; border-radius: 7px; }
.btn.icon { padding: 0; width: 40px; }
.btn.sm.icon { width: 32px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > span { font-size: .82rem; color: var(--ink-2); font-weight: 600; }
.field small { color: var(--muted); font-size: .76rem; }
input[type="text"], input[type="search"], input[type="number"], input[type="email"], input[type="url"], input[type="date"], input[type="datetime-local"], input[type="tel"], select, textarea {
  width: 100%;
  min-height: 40px;
  padding: 8px 11px;
  border-radius: 9px;
  border: 1px solid var(--line-2);
  background: var(--bg-2);
  color: var(--ink);
  min-width: 0;
}
textarea { resize: vertical; line-height: 1.55; }
input:focus, select:focus, textarea:focus { border-color: var(--amber); outline: none; box-shadow: 0 0 0 3px var(--amber-soft); }
input[type="range"] { width: 100%; accent-color: var(--amber); }
input[type="checkbox"], input[type="radio"] { accent-color: var(--amber); width: 18px; height: 18px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.form-grid .full { grid-column: 1 / -1; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; cursor: pointer; }
.check input { margin-top: 3px; flex: none; }
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; min-height: 40px; }
.switch input { appearance: none; width: 40px; height: 22px; border-radius: 999px; background: var(--line-2); position: relative; cursor: pointer; transition: background .2s; flex: none; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s var(--ease); }
.switch input:checked { background: var(--amber); }
.switch input:checked::after { transform: translateX(18px); }
html[dir="rtl"] .switch input:checked::after { transform: translateX(-18px); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 9px; overflow: hidden; background: var(--bg-2); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 0 12px; min-height: 36px; cursor: pointer; color: var(--ink-2); font-weight: 600; font-size: .86rem; }
.seg button.on { background: var(--amber); color: var(--amber-ink); }

/* ---------- chips, badges ---------- */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 32px;
  padding: 0 11px;
  border-radius: 999px;
  border: 1px solid var(--line-2);
  background: var(--panel-2);
  color: var(--ink-2);
  font-size: .82rem;
  cursor: pointer;
  white-space: nowrap;
}
.chip:hover { border-color: var(--muted); color: var(--ink); }
.chip.on { background: var(--amber-soft); border-color: var(--amber); color: var(--amber-2); }
:root[data-theme="light"] .chip.on { color: var(--amber); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 9px;
  border-radius: 6px;
  font-size: .74rem;
  font-weight: 700;
  border: 1px solid var(--line-2);
  color: var(--ink-2);
  background: var(--panel-2);
  white-space: nowrap;
}
.badge.high, .badge.scam, .badge.fraud, .badge.critical { color: var(--red); border-color: color-mix(in srgb, var(--red) 45%, transparent); background: var(--red-soft); }
.badge.med, .badge.medium, .badge.escalated, .badge.warn { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 45%, transparent); background: var(--amber-soft); }
.badge.low, .badge.safe, .badge.legit, .badge.ok { color: var(--green); border-color: color-mix(in srgb, var(--green) 45%, transparent); background: var(--green-soft); }
.badge.info { color: var(--blue); border-color: color-mix(in srgb, var(--blue) 45%, transparent); background: var(--blue-soft); }
.badge.mono { font-family: var(--mono); font-weight: 500; }
.script-tag { font-family: var(--mono); font-size: .68rem; letter-spacing: .06em; padding: 1px 6px; border-radius: 5px; background: var(--panel-3); color: var(--ink-2); border: 1px solid var(--line-2); }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; scrollbar-width: thin; }
.tab {
  border: 0;
  background: transparent;
  padding: 10px 14px;
  min-height: 42px;
  color: var(--muted);
  font-weight: 600;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  text-decoration: none;
  display: inline-flex;
  gap: 8px;
  align-items: center;
}
.tab:hover { color: var(--ink); }
.tab.on { color: var(--amber); border-bottom-color: var(--amber); }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); max-width: 100%; }
table.data { width: 100%; border-collapse: collapse; font-size: .86rem; }
table.data th {
  text-align: start;
  font-family: var(--mono);
  font-size: .68rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
  padding: 9px 10px;
  background: var(--panel-2);
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
  position: sticky;
  top: 0;
}
html[lang="ur"] table.data th { font-family: var(--font-ur); letter-spacing: 0; text-transform: none; font-size: .78rem; }
table.data td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.data tr:last-child td { border-bottom: 0; }
table.data tbody tr { transition: background .15s; }
table.data tbody tr:hover { background: var(--panel-2); }
table.data tr.sel { background: var(--amber-soft); }
table.data td.num, table.data th.num { text-align: end; font-family: var(--mono); font-variant-numeric: tabular-nums; }
table.data .clip { max-width: 420px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
tr.clickable { cursor: pointer; }

/* ---------- bars ---------- */
.bar { height: 8px; border-radius: 999px; background: var(--panel-3); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: var(--amber); width: 0; }
.bar.red > i { background: var(--red); }
.bar.green > i { background: var(--green); }
.bar.blue > i { background: var(--series-1); }
.meter-row { display: grid; grid-template-columns: minmax(90px, 160px) minmax(0, 1fr) 52px; gap: 10px; align-items: center; font-size: .86rem; }
.meter-row .num { text-align: end; font-family: var(--mono); }

/* ---------- empty state, list rows ---------- */
.empty { text-align: center; padding: 30px 16px; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.empty .ic { width: 2rem; height: 2rem; color: var(--line-2); }
.list { display: grid; gap: 8px; }
.item {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--panel-2);
  min-width: 0;
}
.item .ico { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: var(--panel-3); color: var(--ink-2); flex: none; }
.item .ico.red { background: var(--red-soft); color: var(--red); }
.item .ico.amber { background: var(--amber-soft); color: var(--amber); }
.item .ico.green { background: var(--green-soft); color: var(--green); }
.item .ico.blue { background: var(--blue-soft); color: var(--blue); }
.item .body { flex: 1; min-width: 0; }
.item .t { display: block; font-weight: 600; overflow-wrap: anywhere; }
.item .d { display: block; color: var(--muted); font-size: .82rem; overflow-wrap: anywhere; }
button.item { width: 100%; text-align: start; cursor: pointer; font: inherit; color: inherit; }
button.item:hover { border-color: var(--line-2); }

/* ---------- modal, drawer, toast, tooltip ---------- */
#scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 60; opacity: 0; pointer-events: none; transition: opacity .25s var(--ease); }
#scrim.on { opacity: 1; pointer-events: auto; }
.modal {
  position: fixed;
  z-index: 70;
  inset: 0;
  margin: auto;
  width: min(640px, calc(100vw - 24px));
  height: fit-content;
  max-height: calc(100vh - 40px);
  overflow: auto;
  background: var(--panel);
  border: 1px solid var(--line-2);
  border-radius: 14px;
  box-shadow: var(--shadow);
  opacity: 0;
  transform: scale(.96);
  pointer-events: none;
  transition: opacity .22s var(--ease), transform .22s var(--ease);
}
.modal.wide { width: min(920px, calc(100vw - 24px)); }
.modal.on { opacity: 1; transform: none; pointer-events: auto; }
.modal .mh, .drawer .mh { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
.modal .mh h3, .drawer .mh h3 { font-size: 1.05rem; flex: 1; }
.modal .mbd, .drawer .mbd { padding: 16px 18px; }
.modal .mf { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.drawer {
  position: fixed;
  z-index: 70;
  top: 0;
  bottom: 0;
  inset-inline-end: 0;
  width: min(520px, 100vw);
  background: var(--panel);
  border-inline-start: 1px solid var(--line-2);
  box-shadow: var(--shadow);
  transform: translateX(105%);
  transition: transform .3s var(--ease);
  overflow-y: auto;
}
html[dir="rtl"] .drawer { transform: translateX(-105%); }
.drawer.on, html[dir="rtl"] .drawer.on { transform: none; }
#toasts { position: fixed; z-index: 90; bottom: 18px; inset-inline-end: 18px; display: grid; gap: 8px; width: min(380px, calc(100vw - 24px)); }
.toast {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 11px 14px;
  border-radius: 10px;
  background: var(--panel-3);
  border: 1px solid var(--line-2);
  box-shadow: var(--shadow);
  animation: slideIn .3s var(--ease) both;
  transition: opacity .3s, transform .3s;
  font-size: .9rem;
}
.toast.out { opacity: 0; transform: translateY(8px); }
.toast .ic { margin-top: 3px; }
.toast.ok .ic { color: var(--green); }
.toast.warn .ic { color: var(--amber); }
.toast.err .ic { color: var(--red); }
#tip {
  position: fixed;
  z-index: 95;
  pointer-events: none;
  padding: 6px 10px;
  border-radius: 7px;
  background: var(--panel-3);
  border: 1px solid var(--line-2);
  box-shadow: var(--shadow);
  font-size: .78rem;
  max-width: 280px;
  opacity: 0;
  transition: opacity .12s;
}
#tip.on { opacity: 1; }
#tip b { font-family: var(--mono); }

/* ---------- tour spotlight ---------- */
#tour { position: fixed; inset: 0; z-index: 80; pointer-events: none; display: none; }
#tour.on { display: block; }
#tourHole {
  position: fixed;
  border-radius: 12px;
  box-shadow: 0 0 0 9999px var(--scrim), 0 0 0 2px var(--amber);
  transition: all .35s var(--ease);
  pointer-events: none;
}
#tourTip {
  position: fixed;
  width: min(340px, calc(100vw - 24px));
  background: var(--panel);
  border: 1px solid var(--amber);
  border-radius: 12px;
  padding: 14px 16px;
  pointer-events: auto;
  box-shadow: var(--shadow);
  transition: top .35s var(--ease), left .35s var(--ease);
}
#tourTip h4 { font-size: 1rem; margin: 4px 0 6px; }
#tourTip p { color: var(--ink-2); font-size: .9rem; }

/* ---------- command palette ---------- */
.palette { width: min(640px, calc(100vw - 24px)); top: 10vh; bottom: auto; margin: 0 auto; }
.palette .ps-in { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.palette .ps-in input { border: 0; background: transparent; box-shadow: none; padding: 6px 0; font-size: 1.05rem; }
.palette .ps-res { max-height: 56vh; overflow-y: auto; padding: 8px; }
.ps-group { padding: 8px 8px 4px; }
.ps-row { display: flex; gap: 10px; align-items: center; width: 100%; padding: 9px 10px; border-radius: 8px; border: 0; background: transparent; cursor: pointer; text-align: start; min-height: 40px; }
.ps-row.on, .ps-row:hover { background: var(--amber-soft); }
.ps-row .grow { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
mark.hit { background: var(--amber-soft); color: inherit; border-radius: 3px; }

/* ---------- home ---------- */
.hero {
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
  gap: 18px;
  padding: 22px;
  border-radius: 16px;
  border: 1px solid var(--line);
  background:
    radial-gradient(120% 140% at 100% 0%, var(--amber-soft), transparent 55%),
    linear-gradient(160deg, var(--panel-2), var(--panel));
  position: relative;
  overflow: hidden;
}
.hero h2 { font-size: clamp(1.5rem, 3vw, 2.2rem); font-weight: 800; letter-spacing: -.025em; margin: 6px 0 8px; }
.hero p { color: var(--ink-2); max-width: 56ch; }
.hero .quick textarea { min-height: 112px; }
.hero-art { display: grid; place-items: center; min-height: 220px; }
.hero-art svg { width: min(100%, 300px); height: auto; }
.radar-sweep { transform-origin: 150px 150px; animation: sweep 6s linear infinite; }
.blip { animation: pulse 2.4s ease-in-out infinite; }
.tool-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.tool {
  display: grid;
  gap: 6px;
  padding: 16px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--panel);
  text-decoration: none;
  color: inherit;
}
.tool:hover { border-color: var(--amber); }
.tool .ico { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--amber-soft); color: var(--amber); }
.tool b { font-size: 1rem; }
.tool span { color: var(--muted); font-size: .85rem; }
.ticker { display: flex; gap: 10px; align-items: center; overflow: hidden; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-2); font-size: .86rem; }
.ticker .label { flex: none; color: var(--red); }

/* ---------- analyser ---------- */
.verdict { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 18px; align-items: center; }
.gauge { width: 200px; height: 124px; }
.gauge .trk { stroke: var(--panel-3); }
.gauge .val { transition: stroke-dashoffset .8s var(--ease), stroke .3s; }
.gauge .needle { transform-origin: 100px 100px; transition: transform .8s var(--ease); }
.gauge text { font-family: var(--mono); fill: var(--ink); }
.verdict h3 { font-size: 1.4rem; font-weight: 800; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.verdict.high h3 { color: var(--red); }
.verdict.med h3 { color: var(--amber); }
.verdict.low h3 { color: var(--green); }
.scorebox { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.scorebox div { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--panel-2); }
.scorebox b { display: block; font-family: var(--mono); font-size: 1.1rem; }
.scorebox span { font-size: .74rem; color: var(--muted); }
.hl {
  padding: 14px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--bg-2);
  font-size: .98rem;
  line-height: 1.75;
  max-height: 260px;
  overflow-y: auto;
}
.hl mark {
  background: var(--amber-soft);
  color: inherit;
  border-bottom: 2px solid var(--amber);
  border-radius: 3px;
  padding: 0 1px;
  cursor: help;
}
.hl mark.sev-high { background: var(--red-soft); border-bottom-color: var(--red); }
.hl mark.sev-low { background: var(--blue-soft); border-bottom-color: var(--blue); }
.hl mark.sev-good { background: var(--green-soft); border-bottom-color: var(--green); }
.flag {
  display: grid;
  grid-template-columns: 36px minmax(0, 1fr) auto;
  gap: 12px;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  align-items: start;
}
.flag .ico { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; background: var(--amber-soft); color: var(--amber); }
.flag.high .ico { background: var(--red-soft); color: var(--red); }
.flag.good .ico { background: var(--green-soft); color: var(--green); }
.flag .t { font-weight: 700; }
.flag .why { color: var(--ink-2); font-size: .88rem; margin-top: 2px; }
.flag .ev { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.flag .ev code { font-size: .76rem; background: var(--bg-2); border: 1px solid var(--line); padding: 1px 6px; border-radius: 5px; overflow-wrap: anywhere; }
.flag .pts { font-family: var(--mono); font-size: .8rem; color: var(--muted); white-space: nowrap; }
.flag.flash { animation: pop .4s var(--ease); border-color: var(--amber); }
.steps { margin: 0; padding-inline-start: 20px; display: grid; gap: 6px; }
.steps li::marker { color: var(--amber); font-family: var(--mono); }
.tokbars { display: grid; gap: 6px; }
.tokbar { display: grid; grid-template-columns: minmax(100px, 230px) minmax(0, 1fr) 52px; gap: 8px; align-items: center; font-size: .8rem; }
.tokbar .tk { font-family: var(--mono); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; }
.tokbar .tk.ur { font-family: var(--font-ur); direction: rtl; }
.tokbar .axis { position: relative; height: 14px; }
.tokbar .axis::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--line-2); }
.tokbar .axis i { position: absolute; top: 2px; height: 10px; border-radius: 3px; transition: width .6s var(--ease); }
.tokbar .axis i.pos { left: 50%; background: var(--red); }
.tokbar .axis i.neg { right: 50%; background: var(--series-1); }
.tokbar .num { font-family: var(--mono); text-align: end; color: var(--ink-2); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .78rem; color: var(--ink-2); align-items: center; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-inline-end: 5px; vertical-align: -1px; }
.legend i.line { height: 3px; border-radius: 2px; vertical-align: 3px; width: 16px; }
.legend i.dash { height: 0; border-top: 2px dashed var(--muted); vertical-align: 3px; width: 16px; border-radius: 0; }
.meter-row.wide { grid-template-columns: minmax(0, 1.7fr) minmax(50px, 1fr) 32px; }
.msg-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: .82rem; color: var(--muted); }

/* ---------- classifier lab ---------- */
.model-card .mh2 { display: flex; align-items: center; gap: 8px; }
.metric-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.metric { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--panel-2); min-width: 0; }
.metric b { display: block; font-family: var(--mono); font-size: 1.25rem; }
.metric span { font-size: .72rem; color: var(--muted); }
.model-card .metric-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cm { display: grid; grid-template-columns: auto repeat(2, minmax(0, 1fr)); gap: 4px; font-size: .8rem; max-width: 340px; }
.cm .h { font-family: var(--mono); font-size: .68rem; color: var(--muted); text-align: center; padding: 2px; display: grid; place-items: center; }
.cm .c { border-radius: 8px; padding: 10px 6px; text-align: center; border: 1px solid var(--line); cursor: default; }
.cm .c b { display: block; font-family: var(--mono); font-size: 1.3rem; }
.cm .c span { font-size: .68rem; color: var(--ink-2); }
.cm .c.tp, .cm .c.tn { background: color-mix(in srgb, var(--green) var(--a, 20%), transparent); }
.cm .c.fp, .cm .c.fn { background: color-mix(in srgb, var(--red) var(--a, 20%), transparent); }
.baseline { display: flex; gap: 8px; align-items: center; font-size: .84rem; padding: 8px 10px; border-radius: 8px; border: 1px dashed var(--line-2); }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-family: var(--mono); font-size: 10px; }
.chart .lbl { fill: var(--ink-2); font-family: var(--mono); font-size: 10.5px; }
.chart .s1 { stroke: var(--series-1); }
.chart .s2 { stroke: var(--series-2); }
.chart .s3 { stroke: var(--series-3); }
.chart .base { stroke: var(--muted); stroke-dasharray: 5 4; }
.chart .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { stroke: var(--panel); stroke-width: 2; }
.chart .hit { fill: transparent; cursor: crosshair; }
.chart .thr { stroke: var(--amber); stroke-width: 1.5; stroke-dasharray: 4 3; }
.chart .bar-n { fill: var(--line-2); }
.chart .bar-a { fill: var(--amber); }
.chart .bar-r { fill: var(--red); }
.chart .bar-g { fill: var(--green); }
.chart .pt { fill: var(--muted); fill-opacity: .45; }
.chart .pt.flag { fill: var(--red); fill-opacity: .9; stroke: var(--panel); stroke-width: 1.5; }
.chart .pt.truth { fill: none; stroke: var(--amber); stroke-width: 1.5; }
.ds-text { max-width: 520px; }
.lab-pill { cursor: pointer; border: 0; font: inherit; }
.script-split { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cv-box { font-family: var(--mono); font-size: .84rem; }

/* ---------- link checker ---------- */
.anatomy {
  font-family: var(--mono);
  font-size: .9rem;
  padding: 12px;
  border-radius: 10px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  overflow-wrap: anywhere;
  direction: ltr;
  text-align: left;
  line-height: 1.9;
}
.anatomy span { padding: 2px 3px; border-radius: 4px; }
.anatomy .sch { color: var(--muted); }
.anatomy .usr { background: var(--red-soft); color: var(--red); }
.anatomy .sub { color: var(--ink-2); }
.anatomy .reg { background: var(--amber-soft); color: var(--amber-2); font-weight: 600; }
:root[data-theme="light"] .anatomy .reg { color: var(--amber); }
.anatomy .reg.ok { background: var(--green-soft); color: var(--green); }
.anatomy .reg.bad { background: var(--red-soft); color: var(--red); }
.anatomy .pth { color: var(--blue); }
.anatomy .qry { color: var(--muted); }
.parts-grid { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: .84rem; }
.parts-grid dt { color: var(--muted); }
.parts-grid dd { margin: 0; font-family: var(--mono); overflow-wrap: anywhere; direction: ltr; text-align: start; }
.url-card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); overflow: hidden; }
.url-card .uh { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.url-card .uh code { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: .84rem; direction: ltr; text-align: start; }
.url-card .ub { padding: 14px; display: grid; gap: 12px; }

/* ---------- jobs ---------- */
.checklist .check { border-bottom: 1px dashed var(--line); padding: 10px 0; }
.checklist .check:last-child { border-bottom: 0; }
.checklist .check.done span { color: var(--muted); text-decoration: line-through; }
.prog { display: flex; gap: 10px; align-items: center; font-size: .84rem; }
.prog .bar { flex: 1; }

/* ---------- transactions ---------- */
.lab-controls { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)) auto; gap: 10px; align-items: end; }
.feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.feature { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--panel-2); }
.feature b { display: block; font-family: var(--mono); font-size: 1.02rem; }
.feature span { font-size: .74rem; color: var(--muted); }
.feature.hot { border-color: color-mix(in srgb, var(--red) 55%, transparent); background: var(--red-soft); }
.rule-chip { font-family: var(--mono); font-size: .68rem; padding: 1px 6px; border-radius: 5px; background: var(--red-soft); color: var(--red); border: 1px solid color-mix(in srgb, var(--red) 40%, transparent); white-space: nowrap; }
.rule-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.score-pill { font-family: var(--mono); font-weight: 600; font-size: .8rem; padding: 1px 8px; border-radius: 6px; background: var(--panel-3); }
.score-pill.high { background: var(--red-soft); color: var(--red); }
.score-pill.med { background: var(--amber-soft); color: var(--amber); }
.pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 10px; font-size: .84rem; }
.slider-row { display: grid; grid-template-columns: minmax(120px, 190px) minmax(0, 1fr) 48px; gap: 10px; align-items: center; font-size: .86rem; }
.slider-row output { font-family: var(--mono); text-align: end; }
.mini-hist { display: flex; gap: 3px; align-items: flex-end; height: 44px; }
.mini-hist i { flex: 1; background: var(--line-2); border-radius: 2px 2px 0 0; min-height: 2px; }
.mini-hist i.on { background: var(--red); }

/* ---------- review queue ---------- */
.review { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 16px; align-items: start; }
.queue { max-height: 70vh; overflow-y: auto; display: grid; gap: 6px; }
.qrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; text-align: start; font: inherit; color: inherit; width: 100%; }
.qrow.on { border-color: var(--amber); background: var(--amber-soft); }
.qrow .t { font-family: var(--mono); font-size: .82rem; }
.qrow .d { font-size: .76rem; color: var(--muted); }
.case-head { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.case-amt { font-family: var(--mono); font-size: 1.8rem; font-weight: 600; }
.decide { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.decide .btn { min-height: 46px; }
.compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.timeline { display: grid; gap: 4px; font-size: .8rem; }
.timeline div { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 8px; padding: 5px 8px; border-radius: 6px; background: var(--panel-2); }
.timeline div.cur { background: var(--amber-soft); }
.timeline div.fr { border-inline-start: 3px solid var(--red); }

/* ---------- report generator ---------- */
.letter {
  background: #fdfcf8;
  color: #1a1d21;
  border-radius: 10px;
  padding: 26px 28px;
  font-family: var(--font);
  font-size: .92rem;
  line-height: 1.65;
  box-shadow: var(--shadow);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  min-height: 400px;
}
.letter.ur { font-family: var(--font-ur); line-height: 2.2; direction: rtl; text-align: right; }
.contacts .item .d { direction: ltr; text-align: start; }
html[dir="rtl"] .contacts .item .d { text-align: end; }

/* ---------- learn & quiz ---------- */
.pattern-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.pcard { display: grid; gap: 8px; padding: 16px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--panel); text-decoration: none; color: inherit; align-content: start; }
.pcard:hover { border-color: var(--amber); }
.pcard .top { display: flex; gap: 10px; align-items: center; }
.pcard .ico { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--red-soft); color: var(--red); flex: none; }
.pcard p { color: var(--ink-2); font-size: .88rem; margin: 0; }
.pcard .read { color: var(--green); font-size: .78rem; display: flex; gap: 4px; align-items: center; }
.lesson { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); gap: 16px; align-items: start; }
.lesson h4 { font-size: .95rem; margin: 14px 0 8px; display: flex; gap: 8px; align-items: center; }
.lesson ul { margin: 0; padding-inline-start: 20px; display: grid; gap: 6px; }
.example { border: 1px solid var(--line-2); border-radius: 12px; background: var(--bg-2); padding: 14px; position: relative; }
.example .from { font-family: var(--mono); font-size: .76rem; color: var(--muted); margin-bottom: 6px; }
.quiz { max-width: 760px; margin: 0 auto; }
.qopts { display: grid; gap: 8px; margin-top: 14px; }
.qopt { display: flex; gap: 12px; align-items: center; width: 100%; text-align: start; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel-2); cursor: pointer; font: inherit; color: inherit; min-height: 48px; }
.qopt:hover:not([disabled]) { border-color: var(--amber); }
.qopt .k { font-family: var(--mono); width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; background: var(--panel-3); flex: none; font-size: .8rem; }
.qopt.right { border-color: var(--green); background: var(--green-soft); }
.qopt.wrong { border-color: var(--red); background: var(--red-soft); }
.qopt[disabled] { cursor: default; }
.qexplain { margin-top: 14px; padding: 12px 14px; border-radius: 10px; border-inline-start: 3px solid var(--amber); background: var(--panel-2); }
.qprog { display: flex; gap: 4px; }
.qprog i { flex: 1; height: 5px; border-radius: 3px; background: var(--panel-3); }
.qprog i.ok { background: var(--green); }
.qprog i.no { background: var(--red); }
.qprog i.cur { background: var(--amber); }

/* ---------- inbox, settings, about ---------- */
.note-row.unread { border-inline-start: 3px solid var(--amber); }
.note-row.unread .t::after { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--amber); margin-inline-start: 8px; vertical-align: 2px; }
.set-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.set-row:last-child { border-bottom: 0; }
.set-row .d { color: var(--muted); font-size: .82rem; }
.todo-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 0; border-bottom: 1px dashed var(--line); align-items: start; }
.todo-row code { font-size: .78rem; color: var(--amber); }
.kb-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 18px; }
.kb-grid div { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: .88rem; }

/* ---------- print ---------- */
#printArea { display: none; }
@media print {
  @page { margin: 14mm; }
  body { background: #fff !important; color: #111 !important; }
  body.printing > *:not(#printArea) { display: none !important; }
  body.printing #printArea { display: block !important; }
  #printArea { font-family: var(--font); color: #111; font-size: 11pt; line-height: 1.5; }
  #printArea h1 { font-size: 18pt; margin-bottom: 4pt; }
  #printArea h2 { font-size: 13pt; margin: 14pt 0 6pt; border-bottom: 1px solid #999; padding-bottom: 3pt; }
  #printArea table { width: 100%; border-collapse: collapse; font-size: 9.5pt; }
  #printArea th, #printArea td { border: 1px solid #bbb; padding: 4pt 6pt; text-align: start; vertical-align: top; }
  #printArea .pr-meta { color: #555; font-size: 9pt; }
  #printArea .pr-letter { white-space: pre-wrap; }
  #printArea .pr-ur { font-family: var(--font-ur); direction: rtl; line-height: 2.1; }
  #printArea .pr-note { margin-top: 14pt; font-size: 8.5pt; color: #555; border-top: 1px solid #ccc; padding-top: 6pt; }
}

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .lab-controls { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 1020px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail {
    position: fixed;
    inset-block: 0;
    inset-inline-start: 0;
    width: min(290px, 84vw);
    transform: translateX(-105%);
    transition: transform .3s var(--ease);
    box-shadow: var(--shadow);
    z-index: 75;
  }
  html[dir="rtl"] .rail { transform: translateX(105%); }
  .rail.open, html[dir="rtl"] .rail.open { transform: none; }
  #menuBtn { display: inline-flex; }
  .split, .split.even, .lesson, .review, .hero { grid-template-columns: minmax(0, 1fr); }

  .hero-art { display: none; }
}
@media (max-width: 720px) {
  html { font-size: 15px; }
  .topbar { padding: 8px 12px; gap: 6px; }
  .tb-search { min-width: 0; width: 40px; padding: 0; justify-content: center; }
  .tb-search span, .tb-search kbd, .tb-hide-sm { display: none; }
  main { padding: 16px 12px 96px; }
  .page-head h2 { font-size: 1.3rem; }
  .g2, .g3, .g4, .form-grid, .compare, .kb-grid, .script-split { grid-template-columns: minmax(0, 1fr); }
  .metric-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lab-controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .verdict { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; }
  .verdict h3 { justify-content: center; }
  .scorebox { grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; }
  .decide { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .flag { grid-template-columns: 32px minmax(0, 1fr); }
  .flag .pts { grid-column: 2; }
  .meter-row { grid-template-columns: minmax(80px, 110px) minmax(0, 1fr) 44px; }
  .slider-row { grid-template-columns: minmax(0, 1fr) 48px; }
  .slider-row input { grid-column: 1 / -1; grid-row: 2; }
  .hero { padding: 16px; }
  .tabbar {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    position: fixed;
    bottom: 0;
    inset-inline: 0;
    z-index: 40;
    background: color-mix(in srgb, var(--bg-2) 94%, transparent);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
  }
  .tabbar a, .tabbar button {
    display: grid;
    justify-items: center;
    gap: 2px;
    padding: 6px 2px;
    min-height: 52px;
    font-size: .68rem;
    color: var(--muted);
    text-decoration: none;
    border: 0;
    background: transparent;
    font-weight: 600;
    cursor: pointer;
  }
  .tabbar .on { color: var(--amber); }
  .tabbar .ic { width: 1.35em; height: 1.35em; }
  html[lang="ur"] .tabbar a, html[lang="ur"] .tabbar button { font-size: .66rem; line-height: 1.6; }
  #toasts { bottom: 74px; }
  .table-wrap table.data { font-size: .8rem; }
  .hide-sm { display: none !important; }
  .queue { max-height: 250px; }
}
</style>

<script>
/* =====================================================================
   FraudShield — Scam & Fraud Detection for Digital Payments (single file)
   utils · i18n · lexicon · dataset · content · state · text · rules ·
   classifiers · link checker · job checker · transaction lab ·
   shell/router · home · analyser · classifier lab · links · jobs ·
   transactions · review queue · evidence · reports · learn · quiz ·
   dashboard · inbox · settings · search · tour · about · print · boot
   Student extension points are marked with  TODO(student)
   ===================================================================== */
'use strict';

// ---------- storage ----------
const NS = 'fs:';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

// TODO(student): Cloud sync for analysts — keep this store interface but back it with an authenticated API
//   (Node + Postgres or Supabase) so review labels, evidence and relabelled messages are shared by a team.
//   Add per-record `updated` stamps, push in the background, and resolve conflicts per record.
const store = {
  get(k, d) {
    try {
      const v = localStorage.getItem(NS + k);
      return v == null ? d : JSON.parse(v);
    } catch {
      return d;
    }
  },
  set(k, v) {
    try {
      localStorage.setItem(NS + k, JSON.stringify(v));
      return true;
    } catch {
      return false;
    }
  },
  remove(k) {
    try {
      localStorage.removeItem(NS + k);
    } catch {
      /* storage blocked */
    }
  },
  keys() {
    const out = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(NS)) out.push(k.slice(NS.length));
      }
    } catch {
      /* storage blocked */
    }
    return out;
  },
};

// ---------- small helpers ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const uid = (p = '') => p + Math.random().toString(36).slice(2, 9);
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
const sum = arr => arr.reduce((a, b) => a + (+b || 0), 0);
const mean = arr => (arr.length ? sum(arr) / arr.length : 0);
const round = (n, d = 2) => Math.round(n * 10 ** d) / 10 ** d;
const pct = (n, d = 0) => (Number.isFinite(n) ? (n * 100).toFixed(d) + '%' : '—');
const fmtNum = n => Math.round(n).toLocaleString('en-PK');
const fmtPKR = n => 'Rs ' + Math.round(n).toLocaleString('en-PK');
const bdi = s => `<bdi class="tnum mono">${esc(s)}</bdi>`;

// Escape text and isolate phone numbers and links so they keep left-to-right order inside Urdu text.
const LTR_RUN = /https?:\/\/\S+|[+\d][\d\s-]{5,}\d/g;
const bidiText = s => esc(s).replace(LTR_RUN, m => `<bdi dir="ltr">${m}</bdi>`);
const sigmoid = z => 1 / (1 + Math.exp(-z));

function debounce(fn, ms = 200) {
  let timer = 0;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), ms);
  };
}

// FNV-1a string hash and mulberry32 PRNG for deterministic data and splits.
function hashStr(text) {
  let h = 2166136261;
  for (let i = 0; i < text.length; i++) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let x = a;
    x = Math.imul(x ^ (x >>> 15), x | 1);
    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

// Standard normal sample (Box–Muller) from a uniform generator.
function gauss(rand) {
  const u = Math.max(rand(), 1e-12);
  const v = rand();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

function shuffle(arr, rand) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const pick = (arr, rand) => arr[Math.floor(rand() * arr.length)];

// ---------- dates ----------
const DAY = 864e5;
const TODAY = new Date(2026, 9, 16, 10, 0, 0);
const nowISO = () => new Date().toISOString();
const iso = d => {
  const x = new Date(d);
  const m = String(x.getMonth() + 1).padStart(2, '0');
  const day = String(x.getDate()).padStart(2, '0');
  return `${x.getFullYear()}-${m}-${day}`;
};
const hhmm = d => {
  const x = new Date(d);
  return String(x.getHours()).padStart(2, '0') + ':' + String(x.getMinutes()).padStart(2, '0');
};
const fmtDate = d => new Date(d).toLocaleDateString(lang() === 'ur' ? 'ur-PK' : 'en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const fmtDateTime = d => fmtDate(d) + ' ' + hhmm(d);

function ago(d) {
  const mins = Math.round((Date.now() - new Date(d).getTime()) / 60000);
  if (mins < 1) return t('justNow');
  if (mins < 60) return t('minsAgo', { n: mins });
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return t('hrsAgo', { n: hrs });
  return t('daysAgo', { n: Math.round(hrs / 24) });
}

// ---------- DOM feedback ----------
function toast(msg, kind = 'ok') {
  const icons = { ok: 'check-circle', warn: 'alert', err: 'alert-circle', info: 'info' };
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = ic(icons[kind] || 'info') + `<div>${msg}</div>`;
  $('#toasts').appendChild(el);
  setTimeout(() => el.classList.add('out'), 3600);
  setTimeout(() => el.remove(), 4000);
}

function announce(msg) {
  const live = $('#live');
  live.textContent = '';
  setTimeout(() => {
    live.textContent = msg;
  }, 30);
}

const animateIn = root => {
  root.classList.remove('enter');
  void root.offsetWidth;
  root.classList.add('enter');
  $$('.stagger', root).forEach(g => [...g.children].forEach((el, i) => el.style.setProperty('--i', Math.min(i, 14))));
};

const countUp = (el, to, { dur = 700, fmt = v => Math.round(v).toLocaleString('en-PK') } = {}) => {
  const t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(to * e);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
};

const drawPath = p => {
  const L = p.getTotalLength();
  p.style.strokeDasharray = L;
  p.style.strokeDashoffset = L;
  p.getBoundingClientRect();
  p.style.transition = 'stroke-dashoffset .9s var(--ease)';
  p.style.strokeDashoffset = 0;
};

// Animate every [data-count] number and every bar fill inside a freshly rendered root.
function animateNumbers(root) {
  $$('[data-count]', root).forEach(el => {
    const to = parseFloat(el.dataset.count);
    const dec = +(el.dataset.dec || 0);
    const suffix = el.dataset.suffix || '';
    countUp(el, to, { fmt: v => (dec ? v.toFixed(dec) : Math.round(v).toLocaleString('en-PK')) + suffix });
  });
  $$('.bar > i[data-w], .tokbar i[data-w]', root).forEach(el => {
    el.style.width = '0';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.style.width = el.dataset.w;
    }));
  });
  $$('path.draw', root).forEach(drawPath);
}

// ---------- chart tooltip (hover layer shared by all SVG charts) ----------
function bindTooltips(root = document) {
  const tip = $('#tip');
  root.addEventListener('pointermove', e => {
    const el = e.target.closest('[data-tip]');
    if (!el) {
      tip.classList.remove('on');
      return;
    }
    tip.innerHTML = el.dataset.tip;
    tip.classList.add('on');
    const w = tip.offsetWidth;
    const x = Math.min(window.innerWidth - w - 8, e.clientX + 14);
    tip.style.left = Math.max(8, x) + 'px';
    tip.style.top = e.clientY + 16 + 'px';
  });
  root.addEventListener('pointerleave', () => tip.classList.remove('on'));
}

// ---------- files ----------
function download(name, text, type = 'application/json') {
  const blob = new Blob([text], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    URL.revokeObjectURL(a.href);
    a.remove();
  }, 500);
}

function pickFile(accept = '.json,application/json') {
  return new Promise(resolve => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = accept;
    input.onchange = () => {
      const f = input.files && input.files[0];
      if (!f) return resolve(null);
      const reader = new FileReader();
      reader.onload = () => resolve({ name: f.name, text: String(reader.result) });
      reader.onerror = () => resolve(null);
      reader.readAsText(f);
    };
    input.click();
  });
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast(t('copied'));
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      toast(t('copied'));
    } catch {
      toast(t('copyFailed'), 'warn');
    }
    ta.remove();
  }
}

// ---------- i18n: English / Urdu ----------
// Every user-facing string is a pair [English, Urdu]. t() formats {placeholders}; th() escapes them for HTML.
const MISSING_KEYS = new Set();

function tr(key, lng, vars) {
  const pair = I18N[key];
  if (!pair) MISSING_KEYS.add(key);
  let s = pair ? (lng === 'ur' ? pair[1] : pair[0]) || pair[0] : key;
  if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] ?? m));
  return s;
}

const t = (key, vars) => tr(key, SETTINGS.lang, vars);
const th = (key, vars) => t(key, vars && Object.fromEntries(Object.entries(vars).map(([k, v]) => [k, esc(v)])));

const showDemo = rec => SETTINGS.demo || !rec.demo;

// Collections stored as arrays of records with an id.
const coll = {
  all(key) {
    return store.get(key, []);
  },
  visible(key) {
    return coll.all(key).filter(showDemo);
  },
  add(key, rec, cap = 300) {
    const list = coll.all(key);
    list.unshift(rec);
    store.set(key, list.slice(0, cap));
    return rec;
  },
  update(key, id, patch) {
    const list = coll.all(key).map(r => (r.id === id ? { ...r, ...patch } : r));
    store.set(key, list);
  },
  remove(key, id) {
    store.set(key, coll.all(key).filter(r => r.id !== id));
  },
};

// ---------- activity log ----------
function logEvent(key, vars = {}, icon = 'activity') {
  coll.add('log', { id: uid('l'), at: nowISO(), key, vars, icon }, 400);
}

// ---------- notifications inbox ----------
function notify(key, vars = {}, opts = {}) {
  const note = { id: uid('n'), at: nowISO(), key, vars, icon: opts.icon || 'bell', level: opts.level || 'info', route: opts.route || '', read: false, demo: !!opts.demo };
  coll.add('inbox', note, 120);
  updateBell();
  return note;
}

function unreadCount() {
  return coll.visible('inbox').filter(n => !n.read).length;
}

function updateBell() {
  const dot = $('#bellDot');
  if (!dot) return;
  const n = unreadCount();
  dot.textContent = n > 9 ? '9+' : String(n);
  dot.classList.toggle('hidden', n === 0);
  const count = $('#nav [data-route="inbox"] .count');
  if (count) {
    count.textContent = n;
    count.classList.toggle('hidden', n === 0);
  }
}
