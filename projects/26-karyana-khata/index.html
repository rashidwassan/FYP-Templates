    <div class="grid2 mt">${field(t('category'), `<select class="inp" id="fCat">${CATS.map(c => opt(c.id, catName(c.id), v.cat)).join('')}</select>`)}
      ${field(t('unit'), `<select class="inp" id="fUnit" ${it ? 'disabled' : ''}>${Object.keys(UNITS).map(k => opt(k, unitName(k), u)).join('')}</select>`, it ? t('unitLocked') : t('looseHint'))}</div>
    <div class="grid2 mt">${field(t('sellPrice') + ' (Rs)', `<input class="inp money-in" id="fSell" inputmode="decimal" value="${v.sellP ? rsInput(v.sellP) : ''}">`, `<span id="fPer">${t('per_' + u)}</span>`)}
      ${it ? field(t('expiry'), `<input class="inp" id="fExp" type="date" value="${it.expiry || ''}">`, t('oldestBatch')) : field(t('costPrice') + ' (Rs)', `<input class="inp money-in" id="fCost" inputmode="decimal">`)}</div>
    ${it ? '' : `<div class="grid2 mt">${field(t('openingStock'), `<input class="inp" id="fOpen" inputmode="decimal" placeholder="0">`, `<span class="fUnitLbl">${t('in_' + u)}</span>`)}${field(t('expiry'), `<input class="inp" id="fExp" type="date">`)}</div>`}
    <div class="grid2 mt">${field(t('reorderLevel'), `<input class="inp" id="fReorder" inputmode="decimal" value="${it ? qtyInput(u, it.reorder) : ''}">`, `<span class="fUnitLbl">${t('in_' + u)}</span>`)}
      ${field(t('packSize'), `<input class="inp" id="fPack" inputmode="decimal" value="${it ? qtyInput(u, it.pack) : '1'}">`, t('packHint'))}</div>
    <div class="grid2 mt">${field(t('supplier'), `<select class="inp" id="fSup">${S.suppliers.map(s => opt(s.id, esc(nm(s)), v.supId)).join('')}</select>`)}
      ${field(t('barcode'), `<div class="row" style="flex-wrap:nowrap"><input class="inp" id="fCode" inputmode="numeric" value="${esc(v.barcode)}"><button type="button" class="btn ghost icon" id="fScan" aria-label="${t('scan')}">${ic('barcode')}</button></div>`, t('barcodeHint'))}</div>
    <div class="err hidden" id="fErr"></div>
    <div class="sfoot"><button type="button" class="btn ghost" data-close>${t('cancel')}</button><button type="button" class="btn" id="fSave">${ic('save')} ${t('save')}</button></div>`;
}

function readItemForm(it) {
  const unit = it ? it.unit : $('#fUnit').value;
  const f = {
    name: $('#fName').value.trim(),
    ur: $('#fUr').value.trim(),
    cat: $('#fCat').value,
    unit,
    sellP: parseRs($('#fSell').value),
    reorder: parseQty($('#fReorder').value || '0', unit) || 0,
    pack: parseQty($('#fPack').value, unit),
    supId: $('#fSup').value,
    barcode: $('#fCode').value.trim(),
    expiry: $('#fExp').value || '',
  };
  if (!it) {
    f.costP = parseRs($('#fCost').value);
    f.open = $('#fOpen').value.trim() ? parseQty($('#fOpen').value, unit) : 0;
  }
  return f;
}

function validateItem(f, it) {
  if (f.name.length < 2) return 'err_name';
  if (!(f.sellP > 0)) return 'err_price';
  if (!it && !(f.costP >= 0)) return 'err_cost';
  if (!it && !(f.open >= 0)) return 'err_qty';
  if (!(f.pack > 0)) return 'err_pack';
  if (f.barcode && !/^\d{6,14}$/.test(f.barcode)) return 'err_barcode';
  if (/^(\d{8}|\d{12,13})$/.test(f.barcode) && !eanValid(f.barcode)) return 'err_check';
  if (f.barcode && S.items.some(i => i.barcode === f.barcode && i !== it)) return 'err_dupBarcode';
  return '';
}

function saveItem(it, f) {
  if (it) {
    if (f.sellP !== it.sellP) {
      it.priceHist.push({ ts: Date.now(), fromP: it.sellP, toP: f.sellP, by: role });
      logAct('act_price', { item: it.id, amt: it.sellP, amt2: f.sellP }, 'stock');
    }
    Object.assign(it, { name: f.name, ur: f.ur, cat: f.cat, sellP: f.sellP, reorder: f.reorder, pack: f.pack, supId: f.supId, barcode: f.barcode });
    if (f.expiry !== it.expiry && it.batches.length) setOldestExpiry(it, f.expiry);
    logAct('act_itemEdit', { item: it.id }, 'stock');
    return it;
  }
  const costPool = lineAmount(f.costP, f.open, f.unit);
  const n = { id: nid('i'), name: f.name, ur: f.ur, cat: f.cat, unit: f.unit, sellP: f.sellP, lastCostP: f.costP, stock: f.open, poolP: costPool, openQty: f.open, openCostP: costPool, reorder: f.reorder, pack: f.pack, expiry: '', batches: [], supId: f.supId, barcode: f.barcode, shelf: 365, createdAt: Date.now(), priceHist: [] };
  if (f.open > 0) addBatch(n, f.open, f.expiry);
  S.items.push(n);
  logAct('act_itemAdd', { item: n.id, itemName: n.name }, 'stock');
  return n;
}

function openItemForm(it = null, pre = {}) {
  if (!isOwner()) return requireOwner(() => openItemForm(it, pre));
  const sh = openModal(itemFormHtml(it, pre), { wide: true });
  if (!it) {
    $('#fUnit', sh).onchange = e => {
      $('#fPer').textContent = t('per_' + e.target.value);
      $$('.fUnitLbl', sh).forEach(x => (x.textContent = t('in_' + e.target.value)));
    };
  }
  $('#fScan', sh).onclick = () => openScanner(code => {
    openItemForm(it, { ...pre, barcode: code });
  });
  $('#fSave', sh).onclick = () => {
    const f = readItemForm(it);
    const err = validateItem(f, it);
    $('#fErr').classList.toggle('hidden', !err);
    if (err) return ($('#fErr').textContent = t(err));
    const saved = saveItem(it, f);
    touch('items', 'activity');
    closeModal();
    toast(t('itemSaved', { name: nm(saved) }), 'ok');
    go('item/' + saved.id);
  };
}

// ---------- stock adjustment: damage, expiry, own use, or a physical count ----------
function adjPreview(it, reason, raw) {
  if (reason === 'count') {
    const counted = /^\d*(\.\d+)?$/.test(raw) && raw !== '' ? Math.round(Number(raw) * UNITS[it.unit].base) : NaN;
    return { qty: counted - it.stock };
  }
  const q = parseQty(raw, it.unit);
  return { qty: q > 0 ? -q : NaN };
}

function openAdjust(it) {
  let reason = 'damage';
  const sh = openModal(`${sheetHead(t('adjustStock') + ' · ' + esc(nm(it)), 'sliders')}
    <div class="seg" id="aReason">${ADJ_REASONS.map(r => `<button type="button" data-r="${r}" class="${r === reason ? 'on' : ''}">${t('adj_' + r)}</button>`).join('')}</div>
    <p class="small muted mt" id="aHelp"></p>
    ${field(`<span id="aLbl"></span> (${t('in_' + it.unit)})`, `<input class="inp" id="aQty" inputmode="decimal" autocomplete="off">`)}
    <div class="mt">${field(t('note'), `<input class="inp" id="aNote" autocomplete="off">`)}</div>
    <div class="calc mt" id="aPrev"></div>
    <div class="sfoot"><button type="button" class="btn ghost" data-close>${t('cancel')}</button><button type="button" class="btn" id="aSave">${ic('save')} ${t('save')}</button></div>`);
  const draw = () => {
    $('#aHelp').textContent = t('adjHelp_' + reason);
    $('#aLbl').textContent = t(reason === 'count' ? 'countedQty' : 'qtyRemoved');
    const p = adjPreview(it, reason, $('#aQty').value.trim());
    const ok = Number.isFinite(p.qty) && p.qty !== 0 && it.stock + p.qty >= 0;
    const cost = ok ? (p.qty < 0 ? Math.round((it.poolP * -p.qty) / Math.max(it.stock, 1)) : 0) : 0;
    $('#aPrev').innerHTML = ok ? `${t('change')}: <b>${qtyStr(it.unit, p.qty)}</b> ${ic('arrow-right', 'flip')} ${qtyStr(it.unit, it.stock + p.qty)}${p.qty < 0 ? ` · ${t('lossAtCost')} <b>${rs(cost)}</b>` : ''}` : t('enterQty');
    $('#aSave').disabled = !ok;
    return ok ? p.qty : null;
  };
  $$('#aReason button', sh).forEach(b => (b.onclick = () => {
    reason = b.dataset.r;
    $$('#aReason button', sh).forEach(x => x.classList.toggle('on', x === b));
    draw();
  }));
  $('#aQty', sh).oninput = draw;
  $('#aSave', sh).onclick = () => {
    const qty = draw();
    if (qty === null) return;
    try {
      postAdjust({ ts: Date.now(), itemId: it.id, reason, qty, note: $('#aNote').value.trim(), by: role });
      logAct('act_adjust', { item: it.id, q: qty, reason }, 'stock');
      touch('items', 'adjust', 'activity');
      closeModal();
      rerender();
      toast(t('adjSaved'), 'ok');

// ---------- barcode: camera via BarcodeDetector where the browser has it, typed code otherwise ----------
async function startCamera(sh, finish) {
  const formats = await BarcodeDetector.getSupportedFormats();
  const want = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'].filter(f => formats.includes(f));
  const detector = new BarcodeDetector({ formats: want.length ? want : formats });
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  const video = $('#scVideo', sh);
  video.srcObject = stream;
  await video.play();
  let alive = true;
  const loop = async () => {
    if (!alive) return;
    const codes = await detector.detect(video).catch(() => []);
    if (codes.length) return finish(codes[0].rawValue);
    setTimeout(loop, 250);
  };
  loop();
  return () => {
    alive = false;
    stream.getTracks().forEach(tr => tr.stop());
  };
}

function openScanner(onCode) {
  const supported = 'BarcodeDetector' in window && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  let stop = () => {};
  const sh = openModal(`${sheetHead(t('scanTitle'), 'barcode')}
    ${supported ? `<div class="scanbox"><video id="scVideo" playsinline muted></video></div><p class="small muted mt">${t('scanHint')}</p>` : `<div class="notice">${ic('info')}<span>${t('scanUnsupported')}</span></div>`}
    <div class="mt">${field(t('typeBarcode'), `<input class="inp" id="scCode" inputmode="numeric" autocomplete="off" placeholder="896…">`, t('barcodeHint'))}</div>
    <div class="err hidden" id="scErr"></div>
    <div class="sfoot"><button type="button" class="btn ghost" data-close>${t('cancel')}</button><button type="button" class="btn" id="scOk">${ic('check')} ${t('useCode')}</button></div>`, { onClose: () => stop() });
  const finish = code => {
    stop();
    closeModal();
    onCode(code);
  };
  $('#scOk', sh).onclick = () => {
    const code = $('#scCode').value.trim();
    const bad = !/^\d{6,14}$/.test(code) ? 'err_barcode' : /^(\d{8}|\d{12,13})$/.test(code) && !eanValid(code) ? 'err_check' : '';
    $('#scErr').classList.toggle('hidden', !bad);
    if (bad) return ($('#scErr').textContent = t(bad));
    finish(code);
  };
  $('#scCode', sh).onkeydown = e => e.key === 'Enter' && $('#scOk').click();
  if (supported) {
    startCamera(sh, finish).then(s => (stop = s)).catch(() => {
      $('.scanbox', sh).outerHTML = `<div class="notice">${ic('camera')}<span>${t('cameraDenied')}</span></div>`;
    });
  }
}

// ---------- printable customer statement ----------
function statementData(c, fromKey, toKey) {
  const from = dayStartOf(fromKey);
  const to = dayStartOf(toKey) + DAY;
  const all = custEntries(c.id);
  const openingP = sum(all.filter(e => e.ts < from), e => signOf(e) * e.amountP);
  let run = openingP;
  const rows = all.filter(e => e.ts >= from && e.ts < to).map(e => ({ e, run: (run += signOf(e) * e.amountP) }));
  return { openingP, rows, closingP: run, debitP: sum(rows.filter(r => signOf(r.e) > 0), r => r.e.amountP), creditP: sum(rows.filter(r => signOf(r.e) < 0), r => r.e.amountP) };
}

function openStatement(c) {
  const first = custEntries(c.id)[0];
  const st = { from: first ? dkey(Math.max(first.ts, Date.now() - 60 * DAY)) : todayKey(), to: todayKey() };
  const sh = openModal(`${sheetHead(t('statement') + ' · ' + esc(nm(c)), 'printer')}
    <div class="grid2">${field(t('from'), `<input class="inp" type="date" id="stFrom" value="${st.from}">`)}${field(t('to'), `<input class="inp" type="date" id="stTo" value="${st.to}">`)}</div>
    <div class="facts mt" id="stSum"></div>
    <div class="sfoot"><button type="button" class="btn ghost" id="stShare">${ic('share')} ${t('share')}</button><button type="button" class="btn" id="stPrint">${ic('printer')} ${t('print')}</button></div>`);
  const draw = () => {
    st.from = $('#stFrom').value || st.from;
    st.to = $('#stTo').value || st.to;
    const d = statementData(c, st.from, st.to);
    const f = (k, v) => `<div class="fact"><div class="k">${t(k)}</div><div class="v">${rs(v)}</div></div>`;
    $('#stSum').innerHTML = f('openingBalance', d.openingP) + f('gave', d.debitP) + f('got', d.creditP) + f('closingBalance', d.closingP);
  };
  $('#stFrom', sh).onchange = draw;
  $('#stTo', sh).onchange = draw;
  $('#stPrint', sh).onclick = () => printDoc(statementHtml(c, st.from, st.to));
  $('#stShare', sh).onclick = () => {
    const d = statementData(c, st.from, st.to);
    const lines = d.rows.slice(-8).map(r => `${fmtDate(r.e.ts)}  ${t('le_' + r.e.type)}  ${signOf(r.e) > 0 ? '+' : '-'}${amt(r.e.amountP)}  = ${amt(r.run)}`);
    shareText([`${S.settings.shopName} — ${t('stmtTitle')}: ${nm(c)}`, `${fmtDay(st.from)} – ${fmtDay(st.to)}`, ...lines, `${t('closingBalance')}: ${rs(d.closingP)}`].join('\n'), c.phone);
  };
  draw();
}

function saveCustomer(c, f, openP) {
  if (c) {
    Object.assign(c, f);
    logAct('act_custEdit', { cust: c.id }, 'udhaar');
    touch('customers', 'activity');
    return c;
  }
  const n = { id: nid('c'), ...f, balanceP: 0, createdAt: Date.now() };
  S.customers.push(n);
  memo.clear();
  if (openP > 0) addLedger({ custId: n.id, ts: Date.now(), type: 'open', amountP: openP, by: role, note: t('openingBalance') });
  logAct('act_custAdd', { cust: n.id, custName: n.name }, 'udhaar');
  touch('customers', 'ledger', 'activity');
  return n;
}

function exportCustomerLedgerCsv() {
  const rows = [['Customer', 'Customer (Urdu)', 'Phone', 'Date', 'Type', 'Bill', 'Note', 'Gave (Rs)', 'Got (Rs)', 'Balance (Rs)']];
  S.customers.forEach(c => {
    let run = 0;
    custEntries(c.id).forEach(e => {
      run += signOf(e) * e.amountP;
      const s = e.saleId ? saleById(e.saleId) : null;
      rows.push([c.name, c.ur || '', c.phone, fmtISO(e.ts), e.type, s ? s.no : '', e.note, signOf(e) > 0 ? csvRs(e.amountP) : '', signOf(e) < 0 ? csvRs(e.amountP) : '', csvRs(run)]);

  downloadFile(`udhaar-ledger-${todayKey()}.csv`, toCsv(rows), 'text/csv;charset=utf-8');
  logAct('act_export', { what: 'udhaar CSV' }, 'backup');
  touch('activity');

let pDraft = null;
const newDraft = (supId = '') => ({ supId: supId || (S.suppliers[0] ? S.suppliers[0].id : ''), lines: [], paid: '', method: 'cash', note: '' });
const draftLine = it => ({ itemId: it.id, qty: qtyInput(it.unit, it.pack), cost: rsInput(it.lastCostP), expiry: it.shelf && it.shelf < 1000 ? addDays(todayKey(), it.shelf) : '' });

function draftTotals() {
  return pDraft.lines.map(l => {
    const it = itemById(l.itemId);
    const qty = parseQty(l.qty, it.unit);
    const unitP = parseRs(l.cost);
    return { l, it, qty, unitP, costP: qty > 0 && unitP >= 0 ? lineAmount(unitP, qty, it.unit) : NaN };
  });
}

function purchaseLineHtml(x, i) {
  return `<div class="slip tight" data-line="${i}"><div class="between"><b>${esc(nm(x.it))}</b><span class="row"><b class="money">${Number.isFinite(x.costP) ? rs(x.costP) : '—'}</b>

      ${field(`Rs ${t('per_' + x.it.unit)}`, `<input class="inp" data-f="cost" inputmode="decimal" value="${esc(x.l.cost)}">`)}

function renderPurchaseForm(arg) {
  if (!pDraft || (arg && arg !== 'draft')) pDraft = newDraft(supById(arg) ? arg : '');
  const it = itemById(arg);
  if (it && !pDraft.lines.some(l => l.itemId === it.id)) {

function drawPoSuggest() {
  const q = $('#poQ').value;
  const list = q.trim() ? searchItems(q, 12) : S.items.filter(i => i.supId === pDraft.supId && stockState(i) !== 'ok').slice(0, 12);
  $('#poSuggest').innerHTML = list.map(i => `<button type="button" class="chip" data-addpo="${i.id}">${ic('plus')} ${esc(nm(i))}</button>`).join('') || `<span class="small muted">${t('noMatch')}</span>`;
  $$('[data-addpo]').forEach(b => (b.onclick = () => {
    const it = itemById(b.dataset.addpo);
    if (!pDraft.lines.some(l => l.itemId === it.id)) pDraft.lines.push(draftLine(it));
    $('#poQ').value = '';
    drawPoSuggest();
    drawPoLines();
  }));
}

function drawPoLines() {
  const xs = draftTotals();
  $('#poLines').innerHTML = xs.map(purchaseLineHtml).join('') || `<div class="slip">${emptyHtml('box', t('poEmpty'))}</div>`;
  $$('#poLines [data-line]').forEach(card => {
    const i = Number(card.dataset.line);
    $$('[data-f]', card).forEach(inp => (inp.onchange = () => {
      pDraft.lines[i][inp.dataset.f] = inp.value.trim();
      later(drawPoLines);
    }));
  });
  $$('#poLines [data-rm]').forEach(b => (b.onclick = () => {
    pDraft.lines.splice(Number(b.dataset.rm), 1);
    drawPoLines();
  }));
  drawPoSum(xs);
}

function drawPoSum(xs) {
  const ok = xs.length && xs.every(x => Number.isFinite(x.costP) && x.qty > 0);
  const total = ok ? sum(xs, x => x.costP) : 0;
  const paid = parseRs(pDraft.paid || '0');
  const s = supById(pDraft.supId);
  $('#poSum').innerHTML = `<h3>${ic('calculator')} ${t('poSummary')}</h3>
    <div class="totals"><div class="tr"><span>${t('nLines', { n: xs.length })}</span><b class="money">${rs(total)}</b></div></div>
    ${field(t('paidAtDelivery') + ' (Rs)', `<input class="inp money-in" id="poPaid" inputmode="decimal" placeholder="0" value="${esc(pDraft.paid)}">`)}
    <div class="seg mt" id="poM">${['cash', 'bank', 'wallet'].map(m => `<button type="button" data-m="${m}" class="${pDraft.method === m ? 'on' : ''}">${t('pm_' + m)}</button>`).join('')}</div>
    <div class="totals mt"><div class="tr"><span>${t('toSupplierKhata')}</span><b class="money dr">${rs(Math.max(0, total - (paid >= 0 ? paid : 0)))}</b></div>
      <div class="tr"><span>${t('supBalanceAfter')}</span><b class="money">${s ? rs(s.balanceP + total - (paid >= 0 ? paid : 0)) : '—'}</b></div></div>
    <div class="mt">${field(t('note'), `<input class="inp" id="poNote" value="${esc(pDraft.note)}">`)}</div>
    <button type="button" class="btn lg block mt" id="poSave" ${ok ? '' : 'disabled'}>${ic('save')} ${t('savePurchase')}</button>
    <p class="hint">${t('poHint')}</p>`;
  $('#poPaid').onchange = e => {
    pDraft.paid = e.target.value.trim();
    later(() => drawPoSum(draftTotals()));
  };
  $('#poNote').onchange = e => (pDraft.note = e.target.value);
  $$('#poM button').forEach(b => (b.onclick = () => {
    pDraft.method = b.dataset.m;
    drawPoSum(draftTotals());
  }));
  $('#poSave').onclick = savePurchase;
}

function savePurchase() {
  try {
    assertOpen();
    const xs = draftTotals();
    const total = sum(xs, x => x.costP);
    const paid = parseRs(pDraft.paid || '0');
    if (!(paid >= 0) || paid > total) throw new KKError('err_paidMore');
    const p = postPurchase({ ts: Date.now(), supId: pDraft.supId, lines: xs.map(x => ({ itemId: x.it.id, qty: x.qty, costP: x.costP, expiry: x.l.expiry })), paidP: paid, method: pDraft.method, by: role, note: pDraft.note });
    logAct('act_purchase', { no: p.no, sup: p.supId, amt: p.totalP }, 'purchase');
    touch('items', 'purchases', 'supLedger', 'suppliers', 'activity');
    pDraft = null;
    toast(t('purchaseSaved', { no: p.no }), 'ok');
    go('sup/' + p.supId);
  } catch (e) {
    showError(e);
  }
}

function renderReorder() {
  const list = reorderList();
  if (!reorderPicked.size) list.forEach(x => reorderPicked.add(x.it.id));

  $('#view').innerHTML = `<div class="pagehead"><div><h2>${t('nav_reorder')}</h2><p>${t('reorderSub', { n: list.length })}</p></div></div>
    <div class="notice mb">${ic('lightbulb')}<span>${t('reorderMethod', { f: `<bdi dir="ltr">T = v·(L+R) + z·σ·√(L+R), z = ${SAFETY_Z}</bdi>` })}</span></div>

    const rows = list.filter(x => x.it.supId === b.dataset.poSup && reorderPicked.has(x.it.id));

  }));
}

// ---------- view: daily cash book (drawer cash) with day close ----------
const MOVE_ICON = { sale: 'receipt', refund: 'ban', got: 'arrow-down-left', loan: 'arrow-up-right', supPaid: 'truck', expense: 'cash-out', drawing: 'home', deposit: 'building', cashin: 'cash-in' };

function moveLabel(m) {
  const r = m.ref;
  if (m.type === 'sale') return m.n ? t('cashSalesN', { n: m.n, from: fmtTime(m.ts), to: fmtTime(m.last) }) : t('mvSale', { no: r.no });
  if (m.type === 'refund') return t('mvRefund', { no: r.no });
  if (m.type === 'got' || m.type === 'loan') return t('mv_' + m.type, { name: esc(nm(custById(r.custId))) });
  if (m.type === 'supPaid') return t('mvSupPaid', { name: esc(nm(supById(r.supId))) });
  const cat = m.type === 'expense' ? ' · ' + t('ex_' + r.cat) : '';
  return t('ck_' + m.type) + cat + (r.note ? ` <span class="muted small">${esc(r.note)}</span>` : '');
}

// Cash sales are folded into one row per hour so a busy day stays readable.
function groupedMoves(moves) {
  const out = [];
  moves.forEach(m => {
    const prev = out[out.length - 1];
    const hour = new Date(m.ts).getHours();
    if (m.type === 'sale' && prev && prev.type === 'sale' && prev.hour === hour) {
      prev.amountP += m.amountP;
      prev.n++;
      prev.last = m.ts;
    } else out.push({ ...m, hour, n: m.type === 'sale' ? 1 : 0, last: m.ts });
  });
  return out.map(m => (m.n === 1 ? { ...m, n: 0 } : m));
}

function cashTableHtml(d) {
  let run = d.openingP;
  const rows = groupedMoves(d.moves).map(m => {
    run += m.amountP;
    return `<tr><td class="nowrap">${fmtTime(m.ts)}</td><td>${ic(MOVE_ICON[m.type] || 'coins')} ${moveLabel(m)}</td><td class="r cr">${m.amountP > 0 ? amt(m.amountP) : ''}</td><td class="r dr">${m.amountP < 0 ? amt(-m.amountP) : ''}</td><td class="r"><b>${amt(run)}</b></td></tr>`;
  });
  return `<div class="tablewrap"><table class="ledger"><thead><tr><th>${t('time')}</th><th>${t('detail')}</th><th class="r">${t('cashIn')}</th><th class="r">${t('cashOut')}</th><th class="r">${t('balance')}</th></tr></thead>
    <tbody><tr class="dim"><td></td><td>${t('openingCash')}</td><td></td><td></td><td class="r"><b>${amt(d.openingP)}</b></td></tr>${rows.join('')}</tbody>
    <tfoot><tr><td></td><td>${t('expectedClose')}</td><td class="r">${amt(d.inP)}</td><td class="r">${amt(d.outP)}</td><td class="r">${amt(d.expectedP)}</td></tr></tfoot></table></div>`;
}

function bindCash(key) {

// ---------- expenses, drawings, deposits, cash added ----------
function openCashEntry(kind = 'expense') {
  if (!isOwner()) return requireOwner(() => openCashEntry(kind));
  const st = { kind, method: 'cash' };
  const sh = openModal(`${sheetHead(t('cashEntry'), 'coins')}
    <div class="seg" id="ceKind">${CASH_KINDS.map(k => `<button type="button" data-k="${k}">${t('ck_' + k)}</button>`).join('')}</div>
    <p class="small muted mt" id="ceHelp"></p>

    <div class="mt">${field(t('amount') + ' (Rs)', `<input class="inp money-in" id="ceAmt" inputmode="decimal" placeholder="0">`)}</div>
    <div class="seg mt" id="ceM">${['cash', 'bank', 'wallet'].map(m => `<button type="button" data-m="${m}">${t('pm_' + m)}</button>`).join('')}</div>
    <div class="mt">${field(t('note'), `<input class="inp" id="ceNote" autocomplete="off">`)}</div>

  const draw = () => {
    if (st.kind !== 'expense') st.method = 'cash';
    $$('#ceKind button', sh).forEach(b => b.classList.toggle('on', b.dataset.k === st.kind));
    $$('#ceM button', sh).forEach(b => b.classList.toggle('on', b.dataset.m === st.method));
    $('#ceM').classList.toggle('hidden', st.kind !== 'expense');
    $('#ceCatBox').classList.toggle('hidden', st.kind !== 'expense');
    $('#ceHelp').textContent = t('ckHelp_' + st.kind);
  };
  $$('#ceKind button', sh).forEach(b => (b.onclick = () => ((st.kind = b.dataset.k), draw())));
  $$('#ceM button', sh).forEach(b => (b.onclick = () => ((st.method = b.dataset.m), draw())));
  $('#ceOk', sh).onclick = () => {
    try {
      assertOpen();
      const rec = addCash({ ts: Date.now(), kind: st.kind, cat: st.kind === 'expense' ? $('#ceCat').value : st.kind, amountP: parseRs($('#ceAmt').value), method: st.method, note: $('#ceNote').value.trim(), by: role });

      touch('cash', 'activity');
      closeModal();
      rerender();
      toast(t('saved'), 'ok');
    } catch (e) {
      showError(e);
    }
  };
  draw();
}

// ---------- day close: count the drawer by denomination ----------
function openCloseDay(key) {
  if (!isOwner()) return requireOwner(() => openCloseDay(key));
  if (S.closes.some(c => c.date > key)) return showError(new KKError('err_closeOrder'));
  const d = daySummary(key);
  const counts = {};
  const sh = openModal(`${sheetHead(t('closeDay') + ' · ' + fmtDay(key), 'calendar-check')}
    <div class="between"><span>${t('expectedClose')}</span><b class="money" style="font-size:1.3rem">${rs(d.expectedP)}</b></div>

// ---------- charts: hand-coded SVG (no library) ----------
const chartW = () => (window.innerWidth < 700 ? 360 : 640);

function niceMax(v) {
  if (v <= 0) return 100000;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  return [1, 2, 2.5, 5, 10].map(m => m * p).find(m => m >= v);
}

const shortRs = p => {
  const r = p / 100;
  if (Math.abs(r) >= 100000) return trimNum(r / 100000, 2) + 'L';
  if (Math.abs(r) >= 1000) return trimNum(r / 1000, 1) + 'k';
  return String(Math.round(r));
};

function gridLines(w, h, pad, nice, fmt) {
  return [0, 0.25, 0.5, 0.75, 1].map(f => {
    const y = pad.t + (h - pad.t - pad.b) * (1 - f);
    return `<line class="grid" x1="${pad.l}" x2="${w - pad.r}" y1="${y}" y2="${y}"/><text x="${pad.l - 6}" y="${y + 3.5}" text-anchor="end">${fmt(nice * f)}</text>`;
  }).join('');
}

function barChart(data, { h = 180, fmt = shortRs, w = chartW(), every = 0, alt = false } = {}) {
  const pad = { l: 42, r: 6, t: 12, b: 24 };
  const nice = niceMax(Math.max(1, ...data.map(d => d.value)));
  const iw = w - pad.l - pad.r;
  const ih = h - pad.t - pad.b;
  const bw = iw / Math.max(1, data.length);
  const step = every || Math.ceil(data.length / (w < 400 ? 7 : 12));
  const bars = data.map((d, i) => {
    const bh = Math.max(d.value > 0 ? 1.5 : 0, (d.value / nice) * ih);
    const x = pad.l + i * bw + bw * 0.16;
    const lab = i % step === 0 || i === data.length - 1 ? `<text x="${x + bw * 0.34}" y="${h - 7}" text-anchor="middle">${esc(d.label)}</text>` : '';
    return `<rect class="cbar ${d.hl ? 'today' : alt ? 'alt' : ''}" x="${x.toFixed(1)}" y="${(pad.t + ih - bh).toFixed(1)}" width="${(bw * 0.68).toFixed(1)}" height="${bh.toFixed(1)}" rx="2"><title>${esc(d.label)}: ${esc(d.tip || fmt(d.value))}</title></rect>${lab}`;
  });
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(t('chart'))}" dir="ltr">${gridLines(w, h, pad, nice, fmt)}${bars.join('')}</svg>`;
}

function lineChart(data, { h = 190, fmt = shortRs, w = chartW() } = {}) {
  const pad = { l: 42, r: 10, t: 14, b: 24 };
  const nice = niceMax(Math.max(1, ...data.map(d => d.value)));
  const iw = w - pad.l - pad.r;
  const ih = h - pad.t - pad.b;
  const pt = (d, i) => [pad.l + (i / Math.max(1, data.length - 1)) * iw, pad.t + ih - (Math.max(0, d.value) / nice) * ih];
  const pts = data.map(pt);
  const path = pts.map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
  const area = `${path} L${pts[pts.length - 1][0].toFixed(1)},${pad.t + ih} L${pad.l},${pad.t + ih} Z`;
  const step = Math.ceil(data.length / (w < 400 ? 5 : 8));
  const labels = data.map((d, i) => (i % step === 0 || i === data.length - 1 ? `<text x="${pts[i][0].toFixed(1)}" y="${h - 7}" text-anchor="middle">${esc(d.label)}</text>` : '')).join('');
  const [lx, ly] = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(t('chart'))}" dir="ltr">${gridLines(w, h, pad, nice, fmt)}
    <path class="area" d="${area}"/><path class="line" data-draw d="${path}"/><circle class="dot" cx="${lx}" cy="${ly}" r="4"/>${labels}
    <text class="val" x="${Math.min(lx, w - 40)}" y="${Math.max(ly - 9, 10)}" text-anchor="middle">${fmt(data[data.length - 1].value)}</text></svg>`;
}

function hbars(rows, fmt = v => rs(v), tone = '') {
  const max = Math.max(1, ...rows.map(r => r.value));
  return `<div class="hbars">${rows.map(r => `<div class="hbar"><span class="nm">${r.label}</span><span class="vv">${fmt(r.value)}${r.sub ? ` <span class="muted">${r.sub}</span>` : ''}</span>
    <div class="bar ${r.tone || tone}"><i data-w="${((r.value / max) * 100).toFixed(1)}"></i></div></div>`).join('')}</div>`;
}

// ---------- report data ----------
function salesInDays(days) {
  const from = dayStartOf(addDays(todayKey(), -(days - 1)));
  return liveSales().filter(s => s.ts >= from);
}

function dailySeries(days, fn) {
  const out = [];
  for (let i = days - 1; i >= 0; i--) {
    const k = addDays(todayKey(), -i);
    out.push({ key: k, label: fmtDate(dayStartOf(k), { day: 'numeric', month: 'numeric' }), value: fn(k), hl: i === 0 });
  }
  return out;
}

function weeklySeries(weeks) {
  const out = [];
  for (let w = weeks - 1; w >= 0; w--) {
    const end = addDays(todayKey(), -w * 7);
    let v = 0;
    for (let d = 0; d < 7; d++) v += sum(dayRecs(addDays(end, -d)).sales.filter(s => !s.voided), s => s.totalP);
    out.push({ label: fmtDate(dayStartOf(addDays(end, -6)), { day: 'numeric', month: 'short' }), value: v, hl: w === 0 });
  }
  return out;
}

function itemStats(days) {
  const m = new Map();
  salesInDays(days).forEach(s => s.lines.forEach(l => {
    const x = m.get(l.itemId) || { it: itemById(l.itemId), qty: 0, rev: 0, cost: 0, n: 0 };
    x.qty += l.qty;
    x.rev += l.amountP;
    x.cost += l.costP;
    x.n++;
    m.set(l.itemId, x);
  }));
  return [...m.values()].filter(x => x.it);
}

function receivableTrend(days = 60) {
  const entries = S.ledger.slice().sort((a, b) => a.ts - b.ts);
  let bal = 0;
  let i = 0;
  return dailySeries(days, k => {
    const end = dayStartOf(k) + DAY;
    while (i < entries.length && entries[i].ts < end) {
      bal += signOf(entries[i]) * entries[i].amountP;
      i++;
    }
    return bal;
  });
}

function monthPL(mk) {
  const inM = ts => mkey(ts) === mk;
  const sales = liveSales().filter(s => inM(s.ts));
  const adj = S.adjust.filter(a => inM(a.ts));
  const ex = S.cash.filter(e => e.kind === 'expense' && inM(e.ts));
  const p = {
    bills: sales.length,
    gross: sum(sales, s => s.subP),
    disc: sum(sales, s => s.discP),
    round: sum(sales, s => s.roundP),
    net: sum(sales, s => s.totalP),
    cogs: sum(sales, saleCost),
    losses: -sum(adj.filter(a => a.reason === 'damage' || a.reason === 'expiry'), a => a.costP),
    countDiff: -sum(adj.filter(a => a.reason === 'count'), a => a.costP),
    ownUse: -sum(adj.filter(a => a.reason === 'own'), a => a.costP),
    byCat: EXPENSE_CATS.map(c => [c, sum(ex.filter(e => e.cat === c), e => e.amountP)]).filter(([, v]) => v),
    opex: sum(ex, e => e.amountP),
    bad: sum(S.ledger.filter(e => e.type === 'writeoff' && inM(e.ts)), e => e.amountP),
    cashDiff: sum(S.closes.filter(c => c.date.startsWith(mk)), c => c.diffP),
    drawings: sum(S.cash.filter(e => e.kind === 'drawing' && inM(e.ts)), e => e.amountP),
  };
  p.gp = p.net - p.cogs;
  p.netProfit = p.gp - p.losses - p.countDiff - p.opex - p.bad + p.cashDiff;
  return p;
}

const monthsWithData = () => [...new Set(S.sales.map(s => mkey(s.ts)))].sort().reverse();

// ---------- global search palette (Ctrl+K or /) ----------
let palSel = 0;
let palHits = [];

function searchAll(q) {
  const s = q.trim().toLowerCase();
  const hits = [];
  const add = (group, icon, label, sub, href) => hits.push({ group, icon, label, sub, href });
  NAV_ORDER.filter(r => isOwner() || ROUTES[r].helper).forEach(r => (!s || t('nav_' + r).toLowerCase().includes(s) || r.includes(s)) && add('pages', ROUTES[r].icon, t('nav_' + r), '', '#' + r));
  if (!s) return hits.slice(0, 8);
  if (!isOwner()) return hits;
  searchItems(q, 6).forEach(it => add('items', 'box', nm(it), `${qtyStr(it.unit, it.stock)} · ${rs(it.sellP)}`, '#item/' + it.id));
  S.customers.filter(c => c.name.toLowerCase().includes(s) || (c.ur || '').includes(q.trim()) || (c.phone || '').includes(s)).slice(0, 5).forEach(c => add('customers', 'user', nm(c), rs(c.balanceP), '#cust/' + c.id));
  S.suppliers.filter(x => x.name.toLowerCase().includes(s) || (x.ur || '').includes(q.trim())).slice(0, 3).forEach(x => add('suppliers', 'truck', nm(x), rs(x.balanceP), '#sup/' + x.id));
  if (/^\d+$/.test(s)) S.sales.filter(x => String(x.no).startsWith(s)).slice(-5).reverse().forEach(x => add('bills', 'receipt', '#' + x.no, `${fmtDT(x.ts)} · ${rs(x.totalP)}`, 'bill:' + x.id));
  return hits;
}

function drawPalette() {
  palHits = searchAll($('#palQ').value);
  palSel = clamp(palSel, 0, Math.max(0, palHits.length - 1));
  let group = '';
  $('#palRes').innerHTML = palHits.map((h, i) => {
    const head = h.group !== group ? `<div class="grp">${t('sg_' + (group = h.group))}</div>` : '';
    return `${head}<div class="lrow ${i === palSel ? 'sel' : ''}" role="option" aria-selected="${i === palSel}" data-i="${i}"><div class="av">${ic(h.icon)}</div><div class="main"><b>${esc(h.label)}</b><div class="sub">${esc(h.sub)}</div></div></div>`;
  }).join('') || emptyHtml('search', t('noMatch'));
  $$('#palRes [data-i]').forEach(el => (el.onclick = () => choosePalette(Number(el.dataset.i))));
  const sel = $('#palRes .sel');
  if (sel) sel.scrollIntoView({ block: 'nearest' });
}

function choosePalette(i) {
  const h = palHits[i];
  if (!h) return;
  closePalette();
  if (h.href.startsWith('bill:')) openReceipt(saleById(h.href.slice(5)));
  else location.hash = h.href;
}

function openPalette() {
  closeModal();
  const p = $('#palette');
  p.innerHTML = `<div class="searchbox">${ic('search')}<input class="inp" id="palQ" type="search" autocomplete="off" placeholder="${t('searchAll')}" aria-label="${t('searchAll')}"></div><div class="res" id="palRes" role="listbox"></div>
    <div class="tiny muted mt">${t('palHint')}</div>`;
  p.classList.add('on');
  $('#scrim').classList.add('on');
  palSel = 0;
  $('#palQ').oninput = () => {
    palSel = 0;
    drawPalette();
  };
  $('#palQ').onkeydown = e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      palSel += e.key === 'ArrowDown' ? 1 : -1;
      drawPalette();
    } else if (e.key === 'Enter') choosePalette(palSel);
  };
  drawPalette();
  setTimeout(() => $('#palQ').focus(), 30);
}

function closePalette() {
  if (!$('#palette').classList.contains('on')) return;
  $('#palette').classList.remove('on');
  if (!modalOpen()) $('#scrim').classList.remove('on');
}

function exportJson() {
  const data = { app: 'karyana-khata', version: 1, exportedAt: new Date().toISOString(), data: { meta: S.meta, settings: S.settings } };
  COLLECTIONS.forEach(k => (data.data[k] = S[k]));
  downloadFile(`karyana-khata-backup-${todayKey()}.json`, JSON.stringify(data));
  S.settings.lastBackup = Date.now();
  logAct('act_export', { what: 'JSON' }, 'backup');
  touch('settings', 'activity');
  toast(t('exported'), 'ok');
}

function importJson(text) {
  // TODO(student): sync the books to a cloud store (Firebase/Supabase) with per-device change logs and merge conflicts by document id instead of replacing everything.
  let obj;
  try {
    obj = JSON.parse(text);
  } catch {
    return toast(t('err_badFile'), 'bad');
  }
  const d = obj && obj.app === 'karyana-khata' && obj.data;
  if (!d || !d.meta || !COLLECTIONS.every(k => Array.isArray(d[k] || []))) return toast(t('err_badFile'), 'bad');
  askConfirm(t('importAsk', { n: (d.sales || []).length, date: obj.exportedAt ? fmtDT(Date.parse(obj.exportedAt)) : '—' }), { danger: true, okText: t('import') }).then(ok => {
    if (!ok) return;
    S = { meta: d.meta, settings: { ...DEFAULT_SETTINGS, ...d.settings } };
    COLLECTIONS.forEach(k => (S[k] = (d[k] || []).map(x => (k === 'sales' ? unpackSale(x) : x))));
    memo.clear();
    logAct('act_import', {}, 'backup');
    persist();
    applyPrefs();
    const a = auditBooks();
    toast(a.ok ? t('importOk') : t('importAuditBad'), a.ok ? 'ok' : 'bad');
    go('home');
  });
}

function exportSalesCsv() {
  const rows = [['Bill', 'Date', 'Cashier', 'Method', 'Customer', 'Item', 'Qty', 'Unit', 'Price (Rs/unit)', 'Amount (Rs)', 'Cost (Rs)', 'Bill total (Rs)', 'Voided']];
  S.sales.forEach(s => s.lines.forEach(l => {
    const it = itemById(l.itemId);
    rows.push([s.no, fmtISO(s.ts), s.by, s.method, s.custId ? custById(s.custId).name : '', it.name, qtyInput(it.unit, l.qty), it.unit, csvRs(l.priceP), csvRs(l.amountP), csvRs(l.costP), csvRs(s.totalP), s.voided ? 'yes' : '']);
  }));
  downloadFile(`sales-${todayKey()}.csv`, toCsv(rows), 'text/csv;charset=utf-8');
}

function exportStockCsv() {
  const rows = [['Item', 'Urdu', 'Category', 'Unit', 'Stock', 'Avg cost (Rs/unit)', 'Value at cost (Rs)', 'Sell price (Rs/unit)', 'Reorder level', 'Oldest expiry', 'Barcode', 'Supplier']];
  S.items.forEach(it => rows.push([it.name, it.ur, catById(it.cat).en, it.unit, qtyInput(it.unit, it.stock), (avgCostP(it) / 100).toFixed(2), csvRs(it.poolP), csvRs(it.sellP), qtyInput(it.unit, it.reorder), it.expiry, it.barcode, supById(it.supId) ? supById(it.supId).name : '']));
  downloadFile(`stock-${todayKey()}.csv`, toCsv(rows), 'text/csv;charset=utf-8');
}

function exportCashCsv() {
  const rows = [['Date', 'Time', 'Type', 'In (Rs)', 'Out (Rs)', 'Opening (Rs)', 'Expected close (Rs)', 'Counted (Rs)', 'Difference (Rs)']];
  for (let k = S.meta.startKey; k <= todayKey(); k = addDays(k, 1)) {
    const d = daySummary(k);
    const c = closeOf(k);
    d.moves.forEach(m => rows.push([k, fmtISO(m.ts).slice(11), m.type, m.amountP > 0 ? csvRs(m.amountP) : '', m.amountP < 0 ? csvRs(-m.amountP) : '', '', '', '', '']));
    rows.push([k, '', 'DAY TOTAL', csvRs(d.inP), csvRs(d.outP), csvRs(d.openingP), csvRs(d.expectedP), c ? csvRs(c.countedP) : '', c ? csvRs(c.diffP) : '']);
  }
  downloadFile(`cash-book-${todayKey()}.csv`, toCsv(rows), 'text/csv;charset=utf-8');
}

// ---------- roles: owner PIN (salted SHA-256) and a sales-only helper mode ----------
let pinFails = 0;
let pinLockUntil = 0;

function setPin(pin) {
  const salt = Array.from(crypto.getRandomValues(new Uint8Array(8)), b => b.toString(16).padStart(2, '0')).join('');
  S.settings.pinSalt = salt;
  S.settings.pinHash = sha256Hex(salt + ':' + pin);
}
const checkPin = pin => sha256Hex(S.settings.pinSalt + ':' + pin) === S.settings.pinHash;

function pinKeysHtml() {
  return ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'clr', '0', 'del'].map(k => `<button type="button" data-pk="${k}" aria-label="${k === 'del' ? t('backspace') : k === 'clr' ? t('clear') : k}">${k === 'del' ? ic('backspace') : k === 'clr' ? ic('x') : k}</button>`).join('');
}

function openPin({ title, sub, onOk, onCancel = null }) {
  let entry = '';
  const sh = openModal(`${sheetHead(title, 'lock')}<p class="small muted" style="text-align:center">${sub}</p>
    <div class="pinpad"><div class="pindots" id="pinDots" aria-live="polite">${'<i></i>'.repeat(4)}</div><div class="keypad">${pinKeysHtml()}</div>
    <div class="err hidden" id="pinErr" style="text-align:center"></div>${S.settings.demo ? `<p class="hint" style="text-align:center">${t('demoPinHint', { pin: DEMO_PIN })}</p>` : ''}</div>`, { onClose: onCancel });
  const draw = () => $$('#pinDots i', sh).forEach((d, i) => d.classList.toggle('on', i < entry.length));
  const fail = msg => {
    $('#pinErr', sh).textContent = msg;
    $('#pinErr', sh).classList.remove('hidden');
    $('#pinDots', sh).classList.remove('shake');
    void $('#pinDots', sh).offsetWidth;
    $('#pinDots', sh).classList.add('shake');
  };
  const submit = () => {
    if (Date.now() < pinLockUntil) return fail(t('pinLocked', { s: Math.ceil((pinLockUntil - Date.now()) / 1000) }));
    if (checkPin(entry)) {
      pinFails = 0;
      modalOnClose = null;
      closeModal();
      return onOk();
    }
    entry = '';
    draw();
    if (++pinFails >= 5) {
      pinLockUntil = Date.now() + 30000;
      pinFails = 0;
    }
    fail(t('pinWrong'));
  };
  const press = k => {
    if (k === 'del') entry = entry.slice(0, -1);
    else if (k === 'clr') entry = '';
    else if (entry.length < 4) entry += k;
    draw();
    if (entry.length === 4) setTimeout(submit, 120);
  };
  $$('[data-pk]', sh).forEach(b => (b.onclick = () => press(b.dataset.pk)));
  sh.onkeydown = e => {
    if (/^\d$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace') press('del');
  };
}

function startTour() {

  tourStep = -1;

function placeTip(rect) {
  const tip = $('#tourTip');
  const spot = $('#tourSpot');
  const p = 6;
  Object.assign(spot.style, { left: rect.left - p + 'px', top: rect.top - p + 'px', width: rect.width + p * 2 + 'px', height: rect.height + p * 2 + 'px' });
  const tw = Math.min(340, window.innerWidth - 32);
  const below = rect.bottom + 16;
  const top = below + tip.offsetHeight + 12 < window.innerHeight ? below : Math.max(12, rect.top - 16 - tip.offsetHeight);
  const left = clamp(rect.left + rect.width / 2 - tw / 2, 16, window.innerWidth - tw - 16);
  Object.assign(tip.style, { top: top + 'px', left: left + 'px' });
}

function showTourStep() {
  const step = TOUR[tourStep];
  if (!step) return endTour();
  const el = visibleEl(step.sel);
  if (!el) {
    tourStep++;
    return showTourStep();
  }
  el.scrollIntoView({ block: 'center', behavior: 'instant' });
  const last = tourStep === TOUR.length - 1;
  $('#tourTip').innerHTML = `<span class="tag">${t('stepXofY', { x: tourStep + 1, y: TOUR.length })}</span><h4>${t(step.k + 't')}</h4><p>${t(step.k + 'b')}</p>
    <div class="between"><div class="dots">${TOUR.map((_, i) => `<i class="${i === tourStep ? 'on' : ''}"></i>`).join('')}</div>
    <div class="row"><button type="button" class="btn ghost sm" id="tourSkip">${t('skip')}</button>${tourStep ? `<button type="button" class="btn ghost sm icon" id="tourBack" aria-label="${t('back')}">${ic('chevron-left', 'flip')}</button>` : ''}
    <button type="button" class="btn sm" id="tourNext">${last ? t('done') : t('next')} ${ic(last ? 'check' : 'chevron-right', last ? '' : 'flip')}</button></div></div>`;
  placeTip(el.getBoundingClientRect());
  $('#tourSkip').onclick = endTour;
  $('#tourNext').onclick = () => {
    tourStep++;
    showTourStep();
  };
  if ($('#tourBack')) $('#tourBack').onclick = () => {
    tourStep--;
    showTourStep();
  };
  $('#tourNext').focus({ preventScroll: true });
}

const KEY_PAGES = ['home', 'sale', 'stock', 'udhaar', 'suppliers', 'cash', 'reports', 'bills'];

function openShortcuts() {
  const row = (keys, k) => `<div class="setrow"><span>${t(k)}</span><span class="row">${keys.map(x => `<span class="kbd">${x}</span>`).join('')}</span></div>`;
  openModal(`${sheetHead(t('shortcuts'), 'keyboard')}
    ${row(['N', 'F2'], 'ks_sale')}${row(['/', 'Ctrl K'], 'ks_search')}${row(['1', '…', '8'], 'ks_pages')}${row(['L'], 'ks_lang')}${row(['?'], 'ks_help')}
    ${row(['Enter'], 'ks_enter')}${row(['+', '−'], 'ks_plus')}${row(['F9', 'Ctrl Enter'], 'ks_pay')}${row(['Esc'], 'ks_close')}`);
}

function lastCartLine() {
  return cart && cart.lines.length ? cart.lines[cart.lines.length - 1] : null;
}

function onKey(e) {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = ['input', 'textarea', 'select'].includes(tag);
  if (e.key === 'Escape') {
    if (tourStep >= 0) return endTour();
    if ($('#palette').classList.contains('on')) return closePalette();
    return closeModal();
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    return openPalette();
  }
  if (curRoute === 'sale' && !modalOpen() && (e.key === 'F9' || (e.ctrlKey && e.key === 'Enter'))) {
    e.preventDefault();
    return openCheckout();
  }
  if (e.key === 'F2') {
    e.preventDefault();
    return go('sale');
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || modalOpen() || tourStep >= 0) return;
  if (curRoute === 'sale' && (e.key === '+' || e.key === '-') && lastCartLine()) {
    const l = lastCartLine();
    const it = itemById(l.itemId);
    return addToCart(it.id, Math.max(0, l.qty + (e.key === '+' ? 1 : -1) * stepFor(it)), true);
  }
  if (e.key === '?') return openShortcuts();
  if (e.key === '/') {
    e.preventDefault();
    return openPalette();
  }
  if (e.key === 'n' || e.key === 'N') return go('sale');
  if (e.key === 'l' || e.key === 'L') return setLang(lang === 'ur' ? 'en' : 'ur');
  if (/^[1-8]$/.test(e.key)) go(KEY_PAGES[Number(e.key) - 1]);
}

function go(path) {
  if (location.hash.slice(1) === path) route();
  else location.hash = path;
}

function route() {
  const [name, ...rest] = (location.hash.slice(1) || 'home').split('/');
  const r = ROUTES[name] ? name : 'home';
  const arg = decodeURIComponent(rest.join('/'));
  if (!isOwner() && !ROUTES[r].helper) {
    history.replaceState(null, '', '#sale');
    renderRoute('sale', '');
    requireOwner(() => go(name + (arg ? '/' + arg : '')));
    return;
  }
  renderRoute(r, arg);
}

  document.title = `${t('nav_' + key)} — ${t('appName')} | FYP Template`;
  renderNav();
  updateBadges();
  renderDayBar();
  if (!same) {
    window.scrollTo(0, 0);
    animateIn($('#view'));

}

  $('#skipLink').textContent = t('skipToContent');
  $('#spineFoot').textContent = t(s.demo ? 'spineFoot' : 'spineFootOwn');
  $('meta[name="theme-color"]').content = s.theme === 'night' ? '#430d0d' : '#7d1b1b';
}

function setLang(l) {
  lang = l;
  store.set('lang', l);
  memo.clear();
  applyPrefs();
  if (tourStep >= 0) showTourStep();
  rerender();
}

// New bars start at width 0 and grow to data-w whenever a view or sheet is (re)drawn.
function watchBars() {
  const grow = () => requestAnimationFrame(() => $$('.bar > i[data-w], .ageing > i[data-w]').forEach(b => {
    if (!b.style.width) b.style.width = b.dataset.w + '%';
  }));
  const mo = new MutationObserver(grow);
  mo.observe($('#view'), { childList: true, subtree: true });
  mo.observe($('#sheet'), { childList: true, subtree: true });
}

function bindShell() {
  $('#searchBtn').onclick = openPalette;
  $('#bellBtn').onclick = () => go('alerts');
  $('#roleBtn').onclick = onRoleButton;
  $('#langBtn').onclick = () => setLang(lang === 'ur' ? 'en' : 'ur');
  $('#scrim').onclick = () => {
    closePalette();
    closeModal();
  };
  $('#modal').addEventListener('click', e => e.target === $('#modal') && closeModal());
  document.addEventListener('keydown', onKey);
  window.addEventListener('hashchange', route);
}

function boot() {
  S = loadState();
  if (!S) seedShop();
  memo.clear();
  cart = store.get('cart', null) || emptyCart();
  applyPrefs();
  bindShell();
  watchBars();
  const fresh = !location.hash && !S.settings.tourDone;
  if (!bootPinGate()) route();
  if (fresh && isOwner()) setTimeout(startTour, 900);
}

boot();
</script>
</body>
</html>
