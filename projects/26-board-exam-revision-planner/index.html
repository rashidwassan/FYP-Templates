<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board Exam Revision Planner</title>
<meta name="description" content="Week-by-week revision planner for Matric and FSc board exams: weightage heatmaps, an interleaving planner, Pomodoro timer, spaced-repetition reviews, past-paper tracking and a readiness score. Single-file FYP template.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens: indigo / violet on warm off-white ---------- */
:root{
  --bg:#faf9ff; --surface:#ffffff; --surface-2:#f3f2fb; --ink:#1e1b3a; --muted:#6b6a85; --line:#e6e4f2;
  --p:#4f46e5; --p2:#7c3aed; --p-soft:#eef2ff; --p-deep:#3730a3; --grad:linear-gradient(135deg,#4f46e5,#7c3aed);
  --ok:#0f9d6e; --ok-soft:#e3f6ee; --warn:#d97706; --warn-soft:#fdf1dc; --bad:#dc2626; --bad-soft:#fde8e8;
  --radius:16px; --radius-sm:10px; --shadow:0 12px 32px -20px rgba(30,27,58,.35);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --font-ur:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;
  --ease:cubic-bezier(.2,.8,.2,1); --dur:.35s;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.01em}
a{color:var(--p)}
.muted{color:var(--muted)} .hidden{display:none!important} .sm{font-size:.85rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ur,[lang=ur]{font-family:var(--font-ur);line-height:1.9}
html[lang=ur] .i18n{font-family:var(--font-ur);line-height:1.9;font-size:1.05em}
.ic{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px;border-radius:6px}

/* ---------- Motion kit ---------- */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
.enter{animation:fadeUp var(--dur) var(--ease) both}
.stagger>*{animation:fadeUp .45s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.btn{transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s,border-color .15s}
.btn:hover{transform:translateY(-1px)} .btn:active{transform:translateY(0) scale(.98)}
.card,.tile,.sess{transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.fill,.bar>i{transition:width .6s var(--ease)}
.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite}

/* ---------- App bar ---------- */
.appbar{position:sticky;top:0;z-index:30;background:rgba(250,249,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.appbar .row1{display:flex;align-items:center;gap:14px;padding:10px 20px;max-width:1440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}
.brand .mark{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 8px 18px -8px rgba(79,70,229,.7)}
.brand .mark svg{width:22px;height:22px}
.brand h1{font-size:1.05rem;font-weight:800;white-space:nowrap}
.brand .sub{font-size:.72rem;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.countdown{display:inline-flex;align-items:center;gap:8px;background:var(--grad);color:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:.9rem;box-shadow:0 10px 24px -12px rgba(79,70,229,.8);white-space:nowrap}
.countdown b{font-size:1.1rem;font-variant-numeric:tabular-nums}
.appbar .spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;color:var(--ink);position:relative}
.iconbtn:hover{border-color:#c7d2fe;background:var(--p-soft)}
.iconbtn .badge,.seg .badge{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;font-size:.68rem;font-weight:800;min-width:18px;height:18px;border-radius:999px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.langbtn{height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:700}
.langbtn .ur{font-size:1rem;line-height:1}
.row2{max-width:1440px;margin:0 auto;padding:0 20px 10px;display:flex;align-items:center;gap:12px}
.segwrap{overflow-x:auto;scrollbar-width:none;flex:1}
.segwrap::-webkit-scrollbar{display:none}
.seg{display:inline-flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:2px;border:1px solid var(--line)}
.seg a{position:relative;display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.9rem;white-space:nowrap;min-height:40px;transition:background .2s,color .2s,box-shadow .2s}
.seg a:hover{color:var(--ink)}
.seg a.on{background:var(--surface);color:var(--p-deep);box-shadow:0 4px 12px -6px rgba(30,27,58,.3)}
.seg .badge{top:2px;right:2px}

/* ---------- Layout ---------- */
main{max-width:1440px;margin:0 auto;padding:18px 20px 60px}
.plan-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:0 1px 2px rgba(30,27,58,.04)}
.panel h2{font-size:1.05rem;display:flex;align-items:center;gap:8px}
.panel h2 .ic{color:var(--p)}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;gap:12px;align-items:center}
.kpi .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--p-soft);color:var(--p);flex:none}
.kpi .ico .ic{width:1.3em;height:1.3em}
.kpi .v{font-size:1.45rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.78rem;color:var(--muted);font-weight:600}
.kpi.ok .ico{background:var(--ok-soft);color:var(--ok)} .kpi.warn .ico{background:var(--warn-soft);color:var(--warn)} .kpi.vio .ico{background:#f3e8ff;color:var(--p2)}

/* ---------- Buttons & forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:.9rem;color:var(--ink)}
.btn:hover{border-color:#c7d2fe;background:var(--p-soft)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 10px 22px -12px rgba(79,70,229,.9)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ok{background:var(--ok);color:#fff;border-color:transparent} .btn.danger{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)} .btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{min-height:34px;padding:0 10px;font-size:.82rem;border-radius:10px}
.btn.icon{width:40px;padding:0} .btn.icon.sm{width:34px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.78rem;font-weight:700;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;min-height:40px;border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
input[type=range]{width:100%;accent-color:var(--p);min-height:40px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px} .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.8rem;font-weight:600;cursor:pointer;min-height:32px;transition:background .15s,border-color .15s}
.chip.on{background:var(--p-soft);border-color:#c7d2fe;color:var(--p-deep)}
.chip.static{cursor:default;background:var(--surface-2)}
.dayoffs{display:flex;gap:6px;flex-wrap:wrap}
.dayoffs .chip{min-width:44px;justify-content:center}

/* ---------- Week grid ---------- */
.weekbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.weekbar .title{font-weight:800;font-size:1.05rem;margin:0 6px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--surface-2);border:1px dashed var(--line);border-radius:14px;min-height:260px;padding:8px;display:flex;flex-direction:column;gap:7px;transition:background .15s,border-color .15s;min-width:0}
.day.today{background:var(--p-soft);border-color:#c7d2fe}
.day.off{background:repeating-linear-gradient(135deg,var(--surface-2) 0 8px,#eceaf6 8px 16px)}
.day.past{opacity:.78}
.day.over{background:#e0e7ff;border-color:var(--p);border-style:solid}
.day .dh{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:2px 4px 6px}
.day .dh b{font-size:.9rem} .day.today .dh b{color:var(--p-deep)}
.day .dh .d{font-size:.75rem;color:var(--muted);font-weight:600}
.day .mins{font-size:.72rem;color:var(--muted);font-weight:700;text-align:center;padding-top:4px;margin-top:auto}
.sess{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sc,var(--p));border-radius:10px;padding:8px 9px;cursor:grab;position:relative;user-select:none;font-size:.82rem;line-height:1.3}
.sess:hover{transform:translateY(-2px);box-shadow:0 10px 20px -14px rgba(30,27,58,.5);border-color:#c7d2fe;border-left-color:var(--sc,var(--p))}
.sess:active{cursor:grabbing}
.sess.dragging{opacity:.45}
.sess .s{font-size:.7rem;font-weight:800;color:var(--sc,var(--p));text-transform:uppercase;letter-spacing:.03em;display:flex;justify-content:space-between;gap:4px}
.sess .c{font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin:2px 0}
.sess .m{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:4px;justify-content:space-between}
.sess.done{background:var(--ok-soft);border-color:#c6ebd9} .sess.done .c{text-decoration:line-through;color:var(--muted)}
.sess.skipped{opacity:.5} .sess.partial{background:var(--warn-soft)}
.sess.revision{border-left-style:double;border-left-width:6px}
.sess .tp{font-size:.62rem;font-weight:800;padding:1px 6px;border-radius:999px;background:var(--surface-2);color:var(--muted);text-transform:uppercase}
.sess .tp.extra{background:#fdf1dc;color:var(--warn)} .sess .tp.revision{background:#f3e8ff;color:var(--p2)}
.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:.9rem}
.empty .ic{width:2em;height:2em;color:#c7d2fe;display:block;margin:0 auto 8px}

/* ---------- Today panel & timer ---------- */
.today .tdate{font-size:.8rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.timer{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0 6px}
.ring{position:relative;width:180px;height:180px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .bg{stroke:var(--surface-2)}
.ring .fg{stroke:url(#gradRing);transition:stroke-dashoffset .9s linear}
.ring .fg.brk{stroke:var(--ok)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .lbl b{font-size:2.1rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;display:block;line-height:1}
.ring .lbl span{font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.tctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tsess{font-size:.85rem;text-align:center;color:var(--muted);min-height:1.3em}
.tlist{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.trow .dot{width:10px;height:10px;border-radius:50%;background:var(--sc,var(--p));flex:none}
.trow .t{flex:1;min-width:0} .trow .t b{display:block;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .t span{font-size:.75rem;color:var(--muted)}
.trow.done{opacity:.6}
.miniring{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;background:var(--surface-2);margin-top:12px}
.miniring svg{width:54px;height:54px;transform:rotate(-90deg);flex:none}
.miniring circle{fill:none;stroke-width:6} .miniring .bg{stroke:#e2e0f0} .miniring .fg{stroke:var(--p);transition:stroke-dashoffset .9s var(--ease)}

/* ---------- Subjects, heatmap, rings ---------- */
.rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-bottom:16px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 8px;text-align:center}
.rcard svg{width:92px;height:92px;transform:rotate(-90deg)}
.rcard circle{fill:none;stroke-width:9} .rcard .bg{stroke:var(--surface-2)} .rcard .fg{transition:stroke-dashoffset 1s var(--ease)}
.rcard .wrap{position:relative;display:inline-block}
.rcard .num{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:1.1rem;font-variant-numeric:tabular-nums}
.rcard .nm{font-size:.8rem;font-weight:700;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard.all{background:var(--grad);color:#fff;border-color:transparent} .rcard.all .bg{stroke:rgba(255,255,255,.25)} .rcard.all .fg{stroke:#fff}
.subj{margin-bottom:14px}
.subj .sh{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.subj .sh .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;background:var(--sc)}
.subj .sh h3{font-size:1rem;flex:1;min-width:120px}
.bar{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;width:100%}
.bar>i{display:block;height:100%;background:var(--sc,var(--p));border-radius:999px;width:0}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.tile{border-radius:10px;padding:8px 9px;cursor:pointer;border:1px solid transparent;min-height:64px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;color:var(--ink);text-align:left;background:var(--surface-2);font:inherit}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tile.dark{color:#fff} .tile.dark .muted{color:rgba(255,255,255,.75)}
.tile .n{font-size:.78rem;font-weight:600;line-height:1.25}
.tile .f{display:flex;justify-content:space-between;align-items:center;font-size:.7rem;font-weight:700}
.tile .ms{display:flex;gap:2px} .tile .ms i{width:7px;height:7px;border-radius:2px;background:currentColor;opacity:.25} .tile .ms i.on{opacity:1}
.legend{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);font-weight:600}
.legend .sw{width:60px;height:8px;border-radius:4px;background:linear-gradient(90deg,#eef2ff,#4f46e5)}
.whatif{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.whatif .big{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}

/* ---------- Lists, charts, tables ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.row .t{flex:1;min-width:0} .row .t b{display:block} .row .t span{font-size:.8rem;color:var(--muted)}
.row.overdue{border-color:#fecaca;background:#fff7f7}
.rate{display:flex;gap:4px}
.rate button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:800;cursor:pointer;transition:background .15s,transform .15s}
.rate button:hover{background:var(--p-soft);border-color:#c7d2fe;transform:translateY(-1px)}
.rate button.on{background:var(--grad);color:#fff;border-color:transparent}
.chart{position:relative;width:100%}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:.75rem;padding:6px 9px;border-radius:8px;transform:translate(-50%,-115%);white-space:nowrap;display:none}
.hbar{display:grid;grid-template-columns:minmax(90px,160px) 1fr auto;gap:8px;align-items:center;font-size:.82rem;padding:3px 0}
.hbar .bar{height:10px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)} th{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tag{display:inline-block;font-size:.68rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--p-soft);color:var(--p-deep);text-transform:uppercase;letter-spacing:.03em;vertical-align:middle}
.todo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.todo h4{font-size:.92rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start}
.streak{display:flex;gap:4px;flex-wrap:wrap} .streak i{width:14px;height:14px;border-radius:4px;background:var(--surface-2)} .streak i.on{background:var(--p)} .streak i.hi{background:var(--p2)}

/* ---------- Modal, toasts ---------- */
.scrim{position:fixed;inset:0;background:rgba(30,27,58,.45);z-index:60;display:none;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s}
.scrim.open{display:flex}
.modal{background:var(--surface);border-radius:20px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:20px;box-shadow:0 40px 80px -30px rgba(30,27,58,.6);animation:pop .25s var(--ease)}
.modal .mh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.modal h2{font-size:1.15rem}
.modal .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:fadeUp .3s var(--ease),toastOut .4s ease 2.9s both;display:flex;align-items:center;gap:8px}
.toast.ok{background:var(--ok)} .toast.bad{background:var(--bad)}

/* ---------- Responsive ---------- */
@media (max-width:1100px){.plan-layout{grid-template-columns:minmax(0,1fr) 300px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media (max-width:860px){
  .appbar .row1{padding:10px 16px;gap:10px} .row2{padding:0 16px 10px} main{padding:14px 16px 70px}
  .brand h1{font-size:.95rem} .brand .sub{display:none} .countdown{padding:6px 11px;font-size:.8rem} .countdown b{font-size:1rem}
  .plan-layout{grid-template-columns:1fr} .today{order:-1}
  .week{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding-bottom:8px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:thin}
  .day{flex:0 0 82vw;scroll-snap-align:start;min-height:200px}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const subjById = id => SUBJ[id] || subjects()[0];
const chapters = () => subjects().flatMap(s => s.ch.map(c => ({ ...c, subj: s.id, sname: s.name, color: s.color })));
const chById = id => { const sid = id.split(':')[0], s = SUBJ[sid]; if (!s) return null; const c = s.ch.find(x => x.id === id); return c ? { ...c, subj: sid, sname: s.name, color: s.color } : null; };
const W = c => overrides[c.id]?.w ?? c.w;                 // weightage % (editable)
const D = c => overrides[c.id]?.d ?? c.d;                 // difficulty 1–5 (editable)
const M = c => mastery[c.id] ?? 0;                        // mastery 0–5
const setMastery = (id, v) => { mastery[id] = clamp(r1(v), 0, 5); };

const sessLen = () => settings.pomo * 2;                  // one planner session = 2 pomodoros
const isWeekend = d => [0, 6].includes(dow(d));
const capacity = d => settings.daysOff.includes(dow(d)) ? 0 : (isWeekend(d) ? settings.hrsWe : settings.hrsWd) * 60;

// ---------- planner algorithm ----------
// priority = weightage × difficulty × (1 − mastery/5) × weak-chapter boost from logged papers
const priority = c => W(c) * D(c) * (1 - M(c) / 5) * (1 + .25 * weakCount(c.id));
function generatePlan() {
  const today = todayIso(), exam = settings.examDate, total = daysBetween(today, exam), len = sessLen();
  const history = plan.sessions.filter(s => s.status !== 'todo' || s.date < today);   // keep what already happened
  const out = [];
  if (total > 0) {
    const days = Array.from({ length: total }, (_, i) => { const d = addDays(today, i); return { date: d, slots: Math.floor(capacity(d) / len), revision: total - i <= 7 }; });
    const chs = chapters(), studyDays = days.filter(d => !d.revision), slots = studyDays.reduce((a, d) => a + d.slots, 0);
    const pr = chs.map(c => ({ c, p: priority(c) })), sumP = pr.reduce((a, x) => a + x.p, 0) || 1;
    pr.forEach(x => x.n = x.p > 0 ? Math.max(1, Math.round(slots * x.p / sumP)) : 0);
    // per-subject queues; chapters interleaved round-robin so heavy chapters recur instead of being crammed together
    const queues = Object.fromEntries(subjects().map(s => [s.id, []])), maxN = Math.max(0, ...pr.map(x => x.n));
    pr.sort((a, b) => b.p - a.p);
    for (let r = 0; r < maxN; r++) pr.forEach(x => { if (x.n > r) queues[x.c.subj].push(x.c); });
    const weakSeen = new Set();
    const mk = (date, c, type) => ({ id: uid(), date, subj: c.subj, ch: c.id, mins: len, type, status: 'todo', conf: null });
    studyDays.forEach(d => {
      const used = {};
      for (let k = 0; k < d.slots; k++) {
        const cands = Object.keys(queues).filter(id => queues[id].length && (used[id] || 0) < 2);   // ≤ 2 sessions of one subject per day
        if (!cands.length) break;
        cands.sort((a, b) => queues[b].length - queues[a].length);                               // most remaining demand first → interleaving
        const c = queues[cands[0]].shift(); used[c.subj] = (used[c.subj] || 0) + 1;
        let type = 'study'; if (weakCount(c.id) && !weakSeen.has(c.id)) { type = 'extra'; weakSeen.add(c.id); }   // first session of a paper-flagged weak chapter
        out.push(mk(d.date, c, type));
      }
    });
    // last 7 days: revision only, highest weightage first, still interleaved across subjects
    const rev = [...chs].sort((a, b) => W(b) * (1 - M(b) / 6) - W(a) * (1 - M(a) / 6)); let ri = 0;
    days.filter(d => d.revision).forEach(d => {
      const used = {};
      for (let k = 0; k < d.slots && rev.length; k++) {
        let tries = 0, c; do { c = rev[ri % rev.length]; ri++; tries++; } while ((used[c.subj] || 0) >= 2 && tries < rev.length);
        used[c.subj] = (used[c.subj] || 0) + 1; out.push(mk(d.date, c, 'revision'));
      }
    });
  }
  plan = { generated: Date.now(), sessions: [...history, ...out] };
  saveAll();
  return out.length;
}
const moveSession = (id, date) => { const s = plan.sessions.find(x => x.id === id); if (!s || s.date === date) return false; s.date = date; s.moved = true; saveAll(); return true; };
function completeSession(id, status, conf) {
  const s = plan.sessions.find(x => x.id === id); if (!s) return;
  s.status = status; s.conf = conf ?? null; s.doneAt = todayIso();
  if (status !== 'skipped') {
    log.push({ date: todayIso(), mins: status === 'partial' ? Math.round(s.mins / 2) : s.mins, subj: s.subj, ch: s.ch });
    if (conf) setMastery(s.ch, M(chById(s.ch)) + (conf - M(chById(s.ch))) * .5);
    scheduleReview(s.ch, conf);
  }
  saveAll();
}

// ---------- spaced repetition (SM-2-lite) ----------
// Ladder +1, +3, +7, +14, +30 days. A rating ≤ 2 resets to +1; 3 shortens the next step (×0.8), 4 keeps it (×1.1), 5 lengthens (×1.3).
const LADDER = [1, 3, 7, 14, 30];
function scheduleReview(chId, q) {
  const r = reviews.find(x => x.ch === chId), today = todayIso();
  if (!r) reviews.push({ id: uid(), ch: chId, reps: 0, interval: 1, due: addDays(today, 1), last: today, hist: [] });
  else if (r.due < today && q) rateReview(r.id, q, true);       // an overdue review is cleared by studying the chapter again
}
function rateReview(id, q, silent) {
  const r = reviews.find(x => x.id === id); if (!r) return; const today = todayIso();
  if (q <= 2) { r.reps = 0; r.interval = 1; }
  else { r.reps = Math.min(r.reps + 1, LADDER.length - 1); r.interval = Math.max(1, Math.round(LADDER[r.reps] * (q === 5 ? 1.3 : q === 4 ? 1.1 : .8))); }
  r.due = addDays(today, r.interval); r.last = today; r.hist = [...(r.hist || []), q].slice(-10);
  const c = chById(r.ch); if (c) setMastery(r.ch, M(c) + (q - M(c)) * .3);
  if (!silent) { log.push({ date: today, mins: 5, subj: r.ch.split(':')[0], ch: r.ch, review: true }); saveAll(); }
}
const dueReviews = () => reviews.filter(r => r.due <= todayIso()).sort((a, b) => a.due.localeCompare(b.due));
const overdueCount = () => reviews.filter(r => r.due < todayIso()).length;

// ---------- readiness & stats ----------
const subjReadiness = s => { const tw = s.ch.reduce((a, c) => a + W(c), 0) || 1; return s.ch.reduce((a, c) => a + W(c) * M(c) / 5, 0) / tw * 100; };
const overallReadiness = () => { const ss = subjects(); return ss.reduce((a, s) => a + subjReadiness(s), 0) / ss.length; };
const MIN_PER_UNIT = 25;   // minutes needed per (difficulty × missing mastery point) — the what-if model's single tunable
function projection(hrsPerDay) {
  const today = todayIso(), total = Math.max(0, daysBetween(today, settings.examDate));
  let avail = 0; for (let i = 0; i < total; i++) if (!settings.daysOff.includes(dow(addDays(today, i)))) avail += hrsPerDay * 60;
  const need = chapters().reduce((a, c) => a + (5 - M(c)) * D(c) * MIN_PER_UNIT, 0) || 1;
  const cov = clamp(avail / need, 0, 1), cur = overallReadiness();
  return { coverage: cov * 100, projected: cur + (100 - cur) * cov * .9, need: Math.round(need / 60), avail: Math.round(avail / 60) };
}
function streak() {
  const days = new Set(log.map(l => l.date)); let n = 0, d = todayIso();
  if (!days.has(d)) d = addDays(d, -1);
  while (days.has(d)) { n++; d = addDays(d, -1); }
  return n;
}
const focusedTotal = () => log.reduce((a, l) => a + l.mins, 0);
const sessionsPerSubject = () => { const m = {}; plan.sessions.filter(s => s.status === 'done' || s.status === 'partial').forEach(s => m[s.subj] = (m[s.subj] || 0) + 1); return m; };

// ---------- Pomodoro timer (global so it keeps running across routes) ----------
const timer = { sid: null, mode: 'work', block: 0, blocks: 2, total: 0, remaining: 0, endAt: 0, running: false, iv: null };
const fmtT = s => `${pad2(Math.floor(s / 60))}:${pad2(s % 60)}`;
function beep() { try { const ac = new (window.AudioContext || window.webkitAudioContext)(); const o = ac.createOscillator(), g = ac.createGain(); o.connect(g); g.connect(ac.destination); o.frequency.value = 880; g.gain.setValueAtTime(.0001, ac.currentTime); g.gain.exponentialRampToValueAtTime(.2, ac.currentTime + .02); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + .6); o.start(); o.stop(ac.currentTime + .65); } catch {} }
function askNotify() { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {}); }
function notify(title, body) { try { if ('Notification' in window && Notification.permission === 'granted') new Notification(title, { body }); } catch {} }
// TODO(student): push notifications that fire when the tab is closed need a service worker + a push backend (Web Push / FCM). Hook the reminder schedule here.
function timerStart(sid) { const s = plan.sessions.find(x => x.id === sid); if (!s) return; Object.assign(timer, { sid, mode: 'work', block: 0, blocks: Math.max(1, Math.round(s.mins / settings.pomo)), total: settings.pomo * 60 }); timer.remaining = timer.total; askNotify(); timerResume(); }
function timerResume() { timer.running = true; timer.endAt = Date.now() + timer.remaining * 1000; clearInterval(timer.iv); timer.iv = setInterval(tick, 500); renderTimer(); }
function timerPause() { timer.running = false; timer.remaining = Math.max(0, Math.round((timer.endAt - Date.now()) / 1000)); clearInterval(timer.iv); renderTimer(); }
function timerReset() { clearInterval(timer.iv); Object.assign(timer, { sid: null, mode: 'work', block: 0, total: 0, remaining: 0, running: false }); renderTimer(); }
function tick() { timer.remaining = Math.max(0, Math.round((timer.endAt - Date.now()) / 1000)); renderTimer(); if (timer.remaining <= 0) timerEnd(); }
function timerEnd() {
  clearInterval(timer.iv); timer.running = false; beep();
  const s = plan.sessions.find(x => x.id === timer.sid), c = s && chById(s.ch);
  if (timer.mode === 'work') {
    timer.block++;
    if (timer.block >= timer.blocks) { notify('Session complete', c ? `${c.sname} · ${c.name}` : 'Rate your confidence'); toast('Focus block complete — rate the session', 'ok', 'award'); const sid = timer.sid; timerReset(); openRating(sid, 'done'); return; }
    notify('Break time', `${settings.brk} minutes — stretch, drink water`); toast(`Break: ${settings.brk} min`, 'ok', 'coffee');
    Object.assign(timer, { mode: 'break', total: settings.brk * 60 }); timer.remaining = timer.total; timerResume();
  } else { notify('Back to focus', c ? c.name : ''); toast('Break over — next focus block', '', 'zap'); Object.assign(timer, { mode: 'work', total: settings.pomo * 60 }); timer.remaining = timer.total; timerResume(); }
}

  el.textContent = active ? fmtT(timer.remaining) : fmtT(settings.pomo * 60);
  $('#tMode').textContent = active ? (timer.mode === 'work' ? `${t('work')} ${timer.block + 1}/${timer.blocks}` : t('brk')) : t('work');
  const fg = $('#tRingFg'); fg.classList.toggle('brk', timer.mode === 'break'); ringSet(fg, active ? timer.remaining / timer.total : 1);
  $('#tSess').textContent = c ? `${c.sname} · ${c.name}` : 'Pick a session below to start';
  $('#tPlay').innerHTML = (timer.running ? ic('pause') : ic('play')) + `<span>${timer.running ? t('pause') : active ? t('resume') : t('start')}</span>`;

function scoreChart(el, pts, color) {

  let svg = `<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Score trend">`;
  [0, 25, 50, 75, 100].forEach(g => svg += `<line x1="${P.l}" x2="${Wd - P.r}" y1="${y(g)}" y2="${y(g)}" stroke="#e6e4f2"/><text x="${P.l - 8}" y="${y(g) + 4}" font-size="11" text-anchor="end" fill="#6b6a85">${g}%</text>`);
  svg += `<line x1="${P.l}" x2="${Wd - P.r}" y1="${y(60)}" y2="${y(60)}" stroke="#0f9d6e" stroke-dasharray="4 4" opacity=".6"/><text x="${Wd - P.r}" y="${y(60) - 5}" font-size="10" text-anchor="end" fill="#0f9d6e">target 60%</text>`;
  pts.forEach((p, i) => svg += `<text x="${x(i)}" y="${H - 10}" font-size="11" text-anchor="middle" fill="#6b6a85">${p.year} ${esc(p.board.slice(0, 3))}</text>`);
  svg += `<path id="trend" d="${pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.score).toFixed(1)).join(' ')}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p, i) => svg += `<circle cx="${x(i)}" cy="${y(p.score)}" r="5" fill="#fff" stroke="${color}" stroke-width="3" data-i="${i}" style="cursor:pointer"><title>${p.year} ${esc(p.board)}: ${p.score}%</title></circle>`);
  el.innerHTML = svg + '</svg><div class="tip"></div>';
  const tip = $('.tip', el), svgEl = $('svg', el);
  $$('circle', el).forEach(c => { c.onmouseenter = () => { const p = pts[+c.dataset.i], r = svgEl.getBoundingClientRect(); tip.style.display = 'block'; tip.style.left = (+c.getAttribute('cx') / Wd * r.width) + 'px'; tip.style.top = (+c.getAttribute('cy') / H * r.height) + 'px'; tip.textContent = `${p.year} ${p.board} · ${p.score}% · ${p.weak.length} weak`; }; c.onmouseleave = () => tip.style.display = 'none'; });
  requestAnimationFrame(() => drawPath($('#trend', el)));
}

// ---------- exports: .ics calendar for the next 14 days ----------
function exportIcs() {
  const today = todayIso(), end = addDays(today, 14), stamp = s => s.replace(/[-:]/g, ''), now = new Date();
  const ev = []; const byDay = {}; plan.sessions.filter(s => s.status === 'todo' && s.date >= today && s.date < end).forEach(s => (byDay[s.date] = byDay[s.date] || []).push(s));
  Object.entries(byDay).forEach(([d, list]) => { let [h, m] = (isWeekend(d) ? settings.startWe : settings.startWd).split(':').map(Number); let cur = h * 60 + m;
    list.forEach(s => { const c = chById(s.ch), sb = subjById(s.subj); const st = `${stamp(d)}T${pad2(Math.floor(cur / 60) % 24)}${pad2(cur % 60)}00`, en0 = cur + s.mins, en = `${stamp(d)}T${pad2(Math.floor(en0 / 60) % 24)}${pad2(en0 % 60)}00`;
      ev.push(`BEGIN:VEVENT\r\nUID:${s.id}@berp\r\nDTSTAMP:${stamp(iso(now))}T${pad2(now.getHours())}${pad2(now.getMinutes())}00\r\nDTSTART:${st}\r\nDTEND:${en}\r\nSUMMARY:${esc(sb.name)}: ${(c?.name || '').replace(/[,;\\]/g, ' ')}\r\nDESCRIPTION:${s.type} session · ${s.mins} min · weightage ${c ? W(c) : ''}%\r\nEND:VEVENT`); cur = en0 + settings.brk; }); });
  if (!ev.length) { toast('No upcoming sessions in the next 14 days', 'bad'); return; }
  download('revision-plan.ics', `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Board Exam Revision Planner//EN\r\nCALSCALE:GREGORIAN\r\n${ev.join('\r\n')}\r\nEND:VCALENDAR\r\n`, 'text/calendar');
  toast(`${ev.length} ${t('sessions')} exported`, 'ok', 'calendar');
}
