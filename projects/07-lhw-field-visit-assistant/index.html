<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LHW Field Visit Assistant</title>
<meta name="description" content="Offline-first visit planner for Pakistan's Lady Health Workers: ANC schedule with auto danger-sign flags, printable referral slips, postnatal checks, EPI immunization card, growth and MUAC screening, family planning, TB/malaria screening, supplies, polio NID tally, vital registration, supervisor indicators and a monthly report with DHIS2-style export. Single-file FYP template.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens: field-app high contrast — orange, deep teal, cream ---------- */
:root{
  --bg:#fbf4ea; --surface:#ffffff; --surface-2:#f6ebdc; --ink:#1d1a16; --muted:#665c52; --line:#e6d8c4;
  --orange:#e8590c; --orange-deep:#b8430a; --orange-soft:#fde4d3; --teal:#0b525b; --teal-deep:#073a41; --teal-soft:#d9eef0;
  --red:#b42318; --red-soft:#fde3e0; --amber:#a35a00; --amber-soft:#fdebc8; --green:#1b7a3e; --green-soft:#dcf2e3;
  --radius:18px; --radius-sm:12px; --shadow:0 10px 26px -18px rgba(29,26,22,.45);
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif; --font-ur:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
h1,h2,h3,h4{margin:0;line-height:1.2}
.ur{font-family:var(--font-ur);direction:rtl;text-align:right;line-height:2;font-size:1.02rem}
html[lang=ur] .i18n{font-family:var(--font-ur);line-height:1.9}
html[lang=ur] .task .t span,html[lang=ur] .pitem .t span,html[lang=ur] .pagehead p{unicode-bidi:plaintext}
.muted{color:var(--muted)} .hidden{display:none!important} .small{font-size:.85rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.ic.lg{width:1.5em;height:1.5em} .ic.xl{width:2.2em;height:2.2em}

/* ---------- Motion kit (all under prefers-reduced-motion) ---------- */
:root{--ease:cubic-bezier(.2,.8,.2,1);--dur:.35s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bump{from{transform:scale(1.18)}to{transform:none}}
.enter{animation:fadeUp var(--dur) var(--ease) both}
.stagger>*{animation:fadeUp .45s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.spin{animation:spin .9s linear infinite}
.bump{animation:bump .25s var(--ease)}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted)}

/* ---------- Shell: left rail (desktop) → bottom tabs (phone) ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{background:var(--teal-deep);color:#e8f4f5;padding:16px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 14px}
.brand .logo{width:44px;height:44px;border-radius:14px;background:var(--orange);display:grid;place-items:center;color:#fff;flex:none}
.brand h1{font-size:1.05rem;font-weight:700} .brand small{display:block;font-size:.72rem;opacity:.75}
.railnav{overflow:auto;flex:1;min-height:0;display:grid;gap:2px;align-content:start;scrollbar-width:thin}
.railnav .sec{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;opacity:.55;padding:8px 12px 2px;font-weight:700}
.rail a.nav{display:flex;align-items:center;gap:12px;min-height:40px;padding:6px 12px;border-radius:12px;color:#cfe3e6;text-decoration:none;font-weight:700;font-size:.92rem}
.rail a.nav:hover{background:rgba(255,255,255,.08);color:#fff} .rail a.nav.on{background:var(--orange);color:#fff}
.rail a.nav .ic{width:22px;text-align:center;font-size:1.05rem} .rail a.nav .n{margin-left:auto;background:#fff;color:var(--orange-deep);border-radius:999px;font-size:.72rem;padding:1px 8px;font-weight:700}
.rail .foot{margin-top:auto;display:grid;gap:8px;padding-top:8px}
.profile{background:rgba(255,255,255,.08);border-radius:14px;padding:10px 12px;font-size:.8rem;line-height:1.35}
.profile b{display:block;font-size:.92rem}
.lang{border:0;background:#fff;color:var(--teal-deep);border-radius:12px;min-height:44px;padding:8px 12px;font-weight:700;cursor:pointer}
.content{min-width:0;display:flex;flex-direction:column}
.topbar{display:none;position:sticky;top:0;z-index:30;background:var(--teal-deep);color:#fff;align-items:center;gap:10px;padding:10px 14px}
.topbar .brand{padding:0;flex:1;min-width:0} .topbar .brand .logo{width:38px;height:38px} .topbar .brand h1{font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .lang{min-height:40px;padding:6px 10px}
.iconbtn{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:12px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;text-decoration:none;font-size:1.2rem;font-weight:700}
main{padding:24px 26px 100px;max-width:1180px;width:100%}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.pagehead h2{font-size:1.55rem;font-weight:700;letter-spacing:-.01em} .pagehead p{margin:4px 0 0;color:var(--muted)}
.backbtn{display:none;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:0;background:var(--surface-2);border-radius:12px;font-weight:700;cursor:pointer;margin-bottom:12px;text-decoration:none;color:var(--ink)}

/* ---------- Cards, buttons, chips ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.card,.kpi,.pitem,.task,.epi,.row,.todo,.tile{transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s,background .2s}
.card:hover,.kpi:hover,.tile:hover{transform:translateY(-2px);box-shadow:0 14px 30px -18px rgba(29,26,22,.5)}
.pitem:active,.task:active,.check:active,.tile:active{transform:scale(.99)}
.check{transition:border-color .2s,background .2s,transform .12s}
.card h3{font-size:1.05rem;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card + .card{margin-top:14px}
.stack{display:grid;gap:14px}
.btn{border:0;border-radius:14px;min-height:48px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--orange);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:1rem;line-height:1.2}
.btn{transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s}
.btn:hover{background:var(--orange-deep);transform:translateY(-1px)} .btn:active{transform:translateY(0) scale(.98)}
.btn.teal{background:var(--teal)} .btn.teal:hover{background:var(--teal-deep)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)} .btn.ghost:hover{background:#efe1cd}
.btn.danger{background:var(--red-soft);color:var(--red)} .btn.danger:hover{background:#f9cfcb}
.btn.green{background:var(--green)} .btn.green:hover{background:#14612f}
.btn.sm{min-height:40px;padding:6px 12px;font-size:.9rem;border-radius:12px}
.btn.block{width:100%} .btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 11px;font-size:.78rem;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap;line-height:1.3}
.chip.red{background:var(--red-soft);color:var(--red)} .chip.amber{background:var(--amber-soft);color:var(--amber)} .chip.green{background:var(--green-soft);color:var(--green)} .chip.teal{background:var(--teal-soft);color:var(--teal)} .chip.orange{background:var(--orange-soft);color:var(--orange-deep)}
.chip.lg{font-size:.9rem;padding:6px 14px} .chip.wrap{white-space:normal;text-align:left;line-height:1.5}
.alert{border-radius:14px;padding:14px 16px;border:2px solid var(--line);display:flex;gap:12px;align-items:flex-start;background:var(--surface-2)}
.alert .ic{font-size:1.3rem;flex:none;line-height:1.2} .alert > div{flex:1;min-width:0}
.alert.red{background:var(--red-soft);border-color:var(--red)} .alert.amber{background:var(--amber-soft);border-color:#e8a23a} .alert.green{background:var(--green-soft);border-color:var(--green)} .alert.teal{background:var(--teal-soft);border-color:var(--teal)}
.alert .ur{margin-top:4px;font-size:.98rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .v{font-size:1.9rem;font-weight:700;letter-spacing:-.02em;margin-top:2px;line-height:1.1} .kpi .s{font-size:.8rem;color:var(--muted);margin-top:4px}
.kpi.orange .v{color:var(--orange)} .kpi.teal .v{color:var(--teal)} .kpi.red .v{color:var(--red)} .kpi.green .v{color:var(--green)} .kpi.amber .v{color:var(--amber)}

/* ---------- Forms ---------- */
label.f{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.06em}
select,input[type=text],input[type=number],input[type=date],input[type=tel],input[type=search],input[type=month],input[type=password],textarea{width:100%;min-height:48px;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;outline:0;font-size:1rem}
textarea{min-height:72px;resize:vertical}
select:focus,input:focus,textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 14px} .cols>*{min-width:0} input,select,textarea{min-width:0;max-width:100%}
.cols.tight{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:16px;align-items:start}
.check{display:flex;gap:12px;align-items:center;min-height:56px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer}
.check input{width:24px;height:24px;flex:none;accent-color:var(--orange);margin:0}
.check .en{flex:1;font-weight:700;font-size:.95rem} .check .ur{flex:1;line-height:1.8;font-size:.98rem}
.check.on{border-color:var(--red);background:var(--red-soft)} .check.ok.on{border-color:var(--green);background:var(--green-soft)} .check.teal.on{border-color:var(--teal);background:var(--teal-soft)}
.checks{display:grid;gap:8px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface-2);max-width:100%;flex-wrap:wrap}
.seg button{border:0;background:none;min-height:44px;padding:6px 16px;cursor:pointer;font-weight:700;flex:1 1 auto} .seg button.on{background:var(--teal);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface)}
.row.click{cursor:pointer} .row.click:hover{border-color:var(--orange)}
.list{display:grid;gap:10px}
.note{background:var(--teal-soft);border-left:5px solid var(--teal);padding:10px 14px;border-radius:10px;font-size:.9rem}
.note.warn{background:var(--amber-soft);border-left-color:#e8a23a}
.todo{border:2px dashed var(--teal);border-radius:14px;padding:12px 14px;background:var(--surface)}
.todo h4{font-size:.98rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px} .todo .tag{font-size:.68rem;background:var(--teal);color:#fff;border-radius:6px;padding:2px 7px;font-weight:700}
.todo code{background:var(--surface-2);padding:1px 6px;border-radius:6px;font-size:.85em}
pre.json{background:var(--teal-deep);color:#d9eef0;border-radius:12px;padding:12px 14px;font-size:.78rem;line-height:1.45;overflow:auto;max-height:50vh;margin:0}

/* ---------- Split list + detail ---------- */
.split{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:18px;align-items:start}
.col-list{position:sticky;top:18px}
.plist{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;max-height:calc(100vh - 170px);overflow:auto;padding:2px}
.pitem{display:flex;gap:12px;align-items:center;min-height:64px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;text-decoration:none;color:var(--ink)}
.pitem:hover{border-color:var(--orange)} .pitem.on{border-color:var(--orange);background:var(--orange-soft)}
.pitem .av{width:42px;height:42px;border-radius:12px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-weight:700;flex:none}
.pitem .av.girl{background:#fbe0ea;color:#a8325f} .pitem .av.boy{background:#dbe9f7;color:#1f4f8a}
.pitem .t{flex:1;min-width:0} .pitem .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .pitem .t span{font-size:.82rem;color:var(--muted)}
.detailhead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.detailhead .big{width:58px;height:58px;border-radius:16px;background:var(--orange-soft);color:var(--orange-deep);display:grid;place-items:center;font-size:1.4rem;font-weight:700;flex:none}
.detailhead h2{font-size:1.4rem} .detailhead .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.detailhead .meta .chip{white-space:normal;max-width:100%}

/* ---------- Timeline, planner, EPI, growth ---------- */
.tl{display:grid;gap:8px}
.tl .c{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--line);border-left:6px solid var(--line);background:var(--surface)}
.tl .c.done{border-left-color:var(--green)} .tl .c.due{border-left-color:var(--amber);background:#fff9ee} .tl .c.overdue{border-left-color:var(--red);background:#fff4f2} .tl .c.upcoming{opacity:.85} .tl .c.missed{border-left-color:#b9ab98;background:var(--surface-2)}
.tl .wk{font-size:1.2rem;font-weight:700;line-height:1} .tl .wk small{display:block;font-size:.68rem;color:var(--muted);font-weight:700;text-transform:uppercase}
.task{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--line);border-left:6px solid var(--teal);background:var(--surface)}
.task.overdue{border-left-color:var(--red)} .task.due{border-left-color:var(--amber)} .task.alert{border-left-color:var(--red);background:var(--red-soft)}
.task .t{flex:1;min-width:0} .task .t b{display:block} .task .t span{font-size:.84rem;color:var(--muted)}
.task .btn{flex:none}
.epi{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.epi header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:var(--surface-2);flex-wrap:wrap}
.epi header b{font-size:1rem} .epi header span.d{font-size:.82rem;color:var(--muted)}
.epi .vx{display:flex;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.epi .vx .nm{flex:1;min-width:120px;font-weight:700} .epi .vx input[type=date]{min-height:40px;width:auto;flex:none;padding:4px 8px;font-size:.9rem}
.epi.given header{background:var(--green-soft)} .epi.overdue header{background:var(--red-soft)} .epi.due header{background:var(--amber-soft)}
.chart{position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:8px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;margin:8px 2px 0} .legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:.9rem;vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--surface-2)}
tr:last-child td{border-bottom:0} td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow:auto;border-radius:14px}
.progress{height:14px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--line)} .progress i{display:block;height:100%;background:var(--teal);transition:width .3s}
.progress i.red{background:var(--red)} .progress i.amber{background:var(--amber)} .progress i.green{background:var(--green)}

/* ---------- Module tiles (More page), suitability, tally counters, lock screen ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:8px;min-height:120px;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);text-decoration:none;color:var(--ink);box-shadow:var(--shadow);position:relative}
.tile .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal)}
.tile.orange .ico{background:var(--orange-soft);color:var(--orange-deep)} .tile.red .ico{background:var(--red-soft);color:var(--red)} .tile.green .ico{background:var(--green-soft);color:var(--green)}
.tile b{font-size:.98rem;line-height:1.2} .tile .ur{line-height:1.7;font-size:.95rem;text-align:left;direction:rtl}
.tile .n{position:absolute;top:12px;right:12px}
.suit{display:grid;gap:8px}
.suit .m{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-left:6px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer}
.suit .m.suitable{border-left-color:var(--green)} .suit .m.caution{border-left-color:var(--amber);background:#fff9ee} .suit .m.avoid{border-left-color:var(--red);background:#fff4f2;opacity:.85}
.suit .m.sel{outline:3px solid var(--orange);outline-offset:-1px}
.suit .m b{display:block} .suit .m .why{grid-column:1/-1;font-size:.82rem;color:var(--muted)}
.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tally .box{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:12px;text-align:center;display:grid;gap:8px}
.tally .box .lbl{font-size:.78rem;font-weight:700;color:var(--muted);min-height:2.4em;line-height:1.2}
.tally .box .cnt{font-size:2.2rem;font-weight:700;line-height:1;letter-spacing:-.02em}
.tally .box .pm{display:flex;gap:8px;justify-content:center}
.tally .box .pm button{border:0;border-radius:14px;min-width:64px;min-height:56px;font-size:1.5rem;font-weight:700;cursor:pointer;background:var(--teal);color:#fff;display:grid;place-items:center}
.tally .box .pm button.minus{background:var(--surface-2);color:var(--ink);min-width:48px}
.tally .box .pm button:active{transform:scale(.96)}
.tally .box.red .cnt{color:var(--red)} .tally .box.teal .cnt{color:var(--teal)} .tally .box.orange .cnt{color:var(--orange)}
.lock{max-width:420px;margin:30px auto;text-align:center}
.lock .big{margin:0 auto 14px;width:72px;height:72px;border-radius:22px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center}
.lock input{text-align:center;font-size:1.6rem;letter-spacing:.4em;max-width:240px;margin:0 auto}
.ind td .bar{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;min-width:70px;margin-top:4px}
.ind td .bar i{display:block;height:100%;background:var(--teal)}
.ind td .bar i.red{background:var(--red)} .ind td .bar i.amber{background:var(--amber)} .ind td .bar i.green{background:var(--green)}
.rank{display:grid;gap:8px}
.rank .r{display:grid;grid-template-columns:34px minmax(0,1fr) 60px;gap:10px;align-items:center}
.rank .r .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .r .score{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{flex:1;min-width:90px;text-align:center;padding:6px 8px;border-radius:10px;background:var(--surface-2);font-size:.78rem;font-weight:700;color:var(--muted)}
.steps span.done{background:var(--green-soft);color:var(--green)} .steps span.cur{background:var(--orange-soft);color:var(--orange-deep)}

/* ---------- Referral slip ---------- */
.slip{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:22px 24px;max-width:720px}
.slip header{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:12px;flex-wrap:wrap}
.slip header h2{font-size:1.25rem} .slip header .ur{font-size:1.1rem}
.slip .urgency{display:inline-block;border:2px solid currentColor;border-radius:8px;padding:4px 10px;font-weight:700;margin:6px 0}
.slip dl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:0} .slip dt{font-weight:700;color:var(--muted);font-size:.85rem} .slip dd{margin:0}
.slip .sig{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:26px} .slip .sig div{border-top:1px solid var(--ink);padding-top:6px;font-size:.82rem;color:var(--muted)}

/* ---------- Toasts / sheets / bottom nav ---------- */
#toasts{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);display:grid;gap:8px;z-index:60;width:max-content;max-width:92vw}
.toast{background:var(--teal-deep);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:toastIn .3s var(--ease) both;display:flex;align-items:center;gap:10px}
.toast.out{animation:toastOut .3s var(--ease) forwards}
.toast.ok{background:var(--green)} .toast.bad{background:var(--red)}
.progress i{transition:width .6s var(--ease)}
.sheet-scrim{position:fixed;inset:0;background:rgba(7,58,65,.45);z-index:50;animation:fadeIn .25s var(--ease) both;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:560px;max-height:88vh;overflow:auto;animation:sheetUp .35s var(--ease) both;box-shadow:0 -20px 60px -20px rgba(0,0,0,.4)}
.sheet.wide{max-width:760px}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet-scrim.closing{animation:fadeOut .22s var(--ease) forwards} .sheet-scrim.closing .sheet{animation:sheetDown .22s var(--ease) forwards}
@keyframes fadeOut{to{opacity:0}} @keyframes sheetDown{to{transform:translateY(30px);opacity:0}}
@media (min-width:901px){.sheet-scrim{align-items:center}.sheet{border-radius:22px;animation:popIn .3s var(--ease) both}.sheet-scrim.closing .sheet{animation:fadeOut .2s var(--ease) forwards}}
.bottomnav{display:none;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:35;padding:4px 2px calc(4px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px -16px rgba(0,0,0,.35)}
.bottomnav a{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.66rem;font-weight:700;border-radius:12px;position:relative}
.bottomnav a.on{color:var(--orange-deep);background:var(--orange-soft)} .bottomnav a span.ic{font-size:1.25rem;line-height:1}
.bottomnav a .n{position:absolute;top:4px;right:calc(50% - 22px);background:var(--red);color:#fff;border-radius:999px;font-size:.62rem;padding:0 5px;line-height:1.4}

@media (max-width:900px){
  .shell{grid-template-columns:1fr} .rail{display:none} .topbar{display:flex}
  .bottomnav{display:flex}
  main{padding:14px 16px 96px}
  .two{grid-template-columns:minmax(0,1fr)}
  .split{grid-template-columns:minmax(0,1fr)} .col-list{position:static} .plist{max-height:none;overflow:visible}
  .split.detail-open .col-list{display:none} .split:not(.detail-open) .col-detail{display:none}
  .backbtn{display:inline-flex}
  .pagehead h2{font-size:1.3rem}
  .card{padding:16px}
  .tl .c{grid-template-columns:52px minmax(0,1fr)} .tl .c .chip{grid-column:2}
  .slip dl{grid-template-columns:120px 1fr}
  .check{flex-wrap:wrap} .check .en{min-width:60%} .check .ur{flex-basis:100%;text-align:right}
  .kpi .v{font-size:1.6rem}
  .actions .btn{flex:1 1 auto}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tally{grid-template-columns:repeat(2,minmax(0,1fr))}
  .suit .m{grid-template-columns:minmax(0,1fr)} .suit .m .chip{justify-self:start}
  .detailhead > div:nth-child(2){flex:1 1 calc(100% - 72px)!important}
}
@media (max-width:420px){ .bottomnav a{font-size:.6rem} }
@media (min-width:901px) and (max-height:920px){ .brand small{display:none} .brand{padding-bottom:8px} .rail a.nav{min-height:38px} .railnav .sec{padding-top:6px} .profile{padding:8px 12px} }
@media print{
  .rail,.topbar,.bottomnav,#toasts,.no-print,.backbtn{display:none!important}
  body{background:#fff;color:#000} main{padding:0;max-width:none} .shell{display:block}
  .card,.kpi,.slip{box-shadow:none;break-inside:avoid}
  .slip{border-radius:0;max-width:none}
}

'use strict';
/* =====================================================================
   LHW Field Visit Assistant — single-file, offline-first app
   Sections: utils · i18n · clinical reference data · programme reference data ·
   store & seed · clinical logic (GA, ANC schedule, flags, EPI, growth, MUAC) ·
   programme logic (FP suitability, supplements, screening rules, stock, indicators) ·
   planner · shared UI · views (today, households, pregnancy, children, FP, nutrition,
   screening, supplies, NID, vitals, report, sync, supervisor, more, about) · router
   Student extension points are marked with  TODO(student)
   ===================================================================== */

// ---------- utils ----------
const NS = 'lhw:';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

// Namespaced localStorage wrapper. Every read/write is guarded so a blocked
// storage (private mode, quota) degrades to in-memory defaults instead of crashing.
const store = {
  get(k, d) {
    try {
      const v = localStorage.getItem(NS + k);
      return v == null ? d : JSON.parse(v);
    } catch {
      return d;
    }
  },
  set(k, v) {
    try {
      localStorage.setItem(NS + k, JSON.stringify(v));
      return true;
    } catch {
      return false;
    }
  },
  del(k) {
    try {
      localStorage.removeItem(NS + k);
    } catch {}
  }
};

const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ESC_MAP[c]);
const uid = () => Math.random().toString(36).slice(2, 9);
const ic = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const sum = arr => arr.reduce((a, b) => a + b, 0);
const pct = (num, den) => (den ? Math.round((num / den) * 100) : null);

// djb2 string hash — used only for the supervisor PIN (an illustrative local gate, not real security)
function hashStr(s) {
  let h = 5381;
  for (const ch of String(s)) {
    h = ((h << 5) + h + ch.charCodeAt(0)) | 0;
  }
  return (h >>> 0).toString(36);
}

function toast(msg, type = '', icon) {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const fallback = type === 'ok' ? 'check-circle' : type === 'bad' ? 'alert-circle' : 'info';
  el.innerHTML = ic(icon || fallback) + '<span></span>';
  el.lastChild.textContent = msg;
  $('#toasts').append(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 320);
  }, 3000);
}

// motion helpers (see KIT): page enter, stagger, count-up, path draw-in, bar growth
function animateIn(root) {
  root.classList.remove('enter');
  void root.offsetWidth;
  root.classList.add('enter');
  $$('.stagger', root).forEach(group => {
    [...group.children].forEach((el, i) => el.style.setProperty('--i', Math.min(i, 12)));
  });
}

function countUp(el, to, { dur = 650, fmt = v => Math.round(v).toLocaleString('en-PK') } = {}) {
  const t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(to * eased);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function drawPath(p) {
  try {
    const L = p.getTotalLength();
    if (!L) return;
    p.style.strokeDasharray = L;
    p.style.strokeDashoffset = L;
    p.getBoundingClientRect();
    p.style.transition = 'stroke-dashoffset .9s var(--ease)';
    p.style.strokeDashoffset = 0;
  } catch {}
}

function animateBars(root) {
  $$('[data-grow]', root).forEach(el => {
    const to = el.dataset.grow;
    el.style.transition = 'none';
    el.style.width = '0%';
    el.getBoundingClientRect();
    el.style.transition = 'width .7s var(--ease)';
    el.style.width = to;
  });
}

function bump(el) {
  if (!el) return;
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
}

// dates: local-time ISO strings (YYYY-MM-DD) to avoid UTC day shifts in PKT
const TODAY = new Date();
TODAY.setHours(0, 0, 0, 0);
const pad2 = n => String(n).padStart(2, '0');

function parse(s) {
  if (s instanceof Date) return s;
  const [y, m, d] = String(s).split('-').map(Number);
  return new Date(y, (m || 1) - 1, d || 1);
}

function iso(d) {
  const x = d instanceof Date ? d : parse(d);
  return `${x.getFullYear()}-${pad2(x.getMonth() + 1)}-${pad2(x.getDate())}`;
}

function addDays(d, n) {
  const x = new Date(parse(d));
  x.setDate(x.getDate() + n);
  return x;
}

const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 864e5); // b - a in days
const T_ISO = iso(TODAY);
const fmtD = d => (d ? parse(d).toLocaleDateString('en-PK', { day: 'numeric', month: 'short', year: 'numeric' }) : '—');
const fmtS = d => (d ? parse(d).toLocaleDateString('en-PK', { day: 'numeric', month: 'short' }) : '—');
const monthKey = d => iso(d).slice(0, 7);
const fmtMonth = k => parse(k + '-01').toLocaleDateString('en-PK', { month: 'long', year: 'numeric' });
const monthShort = k => parse(k + '-01').toLocaleDateString('en-PK', { month: 'short' });

// the last n month keys ending with the current month, oldest first
function lastMonths(n) {
  return Array.from({ length: n }, (_, i) => {
    const d = new Date(TODAY.getFullYear(), TODAY.getMonth() - (n - 1) + i, 1);
    return monthKey(d);
  });
}

function relDays(d) {
  const n = diffDays(T_ISO, d);
  if (n === 0) return t('today');
  if (n === 1) return t('tomorrow');
  if (n === -1) return t('yesterday');
  if (n > 0) return `${t('in')} ${n} ${t('days')}`;
  return `${-n} ${t('daysAgo')}`;
}

function download(name, text, type = 'application/json') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  document.body.append(a);
  a.click();
  setTimeout(() => {
    URL.revokeObjectURL(a.href);
    a.remove();
  }, 500);
}

function load() {
  TABLES.forEach(k => {

  if (!store.get('seeded')) {
    seed();
  } else if ((store.get('seedVersion') || 1) < 2) {

    seedProgramme();
  }
  if (!supplies) supplies = defaultSupplies();
  if (!lhws || !lhws.length) {
    lhws = [Object.assign({}, DEFAULT_PROFILE, profile, { id: profile.id || 'l1' })];
    store.set('lhws', lhws);
  }
  if (!summaries) summaries = [];
  if (!store.get('pin')) store.set('pin', hashStr('1234'));
}

const save = k => store.set(k, DB[k]);
const byId = (table, id) => DB[table].find(r => r.id === id);

function put(table, rec) {
  rec.id = rec.id || uid();
  rec.createdAt = rec.createdAt || T_ISO;
  rec.updatedAt = Date.now();
  rec.synced = false;
  const i = DB[table].findIndex(r => r.id === rec.id);
  if (i >= 0) DB[table][i] = rec;
  else DB[table].push(rec);
  save(table);
  return rec;
}

function remove(table, id) {
  DB[table] = DB[table].filter(r => r.id !== id);
  save(table);
}

const unsynced = () => TABLES.flatMap(k => DB[k].filter(r => !r.synced).map(r => ({ table: k, rec: r })));

}

// ---------- clinical logic ----------
function ga(lmp, date = T_ISO) {
  const days = diffDays(lmp, date);
  return { days, w: Math.floor(days / 7), d: days % 7 };
}

function gaStr(lmp, date = T_ISO) {
  const g = ga(lmp, date);
  return g.days < 0 ? '—' : `${g.w}w ${g.d}d`;
}

const eddOf = lmp => iso(addDays(lmp, 280));
const womanOf = p => byId('women', p.womanId) || { name: '?', age: '' };
const hhOf = w => byId('households', w.householdId) || { head: '?', mohalla: '' };
const visitsOf = p => DB.anc.filter(v => v.pregnancyId === p.id).sort((a, b) => (a.date < b.date ? -1 : 1));
const pncOf = p => DB.pnc.filter(v => v.pregnancyId === p.id).sort((a, b) => a.day - b.day);
const activePregnancyOf = womanId => DB.pregnancies.find(p => p.womanId === womanId && p.status === 'active');

function riskList(p) {
  const w = womanOf(p);
  const r = new Set(p.risks || []);
  if (w.age && (w.age < 18 || w.age > 35)) r.add('age');
  return [...r];
}

/** Contact schedule: each contact has a window [due-7, due+14]. Covered if any visit falls in it. */
function schedule(p) {
  const vs = visitsOf(p);
  const today = ga(p.lmp).days;
  return CONTACTS.map(c => {
    const due = c.wk * 7;
    const dueDate = iso(addDays(p.lmp, due));
    const visit = vs.find(v => {
      const g = ga(p.lmp, v.date).days;
      return g >= due - 7 && g <= due + 14;
    });
    const laterVisit = vs.some(v => ga(p.lmp, v.date).days > due + 14);
    let status = 'upcoming';
    if (visit) status = 'done';
    else if (p.status !== 'active') status = 'skipped';
    else if (today > due + 42 || (today > due + 14 && laterVisit)) status = 'missed';
    else if (today > due + 14) status = 'overdue';
    else if (today >= due - 7) status = 'due';
    return { ...c, dueDate, visit, status };
  });
}

function pncSchedule(p) {
  if (!p.delivery) return [];
  const vs = pncOf(p);
  return PNC_DAYS.map(day => {
    const dueDate = iso(addDays(p.delivery.date, day));
    const visit = vs.find(v => v.day === day);
    const late = diffDays(dueDate, T_ISO);
    let status = 'upcoming';
    if (visit) status = 'done';
    else if (late > 3) status = 'overdue';
    else if (late >= -1) status = 'due';
    return { day, dueDate, visit, status };
  });
}

/** Auto flags for an ANC visit draft. Returns {flags:[{cls,en,ur}], urg:0-3, signs} */
function assessAnc(p, v) {
  const flags = [];
  let urg = 0;
  const signs = new Set(v.signs || []);
  const g = ga(p.lmp, v.date).w;
  const F = (cls, en, ur, u) => {
    flags.push({ cls, en, ur });
    urg = Math.max(urg, u);
  };
  if (v.sys >= 140 || v.dia >= 90) {
    const severe = v.sys >= 160 || v.dia >= 110 || signs.has('headache') || signs.has('swelling') || signs.has('fits');
    if (severe) {
      F('red', `BP ${v.sys}/${v.dia} with headache, vision change, swelling or fits — severe pre-eclampsia risk. Urgent referral.`, `بلڈ پریشر ${v.sys}/${v.dia} اور سر درد، نظر، سوجن یا دورے — شدید پری ایکلیمپسیا کا خطرہ۔ فوری ریفرل۔`, 3);
    } else {
      F('amber', `BP ${v.sys}/${v.dia} (≥ 140/90) — pre-eclampsia alert. Rest 15 min and recheck; refer the same day if still high or protein in urine.`, `بلڈ پریشر ${v.sys}/${v.dia} — پری ایکلیمپسیا الرٹ۔ 15 منٹ آرام کے بعد دوبارہ چیک کریں؛ زیادہ رہے تو آج ہی ریفر کریں۔`, 2);
    }
  }
  if (v.hb != null && v.hb !== '' && !isNaN(v.hb)) {
    if (v.hb < 7) F('red', `Hb ${v.hb} g/dL — severe anaemia. Refer for treatment.`, `خون ${v.hb} — شدید خون کی کمی۔ علاج کے لیے ریفر کریں۔`, 2);
    else if (v.hb < 11) F('amber', `Hb ${v.hb} g/dL — anaemia. Daily iron/folate, diet counselling, recheck in 4 weeks.`, `خون ${v.hb} — خون کی کمی۔ روزانہ آئرن/فولیٹ، خوراک کا مشورہ، 4 ہفتے بعد دوبارہ چیک۔`, 1);
  }
  if (g >= 24 && v.fh) {
    const diff = v.fh - g;
    if (Math.abs(diff) > 3) {
      F('amber', `Fundal height ${v.fh} cm vs ${g} wk (${diff > 0 ? '+' : ''}${diff} cm) — size–dates mismatch. Check LMP; refer for ultrasound (twins, fluid, growth restriction).`, `پیٹ کی پیمائش ${v.fh} سینٹی میٹر بمقابلہ ${g} ہفتے — فرق زیادہ ہے۔ تاریخ چیک کریں؛ الٹراساؤنڈ کے لیے ریفر کریں۔`, 1);
    }
  }
  if (g >= 28 && (v.fm === 'no' || signs.has('fm'))) {
    F('red', 'Reduced or absent fetal movement after 28 weeks — same-day referral for fetal assessment.', '28 ہفتوں کے بعد بچے کی حرکت کم یا بند — آج ہی ریفر کریں۔', 2);
  }
  if (signs.has('water') && g >= 37) {
    F('amber', 'Membranes ruptured at term — send to facility for delivery today.', 'پانی کی تھیلی پھٹ گئی (مکمل مدت) — زچگی کے لیے آج مرکز بھیجیں۔', 2);
  }
  PREG_DANGER.forEach(s => {
    const handledAbove = (s.id === 'fm' && g >= 28) || (s.id === 'water' && g >= 37);
    if (signs.has(s.id) && !handledAbove) urg = Math.max(urg, s.urg);
  });
  if (urg === 3 && !flags.some(f => f.cls === 'red')) {
    F('red', 'Emergency danger sign present — refer now.', 'ایمرجنسی خطرے کی علامت موجود — فوراً ریفر کریں۔', 3);
  }
  return { flags, urg, signs: [...signs] };
}

// Growth: percent of the WHO median weight-for-age (screening rule, not z-scores)
function median(sex, months) {
  const arr = WFA[sex] || WFA.boy;
  const m = clamp(months, 0, 24);
  const i = Math.floor(m);
  if (i >= 24) return arr[24];
  return arr[i] + (arr[i + 1] - arr[i]) * (m - i);
}

function growthStatus(c, w) {
  const m = ageMonths(c, w.date);
  if (m > 24) return { cls: '', key: 'ch_over24', pct: null, med: null };
  const med = median(c.sex, m);
  const p = (w.kg / med) * 100;
  if (p < 70) return { cls: 'red', key: 'ch_severe', pct: p, med };
  if (p < 80) return { cls: 'amber', key: 'ch_under', pct: p, med };
  return { cls: 'green', key: 'ch_normal', pct: p, med };
}

// ---------- programme logic: family planning ----------
/** Simplified MEC-style suitability: 'avoid' | 'caution' | 'suitable' with the answers that caused it. */
function fpSuitability(methodId, answers) {
  const rule = FP_RULES[methodId] || { avoid: [], caution: [] };
  const has = id => answers.includes(id);
  const q = id => FP_QUESTIONS.find(x => x.id === id);
  if (rule.requires && !rule.requires.some(has)) {
    return { level: 'avoid', reasons: [{ en: 'Only for fully breastfeeding mothers with a baby under 6 months', ur: 'صرف مکمل دودھ پلانے والی ماؤں کے لیے جن کا بچہ 6 ماہ سے کم ہو' }] };
  }
  const avoid = rule.avoid.filter(has).map(q);
  if (avoid.length) return { level: 'avoid', reasons: avoid };
  const caution = rule.caution.filter(has).map(q);
  if (caution.length) return { level: 'caution', reasons: caution };
  return { level: 'suitable', reasons: [] };
}

/** Follow-up dates for a method: fixed offsets from the start, then the repeating interval for up to three years. */
function fpSequence(methodId, start) {
  const m = FP_METHODS.find(x => x.id === methodId);
  if (!m || !start) return [];
  const dates = m.follow.map(off => iso(addDays(start, off)));
  if (m.repeat) {
    let last = m.follow[m.follow.length - 1];
    while (last < 1100) {
      last += m.repeat;
      dates.push(iso(addDays(start, last)));
    }
  }
  return dates;
}

function fpNextDue(rec) {
  if (!rec || !rec.method || rec.status !== 'active') return null;
  const after = rec.lastFollow || rec.start;
  return fpSequence(rec.method, rec.start).find(d => d > after) || null;
}

function fpStatus(rec) {
  const next = fpNextDue(rec);
  if (!next) return { status: 'complete', next };
  const diff = diffDays(T_ISO, next);
  if (diff < -7) return { status: 'overdue', next };
  if (diff <= 7) return { status: 'due', next };
  return { status: 'upcoming', next };
}

// ---------- programme logic: nutrition supplements ----------
const suppDoses = (c, s) => ((c.supplements || {})[s.id] || []).slice().sort();

/** Per-supplement status for a child: notYet (too young) · due · overdue · upcoming · complete (aged out). */
function suppStatus(c, s) {
  const m = ageMonths(c);
  const doses = suppDoses(c, s);
  const last = doses[doses.length - 1] || null;
  if (m < s.fromM) return { status: 'notYet', last, next: iso(addDays(c.dob, Math.round(s.fromM * 30.4375))), doses };
  if (m > s.toM) return { status: 'complete', last, next: null, doses };
  const next = last ? iso(addDays(last, s.everyDays)) : iso(addDays(c.dob, Math.round(s.fromM * 30.4375)));
  const diff = diffDays(T_ISO, next);
  let status = 'upcoming';
  if (diff <= -30) status = 'overdue';
  else if (diff <= 0) status = 'due';
  return { status, last, next, doses };
}

const nutritionOf = childId => DB.nutrition.filter(r => r.childId === childId).sort((a, b) => (a.date < b.date ? -1 : 1));
const latestNutrition = childId => nutritionOf(childId).slice(-1)[0] || null;
const iycfBand = c => IYCF.find(b => ageMonths(c) >= b.from && ageMonths(c) < b.to) || IYCF[IYCF.length - 1];

// ---------- programme logic: TB / malaria screening ----------
/** Rule-based screen result. TB: any key symptom or two others → presumptive. Malaria: severe sign → emergency; fever → suspect. */
function screenResult(type, signs) {
  if (type === 'tb') {
    const key = TB_SIGNS.filter(s => s.key && signs.includes(s.id));
    const others = TB_SIGNS.filter(s => !s.key && signs.includes(s.id));
    if (key.length || others.length >= 2) {
      return { result: 'presumptive', urg: 1, dest: 'BHU', key: 'sc_presumptive', reason: [...key, ...others].map(s => s.en).join(', ') + ' — presumptive TB, sputum test' };
    }
    return { result: 'negative', urg: 0, dest: null, key: 'sc_negative', reason: '' };
  }
  const severe = MAL_SIGNS.filter(s => s.severe && signs.includes(s.id));
  if (severe.length) {
    return { result: 'severe', urg: 3, dest: 'DHQ', key: 'sc_severe', reason: severe.map(s => s.en).join(', ') + ' — severe malaria signs' };
  }
  if (signs.includes('fever')) {
    const support = MAL_SIGNS.filter(s => !s.core && !s.severe && signs.includes(s.id));
    return { result: 'suspect', urg: 2, dest: 'BHU', key: 'sc_suspect', reason: ['Fever', ...support.map(s => s.en)].join(', ') + ' — RDT / blood film today' };
  }
  return { result: 'negative', urg: 0, dest: null, key: 'sc_negative', reason: '' };
}

const screenSigns = type => (type === 'tb' ? TB_SIGNS : MAL_SIGNS);

// ---------- programme logic: supplies ----------
const movementsOf = itemId => DB.stock.filter(m => m.item === itemId).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.updatedAt - b.updatedAt));

/** Replay movements: a count sets the level, receipts add, dispensing subtracts (never below zero). */
function stockLevel(itemId, asOf = null) {
  let qty = 0;
  movementsOf(itemId).forEach(m => {
    if (asOf && m.date > asOf) return;
    if (m.type === 'count') qty = m.qty;
    else if (m.type === 'in') qty += m.qty;
    else qty = Math.max(0, qty - m.qty);
  });
  return qty;
}

const monthlyOut = (itemId, mk) => sum(DB.stock.filter(m => m.item === itemId && m.type === 'out' && m.date.slice(0, 7) === mk).map(m => m.qty));
const amc = itemId => sum(lastMonths(3).map(mk => monthlyOut(itemId, mk))) / 3;

function stockStatus(itemId) {
  const cfg = supplies.find(s => s.id === itemId) || { min: supplyItem(itemId).min, expiry: null };
  const qty = stockLevel(itemId);
  const avg = amc(itemId);
  const monthsLeft = avg > 0 ? qty / avg : null;
  const expDays = cfg.expiry ? diffDays(T_ISO, cfg.expiry) : null;
  let status = 'ok';
  if (qty <= 0) status = 'out';
  else if (qty < cfg.min || (monthsLeft != null && monthsLeft < 1)) status = 'low';
  return { id: itemId, qty, min: cfg.min, expiry: cfg.expiry, status, amc: avg, monthsLeft, expired: expDays != null && expDays < 0, expiringSoon: expDays != null && expDays >= 0 && expDays <= 90 };
}

const stockOuts = () => SUPPLY_ITEMS.filter(i => stockStatus(i.id).status === 'out');

/** Record dispensing from another module (ANC iron, FP resupply, supplements). Returns the new level. */
function dispense(itemId, qty, note) {
  if (!qty) return stockLevel(itemId);
  const before = stockLevel(itemId);
  put('stock', { item: itemId, type: 'out', qty, date: T_ISO, note, auto: true });
  if (before < qty) toast(`${supplyItem(itemId).en}: ${t('su_notEnough')}`, 'bad', 'box');
  return stockLevel(itemId);
}

// ---------- programme logic: vital events ----------
function deathCategory(ev) {
  if (ev.type !== 'death') return null;
  const cause = DEATH_CAUSES.find(c => c.id === ev.cause);
  if (cause && cause.group === 'maternal') return 'maternal';
  const days = ev.ageUnit === 'days' ? ev.ageValue : ev.ageUnit === 'months' ? ev.ageValue * 30.4 : ev.ageValue * 365;
  if (days <= 28) return 'neonatal';
  if (days < 5 * 365) return 'child';
  return 'adult';
}

function vitalAgeStr(ev) {
  if (ev.type !== 'death' || ev.ageValue == null) return '';
  const unit = ev.ageUnit === 'days' ? t('days') : ev.ageUnit === 'months' ? t('vt_months') : t('vt_years');
  return `${ev.ageValue} ${unit}`;
}

const nextVitalStep = ev => VITAL_STEPS[VITAL_STEPS.indexOf(ev.status) + 1] || null;

// ---------- programme logic: monthly counts and supervisor indicators ----------
function monthCounts(mk) {
  const inM = d => d && d.slice(0, 7) === mk;
  const anc = DB.anc.filter(v => inM(v.date));
  const pnc = DB.pnc.filter(v => inM(v.date));
  const imm = DB.children.reduce((n, c) => n + Object.values(c.immunizations || {}).filter(inM).length, 0);
  const suppCount = id => DB.children.reduce((n, c) => n + ((c.supplements || {})[id] || []).filter(inM).length, 0);
  const nutri = DB.nutrition.filter(r => inM(r.date));
  const scr = DB.screenings.filter(s => inM(s.date));
  return {
    newreg: DB.households.filter(h => inM(h.createdAt)).length + DB.women.filter(w => inM(w.createdAt)).length + DB.pregnancies.filter(p => inM(p.createdAt)).length + DB.children.filter(c => inM(c.createdAt)).length,
    anc: anc.length,
    pnc: pnc.length,
    ref: anc.filter(v => v.referral).length + pnc.filter(v => v.referral).length + scr.filter(s => s.referral).length + nutri.filter(r => r.referral).length,
    del: DB.pregnancies.filter(p => p.delivery && inM(p.delivery.date)).length,
    imm,
    weighed: DB.children.filter(c => (c.weights || []).some(w => inM(w.date))).length,
    fp: DB.fp.filter(r => inM(r.date) && r.method).length,
    muac: nutri.length,
    sam: nutri.filter(r => r.cls === 'sam').length,
    tb: scr.filter(s => s.type === 'tb' && s.result === 'presumptive').length,
    mal: scr.filter(s => s.type === 'malaria' && s.result !== 'negative').length,
    vitA: suppCount('vita'),
    deworm: suppCount('deworm'),
    births: DB.vitals.filter(e => e.type === 'birth' && inM(e.date)).length,
    deaths: DB.vitals.filter(e => e.type === 'death' && inM(e.date)).length,
    stockouts: mk === monthKey(T_ISO) ? stockOuts().length : SUPPLY_ITEMS.filter(i => stockLevel(i.id, mk + '-31') <= 0).length
  };
}

/** Live indicators for the active LHW: counts from monthCounts plus coverage percentages. */
function indicatorsFor(mk) {
  const inM = d => d && d.slice(0, 7) === mk;
  const c = monthCounts(mk);
  const monthEnd = mk + '-31';
  const delivered = DB.pregnancies.filter(p => p.delivery && inM(p.delivery.date));
  const anc4 = delivered.filter(p => visitsOf(p).length >= 4).length;
  const sba = delivered.filter(p => p.delivery.place !== 'Home').length;
  const pnc1 = delivered.filter(p => pncOf(p).some(v => diffDays(p.delivery.date, v.date) <= 2)).length;
  const kids = DB.children.filter(ch => ch.dob <= monthEnd);
  const toddlers = kids.filter(ch => {
    const m = ageMonths(ch, monthEnd);
    return m >= 12 && m < 24;
  });
  const fic = toddlers.filter(ch => FIC_VACCINES.every(v => ch.immunizations?.[v])).length;
  const p1 = kids.filter(ch => ch.immunizations?.['Pentavalent-1'] && ageDays(ch, monthEnd) > 98 + 14);
  const p3 = p1.filter(ch => ch.immunizations?.['Pentavalent-3']).length;
  const u2 = kids.filter(ch => ageMonths(ch, monthEnd) < 24);
  const weighed = u2.filter(ch => (ch.weights || []).some(w => inM(w.date))).length;
  return {
    anc: c.anc,
    ref: c.ref,
    anc4: pct(anc4, delivered.length),
    sba: pct(sba, delivered.length),
    pnc1: pct(pnc1, delivered.length),
    fic: pct(fic, toddlers.length),
    drop: p1.length ? pct(p1.length - p3, p1.length) : null,
    weighed: pct(weighed, u2.length),
    muac: c.muac,
    fp: c.fp,
    tb: c.tb,
    stockouts: c.stockouts
  };
}

/** Traffic-light class for one indicator value against its illustrative target. */
function indicatorCls(ind, v) {
  if (v == null || ind.target == null) return '';
  if (ind.lowerBetter) {
    if (v <= ind.target) return 'green';
    return v <= ind.target * 2 + 2 ? 'amber' : 'red';
  }
  if (v >= ind.target) return 'green';
  return v >= ind.target * 0.75 ? 'amber' : 'red';
}

/** Composite 0–100 score: mean attainment over the indicators that have a target. */
function indicatorScore(vals) {
  const parts = [];
  INDICATORS.filter(i => i.target != null).forEach(i => {
    const v = vals[i.id];
    if (v == null) return;
    if (i.id === 'stockouts') parts.push(Math.max(0, 100 - 20 * v));
    else if (i.lowerBetter) parts.push(v <= i.target ? 100 : Math.max(0, 100 - (v - i.target) * 5));
    else parts.push(Math.min(100, (v / i.target) * 100));
  });
  return parts.length ? Math.round(sum(parts) / parts.length) : null;
}

const summaryFor = (lhwId, mk) => summaries.find(s => s.lhwId === lhwId && s.month === mk) || null;

// ---------- planner: what is due today / this week / overdue ----------
function plannerMnch(items) {
  DB.pregnancies.filter(p => p.status === 'active').forEach(p => {
    const w = womanOf(p);
    const sch = schedule(p);
    const last = visitsOf(p).slice(-1)[0];
    if (last && last.referral && diffDays(last.date, T_ISO) <= 14) {
      items.push({ kind: 'alert', urg: last.referral.urg, name: w.name, sub: `${t('td_anc')} ${fmtS(last.date)} · ${esc(last.referral.reason)}`, date: last.date, href: `#pregnancy/${p.id}`, action: 'td_open', icon: 'alert' });
    }
    const next = sch.find(c => c.status === 'due') || sch.find(c => c.status === 'overdue');
    if (next) {
      items.push({ kind: next.status, name: w.name, sub: `${t('td_anc')} ${next.wk} wk${next.pk ? ' · ' + t('pg_pk') : ''} · ${gaStr(p.lmp)} · ${relDays(next.dueDate)}`, date: next.dueDate, href: `#pregnancy/${p.id}/visit`, action: 'td_start', icon: 'stethoscope' });
    } else {
      const up = sch.find(c => c.status === 'upcoming' && diffDays(T_ISO, c.dueDate) <= 14);
      if (up) items.push({ kind: 'upcoming', name: w.name, sub: `${t('td_anc')} ${up.wk} wk · ${relDays(up.dueDate)}`, date: up.dueDate, href: `#pregnancy/${p.id}`, action: 'td_open', icon: 'calendar' });
    }
  });
  DB.pregnancies.filter(p => p.status === 'delivered' && p.delivery).forEach(p => {
    const w = womanOf(p);
    const next = pncSchedule(p).find(s => s.status === 'due' || s.status === 'overdue');
    if (next) items.push({ kind: next.status, name: w.name, sub: `${t('td_pnc')} · ${t('pg_day')} ${next.day} · ${relDays(next.dueDate)}`, date: next.dueDate, href: `#pregnancy/${p.id}/pnc`, action: 'td_start', icon: 'baby' });
  });
  DB.children.forEach(c => {
    const g = vaxGroups(c).find(x => x.status === 'due' || x.status === 'overdue' || (x.status === 'upcoming' && diffDays(T_ISO, x.dueDate) <= 7));
    if (g) {
      const pending = g.vaccines.filter(v => !c.immunizations?.[v]).join(', ');
      items.push({ kind: g.status, name: c.name, sub: `${t('td_vacc')} · ${bi(g)}: ${pending} · ${relDays(g.dueDate)}`, date: g.dueDate, href: `#children/${c.id}`, action: 'td_open', icon: 'syringe' });
    }
    const lw = lastWeight(c);
    if (ageMonths(c) < 24 && (!lw || diffDays(lw.date, T_ISO) > 30)) {
      const kind = lw && diffDays(lw.date, T_ISO) > 60 ? 'overdue' : 'due';
      items.push({ kind, name: c.name, sub: `${t('td_weigh')} · ${lw ? fmtS(lw.date) + ' · ' + lw.kg + ' kg' : '—'}`, date: lw ? iso(addDays(lw.date, 30)) : T_ISO, href: `#children/${c.id}`, action: 'td_open', icon: 'scale' });
    }
    const st = lw && growthStatus(c, lw);
    if (st && st.cls === 'red') items.push({ kind: 'alert', urg: 2, name: c.name, sub: `${t('ch_severe')} · ${lw.kg} kg`, date: lw.date, href: `#children/${c.id}`, action: 'td_open', icon: 'alert' });
  });
}

function plannerProgramme(items) {
  // family-planning follow-ups
  DB.women.forEach(w => {
    const rec = currentFp(w.id);
    if (!rec) return;
    const st = fpStatus(rec);
    if (st.status === 'due' || st.status === 'overdue') {
      items.push({ kind: st.status, name: w.name, sub: `${t('td_fp')} · ${fpMethod(rec.method).en} · ${relDays(st.next)}`, date: st.next, href: `#fp/${w.id}`, action: 'td_open', icon: 'pill' });
    }
  });
  // vitamin A / deworming / MNP doses and recent SAM
  DB.children.forEach(c => {
    const due = SUPPLEMENTS.map(s => ({ s, st: suppStatus(c, s) })).filter(x => x.st.status === 'due' || x.st.status === 'overdue');
    if (due.length) {
      const worst = due.some(x => x.st.status === 'overdue') ? 'overdue' : 'due';
      items.push({ kind: worst, name: c.name, sub: `${t('td_supp')} · ${due.map(x => x.s.en).join(', ')}`, date: due[0].st.next, href: `#nutrition/${c.id}`, action: 'td_open', icon: 'leaf' });
    }
    const nu = latestNutrition(c.id);
    if (nu && nu.cls === 'sam' && diffDays(nu.date, T_ISO) <= 30) {
      items.push({ kind: 'alert', urg: 2, name: c.name, sub: `${t('nu_sam')} · MUAC ${nu.muac} cm`, date: nu.date, href: `#nutrition/${c.id}`, action: 'td_open', icon: 'alert' });
    }
  });
  // screening referrals waiting for an outcome
  DB.screenings.filter(s => s.referral && s.outcome === 'pending' && diffDays(s.date, T_ISO) >= 7).forEach(s => {
    items.push({ kind: 'due', name: s.name, sub: `${t('td_screen')} · ${t(s.type === 'tb' ? 'sc_tb' : 'sc_malaria')} · ${fmtS(s.date)}`, date: s.date, href: `#screening/${s.id}`, action: 'td_open', icon: 'clipboard' });
  });
  // stock-outs
  const outs = stockOuts();
  if (outs.length) {
    items.push({ kind: 'alert', urg: 1, name: t('su_title'), sub: `${t('td_stock')} · ${outs.map(i => i.en).join(', ')}`, date: T_ISO, href: '#supplies', action: 'td_open', icon: 'box' });
  }
  // an NID campaign running today
  DB.nid.filter(k => k.status === 'active').forEach(k => {
    const dayNo = diffDays(k.start, T_ISO) + 1;
    if (dayNo >= 1 && dayNo <= k.days) {
      items.push({ kind: 'due', name: k.name, sub: `${t('td_nid')} ${dayNo}/${k.days} · ${t('ni_team')} ${esc(k.team)}`, date: T_ISO, href: `#nid/${k.id}`, action: 'td_open', icon: 'droplet' });
    }
  });
  // vital events recorded but not yet reported after a week
  DB.vitals.filter(e => e.status === 'recorded' && diffDays(e.date, T_ISO) >= 7).forEach(e => {
    items.push({ kind: 'overdue', name: e.name, sub: `${t('td_vital')} · ${t('vt_' + e.type)} · ${fmtS(e.date)}`, date: e.date, href: '#vitals', action: 'td_open', icon: 'file' });
  });
}

function planner() {
  const items = [];
  plannerMnch(items);
  plannerProgramme(items);
  return items;
}

/** Segmented control: buttons with data-v; returns a getter and keeps the .on class in sync. */
function segControl(root, initial, onChange) {
  let value = initial;
  $$('button', root).forEach(b => {
    b.classList.toggle('on', b.dataset.v === String(value));
    b.onclick = () => {
      value = b.dataset.v;
      $$('button', root).forEach(x => x.classList.toggle('on', x === b));
      if (onChange) onChange(value);
    };
  });
  return () => value;
}

/** Bottom sheet on phones, centred modal on desktop. Escape / scrim closes. */
function openSheet(html, onMount, wide = false) {
  closeSheet(true);
  const scrim = document.createElement('div');
  scrim.className = 'sheet-scrim';
  scrim.id = 'sheet';
  scrim.innerHTML = `<div class="sheet ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.append(scrim);
  scrim.addEventListener('click', e => {
    if (e.target === scrim) closeSheet();
  });
  $$('[data-close]', scrim).forEach(b => (b.onclick = () => closeSheet()));
  const first = $('input,select,textarea', scrim);
  if (first) setTimeout(() => first.focus(), 60);
  if (onMount) onMount(scrim);
}

function closeSheet(now) {
  const s = $('#sheet');
  if (!s) return;
  if (now) return s.remove();
  s.classList.add('closing');
  setTimeout(() => s.remove(), 230);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
});

/** Simple grouped bar chart: data = [{label, values:[...]}], series = [{color}], shared y scale. */
function groupedBars(el, data, series, { W = 520, H = 220 } = {}) {
  const P = { l: 30, r: 8, t: 14, b: 28 };
  const n = data.length;
  const gw = (W - P.l - P.r) / n;
  const bw = Math.min(26, (gw * 0.8) / series.length - 3);
  const mx = Math.max(2, ...data.flatMap(d => d.values));
  const y = v => P.t + (1 - v / mx) * (H - P.t - P.b);
  let s = `<svg viewBox="0 0 ${W} ${H}">`;
  [0, 0.5, 1].forEach(f => {
    s += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(mx * f)}" y2="${y(mx * f)}" stroke="#e6d8c4"/><text x="${P.l - 6}" y="${y(mx * f) + 4}" font-size="13" fill="#665c52" text-anchor="end">${Math.round(mx * f)}</text>`;
  });
  data.forEach((d, i) => {
    const x0 = P.l + i * gw + gw * 0.1;
    series.forEach((ser, k) => {
      const v = d.values[k];
      const x = (x0 + k * (bw + 3)).toFixed(1);
      s += `<rect class="bar" x="${x}" y="${y(v)}" width="${bw}" height="${Math.max(0, H - P.b - y(v))}" rx="3" fill="${ser.color}" style="transform-origin:${(+x + bw / 2).toFixed(1)}px ${H - P.b}px"><title>${esc(d.label)}: ${v}</title></rect>`;
    });
    s += `<text x="${(x0 + (series.length * (bw + 3)) / 2).toFixed(1)}" y="${H - 9}" font-size="13" fill="#665c52" text-anchor="middle">${esc(d.label)}</text>`;
  });
  el.innerHTML = s + '</svg>';
  $$('rect.bar', el).forEach((r, i) => {
    r.style.transform = 'scaleY(0)';
    r.style.transition = `transform .6s var(--ease) ${i * 25}ms`;
    requestAnimationFrame(() => requestAnimationFrame(() => (r.style.transform = 'scaleY(1)')));
  });
}
