// ---------- routing strategies: same code for phones and the simulator ----------
// A copy may travel if it has hops left and has not expired; the destination of a unicast keeps it.
const canTravel = (node, e, at) => !isExpired(e.m, at) && e.path.length - 1 < e.m.hl && e.m.to !== node.id;
const byPriority = (a, b) => b.m.prio - a.m.prio || a.m.ts - b.m.ts;
const forPeer = (e, peer) => !e.m.to || e.m.to === peer.id;

// TODO(student): add PRoPHET (delivery predictabilities with ageing and transitivity) as a fifth strategy
// here and compare it in the simulator; MaxProp or a geographic router are good alternatives.
const ROUTERS = {
  // The source carries its own messages and hands them over only on meeting the destination.
  direct: {
    summary: true,
    plan: (node, peer, at) => [...node.store.values()].filter(e => e.m.from === node.id && forPeer(e, peer) && !peerHas(peer, e.m.id) && canTravel(node, e, at)),
    give: () => 1,
  },
  // Blind flooding: push every message this node has not yet pushed to that neighbour, without asking
  // what the peer holds and without a time-to-live. Duplicates are refused on arrival but cost airtime.
  flood: {
    summary: false,
    plan: (node, peer) => {
      const sent = node.sentTo.get(peer.id);
      return [...node.store.values()].filter(e => !(sent && sent.has(e.m.id)) && e.path.length - 1 < e.m.hl && e.m.to !== node.id);
    },
    give: () => 1,
  },
  // Epidemic anti-entropy: exchange summary vectors, send only what the peer is missing.
  epidemic: {
    summary: true,
    plan: (node, peer, at) => [...node.store.values()].filter(e => !peerHas(peer, e.m.id) && canTravel(node, e, at)),
    give: () => 1,
  },
  // Binary spray-and-wait: a message starts with L copies; a holder with n > 1 gives away floor(n/2),
  // with one copy left it waits to meet the destination. Broadcasts behave epidemically.
  spray: {
    summary: true,
    plan: (node, peer, at) => [...node.store.values()].filter(e => !peerHas(peer, e.m.id) && canTravel(node, e, at) && (!e.m.to || e.m.to === peer.id || e.copies > 1)),
    give: (e, peer) => (!e.m.to || e.m.to === peer.id ? 1 : Math.floor(e.copies / 2)),
  },
};

/** Entries to push to a peer now, highest priority first (SOS before anything else). */
function planTransfer(strategy, node, peer, at, limit = Infinity) {
  const R = ROUTERS[strategy] || ROUTERS.epidemic;
  return R.plan(node, peer, at).sort(byPriority).slice(0, limit);
}

/** How many spray copies travel with this hand-over (1 for the other strategies). */
const copiesFor = (strategy, e, peer) => Math.max(1, (ROUTERS[strategy] || ROUTERS.epidemic).give(e, peer));

/** Bookkeeping after a copy was handed over: spray budget split, per-neighbour memory, the peer's known set. */
function noteSent(strategy, node, peer, e, give) {
  if (strategy === 'spray' && e.m.to && e.m.to !== peer.id) e.copies -= give;
  if (!node.sentTo.has(peer.id)) node.sentTo.set(peer.id, new Set());
  node.sentTo.get(peer.id).add(e.m.id);
  peer.has.add(e.m.id);
}

// ---------- mesh simulator: random-waypoint mobility → contact trace → the real routing code ----------
// Every strategy runs on the same seeded mobility and the same workload, so differences come from
// routing alone. Time is in seconds. TTL applies to epidemic and spray-and-wait; direct delivery and
// blind flooding have none (that is what makes them the two baselines).
const STRATEGIES = ['direct', 'flood', 'epidemic', 'spray'];
const SIM_DEFAULTS = { nodes: 40, area: 1500, range: 60, speedMin: 0.5, speedMax: 1.6, pauseMax: 120, duration: 7200, dt: 10, msgs: 150, ttlMin: 45, hl: 10, sprayL: 8, cap: 30, bw: 10, sosShare: 0.15, seed: 2026 };

function simWalker(r, p) {
  return { x: r() * p.area, y: r() * p.area, tx: r() * p.area, ty: r() * p.area, v: p.speedMin + r() * (p.speedMax - p.speedMin), pause: r() * p.pauseMax };
}

function simStepWalker(w, r, p) {
  if (w.pause > 0) {
    w.pause -= p.dt;
    return;
  }
  const dx = w.tx - w.x;
  const dy = w.ty - w.y;
  const d = Math.hypot(dx, dy);
  const stepLen = w.v * p.dt;
  if (d <= stepLen) {
    Object.assign(w, { x: w.tx, y: w.ty, tx: r() * p.area, ty: r() * p.area, v: p.speedMin + r() * (p.speedMax - p.speedMin), pause: r() * p.pauseMax });
    return;
  }
  w.x += (dx / d) * stepLen;
  w.y += (dy / d) * stepLen;
}

/** Random-waypoint positions for every node at every step (flat Float32Arrays, step-major). */
function simMobility(p) {
  const r = rng(p.seed);
  const steps = Math.floor(p.duration / p.dt) + 1;
  const xs = new Float32Array(steps * p.nodes);
  const ys = new Float32Array(steps * p.nodes);
  const walkers = Array.from({ length: p.nodes }, () => simWalker(r, p));
  for (let s = 0; s < steps; s++) {
    walkers.forEach((w, i) => {
      xs[s * p.nodes + i] = w.x;
      ys[s * p.nodes + i] = w.y;
      simStepWalker(w, r, p);
    });
  }
  return { steps, xs, ys };
}

/** Pairs within radio range at each step, plus contact statistics. */
function simContacts(p, tr) {
  const out = [];
  const r2 = p.range * p.range;
  let links = 0;
  for (let s = 0; s < tr.steps; s++) {
    const pairs = [];
    const o = s * p.nodes;
    for (let i = 0; i < p.nodes; i++) {
      for (let j = i + 1; j < p.nodes; j++) {
        const dx = tr.xs[o + i] - tr.xs[o + j];
        const dy = tr.ys[o + i] - tr.ys[o + j];
        if (dx * dx + dy * dy <= r2) pairs.push(i, j);
      }
    }
    links += pairs.length / 2;
    out.push(pairs);
  }
  return { pairs: out, meanDegree: (2 * links) / (tr.steps * p.nodes) };
}

/** Seeded workload: unicast messages between random pairs, created in the first 60 % of the run. */
function simWorkload(p) {
  const r = rng(p.seed + 101);
  const list = [];
  for (let i = 0; i < p.msgs; i++) {
    const src = Math.floor(r() * p.nodes);
    let dst = Math.floor(r() * (p.nodes - 1));
    if (dst >= src) dst++;
    list.push({ i, src, dst, t: Math.round((r() * p.duration * 0.6) / p.dt) * p.dt, sos: r() < p.sosShare });
  }
  return list.sort((a, b) => a.t - b.t);
}

function simMessage(w, p, strategy) {
  const ttl = strategy === 'epidemic' || strategy === 'spray' ? p.ttlMin * 60 : 0;
  return { id: 'sim' + w.i, kind: 'text', from: 'n' + w.src, to: 'n' + w.dst, ts: w.t, exp: ttl ? w.t + ttl : 0, hl: p.hl, prio: w.sos ? PRIO_SOS : 0 };
}

// One direction of an encounter, through the same planTransfer / storeAccept / noteSent as the phones.
function simPush(strategy, a, b, t, p, res) {
  const summary = ROUTERS[strategy].summary ? { ids: [...b.store.keys(), ...b.seen.keys()] } : null;
  const peer = peerView(b.id, summary);
  for (const e of planTransfer(strategy, a, peer, t, p.bw)) {
    const give = copiesFor(strategy, e, peer);
    res.tx++;
    const verdict = storeAccept(b, e.m, [...e.path, b.id], t, give);
    if (verdict === 'dup') res.dupTx++;
    if (verdict === 'stored') noteSent(strategy, a, peer, e, give);
    else noteSent(strategy, a, peer, e, 0);
    if (verdict === 'stored' && e.m.to === b.id) simDelivered(res, e, t);
  }
}

function simDelivered(res, e, t) {
  res.delivered++;
  res.lat.push(t - e.m.ts);
  res.hops.push(e.path.length);
  if (e.m.prio === PRIO_SOS) res.sosDelivered++;
}

// Pairs in range sync both ways; a pair whose stores have not changed since its last sync is skipped
// (the same check a phone makes by comparing summary vectors), which keeps 100-node runs fast.
function simEncounters(strategy, nodes, pairs, t, p, res, synced) {
  for (let k = 0; k < pairs.length; k += 2) {
    const a = nodes[pairs[k]];
    const b = nodes[pairs[k + 1]];
    const slot = pairs[k] * p.nodes + pairs[k + 1];
    const stamp = a.ver * 65536 + b.ver;
    if (synced[slot] === stamp) continue;
    simPush(strategy, a, b, t, p, res);
    simPush(strategy, b, a, t, p, res);
    synced[slot] = a.ver * 65536 + b.ver;
  }
}

function simTrackStep(res, nodes, id) {
  const holders = new Uint8Array(nodes.length);
  nodes.forEach((n, i) => (holders[i] = n.store.has(id) ? 1 : 0));
  res.track.push(holders);
}

/** Run one strategy over a prepared trace. Returns the metrics the evaluation chapter needs. */
function simRun(p, strategy, tr, ct, work, trackId = null) {
  const nodes = Array.from({ length: p.nodes }, (_, i) => newNode('n' + i, { cap: p.cap, keepExpired: false }));
  const res = { strategy, created: 0, delivered: 0, sosCreated: 0, sosDelivered: 0, tx: 0, dupTx: 0, lat: [], hops: [], curve: [], track: [], peakBuf: 0 };
  const synced = new Float64Array(p.nodes * p.nodes).fill(-1);
  let wi = 0;
  for (let s = 0; s < tr.steps; s++) {
    const t = s * p.dt;
    while (wi < work.length && work[wi].t <= t) {
      const w = work[wi++];
      res.created++;
      if (w.sos) res.sosCreated++;
      storeAccept(nodes[w.src], simMessage(w, p, strategy), [nodes[w.src].id], t, p.sprayL);
    }
    if (s % 6 === 0) nodes.forEach(n => storePurge(n, t));
    simEncounters(strategy, nodes, ct.pairs[s], t, p, res, synced);
    if (s % Math.ceil(tr.steps / 60) === 0 || s === tr.steps - 1) res.curve.push([t, res.delivered]);
    if (trackId) simTrackStep(res, nodes, trackId);
    if (s % 6 === 0) res.peakBuf = Math.max(res.peakBuf, ...nodes.map(n => n.store.size));
  }
  return simSummarise(res, nodes);
}

function simSummarise(res, nodes) {
  const lat = [...res.lat].sort((a, b) => a - b);
  const q = f => (lat.length ? lat[Math.min(lat.length - 1, Math.floor(f * lat.length))] : 0);
  res.ratio = res.created ? res.delivered / res.created : 0;
  res.sosRatio = res.sosCreated ? res.sosDelivered / res.sosCreated : 0;
  res.latMean = lat.length ? lat.reduce((a, b) => a + b, 0) / lat.length : 0;
  res.latMedian = q(0.5);
  res.latP90 = q(0.9);
  res.overhead = res.delivered ? res.tx / res.delivered : res.tx;
  res.meanHops = res.hops.length ? res.hops.reduce((a, b) => a + b, 0) / res.hops.length : 0;
  res.latSorted = lat;
  return res;
}

/** Prepare one scenario and run the chosen strategies on it (synchronous; used by tests and the sweep). */
function simCompare(params, strategies = STRATEGIES, trackId = null) {
  const p = { ...SIM_DEFAULTS, ...params };
  const tr = simMobility(p);
  const ct = simContacts(p, tr);
  const work = simWorkload(p);
  const results = strategies.map(s => simRun(p, s, tr, ct, work, trackId));
  return { p, tr, ct, work, results };
}

// ---------- Rabta sync protocol: the same JSON frames over WebRTC, BroadcastChannel, loopback and demo links ----------
// hello (identity + summary vector + board digests) → msg frames for what the peer lacks → board states that
// differ → live gossip of anything new. ping/pong measure round-trip time. A link is any pipe with
// { kind, label, send(text), close() } that calls link.onframe(text) and link.onclose().
const BOARD_IDS = ['missing', 'needs', 'resources', 'incidents', 'roll', 'responders'];

function makeNodeCtx(ident, keys, opts = {}) {
  const ctx = {
    id: ident.id,
    name: ident.name,
    pk: ident.pk,
    dh: ident.dh,
    keys,
    core: newNode(ident.id, { cap: opts.cap || 2000 }),
    boards: Object.fromEntries(BOARD_IDS.map(b => [b, boardNew()])),
    clock: new Hlc(ident.id, opts.clock || ''),
    strategy: opts.strategy || 'epidemic',
    sessions: new Set(),
    hooks: opts.hooks || {},
    pos: opts.pos || null,
  };
  return ctx;
}

const hook = (ctx, name, ...args) => ctx.hooks[name] && ctx.hooks[name](...args);

async function helloFrame(ctx) {
  const ts = Date.now();
  const proof = ctx.keys ? b64u(new Uint8Array(await crypto.subtle.sign(SIG_ALG, ctx.keys.sign, utf8(`rabta-hello|${ctx.id}|${ts}`)))) : '';
  const boards = Object.fromEntries(BOARD_IDS.map(b => [b, boardDigest(ctx.boards[b])]));
  return { t: 'hello', v: 1, id: ctx.id, name: ctx.name, pk: ctx.pk, dh: ctx.dh, pos: ctx.pos, ts, proof, sv: summaryOf(ctx.core), boards };
}

async function checkHello(f) {
  if (!f.pk || (await idFromPub(f.pk)) !== f.id) return false;
  try {
    const key = await importPub(f.pk);
    return await crypto.subtle.verify(SIG_ALG, key, fromB64u(f.proof || ''), utf8(`rabta-hello|${f.id}|${f.ts}`));
  } catch {
    return false;
  }
}

/** Start the protocol on a link for one node. Both ends call this; the exchange is symmetric. */
function openSession(ctx, link) {
  const s = { id: uid('s'), ctx, link, peer: null, view: null, open: true, started: Date.now(), last: Date.now(), bytesIn: 0, bytesOut: 0, framesIn: 0, framesOut: 0, sent: 0, got: 0, rtt: null, pings: new Map() };
  ctx.sessions.add(s);
  link.onframe = text => sessionRecv(s, text);
  link.onclose = () => sessionClosed(s);
  helloFrame(ctx).then(f => sessionSend(s, f));
  hook(ctx, 'session', s, 'open');
  return s;
}

function sessionSend(s, frame) {
  if (!s.open) return;
  const text = JSON.stringify(frame);
  s.bytesOut += byteLen(text);
  s.framesOut++;
  try {
    s.link.send(text);
  } catch (e) {
    hook(s.ctx, 'linkError', s, e);
  }
  hook(s.ctx, 'frame', s, 'out', frame, text.length);
}

async function sessionRecv(s, text) {
  if (!s.open) return;
  let f;
  try {
    f = JSON.parse(text);
  } catch {
    return;
  }
  s.bytesIn += byteLen(text);
  s.framesIn++;
  s.last = Date.now();
  hook(s.ctx, 'frame', s, 'in', f, text.length);
  if (f.t === 'hello') await onHello(s, f);
  else if (f.t === 'msg') await onMsgFrame(s, f);
  else if (f.t === 'board') onBoardFrame(s, f);
  else if (f.t === 'sv' && s.peer) {
    s.view = peerView(s.peer.id, f.sv);
    flushSession(s);
  } else if (f.t === 'ping') sessionSend(s, { t: 'pong', n: f.n, ts: f.ts });
  else if (f.t === 'pong') onPong(s, f);
  else if (f.t === 'bye') closeSession(s, 'peer');
}

async function onHello(s, f) {
  if (s.peer) return;
  if (!(await checkHello(f))) {
    hook(s.ctx, 'rejected', s, 'identity');
    return closeSession(s, 'identity');
  }
  s.peer = { id: f.id, name: f.name, pk: f.pk, dh: f.dh, pos: f.pos };
  s.view = peerView(f.id, f.sv);
  hook(s.ctx, 'peer', s, f);
  flushSession(s);
  for (const b of BOARD_IDS) {
    if (f.boards?.[b] !== boardDigest(s.ctx.boards[b])) sessionSend(s, { t: 'board', b, state: s.ctx.boards[b] });
  }
}

/** Push every entry the peer is missing, under the node's routing strategy, SOS first. */
function flushSession(s) {
  if (!s.open || !s.peer || !s.view) return 0;
  const ctx = s.ctx;
  const plan = planTransfer(ctx.strategy, ctx.core, s.view, Date.now());
  for (const e of plan) {
    const give = copiesFor(ctx.strategy, e, s.view);
    sessionSend(s, { t: 'msg', m: e.m, path: e.path, copies: give });
    noteSent(ctx.strategy, ctx.core, s.view, e, give);
    e.out = (e.out || 0) + 1;
    s.sent++;
  }
  if (plan.length) hook(ctx, 'flushed', s, plan.length);
  return plan.length;
}

async function onMsgFrame(s, f) {
  const ctx = s.ctx;
  const m = f.m;
  if (!m || !m.id || !Array.isArray(f.path)) return;
  if (s.view) s.view.has.add(m.id);
  if (ctx.core.store.has(m.id)) {
    ctx.core.stats.dup++;
    return;
  }
  const verdict = await verifyMsg(m);
  if (verdict === 'bad') return hook(ctx, 'rejected', s, 'signature', m);
  const res = storeAccept(ctx.core, m, [...f.path, ctx.id], Date.now(), f.copies || 1);
  if (res !== 'stored') return;
  const entry = ctx.core.store.get(m.id);
  entry.verified = verdict;
  entry.via = s.link.kind;
  s.got++;
  afterStored(ctx, entry, s);
}

/** Shared by every way a message can arrive: apply board deltas, record SOS reach, notify, gossip on. */
function afterStored(ctx, entry, s = null) {
  const m = entry.m;
  if (m.kind === 'board' && m.body?.b && m.body.d) mergeBoard(ctx, m.body.b, m.body.d, m.from);
  if (m.kind === 'sos' && m.from !== ctx.id && m.body?.inc && !ctx.passive) recordReach(ctx, m, entry.path.length - 1);
  hook(ctx, 'stored', entry, s);
  for (const other of ctx.sessions) if (other !== s) flushSession(other);
}

function mergeBoard(ctx, b, state, from = '') {
  if (!ctx.boards[b]) return false;
  const conflicts = [];
  const before = boardDigest(ctx.boards[b]);
  ctx.boards[b] = boardMerge(ctx.boards[b], state, conflicts);
  const latest = latestStamp(state);
  if (latest) ctx.clock.recv(latest);
  const changed = boardDigest(ctx.boards[b]) !== before;
  if (changed || conflicts.length) hook(ctx, 'board', b, conflicts, from);
  return changed;
}

function onBoardFrame(s, f) {
  if (!BOARD_IDS.includes(f.b) || !f.state?.items) return;
  mergeBoard(s.ctx, f.b, f.state, s.peer?.id);
  if (boardDigest(s.ctx.boards[f.b]) !== boardDigest(f.state)) sessionSend(s, { t: 'board', b: f.b, state: s.ctx.boards[f.b] });
}

// Every node that stores an SOS adds itself to the incident's reach (a field only it ever writes).
function recordReach(ctx, m, hops) {
  const delta = boardSetDelta(ctx.boards.incidents, ctx.clock, m.body.inc, { ['seen_' + ctx.id]: { h: hops, at: Date.now(), n: ctx.name } });
  ctx.boards.incidents = boardMerge(ctx.boards.incidents, delta);
  publishBoard(ctx, 'incidents', delta, 1);
}

/** Wrap a board delta as a signed broadcast so it also travels store-and-forward to peers met later. */
async function publishBoard(ctx, b, delta, prio = 0) {
  const m = await createMsg(ctx, { kind: 'board', ch: '#boards', body: { b, d: delta }, prio, ttlH: 72, hl: 16 });
  hook(ctx, 'board', b, [], ctx.id);
  return m;
}

/** Create, sign, store and gossip a message from this node. */
async function createMsg(ctx, { kind, ch, to = null, body, prio = 0, ttlH = 24, hl = 8, encryptFor = null }) {
  const ts = Math.floor(Date.now() / 1000) * 1000;
  const m = { v: 1, id: randomHex(8), kind, ch, from: ctx.id, name: ctx.name, to, ts, exp: ts + ttlH * 36e5, hl, prio, body, enc: null, pk: ctx.pk };
  if (encryptFor) {
    m.enc = await encryptBody(body, ctx.keys, encryptFor, m.id);
    m.body = null;
  }
  if (ctx.keys) await signMsg(m, ctx.keys);
  storeAccept(ctx.core, m, [ctx.id], Date.now(), ROUTER_COPIES);
  const entry = ctx.core.store.get(m.id);
  entry.verified = ctx.keys ? 'ok' : 'none';
  entry.via = 'self';
  afterStored(ctx, entry);
  return m;
}
const ROUTER_COPIES = 8;

function pingSession(s) {
  const n = Math.floor(Math.random() * 1e9);
  s.pings.set(n, performance.now());
  sessionSend(s, { t: 'ping', n, ts: Date.now() });
}

function onPong(s, f) {
  const t0 = s.pings.get(f.n);
  if (t0 == null) return;
  s.pings.delete(f.n);
  s.rtt = performance.now() - t0;
  hook(s.ctx, 'rtt', s, s.rtt);
}

function closeSession(s, why = 'local') {
  if (!s.open) return;
  if (why === 'local') sessionSend(s, { t: 'bye' });
  s.open = false;
  s.ctx.sessions.delete(s);
  try {
    s.link.close();
  } catch {
    /* already closed */
  }
  hook(s.ctx, 'session', s, 'closed', why);
}

function sessionClosed(s) {
  if (s.open) closeSession(s, 'link');
}

// ---------- in-memory link pair (demo village encounters and protocol tests) ----------
function memoryLinks(kind = 'demo', delay = 12) {
  const a = { kind, label: kind, open: true };
  const b = { kind, label: kind, open: true };
  const wire = (from, to) => {
    from.send = text => from.open && setTimeout(() => to.open && to.onframe && to.onframe(text), delay);
    from.close = () => {
      from.open = false;
      to.open = false;
      setTimeout(() => to.onclose && to.onclose(), delay);
    };
  };
  wire(a, b);
  wire(b, a);
  return [a, b];
}

/** Run a short encounter between two nodes until the link goes quiet, then hang up. */
function encounter(ctxA, ctxB, { kind = 'demo', quietMs = 260, maxMs = 6000 } = {}) {
  return new Promise(resolve => {
    const [la, lb] = memoryLinks(kind);
    const sa = openSession(ctxA, la);
    const sb = openSession(ctxB, lb);
    const t0 = Date.now();
    const timer = setInterval(() => {
      const quiet = Date.now() - Math.max(sa.last, sb.last) > quietMs;
      if (!(quiet || Date.now() - t0 > maxMs)) return;
      clearInterval(timer);
      const result = { sent: sa.sent, got: sa.got, bytes: sa.bytesIn + sa.bytesOut, ms: Date.now() - t0 };
      closeSession(sa);
      resolve(result);
    }, 60);
  });
}

// ---------- serverless WebRTC: SDP compressed into a short connection code ----------
// With iceServers: [] the browser gathers host candidates only (often mDNS names like
// 7608e638-….local), so both devices must share one Wi-Fi network or hotspot. The code keeps only what
// the other side cannot guess: ICE ufrag/password, the DTLS fingerprint, the setup role and the candidates.
const HAS_RTC = typeof RTCPeerConnection === 'function';
const ICE64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
const SETUP_ROLES = ['actpass', 'active', 'passive'];
const CAND_TYPES = ['host', 'srflx', 'prflx', 'relay'];
const TCP_TYPES = ['', 'active', 'passive', 'so'];
const CODE_PREFIX = 'RB';

function sdpParse(sdp) {
  const get = re => (sdp.match(re) || [])[1] || '';
  const candRe = /a=candidate:\S+ (\d+) (udp|tcp) \d+ (\S+) (\d+) typ (\w+)(?: raddr \S+ rport \d+)?(?: tcptype (\w+))?/gi;
  const cands = [...sdp.matchAll(candRe)].filter(m => m[1] === '1').map(m => ({ proto: m[2].toLowerCase(), addr: m[3], port: Number(m[4]), typ: m[5], tcptype: m[6] || '' }));
  return { ufrag: get(/a=ice-ufrag:(\S+)/), pwd: get(/a=ice-pwd:(\S+)/), fp: fromHex(get(/a=fingerprint:sha-256 ([0-9A-Fa-f:]+)/)), setup: get(/a=setup:(\w+)/), cands };
}

// ICE ufrag/pwd use only base64 characters, so each costs 6 bits instead of 8.
function packIce(w, s) {
  w.u8(s.length);
  let acc = 0;
  let bits = 0;
  for (const ch of s) {
    acc = ((acc << 6) | Math.max(0, ICE64.indexOf(ch))) & 0xfff;
    bits += 6;
    if (bits >= 8) {
      w.u8(acc >>> (bits - 8));
      bits -= 8;
    }
  }
  if (bits) w.u8(acc << (8 - bits));
}

function unpackIce(r) {
  const n = r.u8();
  const bytes = r.bytes(Math.ceil((n * 6) / 8));
  let acc = 0;
  let bits = 0;
  let out = '';
  for (const b of bytes) {
    acc = ((acc << 8) | b) & 0xffff;
    bits += 8;
    while (bits >= 6 && out.length < n) {
      out += ICE64[(acc >>> (bits - 6)) & 63];
      bits -= 6;
    }
  }
  return out;
}

function ipv6Bytes(addr) {
  const [head, tail = ''] = addr.split('::');
  const h = head ? head.split(':') : [];
  const tl = tail ? tail.split(':') : [];
  const groups = addr.includes('::') ? [...h, ...Array(8 - h.length - tl.length).fill('0'), ...tl] : h;
  return Uint8Array.from(groups.flatMap(g => [parseInt(g, 16) >> 8, parseInt(g, 16) & 255]));
}

// Address kinds: 0 IPv4 (4 bytes), 1 IPv6 (16), 2 mDNS UUID name (16), 3 other host name (text).
function packAddr(w, addr) {
  if (/^\d+\.\d+\.\d+\.\d+$/.test(addr)) {
    w.bytes(addr.split('.').map(Number));
    return 0;
  }
  if (addr.includes(':')) {
    w.bytes(ipv6Bytes(addr));
    return 1;
  }
  if (/^[0-9a-f-]{36}\.local$/i.test(addr)) {
    w.bytes(fromHex(addr.slice(0, 36)));
    return 2;
  }
  w.str(addr);
  return 3;
}

function unpackAddr(r, kind) {
  if (kind === 0) return [...r.bytes(4)].join('.');
  if (kind === 1) return toHex(r.bytes(16)).match(/.{4}/g).join(':');
  if (kind === 2) return toHex(r.bytes(16)).replace(/^(.{8})(.{4})(.{4})(.{4})(.{12})$/, '$1-$2-$3-$4-$5') + '.local';
  return r.str();
}

/** Session description → compact bytes (≈ 75–110 bytes for one or two candidates) with a CRC-16. */
function packSdp(desc) {
  const info = sdpParse(desc.sdp);
  const w = new ByteWriter().u8(0x10 | (desc.type === 'answer' ? 1 : 0)).u8(Math.max(0, SETUP_ROLES.indexOf(info.setup)));
  packIce(w, info.ufrag);
  packIce(w, info.pwd);
  w.bytes(info.fp);
  const cands = info.cands.slice(0, 6);
  w.u8(cands.length);
  for (const c of cands) {
    const body = new ByteWriter();
    const kind = packAddr(body, c.addr);
    const flags = kind | (c.proto === 'tcp' ? 4 : 0) | (Math.max(0, TCP_TYPES.indexOf(c.tcptype)) << 3) | (Math.max(0, CAND_TYPES.indexOf(c.typ)) << 5);
    w.u8(flags).u16(c.port).bytes(body.out());
  }
  const bytes = w.out();
  const crc = crc16(bytes);
  return concatBytes(bytes, Uint8Array.of(crc >> 8, crc & 255));
}

function unpackSdp(bytes) {
  const crc = (bytes[bytes.length - 2] << 8) | bytes[bytes.length - 1];
  const body = bytes.slice(0, -2);
  if (bytes.length < 40 || crc16(body) !== crc) throw new Error('crc');
  const r = new ByteReader(body);
  const head = r.u8();
  if (head >> 4 !== 1) throw new Error('version');
  const info = { type: head & 1 ? 'answer' : 'offer', setup: SETUP_ROLES[r.u8()] || 'actpass' };
  info.ufrag = unpackIce(r);
  info.pwd = unpackIce(r);
  info.fp = r.bytes(32);
  info.cands = [];
  for (let n = r.u8(); n > 0; n--) {
    const flags = r.u8();
    const port = r.u16();
    info.cands.push({ addr: unpackAddr(r, flags & 3), port, proto: flags & 4 ? 'tcp' : 'udp', tcptype: TCP_TYPES[(flags >> 3) & 3], typ: CAND_TYPES[(flags >> 5) & 3] });
  }
  return info;
}

// RFC 5245 priority: type preference (host 126) · local preference · component.
const candPriority = (c, i) => 2 ** 24 * (c.typ === 'host' ? (c.proto === 'tcp' ? 90 : 126) : 100) + 2 ** 8 * (65535 - i) + 255;

/** Rebuild a complete data-channel SDP the browser accepts from the compact fields. */
function sdpBuild(info) {
  const fp = toHex(info.fp).toUpperCase().match(/.{2}/g).join(':');
  const lines = ['v=0', `o=- ${Date.now()}${Math.floor(Math.random() * 1000)} 2 IN IP4 127.0.0.1`, 's=-', 't=0 0', 'a=group:BUNDLE 0', 'a=msid-semantic: WMS', 'm=application 9 UDP/DTLS/SCTP webrtc-datachannel', 'c=IN IP4 0.0.0.0'];
  info.cands.forEach((c, i) => {
    const rel = c.typ === 'host' ? '' : ' raddr 0.0.0.0 rport 0';
    lines.push(`a=candidate:${i + 1} 1 ${c.proto} ${candPriority(c, i)} ${c.addr} ${c.port} typ ${c.typ}${rel}${c.tcptype ? ' tcptype ' + c.tcptype : ''}`);
  });
  lines.push(`a=ice-ufrag:${info.ufrag}`, `a=ice-pwd:${info.pwd}`, `a=fingerprint:sha-256 ${fp}`, `a=setup:${info.setup}`, 'a=mid:0', 'a=sctp-port:5000', 'a=max-message-size:262144');
  return lines.join('\r\n') + '\r\n';
}

const codeFromDesc = desc => CODE_PREFIX + base32(packSdp(desc));

function descFromCode(code) {
  const clean = String(code).toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!clean.startsWith(CODE_PREFIX)) throw new Error('prefix');
  const info = unpackSdp(fromBase32(clean.slice(CODE_PREFIX.length)));
  return { type: info.type, sdp: sdpBuild(info), info };
}

// Wait for ICE gathering: done when the browser says so, or 0.5 s after the last candidate (host
// candidates arrive at once; "complete" can lag by seconds while other interfaces time out).
function gatherDone(pc, ms = 4000) {
  return new Promise(resolve => {
    if (pc.iceGatheringState === 'complete') return resolve(true);
    let quiet = 0;
    const finish = ok => {
      clearTimeout(hard);
      clearTimeout(quiet);
      resolve(ok);
    };
    const hard = setTimeout(() => finish(false), ms);
    pc.addEventListener('icecandidate', e => {
      if (!e.candidate) return finish(true);
      clearTimeout(quiet);
      quiet = setTimeout(() => finish(true), 500);
    });
    pc.addEventListener('icegatheringstatechange', () => pc.iceGatheringState === 'complete' && finish(true));
  });
}

// ---------- connection manager: offer → code ⇄ code ← answer, then the Rabta protocol on the data channel ----------
const RTC = { conns: [] };
const RTC_CONNECT_TIMEOUT = 45000;

function rtcLog(c, k, vars = {}) {
  c.log.push({ ts: Date.now(), k, vars });
  hook(ME, 'rtc', c);
}

function newConn(role) {
  const c = { id: uid('c'), role, pc: null, dc: null, state: 'new', code: '', log: [], created: Date.now(), session: null, rawSdp: 0 };
  RTC.conns.unshift(c);
  RTC.conns.length = Math.min(RTC.conns.length, 8);
  return c;
}

function wirePc(c) {
  c.pc.onconnectionstatechange = () => {
    rtcLog(c, 'rl_pcState', { s: c.pc.connectionState });
    if (c.pc.connectionState === 'failed') setConnState(c, 'failed');
    if (c.pc.connectionState === 'disconnected' || c.pc.connectionState === 'closed') setConnState(c, 'closed');
  };
  c.pc.onicecandidate = e => e.candidate && rtcLog(c, 'rl_cand', { c: e.candidate.candidate.split(' ').slice(4, 8).join(' ') });
  c.pc.ondatachannel = e => wireDc(c, e.channel);
}

function setConnState(c, state) {
  if (c.state === state) return;
  c.state = state;
  rtcLog(c, 'rl_state', { s: state });
}

function wireDc(c, dc) {
  c.dc = dc;
  const link = { kind: 'rtc', label: 'WebRTC', send: text => dc.readyState === 'open' && dc.send(text), close: () => rtcClose(c) };
  dc.onopen = () => {
    setConnState(c, 'connected');
    c.connectedAt = Date.now();
    c.session = openSession(ME, link);
  };
  dc.onmessage = e => link.onframe && link.onframe(e.data);
  dc.onclose = () => {
    setConnState(c, 'closed');
    if (link.onclose) link.onclose();
  };
}

async function rtcCreateOffer() {
  const c = newConn('offer');
  c.pc = new RTCPeerConnection({ iceServers: [] });
  wirePc(c);
  wireDc(c, c.pc.createDataChannel('rabta', { ordered: true }));
  setConnState(c, 'gathering');
  await c.pc.setLocalDescription(await c.pc.createOffer());
  await gatherDone(c.pc);
  c.rawSdp = c.pc.localDescription.sdp.length;
  c.code = codeFromDesc(c.pc.localDescription);
  setConnState(c, 'waiting');
  return c;
}

async function rtcAcceptOffer(code) {
  const desc = descFromCode(code);
  if (desc.type !== 'offer') throw new Error('notOffer');
  const c = newConn('answer');
  c.pc = new RTCPeerConnection({ iceServers: [] });
  wirePc(c);
  rtcLog(c, 'rl_remote', { n: desc.info.cands.length });
  await c.pc.setRemoteDescription({ type: 'offer', sdp: desc.sdp });
  setConnState(c, 'gathering');
  await c.pc.setLocalDescription(await c.pc.createAnswer());
  await gatherDone(c.pc);
  c.rawSdp = c.pc.localDescription.sdp.length;
  c.code = codeFromDesc(c.pc.localDescription);
  setConnState(c, 'connecting');
  rtcWatchdog(c);
  return c;
}

async function rtcApplyAnswer(c, code) {
  const desc = descFromCode(code);
  if (desc.type !== 'answer') throw new Error('notAnswer');
  rtcLog(c, 'rl_remote', { n: desc.info.cands.length });
  await c.pc.setRemoteDescription({ type: 'answer', sdp: desc.sdp });
  setConnState(c, 'connecting');
  rtcWatchdog(c);
}

function rtcWatchdog(c) {
  setTimeout(() => {
    if (c.state === 'connecting') setConnState(c, 'failed');
  }, RTC_CONNECT_TIMEOUT);
}

function rtcClose(c) {
  if (c.session) closeSession(c.session);
  try {
    if (c.dc) c.dc.close();
    if (c.pc) c.pc.close();
  } catch {
    /* already closed */
  }
  setConnState(c, 'closed');
}

// ---------- same-device tabs over BroadcastChannel (each tab opened with ?node=B, C… is its own node) ----------
const HAS_BC = typeof BroadcastChannel === 'function';
const TAB_ID = randomHex(4);
const TABNET = { bc: null, links: new Map(), on: false, twin: false, timer: 0 };
const TAB_TIMEOUT = 15000;

function tabsStart() {
  if (!HAS_BC || TABNET.on) return false;
  TABNET.bc = new BroadcastChannel('rabta-mesh-v1');
  TABNET.bc.onmessage = e => tabsRecv(e.data || {});
  TABNET.on = true;
  tabsAnnounce();
  TABNET.timer = setInterval(tabsHeartbeat, 5000);
  return true;
}

function tabsStop() {
  if (!TABNET.on) return;
  TABNET.bc.postMessage({ t: 'gone', id: ME.id, tab: TAB_ID });
  for (const link of TABNET.links.values()) link.session && closeSession(link.session);
  TABNET.links.clear();
  clearInterval(TABNET.timer);
  TABNET.bc.close();
  TABNET.on = false;
}

const tabsAnnounce = () => TABNET.bc.postMessage({ t: 'here', id: ME.id, name: ME.name, slot: SLOT, tab: TAB_ID });

function tabsHeartbeat() {
  tabsAnnounce();
  for (const [id, link] of TABNET.links) {
    if (Date.now() - link.seen < TAB_TIMEOUT) continue;
    TABNET.links.delete(id);
    if (link.session) closeSession(link.session, 'timeout');
  }
}

function tabsRecv(d) {
  if (d.id === ME.id) {
    if (d.tab !== TAB_ID && d.t === 'here') TABNET.twin = true;
    return;
  }
  if (d.t === 'gone') return tabsDrop(d.id);
  if (d.t === 'here' && !TABNET.links.has(d.id)) tabsConnect(d);
  const link = TABNET.links.get(d.id) || TABNET.links.get(d.from);
  if (link) link.seen = Date.now();
  if (d.t === 'frame' && d.to === ME.id) {
    const l = TABNET.links.get(d.from) || tabsConnect({ id: d.from, slot: '?', tab: '' });
    if (l.onframe) l.onframe(d.data);
  }
}

function tabsConnect(d) {
  const link = {
    kind: 'tab',
    label: 'Tab ' + d.slot,
    seen: Date.now(),
    send: text => TABNET.on && TABNET.bc.postMessage({ t: 'frame', from: ME.id, to: d.id, data: text }),
    close: () => TABNET.links.delete(d.id),
  };
  TABNET.links.set(d.id, link);
  tabsAnnounce();
  link.session = openSession(ME, link);
  return link;
}

function tabsDrop(id) {
  const link = TABNET.links.get(id);
  if (!link) return;
  TABNET.links.delete(id);
  if (link.session) closeSession(link.session, 'peer');
}

/** Open another node of this app in a new tab (its own identity and store under rabta.<slot>.). */
function openSecondNode() {
  const used = new Set([SLOT, ...[...TABNET.links.values()].map(l => l.label.slice(4))]);
  const slot = ['B', 'C', 'D', 'E', 'A'].find(x => !used.has(x)) || 'B';
  const url = location.pathname + (slot === 'A' ? '' : '?node=' + slot) + '#chats';
  window.open(url, '_blank');
}

// ---------- in-page loopback: two real RTCPeerConnections, the codec, the data channel and the protocol ----------
function waitOpen(dc, ms) {
  return new Promise((resolve, reject) => {
    if (dc.readyState === 'open') return resolve();
    const timer = setTimeout(() => reject(new Error('timeout')), ms);
    dc.addEventListener('open', () => {
      clearTimeout(timer);
      resolve();
    });
  });
}

async function lbConnect(a, b, rep, step) {
  const dc = a.createDataChannel('selftest', { ordered: true });
  const remote = new Promise(r => (b.ondatachannel = e => r(e.channel)));
  const t0 = performance.now();
  await a.setLocalDescription(await a.createOffer());
  await gatherDone(a);
  const offer = codeFromDesc(a.localDescription);
  const d1 = descFromCode(offer);
  const same = d1.info.ufrag === sdpParse(a.localDescription.sdp).ufrag && toHex(d1.info.fp) === toHex(sdpParse(a.localDescription.sdp).fp);
  step('lb_codec', same, { raw: a.localDescription.sdp.length, code: offer.length, qr: QR.encode(offer, { ecc: 'L' }).version, cands: d1.info.cands.length });
  await b.setRemoteDescription({ type: 'offer', sdp: d1.sdp });
  await b.setLocalDescription(await b.createAnswer());
  await gatherDone(b);
  const d2 = descFromCode(codeFromDesc(b.localDescription));
  await a.setRemoteDescription({ type: 'answer', sdp: d2.sdp });
  await waitOpen(dc, 10000);
  const echo = await remote;
  step('lb_open', true, { ms: Math.round(performance.now() - t0) });
  return { dc, echo };
}

async function lbPings(dc, echo, n = 20) {
  echo.onmessage = e => typeof e.data === 'string' && echo.send(e.data);
  const rtts = [];
  for (let i = 0; i < n; i++) {
    const t0 = performance.now();
    await new Promise(r => {
      dc.onmessage = () => r();
      dc.send('ping' + i);
    });
    rtts.push(performance.now() - t0);
  }
  return rtts;
}

async function lbThroughput(dc, echo, total = 1 << 21) {
  const chunk = 16384;
  const got = [];
  const done = new Promise(r => (echo.onmessage = e => (typeof e.data === 'string' ? r() : got.push(new Uint8Array(e.data)))));
  const sent = [];
  const t0 = performance.now();
  for (let off = 0; off < total; off += chunk) {
    const part = randomBytes(chunk);
    sent.push(part);
    while (dc.bufferedAmount > 1 << 20) await new Promise(r => setTimeout(r, 5));
    dc.send(part);
  }
  dc.send('end');
  await done;
  const ms = performance.now() - t0;
  const same = toHex(await sha256(concatBytes(...sent))) === toHex(await sha256(concatBytes(...got)));
  return { mbps: (total * 8) / 1e6 / (ms / 1000), ms, same };
}

// The protocol itself over the real data channel: a throwaway twin identity receives this node's store.
async function lbProtocol(dc, echo) {
  const ident = await newIdentity('Loopback twin');
  const twin = makeNodeCtx(ident, await loadKeys(ident));
  twin.passive = true;
  const linkA = { kind: 'selftest', label: 'loopback', send: x => dc.readyState === 'open' && dc.send(x), close: () => {} };
  const linkB = { kind: 'selftest', label: 'loopback', send: x => echo.readyState === 'open' && echo.send(x), close: () => {} };
  dc.onmessage = e => linkA.onframe && linkA.onframe(e.data);
  echo.onmessage = e => linkB.onframe && linkB.onframe(e.data);
  const sMe = openSession(ME, linkA);
  const sTwin = openSession(twin, linkB);
  const expected = planTransfer(ME.strategy, ME.core, peerView('x', { ids: [] }), Date.now()).length;
  const t0 = Date.now();
  while (Date.now() - t0 < 8000 && twin.core.store.size < expected) await new Promise(r => setTimeout(r, 50));
  ME.sessions.delete(sMe);
  sMe.open = false;
  sTwin.open = false;
  const verified = [...twin.core.store.values()].filter(e => e.verified === 'ok').length;
  return { expected, got: twin.core.store.size, verified };
}

async function loopbackTest(onStep = () => {}) {
  const rep = { steps: [], ok: false, started: Date.now() };
  const step = (k, ok, vars = {}) => {
    rep.steps.push({ k, ok, vars });
    onStep(rep);
  };
  if (!HAS_RTC) {
    step('lb_noRtc', false);
    return rep;
  }
  const a = new RTCPeerConnection({ iceServers: [] });
  const b = new RTCPeerConnection({ iceServers: [] });
  try {
    const { dc, echo } = await lbConnect(a, b, rep, step);
    const rtts = await lbPings(dc, echo);
    step('lb_rtt', true, { mean: (rtts.reduce((x, y) => x + y, 0) / rtts.length).toFixed(2), min: Math.min(...rtts).toFixed(2) });
    const tp = await lbThroughput(dc, echo);
    step('lb_tput', tp.same, { mbps: tp.mbps.toFixed(1), mb: 2 });
    const pr = await lbProtocol(dc, echo);
    step('lb_proto', pr.got >= pr.expected && pr.verified === pr.got, pr);
    rep.ok = rep.steps.every(s => s.ok);
  } catch (e) {
    step('lb_fail', false, { e: String(e.message || e) });
  } finally {
    a.close();
    b.close();
  }
  rep.ms = Date.now() - rep.started;
  return rep;
}

// ---------- data over sound: binary FSK modem (WebAudio out, Goertzel filters in) ----------
// Frame: 24-bit 1010… preamble · 16-bit sync word 0x2DD4 · length byte · payload (≤ 64 bytes) · CRC-16.
// Bits are sent MSB first at 100 baud: 1600 Hz for 0, 2600 Hz for 1, continuous phase, soft edges.
const FSK = { baud: 100, f0: 1600, f1: 2600, preamble: 24, sync: 0x2dd4, maxLen: 64, amp: 0.6 };
const FSK_SYNC_BITS = 24;

function pushByte(bits, b) {
  for (let i = 7; i >= 0; i--) bits.push((b >> i) & 1);
}

// TODO(student): add forward error correction (Hamming(7,4) or Reed–Solomon) with bit interleaving so a
// burst of noise (a door slam) costs a few corrected bits instead of the whole frame.
function fskFrameBits(payload) {
  if (payload.length > FSK.maxLen) throw new Error('too long');
  const bits = [];
  for (let i = 0; i < FSK.preamble; i++) bits.push(i % 2 ? 0 : 1);
  pushByte(bits, FSK.sync >> 8);
  pushByte(bits, FSK.sync & 255);
  const body = concatBytes(Uint8Array.of(payload.length), payload);
  const crc = crc16(body);
  for (const b of body) pushByte(bits, b);
  pushByte(bits, crc >> 8);
  pushByte(bits, crc & 255);
  return bits;
}

/** Continuous-phase FSK samples with a 4 ms fade in and out (no clicks), plus silence around the frame. */
function fskModulate(bits, fs, { lead = 0.25, tail = 0.2 } = {}) {
  const spb = Math.round(fs / FSK.baud);
  const start = Math.round(lead * fs);
  const total = bits.length * spb;
  const out = new Float32Array(start + total + Math.round(tail * fs));
  const ramp = Math.round(0.004 * fs);
  let phase = 0;
  for (let i = 0; i < bits.length; i++) {
    const w = (2 * Math.PI * (bits[i] ? FSK.f1 : FSK.f0)) / fs;
    for (let k = 0; k < spb; k++) {
      const idx = i * spb + k;
      const env = Math.min(1, idx / ramp, (total - idx) / ramp);
      out[start + idx] = FSK.amp * env * Math.sin(phase);
      phase += w;
    }
    phase %= 2 * Math.PI;
  }
  return out;
}

const fskEncode = (text, fs) => fskModulate(fskFrameBits(utf8(text)), fs);
const fskSeconds = bytes => (FSK.preamble + 16 + 8 * (bytes + 3)) / FSK.baud + 0.45;

// White Gaussian noise at a chosen signal-to-noise ratio (signal power measured where the tone is on).
function addNoise(samples, snrDb, seed = 1) {
  const r = rng(seed);
  let power = 0;
  let n = 0;
  for (const x of samples) {
    if (x === 0) continue;
    power += x * x;
    n++;
  }
  const sigma = Math.sqrt((n ? power / n : 0.05) / 10 ** (snrDb / 10));
  const gauss = () => Math.sqrt(-2 * Math.log(r() || 1e-12)) * Math.cos(2 * Math.PI * r());
  return samples.map(x => x + sigma * gauss());
}

/** Goertzel power of one frequency over x[start … start+N). coeff = 2·cos(2π·f/fs). */
function goertzel(x, start, N, coeff) {
  let s1 = 0;
  let s2 = 0;
  for (let i = 0; i < N; i++) {
    const s = x[start + i] + coeff * s1 - s2;
    s2 = s1;
    s1 = s;
  }
  return s1 * s1 + s2 * s2 - coeff * s1 * s2;
}

// Soft decisions every 1/8 symbol: d = (P1 − P0) / (P1 + P0) in [−1, 1], e = P0 + P1.
function fskSoft(x, fs) {
  const spb = Math.round(fs / FSK.baud);
  const hop = Math.max(1, Math.floor(spb / 8));
  const c0 = 2 * Math.cos((2 * Math.PI * FSK.f0) / fs);
  const c1 = 2 * Math.cos((2 * Math.PI * FSK.f1) / fs);
  const W = Math.max(0, Math.floor((x.length - spb) / hop) + 1);
  const d = new Float32Array(W);
  const e = new Float32Array(W);
  for (let w = 0; w < W; w++) {
    const p0 = goertzel(x, w * hop, spb, c0);
    const p1 = goertzel(x, w * hop, spb, c1);
    e[w] = p0 + p1;
    d[w] = (p1 - p0) / (p1 + p0 + 1e-12);
  }
  return { d, e, hop, spb };
}

// The last 8 preamble bits plus the sync word, as ±1, for correlation.
function syncPattern() {
  const bits = [1, 0, 1, 0, 1, 0, 1, 0];
  pushByte(bits, FSK.sync >> 8);
  pushByte(bits, FSK.sync & 255);
  return bits.map(b => (b ? 1 : -1));
}

/** Slide the sync pattern over every 1/8-symbol offset; the best correlation gives timing and phase. */
function fskFindSync(d) {
  const pat = syncPattern();
  let best = { w: -1, score: 0 };
  for (let w = 0; w + 8 * (pat.length + 8) < d.length; w++) {
    let score = 0;
    for (let i = 0; i < pat.length; i++) score += pat[i] * d[w + 8 * i];
    if (score > best.score) best = { w, score };
  }
  return best.score > 0.5 * pat.length ? best : null;
}

function readBytes(d, w0, n) {
  const out = new Uint8Array(n);
  for (let b = 0; b < n; b++) {
    let v = 0;
    for (let i = 0; i < 8; i++) v = (v << 1) | (d[w0 + 8 * (b * 8 + i)] > 0 ? 1 : 0);
    out[b] = v;
  }
  return out;
}

/** Decode one frame from raw samples. Returns { ok, text, bytes, crcOk, at (s), snr (dB), reason }. */
function fskDecode(x, fs) {
  const { d, e, hop } = fskSoft(x, fs);
  const sync = fskFindSync(d);
  if (!sync) return { ok: false, reason: 'nosync' };
  const w0 = sync.w + 8 * FSK_SYNC_BITS;
  if (w0 + 8 * 8 >= d.length) return { ok: false, reason: 'short' };
  const len = readBytes(d, w0, 1)[0];
  if (len > FSK.maxLen || w0 + 8 * 8 * (len + 3) > d.length) return { ok: false, reason: 'length' };
  const body = readBytes(d, w0, len + 3);
  const crcOk = crc16(body.slice(0, len + 1)) === ((body[len + 1] << 8) | body[len + 2]);
  const bytes = body.slice(1, len + 1);
  const noise = [...e.slice(0, Math.max(1, sync.w - 8 * 24))].sort((a, b) => a - b);
  const floor = noise[Math.floor(noise.length / 2)] || 1e-9;
  const snr = 10 * Math.log10(e[w0] / floor);
  const end = (w0 + 8 * 8 * (len + 3)) * hop;
  return { ok: crcOk, crcOk, bytes, text: crcOk ? fromUtf8(bytes) : '', at: (sync.w * hop) / fs, end, snr, len, reason: crcOk ? '' : 'crc' };
}

/** Coarse spectrogram for the waterfall: rows of Goertzel power for 24 bins from 1 to 3.3 kHz. */
function spectrogram(x, fs, cols = 240) {
  const N = Math.round(fs / FSK.baud);
  const step = Math.max(1, Math.floor((x.length - N) / cols));
  const bins = Array.from({ length: 24 }, (_, i) => 2 * Math.cos((2 * Math.PI * (1000 + i * 100)) / fs));
  const out = [];
  for (let s = 0; s + N <= x.length && out.length < cols; s += step) out.push(bins.map(c => goertzel(x, s, N, c)));
  return out;
}

// ---------- protobuf wire format: a generic decoder (no .proto needed) and a small encoder ----------
// Wire types: 0 varint · 1 fixed 64-bit · 2 length-delimited · 5 fixed 32-bit (3/4 are deprecated groups).
const PB_MAX_FIELD = 536870911;

function pbVarint(buf, pos) {
  let v = 0n;
  let shift = 0n;
  for (;;) {
    if (pos >= buf.length) throw new Error('varint runs past the end');
    const b = buf[pos++];
    v |= BigInt(b & 0x7f) << shift;
    if (!(b & 0x80)) return { v, pos };
    shift += 7n;
    if (shift > 63n) throw new Error('varint longer than 10 bytes');
  }
}

function pbTake(buf, pos, n) {
  if (pos + n > buf.length) throw new Error('field runs past the end');
  return buf.slice(pos, pos + n);
}

// Printable UTF-8 (letters, digits, punctuation, spaces, Urdu) is shown as text.
function asPrintable(raw) {
  try {
    const s = new TextDecoder('utf-8', { fatal: true }).decode(raw);
    return /^[\p{L}\p{N}\p{P}\p{S}\p{Zs}\n\r\t]*$/u.test(s) ? s : null;
  } catch {
    return null;
  }
}

function pbLenField(no, raw, depth) {
  const f = { no, wt: 2, kind: 'bytes', raw };
  const text = raw.length ? asPrintable(raw) : null;
  if (raw.length && depth < 6) {
    try {
      f.sub = pbDecode(raw, depth + 1);
    } catch {
      f.sub = null;
    }
  }
  if (text !== null) {
    f.kind = 'string';
    f.text = text;
  } else if (f.sub) {
    f.kind = 'msg';
  }
  return f;
}

/** Decode a buffer into [{ no, wt, kind, v | raw | text | sub }]; throws on malformed input. */
function pbDecode(buf, depth = 0) {
  const out = [];
  let pos = 0;
  while (pos < buf.length) {
    const tag = pbVarint(buf, pos);
    pos = tag.pos;
    const no = Number(tag.v >> 3n);
    const wt = Number(tag.v & 7n);
    if (no < 1 || no > PB_MAX_FIELD) throw new Error('invalid field number ' + no);
    if (wt === 0) {
      const r = pbVarint(buf, pos);
      pos = r.pos;
      out.push({ no, wt, kind: 'varint', v: r.v });
    } else if (wt === 1 || wt === 5) {
      const raw = pbTake(buf, pos, wt === 1 ? 8 : 4);
      pos += raw.length;
      out.push({ no, wt, kind: wt === 1 ? 'i64' : 'i32', raw });
    } else if (wt === 2) {
      const len = pbVarint(buf, pos);
      pos = len.pos;
      const raw = pbTake(buf, pos, Number(len.v));
      pos += raw.length;
      out.push(pbLenField(no, raw, depth));
    } else {
      throw new Error('unsupported wire type ' + wt);
    }
  }
  return out;
}

/** Human readings of a scalar field: unsigned, zigzag-signed, float, etc. */
function pbReadings(f) {
  if (f.kind === 'varint') {
    const zz = (f.v >> 1n) ^ -(f.v & 1n);
    return { uint: f.v.toString(), sint: zz.toString(), bool: f.v <= 1n ? String(f.v === 1n) : '' };
  }
  const dv = new DataView(f.raw.buffer, f.raw.byteOffset, f.raw.length);
  if (f.kind === 'i32') return { fixed32: String(dv.getUint32(0, true)), float: dv.getFloat32(0, true).toPrecision(6), hex: toHex(f.raw) };
  if (f.kind === 'i64') return { fixed64: dv.getBigUint64(0, true).toString(), double: dv.getFloat64(0, true).toPrecision(8) };
  return {};
}

function pbVarintBytes(v) {
  let n = BigInt(v);
  const out = [];
  do {
    let b = Number(n & 0x7fn);
    n >>= 7n;
    if (n) b |= 0x80;
    out.push(b);
  } while (n);
  return out;
}

/** Encode [[no, type, value]] with type varint | fixed32 | float | string | bytes | msg. */
function pbEncode(fields) {
  const out = [];
  for (const [no, type, v] of fields) {
    const wt = { varint: 0, fixed32: 5, float: 5, string: 2, bytes: 2, msg: 2 }[type];
    out.push(...pbVarintBytes((BigInt(no) << 3n) | BigInt(wt)));
    if (type === 'varint') out.push(...pbVarintBytes(v));
    if (type === 'fixed32' || type === 'float') {
      const dv = new DataView(new ArrayBuffer(4));
      if (type === 'float') dv.setFloat32(0, v, true);
      else dv.setUint32(0, v >>> 0, true);
      out.push(...new Uint8Array(dv.buffer));
    }
    if (wt === 2) {
      const raw = type === 'string' ? utf8(v) : type === 'msg' ? pbEncode(v) : v;
      out.push(...pbVarintBytes(raw.length), ...raw);
    }
  }
  return Uint8Array.from(out);
}

// ---------- Meshtastic serial framing: 0x94 0xC3, 2-byte big-endian length, protobuf payload ----------
// Bytes outside frames are the device's debug log (text lines). A bad length resynchronises.
const MT_START1 = 0x94;
const MT_START2 = 0xc3;
const MT_MAX = 512;

class FrameParser {
  constructor() {
    this.state = 0;
    this.len = 0;
    this.buf = [];
    this.text = '';
  }
  push(bytes) {
    const events = [];
    for (const b of bytes) this.step(b, events);
    return events;
  }
  logByte(b, events) {
    if (b === 10) {
      if (this.text.trim()) events.push({ type: 'log', text: this.text.replace(/\x1b\[[0-9;]*m/g, '').trim() });
      this.text = '';
    } else if (b >= 32 || b === 9) {
      this.text += String.fromCharCode(b);
    }
  }
  step(b, events) {
    if (this.state === 0) {
      if (b === MT_START1) this.state = 1;
      else this.logByte(b, events);
    } else if (this.state === 1) {
      this.state = b === MT_START2 ? 2 : 0;
      if (b !== MT_START2) this.step(b, events);
    } else if (this.state === 2) {
      this.len = b << 8;
      this.state = 3;
    } else if (this.state === 3) {
      this.len |= b;
      this.buf = [];
      this.state = this.len > MT_MAX || this.len === 0 ? 0 : 4;
      if (this.state === 0) events.push({ type: 'error', text: 'bad length ' + this.len });
    } else {
      this.buf.push(b);
      if (this.buf.length === this.len) {
        events.push({ type: 'frame', payload: Uint8Array.from(this.buf) });
        this.state = 0;
      }
    }
  }
}

const mtWrap = payload => concatBytes(Uint8Array.of(MT_START1, MT_START2, payload.length >> 8, payload.length & 255), payload);

// ---------- compact binary message for LoRa (≤ 255 bytes): the signed fields, signature and key ----------
const KIND_CODES = ['text', 'loc', 'safe', 'sos', 'ack', 'board', 'photo', 'voice'];
const LORA_MAX = 240;

// The sender's key (33 bytes) is included only when it still fits; receivers that know the sender
// fill it in from their contacts. A payload that cannot fit is refused rather than truncated.
function packMsg(m, hops = 0) {
  const payload = utf8(JSON.stringify(m.enc ? { e: m.enc } : { b: m.body }));
  if (payload.length > 255) throw new Error('too big');
  const head = (flags, withPk) => {
    const w = new ByteWriter().u8(0x52).u8(flags).u8(KIND_CODES.indexOf(m.kind)).u8(m.prio).u8(m.hl).u8(hops);
    w.bytes(fromHex(m.id)).bytes(fromHex(m.from));
    if (m.to) w.bytes(fromHex(m.to));
    w.u32(Math.floor(m.ts / 1000)).u16(Math.round((m.exp - m.ts) / 60000));
    w.str(m.ch).str(m.name).u8(payload.length).bytes(payload);
    if (m.sig) w.bytes(fromB64u(m.sig));
    if (withPk) w.bytes(fromB64u(m.pk));
    return w.out();
  };
  const base = (m.to ? 1 : 0) | (m.sig ? 2 : 0);
  const full = m.pk ? head(base | 4, true) : null;
  const out = full && full.length <= LORA_MAX ? full : head(base, false);
  if (out.length > LORA_MAX) throw new Error('too big');
  return out;
}

function unpackMsg(bytes) {
  const r = new ByteReader(bytes);
  if (r.u8() !== 0x52) throw new Error('not a Rabta frame');
  const flags = r.u8();
  const m = { v: 1, kind: KIND_CODES[r.u8()] || 'text', prio: r.u8(), hl: r.u8() };
  const hops = r.u8();
  m.id = toHex(r.bytes(8));
  m.from = toHex(r.bytes(8));
  m.to = flags & 1 ? toHex(r.bytes(8)) : null;
  m.ts = r.u32() * 1000;
  m.exp = m.ts + r.u16() * 60000;
  m.ch = r.str();
  m.name = r.str();
  const payload = JSON.parse(r.str());
  m.body = payload.b ?? null;
  m.enc = payload.e ?? null;
  if (flags & 2) m.sig = b64u(r.bytes(64));
  if (flags & 4) m.pk = b64u(r.bytes(33));
  return { m, hops };
}

/** DIY board line protocol: "RX <rssi> <snr> <base64url>", "OK …", "INFO …", "PONG"; anything else is log. */
function parseRadioLine(line) {
  const parts = line.trim().split(/\s+/);
  if (parts[0] === 'RX' && parts.length >= 4) return { type: 'rx', rssi: Number(parts[1]), snr: Number(parts[2]), data: parts[3] };
  if (['OK', 'INFO', 'PONG', 'ERR'].includes(parts[0])) return { type: parts[0].toLowerCase(), text: parts.slice(1).join(' ') };
  return { type: 'log', text: line.trim() };
}

function loadState() {
  const meta = store.get('meta', null);

  for (const k of ['conflicts', 'inbox', 'log']) st[k] = Array.isArray(st[k]) ? st[k] : [];
  return st;
}

function persist(...keys) {
  let ok = true;
  for (const k of keys) ok = store.set(k, S[k]) && ok;
  if (!ok) toast(t('err_storage'), 'bad');
  return ok;
}
const persistAll = () => persist(...KEYS);

// The message store, boards and clock of this node are saved together, a moment after they change.
const persistMesh = debounce(() => {
  if (!ME) return;
  const ok = store.set('store', serializeStore(ME.core)) && store.set('boards', ME.boards) && store.set('clock', ME.clock.pack());
  if (!ok) toast(t('err_storage'), 'bad');
}, 400);

const serializeStore = core => [...core.store.values()].map(e => ({ m: e.m, path: e.path, rx: e.rx, copies: e.copies, verified: e.verified, via: e.via, out: e.out || 0 }));

function restoreStore(core, list) {
  for (const e of list || []) core.store.set(e.m.id, { ...e });
}

function restoreBoards(ctx, saved) {

async function buildMe() {

// ---------- contacts (every node this device has met or verified) ----------
// trust: 0 unverified · 1 signatures seen · 2 verified in person (QR) · 3 blocked
function upsertContact(info, via) {
  const c = S.contacts[info.id] || { id: info.id, trust: 0, firstSeen: now(), bytes: 0 };
  Object.assign(c, { name: info.name || c.name, pk: info.pk || c.pk, dh: info.dh || c.dh, lastSeen: now(), via: via || c.via });
  if (info.pos) c.pos = info.pos;
  if (info.nameUr) c.nameUr = info.nameUr;
  if (c.trust === 0 && info.pk) c.trust = 1;
  const fresh = !S.contacts[info.id];
  S.contacts[info.id] = c;
  persist('contacts');
  return fresh;
}

const contactOf = id => S.contacts[id];
function nameOf(id, fallback = '') {
  if (id === ME?.id) return t('you');
  const c = S.contacts[id];
  if (!c) return fallback || shortId(id);
  return (lang === 'ur' && c.nameUr) || c.name || fallback || shortId(id);
}
const avColor = id => (id === ME?.id ? 'var(--orange)' : S.contacts[id]?.av || `hsl(${fnv1a(id || '') % 360} 55% 68%)`);
const firstName = id => nameOf(id).replace(/^(Dr|ڈاکٹر)\.? /, '').split(' ')[0];
const avatar = (id, cls = '', dot = false) => `<span class="av ${cls}" style="--av:${avColor(id)}">${esc(initials(id === ME?.id ? myName() : nameOf(id)))}${dot ? `<i class="dot ${isLive(id) ? 'on' : ''}"></i>` : ''}</span>`;

// ---------- conversations, receipts and decryption ----------
// A conversation is a channel id (#village) or "dm:<peer id>".
const convOf = m => (m.to ? 'dm:' + (m.from === ME.id ? m.to : m.from) : m.ch);
const ACKS = new Map();
const PLAIN = new Map();
const CONV = new Map();

function indexEntry(e) {
  const m = e.m;
  if (m.kind === 'ack' && m.body?.ref) {
    const prev = ACKS.get(m.body.ref);
    if (!prev || (m.body.st === 'r' && prev !== 'r')) ACKS.set(m.body.ref, m.body.st);
  }
  if (!VISIBLE_KINDS.includes(m.kind)) return;
  if (m.to && m.to !== ME.id && m.from !== ME.id) return;
  const conv = convOf(m);
  if (!CONV.has(conv)) CONV.set(conv, []);
  CONV.get(conv).push(e);
}

function rebuildIndexes() {
  ACKS.clear();
  CONV.clear();
  for (const e of ME.core.store.values()) indexEntry(e);
  for (const list of CONV.values()) list.sort((a, b) => a.m.ts - b.m.ts);
}

function addToIndex(e) {
  indexEntry(e);
  const list = CONV.get(convOf(e.m));
  if (list) list.sort((a, b) => a.m.ts - b.m.ts);
}

const convMessages = conv => CONV.get(conv) || [];
const lastRead = conv => S.ui.read[conv] || 0;
const unreadIn = conv => convMessages(conv).filter(e => e.m.from !== ME.id && e.m.ts > lastRead(conv)).length;
const sosUnread = conv => convMessages(conv).some(e => e.m.kind === 'sos' && e.m.from !== ME.id && e.m.ts > lastRead(conv));
const dmPeers = () => [...CONV.keys()].filter(k => k.startsWith('dm:')).map(k => k.slice(3));

function markRead(conv) {
  const list = convMessages(conv);
  const latest = list.length ? list[list.length - 1].m.ts : 0;
  if (latest <= lastRead(conv)) return;
  S.ui.read[conv] = latest;
  persist('ui');
  if (conv.startsWith('dm:') && S.settings.receipts) sendReceipts(conv.slice(3), 'r');
}

/** Body of a message for display: decrypted direct messages come from the cache. */
function bodyOf(m) {
  if (!m.enc) return m.body || {};
  return PLAIN.get(m.id) || null;
}

async function decryptPending() {
  if (!ME.keys) return;
  let changed = false;
  for (const list of CONV.values()) {
    for (const e of list) {
      if (!e.m.enc || PLAIN.has(e.m.id)) continue;
      const peer = contactOf(e.m.from === ME.id ? e.m.to : e.m.from);
      if (!peer?.dh) continue;
      try {
        PLAIN.set(e.m.id, await decryptBody(e.m.enc, ME.keys, peer.dh, e.m.id));
      } catch {
        PLAIN.set(e.m.id, { t: t('ch_cantDecrypt'), err: true });
      }
      changed = true;
    }
  }
  if (changed) renderSoon();
}

// Delivery ("d") and read ("r") receipts for direct messages, sent back through the mesh.
const RECEIPTS_SENT = new Set();

async function sendReceipts(peerId, st) {
  const pending = convMessages('dm:' + peerId).filter(e => e.m.from === peerId && !RECEIPTS_SENT.has(e.m.id + st));
  for (const e of pending.slice(-20)) {
    RECEIPTS_SENT.add(e.m.id + st);
    await createMsg(ME, { kind: 'ack', ch: 'dm', to: peerId, body: { ref: e.m.id, st }, ttlH: 24, hl: S.settings.hl });
  }
}

function receiptOf(m) {
  if (m.from !== ME.id) return '';
  const st = ACKS.get(m.id);
  if (st === 'r') return 'read';
  if (st === 'd') return 'delivered';
  return ME.core.store.get(m.id)?.out ? 'relayed' : 'queued';
}

function fakeClock(node, agoMin) {
  return { node, l: now() - agoMin * MIN, c: 0, now() {
    this.c++;
    return hlcPack(this.l, this.c, this.node);
  } };
}

function seedBody(spec, author) {
  const body = { t: spec.t[0], tu: spec.t[1] };
  if (spec.loc) Object.assign(body, offsetPos(spec.loc[0], spec.loc[1]), { acc: spec.loc[2], label: spec.t[0] });
  if (spec.kind === 'photo') body.img = drawDemoPhoto();
  if (spec.sos) Object.assign(body, offsetPos(spec.sos.dx, spec.sos.dy), { people: spec.sos.people, injured: spec.sos.injured, needs: spec.sos.needs, triage: spec.sos.triage, inc: 'inc-' + spec.sos.inc, acc: 25 });
  if (spec.kind === 'safe') body.n = author === ME ? 5 : 1;
  return body;
}

async function seedMsg(spec) {
  const author = spec.who === 'me' ? ME : villager(spec.who).ctx;
  const ts = Math.floor((now() - spec.ago * MIN) / 1000) * 1000;
  const prio = spec.kind === 'sos' ? PRIO_SOS : spec.prio || 0;
  const m = { v: 1, id: randomHex(8), kind: spec.kind || 'text', ch: spec.to ? 'dm' : spec.ch, from: author.id, name: author.name, to: spec.to ? idOfKey(spec.to) : null, ts, exp: ts + (prio === PRIO_SOS ? 96 : 72) * HOUR, hl: prio === PRIO_SOS ? 16 : 8, prio, body: seedBody(spec, author), enc: null, pk: author.pk };
  if (spec.enc) {
    const peer = spec.to === 'me' ? ME : villager(spec.to).ctx;
    m.enc = await encryptBody(m.body, author.keys, peer.dh, m.id);
    m.body = null;
  }
  await signMsg(m, author.keys);
  placeSeed(m, spec, author);
  return m;
}

// Put copies where they would be after a day of encounters, with plausible hop paths.
function placeSeed(m, spec, author) {
  const relays = (spec.via || []).map(idOfKey);
  const put = (ctx, path) => {
    ctx.core.store.set(m.id, { m, path, rx: m.ts + path.length * 4 * MIN, copies: 1, verified: 'ok', via: ctx === author ? 'self' : 'demo', out: spec.queued ? 0 : 1 });
  };
  put(author, [author.id]);
  for (const v of VILLAGE.nodes) {
    if (v.ctx === author || spec.queued) continue;
    if (spec.only && !spec.only.includes(v.key)) continue;
    const i = relays.indexOf(v.ctx.id);
    put(v.ctx, i >= 0 ? [author.id, ...relays.slice(0, i + 1)] : [author.id, v.ctx.id]);
  }
  if (author !== ME && !spec.only) put(ME, [author.id, ...relays, ME.id]);
}

async function seedReceipts(msgs) {
  for (const [spec, m] of msgs) {
    if (!spec.read) continue;
    const peer = villager(spec.to).ctx;
    for (const st of ['d', 'r']) {
      const ack = { v: 1, id: randomHex(8), kind: 'ack', ch: 'dm', from: peer.id, name: peer.name, to: ME.id, ts: m.ts + (st === 'd' ? 2 : 6) * MIN, exp: m.ts + 24 * HOUR, hl: 8, prio: 0, body: { ref: m.id, st }, enc: null, pk: peer.pk };
      await signMsg(ack, peer.keys);
      ME.core.store.set(ack.id, { m: ack, path: [peer.id, ME.id], rx: ack.ts, copies: 1, verified: 'ok', via: 'demo' });
    }
  }
}

/** Small illustrative JPEG of a flooded bridge, drawn on a canvas (no image files needed). */
function drawDemoPhoto() {
  const c = document.createElement('canvas');
  c.width = 320;
  c.height = 190;
  const g = c.getContext('2d');
  const sky = g.createLinearGradient(0, 0, 0, 110);
  sky.addColorStop(0, '#8fa3b8');
  sky.addColorStop(1, '#d9c9a8');
  g.fillStyle = sky;
  g.fillRect(0, 0, 320, 190);
  g.fillStyle = '#5b6470';
  g.beginPath();
  g.moveTo(0, 110);
  [[40, 40], [90, 85], [140, 25], [200, 90], [250, 35], [320, 95], [320, 120], [0, 120]].forEach(([x, y]) => g.lineTo(x, y));
  g.fill();
  g.fillStyle = '#7a5c3c';
  g.fillRect(0, 118, 320, 72);
  g.strokeStyle = 'rgba(230,210,170,.55)';
  for (let y = 126; y < 190; y += 9) {
    g.beginPath();
    g.moveTo(0, y);
    for (let x = 0; x <= 320; x += 20) g.lineTo(x, y + Math.sin(x / 18 + y) * 2.5);
    g.stroke();
  }
  g.fillStyle = '#3b3a37';
  g.fillRect(20, 104, 110, 8);
  g.fillRect(190, 104, 110, 8);
  g.fillRect(40, 112, 7, 40);
  g.fillRect(270, 112, 7, 40);
  g.fillStyle = '#ff7a1a';
  g.fillRect(132, 98, 10, 14);
  return c.toDataURL('image/jpeg', 0.6);
}

function applySeedOp(state, [who, ago, item, fields]) {
  const clock = fakeClock(idOfKey(who), ago);
  const exists = orHas(state.items, item);
  if (fields.when) fields = { ...fields, when: now() - fields.when * MIN };
  if (fields.node) fields = { ...fields, node: idOfKey(fields.node) };
  const delta = exists ? boardSetDelta(state, clock, item, fields) : boardAddDelta(state, clock, item, { ...fields, last: now() - ago * MIN });
  if (exists && 'status' in fields) delta.f[item].last = lwwWrite(state.f[item]?.last, now() - ago * MIN, clock.now());
  return boardMerge(state, delta);
}

// One SOS incident: the request, then acknowledgements and lifecycle steps by other villagers.
function incidentOps(state, spec, msg, steps) {
  const id = 'inc-' + spec.sos.inc;
  const author = idOfKey(spec.who);
  const pos = offsetPos(spec.sos.dx, spec.sos.dy);
  let s = boardMerge(state, boardAddDelta(state, fakeClock(author, spec.ago), id, { title: spec.t[0], titleUr: spec.t[1], ...pos, acc: 25, people: spec.sos.people, injured: spec.sos.injured, needs: spec.sos.needs, triage: spec.sos.triage, from: author, name: villager(spec.who).ctx.name, at: msg.ts, msg: msg.id }));
  s = boardMerge(s, boardLifeDelta(s, fakeClock(author, spec.ago), id, 'open'));
  for (const [who, ago, kind, val] of steps) {
    const clock = fakeClock(idOfKey(who), ago);
    if (kind === 'life') s = boardMerge(s, boardLifeDelta(s, clock, id, val));
    if (kind === 'ack') s = boardMerge(s, boardSetDelta(s, clock, id, { ['ack_' + idOfKey(who)]: { st: val[0], eta: val[1], at: now() - ago * MIN, n: villager(who).ctx.name } }));
    if (kind === 'seen') s = boardMerge(s, boardSetDelta(s, clock, id, { ['seen_' + idOfKey(who)]: { h: val, at: now() - ago * MIN, n: who === 'me' ? ME.name : villager(who).ctx.name } }));
    if (kind === 'assign') s = boardMerge(s, boardSetDelta(s, clock, id, { assigned: { id: idOfKey(val), n: villager(val).ctx.name, by: idOfKey(who) } }));
  }
  return s;
}

  jeep: [['imran', 695, 'seen', 1], ['imran', 690, 'ack', ['coming', 15]], ['imran', 690, 'life', 'acknowledged'], ['committee', 688, 'assign', 'imran'], ['imran', 680, 'ack', ['enroute', 10]], ['imran', 680, 'life', 'enroute'], ['me', 650, 'seen', 2], ['rescue', 400, 'life', 'resolved']],

  roof: [['imran', 16, 'seen', 1], ['saima', 14, 'seen', 1]],
};

function responderOps(state) {
  let s = state;
  for (const v of VILLAGE.nodes) {
    if (!v.person.skills.length) continue;
    s = boardMerge(s, boardAddDelta(s, fakeClock(v.ctx.id, 1500), v.ctx.id, { name: v.ctx.name, skills: v.person.skills, avail: v.key !== 'sher', ...v.ctx.pos, note: '', at: now() - 1500 * MIN }));
  }
  return boardMerge(s, boardAddDelta(s, fakeClock(ME.id, 1000), ME.id, { name: ME.name, skills: ['firstaid'], avail: true, ...ME.pos, note: '', at: now() - 1000 * MIN }));
}

async function seedBoards(sosMsgs) {
  const shared = {};
  for (const b of ['missing', 'needs', 'resources', 'roll']) shared[b] = SEED_BOARD_OPS[b].reduce(applySeedOp, boardNew());
  shared.responders = responderOps(boardNew());
  let inc = boardNew();
  for (const [spec, msg] of sosMsgs.filter(([s]) => s.sos.inc !== 'roof')) inc = incidentOps(inc, spec, msg, INCIDENT_STEPS[spec.sos.inc]);
  shared.incidents = inc;
  const [roofSpec, roofMsg] = sosMsgs.find(([s]) => s.sos.inc === 'roof');
  const withRoof = incidentOps(inc, roofSpec, roofMsg, INCIDENT_STEPS.roof);
  for (const v of VILLAGE.nodes) {
    Object.assign(v.ctx.boards, structuredClone(shared));
    if (roofSpec.only.includes(v.key)) v.ctx.boards.incidents = structuredClone(withRoof);
  }
  for (const b of Object.keys(shared)) ME.boards[b] = boardMerge(ME.boards[b], structuredClone(shared[b]));
  seedConflict();
}

// Two volunteers changed the blanket count without seeing each other's edit: the merge keeps the later
// write and the conflict inspector shows both.
function seedConflict() {
  const base = ME.boards.needs;
  const a = boardSetDelta(base, fakeClock(idOfKey('ayesha'), 700), 'blankets', { qty: '40' });
  const b = boardSetDelta(base, fakeClock(idOfKey('committee'), 690), 'blankets', { qty: '25' });
  for (const v of VILLAGE.nodes) v.ctx.boards.needs = boardMerge(boardMerge(v.ctx.boards.needs, a), b);
  ME.boards.needs = boardMerge(base, a);
  mergeBoard(ME, 'needs', b, idOfKey('committee'));
}
