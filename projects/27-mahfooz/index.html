const KEY_PAGES = ['home', 'sos', 'journey', 'fakecall', 'circle', 'plan', 'journal', 'map', 'rights'];

function openShortcuts() {
  const row = (keys, k) => `<div class="setrow"><span>${t(k)}</span><span class="row">${keys.map(x => `<span class="kbd">${x}</span>`).join('')}</span></div>`;
  openModal(`${sheetHead(t('shortcuts'), 'keyboard')}
    ${row(['Esc', 'Esc'], 'ks_exit')}${row(['S'], 'ks_sos')}${row(['Space'], 'ks_hold')}${row(['F'], 'ks_call')}${row(['J'], 'ks_journey')}${row(['N'], 'ks_note')}
    ${row(['/', 'Ctrl K'], 'ks_search')}${row(['1', '…', '9'], 'ks_pages')}${row(['L'], 'ks_lang')}${row(['?'], 'ks_help')}${row(['Esc'], 'ks_close')}`);
}

let lastEsc = 0;

function onKey(e) {
  markActive();
  if (disguised()) return calcKey(e);
  if (neutralOn()) return;
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = ['input', 'textarea', 'select'].includes(tag);
  if (e.key === 'Escape') return onEscape();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    return openPalette();
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || modalOpen() || tourStep >= 0 || SOS.phase !== 'idle' || callActive()) return;
  const k = e.key.toLowerCase();
  if (e.key === '?') return openShortcuts();
  if (e.key === '/') {
    e.preventDefault();
    return openPalette();
  }
  if (k === 's') return visibleEl('.sos-fab .sos-hold, #sideSos .sos-hold').focus();
  if (k === 'f') return scheduleFakeCall();
  if (k === 'j') return go('journey');
  if (k === 'n') return go('journal/new');
  if (k === 'l') return setLang(lang === 'ur' ? 'en' : 'ur');
  if (/^[1-9]$/.test(k)) go(KEY_PAGES[Number(k) - 1]);
}

// Escape closes the top layer; pressed twice within 0.6 s it is the quick exit.
function onEscape() {
  const twice = now() - lastEsc < 600;
  lastEsc = now();
  if (twice && S.settings.escExit) return quickExit();
  if (strobe.on) return strobe.stop();
  if (tourStep >= 0) return endTour();
  if ($('#palette').classList.contains('on')) return closePalette();
  if (modalOpen()) return closeModal();
  if (SOS.phase === 'count') return cancelSos();
  if (SOS.phase === 'active' && !SOS.hidden) return minimiseSos();
}

function go(path) {
  if (location.hash.slice(1) === path) route();
  else location.hash = path;
}

function route() {
  if (disguised() || neutralOn()) return;
  const [name, ...rest] = (location.hash.slice(1) || 'home').split('/');
  const r = ROUTES[name] ? name : 'home';
  renderRoute(r, decodeURIComponent(rest.join('/')));
}

function renderRoute(r, arg) {
  const same = r === curRoute && arg === curArg;
  if (curRoute === 'map' && r !== 'map' && MAP.lmap) {
    MAP.lmap.remove();
    MAP.lmap = null;
  }
  curRoute = r;
  curArg = arg;
  closePalette();
  if (!same) closeModal();
  ROUTES[r].r(arg);
  $('#pageTitle').textContent = t('nav_' + r);
  document.title = r === 'home' ? `${t('appName')} — ${t('tagline')} | FYP Template` : `${t('nav_' + r)} — ${t('appName')} | FYP Template`;
  renderNav();
  updateBadges();
  renderBanner();
  if (!same) {
    window.scrollTo(0, 0);
    animateIn($('#view'));
  } else settle($('#view'));
}

function rerender() {
  if (!curRoute || disguised() || neutralOn()) return;
  const y = window.scrollY;
  renderRoute(curRoute, curArg);
  window.scrollTo(0, y);
}

  document.addEventListener('visibilitychange', () => document.hidden && S.settings.lockOnHide && J.key && lockJournal());
  window.addEventListener('hashchange', route);
  window.addEventListener('resize', debounce(() => curRoute === 'map' && MAP.mode === 'schematic' && renderMapArea(), 200));
}

// The SOS control is created once so a hold in progress survives navigation and re-renders.
function mountSosControls() {
  const fab = document.createElement('div');
  fab.className = 'sos-fab';
  fab.innerHTML = sosButtonHtml();
  $('#app').append(fab);
  $('#sideSos').innerHTML = sosButtonHtml() + `<p id="sideSosHint">${t('sosSideHint')}</p>`;
  $$('.sos-hold').forEach(bindSosButton);
}

function boot() {
  appFavicon = $('#favicon').href;
  lang = store.get('lang', 'en') === 'ur' ? 'ur' : 'en';
  let fresh = false;
  try {
    fresh = sessionStorage.getItem(NS + 'fresh') === '1';
    sessionStorage.removeItem(NS + 'fresh');
  } catch {
    /* blocked */
  }
  S = loadState();
  if (!S) fresh ? emptyApp() : seedApp();
  applyPrefs();
  mountSosControls();
  bindShell();
  if (fresh) J.ready = true;
  else seedDemoJournal();
  refreshGeoPermission();
  if (S.active) startJourneyTracking(S.active);
  setInterval(journeyTick, 1000);
  setInterval(autoLockTick, 10000);
  setInterval(refreshNotices, HOUR);
  refreshNotices();
  if (S.settings.disguise && S.settings.disguisePin) return showDisguise();
  route();
  if (!location.hash && !S.settings.tourDone) setTimeout(startTour, 900);
}

boot();
</script>
