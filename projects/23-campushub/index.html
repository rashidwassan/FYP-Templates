const scUi = { q: '', cat: 'all' };
const societyById = id => db('societies').find(s => s.id === id);
const memberOf = (s, uid0 = meId()) => s.members.find(m => m.userId === uid0);
const pendingReq = (s, uid0 = meId()) => s.requests.find(r => r.userId === uid0 && r.status === 'pending');
const memberCount = s => s.members.length + (demoOn() ? s.base || 0 : 0);
const socLogo = (s, cls = 'logo') => `<span class="${cls}" style="background:${s.color}">${ic(s.icon)}</span>`;

function renderSocieties(arg) {
  const s = arg && societyById(arg);
  if (s) return renderSociety(s);
  $('#page').innerHTML = pageHead('users', t('nav_societies'), t('scTitle'), t('scSub')) + '<div id="scBody"></div>';
  drawSocietyDirectory();
}

function drawSocietyDirectory() {
  const q = scUi.q.toLowerCase();
  const all = visible(db('societies'));
  const list = all.filter(s => (scUi.cat === 'all' || s.cat === scUi.cat) && (!q || [tx(s.name), s.name.en, tx(s.about)].join(' ').toLowerCase().includes(q)));
  const mine = all.filter(s => memberOf(s));
  const cats = [['all', t('all')], ...Object.entries(SOC_CATS).map(([k, v]) => [k, tx(v)])];
  $('#scBody').innerHTML = `<div class="toolbar"><input class="grow" type="search" id="scQ" placeholder="${esc(t('scSearch'))}" aria-label="${esc(t('scSearch'))}" value="${esc(scUi.q)}"></div>
    <div class="filter-chips mb">${cats.map(([k, l]) => `<button data-scat="${k}" aria-pressed="${scUi.cat === k}">${esc(l)}</button>`).join('')}</div>
    ${mine.length ? `<h2 class="mb">${t('scMine')}</h2><div class="grid-cards stagger mb">${mine.map(societyCard).join('')}</div>` : ''}
    <h2 class="mb mt">${t('scAll')}</h2><div class="grid-cards stagger">${list.map(societyCard).join('')}</div>`;
  $('#scQ').oninput = debounce(e => {
    scUi.q = e.target.value;
    drawSocietyDirectory();
    $('#scQ').focus();
  }, 200);
  $$('[data-scat]').forEach(b => {
    b.onclick = () => {
      scUi.cat = b.dataset.scat;
      drawSocietyDirectory();
    };
  });
  $$('[data-soc]').forEach(b => (b.onclick = () => setHash('societies/' + b.dataset.soc)));
  animateIn($('#scBody'));
}

function societyCard(s) {
  const m = memberOf(s);
  const pres = s.members.find(x => x.role === 'president');
  const status = m ? chip(t('sr_' + m.role), 'teal', 'user-check') : pendingReq(s) ? chip(t('scPending'), 'ochre', 'hourglass') : '';
  return `<button class="card soc" data-soc="${s.id}" style="text-align:start;cursor:pointer;font:inherit;color:inherit">
    <span class="row">${socLogo(s)}<span style="min-width:0;flex:1"><span class="t">${esc(tx(s.name))}</span><span class="small muted" style="display:block">${esc(tx(SOC_CATS[s.cat]))} · ${t('scMembers', { n: memberCount(s) })}</span></span></span>
    <span class="small muted">${esc(tx(s.about))}</span>
    <span class="between"><span class="small">${ic('award')} ${pres ? esc(userName(pres.userId)) : '—'}</span>${status}</span></button>`;
}

function renderSociety(s) {
  const m = memberOf(s);
  const manage = canManageSociety(s);
  const join = m
    ? `<button class="btn ghost" id="scLeave">${ic('arrow-left', 'flip')} ${t('scLeave')}</button>`
    : pendingReq(s)
      ? `<button class="btn ghost" id="scCancelReq">${ic('x')} ${t('scCancelReq')}</button>`
      : `<button class="btn" id="scJoin">${ic('user-plus')} ${t('scJoin')}</button>`;
  const events = visible(db('events')).filter(e => e.society === s.id && !eventPast(e));
  $('#page').innerHTML = `<button class="btn ghost sm mb" id="scBackBtn">${ic('arrow-left', 'flip')} ${t('scBack')}</button>
    <div class="soc-head" style="background:linear-gradient(120deg, ${s.color}, #3b0d16)"><span class="logo">${ic(s.icon)}</span><div style="flex:1;min-width:200px"><h1 id="pageTitle">${esc(tx(s.name))}</h1><p>${esc(tx(s.about))}</p>
      <div class="row mt">${chip(t('scMembers', { n: memberCount(s) }), '', 'users')}${m ? chip(t('sr_' + m.role), 'teal', 'user-check') : ''}${manage ? chip(t('scAdminBadge'), 'ochre', 'shield-check') : ''}</div></div><div class="row">${join}</div></div>
    <div class="cols"><div class="stack">${announcementsCard(s, manage)}${eventsMiniCard(events)}</div><div class="stack">${manage ? requestsCard(s) : ''}${rosterCard(s, manage)}</div></div>`;
  bindSociety(s);
  animateIn($('#page'));
}

function announcementsCard(s, manage) {
  const list = s.announcements.filter(a => viewable(a, a.by)).sort((a, b) => b.ts - a.ts);
  const form = manage
    ? `<form id="annForm" class="card flat mb" style="background:var(--surface-2)" novalidate><label class="f" for="annTitle"><span>${t('scAnnTitle')}</span><input type="text" id="annTitle" data-req data-min="4" maxlength="100"></label>
       <label class="f" for="annBody"><span>${t('scAnnBody')}</span><textarea id="annBody" data-req data-min="10" maxlength="800"></textarea></label><button class="btn sm" type="submit">${ic('megaphone')} ${t('scPostAnn')}</button></form>`
    : '';
  const items = list
    .map(a => `<div class="ann"><div class="between"><b>${esc(tx(a.title))}</b>${a.mod && a.mod.hidden ? chip(t('hidden'), 'bad', 'eye-off') : `<button class="btn ghost xs" data-rep-ann="${a.id}" aria-label="${esc(t('report'))}">${ic('flag')}</button>`}</div><p class="small" style="margin:4px 0">${esc(tx(a.body))}</p><span class="tiny muted">${esc(userName(a.by))} · ${esc(ago(a.ts))}</span></div>`)
    .join('');
  return `<div class="card"><h2 class="mb">${ic('megaphone')} ${t('scAnn')}</h2>${form}${items || `<p class="small muted">${t('scNoAnn')}</p>`}</div>`;
}

function eventsMiniCard(events) {
  return `<div class="card"><h2 class="mb">${ic('calendar')} ${t('scUpcoming')}</h2>${events.length ? events.map(eventCard).join('') : `<p class="small muted">${t('scNoEvents')}</p>`}</div>`;
}

function requestsCard(s) {
  const reqs = s.requests.filter(r => r.status === 'pending');
  const rows = reqs.map(r => `<div class="li"><span>${avatar(r.userId)}</span><div class="body"><b>${esc(userName(r.userId))}</b><span class="small muted">${esc(deptName(userById(r.userId).dept))} · ${esc(ago(r.ts))}</span><p class="small" style="margin:4px 0 0">${esc(r.msg)}</p>
    <div class="row mt"><button class="btn teal xs" data-jr="yes" data-user="${r.userId}">${ic('check')} ${t('scApprove')}</button><button class="btn danger xs" data-jr="no" data-user="${r.userId}">${ic('x')} ${t('scDecline')}</button></div></div></div>`);
  return `<div class="card"><h2 class="mb">${ic('user-plus')} ${t('scRequests')} ${reqs.length ? `<span class="chip maroon">${reqs.length}</span>` : ''}</h2>${rows.join('') ? `<div class="list">${rows.join('')}</div>` : `<p class="small muted">${t('scNoRequests')}</p>`}</div>`;
}

function rosterCard(s, manage) {
  const order = m => SOC_ROLES.indexOf(m.role);
  const rows = [...s.members]
    .sort((a, b) => order(a) - order(b))
    .map(m => {
      const roleCell = manage ? `<select data-role="${m.userId}" aria-label="${esc(t('scRoster'))}: ${esc(userName(m.userId))}">${SOC_ROLES.map(r => `<option value="${r}" ${r === m.role ? 'selected' : ''}>${t('sr_' + r)}</option>`).join('')}</select>` : chip(t('sr_' + m.role), m.role === 'member' ? 'line' : 'teal');
      const rm = manage && m.role !== 'president' && m.userId !== meId() ? `<button class="btn ghost xs icon" data-rm="${m.userId}" aria-label="${esc(t('scRemove'))}">${ic('trash')}</button>` : '';
      return `<div class="member">${avatar(m.userId)}<span class="who-m"><b class="small">${esc(userName(m.userId))}</b><span class="tiny muted">${esc(deptName(userById(m.userId).dept))} · ${t('scJoined', { date: fmtDate(m.joined, { month: 'short', year: 'numeric' }) })}</span></span><span class="row">${roleCell}${rm}</span></div>`;
    })
    .join('');
  return `<div class="card"><h2 class="mb">${ic('users')} ${t('scRoster')}</h2><div class="members">${rows}</div>${demoOn() && s.base ? `<p class="tiny muted mt">${t('scOthersNote', { n: s.base })}</p>` : ''}</div>`;
}

function bindSociety(s) {
  $('#scBackBtn').onclick = () => setHash('societies');
  if ($('#scJoin')) $('#scJoin').onclick = () => openJoinForm(s);
  if ($('#scCancelReq')) {
    $('#scCancelReq').onclick = () => {
      s.requests = s.requests.filter(r => !(r.userId === meId() && r.status === 'pending'));
      commit('societies');
      renderSociety(s);
    };
  }
  if ($('#scLeave')) $('#scLeave').onclick = () => leaveSociety(s);
  if ($('#annForm')) {
    $('#annForm').onsubmit = e => {
      e.preventDefault();
      postAnnouncement(s);
    };
  }
  $$('[data-jr]').forEach(b => (b.onclick = () => decideJoin(s, b.dataset.user, b.dataset.jr === 'yes')));
  $$('[data-role]').forEach(sel => (sel.onchange = () => setMemberRole(s, sel.dataset.role, sel.value)));
  $$('[data-rm]').forEach(b => (b.onclick = () => removeMember(s, b.dataset.rm)));
  $$('[data-rep-ann]').forEach(b => (b.onclick = () => openReportModal('announcement', `${s.id}:${b.dataset.repAnn}`)));
  bindEventCards($('#page'));
}

// ---------- societies: actions ----------
const societyAdmins = s => s.members.filter(m => SOC_ADMIN_ROLES.includes(m.role)).map(m => m.userId);

function openJoinForm(s) {
  openModal(`<h2 id="mTitle">${ic('user-plus')} ${t('scJoin')}</h2><p class="small muted">${esc(tx(s.name))}</p>
    <form id="joinForm" novalidate><label class="f" for="jMsg"><span>${t('scJoinWhy')}</span><textarea id="jMsg" data-req data-min="10" maxlength="300"></textarea></label>
    <div class="foot"><button type="button" class="btn ghost" id="jCancel">${t('cancel')}</button><button type="submit" class="btn">${ic('send')} ${t('submit')}</button></div></form>`);
  $('#jCancel').onclick = closeModal;
  $('#joinForm').onsubmit = e => {
    e.preventDefault();
    if (!validate($('#joinForm'))) return;
    s.requests.push({ userId: meId(), msg: $('#jMsg').value.trim(), ts: Date.now(), status: 'pending' });
    commit('societies');
    societyAdmins(s).forEach(u => notify(u, 'society', 'n_joinReq', { name: me().name, soc: tx(s.name) }, 'societies/' + s.id));
    closeModal();
    toast(t('scJoinSent'), 'ok');
    renderSociety(s);
  };
}

async function leaveSociety(s) {
  const m = memberOf(s);
  if (m.role === 'president') return toast(t('scPresidentLeave'), 'bad');
  if (!(await confirmBox(t('scLeaveQ', { soc: tx(s.name) }), t('scLeaveBody'), { ok: t('scLeave'), danger: true }))) return;
  s.members = s.members.filter(x => x.userId !== meId());
  commit('societies');
  renderSociety(s);
}

function decideJoin(s, userId, approve) {
  const r = s.requests.find(x => x.userId === userId && x.status === 'pending');
  if (!r || !canManageSociety(s)) return;
  r.status = approve ? 'approved' : 'declined';
  r.decidedBy = meId();
  r.decidedAt = Date.now();
  if (approve && !memberOf(s, userId)) s.members.push({ userId, role: 'member', joined: Date.now() });
  commit('societies');
  notify(userId, 'society', approve ? 'n_joinOk' : 'n_joinNo', { soc: tx(s.name) }, 'societies/' + s.id);
  audit(approve ? 'join_approve' : 'join_reject', 'society', s.id, `${userName(userId)} · ${s.name.en}`);
  toast(approve ? t('scApproved', { name: userName(userId) }) : t('scDeclined'), 'ok');
  updateNavBadges();
  renderSociety(s);
}

// Exactly one president: promoting someone to president moves the current president to Vice President.
function setMemberRole(s, userId, newRole) {
  if (!canManageSociety(s)) return;
  const m = memberOf(s, userId);
  if (!m || m.role === newRole) return;
  const msgs = [t('scRoleChanged')];
  if (newRole === 'president') {
    const cur = s.members.find(x => x.role === 'president');
    if (cur) {
      cur.role = 'vp';
      notify(cur.userId, 'society', 'n_roleChange', { soc: tx(s.name), role: t('sr_vp') }, 'societies/' + s.id);
      msgs.push(t('scPresTransfer'));
    }
  }
  if (m.role === 'president' && newRole !== 'president') {
    toast(t('scPresidentLeave'), 'bad');
    return renderSociety(s);
  }
  const old = m.role;
  m.role = newRole;
  commit('societies');
  notify(userId, 'society', 'n_roleChange', { soc: tx(s.name), role: t('sr_' + newRole) }, 'societies/' + s.id);
  audit('role_change', 'society', s.id, `${userName(userId)}: ${old} > ${newRole}`);
  toast(msgs.join(' '), 'ok');
  renderSociety(s);
}

async function removeMember(s, userId) {
  if (!(await confirmBox(t('scRemove'), userName(userId), { ok: t('scRemove'), danger: true }))) return;
  s.members = s.members.filter(m => m.userId !== userId);
  commit('societies');
  audit('member_remove', 'society', s.id, `${userName(userId)} · ${s.name.en}`);
  toast(t('scRemoved'), 'ok');
  renderSociety(s);
}

function postAnnouncement(s) {
  if (!validate($('#annForm'))) return;
  const title = $('#annTitle').value.trim();
  const body = $('#annBody').value.trim();
  const scr = screenText(title + ' ' + body);
  if (scr.hits.length || scr.threat) return fail($('#annBody'), t('abusiveText'));
  const a = { id: uid('a'), title: { en: title, ur: title }, body: { en: body, ur: body }, ts: Date.now(), by: meId(), reports: [] };
  s.announcements.unshift(a);
  commit('societies');
  const others = s.members.filter(m => m.userId !== meId());
  others.forEach(m => notify(m.userId, 'society', 'n_newNotice', { title }, 'societies/' + s.id));
  audit('announce', 'announcement', `${s.id}:${a.id}`, title);
  toast(t('scAnnPosted', { n: others.length }), 'ok');
  renderSociety(s);
}

  rdWomenOnlyBox: ['Women only (passengers and driver)', 'صرف خواتین (مسافر اور ڈرائیور)'],
  rdWomenOnlyNote: ['Only women can post women-only rides. Update your profile gender in Settings if this is wrong.', 'صرف خواتین ہی صرف خواتین والی رائیڈ پوسٹ کر سکتی ہیں۔ غلط ہو تو ترتیبات میں پروفائل درست کریں۔'],
  rdNoDays: ['Choose at least one day.', 'کم از کم ایک دن منتخب کریں۔'],
  rdSeatsBad: ['Seats must be between 1 and {n} for this vehicle.', 'اس سواری کے لیے نشستیں 1 سے {n} کے درمیان ہوں۔'],
  rdCostBad: ['Enter a cost between 0 and 2,000.', '0 سے 2,000 کے درمیان رقم لکھیں۔'],
  rdPosted: ['Ride posted', 'رائیڈ پوسٹ ہو گئی'],
  rdDeleteQ: ['Delete this ride?', 'یہ رائیڈ حذف کریں؟'],
});

const rdUi = { kind: 'offer', dir: 'all', area: 'all', women: false, seats: false, mine: false };
const VEHICLE_SEATS = { car: 4, bike: 1, van: 12 };
const VEHICLE_ICON = { car: 'car', bike: 'bike', van: 'van' };
// Rough one-way distances to campus in km (illustrative), fuel price and mileage for the cost suggestion.
const AREA_KM = { 'Johar Town': 9, 'Model Town': 12, 'DHA Phase 5': 18, Gulberg: 14, Township: 7, 'Bahria Town': 22, 'Wapda Town': 6, 'Iqbal Town': 10, 'Faisal Town': 8, Cantt: 16, Valencia: 5, Shadman: 15 };
const FUEL_PKR_PER_L = 270;
const KM_PER_L = { car: 13, bike: 40, van: 8 };

const rideById = id => db('rides').find(r => r.id === id);
const seatsTaken = r => sum(r.requests.filter(q => q.status === 'accepted').map(q => q.seats));
const seatsLeft = r => r.seats - seatsTaken(r);
const myRideReq = r => r.requests.find(q => q.userId === meId() && q.status !== 'cancelled');
const canSeeContact = r => r.userId === meId() || (myRideReq(r) && myRideReq(r).status === 'accepted');
const womenBlocked = r => r.womenOnly && me().gender !== 'f';

function suggestCost(area, vehicle, seats) {
  const km = AREA_KM[area] || 10;
  const perDay = (km * 2 * FUEL_PKR_PER_L) / KM_PER_L[vehicle];
  return { km, cost: Math.round(perDay / (Math.max(1, seats) + 1) / 10) * 10 };
}

function ridesFiltered() {
  return visible(db('rides'))
    .filter(r => viewable(r, r.userId))
    .filter(r => (rdUi.mine ? r.userId === meId() || myRideReq(r) : r.kind === rdUi.kind))
    .filter(r => rdUi.dir === 'all' || (rdUi.dir === 'to') === r.toCampus)
    .filter(r => rdUi.area === 'all' || r.area === rdUi.area)
    .filter(r => !rdUi.women || r.womenOnly)
    .filter(r => !rdUi.seats || r.kind === 'request' || seatsLeft(r) > 0)
    .sort((a, b) => toMin(a.time) - toMin(b.time));
}

function renderRides() {
  $('#page').innerHTML = pageHead('car', t('nav_rides'), t('rdTitle'), t('rdSub'), `<button class="btn" id="rdNew">${ic('plus')} ${t('rdNew')}</button>`) + '<div id="rdBody"></div>';
  $('#rdNew').onclick = openRideForm;
  drawRides();
}

function drawRides() {
  const list = ridesFiltered();
  const sel = (id, opts, v) => `<select id="${id}" aria-label="${esc(t('filter'))}">${opts.map(([k, l]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  $('#rdBody').innerHTML = `<div class="toolbar"><div class="seg" role="group"><button data-kind="offer" aria-pressed="${!rdUi.mine && rdUi.kind === 'offer'}">${ic('car')} ${t('rdOffers')}</button><button data-kind="request" aria-pressed="${!rdUi.mine && rdUi.kind === 'request'}">${ic('hand')} ${t('rdRequests')}</button><button data-kind="mine" aria-pressed="${rdUi.mine}">${ic('user')} ${t('rdMine')}</button></div>
      ${sel('rdDir', [['all', t('rdAllDirs')], ['to', t('rdToCampus')], ['from', t('rdFromCampus')]], rdUi.dir)}
      ${sel('rdArea', [['all', t('rdAllAreas')], ...AREAS.map(a => [a, areaName(a)])], rdUi.area)}
      <label class="switch"><input type="checkbox" id="rdWomen" ${rdUi.women ? 'checked' : ''}><i></i>${t('rdWomenOnly')}</label>
      <label class="switch"><input type="checkbox" id="rdSeats" ${rdUi.seats ? 'checked' : ''}><i></i>${t('rdHasSeats')}</label></div>
    ${list.length ? `<div class="list stagger">${list.map(rideCard).join('')}</div>` : emptyState('car', t('rdNone'), t('rdNoneSub'))}`;
  bindRides();
  animateIn($('#rdBody'));
  announce(list.length + ' ' + t('nav_rides'));
}

function routeHtml(r) {
  const area = `<span>${ic('map-pin')} ${esc(areaName(r.area))}</span>`;
  const campus = `<span>${ic('graduation')} ${t('campus')}</span>`;
  return `<div class="route">${r.toCampus ? area : campus}<i class="dotline" aria-hidden="true"></i>${ic('chevron-right', 'flip')}<i class="dotline" aria-hidden="true"></i>${r.toCampus ? campus : area}</div>`;
}

function contactHtml(userId, revealed) {
  const u = userById(userId);
  if (!revealed) return `<span class="contact">${ic('lock')} <span class="ltr">${esc(maskPhone(u.phone))}</span> <span class="tiny muted">${t('rdHiddenContact')}</span></span>`;
  return `<span class="contact">${ic('phone')} <span class="ltr">${esc(u.phone)}</span> <a class="btn ghost xs" href="${telHref(u.phone)}">${t('rdCall')}</a><a class="btn ghost xs" href="${waHref(u.phone, 'Assalam o Alaikum, about the CampusHub ride share')}" target="_blank" rel="noopener">${t('rdWa')}</a></span>`;
}

function rideCard(r) {
  const days = DAYS.map(d => `<i class="${r.days.includes(d) ? 'on' : ''}" title="${dayName(d)}">${lang === 'ur' ? dayName(d) : dayName(d).slice(0, 2)}</i>`).join('');
  const left = seatsLeft(r);
  const seats = r.kind === 'offer' ? Array.from({ length: r.seats }, (_, i) => ic('seat', i < r.seats - left ? 'taken' : '')).join('') : '';
  const seatText = r.kind === 'offer' ? t('rdSeatsLeft', { n: left, k: r.seats }) : t('rdNeeds', { n: r.seats });
  return `<div class="card ride" data-ride="${r.id}"><div class="stack">
      <div class="row">${routeHtml(r)}${r.womenOnly ? chip(t('rdWomenOnly'), 'maroon', 'female') : ''}${r.active ? '' : chip(t('rdPaused'), '', 'timer')}${r.mod && r.mod.hidden ? chip(t('hidden'), 'bad', 'eye-off') : ''}</div>
      <div class="row small"><span>${ic('clock')} ${fmtTime(r.time)}</span><span class="days">${days}</span><span>${ic(VEHICLE_ICON[r.vehicle])} ${t('veh_' + r.vehicle)}</span><span>${ic('wallet')} ${t('rdPerSeat', { n: r.cost })}</span></div>
      <div class="row small muted"><span>${ic('map-pin')} ${t('rdPickup')}: ${esc(r.pickup)}</span></div>
      ${r.note ? `<p class="small" style="margin:0">${esc(r.note)}</p>` : ''}
      <div class="row">${avatar(r.userId)}<b class="small">${esc(userName(r.userId))}</b>${contactHtml(r.userId, canSeeContact(r))}</div>
      ${r.userId === meId() ? ownerRequests(r) : ''}
    </div><div class="ride-side"><div class="seats" aria-label="${esc(seatText)}">${seats}</div><span class="small tnum">${esc(seatText)}</span>${rideActions(r)}</div></div>`;
}

function rideActions(r) {
  const out = [];
  if (r.userId === meId()) {
    out.push(`<button class="btn ghost sm" data-ract="pause">${ic(r.active ? 'pause' : 'play')} ${t(r.active ? 'rdPause' : 'rdResume')}</button>`);
    out.push(`<button class="btn danger sm" data-ract="delete">${ic('trash')} ${t('delete')}</button>`);
    return out.join('');
  }
  const mine = myRideReq(r);
  if (mine) {
    const tone = mine.status === 'accepted' ? 'ok' : mine.status === 'declined' ? 'bad' : 'ochre';
    out.push(chip(t(mine.status === 'accepted' ? 'rdReqAccepted' : mine.status === 'declined' ? 'rdReqDeclined' : 'rdReqPending'), tone));
    if (mine.status === 'pending') out.push(`<button class="btn ghost sm" data-ract="cancel">${ic('x')} ${t('rdCancelReq')}</button>`);
  } else if (womenBlocked(r)) {
    out.push(`<span class="small muted">${ic('female')} ${t('rdWomenBlocked')}</span>`);
  } else if (r.kind === 'offer' && seatsLeft(r) <= 0) {
    out.push(chip(t('rdFull'), 'bad'));
  } else if (r.active) {
    out.push(`<button class="btn sm" data-ract="request">${ic(r.kind === 'offer' ? 'seat' : 'car')} ${t(r.kind === 'offer' ? 'rdRequestSeat' : 'rdOfferLift')}</button>`);
  }
  out.push(`<button class="btn ghost xs" data-ract="report">${ic('flag')} ${t('report')}</button>`);
  return out.join('');
}

function ownerRequests(r) {
  const reqs = r.requests.filter(q => q.status !== 'cancelled');
  if (!reqs.length) return '';
  const rows = reqs.map(q => {
    const state = q.status === 'pending' ? `<button class="btn teal xs" data-rq="accept" data-user="${q.userId}">${ic('check')} ${t('rdAccept')}</button><button class="btn danger xs" data-rq="decline" data-user="${q.userId}">${ic('x')} ${t('rdDecline')}</button>` : chip(t(q.status === 'accepted' ? 'rdReqAccepted' : 'rdReqDeclined'), q.status === 'accepted' ? 'ok' : 'bad');
    return `<div class="li"><span>${avatar(q.userId)}</span><div class="body"><b class="small">${esc(userName(q.userId))} · ${t('rdSeatsQ')}: ${q.seats}</b>${q.msg ? `<span class="small muted">${esc(q.msg)}</span>` : ''}<div class="row mt">${state}${q.status === 'accepted' ? contactHtml(q.userId, true) : ''}</div></div></div>`;
  });
  return `<div class="card flat" style="background:var(--surface-2)"><h3 class="mb small">${ic('inbox')} ${t('rdIncoming')}</h3><div class="list">${rows.join('')}</div></div>`;
}

// ---------- ride share: actions and post form ----------
function bindRides() {
  $$('[data-kind]').forEach(b => {
    b.onclick = () => {
      rdUi.mine = b.dataset.kind === 'mine';
      if (!rdUi.mine) rdUi.kind = b.dataset.kind;
      drawRides();
    };
  });
  const bindSel = (id, key, cast = v => v) => ($(id).onchange = e => {
    rdUi[key] = cast(e.target.type === 'checkbox' ? e.target.checked : e.target.value);
    drawRides();
  });
  bindSel('#rdDir', 'dir');
  bindSel('#rdArea', 'area');
  bindSel('#rdWomen', 'women');
  bindSel('#rdSeats', 'seats');
  $$('[data-ride]').forEach(card => {
    const r = rideById(card.dataset.ride);
    $$('[data-ract]', card).forEach(b => (b.onclick = () => rideAction(r, b.dataset.ract)));
    $$('[data-rq]', card).forEach(b => (b.onclick = () => answerRideRequest(r, b.dataset.user, b.dataset.rq === 'accept')));
  });
}

async function rideAction(r, act) {
  if (act === 'request') return openSeatRequest(r);
  if (act === 'report') return openReportModal('ride', r.id);
  if (act === 'cancel') myRideReq(r).status = 'cancelled';
  if (act === 'pause') r.active = !r.active;
  if (act === 'delete') {
    if (!(await confirmBox(t('rdDeleteQ'), t('rideTitle', { area: areaName(r.area) }), { ok: t('delete'), danger: true }))) return;
    db('rides').splice(db('rides').indexOf(r), 1);
  }
  commit('rides');
  drawRides();
}

function openSeatRequest(r) {
  if (womenBlocked(r)) return toast(t('rdWomenBlocked'), 'bad');
  const max = r.kind === 'offer' ? seatsLeft(r) : 1;
  openModal(`<h2 id="mTitle">${ic('seat')} ${t(r.kind === 'offer' ? 'rdRequestSeat' : 'rdOfferLift')}</h2>${routeHtml(r)}
    <form id="seatForm" class="mt" novalidate>
      ${r.kind === 'offer' ? `<label class="f" for="sqSeats"><span>${t('rdSeatsQ')}</span><select id="sqSeats">${Array.from({ length: max }, (_, i) => `<option>${i + 1}</option>`).join('')}</select></label>` : ''}
      <label class="f" for="sqMsg"><span>${t('rdMsg')}</span><textarea id="sqMsg" maxlength="300" data-req data-min="5"></textarea></label>
      <div class="note teal">${ic('lock')}<span>${t('rdSub')}</span></div>
      <div class="foot"><button type="button" class="btn ghost" id="sqCancel">${t('cancel')}</button><button type="submit" class="btn">${ic('send')} ${t('submit')}</button></div></form>`);
  $('#sqCancel').onclick = closeModal;
  $('#seatForm').onsubmit = e => {
    e.preventDefault();
    if (!validate($('#seatForm'))) return;
    const seats = $('#sqSeats') ? +$('#sqSeats').value : 1;
    r.requests = r.requests.filter(q => q.userId !== meId());
    r.requests.push({ userId: meId(), seats, msg: $('#sqMsg').value.trim(), status: 'pending', ts: Date.now() });
    commit('rides');
    notify(r.userId, 'ride', 'n_rideReq', { name: me().name, n: seats, area: r.area }, 'rides');
    closeModal();
    toast(t('rdReqSent'), 'ok');
    drawRides();
  };
}

function answerRideRequest(r, userId, accept) {
  const q = r.requests.find(x => x.userId === userId && x.status === 'pending');
  if (!q || r.userId !== meId()) return;
  if (accept && r.kind === 'offer' && q.seats > seatsLeft(r)) return toast(t('rdFull'), 'bad');
  q.status = accept ? 'accepted' : 'declined';
  q.decidedAt = Date.now();
  commit('rides');
  notify(userId, 'ride', accept ? 'n_rideOk' : 'n_rideNo', {}, 'rides');
  toast(accept ? t('rdAccepted') : t('rdReqDeclined'), 'ok');
  drawRides();
}

function openRideForm() {
  const female = me().gender === 'f';
  const dayBoxes = DAYS.map(d => `<label class="check" style="display:inline-flex;margin-inline-end:10px"><input type="checkbox" name="rfd" value="${d}" ${d <= 5 ? 'checked' : ''}> ${dayName(d)}</label>`).join('');
  openModal(`<h2 id="mTitle">${ic('car')} ${t('rdNew')}</h2><form id="rideForm" novalidate>
    <div class="grid2"><label class="f" for="rfKind"><span>${t('rdKind')}</span><select id="rfKind"><option value="offer">${t('rdKindOffer')}</option><option value="request">${t('rdKindRequest')}</option></select></label>
      <label class="f" for="rfDir"><span>${t('rdDir')}</span><select id="rfDir"><option value="to">${t('rdToCampus')}</option><option value="from">${t('rdFromCampus')}</option></select></label></div>
    <div class="grid3"><label class="f" for="rfArea"><span>${t('rdArea')}</span><select id="rfArea">${AREAS.map(a => `<option value="${esc(a)}">${esc(areaName(a))}</option>`).join('')}</select></label>
      <label class="f" for="rfTime"><span>${t('rdTime')}</span><input type="time" id="rfTime" value="07:45" data-req></label>
      <label class="f" for="rfVeh"><span>${t('rdVehicle')}</span><select id="rfVeh">${Object.keys(VEHICLES).map(v => `<option value="${v}">${t('veh_' + v)}</option>`).join('')}</select></label></div>
    <fieldset class="f" style="border:0;padding:0;margin:0 0 12px"><legend style="font-weight:600;font-size:.84rem;margin-bottom:4px">${t('rdDays')}</legend>${dayBoxes}</fieldset>
    <div class="grid2"><label class="f" for="rfSeatsIn"><span>${t('rdSeatsQ')}</span><input type="number" id="rfSeatsIn" min="1" max="12" value="3" data-req></label>
      <label class="f" for="rfCost"><span>${t('rdCost')}</span><input type="number" id="rfCost" min="0" max="2000" value="150" data-req></label></div>
    <div class="note teal mb" id="rfSuggest"></div>
    <label class="f" for="rfPickup"><span>${t('rdPickup')}</span><input type="text" id="rfPickup" data-req data-min="3" maxlength="80"></label>
    <label class="f" for="rfNote"><span>${t('rdMsg')}</span><textarea id="rfNote" maxlength="300"></textarea></label>
    <label class="check"><input type="checkbox" id="rfWomen" ${female ? '' : 'disabled'}> <span>${t('rdWomenOnlyBox')}</span></label>${female ? '' : `<p class="tiny muted">${t('rdWomenOnlyNote')}</p>`}
    <div class="foot"><button type="button" class="btn ghost" id="rfCancel">${t('cancel')}</button><button type="submit" class="btn">${ic('send')} ${t('post')}</button></div></form>`, { wide: true });
  ['#rfArea', '#rfVeh', '#rfSeatsIn'].forEach(id => ($(id).oninput = updateCostSuggestion));
  updateCostSuggestion();
  $('#rfCancel').onclick = closeModal;
  $('#rideForm').onsubmit = e => {
    e.preventDefault();
    saveRide();
  };
}

function updateCostSuggestion() {
  const s = suggestCost($('#rfArea').value, $('#rfVeh').value, +$('#rfSeatsIn').value || 1);
  $('#rfSuggest').innerHTML = `${ic('calculator')}<span>${t('rdSuggest', { n: s.cost, km: s.km })} <button type="button" class="linkish" id="rfUse">${t('rdUseSuggest')}</button></span>`;
  $('#rfUse').onclick = () => ($('#rfCost').value = s.cost);
}

function saveRide() {
  if (!validate($('#rideForm'))) return;
  const days = $$('input[name=rfd]:checked').map(x => +x.value);
  const veh = $('#rfVeh').value;
  const seats = +$('#rfSeatsIn').value;
  const cost = +$('#rfCost').value;
  if (!days.length) return fail($$('input[name=rfd]')[0], t('rdNoDays'));
  if (!(seats >= 1 && seats <= VEHICLE_SEATS[veh])) return fail($('#rfSeatsIn'), t('rdSeatsBad', { n: VEHICLE_SEATS[veh] }));
  if (!(cost >= 0 && cost <= 2000)) return fail($('#rfCost'), t('rdCostBad'));
  const note = $('#rfNote').value.trim();
  const scr = screenText(note + ' ' + $('#rfPickup').value);
  if (scr.hits.length || scr.threat) return fail($('#rfNote'), t('abusiveText'));
  // TODO(student): replace the area list with real routes on a map (OSRM/Leaflet), match riders by detour distance and split cost by kilometres travelled.
  db('rides').unshift({
    id: uid('r'),
    kind: $('#rfKind').value,
    userId: meId(),
    area: $('#rfArea').value,
    toCampus: $('#rfDir').value === 'to',
    time: $('#rfTime').value,
    days,
    seats,
    vehicle: veh,
    cost,
    womenOnly: $('#rfWomen').checked && me().gender === 'f',
    pickup: $('#rfPickup').value.trim(),
    note,
    requests: [],
    reports: [],
    active: true,
    createdAt: Date.now(),
  });
  commit('rides');
  closeModal();
  toast(t('rdPosted'), 'ok');
  rdUi.mine = true;
  drawRides();
}

const fbUi = { cat: 'all', sort: 'votes' };
const FB_STATUS_TONE = { pending: 'ochre', held: 'bad', published: 'teal', answered: 'teal', resolved: 'ok', rejected: '', escalated: 'maroon' };
const fbCat = id => FB_CATS.find(c => c.id === id) || FB_CATS[FB_CATS.length - 1];
const fbStatusChip = s => chip(t('fs_' + s), FB_STATUS_TONE[s], s === 'held' ? 'shield' : s === 'resolved' ? 'check-circle' : '');
const PUBLIC_FB = ['published', 'answered', 'resolved'];
const tokenHashCache = {};

async function myFeedbackHashes() {
  const tokens = store.get('fbtokens', []);
  for (const tk of tokens) if (!tokenHashCache[tk]) tokenHashCache[tk] = await sha256Hex(tk);
  return tokens.map(tk => ({ token: tk, hash: tokenHashCache[tk] }));
}

function liveScreenHtml(text) {
  if (text.trim().length < 3) return '';
  const s = screenText(text);
  const parts = [];
  if (s.level === 'severe') parts.push(`<div class="note bad">${ic('alert')}<span>${t('fbLiveSevere')}</span></div>`);
  else if (s.hits.length) parts.push(`<div class="note">${ic('shield')}<span>${t('fbLiveMild', { words: unique(s.hits.map(h => h.word)).join(', ') })}</span></div>`);
  if (s.pii.length) parts.push(`<div class="note bad">${ic('eye-off')}<span>${t('fbLivePii', { kinds: s.pii.map(k => t('pii_' + k)).join(', ') })}</span></div>`);
  return parts.join('') || `<div class="note ok">${ic('check-circle')}<span>${t('fbLiveOk')}</span></div>`;
}

function renderFeedback() {
  $('#page').innerHTML = pageHead('message', t('nav_feedback'), t('fbTitle'), t('fbSub')) + `<div class="cols"><div id="fbWall"></div><div class="stack"><div id="fbForm"></div><div id="fbMineBox"></div></div></div>`;
  drawFeedbackForm();
  drawFeedbackWall();
  drawMyFeedback();
}

function drawFeedbackForm() {
  $('#fbForm').innerHTML = `<form class="card" id="fbF" novalidate><h2 class="mb">${ic('edit')} ${t('fbWrite')}</h2>
    <label class="f" for="fbCat"><span>${t('category')}</span><select id="fbCat">${optionList(FB_CATS, 'facilities')}</select></label>
    <label class="f" for="fbTxt"><span>${t('fbText')}</span><textarea id="fbTxt" data-req data-min="20" maxlength="1000" rows="5"></textarea><small>${t('fbTextHint')}</small></label>
    <div id="fbLive" aria-live="polite" class="mb"></div>
    <div class="note teal mb">${ic('lock')}<span>${t('fbAnonNote')}</span></div>
    <button class="btn block" type="submit" id="fbSendBtn">${ic('send')} ${t('fbSend')}</button></form>`;
  $('#fbTxt').oninput = debounce(e => ($('#fbLive').innerHTML = liveScreenHtml(e.target.value)), 250);
  $('#fbF').onsubmit = e => {
    e.preventDefault();
    submitFeedback();
  };
}

async function submitFeedback() {
  if (!validate($('#fbF'))) return;
  $('#fbSendBtn').disabled = true;
  const text = $('#fbTxt').value.trim();
  const screen = screenText(text);
  const token = randomToken();
  const status = screen.hold ? 'held' : settings().autoPublish ? 'published' : 'pending';
  // Deliberately no userId, roll number or device fingerprint in the record.
  db('feedback').unshift({ id: uid('fb'), cat: $('#fbCat').value, text, ts: Date.now(), status, responses: [], votes: [], tokenHash: await sha256Hex(token), screen: { level: screen.level, pii: screen.pii, words: screen.hits.map(h => h.word) } });
  commit('feedback');
  store.set('fbtokens', [token, ...store.get('fbtokens', [])].slice(0, 30));
  if (status === 'held') notify(PERSONAS.staff, 'mod', 'n_fbHeld', { n: 1 }, 'moderation/feedback');
  updateNavBadges();
  openModal(`<h2 id="mTitle">${ic('key')} ${t('fbCodeTitle')}</h2><p class="muted">${t('fbCodeBody')}</p><div class="token ltr" id="fbToken">${esc(token)}</div>
    ${status === 'held' ? `<div class="note mt">${ic('shield')}<span>${t('fbHeldNote')}</span></div>` : ''}
    <div class="foot"><button class="btn ghost" id="fbCopy">${ic('copy')} ${t('copy')}</button><button class="btn" id="fbDone">${t('done')}</button></div>`);
  $('#fbCopy').onclick = () => copyText(token);
  $('#fbDone').onclick = closeModal;
  renderFeedback();
}

function threadHtml(f) {
  if (!f.responses.length) return '';
  return `<div class="thread">${f.responses.map(r => `<div class="msg ${r.by === 'mod' ? 'mod' : ''}"><small>${r.by === 'mod' ? esc(r.name || t('fbModerator')) : t('fbSubmitter')} · ${esc(ago(r.ts))}</small>${esc(r.text)}</div>`).join('')}</div>`;
}

function drawFeedbackWall() {
  const list = visible(db('feedback'))
    .filter(f => PUBLIC_FB.includes(f.status) && (fbUi.cat === 'all' || f.cat === fbUi.cat))
    .sort(fbUi.sort === 'votes' ? (a, b) => b.votes.length - a.votes.length || b.ts - a.ts : (a, b) => b.ts - a.ts);
  const cats = [{ id: 'all', en: 'All topics', ur: 'تمام موضوعات', icon: 'list' }, ...FB_CATS];
  const items = list.map(f => {
    const voted = f.votes.includes(meId());
    const staffTools = isStaff() ? `<form class="row mt" data-reply="${f.id}"><input type="text" placeholder="${esc(t('fbReplyPh'))}" aria-label="${esc(t('fbReply'))}" style="flex:1;min-width:160px" maxlength="500"><button class="btn teal sm" type="submit">${ic('send')} ${t('fbReply')}</button>${f.status !== 'resolved' ? `<button class="btn ghost sm" type="button" data-resolve="${f.id}">${ic('check')} ${t('fbResolve')}</button>` : ''}</form>` : '';
    return `<article class="fb"><div class="row">${chip(tx(fbCat(f.cat)), 'teal', fbCat(f.cat).icon)}${fbStatusChip(f.status)}<span class="small muted">${esc(ago(f.ts))}</span></div>
      <p class="txt mt">${esc(f.text)}</p><button class="btn ${voted ? 'soft teal' : 'ghost'} xs" data-vote="${f.id}" aria-pressed="${voted}">${ic('thumbs-up')} ${t('fbMeToo')} <span class="tnum">${f.votes.length}</span></button>${threadHtml(f)}${staffTools}</article>`;
  });
  $('#fbWall').innerHTML = `<div class="card"><div class="card-h"><h2>${ic('globe')} ${t('fbWall')}</h2><div class="seg"><button data-fsort="votes" aria-pressed="${fbUi.sort === 'votes'}">${t('fbSortVotes')}</button><button data-fsort="new" aria-pressed="${fbUi.sort === 'new'}">${t('newest')}</button></div></div>
    <div class="filter-chips mb">${cats.map(c => `<button data-fcat="${c.id}" aria-pressed="${fbUi.cat === c.id}">${ic(c.icon)}${esc(tx(c))}</button>`).join('')}</div>
    <div class="stagger">${items.join('') || `<p class="small muted">${t('fbWallNone')}</p>`}</div></div>`;
  bindFeedbackWall();
  animateIn($('#fbWall'));
}

function bindFeedbackWall() {
  const box = $('#fbWall');
  $$('[data-fcat]', box).forEach(b => {
    b.onclick = () => {
      fbUi.cat = b.dataset.fcat;
      drawFeedbackWall();
    };
  });
  $$('[data-fsort]', box).forEach(b => {
    b.onclick = () => {
      fbUi.sort = b.dataset.fsort;
      drawFeedbackWall();
    };
  });
  $$('[data-vote]', box).forEach(b => {
    b.onclick = () => {
      const f = TARGETS.feedback.find(b.dataset.vote);
      f.votes = f.votes.includes(meId()) ? f.votes.filter(v => v !== meId()) : [...f.votes, meId()];
      commit('feedback');
      drawFeedbackWall();
    };
  });
  $$('[data-reply]', box).forEach(form => {
    form.onsubmit = e => {
      e.preventDefault();
      const text = $('input', form).value.trim();
      if (text.length < 3) return;
      replyFeedback(TARGETS.feedback.find(form.dataset.reply), text);
    };
  });
  $$('[data-resolve]', box).forEach(b => (b.onclick = () => setFeedbackStatus(TARGETS.feedback.find(b.dataset.resolve), 'resolved')));
}

function replyFeedback(f, text) {
  f.responses.push({ by: 'mod', name: deptName(me().dept), text, ts: Date.now() });
  if (f.status === 'published') f.status = 'answered';
  commit('feedback');
  audit('feedback_reply', 'feedback', f.id, text.slice(0, 80));
  toast(t('fbReplySent'), 'ok');
  rerender();
}

function setFeedbackStatus(f, status, detail = '') {
  f.status = status;
  commit('feedback');
  audit('feedback_' + status, 'feedback', f.id, detail || f.text.slice(0, 60));
  updateNavBadges();
  rerender();
}

async function drawMyFeedback() {
  const mine = await myFeedbackHashes();
  const byHash = Object.fromEntries(mine.map(m => [m.hash, m.token]));
  const list = db('feedback').filter(f => f.tokenHash && byHash[f.tokenHash]);
  const rows = list.map(f => `<div class="fb"><div class="row">${chip(tx(fbCat(f.cat)), 'teal', fbCat(f.cat).icon)}${fbStatusChip(f.status)}<span class="tiny muted ltr">${esc(byHash[f.tokenHash])}</span></div><p class="txt small mt">${esc(f.text)}</p>${threadHtml(f)}
    <form class="row mt" data-follow="${f.id}"><input type="text" aria-label="${esc(t('fbFollow'))}" placeholder="${esc(t('fbFollow'))}" style="flex:1;min-width:140px" maxlength="400"><button class="btn ghost sm" type="submit">${ic('send')}</button><button class="btn ghost sm" type="button" data-forget="${esc(byHash[f.tokenHash])}">${t('fbForget')}</button></form></div>`);
  if (!$('#fbMineBox')) return;
  $('#fbMineBox').innerHTML = `<div class="card"><h2 class="mb">${ic('key')} ${t('fbMine')}</h2>${rows.join('') || `<p class="small muted">${t('fbNoMine')}</p>`}
    <form class="row mt" id="fbLook"><input type="text" id="fbCode" class="ltr" placeholder="FB-XXXX-XXXX" aria-label="${esc(t('fbLookup'))}" style="flex:1;min-width:140px"><button class="btn ghost sm" type="submit">${ic('search')} ${t('fbLookupBtn')}</button></form><p class="tiny muted">${t('fbLookup')}</p></div>`;
  bindMyFeedback();
}

function bindMyFeedback() {
  $$('[data-follow]').forEach(form => {
    form.onsubmit = e => {
      e.preventDefault();
      const text = $('input', form).value.trim();
      if (text.length < 3) return;
      const f = TARGETS.feedback.find(form.dataset.follow);
      f.responses.push({ by: 'author', text, ts: Date.now() });
      commit('feedback');
      toast(t('fbFollowSent'), 'ok');
      drawMyFeedback();
    };
  });
  $$('[data-forget]').forEach(b => {
    b.onclick = () => {
      store.set('fbtokens', store.get('fbtokens', []).filter(x => x !== b.dataset.forget));
      drawMyFeedback();
    };
  });
  $('#fbLook').onsubmit = async e => {
    e.preventDefault();
    const code = $('#fbCode').value.trim().toUpperCase();
    const hash = await sha256Hex(code);
    if (!db('feedback').some(f => f.tokenHash === hash)) return toast(t('fbLookupNone'), 'bad');
    store.set('fbtokens', unique([code, ...store.get('fbtokens', [])]));
    drawMyFeedback();
  };
}

const MD_TABS = ['queue', 'feedback', 'audit', 'rules'];
const mdUi = { tab: 'queue', q: '', action: 'all' };
const canSeeModeration = () => isStaff() || (role === 'socadmin' && managedSocieties().length > 0);
const heldFeedback = () => visible(db('feedback')).filter(f => ['pending', 'held'].includes(f.status));

function renderModeration(arg) {
  if (!canSeeModeration()) {
    $('#page').innerHTML = pageHead('shield', t('nav_moderation'), t('mdTitle'), t('mdSub')) + emptyState('lock', t('mdNoAccess'), t('mdNoAccessSub'));
    return;
  }
  if (MD_TABS.includes(arg)) mdUi.tab = arg;
  if (!isStaff() && ['feedback', 'rules'].includes(mdUi.tab)) mdUi.tab = 'queue';
  const tabs = [['queue', t('mdQueue'), 'flag', modQueue().length], ['audit', t('mdAudit'), 'history']];
  if (isStaff()) tabs.splice(1, 0, ['feedback', t('mdFeedback'), 'message', heldFeedback().length]);
  if (isStaff()) tabs.push(['rules', t('mdRules'), 'sliders']);
  $('#page').innerHTML = pageHead('shield', t('nav_moderation'), t('mdTitle'), t('mdSub')) + tabsLine('mdTabs', tabs, mdUi.tab) + '<div id="mdBody"></div>';
  bindTabs($('#mdTabs'), tab => setHash('moderation/' + tab));
  ({ queue: drawModQueue, feedback: drawFeedbackQueue, audit: drawAudit, rules: drawRules })[mdUi.tab]($('#mdBody'));
  animateIn($('#mdBody'));
}

function reasonChips(reports) {
  const counts = {};
  reports.forEach(r => (counts[r.reason] = (counts[r.reason] || 0) + 1));
  return Object.entries(counts)
    .map(([k, n]) => chip(`${t('reason_' + k)} · ${n}`, k === 'scam' || k === 'offensive' ? 'bad' : 'ochre'))
    .join('');
}

function modItemHtml(q) {

// Wrap flagged words and personal data in <mark> so the moderator sees why a message was held.
function highlightFlags(text) {
  const s = screenText(text);
  let html = esc(text);
  unique(s.hits.map(h => h.word)).forEach(w => {
    html = html.split(esc(w)).join(`<mark class="flagged">${esc(w)}</mark>`);
  });
  PII_RES.forEach(p => {
    html = html.replace(new RegExp(p.re.source, p.re.flags.replace('g', '') + 'g'), m => `<mark class="flagged">${m}</mark>`);
  });
  return { html, s };
}

function redactText(text) {
  let out = screenText(text).masked;
  PII_RES.forEach(p => {
    out = out.replace(new RegExp(p.re.source, p.re.flags.replace('g', '') + 'g'), p.kind === 'name' ? m => m.split(/\s+/)[0] + ' [name removed]' : '[removed]');
  });
  return out;
}

// ---------- moderation: feedback review ----------
function drawFeedbackQueue(body) {
  const list = heldFeedback().sort((a, b) => (b.status === 'held') - (a.status === 'held') || b.ts - a.ts);
  const clean = list.filter(f => f.status === 'pending' && !screenText(f.text).hold);
  const rows = list.map(f => {
    const { html, s } = highlightFlags(f.text);
    const tags = [chip(t('mdLevel', { level: t('lvl_' + s.level) }), s.level === 'clean' ? 'ok' : s.level === 'mild' ? 'ochre' : 'bad', 'shield'), ...s.pii.map(k => chip(t('pii_' + k), 'bad', 'eye-off'))].join('');
    const btn = (act, icon, label, cls = 'ghost') => `<button class="btn ${cls} sm" data-fb="${act}" data-id="${f.id}">${ic(icon)} ${label}</button>`;
    return `<div class="mod-item"><div><div class="row">${chip(tx(fbCat(f.cat)), 'teal', fbCat(f.cat).icon)}${fbStatusChip(f.status)}${tags}<span class="small muted">${esc(ago(f.ts))}</span></div>
      <div class="preview">${html}</div>${s.hold ? `<div class="small mt"><b>${t('mdMasked')}:</b> <bdi>${esc(redactText(f.text))}</bdi></div>` : ''}${threadHtml(f)}
      <form class="row mt" data-private="${f.id}"><input type="text" aria-label="${esc(t('mdPrivateReply'))}" placeholder="${esc(t('mdPrivatePh'))}" style="flex:1;min-width:160px" maxlength="500"><button class="btn ghost sm" type="submit">${ic('send')} ${t('mdPrivateReply')}</button></form></div>
      <div class="mod-actions">${btn('publish', 'check', t('mdPublish'), 'teal')}${s.hold ? btn('masked', 'eye-off', t('mdPublishMasked')) : ''}${f.cat === 'safety' ? btn('escalate', 'shield', t('mdEscalate')) : ''}${btn('reject', 'x', t('mdReject'), 'danger')}</div></div>`;
  });
  body.innerHTML = (clean.length ? `<div class="toolbar"><span class="spacer"></span><button class="btn teal sm" id="fbBulk">${ic('check-check')} ${t('mdApproveClean', { n: clean.length })}</button></div>` : '') + (rows.join('') || emptyState('message', t('mdFbEmpty')));
  if ($('#fbBulk')) {
    $('#fbBulk').onclick = () => {
      clean.forEach(f => (f.status = 'published'));
      commit('feedback');
      clean.forEach(f => audit('feedback_published', 'feedback', f.id, f.text.slice(0, 60)));
      updateNavBadges();
      rerender();
    };
  }
  $$('[data-fb]', body).forEach(b => (b.onclick = () => decideFeedback(TARGETS.feedback.find(b.dataset.id), b.dataset.fb)));
  $$('[data-private]', body).forEach(form => {
    form.onsubmit = e => {
      e.preventDefault();
      const text = $('input', form).value.trim();
      if (text.length >= 3) replyFeedback(TARGETS.feedback.find(form.dataset.private), text);
    };
  });
}

function decideFeedback(f, act) {
  if (act === 'masked') {
    f.original = f.original || f.text;
    f.text = redactText(f.text);
    return setFeedbackStatus(f, 'published', t('mdPublishMasked'));
  }
  const status = { publish: 'published', reject: 'rejected', escalate: 'escalated' }[act];
  setFeedbackStatus(f, status);
}

function todayCard() {
  const day = new Date().getDay();
  const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
  const list = blocksFor(myTt())
    .filter(b => b.day === day)
    .sort((a, b) => toMin(a.start) - toMin(b.start));
  const nextIdx = list.findIndex(b => toMin(b.end) > nowMin);
  const rows = list.map((b, i) => {
    const now = toMin(b.start) <= nowMin && nowMin < toMin(b.end);
    const tag = now ? chip(t('dNow'), 'maroon') : i === nextIdx ? chip(t('dNext'), 'teal') : '';
    return `<div class="slot-row ${now ? 'now' : ''}"><span class="tt-time">${fmtTime(b.start)}</span><span><b>${esc(b.label)}</b> <span class="small muted">${esc(b.title)}</span></span><span class="row">${b.room ? chip(b.room, 'line', 'door') : ''}${tag}</span></div>`;

function lfStats() {
  const items = visible(db('items'));
  const found = items.filter(i => i.type === 'found');
  const returned = found.filter(i => i.status === 'returned');
  const closedFound = found.filter(i => ['returned', 'expired'].includes(i.status));
  const days = visible(db('handovers'))
    .map(h => {
      const it = itemById(h.itemId);
      return it ? (h.ts - it.createdAt) / DAY : null;
    })
    .filter(d => d != null);
  return { items, found, returned, rate: pct(returned.length, closedFound.length || 1), median: Math.round(median(days) * 10) / 10 };
}

// Grouped horizontal-ish vertical bars: lost (maroon) and found (teal) per category.
function categoryChart(items) {
  const cats = LF_CATS.filter(c => items.some(i => i.cat === c.id));
  const w = 640;
  const h = 220;
  const max = Math.max(1, ...cats.map(c => Math.max(...['lost', 'found'].map(tp => items.filter(i => i.cat === c.id && i.type === tp).length))));
  const bw = (w - 40) / cats.length;
  const bars = cats
    .map((c, i) => {
      const x = 30 + i * bw;
      return ['lost', 'found']
        .map((tp, j) => {
          const n = items.filter(it => it.cat === c.id && it.type === tp).length;
          const bh = (n / max) * (h - 60);
          return `<rect class="bv ${tp === 'lost' ? 'm' : ''}" x="${x + 4 + j * (bw / 2 - 4)}" y="${h - 30 - bh}" width="${bw / 2 - 6}" height="${bh}" rx="3"><title>${esc(tx(c))} · ${t(tp)}: ${n}</title></rect>${n ? `<text class="val" x="${x + 4 + j * (bw / 2 - 4) + (bw / 2 - 6) / 2}" y="${h - 34 - bh}" text-anchor="middle">${n}</text>` : ''}`;
        })
        .join('') + `<text x="${x + bw / 2}" y="${h - 12}" text-anchor="middle">${esc(tx(c.short))}</text>`;
    })
    .join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(t('rpByCat'))}"><line class="ax" x1="26" y1="${h - 30}" x2="${w - 6}" y2="${h - 30}"/>${bars}</svg>
    <div class="legend"><span><i style="background:var(--maroon)"></i>${t('lost')}</span><span><i style="background:var(--teal)"></i>${t('found')}</span></div>`;
}

function statusDonut(items) {
  const statuses = Object.keys(STATUS_META).filter(s => items.some(i => i.status === s));
  const colors = { open: 'var(--teal)', matched: 'var(--ochre)', claim_pending: '#e2a33b', approved: 'var(--teal-d)', returned: 'var(--ok)', resolved: '#6aa77f', expired: 'var(--sand-3)' };
  const total = items.length || 1;
  const r = 60;
  const c = 2 * Math.PI * r;
  let offset = 0;
  const segs = statuses
    .map(s => {
      const n = items.filter(i => i.status === s).length;
      const len = (n / total) * c;
      const seg = `<circle class="seg" cx="90" cy="90" r="${r}" stroke="${colors[s]}" stroke-dasharray="${len.toFixed(1)} ${(c - len).toFixed(1)}" stroke-dashoffset="${(-offset).toFixed(1)}" transform="rotate(-90 90 90)"><title>${t('st_' + s)}: ${n}</title></circle>`;
      offset += len;
      return seg;
    })
    .join('');
  return `<div class="row" style="align-items:center;gap:16px"><svg class="chart donut" viewBox="0 0 180 180" style="max-width:180px" role="img" aria-label="${esc(t('rpStatus'))}">${segs}<text x="90" y="86" text-anchor="middle" style="font-size:26px;font-weight:750;fill:var(--ink)">${items.length}</text><text x="90" y="106" text-anchor="middle">${esc(t('rpPosts'))}</text></svg>
    <div class="legend" style="flex-direction:column;gap:6px">${statuses.map(s => `<span><i style="background:${colors[s]}"></i>${t('st_' + s)} · ${items.filter(i => i.status === s).length}</span>`).join('')}</div></div>`;
}

function weeklyChart(items) {
  const weeks = Array.from({ length: 8 }, (_, i) => {
    const end = TODAY + DAY - (7 - i) * 7 * DAY;
    const start = end - 7 * DAY;
    return { start, n: items.filter(it => it.createdAt >= start && it.createdAt < end).length };
  });
  const w = 640;
  const h = 180;
  const max = Math.max(1, ...weeks.map(x => x.n));
  const pts = weeks.map((wk, i) => [30 + i * ((w - 60) / 7), h - 30 - (wk.n / max) * (h - 60)]);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  const grid = [0.5, 1].map(f => `<line class="gl" x1="26" x2="${w - 6}" y1="${h - 30 - f * (h - 60)}" y2="${h - 30 - f * (h - 60)}"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(t('rpWeekly'))}">${grid}<line class="ax" x1="26" y1="${h - 30}" x2="${w - 6}" y2="${h - 30}"/><path class="ln draw" d="${d}"/>
    ${pts.map((p, i) => `<circle class="dot" cx="${p[0]}" cy="${p[1]}" r="4"><title>${weeks[i].n}</title></circle><text x="${p[0]}" y="${h - 12}" text-anchor="middle">${esc(fmtDate(weeks[i].start, { day: 'numeric', month: 'short' }))}</text><text class="val" x="${p[0]}" y="${p[1] - 9}" text-anchor="middle">${weeks[i].n}</text>`).join('')}</svg>`;
}

function hotspotMap(items) {
  const counts = {};
  items.forEach(i => (counts[i.place] = (counts[i.place] || 0) + 1));
  const max = Math.max(1, ...Object.values(counts));
  const heat = Object.entries(counts).map(([p, n]) => ({ ...placeCenter(p), r: 18 + (n / max) * 46 }));
  return `<div class="map-wrap">${campusMap({ heat, badges: counts })}</div>`;
}

function applySetting(key, val) {
  if (key === 'lang') {
    lang = val;
    store.set('lang', lang);
    applyLang();
    return;
  }
  saveSettings({ [key]: val });
  applyTheme();
  if (cur === 'settings') renderSettings();
  else rerender();
  if (key === 'demo') updateNavBadges();
}

function applyTheme() {
  const s = settings();
  const root = document.documentElement;
  root.dataset.theme = s.theme;
  root.dataset.size = s.size;
  root.classList.toggle('rm', s.motion === 'reduce');
  $('meta[name=theme-color]').setAttribute('content', s.theme === 'dark' ? '#2b0b12' : '#5b1521');
}

function exportData() {
  const data = {};
  Object.keys(COLLS).forEach(k => (data[k] = db(k)));
  const payload = { app: 'campushub', version: SEED_VERSION, exportedAt: new Date().toISOString(), settings: settings(), role, lang, fbtokens: store.get('fbtokens', []), data };
  downloadText(`campushub-backup-${isoDate(Date.now())}.json`, JSON.stringify(payload, null, 2));
}

async function importData() {
  const file = await pickFile('application/json,.json');
  if (!file) return;
  try {
    const payload = JSON.parse(await readText(file));
    if (payload.app !== 'campushub' || typeof payload.data !== 'object') throw new Error('shape');
    Object.keys(COLLS).forEach(k => {
      if (payload.data[k] !== undefined) store.set(k, payload.data[k]);
    });
    store.set('settings', { ...DEFAULT_SETTINGS, ...(payload.settings || {}) });
    store.set('fbtokens', Array.isArray(payload.fbtokens) ? payload.fbtokens : []);
    store.set('seeded', SEED_VERSION);
    toast(t('stImported'), 'ok');
    setTimeout(() => location.reload(), 600);
  } catch {
    toast(t('stImportBad'), 'bad');
  }
}

async function resetData() {
  if (!(await confirmBox(t('stResetQ'), t('stResetBody'), { ok: t('stReset'), danger: true }))) return;
  store.keys().forEach(k => store.remove(k));
  location.hash = '';
  location.reload();
}

function searchAll(q) {
  const needle = q.trim().toLowerCase();
  if (needle.length < 2) return [];
  const has = (...parts) => parts.join(' ').toLowerCase().includes(needle);
  const groups = [
    ['items', visible(db('items')).filter(i => viewable(i, i.userId) && has(i.title.en || i.title, i.title.ur || '', i.desc, i.colour, i.brand)).map(i => ({ icon: catById(i.cat).icon, title: itemTitle(i), sub: `${t(i.type)} · ${placeName(i.place)}`, href: 'lostfound/' + i.id }))],
    ['notices', myNotices().filter(n => has(tx(n.title), n.title.en, tx(n.body))).map(n => ({ icon: 'megaphone', title: tx(n.title), sub: ago(n.posted), href: 'notices/' + n.id }))],
    ['events', visible(db('events')).filter(e => has(tx(e.title), e.title.en, tx(e.desc))).map(e => ({ icon: 'calendar', title: tx(e.title), sub: fmtDate(parseDate(e.date)), href: 'events/' + e.id }))],
    ['societies', visible(db('societies')).filter(s => has(tx(s.name), s.name.en, tx(s.about))).map(s => ({ icon: s.icon, title: tx(s.name), sub: t('scMembers', { n: memberCount(s) }), href: 'societies/' + s.id }))],
    ['courses', SECTIONS.filter(s => has(s.code, s.title.en, s.title.ur, s.instructor)).map(s => ({ icon: 'book', title: `${s.code}-${s.section} ${tx(s.title)}`, sub: s.instructor, href: 'timetable/courses', q: s.code }))],
    ['rooms', ROOMS.filter(r => has(r.id, placeName(r.place))).map(r => ({ icon: 'door', title: r.id, sub: placeName(r.place), href: 'timetable/rooms' }))],
    ['rides', visible(db('rides')).filter(r => viewable(r, r.userId) && has(r.area, areaName(r.area), r.pickup, r.note)).map(r => ({ icon: 'car', title: t('rideTitle', { area: areaName(r.area) }), sub: `${fmtTime(r.time)} · ${r.pickup}`, href: 'rides' }))],
    ['places', PLACES.filter(p => has(p.en, p.ur)).map(p => ({ icon: 'map-pin', title: tx(p), sub: t('mapTitle'), href: 'lostfound/map', place: p.id }))],
    ['pages', Object.keys(ROUTES).filter(r => has(t('nav_' + r), STR['nav_' + r][0])).map(r => ({ icon: NAV_ICON[r], title: t('nav_' + r), sub: 'CampusHub', href: r }))],
  ];
  return groups.filter(([, list]) => list.length).map(([k, list]) => [k, list.slice(0, 5)]);
}

function markQuery(text, q) {
  const s = esc(text);
  const i = s.toLowerCase().indexOf(esc(q.trim()).toLowerCase());
  if (i < 0 || !q.trim()) return s;
  const n = esc(q.trim()).length;
  return `${s.slice(0, i)}<mark>${s.slice(i, i + n)}</mark>${s.slice(i + n)}`;
}

function drawSearch(q) {
  const panel = $('#srPanel');
  const groups = searchAll(q);
  srIndex = -1;
  if (q.trim().length < 2) {
    panel.classList.add('hidden');
    $('#q').setAttribute('aria-expanded', 'false');
    return;
  }
  const total = sum(groups.map(([, l]) => l.length));
  panel.innerHTML = groups.length
    ? groups.map(([k, list]) => `<h6>${t('sg_' + k)}</h6>${list.map(r => `<a href="#${r.href}" role="option" data-sq="${esc(r.q || '')}" data-place="${esc(r.place || '')}">${ic(r.icon)}<span><span>${markQuery(r.title, q)}</span><small>${esc(r.sub)}</small></span></a>`).join('')}`).join('')
    : `<p class="small muted" style="padding:10px">${esc(t('srNone', { q }))}</p>`;
  panel.classList.remove('hidden');
  $('#q').setAttribute('aria-expanded', 'true');
  announce(t('srCount', { n: total }));
  $$('a', panel).forEach(a => (a.onclick = () => pickSearchResult(a)));
}

function pickSearchResult(a) {
  if (a.dataset.sq) ttUi.q = a.dataset.sq;
  if (a.dataset.place) {
    lfUi.place = a.dataset.place;
    lfUi.tab = 'map';
  }
  closeSearch();
}

function closeSearch() {
  $('#srPanel').classList.add('hidden');
  $('#q').setAttribute('aria-expanded', 'false');
  $('#q').value = '';
}

function bindSearch() {
  const input = $('#q');
  input.oninput = debounce(() => drawSearch(input.value), 120);
  input.onkeydown = e => {
    const links = $$('#srPanel a');
    if (e.key === 'Escape') return closeSearch();
    if (!links.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      srIndex = (srIndex + (e.key === 'ArrowDown' ? 1 : -1) + links.length) % links.length;
      links.forEach((l, i) => l.classList.toggle('on', i === srIndex));
      links[srIndex].scrollIntoView({ block: 'nearest' });
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      const target = links[Math.max(0, srIndex)];
      pickSearchResult(target);
      location.hash = target.getAttribute('href').slice(1);
    }
  };
  document.addEventListener('click', e => {
    if (!e.target.closest('#searchBox')) $('#srPanel').classList.add('hidden');
  });
}

const TOUR_STEPS = [
  { el: '#who', key: 'tour_1', side: true },
  { el: '#nav', key: 'tour_2', side: true },
  { el: '#searchBox', key: 'tour_3' },
  { el: '#qLost', key: 'tour_4' },
  { el: '#dashMap', key: 'tour_5' },
  { el: '#bellBtn', key: 'tour_6' },
  { el: '#langBtn', key: 'tour_7' },
];
let tourStep = -1;

function startTour() {
  closeModal();
  if (cur !== 'dashboard') location.hash = 'dashboard';
  tourStep = 0;
  $('#tour').classList.add('on');
  setTimeout(showTourStep, 60);
}

function endTour() {
  tourStep = -1;
  $('#tour').classList.remove('on');
  document.body.classList.remove('nav-open');
  store.set('tour', { done: true, ts: Date.now() });
}

function positionTip(rect) {
  const tip = $('#tourTip');
  const spot = $('#tourSpot');
  const pad = 6;
  Object.assign(spot.style, { left: rect.left - pad + 'px', top: rect.top - pad + 'px', width: rect.width + pad * 2 + 'px', height: Math.min(rect.height, window.innerHeight - 40) + pad * 2 + 'px' });
  const tw = Math.min(340, window.innerWidth - 32);
  const below = rect.bottom + 14;
  const fitsBelow = below + tip.offsetHeight + 12 < window.innerHeight;
  const top = fitsBelow ? below : Math.max(12, rect.top - 14 - tip.offsetHeight);
  let left = rect.left + rect.width / 2 - tw / 2;
  if (rect.width > window.innerWidth * 0.6 || rect.height > window.innerHeight * 0.5) left = (window.innerWidth - tw) / 2;
  left = Math.max(16, Math.min(left, window.innerWidth - tw - 16));
  tip.style.top = (rect.height > window.innerHeight * 0.5 ? Math.max(12, window.innerHeight / 2 - tip.offsetHeight / 2) : top) + 'px';
  tip.style.left = left + 'px';
}

function showTourStep() {
  const step = TOUR_STEPS[tourStep];
  if (!step) return endTour();
  const narrow = window.innerWidth <= 900;
  document.body.classList.toggle('nav-open', narrow && !!step.side);
  const el = $(step.el);
  if (!el || (!el.offsetParent && !step.side)) {
    tourStep++;
    return showTourStep();
  }
  const last = tourStep === TOUR_STEPS.length - 1;
  const dots = TOUR_STEPS.map((_, i) => `<i class="${i === tourStep ? 'on' : ''}"></i>`).join('');
  $('#tourTip').innerHTML = `<h3>${t(step.key + 't')}</h3><p>${t(step.key + 'b')}</p>
    <div class="between"><div class="dots">${dots}</div><div class="row">
      <button class="btn ghost sm" id="tourSkip">${t('tour_skip')}</button>
      ${tourStep > 0 ? `<button class="btn ghost sm" id="tourBack">${t('tour_back')}</button>` : ''}
      <button class="btn sm" id="tourNext">${last ? t('tour_done') : t('tour_next')}</button></div></div>`;
  $('#tourSkip').onclick = endTour;
  $('#tourNext').onclick = () => {
    tourStep++;
    showTourStep();
  };
  if ($('#tourBack')) {
    $('#tourBack').onclick = () => {
      tourStep--;
      showTourStep();
    };
  }
  const place = () => {
    if (!step.side) el.scrollIntoView({ block: 'center', behavior: 'instant' });
    positionTip(el.getBoundingClientRect());
    $('#tourNext').focus();
  };
  if (narrow && step.side) setTimeout(place, 340);
  else place();
}

window.addEventListener('resize', () => {
  if (tourStep >= 0) showTourStep();
});

function openShortcuts() {
  const row = (keys, k) => `<div class="setrow"><span>${t(k)}</span><span class="row">${keys.map(x => `<span class="kbd">${x}</span>`).join('')}</span></div>`;
  openModal(`<h2 id="mTitle">${ic('keyboard')} ${t('shortcuts')}</h2>
    ${row(['1', '…', '8'], 'ks_nav')}${row(['/'], 'ks_search')}${row(['N'], 'ks_lost')}${row(['F'], 'ks_found')}${row(['R'], 'ks_role')}${row(['L'], 'ks_lang')}${row(['D'], 'ks_theme')}${row(['I'], 'ks_inbox')}${row(['?'], 'ks_help')}${row(['Esc'], 'ks_close')}`);
}

function onKey(e) {
  trapFocus(e);
  const typing = /^(input|textarea|select)$/i.test(e.target.tagName || '') || e.target.isContentEditable;
  if (e.key === 'Escape') {
    if (tourStep >= 0) return endTour();
    if ($('#scrim').classList.contains('on')) return closeModal();
    document.body.classList.remove('nav-open');
    return closeSearch();
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || $('#scrim').classList.contains('on') || tourStep >= 0) return;
  const k = e.key.toLowerCase();
  if (e.key === '/') {
    e.preventDefault();
    return $('#q').focus();
  }
  if (e.key === '?') return openShortcuts();
  if (k === 'n') return openItemForm('lost');
  if (k === 'f') return openItemForm('found');
  if (k === 'l') return applySetting('lang', lang === 'en' ? 'ur' : 'en');
  if (k === 'd') return toggleTheme();
  if (k === 'i') return (location.hash = 'inbox');
  if (k === 'r') return switchRole(Object.keys(PERSONAS)[(Object.keys(PERSONAS).indexOf(role) + 1) % 3]);
  if (/^[1-8]$/.test(e.key)) location.hash = NAV_GROUPS[0][1][+e.key - 1];
}

function toggleTheme() {
  saveSettings({ theme: settings().theme === 'dark' ? 'light' : 'dark' });
  applyTheme();
  if (cur === 'settings') renderSettings();
}

// ---------- router, sidebar, role switcher, boot ----------
const ROUTES = {
  dashboard: renderDashboard,
  lostfound: renderLostFound,
  notices: renderNotices,
  events: renderEvents,
  timetable: renderTimetable,
  societies: renderSocieties,
  rides: renderRides,
  feedback: renderFeedback,
  moderation: renderModeration,
  reports: renderReports,
  inbox: renderInbox,
  settings: renderSettings,
  about: renderAbout,
};
const NAV_GROUPS = [
  ['navCampus', ['dashboard', 'lostfound', 'notices', 'events', 'timetable', 'societies', 'rides', 'feedback']],
  ['navManage', ['moderation', 'reports']],
  ['navYou', ['inbox', 'settings', 'about']],
];
const NAV_ICON = { dashboard: 'home', lostfound: 'search', notices: 'megaphone', events: 'calendar', timetable: 'clock', societies: 'users', rides: 'car', feedback: 'message', moderation: 'shield', reports: 'bar-chart', inbox: 'inbox', settings: 'settings', about: 'info' };
let cur = 'dashboard';
let curArg = '';

function parseHash() {
  const [r, a] = location.hash.slice(1).split('/');
  return [ROUTES[r] ? r : 'dashboard', a ? decodeURIComponent(a) : ''];
}

function setHash(route) {
  if (location.hash === '#' + route) go();
  else location.hash = route;
}

function navBadge(r) {
  if (r === 'lostfound') return isStaff() ? pendingClaimsForMe().length : matchPairs().length;
  if (r === 'notices') return unreadNotices().length;
  if (r === 'moderation') return canSeeModeration() ? modQueue().length + (isStaff() ? heldFeedback().length : 0) : 0;
  if (r === 'societies') return role === 'socadmin' ? joinRequestsForMe().length : 0;
  if (r === 'inbox') return unreadCount();
  return 0;
}

function renderNav() {
  $('#nav').innerHTML = NAV_GROUPS.map(([g, routes]) => {
    const items = routes
      .filter(r => r !== 'moderation' || canSeeModeration())
      .map(r => {
        const n = navBadge(r);
        return `<a href="#${r}" class="${r === cur ? 'on' : ''}" ${r === cur ? 'aria-current="page"' : ''}>${ic(NAV_ICON[r])}<span>${t('nav_' + r)}</span>${n ? `<span class="n">${n > 99 ? '99+' : n}</span>` : ''}</a>`;
      })
      .join('');
    return `<h6>${t(g)}</h6>${items}`;
  }).join('');
}

const updateNavBadges = () => {
  renderNav();
  updateBell();
};

function renderWho() {
  const u = me();
  $('#who').innerHTML = `<div class="me">${avatar(u.id)}<div style="min-width:0"><b>${esc(u.name)}</b><small><bdi>${esc(u.roll)}</bdi> · ${esc(deptName(u.dept))}</small></div></div>
    <div class="roles" role="group" aria-label="${esc(t('roleSwitch'))}">${Object.keys(PERSONAS).map(r => `<button data-role-btn="${r}" aria-pressed="${r === role}">${ic(ROLE_ICON[r])}<span>${t('role_' + r)}</span></button>`).join('')}</div>`;
  $$('[data-role-btn]').forEach(b => (b.onclick = () => switchRole(b.dataset.roleBtn)));
  $('#roleTag').innerHTML = `${ic(ROLE_ICON[role])} ${t('role_' + role)}`;
}

function switchRole(r) {
  // TODO(student): replace this demo switcher with real sign-in (university SSO / OAuth) and enforce roles on the server.
  if (!PERSONAS[r] || r === role) return;
  role = r;
  store.set('role', r);
  renderWho();
  toast(t('roleNow', { role: t('role_' + r) }), 'ok');
  if (cur === 'moderation' && !canSeeModeration()) location.hash = 'dashboard';
  go();
}

function go() {
  const [r, a] = parseHash();
  const changed = r !== cur;
  cur = r;
  curArg = a;
  closeModal();
  document.body.classList.remove('nav-open');
  $('#menuBtn').setAttribute('aria-expanded', 'false');
  ROUTES[r](a);
  renderNav();
  updateBell();
  const page = $('#page');
  animateIn(page);
  animateFigures(page);
  document.title = `${t('nav_' + r)} · CampusHub`;
  if (changed) {
    window.scrollTo(0, 0);
    page.focus({ preventScroll: true });
  }
}

// Re-render the current page in place (modal-opening arguments such as item ids are not replayed).
function rerender() {
  const modalArg = (cur === 'lostfound' && itemById(curArg)) || cur === 'events' || cur === 'notices';
  ROUTES[cur](modalArg ? (cur === 'lostfound' ? lfUi.tab : '') : curArg);
  renderNav();
  updateBell();
  animateFigures($('#page'));
}

function applyLang() {
  const root = document.documentElement;
  root.lang = lang;
  root.dir = lang === 'ur' ? 'rtl' : 'ltr';
  store.set('lang', lang);
  $$('[data-i18n]').forEach(el => (el.textContent = t(el.dataset.i18n)));
  $('#q').placeholder = window.innerWidth < 640 ? t('search') : t('searchPh');
  $('#q').setAttribute('aria-label', t('searchLabel'));
  $('#langBtn').textContent = t('langName');
  $('#langBtn').setAttribute('aria-label', t('switchLang'));
  $('#helpBtn').setAttribute('aria-label', t('shortcuts'));
  $('#menuBtn').setAttribute('aria-label', t('openMenu'));
  $('#side').setAttribute('aria-label', t('navCampus'));
  renderWho();
  go();
}

function bindChrome() {
  $('#langBtn').onclick = () => applySetting('lang', lang === 'en' ? 'ur' : 'en');
  $('#bellBtn').onclick = () => (location.hash = 'inbox');
  $('#helpBtn').onclick = openShortcuts;
  $('#menuBtn').onclick = () => {
    const open = document.body.classList.toggle('nav-open');
    $('#menuBtn').setAttribute('aria-expanded', String(open));
  };
  $('#scrimSide').onclick = () => document.body.classList.remove('nav-open');
  $('#scrim').onclick = e => {
    if (e.target === $('#scrim')) closeModal();
  };
  window.addEventListener('hashchange', go);
  document.addEventListener('keydown', onKey);
  bindSearch();
}

async function boot() {
  lang = store.get('lang', 'en') === 'ur' ? 'ur' : 'en';
  role = PERSONAS[store.get('role', 'student')] ? store.get('role', 'student') : 'student';
  applyTheme();
  await ensureSeeded();
  expireItems();
  bindChrome();
  applyLang();
  if (!store.get('tour', null) && !location.hash) setTimeout(startTour, 900);
}

boot();
