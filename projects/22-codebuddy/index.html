// ---------- tree helpers ----------
function findBlock(list, id, parent = null) {
  for (const b of list) {
    if (b.id === id) return { block: b, list, parent };
    for (const key of ['body', 'orelse']) {
      if (!b[key]) continue;
      const hit = findBlock(b[key], id, b);
      if (hit) return hit;
    }
  }
  return null;
}

function branchList(program, parentId, branch) {
  if (parentId === 'root') return program;
  const hit = findBlock(program, parentId);
  return hit ? hit.block[branch] : program;
}

function containsBlock(block, id) {
  return ['body', 'orelse'].some(k => (block[k] || []).some(b => b.id === id || containsBlock(b, id)));
}

// ---------- code generation ----------
function translateExpr(text, l) {
  const src = String(text ?? '').trim() || (l === 'py' ? 'None' : 'null');
  const map = l === 'py'
    ? { '&&': 'and', '||': 'or', '!': 'not ', true: 'True', false: 'False', null: 'None', '===': '==', '!==': '!=' }
    : { and: '&&', or: '||', not: '!', True: 'true', False: 'false', None: 'null' };
  return scanCode(src, l === 'py' ? 'js' : 'py').map(tk => (Object.prototype.hasOwnProperty.call(map, tk.v) && tk.t !== 'str' ? map[tk.v] : tk.v)).join('');
}

function blocksToCode(program, l) {
  const declared = new Set();
  const lines = [];
  const turtleNames = l === 'py' ? { up: 'penup', down: 'pendown' } : { up: 'penUp', down: 'penDown' };
  const semi = l === 'py' ? '' : ';';
  const emit = (list, depth) => {
    const pad = (l === 'py' ? '    ' : '  ').repeat(depth);
    if (!list.length && depth > 0 && l === 'py') lines.push(pad + 'pass');
    list.forEach(b => emitBlock(b, pad, depth));
  };
  const emitBlock = (b, pad, depth) => {
    const f = b.f;
    const v = x => translateExpr(x, l);
    if (b.type === 'move') lines.push(`${pad}${f.dir === 'back' ? 'back' : 'forward'}(${v(f.n)})${semi}`);
    else if (b.type === 'turn') lines.push(`${pad}${f.dir === 'right' ? 'right' : 'left'}(${v(f.n)})${semi}`);
    else if (b.type === 'circle') lines.push(`${pad}circle(${v(f.n)})${semi}`);
    else if (b.type === 'color') lines.push(`${pad}color(${JSON.stringify(f.c)})${semi}`);
    else if (b.type === 'pen') lines.push(`${pad}${turtleNames[f.state]}()${semi}`);
    else if (b.type === 'print') lines.push(`${pad}${l === 'py' ? 'print' : 'console.log'}(${v(f.v)})${semi}`);
    else if (b.type === 'setvar') lines.push(`${pad}${declare(f.name)}${f.name} = ${v(f.v)}${semi}`);
    else if (b.type === 'changevar') lines.push(`${pad}${f.name} += ${v(f.n)}${semi}`);
    else if (b.type === 'ask') lines.push(`${pad}${declare(f.name)}${f.name} = ${askExpr(f, l)}${semi}`);
    else if (b.type === 'repeat') emitRepeat(b, pad, depth);
    else if (b.type === 'if') emitIf(b, pad, depth);
  };
  const declare = name => (l === 'js' && !declared.has(name) ? (declared.add(name), 'let ') : '');
  const emitRepeat = (b, pad, depth) => {
    const i = 'ijkmn'[depth % 5];
    lines.push(l === 'py' ? `${pad}for ${i} in range(${translateExpr(b.f.n, l)}):` : `${pad}for (let ${i} = 0; ${i} < ${translateExpr(b.f.n, l)}; ${i}++) {`);
    emit(b.body, depth + 1);
    if (l === 'js') lines.push(pad + '}');
  };
  const emitIf = (b, pad, depth) => {
    const op = COMPARE_MAP[b.f.op] ? COMPARE_MAP[b.f.op][l === 'py' ? 0 : 1] : '==';
    const test = b.f.op === 'true' ? translateExpr(b.f.a, l) : `${translateExpr(b.f.a, l)} ${op} ${translateExpr(b.f.b, l)}`;
    lines.push(l === 'py' ? `${pad}if ${test}:` : `${pad}if (${test}) {`);
    emit(b.body, depth + 1);
    if (b.hasElse) {
      lines.push(l === 'py' ? `${pad}else:` : `${pad}} else {`);
      emit(b.orelse, depth + 1);
    }
    if (l === 'js') lines.push(pad + '}');
  };
  if (l === 'py' && hasTurtleBlocks(program)) lines.push('from turtle import *', '');
  emit(program, 0);
  return lines.join('\n') + '\n';
}

function askExpr(f, l) {
  const q = JSON.stringify(l === 'py' && !/\s$/.test(f.q) ? f.q + ' ' : f.q);
  const call = l === 'py' ? `input(${q})` : `ask(${q})`;
  if (!f.num) return call;
  return l === 'py' ? `int(${call})` : `Number(${call})`;
}

function hasTurtleBlocks(list) {
  return list.some(b => ['move', 'turn', 'circle', 'color', 'pen'].includes(b.type) || hasTurtleBlocks(b.body || []) || hasTurtleBlocks(b.orelse || []));
}

// ---------- code to blocks ----------
function exprSource(e, l) {
  const wrap = c => (c.k === 'logic' || c.k === 'cond' || (c.k === 'bin' && ['+', '-'].includes(c.op)) ? `(${exprSource(c, l)})` : exprSource(c, l));
  switch (e.k) {
    case 'num': return e.float && Number.isInteger(e.v) ? e.v.toFixed(1) : String(e.v);
    case 'str': return JSON.stringify(e.v);
    case 'bool': return l === 'py' ? (e.v ? 'True' : 'False') : String(e.v);
    case 'none': return l === 'py' ? 'None' : 'null';
    case 'undef': return 'undefined';
    case 'name': return e.id;
    case 'bin': return `${['*', '/', '%', '//'].includes(e.op) ? wrap(e.l) : exprSource(e.l, l)} ${e.op} ${['*', '/', '%', '//', '-'].includes(e.op) ? wrap(e.r) : exprSource(e.r, l)}`;
    case 'logic': return `${exprSource(e.l, l)} ${l === 'py' ? e.op : e.op === 'and' ? '&&' : '||'} ${exprSource(e.r, l)}`;
    case 'unary': return e.op === 'not' ? (l === 'py' ? 'not ' : '!') + wrap(e.e) : e.op + wrap(e.e);
    case 'call': return `${exprSource(e.fn, l)}(${e.args.map(a => exprSource(a, l)).join(', ')})`;
    case 'member': return `${exprSource(e.obj, l)}.${e.prop}`;
    case 'index': return `${exprSource(e.obj, l)}[${exprSource(e.idx, l)}]`;
    case 'list': return `[${e.items.map(a => exprSource(a, l)).join(', ')}]`;
    case 'tpl': return l === 'py' ? `f"${e.parts.map(p => (p.e ? `{${exprSource(p.e, l)}}` : p.s)).join('')}"` : '`' + e.parts.map(p => (p.e ? '${' + exprSource(p.e, l) + '}' : p.s)).join('') + '`';
    default: return '?';
  }
}

function codeToBlocks(code, l) {
  const skipped = [];
  const prog = parseProgram(code, l);
  const convert = list => list.flatMap(s => {
    const b = statementToBlock(s, l, convert);
    if (!b) {
      if (s.k !== 'import') skipped.push(s.line);
      return [];
    }
    return [b];
  });
  return { program: convert(prog.body), skipped };
}

function statementToBlock(s, l, convert) {
  if (s.k === 'expr' && s.e.k === 'call') return callToBlock(s.e, l);
  if (s.k === 'assign' && s.target.k === 'name') return assignToBlock(s, l);
  if (s.k === 'for' || s.k === 'foreach') return loopToBlock(s, l, convert);
  if (s.k === 'if') {
    const b = newBlock('if');
    const t = s.test;
    const op = t.k === 'bin' ? Object.keys(COMPARE_MAP).find(k => COMPARE_MAP[k].includes(t.op)) : null;
    Object.assign(b.f, op ? { a: exprSource(t.l, l), op, b: exprSource(t.r, l) } : { a: exprSource(t, l), op: 'true', b: '' });
    b.body = convert(s.body);
    b.orelse = convert(s.orelse);
    b.hasElse = s.orelse.length > 0;
    return b;
  }
  return null;
}

function callToBlock(e, l) {
  const name = exprText(e.fn).split('.').pop();
  const code = TURTLE_ALIASES[name];
  const arg = e.args[0] ? exprSource(e.args[0], l) : '';
  const mk = (type, f) => Object.assign(newBlock(type), { f: { ...BLOCK_TYPES[type].f, ...f } });
  if (code === 'fd' || code === 'bk') return mk('move', { dir: code === 'fd' ? 'forward' : 'back', n: arg });
  if (code === 'lt' || code === 'rt') return mk('turn', { dir: code === 'lt' ? 'left' : 'right', n: arg });
  if (code === 'circle') return mk('circle', { n: arg });
  if (code === 'color') return mk('color', { c: e.args[0] && e.args[0].k === 'str' ? e.args[0].v : 'black' });
  if (code === 'pu' || code === 'pd') return mk('pen', { state: code === 'pu' ? 'up' : 'down' });
  if (/^(print|log)$/.test(name)) return mk('print', { v: e.args.map(a => exprSource(a, l)).join(l === 'py' ? ', ' : ' + " " + ') });
  return null;
}

function assignToBlock(s, l) {
  const mk = (type, f) => Object.assign(newBlock(type), { f: { ...BLOCK_TYPES[type].f, ...f } });
  const v = s.value;
  const inner = v.k === 'call' && /^(int|Number)$/.test(exprText(v.fn)) ? v.args[0] : v;
  if (inner && inner.k === 'call' && /^(input|ask|prompt)$/.test(exprText(inner.fn))) {
    const q = inner.args[0] && inner.args[0].k === 'str' ? inner.args[0].v.trim() : '';
    return mk('ask', { q, name: s.target.id, num: inner !== v });
  }
  if (s.op === '+=') return mk('changevar', { name: s.target.id, n: exprSource(v, l) });
  if (s.op === '=') return mk('setvar', { name: s.target.id, v: exprSource(v, l) });
  return null;
}

function loopToBlock(s, l, convert) {
  let count = null;
  if (s.k === 'foreach' && s.iter.k === 'call' && exprText(s.iter.fn) === 'range' && s.iter.args.length === 1) count = exprSource(s.iter.args[0], l);
  if (s.k === 'for' && s.test && s.test.k === 'bin' && s.test.op === '<' && s.init.length === 1 && s.init[0].value.k === 'num' && s.init[0].value.v === 0) count = exprSource(s.test.r, l);
  if (count == null) return null;
  const b = newBlock('repeat');
  b.f.n = count;
  b.body = convert(s.body);
  return b;
}

  ws.innerHTML = st.program.length ? workspaceHTML(st.program, 'root', 'body') : `<div class="empty">${ic('puzzle')}<p>${t('blocksEmpty')}</p></div>${slotHTML('root', 'body', 0)}`;
  $('#bkCode').innerHTML = highlightHTML(blocksToCode(st.program, st.lang), st.lang);
}

function slotHTML(parent, branch, index) {
  const t0 = BK.target;
  const on = t0.parent === parent && t0.branch === branch && (t0.index === index || (t0.index == null && parent === 'root' && index === blocksState().program.length));
  return `<div class="slot ${on ? 'on' : ''}" data-parent="${parent}" data-branch="${branch}" data-index="${index}" role="button" tabindex="0" aria-label="${esc(t('insertHere'))}"></div>`;
}

function workspaceHTML(list, parent, branch) {
  return slotHTML(parent, branch, 0) + list.map((b, i) => blockHTML(b) + slotHTML(parent, branch, i + 1)).join('');
}

function blockHTML(b) {
  const def = BLOCK_TYPES[b.type];
  const ops = `<span class="ops"><button type="button" data-op="up" aria-label="${esc(t('moveUp'))}">${ic('chevron-up')}</button><button type="button" data-op="down" aria-label="${esc(t('moveDown'))}">${ic('chevron-down')}</button><button type="button" data-op="del" aria-label="${esc(t('delete'))}">${ic('x')}</button></span>`;
  const head = `<div class="blk-head ${def.cls}">${ic(def.icon)} ${fieldsHTML(b)}${ops}</div>`;
  if (!def.container) return `<div class="blk" data-id="${b.id}" draggable="true">${head}</div>`;
  const body = `<div class="blk-body">${workspaceHTML(b.body, b.id, 'body')}</div>`;
  const elsePart = b.type === 'if' && b.hasElse ? `<div class="blk-head ${def.cls}" style="width:max-content">${t('blkElse')}</div><div class="blk-body">${workspaceHTML(b.orelse, b.id, 'orelse')}</div>` : '';
  return `<div class="blk c-${b.type}" data-id="${b.id}" draggable="true">${head}${body}${elsePart}<div class="blk-foot ${def.cls}"></div></div>`;
}

function fieldsHTML(b) {
  const f = b.f;
  const inp = (k, cls = '', label = k) => `<input type="text" class="${cls}" data-f="${k}" value="${esc(f[k])}" aria-label="${esc(t('fld_' + label))}" spellcheck="false">`;
  const sel = (k, opts) => `<select data-f="${k}" aria-label="${esc(t('fld_' + k))}">${opts.map(([v, txt]) => `<option value="${v}" ${f[k] === v ? 'selected' : ''}>${esc(txt)}</option>`).join('')}</select>`;
  switch (b.type) {
    case 'move': return `${sel('dir', [['forward', t('blkForward')], ['back', t('blkBack')]])}${inp('n', 'num')}`;
    case 'turn': return `${sel('dir', [['left', t('blkLeft')], ['right', t('blkRight')]])}${inp('n', 'num')}<span>${t('blkDegrees')}</span>`;
    case 'circle': return `<span>${t('blkCircle')}</span>${inp('n', 'num')}`;
    case 'color': return `<span>${t('blkColor')}</span>${sel('c', BLOCK_COLORS.map(c => [c, c]))}`;
    case 'pen': return `<span>${t('blkPen')}</span>${sel('state', [['up', t('blkUp')], ['down', t('blkDown')]])}`;
    case 'repeat': return `<span>${t('blkRepeat')}</span>${inp('n', 'num')}<span>${t('blkTimes')}</span>`;
    case 'if': return `<span>${t('blkIf')}</span>${inp('a')}${sel('op', [['eq', '='], ['ne', '≠'], ['lt', '<'], ['gt', '>'], ['le', '≤'], ['ge', '≥'], ['true', t('blkIsTrue')]])}${f.op === 'true' ? '' : inp('b')}<label class="small" style="display:inline-flex;gap:4px;align-items:center"><input type="checkbox" data-f="hasElse" ${b.hasElse ? 'checked' : ''}>${t('blkElse')}</label>`;
    case 'setvar': return `<span>${t('blkSet')}</span>${inp('name', 'num', 'name')}<span>=</span>${inp('v', '', 'value')}`;
    case 'changevar': return `<span>${t('blkChange')}</span>${inp('name', 'num', 'name')}<span>${t('blkBy')}</span>${inp('n', 'num')}`;
    case 'print': return `<span>${t('blkPrint')}</span>${inp('v', '', 'value')}`;
    case 'ask': return `<span>${t('blkAsk')}</span>${inp('q', '', 'question')}${ic('arrow-right', 'flip')}${inp('name', 'num', 'name')}<label class="small" style="display:inline-flex;gap:4px;align-items:center"><input type="checkbox" data-f="num" ${f.num ? 'checked' : ''}>${t('blkNumber')}</label>`;
    default: return '';
  }
}

function bindWorkspaceEvents(ws) {
  ws.oninput = e => updateField(e.target);
  ws.onchange = e => updateField(e.target, true);
  ws.onclick = e => {
    const slot = e.target.closest('.slot');
    if (slot) return selectSlot(slot);
    const op = e.target.closest('[data-op]');
    if (op) blockOp(op.closest('.blk').dataset.id, op.dataset.op);
  };
  ws.onkeydown = e => {
    const slot = e.target.closest('.slot');
    if (slot && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      selectSlot(slot);
    }
  };
  ws.ondragstart = e => {
    const blk = e.target.closest('.blk');
    if (!blk || e.target.matches('input,select')) return;
    BK.drag = 'move:' + blk.dataset.id;
    e.dataTransfer.setData('text/plain', BK.drag);
    blk.classList.add('dragging');
    e.stopPropagation();
  };
  ws.ondragover = e => {
    const slot = e.target.closest('.slot');
    if (!slot) return;
    e.preventDefault();
    $$('.slot.drag', ws).forEach(s => s.classList.remove('drag'));
    slot.classList.add('drag');
  };
  ws.ondrop = e => {
    const slot = e.target.closest('.slot');
    if (!slot) return;
    e.preventDefault();
    dropOnSlot(slot, BK.drag || e.dataTransfer.getData('text/plain'));
  };
  ws.ondragend = () => $$('.dragging,.slot.drag', ws).forEach(el => el.classList.remove('dragging', 'drag'));
}

function selectSlot(slot) {
  BK.target = { parent: slot.dataset.parent, branch: slot.dataset.branch, index: Number(slot.dataset.index) };
  $$('#workspace .slot').forEach(s => s.classList.toggle('on', s === slot));
}

function updateField(el, structural = false) {
  const key = el.dataset.f;
  const blk = el.closest('.blk');
  if (!key || !blk) return;
  const st = blocksState();
  const hit = findBlock(st.program, blk.dataset.id);
  if (!hit) return;
  if (key === 'hasElse') hit.block.hasElse = el.checked;
  else hit.block.f[key] = el.type === 'checkbox' ? el.checked : el.value;
  saveBlocks(st);
  if (structural && (key === 'hasElse' || key === 'op')) renderWorkspace();
  else $('#bkCode').innerHTML = highlightHTML(blocksToCode(st.program, st.lang), st.lang);
}

function insertBlock(block, target) {
  const st = blocksState();
  const list = branchList(st.program, target.parent, target.branch);
  const idx = target.index == null ? list.length : clamp(target.index, 0, list.length);
  list.splice(idx, 0, block);
  BK.target = { ...target, index: target.index == null ? null : idx + 1 };
  saveBlocks(st);
  renderWorkspace();
  announce(t('blockAdded', { name: t('blk_' + block.type) }));
}

function dropOnSlot(slot, payload) {
  const target = { parent: slot.dataset.parent, branch: slot.dataset.branch, index: Number(slot.dataset.index) };
  BK.drag = null;
  if (!payload) return;
  if (payload.startsWith('new:')) {
    insertBlock(newBlock(payload.slice(4)), target);
    return;
  }
  const st = blocksState();
  const hit = findBlock(st.program, payload.slice(5));
  if (!hit || hit.block.id === target.parent || containsBlock(hit.block, target.parent)) return;
  const from = hit.list.indexOf(hit.block);
  hit.list.splice(from, 1);
  const list = branchList(st.program, target.parent, target.branch);
  const idx = list === hit.list && from < target.index ? target.index - 1 : target.index;
  list.splice(clamp(idx, 0, list.length), 0, hit.block);
  saveBlocks(st);
  renderWorkspace();
}

function blockOp(id, op) {
  const st = blocksState();
  const hit = findBlock(st.program, id);
  if (!hit) return;
  const i = hit.list.indexOf(hit.block);
  if (op === 'del') hit.list.splice(i, 1);
  if (op === 'up' && i > 0) hit.list.splice(i - 1, 0, hit.list.splice(i, 1)[0]);
  if (op === 'down' && i < hit.list.length - 1) hit.list.splice(i + 1, 0, hit.list.splice(i, 1)[0]);
  saveBlocks(st);
  renderWorkspace();
}

async function runBlocks() {
  const st = blocksState();
  const code = blocksToCode(st.program, st.lang);
  $('#bkConsole').innerHTML = `<span class="c-sys">${t('running')}</span>`;
  const raw = $('#bkInputs').value.trim();
  const res = await runProgram(code, st.lang, { inputs: raw ? raw.split('\n') : [], seed: settings().seed, timeLimit: settings().timeLimit * 1000 });
  $('#bkConsole').innerHTML = consoleHTML(res.out) + (res.ok ? '' : `<span class="c-err">\n${esc(res.error.type)}: ${esc(res.error.message)}</span>`);
  blocksTurtle.load(res.turtle);
  const fresh = [];
  updateProfile(p => {
    p.stats.blocks++;
    p.stats.runs++;
    p.stats.turtleLines += buildTurtleModel(res.turtle).stats.lines;
    markActivity(p);
    fresh.push(...awardBadges(p));
  });
  fresh.forEach(b => toast(t('badgeEarned', { name: T(b.title) }), 'ok'));
}

function blocksToEditor() {
  const st = blocksState();
  const prog = { id: 'g' + uid(), name: t('blocksProgram'), lang: st.lang, updated: Date.now(), code: blocksToCode(st.program, st.lang) };
  savePlayPrograms([prog, ...playPrograms()]);

  });

}

function convertCodeToBlocks(code, l) {
  try {
    const { program, skipped } = codeToBlocks(code, l);
    saveBlocks({ lang: l, program });
    BK.target = { parent: 'root', branch: 'body', index: null };
    return { ok: true, count: program.length, skipped };
  } catch (e) {
    return { ok: false, message: e.message, line: e.line };
  }
}

// Coding sessions per day for the last three weeks, drawn in as a line.
function activityLineSVG(p) {
  const days = Array.from({ length: 21 }, (_, i) => p.days[isoDay(Date.now() - (20 - i) * DAY)] || 0);
  const max = Math.max(4, ...days);
  const pts = days.map((n, i) => [10 + i * 23, 70 - (n / max) * 56]);
  const d = pts.map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)} ${y.toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 480 80" width="100%" height="80" role="img" aria-label="${esc(t('sparkAria'))}" style="margin-top:10px">
    <line x1="10" y1="70" x2="470" y2="70" stroke="var(--line)" stroke-width="2"/>
    <path d="${d}" fill="none" stroke="var(--sky)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map(([x, y], i) => (days[i] ? `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--sun)"><title>${isoDay(Date.now() - (20 - i) * DAY)}: ${days[i]}</title></circle>` : '')).join('')}
  </svg><p class="small muted" style="margin:2px 0 0">${t('sparkLegend')}</p>`;
}

const TV = { classCode: null, unlocked: false };

function classMembers(code) {
  // TODO(student): sync profiles and class progress to a backend (Firebase or Supabase) so a teacher sees every pupil's device, not only learners on this browser.
  return profiles().filter(p => p.classCode === code);
}

function lastActive(p) {
  const days = Object.keys(p.days).sort();
  return days.length ? new Date(days[days.length - 1] + 'T12:00:00').getTime() : p.created;
}

function dayAgo(ts) {
  const days = Math.round((new Date(todayIso() + 'T12:00:00') - new Date(isoDay(ts) + 'T12:00:00')) / DAY);
  if (days <= 0) return t('today');
  if (days === 1) return t('yesterday');
  return t('daysAgo', { n: days });
}

function needsHelp(p) {
  const idle = (Date.now() - lastActive(p)) / DAY;
  const stuck = p.stats.errors > 6 && p.stats.fixes < p.stats.errors / 3;
  return idle > 7 ? 'idle' : stuck ? 'stuck' : null;
}

function rosterTableHTML(members) {

// One bar per lesson: what share of the class has finished it.
function lessonHeatSVG(members) {
  const w = 480;
  const h = 150;
  const bw = w / LESSONS.length;
  const bars = LESSONS.map((l, i) => {
    const share = members.length ? members.filter(p => isDone(p, l.id)).length / members.length : 0;
    const bh = Math.max(2, share * (h - 30));
    const color = ['var(--sky)', 'var(--sun)', 'var(--mint)', 'var(--coral)'][Math.floor(i / 4) % 4];
    return `<rect x="${i * bw + 2}" y="${h - 20}" width="${bw - 4}" height="0" rx="3" fill="${color}" data-h="${bh}" data-y="${h - 20 - bh}"><title>${esc(l.title.en)}: ${Math.round(share * 100)}%</title></rect>${i % 4 === 0 ? `<text x="${i * bw + 2}" y="${h - 4}" font-size="10" fill="currentColor" opacity=".6">U${i / 4 + 1}</text>` : ''}`;
  }).join('');
  return `<svg class="heatbars" viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${esc(t('lessonHeat'))}" style="color:var(--ink)">${bars}</svg>`;
}

function needsHelpHTML(members) {
  const list = members.map(p => ({ p, why: needsHelp(p) })).filter(x => x.why);

// Run the broken example so the card shows real, filled-in wording.
const sampleCache = new Map();

function sampleExplanation(e, l) {
  const key = e.id + ':' + l;
  if (sampleCache.has(key)) return sampleCache.get(key);
  const r = e.ex ? runMini(e.ex[0], l, { timeLimit: 150 }) : { error: null };
  const fill = o => ({ en: o.en.replace(/\{\d\}|\{s\}/g, '...'), ur: o.ur.replace(/\{\d\}|\{s\}/g, '...') });
  const x = r.error && findCatalogEntry(r.error, l).id === e.id ? explainError(r.error, l, e.ex[0]) : { title: fill(e.title), what: fill(e.what), how: fill(e.how) };
  sampleCache.set(key, x);
  return x;
}

function errorEntryHTML(e) {
  const l = e.lang === 'any' ? 'py' : e.lang;
  const x = sampleExplanation(e, l);
  const cur = lang === 'ur' ? 'ur' : 'en';

function searchIndex() {
  const items = [];
  LESSONS.forEach((l, i) => items.push({ icon: 'book', title: `${i + 1}. ${T(l.title)}`, kind: t('lesson'), text: [l.title.en, l.title.ur, l.explain.en, l.explain.ur].join(' '), go: '#learn/' + l.id }));
  PROJECTS.forEach(p => items.push({ icon: 'rocket', title: T(p.title), kind: t('miniProject'), text: [p.title.en, p.title.ur, p.pitch.en].join(' '), go: '#project/' + p.id }));
  GLOSSARY.forEach(g => items.push({ icon: 'lightbulb', title: g.words[0], kind: t('concept'), text: g.words.join(' ') + ' ' + g.en, run: () => {
    go('#learn/' + S.doc.id);
    setTimeout(() => mentorAsk(t('whatIs', { w: g.words[0] })), 50);
  } }));
  ERROR_CATALOG.filter(e => e.ex).forEach(e => items.push({ icon: 'bug', title: T(sampleExplanation(e, e.lang === 'js' ? 'js' : 'py').title), kind: t('errorWord'), text: e.title.en + ' ' + e.re.source, go: '#errors' }));
  NAV.forEach(n => items.push({ icon: n.icon, title: t('nav_' + n.id), kind: t('page'), text: n.id, go: n.href }));
  playPrograms().forEach(p => items.push({ icon: 'folder', title: p.name, kind: t('program'), text: p.name, go: '#play/' + p.id }));
  return items;
}

function openSearch() {
  openModal(`${modalHead(t('search'), 'search')}<label class="sr" for="sq">${t('search')}</label><input type="search" id="sq" placeholder="${esc(t('searchPh'))}" autocomplete="off"><div class="search-results" id="sres" role="listbox"></div>`, { wide: true });
  const idx = searchIndex();
  let sel = 0;
  let hits = [];
  const draw = () => {
    const q = $('#sq').value.trim().toLowerCase();
    hits = (q ? idx.filter(x => (x.title + ' ' + x.text).toLowerCase().includes(q)) : idx.slice(0, 10)).slice(0, 30);
    sel = clamp(sel, 0, Math.max(0, hits.length - 1));
    $('#sres').innerHTML = hits.length ? hits.map((h, i) => `<button type="button" class="sres ${i === sel ? 'on' : ''}" data-i="${i}" role="option" aria-selected="${i === sel}">${ic(h.icon)} <span>${esc(h.title)}</span><span class="k">${esc(h.kind)}</span></button>`).join('') : `<p class="muted small">${t('noResults')}</p>`;
    $$('#sres [data-i]').forEach(b => (b.onclick = () => pick(hits[Number(b.dataset.i)])));
  };
  const pick = h => {
    closeModal();
    if (h.run) h.run();
    else go(h.go);
  };
  $('#sq').oninput = () => {
    sel = 0;
    draw();
  };
  $('#sq').onkeydown = e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      sel = clamp(sel + (e.key === 'ArrowDown' ? 1 : -1), 0, hits.length - 1);
      draw();
    }
    if (e.key === 'Enter' && hits[sel]) pick(hits[sel]);
  };
  draw();
}

// ---------- theme, text size, motion, language ----------
function applyPrefs(s = settings()) {
  const root = document.documentElement;
  root.classList.toggle('dark', s.theme === 'dark');
  root.classList.toggle('large', s.textSize === 'large');
  root.classList.toggle('rm', s.motion === 'reduce');
  if (S.turtle) S.turtle.drawUpTo(S.turtle.shown);
}

function setLanguage(l) {
  lang = l;
  saveSettings({ lang: l });
  applyLanguage();
  renderTopbar();
  route();
}

function applyLanguage() {
  const root = document.documentElement;
  root.lang = lang;
  root.dir = lang === 'ur' ? 'rtl' : 'ltr';
  root.classList.toggle('ur', lang === 'ur');
  $$('[data-i18n]').forEach(el => (el.textContent = t(el.dataset.i18n)));
  $$('[data-i18n-label]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nLabel)));
}

function toggleDemo(on) {
  saveSettings({ demo: on });
  if (on) seedDemo();
  else removeDemo();
  afterProfileChange();
  toast(on ? t('demoOn') : t('demoOff'), 'ok');
}

// ---------- export / import / reset (the API key is never exported) ----------
function storageBytes() {
  try {
    return store.keys().reduce((n, k) => n + (localStorage.getItem(NS + k) || '').length * 2, 0);
  } catch {
    return 0;
  }
}

function exportData() {
  const data = {};
  store.keys().filter(k => k !== 'aikey').forEach(k => (data[k] = store.get(k, null)));
  downloadText(`codebuddy-backup-${todayIso()}.json`, JSON.stringify({ app: 'codebuddy', version: 1, exportedAt: new Date().toISOString(), data }, null, 2));
  addLog('export', { en: 'Exported a backup', ur: 'بیک اپ ایکسپورٹ کیا' });
  toast(t('exported'), 'ok');
}

async function importData() {
  const file = await pickFile('application/json');
  if (!file) return;
  try {
    const parsed = JSON.parse(await file.text());
    if (parsed.app !== 'codebuddy' || typeof parsed.data !== 'object') throw new Error('bad');
    Object.entries(parsed.data).forEach(([k, v]) => k !== 'aikey' && store.set(k, v));
    ensureProfile();
    lang = settings().lang;
    applyLanguage();
    applyPrefs();
    afterProfileChange();
    toast(t('imported'), 'ok');
  } catch {
    toast(t('importBad'), 'bad');
  }
}

async function resetAll() {
  if (!(await confirmModal({ title: t('resetAll'), body: esc(t('resetAllBody')), ok: t('resetAll'), danger: true }))) return;
  store.keys().forEach(k => store.remove(k));
  session.set('aikey', null);
  toast(t('resetDone'), 'ok');
  setTimeout(() => {
    location.hash = '';
    location.reload();
  }, 500);
}

const TOUR_STEPS = [
  { el: '#lessonCard', key: 'tour1', pane: 'lesson' },
  { el: '#editor', key: 'tour2', pane: 'code' },
  { el: '#runBtn', key: 'tour3', pane: 'code' },
  { el: '#inputsBox', key: 'tour4', pane: 'code' },
  { el: '#sideTabs', key: 'tour5', pane: 'out' },
  { el: '#tab-steps', key: 'tour6', pane: 'out' },
  { el: '#tab-buddy', key: 'tour7', pane: 'out' },
  { el: '#nav', key: 'tour8' },
  { el: '#searchBtn', key: 'tour9' },
];
let tourStep = -1;

function startTour() {
  closeModal();
  if (!location.hash.startsWith('#learn')) go('#learn/' + S.doc.id);
  tourStep = 0;
  $('#tour').classList.add('on');
  setTimeout(showTourStep, 60);
}

function endTour() {
  tourStep = -1;
  $('#tour').classList.remove('on');
  store.set('tour', { done: true, ts: Date.now() });
}

function showTourStep() {
  const step = TOUR_STEPS[tourStep];
  if (!step) {
    endTour();
    return;
  }
  if (step.pane && window.innerWidth <= 920) setMobilePane(step.pane);
  const el = $(step.el);
  const rect = el ? el.getBoundingClientRect() : null;
  if (!rect || !rect.width) {
    tourStep++;
    showTourStep();
    return;
  }
  el.scrollIntoView({ block: 'nearest', behavior: 'instant' });
  const r = el.getBoundingClientRect();
  const last = tourStep === TOUR_STEPS.length - 1;
  $('#tourTip').innerHTML = `<h4>${ic('robot')} ${t(step.key + 't')}</h4><p>${t(step.key + 'b')}</p>
    <div class="between"><div class="dots">${TOUR_STEPS.map((_, i) => `<i class="${i === tourStep ? 'on' : ''}"></i>`).join('')}</div>
    <div class="row"><button type="button" class="btn flat sm" id="tourSkip">${t('skip')}</button>${tourStep ? `<button type="button" class="btn ghost sm" id="tourBack">${t('back')}</button>` : ''}<button type="button" class="btn sm" id="tourNext">${last ? t('done') : t('next')}</button></div></div>`;
  positionTour(r);
  $('#tourSkip').onclick = endTour;
  $('#tourNext').onclick = () => {
    tourStep++;
    showTourStep();
  };
  if ($('#tourBack')) $('#tourBack').onclick = () => {
    tourStep--;
    showTourStep();
  };
  $('#tourNext').focus();
}

function positionTour(r) {
  const pad = 6;
  const spot = $('#tourSpot');
  const vh = window.innerHeight;
  const top = clamp(r.top, 4, vh - 40);
  const height = Math.min(r.height, vh - top - 8);
  Object.assign(spot.style, { left: r.left - pad + 'px', top: top - pad + 'px', width: r.width + pad * 2 + 'px', height: height + pad * 2 + 'px' });
  const tip = $('#tourTip');
  const tw = Math.min(340, window.innerWidth - 32);
  const below = top + height + 16;
  const y = below + tip.offsetHeight < vh ? below : top - tip.offsetHeight - 16 > 8 ? top - tip.offsetHeight - 16 : vh - tip.offsetHeight - 12;
  tip.style.top = Math.max(8, y) + 'px';
  tip.style.left = clamp(r.left + r.width / 2 - tw / 2, 16, window.innerWidth - tw - 16) + 'px';
}

window.addEventListener('resize', () => {
  if (tourStep >= 0) showTourStep();
});

  [['Ctrl', 'Enter'], 'ks_run'], [['Esc'], 'ks_stop'], [['F8'], 'ks_step'], [['Shift', 'F8'], 'ks_stepBack'],
  [['Ctrl', 'F'], 'ks_find'], [['Ctrl', '/'], 'ks_comment'], [['Tab'], 'ks_indent'], [['Alt', '+'], 'ks_font'],
  [['Ctrl', 'K'], 'ks_search'], [['L'], 'ks_lang'], [['1', '...', '7'], 'ks_pages'], [['?'], 'ks_help'],
];

function openShortcuts() {
  openModal(`${modalHead(t('shortcuts'), 'type')}<div>${SHORTCUTS.map(([keys, k]) => `<div class="setrow"><span>${t(k)}</span><span class="row" style="flex-wrap:nowrap">${keys.map(x => `<span class="kbd">${x}</span>`).join('')}</span></div>`).join('')}</div>`);
}

function onGlobalKey(e) {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = ['input', 'textarea', 'select'].includes(tag) || e.target.isContentEditable;
  const mod = e.ctrlKey || e.metaKey;
  if (e.key === 'Escape') {
    if (tourStep >= 0) endTour();
    else if ($('#modal').classList.contains('open')) closeModal();
    else if (runtime.busy) stopCurrent();
    return;
  }
  if (mod && (e.key === 'k' || e.key === 'K')) {
    e.preventDefault();
    openSearch();
    return;
  }
  const inIde = currentPage === 'ide';
  if (inIde && e.key === 'F8') {
    e.preventDefault();
    if (!S.trace || V.stale) startVisualiser();
    else stepBy(e.shiftKey ? -1 : 1);
    return;
  }
  if (inIde && e.altKey && (e.key === '=' || e.key === '+' || e.key === '-')) {
    e.preventDefault();
    changeFont(e.key === '-' ? -1 : 1);
    return;
  }
  if (inIde && mod && e.key === 'Enter') {
    e.preventDefault();
    runCurrent();
    return;
  }
  if (typing || mod || e.altKey) return;
  if (e.key === '?') openShortcuts();
  else if (e.key === 'l' || e.key === 'L') setLanguage(lang === 'en' ? 'ur' : 'en');
  else if (/^[1-7]$/.test(e.key)) go(NAV[Number(e.key) - 1].href);
}

// =====================================================================
// Top bar, hash router and boot
// =====================================================================
const NAV = [
  { id: 'learn', icon: 'book', href: '#learn' },
  { id: 'play', icon: 'code', href: '#play' },
  { id: 'projects', icon: 'rocket', href: '#projects' },
  { id: 'blocks', icon: 'puzzle', href: '#blocks' },
  { id: 'progress', icon: 'award', href: '#progress' },
  { id: 'teacher', icon: 'school', href: '#teacher' },
  { id: 'errors', icon: 'bug', href: '#errors' },
];
const PAGE_RENDER = { projects: renderProjects, blocks: renderBlocks, progress: renderProgress, teacher: renderTeacher, errors: renderErrorsPage, inbox: renderInbox, settings: renderSettings, about: renderAbout };
let currentPage = 'ide';

function renderTopbar() {
  const [page] = location.hash.slice(1).split('/');
  const active = page === 'project' ? 'projects' : page || 'learn';
  $('#nav').innerHTML = NAV.map(n => `<a href="${n.href}" class="${n.id === active ? 'on' : ''}" ${n.id === active ? 'aria-current="page"' : ''}>${ic(n.icon)}<span>${t('nav_' + n.id)}</span></a>`).join('');
  $('#logo').innerHTML = buddySVG('happy', 42);
  $('#searchBtn').innerHTML = ic('search');
  $('#settingsBtn').innerHTML = ic('settings');
  $('#langBtn').textContent = lang === 'en' ? 'اردو' : 'English';
  $('#langBtn').setAttribute('aria-label', lang === 'en' ? 'Switch to Urdu' : 'Switch to English');
  const p = activeProfile();
  $('#profileBtn').textContent = initials(p.name);
  $('#profileBtn').style.background = p.color;
  $('#profileBtn').setAttribute('aria-label', t('learner') + ': ' + p.name);
  updateBell();
  const on = $('#nav a.on');
  if (on && window.innerWidth <= 920) on.scrollIntoView({ inline: 'center', block: 'nearest' });
}

function go(hash) {
  if (location.hash === hash) route();
  else location.hash = hash;
}

function showSection(name) {
  currentPage = name;
  $$('main > section').forEach(s => (s.hidden = s.dataset.page !== name));
}

// #learn/<lesson> · #project/<id> · #play/<program> open the IDE; everything else is a page.
function route() {
  const [page, id] = location.hash.slice(1).split('/');
  renderTopbar();
  if (!page || page === 'learn' || page === 'project' || page === 'play') {
    const p = activeProfile();
    let doc;
    if (page === 'project') doc = { kind: 'project', id: PROJECTS.some(x => x.id === id) ? id : PROJECTS[0].id };
    else if (page === 'play') doc = { kind: 'play', id: playPrograms().some(x => x.id === id) ? id : ensurePlayProgram() };
    else doc = { kind: 'lesson', id: LESSONS.some(x => x.id === id) ? id : nextLessonId(p) };
    const wasIde = currentPage === 'ide';
    showSection('ide');
    openDoc(doc);
    if (!wasIde || page !== 'learn') animateIn($('#ide'));
    return;
  }
  flushSave();
  stopVisualiser();
  const render = PAGE_RENDER[page] || PAGE_RENDER.projects;
  showSection(PAGE_RENDER[page] ? page : 'projects');
  render();
  window.scrollTo(0, 0);
  animateIn($(`main > section[data-page="${currentPage}"]`));
}

function boot() {
  lang = settings().lang;
  bootData();
  applyLanguage();
  applyPrefs();
  initIDE();
  $('#searchBtn').onclick = openSearch;
  $('#bellBtn').onclick = () => go('#inbox');
  $('#langBtn').onclick = () => setLanguage(lang === 'en' ? 'ur' : 'en');
  $('#settingsBtn').onclick = () => go('#settings');
  $('#profileBtn').onclick = profileModal;
  $('#scrim').onclick = closeModal;
  document.addEventListener('keydown', onGlobalKey);
  window.addEventListener('hashchange', route);
  window.addEventListener('beforeunload', flushSave);
  window.addEventListener('resize', debounce(() => {
    if (currentPage === 'ide' && S.turtle) S.turtle.drawUpTo(S.turtle.shown);
  }, 150));
  const firstVisit = !store.get('tour', null) && !location.hash;
  route();
  if (firstVisit) setTimeout(startTour, 900);
}

boot();
