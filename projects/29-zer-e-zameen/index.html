    let done = 0;
    for (const f of rice) {
      if (done >= target - 0.5) break;
      f.kharif = 'maize';
      done += area(f);
    }
  }
  if (lv.efficiency > 0) {
    const flood = fields.filter(f => f.method === 'flood');
    const count = Math.round(flood.length * lv.efficiency);
    flood.slice(0, count).forEach(f => {
      const highValue = ['sugarcane', 'veg_r', 'veg_k'].includes(f.rabi) || ['veg_k', 'sugarcane'].includes(f.kharif);
      f.method = highValue ? 'drip' : f.kharif === 'rice' ? 'awd' : 'laser';
    });
  }
  return fields;
}

/** Scenario levers applied to copies of the wells: solar conversion keeps the discharge. */
function leveredWells(v, lv) {
  const wells = v.wells.map(w => ({ ...w }));
  if (lv.solarShare > 0) {
    // Diesel owners switch first (they save the most), then grid-connected wells.
    const grid = wells.filter(w => w.use === 'irr' && w.type !== 'solar').sort((a, b) => (a.type === 'diesel' ? 0 : 1) - (b.type === 'diesel' ? 0 : 1));
    grid.slice(0, Math.round(grid.length * lv.solarShare)).forEach(w => (w.type = 'solar'));
  }
  return wells;
}

/** Field cells on the lowest ground: where new recharge ponds are dug in the scenario lab. */
function pondSites(v, count) {
  const cand = [];
  v.cells.forEach((c, i) => {
    if (c === CT.field && !cellEdges(i, v.nx, v.ny).length) cand.push(i);
  });
  cand.sort((a, b) => v.ground[a] - v.ground[b]);
  const picked = [];
  for (const i of cand) {
    if (picked.length >= count) break;
    const far = picked.every(j => Math.abs((j % v.nx) - (i % v.nx)) + Math.abs(Math.floor(j / v.nx) - Math.floor(i / v.nx)) > 6);
    if (far) picked.push(i);
  }
  return picked;
}

/** Everything the monthly stress builder needs, prepared once per run. */
function stressContext(v, spec, lv, clim, prices) {
  const parcels = parcelsOf(v);
  const wells = leveredWells(v, lv);
  const irr = wells.filter(w => w.use === 'irr');
  const wIndex = new Map(irr.map((w, i) => [w.id, i]));
  const fields = leveredFields(v, lv, parcels).map(f => {
    const cells = parcels.get(f.n) || [];
    const own = wIndex.has(f.well) ? f.well : cells.length ? nearestWell(v, cells[0], irr)?.id : null;
    return { ...f, cells, area: cells.length * spec.A, coeffs: fieldMonthlyCoeffs(f), wi: own != null && wIndex.has(own) ? wIndex.get(own) : -1 };
  });
  const served = new Float64Array(irr.length);
  fields.forEach(f => f.wi >= 0 && (served[f.wi] += f.area));
  const wellState = irr.map((w, i) => ({
    ...w, m3h: m3hOf(w), pumpZ: spec.zs[w.cell] - w.pump, served: served[i],
    quotaYear: lv.quotaWell && lv.quotaWell[w.id] != null ? lv.quotaWell[w.id] : lv.quota > 0 ? (served[i] * lv.quota) / 1000 : Infinity,
    used: 0,
  }));
  const rc = new Float64Array(spec.n);
  for (let i = 0; i < spec.n; i++) rc[i] = CELL_TYPES[v.cells[i]]?.rc || 0;
  const ponds = [];
  v.cells.forEach((c, i) => c === CT.pond && ponds.push(i));
  return {
    v, spec, lv, clim, prices, fields, wells: wellState, rc, ponds,
    newPonds: lv.ponds > 0 ? pondSites(v, lv.ponds) : [],
    src: new Float64Array(spec.n), wellDemand: new Float64Array(irr.length),
    acc: fields.map(() => ({ rabiNeed: 0, rabiGot: 0, kharifNeed: 0, kharifGot: 0 })),
  };
}

/** Rain multiplier for simulation month k (history years from the village, projection sequence after). */
function rainFactorAt(v, lv, k) {
  const wy = waterYearOf(k);
  const hist = v.params.rainYears || [];
  let f = wy < hist.length ? hist[wy] : PROJ_RAIN[(wy - hist.length) % PROJ_RAIN.length];
  if (lv.drought && wy >= hist.length && DROUGHT_YEARS.includes(wy - hist.length)) f *= 0.5;
  return f;
}

/** Canal supply multiplier (drought years cut canal water to 70 %). */
function canalFactorAt(v, lv, k) {
  const wy = waterYearOf(k);
  const hist = (v.params.rainYears || []).length;
  return lv.drought && wy >= hist && DROUGHT_YEARS.includes(wy - hist) ? 0.7 : 1;
}

/** Rain recharge, canal watercourse losses and pond recharge for one month (m3/day per cell). */
function naturalRecharge(ctx, m, rf, cf, add) {
  const { v, spec, clim, rc } = ctx;
  const days = MONTH_DAYS[m];
  // Light showers wet the soil and evaporate; only rain above RAIN_THRESHOLD_MM in a month can recharge.
  const rainM = Math.max(0, clim[m].rain * rf - RAIN_THRESHOLD_MM) / 1000;
  for (let i = 0; i < spec.n; i++) if (rc[i] > 0) add(i, (rainM * rc[i] * spec.A) / days, 'rain');
  const lossM = canalLossMm(v.canal, m, cf) / 1000;
  for (const f of ctx.fields) {
    if (!f.canal || !f.cells.length || lossM <= 0) continue;
    const rate = (lossM * 0.8 * spec.A) / days;
    f.cells.forEach(i => add(i, rate, 'wc'));
  }
  if (v.pond.months.includes(m)) ctx.ponds.forEach(i => add(i, v.pond.rate * spec.A, 'pond'));
  const pondMonths = [6, 7, 8];
  if (pondMonths.includes(m)) ctx.newPonds.forEach(i => add(i, POND_CAPTURE_M3 / pondMonths.length / days, 'pond'));
}

/** Groundwater demand of every field after rain and canal water (m3 for the month). */
function fieldDemand(ctx, m, rf, cf) {
  const { v, clim, wellDemand } = ctx;
  const canalMm = canalMmAtField(v.canal, m, cf);
  wellDemand.fill(0);
  for (const f of ctx.fields) {
    const nd = fieldNeedMm(f.coeffs, clim, m, rf);
    // ET part is applied with the method's efficiency; ponding water (rice percolation, prep) is not.
    const gross = nd.net / f.coeffs.eff + (nd.need - nd.net);
    const canalUse = f.canal ? Math.min(gross, canalMm) : 0;
    const w = f.wi >= 0 ? ctx.wells[f.wi] : null;
    const over = w ? PUMP_TYPES[w.type].appetite + (w.type === 'solar' ? ctx.lv.solarOveruse : 0) : 1;
    const gw = (((gross - canalUse) / 1000) * f.area) * (w ? over : 0);
    f.mo = { nd, gross, grossM3: (gross / 1000) * f.area, canalM3: (canalUse / 1000) * f.area, gw, unserved: w ? 0 : ((gross - canalUse) / 1000) * f.area };
    if (w) wellDemand[f.wi] += gw;
  }
}

/** Decide how much each well pumps: dry wells stop, hours and quotas cap the rest. */
function wellPumping(ctx, m, hOld, add) {
  const { spec, lv, wellDemand, prices } = ctx;
  const days = MONTH_DAYS[m];
  const out = { pump: 0, demand: 0, dry: [], energy: { electric: 0, diesel: 0, solar: 0 }, litres: 0, cost: { electric: 0, diesel: 0, solar: 0 }, hours: 0 };
  ctx.wells.forEach((w, i) => {
    const demand = wellDemand[i];
    const dry = hOld[w.cell] < w.pumpZ + 1;
    const cap = w.m3h * wellHoursCap(w.type, m, lv.rotation);
    const quotaLeft = Math.max(0, w.quotaYear - w.used);
    const pumped = dry || lv.noPump ? 0 : Math.min(demand, cap, quotaLeft);
    w.used += pumped;
    w.mo = { demand, pumped, dry, frac: demand > 0 ? pumped / demand : 1, hours: w.m3h ? pumped / w.m3h : 0 };
    if (dry) out.dry.push(w.id);
    if (pumped > 0) add(w.cell, -pumped / days, 'pump');
    const lift = spec.zs[w.cell] - hOld[w.cell] + 3;
    const e = pumpingEnergy(w.type, pumped, lift, prices);
    out.energy[w.type] += e.kwh;
    out.litres += e.litres;
    out.cost[w.type] += e.cost;
    out.pump += pumped;
    out.demand += demand;
    out.hours += w.mo.hours;
  });
  return out;
}

/** Irrigation return flow and the season water ledger used for crop yields. */
function returnFlowAndLedger(ctx, m, add) {
  const days = MONTH_DAYS[m];
  const rabi = m >= 10 || m <= 3;
  ctx.fields.forEach((f, idx) => {
    if (!f.mo || !f.cells.length) return;
    const frac = f.wi >= 0 ? ctx.wells[f.wi].mo.frac : 0;
    const applied = f.mo.canalM3 + f.mo.gw * frac;
    const netM3 = (f.mo.nd.net / 1000) * f.area;
    const needM3 = (f.mo.nd.need / 1000) * f.area;
    const consumptive = Math.min(applied * f.coeffs.eff, netM3);
    const ret = Math.max(0, applied - consumptive) * RETURN_SHARE;
    if (ret > 0) f.cells.forEach(i => add(i, ret / f.cells.length / days, 'ret'));
    const got = f.mo.grossM3 > 0 ? Math.min(1, applied / f.mo.grossM3) * needM3 : 0;
    const a = ctx.acc[idx];
    if (rabi) {
      a.rabiNeed += needM3;
      a.rabiGot += got;
    } else {
      a.kharifNeed += needM3;
      a.kharifGot += got;
    }
  });
}

/** All stresses for simulation month k, given heads at the start of the month. */
function monthStress(ctx, k, hOld) {
  const { v, spec, lv, clim } = ctx;
  const m = calMonth(k);
  const days = MONTH_DAYS[m];
  const src = ctx.src;
  src.fill(0);
  const parts = { rain: 0, ret: 0, wc: 0, pond: 0, pump: 0 };
  const add = (i, rate, key) => {
    if (spec.ib[i] !== IB_ACTIVE) return;
    src[i] += rate;
    parts[key] += key === 'pump' ? -rate : rate;
  };
  const st = { src, parts, m, days, tYears: (k + 1) / 12, rivOn: false, etMax: 0, wells: null };
  if (lv.noStress) return st;
  if (m === 10) ctx.wells.forEach(w => (w.used = 0));
  const rf = rainFactorAt(v, lv, k);
  const cf = canalFactorAt(v, lv, k);
  naturalRecharge(ctx, m, rf, cf, add);
  fieldDemand(ctx, m, rf, cf);
  st.wells = wellPumping(ctx, m, hOld, add);
  returnFlowAndLedger(ctx, m, add);
  st.rivOn = v.canal.supply[m] * cf > 0;
  st.etMax = ((0.6 * clim[m].et0d) / 1000) * spec.A;
  st.rf = rf;
  return st;
}

/** Crop income for the water year just ended, using the FAO-33 yield response (Ky). */
function closeWaterYear(ctx) {
  let income = 0;
  let potential = 0;
  ctx.fields.forEach((f, idx) => {
    const a = ctx.acc[idx];
    const acres = f.area / ACRE_M2;
    const crops = fieldCrops(f);
    for (const c of crops) {
      const crop = CROPS[c];
      const annual = crop.season === 'annual';
      const need = annual ? a.rabiNeed + a.kharifNeed : crop.season === 'rabi' ? a.rabiNeed : a.kharifNeed;
      const got = annual ? a.rabiGot + a.kharifGot : crop.season === 'rabi' ? a.rabiGot : a.kharifGot;
      const ratio = need > 0 ? Math.min(1, got / need) : 1;
      const yRel = Math.max(0, 1 - crop.ky * (1 - ratio));
      income += crop.yield * crop.price * acres * yRel;
      potential += crop.yield * crop.price * acres;
    }
    ctx.acc[idx] = { rabiNeed: 0, rabiGot: 0, kharifNeed: 0, kharifGot: 0 };
  });
  return { income, potential };
}

/** Mean depth to water over active cells. */
function meanDepth(spec, h) {
  let s = 0;
  let c = 0;
  for (let i = 0; i < spec.n; i++) {
    if (!spec.ib[i]) continue;
    s += spec.zs[i] - h[i];
    c++;
  }
  return c ? s / c : 0;
}

const newYearAcc = () => ({ pump: 0, cost: 0, kwh: 0, litres: 0, dry: new Set(), demand: 0, costBy: { electric: 0, diesel: 0, solar: 0 } });

/** Run the model. opts: levers, mult, start (month), months, h0 (start heads), record, probe (cells). */
function simulate(v, opts = {}) {
  const lv = { ...DEFAULT_LEVERS, ...(opts.levers || {}) };
  const spec = buildSpec(v, opts.mult || v.calib);
  const clim = climateTable(v.district, v.lat);
  const ctx = stressContext(v, spec, lv, clim, opts.prices || DEFAULT_PRICES);
  const solver = { ...v.solver, ...(opts.solver || {}) };
  const start = opts.start || 0;
  const months = opts.months ?? HIST_MONTHS;
  const ws = workspace(spec);
  let h = opts.h0 ? Float64Array.from(opts.h0) : Float64Array.from(spec.h0);
  const run = { vid: v.id, start, months, levers: lv, mult: opts.mult || v.calib, spec, heads: [], steps: [], years: [], wellIds: ctx.wells.map(w => w.id) };
  if (opts.record !== false) run.heads.push(Float32Array.from(h));
  let yr = newYearAcc();
  for (let k = start; k < start + months; k++) {
    const st = monthStress(ctx, k, h);
    const solved = solveStep(spec, h, st, st.days, solver, ws);
    const bud = budgetStep(spec, h, solved.h, st, st.days, ws);
    const w = st.wells || { pump: 0, demand: 0, dry: [], energy: { electric: 0, diesel: 0, solar: 0 }, litres: 0, cost: { electric: 0, diesel: 0, solar: 0 }, hours: 0 };
    h = solved.h;
    const cost = w.cost.electric + w.cost.diesel + w.cost.solar;
    const step = { k, iters: solved.iters, conv: solved.converged, err: bud.err, bud, pump: w.pump, demand: w.demand, dry: w.dry, cost, energy: w.energy, litres: w.litres, hours: w.hours, dtw: meanDepth(spec, h) };
    if (opts.probe) step.probe = opts.probe.map(c => h[c]);
    if (opts.wellDetail) step.wells = ctx.wells.map(x => ({ id: x.id, ...x.mo }));
    run.steps.push(step);
    if (opts.record !== false) run.heads.push(Float32Array.from(h));
    yr.pump += w.pump;
    yr.cost += cost;
    yr.kwh += w.energy.electric + w.energy.solar + w.energy.diesel;
    yr.litres += w.litres;
    ['electric', 'diesel', 'solar'].forEach(x => (yr.costBy[x] += w.cost[x]));
    yr.demand += w.demand;
    w.dry.forEach(id => yr.dry.add(id));
    if (st.m === 9) {
      const inc = closeWaterYear(ctx);
      run.years.push({ wy: waterYearOf(k), endK: k, dtw: step.dtw, ...yr, dry: yr.dry.size, dryIds: [...yr.dry], income: inc.income, potential: inc.potential });
      yr = newYearAcc();
    }
    if (opts.onStep) opts.onStep(k, step);
  }
  run.hEnd = h;
  run.maxErr = run.steps.reduce((a, s) => Math.max(a, Math.abs(s.err)), 0);
  return run;
}

// ---------- model verification: checks a reviewer can re-run from the Model page ----------

const VERIFY_SOLVER = { omega: 1.8, tol: 1e-7, maxIter: 5000 };

/** Run a synthetic spec for a number of steps with a fixed source array (m3/day). */
function runTestSpec(spec, src, steps, dt = 30) {
  const ws = workspace(spec);
  let h = Float64Array.from(spec.h0);
  const parts = { rain: 0, ret: 0, wc: 0, pond: 0, pump: 0 };
  for (let i = 0; i < spec.n; i++) if (spec.ib[i] === IB_ACTIVE && src[i] < 0) parts.pump -= src[i];
  let maxErr = 0;
  let iters = 0;
  for (let k = 0; k < steps; k++) {
    const st = { src, parts, tYears: (k + 1) / 12, rivOn: false, etMax: 0 };
    const out = solveStep(spec, h, st, dt, VERIFY_SOLVER, ws);
    const bud = budgetStep(spec, h, out.h, st, dt, ws);
    maxErr = Math.max(maxErr, Math.abs(bud.err));
    iters += out.iters;
    h = out.h;
  }
  return { h, maxErr, iters };
}

/** Zero pumping and zero recharge on a flat, heterogeneous aquifer: heads must not move. */
function verifyZeroStress() {
  const tMap = (x, y) => 400 + 900 * (0.5 + 0.5 * Math.sin(x / 3) * Math.cos(y / 4));
  const spec = testSpec({ nx: 25, ny: 25, h0: 100, tMap, unconfined: true, base: 20 });
  const r = runTestSpec(spec, new Float64Array(spec.n), 24);
  let maxChange = 0;
  for (let i = 0; i < spec.n; i++) maxChange = Math.max(maxChange, Math.abs(r.h[i] - 100));
  return { id: 'zero', pass: maxChange < 1e-9, value: maxChange, limit: 1e-9 };
}

/** A closed box (no-flow edges, no stresses) with a mound must conserve stored water exactly. */
function verifyClosedBox() {
  const spec = testSpec({ nx: 21, ny: 21, h0: 100, edges: 'noflow' });
  for (let i = 0; i < spec.n; i++) {
    const dx = (i % 21) - 10;
    const dy = Math.floor(i / 21) - 10;
    spec.h0[i] = 100 + 3 * Math.exp(-(dx * dx + dy * dy) / 12);
  }
  const before = spec.h0.reduce((a, b) => a + b, 0);
  const r = runTestSpec(spec, new Float64Array(spec.n), 12);
  const after = r.h.reduce((a, b) => a + b, 0);
  const lost = Math.abs(after - before) * spec.sy[0] * spec.A;
  const spread = Math.max(...r.h) - Math.min(...r.h);
  return { id: 'box', pass: lost < 1 && spread < 3, value: lost, limit: 1, spread };
}

/** One well in the centre of a uniform aquifer: the cone must be symmetric in all four directions. */
function verifySymmetricCone(Q = 2500) {
  const nx = 31;
  const c = 15;
  const spec = testSpec({ nx, ny: nx, h0: 100, T: 1000, sy: 0.15 });
  const src = new Float64Array(spec.n);
  src[c * nx + c] = -Q;
  const r = runTestSpec(spec, src, 12);
  const s = (x, y) => 100 - r.h[y * nx + x];
  let asym = 0;
  const profile = [];
  for (let d = 0; d <= c; d++) {
    const ring = [s(c + d, c), s(c - d, c), s(c, c + d), s(c, c - d)];
    asym = Math.max(asym, Math.max(...ring) - Math.min(...ring));
    for (let e = 0; e <= c; e++) asym = Math.max(asym, Math.abs(s(c + d, c + e) - s(c + e, c + d)));
    profile.push(ring[0]);
  }
  const monotone = profile.every((v, i) => i === 0 || v <= profile[i - 1] + 1e-9);
  return { id: 'cone', pass: asym < 1e-4 && monotone && profile[0] > 0.1, value: asym, limit: 1e-4, profile, centre: profile[0], monotone, mb: r.maxErr };
}

/** Exponential integral E1(u) = Theis well function W(u) (Abramowitz and Stegun 5.1.53, 5.1.56). */
function wellFunction(u) {
  if (u <= 1) {
    const a = [-0.57721566, 0.99999193, -0.24991055, 0.05519968, -0.00976004, 0.00107857];
    return -Math.log(u) + a[0] + u * (a[1] + u * (a[2] + u * (a[3] + u * (a[4] + u * a[5]))));
  }
  const num = u ** 4 + 8.5733287401 * u ** 3 + 18.059016973 * u ** 2 + 8.6347608925 * u + 0.2677737343;
  const den = u ** 4 + 9.5733223454 * u ** 3 + 25.6329561486 * u ** 2 + 21.0996530827 * u + 3.9584969228;
  return num / den / (u * Math.exp(u));
}

/** Numerical drawdown against the Theis solution s = Q W(u) / (4 pi T), u = r^2 S / (4 T t). */
function verifyTheis({ Q = 2000, T = 1000, S = 0.2, days = 180, dt = 10 } = {}) {
  const nx = 61;
  const c = 30;
  const spec = testSpec({ nx, ny: nx, h0: 100, T, sy: S });
  const src = new Float64Array(spec.n);
  src[c * nx + c] = -Q;
  const r = runTestSpec(spec, src, Math.round(days / dt), dt);
  const rows = [200, 300, 500, 700, 900].map(dist => {
    const num = 100 - r.h[c * nx + c + dist / spec.dx];
    const u = (dist * dist * S) / (4 * T * days);
    const ana = (Q / (4 * Math.PI * T)) * wellFunction(u);
    return { r: dist, num, ana, diff: (100 * (num - ana)) / ana };
  });
  const worst = Math.max(...rows.map(x => Math.abs(x.diff)));
  return { id: 'theis', pass: worst < 10, value: worst, limit: 10, rows };
}

/** Water-balance closure of a village run (every step under 1 %). */
function verifyVillageBalance(run) {
  return { id: 'balance', pass: run.maxErr < 1, value: run.maxErr, limit: 1, steps: run.steps.length };
}

function verifyAll(run) {
  const out = [verifyZeroStress(), verifyClosedBox(), verifySymmetricCone(), verifyTheis()];
  if (run) out.push(verifyVillageBalance(run));
  return out;
}

// ---------- run manager: history + business-as-usual projection, cached per village ----------
const RUNS = new Map();
let runBusy = 0;
const nextFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));

/** Join a history run and a projection run that starts from its final heads. */
function mergeRuns(hist, proj) {
  return {
    ...hist,
    months: hist.months + proj.months,
    heads: hist.heads.concat(proj.heads.slice(1)),
    steps: hist.steps.concat(proj.steps),
    years: hist.years.concat(proj.years),
    hEnd: proj.hEnd,
    maxErr: Math.max(hist.maxErr, proj.maxErr),
    histEnd: hist.hEnd,
  };
}

function setRunChip() {
  const chip = $('#runChip');
  if (!chip) return;
  const r = RUNS.get(S.cur);
  chip.classList.toggle('busy', runBusy > 0);
  chip.innerHTML = runBusy > 0 ? `${ic('refresh')}<span class="lbl">${t('runBusy')}</span>` : r ? `${ic('check-circle')}<span class="lbl">${t('runReady', { err: fmtN(r.maxErr, 4) })}</span>` : `${ic('clock')}<span class="lbl">${t('runStale')}</span>`;
  chip.title = t('runChipHint');
}

/** The cached base run for a village, computing it (in two chunks) when missing. */
async function ensureRun(v = V()) {
  if (RUNS.has(v.id)) return RUNS.get(v.id);
  if (RUNS.has('pending:' + v.id)) return RUNS.get('pending:' + v.id);
  const job = (async () => {
    runBusy++;
    setRunChip();
    await nextFrame();
    const hist = simulate(v, { months: HIST_MONTHS, wellDetail: true });
    await nextFrame();
    const proj = simulate(v, { start: HIST_MONTHS, months: PROJ_MONTHS, h0: hist.hEnd, wellDetail: true });
    const run = mergeRuns(hist, proj);
    run.ts = now();
    RUNS.set(v.id, run);
    RUNS.delete('pending:' + v.id);
    runBusy--;
    setRunChip();
    afterRun(v, run);
    return run;
  })();
  RUNS.set('pending:' + v.id, job);
  return job;
}
const cachedRun = (v = V()) => RUNS.get(v.id) || null;

/** Village edits invalidate the cached run; the next view that needs it recomputes. */
function markStale(v = V()) {
  RUNS.delete(v.id);
  RUNS.delete('nopump:' + v.id);
  if (S.scen[v.id] && Object.keys(S.scen[v.id].results || {}).length) {
    S.scen[v.id].stale = true;
    persist('scen');
  }
  setRunChip();
}

// ---------- reading the run ----------
const headsAt = (run, k) => run.heads[clamp(k + 1, 0, run.heads.length - 1)];
const depthAt = (run, cell, k) => run.spec.zs[cell] - headsAt(run, k)[cell];
const NOW_K = HIST_MONTHS - 1;

/** Depth to water of every active cell at month k (NaN outside the model). */
function depthField(run, k) {
  const h = headsAt(run, k);
  const out = new Float32Array(run.spec.n);
  for (let i = 0; i < run.spec.n; i++) out[i] = run.spec.ib[i] ? run.spec.zs[i] - h[i] : NaN;
  return out;
}

/** Status of one well at month k: depth, margin above the pump intake, ok / risk / dry. */
function wellStatus(v, run, w, k) {
  const depth = depthAt(run, w.cell, k);
  if (w.use !== 'irr') return { depth, margin: Infinity, status: 'mon' };
  const margin = w.pump - 1 - depth;
  const status = margin < 0 ? 'dry' : margin < S.settings.riskMargin ? 'risk' : 'ok';
  return { depth, margin, status };
}

/** First month index at which the water table falls below a well's pump intake (or -1). */
function firstDryMonth(run, w) {
  if (w.use !== 'irr') return -1;
  for (let k = 0; k < run.steps.length; k++) if (depthAt(run, w.cell, k) > w.pump - 1) return k;
  return -1;
}

/** Headline numbers for the twin at month k. */
function twinKpis(v, run, k) {
  const wells = irrWells(v).map(w => wellStatus(v, run, w, k));
  const k12 = Math.max(-1, k - 12);
  const wy = run.years.filter(y => y.endK <= Math.max(k, 11)).at(-1) || run.years[0];
  return {
    dtw: k < 0 ? meanDepth(run.spec, headsAt(run, -1)) : run.steps[k].dtw,
    dtw0: meanDepth(run.spec, headsAt(run, -1)),
    change12: (k < 0 ? 0 : run.steps[k].dtw) - (k12 < 0 ? meanDepth(run.spec, headsAt(run, -1)) : run.steps[k12].dtw),
    risk: wells.filter(s => s.status === 'risk').length,
    dry: wells.filter(s => s.status === 'dry').length,
    total: wells.length,
    pump: wy ? wy.pump : 0,
    income: wy ? wy.income : 0,
    cost: wy ? wy.cost : 0,
    err: run.maxErr,
  };
}

/** Inbox notices after a fresh run: wells near or below their pump setting. */
function afterRun(v, run) {
  irrWells(v).forEach(w => {
    const st = wellStatus(v, run, w, NOW_K);
    if (st.status === 'dry') notify('nt_wellDry', { w: w.id, v: vName(v) }, { route: 'model', level: 'bad', key: `dry-${v.id}-${w.id}-${w.pump}` });
    else if (st.status === 'risk') notify('nt_wellRisk', { w: w.id, m: fmtDepth(st.margin + 1) }, { route: 'model', level: 'warn', key: `risk-${v.id}-${w.id}-${w.pump}` });
  });
  const dry10 = run.years.at(-1)?.dry || 0;
  if (dry10) notify('nt_forecastDry', { n: dry10, y: calYear(TOTAL_MONTHS - 1) }, { route: 'scenarios', level: 'warn', key: `fc-${v.id}-${dry10}` });
  if (curRoute) rerenderIfNeeds();
}

// ---------- observations and outliers ----------
const readingK = r => simIndexOf(Number(r.d.slice(0, 4)), Number(r.d.slice(5, 7)) - 1);

/** Modified z-score of each reading against a moving median of its neighbours (MAD based). */
function outlierScores(list) {
  const sorted = [...list].sort((a, b) => a.d.localeCompare(b.d));
  const res = sorted.map((r, i) => {
    const win = sorted.slice(Math.max(0, i - 3), i + 4).filter(x => x !== r).map(x => x.v);
    return r.v - median(win);
  });
  const m = median(res);
  const s = mad(res) || 0.05;
  const out = new Map();
  sorted.forEach((r, i) => out.set(r.id, (res[i] - m) / s));
  return out;
}

/** All outlier scores for a village, keyed by reading id. */
function villageOutliers(v) {
  const all = new Map();
  const byWell = new Map();
  readingsOf(v.id).forEach(r => (byWell.get(r.w) || byWell.set(r.w, []).get(r.w)).push(r));
  byWell.forEach(list => outlierScores(list).forEach((z, id) => all.set(id, z)));
  return all;
}
const isOutlier = z => Math.abs(z) > S.settings.madLimit;

/** Observations the calibration compares with: one per reading inside the history window. */
function observations(v, { exclude = S.settings.excludeOutliers } = {}) {
  const z = villageOutliers(v);
  const mon = monWells(v);
  const idx = new Map(mon.map((w, j) => [w.id, j]));
  return readingsOf(v.id)
    .filter(r => idx.has(r.w) && !(r.excluded || (exclude && isOutlier(z.get(r.id)) && !r.keep)))
    .map(r => ({ r, j: idx.get(r.w), k: readingK(r) }))
    .filter(o => o.k >= 0 && o.k < HIST_MONTHS);
}

/** Error statistics of simulated against observed depth for one set of multipliers. */
function calibStats(v, mult, obs = observations(v)) {
  const mon = monWells(v);
  const run = simulate(v, { mult, months: HIST_MONTHS, record: false, probe: mon.map(w => w.cell), solver: { tol: 1e-4 } });
  const pairs = obs.map(o => ({ w: o.r.w, k: o.k, obs: o.r.v, sim: v.ground[mon[o.j].cell] - run.steps[o.k].probe[o.j] }));
  return { ...errorStats(pairs), pairs, run };
}

function errorStats(pairs) {
  if (!pairs.length) return { rmse: 0, bias: 0, mae: 0, r2: 0, n: 0 };
  const res = pairs.map(p => p.sim - p.obs);
  const mo = mean(pairs.map(p => p.obs));
  const ssTot = sum(pairs.map(p => (p.obs - mo) ** 2));
  const ssRes = sum(res.map(x => x * x));
  return { rmse: Math.sqrt(ssRes / res.length), bias: mean(res), mae: mean(res.map(Math.abs)), r2: ssTot ? 1 - ssRes / ssTot : 0, n: res.length };
}

// ---------- scenario presets and runner ----------
const SCENARIOS = [
  { id: 'bau', icon: 'trending-down', color: '#5b3a29', levers: {} },
  { id: 'rice', icon: 'sprout', color: '#3d7533', levers: { riceToMaize: 0.5 } },
  { id: 'solar', icon: 'sun', color: '#c48f1f', levers: { solarShare: 0.6 } },
  { id: 'quota', icon: 'scale', color: '#22608f', levers: { quota: 800 } },
  { id: 'rotation', icon: 'rotate', color: '#7a4fa0', levers: { rotation: 0.25 } },
  { id: 'eff', icon: 'layers', color: '#a8552f', levers: { efficiency: 0.8 } },
  { id: 'ponds', icon: 'droplet', color: '#4a8fc0', levers: { ponds: 12 } },
  { id: 'drought', icon: 'thermometer', color: '#8a6d3b', levers: { drought: true } },
  { id: 'custom', icon: 'sliders', color: '#2a1d14', levers: null },
];
const scenState = v => (S.scen[v.id] = S.scen[v.id] || { picked: SCENARIOS.filter(s => s.id !== 'custom').map(s => s.id), custom: { riceToMaize: 0.3, quota: 0, ponds: 6, efficiency: 0.5, solarShare: 0, rotation: 0, drought: false }, results: {}, stale: false });
const scenLevers = (v, id) => (id === 'custom' ? scenState(v).custom : SCENARIOS.find(s => s.id === id).levers);

/** Ten-year projection of one scenario from today's heads, reduced to what the lab displays. */
function runScenario(v, base, levers) {
  const r = simulate(v, { levers, start: HIST_MONTHS, months: PROJ_MONTHS, h0: base.histEnd, record: false });
  const years = r.years.map(y => ({ dtw: round(y.dtw, 3), dry: y.dry, pump: Math.round(y.pump), cost: Math.round(y.cost), income: Math.round(y.income), potential: Math.round(y.potential), kwh: Math.round(y.kwh), litres: Math.round(y.litres), costBy: Object.fromEntries(Object.entries(y.costBy).map(([k, x]) => [k, Math.round(x)])) }));
  return { years, monthly: r.steps.map(s => round(s.dtw, 3)), maxErr: r.maxErr, ts: now() };
}

/** Run several scenarios with a paint between each so the progress bar moves; results persist. */
async function runScenarios(v, ids, onProgress) {
  const base = await ensureRun(v);
  const st = scenState(v);
  for (let i = 0; i < ids.length; i++) {
    onProgress(i, ids.length, ids[i]);
    await nextFrame();
    st.results[ids[i]] = runScenario(v, base, scenLevers(v, ids[i]));
  }
  st.stale = false;
  persist('scen');
  onProgress(ids.length, ids.length, '');
  return st.results;
}

// ---------- hand-drawn SVG charts ----------
// A view places chartBox(id, spec) placeholders; drawCharts() renders each at its real pixel width,
// so labels stay readable on phones. Every chart has a hover layer that feeds the shared tooltip.

const CHART_SPECS = new Map();

function chartBox(id, spec, h = 240) {
  CHART_SPECS.set(id, { spec, h });
  return `<div class="chart" id="ch-${id}" style="min-height:${h}px" role="img" aria-label="${esc(spec.aria || '')}"></div>`;
}

function drawCharts(root = document) {
  CHART_SPECS.forEach(({ spec, h }, id) => {
    const el = $('#ch-' + id, root);
    if (!el) return;
    const w = Math.max(240, Math.floor(el.clientWidth || 600));
    const fn = { line: lineChart, bar: barChart, scatter: scatterChart, sankey: sankeyChart }[spec.type || 'line'];
    el.innerHTML = fn({ ...spec, w, h });
  });
}

const linScale = (d0, d1, r0, r1) => v => r0 + ((v - d0) / (d1 - d0 || 1)) * (r1 - r0);

/** Round tick values spanning [min, max]. */
function niceTicks(min, max, n = 5) {
  if (min === max) return [min];
  const span = max - min;
  const step0 = span / n;
  const mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n) || mag * 10;
  const out = [];
  for (let v = Math.ceil(min / step) * step; v <= max + step * 1e-9; v += step) out.push(round(v, 6) || 0);
  return out;
}

function padRange(min, max, pad = 0.06) {
  if (!Number.isFinite(min) || !Number.isFinite(max)) return [0, 1];
  if (min === max) return [min - 1, max + 1];
  const p = (max - min) * pad;
  return [min - p, max + p];
}

function axisLeft(ticks, ys, x0, x1, fmt) {
  return ticks.map(v => `<line x1="${x0}" x2="${x1}" y1="${ys(v)}" y2="${ys(v)}"/>`).join('') + '</g><g class="axis">' + ticks.map(v => `<text x="${x0 - 6}" y="${ys(v) + 4}" text-anchor="end">${fmt(v)}</text>`).join('');
}

/** Line chart: series [{name, color, pts:[[x,y]], dash, width}], bands, markers, hover tips. */
function lineChart(o) {
  const { w, h } = o;
  const m = { l: o.ml ?? 50, r: o.mr ?? 14, t: o.mt ?? 12, b: o.mb ?? (o.x?.title ? 40 : 26) };
  const all = o.series.flatMap(s => s.pts).filter(p => Number.isFinite(p[1]));
  const xs0 = o.x?.min ?? Math.min(...all.map(p => p[0]));
  const xs1 = o.x?.max ?? Math.max(...all.map(p => p[0]));
  const [y0, y1] = o.y?.min != null ? [o.y.min, o.y.max] : padRange(Math.min(...all.map(p => p[1])), Math.max(...all.map(p => p[1])));
  const X = linScale(xs0, xs1, m.l, w - m.r);
  const Y = o.y?.invert ? linScale(y0, y1, m.t, h - m.b) : linScale(y0, y1, h - m.b, m.t);
  const fmtY = o.y?.fmt || (v => fmtN(v, Math.abs(y1 - y0) < 5 ? 1 : 0));
  const yt = niceTicks(Math.min(y0, y1), Math.max(y0, y1), o.compact ? 3 : 5);
  let svg = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">`;
  (o.bands || []).forEach(b => (svg += `<rect class="${b.cls || 'band'}" x="${X(b.x0)}" y="${m.t}" width="${Math.max(0, X(b.x1) - X(b.x0))}" height="${h - m.t - m.b}"/>`));
  svg += `<g class="grid">${axisLeft(yt, Y, m.l, w - m.r, fmtY)}`;
  const xt = o.x?.ticks || [];
  const every = Math.max(1, Math.ceil((xt.length * 38) / (w - m.l - m.r)));
  xt.forEach(([v, lab], i) => i % every === 0 && (svg += `<text x="${X(v)}" y="${h - m.b + 16}" text-anchor="middle">${lab}</text>`));
  if (o.y?.title) svg += `<text class="ttl" x="${m.l}" y="${m.t - 2}" text-anchor="start" dy="-2">${o.y.title}</text>`;
  if (o.x?.title) svg += `<text class="ttl" x="${(m.l + w - m.r) / 2}" y="${h - 4}" text-anchor="middle">${o.x.title}</text>`;
  svg += '</g>';
  (o.refs || []).forEach(r => (svg += `<line x1="${m.l}" x2="${w - m.r}" y1="${Y(r.y)}" y2="${Y(r.y)}" stroke="${r.color}" stroke-dasharray="5 4" stroke-width="1.5"/><text class="lab" x="${w - m.r - 4}" y="${Y(r.y) - 5}" text-anchor="end">${r.label}</text>`));
  o.series.forEach(s => {
    const d = linePath(s.pts, X, Y);
    if (d) svg += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ''} stroke-linejoin="round" stroke-linecap="round" ${s.draw === false ? '' : 'data-draw'} opacity="${s.opacity || 1}"/>`;
    if (s.dots) s.pts.forEach(p => Number.isFinite(p[1]) && (svg += `<circle class="dot" cx="${X(p[0])}" cy="${Y(p[1])}" r="${s.r || 3.5}" fill="${s.color}"/>`));
    if (s.label && s.pts.length) {
      const p = s.pts[s.pts.length - 1];
      svg += `<text class="lab" x="${X(p[0]) - 4}" y="${Y(p[1]) - 7}" text-anchor="end">${esc(s.label)}</text>`;
    }
  });
  (o.markers || []).forEach(mk => (svg += `<circle class="${mk.cls || 'outlier'}" cx="${X(mk.x)}" cy="${Y(mk.y)}" r="${mk.r || 6}" ${mk.tip ? `data-tip="${esc(mk.tip)}"` : ''}/>`));
  if (o.hover) svg += hoverLayer(o.hover, X, m, h, w);
  return svg + '</svg>';
}

/** SVG path through finite points, breaking the line at gaps. */
function linePath(pts, X, Y) {
  let d = '';
  let pen = false;
  for (const [x, y] of pts) {
    if (!Number.isFinite(y)) {
      pen = false;
      continue;
    }
    d += `${pen ? 'L' : 'M'}${round(X(x), 1)} ${round(Y(y), 1)}`;
    pen = true;
  }
  return d;
}

/** Invisible full-height columns, one per x value, carrying the crosshair tooltip text. */
function hoverLayer(hv, X, m, h, w) {
  const xs = hv.xs;
  let out = '<g>';
  xs.forEach((x, i) => {
    const a = i ? (X(xs[i - 1]) + X(x)) / 2 : m.l;
    const b = i < xs.length - 1 ? (X(x) + X(xs[i + 1])) / 2 : w - m.r;
    out += `<rect class="hit" x="${a}" y="${m.t}" width="${Math.max(1, b - a)}" height="${h - m.t - m.b}" data-tip="${esc(hv.tip(i))}"/>`;
  });
  return out + '</g>';
}

/** Bar chart: cats [{label, values:[stack...], tip}], colors per stack, optional reference line. */
function barChart(o) {
  const { w, h } = o;
  const m = { l: o.ml ?? 52, r: 12, t: 14, b: o.mb ?? 34 };
  const totals = o.cats.map(c => sum(c.values.map(v => Math.max(0, v))));
  const max = o.y?.max ?? Math.max(1e-9, ...totals, ...(o.refs || []).map(r => r.y)) * 1.08;
  const Y = linScale(0, max, h - m.b, m.t);
  const bw = (w - m.l - m.r) / o.cats.length;
  const gap = Math.min(14, bw * 0.28);
  const fmtY = o.y?.fmt || (v => fmtN(v, max < 5 ? 1 : 0));
  let svg = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><g class="grid">${axisLeft(niceTicks(0, max, 4), Y, m.l, w - m.r, fmtY)}`;
  if (o.y?.title) svg += `<text class="ttl" x="${m.l}" y="${m.t - 4}">${o.y.title}</text>`;
  const every = Math.ceil(o.cats.length / Math.max(1, Math.floor((w - m.l) / 46)));
  o.cats.forEach((c, i) => i % every === 0 && (svg += `<text x="${m.l + bw * i + bw / 2}" y="${h - m.b + 15}" text-anchor="middle">${esc(c.label)}</text>`));
  svg += '</g>';
  o.cats.forEach((c, i) => {
    let base = 0;
    const x = m.l + bw * i + gap / 2;
    c.values.forEach((v, j) => {
      if (v <= 0) return;
      const y = Y(base + v);
      const hh = Y(base) - y;
      svg += `<rect x="${round(x, 1)}" y="${round(y, 1)}" width="${round(bw - gap, 1)}" height="${round(Math.max(0, hh - 1), 1)}" rx="3" fill="${(c.colors || o.colors)[j]}"/>`;
      base += v;
    });
    svg += `<rect class="hit" x="${m.l + bw * i}" y="${m.t}" width="${bw}" height="${h - m.t - m.b}" data-tip="${esc(c.tip || '')}"/>`;
  });
  (o.refs || []).forEach(r => (svg += `<line x1="${m.l}" x2="${w - m.r}" y1="${Y(r.y)}" y2="${Y(r.y)}" stroke="${r.color}" stroke-dasharray="5 4" stroke-width="1.5"/><text class="lab" x="${w - m.r - 4}" y="${Y(r.y) - 5}" text-anchor="end">${r.label}</text>`));
  return svg + '</svg>';
}

/** Scatter plot with an optional 1:1 line (observed against simulated). */
function scatterChart(o) {
  const { w, h } = o;
  const m = { l: 52, r: 14, t: 14, b: 42 };
  const vals = o.pts.flatMap(p => [p.x, p.y]);
  const [a, b] = padRange(Math.min(...vals), Math.max(...vals), 0.04);
  const X = linScale(a, b, m.l, w - m.r);
  const Y = o.invert ? linScale(a, b, m.t, h - m.b) : linScale(a, b, h - m.b, m.t);
  const ticks = niceTicks(a, b, 5);
  let svg = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><g class="grid">${axisLeft(ticks, Y, m.l, w - m.r, v => fmtN(v, 0))}`;
  ticks.forEach(v => (svg += `<text x="${X(v)}" y="${h - m.b + 16}" text-anchor="middle">${fmtN(v, 0)}</text>`));
  svg += `<text class="ttl" x="${(m.l + w - m.r) / 2}" y="${h - 6}" text-anchor="middle">${o.xTitle || ''}</text><text class="ttl" x="${m.l}" y="${m.t - 4}">${o.yTitle || ''}</text></g>`;
  if (o.oneToOne) svg += `<line x1="${X(a)}" y1="${Y(a)}" x2="${X(b)}" y2="${Y(b)}" stroke="var(--clay)" stroke-width="1.5" stroke-dasharray="6 4"/>`;
  o.pts.forEach(p => (svg += `<circle cx="${round(X(p.x), 1)}" cy="${round(Y(p.y), 1)}" r="${p.r || 4}" fill="${p.color || 'var(--aq4)'}" fill-opacity="${p.op || 0.7}" stroke="var(--card)" stroke-width="1" data-tip="${esc(p.tip || '')}"/>`));
  return svg + '</svg>';
}

/** Year ticks for month-indexed series. */
function yearTicks(k0, k1, every = 1) {
  const out = [];
  for (let k = k0; k <= k1; k++) if (calMonth(k) === 0 && (calYear(k) % every === 0)) out.push([k, String(calYear(k))]);
  return out;
}

/** Monsoon (July to September) shading bands over a month-indexed axis. */
function monsoonBands(k0, k1) {
  const out = [];
  for (let k = k0; k <= k1; k++) if (calMonth(k) === 6) out.push({ x0: k - 0.5, x1: Math.min(k1, k + 2.5), cls: 'band' });
  return out;
}

// ---------- colour scales (sequential blues for depth and head, diverging for change) ----------
const SCALE_DEPTH = ['#eef7fa', '#c3e0ef', '#86bcdc', '#4a8fc0', '#22608f', '#143e63'];
const SCALE_DIVERGE = ['#1f5e8e', '#7fb6d6', '#ece6dc', '#d9a07c', '#a8552f'];
const CELL_COLORS = ['#cdb77c', '#b9826a', '#2f7fc0', '#7fb6d6', '#4a8fc0', '#a99a86', '#d8d0c4'];

const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));

/** Colour for t in [0, 1] along a list of hex stops. */
function rampColor(stops, tt) {
  const x = clamp(tt, 0, 1) * (stops.length - 1);
  const i = Math.min(stops.length - 2, Math.floor(x));
  const f = x - i;
  const a = hexRgb(stops[i]);
  const b = hexRgb(stops[i + 1]);
  return a.map((c, j) => Math.round(c + (b[j] - c) * f));
}
const rgbStr = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const gradCss = stops => `linear-gradient(90deg, ${stops.join(', ')})`;

/** Value range of a field, rounded outwards to whole metres. */
function fieldRange(vals) {
  let lo = Infinity;
  let hi = -Infinity;
  for (const x of vals) {
    if (!Number.isFinite(x)) continue;
    if (x < lo) lo = x;
    if (x > hi) hi = x;
  }
  if (!Number.isFinite(lo)) return [0, 1];
  return [Math.floor(lo), Math.ceil(hi) === Math.floor(lo) ? Math.floor(lo) + 1 : Math.ceil(hi)];
}

// ---------- marching squares contours ----------
// Corner order: a top-left, b top-right, c bottom-right, d bottom-left; edges t r b l.
const MS_SEGMENTS = {
  1: [['l', 'b']], 2: [['b', 'r']], 3: [['l', 'r']], 4: [['t', 'r']], 5: [['l', 't'], ['b', 'r']], 6: [['t', 'b']], 7: [['l', 't']],
  8: [['l', 't']], 9: [['t', 'b']], 10: [['t', 'r'], ['l', 'b']], 11: [['t', 'r']], 12: [['l', 'r']], 13: [['b', 'r']], 14: [['l', 'b']],
};

/** Line segments (in cell-centre coordinates) where the field crosses a level. */
function marchingSquares(vals, nx, ny, level) {
  const segs = [];
  const at = (x, y) => vals[y * nx + x];
  for (let y = 0; y < ny - 1; y++) {
    for (let x = 0; x < nx - 1; x++) {
      const a = at(x, y);
      const b = at(x + 1, y);
      const c = at(x + 1, y + 1);
      const d = at(x, y + 1);
      if (!(Number.isFinite(a) && Number.isFinite(b) && Number.isFinite(c) && Number.isFinite(d))) continue;
      const code = (a > level ? 8 : 0) | (b > level ? 4 : 0) | (c > level ? 2 : 0) | (d > level ? 1 : 0);
      const list = MS_SEGMENTS[code];
      if (!list) continue;
      const f = (p, q) => (level - p) / (q - p || 1e-9);
      const pt = {
        t: [x + f(a, b), y], r: [x + 1, y + f(b, c)], b: [x + f(d, c), y + 1], l: [x, y + f(a, d)],
      };
      list.forEach(([e1, e2]) => segs.push([pt[e1], pt[e2]]));
    }
  }
  return segs;
}

/** Contour interval giving roughly eight lines over a range. */
function contourStep(lo, hi) {
  const raw = (hi - lo) / 8;
  return [0.25, 0.5, 1, 2, 2.5, 5, 10].find(s => s >= raw) || 10;
}

/** SVG for contour lines and a few labels; coordinates are shifted to cell centres (+0.5). */
function contourSvg(vals, nx, ny, { lo, hi, fmt = v => fmtN(v, 1) } = {}) {
  const step = contourStep(lo, hi);
  let out = '';
  let labels = '';
  for (let L = Math.ceil(lo / step) * step; L <= hi; L += step) {
    const segs = marchingSquares(vals, nx, ny, L);
    if (!segs.length) continue;
    const major = Math.abs(L / (step * 5) - Math.round(L / (step * 5))) < 1e-6 || step >= 2;
    const d = segs.map(([p, q]) => `M${round(p[0] + 0.5, 2)} ${round(p[1] + 0.5, 2)}L${round(q[0] + 0.5, 2)} ${round(q[1] + 0.5, 2)}`).join('');
    out += `<path class="contour ${major ? 'major' : ''}" d="${d}"/>`;
    if (segs.length > 6) {
      const s = segs[Math.floor(segs.length / 2)];
      labels += `<text class="clabel" x="${round((s[0][0] + s[1][0]) / 2 + 0.5, 2)}" y="${round((s[0][1] + s[1][1]) / 2 + 0.5, 2)}" text-anchor="middle">${fmt(L)}</text>`;
    }
  }
  return out + labels;
}

// ---------- plan view: smooth heatmap canvas plus an SVG overlay in cell units ----------
const planHtml = (id, aria = '') => `<div class="plan" id="pl-${id}" role="img" aria-label="${esc(aria)}"><canvas width="800" height="600"></canvas><svg class="ovl" viewBox="0 0 40 30" preserveAspectRatio="none"></svg></div>`;

/** Paint values (one per cell) through a colour ramp, bilinear-smoothed by the browser. */
function paintHeat(canvas, vals, nx, ny, stops, lo, hi) {
  const small = document.createElement('canvas');
  small.width = nx;
  small.height = ny;
  const sctx = small.getContext('2d');
  const img = sctx.createImageData(nx, ny);
  for (let i = 0; i < nx * ny; i++) {
    const x = vals[i];
    const c = Number.isFinite(x) ? rampColor(stops, (x - lo) / (hi - lo || 1)) : [216, 208, 196];
    img.data.set([c[0], c[1], c[2], 255], i * 4);
  }
  sctx.putImageData(img, 0, 0);
  canvas.width = nx * 20;
  canvas.height = ny * 20;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(small, 0, 0, canvas.width, canvas.height);
}

/** Canals, ponds and the abadi drawn on the overlay so they read through any heat layer. */
function featureSvg(v) {
  let out = '';
  v.cells.forEach((c, i) => {
    const [x, y] = cellXY(v, i);
    if (c === CT.canal) out += `<rect x="${x}" y="${y + 0.25}" width="1.02" height="0.5" fill="#1f6fb0"/>`;
    else if (c === CT.distry) out += `<rect x="${x + 0.3}" y="${y}" width="0.4" height="1.02" fill="#3f8fca"/>`;
    else if (c === CT.pond) out += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="#2f7fc0" opacity=".85"/>`;
    else if (c === CT.abadi) out += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="#b9826a" opacity=".92"/>`;
    else if (c === CT.off) out += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="#d8d0c4"/>`;
  });
  return out;
}

/** Well markers, coloured by status; pulsing ring on dry wells. */
function wellMarks(v, marks) {
  return marks.map(m => {
    const [x, y] = cellXY(v, m.cell);
    const ring = m.cls === 'dry' ? `<circle class="ring" cx="${x + 0.5}" cy="${y + 0.5}" r="0.6"/>` : '';
    const shape = m.cls === 'mon' ? `<rect class="well mon" x="${x + 0.15}" y="${y + 0.15}" width="0.7" height="0.7" rx="0.12"` : `<circle class="well ${m.cls}" cx="${x + 0.5}" cy="${y + 0.5}" r="0.42"`;
    return `${ring}${shape} data-tip="${esc(m.tip)}"/>`;
  }).join('');
}

/** Paint a plan view: o = { v, vals, stops, lo, hi, contours, marks, section, fmt }. */
function paintPlan(id, o) {
  const box = $('#pl-' + id);
  if (!box) return;
  paintHeat($('canvas', box), o.vals, o.v.nx, o.v.ny, o.stops, o.lo, o.hi);
  const svg = $('svg', box);
  svg.setAttribute('viewBox', `0 0 ${o.v.nx} ${o.v.ny}`);
  let html = featureSvg(o.v);
  // Contours are traced on a lightly smoothed copy so cell-to-cell noise does not make them jagged.
  const smooth = boxBlur(o.vals, o.v.nx, o.v.ny, j => Number.isFinite(o.vals[j]));
  if (o.contours !== false) html += contourSvg(smooth, o.v.nx, o.v.ny, { lo: o.lo, hi: o.hi, fmt: o.fmt });
  html += wellMarks(o.v, o.marks || []);
  if (o.section) {
    const [a, b] = o.section;
    html += `<line class="secline" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/><circle class="secend" cx="${a[0]}" cy="${a[1]}" r="0.45"/><circle class="secend" cx="${b[0]}" cy="${b[1]}" r="0.45"/>`;
    html += `<text class="clabel" x="${a[0]}" y="${a[1] - 0.8}" text-anchor="middle" style="font-size:1.2px">A</text><text class="clabel" x="${b[0]}" y="${b[1] - 0.8}" text-anchor="middle" style="font-size:1.2px">B</text>`;
  }
  svg.innerHTML = html;
}

/** Cell under a pointer event on a plan or editor canvas. */
function cellFromEvent(e, el, v) {
  const r = el.getBoundingClientRect();
  const fx = (e.clientX - r.left) / r.width;
  const fy = (e.clientY - r.top) / r.height;
  return { x: clamp(fx * v.nx, 0, v.nx - 0.001), y: clamp(fy * v.ny, 0, v.ny - 0.001) };
}

/** Colour-scale legend strip for a plan view. */
function scaleLegend(stops, lo, hi, label, fmt = v => fmtN(v, 1)) {
  return `<div class="cscale"><span>${label}</span><b class="num">${fmt(lo)}</b><span class="grad" style="background:${gradCss(stops)}"></span><b class="num">${fmt(hi)}</b></div>`;
}

/** Standard well marks for a run at month k. */
function runMarks(v, run, k) {
  return v.wells.map(w => {
    const st = wellStatus(v, run, w, k);
    const tip = `<b>${esc(w.id)}</b> · ${esc(farmerName(v, w.owner))}<br>${t('depthToWater')}: ${fmtDepth(st.depth)}` + (w.use === 'irr' ? `<br>${t('pumpSetting')}: ${fmtDepth(w.pump)} · ${t('st_' + st.status)}` : `<br>${t('piezometer')}`);
    return { cell: w.cell, cls: st.status, tip };
  });
}

// ---------- animated geological cross-section along a line A-B (cell coordinates) ----------

/** Bilinear sample of a per-cell array at a continuous point (cell centres at i + 0.5). */
function sampleGrid(arr, nx, ny, x, y) {
  const gx = clamp(x - 0.5, 0, nx - 1.0001);
  const gy = clamp(y - 0.5, 0, ny - 1.0001);
  const i0 = Math.floor(gx);
  const j0 = Math.floor(gy);
  const tx = gx - i0;
  const ty = gy - j0;
  const v00 = arr[j0 * nx + i0];
  const v10 = arr[j0 * nx + i0 + 1];
  const v01 = arr[(j0 + 1) * nx + i0];
  const v11 = arr[(j0 + 1) * nx + i0 + 1];
  const vals = [v00, v10, v01, v11];
  if (vals.some(q => !Number.isFinite(q))) return vals.find(Number.isFinite) ?? NaN;
  return v00 * (1 - tx) * (1 - ty) + v10 * tx * (1 - ty) + v01 * (1 - tx) * ty + v11 * tx * ty;
}

/** Samples along the section: ground, head now, head at the reference month, base, cell type. */
function sectionSamples(v, run, k, line, kRef = -1, n = 140) {
  const [a, b] = line;
  const h = headsAt(run, k);
  const h0 = headsAt(run, kRef);
  const out = [];
  for (let s = 0; s <= n; s++) {
    const tt = s / n;
    const x = a[0] + (b[0] - a[0]) * tt;
    const y = a[1] + (b[1] - a[1]) * tt;
    const ci = Math.floor(clamp(y, 0, v.ny - 0.001)) * v.nx + Math.floor(clamp(x, 0, v.nx - 0.001));
    out.push({
      tt, x, y, type: v.cells[ci], cell: ci,
      zs: sampleGrid(run.spec.zs, v.nx, v.ny, x, y),
      h: sampleGrid(h, v.nx, v.ny, x, y),
      h0: sampleGrid(h0, v.nx, v.ny, x, y),
      base: sampleGrid(run.spec.base, v.nx, v.ny, x, y),
    });
  }
  return out;
}

/** Wells within one cell of the section line, with their position along it. */
function wellsNearLine(v, line) {
  const [a, b] = line;
  const dx = b[0] - a[0];
  const dy = b[1] - a[1];
  const L2 = dx * dx + dy * dy || 1;
  return v.wells.map(w => {
    const [x, y] = cellXY(v, w.cell).map(c => c + 0.5);
    const tt = clamp(((x - a[0]) * dx + (y - a[1]) * dy) / L2, 0, 1);
    const d = Math.hypot(a[0] + dx * tt - x, a[1] + dy * tt - y);
    return { w, tt, d };
  }).filter(o => o.d <= 1.1);
}

/** Vertical window: a little sky above the highest ground, down past the deepest water or pump. */
function sectionWindow(samples, wells) {
  const top = Math.max(...samples.map(s => s.zs)) + 8;
  const lowHead = Math.min(...samples.map(s => Math.min(s.h, s.h0)));
  const lowPump = Math.min(lowHead, ...wells.filter(o => o.w.use === 'irr').map(o => o.zs - o.w.pump));
  return { top, bot: Math.min(lowHead - 6, lowPump - 3) };
}

const polyPts = (pts, X, Y) => pts.map(([tt, z]) => `${round(X(tt), 1)},${round(Y(z), 1)}`).join(' ');

/** Soil layers, saturated zone and the base of the aquifer. */
function layerSvg(id, smp, X, Y, win) {
  const top = smp.map(s => [s.tt, s.zs]);
  const at = d => smp.map(s => [s.tt, s.zs - d]);
  const botLine = [[1, win.bot], [0, win.bot]];
  const band = (upper, lower) => polyPts([...upper, ...[...lower].reverse()], X, Y);
  let out = `<polygon points="${polyPts([...at(5), ...botLine], X, Y)}" fill="url(#${id}-sand)"/>`;
  out += `<polygon points="${band(at(1.5), at(5))}" fill="url(#${id}-clay)"/>`;
  out += `<polygon points="${band(top, at(1.5))}" fill="#5b3a29"/>`;
  out += `<polygon points="${polyPts([...smp.map(s => [s.tt, Math.min(s.h, s.zs)]), ...botLine], X, Y)}" fill="url(#${id}-water)"/>`;
  const baseVisible = smp.some(s => s.base > win.bot);
  if (baseVisible) out += `<polygon points="${polyPts([...smp.map(s => [s.tt, Math.max(win.bot, s.base)]), ...botLine], X, Y)}" fill="#3a2417"/>`;
  return out;
}

/** Canals, houses and crops on the ground surface. */
function surfaceSvg(smp, X, Y, k) {
  let out = '';
  const m = calMonth(Math.max(0, k));
  const kharif = m >= 4 && m <= 9;
  smp.forEach((s, i) => {
    const x = X(s.tt);
    if (s.type === CT.canal || s.type === CT.distry) {
      const y0 = Y(s.zs + 0.9);
      out += `<rect x="${x - 3}" y="${y0}" width="7" height="${Y(s.zs - 1.2) - y0}" fill="#2f7fc0"/>`;
      if (i % 2 === 0) out += `<path d="M${x} ${Y(s.zs - 1.6)}v9m-3 -3 3 3 3 -3" stroke="#b9d9ec" stroke-width="1.4" fill="none"/>`;
    } else if (s.type === CT.abadi && i % 3 === 0) {
      const y = Y(s.zs);
      out += `<path d="M${x - 6} ${y}v-9h12v9zM${x - 8} ${y - 9}l8 -7 8 7z" fill="#b9826a" stroke="#5b3a29" stroke-width=".8"/>`;
    } else if (s.type === CT.pond) {
      out += `<rect x="${x - 3}" y="${Y(s.zs)}" width="7" height="${Y(s.zs - 1.5) - Y(s.zs)}" fill="#4a8fc0"/>`;
    } else if (s.type === CT.field && i % 2 === 0) {
      const y = Y(s.zs);
      const col = kharif ? '#3d7533' : m >= 2 && m <= 3 ? '#c48f1f' : '#6f9c4a';
      out += `<path d="M${x} ${y}v-7M${x - 2.5} ${y}l1 -5M${x + 2.5} ${y}l-1 -5" stroke="${col}" stroke-width="1.3" fill="none" stroke-linecap="round"/>`;
    }
  });
  return out;
}

/** Tubewells as vertical pipes with the pump intake marked; colour shows ok / at risk / dry. */
function wellPipeSvg(v, run, k, near, X, Y, win) {
  const col = { ok: '#3d7533', risk: '#c48f1f', dry: '#b0332a', mon: '#22608f' };
  const lift = labelLevels(near.map(o => X(o.tt)));
  return near.map((o, idx) => {
    const w = o.w;
    const x = X(o.tt);
    const zs = run.spec.zs[w.cell];
    const st = wellStatus(v, run, w, k);
    const bottom = Math.max(win.bot, zs - w.depth);
    let s = `<rect x="${x - 2.5}" y="${Y(zs + 1.6)}" width="5" height="${Y(bottom) - Y(zs + 1.6)}" fill="#d8d0c4" stroke="#3a2417" stroke-width=".8"/>`;
    s += `<rect x="${x - 7}" y="${Y(zs + 2.6)}" width="14" height="${Y(zs + 1.2) - Y(zs + 2.6)}" rx="2" fill="${col[st.status]}"/>`;
    if (w.use === 'irr') s += `<rect x="${x - 5}" y="${Y(zs - w.pump + 0.6)}" width="10" height="${Y(zs - w.pump - 0.6) - Y(zs - w.pump + 0.6)}" rx="2" fill="${col[st.status]}" stroke="#fff" stroke-width="1"/>`;
    if (lift[idx] >= 0) s += `<text class="tag" x="${x}" y="${Y(zs + 3.2) - lift[idx] * 12}" text-anchor="middle" fill="${col[st.status]}">${esc(w.id)}</text>`;
    return `<g data-tip="${esc(`<b>${w.id}</b> · ${t('st_' + st.status)}<br>${t('depthToWater')}: ${fmtDepth(st.depth)}${w.use === 'irr' ? `<br>${t('pumpSetting')}: ${fmtDepth(w.pump)}` : ''}`)}">${s}</g>`;
  }).join('');
}

/** Label rows for well ids: 0 or 1 for alternating heights, -1 when there is no room at all. */
function labelLevels(xs) {
  const order = xs.map((x, i) => [x, i]).sort((a, b) => a[0] - b[0]);
  const last = [-Infinity, -Infinity];
  const out = new Array(xs.length).fill(-1);
  for (const [x, i] of order) {
    const row = [0, 1].find(r => x - last[r] > 38);
    if (row == null) continue;
    out[i] = row;
    last[row] = x;
  }
  return out;
}

/** Rain streaks during monsoon months. */
function rainSvg(w, k) {
  const m = calMonth(Math.max(0, k));
  if (m < 6 || m > 8) return '';
  let out = '<g opacity=".7">';
  for (let i = 0; i < 26; i++) {
    const x = ((i * 97) % 100) / 100 * w;
    out += `<line class="drop" x1="${round(x, 1)}" y1="0" x2="${round(x - 3, 1)}" y2="10" stroke="#4a8fc0" stroke-width="1.4" style="animation-delay:${((i * 37) % 14) / 10}s"/>`;
  }
  return out + '</g>';
}

/** Full cross-section SVG. o = { v, run, k, line, w, h, kRef, id }. */
function crossSectionSvg(o) {
  const { v, run, k, line, w, h } = o;
  const id = o.id || 'xs';
  const smp = sectionSamples(v, run, k, line, o.kRef ?? -1);
  const near = wellsNearLine(v, line).map(x => ({ ...x, zs: run.spec.zs[x.w.cell] }));
  const win = sectionWindow(smp, near);
  const X = tt => 34 + tt * (w - 48);
  const Y = z => 8 + ((win.top - z) / (win.top - win.bot)) * (h - 26);
  const lenKm = (Math.hypot(line[1][0] - line[0][0], line[1][1] - line[0][1]) * v.cell) / 1000;
  const avg = mean(smp.map(s => s.zs - s.h));
  let svg = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><defs>
    <pattern id="${id}-sand" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e3cfa3"/><circle cx="2" cy="2" r=".9" fill="#b99a64"/><circle cx="6" cy="5" r=".7" fill="#c9ad76"/></pattern>
    <pattern id="${id}-clay" width="12" height="6" patternUnits="userSpaceOnUse"><rect width="12" height="6" fill="#b07052"/><path d="M1 3h5" stroke="#8f5539" stroke-width="1"/></pattern>
    <linearGradient id="${id}-water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a8fc0" stop-opacity=".72"/><stop offset="1" stop-color="#143e63" stop-opacity=".92"/></linearGradient></defs>`;
  svg += rainSvg(w, k) + layerSvg(id, smp, X, Y, win);
  svg += `<polyline points="${polyPts(smp.map(s => [s.tt, s.zs]), X, Y)}" fill="none" stroke="#2a1d14" stroke-width="1.6"/>`;
  svg += `<polyline points="${polyPts(smp.map(s => [s.tt, s.h0]), X, Y)}" fill="none" stroke="#f6ead6" stroke-width="1.4" stroke-dasharray="3 4" opacity=".9"/>`;
  svg += surfaceSvg(smp, X, Y, k);
  svg += `<polyline points="${polyPts(smp.map(s => [s.tt, Math.min(s.h, s.zs)]), X, Y)}" fill="none" stroke="#143e63" stroke-width="3"/><polyline class="wt" points="${polyPts(smp.map(s => [s.tt, Math.min(s.h, s.zs)]), X, Y)}"/>`;
  svg += wellPipeSvg(v, run, k, near, X, Y, win);
  svg += sectionAxis(win, X, Y, w, h, lenKm, avg);
  return svg + '</svg>';
}

/** Elevation ticks, A and B ends, length and the mean depth label. */
function sectionAxis(win, X, Y, w, h, lenKm, avg) {
  let out = '<g class="axis">';
  niceTicks(win.bot, win.top, 4).forEach(z => (out += `<text x="30" y="${Y(z) + 3}" text-anchor="end">${fmtN(z, 0)}</text>`));
  out += `<text x="30" y="${h - 4}" text-anchor="end">${t('u_masl')}</text></g>`;
  out += `<text class="tag ink" x="${X(0)}" y="${h - 5}">A</text><text class="tag ink" x="${X(1)}" y="${h - 5}" text-anchor="end">B</text>`;
  out += `<text class="tag ink" x="${X(0.5)}" y="${h - 5}" text-anchor="middle">${fmtN(lenKm, 1)} ${t('u_km')} · ${t('xsAvg', { d: fmtDepth(avg) })}</text>`;
  return out;
}

// ---------- home: the village twin (cross-section, plan view, time slider, KPIs) ----------
const TWIN = { k: NOW_K, layer: 'depth', playing: false, timer: 0 };

/** Default section: the row crossed by the most wells, west to east. */
function defaultSection(v) {
  let best = Math.floor(v.ny / 2);
  let bestN = -1;
  for (let y = 2; y < v.ny - 2; y++) {
    const n = v.wells.filter(w => Math.abs(Math.floor(w.cell / v.nx) - y) <= 1).length;
    if (n > bestN) {
      bestN = n;
      best = y;
    }
  }
  return [[0.5, best + 0.5], [v.nx - 0.5, best + 0.5]];
}
const sectionOf = v => v.section || defaultSection(v);

function pageHead(title, sub, actions = '', icon = '') {
  return `<div class="phead"><div><h2>${icon ? ic(icon) : ''}${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div>${actions ? `<div class="actions">${actions}</div>` : ''}</div>`;
}

/** Skeleton shown while the first model run is computed. */
function runSkeleton(title) {
  return `${pageHead(title, t('runBusyLong'))}<div class="twin"><div class="skeleton" style="height:320px"></div><div class="skeleton" style="height:320px"></div></div><div class="kpis mt">${'<div class="skeleton" style="height:92px"></div>'.repeat(4)}</div>`;
}

function renderHome() {
  const v = V();
  const run = cachedRun(v);
  if (!run) {
    $('#view').innerHTML = runSkeleton(t('nav_home'));
    ensureRun(v);
    return;
  }
  TWIN.k = clamp(TWIN.k, -1, TOTAL_MONTHS - 1);
  const sub = t('homeSub', { v: esc(vName(v)), d: t('dist_' + v.district), km: fmtN((v.nx * v.cell) / 1000, 1), km2: fmtN((v.ny * v.cell) / 1000, 1), n: fmtN(v.nx * v.ny) });
  const acts = `<button class="btn ghost" type="button" id="hmPrint">${ic('printer')} ${t('printReport')}</button><a class="btn soil" href="#meeting">${ic('users')} ${t('nav_meeting')}</a>`;
  $('#view').innerHTML = `${pageHead(t('nav_home'), sub, acts)}
    <div class="row" style="margin:-.4rem 0 .9rem">${v.fictional ? `<span class="chip illus">${ic('info')} ${t('fictionalVillage')}</span>` : ''}<span class="chip illus">${ic('sliders')} ${t('illustrativeParams')}</span></div>
    <div class="twin">
      <section class="card core"><div class="between"><h3>${ic('layers')} ${t('xsTitle')}</h3><button class="btn ghost sm" type="button" id="hmSection">${ic('edit')} ${t('xsChange')}</button></div>
        <p class="sub">${t('xsSub')}</p><div class="xsec" id="hmXsec"></div>
        <div class="legend mt"><span><i class="line" style="background:#143e63"></i>${t('lgWaterNow')}</span><span><i class="line" style="background:repeating-linear-gradient(90deg,#b9826a 0 4px,transparent 4px 7px)"></i>${t('lgWater2021')}</span><span><i style="background:#3d7533"></i>${t('st_ok')}</span><span><i style="background:#c48f1f"></i>${t('st_risk')}</span><span><i style="background:#b0332a"></i>${t('st_dry')}</span></div></section>
      <section class="card core"><div class="between"><h3>${ic('map')} ${t('planTitle')}</h3><div class="seg" id="hmLayer">${['depth', 'change'].map(l => `<button type="button" data-l="${l}" class="${TWIN.layer === l ? 'on' : ''}">${t('layer_' + l)}</button>`).join('')}</div></div>
        <p class="sub">${t('planSub')}</p>${planHtml('home', t('planTitle'))}<div class="mt" id="hmScale"></div></section>
    </div>
    <section class="card mt">${timebarHtml()}</section>
    <div class="kpis stagger mt" id="hmKpis"></div>
    <div class="cols three mt">${homeInsights(v, run)}</div>
    <h3 class="mt">${ic('grid')} ${t('modulesTitle')}</h3><div class="guide-grid stagger">${moduleCards()}</div>`;
  bindHome(v, run);
  updateTwin(v, run, true);
}

function timebarHtml() {
  const histPct = (HIST_MONTHS / (TOTAL_MONTHS + 1)) * 100;
  return `<div class="timebar"><button class="playbtn" type="button" id="hmPlay" aria-label="${t('play')}">${ic(TWIN.playing ? 'pause' : 'play')}</button>
    <div class="track"><div class="bands"><i style="width:${histPct}%;background:var(--leaf)"></i><i style="flex:1;background:var(--wheat)"></i></div>
      <input type="range" id="hmSlider" min="-1" max="${TOTAL_MONTHS - 1}" step="1" value="${TWIN.k}" aria-label="${t('timeSlider')}">
      <div class="ticks"><span style="left:0">${calYear(0)}</span><span class="lab" style="left:${histPct / 2}%">${t('history')}</span><span class="today" style="left:${histPct}%">${t('todayMark')}</span><span class="lab" style="left:${(histPct + 100) / 2}%">${t('projectionBau')}</span><span style="right:0">${calYear(TOTAL_MONTHS - 1)}</span></div></div>
    <div class="when" id="hmWhen" aria-live="polite"></div></div>`;
}

function bindHome(v, run) {
  $('#hmSlider').oninput = e => {
    stopPlay();
    TWIN.k = Number(e.target.value);
    updateTwin(v, run);
  };
  $('#hmPlay').onclick = () => (TWIN.playing ? stopPlay() : startPlay(v, run));
  $$('#hmLayer button').forEach(b => (b.onclick = () => {
    TWIN.layer = b.dataset.l;
    $$('#hmLayer button').forEach(x => x.classList.toggle('on', x === b));
    updateTwin(v, run);
  }));
  $('#hmSection').onclick = () => go('model');
  $('#hmPrint').onclick = () => printVillageReport(v, run);
}

function startPlay(v, run) {
  TWIN.playing = true;
  if (TWIN.k >= TOTAL_MONTHS - 1) TWIN.k = -1;
  $('#hmPlay').innerHTML = ic('pause');
  $('#hmPlay').setAttribute('aria-label', t('pause'));
  const step = () => {
    if (!TWIN.playing || curRoute !== 'home') return stopPlay();
    TWIN.k = Math.min(TOTAL_MONTHS - 1, TWIN.k + (calm() ? 12 : 1));
    $('#hmSlider').value = TWIN.k;
    updateTwin(v, run);
    if (TWIN.k >= TOTAL_MONTHS - 1) return stopPlay();
    TWIN.timer = setTimeout(step, calm() ? 600 : 110);
  };
  step();
}

function stopPlay() {
  TWIN.playing = false;
  clearTimeout(TWIN.timer);
  const b = $('#hmPlay');
  if (b) {
    b.innerHTML = ic('play');
    b.setAttribute('aria-label', t('play'));
  }
}

/** Depth or change-since-start values for the plan view, with a sensible colour range. */
function planLayer(v, run, k, layer) {
  const d = depthField(run, k);
  if (layer === 'change') {
    const d0 = depthField(run, -1);
    const vals = d.map((x, i) => x - d0[i]);
    const m = Math.max(1, ...[...vals].filter(Number.isFinite).map(Math.abs));
    return { vals, stops: SCALE_DIVERGE, lo: -Math.ceil(m), hi: Math.ceil(m), label: t('layer_change') };
  }
  const all = depthField(run, TOTAL_MONTHS - 1);
  const [lo] = fieldRange(depthField(run, -1));
  const [, hi] = fieldRange(all);
  return { vals: d, stops: SCALE_DEPTH, lo, hi, label: t('depthToWater') + ' (' + t('u_' + depthUnit()) + ')' };
}

/** Refresh the twin for TWIN.k without rebuilding the page. */
function updateTwin(v, run, first = false) {
  const k = TWIN.k;
  const box = $('#hmXsec');
  if (!box) return;
  box.innerHTML = crossSectionSvg({ v, run, k, line: sectionOf(v), w: Math.max(300, box.clientWidth), h: innerWidth < 760 ? 250 : 330, id: 'hx' });
  const L = planLayer(v, run, k, TWIN.layer);
  paintPlan('home', { v, vals: L.vals, stops: L.stops, lo: L.lo, hi: L.hi, marks: runMarks(v, run, k), section: sectionOf(v), fmt: x => fmtN(toUnit(x), 1) });
  $('#hmScale').innerHTML = scaleLegend(L.stops, L.lo, L.hi, L.label, x => fmtN(toUnit(x), 0));
  $('#hmWhen').innerHTML = `${k < 0 ? t('startOf', { m: simLabel(0) }) : simLabel(k)}<br><small class="muted" style="font-family:var(--font);font-size:.72rem">${k < HIST_MONTHS ? t('history') : t('projectionBau')}</small>`;
  const kp = twinKpis(v, run, k);
  $('#hmKpis').innerHTML = kpiTiles(kp, k);
  if (first) animateIn($('#hmKpis'));
  else settle($('#hmKpis'));
}

function kpiTiles(kp, k) {
  const tile = (icon, lbl, val, unit, note, cls = '', dec = 1) => `<div class="kpi ${cls}"><div class="lbl">${ic(icon)}${lbl}</div><div class="val"><span data-count="${val}" data-dec="${dec}">${fmtN(val, dec)}</span><small>${unit}</small></div><div class="note">${note}</div></div>`;
  const ch = kp.change12;
  const chNote = `<span class="delta ${ch > 0 ? 'up' : 'down'}">${ch > 0 ? '+' : ''}${fmtN(toUnit(ch), 2)} ${t('u_' + depthUnit())}</span> ${t('in12m')}`;
  return [
    tile('arrow-down', t('kpiDepth'), toUnit(kp.dtw), t('u_' + depthUnit()), chNote, ch > 0.3 ? 'warn' : ''),
    tile('alert', t('kpiRisk'), kp.risk, t('wellsUnit'), t('kpiRiskNote', { m: fmtDepth(S.settings.riskMargin, 0) }), kp.risk ? 'warn' : 'good', 0),
    tile('x-circle', t('kpiDry'), kp.dry, t('ofN', { n: kp.total }), t('kpiDryNote'), kp.dry ? 'bad' : 'good', 0),
    tile('droplet', t('kpiPump'), kp.pump / 1e6, t('u_mm3'), t('kpiPumpNote'), '', 2),
    tile('wheat', t('kpiIncome'), kp.income / 1e7, t('crore'), t('kpiIncomeNote', { c: fmtRs(kp.cost) }), '', 1),
    tile('check-circle', t('kpiClosure'), kp.err, '%', t('kpiClosureNote'), kp.err < 1 ? 'good' : 'bad', 4),
  ].join('');
}

/** Three insight cards: trend and rebound, wells at risk, recharge against pumping. */
function homeInsights(v, run) {
  const hist = run.steps.slice(0, HIST_MONTHS);
  const fit = linreg(hist.map(s => s.k), hist.map(s => s.dtw));
  const rebounds = [];
  for (let y = 0; y < 5; y++) {
    const pre = run.steps[y * 12 + 7];
    const post = run.steps[y * 12 + 10];
    if (pre && post) rebounds.push(pre.dtw - post.dtw);
  }
  const risky = irrWells(v).map(w => ({ w, st: wellStatus(v, run, w, NOW_K), dryK: firstDryMonth(run, w) })).sort((a, b) => a.st.margin - b.st.margin).slice(0, 5);
  const b = run.steps.slice(HIST_MONTHS - 12, HIST_MONTHS).reduce((a, s) => ({ rech: a.rech + s.bud.inn.rain + s.bud.inn.ret + s.bud.inn.wc + s.bud.inn.pond + s.bud.inn.canal, pump: a.pump + s.bud.out.pump }), { rech: 0, pump: 0 });
  const trend = `<section class="card lift"><h3>${ic('trending-down')} ${t('insTrend')}</h3><p class="big num" style="font-family:var(--font-head);font-size:1.6rem;margin:.2rem 0">${fit.b > 0 ? '+' : ''}${fmtN(toUnit(fit.b * 12), 2)} ${t('u_' + depthUnit())}/${t('u_yr')}</p>

/** Swatches for the active tool: land-use types, zones or fields. */
function drawSwatches(v) {
  const box = $('#suSwatches');
  let html = '';
  if (SETUP.tool === 'type') html = CELL_TYPES.map((c, i) => `<button type="button" class="swatch ${SETUP.paint === i ? 'on' : ''}" data-v="${i}"><i style="background:${CELL_COLORS[i]}"></i>${t('ct_' + c.id)}</button>`).join('');
  if (SETUP.tool === 'zone') html = v.zones.map((z, i) => `<button type="button" class="swatch ${SETUP.zone === i ? 'on' : ''}" data-v="${i}"><i style="background:${z.color}"></i>${esc(zoneName(z))}</button>`).join('');
  if (SETUP.tool === 'field') html = v.fields.map(f => `<button type="button" class="swatch ${SETUP.field === f.n ? 'on' : ''}" data-v="${f.n}"><i style="background:${CROPS[f.kharif]?.color || '#ccc'}"></i>${t('fieldN', { n: f.n })}</button>`).join('') + `<button type="button" class="swatch" id="suNewField">${ic('plus')} ${t('newField')}</button>`;
  box.innerHTML = html;
  $$('.swatch[data-v]', box).forEach(b => (b.onclick = () => {
    const val = Number(b.dataset.v);
    if (SETUP.tool === 'type') SETUP.paint = val;
    if (SETUP.tool === 'zone') SETUP.zone = val;
    if (SETUP.tool === 'field') SETUP.field = val;
    $$('.swatch', box).forEach(x => x.classList.toggle('on', x === b));
    paintEditor(v);
  }));
  if ($('#suNewField')) $('#suNewField').onclick = () => openFieldForm(v, null);
  $('#suHint').textContent = t('hint_' + SETUP.tool) + (SETUP.moving ? ' ' + t('hintMoving', { w: SETUP.moving }) : '');
}

/** Draw the editable grid: land use (or zones), field borders, wells and the selection. */
function paintEditor(v) {
  const cv = $('#suGrid canvas');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const cw = cv.width / v.nx;
  const chh = cv.height / v.ny;
  v.cells.forEach((c, i) => {
    const [x, y] = cellXY(v, i);
    ctx.fillStyle = SETUP.tool === 'zone' && c !== CT.off ? v.zones[v.zone[i]]?.color || '#999' : CELL_COLORS[c];
    if (SETUP.tool === 'field' && v.parcel[i] === SETUP.field) ctx.fillStyle = '#e2b44a';
    ctx.fillRect(x * cw, y * chh, cw + 0.5, chh + 0.5);
  });
  ctx.strokeStyle = 'rgba(42,29,20,.55)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  v.cells.forEach((c, i) => {
    const [x, y] = cellXY(v, i);
    if (x < v.nx - 1 && v.parcel[i] !== v.parcel[i + 1]) {
      ctx.moveTo((x + 1) * cw, y * chh);
      ctx.lineTo((x + 1) * cw, (y + 1) * chh);
    }
    if (y < v.ny - 1 && v.parcel[i] !== v.parcel[i + v.nx]) {
      ctx.moveTo(x * cw, (y + 1) * chh);
      ctx.lineTo((x + 1) * cw, (y + 1) * chh);
    }
  });
  ctx.stroke();
  v.wells.forEach(w => {
    const [x, y] = cellXY(v, w.cell);
    ctx.fillStyle = w.use === 'mon' ? '#ffffff' : w.type === 'solar' ? '#c48f1f' : w.type === 'diesel' ? '#5b3a29' : '#143e63';
    ctx.strokeStyle = w.id === SETUP.moving ? '#b0332a' : '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc((x + 0.5) * cw, (y + 0.5) * chh, cw * 0.36, 0, 7);
    ctx.fill();
    ctx.stroke();
  });
  if (SETUP.sel >= 0) {
    const [x, y] = cellXY(v, SETUP.sel);
    ctx.strokeStyle = '#b0332a';
    ctx.lineWidth = 3;
    ctx.strokeRect(x * cw + 1.5, y * chh + 1.5, cw - 3, chh - 3);
  }
}

// ---------- pointer painting with undo ----------
function snapshot(v) {
  SETUP.undo.push({ cells: [...v.cells], zone: [...v.zone], parcel: [...v.parcel], wells: JSON.stringify(v.wells) });
  if (SETUP.undo.length > 25) SETUP.undo.shift();
}

function undoEdit(v) {
  const s = SETUP.undo.pop();
  if (!s) return toast(t('nothingToUndo'));
  Object.assign(v, { cells: s.cells, zone: s.zone, parcel: s.parcel, wells: JSON.parse(s.wells) });
  commitVillage(v);
  paintEditor(v);
  toast(t('undone'), 'ok');
}

function bindGridPointer(v) {
  const box = $('#suGrid');
  const cellAt = e => {
    const p = cellFromEvent(e, box, v);
    return Math.floor(p.y) * v.nx + Math.floor(p.x);
  };
  box.onpointerdown = e => {
    const i = cellAt(e);
    if (['type', 'zone', 'field'].includes(SETUP.tool)) {
      snapshot(v);
      SETUP.drag = true;
      box.setPointerCapture(e.pointerId);
      paintAt(v, i);
    } else clickCell(v, i);
  };
  box.onpointermove = e => {
    if (!SETUP.drag) return;
    paintAt(v, cellAt(e));
  };
  box.onpointerup = () => {
    if (!SETUP.drag) return;
    SETUP.drag = false;
    commitVillage(v);
    renderSetupPanel(v);
  };
}

/** Apply the active brush around a cell. */
function paintAt(v, i) {
  const [cx, cy] = cellXY(v, i);
  const r = SETUP.brush - 1;
  for (let y = cy; y <= cy + r && y < v.ny; y++) {
    for (let x = cx; x <= cx + r && x < v.nx; x++) {
      const j = y * v.nx + x;
      if (SETUP.tool === 'type') {
        v.cells[j] = SETUP.paint;
        if (SETUP.paint !== CT.field) v.parcel[j] = 0;
      } else if (SETUP.tool === 'zone') v.zone[j] = SETUP.zone;
      else if (SETUP.tool === 'field' && SETUP.field) {
        v.cells[j] = CT.field;
        v.parcel[j] = SETUP.field;
      }
    }
  }
  SETUP.sel = i;
  paintEditor(v);
}

function clickCell(v, i) {
  SETUP.sel = i;
  const w = v.wells.find(x => x.cell === i);
  if (SETUP.tool === 'well') {
    if (SETUP.moving) {
      if (w) return toast(t('cellHasWell'), 'bad');
      snapshot(v);
      wellById(v, SETUP.moving).cell = i;
      toast(t('wellMoved', { w: SETUP.moving }), 'ok');
      SETUP.moving = null;
      commitVillage(v);
      drawSwatches(v);
    } else if (w) openWellForm(v, w);
    else if (v.cells[i] === CT.off) toast(t('cellOff'), 'bad');
    else openWellForm(v, null, i);
  } else if (SETUP.tool === 'inspect' && w) SETUP.tab = 'wells';
  paintEditor(v);
  renderInspector(v);
}

/** Save the village, invalidate its model run and log the edit (debounced while painting). */
function commitVillage(v) {
  persist('villages');
  markStale(v);
  logEditDebounced();
}
const logEditDebounced = debounce(() => logEvent('lg_edit', { v: vName(V()) }, 'setup'), 2000);

function renderInspector(v) {
  const box = $('#suInspect');

    return;
  }
  const [x, y] = cellXY(v, i);

  const w = v.wells.find(q => q.cell === i);
  const row = (k, val) => `<dt>${t(k)}</dt><dd>${val}</dd>`;
  box.innerHTML = `<div class="between"><b>${t('cellXY', { x: x + 1, y: y + 1 })}</b>${f ? `<button class="btn ghost sm" type="button" id="inField">${ic('edit')} ${t('fieldN', { n: f.n })}</button>` : ''}${w ? `<button class="btn ghost sm" type="button" id="inWell">${ic('edit')} ${esc(w.id)}</button>` : ''}</div>

function numField(id, label, value, { min = 0, max = 1e6, step = 'any', hint = '' } = {}) {
  return `<label class="field"><span>${label}</span><input id="${id}" type="number" inputmode="decimal" min="${min}" max="${max}" step="${step}" value="${value}">${hint ? `<small>${hint}</small>` : ''}</label>`;
}

/** Read and validate a number input; marks the field and returns null when out of range. */
function readNum(root, id, min, max) {
  const el = $('#' + id, root);
  const v = Number(el.value);
  const ok = el.value !== '' && Number.isFinite(v) && v >= min && v <= max;
  const f = el.closest('.field');
  f.classList.toggle('bad', !ok);
  $('.err', f)?.remove();
  if (!ok) f.insertAdjacentHTML('beforeend', `<span class="err">${t('err_number', { a: min, b: max })}</span>`);
  return ok ? v : null;
}

const selectField = (id, label, opts, val) => `<label class="field"><span>${label}</span><select id="${id}">${opts.map(([k, l]) => `<option value="${esc(k)}" ${String(k) === String(val) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`;

function saveVillagePanel(v, box) {
  const nums = {
    lat: readNum(box, 'pvLat', 23, 37), lng: readNum(box, 'pvLng', 60, 78), allow: readNum(box, 'pvAllow', 0, 10), conv: readNum(box, 'pvConv', 0.3, 1),

  const rain = v.params.rainYears.map((_, i) => readNum(box, 'pvRain' + i, 0, 3));

  const lim = { sy: [0.01, 0.4], t: [10, 20000], base: [5, 600], dtw0: [0.5, 150] };
  let bad = false;
  $$('[data-z]', box).forEach(el => {
    const z = v.zones[Number(el.dataset.z)];
    const k = el.dataset.k;
    if (k === 'color') z.color = el.value;
    else if (k === 'name') z.name[lang] = el.value.trim() || z.name.en;
    else {
      const n = Number(el.value);
      const ok = Number.isFinite(n) && n >= lim[k][0] && n <= lim[k][1];
      el.style.borderColor = ok ? '' : 'var(--danger)';
      if (ok) z[k] = n;
      else bad = true;
    }
  });
  if (v.zones.some(z => z.dtw0 >= z.base)) bad = true;
  if (bad) return toast(t('zoneLimits'), 'bad');
  commitVillage(v);
  toast(t('saved'), 'ok');
}

function saveWellForm(v, wl, isNew, sh) {
  const cusec = S.settings.qUnit === 'cusec';
  const q = readNum(sh, 'fwQ', 0, cusec ? 4 : 120);
  const pump = readNum(sh, 'fwPump', 0, toUnit(200));
  const depth = readNum(sh, 'fwDepth', 1, toUnit(400));
  const hp = readNum(sh, 'fwHp', 0, 100);
  const built = readNum(sh, 'fwBuilt', 1950, 2026);
  const id = $('#fwId', sh).value.trim().toUpperCase();
  const clash = v.wells.some(x => x !== wl && x.id === id);
  if ([q, pump, depth, hp, built].some(x => x == null) || !id || clash) return toast(clash ? t('wellIdTaken') : t('fixErrors'), 'bad');
  if (fromUnit(pump) >= fromUnit(depth)) return toast(t('pumpBelowBore'), 'bad');
  const oldId = wl.id;
  const use = $('#fwUse', sh).value;
  Object.assign(wl, { id, owner: $('#fwOwner', sh).value, use, type: use === 'mon' ? 'none' : $('#fwType', sh).value === 'none' ? 'electric' : $('#fwType', sh).value, q: use === 'mon' ? 0 : cusec ? q * CUSEC_LS : q, hp, pump: round(fromUnit(pump), 1), depth: round(fromUnit(depth), 1), built, monitored: $('#fwMon', sh).checked || use === 'mon' });
  if (!isNew && oldId !== id) renameWellRefs(v, oldId, id);
  if (isNew) v.wells.push(wl);
  commitVillage(v);
  logEvent(isNew ? 'lg_wellAdd' : 'lg_wellEdit', { w: id }, 'setup');
  closeModal();
  rerender();
  toast(t('saved'), 'ok');
}

function renameWellRefs(v, a, b) {
  v.fields.forEach(f => f.well === a && (f.well = b));
  readingsOf(v.id).forEach(r => r.w === a && (r.w = b));
  persist('readings');
}

async function deleteWell(v, w) {
  const n = readingsOf(v.id).filter(r => r.w === w.id).length;
  if (!(await askConfirm(t('confirmDelWell', { w: w.id, n }), { danger: true, okText: t('delete') }))) return;
  v.wells = v.wells.filter(x => x !== w);
  v.fields.forEach(f => f.well === w.id && (f.well = null));
  S.readings[v.id] = readingsOf(v.id).filter(r => r.w !== w.id);
  persist('readings');
  commitVillage(v);
  logEvent('lg_wellDel', { w: w.id }, 'setup');
  rerender();
  toast(t('deleted'), 'ok');
}

// ---------- villages: new, duplicate, import ----------
function addVillage(v, readings = []) {
  S.villages.push(v);
  S.readings[v.id] = readings;
  S.cur = v.id;
  persist('villages', 'readings', 'cur');
  applyPrefs();
}

function newVillage() {
  const v = blankVillage();
  addVillage(v);
  logEvent('lg_vNew', { v: vName(v) }, 'setup');
  SETUP.tab = 'village';
  go('setup');
  rerender();
  toast(t('vCreated'), 'ok');
}

function duplicateVillage() {
  const src = V();
  const v = JSON.parse(JSON.stringify(src));
  v.id = uid('v');
  v.demo = false;
  v.name = { en: src.name.en + ' ' + t('copySuffix'), ur: src.name.ur + ' ' + t('copySuffix') };
  addVillage(v, JSON.parse(JSON.stringify(readingsOf(src.id))));
  rerender();
  toast(t('vDuplicated'), 'ok');
}

function importVillage(text) {
  try {
    const data = JSON.parse(text);
    const v = data.village;
    const n = v.nx * v.ny;
    const ok = v && [v.cells, v.ground, v.zone, v.parcel].every(a => Array.isArray(a) && a.length === n) && Array.isArray(v.wells) && Array.isArray(v.zones) && v.zones.length;
    if (!ok) throw new Error('shape');
    if (S.villages.some(x => x.id === v.id)) v.id = uid('v');
    v.demo = false;
    addVillage(v, Array.isArray(data.readings) ? data.readings : []);
    logEvent('lg_vImport', { v: vName(v) }, 'setup');
    rerender();
    toast(t('vImported'), 'ok');
  } catch {
    toast(t('importFailed'), 'bad');
  }
}
