<!doctype html>
<html lang="en" data-theme="night" data-size="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>PromptCraft — Prompt Engineering Game</title>
<meta name="description" content="Learn prompt engineering by playing: 6 worlds x 5 levels judged by an explainable offline judge, a playground with A/B tests and cost estimates, a prompt library, a live linter, lessons and a daily challenge. Optional bring-your-own-key Live AI. FYP template.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens: arcade notebook at night ---------- */
:root {
  --bg: #0d0a2b;
  --bg-2: #120e38;
  --panel: #19144d;
  --panel-2: #221b62;
  --field: #110d3a;
  --line: #2e2775;
  --line-2: #40379a;
  --ink: #f4f1ff;
  --muted: #aba4e2;
  --dim: #7d75bd;
  --lime: #c8ff3e;
  --lime-ink: #142000;
  --lime-deep: #7fae00;
  --pink: #ff4fa8;
  --pink-soft: rgba(255, 79, 168, .14);
  --cyan: #3ee6ff;
  --cyan-soft: rgba(62, 230, 255, .12);
  --gold: #ffd23f;
  --orange: #ff8a3d;
  --violet: #a98bff;
  --ok: #c8ff3e;
  --bad: #ff5d7a;
  --warn: #ffd23f;
  --lime-soft: rgba(200, 255, 62, .12);
  --surface: var(--panel);
  --surface-2: var(--panel-2);
  --radius: 18px;
  --shadow: 5px 5px 0 rgba(0, 0, 0, .38);
  --font: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Menlo, monospace;
  --dots: rgba(255, 255, 255, .06);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --dur: .35s;
}
:root[data-theme="day"] {
  --bg: #fbf7ea;
  --bg-2: #f3eedb;
  --panel: #ffffff;
  --panel-2: #f2eefc;
  --field: #fffdf6;
  --line: #d9d2f0;
  --line-2: #b9aee6;
  --ink: #1b1650;
  --muted: #554e8f;
  --dim: #7a73ad;
  --lime: #5f9600;
  --lime-ink: #ffffff;
  --lime-deep: #3f6600;
  --pink: #d61f7f;
  --pink-soft: rgba(214, 31, 127, .1);
  --cyan: #0a8fb0;
  --cyan-soft: rgba(10, 143, 176, .1);
  --gold: #b07d00;
  --ok: #4a8a00;
  --bad: #d22b4b;
  --warn: #a86f00;
  --lime-soft: rgba(95, 150, 0, .1);
  --shadow: 5px 5px 0 rgba(27, 22, 80, .12);
  --dots: rgba(27, 22, 80, .07);
}
:root[data-size="s"] { font-size: 14px; }
:root[data-size="m"] { font-size: 15px; }
:root[data-size="l"] { font-size: 17px; }

/* ---------- Motion kit ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
:root[data-motion="off"] *, :root[data-motion="off"] *::before, :root[data-motion="off"] *::after {
  animation-duration: .01ms !important;
  transition-duration: .01ms !important;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
@keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }
@keyframes toastIn { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(6px); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes caret { 50% { opacity: 0; } }
@keyframes starIn { from { opacity: 0; transform: scale(.4) rotate(-30deg); } to { opacity: 1; transform: none; } }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
.enter { animation: fadeUp var(--dur) var(--ease) both; }
.stagger > * { animation: fadeUp .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
.btn { transition: transform .15s var(--ease), box-shadow .15s var(--ease), background .15s, border-color .15s; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(1px) scale(.98); }
.card, .tile { transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s; }
.card.lift:hover, .tile:hover { transform: translateY(-2px); border-color: var(--line-2); }
.fill, .bar > i { transition: width .6s var(--ease); }
.skeleton { background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  background-color: var(--bg);
  background-image:
    radial-gradient(900px 480px at 90% -10%, rgba(255, 79, 168, .16), transparent 60%),
    radial-gradient(800px 420px at -10% 110%, rgba(62, 230, 255, .12), transparent 60%),
    radial-gradient(var(--dots) 1.2px, transparent 1.6px);
  background-size: auto, auto, 22px 22px;
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--cyan); }
h1, h2, h3, h4 { margin: 0; line-height: 1.15; letter-spacing: -.015em; }
h1 { font-size: 1.9rem; font-weight: 800; }
h2 { font-size: 1.4rem; font-weight: 800; }
h3 { font-size: 1.08rem; font-weight: 700; }
p { margin: 0 0 8px; }
code, kbd { font-family: var(--mono); font-size: .9em; }
kbd { border: 1px solid var(--line-2); border-bottom-width: 3px; border-radius: 6px; padding: 1px 6px; background: var(--panel-2); }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.small { font-size: .84rem; }
.tiny { font-size: .74rem; }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
.ic { width: 1.1em; height: 1.1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; flex: none; }
.ic.star-on { fill: var(--gold); stroke: var(--gold); }
.ic.star-off { stroke: var(--dim); }
.ok { color: var(--ok); }
.bad { color: var(--bad); }
.warnc { color: var(--warn); }
.pinkc { color: var(--pink); }
.cyanc { color: var(--cyan); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.tight { gap: 6px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.stack { display: grid; gap: 14px; align-content: start; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.mt { margin-top: 14px; }
.mb { margin-bottom: 14px; }

/* ---------- Buttons, inputs, chips ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 42px;
  padding: 9px 16px;
  border: 2px solid var(--line-2);
  border-radius: 12px;
  background: var(--panel-2);
  color: var(--ink);
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  box-shadow: 0 3px 0 rgba(0, 0, 0, .35);
}
.btn.primary { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); box-shadow: 0 4px 0 var(--lime-deep); }
.btn kbd { background: rgba(0, 0, 0, .14); border-color: rgba(0, 0, 0, .28); color: inherit; font-size: .72rem; }
.btn.pink { background: var(--pink); border-color: var(--pink); color: #fff; box-shadow: 0 4px 0 #a3125f; }
.btn.cyan { background: var(--cyan); border-color: var(--cyan); color: #04202a; box-shadow: 0 4px 0 #0a8fb0; }
.btn.ghost { background: transparent; box-shadow: none; }
.btn.danger { border-color: var(--bad); color: var(--bad); background: transparent; box-shadow: none; }
.btn.sm { min-height: 34px; padding: 5px 11px; font-size: .86rem; border-radius: 10px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.iconbtn {
  display: inline-grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border-radius: 12px;
  border: 2px solid transparent;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  position: relative;
}
.iconbtn:hover { background: var(--panel-2); border-color: var(--line); }
.badge-dot { position: absolute; top: 4px; right: 4px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--pink); color: #fff; font-size: .68rem; font-weight: 800; display: grid; place-items: center; padding: 0 4px; }
label.field { display: grid; gap: 6px; font-weight: 600; font-size: .9rem; }
.input, select.input, textarea.input {
  width: 100%;
  min-height: 42px;
  padding: 9px 12px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: var(--field);
  color: var(--ink);
}
textarea.input { font-family: var(--mono); font-size: .9rem; line-height: 1.55; resize: vertical; }
.input:focus { border-color: var(--cyan); outline: none; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1.5px solid var(--line-2);
  font-size: .8rem;
  font-weight: 700;
  white-space: nowrap;
  background: var(--panel);
}
.chip.lime { border-color: var(--lime); color: var(--lime); }
.chip.pink { border-color: var(--pink); color: var(--pink); }
.chip.cyan { border-color: var(--cyan); color: var(--cyan); }
.chip.gold { border-color: var(--gold); color: var(--gold); }
button.chip { cursor: pointer; min-height: 34px; }
button.chip.on { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 8px 14px; min-height: 40px; cursor: pointer; font-weight: 700; color: var(--muted); }
.seg button.on { background: var(--panel-2); color: var(--lime); }
.switch { position: relative; width: 48px; height: 28px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; position: absolute; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .2s; }
.switch span::after { content: ""; position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); transition: transform .2s var(--ease); }
.switch input:checked + span { background: var(--lime); }
.switch input:checked + span::after { transform: translateX(20px); background: var(--lime-ink); }
.switch input:focus-visible + span { outline: 3px solid var(--cyan); outline-offset: 2px; }
.bar { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--lime), var(--cyan)); }

/* ---------- App shell ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 22px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); flex: none; }
.brand b { font-size: 1.25rem; font-weight: 800; letter-spacing: -.03em; }
.brand b span { color: var(--lime); }
.mainnav { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.mainnav a {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  color: var(--muted);
  text-decoration: none;
  font-weight: 700;
  white-space: nowrap;
  border: 2px solid transparent;
}
.mainnav a:hover { color: var(--ink); background: var(--panel); }
.mainnav a.on { color: var(--lime-ink); background: var(--lime); }
.mainnav a span { display: none; }
.mainnav a.on span { display: inline; }
.hud { display: flex; align-items: center; gap: 8px; flex: none; }
.hud-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 12px; background: var(--panel); border: 2px solid var(--line); font-weight: 800; font-size: .88rem; white-space: nowrap; }
.hud-chip .ic { color: var(--gold); }
.hud-chip.xp .ic { color: var(--cyan); }
.hud-chip.streak .ic { color: var(--orange); }
.hud-xp { width: 64px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.hud-xp i { display: block; height: 100%; background: var(--cyan); transition: width .6s var(--ease); }
main#view { max-width: 1280px; margin: 0 auto; padding: 22px 22px 60px; min-height: 70vh; }
.bottomnav { display: none; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head p { margin: 4px 0 0; color: var(--muted); }
.eyebrow { font-family: var(--mono); font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--pink); font-weight: 700; }
.card { background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.card h3 { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.tag-note { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--dim); }
.empty { text-align: center; padding: 30px 16px; color: var(--muted); }
.empty .ic { width: 40px; height: 40px; color: var(--dim); margin-bottom: 6px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 14px; }
.kpi b { display: block; font-size: 1.7rem; font-weight: 800; letter-spacing: -.03em; }
.kpi span { color: var(--muted); font-size: .82rem; display: flex; align-items: center; gap: 6px; }
.list { display: grid; gap: 8px; }
.li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: var(--panel-2); border: 1.5px solid var(--line); min-width: 0; }
.li .grow > * { overflow-wrap: anywhere; }
.pill-num { display: inline-grid; place-items: center; min-width: 28px; height: 28px; border-radius: 9px; background: var(--panel-2); font-weight: 800; font-family: var(--mono); font-size: .82rem; }
.callout { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; border: 2px dashed var(--line-2); background: var(--cyan-soft); font-size: .88rem; }
.callout.warn { background: rgba(255, 210, 63, .1); border-color: var(--gold); }
.callout.pink { background: var(--pink-soft); border-color: var(--pink); }
.callout .ic { margin-top: 2px; }

/* ---------- Mascot ---------- */
.mascot { flex: none; display: block; }
.mascot .bob { animation: bob 2.8s ease-in-out infinite; transform-origin: center; }
.mascot .eye { animation: blink 4.5s infinite; transform-box: fill-box; transform-origin: center; }
.speech { position: relative; background: var(--panel-2); border: 2px solid var(--line-2); border-radius: 16px; padding: 12px 14px; font-size: .95rem; }
.speech::before { content: ""; position: absolute; left: -9px; top: 22px; width: 14px; height: 14px; background: var(--panel-2); border-left: 2px solid var(--line-2); border-bottom: 2px solid var(--line-2); transform: rotate(45deg); }
.promptly-row { display: flex; gap: 14px; align-items: flex-start; }

/* ---------- World map ---------- */
.map-hero { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
.map-wrap { position: relative; width: 100%; }
.map-wrap svg.path { position: absolute; inset: 0; width: 100%; height: 100%; }
.map-trail { fill: none; stroke: var(--line-2); stroke-width: 6; stroke-dasharray: 2 14; stroke-linecap: round; }
.map-trail.done { stroke: var(--lime); stroke-dasharray: none; opacity: .55; }
.island {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 170px;
  display: grid;
  justify-items: center;
  gap: 6px;
  padding: 12px 10px 10px;
  border-radius: 22px;
  border: 2px solid var(--line-2);
  background: var(--panel);
  color: var(--ink);
  text-decoration: none;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform .2s var(--ease), border-color .2s;
}
.island:hover { transform: translate(-50%, -52%); border-color: var(--wc, var(--lime)); }
.island .orb { width: 54px; height: 54px; border-radius: 18px; display: grid; place-items: center; background: var(--wc, var(--lime)); color: #120e38; }
.island .orb .ic { width: 28px; height: 28px; }
.island b { font-size: .98rem; text-align: center; line-height: 1.15; }
.island .stars-line { display: flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: .78rem; color: var(--muted); }
.island.locked { opacity: .55; }
.island.locked .orb { background: var(--line); color: var(--muted); }
.island .lock-tag { position: absolute; top: -10px; right: -8px; background: var(--panel-2); border: 2px solid var(--line-2); border-radius: 10px; padding: 3px 6px; }
.level-path { position: relative; }
.lvl-node {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 84px;
  height: 84px;
  border-radius: 50%;
  border: 3px solid var(--wc, var(--lime));
  background: var(--panel);
  color: var(--ink);
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 1.5rem;
  cursor: pointer;
  box-shadow: 0 6px 0 rgba(0, 0, 0, .4);
  text-decoration: none;
  transition: transform .2s var(--ease);
}
.lvl-node:hover { transform: translate(-50%, -54%); }
.lvl-node.boss { width: 100px; height: 100px; border-style: double; border-width: 6px; }
.lvl-node.locked { border-color: var(--line); color: var(--dim); cursor: not-allowed; }
.lvl-node.current { box-shadow: 0 0 0 6px color-mix(in srgb, var(--wc, var(--lime)) 30%, transparent), 0 6px 0 rgba(0, 0, 0, .4); }
.lvl-node .nstars { position: absolute; bottom: -14px; display: flex; gap: 1px; background: var(--bg-2); border-radius: 10px; padding: 2px 5px; border: 1.5px solid var(--line); }
.lvl-node .nstars .ic { width: 13px; height: 13px; }
.lvl-label { position: absolute; transform: translate(-50%, 0); font-size: .8rem; font-weight: 700; text-align: center; width: 140px; color: var(--muted); pointer-events: none; }

/* ---------- Level play: split editor / result ---------- */
.play { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.play-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.play-head h1 { font-size: 1.6rem; }
.brief { display: grid; gap: 12px; }
.goal { font-weight: 700; }
.check-hints { display: flex; flex-wrap: wrap; gap: 6px; }
.ed { position: relative; border: 2px solid var(--line); border-radius: 14px; background: var(--field); }
.ed:focus-within { border-color: var(--cyan); }
.ed-back, .ed-ta {
  margin: 0;
  padding: 14px 16px;
  font-family: var(--mono);
  font-size: .9rem;
  line-height: 1.65;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  word-break: normal;
  letter-spacing: 0;
  tab-size: 2;
}
.ed-back { position: absolute; inset: 0; color: transparent; overflow: hidden; pointer-events: none; border: 0; }
.ed-ta { position: relative; display: block; width: 100%; min-height: 150px; border: 0; background: transparent; color: var(--ink); caret-color: var(--lime); resize: none; overflow: hidden; outline: none; }
.ed-ta::placeholder { color: var(--dim); }
.sq { color: transparent; background: none; text-decoration: underline wavy; text-decoration-skip-ink: none; text-underline-offset: 4px; text-decoration-thickness: 1.5px; border-radius: 3px; }
.sq.error { text-decoration-color: var(--bad); background: rgba(255, 93, 122, .14); }
.sq.warn { text-decoration-color: var(--gold); background: rgba(255, 210, 63, .1); }
.sq.info { text-decoration-color: var(--cyan); }
.ed-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 12px; border-top: 2px dashed var(--line); font-size: .8rem; color: var(--muted); font-family: var(--mono); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.out-card { position: relative; }
.terminal { font-family: var(--mono); font-size: .86rem; line-height: 1.6; background: #07051c; color: #e8e4ff; border-radius: 14px; border: 2px solid var(--line); padding: 14px 16px; white-space: pre-wrap; overflow-wrap: anywhere; min-height: 140px; max-height: 420px; overflow-y: auto; }
:root[data-theme="day"] .terminal { background: #1b1650; color: #f4f1ff; }
.terminal .cursor { display: inline-block; width: 8px; height: 1em; background: var(--lime); vertical-align: -2px; animation: caret 1s steps(1) infinite; }
.term-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: .8rem; color: var(--muted); flex-wrap: wrap; }
.term-head .dots { display: inline-flex; gap: 5px; }
.term-head .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--pink); }
.term-head .dots i:nth-child(2) { background: var(--gold); }
.term-head .dots i:nth-child(3) { background: var(--lime); }
.score-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.ring { position: relative; width: 116px; height: 116px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 11; }
.ring .track { stroke: var(--line); }
.ring .val { stroke: var(--lime); stroke-linecap: round; transition: stroke-dashoffset .9s var(--ease); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.9rem; font-weight: 800; }
.stars { display: inline-flex; gap: 4px; }
.stars .ic { width: 30px; height: 30px; }
.stars.sm .ic { width: 15px; height: 15px; }
.stars .ic.star-on { animation: starIn .45s var(--ease) both; }
.stars .ic:nth-child(2) { animation-delay: .12s; }
.stars .ic:nth-child(3) { animation-delay: .24s; }
.checks { display: grid; gap: 7px; margin-top: 12px; }
.check { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 9px 11px; border-radius: 12px; background: var(--panel-2); border: 1.5px solid var(--line); }
.check .ci { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; }
.check.pass .ci { background: var(--lime-soft); color: var(--ok); }
.check.part .ci { background: rgba(255, 210, 63, .14); color: var(--warn); }
.check.fail .ci { background: rgba(255, 93, 122, .14); color: var(--bad); }
.check b { display: block; font-size: .9rem; }
.check span { font-size: .8rem; color: var(--muted); overflow-wrap: anywhere; }
.check em { font-style: normal; font-family: var(--mono); font-size: .78rem; color: var(--muted); white-space: nowrap; }
.spark { width: 100%; height: 54px; }
.spark path.line { fill: none; stroke: var(--cyan); stroke-width: 2.5; }
.spark circle { fill: var(--lime); }
.reward { display: flex; gap: 8px; flex-wrap: wrap; }
.tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.tabs button { border: 2px solid var(--line); background: transparent; border-radius: 12px; padding: 7px 13px; min-height: 40px; cursor: pointer; font-weight: 700; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.tabs button.on { border-color: var(--lime); color: var(--lime); background: var(--lime-soft); }

/* ---------- Playground ---------- */
.pg { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 18px; align-items: start; }
.ab { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.ab-col h3 .chip { margin-left: auto; }
.var-row { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px; align-items: center; }
.var-row code { color: var(--cyan); overflow-wrap: anywhere; }
.est { width: 100%; border-collapse: collapse; font-size: .84rem; }
.est th, .est td { text-align: left; padding: 7px 6px; border-bottom: 1.5px solid var(--line); }
.est td.num, .est th.num { text-align: right; font-family: var(--mono); }
.est tr.sel td { color: var(--lime); }
.table-wrap { overflow-x: auto; max-width: 100%; }
.hist-item { cursor: pointer; text-align: left; width: 100%; color: var(--ink); }
.hist-item:hover { border-color: var(--line-2); }
.preview { font-family: var(--mono); font-size: .82rem; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--field); border: 2px dashed var(--line); border-radius: 12px; padding: 10px 12px; max-height: 180px; overflow-y: auto; }
.preview mark { background: var(--cyan-soft); color: var(--cyan); border-radius: 4px; padding: 0 2px; }

/* ---------- Library ---------- */
.lib-filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.tpl { display: grid; gap: 10px; align-content: start; }
.tpl .snippet { font-family: var(--mono); font-size: .78rem; color: var(--muted); background: var(--field); border-radius: 10px; padding: 9px 10px; max-height: 92px; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; border: 1.5px solid var(--line); }
.tpl .row.foot { margin-top: auto; }
.fav-on { color: var(--pink); }
.fav-on .ic { fill: var(--pink); }
.share-img { width: 100%; border-radius: 14px; border: 2px solid var(--line); display: block; }

/* ---------- Linter ---------- */
.lint { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
.issue { display: grid; gap: 6px; padding: 11px 12px; border-radius: 12px; background: var(--panel-2); border: 1.5px solid var(--line); border-left-width: 5px; }
.issue.error { border-left-color: var(--bad); }
.issue.warn { border-left-color: var(--gold); }
.issue.info { border-left-color: var(--cyan); }
.issue b { font-size: .88rem; display: flex; gap: 6px; align-items: center; }
.issue p { margin: 0; font-size: .82rem; color: var(--muted); }
.lint-score { font-size: 2.4rem; font-weight: 800; letter-spacing: -.04em; }

/* ---------- Leaderboard & achievements ---------- */
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: end; margin-bottom: 16px; }
.pod { text-align: center; padding: 14px 10px; border-radius: 18px; border: 2px solid var(--line); background: var(--panel); }
.pod .av { margin: 0 auto 6px; }
.pod.p1 { border-color: var(--gold); padding-top: 26px; }
.pod.p2 { border-color: var(--cyan); }
.pod.p3 { border-color: var(--orange); }
.pod b { display: block; overflow-wrap: anywhere; }
.av { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; font-weight: 800; color: #120e38; flex: none; }
.lb { width: 100%; border-collapse: collapse; }
.lb th, .lb td { padding: 10px 8px; border-bottom: 1.5px solid var(--line); text-align: left; font-size: .9rem; }
.lb td.num, .lb th.num { text-align: right; font-family: var(--mono); }
.lb tr.me td { background: var(--lime-soft); }
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.ach { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 16px; background: var(--panel); border: 2px solid var(--line); }
.ach .medal { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; flex: none; background: var(--line); color: var(--dim); }
.ach.got .medal { background: var(--gold); color: #2a1d00; }
.ach.got { border-color: var(--gold); }
.ach b { display: block; font-size: .92rem; }
.ach span { font-size: .78rem; color: var(--muted); }

/* ---------- Daily ---------- */
.day-strip { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 6px; }
.day-cell { height: 44px; border-radius: 10px; border: 2px solid var(--line); display: grid; place-items: center; font-family: var(--mono); font-size: .7rem; color: var(--muted); }
.day-cell.done { background: var(--lime); color: var(--lime-ink); border-color: var(--lime); }
.day-cell.today { border-color: var(--pink); color: var(--pink); }
.countdown { font-family: var(--mono); font-size: 1.6rem; font-weight: 700; color: var(--cyan); }

/* ---------- Learn ---------- */
.learn { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 18px; align-items: start; }
.lesson-link { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; text-decoration: none; color: var(--ink); border: 2px solid transparent; }
.lesson-link:hover { background: var(--panel-2); }
.lesson-link.on { border-color: var(--lime); background: var(--lime-soft); }
.lesson-link .pill-num.done { background: var(--lime); color: var(--lime-ink); }
.ba { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.ba > div { border-radius: 14px; border: 2px solid var(--line); padding: 12px; background: var(--field); }
.ba .before { border-color: var(--bad); }
.ba .after { border-color: var(--lime); }
.ba pre { margin: 6px 0 0; font-family: var(--mono); font-size: .82rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.quiz-opt { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 10px 12px; min-height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel-2); cursor: pointer; color: var(--ink); }
.quiz-opt:hover { border-color: var(--line-2); }
.quiz-opt.right { border-color: var(--lime); background: var(--lime-soft); }
.quiz-opt.wrong { border-color: var(--bad); background: rgba(255, 93, 122, .12); }
.lesson-body p { font-size: 1rem; line-height: 1.6; }

/* ---------- Inbox, settings, report, about ---------- */
.note { display: flex; gap: 12px; padding: 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel); align-items: flex-start; }
.note.unread { border-color: var(--cyan); }
.note .nic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--panel-2); flex: none; color: var(--cyan); }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1.5px dashed var(--line); flex-wrap: wrap; }
.set-row:last-child { border-bottom: 0; }
.set-row > div:first-child { min-width: 0; flex: 1 1 220px; }
.set-row b { display: block; }
.set-row span.small { color: var(--muted); }
.key-row { display: flex; gap: 8px; width: 100%; }
.model-opt { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); cursor: pointer; }
.model-opt:has(input:checked) { border-color: var(--lime); background: var(--lime-soft); }
.model-opt input { accent-color: var(--lime); width: 18px; height: 18px; }
.report-sheet { background: #fff; color: #1b1650; border-radius: 16px; padding: 28px; border: 2px solid var(--line); }
.report-sheet h2, .report-sheet h3 { color: #1b1650; }
.report-sheet table { width: 100%; border-collapse: collapse; margin: 10px 0 18px; font-size: .88rem; }
.report-sheet th, .report-sheet td { border-bottom: 1px solid #d9d2f0; padding: 7px 6px; text-align: left; vertical-align: top; }
.report-sheet .muted { color: #554e8f; }
.report-sheet pre { white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--mono); font-size: .78rem; background: #f6f3ff; padding: 8px; border-radius: 8px; margin: 4px 0 0; }
.todo { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: start; gap: 10px; padding: 10px 0; border-bottom: 1.5px dashed var(--line); }
.todo:last-child { border-bottom: 0; }
.todo code { color: var(--cyan); }

/* ---------- Modal, toast, tour, palette ---------- */
.scrim { position: fixed; inset: 0; background: rgba(5, 3, 20, .62); z-index: 80; opacity: 0; pointer-events: none; transition: opacity .25s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.modal { position: fixed; inset: 0; z-index: 90; display: none; place-items: center; padding: 16px; pointer-events: none; }
.modal.open { display: grid; }
.modal .box { pointer-events: auto; width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; background: var(--panel); border: 2px solid var(--line-2); border-radius: 22px; padding: 20px; box-shadow: 8px 8px 0 rgba(0, 0, 0, .45); animation: pop .25s var(--ease) both; }
.modal .box.wide { width: min(860px, 100%); }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.modal-head h2 { display: flex; align-items: center; gap: 8px; font-size: 1.25rem; }
#toasts { position: fixed; right: 18px; bottom: 18px; z-index: 120; display: grid; gap: 8px; max-width: min(380px, calc(100vw - 36px)); }
.toast { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--panel-2); border: 2px solid var(--line-2); box-shadow: var(--shadow); animation: toastIn .3s var(--ease) both; font-weight: 600; font-size: .9rem; }
.toast.ok { border-color: var(--lime); }
.toast.ok .ic { color: var(--lime); }
.toast.bad { border-color: var(--bad); }
.toast.bad .ic { color: var(--bad); }
.toast.gold { border-color: var(--gold); }
.toast.gold .ic { color: var(--gold); }
.toast.out { animation: toastOut .3s var(--ease) forwards; }
.tour-spot { position: fixed; z-index: 100; border-radius: 16px; box-shadow: 0 0 0 9999px rgba(5, 3, 20, .7); border: 3px solid var(--lime); pointer-events: none; transition: all .3s var(--ease); }
.tour-card { position: fixed; z-index: 101; width: min(340px, calc(100vw - 24px)); background: var(--panel); border: 2px solid var(--lime); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); animation: pop .25s var(--ease) both; }
.tour-card .steps { font-family: var(--mono); font-size: .74rem; color: var(--pink); margin-bottom: 6px; }
.tour-card h3 { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.tour-card .foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.pal-list { display: grid; gap: 4px; max-height: 50vh; overflow-y: auto; margin-top: 10px; }
.pal-item { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; cursor: pointer; border: 2px solid transparent; background: transparent; width: 100%; text-align: left; color: var(--ink); }
.pal-item.on, .pal-item:hover { background: var(--panel-2); border-color: var(--line-2); }
.pal-item small { margin-left: auto; color: var(--dim); font-family: var(--mono); }
.kbd-grid { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 14px; align-items: center; }
.more-sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 95; background: var(--panel); border-top: 2px solid var(--line-2); border-radius: 22px 22px 0 0; padding: 16px 16px 24px; display: none; animation: sheetUp .3s var(--ease) both; }
.more-sheet.open { display: block; }
.more-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.more-grid a { display: grid; justify-items: center; gap: 6px; padding: 12px 6px; border-radius: 14px; background: var(--panel-2); color: var(--ink); text-decoration: none; font-weight: 700; font-size: .84rem; text-align: center; }
.more-grid a .ic { width: 22px; height: 22px; color: var(--lime); }

/* ---------- Responsive ---------- */
@media (min-width: 1560px) {
  .mainnav a span { display: inline; }
}
@media (max-width: 1020px) {
  .play, .pg, .lint, .learn, .map-hero { grid-template-columns: minmax(0, 1fr); }
  .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  .topbar { padding: 8px 12px; gap: 8px; }
  .mainnav, .hud .hide-m { display: none; }
  .hud { margin-left: auto; gap: 4px; }
  .hud-chip { padding: 5px 8px; font-size: .8rem; }
  .brand b { font-size: 1.08rem; }
  main#view { padding: 16px 16px 100px; }
  .bottomnav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 60;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    background: var(--panel);
    border-top: 2px solid var(--line);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  .bottomnav a, .bottomnav button { display: grid; justify-items: center; gap: 2px; padding: 6px 2px; min-height: 48px; border-radius: 12px; color: var(--muted); text-decoration: none; font-size: .7rem; font-weight: 700; background: none; border: 0; cursor: pointer; }
  .bottomnav a.on { color: var(--lime); background: var(--lime-soft); }
  .bottomnav .ic { width: 22px; height: 22px; }
  .grid2, .grid3, .ab, .ba { grid-template-columns: minmax(0, 1fr); }
  .play-head .grow { order: 3; flex-basis: 100%; }
  .play-head > .row { margin-left: auto; }
  .hide-m { display: none !important; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  h1, .play-head h1 { font-size: 1.4rem; }
  .card { padding: 14px; }
  .podium { gap: 6px; }
  .pod { padding: 10px 4px; font-size: .84rem; }
  .day-strip { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .var-row { grid-template-columns: minmax(0, 1fr); }
  .report-sheet { padding: 16px; }
  #toasts { right: 12px; bottom: 84px; left: 12px; max-width: none; }
  .island { width: 132px; padding: 10px 6px 8px; }
  .island .orb { width: 44px; height: 44px; border-radius: 14px; }
  .island b { font-size: .86rem; }
  .lvl-node { width: 70px; height: 70px; font-size: 1.25rem; }
  .lvl-node.boss { width: 84px; height: 84px; }
  .ring { width: 96px; height: 96px; }
  .lb th:nth-child(5), .lb td:nth-child(5) { display: none; }
}

/* ---------- Print ---------- */
@media print {
  body { background: #fff; color: #000; }
  .topbar, .bottomnav, .no-print, #toasts, .scrim, .modal, .more-sheet, #tour { display: none !important; }
  main#view { padding: 0; max-width: none; }
  .report-sheet { border: 0; padding: 0; }
  .report-sheet table { page-break-inside: auto; }
  .report-sheet tr { page-break-inside: avoid; }
  .page-break { page-break-before: always; }
}

<script>
'use strict';
/* =====================================================================
   PromptCraft — prompt engineering game (single file, FYP template #21)
   Sections: utils · storage & settings · profiles & economy · prompt analyzer ·
             linter · campaign content · judge · simulated model · library ·
             lessons · achievements · daily challenge · Live AI adapter ·
             mascot · world map · level play · playground · library page ·
             linter page · leaderboard · learn · inbox · report · settings ·
             about · tour · palette & shortcuts · router · boot
   Student extension points are marked with  TODO(student)
   ===================================================================== */

// ---------- utils ----------
const NS = 'pc:';
const TODAY_FIXED = null; // set to 'YYYY-MM-DD' to freeze the calendar in demos
const $ = (selector, root = document) => root.querySelector(selector);
const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ESC_MAP[c]);
const ic = (name, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const DAY = 86400000;
const now = () => Date.now();
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
const fmtNum = n => Math.round(n).toLocaleString('en-US');

function todayKey(offset = 0) {
  const base = TODAY_FIXED ? new Date(TODAY_FIXED + 'T12:00:00') : new Date();
  const d = new Date(base.getTime() + offset * DAY);
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${d.getFullYear()}-${m}-${day}`;
}

const fmtDate = ts => new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const fmtTime = ts => new Date(ts).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

function ago(ts) {
  const mins = Math.round((now() - ts) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + ' min ago';
  const hours = Math.round(mins / 60);
  if (hours < 24) return hours + ' h ago';
  const days = Math.round(hours / 24);
  return days === 1 ? 'yesterday' : days + ' days ago';
}

// Small deterministic hash + PRNG so the daily challenge and simulated outputs are reproducible
function hashStr(text) {
  let h = 2166136261;
  for (let i = 0; i < text.length; i++) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const pick = (list, rnd) => list[Math.floor(rnd() * list.length) % list.length];

function debounce(fn, ms) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), ms);
  };
}

function download(name, text, type = 'application/json') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function pickFile(accept, onText) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = accept;
  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => onText(String(reader.result), file.name);
    reader.readAsText(file);
  };
  input.click();
}

async function copyText(text, label = 'Copied to clipboard') {
  try {
    await navigator.clipboard.writeText(text);
    toast(label, 'ok', 'copy');
  } catch {
    // file:// and some browsers block the async clipboard API; fall back to a hidden textarea
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.append(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    toast(ok ? label : 'Copy failed: select the text and copy manually', ok ? 'ok' : 'bad', 'copy');
  }
}

function announce(text) {
  const region = $('#liveRegion');
  region.textContent = '';
  setTimeout(() => { region.textContent = text; }, 30);
}

function toast(message, type = '', icon) {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const fallback = type === 'ok' ? 'check-circle' : type === 'bad' ? 'alert-circle' : 'info';
  el.innerHTML = ic(icon || fallback);
  const text = document.createElement('span');
  text.textContent = message;
  el.append(text);
  $('#toasts').append(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 320);
  }, 3400);
}

// ---------- motion kit ----------
function animateIn(root) {
  root.classList.remove('enter');
  void root.offsetWidth;
  root.classList.add('enter');
  root.addEventListener('animationend', e => {
    if (e.target === root) root.classList.remove('enter');
  }, { once: true });
  $$('.stagger', root).forEach(group => {
    [...group.children].forEach((child, i) => child.style.setProperty('--i', Math.min(i, 14)));
  });
}

function countUp(el, to, { dur = 700, fmt = v => fmtNum(v) } = {}) {
  if (!el) return;
  const start = performance.now();
  const step = time => {
    const p = Math.min(1, (time - start) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(to * eased);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function drawPath(path) {
  if (!path || !path.getTotalLength) return;
  const length = path.getTotalLength();
  path.style.strokeDasharray = length;
  path.style.strokeDashoffset = length;
  path.getBoundingClientRect();
  path.style.transition = 'stroke-dashoffset .9s var(--ease)';
  path.style.strokeDashoffset = 0;
}

function animateBars(root) {
  $$('[data-w]', root).forEach(el => {
    el.style.width = '0%';
    requestAnimationFrame(() => requestAnimationFrame(() => { el.style.width = el.dataset.w + '%'; }));
  });
}

// ---------- storage & settings ----------
const store = {
  get(key, fallback) {
    try {
      const raw = localStorage.getItem(NS + key);
      return raw == null ? fallback : JSON.parse(raw);
    } catch {
      return fallback;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(NS + key, JSON.stringify(value));
    } catch {
      /* private mode or quota: the game keeps working in memory */
    }
  },
  del(key) {
    try {
      localStorage.removeItem(NS + key);
    } catch {
      /* ignore */
    }
  },
  keys() {
    try {
      return Object.keys(localStorage).filter(k => k.startsWith(NS));
    } catch {
      return [];
    }
  }
};

// ---------- modal ----------
let modalClose = null;
let lastFocus = null;

function openModal(html, { wide = false, onClose = null } = {}) {
  const box = $('#modal .box');
  lastFocus = document.activeElement;
  box.innerHTML = html;
  box.classList.toggle('wide', wide);
  $('#modal').classList.add('open');
  $('#scrim').classList.add('open');
  modalClose = onClose;
  const first = box.querySelector('input:not([type=hidden]),select,textarea,button:not([data-close])') || box.querySelector('button');
  if (first) setTimeout(() => first.focus(), 30);
}

function closeModal() {
  const modal = $('#modal');
  if (!modal.classList.contains('open')) return;
  modal.classList.remove('open');
  $('#scrim').classList.remove('open');
  $('#modal .box').innerHTML = '';
  const callback = modalClose;
  modalClose = null;
  if (callback) callback();
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

function modalHead(title, icon = '') {
  return `<div class="modal-head"><h2>${icon ? ic(icon) : ''}${esc(title)}</h2><button type="button" class="iconbtn" data-close aria-label="Close">${ic('x')}</button></div>`;
}

function confirmModal(title, body, { okLabel = 'Confirm', danger = false, typed = '' } = {}) {
  return new Promise(resolve => {
    let answered = false;
    const typedField = typed ? `<label class="field mt">Type ${esc(typed)} to confirm<input class="input" id="cfTyped" autocomplete="off"></label>` : '';
    openModal(`${modalHead(title, danger ? 'alert' : 'help')}<p class="muted">${body}</p>${typedField}
      <div class="row mt" style="justify-content:flex-end"><button class="btn ghost" data-close>Cancel</button>
      <button class="btn ${danger ? 'pink' : 'primary'}" id="cfOk" ${typed ? 'disabled' : ''}>${esc(okLabel)}</button></div>`, {
      onClose: () => { if (!answered) resolve(false); }
    });
    if (typed) {
      $('#cfTyped').addEventListener('input', e => { $('#cfOk').disabled = e.target.value.trim() !== typed; });
    }
    $('#cfOk').onclick = () => {
      answered = true;
      closeModal();
      resolve(true);
    };
  });
}

document.addEventListener('click', e => {

});

// Demo records carry demo:true so the "Show demo data" switch can hide them without deleting anything
const visible = record => record && (!record.demo || demoOn());

function levelRecord(id) {
  const rec = progress.levels[id];
  return visible(rec) ? rec : null;
}

// XP is derived from records (never stored) so hiding demo data or importing a backup keeps it consistent
function computeXp(p = progress) {
  let xp = 0;
  Object.values(p.levels).filter(visible).forEach(r => { xp += r.best + r.stars * 25; });
  Object.values(p.lessons).filter(visible).forEach(r => { xp += (r.done ? 40 : 0) + (r.perfect ? 20 : 0); });
  Object.values(p.daily).filter(visible).forEach(r => { xp += Math.round(r.best / 2) + 20; });
  xp += visibleCount(p.achievements) * 50;
  xp += Math.min(100, (p.runs || 0) * 2);
  return xp;
}

const levelThreshold = n => 25 * (n - 1) * (n + 4);

function xpLevel(xp) {
  let n = 1;
  while (xp >= levelThreshold(n + 1)) n++;
  const from = levelThreshold(n);
  const to = levelThreshold(n + 1);
  return { n, pct: Math.round(((xp - from) / (to - from)) * 100), toNext: to - xp };
}

function coinsEarned(p = progress) {
  let coins = 40;
  Object.values(p.levels).filter(visible).forEach(r => { coins += r.stars * 10; });
  Object.values(p.lessons).filter(visible).forEach(r => { coins += r.done ? 10 : 0; });
  Object.values(p.daily).filter(visible).forEach(r => { coins += r.stars ? 30 : 0; });
  coins += visibleCount(p.achievements) * 20;
  return coins;
}

const wallet = () => Math.max(0, coinsEarned() - (progress.spent || 0));

function spendCoins(amount) {
  if (wallet() < amount) return false;
  progress.spent = (progress.spent || 0) + amount;
  saveProgress();
  return true;
}

// Streak: consecutive days with at least one judged prompt, ending today or yesterday
function streakInfo(p = progress) {
  const days = Object.entries(p.days || {}).filter(([, v]) => visible(v)).map(([k]) => k);
  const set = new Set(days);
  let current = 0;
  let offset = set.has(todayKey()) ? 0 : -1;
  while (set.has(todayKey(offset))) {
    current++;
    offset--;
  }
  const sorted = days.sort();
  let best = 0;
  let run = 0;
  let prev = null;
  sorted.forEach(day => {
    const t = new Date(day + 'T12:00:00').getTime();
    run = prev && Math.round((t - prev) / DAY) === 1 ? run + 1 : 1;
    best = Math.max(best, run);
    prev = t;
  });
  return { current, best, activeToday: set.has(todayKey()) };
}

function markActiveDay() {
  const key = todayKey();
  const entry = progress.days[key];
  progress.days[key] = { n: (entry && !entry.demo ? entry.n : 0) + 1 };
  progress.runs = (progress.runs || 0) + 1;
}

function totalStars(p = progress) {
  return Object.values(p.levels).filter(visible).reduce((sum, r) => sum + r.stars, 0);
}

// ---------- HUD ----------
function renderHud() {
  const xp = computeXp();
  const lvl = xpLevel(xp);
  const streak = streakInfo();
  $('#hudCoins').innerHTML = `${ic('coins')}<span>${fmtNum(wallet())}</span><span class="sr"> coins</span>`;
  $('#hudXp').innerHTML = `${ic('zap')}<span>Lv ${lvl.n}</span><span class="hud-xp" aria-hidden="true"><i style="width:${lvl.pct}%"></i></span><span class="sr">${fmtNum(xp)} XP</span>`;
  $('#hudStreak').innerHTML = `${ic('flame')}<span>${streak.current}</span><span class="sr"> day streak</span>`;

  $('#inboxBtn').innerHTML = ic('bell') + (unread ? `<span class="badge-dot">${unread > 9 ? '9+' : unread}</span>` : '');
}

// ---------- prompt analyzer: rubric-independent features of a prompt ----------
const NUM_WORDS = {
  one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10,
  eleven: 11, twelve: 12, fifteen: 15, twenty: 20, thirty: 30, forty: 40, fifty: 50, hundred: 100
};
const VAGUE_RE = /\b(kind of|sort of|a bit|a few|something|stuff|things?|nice|good|some|etc|whatever|maybe|interesting|very|really|various|properly|appropriate|basically|somehow|cool)\b/gi;
const ROLE_RE = /\b(you are|you're|act as|acting as|play the role|take the role|role\s*:|persona\s*:|pretend to be|imagine you are|as an? (expert|experienced|senior|professional|friendly|patient|strict|veteran) )/i;
const AUDIENCE_RE = /\b(audience|readers?|aimed at|targeted at|written for|(\d+|eight|nine|ten|seven|six)[- ]years?[- ]old|grade \d+|class \d+|(for|to|addressed to) (a |an |the |my |our |busy |young )?([a-z-]+ ){0,3}(students?|kids|children|beginners|customers?|clients|fans|users|teachers|parents|grandparents|grandmother|grandma|nani|dadi|warden|managers?|investors|tourists|visitors|developers|team|people|viewers|listeners|followers|boss|principal|employers?|recruiters?|elderly|commuters|drivers|neighbours|neighbors|shoppers|families))\b/i;
const STEPS_RE = /\b(step[- ]by[- ]step|step \d|show (your |the |all )?(work|working|reasoning|steps|calculations?|arithmetic)|think (it )?through|reason (it )?through|explain (each|every|your) step|walk (me )?through|break (it|this|the problem) down|double[- ]check|verify|check (your|the|each) (answer|result|work|constraint)|before (giving|answering|you answer))/i;
const TONE_RE = /\b(tone|formal|informal|casual|friendly|funny|humou?rous|polite|professional|playful|dramatic|sarcastic|witty|serious|warm|enthusiastic|excited|excitable|empathetic|calm|cheerful|respectful|encouraging|gentle|strict|deadpan|apologetic|energetic)\b/i;
const TASK_RE = /\b(write|list|explain|summari[sz]e|create|generate|draft|classify|translate|compare|describe|rewrite|extract|convert|give|make|plan|design|suggest|produce|return|output|answer|solve|calculate|compose|review|label|tag|name|outline|build|format|turn|compute|find|work out|tell|reply|respond|commentate|narrate|analy[sz]e|split|schedule|identify|caption|pitch|teach|guide)\b/i;
const CONSTRAINT_RE = /\b(must|should|never|don't|do not|avoid|only|exactly|at most|no more than|at least|limit|include|exclude|without|keep it|maximum|max|minimum|under|less than|fewer than|no)\b/i;
const ONLY_OUTPUT_RE = /\b(only (return|output|respond with|reply with|give|print)|return only|output only|respond only|reply only|nothing else|no (extra|other|additional) (text|words|commentary|explanation|prose)|no explanations?|without (any )?(explanation|commentary|preamble|extra text|markdown)|no preamble|no markdown|no code fences?|just the (json|csv|label|table))\b/i;
const LIMIT_RE = /\b(under|below|less than|fewer than|max(?:imum)?|at most|no more than|up to|within|exactly|at least|min(?:imum)?|between|in)?\s*(\d+)(?:\s*(?:-|to|and)\s*(\d+))?\s*(words?|sentences?|lines?|items?|bullets?|bullet points?|points?|characters?|chars|tokens?|paragraphs?|rows?|examples?|names?|captions?|steps?|tweets?|syllables?|reasons?|questions?|facts?|tips?|minutes?|overs?)\b/gi;
const FORMAT_TESTS = [
  ['json', /\bjson\b/i],
  ['table', /\btable\b|\bcolumns?\b|\|\s*\w+\s*\|/i],
  ['csv', /\bcsv\b|comma[- ]separated/i],
  ['bullets', /\bbullet(ed)?\b|\bbullets\b|\bdash(ed)? list|\bunordered list/i],
  ['numbered', /\bnumbered\b|\bordered list\b|\bnumber (them|each)/i],
  ['list', /\blist\b/i],
  ['headings', /\bheadings?\b|\bsection headers?\b|\bmarkdown\b|##/i],
  ['paragraph', /\bparagraphs?\b|\bprose\b/i],
  ['oneLine', /\bone (line|sentence)\b|\bsingle (line|sentence)\b|\bone-liner\b/i],
  ['letter', /\bletter\b|\bemail\b/i],
  ['poem', /\bhaiku\b|\bpoem\b|\bverse\b|\blimerick\b/i],
  ['labelOnly', /\b(only|just) (the )?(label|word|category)\b|\bone word\b|\bsingle word\b/i],
  ['yaml', /\byaml\b/i],
  ['declared', /\b(output )?format\s*:/i]
];
const EXAMPLE_LINE_RE = /^\s*(example\s*\d*|input|output|in|out|review|text|q|a|label|caption|english|roman urdu|urdu|notes?|photo|product|name|stat|before|after|user|assistant)\s*[:\-]/i;

function normalizeNumbers(text) {
  return text.replace(/\b(one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|fifteen|twenty|thirty|forty|fifty|hundred)\b/gi, w => String(NUM_WORDS[w.toLowerCase()]));
}

// Character ranges that hold example data rather than instructions (quotes, [placeholders], labelled example lines)
function exampleRanges(text) {
  const ranges = [];
  let m;
  const quoteRe = /"[^"\n]{2,}"|“[^”\n]{2,}”|\[[^\]\n]*\]/g;
  while ((m = quoteRe.exec(text))) ranges.push([m.index, m.index + m[0].length]);
  let offset = 0;
  text.split('\n').forEach(line => {
    if (EXAMPLE_LINE_RE.test(line)) ranges.push([offset, offset + line.length]);
    offset += line.length + 1;
  });
  return ranges;
}

// Instruction text = prompt with example data blanked out (same length so indices still line up)
function instructionText(text) {
  const chars = text.split('');
  exampleRanges(text).forEach(([a, b]) => {
    for (let i = a; i < b; i++) if (chars[i] !== '\n') chars[i] = ' ';
  });
  return chars.join('');
}

function detectLimits(text) {
  const limits = [];
  const normal = normalizeNumbers(text);
  let m;
  LIMIT_RE.lastIndex = 0;
  while ((m = LIMIT_RE.exec(normal))) {
    const unit = m[4].toLowerCase().replace(/^bullet points?$/, 'bullets').replace(/s$/, '').replace(/^char$/, 'character');
    limits.push({ op: (m[1] || '').toLowerCase(), n: Number(m[2]), n2: m[3] ? Number(m[3]) : null, unit });
  }
  return limits;
}

function countExamples(text) {
  const lines = text.split('\n');
  const labels = (text.match(/\bexample\s*\d*\s*[:\-]/gi) || []).length;
  const inputs = lines.filter(l => /^\s*(input|in|q|review|text|photo|roman urdu|notes?|product|before|user)\s*[:\-]/i.test(l)).length;
  const outputs = lines.filter(l => /^\s*(output|out|a|label|answer|caption|english|name|stat|after|assistant)\s*[:\-]/i.test(l)).length;
  const arrows = lines.filter(l => /\S\s*(->|=>)\s*\S/.test(l)).length;
  const eg = (text.match(/\be\.g\.|\bfor example\b|\bfor instance\b/gi) || []).length;
  const structured = Math.max(labels, Math.min(inputs, outputs), arrows);
  return structured || eg;
}

function countProperNouns(text) {
  let count = 0;
  text.split(/[.!?\n]+/).forEach(sentence => {
    const words = sentence.trim().split(/\s+/).slice(1);
    words.forEach(w => {
      if (/^[A-Z][a-z]{2,}/.test(w) && !/^(You|Your|The|Use|Write|Make|Return|Only|Each|Then|Include|Keep|Format|Give|List|Do|Don't|Avoid|Act|For|Example|Input|Output|Please|And|Or|If|When|With)$/.test(w.replace(/[^A-Za-z']/g, ''))) count++;
    });
  });
  return count;
}

function specificityScore(a) {
  if (!a.wordCount) return 0;
  const longWords = a.words.filter(w => w.length >= 7).length;
  const raw = 0.3 * Math.min(1, a.numbers / 3)
    + 0.25 * Math.min(1, a.proper / 3)
    + 0.15 * Math.min(1, a.quoted / 1)
    + 0.3 * Math.min(1, (longWords / a.wordCount) * 3.5);
  return clamp(Math.round(raw * 100 - a.vague.length * 6), 0, 100);
}

function analyzePrompt(text = '') {
  const instr = instructionText(text);
  const lower = text.toLowerCase();
  const words = lower.match(/[a-z0-9'][a-z0-9'-]*/g) || [];
  const sentences = text.split(/[.!?]+\s|\n+/).map(s => s.trim()).filter(Boolean);
  const vague = [];
  let m;
  VAGUE_RE.lastIndex = 0;
  while ((m = VAGUE_RE.exec(instr))) vague.push({ word: m[0].toLowerCase(), index: m.index });
  const formats = new Set(FORMAT_TESTS.filter(([, re]) => re.test(instr)).map(([name]) => name));
  const a = {
    text,
    lower,
    instr,
    words,
    wordCount: words.length,
    chars: text.length,
    tokens: Math.ceil(text.length / 4),
    sentences: sentences.length,
    longestSentence: sentences.reduce((max, s) => Math.max(max, s.split(/\s+/).length), 0),
    numbers: (text.match(/\d+(?:[.,:]\d+)?/g) || []).length,
    proper: countProperNouns(text),
    quoted: (text.match(/"[^"\n]{2,}"|'[^'\n]{3,}'/g) || []).length,
    vague,
    role: ROLE_RE.test(instr),
    audience: AUDIENCE_RE.test(instr),
    steps: STEPS_RE.test(instr),
    tone: (instr.match(TONE_RE) || [null])[0],
    delimiters: /```|"""|<\/?[a-z_]+>|^#{2,}\s|^---$/m.test(text),
    task: TASK_RE.test(instr),
    constraints: sentences.filter(s => CONSTRAINT_RE.test(s)).length,
    limits: detectLimits(instr),
    formats,
    onlyOutput: ONLY_OUTPUT_RE.test(instr),
    examples: countExamples(text),
    vars: [...new Set((text.match(/\{\{\s*([\w-]+)\s*\}\}/g) || []).map(v => v.replace(/[{}\s]/g, '')))],
    negations: (instr.match(/\b(don't|do not|never|avoid|without)\b/gi) || []).length,
    questions: (text.match(/\?/g) || []).length
  };
  a.specificity = specificityScore(a);
  return a;
}

const hasFormat = (a, fmt) => {
  if (fmt === 'list') return a.formats.has('list') || a.formats.has('bullets') || a.formats.has('numbered');
  if (fmt === 'steps') return a.formats.has('numbered') || a.steps;
  if (fmt === 'headings') return a.formats.has('headings');
  return a.formats.has(fmt);
};

const limitFor = (a, units) => a.limits.find(l => units.includes(l.unit));

// ---------- linter: issues with ranges, severities and one-click fixes ----------
const VAGUE_FIX = {
  something: '[name the exact item]',
  stuff: '[list the exact items]',
  things: '[name them]',
  thing: '[name it]',
  nice: '[describe the quality you want]',
  good: '[define success, e.g. clear and under 100 words]',
  some: '[how many exactly?]',
  'a few': '[exact number]',
  whatever: '[choose one]',
  interesting: '[surprising, funny or useful?]',
  various: '[list them]',
  properly: '[state the rule]',
  appropriate: '[state the standard]',
  cool: '[describe the effect you want]'
};
const REMOVABLE_VAGUE = ['etc', 'maybe', 'kind of', 'sort of', 'very', 'really', 'a bit', 'basically', 'somehow'];
const CONFLICTS = [
  [/\b(short|brief|concise|one[- ]line|succinct)\b/i, /\b(detailed|in[- ]depth|comprehensive|elaborate|thorough|extensive|long (answer|essay|response|explanation))\b/i, 'Length'],
  [/\bformal\b/i, /\b(casual|informal|slang|chatty)\b/i, 'Tone'],
  [/\b(funny|humou?rous|jokes?|playful)\b/i, /\b(serious|solemn|no jokes|strictly professional)\b/i, 'Mood'],
  [/\buse (bullet|bullets|bullet points)\b/i, /\b(no|don't use|do not use|without) bullets?\b/i, 'Bullets'],
  [/\b(only (return |output )?json|json only)\b/i, /\b(explain your (reasoning|answer|choices)|add an explanation|describe your reasoning)\b/i, 'Output']
];
const FILLER_RE = /\b(please kindly|kindly|i want you to|i would like you to|i'd like you to|could you please|can you please|could you|can you|if possible|if you can)\b\s*/gi;
const CAPS_OK = new Set(['RSVP', 'ASAP', 'NASA', 'UNESCO', 'JSON', 'YAML', 'HTML', 'CSV', 'API', 'PKR', 'URL', 'FAQ', 'SQL', 'ISO', 'UTC', 'NUST', 'LUMS', 'FAST', 'COMSATS', 'WAPDA', 'NADRA', 'PSL', 'ODI', 'CNIC', 'HTTP', 'UPS', 'BISP']);

function issue(rule, sev, title, msg, start = -1, end = -1, fix = null) {
  return { rule, sev, title, msg, start, end, fix };
}

function replaceRange(start, end, expected, replacement) {
  return text => {
    if (text.slice(start, end).toLowerCase() === expected.toLowerCase()) return text.slice(0, start) + replacement + text.slice(end);
    const idx = text.toLowerCase().indexOf(expected.toLowerCase());
    return idx < 0 ? text : text.slice(0, idx) + replacement + text.slice(idx + expected.length);
  };
}

const tidy = text => text.replace(/[ \t]{2,}/g, ' ').replace(/ ([,.;:])/g, '$1').replace(/,\./g, '.').replace(/^\s+/, '');
const escapeRe = text => text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

function lintVague(a, out) {
  a.vague.forEach(v => {
    const word = a.text.substr(v.index, v.word.length);
    const removable = REMOVABLE_VAGUE.includes(v.word);
    const replacement = removable ? '' : (VAGUE_FIX[v.word] || '[be specific]');
    const fix = {
      label: removable ? `Remove "${word}"` : 'Insert a placeholder',
      apply: text => tidy(replaceRange(v.index, v.index + word.length, word, replacement)(text))
    };
    out.push(issue('vague', 'warn', `Vague word: "${word}"`, 'The model has to guess what you mean. Replace it with a number, a name or a concrete quality.', v.index, v.index + word.length, fix));
  });
}

function lintStructure(a, out) {
  if (!a.task) {
    out.push(issue('task', 'error', 'No clear task', 'Start with an action verb such as Write, List, Classify or Translate so the model knows what to produce.', -1, -1,
      { label: 'Add "Write" at the start', apply: text => 'Write ' + text.replace(/^\s+/, '') }));
  }
  if (!a.audience) {
    out.push(issue('audience', 'warn', 'Missing audience', 'Who will read the result? The same facts are explained differently to a child, a client or an examiner.', -1, -1,
      { label: 'Add an audience line', apply: text => text.replace(/\s*$/, '') + '\nAudience: [who will read this, e.g. first-year students].' }));
  }
  if (!a.formats.size) {
    out.push(issue('format', 'warn', 'Missing output format', 'Say how the answer should look: a table, a numbered list, JSON keys, one paragraph or a word limit.', -1, -1,
      { label: 'Add a format line', apply: text => text.replace(/\s*$/, '') + '\nFormat: [e.g. a numbered list of 5 points].' }));
  }
  if (!a.role && a.wordCount >= 12) {
    out.push(issue('role', 'info', 'No role or persona', 'Optional, but a role ("You are a patient maths tutor") sets vocabulary, tone and expertise in one line.', -1, -1,
      { label: 'Add a role', apply: text => 'You are a [role, e.g. friendly expert]. ' + text.replace(/^\s+/, '') }));
  }
  const start = a.text.match(/^\s*(it|this|that|they|these)\b/i);
  if (start) {
    const from = start[0].length - start[1].length;
    out.push(issue('reference', 'info', 'Unclear reference', `"${start[1]}" points at something the model has not seen. Name the thing instead.`, from, from + start[1].length));
  }
}

function lintConflicts(a, out) {
  CONFLICTS.forEach(([first, second, kind]) => {
    const m1 = a.instr.match(first);
    const m2 = a.instr.match(second);
    if (!m1 || !m2) return;
    const idx1 = a.instr.search(first);
    const idx2 = a.instr.search(second);
    const found = issue('conflict', 'error', `Conflicting instructions (${kind})`, `"${m1[0]}" and "${m2[0]}" pull in opposite directions; the model will satisfy one at random. Keep only one.`, idx2, idx2 + m2[0].length,
      { label: `Remove "${m2[0]}"`, apply: text => tidy(text.replace(new RegExp(`(,?\\s+(but|and|or|yet))?\\s*\\b${escapeRe(m2[0])}\\b`, 'i'), '')) });
    found.extra = [[idx1, idx1 + m1[0].length]];
    out.push(found);
  });
  const caps = {};
  a.limits.forEach(l => {
    const isMax = /under|below|less|fewer|max|most|no more|up to|within/.test(l.op);
    const isMin = /least|min/.test(l.op);
    const slot = caps[l.unit] || (caps[l.unit] = {});
    if (isMax) slot.max = Math.min(slot.max ?? Infinity, l.n);
    if (isMin) slot.min = Math.max(slot.min ?? 0, l.n);
  });
  Object.entries(caps).forEach(([unit, slot]) => {
    if (slot.min != null && slot.max != null && slot.min > slot.max) {
      out.push(issue('conflict', 'error', `Impossible ${unit} limit`, `At least ${slot.min} and at most ${slot.max} ${unit}s cannot both be true.`));
    }
  });
}

function lintStyle(a, out) {
  if (a.wordCount > 300) {
    out.push(issue('overlong', 'warn', `Overlong prompt (${a.wordCount} words)`, 'Long prompts bury the task. Put background in a delimited Context block and keep the instruction short.', -1, -1,
      { label: 'Trim filler phrases', apply: text => tidy(text.replace(FILLER_RE, '')) }));
  }
  let offset = 0;
  a.text.split(/(?<=[.!?])\s+|\n/).forEach(sentence => {
    const idx = a.text.indexOf(sentence, offset);
    offset = idx + sentence.length;
    const count = sentence.split(/\s+/).filter(Boolean).length;
    if (count <= 40 || idx < 0) return;
    const split = sentence.search(/,? and (?=\w)/);
    const fix = split > 20 ? { label: 'Split the sentence', apply: text => text.replace(sentence, sentence.slice(0, split) + '. ' + sentence.slice(split).replace(/^,? and (\w)/, (x, c) => c.toUpperCase())) } : null;
    out.push(issue('overlong', 'info', `Long sentence (${count} words)`, 'Split it so each sentence carries one instruction.', idx, idx + sentence.length, fix));
  });
  let m;
  FILLER_RE.lastIndex = 0;
  while ((m = FILLER_RE.exec(a.text))) {
    const found = m[0];
    const at = m.index;
    out.push(issue('filler', 'info', `Filler: "${found.trim()}"`, 'Politeness costs tokens and adds nothing; state the instruction directly.', at, at + found.trim().length,
      { label: 'Remove filler', apply: text => tidy(replaceRange(at, at + found.length, found, '')(text)) }));
  }
  const capsRe = /\b[A-Z]{4,}\b/g;
  while ((m = capsRe.exec(a.text))) {
    if (CAPS_OK.has(m[0])) continue;
    const word = m[0];
    const at = m.index;
    out.push(issue('shouting', 'info', `Shouting: ${word}`, 'Capitals do not make an instruction stronger; a clear sentence does.', at, at + word.length,
      { label: 'Lower-case it', apply: replaceRange(at, at + word.length, word, word.toLowerCase()) }));
  }
  if (a.negations >= 4) {
    out.push(issue('negation', 'info', `${a.negations} negative instructions`, 'Lists of "don\'t" are easy to miss. Say what to do instead, e.g. "Use plain words" rather than "Don\'t use jargon".'));
  }
  if (/\{\{\s*\}\}/.test(a.text)) {
    const at = a.text.search(/\{\{\s*\}\}/);
    out.push(issue('variable', 'error', 'Empty variable', 'A {{ }} placeholder has no name, so it can never be filled.', at, at + 4,
      { label: 'Remove it', apply: text => text.replace(/\{\{\s*\}\}/, '') }));
  }
}

const SEV_ORDER = { error: 0, warn: 1, info: 2 };

function lintPrompt(text) {
  if (!text.trim()) return [];
  const a = analyzePrompt(text);
  const out = [];
  lintStructure(a, out);
  lintConflicts(a, out);
  lintVague(a, out);
  lintStyle(a, out);
  return out.sort((x, y) => SEV_ORDER[x.sev] - SEV_ORDER[y.sev] || x.start - y.start);
}

function lintScore(issues) {
  const count = sev => issues.filter(i => i.sev === sev).length;
  return clamp(100 - count('error') * 18 - count('warn') * 8 - count('info') * 2, 0, 100);
}

// Squiggle layer: the textarea text is mirrored in a <pre> behind it with <mark> spans on issue ranges
function squiggleHTML(text, issues) {
  const spans = issues.flatMap(i => [[i.start, i.end], ...(i.extra || [])].map(([start, end]) => ({ start, end, sev: i.sev, rule: i.rule })))
    .filter(s => s.start >= 0 && s.end > s.start)
    .sort((x, y) => x.start - y.start);
  let html = '';
  let pos = 0;
  spans.forEach(span => {
    if (span.start < pos) return;
    html += esc(text.slice(pos, span.start));
    html += `<mark class="sq ${span.sev}" data-rule="${span.rule}">${esc(text.slice(span.start, span.end))}</mark>`;
    pos = span.end;
  });
  return html + esc(text.slice(pos)) + '\n ';
}

function mountEditor(host, { value = '', placeholder = '', lint = true, minHeight = 150, label = 'Prompt', onChange = null } = {}) {
  host.innerHTML = `<div class="ed"><pre class="ed-back" aria-hidden="true"></pre><textarea class="ed-ta" spellcheck="false" aria-label="${esc(label)}" placeholder="${esc(placeholder)}"></textarea></div>`;
  const ta = $('.ed-ta', host);
  const back = $('.ed-back', host);
  ta.value = value;
  let issues = [];
  const grow = () => {
    ta.style.height = 'auto';
    ta.style.height = Math.max(minHeight, ta.scrollHeight) + 'px';
  };
  const refresh = () => {
    issues = lint ? lintPrompt(ta.value) : [];
    back.innerHTML = squiggleHTML(ta.value, issues);
    grow();
    if (onChange) onChange(ta.value, issues);
  };
  // Tab is left alone on purpose so keyboard users can move out of the editor
  ta.addEventListener('input', refresh);
  refresh();
  return {
    ta,
    get value() { return ta.value; },
    get issues() { return issues; },
    set(text) {
      ta.value = text;
      refresh();
    },
    refresh
  };
}
