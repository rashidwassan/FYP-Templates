<style>
/* ---------- tokens: soil umber and clay, wheat gold, aquifer blues, leaf green ---------- */
:root {
  --bg: #f3ece0;
  --bg-2: #e9dfcd;
  --card: #fffbf4;
  --card-2: #f7efe2;
  --ink: #2a1d14;
  --ink-2: #56422f;
  --muted: #7d6853;
  --line: #e3d5bf;
  --line-2: #cdb698;
  --umber: #5b3a29;
  --umber-2: #3a2417;
  --clay: #a8552f;
  --clay-soft: #f4dccb;
  --wheat: #c48f1f;
  --wheat-ink: #7a5508;
  --wheat-soft: #f7e6bb;
  --leaf: #3d7533;
  --leaf-soft: #dbead0;
  --aq1: #e4f1f8;
  --aq2: #b9d9ec;
  --aq3: #82b8d9;
  --aq4: #4a8fc0;
  --aq5: #22608f;
  --aq6: #143e63;
  --danger: #b0332a;
  --danger-soft: #f7dcd6;
  --top: #3a2417;
  --top-2: #4b2f1f;
  --top-ink: #f6ead6;
  --focus: #2f7fc0;
  --shadow: 0 1px 0 rgba(58, 36, 23, .05), 0 14px 30px -22px rgba(58, 36, 23, .55);
  --shadow-lg: 0 26px 60px -26px rgba(40, 22, 10, .6);
  --radius: 14px;
  --radius-sm: 10px;
  --font: "Mulish", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-head: "Bitter", Georgia, "Times New Roman", serif;
  --font-ur: "Noto Nastaliq Urdu", "Mulish", serif;
  --fs: 15px;
  --top-h: 60px;
  --nav-h: 48px;
  --tab-h: 66px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --dur: .35s;
}
html[data-theme="dark"] {
  --bg: #15100c;
  --bg-2: #1d1610;
  --card: #231a14;
  --card-2: #2b2019;
  --ink: #f2e7d7;
  --ink-2: #d6c4ac;
  --muted: #a8927b;
  --line: #3a2c22;
  --line-2: #50402f;
  --umber: #d9b48f;
  --umber-2: #0f0b08;
  --clay: #e5926a;
  --clay-soft: #3c241a;
  --wheat: #e2b44a;
  --wheat-ink: #f0cf7d;
  --wheat-soft: #3a2c10;
  --leaf: #8cc77a;
  --leaf-soft: #1d2e18;
  --aq1: #0f2436;
  --aq2: #173a57;
  --aq3: #23587f;
  --aq4: #4f97c9;
  --aq5: #7ab6df;
  --aq6: #b9dbf1;
  --danger: #f08a7d;
  --danger-soft: #3d1a16;
  --top: #0f0b08;
  --top-2: #1f1610;
  --top-ink: #f2e7d7;
  --focus: #7ab6df;
  --shadow: 0 1px 0 rgba(0, 0, 0, .2), 0 16px 32px -24px rgba(0, 0, 0, .9);
  --shadow-lg: 0 26px 60px -24px rgba(0, 0, 0, .9);
}
html[data-size="sm"] { --fs: 14px; }
html[data-size="lg"] { --fs: 17px; }

/* ---------- motion kit ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
html.calm *, html.calm *::before, html.calm *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
@keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }
@keyframes flow { to { stroke-dashoffset: -24; } }
@keyframes rain { from { transform: translateY(-30px); opacity: 0; } 20% { opacity: .8; } to { transform: translateY(110px); opacity: 0; } }
@keyframes ripple { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-12px); } }
@keyframes pulse { 0% { r: .5; opacity: .9; } 100% { r: 1.6; opacity: 0; } }
.enter { animation: fadeUp var(--dur) var(--ease) both; }
.stagger > * { animation: fadeUp .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
.btn { transition: transform .15s var(--ease), box-shadow .15s var(--ease), background .15s, border-color .15s; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0) scale(.98); }
.card, .tile { transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s; }
.card.lift:hover, .tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.fill, .bar > i { transition: width .6s var(--ease); }
.skeleton { background: linear-gradient(90deg, var(--card-2) 25%, var(--card) 50%, var(--card-2) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: var(--radius-sm); }

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { font-size: var(--fs); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  color: var(--ink);
  background: var(--bg);
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: hidden;
}
html[lang="ur"] body { font-family: var(--font-ur); line-height: 2; }
h1, h2, h3, h4 { font-family: var(--font-head); line-height: 1.25; margin: 0 0 .5em; color: var(--ink); }
html[lang="ur"] h1, html[lang="ur"] h2, html[lang="ur"] h3, html[lang="ur"] h4 { font-family: var(--font-ur); line-height: 1.9; font-weight: 700; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.08rem; display: flex; align-items: center; gap: .45em; }
h4 { font-size: .98rem; }
p { margin: 0 0 .7em; }
a { color: var(--aq5); }
button, input, select, textarea { font: inherit; color: inherit; }
img, svg, canvas { max-width: 100%; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.ic { width: 1.1em; height: 1.1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; flex: none; }
html[dir="rtl"] .ic.flip { transform: scaleX(-1); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.hidden { display: none !important; }
.ltr { direction: ltr; unicode-bidi: isolate; }
.num { font-variant-numeric: tabular-nums; font-family: var(--font); }
html[lang="ur"] .num { font-family: var(--font); }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.tiny { font-size: .78rem; }
.grow { flex: 1 1 auto; min-width: 0; }
.row { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.between { display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap; }
.stack { display: grid; gap: 1rem; align-content: start; min-width: 0; }
.mt { margin-top: .9rem; }
.mt0 { margin-top: 0; }
.nowrap { white-space: nowrap; }
.skip { position: fixed; top: -60px; left: 12px; z-index: 200; }
.skip:focus { top: 10px; }

/* ---------- shell: top bar, strata nav, tabs ---------- */
.top {
  position: sticky;
  top: 0;
  z-index: 40;
  height: var(--top-h);
  background: var(--top);
  color: var(--top-ink);
  display: flex;
  align-items: center;
  gap: .6rem;
  padding: 0 1rem;
  border-bottom: 3px solid transparent;
  border-image: linear-gradient(90deg, #8a5a3c 0 18%, #b0623a 18% 34%, #c48f1f 34% 46%, #82b8d9 46% 66%, #22608f 66% 100%) 1;
}
.brand { display: flex; align-items: center; gap: .55rem; color: inherit; text-decoration: none; min-width: 0; }
.brand .mark { width: 36px; height: 36px; flex: none; }
.brand b { display: block; font-family: var(--font-head); font-size: 1.05rem; letter-spacing: .01em; white-space: nowrap; }
.brand small { display: block; font-size: .72rem; opacity: .78; white-space: nowrap; }
html[lang="ur"] .brand b { font-family: var(--font-ur); font-size: 1rem; }
html[lang="ur"] .brand small { line-height: 1.6; }
.vswitch {
  display: flex;
  align-items: center;
  gap: .45rem;
  min-height: 40px;
  padding: .3rem .75rem;
  border-radius: 999px;
  border: 1px solid rgba(246, 234, 214, .25);
  background: var(--top-2);
  color: var(--top-ink);
  cursor: pointer;
  max-width: 280px;
  min-width: 0;
}
.vswitch span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vswitch .fict { font-size: .7rem; padding: .05rem .45rem; border-radius: 999px; background: rgba(226, 180, 74, .2); color: #f0cf7d; }
.top-actions { margin-inline-start: auto; display: flex; align-items: center; gap: .35rem; }
.tbtn {
  position: relative;
  min-width: 40px;
  height: 40px;
  border-radius: 12px;
  border: 0;
  background: transparent;
  color: var(--top-ink);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .35rem;
  padding: 0 .55rem;
  cursor: pointer;
}
.tbtn:hover { background: var(--top-2); }
.tbtn.lang { font-family: var(--font-ur); font-size: .95rem; border: 1px solid rgba(246, 234, 214, .25); }
html[lang="ur"] .tbtn.lang { font-family: var(--font); }
.badge { position: absolute; top: 3px; inset-inline-end: 2px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--wheat); color: #2a1d14; font-size: .68rem; font-weight: 800; display: grid; place-items: center; padding: 0 4px; font-family: var(--font); }
.runchip { display: inline-flex; align-items: center; gap: .4rem; font-size: .78rem; padding: .25rem .6rem; border-radius: 999px; background: rgba(130, 184, 217, .16); color: #cfe6f5; white-space: nowrap; }
.runchip.busy .ic { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.strata {
  position: sticky;
  top: var(--top-h);
  z-index: 35;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  height: var(--nav-h);
  display: flex;
  align-items: stretch;
  gap: .15rem;
  padding: 0 .75rem;
  overflow-x: auto;
  scrollbar-width: none;
}
.strata::-webkit-scrollbar { display: none; }
.strata a {
  display: flex;
  align-items: center;
  gap: .4rem;
  padding: 0 .7rem;
  color: var(--ink-2);
  text-decoration: none;
  font-weight: 600;
  font-size: .9rem;
  white-space: nowrap;
  border-bottom: 3px solid transparent;
  transition: color .2s, border-color .2s, background .2s;
}
.strata a:hover { color: var(--ink); background: var(--card-2); }
.strata a.on { color: var(--aq5); border-bottom-color: var(--aq4); }
.strata .sep { width: 1px; background: var(--line); margin: .7rem .3rem; flex: none; }
.strata a.ico span { display: none; }
@media (max-width: 1420px) { .strata a { padding: 0 .5rem; font-size: .86rem; } }
main#view { max-width: 1320px; margin: 0 auto; padding: 1.25rem 1.25rem 3rem; min-height: 60vh; outline: none; }
.tabs { display: none; }

/* ---------- page head, cards, KPIs ---------- */
.phead { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.1rem; }
.phead h2 { margin: 0; display: flex; align-items: center; gap: .5rem; }
.phead p { margin: .25rem 0 0; color: var(--muted); max-width: 70ch; }
.phead .actions { display: flex; gap: .5rem; flex-wrap: wrap; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 1.05rem 1.15rem;
  min-width: 0;
  position: relative;
}
.card.core { padding-top: 1.25rem; overflow: hidden; }
.card.core::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 5px;
  background: linear-gradient(90deg, #5b3a29 0 14%, #a8552f 14% 28%, #c48f1f 28% 38%, #b9d9ec 38% 52%, #4a8fc0 52% 74%, #143e63 74%);
}
.card.soft { background: var(--card-2); box-shadow: none; }
.card.flush { padding: 0; overflow: hidden; }
.card h3 .ic { color: var(--aq5); }
.card .sub { color: var(--muted); font-size: .86rem; margin: -.3rem 0 .7rem; }
.cols { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start; }
.cols.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.cols.wide-left { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
.cols.wide-right { grid-template-columns: minmax(0, 1fr) minmax(0, 1.55fr); }
.cols.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpis { display: grid; gap: .8rem; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.kpi {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: .85rem .95rem .85rem 1.25rem;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow);
  min-width: 0;
}
.kpi::before { content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: 6px; background: linear-gradient(180deg, #5b3a29 0 22%, #a8552f 22% 40%, #c48f1f 40% 52%, #82b8d9 52% 70%, #22608f 70%); }
.kpi .lbl { display: flex; align-items: center; gap: .4rem; color: var(--muted); font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
html[lang="ur"] .kpi .lbl { text-transform: none; letter-spacing: 0; font-size: .82rem; }
.kpi .val { font-family: var(--font-head); font-size: 1.7rem; font-weight: 700; margin-top: .15rem; line-height: 1.2; white-space: nowrap; }
.kpi .val small { font-family: var(--font); font-size: .8rem; font-weight: 600; color: var(--muted); margin-inline-start: .2rem; }
.kpi .note { font-size: .8rem; color: var(--muted); margin-top: .2rem; }
.kpi.warn .val { color: var(--clay); }
.kpi.bad .val { color: var(--danger); }
.kpi.good .val { color: var(--leaf); }
.delta { font-weight: 700; }
.delta.up { color: var(--danger); }
.delta.down { color: var(--leaf); }

/* ---------- buttons, chips, segmented controls ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .45rem;
  min-height: 40px;
  padding: .45rem 1rem;
  border-radius: 11px;
  border: 1px solid transparent;
  background: var(--aq5);
  color: #fff;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
}
html[data-theme="dark"] .btn { color: #0d1b28; }
.btn:hover { box-shadow: 0 8px 18px -12px rgba(20, 62, 99, .8); }
.btn.soil { background: var(--umber); color: #fff8ee; }
html[data-theme="dark"] .btn.soil { color: #1b120c; }
.btn.wheat { background: var(--wheat); color: #2a1d14; }
.btn.leaf { background: var(--leaf); color: #fff; }
html[data-theme="dark"] .btn.leaf { color: #10200c; }
.btn.danger { background: var(--danger); color: #fff; }
html[data-theme="dark"] .btn.danger { color: #2a0d09; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-2); }
.btn.ghost:hover { background: var(--card-2); }
html[data-theme="dark"] .btn.ghost { color: var(--ink); }
.btn.sm { min-height: 34px; padding: .3rem .7rem; font-size: .86rem; border-radius: 9px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; }
.ibtn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink-2); display: inline-grid; place-items: center; cursor: pointer; flex: none; }
.ibtn:hover { background: var(--card-2); color: var(--ink); }
.ibtn.sm { width: 32px; height: 32px; }
.chip { display: inline-flex; align-items: center; gap: .3rem; padding: .18rem .6rem; border-radius: 999px; font-size: .78rem; font-weight: 700; background: var(--card-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.chip.aq { background: var(--aq1); color: var(--aq6); border-color: var(--aq2); }
.chip.leaf { background: var(--leaf-soft); color: var(--leaf); border-color: transparent; }
.chip.clay { background: var(--clay-soft); color: var(--clay); border-color: transparent; }
.chip.wheat { background: var(--wheat-soft); color: var(--wheat-ink); border-color: transparent; }
.chip.bad { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.chip.illus { background: transparent; border-style: dashed; color: var(--muted); white-space: normal; }
.seg { display: inline-flex; padding: 3px; border-radius: 11px; background: var(--card-2); border: 1px solid var(--line); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: .35rem .75rem; min-height: 34px; border-radius: 8px; font-weight: 700; font-size: .85rem; color: var(--ink-2); cursor: pointer; }
.seg button.on { background: var(--card); color: var(--aq5); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.pills { display: flex; gap: .4rem; flex-wrap: wrap; }
.pills button { border: 1px solid var(--line-2); background: var(--card); border-radius: 999px; padding: .25rem .75rem; min-height: 34px; font-weight: 700; font-size: .84rem; cursor: pointer; color: var(--ink-2); }
.pills button.on { background: var(--aq5); border-color: var(--aq5); color: #fff; }
html[data-theme="dark"] .pills button.on { color: #0d1b28; }

/* ---------- forms ---------- */
.field { display: grid; gap: .3rem; min-width: 0; }
.field > span { font-size: .82rem; font-weight: 700; color: var(--ink-2); }
.field small { color: var(--muted); font-size: .76rem; }
.inp, .field input, .field select, .field textarea {
  width: 100%;
  min-height: 40px;
  padding: .45rem .7rem;
  border-radius: 10px;
  border: 1px solid var(--line-2);
  background: var(--card);
  color: var(--ink);
}
.field textarea { min-height: 80px; resize: vertical; }
.field.bad input, .field.bad select { border-color: var(--danger); }
.field .err { color: var(--danger); font-size: .78rem; }
.fgrid { display: grid; gap: .8rem; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); align-items: start; }
.range { display: grid; gap: .2rem; }
.range .between b { font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--aq5); min-height: 28px; }
.check { display: flex; align-items: center; gap: .55rem; cursor: pointer; min-height: 36px; }
.check input { width: 18px; height: 18px; accent-color: var(--aq5); }
.switch { position: relative; width: 44px; height: 26px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 13px; background: var(--line-2); transition: background .2s; }
.switch i::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s var(--ease); }
.switch input:checked + i { background: var(--aq5); }
.switch input:checked + i::after { transform: translateX(18px); }
html[dir="rtl"] .switch input:checked + i::after { transform: translateX(-18px); }
.switch input:focus-visible + i { outline: 3px solid var(--focus); outline-offset: 2px; }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .7rem 0; border-bottom: 1px solid var(--line); }
.setrow:last-child { border-bottom: 0; }
.setrow .lbl b { display: block; }
.setrow .lbl small { color: var(--muted); }

/* ---------- tables ---------- */
.tblwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); max-width: 100%; }
.tbl { width: 100%; border-collapse: collapse; font-size: .86rem; }
.tbl th { text-align: start; font-weight: 800; color: var(--ink-2); background: var(--card-2); padding: .55rem .65rem; position: sticky; top: 0; white-space: nowrap; font-size: .78rem; text-transform: uppercase; letter-spacing: .03em; }
html[lang="ur"] .tbl th { text-transform: none; letter-spacing: 0; font-size: .82rem; }
.tbl td { padding: .5rem .65rem; border-top: 1px solid var(--line); vertical-align: middle; }
.tbl tr:hover td { background: var(--card-2); }
.tbl td.n, .tbl th.n { text-align: end; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl tr.sel td { background: var(--aq1); }
.tbl tr.flag td { background: var(--danger-soft); }
.tbl th button { background: none; border: 0; font: inherit; color: inherit; cursor: pointer; padding: 0; display: inline-flex; align-items: center; gap: .2rem; text-transform: inherit; }
.tbl .acts { display: flex; gap: .25rem; justify-content: flex-end; }

/* ---------- lists, bars, empty states ---------- */
.lrow { display: flex; align-items: center; gap: .7rem; padding: .6rem 0; border-bottom: 1px solid var(--line); min-width: 0; }
.lrow:last-child { border-bottom: 0; }
.lrow .av { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--aq1); color: var(--aq5); flex: none; }
.lrow .av.clay { background: var(--clay-soft); color: var(--clay); }
.lrow .av.leaf { background: var(--leaf-soft); color: var(--leaf); }
.lrow .av.wheat { background: var(--wheat-soft); color: var(--wheat-ink); }
.lrow .av.bad { background: var(--danger-soft); color: var(--danger); }
.lrow .meta { flex: 1; min-width: 0; }
.lrow .meta b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .meta small { display: block; color: var(--muted); font-size: .8rem; }
.bar { height: 8px; border-radius: 4px; background: var(--card-2); overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; width: 0; background: var(--aq4); border-radius: 4px; }
.bar.clay > i { background: var(--clay); }
.bar.leaf > i { background: var(--leaf); }
.bar.wheat > i { background: var(--wheat); }
.empty { text-align: center; padding: 1.6rem 1rem; color: var(--muted); }
.empty .ic { width: 2.2rem; height: 2.2rem; color: var(--aq4); display: block; margin: 0 auto .5rem; }
.note-box { display: flex; gap: .6rem; align-items: flex-start; padding: .7rem .85rem; border-radius: var(--radius-sm); background: var(--wheat-soft); color: var(--ink); font-size: .86rem; }
.note-box .ic { color: var(--wheat-ink); margin-top: .2rem; }
.note-box.aq { background: var(--aq1); }
.note-box.aq .ic { color: var(--aq5); }
.note-box.bad { background: var(--danger-soft); }
.note-box.bad .ic { color: var(--danger); }
.legend { display: flex; flex-wrap: wrap; gap: .35rem .9rem; font-size: .8rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-inline-end: .35rem; vertical-align: -1px; }
.legend i.line { height: 3px; border-radius: 2px; vertical-align: 3px; width: 16px; }
.kbd { display: inline-block; min-width: 26px; padding: .1rem .45rem; border-radius: 6px; border: 1px solid var(--line-2); border-bottom-width: 2px; background: var(--card-2); font-size: .78rem; font-weight: 800; text-align: center; font-family: var(--font); }
code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .85em; background: var(--card-2); padding: .05rem .3rem; border-radius: 5px; direction: ltr; unicode-bidi: isolate; }
.formula { font-family: var(--font-head); background: var(--card-2); border-radius: var(--radius-sm); padding: .6rem .8rem; direction: ltr; text-align: left; overflow-x: auto; font-size: .92rem; white-space: nowrap; }

/* ---------- overlays: modal sheet, menu, toasts, palette, tooltip, tour ---------- */
#scrim { position: fixed; inset: 0; background: rgba(28, 16, 8, .45); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 80; }
#scrim.on { opacity: 1; pointer-events: auto; }
#modal { position: fixed; inset: 0; display: grid; place-items: center; padding: 1rem; z-index: 90; pointer-events: none; }
#modal.on { pointer-events: auto; }
.sheet {
  width: min(560px, 100%);
  max-height: calc(100vh - 2rem);
  overflow: auto;
  background: var(--card);
  border-radius: 18px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
  padding: 1.1rem 1.2rem 1.2rem;
  opacity: 0;
  transform: scale(.96) translateY(8px);
  transition: opacity .25s var(--ease), transform .3s var(--ease);
}
.sheet.wide { width: min(860px, 100%); }
#modal.on .sheet { opacity: 1; transform: none; }
.sheet .grab { display: none; }
.shead { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-bottom: .8rem; }
.shead h3 { margin: 0; }
.sfoot { display: flex; justify-content: flex-end; gap: .5rem; margin-top: 1.1rem; flex-wrap: wrap; }
.menu { position: fixed; z-index: 95; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); padding: .4rem; min-width: 260px; animation: pop .2s var(--ease) both; }
.menu button { display: flex; align-items: center; gap: .6rem; width: 100%; border: 0; background: transparent; padding: .55rem .7rem; border-radius: 10px; cursor: pointer; text-align: start; min-height: 40px; }
.menu button:hover, .menu button.on { background: var(--card-2); }
.menu button small { display: block; color: var(--muted); font-size: .76rem; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: .3rem 0; }
#toasts { position: fixed; bottom: 1rem; inset-inline-end: 1rem; z-index: 120; display: grid; gap: .5rem; }
.toast { display: flex; align-items: center; gap: .55rem; background: var(--umber-2); color: #f6ead6; padding: .7rem .95rem; border-radius: 12px; box-shadow: var(--shadow-lg); animation: fadeUp .3s var(--ease) both; max-width: 380px; font-size: .9rem; }
html[data-theme="dark"] .toast { background: #f2e7d7; color: #1b120c; }
.toast.ok .ic { color: #8cc77a; }
.toast.bad .ic { color: #f08a7d; }
.toast.out { animation: fadeIn .3s reverse forwards; }
.palette { position: fixed; inset: 0; z-index: 100; display: none; place-items: start center; padding: 10vh 1rem 1rem; background: rgba(28, 16, 8, .45); }
.palette.on { display: grid; animation: fadeIn .2s both; }
.palbox { width: min(620px, 100%); background: var(--card); border-radius: 16px; box-shadow: var(--shadow-lg); overflow: hidden; animation: pop .22s var(--ease) both; }
.palbox .inp { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; min-height: 54px; padding: 0 1rem; font-size: 1.05rem; }
.palres { max-height: 52vh; overflow: auto; padding: .4rem; }
.palres .pg { font-size: .72rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: .5rem .6rem .2rem; }
.palres button { display: flex; align-items: center; gap: .6rem; width: 100%; border: 0; background: transparent; border-radius: 10px; padding: .5rem .6rem; cursor: pointer; text-align: start; min-height: 40px; }
.palres button small { margin-inline-start: auto; color: var(--muted); font-size: .78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
.palres button.on { background: var(--aq1); }
.palhint { font-size: .76rem; color: var(--muted); padding: .55rem .9rem; border-top: 1px solid var(--line); }
#tip { position: fixed; z-index: 130; pointer-events: none; background: var(--umber-2); color: #f6ead6; font-size: .8rem; padding: .45rem .6rem; border-radius: 9px; box-shadow: var(--shadow-lg); opacity: 0; transition: opacity .12s; max-width: 260px; line-height: 1.45; }
html[data-theme="dark"] #tip { background: #f2e7d7; color: #1b120c; }
#tip.on { opacity: 1; }
#tip b { font-weight: 800; }
#tour { position: fixed; inset: 0; z-index: 110; display: none; }
#tour.on { display: block; }
#tourSpot { position: fixed; border-radius: 14px; box-shadow: 0 0 0 9999px rgba(20, 12, 6, .62); transition: all .35s var(--ease); pointer-events: none; outline: 3px solid var(--wheat); }
#tourTip { position: fixed; width: min(340px, calc(100vw - 32px)); background: var(--card); border-radius: 16px; padding: 1rem 1.1rem; box-shadow: var(--shadow-lg); animation: pop .25s var(--ease) both; }
#tourTip .tag { font-size: .74rem; font-weight: 800; color: var(--aq5); }
#tourTip h4 { margin: .2rem 0 .35rem; }
#tourTip p { font-size: .9rem; color: var(--ink-2); }
.dots { display: flex; gap: 5px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); }
.dots i.on { background: var(--aq5); width: 18px; border-radius: 4px; }

/* ---------- the twin: cross-section and plan view ---------- */
.twin { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 1rem; align-items: stretch; }
.xsec { position: relative; border-radius: 12px; overflow: hidden; background: linear-gradient(180deg, #cfe5f2, #eef5f2); border: 1px solid var(--line); }
html[data-theme="dark"] .xsec { background: linear-gradient(180deg, #0c1a28, #172636); }
.xsec svg { display: block; width: 100%; height: auto; }
.xsec .wt { stroke: #e9f6ff; stroke-width: 2.4; fill: none; stroke-dasharray: 10 6; animation: flow 1.6s linear infinite; }
.xsec .canalflow { stroke: #e4f3fb; stroke-width: 1.6; stroke-dasharray: 5 7; animation: flow 1s linear infinite; }
.xsec .drop { animation: rain 1.4s linear infinite; }
.xsec .wlabel { font: 700 10px var(--font); fill: #2a1d14; }
.xsec .axis text, .plan .axis text { font: 600 10px var(--font); fill: var(--muted); }
.xsec .tag { font: 800 11px var(--font); }
.xsec .ink { fill: #2a1d14; }
html[data-theme="dark"] .xsec .ink { fill: #e9dccb; }
.plan { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--card-2); touch-action: none; }
.plan canvas { display: block; width: 100%; height: auto; image-rendering: auto; }
.plan svg.ovl { position: absolute; inset: 0; width: 100%; height: 100%; }
.plan .contour { fill: none; stroke: rgba(42, 29, 20, .5); stroke-width: 1px; vector-effect: non-scaling-stroke; }
.plan .contour.major { stroke-width: 1.6px; stroke: rgba(42, 29, 20, .75); }
.plan .clabel { font: 800 .85px var(--font); fill: #2a1d14; paint-order: stroke; stroke: rgba(255, 255, 255, .9); stroke-width: .22px; }
.plan .well { stroke: #fff; stroke-width: 1.5px; vector-effect: non-scaling-stroke; cursor: help; }
.plan .well.risk { fill: #e2b44a; }
.plan .well.dry { fill: #b0332a; }
.plan .well.ok { fill: #2a1d14; }
.plan .well.mon { fill: #fff; stroke: #22608f; stroke-width: 2px; }
.plan .secline { stroke: #b0332a; stroke-width: 2.5px; stroke-dasharray: 7 5; fill: none; vector-effect: non-scaling-stroke; }
.plan .secend { fill: #b0332a; }
.plan .ring { fill: none; stroke: #b0332a; stroke-width: 2px; vector-effect: non-scaling-stroke; animation: pulse 1.6s ease-out infinite; }
.cscale { display: flex; align-items: center; gap: .5rem; font-size: .76rem; color: var(--muted); }
.cscale .grad { flex: 1; height: 10px; border-radius: 5px; border: 1px solid var(--line); min-width: 80px; }
.timebar { display: grid; grid-template-columns: auto 1fr auto; gap: .8rem; align-items: center; }
.timebar .when { font-family: var(--font-head); font-weight: 700; font-size: 1.15rem; min-width: 8.5rem; text-align: end; }
.timebar .track { position: relative; }
.timebar .bands { position: relative; height: 8px; border-radius: 4px; overflow: hidden; display: flex; margin-bottom: 2px; }
.timebar .bands i { display: block; height: 100%; }
.timebar .ticks { position: relative; height: 1.2rem; font-size: .7rem; color: var(--muted); }
.timebar .ticks span { position: absolute; top: 0; white-space: nowrap; transform: translateX(-50%); }
.timebar .ticks span[style^="left:0"] { transform: none; }
.timebar .ticks span[style^="right"] { transform: none; }
.timebar .ticks .today { font-weight: 800; color: var(--ink-2); }
.timebar .ticks .today::before { content: ""; position: absolute; left: 50%; top: -22px; height: 14px; border-left: 2px solid var(--ink-2); }
/* Time runs left to right in both languages, like the charts. */
.timebar .track, .range input[type="range"] { direction: ltr; }
.playbtn { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--aq5); color: #fff; display: grid; place-items: center; cursor: pointer; }
html[data-theme="dark"] .playbtn { color: #0d1b28; }

/* ---------- editor ---------- */
.editor { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); gap: 1rem; align-items: start; }
.tools { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; margin-bottom: .7rem; }
.swatches { display: flex; gap: .35rem; flex-wrap: wrap; }
.swatch { display: inline-flex; align-items: center; gap: .35rem; padding: .25rem .55rem; border-radius: 9px; border: 1px solid var(--line-2); background: var(--card); cursor: pointer; font-size: .8rem; font-weight: 700; min-height: 34px; }
.swatch i { width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(0, 0, 0, .15); }
.swatch.on { border-color: var(--aq5); box-shadow: 0 0 0 2px var(--aq2); }
.gridcanvas { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--line-2); cursor: crosshair; touch-action: none; background: var(--card-2); }
.gridcanvas canvas { display: block; width: 100%; height: auto; }
.inspector { font-size: .85rem; }
.inspector dl { display: grid; grid-template-columns: auto 1fr; gap: .2rem .8rem; margin: 0; }
.inspector dt { color: var(--muted); }
.inspector dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- charts ---------- */
.chart { width: 100%; overflow: visible; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .axis text { font: 600 11px var(--font); fill: var(--muted); }
.chart .axis .ttl { font-weight: 800; fill: var(--ink-2); }
.chart .zero { stroke: var(--line-2); }
.chart .band { fill: var(--aq1); opacity: .8; }
.chart .proj { fill: var(--card-2); }
.chart .lab { font: 700 11px var(--font); fill: var(--ink-2); }
.chart .hit { fill: transparent; cursor: crosshair; }
.chart .hit:hover { fill: rgba(130, 184, 217, .14); }
.chart .dot { stroke: var(--card); stroke-width: 2; }
.chart .outlier { fill: none; stroke: var(--danger); stroke-width: 2; }
.smalls { display: grid; gap: .8rem; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.smalls .card { padding: .8rem .9rem; }
.smalls h4 { font-size: .9rem; margin-bottom: .2rem; display: flex; align-items: center; gap: .4rem; }
.rmse-grid { display: grid; gap: 3px; }
.rmse-grid div { border-radius: 4px; font-size: .7rem; font-weight: 800; display: grid; place-items: center; min-height: 32px; color: #10202c; transition: background .3s; }
.rmse-grid div.best { outline: 3px solid var(--wheat); outline-offset: -1px; }
.rmse-grid div.cur { box-shadow: inset 0 0 0 2px #2a1d14; }
.rmse-grid .hd { background: transparent; color: var(--muted); }
.progress { height: 10px; border-radius: 5px; background: var(--card-2); border: 1px solid var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--aq4), var(--aq5)); transition: width .25s var(--ease); }
.sankey text { font: 700 11px var(--font); fill: var(--ink); }
.sankey text.v { font-weight: 600; fill: var(--muted); }
.sankey path { mix-blend-mode: multiply; transition: opacity .2s; }
html[data-theme="dark"] .sankey path { mix-blend-mode: screen; }
.sankey path:hover { opacity: .95; }
.kcmini { height: 54px; }

/* ---------- scenario and quota widgets ---------- */
.scen { display: grid; gap: .55rem; }
.scen .card { padding: .8rem .9rem; display: grid; gap: .45rem; }
.scen .top-row { display: flex; align-items: center; gap: .55rem; }
.scen .top-row b { flex: 1; }
.scen .swatchdot { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.rank td:first-child { font-weight: 800; }
.vote { display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: .5rem; padding: .5rem 0; border-bottom: 1px solid var(--line); }
.vote:last-child { border-bottom: 0; }
.vote .count { font-family: var(--font-head); font-size: 1.4rem; font-weight: 700; min-width: 2.5rem; text-align: center; }

/* ---------- meeting stage ---------- */
#stage { position: fixed; inset: 0; z-index: 105; background: #1b120c; color: #f6ead6; display: none; grid-template-rows: auto 1fr auto; }
#stage.on { display: grid; animation: fadeIn .3s both; }
#stage header, #stage footer { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .8rem 1.4rem; }
#stage .slide { padding: 1rem 3rem 1.5rem; display: grid; align-content: center; gap: 1.2rem; overflow: auto; animation: fadeUp .4s var(--ease) both; }
#stage h2 { color: #f6ead6; font-size: clamp(1.6rem, 3.4vw, 2.8rem); margin: 0; }
#stage .cap { font-size: clamp(1.05rem, 2vw, 1.5rem); color: #e2cfb3; max-width: 60ch; }
#stage .cap.ur { font-family: var(--font-ur); line-height: 2.1; direction: rtl; max-width: none; }
#stage .big { font-family: var(--font-head); font-size: clamp(2.4rem, 6vw, 4.6rem); font-weight: 700; color: #f0cf7d; line-height: 1.1; }
#stage .bigrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.2rem; }
#stage .bigrow > div { background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .1); border-radius: 18px; padding: 1.2rem; }
#stage .panel { background: #f7efe2; border-radius: 16px; padding: 1rem; color: #2a1d14; }
#stage .tbtn { color: #f6ead6; }
#stage .opt { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
#stage .opt > div { background: rgba(255, 255, 255, .06); border-radius: 16px; padding: 1rem; border: 1px solid rgba(255, 255, 255, .12); }
#stage .opt b { display: block; font-size: 1.15rem; }
#stage .votebig { display: grid; grid-template-columns: 1fr auto auto auto; gap: .8rem; align-items: center; background: rgba(255, 255, 255, .06); border-radius: 14px; padding: .7rem 1rem; }
#stage .votebig .count { font-family: var(--font-head); font-size: 2.2rem; color: #f0cf7d; min-width: 3rem; text-align: center; }
#stage .votebig button { width: 56px; height: 56px; border-radius: 50%; border: 0; background: #22608f; color: #fff; display: grid; place-items: center; cursor: pointer; }
#stage .votebig button.minus { background: rgba(255, 255, 255, .12); }
#stage .dots i { background: rgba(255, 255, 255, .25); }
#stage .dots i.on { background: #f0cf7d; }

/* ---------- learn and quiz ---------- */
.guide-grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.guide-card { text-align: start; cursor: pointer; border: 1px solid var(--line); }
.guide-card .gi { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--aq1); color: var(--aq5); margin-bottom: .6rem; }
.guide-card .gi .ic { width: 1.5rem; height: 1.5rem; }
.article { max-width: 760px; }
.article h3 { margin-top: 1.2rem; }
.article .ur { font-family: var(--font-ur); direction: rtl; line-height: 2.1; }
.qopt { display: flex; align-items: center; gap: .6rem; width: 100%; text-align: start; border: 1px solid var(--line-2); background: var(--card); padding: .65rem .8rem; border-radius: 12px; cursor: pointer; margin-top: .45rem; min-height: 44px; }
.qopt.right { border-color: var(--leaf); background: var(--leaf-soft); }
.qopt.wrong { border-color: var(--danger); background: var(--danger-soft); }
.schem svg { width: 100%; height: auto; display: block; }
.leafmap { height: 460px; border-radius: 12px; border: 1px solid var(--line); overflow: hidden; }

/* ---------- print ---------- */
#printArea { display: none; }
@media print {
  @page { size: A4; margin: 14mm; }
  body { background: #fff; color: #000; }
  body > *:not(#printArea) { display: none !important; }
  #printArea { display: block !important; font-family: var(--font); font-size: 11pt; color: #111; }
  #printArea h1 { font-family: var(--font-head); font-size: 18pt; margin: 0 0 4pt; }
  #printArea h2 { font-family: var(--font-head); font-size: 13pt; margin: 12pt 0 4pt; border-bottom: 1.5pt solid #5b3a29; padding-bottom: 2pt; }
  #printArea table { width: 100%; border-collapse: collapse; font-size: 9.5pt; margin: 4pt 0 8pt; }
  #printArea th, #printArea td { border: .6pt solid #999; padding: 3pt 5pt; text-align: left; }
  #printArea th { background: #f0e6d6; }
  #printArea .pmeta { color: #555; font-size: 9pt; }
  #printArea .pnote { font-size: 8.5pt; color: #444; border: .6pt dashed #999; padding: 5pt; margin-top: 10pt; }
  #printArea .ur { font-family: var(--font-ur); direction: rtl; }
  #printArea svg { max-width: 100%; }
  #printArea .sig { display: grid; grid-template-columns: 1fr 1fr; gap: 24pt; margin-top: 24pt; }
  #printArea .sig div { border-top: .8pt solid #333; padding-top: 3pt; font-size: 9pt; }
}

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .twin, .editor { grid-template-columns: 1fr; }
  .first-narrow { order: -1; }
  .cols.wide-left, .cols.wide-right, .cols.three { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  :root { --top-h: 56px; }
  .top { padding: 0 .6rem; gap: .35rem; }
  .brand .txt { display: none; }
  .brand .mark { width: 32px; height: 32px; }
  .vswitch { max-width: 170px; padding: .25rem .6rem; }
  .vswitch .fict, .runchip .lbl, .tbtn.hide-m { display: none; }
  .strata { display: none; }
  main#view { padding: 1rem 1rem calc(var(--tab-h) + 1.5rem); }
  .tabs {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    position: fixed;
    inset: auto 0 0 0;
    height: var(--tab-h);
    background: var(--card);
    border-top: 1px solid var(--line);
    z-index: 45;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabs a, .tabs button { display: grid; place-items: center; align-content: center; gap: 2px; border: 0; background: none; color: var(--muted); font-size: .7rem; font-weight: 700; text-decoration: none; cursor: pointer; position: relative; }
  .tabs .ic { width: 1.35rem; height: 1.35rem; }
  .tabs .on { color: var(--aq5); }
  .tabs .on::before { content: ""; position: absolute; top: 0; width: 34px; height: 3px; border-radius: 0 0 3px 3px; background: var(--aq4); }
  .cols.two { grid-template-columns: 1fr; }
  .phead h2 { font-size: 1.25rem; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .6rem; }
  .kpi { padding: .7rem .7rem .7rem 1.05rem; }
  .kpi .val { font-size: 1.35rem; }
  .card { padding: .9rem .9rem; }
  #modal { place-items: end center; padding: 0; }
  .sheet { width: 100%; border-radius: 20px 20px 0 0; max-height: 88vh; transform: translateY(40px); }
  .sheet .grab { display: block; width: 44px; height: 5px; border-radius: 3px; background: var(--line-2); margin: -.3rem auto .7rem; }
  #toasts { inset-inline: .75rem; bottom: calc(var(--tab-h) + .75rem); }
  .timebar { grid-template-columns: auto 1fr; }
  .timebar .when { grid-column: 1 / -1; text-align: start; order: -1; min-width: 0; }
  .timebar .ticks .lab { display: none; }
  #stage .slide { padding: .6rem 1rem 1rem; }
  #stage header, #stage footer { padding: .6rem .9rem; }
  .leafmap { height: 360px; }
}
</style>

// ---------- DOM + storage helpers ----------
const NS = 'zez.';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const store = {
  get(k, d) {
    try {
      const v = localStorage.getItem(NS + k);
      return v == null ? d : JSON.parse(v);
    } catch {
      return d;
    }
  },
  set(k, v) {
    try {
      localStorage.setItem(NS + k, JSON.stringify(v));
      return true;
    } catch {
      return false;
    }
  },
  del(k) {
    try {
      localStorage.removeItem(NS + k);
    } catch {
      /* storage blocked */
    }
  },
  keys() {
    const out = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith(NS)) out.push(k.slice(NS.length));
      }
    } catch {
      /* storage blocked */
    }
    return out;
  },
  bytes() {
    let n = 0;
    try {
      for (const k of this.keys()) n += k.length + (localStorage.getItem(NS + k) || '').length;
    } catch {
      /* storage blocked */
    }
    return n * 2;
  },
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = (p = '') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const now = () => Date.now();
const later = fn => setTimeout(fn, 0);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const sum = a => a.reduce((s, x) => s + x, 0);
const round = (v, d = 0) => Math.round(v * 10 ** d) / 10 ** d;

function debounce(fn, ms = 180) {
  let h = 0;
  return (...a) => {
    clearTimeout(h);
    h = setTimeout(() => fn(...a), ms);
  };
}

// Deterministic PRNG (mulberry32) so the seeded villages are identical on every machine.
function rng(seed) {
  return () => {
    seed |= 0;
    seed = (seed + 0x6d2b79f5) | 0;
    let x = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- statistics ----------
const mean = a => (a.length ? sum(a) / a.length : 0);

function median(a) {
  if (!a.length) return 0;
  const s = [...a].sort((x, y) => x - y);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

/** Median absolute deviation, scaled by 1.4826 so it estimates the standard deviation of normal data. */
const mad = a => {
  const m = median(a);
  return 1.4826 * median(a.map(x => Math.abs(x - m)));
};

/** Least-squares line y = a + b x. */
function linreg(xs, ys) {
  const mx = mean(xs);
  const my = mean(ys);
  let num = 0;
  let den = 0;
  xs.forEach((x, i) => {
    num += (x - mx) * (ys[i] - my);
    den += (x - mx) ** 2;
  });
  const b = den ? num / den : 0;
  return { a: my - b * mx, b };
}

/** Rupees in lakh and crore, the way village accounts are read. */
function fmtRs(v) {
  const a = Math.abs(v);
  const sign = v < 0 ? '−' : '';
  if (a >= 1e7) return `${sign}${t('rs')} ${fmtN(a / 1e7, 2)} ${t('crore')}`;
  if (a >= 1e5) return `${sign}${t('rs')} ${fmtN(a / 1e5, 1)} ${t('lakh')}`;
  return `${sign}${t('rs')} ${fmtN(a)}`;
}

function ago(ts) {
  const s = Math.round((now() - ts) / 1000);
  if (s < 60) return t('justNow');
  if (s < 3600) return t('minAgo', { n: Math.round(s / 60) });
  if (s < 86400) return t('hrAgo', { n: Math.round(s / 3600) });
  return t('daysAgo', { n: Math.round(s / 86400) });
}

// ---------- feedback: toast, aria-live, motion ----------
function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.setAttribute('role', 'status');
  el.innerHTML = ic(type === 'ok' ? 'check-circle' : type === 'bad' ? 'alert-circle' : 'info') + '<span></span>';
  el.lastChild.textContent = msg;
  $('#toasts').append(el);
  setTimeout(() => el.classList.add('out'), 2800);
  setTimeout(() => el.remove(), 3150);
}

const announce = msg => {
  $('#live').textContent = '';
  setTimeout(() => ($('#live').textContent = msg), 30);
};
const calm = () => document.documentElement.classList.contains('calm') || matchMedia('(prefers-reduced-motion: reduce)').matches;

function animateIn(root) {
  if (!root) return;
  root.classList.remove('enter');
  void root.offsetWidth;
  root.classList.add('enter');
  $$('.stagger', root).forEach(g => [...g.children].forEach((el, i) => el.style.setProperty('--i', Math.min(i, 14))));
  settle(root, true);
}

// Bars, counters and line draw-ins; animated on a fresh route, placed instantly on re-renders.
function settle(root, animate = false) {
  if (!root) return;
  requestAnimationFrame(() => $$('.bar > i[data-w], .progress > i[data-w]', root).forEach(b => (b.style.width = b.dataset.w + '%')));
  $$('[data-count]', root).forEach(el => {
    const d = Number(el.dataset.dec || 0);
    const fmt = v => fmtN(v, d);
    if (animate) countUp(el, Number(el.dataset.count), { fmt });
    else el.textContent = fmt(Number(el.dataset.count));
  });
  if (animate) $$('path[data-draw], polyline[data-draw]', root).forEach(drawPath);
}

function countUp(el, to, { dur = 700, fmt = v => Math.round(v).toLocaleString('en-PK') } = {}) {
  if (calm()) {
    el.textContent = fmt(to);
    return;
  }
  const t0 = performance.now();
  const step = ts => {
    const p = Math.min(1, (ts - t0) / dur);
    el.textContent = fmt(to * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function drawPath(p) {
  if (calm() || !p.getTotalLength) return;
  const L = p.getTotalLength();
  p.style.strokeDasharray = L;
  p.style.strokeDashoffset = L;
  p.getBoundingClientRect();
  p.style.transition = 'stroke-dashoffset .9s var(--ease)';
  p.style.strokeDashoffset = 0;
  setTimeout(() => {
    p.style.strokeDasharray = '';
    p.style.transition = '';
  }, 1000);
}

// ---------- tooltip: any element with data-tip shows it on hover or focus ----------
function bindTooltips() {
  const tip = $('#tip');
  const show = (el, x, y) => {
    tip.innerHTML = el.getAttribute('data-tip');
    tip.classList.add('on');
    const w = tip.offsetWidth;
    const h = tip.offsetHeight;
    tip.style.left = clamp(x + 14, 8, innerWidth - w - 8) + 'px';
    tip.style.top = clamp(y - h - 12, 8, innerHeight - h - 8) + 'px';
  };
  document.addEventListener('pointermove', e => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (el) show(el, e.clientX, e.clientY);
    else tip.classList.remove('on');
  });
  document.addEventListener('focusin', e => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (!el) return;
    const r = el.getBoundingClientRect();
    show(el, r.left + r.width / 2, r.top);
  });
  document.addEventListener('focusout', () => tip.classList.remove('on'));
}

// ---------- modal sheet ----------
let modalReturn = null;
let modalOnClose = null;

function sheetHead(title, icon = 'info') {
  return `<div class="shead"><h3 id="sheetTitle">${ic(icon)}<span>${title}</span></h3><button class="ibtn" type="button" data-close aria-label="${t('close')}">${ic('x')}</button></div>`;
}

function openModal(html, { wide = false, onClose = null } = {}) {
  closeMenu();
  if (!$('#modal').classList.contains('on')) modalReturn = document.activeElement;
  const sh = $('#sheet');
  sh.className = 'sheet' + (wide ? ' wide' : '');
  sh.innerHTML = '<div class="grab"></div>' + html;
  sh.scrollTop = 0;
  $('#scrim').classList.add('on');
  $('#modal').classList.add('on');
  modalOnClose = onClose;
  $$('[data-close]', sh).forEach(b => (b.onclick = closeModal));
  const first = sh.querySelector('[autofocus], input:not([type=hidden]):not([type=checkbox]):not([type=range]):not([type=file]), select, textarea');
  setTimeout(() => (first || sh.querySelector('.shead [data-close]') || sh).focus({ preventScroll: true }), 80);
  return sh;
}

function closeModal() {
  if (!$('#modal').classList.contains('on')) return;
  $('#modal').classList.remove('on');
  $('#scrim').classList.remove('on');
  const cb = modalOnClose;
  modalOnClose = null;
  if (cb) cb();
  if (modalReturn && document.contains(modalReturn)) modalReturn.focus({ preventScroll: true });
}
const modalOpen = () => $('#modal').classList.contains('on');

// Keep keyboard focus inside an open modal.
function trapFocus(e) {
  if (e.key !== 'Tab' || !modalOpen()) return;
  const f = $$('#sheet button, #sheet a[href], #sheet input, #sheet select, #sheet textarea').filter(el => !el.disabled && el.offsetParent);
  if (!f.length) return;
  const first = f[0];
  const last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault();
    last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
  }
}

function askConfirm(msg, { okText = t('confirm'), danger = false, icon = 'help' } = {}) {
  return new Promise(resolve => {
    let answered = false;
    const finish = v => {
      if (answered) return;
      answered = true;
      resolve(v);
    };
    const sh = openModal(`${sheetHead(t('areYouSure'), icon)}<p>${msg}</p>
      <div class="sfoot"><button class="btn ghost" type="button" data-close>${t('cancel')}</button>
      <button class="btn ${danger ? 'danger' : ''}" type="button" id="cfOk">${okText}</button></div>`, { onClose: () => finish(false) });
    $('#cfOk', sh).onclick = () => {
      finish(true);
      closeModal();
    };
  });
}

// ---------- dropdown menu anchored to a button ----------
let menuEl = null;

function openMenu(anchor, items) {
  closeMenu();
  menuEl = document.createElement('div');
  menuEl.className = 'menu';
  menuEl.setAttribute('role', 'menu');
  menuEl.innerHTML = items.map((it, i) => (it === '-' ? '<hr>' : `<button type="button" role="menuitem" data-i="${i}" class="${it.on ? 'on' : ''}">${ic(it.icon || 'chevron-right')}<span class="grow">${it.label}${it.sub ? `<small>${it.sub}</small>` : ''}</span>${it.on ? ic('check') : ''}</button>`)).join('');
  document.body.append(menuEl);
  const r = anchor.getBoundingClientRect();
  const w = menuEl.offsetWidth;
  menuEl.style.top = r.bottom + 6 + 'px';
  menuEl.style.left = clamp(lang === 'ur' ? r.right - w : r.left, 8, innerWidth - w - 8) + 'px';
  $$('[data-i]', menuEl).forEach(b => (b.onclick = () => {
    const it = items[Number(b.dataset.i)];
    closeMenu();
    it.run();
  }));
  setTimeout(() => ($('[data-i]', menuEl) || menuEl).focus(), 30);
  setTimeout(() => document.addEventListener('pointerdown', menuOutside), 0);
}

function menuOutside(e) {
  if (menuEl && !menuEl.contains(e.target)) closeMenu();
}

function closeMenu() {
  if (!menuEl) return false;
  menuEl.remove();
  menuEl = null;
  document.removeEventListener('pointerdown', menuOutside);
  return true;
}

// ---------- print, download, files ----------
function printDoc(html) {
  $('#printArea').innerHTML = html;
  window.print();
}

function downloadFile(name, text, mime = 'application/json') {
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function pickFile(accept, cb) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = accept;
  inp.onchange = () => inp.files[0] && inp.files[0].text().then(cb);
  inp.click();
}

// ---------- CSV ----------
function csvCell(v) {
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
const toCsv = rows => rows.map(r => r.map(csvCell).join(',')).join('\n');

/** Small RFC-4180 style parser: quoted cells, doubled quotes, CRLF. */
function parseCsv(text) {
  const rows = [];
  let row = [];
  let cell = '';
  let q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') {
        cell += '"';
        i++;
      } else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') {
      row.push(cell);
      cell = '';
    } else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell);
      if (row.some(x => x !== '')) rows.push(row);
      row = [];
      cell = '';
    } else cell += c;
  }
  row.push(cell);
  if (row.some(x => x !== '')) rows.push(row);
  return rows;
}

/** Weighted pick from [[value, weight], ...]. */
function pickWeighted(R, mix) {
  const total = mix.reduce((s, [, w]) => s + w, 0);
  let r = R() * total;
  for (const [v, w] of mix) {
    r -= w;
    if (r <= 0) return v;
  }
  return mix[mix.length - 1][0];
}

/** Grid layers: cell types, ground elevation, aquifer zones and initial-depth texture. */
function genGrid(def, R) {
  const n = NX * NY;
  const cells = new Array(n).fill(CT.field);
  const rect = ([x0, y0, x1, y1], t) => {
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) cells[y * NX + x] = t;
  };
  def.lines.forEach(l => rect(l.r, CT[l.t]));
  rect(def.abadi, CT.abadi);
  rect(def.pond, CT.pond);
  const ground = [];
  const zone = [];
  const dtwNoise = [];
  for (let i = 0; i < n; i++) {
    const x = i % NX;
    const y = Math.floor(i / NX);
    ground.push(Math.round((def.ground(x, y) + (R() - 0.5) * 0.4) * 100) / 100);
    zone.push(def.zoneOf(x, y));
    dtwNoise.push(Math.round((R() - 0.5) * 120) / 100);
  }
  return { cells, ground, zone, dtwNoise };
}

/** Fields: one per band block, owned by farmers in proportion to their land weight. */
function genFields(def, R, cells, farmers) {
  const parcel = new Array(NX * NY).fill(0);
  const fields = [];
  const owners = farmers.map(f => [f.id, f.w]);
  for (const [y0, y1] of def.yBands) {
    for (const [x0, x1] of def.xBands) {
      const own = [];
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (cells[y * NX + x] === CT.field) own.push(y * NX + x);
      if (own.length < 4) continue;
      const n = fields.length + 1;
      own.forEach(i => (parcel[i] = n));
      const rabi = pickWeighted(R, def.rabiMix);
      const kharif = rabi === 'sugarcane' ? 'sugarcane' : pickWeighted(R, def.kharifMix);
      const method = kharif === 'rice' && R() < 0.15 ? 'awd' : pickWeighted(R, def.methodMix);
      fields.push({ n, owner: pickWeighted(R, owners), rabi, kharif, method, canal: def.commanded(x0, y0), well: null, block: [x0, y0, x1, y1] });
    }
  }
  return { parcel, fields };
}

/** One tubewell record at a cell, with discharge and pump setting drawn from the village mix. */
function makeWell(def, R, v, f, cell, idx) {
  const type = pickWeighted(R, def.typeMix);
  const q = type === 'electric' ? 25 + R() * 7 : type === 'diesel' ? 20 + R() * 8 : 18 + R() * 9;
  const dtw = v.zones[v.zone[cell]].dtw0 + v.dtwNoise[cell];
  const pump = Math.round(dtw + 4 + R() * 10);
  return {
    id: 'TW-' + String(idx).padStart(2, '0'), owner: f.owner, cell, type, use: 'irr',
    hp: type === 'electric' ? (R() < 0.5 ? 20 : 25) : type === 'diesel' ? (R() < 0.6 ? 18 : 20) : (R() < 0.5 ? 15 : 20),
    q: Math.round(q * 10) / 10, pump, depth: pump + 25 + Math.round(R() * 35), built: 1998 + Math.floor(R() * 27), monitored: false,
  };
}

/** Tubewells: most fields have their own (large ones two); the rest buy water from the nearest. */
function genWells(def, R, v) {
  const wells = [];
  const ok = (i, f) => v.parcel[i] === f.n && !cellEdges(i, NX, NY).length;
  for (const f of v.fields) {
    const [x0, y0, x1, y1] = f.block;
    const size = v.parcel.filter(p => p === f.n).length;
    if (R() < def.wellProb) {
      const cell = [(y0 + 1) * NX + x0 + 1, y0 * NX + x0 + 1, (y0 + 1) * NX + x0].find(i => ok(i, f));
      if (cell != null) wells.push(makeWell(def, R, v, f, cell, wells.length + 1));
    }
    if (size >= 16 && R() < 0.55) {
      const cell = [(y1 - 1) * NX + x1 - 1, y1 * NX + x1 - 1, (y1 - 1) * NX + x1].find(i => ok(i, f));
      if (cell != null) wells.push(makeWell(def, R, v, f, cell, wells.length + 1));
    }
    const mine = wells.filter(w => v.parcel[w.cell] === f.n);
    if (mine.length) f.well = mine[0].id;
  }
  const step = Math.max(1, Math.floor(wells.length / 8));
  wells.forEach((w, i) => (w.monitored = i % step === Math.floor(step / 2) && i < 8 * step));
  def.piezos.forEach(([x, y], i) => {
    wells.push({ id: 'PZ-' + (i + 1), owner: 'committee', cell: y * NX + x, type: 'none', use: 'mon', hp: 0, q: 0, pump: 0, depth: 60, built: 2019, monitored: true });
  });
  for (const f of v.fields) {
    if (f.well) continue;
    const cells = v.parcel.map((p, i) => (p === f.n ? i : -1)).filter(i => i >= 0);
    const mine = wells.filter(w => w.use === 'irr' && w.owner === f.owner);
    const near = nearestWell(v, cells[0], mine) || nearestWell(v, cells[0], wells);
    const dist = near ? Math.abs((near.cell % NX) - (cells[0] % NX)) + Math.abs(Math.floor(near.cell / NX) - Math.floor(cells[0] / NX)) : 99;
    f.well = near && dist <= 12 ? near.id : nearestWell(v, cells[0], wells)?.id || null;
  }
  return wells;
}

/** A complete village object from its definition. */
function genVillage(def) {
  const R = rng(def.seed);
  const grid = genGrid(def, R);
  const farmers = def.farmers.map(([en, ur, w], i) => ({ id: def.id.slice(0, 2) + (i + 1), name: { en, ur }, w }));
  const v = {
    id: def.id, demo: true, fictional: true, name: { en: def.name[0], ur: def.name[1] }, district: def.district,
    lat: def.lat, lng: def.lng, nx: NX, ny: NY, cell: CELL_M, ...grid,
    zones: def.zones.map((z, i) => ({ id: i, name: { en: z.name[0], ur: z.name[1] }, sy: z.sy, t: z.t, base: z.base, dtw0: z.dtw0, color: z.color })),
    bounds: JSON.parse(JSON.stringify(def.bounds)),
    canal: { ...def.canal, supply: [...CANAL_SUPPLY] }, distry: { ...def.distry },
    pond: { rate: 0.01, months: [6, 7, 8] },
    params: { etExt: 3, unconfined: true, rainYears: [...def.rainYears] },
    calib: { sy: 1, t: 1 }, solver: { omega: 1.8, tol: 1e-5, maxIter: 2000 },
    farmers: farmers.map(({ id, name }) => ({ id, name })),
  };
  Object.assign(v, genFields(def, R, grid.cells, farmers));
  v.wells = genWells(def, R, v);
  v.fields.forEach(f => delete f.block);
  return v;
}

const gauss = R => {
  const u = Math.max(1e-9, R());
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * R());
};

/** Five years of monthly depth-to-water readings from a "true" model run plus noise and outliers. */
function seedReadings(v, truth, seed) {
  const mon = v.wells.filter(w => w.monitored);
  const run = simulate(v, { mult: truth, months: HIST_MONTHS, record: false, probe: mon.map(w => w.cell) });
  const R = rng(seed);
  const recorders = ['committee', 'owner', 'extension'];
  const out = [];
  run.steps.forEach((s, k) => {
    const y = calYear(k);
    const m = calMonth(k);
    mon.forEach((w, j) => {
      if (R() < 0.04) return;
      let noise = gauss(R) * 0.12;
      if (R() < 0.02) noise += (R() < 0.6 ? 1 : -1) * (1.6 + R() * 2.4);
      const depth = v.ground[w.cell] - s.probe[j] + noise;
      const day = 3 + Math.floor(R() * 22);
      out.push({
        id: `r${k}-${w.id}`, w: w.id, d: `${y}-${String(m + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`,
        v: Math.round(depth * 100) / 100, m: w.use === 'mon' ? 'logger' : R() < 0.75 ? 'tape' : 'sounder', r: pickWeighted(R, recorders.map((x, i) => [x, [5, 3, 2][i]])),
      });
    });
  });
  return out;
}

// ---------- climate and crop water demand (FAO-56 style, illustrative inputs) ----------

const deg2rad = d => (d * Math.PI) / 180;

/** Extraterrestrial radiation Ra in MJ m-2 day-1 for a latitude and day of year (FAO-56 eq. 21-25). */
function extraterrestrialRa(latDeg, doy) {
  const phi = deg2rad(latDeg);
  const dr = 1 + 0.033 * Math.cos((2 * Math.PI * doy) / 365);
  const dec = 0.409 * Math.sin((2 * Math.PI * doy) / 365 - 1.39);
  const ws = Math.acos(Math.max(-1, Math.min(1, -Math.tan(phi) * Math.tan(dec))));
  const gsc = 0.082;
  const term = ws * Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.sin(ws);
  return ((24 * 60) / Math.PI) * gsc * dr * term;
}

/** Hargreaves reference evapotranspiration in mm/day (FAO-56 eq. 52); Ra converted with 0.408. */
function hargreavesET0(tmax, tmin, raMJ) {
  const tmean = (tmax + tmin) / 2;
  const range = Math.max(0, tmax - tmin);
  return Math.max(0, 0.0023 * (tmean + 17.8) * Math.sqrt(range) * 0.408 * raMJ);
}

/** USDA Soil Conservation Service effective rainfall for a monthly total in mm. */
function effectiveRain(p) {
  if (p <= 0) return 0;
  if (p <= 250) return (p * (125 - 0.2 * p)) / 125;
  return 125 + 0.1 * p;
}

/** Monthly climate table for a district at a latitude: Ra, ET0 and effective rain per month. */
function climateTable(districtId, lat) {
  const d = DISTRICTS[districtId] || DISTRICTS.faisalabad;
  const latitude = lat ?? d.lat;
  return d.tmax.map((tmax, m) => {
    const tmin = d.tmin[m];
    const ra = extraterrestrialRa(latitude, MID_DOY[m]);
    const et0d = hargreavesET0(tmax, tmin, ra);
    return { m, tmax, tmin, ra, et0d, et0: et0d * MONTH_DAYS[m], rain: d.rain[m], peff: effectiveRain(d.rain[m]) };
  });
}

// ---------- crop coefficient curves ----------
const DOY0 = MONTH_DAYS.map((_, m) => MONTH_DAYS.slice(0, m).reduce((a, b) => a + b, 0));

/** Kc on each day of the stage sequence (initial, development, mid, late) of a crop. */
function kcOnSeasonDay(crop, d) {
  const [l1, l2, l3, l4] = crop.len;
  const [kIni, kMid, kEnd] = crop.kc;
  if (d < l1) return kIni;
  if (d < l1 + l2) return kIni + ((kMid - kIni) * (d - l1)) / l2;
  if (d < l1 + l2 + l3) return kMid;
  if (d < l1 + l2 + l3 + l4) return kMid + ((kEnd - kMid) * (d - l1 - l2 - l3)) / l4;
  return 0;
}

/** Stage name for a day of the season, used by the Kc chart and the field table. */
function stageOnSeasonDay(crop, d) {
  const [l1, l2, l3, l4] = crop.len;
  if (d < l1) return 'ini';
  if (d < l1 + l2) return 'dev';
  if (d < l1 + l2 + l3) return 'mid';
  if (d < l1 + l2 + l3 + l4) return 'late';
  return '';
}

const cropCache = new Map();

/** Daily Kc and ponded-day flags over a 365-day calendar year, wrapping across New Year. */
function cropDaily(cropId) {
  const key = cropId + JSON.stringify(CROPS[cropId]);
  if (cropCache.has(key)) return cropCache.get(key);
  const crop = CROPS[cropId];
  const kc = new Float32Array(365);
  const ponded = new Uint8Array(365);
  const total = crop.len.reduce((a, b) => a + b, 0);
  const sowDoy = DOY0[crop.sow[0]] + crop.sow[1] - 1;
  for (let d = 0; d < Math.min(total, 365); d++) {
    const doy = (sowDoy + d) % 365;
    kc[doy] = Math.max(kc[doy], kcOnSeasonDay(crop, d));
    if (crop.perc && d < crop.len[0] + crop.len[1] + crop.len[2]) ponded[doy] = 1;
  }
  const out = { kc, ponded, sowDoy, total };
  cropCache.set(key, out);
  return out;
}

/** Mean monthly Kc, ponded days per month and land preparation depth per month for one crop. */
function cropMonthly(cropId) {
  const crop = CROPS[cropId];
  const daily = cropDaily(cropId);
  const kc = [];
  const ponded = [];
  const prep = new Array(12).fill(0);
  for (let m = 0; m < 12; m++) {
    let s = 0;
    let p = 0;
    for (let d = DOY0[m]; d < DOY0[m] + MONTH_DAYS[m]; d++) {
      s += daily.kc[d];
      p += daily.ponded[d];
    }
    kc.push(s / MONTH_DAYS[m]);
    ponded.push(p);
  }
  if (crop.prep) prep[crop.sow[0]] = crop.prep;
  return { kc, ponded, prep };
}

/** Months in which a crop is in the ground (any Kc above zero). */
function cropMonthsActive(cropId) {
  return cropMonthly(cropId).kc.map(k => k > 0.01);
}

/** The crop occupying a field in a calendar month: kharif crops May-Oct, rabi crops Nov-Apr. */
function fieldCrops(f) {
  if (f.rabi === 'sugarcane' || f.kharif === 'sugarcane') return ['sugarcane'];
  return [f.rabi, f.kharif].filter(c => c && c !== 'fallow');
}

/** Monthly field coefficients: the larger Kc of overlapping crops, rice percolation and land prep. */
function fieldMonthlyCoeffs(f) {
  const kc = new Array(12).fill(0);
  const extra = new Array(12).fill(0);
  const method = METHODS[f.method] || METHODS.flood;
  for (const c of fieldCrops(f)) {
    const cm = cropMonthly(c);
    const crop = CROPS[c];
    const percCut = method.percCut || 0;
    for (let m = 0; m < 12; m++) {
      kc[m] = Math.max(kc[m], cm.kc[m]);
      if (crop.perc) extra[m] += crop.perc * cm.ponded[m] * (1 - percCut) + cm.prep[m];
    }
  }
  return { kc, extra, eff: method.eff };
}

/** Field water need in mm for one month: ETc minus effective rain, plus rice percolation and prep. */
function fieldNeedMm(coeffs, clim, m, rainFactor = 1) {
  const c = clim[m];
  const etc = coeffs.kc[m] * c.et0;
  if (etc <= 0 && coeffs.extra[m] <= 0) return { etc: 0, peff: 0, net: 0, need: 0 };
  const peff = Math.min(etc, effectiveRain(c.rain * rainFactor));
  const net = Math.max(0, etc - peff);
  return { etc, peff, net, need: net + coeffs.extra[m] };
}

/** Canal water reaching the field inlet in mm per month for a commanded field. */
function canalMmAtField(canal, m, factor = 1) {
  const q = (canal.allowance * CUSEC_LS) / 1000 / 1000;
  const vol = q * 86400 * MONTH_DAYS[m];
  const headMm = (vol / ACRE_M2) * 1000;
  return headMm * canal.supply[m] * canal.conv * factor;
}

/** Conveyance losses along watercourses in mm per month (they seep into the aquifer). */
function canalLossMm(canal, m, factor = 1) {
  const atField = canalMmAtField(canal, m, factor);
  return canal.conv > 0 ? (atField / canal.conv) * (1 - canal.conv) : 0;
}

// ---------- pumping energy ----------
const m3hOf = w => (w.q * 3600) / 1000;

/** Hours a well can run in a calendar month (power source, rotation rest days). */
function wellHoursCap(type, m, rotation = 0) {
  const perDay = type === 'solar' ? SOLAR_HOURS[m] * SOLAR_OVERSIZE : PUMP_TYPES[type]?.hours || 0;
  return perDay * MONTH_DAYS[m] * (1 - rotation);
}

/** Energy and cost to lift a volume through a total head (depth to water plus losses). */
function pumpingEnergy(type, volM3, liftM, prices) {
  const hydraulic = (volM3 * liftM) / 367;
  if (type === 'diesel') {
    const shaft = hydraulic / PUMP_TYPES.diesel.eta;
    const litres = shaft * DIESEL_L_PER_KWH;
    return { kwh: shaft, litres, cost: litres * prices.diesel };
  }
  const kwh = hydraulic / PUMP_TYPES[type].eta;
  const rate = type === 'solar' ? prices.solarOm : prices.electric;
  return { kwh, litres: 0, cost: kwh * rate };
}

// ---------- aquifer model: Sy dh/dt = d/dx(T dh/dx) + d/dy(T dh/dy) + R - Q ----------
// Block-centred finite differences on square cells, implicit (backward Euler) monthly steps,
// solved with successive over-relaxation. Canal cells leak like a MODFLOW river boundary,
// shallow water tables lose water to evapotranspiration, and edges are no-flow or constant head.

const IB_OFF = 0;
const IB_ACTIVE = 1;
const IB_CHD = -1;

/** Initial depth to water: zone values plus seeded texture, smoothed so zone edges do not step. */
function initialDepth(v) {
  const n = v.nx * v.ny;
  let d = new Float64Array(n);
  for (let i = 0; i < n; i++) d[i] = v.zones[v.zone[i]].dtw0 + (v.dtwNoise ? v.dtwNoise[i] : 0);
  // TODO(student): replace this smoothing with a steady-state spin-up: solve the flow equation with
  // Sy/dt = 0 under long-term average recharge and pumping, so initial heads are in balance with stresses.
  for (let pass = 0; pass < 4; pass++) d = boxBlur(d, v.nx, v.ny, i => v.cells[i] !== CT.off);
  return d;
}

/** 3 x 3 mean filter over cells accepted by keep(i). */
function boxBlur(a, nx, ny, keep) {
  const out = new Float64Array(a.length);
  for (let y = 0; y < ny; y++) {
    for (let x = 0; x < nx; x++) {
      const i = y * nx + x;
      let s = 0;
      let c = 0;
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const xx = x + dx;
          const yy = y + dy;
          if (xx < 0 || yy < 0 || xx >= nx || yy >= ny) continue;
          const j = yy * nx + xx;
          if (!keep(j)) continue;
          s += a[j];
          c++;
        }
      }
      out[i] = c ? s / c : a[i];
    }
  }
  return out;
}

/** Which grid edge(s) a cell touches: n, s, e, w. */
function cellEdges(i, nx, ny) {
  const x = i % nx;
  const y = Math.floor(i / nx);
  const e = [];
  if (y === 0) e.push('n');
  if (y === ny - 1) e.push('s');
  if (x === 0) e.push('w');
  if (x === nx - 1) e.push('e');
  return e;
}

/** Model arrays for a village under calibration multipliers (Sy and T scale factors). */
function buildSpec(v, mult = v.calib || { sy: 1, t: 1 }) {
  const nx = v.nx;
  const ny = v.ny;
  const n = nx * ny;
  const A = v.cell * v.cell;
  const spec = {
    nx, ny, n, A, dx: v.cell,
    ib: new Int8Array(n), sy: new Float64Array(n), T0: new Float64Array(n), K: new Float64Array(n),
    base: new Float64Array(n), zs: new Float64Array(n), h0: new Float64Array(n), trend: new Float64Array(n),
    rivC: new Float64Array(n), rivStage: new Float64Array(n), rivBot: new Float64Array(n),
    unconfined: v.params.unconfined !== false, etExt: v.params.etExt || 3,
  };
  const dtw = initialDepth(v);
  for (let i = 0; i < n; i++) {
    if (v.cells[i] === CT.off) continue;
    const z = v.zones[v.zone[i]];
    spec.ib[i] = IB_ACTIVE;
    spec.zs[i] = v.ground[i];
    spec.h0[i] = v.ground[i] - dtw[i];
    spec.base[i] = v.ground[i] - z.base;
    spec.sy[i] = z.sy * mult.sy;
    spec.T0[i] = z.t * mult.t;
    spec.K[i] = spec.T0[i] / Math.max(1, spec.h0[i] - spec.base[i]);
    const edges = cellEdges(i, nx, ny).filter(e => v.bounds[e].type === 'chd');
    if (edges.length) {
      spec.ib[i] = IB_CHD;
      spec.trend[i] = edges.reduce((s, e) => s + v.bounds[e].trend, 0) / edges.length;
    }
    const riv = v.cells[i] === CT.canal ? v.canal : v.cells[i] === CT.distry ? v.distry : null;
    if (riv) {
      spec.rivC[i] = riv.cond;
      spec.rivStage[i] = v.ground[i] + riv.stage;
      spec.rivBot[i] = v.ground[i] - riv.bed;
    }
  }
  return spec;
}

/** Synthetic uniform aquifer used by the verification tests (no village needed). */
function testSpec({ nx = 31, ny = 31, dx = 100, T = 1000, sy = 0.15, h0 = 100, base = 0, edges = 'chd', unconfined = false, tMap = null }) {
  const n = nx * ny;
  const spec = {
    nx, ny, n, A: dx * dx, dx,
    ib: new Int8Array(n).fill(IB_ACTIVE), sy: new Float64Array(n).fill(sy), T0: new Float64Array(n), K: new Float64Array(n),
    base: new Float64Array(n).fill(base), zs: new Float64Array(n).fill(h0 + 10), h0: new Float64Array(n).fill(h0), trend: new Float64Array(n),
    rivC: new Float64Array(n), rivStage: new Float64Array(n), rivBot: new Float64Array(n), unconfined, etExt: 0,
  };
  for (let i = 0; i < n; i++) {
    spec.T0[i] = tMap ? tMap(i % nx, Math.floor(i / nx)) : T;
    spec.K[i] = spec.T0[i] / Math.max(1, h0 - base);
    if (edges === 'chd' && cellEdges(i, nx, ny).length) spec.ib[i] = IB_CHD;
  }
  return spec;
}

/** Reusable typed-array workspace for one spec. */
function workspace(spec) {
  const n = spec.n;
  return {
    h: new Float64Array(n), T: new Float64Array(n),
    CE: new Float64Array(n), CW: new Float64Array(n), CN: new Float64Array(n), CS: new Float64Array(n),
  };
}

const harmonic = (a, b) => (a + b > 0 ? (2 * a * b) / (a + b) : 0);

/** Face conductances. Unconfined: T = K * saturated thickness, lagged to the start of the step. */
function conductances(spec, hOld, ws) {
  const { nx, ny, n, ib, T0, K, base, h0 } = spec;
  const T = ws.T;
  for (let i = 0; i < n; i++) {
    if (!ib[i]) {
      T[i] = 0;
      continue;
    }
    T[i] = spec.unconfined ? K[i] * Math.max(0.1 * (h0[i] - base[i]), hOld[i] - base[i]) : T0[i];
  }
  ws.CE.fill(0);
  ws.CW.fill(0);
  ws.CN.fill(0);
  ws.CS.fill(0);
  for (let y = 0; y < ny; y++) {
    for (let x = 0; x < nx; x++) {
      const i = y * nx + x;
      if (!ib[i]) continue;
      if (x < nx - 1 && ib[i + 1]) {
        const c = harmonic(T[i], T[i + 1]);
        ws.CE[i] = c;
        ws.CW[i + 1] = c;
      }
      if (y < ny - 1 && ib[i + nx]) {
        const c = harmonic(T[i], T[i + nx]);
        ws.CS[i] = c;
        ws.CN[i + nx] = c;
      }
    }
  }
}

/** Leakage (m3/day, + into aquifer) for a canal cell at head h: river-boundary formulation. */
function rivFlow(spec, i, h, on) {
  if (!on || !spec.rivC[i]) return 0;
  const hb = Math.max(h, spec.rivBot[i]);
  return spec.rivC[i] * (spec.rivStage[i] - hb);
}

/** Groundwater evapotranspiration (m3/day) from a shallow water table; linear to the extinction depth. */
function etFlow(spec, st, i, h) {
  const emax = st.etMax;
  if (!emax || !spec.etExt) return 0;
  const d = spec.zs[i] - h;
  if (d <= 0) return emax;
  if (d >= spec.etExt) return 0;
  return emax * (1 - d / spec.etExt);
}

/**
 * One implicit time step solved by SOR. st = { src: Float64Array m3/day (recharge - pumping),
 * etMax (m3/day per cell at the surface), rivOn, tYears (for constant-head trends) }.
 * Per active cell:  (Sy A/dt + sum C) h - sum C h_nb = Sy A/dt h_old + R A - Q (+ leakage - ET)
 */
function solveStep(spec, hOld, st, dt, solver, ws) {
  const { nx, n, ib, sy, A, h0, trend } = spec;
  const { CE, CW, CN, CS } = ws;
  const h = ws.h;
  conductances(spec, hOld, ws);
  const d0 = ws.d0 || (ws.d0 = new Float64Array(n));
  const r0 = ws.r0 || (ws.r0 = new Float64Array(n));
  const special = ws.special || (ws.special = new Uint8Array(n));
  for (let i = 0; i < n; i++) {
    h[i] = ib[i] === IB_CHD ? h0[i] + trend[i] * st.tYears : hOld[i];
    if (ib[i] !== IB_ACTIVE) continue;
    const sc = (sy[i] * A) / dt;
    d0[i] = sc + CE[i] + CW[i] + CN[i] + CS[i];
    r0[i] = sc * hOld[i] + st.src[i];
    const riv = st.rivOn && spec.rivC[i] > 0;
    const shallow = st.etMax > 0 && spec.etExt > 0 && spec.zs[i] - hOld[i] < spec.etExt + 5;
    special[i] = riv || shallow ? 1 : 0;
  }
  let it = 0;
  let maxd = Infinity;
  while (it < solver.maxIter && maxd > solver.tol) {
    maxd = 0;
    for (let i = 0; i < n; i++) {
      if (ib[i] !== IB_ACTIVE) continue;
      let diag = d0[i];
      let rhs = r0[i];
      if (CE[i]) rhs += CE[i] * h[i + 1];
      if (CW[i]) rhs += CW[i] * h[i - 1];
      if (CN[i]) rhs += CN[i] * h[i - nx];
      if (CS[i]) rhs += CS[i] * h[i + nx];
      if (special[i]) {
        const extra = headDependent(spec, st, i, h[i]);
        diag += extra.d;
        rhs += extra.r;
      }
      const dh = solver.omega * (rhs / diag - h[i]);
      h[i] += dh;
      const a = dh < 0 ? -dh : dh;
      if (a > maxd) maxd = a;
    }
    it++;
  }
  return { h: Float64Array.from(h), iters: it, converged: maxd <= solver.tol, maxd };
}

/** Linearised canal leakage and ET terms at the current iterate: diagonal and right-hand-side parts. */
function headDependent(spec, st, i, hi) {
  let d = 0;
  let r = 0;
  if (st.rivOn && spec.rivC[i]) {
    if (hi > spec.rivBot[i]) {
      d += spec.rivC[i];
      r += spec.rivC[i] * spec.rivStage[i];
    } else r += spec.rivC[i] * (spec.rivStage[i] - spec.rivBot[i]);
  }
  if (st.etMax && spec.etExt) {
    const depth = spec.zs[i] - hi;
    if (depth <= 0) r -= st.etMax;
    else if (depth < spec.etExt) {
      const e = st.etMax / spec.etExt;
      d += e;
      r += e * (spec.zs[i] - spec.etExt);
    }
  }
  return { d, r };
}

/** Volumetric water balance of the active cells over one step (m3). */
function budgetStep(spec, hOld, h, st, dt, ws) {
  const { nx, n, ib, sy, A } = spec;
  const inn = { storage: 0, rain: st.parts.rain * dt, ret: st.parts.ret * dt, wc: st.parts.wc * dt, pond: st.parts.pond * dt, canal: 0, chd: 0 };
  const out = { storage: 0, pump: st.parts.pump * dt, et: 0, canal: 0, chd: 0 };
  const nb = [[ws.CE, 1], [ws.CW, -1], [ws.CN, -nx], [ws.CS, nx]];
  for (let i = 0; i < n; i++) {
    if (ib[i] !== IB_ACTIVE) continue;
    const ds = sy[i] * A * (h[i] - hOld[i]);
    if (ds < 0) inn.storage -= ds;
    else out.storage += ds;
    const q = rivFlow(spec, i, h[i], st.rivOn) * dt;
    if (q > 0) inn.canal += q;
    else out.canal -= q;
    out.et += etFlow(spec, st, i, h[i]) * dt;
    for (const [C, off] of nb) {
      if (!C[i] || ib[i + off] !== IB_CHD) continue;
      const f = C[i] * (h[i + off] - h[i]) * dt;
      if (f > 0) inn.chd += f;
      else out.chd -= f;
    }
  }
  const IN = Object.values(inn).reduce((a, b) => a + b, 0);
  const OUT = Object.values(out).reduce((a, b) => a + b, 0);
  const err = IN + OUT > 0 ? (100 * (IN - OUT)) / ((IN + OUT) / 2) : 0;
  return { inn, out, IN, OUT, err };
}

// ---------- stresses (rain, canal, crops, wells, ponds) and the monthly simulation loop ----------

// Rain multipliers for the ten projection years (same sequence in every scenario, illustrative).
const PROJ_RAIN = [1, 0.9, 1.15, 0.85, 1.05, 1, 0.95, 1.1, 0.9, 1];
const DROUGHT_YEARS = [2, 3, 4];
const POND_CAPTURE_M3 = 30000;
const RAIN_THRESHOLD_MM = 25;

const DEFAULT_LEVERS = {
  riceToMaize: 0,
  solarShare: 0,
  solarOveruse: 0.25,
  quota: 0,
  quotaWell: null,
  rotation: 0,
  efficiency: 0,
  ponds: 0,
  drought: false,
  noStress: false,
  noPump: false,
};

/** Cells of every field, keyed by field number. */
function parcelsOf(v) {
  const map = new Map(v.fields.map(f => [f.n, []]));
  v.parcel.forEach((p, i) => {
    if (p && map.has(p) && v.cells[i] === CT.field) map.get(p).push(i);
  });
  return map;
}

/** Nearest irrigation well to a cell (used when a field has no well of its own). */
function nearestWell(v, cell, wells = v.wells) {
  const x = cell % v.nx;
  const y = Math.floor(cell / v.nx);
  let best = null;
  let bd = Infinity;
  for (const w of wells) {
    if (w.use !== 'irr') continue;
    const d = (w.cell % v.nx - x) ** 2 + (Math.floor(w.cell / v.nx) - y) ** 2;
    if (d < bd) {
      bd = d;
      best = w;
    }
  }
  return best;
}

/** Scenario levers applied to copies of the fields: crop switch and better irrigation methods. */
function leveredFields(v, lv, parcels) {
  const fields = v.fields.map(f => ({ ...f }));
  const area = f => (parcels.get(f.n) || []).length;
  if (lv.riceToMaize > 0) {
    const rice = fields.filter(f => f.kharif === 'rice');
    const target = rice.reduce((s, f) => s + area(f), 0) * lv.riceToMaize;
