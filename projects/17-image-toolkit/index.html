  document.documentElement.dataset.theme = mode;
}
darkQuery.addEventListener('change', () => {

});

// ---------- stage: zoom, before/after, pixel peek ----------
const ZOOMS = [0.25, 0.33, 0.5, 0.67, 0.75, 1, 1.5, 2, 3, 4];

function fitZoom() {
  const stage = $('#stage');
  const img = active();
  if (!img) return 1;
  const canvas = cur(img);
  const fit = Math.min((stage.clientWidth - 48) / canvas.width, (stage.clientHeight - 48) / canvas.height);
  return clamp(Math.floor(fit * 100) / 100, 0.05, 4);
}

function drawAfter(img, src) {
  const canvas = $('#cAfter');
  if (canvas.width !== src.width || canvas.height !== src.height) {
    canvas.width = src.width;
    canvas.height = src.height;
  }
  const x = canvas.getContext('2d');
  x.clearRect(0, 0, canvas.width, canvas.height);
  // JPEG export flattens alpha, so the preview does too
  if (pipe.format === 'image/jpeg' && hasAlpha(src)) {
    x.fillStyle = pipe.bg;
    x.fillRect(0, 0, canvas.width, canvas.height);
  }
  x.drawImage(src, 0, 0);
}

function drawBefore(img) {
  const canvas = $('#cBefore');
  if (S.beforeId === img.id) return;
  canvas.width = img.orig.width;
  canvas.height = img.orig.height;
  canvas.getContext('2d').drawImage(img.orig, 0, 0);
  S.beforeId = img.id;
}

function renderStage() {
  const img = active();
  if (!img) return;
  const src = cur(img);
  drawAfter(img, src);
  drawBefore(img);
  if (S.zoomFit) S.zoom = fitZoom();
  const W = Math.max(1, Math.round(src.width * S.zoom));
  const H = Math.max(1, Math.round(src.height * S.zoom));
  const frame = $('#frame');
  frame.style.width = W + 'px';
  frame.style.height = H + 'px';
  frame.classList.toggle('pix', S.zoom > 1.01);
  // the 'before' canvas keeps its own aspect, letterboxed inside the frame
  const beforeScale = Math.min(W / img.orig.width, H / img.orig.height);
  const bw = Math.round(img.orig.width * beforeScale);
  const bh = Math.round(img.orig.height * beforeScale);
  Object.assign($('#cBefore').style, { width: bw + 'px', height: bh + 'px', left: Math.round((W - bw) / 2) + 'px', top: Math.round((H - bh) / 2) + 'px' });
  $('#zoomv').textContent = Math.round(S.zoom * 100) + '%';
  const changed = src.width !== img.orig.width || src.height !== img.orig.height;
  $('#dims').innerHTML = `${src.width} × ${src.height} px${changed ? ` <span class="muted small">(from ${img.orig.width} × ${img.orig.height})</span>` : ''}`;
  $('#undoBtn').disabled = !img.history.length;
  $('#resetBtn').disabled = img.work === img.orig && !img.preview;
  applyCmp();
  renderCropBox();
}

function applyCmp() {
  const on = S.cmpOn && S.tool !== 'crop';
  const wrap = $('#beforeWrap');
  const handle = $('#cmp');
  wrap.classList.toggle('hidden', !on);
  handle.classList.toggle('hidden', !on);
  $('#afterTag').classList.toggle('hidden', !on);
  wrap.style.width = S.cmp * 100 + '%';
  handle.style.left = S.cmp * 100 + '%';
  handle.setAttribute('aria-valuenow', Math.round(S.cmp * 100));
  $('#cmpBtn').classList.toggle('on', S.cmpOn);
  $('#cmpBtn').setAttribute('aria-pressed', S.cmpOn);
}

function setZoom(zoom) {
  S.zoomFit = false;
  S.zoom = clamp(zoom, 0.25, 4);
  renderStage();
}

function zoomIn() {
  setZoom(ZOOMS.find(z => z > S.zoom + 0.001) || 4);
}

function zoomOut() {
  setZoom([...ZOOMS].reverse().find(z => z < S.zoom - 0.001) || 0.25);
}

function zoomToFit() {
  S.zoomFit = true;
  renderStage();
}

function toggleCompare() {
  S.cmpOn = !S.cmpOn;
  applyCmp();
}

function undo() {
  const img = active();
  if (!img || !img.history.length) return;
  img.work = img.history.pop();
  img.edits = Math.max(0, img.edits - 1);
  afterEdit(img);
  toast('Undone', '', 'undo');
}

function resetImage() {
  const img = active();
  if (!img) return;
  img.work = img.orig;
  img.history = [];
  img.edits = 0;
  afterEdit(img);
  logEvent('edit', `${img.name}: reset to the original pixels`, 'refresh');
  toast('Back to the original pixels', '', 'refresh');
}

function bindStage() {
  $('#zoomIn').onclick = zoomIn;
  $('#zoomOut').onclick = zoomOut;
  $('#zoomFit').onclick = zoomToFit;
  $('#cmpBtn').onclick = toggleCompare;
  $('#undoBtn').onclick = undo;
  $('#resetBtn').onclick = resetImage;
  window.addEventListener('resize', debounce(() => {
    if (S.images.length && S.zoomFit) renderStage();
    if (S.tourStep >= 0) positionTour();
  }, 150));
  bindCompareHandle();
  bindPixelPeek();
  bindCropBox();
}

function bindCompareHandle() {
  const handle = $('#cmp');
  let dragging = false;
  handle.addEventListener('pointerdown', event => {
    event.preventDefault();
    dragging = true;
    S.drag = true;
    handle.classList.add('drag');
    handle.setPointerCapture(event.pointerId);
  });
  handle.addEventListener('pointermove', event => {
    if (!dragging) return;
    const rect = $('#frame').getBoundingClientRect();
    S.cmp = clamp((event.clientX - rect.left) / rect.width, 0, 1);
    applyCmp();
  });
  const end = () => {
    dragging = false;
    S.drag = false;
    handle.classList.remove('drag');
  };
  handle.addEventListener('pointerup', end);
  handle.addEventListener('pointercancel', end);
  handle.addEventListener('keydown', event => {
    if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
    event.preventDefault();
    S.cmp = clamp(S.cmp + (event.key === 'ArrowLeft' ? -0.02 : 0.02), 0, 1);
    applyCmp();
  });
}

function bindPixelPeek() {
  const frame = $('#frame');
  const peek = $('#peek');
  const stage = $('#stage');
  frame.addEventListener('pointermove', event => {
    const img = active();
    if (!img || S.drag || event.target.closest('.cropbox, .cmp')) {
      peek.style.display = 'none';
      return;
    }
    const src = cur(img);
    const rect = frame.getBoundingClientRect();
    const ix = Math.floor((event.clientX - rect.left) / rect.width * src.width);
    const iy = Math.floor((event.clientY - rect.top) / rect.height * src.height);
    if (ix < 0 || iy < 0 || ix >= src.width || iy >= src.height) {
      peek.style.display = 'none';
      return;
    }
    const d = ctx2d(src).getImageData(ix, iy, 1, 1).data;
    const hex = '#' + [d[0], d[1], d[2]].map(v => v.toString(16).padStart(2, '0')).join('');
    peek.innerHTML = `<i style="background:rgba(${d[0]},${d[1]},${d[2]},${(d[3] / 255).toFixed(2)})"></i>${hex} · α ${d[3]}<br>rgb(${d[0]}, ${d[1]}, ${d[2]}) · x ${ix}, y ${iy}`;
    const stageRect = stage.getBoundingClientRect();
    let left = event.clientX - stageRect.left + stage.scrollLeft + 16;
    let top = event.clientY - stageRect.top + stage.scrollTop + 16;
    if (left + 190 > stage.scrollLeft + stageRect.width) left -= 210;
    if (top + 60 > stage.scrollTop + stageRect.height) top -= 76;
    peek.style.left = left + 'px';
    peek.style.top = top + 'px';
    peek.style.display = 'block';
  });
  frame.addEventListener('pointerleave', () => { peek.style.display = 'none'; });
}

// ---------- crop overlay ----------
function initCrop(img) {
  const w = img.work.width;
  const h = img.work.height;
  let cw = Math.round(w * 0.8);
  let ch = Math.round(h * 0.8);
  if (S.cropAspect) {
    if (cw / ch > S.cropAspect) cw = Math.round(ch * S.cropAspect);
    else ch = Math.round(cw / S.cropAspect);
  }
  S.crop = { x: Math.round((w - cw) / 2), y: Math.round((h - ch) / 2), w: cw, h: ch, base: img.work };
}

function renderCropBox() {
  const box = $('#cropbox');
  const shade = $('#cropShade');
  const img = active();
  const show = img && S.tool === 'crop' && !img.preview;
  box.classList.toggle('hidden', !show);
  shade.classList.toggle('hidden', !show);
  if (!show) return;
  if (!S.crop || S.crop.base !== img.work) initCrop(img);
  const c = S.crop;
  const z = S.zoom;
  const L = c.x * z;
  const T = c.y * z;
  const R = (c.x + c.w) * z;
  const B = (c.y + c.h) * z;
  box.style.left = L + 'px';
  box.style.top = T + 'px';
  box.style.width = c.w * z + 'px';
  box.style.height = c.h * z + 'px';
  box.classList.toggle('grid', S.cropGrid);
  // the dark surround is the shade's border; its content box is the crop window
  const FW = Math.max(1, Math.round(img.work.width * z));
  const FH = Math.max(1, Math.round(img.work.height * z));
  shade.style.width = Math.max(0, R - L) + 'px';
  shade.style.height = Math.max(0, B - T) + 'px';
  shade.style.borderWidth = `${Math.max(0, T)}px ${Math.max(0, FW - R)}px ${Math.max(0, FH - B)}px ${Math.max(0, L)}px`;
  $('#cropLbl').textContent = `${c.w} × ${c.h}`;
  ['x', 'y', 'w', 'h'].forEach(key => {
    const input = $('#cp_' + key);
    if (input && document.activeElement !== input) input.value = c[key];
  });
}

function applyAspectToDrag(handle, s, x1, y1, x2, y2, W, H, aspect) {
  let w = x2 - x1;
  let h = y2 - y1;
  const vertical = handle === 'n' || handle === 's';
  const horizontal = handle === 'e' || handle === 'w';
  if (vertical) w = h * aspect;
  else if (horizontal) h = w / aspect;
  else if (w / h > aspect) w = h * aspect;
  else h = w / aspect;
  if (handle.includes('w')) x1 = x2 - w;
  else x2 = x1 + w;
  if (handle.includes('n')) y1 = y2 - h;
  else y2 = y1 + h;
  if (vertical) {
    const cx = s.x + s.w / 2;
    x1 = cx - w / 2;
    x2 = cx + w / 2;
  }
  if (horizontal) {
    const cy = s.y + s.h / 2;
    y1 = cy - h / 2;
    y2 = cy + h / 2;
  }
  // a move that would leave the image keeps the previous box
  if (x1 < 0 || y1 < 0 || x2 > W || y2 > H || w < 8 || h < 8) return null;
  return { x1, y1, x2, y2 };
}

function cropDrag(handle, s, dx, dy, W, H, aspect) {
  if (handle === 'move') {
    return { x: Math.round(clamp(s.x + dx, 0, W - s.w)), y: Math.round(clamp(s.y + dy, 0, H - s.h)), w: s.w, h: s.h };
  }
  let x1 = s.x;
  let y1 = s.y;
  let x2 = s.x + s.w;
  let y2 = s.y + s.h;
  if (handle.includes('e')) x2 = clamp(x2 + dx, x1 + 8, W);
  if (handle.includes('w')) x1 = clamp(x1 + dx, 0, x2 - 8);
  if (handle.includes('s')) y2 = clamp(y2 + dy, y1 + 8, H);
  if (handle.includes('n')) y1 = clamp(y1 + dy, 0, y2 - 8);
  if (aspect) {
    const fitted = applyAspectToDrag(handle, s, x1, y1, x2, y2, W, H, aspect);
    if (!fitted) return s;
    ({ x1, y1, x2, y2 } = fitted);
  }
  return { x: Math.round(x1), y: Math.round(y1), w: Math.round(x2 - x1), h: Math.round(y2 - y1) };
}

function bindCropBox() {
  const box = $('#cropbox');
  let start = null;
  box.addEventListener('pointerdown', event => {
    const img = active();
    if (!img) return;
    event.preventDefault();
    event.stopPropagation();
    start = { handle: event.target.dataset.h || 'move', s: { ...S.crop }, px: event.clientX, py: event.clientY, W: img.work.width, H: img.work.height };
    S.drag = true;
    box.setPointerCapture(event.pointerId);
  });
  box.addEventListener('pointermove', event => {
    if (!start) return;
    const dx = (event.clientX - start.px) / S.zoom;
    const dy = (event.clientY - start.py) / S.zoom;
    const next = cropDrag(start.handle, start.s, dx, dy, start.W, start.H, S.cropAspect);
    S.crop = { ...S.crop, ...next };
    renderCropBox();
  });
  const end = () => {
    start = null;
    S.drag = false;
  };
  box.addEventListener('pointerup', end);
  box.addEventListener('pointercancel', end);
}

// Re-fit the current box around its centre for a new aspect
function setCropAspect(aspect) {
  S.cropAspect = aspect;
  const img = active();
  if (!img || !S.crop) return;
  const W = img.work.width;
  const H = img.work.height;
  const c = S.crop;
  if (aspect) {
    let w = c.w;
    let h = Math.round(w / aspect);
    if (h > H) {
      h = H;
      w = Math.round(h * aspect);
    }
    if (w > W) {
      w = W;
      h = Math.round(w / aspect);
    }
    const cx = c.x + c.w / 2;
    const cy = c.y + c.h / 2;
    S.crop = { ...c, w, h, x: Math.round(clamp(cx - w / 2, 0, W - w)), y: Math.round(clamp(cy - h / 2, 0, H - h)) };
  }
  renderCropBox();
}

function setCropField(key, raw) {
  const img = active();
  if (!img || !S.crop) return;
  const W = img.work.width;
  const H = img.work.height;
  const c = { ...S.crop };
  const value = Math.round(+raw || 0);
  if (key === 'x') c.x = clamp(value, 0, W - c.w);
  if (key === 'y') c.y = clamp(value, 0, H - c.h);
  if (key === 'w') {
    c.w = clamp(value, 8, W - c.x);
    if (S.cropAspect) c.h = clamp(Math.round(c.w / S.cropAspect), 8, H - c.y);
  }
  if (key === 'h') {
    c.h = clamp(value, 8, H - c.y);
    if (S.cropAspect) c.w = clamp(Math.round(c.h * S.cropAspect), 8, W - c.x);
  }
  S.crop = c;
  renderCropBox();
}

// ---------- edits: commit, estimate ----------
function commit(img, canvas, description) {
  img.history.push(img.work);
  if (img.history.length > 6) img.history.shift();
  img.work = canvas;
  img.edits++;
  if (description) logEvent('edit', `${img.name}: ${description}`, 'sliders');
  afterEdit(img);
}

function afterEdit(img) {
  img.preview = null;
  S.crop = null;
  S.adj = ADJ_DEFAULT();
  S.rotAngle = 0;
  S.zoomFit = true;
  renderFilm();
  renderStage();
  renderPanel();
  scheduleEstimate();
}

async function estimateNow() {
  const img = active();
  if (!img) return;
  const seq = ++S.est.seq;
  const pill = $('#estPill');
  if (pill) pill.innerHTML = ic('refresh', 'spin') + ' estimating…';
  const result = await exportBlob(cur(img));
  if (seq !== S.est.seq) return;
  const previous = S.est.size;
  S.est = { ...S.est, size: result.blob.size, quality: result.quality, hit: result.hit, id: img.id };
  updateEstimateUI(previous === null ? 0 : previous);
}
const scheduleEstimate = debounce(estimateNow, 260);

function savingsText(size, original) {
  const saved = pct(size, original);
  return { cls: saved > 0 ? 'ok' : 'warn', text: `${saved > 0 ? '−' : '+'}${Math.abs(saved)} %`, saved };
}

function suggestedShrink(size) {
  return Math.max(10, Math.floor(Math.sqrt(pipe.targetKB * 1024 / size) * 100 / 5) * 5);
}

function updateEstimateUI(previous) {
  const img = active();
  if (!img) return;
  const size = S.est.size;
  const s = savingsText(size, img.size);
  const pill = $('#estPill');
  if (pill) {
    pill.className = 'pill ' + s.cls;
    pill.innerHTML = `${ic('download')} ${fmtInfo(pipe.format)[1]} ≈ <b id="estPillV"></b> · ${s.text}`;
    countUp($('#estPillV'), size, { from: previous, dur: 500, fmt: fmtBytes });
  }
  countUp($('#exEst'), size, { from: previous, dur: 600, fmt: fmtBytes });
  countUp($('#cpEst'), size, { from: previous, dur: 600, fmt: fmtBytes });
  const save = $('#exSave');
  if (save) {
    save.className = 'pill ' + s.cls;
    save.textContent = s.text + (s.saved > 0 ? ' smaller' : ' larger');
  }
  const cpSave = $('#cpSave');
  if (cpSave) {
    cpSave.className = 'pill ' + s.cls;
    cpSave.textContent = s.text;
  }
  const q = $('#exQ');
  if (q) q.textContent = qualityLabel();
  const target = $('#tgResult');
  if (target && pipe.targetOn && pipe.format !== 'image/png') {
    target.innerHTML = S.est.hit
      ? `${ic('check-circle')} Quality <b>${S.est.quality}</b> gives <b>${fmtBytes(size)}</b> — under ${pipe.targetKB} KB.`
      : `${ic('alert')} Even quality 1 gives ${fmtBytes(size)}. Shrink to about <b>${suggestedShrink(size)} %</b> in Resize, then try again.`;
  }
  if (S.tool === 'check') renderCheckRows();
}

function qualityLabel() {
  if (pipe.format === 'image/png') return pipe.quantize ? '256 colours' : 'lossless';
  if (!pipe.targetOn) return `quality ${S.est.quality ?? pipe.quality}`;
  return `quality ${S.est.quality}${S.est.hit ? ` · under ${pipe.targetKB} KB` : ' · target not reachable'}`;
}

// ---------- filmstrip ----------
function thumbHtml(img) {
  const selected = S.selected.has(img.id);
  const edited = img.work !== img.orig;
  const gps = gpsOf(img.meta && img.meta.tags);
  const info = edited ? `${img.work.width}×${img.work.height} ←` : `${img.orig.width}×${img.orig.height} ·`;
  return `<div class="thumb ${img.id === S.active ? 'on' : ''} ${selected ? 'sel' : ''}" data-id="${img.id}" role="button" tabindex="0" aria-label="${esc(img.name)}, ${img.orig.width} by ${img.orig.height}, ${fmtBytes(img.size)}">
    <button class="pick" data-pick="${img.id}" aria-label="Select for batch" aria-pressed="${selected}">${selected ? ic('check') : ''}</button>
    ${gps ? `<span class="flag" title="Contains GPS location">${ic('map-pin')}</span>` : ''}
    <button class="rm" data-rm="${img.id}" aria-label="Remove image">${ic('x')}</button>
    <div class="pic"></div>
    <div class="nm" title="${esc(img.name)}">${esc(img.name)}</div>
    <div class="in">${info} ${fmtBytes(img.size)}</div>
  </div>`;
}

function renderFilm() {
  const film = $('#film');
  const total = S.images.reduce((sum, img) => sum + img.size, 0);
  const firstRender = S.filmCount !== S.images.length;
  S.filmCount = S.images.length;
  const plural = S.images.length === 1 ? '' : 's';
  film.innerHTML = `<div class="strip ${firstRender ? 'stagger' : ''}" id="strip">${S.images.map(thumbHtml).join('')}
      <button class="add" id="filmAdd" aria-label="Add more images">${ic('plus', 'lg')}<br>Add</button></div>
    <div class="side">
      <div><b>${S.images.length}</b> image${plural} · <b>${fmtBytes(total)}</b> · <b>${S.selected.size}</b> selected</div>
      <div class="rowf" style="justify-content:flex-end">
        <button class="btn sm ghost" id="selAll">Select all</button>
        <button class="btn sm ghost" id="selNone">None</button>
        <button class="btn sm danger" id="clearAll">${ic('trash')} Clear</button>
      </div>
      <div class="small">${ic('lock')} Images stay in memory only — never saved or uploaded.</div>
    </div>`;
  $$('.thumb', film).forEach(tile => {
    $('.pic', tile).append(byId(tile.dataset.id).thumb);
    tile.onclick = event => {
      if (event.target.closest('button')) return;
      activate(tile.dataset.id);
    };
    tile.onkeydown = event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        activate(tile.dataset.id);
      }
    };
  });
  $$('[data-pick]', film).forEach(button => {
    button.onclick = () => toggleSelected(button.dataset.pick);
  });
  $$('[data-rm]', film).forEach(button => {
    button.onclick = () => removeImage(button.dataset.rm);
  });
  $('#filmAdd').onclick = () => $('#fileInput').click();
  $('#selAll').onclick = () => {
    S.images.forEach(img => S.selected.add(img.id));
    renderFilm();
    renderPanel();
  };
  $('#selNone').onclick = () => {
    S.selected.clear();
    renderFilm();
    renderPanel();
  };
  $('#clearAll').onclick = clearAll;
  if (firstRender) animateIn(film);
}

function toggleSelected(id) {
  if (S.selected.has(id)) S.selected.delete(id);
  else S.selected.add(id);
  renderFilm();
  if (['batch', 'convert', 'check'].includes(S.tool)) renderPanel();
}

function clearAll() {
  if (settings.confirmClear && !confirm('Remove all images from the workspace? (They were never saved anywhere.)')) return;
  logEvent('system', `Cleared ${S.images.length} images from the workspace`, 'trash');
  S.images = [];
  S.selected.clear();
  S.est.size = null;
  render();
}

function activate(id) {
  if (id === S.active) return;
  const previous = active();
  if (previous) previous.preview = null;
  S.active = id;
  S.zoomFit = true;
  S.crop = null;
  S.adj = ADJ_DEFAULT();
  S.rotAngle = 0;
  S.est.size = null;
  renderStage();
  renderPanel();
  renderFilm();
  scheduleEstimate();
  animateIn($('#props'));
}

function stepActive(direction) {
  if (!S.images.length) return;
  const index = S.images.findIndex(img => img.id === S.active);
  const next = (index + direction + S.images.length) % S.images.length;
  activate(S.images[next].id);
}

function removeImage(id) {
  const img = byId(id);
  S.images = S.images.filter(item => item.id !== id);
  S.selected.delete(id);
  if (img) logEvent('system', `Removed ${img.name} from the workspace`, 'trash');
  if (S.active === id) {
    S.active = S.images[0] ? S.images[0].id : null;
    S.zoomFit = true;
    S.est.size = null;
  }
  render();
}

// ---------- panel framework ----------
function slider(id, label, value, min, max, step = 1, unit = '') {
  return `<div class="slider">
    <div class="lab"><span>${label}</span><b id="${id}_v">${value}${unit}</b></div>
    <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${value}" aria-label="${label}">
    <input type="number" id="${id}_n" min="${min}" max="${max}" step="${step}" value="${value}" aria-label="${label} value">
  </div>`;
}

function bindSlider(id, onInput, onChange, unit = '') {
  const range = $('#' + id);
  const number = $('#' + id + '_n');
  const label = $('#' + id + '_v');
  if (!range) return;
  const set = (raw, source) => {
    const value = clamp(+raw || 0, +range.min, +range.max);
    if (source !== range) range.value = value;
    if (source !== number) number.value = value;
    label.textContent = value + unit;
    onInput(value);
  };
  range.oninput = () => set(range.value, range);
  number.oninput = () => set(number.value, number);
  range.onchange = () => onChange && onChange(+range.value);
  number.onchange = range.onchange;
}

function seg(id, items, current) {
  const buttons = items.map(([key, label]) => `<button data-k="${key}" class="${current === key ? 'on' : ''}" aria-pressed="${current === key}">${label}</button>`);
  return `<div class="seg" id="${id}" role="group">${buttons.join('')}</div>`;
}

function bindSeg(id, handler) {
  $$(`#${id} button`).forEach(button => {
    button.onclick = () => handler(button.dataset.k);
  });
}

const PANELS = {
  resize: () => panelResize,
  crop: () => panelCrop,
  compress: () => panelCompress,
  convert: () => panelConvert,
  adjust: () => panelAdjust,
  rotate: () => panelRotate,
  stamp: () => panelStamp,
  metadata: () => panelMetadata,
  check: () => panelCheck,
  sheet: () => panelSheet,
  batch: () => panelBatch
};

function renderPanel() {
  const img = active();
  if (!img) return;
  const [, label, icon, hint] = TOOLS.find(t => t[0] === S.tool);
  const panel = PANELS[S.tool]()(img);
  $('#props').innerHTML = `<div class="ptitle">${ic(icon, 'lg')}<div><h2>${label}</h2><p>${hint}</p></div></div>
    <div class="body">${panel.html}</div>${exportCard(img)}`;
  if (panel.bind) panel.bind(img);
  bindExport();
  if (S.est.size != null && S.est.id === img.id) updateEstimateUI(S.est.size);
}

function exportCard(img) {
  const n = S.selected.size;
  const options = FORMATS.map(f => `<option value="${f[0]}" ${pipe.format === f[0] ? 'selected' : ''} ${support[f[0]] ? '' : 'disabled'}>${f[1]}${support[f[0]] ? '' : ' — not supported here'}</option>`);
  return `<div class="export">
    <div class="rowf" style="justify-content:space-between"><h4 style="margin:0">${ic('download')} Export</h4><span class="pill" title="The file is re-encoded from pixels: EXIF, GPS, XMP, ICC and comments are all gone.">${ic('shield-check')} metadata removed</span></div>
    <div class="rowf" style="margin-top:8px"><select id="exFmt" aria-label="Export format" style="flex:1">${options.join('')}</select><span class="small muted" id="exQ"></span></div>
    <div class="est"><div><div class="small muted">Estimated size</div><div class="big" id="exEst">…</div></div><div style="text-align:right"><div class="small muted">Original ${fmtBytes(img.size)}</div><span class="pill grey" id="exSave">…</span></div></div>
    <button class="btn block" id="exDl">${ic('download')} Download ${esc(outName(img, cur(img)))}</button>
    <button class="btn ghost block" id="exZip" style="margin-top:8px" ${n ? '' : 'disabled'}>${ic('archive')} ${n} selected as ZIP</button>
    <div class="links"><a href="#report">${ic('printer')} Session report</a><a href="#activity">${ic('bell')} Activity</a></div>
  </div>`;
}

function bindExport() {
  $('#exFmt').onchange = event => setFormat(event.target.value);
  $('#exDl').onclick = downloadActive;
  $('#exZip').onclick = () => runBatch({ resize: false });
}

function setFormat(format) {
  if (!support[format]) return;
  pipe.format = format;
  savePipe();
  renderPanel();
  renderStage();
  scheduleEstimate();
}

async function downloadActive() {
  const img = active();
  if (!img) return;
  const src = cur(img);
  const result = await exportBlob(src);
  const name = outName(img, src);
  saveBlob(result.blob, name);
  const saved = pct(result.blob.size, img.size);
  logEvent('export', `Downloaded ${name} (${fmtBytes(result.blob.size)}, ${saved > 0 ? '−' + saved + ' %' : 'larger'}) — metadata removed`, 'download');
  toast(`Saved ${fmtBytes(result.blob.size)} · ${saved > 0 ? '−' + saved + ' %' : 'larger than the original'} · metadata removed`, 'ok', 'shield-check');
}

// ---------- Resize ----------
function resizeTarget(img) {
  const r = pipe.resize;
  const w = img.work.width;
  const h = img.work.height;
  if (r.mode === 'pct') {
    return { w: Math.max(1, Math.round(w * r.pct / 100)), h: Math.max(1, Math.round(h * r.pct / 100)) };
  }
  if (r.fit === 'fit') {
    const scale = Math.min(r.w / w, r.h / h);
    return { w: Math.max(1, Math.round(w * scale)), h: Math.max(1, Math.round(h * scale)) };
  }
  return { w: r.w, h: r.h };
}

function presetHtml(preset) {
  const r = pipe.resize;
  return `<button class="preset ${r.preset === preset[0] ? 'on' : ''}" data-preset="${preset[0]}">
    <span><b>${preset[1]}</b><small>${preset[4]}</small></span>
    <span class="dim">${preset[2]}×${preset[3]}</span>
  </button>`;
}

function panelResize(img) {
  const r = pipe.resize;
  const w = img.work.width;
  const h = img.work.height;
  const out = resizeTarget(img);
  const pixelInputs = `<div class="cols" style="margin-top:6px">
      <div><label class="f" for="rzW">Width</label><input id="rzW" type="number" min="1" max="16384" value="${r.w}"></div>
      <div><label class="f" for="rzH">Height</label><input id="rzH" type="number" min="1" max="16384" value="${r.h}"></div>
    </div>
    <button class="chk ${r.lock ? 'on' : ''}" id="rzLock" aria-pressed="${r.lock}" style="margin-top:8px;width:100%">${ic(r.lock ? 'lock' : 'unlock')} Keep aspect ratio</button>`;
  const percentInput = `<div style="margin-top:8px">${slider('rzPct', 'Scale', r.pct, 1, 400, 1, ' %')}</div>`;
  const html = `<div class="sect">${seg('rzMode', [['px', 'Pixels'], ['pct', 'Percent']], r.mode)}
      ${r.mode === 'px' ? pixelInputs : percentInput}
      <h4 style="margin-top:12px">Fit</h4>${seg('rzFit', [['fit', 'Fit'], ['fill', 'Fill'], ['stretch', 'Stretch']], r.fit)}
      <p class="small muted" id="rzHint" style="margin:6px 0 0">${FIT_HINT[r.fit]}</p>
      <div class="readout" style="margin-top:8px"><span>Current</span><b>${w} × ${h}</b></div>
      <div class="readout"><span>Result</span><b id="rzOut">${out.w} × ${out.h}</b></div>
      <div class="readout"><span>At ${settings.dpi} dpi</span><b id="rzUnits">${unitsPair(out.w, out.h)}</b></div>
      <div class="actions"><button class="btn block" id="rzApply">${ic('maximize')} Apply resize</button></div>
    </div>
    <div class="sect"><h4>${ic('target')} Presets</h4><div class="presets">${PRESETS.map(presetHtml).join('')}</div></div>`;
  return { html, bind: bindResize };
}

function unitsPair(w, h) {
  if (settings.units === 'px') return `${(w / settings.dpi * 25.4).toFixed(1)} × ${(h / settings.dpi * 25.4).toFixed(1)} mm`;
  return `${fmtUnits(w)} × ${fmtUnits(h)}`;
}

function bindResize(img) {
  const r = pipe.resize;
  const w = img.work.width;
  const h = img.work.height;
  const refresh = () => {
    const out = resizeTarget(img);
    $('#rzOut').textContent = `${out.w} × ${out.h}`;
    $('#rzUnits').textContent = unitsPair(out.w, out.h);
  };
  bindSeg('rzMode', key => {
    r.mode = key;
    savePipe();
    renderPanel();
  });
  bindSeg('rzFit', key => {
    r.fit = key;
    savePipe();
    renderPanel();
  });
  const widthInput = $('#rzW');
  const heightInput = $('#rzH');
  if (widthInput) {
    widthInput.oninput = () => {
      r.w = clamp(+widthInput.value || 1, 1, 16384);
      if (r.lock) {
        r.h = Math.max(1, Math.round(r.w * h / w));
        heightInput.value = r.h;
      }
      r.preset = '';
      refresh();
    };
    heightInput.oninput = () => {
      r.h = clamp(+heightInput.value || 1, 1, 16384);
      if (r.lock) {
        r.w = Math.max(1, Math.round(r.h * w / h));
        widthInput.value = r.w;
      }
      r.preset = '';
      refresh();
    };
    widthInput.onchange = savePipe;
    heightInput.onchange = savePipe;
    $('#rzLock').onclick = () => {
      r.lock = !r.lock;
      if (r.lock) r.h = Math.max(1, Math.round(r.w * h / w));
      savePipe();
      renderPanel();
    };
  }
  bindSlider('rzPct', value => {
    r.pct = value;
    refresh();
  }, savePipe, ' %');
  $$('[data-preset]').forEach(button => {
    button.onclick = () => applyPreset(button.dataset.preset);
  });
  $('#rzApply').onclick = () => applyResize(img);
}

function applyPreset(id) {
  const preset = PRESETS.find(p => p[0] === id);
  if (!preset) return;
  Object.assign(pipe.resize, { mode: 'px', w: preset[2], h: preset[3], fit: preset[5], preset: preset[0], lock: false });
  savePipe();
  renderPanel();
  toast(`${preset[1]} — ${preset[2]} × ${preset[3]} px, ${preset[5]} mode`, '', 'target');
}

function applyResize(img) {
  const r = pipe.resize;
  const target = resizeTarget(img);
  const tw = r.mode === 'pct' ? target.w : r.w;
  const th = r.mode === 'pct' ? target.h : r.h;
  if (tw * th > 64e6) {
    toast('That is over 64 megapixels — too large for the canvas', 'bad', 'alert');
    return;
  }
  if (target.w === img.work.width && target.h === img.work.height) {
    toast('Already that size', '', 'info');
    return;
  }
  const fit = r.mode === 'pct' ? 'stretch' : r.fit;
  commit(img, resizeTo(img.work, tw, th, fit), `resized to ${tw} × ${th} (${fit})`);
  toast(`Resized to ${img.work.width} × ${img.work.height}`, 'ok', 'maximize');
}

async function findTargetQuality(img) {
  const button = $('#tgFind');
  button.disabled = true;
  button.innerHTML = ic('refresh', 'spin') + ' Searching…';
  const canvas = prepareExport(cur(img), pipe.format);
  const found = await findQuality(canvas, pipe.format, pipe.targetKB * 1024);
  const blob = await encode(canvas, pipe.format, found.quality);
  pipe.quality = found.quality;
  savePipe();
  renderPanel();
  const result = $('#tgResult');
  if (found.hit) {
    result.innerHTML = `${ic('check-circle')} Quality <b>${found.quality}</b> gives <b>${fmtBytes(blob.size)}</b> — under ${pipe.targetKB} KB.`;
    toast(`Quality ${found.quality} → ${fmtBytes(blob.size)}`, 'ok', 'zap');
  } else {
    result.innerHTML = `${ic('alert')} Even quality 1 gives ${fmtBytes(blob.size)}. Shrink to about <b>${suggestedShrink(blob.size)} %</b> in Resize, then try again.`;
    toast('Target not reachable by quality alone', 'bad', 'alert');
  }
  logEvent('edit', `${img.name}: searched quality for ≤ ${pipe.targetKB} KB → q${found.quality}, ${fmtBytes(blob.size)}`, 'zap');
  scheduleEstimate();
}

function drawHist(src) {
  const host = $('#hist');
  if (!host) return;
  const { H } = histogram(src);
  // log scale with the 99th percentile as the ceiling so a single spike does not flatten the rest
  const all = [...H[0], ...H[1], ...H[2]].sort((a, b) => a - b);
  const ceiling = Math.max(1, all[Math.floor(all.length * 0.99)]);
  const points = h => Array.from(h, (v, i) => `${(i / 255 * 256).toFixed(1)},${(100 - Math.log1p(Math.min(v, ceiling)) / Math.log1p(ceiling) * 96).toFixed(1)}`);
  const channels = [['#e53935', 0], ['#43a047', 1], ['#1e88e5', 2]];
  const fills = channels.map(([colour, i]) => `<path d="M0,100 L${points(H[i]).join(' L')} L256,100 Z" fill="${colour}" opacity=".16"/>`);
  const lines = channels.map(([colour, i]) => `<path class="ln" d="M${points(H[i]).join(' L')}" fill="none" stroke="${colour}" stroke-width="1.4" vector-effect="non-scaling-stroke"/>`);
  host.innerHTML = `<svg viewBox="0 0 256 100" preserveAspectRatio="none" aria-label="RGB histogram">${fills.join('')}${lines.join('')}</svg>`;
  $$('.ln', host).forEach(drawPath);
}

          <label class="chk ${stamp.tile ? 'on' : ''}"><input type="checkbox" id="stTile" ${stamp.tile ? 'checked' : ''}> Tile across the image</label>
          <div class="${stamp.tile ? '' : 'hidden'}" id="stGapWrap" style="margin-top:6px">${slider('stGap', 'Tile spacing', stamp.gap, 1, 6, 0.5, '×')}</div>

      <div class="actions"><button class="btn" id="stApply">${ic('stamp')} Apply stamp</button><button class="btn ghost" id="stCancel">Cancel</button></div>
      <p class="note accent">Pakistani banks, telcos and HR departments routinely ask for CNIC copies. A visible purpose + date stamp makes a leaked copy useless for anything else.</p>
    </div>`;
  return { html, bind: bindStamp };
}

function bindStamp(img) {
  const preview = debounce(() => {
    img.preview = stamp.text.trim() ? stampCanvas(img.work, stamp, img.name) : null;
    renderStage();
    scheduleEstimate();
  }, 60);
  const update = (patch) => {
    Object.assign(stamp, patch);
    saveStamp();
    preview();
  };
  $('#stText').oninput = event => update({ text: event.target.value });
  $$('[data-stamp-text]').forEach(chip => {

    };
  });
  bindSlider('stSize', value => update({ size: value }), null, ' %');
  bindSlider('stOpacity', value => update({ opacity: value }), null, ' %');
  bindSlider('stAngle', value => update({ angle: value }), null, '°');
  bindSlider('stGap', value => update({ gap: value }), null, '×');
  $('#stColor').oninput = event => update({ color: event.target.value });
  $$('[data-stamp-color]').forEach(chip => {
    chip.onclick = () => {
      $('#stColor').value = chip.dataset.stampColor;
      update({ color: chip.dataset.stampColor });
      $$('[data-stamp-color]').forEach(other => other.classList.toggle('on', other === chip));
    };
  });
  $('#stShadow').onchange = event => {
    event.target.closest('.chk').classList.toggle('on', event.target.checked);
    update({ shadow: event.target.checked });
  };
  $$('#stAnchor button').forEach(button => {
    button.onclick = () => {
      update({ anchor: +button.dataset.anchor });
      $$('#stAnchor button').forEach(other => other.classList.toggle('on', other === button));
    };
  });
  $('#stTile').onchange = event => {
    event.target.closest('.chk').classList.toggle('on', event.target.checked);
    $('#stGapWrap').classList.toggle('hidden', !event.target.checked);
    update({ tile: event.target.checked });
  };
  $('#stBatch').onchange = event => {
    pipe.batchStamp = event.target.checked;
    event.target.closest('.chk').classList.toggle('on', pipe.batchStamp);
    savePipe();
  };
  $('#stApply').onclick = () => {
    if (!img.preview) {
      toast('Type some stamp text first', '', 'stamp');
      return;
    }
    commit(img, img.preview, `stamped "${stamp.text.slice(0, 40)}"`);
    toast('Stamp applied', 'ok', 'stamp');
  };
  $('#stCancel').onclick = () => {
    img.preview = null;
    renderStage();
    scheduleEstimate();
  };
  preview();
}

// ---------- Metadata ----------
function fmtExifDate(value) {
  const m = /^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2})/.exec(String(value));
  return m ? `${m[3]}-${m[2]}-${m[1]} ${m[4]}:${m[5]}` : String(value);
}

function cameraName(tags) {
  if (tags.model && tags.make && tags.model.toLowerCase().startsWith(tags.make.toLowerCase())) return tags.model;
  return [tags.make, tags.model].filter(Boolean).join(' ');
}

function metadataRows(tags, gps) {
  const rows = [];
  if (!tags) return rows;
  if (tags.make || tags.model) rows.push(['Camera', cameraName(tags)]);
  if (tags.lens) rows.push(['Lens', tags.lens]);
  if (tags.dateOriginal || tags.dateTime) rows.push(['Taken', fmtExifDate(tags.dateOriginal || tags.dateTime)]);
  if (tags.exposure) rows.push(['Exposure', tags.exposure < 1 ? `1/${Math.round(1 / tags.exposure)} s` : `${tags.exposure} s`]);
  if (tags.fNumber) rows.push(['Aperture', `f/${+(+tags.fNumber).toFixed(1)}`]);
  if (tags.iso) rows.push(['ISO', tags.iso]);
  if (tags.focal) rows.push(['Focal length', `${+(+tags.focal).toFixed(1)} mm${tags.focal35 ? ` (${tags.focal35} mm eq.)` : ''}`]);
  if (tags.orientation) rows.push(['Orientation', `${tags.orientation} — ${ORIENT[tags.orientation] || 'unknown'}${tags.orientation > 1 ? ' · applied when loading' : ''}`]);
  if (tags.software) rows.push(['Software', tags.software]);
  if (tags.artist) rows.push(['Artist', tags.artist]);
  if (tags.copyright) rows.push(['Copyright', tags.copyright]);
  if (tags.pixelX) rows.push(['EXIF size', `${tags.pixelX} × ${tags.pixelY}`]);
  if (gps) rows.push(['GPS', `${gps.lat.toFixed(5)}, ${gps.lng.toFixed(5)}${tags.alt ? ` · ${Math.round(tags.alt)} m` : ''}`]);
  return rows;
}

function metadataBadges(meta, tags, gps, rows) {
  const badges = [];
  if (gps) badges.push(['bad', 'map-pin', 'Location embedded']);
  if (tags && (tags.make || tags.model)) badges.push(['warn', 'camera', 'Device identity']);
  if (!meta || (!rows.length && !meta.metaBytes)) badges.push(['ok', 'check-circle', 'No metadata found']);
  if (meta && meta.metaBytes) badges.push(['grey', 'file', fmtBytes(meta.metaBytes) + ' of metadata']);
  if (meta && meta.frames > 1) badges.push(['info', 'layers', `${meta.frames} frames — first frame loaded`]);
  return badges.map(([cls, icon, text]) => `<span class="pill ${cls}">${ic(icon)} ${text}</span>`).join('');
}

function panelMetadata(img) {
  const meta = img.meta;
  const tags = meta && meta.tags;
  const gps = gpsOf(tags);
  const rows = metadataRows(tags, gps);
  const texts = (meta && meta.texts) || [];
  const table = rows.length ? `<table class="meta" style="margin-top:10px">${rows.map(r => `<tr><td>${r[0]}</td><td>${esc(String(r[1]))}</td></tr>`).join('')}</table>` : '';
  const empty = rows.length ? '' : `<p class="small muted" style="margin:10px 0 0">${meta ? `No EXIF tags inside this ${meta.kind}.` : 'This format (BMP / AVIF) carries no metadata this toolkit reads.'}</p>`;
  const textBlock = texts.length ? `<div class="sect"><h4>Text chunks</h4>${texts.map(([k, v]) => `<div class="readout"><span>${esc(k)}</span><b style="white-space:normal">${esc(v)}</b></div>`).join('')}</div>` : '';
  const gpsBlock = gps ? `<a class="btn ghost block" style="margin-top:10px" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${gps.lat.toFixed(6)},${gps.lng.toFixed(6)}">${ic('map-pin')} Open location in Google Maps ${ic('external')}</a>
      <p class="note warn">Anyone who receives the original file can see exactly where it was taken.</p>` : '';
  const segments = meta && meta.segments.length ? `<div class="sect"><h4>Embedded blocks</h4>${meta.segments.map(s => `<div class="readout"><span>${esc(s.kind)}</span><b>${fmtBytes(s.bytes)}</b></div>`).join('')}</div>` : '';
  const html = `<div class="sect"><div class="chips">${metadataBadges(meta, tags, gps, rows)}</div>${table}${empty}${gpsBlock}</div>
    ${textBlock}${segments}
    <div class="sect"><p class="note ok" style="margin-top:0">${ic('shield-check')} Every export from this toolkit re-encodes pixels only, so <b>all</b> of this is removed — EXIF, GPS, XMP, ICC, IPTC, comments.</p>
      <button class="btn block dark" id="mdClean" style="margin-top:10px">${ic('shield-check')} Download clean copy</button>
    </div>`;
  return { html, bind: bindMetadata };
}

function bindMetadata(img) {
  $('#mdClean').onclick = async () => {
    const format = support[img.type] ? img.type : 'image/jpeg';
    const result = await exportBlob(img.work, format, 92, { targetOn: false, quantize: false });
    const name = outName(img, img.work, format).replace(/(\.[^.]+)$/, '-clean$1');
    saveBlob(result.blob, name);
    logEvent('export', `Downloaded clean copy ${name} (${fmtBytes(result.blob.size)}) — metadata removed`, 'shield-check');
    toast(`Clean copy saved — ${fmtBytes(result.blob.size)}, metadata removed`, 'ok', 'shield-check');
  };
}

// ---------- Check (portal requirements & compliance) ----------
function checkCompliance(img, req, estSize) {
  const canvas = cur(img);
  const rows = [];
  if (req.w && req.h) {
    const okDims = req.minOnly ? canvas.width >= req.w && canvas.height >= req.h : canvas.width === req.w && canvas.height === req.h;
    rows.push({ label: 'Dimensions', value: `${canvas.width} × ${canvas.height} px`, want: `${req.minOnly ? 'at least ' : 'exactly '}${req.w} × ${req.h}`, ok: okDims });
    const aspect = req.aspect || req.w / req.h;
    const okAspect = Math.abs(canvas.width / canvas.height - aspect) / aspect < 0.01;
    rows.push({ label: 'Aspect ratio', value: ratioText(canvas.width, canvas.height), want: ratioText(req.w, req.h), ok: okAspect });
  }
  if (req.maxKB) {
    rows.push({ label: 'File size', value: estSize == null ? 'estimating…' : fmtBytes(estSize), want: `≤ ${req.maxKB >= 1024 ? (req.maxKB / 1024).toFixed(0) + ' MB' : req.maxKB + ' KB'}`, ok: estSize == null ? null : estSize <= req.maxKB * 1024 });
  }
  if (req.formats && req.formats.length) {
    rows.push({ label: 'Format', value: fmtInfo(pipe.format)[1], want: req.formats.map(f => fmtInfo(f)[1]).join(' / '), ok: req.formats.includes(pipe.format) });
  }
  if (req.bg === 'white') {
    rows.push({ label: 'Background', value: hasAlpha(canvas) ? `transparent → ${pipe.bg}` : 'as photographed', want: 'plain white (check by eye)', ok: null });
  }
  return rows;
}

function checkRowHtml(row) {
  const state = row.ok === null ? 'na' : row.ok ? 'ok' : 'bad';
  const icon = row.ok === null ? 'eye' : row.ok ? 'check-circle' : 'alert';
  return `<div class="checkrow ${state}">${ic(icon)}<div><div>${row.label}<span class="want"> · needs ${esc(row.want)}</span></div></div><b>${esc(row.value)}</b></div>`;
}

function reqButtonHtml(req) {
  const dims = req.w ? `${req.minOnly ? '≥ ' : ''}${req.w}×${req.h}` : 'any size';
  const limit = req.maxKB ? ` · ≤ ${req.maxKB >= 1024 ? (req.maxKB / 1024).toFixed(0) + ' MB' : req.maxKB + ' KB'}` : '';
  return `<button class="preset ${S.reqId === req.id ? 'on' : ''}" data-req="${req.id}">
    <span><span class="org">${esc(req.org)}</span><b>${esc(req.name)}</b></span>
    <span class="dim">${dims}${limit}</span>
  </button>`;
}

function filteredReqs() {
  const query = S.reqQuery.trim().toLowerCase();
  return allReqs().filter(req => {
    const inGroup = query ? true : req.group === S.reqGroup;
    const matches = !query || `${req.org} ${req.name} ${req.note}`.toLowerCase().includes(query);
    return inGroup && matches;
  });
}

function panelCheck(img) {
  const req = allReqs().find(r => r.id === S.reqId);
  const groups = REQ_GROUPS.map(([id, label]) => `<button class="chip ${S.reqGroup === id && !S.reqQuery ? 'on' : ''}" data-group="${id}">${label}</button>`);
  const list = filteredReqs();
  const listHtml = list.length ? list.map(reqButtonHtml).join('') : `<p class="small muted">No rules match. Add your own below.</p>`;
  const estSize = S.est.id === img.id ? S.est.size : null;
  const detail = req ? `<div class="sect"><h4>${ic('checklist')} ${esc(req.name)} · ${esc(req.org)}</h4>
      <p class="small muted" style="margin:0 0 6px">${esc(req.note || '')} <em>Illustrative rule — verify on the portal.</em></p>
      <div id="checkRows">${checkCompliance(img, req, estSize).map(checkRowHtml).join('')}</div>
      <div class="actions"><button class="btn" id="ckFix">${ic('zap')} Make it comply</button><button class="btn ghost" id="ckAll" ${S.selected.size ? '' : 'disabled'}>${ic('layers')} Check ${S.selected.size} selected</button>${req.group === 'custom' ? `<button class="btn danger" id="ckDel">${ic('trash')} Delete rule</button>` : ''}</div>
      <div id="ckAllResult" class="results"></div>
    </div>` : `<div class="sect"><p class="note">Pick a portal rule above to see what passes and fails for <b>${esc(img.name)}</b>.</p></div>`;
  const html = `<div class="sect">
      <div class="rowf"><input type="search" id="ckSearch" placeholder="Search portals, e.g. NADRA, visa, HEC" value="${esc(S.reqQuery)}" aria-label="Search requirements" style="flex:1"></div>
      <div class="chips" style="margin-top:8px">${groups.join('')}</div>
      <div class="reqlist" style="margin-top:8px">${listHtml}</div>
    </div>
    ${detail}
    <div class="sect"><h4>${ic('plus')} Add my own rule</h4>
      <div class="cols two"><div><label class="f" for="nrName">Rule name</label><input id="nrName" type="text" placeholder="e.g. Scholarship portal photo"></div><div><label class="f" for="nrOrg">Organisation</label><input id="nrOrg" type="text" placeholder="e.g. PEEF"></div></div>
      <div class="cols" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div><label class="f" for="nrW">Width px</label><input id="nrW" type="number" min="1" placeholder="413"></div><div><label class="f" for="nrH">Height px</label><input id="nrH" type="number" min="1" placeholder="531"></div><div><label class="f" for="nrKB">Max KB</label><input id="nrKB" type="number" min="1" placeholder="200"></div></div>
      <div class="chips" style="margin-top:8px" id="nrFormats">${FORMATS.filter(f => support[f[0]]).map(f => `<button class="chip ${f[0] === 'image/jpeg' ? 'on' : ''}" data-nrf="${f[0]}">${f[1]}</button>`).join('')}</div>
      <label class="chk" style="margin-top:8px"><input type="checkbox" id="nrMin"> Dimensions are a minimum, not exact</label>
      <div class="actions"><button class="btn ghost block" id="nrAdd">${ic('plus')} Save rule</button></div>
    </div>`;
  return { html, bind: bindCheck };
}

function renderCheckRows() {
  const img = active();
  const host = $('#checkRows');
  const req = allReqs().find(r => r.id === S.reqId);
  if (!img || !host || !req) return;
  const estSize = S.est.id === img.id ? S.est.size : null;
  host.innerHTML = checkCompliance(img, req, estSize).map(checkRowHtml).join('');
}

function bindCheck(img) {
  const search = $('#ckSearch');
  search.oninput = debounce(() => {
    S.reqQuery = search.value;
    renderPanel();
    const next = $('#ckSearch');
    next.focus();
    next.setSelectionRange(next.value.length, next.value.length);
  }, 200);
  $$('[data-group]').forEach(chip => {
    chip.onclick = () => {
      S.reqGroup = chip.dataset.group;
      S.reqQuery = '';
      renderPanel();
    };
  });
  $$('[data-req]').forEach(button => {
    button.onclick = () => {
      S.reqId = button.dataset.req;
      store.set('reqId', S.reqId);
      renderPanel();
    };
  });
  const fix = $('#ckFix');
  if (fix) fix.onclick = () => makeComply(img);
  const all = $('#ckAll');
  if (all) all.onclick = () => checkAllSelected();
  const del = $('#ckDel');
  if (del) del.onclick = () => deleteCustomReq();
  $$('[data-nrf]').forEach(chip => {
    chip.onclick = () => chip.classList.toggle('on');
  });
  $('#nrAdd').onclick = addCustomReq;
}

function makeComply(img) {
  const req = allReqs().find(r => r.id === S.reqId);
  if (!req) return;
  const steps = [];
  if (req.w && req.h) {
    const already = req.minOnly ? img.work.width >= req.w && img.work.height >= req.h : img.work.width === req.w && img.work.height === req.h;
    Object.assign(pipe.resize, { mode: 'px', w: req.w, h: req.h, fit: 'fill', lock: false, preset: '' });
    if (!already) {
      img.history.push(img.work);
      img.work = resizeTo(img.work, req.w, req.h, 'fill');
      img.edits++;
      steps.push(`resized to ${req.w} × ${req.h}`);
    }
  }
  if (req.formats && req.formats.length) {
    const format = req.formats.find(f => support[f]) || pipe.format;
    if (format !== pipe.format) steps.push(`format → ${fmtInfo(format)[1]}`);
    pipe.format = format;
  }
  if (req.maxKB) {
    pipe.targetOn = pipe.format !== 'image/png';
    pipe.targetKB = req.maxKB;
    steps.push(`target ≤ ${req.maxKB} KB`);
  }
  savePipe();
  logEvent('edit', `${img.name}: applied rule "${req.name}" (${steps.join(', ') || 'already compliant'})`, 'checklist');
  toast(steps.length ? `Applied: ${steps.join(', ')}` : 'Already compliant with this rule', 'ok', 'checklist');
  afterEdit(img);
}

async function checkAllSelected() {
  const req = allReqs().find(r => r.id === S.reqId);
  const host = $('#ckAllResult');
  if (!req || !host) return;
  host.innerHTML = `<div class="small muted">${ic('refresh', 'spin')} Encoding ${S.selected.size} images…</div>`;
  const lines = [];
  for (const id of S.selected) {
    const img = byId(id);
    if (!img) continue;
    const result = await exportBlob(img.work);
    const rows = checkCompliance(img, req, result.blob.size);
    const failed = rows.filter(r => r.ok === false);
    lines.push(`<div class="r"><span class="nm">${esc(img.name)}</span><span class="pill ${failed.length ? 'bad' : 'ok'}">${failed.length ? `${failed.length} issue${failed.length > 1 ? 's' : ''}` : 'passes'}</span><span class="sz">${failed.length ? esc(failed.map(r => `${r.label}: ${r.value}`).join(' · ')) : 'All checks pass with the current export settings'}</span></div>`);
    await tick();
  }
  host.innerHTML = lines.join('');
  logEvent('system', `Checked ${lines.length} images against "${req.name}"`, 'checklist');
}

function addCustomReq() {
  const name = $('#nrName').value.trim();
  if (!name) {
    toast('Give the rule a name', 'bad', 'alert');
    return;
  }
  const formats = $$('#nrFormats .chip.on').map(chip => chip.dataset.nrf);
  const w = +$('#nrW').value || 0;
  const h = +$('#nrH').value || 0;
  const req = {
    id: 'custom-' + uid(),
    group: 'custom',
    org: $('#nrOrg').value.trim() || 'My rule',
    name,
    w: w && h ? w : undefined,
    h: w && h ? h : undefined,
    minOnly: $('#nrMin').checked,
    maxKB: +$('#nrKB').value || undefined,
    formats: formats.length ? formats : undefined,
    bg: 'any',
    note: 'Custom rule saved on this device.'
  };
  customReqs.push(req);
  saveCustomReqs();
  S.reqGroup = 'custom';
  S.reqQuery = '';
  S.reqId = req.id;
  store.set('reqId', S.reqId);
  logEvent('system', `Saved custom rule "${name}"`, 'checklist');
  toast('Rule saved', 'ok', 'check-circle');
  renderPanel();
}

function deleteCustomReq() {
  customReqs = customReqs.filter(r => r.id !== S.reqId);
  saveCustomReqs();
  S.reqId = '';
  store.set('reqId', '');
  renderPanel();
  toast('Rule deleted', '', 'trash');
}

// ---------- Sheet (print layout) ----------
function panelSheet(img) {
  const papers = PAPERS.map(p => [p[0], p[1]]);
  const presets = PRESETS.filter(p => p[5] === 'fill' && p[2] <= 709).map(p => `<option value="${p[0]}" ${sheet.preset === p[0] ? 'selected' : ''}>${p[1]} — ${p[2]}×${p[3]}</option>`);
  const html = `<div class="sect"><h4>Paper (300 dpi)</h4>${seg('shPaper', papers, sheet.paper)}
      <label class="f" for="shPreset">Photo size</label><select id="shPreset">${presets.join('')}</select>
      <div class="cols two" style="margin-top:4px">
        <div><label class="f" for="shCopies">Copies (0 = fill)</label><input id="shCopies" type="number" min="0" max="60" value="${sheet.copies}"></div>
        <div><label class="f" for="shGap">Gap (mm)</label><input id="shGap" type="number" min="0" max="20" step="0.5" value="${sheet.gapMm}"></div>
      </div>
      <label class="chk ${sheet.marks ? 'on' : ''}" style="margin-top:8px"><input type="checkbox" id="shMarks" ${sheet.marks ? 'checked' : ''}> Cut marks at every corner</label>
    </div>
    <div class="sect"><h4>Preview</h4><div class="sheetprev" id="shPrev"></div>
      <div class="readout" style="margin-top:8px"><span>Layout</span><b id="shInfo">…</b></div>
      <div class="actions"><button class="btn" id="shAdd">${ic('plus')} Add sheet to filmstrip</button><button class="btn ghost" id="shPrint">${ic('printer')} Print now</button></div>
      <p class="note">Photo shops print 4R at 300 dpi; a sheet of 8 passport photos usually costs less than a single studio print. Crop the face first (Crop → 35:45).</p>
    </div>`;
  return { html, bind: bindSheet };
}

function bindSheet(img) {
  let built = null;
  const rebuild = debounce(() => {
    built = buildSheet(img.work, sheet);
    const host = $('#shPrev');
    if (!host) return;
    const scale = Math.min(300 / built.width, 220 / built.height);
    const small = resample(built, Math.round(built.width * scale), Math.round(built.height * scale));
    host.innerHTML = '';
    host.append(small);
    $('#shInfo').textContent = `${built.copies} of ${built.capacity} photos · ${built.cols} × ${built.rows} grid · ${built.width} × ${built.height} px`;
  }, 80);
  const update = patch => {
    Object.assign(sheet, patch);
    saveSheet();
    rebuild();
  };
  bindSeg('shPaper', key => {
    update({ paper: key });
    $$('#shPaper button').forEach(button => button.classList.toggle('on', button.dataset.k === key));
  });
  $('#shPreset').onchange = event => update({ preset: event.target.value });
  $('#shCopies').oninput = event => update({ copies: clamp(+event.target.value || 0, 0, 60) });
  $('#shGap').oninput = event => update({ gapMm: clamp(+event.target.value || 0, 0, 20) });
  $('#shMarks').onchange = event => {
    event.target.closest('.chk').classList.toggle('on', event.target.checked);
    update({ marks: event.target.checked });
  };
  $('#shAdd').onclick = async () => {
    if (!built) built = buildSheet(img.work, sheet);
    const paper = PAPERS.find(p => p[0] === sheet.paper);
    await addCanvasAsImage(built, `${img.name.replace(/\.[^.]+$/, '')}-sheet-${sheet.paper}.png`);
    logEvent('edit', `Built a ${paper[1]} sheet with ${built.copies} copies of ${img.name}`, 'sheet');
    toast(`Sheet with ${built.copies} photos added to the filmstrip`, 'ok', 'sheet');
  };
  $('#shPrint').onclick = () => {
    if (!built) built = buildSheet(img.work, sheet);
    printCanvas(built);
    logEvent('export', `Printed a ${sheet.paper.toUpperCase()} sheet of ${img.name}`, 'printer');
  };
  rebuild();
}

// Turn a generated canvas into a filmstrip image (encoded once to learn its byte size)
async function addCanvasAsImage(canvas, name) {
  const blob = await encode(canvas, 'image/png');
  const img = {
    id: uid(),
    name,
    type: 'image/png',
    size: blob.size,
    orig: canvas,
    work: canvas,
    preview: null,
    history: [],
    meta: { kind: 'PNG', tags: null, segments: [], texts: [], metaBytes: 0 },
    thumb: makeThumb(canvas),
    edits: 0
  };
  S.images.push(img);
  S.selected.add(img.id);
  S.active = img.id;
  S.zoomFit = true;
  S.est.size = null;
  render();
}

function printCanvas(canvas) {
  const host = $('#printSheet');
  host.innerHTML = '';
  const image = new Image();
  image.alt = 'Print sheet';
  image.src = canvas.toDataURL('image/png');
  host.append(image);
  host.classList.remove('hidden');
  document.body.classList.add('print-sheet');
  const cleanup = () => {
    host.classList.add('hidden');
    document.body.classList.remove('print-sheet');
    window.removeEventListener('afterprint', cleanup);
  };
  window.addEventListener('afterprint', cleanup);
  image.onload = () => window.print();
  setTimeout(cleanup, 60000);
}

function batchCanvas(img, options) {
  let canvas = img.work;
  if (options.resize) {
    const r = pipe.resize;
    const target = resizeTarget(img);
    const tw = r.mode === 'pct' ? target.w : r.w;
    const th = r.mode === 'pct' ? target.h : r.h;
    canvas = resizeTo(canvas, tw, th, r.mode === 'pct' ? 'stretch' : r.fit);
  }
  if (options.stamp && stamp.text.trim()) canvas = stampCanvas(canvas, stamp, img.name);
  return canvas;
}

function updateBatchProgress() {
  const bar = $('#bzBar');
  if (bar) bar.style.width = S.batch.done / S.batch.total * 100 + '%';
  const status = $('#bzStatus');
  if (status) status.textContent = `Processing ${Math.min(S.batch.done + 1, S.batch.total)} of ${S.batch.total}…`;
}

async function runBatch(options = {}) {
  const ids = [...S.selected];
  if (!ids.length) {
    toast('Select at least one image in the filmstrip', 'bad', 'alert');
    return null;
  }
  if (S.tool !== 'batch') {
    S.tool = 'batch';
    store.set('tool', 'batch');
    if (location.hash !== '#batch') location.replace('#batch');
    renderRail();
  }
  const t0 = performance.now();
  S.batch = { running: true, done: 0, total: ids.length, items: [], before: 0, after: 0, ms: 0, options };
  renderPanel();
  for (const id of ids) {
    const img = byId(id);
    if (!img) continue;
    const canvas = batchCanvas(img, options);
    const result = await exportBlob(canvas);
    S.batch.items.push({ id, name: outName(img, canvas), blob: result.blob, before: img.size, after: result.blob.size, w: canvas.width, h: canvas.height, quality: result.quality });
    S.batch.before += img.size;
    S.batch.after += result.blob.size;
    S.batch.done++;
    updateBatchProgress();
    await tick();
  }
  S.batch.running = false;
  S.batch.ms = performance.now() - t0;
  renderPanel();
  logEvent('batch', `Batch of ${ids.length}: ${fmtBytes(S.batch.before)} → ${fmtBytes(S.batch.after)} (${pct(S.batch.after, S.batch.before)} % saved)`, 'layers');
  toast(`Batch done — ${fmtBytes(S.batch.before)} → ${fmtBytes(S.batch.after)}`, 'ok', 'check-circle');
  return S.batch;
}

async function downloadZip() {
  const b = S.batch;
  if (!b || !b.items.length) return null;
  const names = new Set();
  const files = [];
  for (const item of b.items) {
    let name = item.name;
    let counter = 2;
    while (names.has(name)) name = item.name.replace(/(\.[^.]+)$/, ` (${counter++})$1`);
    names.add(name);
    files.push({ name, data: new Uint8Array(await item.blob.arrayBuffer()) });
  }
  const zip = makeZip(files);
  const zipName = `image-toolkit-${today()}.zip`;
  saveBlob(zip, zipName);
  logEvent('export', `Downloaded ${zipName} — ${files.length} files, ${fmtBytes(zip.size)}`, 'archive');
  toast(`ZIP ready — ${files.length} files, ${fmtBytes(zip.size)}`, 'ok', 'archive');
  return zip;
}

async function fillReportEstimates(host) {
  let totalOut = 0;
  for (const img of S.images) {
    if (!isReportRoute()) return;
    const result = await exportBlob(img.work);
    totalOut += result.blob.size;
    const cell = $(`[data-out="${img.id}"]`, host);
    if (cell) cell.innerHTML = `${fmtBytes(result.blob.size)} <span class="muted small">(${pct(result.blob.size, img.size) >= 0 ? '−' : '+'}${Math.abs(pct(result.blob.size, img.size))} %)</span>`;
    await tick();
  }
  countUp($('#rpOut'), totalOut, { fmt: fmtBytes });
}

  const payload = { app: 'image-toolkit', version: 2, exported: new Date().toISOString(), settings, pipeline: pipe, stamp, sheet, requirements: customReqs };
  saveBlob(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }), `image-toolkit-settings-${today()}.json`);
  logEvent('export', 'Exported settings JSON', 'download');
}

async function importSettings(event) {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== 'image-toolkit') throw new Error('wrong app');
    settings = Object.assign({}, DEFAULT_SETTINGS, data.settings || {});
    if (data.pipeline) {
      pipe = Object.assign(PIPE_DEFAULT(), data.pipeline);
      pipe.resize = Object.assign(PIPE_DEFAULT().resize, data.pipeline.resize || {});
    }
    if (data.stamp) stamp = Object.assign(STAMP_DEFAULT(), data.stamp);
    if (data.sheet) sheet = Object.assign(SHEET_DEFAULT(), data.sheet);
    if (Array.isArray(data.requirements)) customReqs = data.requirements.filter(r => r && r.id && r.name);
    if (!support[pipe.format]) pipe.format = 'image/jpeg';
    saveSettings();
    savePipe();
    saveStamp();
    saveSheet();
    saveCustomReqs();
    applyTheme();
    openDrawer('settings');
    if (S.images.length) renderPanel();
    logEvent('system', `Imported settings from ${file.name}`, 'upload');
    toast('Settings imported', 'ok', 'check-circle');
  } catch {
    toast('That is not an Image Toolkit settings file', 'bad', 'alert');
  }
}

function resetSettings() {
  if (!confirm('Reset all preferences, custom rules and the activity log to defaults?')) return;
  ['settings', 'pipeline', 'tool', 'stamp', 'sheet', 'requirements', 'activity', 'tour', 'reqId'].forEach(store.del);
  settings = { ...DEFAULT_SETTINGS };
  pipe = PIPE_DEFAULT();
  stamp = STAMP_DEFAULT();
  sheet = SHEET_DEFAULT();
  customReqs = [];
  activity = [];
  renderBadge();
  applyTheme();
  openDrawer('settings');
  if (S.images.length) {
    renderPanel();
    scheduleEstimate();
  }
  toast('Preferences reset', 'ok', 'refresh');
}

const ACT_FILTERS = [['all', 'All'], ['edit', 'Edits'], ['export', 'Exports'], ['privacy', 'Privacy'], ['load', 'Loads'], ['batch', 'Batch'], ['system', 'System']];

function activityDay(iso) {
  const date = new Date(iso);
  const now = new Date();
  const dayDiff = Math.round((new Date(now.toDateString()) - new Date(date.toDateString())) / 86400000);
  if (dayDiff === 0) return 'Today';
  if (dayDiff === 1) return 'Yesterday';
  return date.toLocaleDateString('en-PK', { day: 'numeric', month: 'short', year: 'numeric' });
}

function activityHtml() {
  const filters = ACT_FILTERS.map(([id, label]) => `<button class="chip ${S.actFilter === id ? 'on' : ''}" data-act="${id}">${label}</button>`);
  const events = activity.filter(event => S.actFilter === 'all' || event.type === S.actFilter);
  let lastDay = '';
  const rows = events.map(event => {
    const day = activityDay(event.t);
    const separator = day !== lastDay ? `<div class="daysep">${day}</div>` : '';
    lastDay = day;
    const time = new Date(event.t).toLocaleTimeString('en-PK', { hour: '2-digit', minute: '2-digit' });
    return `${separator}<div class="act ${event.read ? '' : 'unread'} ${event.type}"><div class="ico">${ic(event.icon || 'info')}</div><div class="t">${esc(event.text)}</div><div class="when">${time}</div></div>`;
  });
  const empty = `<p class="note" style="margin-top:14px">${ic('bell')} Nothing yet. Load an image, apply an edit or export a file and it shows up here — including privacy warnings about GPS and camera identity.</p>`;
  return `<div class="rowf" style="justify-content:space-between"><div class="chips">${filters.join('')}</div></div>
    <div class="actions" style="margin-top:10px"><button class="btn sm ghost" id="acRead">${ic('check')} Mark all read</button><a class="btn sm ghost" href="#report">${ic('printer')} Session report</a><button class="btn sm danger" id="acClear">${ic('trash')} Clear log</button></div>
    <div class="list" style="gap:0;margin-top:6px">${rows.length ? rows.join('') : empty}</div>
    ${settings.logActivity ? '' : `<p class="note warn">${ic('alert')} Logging is switched off in Settings — new events are not recorded.</p>`}`;
}

function renderActivity() {
  $('#drawerBody').innerHTML = activityHtml();
  $$('[data-act]').forEach(chip => {
    chip.onclick = () => {
      S.actFilter = chip.dataset.act;
      renderActivity();
    };
  });
  $('#acRead').onclick = () => {
    markAllRead();
    renderActivity();
  };
  $('#acClear').onclick = () => {
    activity = [];
    store.set('activity', activity);
    renderBadge();
    renderActivity();
    toast('Activity log cleared', '', 'trash');
  };
}

function shortcutsHtml() {
  const rows = SHORTCUTS.map(([keys, action]) => `<tr><td>${keys.split(' / ').map(k => `<span class="kbd">${esc(k)}</span>`).join(' / ')}</td><td>${esc(action)}</td></tr>`);
  return `<p class="muted small" style="margin:0 0 10px">Shortcuts work when no text field is focused. Icon buttons show the key in their tooltip.</p>
    <table class="keys"><tbody>${rows.join('')}</tbody></table>
    <p class="note" style="margin-top:14px">${ic('lightbulb')} Tip: open Compress, press <span class="kbd">2</span> to check the crop, <span class="kbd">3</span> to come back — the estimate keeps updating.</p>`;
}

function openDrawer(kind) {
  const titles = { about: 'About this toolkit', settings: 'Settings', activity: 'Activity', shortcuts: 'Keyboard shortcuts' };
  $('#drawerTitle').textContent = titles[kind] || kind;
  if (kind === 'activity') {
    renderActivity();
  } else {
    const builders = { about: aboutHtml, settings: settingsHtml, shortcuts: shortcutsHtml };
    $('#drawerBody').innerHTML = builders[kind]();
    if (kind === 'settings') bindSettings();
    if (kind === 'about') bindAbout();
  }
  document.body.classList.add('drawer-open');
  $('#drawer').setAttribute('aria-hidden', 'false');
  animateIn($('#drawerBody'));
  setTimeout(() => $('#drawerClose').focus(), 60);
}

function closeDrawer(navigate = true) {
  if (!document.body.classList.contains('drawer-open')) return;
  const wasActivity = location.hash === '#activity';
  document.body.classList.remove('drawer-open');
  $('#drawer').setAttribute('aria-hidden', 'true');
  if (wasActivity) markAllRead();
  if (navigate && /^#(about|settings|activity|shortcuts)$/.test(location.hash)) location.hash = '#' + S.tool;
}

// ---------- onboarding tour ----------
async function startTour() {
  if (S.tourStep >= 0) return;
  if (!S.images.length) {
    toast('Loading sample images for the tour…', '', 'sparkles');
    await loadSamples();
  }
  if (location.hash !== '#' + S.tool) location.hash = '#' + S.tool;
  closeDrawer(false);
  document.body.classList.add('touring');
  S.tourStep = 0;
  showTourStep();
}

function tourTarget(step) {
  const el = $(step.target);
  if (!el) return null;
  return el.getBoundingClientRect();
}

function showTourStep() {
  const step = TOUR_STEPS[S.tourStep];
  if (!step) {
    endTour(true);
    return;
  }
  const target = $(step.target);
  if (target) target.scrollIntoView({ block: 'center', inline: 'nearest', behavior: 'instant' });
  const card = $('#tourCard');
  const dots = TOUR_STEPS.map((_, i) => `<i class="${i === S.tourStep ? 'on' : ''}"></i>`).join('');
  card.innerHTML = `<h3>${ic(step.icon)} ${esc(step.title)}</h3><p>${esc(step.text)}</p>
    <div class="foot"><div class="dots">${dots}</div><div class="rowf" style="gap:6px">
      <button class="btn sm ghost" id="tourSkip">Skip</button>
      ${S.tourStep > 0 ? `<button class="btn sm ghost" id="tourBack" aria-label="Back">${ic('chevron-left')}</button>` : ''}
      <button class="btn sm" id="tourNext">${S.tourStep === TOUR_STEPS.length - 1 ? 'Done' : 'Next'} ${ic('chevron-right')}</button>
    </div></div>`;
  card.classList.remove('hidden');
  $('#tourShade').classList.remove('hidden');
  $('#tourSkip').onclick = () => endTour(false);
  $('#tourNext').onclick = () => {
    S.tourStep++;
    showTourStep();
  };
  const back = $('#tourBack');
  if (back) back.onclick = () => {
    S.tourStep--;
    showTourStep();
  };
  positionTour();
  $('#tourNext').focus();
}

function positionTour() {
  const step = TOUR_STEPS[S.tourStep];
  if (!step) return;
  const rect = tourTarget(step) || { left: innerWidth / 2 - 10, top: innerHeight / 2 - 10, width: 20, height: 20, right: innerWidth / 2 + 10, bottom: innerHeight / 2 + 10 };
  const pad = 8;
  const shade = $('#tourShade');
  const left = Math.max(0, rect.left - pad);
  const top = Math.max(0, rect.top - pad);
  const right = Math.min(innerWidth, rect.right + pad);
  const bottom = Math.min(innerHeight, rect.bottom + pad);
  shade.style.width = Math.max(0, right - left) + 'px';
  shade.style.height = Math.max(0, bottom - top) + 'px';
  shade.style.borderWidth = `${top}px ${Math.max(0, innerWidth - right)}px ${Math.max(0, innerHeight - bottom)}px ${left}px`;
  const card = $('#tourCard');
  const cw = card.offsetWidth;
  const ch = card.offsetHeight;
  let cardLeft = right + 14;
  let cardTop = top;
  if (cardLeft + cw > innerWidth - 12) {
    cardLeft = clamp(left, 12, innerWidth - cw - 12);
    cardTop = bottom + 14;
    if (cardTop + ch > innerHeight - 12) cardTop = Math.max(12, top - ch - 14);
  }
  card.style.left = clamp(cardLeft, 12, innerWidth - cw - 12) + 'px';
  card.style.top = clamp(cardTop, 12, innerHeight - ch - 12) + 'px';
}

function endTour(completed) {
  S.tourStep = -1;
  $('#tourCard').classList.add('hidden');
  $('#tourShade').classList.add('hidden');
  document.body.classList.remove('touring');
  store.set('tour', { done: true, completed, at: new Date().toISOString() });
  if (completed) {
    logEvent('system', 'Finished the onboarding tour', 'play');
    toast('Tour finished — press ? any time for shortcuts', 'ok', 'check-circle');
  }
}

// ---------- keyboard shortcuts ----------
function isTypingTarget(target) {
  return target && (target.closest('input, textarea, select, [contenteditable]'));
}

function handleKey(event) {
  if (event.key === 'Escape') {
    if (S.tourStep >= 0) endTour(false);
    closeDrawer();
    return;
  }
  if (isTypingTarget(event.target)) return;
  const meta = event.ctrlKey || event.metaKey;
  if (meta && event.key.toLowerCase() === 'z') {
    event.preventDefault();
    undo();
    return;
  }
  if (meta && event.key.toLowerCase() === 's') {
    event.preventDefault();
    if (active()) downloadActive();
    return;
  }
  if (meta || event.altKey) return;
  if (event.key === '?') {
    location.hash = location.hash === '#shortcuts' ? '#' + S.tool : '#shortcuts';
    return;
  }
  if (document.body.classList.contains('drawer-open') || S.tourStep >= 0) return;
  if (/^[0-9]$/.test(event.key)) {
    const index = event.key === '0' ? 9 : +event.key - 1;
    if (TOOLS[index] && S.images.length) location.hash = '#' + TOOLS[index][0];
    return;
  }
  if (!S.images.length) return;
  const actions = {
    '+': zoomIn, '=': zoomIn, '-': zoomOut, '_': zoomOut,
    f: zoomToFit, F: zoomToFit, c: toggleCompare, C: toggleCompare,
    '[': () => stepActive(-1), ']': () => stepActive(1),
    ' ': () => toggleSelected(S.active),
    Delete: () => removeImage(S.active), Backspace: () => removeImage(S.active),
    a: () => { location.hash = '#activity'; }, A: () => { location.hash = '#activity'; }
  };
  const action = actions[event.key];
  if (action) {
    event.preventDefault();
    action();
  }
}

// ---------- router & boot ----------
const DRAWER_ROUTES = ['about', 'settings', 'activity', 'shortcuts'];

function route() {
  const hash = location.hash.slice(1);
  if (DRAWER_ROUTES.includes(hash)) {
    openDrawer(hash);
    return;
  }
  closeDrawer(false);
  if (hash === 'report') {
    document.body.classList.add('report-mode');
    $('#empty').classList.add('hidden');
    $('#ws').classList.add('hidden');
    $('#reportView').classList.remove('hidden');
    window.scrollTo(0, 0);
    renderReport();
    return;
  }
  document.body.classList.remove('report-mode');
  $('#reportView').classList.add('hidden');
  if (!TOOLS.some(t => t[0] === hash)) {
    location.replace('#' + S.tool);
    return;
  }
  if (hash !== S.tool) {
    S.tool = hash;
    store.set('tool', hash);
    const img = active();
    if (img) {
      img.preview = null;
      S.adj = ADJ_DEFAULT();
      S.rotAngle = 0;
    }
  }
  $('#empty').classList.toggle('hidden', S.images.length > 0);
  $('#ws').classList.toggle('hidden', S.images.length === 0);
  if (S.images.length) {
    renderRail();
    renderStage();
    renderPanel();
    animateIn($('#props'));
    scheduleEstimate();
  }
}

function renderEmptyState() {
  const formats = [['JPEG', true], ['PNG', true], ['WebP', support['image/webp']], ['GIF · first frame', true], ['BMP', true], ['AVIF · if your browser decodes it', true]];
  $('#formats').innerHTML = formats.map(([name, ok]) => `<span class="${ok ? '' : 'no'}">${name}</span>`).join('');
  $('#featTiles').innerHTML = FEATURES.map(([icon, title, text]) => `<div class="tile">${ic(icon, 'lg')}<b>${title}</b><span class="small muted">${text}</span></div>`).join('');
}

function boot() {
  applyTheme();
  renderEmptyState();
  renderBadge();
  bindInput();
  bindStage();
  $('#scrim').onclick = () => closeDrawer();
  $('#drawerClose').onclick = () => closeDrawer();
  document.addEventListener('keydown', handleKey);
  window.addEventListener('hashchange', route);
  animateIn($('#empty'));
  route();
  if (!activity.length) logEvent('system', 'Welcome — everything here runs in your browser. Load an image or try the samples.', 'shield-check');
  if (settings.autoSamples && !S.images.length) loadSamples();
  // TODO(student): PWA share-target. Add <link rel="manifest" href="manifest.json"> with "share_target": {"action":"/share","method":"POST","enctype":"multipart/form-data","params":{"files":[{"name":"images","accept":["image/*"]}]}},
  // register sw.js here (navigator.serviceWorker.register('sw.js')), and in the SW's fetch handler for /share read formData().getAll('images') and post them to the open client, which calls addFiles().
}

window.ImageToolkit = {
  addFiles,
  loadSamples,
  runBatch,
  downloadZip,
  makeZip,
  exportBlob,
  parseJpeg,
  parsePng,
  parseWebp,
  parseGif,
  quantize,
  stampCanvas,
  buildSheet,
  checkCompliance,
  startTour,
  logEvent,
  state: S,
  get pipe() { return pipe; },
  get settings() { return settings; },
  get activity() { return activity; }
};
boot();
</script>
