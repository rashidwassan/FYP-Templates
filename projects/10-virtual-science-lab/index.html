// ---------- worksheet ----------
const wsStore = id => store.get('ws:' + id, {});

function wsScore(e) {
  const w = wsStore(e.id);
  return { ok: Object.values(w).filter(x => x.ok).length };
}

function scoreRing(sc, n) {
  const r = 26;
  const c = 2 * Math.PI * r;
  const frac = n ? sc / n : 0;
  return `<svg class="ring" viewBox="0 0 64 64" role="img" aria-label="${sc}/${n}">
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="#e5e7eb" stroke-width="7"/>
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="${sc === n ? '#22c55e' : '#8da315'}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c * frac} ${c}" transform="rotate(-90 32 32)" style="transition:stroke-dasharray .6s var(--ease)"/>
    <text x="32" y="37" text-anchor="middle" font-size="14" font-weight="700" fill="#15161a" font-family="Space Grotesk">${sc}/${n}</text>
  </svg>`;
}

function wsQuestionHtml(q, i, a) {
  const state = a ? (a.ok ? 'ok' : 'bad') : '';
  let body;
  if (q.type === 'num') {
    const hint = q.hint ? `<button class="btn ghost sm" data-hint>${ic('lightbulb')} ${t('hint')}</button>` : '';
    body = `<div class="row"><input type="number" step="any" value="${a?.val ?? ''}" placeholder="${t('yourAnswer')}" aria-label="${t('yourAnswer')}"><button class="btn sm" data-check>${ic('check')} ${t('check')}</button>${hint}</div>`;
  } else {
    body = `<div class="row">${L(q.opts)
      .map((o, k) => `<button class="opt ${a?.val === k ? 'on' : ''}" data-opt="${k}">${esc(o)}</button>`)
      .join('')}</div>`;
  }
  return `<div class="q ${state} ${urClass()}" data-i="${i}">
    <div class="n">${a?.ok ? ic('check') : i + 1}</div>
    <div><div style="font-weight:600">${esc(L(q.q))}</div>${body}
    <div class="muted small" style="margin-top:6px" data-msg>${a ? (a.ok ? t('correct') : t('wrong')) : ''}</div></div>
  </div>`;
}

function renderWS() {
  const e = sim.exp;
  const w = wsStore(e.id);
  const sc = wsScore(e).ok;
  $('#ws').innerHTML = `<div class="score">${scoreRing(sc, e.worksheet.length)}
      <div style="flex:1;min-width:180px"><b>${t('wsScore')}</b><div class="muted small">${t('simNote')}</div></div>
      <button class="btn ghost sm" id="wsReset">${ic('trash')} ${t('reset')}</button>
    </div>${e.worksheet.map((q, i) => wsQuestionHtml(q, i, w[i])).join('')}`;
  $('#wsReset').onclick = () => {
    store.set('ws:' + e.id, {});
    renderTabs();
    renderSide();
  };
  $$('#ws .q').forEach(el => bindWsQuestion(el, e));
}

function bindWsQuestion(el, e) {
  const i = +el.dataset.i;
  const q = e.worksheet[i];
  const save = (val, ok) => {
    const all = wsStore(e.id);
    all[i] = { val, ok };
    store.set('ws:' + e.id, all);
    logEvent('ws', {
      en: `Worksheet Q${i + 1} ${ok ? 'correct' : 'wrong'} — ${e.title.en}`,
      ur: `ورک شیٹ سوال ${i + 1} ${ok ? 'درست' : 'غلط'} — ${e.title.ur}`,
    });
    renderTabs();
    renderSide();
    if (ok) toast(t('correct'), 'ok', 'check');
  };
  const chk = el.querySelector('[data-check]');
  if (chk) {
    const input = el.querySelector('input');
    const check = () => {
      const v = parseFloat(input.value);
      if (!Number.isNaN(v)) save(v, Math.abs(v - q.ans) <= q.tol);
    };
    chk.onclick = check;
    input.onkeydown = ev => {
      if (ev.key === 'Enter') check();
    };
  }
  const h = el.querySelector('[data-hint]');
  if (h)
    h.onclick = () => {
      el.querySelector('[data-msg]').textContent = L(q.hint);
    };
  $$('[data-opt]', el).forEach(b => {
    b.onclick = () => save(+b.dataset.opt, +b.dataset.opt === q.ans);
  });
}

// ---------- quiz ----------
let quizDraft = null;

function newQuizDraft(id, shuffle) {
  const n = (QUIZ[id] || []).length;
  const order = [...Array(n).keys()];
  if (shuffle) {
    const rnd = seededRandom(Date.now() & 0xffffffff);
    for (let i = n - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
  }
  return { id, order, answers: {}, submitted: false, score: 0 };
}

function quizHeadHtml(rec, n, d) {
  const verdict = d.submitted ? (d.score === n ? t('q_perfect') : d.score >= n / 2 ? t('q_good') : t('q_again')) : t('q_intro');
  return `<div class="quizhead">
    ${scoreRing(d.submitted ? d.score : (rec.best ?? 0), n)}
    <div style="flex:1;min-width:200px">
      <b>${d.submitted ? `${t('q_result')}: ${d.score}/${n}` : t('t_quiz')}</b>
      <div class="muted small ${urClass()}">${verdict}</div>
      <div class="small" style="margin-top:4px">${t('q_best')}: <b>${rec.best ?? '—'}</b> · ${t('q_attempts')}: <b>${rec.attempts}</b> · ${t('q_last')}: <b>${rec.last ?? '—'}</b></div>
    </div>
    <button class="btn ghost sm" id="qShuffle">${ic('refresh')} ${t('q_shuffle')}</button>
  </div>`;
}

function quizQuestionHtml(q, qi, pos, d) {
  const chosen = d.answers[qi];
  const state = d.submitted ? (chosen === q.ans ? 'ok' : 'bad') : '';
  const opts = L(q.opts)
    .map((o, k) => {
      let cls = chosen === k ? 'on' : '';
      if (d.submitted) cls = k === q.ans ? 'right' : chosen === k ? 'miss' : '';
      return `<button class="opt ${cls}" data-q="${qi}" data-o="${k}" ${d.submitted ? 'disabled' : ''}>${esc(o)}</button>`;
    })
    .join('');
  const why = d.submitted ? `<div class="why">${ic('lightbulb')} <b>${t('q_why')}:</b> ${esc(L(q.why))}</div>` : '';
  return `<div class="q ${state} ${urClass()}"><div class="n">${d.submitted && chosen === q.ans ? ic('check') : pos + 1}</div>
    <div><div style="font-weight:600">${esc(L(q.q))}</div><div class="row">${opts}</div>${why}</div></div>`;
}

function renderQuiz() {
  const e = sim.exp;
  const bank = QUIZ[e.id] || [];
  if (!quizDraft || quizDraft.id !== e.id) quizDraft = newQuizDraft(e.id, false);
  const d = quizDraft;
  const rec = store.get('quiz:' + e.id, { best: null, attempts: 0, last: null });
  const foot = d.submitted
    ? `<button class="btn acid" id="qRetry">${ic('refresh')} ${t('q_retry')}</button>`
    : `<button class="btn acid" id="qSubmit">${ic('check')} ${t('q_submit')}</button>`;
  $('#quiz').innerHTML =
    quizHeadHtml(rec, bank.length, d) + d.order.map((qi, pos) => quizQuestionHtml(bank[qi], qi, pos, d)).join('') + `<div class="row">${foot}</div>`;
  $$('#quiz [data-o]').forEach(b => {
    b.onclick = () => {
      d.answers[+b.dataset.q] = +b.dataset.o;
      renderQuiz();
    };
  });
  $('#qShuffle').onclick = () => {
    quizDraft = newQuizDraft(e.id, true);
    renderQuiz();
  };
  const sub = $('#qSubmit');
  if (sub) sub.onclick = submitQuiz;
  const retry = $('#qRetry');
  if (retry)
    retry.onclick = () => {
      quizDraft = newQuizDraft(e.id, false);
      renderQuiz();
    };
}

function submitQuiz() {
  const e = sim.exp;
  const bank = QUIZ[e.id] || [];
  const d = quizDraft;
  if (Object.keys(d.answers).length < bank.length) {
    toast(t('q_unanswered'), 'bad', 'alert');
    return;
  }
  d.score = bank.reduce((s, q, i) => s + (d.answers[i] === q.ans ? 1 : 0), 0);
  d.submitted = true;
  const rec = store.get('quiz:' + e.id, { best: null, attempts: 0, last: null });
  rec.attempts += 1;
  rec.last = d.score;
  rec.best = Math.max(rec.best ?? 0, d.score);
  rec.at = nowIso();
  store.set('quiz:' + e.id, rec);
  logEvent('quiz', { en: `Quiz ${d.score}/${bank.length} — ${e.title.en}`, ur: `کوئز ${d.score}/${bank.length} — ${e.title.ur}` });
  toast(`${t('q_result')}: ${d.score}/${bank.length}`, d.score === bank.length ? 'ok' : '', 'award');
  renderTabs();
  renderSide();
}

function submitReport() {
  const name = String(store.get('name', '') || '').trim();
  if (!name) {
    toast(t('r_needName'), 'bad', 'alert');
    $('#rName')?.focus();
    return;
  }
  const e = sim.exp;
  const quiz = store.get('quiz:' + e.id, null);
  const sub = {
    id: uid(),
    name,
    exp: e.id,
    code: activeAssignment()?.code || null,
    ws: wsScore(e).ok,
    wsN: e.worksheet.length,
    quiz: quiz?.best ?? null,
    quizN: (QUIZ[e.id] || []).length,
    readings: readingsFor(e.id).rows.length,
    at: nowIso(),
  };
  const subs = store.get('subs', []);
  subs.unshift(sub);
  store.set('subs', subs.slice(0, 500));
  logEvent('teacher', { en: `Submitted ${e.title.en} as ${name}`, ur: `${e.title.ur} بطور ${name} جمع کیا` });
  toast(t('r_submitted'), 'ok', 'send');
  // TODO(student): LMS export — also POST this submission as an xAPI statement (actor, verb "completed",
  // object = experiment, result.score) to a school LRS so Moodle or Google Classroom can grade it.
}

// ---------- glossary page ----------
let glossQ = '';
let glossSubj = 'all';

function glossUsedIn(id) {
  return EXPS.filter(e => (e.terms || []).includes(id));
}

function glossMatches() {
  const q = glossQ.trim().toLowerCase();
  return GLOSSARY.filter(g => {
    if (glossSubj !== 'all' && g.subject !== glossSubj) return false;
    if (!q) return true;
    return [g.term.en, g.term.ur, g.def.en, g.def.ur].some(s => s.toLowerCase().includes(q));
  });
}

function glossCardHtml(g) {
  const used = glossUsedIn(g.id)
    .map(e => `<a class="chip" href="#exp/${e.id}/theory">${esc(L(e.title))}</a>`)
    .join(' ');
  return `<div class="term card">
    <h4><span>${esc(g.term.en)}</span><span class="ur">${esc(g.term.ur)}</span></h4>
    <span class="pill ${{ physics: 'phys', chemistry: 'chem', biology: 'bio' }[g.subject]}" style="margin-top:6px">${t(g.subject)}</span>
    <p>${esc(g.def.en)}</p>
    <p class="ur">${esc(g.def.ur)}</p>
    ${used ? `<div class="small muted" style="margin-top:8px">${t('g_in')}:</div><div class="row" style="margin-top:4px">${used}</div>` : ''}
  </div>`;
}

function renderGlossList() {
  const list = glossMatches();
  $('#gList').innerHTML = list.length ? list.map(glossCardHtml).join('') : `<p class="muted">${t('g_none')}</p>`;
  $('#gCount').textContent = `${list.length} / ${GLOSSARY.length} ${t('g_count')}`;
  animateIn($('#gList').parentElement);
}

function renderGlossary(root) {
  const chip = (id, txt) => `<button class="chip ${glossSubj === id ? 'on' : ''}" data-subj="${id}">${txt}</button>`;
  root.innerHTML = `<div class="page">

let teacherOpen = false;
let teacherExp = null;
let dashFilter = 'all';

const pinHash = s => [...String(s)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7).toString(36);

}

function teacherGateHtml(T) {
  const setting = !T.pin;
  return `<div class="page"><div class="panel" style="max-width:520px">

function bindGate(root, T) {
  const go = () => {
    const v = $('#tePin').value.trim();
    if (!/^\d{4}$/.test(v)) {
      toast(t('te_pinBad'), 'bad', 'alert');
      return;
    }
    if (!T.pin) {
      T.pin = pinHash(v);
      saveTeacher(T);
      toast(t('te_pinSaved'), 'ok', 'key');

  };
  $('#teGo').onclick = go;

  $('#tePin').focus();
}

function saveLocks(e) {
  const T = teacherStore();
  const locks = {};
  $$('#teLocks [data-lk]').forEach(cb => {
    if (!cb.checked) return;
    const q = e.params.find(x => x.k === cb.dataset.lk);
    const raw = $(`#teLocks [data-lv="${q.k}"]`).value;
    locks[q.k] = q.type === 'select' ? raw : clampParam(q, +raw);
  });
  T.locks = T.locks || {};
  if (Object.keys(locks).length) T.locks[e.id] = locks;
  else delete T.locks[e.id];
  saveTeacher(T);
  logEvent(
    'teacher',
    { en: `Locked ${Object.keys(locks).length} parameters — ${e.title.en}`, ur: `${Object.keys(locks).length} پیرامیٹرز لاک — ${e.title.ur}` },
    e.id,
  );
  afterLocksChanged(e);
}

const DEMO_ASSIGN = [
  { code: 'VL-PEND', title: 'Measure g with a pendulum', exp: 'pendulum', due: '2026-10-20', locks: { g: '9.81' }, created: '2026-10-12T08:00:00.000Z' },
  { code: 'VL-OHM1', title: "Verify Ohm's law", exp: 'ohm', due: '2026-10-22', locks: { mode: 'single', R1: 10 }, created: '2026-10-13T08:00:00.000Z' },
];
const DEMO_EXPS = ['pendulum', 'ohm', 'titration', 'hooke', 'newton', 'enzyme'];

// 12 students × up to 6 experiments, deterministic so every device shows the same demo class
function demoSubmissions() {
  const rnd = seededRandom(2026);
  const base = Date.parse('2026-10-16T09:00:00Z');
  const out = [];
  DEMO_NAMES.forEach((name, i) => {
    const skill = 0.45 + rnd() * 0.55;
    DEMO_EXPS.forEach((exp, j) => {
      if (rnd() < 0.2) return;
      const n = EXP[exp].worksheet.length;
      const qn = QUIZ[exp].length;
      const ws = Math.round(n * clamp(skill + (rnd() - 0.5) * 0.4, 0, 1));
      const quiz = Math.round(qn * clamp(skill + (rnd() - 0.5) * 0.4, 0, 1));
      const at = new Date(base - (j * 30 + i * 2) * 3600e3 - Math.floor(rnd() * 3600e3)).toISOString();
      out.push({
        id: `D${i}${j}`,
        name,
        exp,
        code: j < 2 ? DEMO_ASSIGN[j].code : null,
        ws,
        wsN: n,
        quiz,
        quizN: qn,
        readings: Math.floor(rnd() * 6) + (ws > 2 ? 3 : 0),
        at,
        demo: true,
      });
    });
  });
  return out;
}

function loadDemoClass() {
  const subs = [...store.get('subs', []).filter(s => !s.demo), ...demoSubmissions()];
  subs.sort((a, b) => b.at.localeCompare(a.at));
  store.set('subs', subs);
  const T = teacherStore();
  DEMO_ASSIGN.forEach(a => {
    if (!T.assignments.some(x => x.code === a.code)) T.assignments.push({ ...a });
  });
  saveTeacher(T);
  logEvent('teacher', { en: 'Loaded demo class (12 students)', ur: 'نمونہ کلاس لوڈ (12 طلبہ)' }, null);
  toast(t('te_demoLoaded'), 'ok', 'users');
}

function dashStats(subs) {
  const n = subs.length;
  const students = new Set(subs.map(s => s.name.trim().toLowerCase())).size;
  const wsPct = n ? (subs.reduce((a, s) => a + s.ws / s.wsN, 0) / n) * 100 : 0;
  const qs = subs.filter(s => s.quiz != null && s.quizN);
  const quizPct = qs.length ? (qs.reduce((a, s) => a + s.quiz / s.quizN, 0) / qs.length) * 100 : 0;
  const full = subs.filter(s => s.ws === s.wsN).length;
  return { n, students, wsPct, quizPct, full };
}

function kpiHtml(icon, label, value, suffix = '') {
  return `<div class="kpi card"><div class="l">${ic(icon)} ${label}</div><div class="v" data-to="${value}" data-suf="${suffix}">0${suffix}</div></div>`;
}

function byExpBarsHtml(subs) {
  const rows = EXPS.map(e => {
    const s = subs.filter(x => x.exp === e.id);
    if (!s.length) return '';
    const pct = Math.round((s.reduce((a, x) => a + x.ws / x.wsN, 0) / s.length) * 100);
    return `<div class="hbar"><span>${esc(L(e.title))}</span><div class="bar"><i style="width:0" data-w="${pct}"></i></div><b>${pct}%</b></div>`;
  }).join('');
  return `<h4 class="small muted" style="margin:0 0 8px;font-family:var(--font)">${t('te_byExp')}</h4>${rows}`;
}

function histogramHtml(subs) {
  const buckets = [0, 0, 0, 0, 0];
  subs.forEach(s => {
    buckets[Math.min(4, Math.floor((s.ws / s.wsN) * 5))]++;
  });
  const max = Math.max(1, ...buckets);
  const labels = ['0–19', '20–39', '40–59', '60–79', '80–100'];
  const cols = buckets
    .map((b, i) => `<div class="col"><b>${b}</b><i style="height:0" data-h="${(b / max) * 100}"></i><span>${labels[i]}%</span></div>`)
    .join('');
  return `<h4 class="small muted" style="margin:0 0 8px;font-family:var(--font)">${t('te_dist')}</h4><div class="cols">${cols}</div>`;
}

function subsTableHtml(subs) {

function ago(iso) {
  const min = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (min < 1) return t('ago_now');
  if (min < 60) return `${min} ${t('ago_min')}`;
  if (min < 24 * 60) return `${Math.round(min / 60)} ${t('ago_h')}`;
  return new Date(iso).toLocaleDateString(lang === 'ur' ? 'ur-PK' : 'en-PK', { day: 'numeric', month: 'short', year: 'numeric' });
}

  download(`virtual-science-lab-${nowIso().slice(0, 10)}.json`, json, 'application/json');
  logEvent('export', { en: 'Exported all data (JSON)', ur: 'تمام ڈیٹا برآمد (JSON)' }, null);
  toast(t('s_exported'), 'ok', 'download');

function importAll(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const obj = JSON.parse(rd.result);
      if (obj?.app !== 'vlab' || !obj.data || typeof obj.data !== 'object') throw new Error('not a vlab export');
      Object.entries(obj.data).forEach(([k, v]) => store.set(k, v));
      refreshAll();
      logEvent('settings', { en: 'Imported data from JSON', ur: 'JSON سے ڈیٹا درآمد' }, null);
      toast(t('s_imported'), 'ok', 'upload');
    } catch {
      toast(t('s_importBad'), 'bad', 'alert');
    }
  };
  rd.readAsText(file);
}

function stepExperiment(dir) {
  const i = EXPS.findIndex(e => e.id === sim.exp.id);
  go('exp/' + EXPS[(i + dir + EXPS.length) % EXPS.length].id);
}

function onKey(ev) {
  if (ev.key === 'Escape') {
    closeModal();
    if (tourStep >= 0) endTour();
    return;
  }
  if (tourStep >= 0) {
    if (ev.key === 'ArrowRight' || ev.key === 'Enter') tourMove(1);
    if (ev.key === 'ArrowLeft') tourMove(-1);
    return;
  }
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const tag = (ev.target.tagName || '').toLowerCase();
  if (['input', 'select', 'textarea'].includes(tag) || $('#modal').classList.contains('on')) return;
  if (ev.key === '?') return openKeys();
  if (ev.key.toLowerCase() === 'l') return toggleLang();
  if (!labVisible() || !sim.exp) return;
  if (ev.key === ' ' && tag !== 'button') {
    ev.preventDefault();
    togglePlay();
  } else if (ev.key.toLowerCase() === 'r') reset();
  else if (ev.key.toLowerCase() === 't') takeReading();
  else if (ev.key === '[') stepExperiment(-1);
  else if (ev.key === ']') stepExperiment(1);
  else if (/^[1-7]$/.test(ev.key)) setTab(TABS[+ev.key - 1][0]);
}

let tourStep = -1;

const isVisible = el => !!el && el.getClientRects().length > 0 && getComputedStyle(el).visibility !== 'hidden';

function maybeStartTour() {
  if (store.get('tour', false) || tourStep >= 0) return;
  setTimeout(() => {
    if (labVisible() && tourStep < 0 && !store.get('tour', false)) startTour();
  }, 700);
}

function startTour() {
  closeModal();
  if (!labVisible()) go('exp/' + (sim.exp?.id || store.get('cur', EXPS[0].id)));
  tourStep = 0;
  $('#tour').classList.add('on');
  setTimeout(showTourStep, 60);
}

function endTour() {
  $('#tour').classList.remove('on');
  tourStep = -1;
  store.set('tour', true);
}

function tourMove(dir) {
  const next = tourStep + dir;
  if (next < 0) return;
  if (next >= TOUR.length) {
    endTour();
    return;
  }
  tourStep = next;
  showTourStep();
}

function showTourStep() {
  if (tourStep < 0) return;
  const step = TOUR[tourStep];
  const el = step.sel.map(s => $(s)).find(isVisible);
  if (!el) {
    tourMove(1);
    return;
  }
  const r0 = el.getBoundingClientRect();
  if (r0.top < 0 || r0.bottom > innerHeight) el.scrollIntoView({ block: r0.height > innerHeight * 0.7 ? 'start' : 'center' });
  requestAnimationFrame(() => placeTour(el, step));
}

function placeTour(el, step) {
  const r = el.getBoundingClientRect();
  const top = Math.max(6, r.top - 6);
  const bottom = Math.min(innerHeight - 6, r.bottom + 6);
  const left = Math.max(6, r.left - 6);
  const right = Math.min(innerWidth - 6, r.right + 6);
  Object.assign($('#spot').style, { top: top + 'px', left: left + 'px', width: right - left + 'px', height: Math.max(0, bottom - top) + 'px' });
  const card = $('#tcard');
  const last = tourStep === TOUR.length - 1;
  card.className = `tcard ${urClass()}`;
  card.innerHTML = `<h4>${esc(L(step.t))}</h4><p>${esc(L(step.d))}</p>
    <div class="row"><button class="btn ghost sm" id="trSkip">${t('tr_skip')}</button>
      ${tourStep ? `<button class="btn ghost sm" id="trBack">${ic('chevron-left')} ${t('tr_back')}</button>` : ''}
      <button class="btn acid sm" id="trNext">${t(last ? 'tr_done' : 'tr_next')} ${ic(last ? 'check' : 'chevron-right')}</button>
      <span class="steps">${tourStep + 1} / ${TOUR.length}</span></div>`;
  const cw = card.offsetWidth;
  const ch = card.offsetHeight;
  let y = bottom + 12;
  let x = clamp(left, 16, innerWidth - cw - 16);
  if (y + ch > innerHeight - 8) y = top - ch - 12;
  if (y < 8) {
    // tall target: put the card beside it, or pinned to the bottom of the viewport
    y = clamp(innerHeight - ch - 16, 8, innerHeight);
    if (right + cw + 24 < innerWidth) x = right + 12;
  }
  card.style.top = y + 'px';
  card.style.left = x + 'px';
  $('#trSkip').onclick = endTour;
  $('#trNext').onclick = () => tourMove(1);
  const back = $('#trBack');
  if (back) back.onclick = () => tourMove(-1);
  $('#trNext').focus({ preventScroll: true });
}
// ---------- pages, navigation and routing ----------
// Routes: #exp/<id>[/<tab>] · #glossary · #manual · #teacher · #log · #settings
const PAGES = {
  glossary: { icon: 'book', key: 'g_title', short: 'g_title', render: renderGlossary },
  manual: { icon: 'file', key: 'nav_manual', short: 'mn_manual', render: renderManual },
  teacher: { icon: 'users', key: 'te_title', short: 'mn_teacher', render: renderTeacher },
  log: { icon: 'activity', key: 'l_title', short: 'mn_log', render: renderLog },
  settings: { icon: 'settings', key: 's_title', short: 's_title', render: renderSettings },
};
let curPage = null;

function go(hash) {
  if (location.hash === '#' + hash) route();
  else location.hash = hash;
}

function parseHash() {
  const [a, b, c] = decodeURIComponent(location.hash.replace(/^#\/?/, '')).split('/');
  if (PAGES[a]) return { page: a };
  if (a === 'exp' && EXP[b]) return { exp: b, tab: TABS.some(x => x[0] === c) ? c : null };
  return {};
}

function route() {
  const r = parseHash();
  closeModal();
  if (r.page) {
    showPage(r.page);
    return;
  }
  curPage = null;
  $('#pageView').classList.remove('on');
  labView.classList.add('on');
  if (r.tab) {
    curTab = r.tab;
    store.set('tab', curTab);
  }
  const id = r.exp || sim.exp?.id || store.get('cur', EXPS[0].id);
  maybeStartTour();
  if (!sim.exp || sim.exp.id !== id) {
    const first = !sim.exp;
    loadExp(id);
    if (!first) logEvent('open', { en: `Opened ${sim.exp.title.en}`, ur: `${sim.exp.title.ur} کھولا` });
  } else {
    renderTabs();
    renderSide();
    renderAssignBar();
    resize();
  }
}

function showPage(id) {
  curPage = id;
  labView.classList.remove('on');
  const root = $('#pageView');
  root.classList.add('on');
  PAGES[id].render(root);
  renderSide();
  animateIn(root);
  window.scrollTo(0, 0);
}

function sideExpHtml(e) {
  const on = !curPage && sim.exp?.id === e.id;
  const done = wsScore(e).ok === e.worksheet.length;
  return `<a class="exp ${on ? 'on' : ''}" href="#exp/${e.id}" ${on ? 'aria-current="page"' : ''}>
    <div class="icw">${ic(e.icon)}</div>
    <div><b>${esc(L(e.title))}</b><small>${e.worksheet.length} ${t('questions')} · ${(QUIZ[e.id] || []).length} ${t('t_quiz')}</small></div>
    <span class="dot ${done ? 'done' : ''}" title="${done ? t('correct') : ''}"></span></a>`;
}

function renderSide() {
  const groups = ['physics', 'chemistry', 'biology'];
  $('#sideList').innerHTML = groups
    .map(
      g =>
        `<h3>${t(g)}</h3>` +
        EXPS.filter(e => e.subject === g)
          .map(sideExpHtml)
          .join(''),
    )
    .join('');
  $('#sideNav').innerHTML =
    `<h3>${t('nav_pages')}</h3>` +
    Object.entries(PAGES)
      .map(([id, P]) => `<a class="exp ${curPage === id ? 'on' : ''}" href="#${id}"><div class="icw">${ic(P.icon)}</div><div><b>${t(P.key)}</b></div></a>`)
      .join('');
  $('#mobileList').innerHTML = EXPS.map(
    e =>
      `<a class="exp ${!curPage && sim.exp?.id === e.id ? 'on' : ''}" href="#exp/${e.id}"><div class="icw">${ic(e.icon)}</div><div><b>${esc(L(e.title))}</b></div></a>`,
  ).join('');
  const labHash = 'exp/' + (sim.exp?.id || store.get('cur', EXPS[0].id));
  const mnav = [['lab', labHash, 'flask', 'nav_lab'], ...Object.entries(PAGES).map(([id, P]) => [id, id, P.icon, P.short])];
  $('#mobileNav').innerHTML = mnav
    .map(
      ([id, hash, icon, key]) => `<a href="#${hash}" class="${(id === 'lab' ? !curPage : curPage === id) ? 'on' : ''}">${ic(icon)}<span>${t(key)}</span></a>`,
    )
    .join('');
  revealActiveStrip();
}

// keep the active experiment centred in the horizontal phone strip
function revealActiveStrip() {
  const strip = $('#mobileList');
  const active = $('.exp.on', strip);
  if (!active || !strip.clientWidth) return;
  const offset = active.getBoundingClientRect().left - strip.getBoundingClientRect().left;
  strip.scrollLeft += offset - (strip.clientWidth - active.offsetWidth) / 2;
}

// ---------- language ----------
function applyLang() {
  document.documentElement.lang = lang === 'ur' ? 'ur' : 'en';
  store.set('lang', lang);
  $$('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  const other = `${ic('languages')} ${lang === 'en' ? 'اردو' : 'English'}`;
  $('#langBtn').innerHTML = other;
  $('#mLang').innerHTML = other;
  readCache = '';
  if (sim.exp) {
    renderHead();
    renderControls();
    renderActions();
    renderTabs();
    renderTools();
    renderAssignBar();
    updatePlay();
  }
  renderSide();
  if (curPage) PAGES[curPage].render($('#pageView'));
}

function toggleLang() {
  lang = lang === 'en' ? 'ur' : 'en';
  applyLang();
}

// re-read everything from storage (after import or reset)
function refreshAll() {
  Object.keys(settings).forEach(k => delete settings[k]);
  Object.assign(settings, store.get('settings', {}));
  const savedTools = store.get('tools', {});
  Object.assign(tools.ruler, TOOL_DEFAULT.ruler, savedTools.ruler || {});
  Object.assign(tools.prot, TOOL_DEFAULT.prot, savedTools.prot || {});
  Object.assign(tools.sw, TOOL_DEFAULT.sw, { on: !!savedTools.sw?.on, laps: [] });
  lang = store.get('lang', 'en');
  curTab = store.get('tab', 'graph');
  sim.speed = settings.speed || 1;
  $('#spd').value = sim.speed;
  $('#spdV').textContent = sim.speed + '×';
  applySettings();
  loadExp(store.get('cur', EXPS[0].id));
  applyLang();
}

// ---------- boot ----------
function bindChrome() {
  $('#playBtn').onclick = togglePlay;
  $('#resetBtn').onclick = reset;
  $('#readBtn').onclick = takeReading;
  $('#csvBtn').onclick = exportSeriesCsv;
  $('#fitBtn').onclick = toggleGraphFit;
  $('#spd').oninput = ev => {
    sim.speed = +ev.target.value;
    $('#spdV').textContent = sim.speed + '×';
  };
  $('#langBtn').onclick = toggleLang;
  $('#mLang').onclick = toggleLang;
  $('#keysBtn').onclick = openKeys;
  const about = () => go(`exp/${sim.exp?.id || EXPS[0].id}/about`);
  $('#aboutBtn').onclick = about;
  $('#mAbout').onclick = about;
  $('#modal').addEventListener('click', ev => {
    if (ev.target.id === 'modal') closeModal();
  });
  document.addEventListener('keydown', onKey);
  window.addEventListener('hashchange', route);
  window.addEventListener('resize', () => {
    resize();
    if (curTab === 'data' && labVisible()) drawRegression();
    if (tourStep >= 0) showTourStep();
  });
  bindToolPointer();
}

function boot() {
  applySettings();
  $('#spd').value = sim.speed;
  $('#spdV').textContent = sim.speed + '×';
  bindChrome();
  route();
  applyLang();
  requestAnimationFrame(frame);
  maybeStartTour();
  document.fonts?.ready.then(revealActiveStrip);
  // TODO(student): offline PWA — add manifest.json and a service worker (sw.js) that caches index.html and the
  // Google Fonts, then register it here with navigator.serviceWorker.register('sw.js') when served over HTTP.
}

// small test/automation hook used by the screenshot harness
window.VLAB = { go, sim, EXPS, takeReading, startTour, endTour, loadDemoClass, openKeys, setTab };
boot();
</script>
