<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thalassemia Care Companion</title>
<meta name="description" content="Transfusion log with next-transfusion prediction, ferritin and chelation tracking, daily adherence calendar, carrier screening tools and a printable clinician summary for thalassemia patients in Pakistan. Single-file FYP template.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens: lavender, teal, calm clinical ---------- */
:root{
  --bg:#f5f3fb; --surface:#ffffff; --surface-2:#f0ecf9; --ink:#231d3b; --muted:#6c6684; --line:#e3deef;
  --violet:#6d4fc2; --violet-deep:#51389c; --violet-soft:#ebe5fa; --violet-ink:#3f2b7d;
  --teal:#128f80; --teal-deep:#0d6f63; --teal-soft:#dff3ef;
  --ok:#2e7d4f; --ok-soft:#e2f3e8; --warn:#a9640a; --warn-soft:#fdf0d8; --bad:#c23b32; --bad-soft:#fbe4e1; --info:#3b5bdb; --info-soft:#e6eafb;
  --rose:#b3457a; --amber:#c98a1c;
  --radius:16px; --radius-sm:10px; --shadow:0 12px 32px -22px rgba(61,43,125,.35);
  --font:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --font-ur:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--violet-deep)}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.01em}
.ur{font-family:var(--font-ur);line-height:1.9;font-weight:400}
.rtl{direction:rtl;text-align:right}
.muted{color:var(--muted)}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.ic.lg{width:1.5em;height:1.5em}
.kicon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--violet-soft);color:var(--violet-deep);flex:none}
.kicon.teal{background:var(--teal-soft);color:var(--teal-deep)} .kicon.warn{background:var(--warn-soft);color:var(--warn)} .kicon.bad{background:var(--bad-soft);color:var(--bad)} .kicon.ok{background:var(--ok-soft);color:var(--ok)}
.emptyic{width:48px;height:48px;border-radius:14px;background:var(--violet-soft);color:var(--violet-deep);display:grid;place-items:center;margin:0 auto 10px}
.emptyic .ic{width:24px;height:24px}

/* ---------- Motion kit ---------- */
:root{--ease:cubic-bezier(.2,.8,.2,1);--dur:.35s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
.enter{animation:fadeUp var(--dur) var(--ease) both}
.stagger>*{animation:fadeUp .45s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.fine{font-size:.8rem;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 18px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--violet),var(--violet-deep));display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 8px 18px -10px rgba(109,79,194,.8)}
.brand h1{font-size:1.05rem;font-weight:700;white-space:nowrap;color:var(--violet-ink)}
.brand small{display:block;font-size:.74rem;color:var(--muted);font-weight:500}
.brand h1.ur{font-size:1.05rem;line-height:2.2;font-weight:700;padding-top:6px} .brand small.ur{line-height:1.9;font-size:.78rem;padding-bottom:4px}
.kpi .k .ur,.tabs a .ur,.btn .ur,.pill .ur,.chip .ur{line-height:1.6}
.spacer{flex:1}
.datebadge{font-size:.8rem;color:var(--muted);white-space:nowrap;background:var(--surface-2);border-radius:999px;padding:6px 12px}
.lang{background:var(--violet);color:#fff;border:0;border-radius:10px;padding:8px 13px;font-weight:700;cursor:pointer;min-height:38px}
.iconbtn{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:7px 11px;cursor:pointer;min-height:38px;font-weight:600}

/* ---------- Layout: patient rail + main ---------- */
.layout{display:grid;grid-template-columns:268px minmax(0,1fr);gap:22px;max-width:1380px;margin:0 auto;padding:20px 18px 70px;min-width:0}
.rail{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:10px;min-width:0}
.railhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px}
.railhead h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.pcard{display:flex;gap:11px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid transparent;border-radius:14px;padding:11px 12px;cursor:pointer;text-align:left;width:100%;box-shadow:var(--shadow);transition:border-color .15s,transform .15s;min-width:0}
.pcard:hover{transform:translateY(-1px);border-color:var(--violet-soft);border-left-color:var(--violet-soft)}
.pcard.on{border-left-color:var(--violet);background:linear-gradient(90deg,var(--violet-soft),var(--surface) 70%)}
.pcard .nm{font-weight:700;font-size:.97rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .sub{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .who{min-width:0;flex:1;display:flex;flex-direction:column}
.pcard .nm,.pcard .sub{display:block}
.pcard .dots{display:flex;gap:3px;margin-top:4px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)} .dot.info{background:var(--info)} .dot.ok{background:var(--ok)}
.avatar{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--violet),var(--violet-deep));flex:none;font-size:.95rem}
.avatar.f{background:linear-gradient(135deg,#c75d9b,var(--rose))}
.avatar.big{width:56px;height:56px;border-radius:16px;font-size:1.2rem}
.bgtag{display:inline-block;background:var(--violet-ink);color:#fff;border-radius:8px;padding:2px 8px;font-weight:700;font-size:.82rem;letter-spacing:.02em}
.railnote{font-size:.8rem;color:var(--muted);padding:6px 4px}
.railnote a{font-weight:600}

/* ---------- Patient header + tabs ---------- */
.phead{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;box-shadow:var(--shadow);margin-bottom:14px;flex-wrap:wrap}
.phead h2{font-size:1.3rem;font-weight:700}
.phead .meta{font-size:.86rem;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.phead .who{flex:1;min-width:200px}
.phead .acts{display:flex;gap:8px;flex-wrap:wrap}
.phead .meta .pill{white-space:normal;text-align:left}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:18px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:10px 13px;white-space:nowrap;font-weight:600;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;font-size:.92rem;min-height:42px;display:inline-flex;align-items:center;gap:6px}
.tabs a:hover{color:var(--violet-ink)}
.tabs a.on{color:var(--violet-deep);border-bottom-color:var(--violet)}
.tabs .sep{width:1px;background:var(--line);margin:8px 6px;flex:none}

/* ---------- Components ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.panel h3{font-size:1.05rem;font-weight:700;margin-bottom:6px}
.panel p.lead{margin:0 0 12px;color:var(--muted);font-size:.92rem}
.panel+.panel,.stack>*+*{margin-top:14px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:16px;align-items:start}
.two.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.two.wide{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 14px}
.cols.tight{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpis.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.kpi .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.kpi .v{font-size:1.55rem;font-weight:700;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v small{font-size:.85rem;font-weight:600;color:var(--muted);letter-spacing:0}
.kpi .s{font-size:.8rem;color:var(--muted);margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:.75rem;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.violet{background:var(--violet-soft);color:var(--violet-deep)} .pill.teal{background:var(--teal-soft);color:var(--teal-deep)}
label.f{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin:10px 0 5px}
select,input[type=number],input[type=text],input[type=date],input[type=time],input[type=tel],textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;outline:0;min-height:40px}
select:focus,input:focus,textarea:focus{border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-soft)}
textarea{min-height:70px;resize:vertical}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--violet);color:#fff;display:inline-flex;align-items:center;gap:8px;min-height:40px;white-space:nowrap;text-decoration:none;transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s,filter .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px -12px rgba(61,43,125,.6)} .btn:active{transform:translateY(0) scale(.98)}
.btn:focus-visible,.chip:focus-visible,.tabs a:focus-visible,.pcard:focus-visible,.heat .c:focus-visible{outline:3px solid var(--violet-soft);outline-offset:1px}
.panel,.kpi{transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 16px 36px -22px rgba(61,43,125,.5)}
.fill,.riskbar span{transition:width .6s var(--ease),flex-basis .6s var(--ease)}
.heat .c{transition:transform .15s var(--ease),filter .15s}
.heat .c:not(.f):active{transform:scale(.9)}
.tabs a{transition:color .15s,border-color .2s var(--ease)}
.chip{transition:background .15s,color .15s,transform .15s var(--ease)} .chip:active{transform:scale(.97)}
.btn.teal{background:var(--teal)} .btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)} .btn.danger{background:var(--bad-soft);color:var(--bad)} .btn.ok{background:var(--ok-soft);color:var(--ok)}
.btn.sm{padding:6px 11px;font-size:.82rem;border-radius:8px;min-height:34px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:none;padding:8px 12px;cursor:pointer;font-weight:600;font-size:.85rem;min-height:40px}
.seg button.on{background:var(--violet);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 12px;font-size:.84rem;font-weight:600;cursor:pointer;min-height:36px}
.chip.on{background:var(--violet);border-color:var(--violet);color:#fff}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--surface);flex-wrap:wrap}
.row.done{opacity:.6}
.row .l{min-width:0;flex:1}
.empty{padding:26px;text-align:center;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);border-radius:12px}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 12px;border-left:4px solid;font-size:.9rem}
.alert.bad{background:var(--bad-soft);border-color:var(--bad)} .alert.warn{background:var(--warn-soft);border-color:var(--warn)} .alert.info{background:var(--info-soft);border-color:var(--info)} .alert.ok{background:var(--ok-soft);border-color:var(--ok)}
.alert b{display:block}
.note{background:var(--violet-soft);border-left:4px solid var(--violet);padding:10px 12px;border-radius:10px;font-size:.88rem}
.warnbox{background:var(--warn-soft);border-left:4px solid var(--warn);padding:10px 12px;border-radius:10px;font-size:.88rem}
.edu{background:linear-gradient(135deg,var(--violet-soft),var(--teal-soft));border-radius:14px;padding:14px 16px;margin-top:14px}
.edu h4{font-size:.98rem;margin-bottom:4px;color:var(--violet-ink)}
.edu p{margin:0;font-size:.9rem}
.edu.ur h4{font-size:1.1rem}
.edu.ur p{font-size:1rem}
.todo{border:1px dashed var(--violet);border-radius:12px;padding:12px 14px;background:var(--surface)}
.todo h4{margin:0 0 4px;font-size:.95rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.todo .tag{font-size:.68rem;background:var(--violet);color:#fff;border-radius:6px;padding:2px 6px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.todo code{background:var(--surface-2);border-radius:5px;padding:1px 5px;font-size:.82rem}
.bigstat{font-size:2rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* ---------- Tables ---------- */
.tablewrap{overflow:auto;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;background:var(--surface)}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);font-size:.88rem;vertical-align:middle}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- Charts ---------- */
.chart{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 4px 2px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart svg text{font-family:var(--font)}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:8px;padding:6px 9px;font-size:.78rem;transform:translate(-50%,-112%);white-space:nowrap;display:none;z-index:2;line-height:1.4}
.chart .pt{transition:r .15s var(--ease)} .chart .pt.hot{r:7}
td.bad{color:var(--bad);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;margin:8px 4px 0;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.legend i.sq{border-radius:2px}
.legend i.ln{width:14px;height:0;border-top:2px dashed var(--muted);border-radius:0}
.heat{display:grid;gap:4px;align-items:center}
.heat .hl,.heat .dl{font-size:.68rem;color:var(--muted);text-align:center;white-space:nowrap}
.heat .dl{text-align:right;padding-right:4px}
.heat .c{aspect-ratio:1;border-radius:5px;border:0;background:var(--surface-2);cursor:pointer;padding:0;min-width:0;width:100%}
.heat .c.t{background:var(--teal)} .heat .c.m{background:var(--rose)} .heat .c.f{background:transparent;border:1px dashed var(--line);cursor:default} .heat .c.today{outline:2px solid var(--violet);outline-offset:1px}
.heat .c:not(.f):hover{filter:brightness(.9)}
.bar{display:grid;grid-template-columns:130px 1fr 36px;gap:10px;align-items:center;margin:8px 0;font-size:.88rem}
.bar .lbl{display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .lbl i{width:10px;height:10px;border-radius:3px;flex:none}
.bar .track{height:14px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar .fill{height:100%;border-radius:999px}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.punnett{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;max-width:360px;margin:10px 0}
.punnett .h{display:grid;place-items:center;font-weight:700;color:var(--muted);font-size:.9rem;padding:6px}
.punnett .cell{border-radius:12px;padding:12px 8px;text-align:center;font-weight:700;border:1px solid var(--line)}
.punnett .cell small{display:block;font-weight:600;font-size:.74rem;color:var(--muted);margin-top:2px}
.punnett .cell.AA{background:var(--ok-soft)} .punnett .cell.Aa{background:var(--warn-soft)} .punnett .cell.aa{background:var(--bad-soft)}
.riskbar{display:flex;height:22px;border-radius:999px;overflow:hidden;margin-top:10px;gap:2px;background:var(--surface)}
.riskbar span{display:grid;place-items:center;font-size:.72rem;font-weight:700;color:#fff;min-width:0}
.riskbar .AA{background:var(--ok)} .riskbar .Aa{background:var(--warn)} .riskbar .aa{background:var(--bad)}
.verdict{border-radius:14px;padding:14px 16px;margin-top:12px;border:1px solid var(--line)}
.verdict.ok{background:var(--ok-soft)} .verdict.warn{background:var(--warn-soft)} .verdict.bad{background:var(--bad-soft)} .verdict.info{background:var(--info-soft)}
.verdict .big{font-size:1.5rem;font-weight:700;letter-spacing:-.02em}

/* ---------- Summary sheet ---------- */
.sheet{padding:24px 28px}
.sheethead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--violet);padding-bottom:12px;margin-bottom:14px}
.sheet h3{font-size:.95rem;text-transform:uppercase;letter-spacing:.07em;color:var(--violet-ink);margin:18px 0 8px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px 16px}
.facts div{font-size:.9rem} .facts .eyebrow{margin-bottom:2px}

/* ---------- Modal / toasts ---------- */
.scrim{position:fixed;inset:0;background:rgba(35,29,59,.45);backdrop-filter:blur(2px);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:620px;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 30px 80px -30px rgba(0,0,0,.5);transform:translateY(12px) scale(.97);transition:transform .3s var(--ease)}
.scrim.on .modal{transform:none}
.modal h3{font-size:1.2rem;margin-bottom:4px}
.modal .acts{margin-top:16px;justify-content:flex-end}
.share{white-space:pre-wrap;background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:.88rem;border:1px solid var(--line);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;max-width:calc(100vw - 32px)}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:toastIn .3s var(--ease) both;font-size:.9rem;display:flex;align-items:center;gap:8px}
.toast.ok{background:var(--teal)} .toast.bad{background:var(--bad)}
.toast.out{animation:toastOut .3s var(--ease) forwards}

/* ---------- Responsive ---------- */
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))} .kpis.four{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr);gap:14px;padding:14px 14px 60px}
  .rail{position:static;flex-direction:row;overflow-x:auto;align-items:center;padding-bottom:6px;scrollbar-width:thin}
  .railhead{flex:none;flex-direction:column;align-items:flex-start;gap:6px}
  .railhead h3{display:none}
  .pcard{flex:none;width:220px}
  .railnote{display:none}
  .two,.two.even,.two.wide{grid-template-columns:minmax(0,1fr)}
  .kpis,.kpis.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .datebadge{display:none}
  .brand small{display:none}
  .brand h1{font-size:.95rem;white-space:normal}
  .phead{padding:12px 14px}
  .bar{grid-template-columns:110px 1fr 30px}
  .sheet{padding:16px}
}
@media (max-width:480px){.kpi .v{font-size:1.3rem}}

/* ---------- Print ---------- */
@media print{
  .topbar,.rail,.tabs,.phead .acts,#toasts,.scrim,.noprint{display:none!important}
  .layout{display:block;padding:0;max-width:none}
  body{background:#fff;font-size:12px;color:#000}
  .panel,.kpi,.chart,.sheet,.tablewrap{box-shadow:none;border-color:#bbb;break-inside:avoid}
  .phead{border:0;padding:0 0 8px;margin-bottom:8px}
  .edu{background:#f3f3f3}
  a{color:inherit;text-decoration:none}
}

/** Hb decline rate from consecutive episodes, averaged over the last 3; predicted date = last date + (last post − target) / rate */
function predictor(eps, target) {
  const rates = [];
  for (let i = 1; i < eps.length; i++) {
    const a = eps[i - 1], b = eps[i];
    if (a.post == null || b.pre == null) continue;
    const d = daysBetween(parseDate(a.date), parseDate(b.date));
    if (d > 0 && a.post > b.pre) rates.push({ r: (a.post - b.pre) / d, d });
  }
  const last = eps[eps.length - 1];
  if (!last || last.post == null || !rates.length) return null;
  const use = rates.slice(-3);
  const rate = use.reduce((s, x) => s + x.r, 0) / use.length;
  const days = Math.max(0, (last.post - target) / rate);
  return { rate, days, predicted: addDays(parseDate(last.date), Math.round(days)), n: use.length, avgInterval: use.reduce((s, x) => s + x.d, 0) / use.length, last };
}

  const ml = eps.reduce((s, e) => s + volMl(e), 0);
  return { ml, perKg: ml / p.weight, n: eps.length };
}

  const pred = predictor(txOf(p.id), p.targetHb); const need = pred && pred.predicted > today ? dateKey(pred.predicted) : dateKey(addDays(today, 2));
  openModal(`<h3>${ic('droplet')} ${T('rb_t')}</h3><p class="lead">${T('rb_lead')}</p>
    <div class="cols tight"><div><label class="f" for="rbUnits">${T('rb_units')}</label><input id="rbUnits" type="number" min="1" max="10" value="${p.weight >= 35 ? 2 : 1}"></div><div><label class="f" for="rbDate">${T('rb_date')}</label><input id="rbDate" type="date" value="${need}" min="${TODAY}"></div></div>
    <label class="f" for="rbCentre">${T('rb_centre')}</label><input id="rbCentre" type="text" value="${esc(p.centre || '')}" list="centres">
    <label class="f" for="rbPhone">${T('rb_contact')}</label><input id="rbPhone" type="tel" value="${esc(p.emPhone || '')}">
    <label class="f">WhatsApp</label><pre class="share" id="rbText"></pre>
    <p class="fine" style="margin:10px 0 0">${ic('info')} ${T('rb_khoon')}</p>
    <div class="acts"><button class="btn ghost" id="rbCopy">${ic('copy')} ${T('copy')}</button><a class="btn teal" id="rbWa" href="#" target="_blank" rel="noopener">${ic('whatsapp')} ${T('rb_open')}</a></div>`);
  const build = () => {
    const text = `Blood needed for thalassemia transfusion\nPatient: ${initials(p.name)} (${ageOf(p.dob)} y, ${nm(TYPES[p.type] || TYPES.major)})\nBlood group: ${p.bg}\nUnits: ${$('#rbUnits').value} packed red cells (leucodepleted preferred)\nCentre: ${$('#rbCentre').value.trim()}\nNeeded by: ${fmtDate($('#rbDate').value || TODAY)}\nContact: ${$('#rbPhone').value.trim() || '—'}\n— Thalassemia Care Companion · donors via Khoon`;
    $('#rbText').textContent = text; $('#rbWa').href = 'https://wa.me/?text=' + encodeURIComponent(text); return text;
  };
  $$('#rbUnits,#rbDate,#rbCentre,#rbPhone').forEach(el => el.addEventListener('input', build)); build();
  $('#rbCopy').onclick = async () => { const text = build(); try { await navigator.clipboard.writeText(text); toast(t('copied'), 'ok'); } catch { const ta = document.createElement('textarea'); ta.value = text; document.body.append(ta); ta.select(); try { document.execCommand('copy'); toast(t('copied'), 'ok'); } catch { toast(t('invalid'), 'bad'); } ta.remove(); } };
  // TODO(student): requestBloodViaKhoon(p, units, date) — POST the request to the Khoon donor-network API and list matched, eligible donors here.
}

// ---------- reminders ----------
function checkReminders() {
  const rem = store.get('rem', {}), fired = store.get('remFired', {}), now = new Date();
  patients().forEach(p => {
    const r = rem[p.id]; if (!r || !r.on) return;
    const [h, m] = (r.time || '21:00').split(':').map(Number); const due = new Date(today); due.setHours(h, m, 0, 0);
    if (now < due || fired[p.id] === TODAY || dosesOf(p.id)[TODAY]) return;
    fired[p.id] = TODAY; store.set('remFired', fired);
    const msg = `${p.name}: ${t('rem_msg')}`;
    if ('Notification' in window && Notification.permission === 'granted') { try { new Notification(t('title'), { body: msg }); } catch { toast(msg); } } else toast(msg);
  });
  // TODO(student): scheduleReminder(p) — register a service worker + push subscription (FCM/OneSignal) or an SMS gateway so reminders fire when the page is closed.
}

// ---------- router / boot ----------
const VIEWS = { overview: renderOverview, transfusions: renderTransfusions, iron: renderIron, adherence: renderAdherence, appointments: renderAppointments, summary: renderSummary, screening: renderScreening, about: renderAbout };
function route() {
  let tab = (location.hash.slice(1) || 'overview').split('?')[0];
  if (!VIEWS[tab]) tab = 'overview';
  cur = tab; document.body.dataset.tab = tab;
  renderRail(); renderHead(); renderTabs();
  const p = current();
  if (PATIENT_TABS.includes(tab)) { if (!p) renderEmpty(); else VIEWS[tab](p); } else VIEWS[tab]();
  animateIn(view);
  window.scrollTo({ top: 0 });
}
function applyLang() {
  document.documentElement.lang = lang; store.set('lang', lang);
  $('#langBtn').textContent = lang === 'en' ? 'اردو' : 'English';
  $('#brandTitle').textContent = t('title'); $('#brandTitle').className = lang === 'ur' ? 'ur' : '';
  $('#brandTag').textContent = t('tagline'); $('#brandTag').className = lang === 'ur' ? 'ur' : '';
  $('#dateBadge').textContent = today.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  route();
}
$('#langBtn').onclick = () => { lang = lang === 'en' ? 'ur' : 'en'; applyLang(); };
$('#printBtn').onclick = () => { if (cur !== 'summary' && current()) { location.hash = 'summary'; setTimeout(() => window.print(), 400); } else window.print(); };
window.addEventListener('hashchange', route);
window.addEventListener('resize', debounce(() => { if (['transfusions', 'iron', 'summary'].includes(cur)) route(); }, 250));
document.body.insertAdjacentHTML('beforeend', `<datalist id="centres">${CENTRES.map(c => `<option value="${esc(c)}">`).join('')}</datalist>`);
applyLang();
checkReminders();
setInterval(checkReminders, 60000);
</script>
</body>
