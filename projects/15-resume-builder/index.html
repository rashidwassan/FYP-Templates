<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATS-Friendly Resume Builder</title>
<meta name="description" content="Build a resume that applicant-tracking systems can parse: live A4 preview, six ATS-safe templates, keyword match against a job description, bullet improver, cover letter, job application tracker, skills-gap analyser, interview STAR builder, LinkedIn generator, portfolio export and bilingual Urdu CV mode. Single-file FYP template.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens: editorial warm white / charcoal ---------- */
:root{
  --bg:#fcfbf8; --surface:#ffffff; --surface-2:#f3f1ec; --surface-3:#ebe8e1; --ink:#232323; --muted:#6c6a66; --line:#e6e2da; --line-2:#d6d1c7;
  --accent:#1f3a5f; --accent-soft:#e9eef5; --paper-bg:#ece9e2;
  --ok:#1f7a3a; --ok-soft:#e4f3e8; --warn:#9a6a12; --warn-soft:#fbf0d6; --bad:#b23a2f; --bad-soft:#fbe6e3;
  --radius:12px; --radius-sm:8px; --shadow:0 10px 30px -18px rgba(35,35,35,.35);
  --ui:"Karla",system-ui,-apple-system,"Segoe UI",sans-serif; --serif:"Lora",Georgia,"Times New Roman",serif;
  --ease:cubic-bezier(.2,.8,.2,1); --dur:.35s; --top:56px; --nav:44px; --urdu:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes chipIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
.enter{animation:fadeUp var(--dur) var(--ease) both}
.stagger>*{animation:fadeUp .45s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45}
body{overflow:hidden;height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.2}
a{color:var(--accent)}
.muted{color:var(--muted)} .hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Buttons / inputs ---------- */
.btn{border:1px solid transparent;border-radius:9px;padding:8px 13px;font-weight:600;cursor:pointer;background:var(--ink);color:#fff;display:inline-flex;align-items:center;gap:7px;min-height:40px;white-space:nowrap;transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px -10px rgba(0,0,0,.4)} .btn:active{transform:translateY(0) scale(.98)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.btn.soft{background:var(--surface-2);color:var(--ink)}
.btn.acc{background:var(--accent);color:#fff}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:.85rem;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.ib{background:none;border:0;border-radius:8px;width:40px;height:40px;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted);flex:none;transition:background .15s,color .15s}
.ib:hover{background:var(--surface-2);color:var(--ink)}
.ib.sm{width:36px;height:36px}
input[type=text],input[type=email],input[type=tel],input[type=url],input[type=month],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 10px;outline:0;font-size:.92rem;min-height:40px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;line-height:1.4}
textarea.grow{resize:none;overflow:hidden;min-height:40px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.f.full{grid-column:1/-1}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 10px}
.chk{display:flex;align-items:center;gap:8px;font-size:.9rem;min-height:40px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface-2);padding:2px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.85rem;border-radius:8px;min-height:34px;color:var(--muted);transition:background .2s,color .2s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.note{background:var(--accent-soft);border-left:3px solid var(--accent);padding:9px 12px;border-radius:8px;font-size:.86rem;margin-top:10px}
.note.warn{background:var(--warn-soft);border-color:var(--warn)}
.tag{font-size:.7rem;background:var(--ink);color:#fff;border-radius:6px;padding:2px 7px;font-weight:700;letter-spacing:.03em}

/* ---------- Top bar ---------- */
.topbar{height:var(--top);display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:none}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--ink);color:#fcfbf8;display:grid;place-items:center;flex:none}
.brand h1{font-family:var(--serif);font-size:1.02rem;font-weight:600;white-space:nowrap;letter-spacing:-.01em}
.brand small{display:block;font-size:.7rem;color:var(--muted);font-weight:500;margin-top:-2px}
.vbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:6px 10px;min-height:40px;cursor:pointer;max-width:240px;font-weight:600;font-size:.88rem}
.vbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 12px 4px 6px;min-height:40px;cursor:pointer;font-weight:700;transition:transform .15s var(--ease)}
.pill:hover{transform:translateY(-1px)}
.pill .ring{width:28px;height:28px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.5;stroke-linecap:round}
.ring .bg{stroke:var(--surface-3)} .ring .fg{stroke:currentColor;transition:stroke-dashoffset .8s var(--ease)}
.s-bad{color:var(--bad)} .s-mid{color:var(--warn)} .s-good{color:var(--ok)}
.pill .lbl{font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.mobilebar{display:none;align-items:center;gap:8px;height:54px;padding:7px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.mobilebar select{min-height:38px;width:auto;flex:1}

/* ---------- Popover / menu ---------- */
.pop{position:absolute;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 50px -20px rgba(0,0,0,.35);padding:6px;min-width:240px;z-index:40;display:none;animation:pop .2s var(--ease)}
.pop.open{display:block}
.pop .mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:500;min-height:40px}
.pop .mi:hover{background:var(--surface-2)} .pop .mi .hint{margin-left:auto;font-size:.72rem;color:var(--muted)}
.pop hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.pop .vrow{display:flex;align-items:center;gap:4px;padding:4px 4px 4px 10px;border-radius:8px}
.pop .vrow.cur{background:var(--accent-soft)}
.pop .vrow .vn{flex:1;min-width:0;cursor:pointer;line-height:1.25} .pop .vrow .vn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem} .pop .vrow .vn small{color:var(--muted);font-size:.72rem}

/* ---------- Layout ---------- */
#view{height:calc(100vh - var(--top) - var(--nav));position:relative}
.app{display:grid;grid-template-columns:450px minmax(0,1fr);height:100%}
.editor{overflow:auto;border-right:1px solid var(--line);background:var(--bg);padding:14px 14px 60px;scroll-behavior:smooth}
.ehead{display:flex;align-items:center;gap:8px;margin:0 2px 10px}
.ehead h2{font-family:var(--serif);font-size:1.15rem;font-weight:600;flex:1}
.ehead .saved{font-size:.75rem;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.preview{position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--paper-bg)}
.pvbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.pvbar .zoom{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);overflow:hidden}
.pvbar .zoom button{border:0;background:none;min-width:40px;height:40px;cursor:pointer;font-weight:700;font-size:.85rem;display:grid;place-items:center}
.pvbar .zoom button:hover{background:var(--surface-2)}
.pvbar .pages{font-size:.8rem;color:var(--muted);font-weight:600;white-space:nowrap}
.pvbar .pages.over{color:var(--warn)}
.swatches{display:inline-flex;gap:6px;align-items:center}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 0 0 2px var(--surface);transition:transform .15s}
.sw:hover{transform:scale(1.1)} .sw.on{border-color:var(--ink)}
.fscale{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);font-weight:700}
.fscale input{width:90px;accent-color:var(--accent);min-height:0;padding:0;border:0;box-shadow:none}
.pvbar select{width:auto;min-height:36px;padding:4px 8px;font-size:.85rem}
.pvscroll{flex:1;overflow:auto;padding:24px}
.sheetwrap{margin:0 auto;position:relative}
.sheet{transform-origin:0 0;position:relative}
.sheet.fadein{animation:fadeIn .4s var(--ease)}
.pbreak{position:absolute;left:-14px;right:-14px;border-top:2px dashed var(--bad);pointer-events:none}
.pbreak span{position:absolute;right:0;top:-11px;background:var(--bad);color:#fff;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.03em}

/* ---------- Editor: accordion sections ---------- */
.sec{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin:0 0 10px;box-shadow:var(--shadow);transition:box-shadow .2s,opacity .2s}
.sec.dragging,.item.dragging,.bul.dragging{opacity:.45}
.sec.hid .sh .ttl{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-2)}
.sh{display:flex;align-items:center;gap:4px;padding:6px 8px 6px 4px;cursor:pointer;user-select:none;min-height:48px}
.sh .ttl{flex:1;font-weight:700;font-size:.95rem;display:flex;align-items:center;gap:8px;min-width:0}
.sh .ttl .ic{color:var(--accent)}
.sh .cnt{font-size:.72rem;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:2px 8px;font-weight:700}
.sh .chev{transition:transform var(--dur) var(--ease);display:grid;place-items:center;width:32px;color:var(--muted)}
.sec.open .sh .chev{transform:rotate(180deg)}
.sb{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--dur) var(--ease)}
.sec.open .sb{grid-template-rows:1fr}
.sb>div{overflow:hidden;min-height:0}
.sb .inner{padding:2px 14px 14px}
.handle{cursor:grab;color:var(--line-2);background:none;border:0;width:30px;height:40px;display:grid;place-items:center;border-radius:6px;flex:none;touch-action:none}
.handle:hover{color:var(--muted);background:var(--surface-2)} .handle:active{cursor:grabbing}
.item{border:1px solid var(--line);border-radius:10px;padding:8px 10px 10px 4px;margin-top:10px;background:var(--bg);display:grid;grid-template-columns:30px minmax(0,1fr);gap:2px 6px;transition:border-color .2s}
.item:hover{border-color:var(--line-2)}
.item .ih{grid-column:1/-1;display:flex;align-items:center;gap:4px;min-height:36px}
.item .il{flex:1;font-weight:700;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.item .ibody{grid-column:2}
.mv{display:none}
@media (pointer:coarse){.mv{display:inline-grid}}
.bl{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.bul{display:flex;gap:2px;align-items:flex-start}
.bul .handle{height:40px}
.bul .ib{width:36px}
.bul textarea{flex:1;padding:9px 10px;font-size:.88rem}
.bul .ib{margin-top:2px}
.addrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:2px 3px 2px 11px;font-size:.84rem;font-weight:600;animation:chipIn .25s var(--ease) both;min-height:34px}
.chip .ib{width:30px;height:30px;border-radius:50%}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.miss{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.miss .ib{color:var(--bad)} .chip.miss .ib:hover{background:var(--bad);color:#fff}
.chipin{flex:1;min-width:140px;border-style:dashed!important;min-height:32px!important;padding:5px 10px!important;font-size:.85rem!important}
.gname{font-weight:700!important;min-height:36px!important;padding:5px 9px!important}
.photo-prev{width:56px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}

/* ---------- Resume page (A4 / Letter) ---------- */
.page{--fs:1;--acc:#1f3a5f;background:#fff;color:#1a1a1a;width:210mm;min-height:297mm;padding:16mm;font-family:var(--ui);font-size:calc(10.5pt*var(--fs));line-height:1.38;box-shadow:0 24px 60px -30px rgba(0,0,0,.45);position:relative;overflow-wrap:anywhere}
.page.letter{width:8.5in;min-height:11in}
.page a{color:inherit;text-decoration:none}
.page h1{font-size:2em;font-weight:700;letter-spacing:-.01em;line-height:1.1;color:var(--acc)}
.page .hl{margin:3px 0 0;font-size:1.05em;font-weight:600;color:#333}
.page .ct{margin:4px 0 0;font-size:.92em;color:#444}
.page .ct .sep{color:#999;margin:0 .35em}
.page .rh .ct .cb{white-space:nowrap}
.page h2{font-size:.98em;text-transform:uppercase;letter-spacing:.1em;color:var(--acc);border-bottom:1.5px solid var(--acc);padding-bottom:2px;margin:11px 0 6px;font-weight:700;break-after:avoid}
.page p{margin:0}
.page .ent{margin:0 0 6px;break-inside:avoid}
.page .ent .r1{display:flex;justify-content:space-between;gap:12px;font-weight:700}
.page .ent .r1 .rt{font-weight:500;color:#555;white-space:nowrap;font-size:.95em}
.page .ent .r2{display:flex;justify-content:space-between;gap:12px;color:#444;font-style:italic;font-size:.97em}
.page .ent .meta{color:#444;font-size:.95em}
.page ul{margin:3px 0 0;padding-left:1.15em} .page li{margin:1px 0;break-inside:avoid}
.page .sk{margin:0 0 3px} .page .sk b{font-weight:700}
.page .inl{color:#333}
.page .photo{width:28mm;height:28mm;object-fit:cover;border-radius:4px;float:right;margin:0 0 6px 10px}
.page .pers{font-size:.9em;color:#555;margin-top:2px}
/* Classic + Academic: Lora headings, centred header */
.page.classic .rh,.page.academic .rh{text-align:center;border-bottom:2px solid var(--acc);padding-bottom:8px;margin-bottom:4px}
.page.classic h1,.page.classic h2,.page.academic h1,.page.academic h2,.page.classic .hl,.page.academic .hl{font-family:var(--serif)}
.page.classic h2,.page.academic h2{border-bottom-color:#bbb;letter-spacing:.08em}
.page.academic{padding:18mm;line-height:1.42}
.page.academic h1{font-size:1.75em;letter-spacing:.02em}
.page.academic h2{text-transform:none;font-size:1.12em;letter-spacing:0;border-bottom:1px solid var(--acc)}
.page.academic ol{margin:3px 0 0;padding-left:1.4em}
/* Modern: two columns, linear DOM (main then sidebar) */
.page.modern{padding:14mm}
.page.modern .rh{border-left:6px solid var(--acc);padding-left:10px;margin-bottom:8px}
.page.modern .body{display:grid;grid-template-columns:minmax(0,1fr) 58mm;gap:0 8mm;align-items:start}
.page.modern .side{background:color-mix(in srgb,var(--acc) 7%,#fff);padding:4mm 5mm;border-radius:3px}
.page.modern .side h2{border-bottom:0;font-size:.85em;margin-top:9px}
.page.modern .side h2:first-child{margin-top:0}
.page.modern .side .sk{font-size:.95em;margin-bottom:5px} .page.modern .side .sk b{display:block;color:#333}
.page.modern .side .ct{margin:0 0 4px;font-size:.92em;color:#333}
.page.modern .side .ct .sep{display:none}
.page.modern .side .ct a{display:block}
/* Compact: dense one-pager */
.page.compact{padding:12mm;font-size:calc(9.6pt*var(--fs));line-height:1.3}
.page.compact h1{font-size:1.7em} .page.compact h2{margin:7px 0 3px;font-size:.9em}
.page.compact .ent{margin-bottom:3px} .page.compact ul{margin-top:1px} .page.compact .rh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2px solid var(--acc);padding-bottom:5px}
.page.compact .rh .ct{text-align:right;max-width:46%}
.page.compact .rh .ct .sep{display:block;height:0;overflow:hidden}

/* ---------- Drawer (ATS) ---------- */
.scrim{position:fixed;inset:0;background:rgba(35,35,35,.35);backdrop-filter:blur(2px);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100vw);background:var(--bg);z-index:50;transform:translateX(102%);transition:transform .3s var(--ease);box-shadow:-20px 0 60px -30px rgba(0,0,0,.5);display:flex;flex-direction:column}
body.drawer-open .scrim{opacity:1;pointer-events:auto} body.drawer-open .drawer{transform:none}
.drawer header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.drawer header h2{font-family:var(--serif);font-size:1.15rem;font-weight:600;flex:1}
.drawer .body{padding:16px;overflow:auto;flex:1}
.scorecard{display:grid;grid-template-columns:140px minmax(0,1fr);gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.bigring{width:140px;height:140px;position:relative}
.bigring svg{width:100%;height:100%;transform:rotate(-90deg)}
.bigring circle{fill:none;stroke-width:9;stroke-linecap:round} .bigring .bg{stroke:var(--surface-3)} .bigring .fg{stroke:currentColor;transition:stroke-dashoffset .9s var(--ease)}
.bigring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:2.1rem;font-weight:700;letter-spacing:-.02em;font-family:var(--serif)}
.verdict{font-family:var(--serif);font-size:1.2rem;font-weight:600}
.sub{display:flex;flex-direction:column;gap:5px;margin-top:8px;font-size:.85rem}
.bar{height:8px;background:var(--surface-3);border-radius:999px;overflow:hidden} .bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .6s var(--ease)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.panel h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:6px}
.panel h3 .ic{color:var(--accent)}
.panel+.panel,.panel+.scorecard,.scorecard+.panel{margin-top:12px}
.fix{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.fix:first-of-type{border-top:0}
.fix .st{display:grid;place-items:center;margin-top:1px}
.fix.pass .st{color:var(--ok)} .fix.warn .st{color:var(--warn)} .fix.fail .st{color:var(--bad)}
.fix b{font-size:.92rem} .fix .d{font-size:.84rem;color:var(--muted);grid-column:2;margin-top:2px}
.fix .pts{font-size:.78rem;font-weight:700;color:var(--muted);white-space:nowrap;background:var(--surface-2);padding:2px 8px;border-radius:999px}
.fix .go{grid-column:2;margin-top:6px}

/* ---------- Modal ---------- */
.mscrim{position:fixed;inset:0;background:rgba(35,35,35,.4);z-index:60;display:none;place-items:center;padding:16px;animation:fadeIn .2s}
.mscrim.open{display:grid}
.modal{background:var(--surface);border-radius:16px;width:min(620px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 80px -30px rgba(0,0,0,.5);animation:pop .25s var(--ease);padding:18px 20px 20px}
.modal h2{font-family:var(--serif);font-size:1.25rem;font-weight:600;display:flex;align-items:center;gap:10px}
.modal h2 .ib{margin-left:auto}
.sug{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;background:var(--bg)}
.sug .lab{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);font-weight:700}
.sug p{margin:4px 0 8px;font-size:.92rem}
.orig{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:.9rem;margin-top:10px;color:var(--muted)}
.mactions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.todo{border:1px dashed var(--line-2);border-radius:12px;padding:10px 12px;background:var(--surface)}
.todo h4{margin:0 0 4px;font-size:.92rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.todo code{font-size:.78rem;background:var(--surface-2);padding:1px 6px;border-radius:5px}

/* ---------- Cover letter + About pages ---------- */
.cover{display:grid;grid-template-columns:450px minmax(0,1fr);height:100%}
.cover .form{overflow:auto;padding:14px;border-right:1px solid var(--line)}
.cover .form .fields{margin-top:6px}
.cover .pv{background:var(--paper-bg);overflow:auto;padding:24px;display:flex;flex-direction:column;align-items:center}
.letter{--acc:#1f3a5f;background:#fff;width:210mm;min-height:297mm;padding:22mm 20mm;font-size:11pt;line-height:1.55;color:#1a1a1a;box-shadow:0 24px 60px -30px rgba(0,0,0,.45)}
.letter.letterpaper{width:8.5in;min-height:11in}
.letter .lh{border-bottom:2px solid var(--acc);padding-bottom:8px;margin-bottom:18px}
.letter .lh b{font-family:var(--serif);font-size:1.5em;color:var(--acc)}
.letter .lh div{color:#444;font-size:.92em}
.letter p{margin:0 0 12px;white-space:pre-wrap}
.letter .sig{margin-top:22px}
.about{height:100%;overflow:auto;padding:22px 18px 80px}
.about .wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
.about h2{font-family:var(--serif);font-size:1.35rem;font-weight:600;margin-bottom:6px}
.about h3{font-size:1rem;margin:14px 0 4px}
.about p{margin:0;color:var(--muted)}
.about table{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:8px}
.about th,.about td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.about th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);font-size:.88rem;padding:8px 0;display:flex;align-items:center;gap:8px}

/* ---------- Toasts ---------- */
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:toastIn .3s var(--ease),toastOut .3s var(--ease) 2.9s both;display:flex;align-items:center;gap:8px;max-width:min(92vw,520px)}
.toast.ok{background:var(--ok)} .toast.bad{background:var(--bad)}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .brand small{display:none}
  .pvbar .fscale{display:none}
}
@media (max-width:900px){
  .topbar{gap:6px;padding:0 10px}
  .brand h1,.topbar .seg,.topbar .btn span.t{display:none}
  .topbar .btn{padding:8px 10px}
  .vbtn{max-width:104px;padding:6px 8px;min-width:0}
  .pill{padding:4px 10px 4px 5px;gap:6px} .pill .lbl{display:none}
  .topbar .btn{padding:8px 9px}
  body[data-page=edit] .mobilebar,body[data-page=ats] .mobilebar,body[data-page=cover] .mobilebar{display:flex}
  body[data-page=edit] #view,body[data-page=ats] #view,body[data-page=cover] #view{height:calc(100vh - var(--top) - var(--nav) - 54px)}
  .app,.cover{grid-template-columns:minmax(0,1fr)}
  body[data-mview=preview] .editor,body[data-mview=preview] .cover .form{display:none}
  body[data-mview=editor] .cover .pv{display:none}
  /* keep the hidden preview laid out (off-screen) so page count and ATS length check stay correct */
  body[data-mview=editor] .preview{position:absolute;left:-200vw;top:0;width:100%;height:100%;visibility:hidden;pointer-events:none}
  .editor{border-right:0}
  .pvscroll{padding:14px}
  .pvbar{gap:6px;padding:6px 10px} .pvbar .fscale{display:none}
  .fields{grid-template-columns:minmax(0,1fr)}
  .about .wrap{grid-template-columns:minmax(0,1fr)}
  .scorecard{grid-template-columns:110px minmax(0,1fr)} .bigring{width:110px;height:110px} .bigring .num{font-size:1.7rem}
  .drawer .body{padding:12px}
}
@media (max-width:420px){
  .pvbar .swatches{display:none}
}

/* ---------- Print: only the resume (or letter) page, real page size ---------- */
@media print{
  html,body{overflow:visible;height:auto;background:#fff}
  .topbar,.subnav,.mobilebar,.pvbar,.editor,.drawer,.scrim,#toasts,.mscrim,.pop,.cover .form,.pbreak,.about,.tour-scrim,.tour-card,.tour-spot{display:none!important}
  #view{height:auto}
  .app,.cover{display:block;height:auto}
  .preview,.cover .pv{display:block!important;overflow:visible;background:none;padding:0;height:auto}
  .preview{position:static!important;left:auto!important;width:auto!important;visibility:visible!important}
  .pvscroll{padding:0;overflow:visible}
  .sheetwrap{width:auto!important;height:auto!important;margin:0}
  .sheet{transform:none!important}
  .page,.letter{width:auto!important;min-height:0!important;padding:0!important;box-shadow:none;margin:0}
  .page.modern .side{background:#f3f3f3!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  a[href]::after{content:none!important}
  .page.bold .rh{padding:8mm 10mm!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .page.bold section{padding:0!important}
  /* printable application report (#tracker › Print report) */
  body[data-page=tracker] #view-edit,body[data-page=tracker] .preview{display:none!important}
  body[data-page=tracker] #view-tracker{display:block!important;height:auto;overflow:visible;padding:0}
  body[data-page=tracker] .board,body[data-page=tracker] .phead,body[data-page=tracker] .nopr{display:none!important}
  body[data-page=tracker] .report{display:block!important}
}

/* ---------- Sub navigation (second row under the top bar) ---------- */
.subnav{height:var(--nav);display:flex;align-items:center;gap:2px;padding:0 10px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;position:relative;z-index:20}
.subnav::-webkit-scrollbar{display:none}
.subnav a{display:inline-flex;align-items:center;gap:6px;padding:0 12px;height:var(--nav);font-weight:600;font-size:.86rem;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;flex:none;transition:color .15s,border-color .15s}
.subnav a:hover{color:var(--ink)}
.subnav a.on{color:var(--accent);border-bottom-color:var(--accent)}
.subnav a .mini{font-size:.68rem;background:var(--accent);color:#fff;border-radius:999px;padding:1px 6px;font-weight:700}

/* ---------- Generic page layout for the new modules ---------- */
.pg{height:100%;overflow:auto;padding:18px 18px 90px}
.pg .wrap{max-width:1180px;margin:0 auto}
.phead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.phead h2{font-family:var(--serif);font-size:1.45rem;font-weight:600}
.phead p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.phead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.phead .acts select{width:auto;min-width:170px;max-width:260px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);transition:transform .2s var(--ease)}
.kpi:hover{transform:translateY(-2px)}
.kpi .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.kpi .k .ic{color:var(--accent)}
.kpi .v{font-family:var(--serif);font-size:1.6rem;font-weight:600;letter-spacing:-.02em}
.kpi .s{font-size:.78rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.sidemain{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:14px;align-items:start}
.panel h2{font-family:var(--serif);font-size:1.15rem;font-weight:600;margin-bottom:6px}
.toolrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolrow input[type=search],.toolrow select{width:auto;min-width:160px;flex:1}
.pillbtn{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.82rem;cursor:pointer;min-height:36px;color:var(--muted);transition:background .15s,color .15s}
.pillbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.welcome{background:linear-gradient(135deg,var(--accent-soft),var(--surface));border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:0 0 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.welcome .tx{flex:1;min-width:180px;font-size:.9rem}
.welcome .tx b{display:block;font-family:var(--serif);font-size:1rem}
.svgchart{width:100%;height:auto;display:block}
.svgchart text{font-family:var(--ui);fill:var(--muted)}
.svgchart .lbl{fill:var(--ink);font-weight:600}
.svgchart rect{transition:width .7s var(--ease)}

/* ---------- Job application tracker ---------- */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{background:var(--surface-2);border-radius:var(--radius);padding:10px;min-height:180px;border:1px solid var(--line);transition:outline-color .2s}
.col h3{font-size:.76rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;align-items:center;gap:6px;margin:0 4px 8px}
.col h3 .ic{color:var(--accent)}
.col h3 .cnt{margin-left:auto;background:var(--surface);border-radius:999px;padding:1px 8px;font-size:.72rem}
.col.drop{outline:2px dashed var(--accent);outline-offset:-4px}
.appc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow);transition:transform .2s var(--ease),box-shadow .2s,opacity .2s}
.appc:hover{transform:translateY(-2px)}
.appc.dragging{opacity:.45}
.appc .hd{display:flex;align-items:flex-start;gap:6px}
.appc .hd b{flex:1;font-size:.92rem;min-width:0;overflow-wrap:anywhere}
.appc .hd .handle{height:28px;width:24px}
.appc .co{color:var(--muted);font-size:.84rem;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.appc .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;align-items:center}
.vchip{font-size:.7rem;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 7px;font-weight:700;display:inline-flex;align-items:center;gap:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dchip{font-size:.7rem;background:var(--surface-2);color:var(--muted);border-radius:6px;padding:2px 7px;font-weight:600;white-space:nowrap}
.dchip.late{background:var(--warn-soft);color:var(--warn)}
.dchip.good{background:var(--ok-soft);color:var(--ok)}
.appc .acts{display:flex;gap:2px;margin-top:6px;justify-content:flex-end;align-items:center}
.appc .acts .ib{width:34px;height:34px}
.stline{display:flex;gap:3px;margin-top:8px}
.stline i{flex:1;height:4px;border-radius:2px;background:var(--line-2);transition:background .3s}
.stline i.on{background:var(--accent)}
.closed{margin-top:14px}
.closed summary{cursor:pointer;font-weight:700;font-size:.9rem;padding:8px 0;display:flex;align-items:center;gap:8px;list-style:none}
.closed summary::-webkit-details-marker{display:none}
.closed .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin-top:6px}
.closed .appc{margin:0;opacity:.85}
.vstats{width:100%;border-collapse:collapse;font-size:.88rem}
.vstats th,.vstats td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.vstats th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.vstats td.n{text-align:right;font-variant-numeric:tabular-nums}
.vstats th.n{text-align:right}
.report{display:none}
.hist{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:.86rem}
.hist div{display:flex;gap:10px;align-items:center}
.hist .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.hist small{color:var(--muted);margin-left:auto;white-space:nowrap}

/* ---------- Skills-gap analyser ---------- */
.rolegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.rolecard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);transition:transform .2s var(--ease),border-color .2s}
.rolecard:hover{transform:translateY(-2px)}
.rolecard.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rolecard b{display:flex;align-items:center;gap:8px;font-size:.95rem}
.rolecard b .ic{color:var(--accent)}
.rolecard .pct{font-family:var(--serif);font-size:1.5rem;font-weight:600;letter-spacing:-.02em}
.rolecard .bar{height:6px}
.skl{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.skl:first-of-type{border-top:0}
.skl .st{display:grid;place-items:center}
.skl.have .st{color:var(--ok)} .skl.miss .st{color:var(--bad)} .skl.nice .st{color:var(--warn)}
.skl b{font-size:.92rem}
.skl .why{grid-column:2;font-size:.82rem;color:var(--muted)}
.skl .via{font-size:.74rem;color:var(--muted);white-space:nowrap}
.plan{display:grid;gap:10px}
.week{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.week .wk{font-family:var(--serif);font-weight:600;font-size:.95rem;color:var(--accent);line-height:1.2}
.week .wk small{display:block;font-family:var(--ui);font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.week b{display:block;font-size:.92rem}
.week p{margin:2px 0 0;font-size:.84rem;color:var(--muted)}
.week .res{font-size:.8rem;margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* ---------- Interview prep + STAR builder ---------- */
.qlist{display:flex;flex-direction:column;gap:6px;max-height:62vh;overflow:auto;padding-right:2px}
.q{display:grid;grid-template-columns:22px minmax(0,1fr);gap:2px 10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;font:inherit;color:inherit;transition:border-color .2s,transform .2s var(--ease)}
.q:hover{transform:translateY(-1px);border-color:var(--line-2)}
.q.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.q .st{display:grid;place-items:center;color:var(--line-2);margin-top:2px}
.q.done .st{color:var(--ok)}
.q .qt{font-size:.9rem;font-weight:600}
.q .qm{grid-column:2;font-size:.74rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.star{display:grid;gap:12px}
.star .lab{display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.star .lab .lt{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.8rem;font-family:var(--serif);text-transform:none;letter-spacing:0}
.star textarea{min-height:68px}
.pick{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto}
.pick .pb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);font-size:.84rem}
.pick .pb .bs{display:flex;gap:2px}
.pick .pb.hot{border-color:var(--accent)}
.ans{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:.92rem;white-space:pre-wrap;line-height:1.5}
.ans:empty::before{content:'Your composed answer appears here.';color:var(--muted)}
.meterrow{display:flex;gap:14px;align-items:center;font-size:.8rem;color:var(--muted);flex-wrap:wrap;margin-top:8px}
.meterrow b{color:var(--ink)}
.meterrow .good{color:var(--ok)} .meterrow .warnc{color:var(--warn)}

/* ---------- LinkedIn generator ---------- */
.variant{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:start;margin-top:8px}
.variant p{margin:0;font-size:.92rem;overflow-wrap:anywhere;grid-column:1;grid-row:1}
.variant .cc{font-size:.72rem;color:var(--muted);font-weight:700;white-space:nowrap;grid-column:1;grid-row:2}
.variant .cc.over{color:var(--bad)}
.variant .acts{display:flex;gap:4px;grid-column:2;grid-row:1/3;align-self:center}
.variant.chosen{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.about-box{white-space:pre-wrap;font-size:.92rem;line-height:1.55;min-height:220px}
.ccbar{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);margin-top:6px}
.ccbar .bar{flex:1}
.ccbar .bar>i.over{background:var(--bad)}
.toplist{display:flex;flex-wrap:wrap;gap:6px}
.toplist .chip{cursor:default}
.toplist .chip small{color:var(--muted);font-weight:600;margin-left:4px;margin-right:6px}

/* ---------- Settings + activity ---------- */
.srow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.srow:first-of-type{border-top:0}
.srow .sl{flex:1;min-width:200px}
.srow .sl b{display:block;font-size:.92rem}
.srow .sl small{color:var(--muted);font-size:.8rem}
.srow select,.srow input[type=number]{width:210px;max-width:100%}
.srow .chk{min-height:36px}
.kbd{display:inline-block;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:6px;padding:1px 7px;font-size:.78rem;font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--surface)}
.shortcuts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;align-items:center;font-size:.88rem}
.shortcuts .kbd{justify-self:start;max-width:180px}
.bellwrap{position:relative}
.nbadge{position:absolute;top:3px;right:3px;min-width:17px;height:17px;border-radius:999px;background:var(--bad);color:#fff;font-size:.62rem;font-weight:700;display:grid;place-items:center;padding:0 4px;pointer-events:none}
#bellPop{right:0;min-width:320px;max-width:min(92vw,380px);padding:0}
#bellPop .nhead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700;font-size:.85rem}
#bellPop .nhead .btn{margin-left:auto}
#bellPop .nlist{max-height:360px;overflow:auto}
.nrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:2px 10px;padding:10px 12px;border-top:1px solid var(--line);align-items:start;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit;cursor:pointer}
.nrow:first-child{border-top:0}
.nrow:hover{background:var(--surface-2)}
.nrow.unread{background:var(--accent-soft)}
.nrow .t{font-size:.88rem;line-height:1.35}
.nrow small{color:var(--muted);font-size:.74rem;grid-column:2}
.nrow .ic{margin-top:3px}
.nrow.ok .ic{color:var(--ok)} .nrow.warn .ic{color:var(--warn)} .nrow.info .ic{color:var(--accent)}
.nrow .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px}
.actlist .nrow{border-radius:0}
.actlist .nrow:first-child{border-top:0}

/* ---------- Onboarding tour (spotlight) ---------- */
.tour-scrim{position:fixed;inset:0;z-index:90;display:none}
body.touring .tour-scrim{display:block}
.tour-spot{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(35,35,35,.55);transition:top .35s var(--ease),left .35s var(--ease),width .35s var(--ease),height .35s var(--ease);pointer-events:none;z-index:91;display:none}
body.touring .tour-spot{display:block}
.tour-card{position:fixed;z-index:92;background:var(--surface);border-radius:14px;padding:16px 18px;width:min(340px,calc(100vw - 24px));box-shadow:0 30px 80px -30px rgba(0,0,0,.6);animation:pop .25s var(--ease);display:none}
body.touring .tour-card{display:block}
.tour-card h4{font-family:var(--serif);font-size:1.1rem;font-weight:600;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.tour-card h4 .ic{color:var(--accent)}
.tour-card p{margin:0;color:var(--muted);font-size:.9rem}
.tour-card .acts{display:flex;align-items:center;gap:8px;margin-top:12px}
.tour-card .dots{flex:1;display:flex;gap:4px}
.tour-card .dots i{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.tour-card .dots i.on{background:var(--accent)}

/* ---------- Two more templates: Minimal + Bold header ---------- */
.page.minimal{padding:18mm}
.page.minimal h1{font-weight:500;font-size:2.15em;letter-spacing:-.02em;color:#1a1a1a}
.page.minimal .hl{color:var(--acc);font-weight:600}
.page.minimal .rh{padding-bottom:10px;border-bottom:1px solid #ddd;margin-bottom:6px}
.page.minimal h2{color:#7a7a7a;border-bottom:0;font-size:.76em;letter-spacing:.18em;margin:14px 0 5px;padding-bottom:0}
.page.minimal .ent .r1 .rt{color:#888}
.page.minimal .ent .r2{font-style:normal;color:#555}
.page.bold{padding:0 0 14mm}
.page.bold .rh{background:var(--acc);color:#fff;padding:12mm 16mm 9mm;margin:0 0 5mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page.bold .rh h1,.page.bold .rh .hl,.page.bold .rh .ct,.page.bold .rh .ct a,.page.bold .rh .ct .sep,.page.bold .rh .pers{color:#fff}
.page.bold .rh .hl{opacity:.92} .page.bold .rh .ct{opacity:.85}
.page.bold section{padding:0 16mm}
.page.bold h2{border-bottom:0;border-left:4px solid var(--acc);padding-left:8px;font-size:.95em;margin:12px 0 6px}
/* ---------- Urdu and bilingual CV modes ---------- */
/* Urdu page: RTL frame and Nastaliq headings; Karla first so Latin text keeps its face, Urdu glyphs fall back to Nastaliq.
   Content blocks get dir="auto" in renderPreview(), so English lines stay LTR and Urdu lines run RTL. */
.page.ur{direction:rtl;font-family:var(--ui),var(--urdu);line-height:1.5}
.page.ur h1,.page.ur h2,.page.ur .hl{font-family:var(--ui),var(--urdu)}
.page.ur h1{font-size:1.9em;line-height:1.5}
.page.ur h2{text-transform:none;letter-spacing:0;font-size:1.12em;line-height:1.75;padding-bottom:0}
.page.ur .cb,.page.ur .rt{direction:ltr;unicode-bidi:isolate}
.page.ur.modern .side .ct{direction:ltr;text-align:right}
.page.ur ul,.page.ur ol{padding:0}
.page.ur li{margin-inline-start:1.15em}
.page.ur ol li{margin-inline-start:1.4em}
.page.ur .photo{float:left;margin:0 10px 6px 0}
.page.ur.bold h2{border-left:0;border-right:4px solid var(--acc);padding-left:0;padding-right:8px}
.page.ur.modern .rh{border-left:0;border-right:6px solid var(--acc);padding-left:0;padding-right:10px}
.page.bi h2 .urh{font-family:var(--urdu);font-size:1.05em;color:#555;text-transform:none;letter-spacing:0;margin-left:10px;direction:rtl;unicode-bidi:isolate;font-weight:400;line-height:1.4}
.page.bi.modern .side h2 .urh{display:block;margin:0}
#toasts{width:min(92vw,520px);align-items:center}
.about .modtbl td:first-child{white-space:nowrap}
.urnote{font-family:var(--urdu);direction:rtl;font-size:1.05rem;line-height:2;text-align:right}

.page .urn{font-family:var(--urdu);font-weight:400;line-height:1.7}
.modal.wide{width:min(1000px,100%)}
body.reduce-motion *,body.reduce-motion *::before,body.reduce-motion *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}

/* ---------- Responsive additions ---------- */
/* six templates need the room: below 1480 px the brand text becomes visually hidden (still read by screen readers) */
@media (max-width:1480px){
  .brand>div:not(.logo){position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .vbtn{max-width:210px}
}
@media (max-width:1180px){
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .subnav{padding:0 6px}
  .subnav a{padding:0 10px;font-size:.82rem}
  .pg{padding:12px 12px 90px}
  .grid2,.sidemain{grid-template-columns:minmax(0,1fr)}
  .phead .acts{margin-left:0;width:100%}
  .qlist{max-height:300px}
  .topbar .bellwrap .btn{padding:8px 9px}
  #coverLink,#helpLink{display:none}
  .vbtn{max-width:104px}
  .welcome .tx{flex-basis:100%}
  #bellPop{position:fixed;top:var(--top);left:8px;right:8px;max-width:none;min-width:0}
  .variant .acts{grid-row:2;grid-column:1}
  .variant .cc{grid-row:3}
}
@media (max-width:560px){
  .board{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis .kpi:last-child:nth-child(odd){grid-column:1/-1}
  .phead .acts select{max-width:none;flex:1}
  .rolegrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .week{grid-template-columns:44px minmax(0,1fr)}
}
</style>

// ---------- editor ----------
const handle = (lbl = 'Drag to reorder') =>
  `<button class="handle" aria-label="${lbl} (or use arrow keys)" type="button">${ic('grip')}</button>`;
const mvBtns = (path, i, n) =>
  `<button class="ib sm mv" data-act="mv" data-path="${path}" data-i="${i}" data-d="-1" aria-label="Move up" ${i === 0 ? 'disabled' : ''}>${ic('arrow-up')}</button><button class="ib sm mv" data-act="mv" data-path="${path}" data-i="${i}" data-d="1" aria-label="Move down" ${i === n - 1 ? 'disabled' : ''}>${ic('arrow-down')}</button>`;
function fieldHTML(path, label, val, type = 'text', full = false, extra = '') {
  const id = 'f_' + path.replace(/\./g, '_');
  if (type === 'check')
    return `<label class="chk" for="${id}"><input type="checkbox" id="${id}" data-b="${path}" ${val ? 'checked' : ''}> ${label}</label>`;
  if (type === 'textarea')
    return `<div class="f full"><label for="${id}">${label}</label><textarea id="${id}" class="grow" data-b="${path}" rows="3">${esc(val)}</textarea></div>`;
  return `<div class="f ${full ? 'full' : ''}"><label for="${id}">${label}</label><input type="${type}" id="${id}" data-b="${path}" value="${esc(val)}" ${type === 'month' ? 'placeholder="YYYY-MM"' : ''} ${extra}></div>`;
}
function bulletsHTML(base, bullets) {
  return `<div class="bl" data-sort="${base}.bullets">${bullets.map((b, j) => `<div class="bul" data-idx="${j}">${handle('Drag bullet')}<textarea class="grow" rows="1" data-b="${base}.bullets.${j}" placeholder="Start with a strong verb, add a number…" aria-label="Bullet ${j + 1}">${esc(b)}</textarea><button class="ib" data-act="improve" data-path="${base}.bullets" data-i="${j}" aria-label="Improve this bullet" title="Improve bullet">${ic('sparkles')}</button><button class="ib" data-act="del-bullet" data-path="${base}.bullets" data-i="${j}" aria-label="Remove bullet">${ic('x')}</button></div>`).join('')}</div>
  <div class="addrow"><button class="btn sm soft" data-act="add-bullet" data-path="${base}.bullets">${ic('plus')} Bullet</button></div>`;
}

function autoGrow(t) {

function reorder(path, order) {

// generic drag-and-drop sortable: drag starts only from a .handle; arrow keys on the handle also move the row
function sortable(list, onMove) {
  let dragEl = null;
  const rows = () => [...list.children].filter(c => c.dataset.idx != null);
  list.addEventListener('pointerdown', e => {
    const h = e.target.closest('.handle');
    if (!h) return;
    const it = h.closest('[data-idx]');
    if (it && it.parentElement === list) it.draggable = true;
  });
  list.addEventListener('dragstart', e => {
    const it = e.target.closest?.('[data-idx]');
    if (!it || it.parentElement !== list || !it.draggable) return;
    dragEl = it;
    it.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', 'row');
  });
  list.addEventListener('dragover', e => {
    if (!dragEl) return;
    e.preventDefault();
    const over = e.target.closest('[data-idx]');
    if (!over || over === dragEl || over.parentElement !== list) return;
    const r = over.getBoundingClientRect();
    list.insertBefore(dragEl, e.clientY > r.top + r.height / 2 ? over.nextSibling : over);
  });
  list.addEventListener('dragend', () => {
    if (!dragEl) return;
    dragEl.classList.remove('dragging');
    dragEl.draggable = false;
    const order = rows().map(c => +c.dataset.idx);
    dragEl = null;
    if (order.some((v, i) => v !== i)) onMove(order);
  });
  list.addEventListener('keydown', e => {
    if (!e.target.classList.contains('handle') || !['ArrowUp', 'ArrowDown'].includes(e.key)) return;
    const it = e.target.closest('[data-idx]');
    if (it.parentElement !== list) return;
    e.preventDefault();
    const all = rows(),
      i = all.indexOf(it),
      j = e.key === 'ArrowUp' ? i - 1 : i + 1;
    if (j < 0 || j >= all.length) return;
    const order = all.map((_, k) => k);
    [order[i], order[j]] = [order[j], order[i]];
    onMove(order);
    setTimeout(() => $(`[data-sort="${list.dataset.sort}"] [data-idx="${j}"] .handle`)?.focus(), 0);
  });
}

// editor events (delegated)

ED.addEventListener('keydown', e => {

function addChip(g, raw) {
  const vals = raw
    .split(',')
    .map(s => s.trim())
    .filter(Boolean);
  if (!vals.length) return;
  const grp = R.skills[g];
  vals.forEach(v => {
    if (!grp.items.some(x => x.toLowerCase() === v.toLowerCase())) grp.items.push(v);
  });
  changed();
  renderEditor(`.chipin[data-g="${g}"]`);
}
function editorAction(b) {
  const a = b.dataset.act,
    i = +b.dataset.i,
    path = b.dataset.path;
  if (a === 'vis') {
    R.sections[i].visible = !R.sections[i].visible;
    changed();
    renderEditor();
  } else if (a === 'mv') moveItem(path, i, +b.dataset.d);
  else if (a === 'add-item') {
    const type = b.dataset.type;
    const arr = type === 'custom' ? R.custom.items : R[type];
    arr.push(ITEM_DEFS[type].blank());
    changed();
    renderEditor(
      `[data-sort="${type === 'custom' ? 'custom.items' : type}"] [data-idx="${arr.length - 1}"] input`
    );
  } else if (a === 'del-item') {
    const arr = getPath(R, path);
    arr.splice(i, 1);
    changed();
    renderEditor();
    toast('Entry removed');
  } else if (a === 'add-bullet') {
    const list = getPath(R, path);
    list.push('');
    changed();
    renderEditor(`[data-b="${path}.${list.length - 1}"]`);
  } else if (a === 'del-bullet') {
    const list = getPath(R, path);
    list.splice(i, 1);
    if (!list.length) list.push('');
    changed();
    renderEditor();
  } else if (a === 'improve') openImprover(path, i);
  else if (a === 'add-group') {
    R.skills.push({ id: uid(), group: 'New group', items: [] });
    changed();
    renderEditor(`[data-b="skills.${R.skills.length - 1}.group"]`);
  } else if (a === 'del-group') {
    R.skills.splice(i, 1);
    changed();
    renderEditor();
  } else if (a === 'del-chip') {
    R.skills[i].items.splice(+b.dataset.j, 1);
    changed();
    renderEditor();
  } else if (a === 'reset-sample') openSamplePicker();
  else if (a === 'tour-start') {
    dismissWelcome();
    startTour();
  } else if (a === 'tour-dismiss') dismissWelcome();
}

// Sample picker: replace the current version with a profile, or add it as a new version

  }
  fresh.id = R.id;

  renderAll();

// ---------- content model: one shape → HTML, TXT, Markdown and portfolio renderers ----------
// Headings follow the resume's language mode: English, Urdu, or both (bilingual).
function urTitle(type, r = R) {
  if (type !== 'custom') return SECTIONS[type].ur;
  const key = lower(r.custom.title).trim();
  return UR_HEADINGS[key] || SECTIONS.custom.ur;
}
function secTitle(type, r = R) {
  const en = type === 'custom' ? r.custom.title || SECTIONS.custom.title : SECTIONS[type].title;
  return r.lang === 'ur' ? urTitle(type, r) : en;
}
const presentLabel = r => (r.lang === 'ur' ? UR_LABELS.present : 'Present');
const rangeOf = (e, r = R) => {
  const a = fmtD(e.start);
  const b = e.present ? presentLabel(r) : fmtD(e.end);
  return [a, b].filter(Boolean).join(' – ');
};

// Block shapes: para · entries · lines · inline · skills
const entryBlock = entries => ({
  kind: 'entries',
  entries: entries
    .filter(e => e.head || e.sub || e.bullets?.some(Boolean))
    .map(e => ({ ...e, bullets: (e.bullets || []).filter(x => x && x.trim()) }))
});
const linesBlock = (arr, ordered = false) => ({ kind: 'lines', ordered, lines: arr.filter(Boolean) });
const joinParts = (...parts) => parts.filter(Boolean).join('');

const BLOCK_BUILDERS = {
  summary: r => (r.summary.trim() ? { kind: 'para', text: r.summary.trim() } : null),
  experience: r =>
    entryBlock(
      r.experience.map(e => ({
        head: e.role,
        right: rangeOf(e, r),
        sub: [e.company, e.city].filter(Boolean).join(', '),
        bullets: e.bullets
      }))
    ),
  education: r =>
    entryBlock(
      r.education.map(e => ({
        head: e.degree,
        right: rangeOf(e, r),
        sub: [e.institute, e.city].filter(Boolean).join(', '),
        meta: [e.grade, e.honours].filter(Boolean).join(' · ')
      }))
    ),
  projects: r =>
    entryBlock(
      r.projects.map(p => ({ head: p.name, right: p.link, link: p.link, sub: p.stack, bullets: p.bullets }))
    ),
  custom: r =>
    entryBlock(r.custom.items.map(i => ({ head: i.title, right: i.date, sub: i.sub, bullets: i.bullets }))),
  certifications: r =>
    linesBlock(
      r.certifications.map(
        c => c.name && joinParts(c.name, c.issuer && ' — ' + c.issuer, c.date && ' (' + fmtD(c.date) + ')')
      )
    ),
  awards: r =>
    linesBlock(
      r.awards.map(
        a =>
          a.title &&
          joinParts(a.title, a.by && ' — ' + a.by, a.date && ' (' + fmtD(a.date) + ')', a.note && ' · ' + a.note)
      )
    ),
  publications: r =>
    linesBlock(
      r.publications.map(
        p =>
          p.title &&
          joinParts(
            p.authors && p.authors + '. ',
            `“${p.title}”. `,
            [p.venue, p.year].filter(Boolean).join(', '),
            p.link && '. ' + p.link
          )
      ),
      true
    ),
  teaching: r =>
    linesBlock(
      r.teaching.map(
        x =>
          x.course &&
          joinParts(x.course, x.institute && ' — ' + x.institute, x.role && ', ' + x.role, x.term && ' (' + x.term + ')')
      )
    ),
  languages: r => ({
    kind: 'inline',
    items: r.languages.filter(l => l.name).map(l => (l.level ? `${l.name} (${l.level})` : l.name))
  }),
  skills: r => ({
    kind: 'skills',
    groups: r.skills.filter(g => g.items.length).map(g => ({ label: g.group, items: g.items }))
  })
};
const blockHasContent = b => {
  if (!b) return false;
  if (b.kind === 'para') return true;
  return (b.entries || b.lines || b.items || b.groups).length > 0;
};
function blocks(r = R) {
  return r.sections
    .filter(s => s.visible)
    .map(s => {
      const b = BLOCK_BUILDERS[s.type]?.(r);
      if (!b) return null;
      b.type = s.type;
      b.title = secTitle(s.type, r);
      b.titleUr = urTitle(s.type, r);
      return b;
    })
    .filter(blockHasContent);
}

// ---------- HTML renderer (the A4 page) ----------
const contactBits = c => [c.city, c.phone, c.email, c.linkedin, c.github, c.website].filter(Boolean);
const looksLikeUrl = s =>
  /^(https?:\/\/|www\.|[a-z0-9-]+\.[a-z]{2,}\/)/i.test(s) || (/\.[a-z]{2,}(\/|$)/i.test(s) && !s.includes(' '));
const linkify = (s, wbr = false) => {
  if (!looksLikeUrl(s)) return esc(s);
  const href = /^https?:/i.test(s) ? s : 'https://' + s;
  const text = wbr ? esc(s).replace(/\//g, '/<wbr>') : esc(s);
  return `<a href="${esc(href)}">${text}</a>`;
};
// Heading with the Urdu twin in bilingual mode
function headingHTML(b, r) {
  const ur = r.lang === 'bi' ? `<span class="urh">${esc(b.titleUr)}</span>` : '';
  return `<h2>${esc(b.title)}${ur}</h2>`;
}
function entryHTML(e) {
  const right = e.right ? `<span class="rt">${e.link ? linkify(e.right) : esc(e.right)}</span>` : '';
  const sub = e.sub ? `<div class="r2"><span>${esc(e.sub)}</span></div>` : '';
  const meta = e.meta ? `<div class="meta">${esc(e.meta)}</div>` : '';
  const bullets = e.bullets.length ? `<ul>${e.bullets.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
  return `<div class="ent"><div class="r1"><span>${esc(e.head)}</span>${right}</div>${sub}${meta}${bullets}</div>`;
}
function blockHTML(b, r = R) {
  const h2 = headingHTML(b, r);
  if (b.kind === 'para') return `<section>${h2}<p>${esc(b.text)}</p></section>`;
  if (b.kind === 'inline') {
    return `<section>${h2}<p class="inl">${b.items.map(esc).join(' <span class="sep">·</span> ')}</p></section>`;
  }
  if (b.kind === 'skills') {
    const rows = b.groups.map(g => `<p class="sk"><b>${esc(g.label)}:</b> ${g.items.map(esc).join(', ')}</p>`);
    return `<section>${h2}${rows.join('')}</section>`;
  }
  if (b.kind === 'lines') {
    const tag = b.ordered ? 'ol' : 'ul';
    return `<section>${h2}<${tag}>${b.lines.map(l => `<li>${esc(l)}</li>`).join('')}</${tag}></section>`;
  }
  return `<section>${h2}${b.entries.map(entryHTML).join('')}</section>`;
}
// Urdu mode prints the Urdu name as the heading; bilingual mode adds it under the English name
function nameHTML(r) {
  const c = r.contact;
  const en = esc(c.name) || 'Your Name';
  const ur = esc(c.nameUr || '');
  if (r.lang === 'ur') return `<h1>${ur || en}</h1>${ur && c.name ? `<p class="ct">${en}</p>` : ''}`;
  if (r.lang === 'bi' && ur) return `<h1>${en}</h1><p class="hl urn" lang="ur" dir="rtl">${ur}</p>`;
  return `<h1>${en}</h1>`;
}
function headerParts(r) {
  const c = r.contact;
  const cnicLabel = r.lang === 'ur' ? UR_LABELS.cnic : 'CNIC';
  return {
    pers: c.cnic && c.cnicNo ? `<p class="pers">${cnicLabel} ${esc(c.cnicNo)}</p>` : '',
    photo: c.photo && c.photoUrl ? `<img class="photo" src="${esc(c.photoUrl)}" alt="">` : '',
    name: nameHTML(r),
    headline: c.headline ? `<p class="hl">${esc(c.headline)}</p>` : '',
    ctLine: `<p class="ct">${contactBits(c)
      .map(x => `<span class="cb">${linkify(x)}</span>`)
      .join('<span class="sep">·</span>')}</p>`
  };
}
// Modern keeps the DOM linear: main column first, then the tinted sidebar
function modernHTML(r, bl, h) {
  const main = bl.filter(b => !SIDE_TYPES.includes(b.type));
  const side = bl.filter(b => SIDE_TYPES.includes(b.type));
  const contactTitle =
    r.lang === 'ur'
      ? UR_LABELS.contact
      : `Contact${r.lang === 'bi' ? `<span class="urh">${UR_LABELS.contact}</span>` : ''}`;
  const contactRows = contactBits(r.contact).map(x => `<p class="ct">${linkify(x, true)}</p>`);
  return `<header class="rh">${h.photo}${h.name}${h.headline}${h.pers}</header>
    <div class="body"><div class="main">${main.map(b => blockHTML(b, r)).join('')}</div>
    <aside class="side"><h2>${contactTitle}</h2>${contactRows.join('')}${side.map(b => blockHTML(b, r)).join('')}</aside></div>`;
}
function resumeHTML(r = R) {
  const bl = blocks(r);
  const h = headerParts(r);
  if (r.template === 'modern') return modernHTML(r, bl, h);
  const compact = r.template === 'compact';
  const header = `<header class="rh">${h.photo}<div>${h.name}${h.headline}${compact ? '' : h.ctLine}${h.pers}</div>${compact ? h.ctLine : ''}</header>`;
  return header + bl.map(b => blockHTML(b, r)).join('');
}

// ---------- plain text + Markdown exports ----------
const txtTitle = b => (R.lang === 'bi' ? `${b.title.toUpperCase()} · ${b.titleUr}` : b.title.toUpperCase());
function toTXT(r = R) {
  const c = r.contact;
  const L = [(c.name || '').toUpperCase()];
  if (c.headline) L.push(c.headline);
  L.push(contactBits(c).join(' | '));
  if (c.cnic && c.cnicNo) L.push('CNIC: ' + c.cnicNo);
  for (const b of blocks(r)) {
    L.push('', r === R ? txtTitle(b) : b.title.toUpperCase());
    if (b.kind === 'para') L.push(b.text);
    else if (b.kind === 'inline') L.push(b.items.join(' | '));
    else if (b.kind === 'skills') b.groups.forEach(g => L.push(`${g.label}: ${g.items.join(', ')}`));
    else if (b.kind === 'lines') b.lines.forEach((l, i) => L.push(b.ordered ? `${i + 1}. ${l}` : `- ${l}`));
    else {
      b.entries.forEach(e => {
        L.push([e.head, e.right].filter(Boolean).join(' | '));
        if (e.sub) L.push(e.sub);
        if (e.meta) L.push(e.meta);
        e.bullets.forEach(x => L.push('- ' + x));
        L.push('');
      });
    }
  }
  return L.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
}
function toMD(r = R) {
  const c = r.contact;
  const L = [`# ${c.name}`];
  if (c.headline) L.push(`**${c.headline}**`);
  L.push(contactBits(c).join(' · '));
  for (const b of blocks(r)) {
    L.push('', `## ${b.title}`, '');
    if (b.kind === 'para') L.push(b.text);
    else if (b.kind === 'inline') L.push(b.items.join(' · '));
    else if (b.kind === 'skills') b.groups.forEach(g => L.push(`- **${g.label}:** ${g.items.join(', ')}`));
    else if (b.kind === 'lines') b.lines.forEach((l, i) => L.push(b.ordered ? `${i + 1}. ${l}` : `- ${l}`));
    else {
      b.entries.forEach(e => {
        L.push(`### ${e.head}${e.right ? ` — *${e.right}*` : ''}`);
        if (e.sub) L.push(e.sub);
        if (e.meta) L.push(`_${e.meta}_`);
        if (e.bullets.length) L.push('', ...e.bullets.map(x => '- ' + x));
        L.push('');
      });
    }
  }
  return L.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
}

// ---------- preview: A4/Letter sheet, zoom, page breaks, language mode ----------
function pageClass(r = R) {
  const paper = r.paper === 'letter' ? 'letter' : '';
  const lang = r.lang && r.lang !== 'en' ? r.lang : '';
  return `page ${r.template} ${paper} ${lang}`.replace(/\s+/g, ' ').trim();
}
function renderPreview(fade = false) {
  const pg = $('#page');
  const P = PAPERS[R.paper] || PAPERS.a4;
  pg.className = pageClass();
  pg.dir = R.lang === 'ur' ? 'rtl' : 'ltr';
  pg.lang = R.lang === 'ur' ? 'ur' : 'en';
  pg.style.setProperty('--acc', ACCENTS[R.accent] || ACCENTS.navy);
  pg.style.setProperty('--fs', R.scale || 1);
  pg.innerHTML = resumeHTML();
  if (R.lang === 'ur') $$(':scope section p, :scope section li, :scope section .ent', pg).forEach(el => (el.dir = 'auto'));
  $('#printStyle').textContent = `@page{size:${P.css};margin:${TEMPLATES[R.template].margin}mm}`;
  // measure the natural height, then pad to whole pages and draw approximate break lines
  pg.style.minHeight = '';
  const h = pg.offsetHeight;
  pages = Math.max(1, Math.ceil((h - 2) / P.hpx));
  pg.style.minHeight = pages * P.hpx + 'px';
  $('#breaks').innerHTML = Array.from(
    { length: pages - 1 },
    (_, i) =>
      `<div class="pbreak" style="top:${(i + 1) * P.hpx}px"><span>page ${i + 2} starts (approx.)</span></div>`
  ).join('');
  if (fade) {
    const s = $('#sheet');
    s.classList.remove('fadein');
    void s.offsetWidth;
    s.classList.add('fadein');
  }
  applyZoom();
  renderPvbar();
}
function applyZoom() {
  const P = PAPERS[R.paper] || PAPERS.a4;
  const wrap = $('#pvscroll');
  const gutter = window.innerWidth < 900 ? 28 : 48;
  const z = ui.zoom === 'fit' ? Math.max(0.2, Math.min(1, (wrap.clientWidth - gutter) / P.wpx)) : ui.zoom;
  $('#sheet').style.transform = `scale(${z})`;
  $('#sheetwrap').style.width = P.wpx * z + 'px';
  $('#sheetwrap').style.height = $('#page').offsetHeight * z + 'px';
  const zp = $('#zoomPct');
  if (zp) zp.textContent = Math.round(z * 100) + '%';
}
function zoomControlsHTML() {
  const z = ui.zoom === 'fit' ? '' : Math.round(ui.zoom * 100) + '%';
  const fitStyle = ui.zoom === 'fit' ? 'background:var(--surface-2)' : '';
  return `<div class="zoom" aria-label="Zoom">
    <button data-z="out" aria-label="Zoom out">${ic('zoom-out')}</button>
    <button data-z="100" id="zoomPct" title="Set 100 %" style="min-width:52px">${z}</button>
    <button data-z="in" aria-label="Zoom in">${ic('zoom-in')}</button>
    <button data-z="fit" aria-label="Fit to width" title="Fit to width" style="${fitStyle}">${ic('maximize')}</button></div>`;
}
function renderPvbar() {
  const swatches = Object.entries(ACCENTS).map(
    ([k, v]) =>
      `<button class="sw ${R.accent === k ? 'on' : ''}" data-accent="${k}" style="background:${v}" role="radio" aria-checked="${R.accent === k}" aria-label="${k} accent"></button>`
  );
  const papers = Object.entries(PAPERS).map(
    ([k, p]) => `<option value="${k}" ${R.paper === k ? 'selected' : ''}>${p.name}</option>`
  );
  const langs = Object.entries(CV_LANGS).map(
    ([k, l]) => `<option value="${k}" ${R.lang === k ? 'selected' : ''}>${l.name}</option>`
  );
  $('#pvbar').innerHTML = `${zoomControlsHTML()}
    <span class="pages ${pages > 1 ? 'over' : ''}">${pages} page${pages > 1 ? 's' : ''}</span><span class="spacer"></span>
    <div class="swatches" role="radiogroup" aria-label="Accent colour">${swatches.join('')}</div>
    <label class="fscale" title="Font size scale">${ic('type')}<input type="range" min="0.85" max="1.15" step="0.05" value="${R.scale || 1}" id="fsRange" aria-label="Font size scale"></label>
    <select id="langSel" aria-label="CV language mode" title="CV language: English, bilingual headings or Urdu (RTL)">${langs.join('')}</select>
    <select id="paperSel" aria-label="Paper size">${papers.join('')}</select>`;

function stepZoom(dir) {
  const current = ui.zoom === 'fit' ? parseFloat($('#sheet').style.transform.replace(/[^\d.]/g, '')) || 1 : ui.zoom;
  if (dir === 'fit') return 'fit';
  if (dir === '100') return 1;
  const next = current + (dir === 'in' ? 0.1 : -0.1);
  return Math.min(2, Math.max(0.3, +next.toFixed(2)));
}
$('#pvbar').addEventListener('click', e => {

function importResume(obj) {

  Object.keys(SECTIONS)

// ---------- ATS engine: keyword extraction ----------
const normTok = t => t.replace(/\./g, '').replace(/s$/, '');
function tokens(text) {
  return text
    .toLowerCase()
    .replace(/[^a-z0-9+#.\s/-]/g, ' ')
    .split(/[\s/]+/)
    .map(t => t.replace(/^[.\-]+|[.\-]+$/g, ''))
    .filter(Boolean);
}
// Unigram + bigram frequencies, stop-words removed; bigrams seen twice or more win over their words
function extractKeywords(jd) {
  const toks = tokens(jd);
  const ok = t => t.length > 1 && !STOP.has(t) && !/^\d+$/.test(t);
  const uni = new Map();
  const bi = new Map();
  toks.forEach((t, i) => {
    if (ok(t)) uni.set(t, (uni.get(t) || 0) + 1);
    if (i < toks.length - 1 && ok(t) && ok(toks[i + 1])) {
      const k = t + ' ' + toks[i + 1];
      bi.set(k, (bi.get(k) || 0) + 1);
    }
  });
  const kept = [...bi].filter(([, f]) => f >= 2);
  kept.forEach(([k, f]) => k.split(' ').forEach(w => uni.set(w, (uni.get(w) || 0) - f)));
  const bigrams = kept.map(([k, f]) => ({ k, f, w: 1.5 * Math.min(f, 4) }));
  const unigrams = [...uni].filter(([, f]) => f > 0).map(([k, f]) => ({ k, f, w: Math.min(f, 4) }));
  return [...bigrams, ...unigrams].sort((a, b) => b.w - a.w || a.k.localeCompare(b.k)).slice(0, 40);
}
// TODO(student): synonym-aware matching — run tokens through a stemmer (Porter) and a tech-synonym table (js→javascript, postgres→postgresql, k8s→kubernetes) before comparing, so "Node" matches "Node.js".
function keywordMatch(jd, r = R) {
  const kws = extractKeywords(jd);
  const rt = tokens(toTXT(r)).map(normTok);
  const set = new Set(rt);
  rt.forEach((t, i) => {
    if (i < rt.length - 1) set.add(t + ' ' + rt[i + 1]);
  });
  const has = k => set.has(k.split(' ').map(normTok).join(' '));
  const matched = kws.filter(x => has(x.k));
  const missing = kws.filter(x => !has(x.k));
  const tot = sum(kws.map(x => x.w));
  return { kws, matched, missing, pct: tot ? Math.round((100 * sum(matched.map(x => x.w))) / tot) : 0 };
}
const allBullets = (r = R) =>
  [...r.experience, ...r.projects, ...r.custom.items]
    .flatMap(e => e.bullets || [])
    .map(b => b.trim())
    .filter(Boolean);
const firstWord = b => (b.replace(/^[-•*\s]+/, '').split(/\s+/)[0] || '').toLowerCase().replace(/[^a-z]/g, '');
const weakStart = b => WEAK.find(([w]) => b.trim().toLowerCase().startsWith(w));
const monthsBetween = (a, b) => {
  const p = v => {
    const m = /^(\d{4})-(\d{2})/.exec(v || '');
    return m ? +m[1] * 12 + +m[2] : null;
  };
  const x = p(a);
  const y = b === 'now' ? TODAY.getFullYear() * 12 + TODAY.getMonth() + 1 : p(b);
  return x != null && y != null ? Math.max(0, y - x) : 0;
};
const yearsExp = (r = R) => r.experience.reduce((s, e) => s + monthsBetween(e.start, e.present ? 'now' : e.end), 0) / 12;

// ---------- ATS engine: rule checks (each returns id · title · max · pts · detail · target · fix) ----------
function checkContact(r) {
  const c = r.contact;
  const fields = [['name', c.name], ['email', c.email], ['phone', c.phone], ['city', c.city], ['LinkedIn', c.linkedin]];
  const miss = fields.filter(([, v]) => !v.trim()).map(([k]) => k);
  return {
    id: 'contact',
    title: 'Contact block complete',
    max: 10,
    pts: 10 - 2 * miss.length,
    detail: miss.length ? `Missing: ${miss.join(', ')}.` : 'Name, email, phone, city and LinkedIn present.',
    target: 'contact',
    fix: 'Recruiters search by city; portals auto-fill from email and phone.'
  };
}
function checkHeadline(r) {
  const h = r.contact.headline.trim();
  return {
    id: 'headline',
    title: 'Headline names the target role',
    max: 5,
    pts: h ? 5 : 0,
    detail: h ? `“${h}”` : 'Add a one-line headline such as “Software Engineer · React, Node.js”.',
    target: 'contact',
    fix: 'Headlines are matched against the job title first.'
  };
}
function checkSummary(r) {
  const sw = words(r.summary).length;
  const visible = r.sections.find(s => s.type === 'summary')?.visible;
  let pts = 0;
  if (visible && sw) pts = sw < 25 ? 3 : sw > 120 ? 4 : sw <= 90 && sw >= 40 ? 8 : 6;
  return {
    id: 'summary',
    title: 'Summary length (40–90 words)',
    max: 8,
    pts,
    detail:
      visible && sw
        ? `${sw} words.`
        : 'No visible summary. Three lines that mirror the job title and top skills lift keyword matches.',
    target: 'summary',
    fix: 'Keep it to 2–4 lines with the job title and 3–4 core skills.'
  };
}
function checkVerbs(bl) {
  const weak = bl.filter(b => weakStart(b));
  const strong = bl.filter(b => STRONG.has(firstWord(b)));
  const weakNote = weak.length ? `; ${weak.length} start weakly (“${weakStart(weak[0])[0]}”…)` : '';
  return {
    id: 'verbs',
    title: 'Bullets start with strong action verbs',
    max: 12,
    pts: bl.length ? 12 * (strong.length / bl.length) - 2 * weak.length : 0,
    detail: bl.length ? `${strong.length}/${bl.length} start with a strong verb${weakNote}.` : 'No bullets found.',
    target: 'experience',
    fix: 'Use the sparkle button on a bullet for a verb upgrade.'
  };
}
function checkMetrics(bl) {
  const q = bl.filter(b => /\d/.test(b));
  return {
    id: 'metrics',
    title: 'Bullets are quantified (numbers, %, Rs, time)',
    max: 10,
    pts: bl.length ? 10 * Math.min(1, q.length / bl.length / 0.6) : 0,
    detail: bl.length ? `${q.length}/${bl.length} bullets include a number (target ≥ 60 %).` : 'No bullets found.',
    target: 'experience',
    fix: 'Add scale: users, %, Rs, hours saved, team size, marks.'
  };
}
function checkLength(bl) {
  const long = bl.filter(b => words(b).length > 34);
  const short = bl.filter(b => words(b).length < 6);
  const issues = long.length + short.length;
  return {
    id: 'length',
    title: 'Bullets are 1–2 lines (6–34 words)',
    max: 6,
    pts: bl.length ? 6 - 1.5 * issues : 0,
    detail: issues ? `${long.length} too long, ${short.length} too short.` : 'All bullets are a readable length.',
    target: 'experience',
    fix: 'Split long bullets into two; expand one-liners with what, how and result.'
  };
}
function dateIssues(e) {
  let n = 0;
  const monthRx = /^\d{4}-\d{2}$/;
  if (!e.start) n++;
  if (!e.present && !e.end) n++;
  if (e.start && e.end && !e.present && monthsBetween(e.start, e.end) === 0 && e.start !== e.end) n++;
  if (e.start && !monthRx.test(e.start)) n++;
  if (e.end && !monthRx.test(e.end)) n++;
  return n;
}
function checkDates(r) {
  const n = sum([...r.experience, ...r.education].map(dateIssues));
  return {
    id: 'dates',
    title: 'Dates complete and consistent (Mon YYYY)',
    max: 6,
    pts: 6 - 2 * n,
    detail: n ? `${plural(n, 'date issue')} in experience or education.` : 'Every entry has a parseable start and end (or “Present”).',
    target: 'experience',
    fix: 'ATS parsers compute tenure from dates — gaps and typos lower rankings.'
  };
}
function checkPersonal(r, txt) {
  const c = r.contact;
  const found = [];
  if (c.photo) found.push('photo');
  if (c.cnic) found.push('CNIC');
  const m = PERSONAL_RX.exec(txt);
  if (m && !(c.cnic && /cnic/i.test(m[0]))) found.push(`“${m[0]}”`);
  return {
    id: 'personal',
    title: 'No photo, CNIC, age or marital status',
    max: 12,
    pts: 12 - 6 * found.length,
    detail: found.length
      ? `Found: ${found.join(', ')}. Common on Pakistani CVs, but ATS cannot parse images and many employers screen out personal data.`
      : 'No personal identifiers detected.',
    target: 'contact',
    fix: 'Leave photo and CNIC off unless a specific employer asks.'
  };
}
function checkHeadings(r) {
  const issues = [];
  r.sections
    .filter(s => s.visible)
    .forEach(s => {
      const customTitle = lower(r.custom.title).trim();
      if (s.type === 'custom' && !STD_HEADINGS.has(customTitle)) issues.push(`“${r.custom.title}” is a non-standard heading`);
      if (!sectionCountFor(r, s.type)) issues.push(`${SECTIONS[s.type].title} is visible but empty`);
    });
  return {
    id: 'headings',
    title: 'Standard section headings, no empty sections',
    max: 6,
    pts: 6 - 3 * issues.length,
    detail: issues.length ? issues.join('; ') + '.' : 'All visible headings are ones parsers recognise.',
    target: 'sections',
    fix: 'Parsers map headings like Experience, Education, Skills, Projects. Hide empty sections.'
  };
}
function checkPages(r) {
  const yrs = yearsExp(r);
  const ideal = yrs < 5 ? 1 : 2;
  const yrsLabel = yrs < 1 ? '< 1' : yrs.toFixed(1);
  return {
    id: 'pages',
    title: `Length: ${plural(pages, 'page')} for ${yrsLabel} yrs experience`,
    max: 8,
    pts: pages <= ideal ? 8 : pages === ideal + 1 ? 4 : 0,
    detail:
      pages <= ideal
        ? `Fits the ${ideal}-page guideline.`
        : `Aim for ${plural(ideal, 'page')}: trim older bullets, switch to Compact, or lower the font scale.`,
    target: 'preview',
    fix: 'Under 5 years of experience → one page.'
  };
}
// Only when a job description of reasonable length has been pasted
function checkKeywords(r) {
  const jd = (ui.jd || '').trim();
  if (jd.length <= 40) return null;
  const kw = keywordMatch(jd, r);
  return {
    kw,
    check: {
      id: 'keywords',
      title: `Job-description keyword match ${kw.pct} %`,
      max: 17,
      pts: (17 * kw.pct) / 100,
      detail: `${kw.matched.length} of ${kw.kws.length} extracted keywords appear in your resume.`,
      target: 'skills',
      fix: 'Add missing keywords you genuinely have — to Skills, the summary or a bullet.'
    }
  };
}
function finishCheck(c) {
  const pts = Math.max(0, Math.min(c.max, Math.round(c.pts)));
  const status = c.pts >= c.max - 0.01 ? 'pass' : c.pts > 0 ? 'warn' : 'fail';
  return { ...c, pts, status };
}
function verdictFor(score) {
  if (score >= 80) return 'Strong — ready to submit';
  if (score >= 60) return 'Good — a few quick fixes';
  if (score >= 40) return 'Needs work before applying';
  return 'Likely filtered out by an ATS';
}
function analyse(r = R) {
  const bl = allBullets(r);
  const txt = toTXT(r);
  const raw = [
    checkContact(r),
    checkHeadline(r),
    checkSummary(r),
    checkVerbs(bl),
    checkMetrics(bl),
    checkLength(bl),
    checkDates(r),
    checkPersonal(r, txt),
    checkHeadings(r),
    checkPages(r)
  ];
  const kwResult = checkKeywords(r);
  if (kwResult) raw.push(kwResult.check);
  const checks = raw.map(finishCheck);
  const max = sum(checks.map(x => x.max));
  const got = sum(checks.map(x => x.pts));
  const score = Math.round((100 * got) / max);
  return { checks, score, kw: kwResult?.kw || null, hasJD: !!kwResult, got, max, verdict: verdictFor(score) };
}
function sectionCountFor(r, type) {
  if (type === 'summary') return words(r.summary).length ? 1 : 0;
  if (type === 'skills') return r.skills.reduce((n, g) => n + g.items.length, 0);
  if (type === 'custom') return r.custom.items.length;
  return r[type].length;
}

function scorecardHTML(a, sg, sm) {
  const C = 2 * Math.PI * 62;
  const kwLabel = a.hasJD ? a.kw.pct + ' %' : 'paste a job description';

  return `<div class="scorecard enter">
    <div class="bigring ${scoreClass(a.score)}"><svg viewBox="0 0 140 140"><circle class="bg" cx="70" cy="70" r="62"/><circle class="fg" cx="70" cy="70" r="62" stroke-dasharray="${C}" stroke-dashoffset="${C}" id="bigFg"/></svg><div class="num" id="bigNum">0</div></div>
    <div><div class="verdict">${a.verdict}</div>
      <div class="sub"><span>Structure &amp; content <b>${sg}/${sm}</b></span><div class="bar"><i id="barS"></i></div><span>Keyword match <b>${kwLabel}</b></span><div class="bar"><i id="barK"></i></div></div>
      <div class="muted" style="font-size:.78rem;margin-top:8px">${note}</div></div></div>`;
}
function keywordChipsHTML(a) {
  if (!a.hasJD) return '';
  const matched = a.kw.matched.map(k => `<span class="chip ok">${ic('check')} ${esc(k.k)}</span>`).join('');
  const missing = a.kw.missing
    .map(
      k =>
        `<span class="chip miss">${esc(k.k)}<button class="ib" data-addkw="${esc(k.k)}" aria-label="Add ${esc(k.k)} to skills" title="Add to skills">${ic('plus')}</button></span>`
    )
    .join('');
  return `<div style="margin-top:12px">
    <div class="muted" style="font-size:.78rem;font-weight:700;margin-bottom:6px">MATCHED (${a.kw.matched.length})</div>
    <div class="chips">${matched || '<span class="muted">none yet</span>'}</div>
    <div class="muted" style="font-size:.78rem;font-weight:700;margin:12px 0 6px">MISSING (${a.kw.missing.length}) — add only what you genuinely have</div>
    <div class="chips">${missing || '<span class="muted">nothing missing</span>'}</div></div>`;

function jdPanelHTML(a) {
