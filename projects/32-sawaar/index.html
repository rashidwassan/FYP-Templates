<style>
/* ---------- tokens: night HUD (asphalt black, helmet yellow, road-marking white, crash red, calm cyan) ---------- */
:root {
  --bg: #0b0d10;
  --bg-2: #101318;
  --panel: #151920;
  --panel-2: #1b2028;
  --panel-3: #232932;
  --line: #29303a;
  --line-2: #3a434f;
  --ink: #f3f2ec;
  --ink-2: #c9ccd1;
  --muted: #8f96a0;
  --yellow: #ffcc1a;
  --yellow-2: #ffd84d;
  --yellow-ink: #17130a;
  --yellow-text: #ffcc1a;
  --yellow-soft: rgba(255, 204, 26, .12);
  --red: #ff4136;
  --red-2: #ff6a60;
  --red-soft: rgba(255, 65, 54, .14);
  --cyan: #3fd6e8;
  --cyan-soft: rgba(63, 214, 232, .12);
  --green: #3ddc84;
  --green-soft: rgba(61, 220, 132, .13);
  --orange: #ffa21f;
  --orange-soft: rgba(255, 162, 31, .14);
  --focus: #3fd6e8;
  --grain: rgba(255, 255, 255, .028);
  --shadow: 0 18px 40px -26px rgba(0, 0, 0, .95);
  --shadow-lg: 0 30px 80px -30px rgba(0, 0, 0, .95);
  --radius: 14px;
  --radius-sm: 10px;
  --font: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-c: "Barlow Condensed", "Barlow", "Arial Narrow", system-ui, sans-serif;
  --font-ur: "Noto Nastaliq Urdu", "Barlow", serif;
  --rail-w: 92px;
  --top-h: 60px;
  --tab-h: 66px;
  --fs: 15px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --dur: .35s;
}
html[data-theme="light"] {
  --bg: #e3e2dd;
  --bg-2: #d9d8d2;
  --panel: #f4f3ef;
  --panel-2: #ebeae5;
  --panel-3: #e0dfd9;
  --line: #cac8c0;
  --line-2: #b2afa6;
  --ink: #15171a;
  --ink-2: #33373d;
  --muted: #5b6067;
  --yellow: #ffc400;
  --yellow-2: #ffd23f;
  --yellow-text: #7a5a00;
  --yellow-soft: rgba(255, 196, 0, .22);
  --red: #cf2a1f;
  --red-2: #e0443a;
  --red-soft: rgba(207, 42, 31, .1);
  --cyan: #08788a;
  --cyan-soft: rgba(8, 120, 138, .1);
  --green: #13804a;
  --green-soft: rgba(19, 128, 74, .12);
  --orange: #a95700;
  --orange-soft: rgba(169, 87, 0, .12);
  --focus: #08788a;
  --grain: rgba(0, 0, 0, .035);
  --shadow: 0 1px 2px rgba(20, 20, 20, .06), 0 14px 30px -22px rgba(20, 20, 20, .45);
  --shadow-lg: 0 30px 70px -30px rgba(20, 20, 20, .55);
}
html[data-size="lg"] { --fs: 17px; }
html[data-size="xl"] { --fs: 19px; }

/* ---------- motion kit ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
html.calm *, html.calm *::before, html.calm *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
@keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }
@keyframes pulseRed { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 65, 54, .55); } 50% { box-shadow: 0 0 0 14px rgba(255, 65, 54, 0); } }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes laneMove { from { background-position: 0 0; } to { background-position: 40px 0; } }
.enter { animation: fadeUp var(--dur) var(--ease) both; }
.stagger > * { animation: fadeUp .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
.btn { transition: transform .15s var(--ease), box-shadow .15s var(--ease), background .15s, border-color .15s; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0) scale(.98); }
.card, .tile { transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s; }
.tile:hover, .card.lift:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.fill, .bar > i { transition: width .6s var(--ease); }
.skeleton {
  background: linear-gradient(90deg, var(--panel-2) 25%, var(--panel-3) 50%, var(--panel-2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.2s infinite;
  border-radius: 8px;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { font-size: var(--fs); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: var(--font);
  line-height: 1.5;
  background: radial-gradient(circle at 1px 1px, var(--grain) 1px, transparent 0) 0 0 / 5px 5px, var(--bg);
  overflow-x: hidden;
}
html[lang="ur"] body { font-family: var(--font-ur); line-height: 2.05; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; font-weight: 700; }
p { margin: 0 0 .6em; }
a { color: var(--cyan); }
code, kbd { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: .86em; }
kbd {
  display: inline-block;
  min-width: 1.6em;
  padding: 1px 6px;
  border: 1px solid var(--line-2);
  border-bottom-width: 2px;
  border-radius: 6px;
  background: var(--panel-2);
  text-align: center;
}
.num { font-family: var(--font-c); font-variant-numeric: tabular-nums lining-nums; direction: ltr; unicode-bidi: isolate; }
html[lang="ur"] .num { line-height: 1.3; }
.muted { color: var(--muted); }
.small { font-size: .87rem; }
.tiny { font-size: .76rem; }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 12px; }
.mt { margin-top: 14px; }
.mt-s { margin-top: 8px; }
.mb { margin-bottom: 14px; }
.nowrap { white-space: nowrap; }
.ltr { direction: ltr; unicode-bidi: isolate; }
.yel { color: var(--yellow-text); }
.cy { color: var(--cyan); }
.rd { color: var(--red); }
.gr { color: var(--green); }
.or { color: var(--orange); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
.skip {
  position: absolute;
  inset-inline-start: 12px;
  top: -70px;
  z-index: 1000;
  background: var(--yellow);
  color: var(--yellow-ink);
  padding: 8px 14px;
  border-radius: 10px;
  font-weight: 700;
  text-decoration: none;
}
.skip:focus { top: 10px; }
html[dir="rtl"] .flip { transform: scaleX(-1); }

/* ---------- icons ---------- */
.ic { width: 1.1em; height: 1.1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; flex: none; }
.ic.lg { width: 1.5em; height: 1.5em; }
.ic.xl { width: 2.2em; height: 2.2em; }

/* ---------- shell: slim instrument rail (desktop), top bar, view, bottom tabs (phone) ---------- */
.rail { display: none; }
.main { min-width: 0; min-height: 100vh; }
.top {
  position: sticky;
  top: 0;
  z-index: 40;
  height: var(--top-h);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 14px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.top::after {
  content: "";
  position: absolute;
  inset-inline: 0;
  bottom: -2px;
  height: 2px;
  background: repeating-linear-gradient(90deg, var(--yellow) 0 22px, transparent 22px 40px);
  opacity: .5;
}
.brand-m { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); }
.brand-m b { font: 800 1.3rem/1 var(--font-c); letter-spacing: .04em; text-transform: uppercase; }
html[lang="ur"] .brand-m b { font-family: var(--font-ur); font-size: 1.05rem; letter-spacing: 0; line-height: 2; }
.mark svg { width: 34px; height: 34px; display: block; }
.ttl { flex: 1; min-width: 0; }
.ttl .kicker {
  display: block;
  font: 600 .7rem/1 var(--font-c);
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--yellow-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ttl h1 { font: 700 1.5rem/1.1 var(--font-c); letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
html[lang="ur"] .ttl h1 { font-family: var(--font-ur); text-transform: none; letter-spacing: 0; font-size: 1.15rem; line-height: 1.9; }
html[lang="ur"] .ttl .kicker { font-family: var(--font-ur); letter-spacing: 0; font-size: .7rem; line-height: 1.6; }
.top-actions { display: flex; gap: 6px; align-items: center; }
.tbtn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-width: 42px;
  height: 42px;
  padding: 0 10px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  cursor: pointer;
}
.tbtn:hover { border-color: var(--line-2); background: var(--panel-2); }
.tbtn.lang { font-weight: 700; font-size: .85rem; }
.badge {
  position: absolute;
  top: -4px;
  inset-inline-end: -4px;
  min-width: 19px;
  height: 19px;
  padding: 0 5px;
  border-radius: 10px;
  background: var(--red);
  color: #fff;
  font: 700 .7rem/19px var(--font);
  text-align: center;
}
#view { padding: 16px 14px calc(var(--tab-h) + 30px); max-width: 1260px; margin: 0 auto; outline: none; }
@media (max-width: 899px) {
  .top { gap: 8px; padding: 0 10px; }
  .top-actions { gap: 4px; }
  .tbtn { min-width: 38px; height: 38px; padding: 0 8px; border-radius: 10px; }
  .mark svg { width: 30px; height: 30px; }
  .ttl h1 { font-size: 1.35rem; }
}
#banner:empty { display: none; }
.strip { display: flex; gap: 10px; align-items: center; padding: 10px 14px; background: var(--yellow); color: var(--yellow-ink); font-weight: 600; }
.strip.red { background: var(--red); color: #fff; }
.strip .btn { background: rgba(0, 0, 0, .14); border-color: transparent; color: inherit; }

.tabs {
  position: fixed;
  inset-inline: 0;
  bottom: 0;
  z-index: 45;
  height: calc(var(--tab-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  background: var(--panel);
  border-top: 1px solid var(--line);
}
.tabs a, .tabs button {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  border: 0;
  background: none;
  color: var(--muted);
  text-decoration: none;
  font: 600 .74rem/1.1 var(--font-c);
  letter-spacing: .06em;
  text-transform: uppercase;
  cursor: pointer;
  position: relative;
}
html[lang="ur"] .tabs a, html[lang="ur"] .tabs button { font-family: var(--font-ur); letter-spacing: 0; font-size: .68rem; line-height: 1.7; }
.tabs .ic { width: 23px; height: 23px; }
.tabs .on { color: var(--yellow-text); }
.tabs .on::before { content: ""; position: absolute; top: 0; width: 34px; height: 3px; border-radius: 0 0 3px 3px; background: var(--yellow); }
.tabs .ride-tab .ic { width: 27px; height: 27px; }
.tdot {
  position: absolute;
  top: 8px;
  inset-inline-end: calc(50% - 22px);
  min-width: 16px;
  height: 16px;
  border-radius: 8px;
  background: var(--red);
  color: #fff;
  font: 700 .62rem/16px var(--font);
}

@media (min-width: 900px) {
  .rail {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    position: fixed;
    inset-block: 0;
    inset-inline-start: 0;
    width: var(--rail-w);
    z-index: 50;
    background: var(--panel);
    border-inline-end: 1px solid var(--line);
    padding: 12px 8px;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .rail .brand { display: grid; place-items: center; padding: 4px 0 12px; }
  .rail .brand svg { width: 44px; height: 44px; }
  .rail-nav { display: flex; flex-direction: column; gap: 2px; }
  .rail-nav a {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 8px 2px 7px;
    border-radius: 12px;
    color: var(--muted);
    text-decoration: none;
    font: 600 .68rem/1.1 var(--font-c);
    letter-spacing: .05em;
    text-transform: uppercase;
    text-align: center;
  }
  html[lang="ur"] .rail-nav a { font-family: var(--font-ur); letter-spacing: 0; font-size: .62rem; line-height: 1.7; text-transform: none; }
  .rail-nav a .ic { width: 22px; height: 22px; }
  .rail-nav a:hover { background: var(--panel-2); color: var(--ink); }
  .rail-nav a.on { color: var(--yellow-text); background: var(--yellow-soft); }
  .rail-nav a.on::before {
    content: "";
    position: absolute;
    inset-inline-start: -8px;
    top: 10px;
    bottom: 10px;
    width: 4px;
    border-radius: 0 4px 4px 0;
    background: repeating-linear-gradient(180deg, var(--yellow) 0 7px, transparent 7px 11px);
  }
  .rail-nav .cnt {
    position: absolute;
    top: 4px;
    inset-inline-end: 12px;
    min-width: 16px;
    height: 16px;
    border-radius: 8px;
    background: var(--red);
    color: #fff;
    font: 700 .62rem/16px var(--font);
  }
  .rail-nav .sep { height: 1px; background: var(--line); margin: 6px 10px; }
  .main { margin-inline-start: var(--rail-w); }
  .tabs, .brand-m { display: none; }
  .top { padding: 0 24px; }
  #view { padding: 22px 26px 60px; }
}

/* ---------- buttons, chips, fields ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 42px;
  padding: 8px 16px;
  border-radius: 12px;
  border: 1px solid var(--line-2);
  background: var(--panel-2);
  color: var(--ink);
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  white-space: nowrap;
}
html[lang="ur"] .btn { white-space: normal; line-height: 1.7; padding-block: 6px; }
.btn:hover { border-color: var(--ink-2); }
.btn.y { background: var(--yellow); border-color: var(--yellow); color: var(--yellow-ink); }
.btn.y:hover { background: var(--yellow-2); box-shadow: 0 10px 24px -14px var(--yellow); }
.btn.r { background: var(--red); border-color: var(--red); color: #fff; }
.btn.r:hover { background: var(--red-2); }
.btn.c { background: var(--cyan-soft); border-color: color-mix(in srgb, var(--cyan) 45%, transparent); color: var(--cyan); }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.ghost:hover { background: var(--panel-2); }
.btn.sm { min-height: 34px; padding: 4px 11px; font-size: .86rem; border-radius: 10px; }
.btn.lg { min-height: 58px; padding: 10px 22px; font-size: 1.08rem; border-radius: 16px; }
.btn.block { width: 100%; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .45; pointer-events: none; }
.ibtn {
  display: inline-grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--ink);
  cursor: pointer;
  flex: none;
}
.ibtn:hover { border-color: var(--line-2); }
.ibtn.sm { width: 32px; height: 32px; border-radius: 9px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: .78rem;
  font-weight: 600;
  background: var(--panel-3);
  color: var(--ink-2);
  white-space: nowrap;
}
html[lang="ur"] .chip { line-height: 1.9; }
.chip.y { background: var(--yellow-soft); color: var(--yellow-text); }
.chip.r { background: var(--red-soft); color: var(--red); }
.chip.c { background: var(--cyan-soft); color: var(--cyan); }
.chip.g { background: var(--green-soft); color: var(--green); }
.chip.o { background: var(--orange-soft); color: var(--orange); }
.seg { display: inline-flex; padding: 3px; gap: 3px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); flex-wrap: wrap; max-width: 100%; }
.seg button {
  border: 0;
  background: none;
  padding: 6px 12px;
  border-radius: 9px;
  font-weight: 600;
  font-size: .88rem;
  color: var(--muted);
  cursor: pointer;
  display: inline-flex;
  gap: 6px;
  align-items: center;
}
.seg button.on { background: var(--yellow); color: var(--yellow-ink); }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: .8rem; font-weight: 600; color: var(--muted); }
.field.bad .inp { border-color: var(--red); }
.field .err { color: var(--red); font-size: .78rem; }
.inp {
  width: 100%;
  min-height: 42px;
  padding: 8px 12px;
  border-radius: 10px;
  border: 1px solid var(--line-2);
  background: var(--bg-2);
  color: var(--ink);
}
textarea.inp { min-height: 90px; resize: vertical; }
select.inp { cursor: pointer; }
.inp:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: transparent; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.switch { display: flex; align-items: center; gap: 12px; padding: 8px 0; cursor: pointer; }
.switch input {
  appearance: none;
  width: 44px;
  height: 26px;
  border-radius: 13px;
  background: var(--line-2);
  position: relative;
  cursor: pointer;
  flex: none;
  transition: background .2s;
}
.switch input::after {
  content: "";
  position: absolute;
  top: 3px;
  inset-inline-start: 3px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  transition: transform .2s var(--ease);
}
.switch input:checked { background: var(--yellow); }
.switch input:checked::after { transform: translateX(18px); }
html[dir="rtl"] .switch input:checked::after { transform: translateX(-18px); }
.range { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
.range label { font-size: .84rem; font-weight: 600; color: var(--ink-2); }
.range output { font: 700 1rem var(--font-c); color: var(--cyan); direction: ltr; }
.range input { grid-column: 1 / -1; width: 100%; accent-color: var(--yellow); }
.range small { grid-column: 1 / -1; color: var(--muted); font-size: .74rem; }

/* ---------- cards, tiles, KPIs, bars ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.card.flat { background: var(--panel-2); }
.card h2, .h2 { display: flex; align-items: center; gap: 8px; font: 700 1.08rem/1.2 var(--font-c); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 12px; }
.card h2 .ic, .h2 .ic { color: var(--cyan); }
.card h3 { font-size: 1rem; margin-bottom: 6px; }
html[lang="ur"] .card h2, html[lang="ur"] .h2 { font-family: var(--font-ur); letter-spacing: 0; text-transform: none; font-size: 1rem; line-height: 1.9; }
.lane { height: 3px; border-radius: 2px; background: repeating-linear-gradient(90deg, var(--yellow) 0 18px, transparent 18px 30px); opacity: .7; margin: 4px 0 14px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.side-l { display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr); gap: 14px; align-items: start; }
.side-r { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 360px); gap: 14px; align-items: start; }
@media (max-width: 980px) {
  .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .side-l, .side-r { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); }
}
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; min-width: 0; position: relative; overflow: hidden; }
.tile .k { display: flex; align-items: center; gap: 6px; font: 600 .74rem/1.2 var(--font-c); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
html[lang="ur"] .tile .k { font-family: var(--font-ur); letter-spacing: 0; font-size: .74rem; line-height: 1.8; }
.tile .v { font: 700 2rem/1.05 var(--font-c); margin-top: 4px; color: var(--ink); direction: ltr; unicode-bidi: isolate; display: block; }
html[dir="rtl"] .tile .v { text-align: right; }
.tile .v small { font-size: .9rem; font-weight: 600; color: var(--muted); margin-inline-start: 3px; }
.tile .s { font-size: .78rem; color: var(--muted); }
.tile.y .v { color: var(--yellow-text); }
.tile.c .v { color: var(--cyan); }
.tile.r .v { color: var(--red); }
.tile.g .v { color: var(--green); }
.tile::after { content: ""; position: absolute; inset-inline-end: 0; top: 0; width: 4px; height: 100%; background: var(--line); }
.tile.y::after { background: var(--yellow); }
.tile.c::after { background: var(--cyan); }
.tile.r::after { background: var(--red); }
.tile.g::after { background: var(--green); }
.bar { height: 8px; border-radius: 4px; background: var(--panel-3); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; border-radius: 4px; background: var(--cyan); }
.bar.y > i { background: var(--yellow); }
.bar.r > i { background: var(--red); }
.bar.g > i { background: var(--green); }
.bar.o > i { background: var(--orange); }
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--line); min-width: 0; }
.li:last-child { border-bottom: 0; }
.li .ico { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--panel-3); color: var(--cyan); flex: none; }
.li .ico.y { background: var(--yellow-soft); color: var(--yellow-text); }
.li .ico.r { background: var(--red-soft); color: var(--red); }
.li .ico.g { background: var(--green-soft); color: var(--green); }
.li .ico.o { background: var(--orange-soft); color: var(--orange); }
.li b { display: block; overflow: hidden; text-overflow: ellipsis; }
.li small { color: var(--muted); display: block; }
button.li { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: start; cursor: pointer; color: inherit; border-radius: 0; }
button.li:hover { background: var(--panel-2); }
.empty { padding: 26px 12px; text-align: center; color: var(--muted); }
.empty .ic { width: 38px; height: 38px; color: var(--line-2); display: block; margin: 0 auto 8px; }
.note { display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--cyan-soft); color: var(--ink-2); font-size: .88rem; }
.note > .ic { color: var(--cyan); margin-top: 3px; }
.note.y { background: var(--yellow-soft); }
.note.y > .ic { color: var(--yellow-text); }
.note.r { background: var(--red-soft); }
.note.r > .ic { color: var(--red); }
.tbl-wrap { overflow-x: auto; max-width: 100%; }
table.tbl { width: 100%; border-collapse: collapse; font-size: .9rem; }
.tbl th {
  text-align: start;
  font: 600 .72rem var(--font-c);
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 8px;
  border-bottom: 1px solid var(--line-2);
  white-space: nowrap;
}
html[lang="ur"] .tbl th { font-family: var(--font-ur); letter-spacing: 0; font-size: .74rem; }
.tbl td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--panel-2); }
.tbl .n { text-align: end; font-family: var(--font-c); font-size: 1rem; font-variant-numeric: tabular-nums; }
.ring { width: 96px; height: 96px; position: relative; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { fill: none; stroke: var(--panel-3); stroke-width: 9; }
.ring .val { fill: none; stroke: var(--yellow); stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset .9s var(--ease); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font: 800 1.9rem var(--font-c); }

/* ---------- modal sheet, palette, tour, toasts ---------- */
#scrim { position: fixed; inset: 0; background: rgba(4, 5, 7, .62); z-index: 600; opacity: 0; pointer-events: none; transition: opacity .25s; }
#scrim.on { opacity: 1; pointer-events: auto; }
#modal { position: fixed; inset: 0; z-index: 610; display: flex; align-items: flex-end; justify-content: center; pointer-events: none; }
#modal.on { pointer-events: auto; }
.sheet {
  width: 100%;
  max-height: 90vh;
  overflow: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 20px 20px 0 0;
  padding: 10px 18px calc(18px + env(safe-area-inset-bottom));
  transform: translateY(105%);
  transition: transform .32s var(--ease);
  box-shadow: var(--shadow-lg);
}
#modal.on .sheet { transform: none; }
.grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line-2); margin: 2px auto 10px; }
.shead { display: flex; align-items: center; gap: 10px; justify-content: space-between; margin-bottom: 12px; }
.shead h3 { display: flex; align-items: center; gap: 8px; font: 700 1.25rem var(--font-c); letter-spacing: .04em; text-transform: uppercase; }
html[lang="ur"] .shead h3 { font-family: var(--font-ur); text-transform: none; letter-spacing: 0; font-size: 1.1rem; line-height: 2; }
.shead h3 .ic { color: var(--yellow-text); }
.sfoot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px; }
@media (min-width: 700px) {
  #modal { align-items: center; }
  .sheet { width: min(560px, 94vw); border-radius: 20px; transform: scale(.96); opacity: 0; transition: transform .25s var(--ease), opacity .25s; }
  .sheet.wide { width: min(860px, 94vw); }
  #modal.on .sheet { transform: none; opacity: 1; }
  .grab { display: none; }
}
.palette { position: fixed; inset: 0; z-index: 700; display: none; justify-content: center; align-items: flex-start; padding: 70px 12px; background: rgba(4, 5, 7, .55); }
.palette.on { display: flex; animation: fadeIn .2s both; }
.palbox {
  width: min(620px, 100%);
  background: var(--panel);
  border: 1px solid var(--line-2);
  border-radius: 16px;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  animation: pop .2s var(--ease) both;
}
.palbox .inp { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; min-height: 54px; font-size: 1.05rem; background: var(--panel); }
.palres { max-height: 55vh; overflow: auto; padding: 6px; }
.palres .pg { font: 600 .7rem var(--font-c); letter-spacing: .14em; text-transform: uppercase; color: var(--yellow-text); padding: 8px 10px 4px; }
.palres button {
  display: flex;
  width: 100%;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border: 0;
  background: none;
  border-radius: 10px;
  text-align: start;
  cursor: pointer;
}
.palres button small { margin-inline-start: auto; color: var(--muted); font-size: .78rem; text-align: end; }
.palres button.on, .palres button:hover { background: var(--panel-3); }
.palhint { padding: 8px 14px; font-size: .75rem; color: var(--muted); border-top: 1px solid var(--line); }
#tour { position: fixed; inset: 0; z-index: 800; display: none; }
#tour.on { display: block; }
#tourSpot {
  position: fixed;
  border-radius: 14px;
  box-shadow: 0 0 0 9999px rgba(3, 4, 6, .72);
  border: 2px solid var(--yellow);
  transition: all .35s var(--ease);
  pointer-events: none;
}
#tourTip {
  position: fixed;
  width: min(340px, calc(100vw - 32px));
  background: var(--panel);
  border: 1px solid var(--line-2);
  border-radius: 16px;
  padding: 14px;
  box-shadow: var(--shadow-lg);
  animation: pop .25s var(--ease) both;
}
#tourTip h4 { font: 700 1.15rem var(--font-c); letter-spacing: .04em; text-transform: uppercase; margin: 6px 0 4px; }
html[lang="ur"] #tourTip h4 { font-family: var(--font-ur); text-transform: none; letter-spacing: 0; line-height: 2; }
#tourTip p { font-size: .9rem; color: var(--ink-2); }
.dots { display: flex; gap: 5px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); }
.dots i.on { background: var(--yellow); width: 18px; border-radius: 4px; }
#toasts {
  position: fixed;
  z-index: 950;
  inset-inline: 0;
  bottom: calc(var(--tab-h) + 14px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none;
  padding: 0 12px;
}
@media (min-width: 900px) { #toasts { bottom: 24px; } }
.toast {
  display: flex;
  gap: 10px;
  align-items: center;
  max-width: min(460px, 100%);
  padding: 11px 15px;
  border-radius: 12px;
  background: var(--ink);
  color: var(--bg);
  font-weight: 600;
  font-size: .92rem;
  box-shadow: var(--shadow-lg);
  animation: fadeUp .3s var(--ease) both;
  transition: opacity .3s, transform .3s;
}
.toast.ok .ic { color: var(--green); }
.toast.bad .ic { color: var(--red); }
.toast.out { opacity: 0; transform: translateY(8px); }
html[data-theme="light"] .toast.ok .ic { color: #7ef0b0; }
html[data-theme="light"] .toast.bad .ic { color: #ff9c94; }
#printArea { display: none; }

/* ---------- charts (shared) ---------- */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .ax, .roc .ax, .tplot .ax { fill: var(--muted); font: 600 11px var(--font-c); }
.chart .refl { stroke: var(--yellow); stroke-dasharray: 5 5; stroke-width: 1.5; opacity: .7; }
.chart .ln { fill: none; stroke: var(--cyan); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .ln.y { stroke: var(--yellow); }
.chart .ln.c { stroke: var(--cyan); }
.chart .br { fill: var(--cyan); }
.chart .br.brake, .chart .br.speed { fill: var(--red); }
.chart .br.accel { fill: var(--orange); }
.chart .br.corner { fill: var(--yellow); }
.chart .br.touch { fill: var(--cyan); }
.spark { width: 70px; height: 22px; vertical-align: middle; }
.spark polyline { fill: none; stroke: var(--cyan); stroke-width: 2; }
.spark.g polyline { stroke: var(--green); }
.spark.y polyline { stroke: var(--yellow); }
.spark.r polyline { stroke: var(--red); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; color: var(--muted); }
.legend span::before {
  content: "";
  display: inline-block;
  width: 14px;
  height: 4px;
  border-radius: 2px;
  margin-inline-end: 6px;
  vertical-align: middle;
  background: var(--line-2);
}
.legend .lg1::before { background: var(--cyan); }
.legend .lg2::before { background: var(--orange); }
.legend .lg3::before { background: var(--ink); }
.legend .lgy::before { background: var(--yellow); }
.legend .lgr::before { background: var(--red); }
.legend .lgg::before { background: var(--green); }
.legend .lgw1::before { background: var(--yellow-soft); height: 10px; border: 1px solid var(--yellow); }
.legend .lgw2::before { background: var(--cyan-soft); height: 10px; border: 1px solid var(--cyan); }
.legend span:has(svg)::before { display: none; }

/* ---------- ride page ---------- */
.ride-ready { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(300px, .9fr); gap: 14px; align-items: start; }
@media (max-width: 980px) { .ride-ready { grid-template-columns: minmax(0, 1fr); } .ride-ready .prep { order: -1; } }
.hud-card { background: radial-gradient(ellipse at 50% 120%, var(--yellow-soft), transparent 60%), var(--panel); overflow: hidden; }
.hud-prev { opacity: .9; }
.pv-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.check {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  border-radius: 14px;
  border: 2px dashed var(--line-2);
  background: var(--bg-2);
  color: var(--ink);
  text-align: start;
  cursor: pointer;
  min-height: 72px;
}
.check small { display: block; color: var(--muted); font-size: .8rem; }
.check .ic.lg { color: var(--muted); width: 32px; height: 32px; }
.check .tick { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line-2); display: grid; place-items: center; color: transparent; flex: none; }
.check.on { border-style: solid; border-color: var(--green); background: var(--green-soft); }
.check.on .ic.lg { color: var(--green); }
.check.on .tick { background: var(--green); border-color: var(--green); color: #06210f; }
.prep .sens { gap: 6px; }
.ready { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
a.tile { text-decoration: none; color: inherit; display: block; }

.how { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 1180px) { .how { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 420px) { .how { grid-template-columns: minmax(0, 1fr); } }
.how li { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); }
.how li > .ic { color: var(--yellow-text); }
.how li:nth-child(2) > .ic { color: var(--red); }
.how li small { display: block; color: var(--muted); font-size: .8rem; line-height: 1.4; }
html[lang="ur"] .how li small { line-height: 1.9; }
.how .hn { position: absolute; top: 8px; inset-inline-end: 10px; font: 800 1.4rem var(--font-c); color: var(--line-2); }

/* ---------- HUD instruments (shared by preview and live HUD) ---------- */
.hud-main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr) minmax(0, 1fr); gap: 10px; align-items: center; }
.hpanel { text-align: center; min-width: 0; }
.hpanel svg { width: 100%; max-width: 240px; height: auto; }
.hspeed { position: relative; min-width: 0; }
.spd-arc { width: 100%; height: auto; display: block; }
.spd-arc .trk { fill: none; stroke: var(--panel-3); stroke-width: 16; stroke-linecap: round; }
.spd-arc .val { fill: none; stroke: var(--yellow); stroke-width: 16; stroke-linecap: round; transition: stroke-dasharray .25s linear; }
.hud.over .spd-arc .val { stroke: var(--red); }
.spd-arc .tk line { stroke: var(--line-2); stroke-width: 2; }
.spd-arc .tk text { fill: var(--muted); font: 600 13px var(--font-c); text-anchor: middle; }
.spd-arc .lim { fill: var(--red); stroke: var(--bg); stroke-width: 2; }
.spd-num { position: absolute; inset: 22% 0 0; display: flex; flex-direction: column; align-items: center; gap: 2px; pointer-events: none; }
.spd-num b { font: 800 clamp(64px, 9vw, 150px)/.85 var(--font-c); letter-spacing: -.02em; color: var(--ink); }
.hud.over .spd-num b { color: var(--red); }
.spd-num span { font: 600 .9rem var(--font-c); letter-spacing: .2em; color: var(--muted); text-transform: uppercase; }
.spd-num small { font: 700 .78rem var(--font-c); letter-spacing: .1em; color: var(--red); border: 2px solid var(--red); border-radius: 999px; padding: 0 10px; margin-top: 4px; }
html[lang="ur"] .spd-num small { font-family: var(--font-ur); letter-spacing: 0; line-height: 1.6; font-size: .7rem; }
html[lang="ur"] .spd-num span { letter-spacing: .1em; }
html[data-theme="light"] .spd-arc .trk, html[data-theme="light"] .lg .trk { stroke: var(--line); }
html[data-theme="light"] .ibar { background: var(--line); }
.spd-num em { font: 600 .95rem var(--font-c); font-style: normal; color: var(--cyan); display: flex; align-items: center; gap: 4px; direction: ltr; }
.spd-num em svg { transition: transform .3s; }
.gm .r { fill: none; stroke: var(--line); stroke-width: 1.5; }
.gm .r1 { fill: var(--cyan-soft); stroke: var(--cyan); stroke-width: 2; opacity: .8; }
.gm .ax { stroke: var(--line-2); stroke-width: 1; }
.gm text { fill: var(--muted); font: 700 10px var(--font-c); letter-spacing: .12em; text-anchor: middle; }
.gm text.r { fill: var(--cyan); letter-spacing: 0; }
.gm .trail { fill: none; stroke: var(--cyan); stroke-width: 3; opacity: .45; stroke-linecap: round; stroke-linejoin: round; }
.gm .dot { fill: var(--yellow); stroke: var(--bg); stroke-width: 3; transition: cx .12s linear, cy .12s linear; }
.lg .trk { fill: none; stroke: var(--panel-3); stroke-width: 12; stroke-linecap: round; }
.lg .tk line { stroke: var(--line-2); stroke-width: 2.5; }
.lg .tk line.hot { stroke: var(--red); }
.lg .tk text { fill: var(--muted); font: 600 12px var(--font-c); text-anchor: middle; }
.lg .ndl line { stroke: var(--yellow); stroke-width: 6; stroke-linecap: round; }
.lg .ndl circle { fill: var(--yellow); stroke: var(--bg); stroke-width: 3; }
.lg .ndl, .lg .mx { transition: transform .15s linear; }
.lg .mx path { fill: var(--red); }
.hlbl { font: 600 .78rem var(--font-c); letter-spacing: .16em; color: var(--muted); text-transform: uppercase; }
.hlbl b { font-size: 1.35rem; color: var(--ink); letter-spacing: 0; margin-inline-start: 4px; }
html[lang="ur"] .hlbl { font-family: var(--font-ur); letter-spacing: 0; }
.gwrap { display: flex; align-items: center; gap: 8px; justify-content: center; }
.gwrap svg { flex: 1; min-width: 0; }
.ibar { position: relative; width: 14px; height: 150px; border-radius: 7px; background: var(--panel-3); overflow: hidden; flex: none; }
.ibar i { position: absolute; inset-inline: 0; bottom: 0; height: 0; background: var(--cyan); border-radius: 7px; transition: height .1s linear; }
.ibar i.hot { background: var(--red); }
.ibar b { position: absolute; inset-inline: -2px; height: 3px; background: var(--yellow); }
.stages { display: flex; gap: 4px; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; }
.stages li {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--panel-2);
  color: var(--muted);
  font: 700 .7rem var(--font-c);
  letter-spacing: .08em;
  text-transform: uppercase;
  border: 1px solid var(--line);
}
html[lang="ur"] .stages li { font-family: var(--font-ur); letter-spacing: 0; line-height: 1.8; }
.stages li i { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); }
.stages li.on { color: var(--ink-2); }
.stages li.on i { background: var(--cyan); }
.stages li.cur { color: var(--yellow-ink); background: var(--yellow); border-color: var(--yellow); }
.stages li.cur i { background: var(--yellow-ink); animation: blink 1s infinite; }
.stages li[data-i="4"].cur { background: var(--red); border-color: var(--red); color: #fff; }

/* ---------- live HUD layer ---------- */
#hud {
  position: fixed;
  inset: 0;
  z-index: 500;
  display: none;
  background: radial-gradient(ellipse at 50% 115%, var(--yellow-soft), transparent 55%), var(--bg);
  color: var(--ink);
  overflow-y: auto;
  padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
}
#hud.on { display: flex; flex-direction: column; gap: 8px; animation: fadeIn .25s both; }
html.riding body { overflow: hidden; }
.hud-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hchip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 999px;
  font: 700 .76rem var(--font-c);
  letter-spacing: .08em;
  text-transform: uppercase;
  background: var(--panel-2);
  color: var(--ink-2);
  border: 1px solid var(--line);
}
html[lang="ur"] .hchip { font-family: var(--font-ur); letter-spacing: 0; line-height: 1.8; }
.hchip.sim { background: var(--cyan-soft); color: var(--cyan); border-color: color-mix(in srgb, var(--cyan) 40%, transparent); }
.hchip.live { background: var(--green-soft); color: var(--green); }
.hchip.ok { color: var(--green); }
.hchip.bad, .hchip.warn { color: var(--orange); }
.hclock { font-size: 1.3rem; }
.hud .hud-main { flex: 1; min-height: 0; }
.hud .hpanel svg { max-width: 300px; }
.hud-warn {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: 14px;
  background: var(--yellow);
  color: var(--yellow-ink);
  font: 700 1.15rem var(--font-c);
  letter-spacing: .03em;
}
html[lang="ur"] .hud-warn { font-family: var(--font-ur); font-size: 1rem; line-height: 2; }
.hud-warn.on { display: flex; animation: fadeUp .3s var(--ease) both; }
.hud-msg { min-height: 30px; text-align: center; font: 700 1.05rem var(--font-c); letter-spacing: .04em; opacity: 0; transition: opacity .3s; }
html[lang="ur"] .hud-msg { font-family: var(--font-ur); font-size: .95rem; line-height: 2; }
.hud-msg.on { opacity: 1; }
.hud-msg.o { color: var(--orange); }
.hud-msg.c { color: var(--cyan); }
.hud-msg.y { color: var(--yellow-text); }
.hud-stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.hs { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; text-align: center; min-width: 0; }
.hs span {
  display: block;
  font: 600 .68rem var(--font-c);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
html[lang="ur"] .hs span { font-family: var(--font-ur); letter-spacing: 0; line-height: 1.8; }
.hs b { font-size: 1.6rem; line-height: 1.05; }
.hs small { color: var(--muted); font-size: .7rem; margin-inline-start: 2px; }
.sim-pad {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  justify-content: center;
  padding: 6px;
  border: 1px dashed color-mix(in srgb, var(--cyan) 45%, transparent);
  border-radius: 12px;
}
.sim-pad > span { color: var(--cyan); font-weight: 700; margin-inline-end: 4px; }
.hud-actions { display: grid; grid-template-columns: 1fr 1.3fr 1.3fr 1fr; gap: 10px; }
.hbtn {
  --p: 0;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: 76px;
  border-radius: 18px;
  border: 2px solid var(--line-2);
  background: var(--panel-2);
  color: var(--ink);
  font: 800 1.1rem var(--font-c);
  letter-spacing: .08em;
  text-transform: uppercase;
  cursor: pointer;
  touch-action: none;
  user-select: none;
}
html[lang="ur"] .hbtn { font-family: var(--font-ur); letter-spacing: 0; font-size: .95rem; line-height: 1.8; }
.hbtn small { font: 600 .66rem var(--font); letter-spacing: .06em; opacity: .8; }
.hbtn::before { content: ""; position: absolute; inset: 0; transform-origin: left; transform: scaleX(var(--p)); background: rgba(255, 255, 255, .22); pointer-events: none; }
html[dir="rtl"] .hbtn::before { transform-origin: right; }
.hbtn > * { position: relative; }
.hbtn.sos { background: var(--red); border-color: var(--red); color: #fff; }
.hbtn.end { background: var(--yellow); border-color: var(--yellow); color: var(--yellow-ink); }
.hud.paused .hud-main { opacity: .45; }
.hud.paused #hPause { border-color: var(--yellow); color: var(--yellow-text); }
@media (max-width: 760px) {
  #hud { padding: 8px 10px 0; gap: 6px; }
  .hud-actions {
    position: sticky;
    bottom: 0;
    z-index: 2;
    margin: 0 -10px;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    background: var(--bg);
    border-top: 1px solid var(--line);
  }
  .sim-pad { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; scrollbar-width: none; }
  .sim-pad .btn { flex: none; }
  .hud .hud-main { grid-template-columns: 1fr 1fr; flex: none; }
  .hud .hspeed { grid-column: 1 / -1; order: -1; max-width: 290px; margin: 0 auto; width: 100%; }
  .hud .stages li { font-size: 0; gap: 0; padding: 5px; }
  .hud .stages li.cur { font-size: .66rem; gap: 5px; padding: 3px 8px; }
  .hud-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .hs b { font-size: 1.3rem; }
  .hud-actions { grid-template-columns: 1fr 1fr; }
  .hbtn { min-height: 64px; }
  .ibar { height: 110px; }
  .hud-prev .hud-main { grid-template-columns: 1fr 1fr; }
  .hud-prev .hspeed { grid-column: 1 / -1; order: -1; max-width: 300px; margin: 0 auto; width: 100%; }
  .hud-top .hclock { display: none; }
}

/* ---------- crash alarm layer ---------- */
#alarm { position: fixed; inset: 0; z-index: 900; display: none; overflow-y: auto; color: #fff; background: #1a0303; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
#alarm.on { display: block; animation: fadeIn .2s both; }
#alarm.count { background: radial-gradient(circle at 50% 40%, #6d0b07, #1a0303 70%); }
#alarm.count::before { content: ""; position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 0 0 rgba(255, 65, 54, .6); animation: pulseEdge 1s infinite; }
@keyframes pulseEdge { 50% { box-shadow: inset 0 0 0 14px rgba(255, 65, 54, .55); } }
#alarm.practice { background: radial-gradient(circle at 50% 40%, #3b3207, #120f03 70%); }
.al-wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.al-stripe {
  align-self: stretch;
  padding: 6px;
  border-radius: 10px;
  background: #ffcc1a;
  border: 3px dashed #17130a;
  color: #17130a;
  font: 800 1rem var(--font-c);
  letter-spacing: .2em;
}
.al-title { display: flex; align-items: center; gap: 10px; font: 800 clamp(1.8rem, 6vw, 3rem)/1.05 var(--font-c); letter-spacing: .04em; text-transform: uppercase; }
html[lang="ur"] .al-title { font-family: var(--font-ur); letter-spacing: 0; line-height: 1.9; font-size: clamp(1.4rem, 5vw, 2.2rem); }
.al-title .ic { width: 1.1em; height: 1.1em; color: #ff6a60; }
.al-sub { max-width: 560px; color: #ffd9d6; font-size: 1.02rem; }
.al-sub b { color: #fff; font-size: 1.2em; }
.al-ring { position: relative; width: min(230px, 56vw); aspect-ratio: 1; }
.al-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.al-ring .trk { fill: none; stroke: rgba(255, 255, 255, .14); stroke-width: 14; }
.al-ring .val { fill: none; stroke: #ff4136; stroke-width: 14; stroke-linecap: round; transition: stroke-dasharray 1s linear; }
#alarm.practice .al-ring .val { stroke: #ffcc1a; }
.al-ring b { position: absolute; inset: 0; display: grid; place-items: center; font: 800 clamp(64px, 18vw, 110px) var(--font-c); }
.okbtn {
  width: min(620px, 100%);
  min-height: 120px;
  border-radius: 26px;
  border: 0;
  background: #f3f2ec;
  color: #0b0d10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  cursor: pointer;
  box-shadow: 0 0 0 6px rgba(255, 255, 255, .18), 0 20px 50px -20px #000;
  font: 800 2.4rem var(--font-c);
  letter-spacing: .06em;
  text-transform: uppercase;
}
html[lang="ur"] .okbtn { font-family: var(--font-ur); letter-spacing: 0; font-size: 1.9rem; line-height: 1.8; }
.okbtn .ic { width: 38px; height: 38px; color: #13804a; }
.okbtn small { font: 600 .9rem var(--font); letter-spacing: 0; text-transform: none; color: #3a3f45; }
.okbtn:active { transform: scale(.98); }
.okbtn:focus-visible { outline: 4px solid #ffcc1a; outline-offset: 4px; }
.al-row { justify-content: center; }
#alarm .btn.ghost { color: #fff; border-color: rgba(255, 255, 255, .35); }
.al-facts { color: #ffb3ad; }
.al-alert { align-items: stretch; text-align: start; }
.al-alert .al-title, .al-alert .al-sub { align-self: center; text-align: center; }
.al-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 760px) { .al-grid { grid-template-columns: minmax(0, 1fr); } }
.al-contacts { display: flex; flex-direction: column; gap: 6px; }
.al-c { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px; border-radius: 12px; background: rgba(255, 255, 255, .07); }
.al-c small { display: block; color: #ffd9d6; }
#alarm .btn { color: inherit; }
#alarm .btn.y { color: var(--yellow-ink); }
#alarm .btn:not(.y):not(.r):not(.ghost) { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .25); }
#alarm .inp { background: rgba(0, 0, 0, .35); border-color: rgba(255, 255, 255, .25); color: #fff; }
#alarm a:not(.btn) { color: #9fe9f2; }
#alarm .seg { background: rgba(0, 0, 0, .3); border-color: rgba(255, 255, 255, .2); }
#alarm .seg button { color: #ddd; }
#alarm .seg button.on { color: var(--yellow-ink); }

/* ---------- engine page ---------- */
.sm-scroll { overflow-x: auto; }
.machine { width: 100%; min-width: 560px; height: auto; }
.machine .mn rect { fill: var(--panel-2); stroke: var(--line-2); stroke-width: 2; }
.machine .mn text { fill: var(--ink); font: 700 14px var(--font-c); letter-spacing: .06em; text-transform: uppercase; }
html[lang="ur"] .machine .mn text { font-family: var(--font-ur); letter-spacing: 0; font-size: 12px; }
.machine .mn.cur rect { fill: var(--yellow); stroke: var(--yellow); }
.machine .mn.cur text { fill: var(--yellow-ink); }
.machine .mn.alert rect { stroke: var(--red); }
.machine .ma { stroke: var(--cyan); stroke-width: 2.5; }
.machine .mb { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; }
.machine .mb.ok { stroke: var(--green); }
.machine .mnum { fill: var(--panel-3); stroke: var(--muted); stroke-width: 1.5; }
.machine .mnum.ok { stroke: var(--green); }
.machine .mnum-t { fill: var(--ink); font: 700 11px var(--font-c); text-anchor: middle; }
.mrej {
  list-style: none;
  margin: 8px 0 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px 14px;
  font-size: .84rem;
  color: var(--muted);
  min-width: 0;
}
.mrej li { display: flex; gap: 8px; align-items: baseline; }
.mrej b {
  flex: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: inline-grid;
  place-items: center;
  border: 1.5px solid var(--muted);
  font: 700 .72rem var(--font-c);
  color: var(--ink);
}
.mrej li.ok b { border-color: var(--green); }
@media (max-width: 720px) { .mrej { grid-template-columns: minmax(0, 1fr); } }
.machine marker path { fill: var(--cyan); }
.mlbl { font: 600 10.5px/1.25 var(--font); color: var(--cyan); text-align: center; }
html[lang="ur"] .mlbl { font: 500 9px/1.7 var(--font-ur); }
.mlbl.rj { color: var(--muted); text-align: start; white-space: nowrap; }
.limits { list-style: none; padding: 0; margin: 6px 0 0; display: flex; flex-direction: column; gap: 6px; font-size: .88rem; color: var(--ink-2); }
.limits li { display: flex; gap: 8px; }
.limits .ic { color: var(--cyan); margin-top: 3px; }
.plotwrap { background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; padding: 6px; overflow-x: auto; }
.tplot { width: 100%; min-width: 520px; height: auto; display: block; }
.tplot .lane-bg { fill: var(--panel); }
.tplot .lane-l { fill: var(--muted); font: 700 10.5px var(--font-c); letter-spacing: .08em; text-transform: uppercase; }
html[lang="ur"] .tplot .lane-l { font-family: var(--font-ur); letter-spacing: 0; }
.tplot .thr { stroke: var(--yellow); stroke-dasharray: 5 4; stroke-width: 1.4; }
.tplot .sig { fill: none; stroke-width: 1.6; stroke-linejoin: round; }
.tplot .sig.l1 { stroke: var(--cyan); }
.tplot .sig.l2 { stroke: var(--orange); }
.tplot .sig.l3 { stroke: var(--ink); stroke-width: 2.2; }
.tplot .win.w1 { fill: var(--yellow-soft); }
.tplot .win.w2 { fill: var(--cyan-soft); }
.tplot .mark { stroke: var(--ink-2); stroke-dasharray: 3 3; }
.tplot .mark-l { fill: var(--ink-2); font: 600 10px var(--font); }
.tplot .rej { stroke: var(--muted); stroke-width: 1.5; }
.tplot .rej-l { fill: var(--muted); font: 700 10px var(--font-c); }
.tplot .conf { stroke: var(--red); stroke-width: 3; }
.tplot .conf-l { fill: var(--red); font: 800 12px var(--font-c); letter-spacing: .1em; }
.explain { margin: 12px 0 0; padding-inline-start: 22px; display: flex; flex-direction: column; gap: 6px; font-size: .9rem; }
.explain li::marker { color: var(--muted); font-weight: 700; }
.explain li.y::marker { color: var(--yellow-text); }
.explain li.c::marker { color: var(--cyan); }
.explain li.r { color: var(--red); font-weight: 600; }
.explain .ic { color: var(--cyan); }

/* ---------- signal lab ---------- */
.cm { display: grid; grid-template-columns: auto 1fr 1fr; gap: 6px; align-items: stretch; }
.cm-h { font: 700 .72rem var(--font-c); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: center; align-self: end; padding: 4px; }
html[lang="ur"] .cm-h { font-family: var(--font-ur); letter-spacing: 0; line-height: 1.7; }
.cm-h.side { align-self: center; text-align: end; writing-mode: horizontal-tb; max-width: 90px; }
.cm-c { border-radius: 12px; padding: 14px 8px; text-align: center; min-height: 84px; display: flex; flex-direction: column; justify-content: center; }
.cm-c.good { background: color-mix(in srgb, var(--green) calc(var(--a) * 100%), var(--panel-2)); }
.cm-c.bad { background: color-mix(in srgb, var(--red) calc(var(--a) * 100%), var(--panel-2)); }
.cm-c b { font-size: 2.2rem; line-height: 1; }
.cm-c small { font-size: .74rem; color: var(--ink-2); }
.roc { width: 100%; max-width: 330px; height: auto; display: block; margin: 0 auto; }
.roc .gl { stroke: var(--line); }
.roc .diag { stroke: var(--muted); stroke-dasharray: 4 4; }
.roc .curve { fill: none; stroke: var(--cyan); stroke-width: 3; stroke-linejoin: round; }
.roc .pt { fill: var(--cyan); }
.roc .cur { fill: var(--yellow); stroke: var(--bg); stroke-width: 3; }
.kpis.k6 { grid-template-columns: repeat(auto-fit, minmax(122px, 1fr)); }
.kpis.k6 .tile .v { font-size: 1.7rem; }
@media (max-width: 980px) { .lab-eval > .card:first-child { order: 2; } }
.sweep { width: auto; min-height: 34px; padding: 4px 8px; font-size: .84rem; max-width: 190px; }
.sel-sm { width: auto; min-height: 36px; padding: 4px 10px; font-size: .88rem; }
.tlist { max-height: 620px; overflow-y: auto; }
.tlist .li.sel, .list .li.sel { background: var(--yellow-soft); border-radius: 10px; }
.rec-live { display: flex; align-items: center; gap: 10px; padding: 14px; margin: 12px 0; border-radius: 14px; background: var(--bg-2); border: 1px solid var(--line); }
.rec-live b { font-size: 1.8rem; }
.dotrec { width: 14px; height: 14px; border-radius: 50%; background: var(--line-2); }
.rec-live.on .dotrec { background: var(--red); animation: blink 1s infinite; }
.qrtext { white-space: pre-wrap; font-size: .78rem; background: var(--bg-2); padding: 10px; border-radius: 10px; }

/* ---------- coach ---------- */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.badge-c { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.badge-c .bico { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--panel-3); color: var(--muted); }
.badge-c.on .bico { background: var(--yellow); color: var(--yellow-ink); }
.badge-c small { color: var(--muted); font-size: .78rem; flex: 1; }
.badge-c .bar { margin-top: 6px; }

/* ---------- trips and maps ---------- */
.filters { gap: 10px; }
.trip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
@media (max-width: 420px) { .trip-grid { grid-template-columns: minmax(0, 1fr); } }
.card.trip { display: flex; gap: 12px; text-decoration: none; color: inherit; align-items: flex-start; }
.card.trip .tt { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.card.trip .row { gap: 4px 10px; color: var(--ink-2); }
.thumb { width: 104px; height: 64px; flex: none; border-radius: 10px; background: var(--bg-2); border: 1px solid var(--line); }
.thumb polyline { fill: none; stroke: var(--yellow); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.empty-thumb { display: grid; place-items: center; color: var(--line-2); }
.mapbox { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--bg-2); }
.mapbox canvas { display: block; width: 100%; height: 340px; cursor: crosshair; }
.mapbox.tall canvas { height: 430px; }
.leaf { height: 340px; }
@media (max-width: 720px) { .mapbox canvas, .leaf { height: 280px; } .mapbox.tall canvas { height: 320px; } }
.tl { margin-top: 4px; }
.tl .evm line { stroke-width: 1.5; stroke-dasharray: 3 3; }
.tl .evm circle { stroke: var(--bg); stroke-width: 2; }
.tl .evm.brake line, .tl .evm.speed line { stroke: var(--red); }
.tl .evm.brake circle, .tl .evm.speed circle { fill: var(--red); }
.tl .evm.accel line { stroke: var(--orange); }
.tl .evm.accel circle { fill: var(--orange); }
.tl .evm.corner line { stroke: var(--yellow); }
.tl .evm.corner circle { fill: var(--yellow); }
.tl .evm.touch line { stroke: var(--cyan); }
.tl .evm.touch circle { fill: var(--cyan); }
a.li { color: inherit; text-decoration: none; }
a.li:hover { background: var(--panel-2); }
.li .ico b { font-size: 1rem; }
.blk { display: block; }

/* ---------- medical card and sticker ---------- */
.cards-prev { display: grid; gap: 12px; justify-items: center; }
.wcard {
  width: min(100%, 340px);
  aspect-ratio: 85.6 / 54;
  border-radius: 14px;
  padding: 12px 14px;
  background: #f3f2ec;
  color: #15171a;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow: hidden;
  position: relative;
  font-size: 11.5px;
  line-height: 1.35;
}
.wcard.front { border-top: 10px solid #ffcc1a; }
.wcard.back { flex-direction: row; align-items: center; gap: 12px; border-top: 10px solid #0b0d10; }
.wc-top { display: flex; align-items: center; gap: 6px; font: 800 13px var(--font-c); letter-spacing: .08em; text-transform: uppercase; }
html[lang="ur"] .wc-top { font-family: var(--font-ur); letter-spacing: 0; font-size: 11px; line-height: 1.8; }
.wc-mark { width: 24px; height: 24px; border-radius: 6px; background: #0b0d10; color: #ffcc1a; display: grid; place-items: center; }
.wc-blood { margin-inline-start: auto; font: 800 22px var(--font-c); color: #fff; background: #cf2a1f; border-radius: 8px; padding: 0 8px; letter-spacing: 0; }
.wc-name { font: 800 18px/1.1 var(--font-c); }
.wcard dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 8px; margin: 0; }
.wcard dt { color: #5b6067; font-weight: 700; }
.wcard dd { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wc-foot { margin-top: auto; font-weight: 700; color: #cf2a1f; display: flex; align-items: center; gap: 4px; }
.wc-qr { width: 42%; flex: none; }
.wc-qr svg, .st-qr svg { width: 100%; height: auto; display: block; }
.wcard ul { margin: 4px 0; padding-inline-start: 16px; }
.wc-tip { font-size: 9.5px; color: #5b6067; margin: 0; }
.sticker { width: min(100%, 330px); margin: 0 auto; border-radius: 18px; overflow: hidden; border: 3px solid #0b0d10; background: #ffcc1a; color: #0b0d10; }
.st-head {
  background: #cf2a1f;
  color: #fff;
  text-align: center;
  padding: 6px;
  font: 800 15px var(--font-c);
  letter-spacing: .1em;
  text-transform: uppercase;
  display: flex;
  gap: 6px;
  justify-content: center;
  align-items: center;
}
html[lang="ur"] .st-head { font-family: var(--font-ur); letter-spacing: 0; line-height: 1.9; }
.st-body { display: flex; gap: 10px; align-items: center; padding: 10px; }
.st-qr { width: 45%; flex: none; background: #fff; padding: 4px; border-radius: 8px; }
.st-blood { font: 800 34px var(--font-c); color: #cf2a1f; }
.st-body p { font-size: 11.5px; font-weight: 600; margin: 4px 0 0; line-height: 1.35; }
html[lang="ur"] .st-body p, html[lang="ur"] .wcard { line-height: 1.9; }

/* ---------- garage, hazards, fleet ---------- */
.calgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; max-width: 460px; margin: 0 auto; }
.cal {
  aspect-ratio: 1;
  border-radius: 8px;
  background: var(--panel-2);
  color: var(--muted);
  display: grid;
  place-items: center;
  font: 600 .8rem var(--font-c);
  border: 1px solid var(--line);
}
.cal.ok { background: var(--green-soft); color: var(--green); border-color: var(--green); }
.cal.miss { background: var(--red-soft); color: var(--red); border-color: var(--red); }
.ticks { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; font-size: .9rem; }
.ticks li { display: flex; gap: 8px; }
.ticks .ic { color: var(--green); margin-top: 3px; }
.ticks.no .ic { color: var(--red); }
.warn-card { border-color: var(--yellow); background: linear-gradient(var(--yellow-soft), var(--yellow-soft)), var(--panel); }
.hz-types { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.hz-t input { position: absolute; opacity: 0; pointer-events: none; }
.hz-t span {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 4px;
  border-radius: 12px;
  border: 2px solid var(--line);
  cursor: pointer;
  font-size: .82rem;
  text-align: center;
}
.hz-t input:checked + span { border-color: var(--yellow); background: var(--yellow-soft); color: var(--yellow-text); }
.hz-t input:focus-visible + span { outline: 3px solid var(--focus); }
.heat { width: 100%; height: auto; display: block; }
.heat .hm-bg { fill: var(--bg-2); }
.heat .hm-l { fill: var(--muted); font: 600 12px var(--font); text-anchor: middle; }
html[lang="ur"] .heat .hm-l { font-family: var(--font-ur); }
.riders td { vertical-align: middle; }
.riders tr.me td { background: var(--yellow-soft); }
.li.acked { opacity: .6; }
.more-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.more-grid a {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 14px 6px;
  border-radius: 14px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--ink);
  text-decoration: none;
  font-size: .84rem;
  font-weight: 600;
  text-align: center;
}
.more-grid a .ic { color: var(--yellow-text); }

/* ---------- learn, quiz ---------- */
.lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
@media (max-width: 420px) { .lessons { grid-template-columns: minmax(0, 1fr); } }
.card.lesson { display: flex; gap: 14px; text-decoration: none; color: inherit; }
.ico-xl { width: 60px; height: 60px; border-radius: 16px; display: grid; place-items: center; flex: none; background: var(--yellow-soft); color: var(--yellow-text); }
.ico-xl.r { background: var(--red-soft); color: var(--red); }
.ico-xl.c { background: var(--cyan-soft); color: var(--cyan); }
.lesson-view .lead { font-size: 1.05rem; color: var(--ink-2); }
.lesson-view.firstaid { border-color: var(--red); }
.steps { padding-inline-start: 24px; display: flex; flex-direction: column; gap: 10px; margin: 14px 0 0; }
.steps li::marker { font: 800 1.1rem var(--font-c); color: var(--yellow-text); }
.signs { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; margin-top: 16px; }
.signs figure { margin: 0; text-align: center; background: var(--panel-2); border-radius: 12px; padding: 10px; }
.signs svg { width: 72px; height: 72px; }
.signs figcaption { font-size: .8rem; color: var(--ink-2); margin-top: 4px; }
.card h2.qtext { display: block; font: 600 1.25rem/1.4 var(--font); margin: 14px 0; text-transform: none; letter-spacing: 0; }
html[lang="ur"] .card h2.qtext { font-family: var(--font-ur); line-height: 2.1; }
.qbar { max-width: 260px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 12px 14px;
  border-radius: 12px;
  border: 2px solid var(--line);
  background: var(--panel-2);
  text-align: start;
  cursor: pointer;
  font-size: 1rem;
}
.opt:hover:not([disabled]) { border-color: var(--yellow); }
.opt.right { border-color: var(--green); background: var(--green-soft); }
.opt.wrong { border-color: var(--red); background: var(--red-soft); }
.opt[disabled] { cursor: default; }

/* ---------- inbox, settings, about ---------- */
.li.unread b { color: var(--yellow-text); }
.dot-new { width: 10px; height: 10px; border-radius: 50%; background: var(--red); flex: none; }
h3.day { font: 700 .78rem var(--font-c); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 14px 0 2px; }
html[lang="ur"] h3.day { font-family: var(--font-ur); letter-spacing: 0; }
.keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px 16px; }
.keys div { display: flex; gap: 10px; align-items: center; }
.keys kbd { min-width: 54px; }
.about-hero .mark.big svg { width: 64px; height: 64px; }
.tdot.live { min-width: 10px; width: 10px; height: 10px; padding: 0; background: var(--green); animation: blink 1.2s infinite; }

/* ---------- RTL details ---------- */
html[dir="rtl"] .spd-num em, html[dir="rtl"] .num { direction: ltr; }
html[dir="rtl"] .card.trip .tt { direction: rtl; }
html[lang="ur"] .card h3, html[lang="ur"] .li b { line-height: 1.9; }
html[lang="ur"] .tile .s, html[lang="ur"] .li small { line-height: 1.9; }

/* ---------- print ---------- */
@media print {
  @page { size: A4; margin: 12mm; }
  :root, html[data-theme] {
    --bg: #fff;
    --bg-2: #f4f4f4;
    --panel: #fff;
    --panel-2: #f2f2f2;
    --panel-3: #e4e4e4;
    --line: #cfcfcf;
    --line-2: #b5b5b5;
    --ink: #111;
    --ink-2: #333;
    --muted: #555;
    --cyan: #08788a;
    --green: #13804a;
    --red: #cf2a1f;
    --yellow-text: #7a5a00;
  }
  body { background: #fff !important; color: #111; }
  .app, #hud, #alarm, #toasts, #modal, #scrim, #tour, .palette, .skip { display: none !important; }
  #printArea { display: block !important; }
  .pdoc { font-family: var(--font); color: #111; }
  html[lang="ur"] .pdoc { font-family: var(--font-ur); }
  .pdoc h1 { font: 800 22px var(--font-c); margin-bottom: 6px; }
  .pdoc h2 { font: 700 15px var(--font-c); margin: 16px 0 6px; text-transform: uppercase; letter-spacing: .06em; }
  .pdoc .tbl th, .pdoc .tbl td { border-bottom: 1px solid #ccc; color: #111; }
  .pdoc .chip { border: 1px solid #999; background: #fff !important; color: #111 !important; }
  .pdoc svg text { fill: #333 !important; }
  .pdoc .cm-c { border: 1px solid #999; }
  .pdoc .cm-c.good { background: color-mix(in srgb, #13804a calc(var(--a) * 55%), #fff); }
  .pdoc .cm-c.bad { background: color-mix(in srgb, #cf2a1f calc(var(--a) * 55%), #fff); }
  .pcols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: center; }
  .print-cards { display: flex; gap: 8mm; flex-wrap: wrap; margin: 6mm 0; }
  .print-cards .wcard { width: 85.6mm; height: 54mm; aspect-ratio: auto; box-shadow: none; border: 1px dashed #999; }
  .print-cards .wcard.front { border-top: 10px solid #ffcc1a; }
  .print-cards .wcard.back { border-top: 10px solid #0b0d10; }
  .print-sticker .sticker { width: 90mm; margin: 0; }
  .heat .hm-bg { fill: #f2f2f2; }
  .bar { border: 1px solid #ccc; }
}
</style>
