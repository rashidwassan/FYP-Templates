<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuqta — Mind Map & Flowchart Editor | FYP Template</title>
<meta name="description" content="Offline mind map and flowchart editor: infinite SVG canvas, shapes and connectors, Sugiyama-style auto-layout, undo/redo, version history, outline panel, comments, sticky notes, image nodes, presentation mode, Mermaid import/export and SVG/PNG/Markdown export. Single-file FYP template.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- tokens & themes ---------- */
:root{
  --bg:#f6f6f3; --dot:#d4d6dc;
  --bar:#0f172a; --bar-2:#1e293b; --bar-3:#334155;
  --ink:#0f172a; --muted:#64748b; --line:#e2e5ea; --paper:#fff;
  --accent:#fb7a2e; --accent-soft:#ffe8d9; --sel:#2563eb; --warn:#f59e0b; --ok:#22c55e; --bad:#ef4444;
  --font:"Instrument Sans",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --dur:.35s; --grid:24px;
}
:root[data-theme=dark]{--bg:#111827;--dot:#273244;--paper:#1f2937;--ink:#e5e7eb;--muted:#9ca3af;--line:#374151;--accent-soft:#3b2a1e}
:root[data-theme=sepia]{--bg:#f3ebdb;--dot:#d6c9ad;--paper:#fbf6ea;--ink:#3b2f1e;--muted:#86775c;--line:#e3d6bd;--accent:#c2410c;--accent-soft:#f6dfc8;--bar:#2b2117;--bar-2:#3d3024;--bar-3:#55443a}
:root[data-theme=ocean]{--bg:#e8f1f6;--dot:#b9d1df;--paper:#f7fbfd;--ink:#0c2a3a;--muted:#4f6f82;--line:#d0e1eb;--accent:#0ea5a4;--accent-soft:#cdf2f0;--bar:#0b2537;--bar-2:#133a52;--bar-3:#1f5070;--sel:#0369a1}
:root[data-theme=forest]{--bg:#eef3ea;--dot:#c3d3b9;--paper:#f8fbf5;--ink:#15261a;--muted:#5b705f;--line:#d4e1cc;--accent:#65a30d;--accent-soft:#e3f2c9;--bar:#14261b;--bar-2:#1f3a2a;--bar-3:#2f5340}
:root[data-theme=contrast]{--bg:#fff;--dot:#8b8b8b;--paper:#fff;--ink:#000;--muted:#222;--line:#000;--accent:#ffd500;--accent-soft:#fff3b0;--sel:#0000ee;--bar:#000;--bar-2:#1f1f1f;--bar-3:#444}

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.2}
.ic{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- motion kit ---------- */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
html.no-anim *,html.no-anim *::before,html.no-anim *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes slideLeft{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.enter{animation:fadeUp var(--dur) var(--ease) both}
.stagger>*{animation:fadeUp .4s var(--ease) both;animation-delay:calc(var(--i,0)*35ms)}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-rows:52px minmax(0,1fr) 28px;grid-template-columns:minmax(0,1fr);height:100%}
.app.presenting{grid-template-rows:minmax(0,1fr)}
.app.presenting .bar,.app.presenting .status,.app.presenting .palette,.app.presenting .inspector,.app.presenting .side,
.app.presenting .float.zoom,.app.presenting .minimap,.app.presenting .hint,.app.presenting .findbar{display:none}
.app.presenting .work{grid-template-columns:minmax(0,1fr)}

/* ---------- toolbar ---------- */
.bar{background:var(--bar);color:#e2e8f0;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid #000;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.bar>*{flex:none}
.bar .spacer{flex:1 0 8px}
.brand{display:flex;align-items:center;gap:8px;margin-right:6px}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#0f172a}
.brand b{font-size:.98rem}
.docname{background:transparent;border:1px solid transparent;border-radius:8px;color:#fff;padding:5px 8px;width:150px;font-weight:600}
.docname:hover,.docname:focus{border-color:var(--bar-3);outline:0;background:var(--bar-2)}
.tb{border:0;background:transparent;color:#cbd5e1;border-radius:8px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;position:relative;transition:background .15s,color .15s,transform .1s}
.tb:hover{background:var(--bar-2);color:#fff}
.tb.on{background:var(--accent);color:#0f172a}
.tb:active{transform:scale(.95)}
.tb:disabled{opacity:.35;cursor:default}
.tb .ic{width:18px;height:18px}
.tb[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:40px;left:50%;transform:translateX(-50%);background:#000;color:#fff;font-size:.72rem;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:50}
.tb .badge{position:absolute;top:3px;right:3px;min-width:15px;height:15px;border-radius:8px;background:var(--accent);color:#0f172a;font-size:.62rem;font-weight:700;display:grid;place-items:center;padding:0 3px}
.tb .badge:empty{display:none}
.sep{width:1px;height:24px;background:var(--bar-3);margin:0 4px}
.seg{display:inline-flex;background:var(--bar-2);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;color:#cbd5e1;padding:5px 10px;white-space:nowrap;border-radius:7px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button.on{background:var(--accent);color:#0f172a}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:6px;background:var(--bar-2);border-radius:9px;padding:0 4px 0 8px}
.search .ic{width:14px;height:14px;color:#94a3b8}
.search input{background:none;border:0;color:#fff;outline:0;width:110px;padding:7px 2px}
.search .tb{width:28px;height:28px}
.btn{border:0;border-radius:9px;padding:7px 12px;font-weight:600;cursor:pointer;background:var(--accent);color:#0f172a;display:inline-flex;gap:7px;align-items:center;transition:transform .15s var(--ease),box-shadow .15s var(--ease)}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--bar-2);color:#e2e8f0}
.btn.light{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:5px 9px;font-size:.82rem}
.btn.danger{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.btn:disabled{opacity:.5;cursor:default;transform:none}

/* ---------- workspace ---------- */
.work{position:relative;display:grid;grid-template-columns:56px 0 minmax(0,1fr) 260px;transition:grid-template-columns .3s var(--ease)}
.work.side-open{grid-template-columns:56px 280px minmax(0,1fr) 260px}
.palette{background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;overflow:auto}
.pal{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:grab;color:var(--ink);transition:transform .15s,border-color .15s,background .15s}
.pal:hover{border-color:var(--accent);transform:translateY(-1px)}
.pal.on{background:var(--accent-soft);border-color:var(--accent)}
.pal svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8}
.pal-label{font-size:.62rem;color:var(--muted);text-align:center;margin-top:-2px}

/* side panel: outline · comments · history · activity */
.side{background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;min-width:0;transition:visibility .3s}
.work:not(.side-open) .side{visibility:hidden;border-right-color:transparent}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px 4px;font-size:.74rem;font-weight:600;cursor:pointer;display:grid;place-items:center;gap:2px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button .ic{width:16px;height:16px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .tclose{flex:0 0 34px;color:var(--muted)}
.side-body{flex:1;overflow:auto;padding:10px;min-width:0}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.orow{display:flex;align-items:center;gap:4px;padding:3px 6px 3px 4px;border-radius:7px;cursor:pointer;min-height:30px;font-size:.86rem}
.orow:focus-visible{outline:2px solid var(--sel);outline-offset:-2px}
.side-body.anim .orow,.side-body.anim .cmt,.side-body.anim .ver,.side-body.anim .act{animation:slideLeft .25s var(--ease) both}
.orow:hover{background:var(--bg)}
.orow.sel{background:var(--accent-soft)}
.orow .tog{width:20px;height:20px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none;padding:0;border-radius:5px}
.orow .tog.dot::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--line)}
.orow .otext{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow input{flex:1;min-width:0;border:1px solid var(--sel);border-radius:6px;padding:2px 6px;background:var(--paper)}
.orow .mini{width:22px;height:22px;border:0;background:transparent;color:var(--muted);border-radius:5px;display:none;place-items:center;cursor:pointer;flex:none;padding:0}
.orow:hover .mini,.orow.sel .mini{display:grid}
.orow .mini:hover{background:var(--paper);color:var(--ink)}
.cmt{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.84rem;display:grid;gap:4px;margin-bottom:8px;background:var(--bg)}
.cmt.resolved{opacity:.55}
.cmt .who{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted)}
.cmt .on{color:var(--sel);cursor:pointer;font-weight:600}
.cmt .acts{display:flex;gap:4px;justify-content:flex-end}
.ver{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;background:var(--bg)}
.ver>svg{width:64px;height:44px;flex:none;background:var(--paper);border-radius:6px;border:1px solid var(--line)}
.ver .meta{flex:1;min-width:0;font-size:.8rem}
.ver .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ver .meta span{color:var(--muted);font-size:.72rem}
.ver .acts{display:grid;gap:4px}
.act{display:flex;gap:8px;align-items:flex-start;font-size:.8rem;padding:6px 0;border-bottom:1px dashed var(--line)}
.act .ic{color:var(--muted);margin-top:2px}
.act span{color:var(--muted);font-size:.72rem;display:block}

/* canvas */
.canvaswrap{position:relative;overflow:hidden;background:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:var(--grid) var(--grid);cursor:default;touch-action:none;min-width:0}
.canvaswrap.pan{cursor:grab}
.canvaswrap.panning{cursor:grabbing}
.canvaswrap.addnode,.canvaswrap.connect,.canvaswrap.sticky{cursor:crosshair}
.canvaswrap:focus{outline:none}
.canvaswrap:focus-visible{outline:2px solid var(--sel);outline-offset:-2px}
.canvaswrap:has(.findbar.on) .hint,.canvaswrap:has(.welcome:not([hidden])) .hint{display:none}
.canvaswrap.dropping{outline:3px dashed var(--sel);outline-offset:-6px}
#board{position:absolute;inset:0;width:100%;height:100%;display:block}
.node{cursor:move;transition:opacity .35s var(--ease)}
.node rect,.node path,.node ellipse,.node polygon{transition:filter .15s}
.node.sel .shape{stroke:var(--sel)!important;stroke-width:2.5!important}
.node.hit .shape{stroke:var(--warn)!important;stroke-width:3!important}
.node:hover .shape{filter:brightness(.97)}
.node text{font-family:var(--font);pointer-events:none;user-select:none}
.node .nicon{stroke:#0f172a;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.node .port{fill:#fff;stroke:var(--sel);stroke-width:1.5;opacity:0;transition:opacity .15s;cursor:crosshair}
.node:hover .port,.node.sel .port{opacity:1}
.node .handle{fill:var(--sel);opacity:0;cursor:nwse-resize}
.node.sel .handle{opacity:1}
.node .collapse{cursor:pointer}
.node .cbadge{cursor:pointer}
.node.dim,.edge.dim,.sticky.dim{opacity:.12;pointer-events:none}
.edge{cursor:pointer;transition:opacity .35s var(--ease)}
.edge .hit{stroke:transparent;stroke-width:14;fill:none}
.edge .line{fill:none;stroke:#64748b;stroke-width:2}
.edge .line,.edge .hit{transition:d .35s var(--ease)}
.canvaswrap.dragging .edge path,.canvaswrap.dragging .node,.canvaswrap.dragging .sticky{transition:none!important}
.edge.sel .line{stroke:var(--sel);stroke-width:3}
.edge.hit .line{stroke:var(--warn);stroke-width:3}
.edge text{font-family:var(--font);font-size:12px;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;pointer-events:none}
.sticky{cursor:move;transition:opacity .35s var(--ease)}
.sticky text{font-family:var(--font);pointer-events:none;user-select:none;fill:#3b2f1e}
.sticky.sel .paper{stroke:var(--sel);stroke-width:2}
.sticky .shandle{fill:var(--sel);opacity:0;cursor:nwse-resize}
.sticky.sel .shandle{opacity:1}
.marquee{fill:rgba(37,99,235,.08);stroke:var(--sel);stroke-dasharray:4 3}
.temp-edge{fill:none;stroke:var(--sel);stroke-width:2;stroke-dasharray:6 4}
.editor{position:absolute;border:2px solid var(--sel);border-radius:8px;background:var(--paper);color:var(--ink);padding:6px 8px;resize:none;outline:0;font-family:var(--font);text-align:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);z-index:5}
.editor.left{text-align:left}
.float{position:absolute;display:flex;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 12px 30px -16px rgba(0,0,0,.4);z-index:4}
.float.zoom{right:14px;bottom:14px;align-items:center}
.float .tb{color:var(--ink);width:32px;height:32px}
.float .tb:hover{background:var(--bg)}
.zoomv{min-width:46px;text-align:center;font-weight:600;font-size:.82rem}
.minimap{position:absolute;left:14px;bottom:14px;width:160px;height:110px;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 12px 30px -16px rgba(0,0,0,.4);z-index:4}
.minimap svg{width:100%;height:100%;display:block}
.hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.82rem;color:var(--muted);box-shadow:0 10px 30px -16px rgba(0,0,0,.3);z-index:4;animation:fadeUp .3s var(--ease);display:flex;gap:8px;align-items:center;max-width:calc(100% - 28px);white-space:nowrap;overflow:hidden}

/* find & replace bar */
.findbar{position:absolute;top:14px;right:14px;width:min(320px,calc(100% - 28px));background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 16px 40px -20px rgba(0,0,0,.45);z-index:5;display:none;gap:8px;animation:pop .2s var(--ease)}
.findbar.on{display:grid;grid-template-columns:minmax(0,1fr)}
.findbar .frow{display:flex;gap:6px;align-items:center}
.findbar input[type=text]{flex:1;min-width:0;width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px}
.findbar .count{font-size:.76rem;color:var(--muted);min-width:56px;text-align:right}
.findbar label{font-size:.78rem;color:var(--muted);display:inline-flex;gap:4px;align-items:center}
.findbar .tb{color:var(--ink);width:30px;height:30px}
.findbar .tb:hover{background:var(--bg)}

/* presentation bar */
.present-bar{display:none;position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:var(--bar);color:#e2e8f0;border-radius:14px;padding:8px 10px;gap:8px;align-items:center;box-shadow:0 20px 50px -20px rgba(0,0,0,.6);z-index:7;max-width:calc(100% - 28px)}
.present-bar .title{font-weight:600;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.present-bar .count{font-size:.78rem;color:#94a3b8;min-width:48px;text-align:center}
.present-bar .prog{position:absolute;left:10px;right:10px;bottom:-5px;height:3px;border-radius:2px;background:var(--bar-3);overflow:hidden}
.present-bar .prog i{display:block;height:100%;background:var(--accent);transition:width .4s var(--ease)}

/* ---------- inspector ---------- */
.inspector{background:var(--paper);border-left:1px solid var(--line);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.inspector h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.field{display:grid;gap:4px}
.field label{font-size:.76rem;font-weight:600;color:var(--muted)}
.field input[type=text],.field input[type=url],.field input[type=number],.field textarea,.field select{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 9px;width:100%;min-width:0}
.field textarea{min-height:70px;resize:vertical}
.chk{display:flex;align-items:center;gap:8px;font-size:.86rem}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:24px;height:24px;border-radius:8px;border:2px solid transparent;cursor:pointer;transition:transform .15s}
.sw:hover{transform:scale(1.1)}
.sw.on{border-color:var(--ink)}
.shapes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.shapes button{border:1px solid var(--line);background:var(--bg);border-radius:9px;height:40px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.shapes button.on{border-color:var(--accent);background:var(--accent-soft)}
.shapes svg{width:26px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.icons button{border:1px solid var(--line);background:var(--bg);border-radius:8px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icons button.on{border-color:var(--accent);background:var(--accent-soft)}
.icons button .ic{width:16px;height:16px}
.imgprev{width:100%;max-height:120px;object-fit:contain;border-radius:9px;border:1px solid var(--line);background:var(--bg);display:block}
.row{display:flex;gap:6px;flex-wrap:wrap}
.kv{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);padding:4px 0;border-bottom:1px dashed var(--line)}
.empty{color:var(--muted);font-size:.86rem;line-height:1.5;margin:0}
kbd{background:var(--bg);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:.78rem;font-family:var(--font)}

/* ---------- status bar ---------- */
.status{background:var(--paper);border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 12px;font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden}
.status .dotok{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:5px}

/* ---------- modals, popovers, toasts ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:16px;backdrop-filter:blur(2px)}
.scrim.on{display:flex}
.scrim.on .modal{animation:pop .22s var(--ease)}
.modal{background:var(--paper);border-radius:18px;max-width:860px;width:100%;max-height:90vh;overflow:auto;padding:20px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6)}
.modal h2{font-size:1.2rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.modal h3.sub{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:16px 0 8px}
.close{margin-left:auto;border:1px solid var(--line);background:var(--bg);border-radius:9px;width:34px;height:34px;cursor:pointer;display:grid;place-items:center;color:var(--ink);flex:none}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.doc{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg);cursor:pointer;transition:transform .15s,border-color .15s;animation:fadeUp .4s var(--ease) both;animation-delay:calc(var(--i,0)*35ms)}
.doc:hover{transform:translateY(-2px);border-color:var(--accent)}
.doc>svg{width:100%;height:110px;display:block;background:var(--paper)}
.doc .meta{padding:8px 10px;font-size:.82rem}
.doc .meta b{display:block}
.doc .meta span{color:var(--muted);font-size:.74rem}
.doc .acts{display:flex;gap:4px;padding:0 8px 8px}
.tpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.tpl button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;text-align:left;cursor:pointer;color:var(--ink);display:grid;gap:3px;transition:transform .15s,border-color .15s}
.tpl button:hover{border-color:var(--accent);transform:translateY(-1px)}
.tpl b{display:flex;gap:6px;align-items:center}
.tpl span{font-size:.78rem;color:var(--muted)}
.todo{border:1px dashed var(--accent);border-radius:12px;padding:10px 12px;background:var(--bg)}
.todo h4{margin:0 0 3px;font-size:.92rem;display:flex;gap:8px;align-items:center}
.tag{font-size:.66rem;background:var(--bar);color:var(--accent);border-radius:6px;padding:2px 6px;font-weight:700}
.list{display:grid;gap:8px}
.keys{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 14px;font-size:.86rem;align-items:center}
.code{width:100%;min-height:200px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;resize:vertical;white-space:pre}
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:start}
.set-grid .list{align-content:start}
input[type=checkbox],input[type=range]{accent-color:var(--accent)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.theme-card{border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;display:grid;gap:6px;background:var(--bg);text-align:left;color:var(--ink);font-weight:600;font-size:.82rem}
.theme-card.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.theme-card .strip{height:28px;border-radius:7px;display:grid;grid-template-columns:1fr 2fr 1fr;overflow:hidden}
.pop{position:fixed;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 20px 50px -20px rgba(0,0,0,.5);z-index:65;display:grid;gap:2px;min-width:170px;animation:pop .18s var(--ease)}
.pop button{display:flex;gap:8px;align-items:center;padding:7px 10px;border:0;background:transparent;border-radius:8px;cursor:pointer;color:var(--ink);width:100%;text-align:left;font-weight:500}
.pop button:hover{background:var(--bg)}
.pop button.on{background:var(--accent-soft)}
.pop .swatch{width:16px;height:16px;border-radius:50%;border:1px solid var(--line);flex:none}
#toasts{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);display:grid;gap:8px;z-index:70;max-width:calc(100% - 24px)}
.toast{background:var(--bar);color:#fff;padding:9px 14px;border-radius:10px;font-weight:600;animation:fadeUp .25s var(--ease);display:flex;gap:8px;align-items:center}
.toast.out{opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}

/* ---------- onboarding tour & welcome ---------- */
.tour{position:fixed;inset:0;z-index:80}
.tour-spot{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(15,23,42,.62);pointer-events:none;transition:all .35s var(--ease);border:2px solid var(--accent)}
.tour-card{position:fixed;background:var(--paper);color:var(--ink);border-radius:14px;padding:14px 16px;width:min(320px,calc(100vw - 24px));box-shadow:0 30px 60px -25px rgba(0,0,0,.6);display:grid;gap:8px;animation:pop .25s var(--ease)}
.tour-card h4{font-size:1rem;display:flex;gap:8px;align-items:center}
.tour-card p{margin:0;color:var(--muted);font-size:.88rem;line-height:1.45}
.tour-card .foot{display:flex;gap:6px;align-items:center;margin-top:4px}
.tour-card .step{font-size:.74rem;color:var(--muted);margin-right:auto}
.welcome{position:absolute;left:14px;top:14px;width:min(300px,calc(100% - 28px));background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 16px 40px -20px rgba(0,0,0,.45);z-index:5;display:grid;gap:8px;animation:fadeUp .35s var(--ease)}
.welcome h4{display:flex;gap:8px;align-items:center;font-size:.95rem}
.welcome p{margin:0;font-size:.84rem;color:var(--muted);line-height:1.45}

/* ---------- responsive ---------- */
.mob-insp{display:none}
@media (max-width:1440px){.brand b{display:none}}
@media (max-width:900px){
  .bar{gap:4px}
  .hide-m{display:none!important}
  .docname{width:110px}
  .work{grid-template-columns:48px minmax(0,1fr)}
  .work.side-open{grid-template-columns:48px minmax(0,1fr)}
  .side{position:absolute;left:48px;top:0;bottom:0;width:min(300px,82vw);transform:translateX(-110%);transition:transform .3s var(--ease),visibility .3s;z-index:6;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .work.side-open .side{transform:none}
  .inspector{position:absolute;left:0;right:0;bottom:0;max-height:55%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(105%);transition:transform .3s var(--ease);z-index:6}
  .inspector.open{transform:none}
  .minimap,.hint{display:none}
  .mob-insp{display:grid}
  .keys{grid-template-columns:auto 1fr}
  .present-bar .title{max-width:34vw}
}
@media print{
  .bar,.palette,.side,.inspector,.status,.float,.minimap,.hint,.findbar,.welcome,#toasts{display:none!important}
  html,body{overflow:visible;background:#fff}
  .app{display:block;height:auto}
  .work{display:block}
  .canvaswrap{position:static;height:95vh;background:#fff}
}
</style>
