<script>
'use strict';
/* =====================================================================
   Nuqta — Mind Map & Flowchart Editor (single file)

   Sections (in order):
     helpers · settings & themes · model · history & persistence · geometry ·
     render (keyed SVG patching) · layout (tree + Sugiyama-style layered) ·
     interactions (pointer state machine, inline editor) · keyboard & node
     navigation · inspector · stickies, comments, images, icons · side panel
     (outline, comments, history, activity) · find & replace · documents &
     templates · Mermaid import/export · export · presentation · settings ·
     onboarding tour · help · boot · public API (window.nuqta)

   Student hooks: search for TODO(student)
   ===================================================================== */

// ---------- helpers ----------
const NS = 'nuqta:';
const SVGNS = 'http://www.w3.org/2000/svg';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const store = {
  get(k, d) {
    try {
      const v = localStorage.getItem(NS + k);
      return v == null ? d : JSON.parse(v);
    } catch {
      return d;
    }
  },
  set(k, v) {
    try {
      localStorage.setItem(NS + k, JSON.stringify(v));
      return true;
    } catch {
      return false;
    }
  },
  del(k) {
    try {
      localStorage.removeItem(NS + k);
    } catch {
      /* storage unavailable */
    }
  },
  keys() {
    const out = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(NS)) out.push(k.slice(NS.length));
    }
    return out;
  },
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmtTime = t => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const fmtDate = t => new Date(t).toLocaleDateString();
const escapeRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

function ago(t) {
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  return fmtDate(t);
}

function debounce(fn, ms) {
  let t = 0;
  return (...a) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...a), ms);
  };
}

function toast(m, icon = 'check') {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = ic(icon) + esc(m);
  $('#toasts').append(t);
  setTimeout(() => t.classList.add('out'), 2100);
  setTimeout(() => t.remove(), 2500);
}

// Screen-reader live region used by keyboard navigation and presentation.
function announce(msg) {
  $('#live').textContent = msg;
}

const COLORS = ['#fde68a', '#fbcfe8', '#bfdbfe', '#bbf7d0', '#ddd6fe', '#fed7aa', '#a5f3fc', '#e5e7eb'];
const STICKY_COLORS = ['#fef08a', '#fbcfe8', '#bbf7d0', '#bfdbfe', '#fed7aa', '#e9d5ff'];

// Darker stroke derived from a pastel fill.
function DARK(c) {
  const n = parseInt(c.slice(1), 16);
  const r = (n >> 16) & 255;
  const g = (n >> 8) & 255;
  const b = n & 255;
  return `rgb(${(r * 0.55) | 0},${(g * 0.55) | 0},${(b * 0.55) | 0})`;
}

const SHAPES = {
  rect: 'Process',
  round: 'Rounded',
  pill: 'Terminal',
  diamond: 'Decision',
  para: 'Input / Output',
  doc: 'Document',
  db: 'Database',
  circle: 'Circle',
  note: 'Note',
};

// Icons a node may carry (all come from the inline sprite).
const NODE_ICONS = [
  'lightbulb', 'star', 'flag', 'check-circle', 'alert', 'target',
  'user', 'users', 'calendar', 'clock', 'book', 'graduation',
  'code', 'cpu', 'globe', 'rocket', 'zap', 'lock',
  'key', 'map-pin', 'mail', 'phone', 'shield', 'trophy',
  'brain', 'briefcase', 'coins', 'heart', 'flask', 'leaf',
];

// ---------- settings & themes ----------
const DEFAULTS = {
  theme: '',
  snap: true,
  grid: 12,
  minimap: true,
  hints: true,
  animations: true,
  flowDir: 'TB',
  layerGap: 130,
  nodeGap: 40,
  mindStyle: 'right',
  autoVersion: 25,
  author: 'Me',
  sideOpen: false,
  fullscreen: false,
  sideTab: 'outline',
};
let settings = Object.assign({}, DEFAULTS, store.get('settings', {}));
// Legacy keys from the first version win so older installs keep their choices.
settings.snap = store.get('snap', settings.snap);
settings.theme = store.get('theme', settings.theme);

function saveSettings() {
  store.set('settings', settings);
  store.set('snap', settings.snap);
  store.set('theme', settings.theme);
}

function applySettings() {
  document.documentElement.style.setProperty('--grid', settings.grid * 2 + 'px');
  document.documentElement.classList.toggle('no-anim', !settings.animations);
  $('#minimap').style.display = settings.minimap ? '' : 'none';
  $('#hint').style.display = settings.hints ? '' : 'none';
}

const THEMES = [
  { id: '', name: 'Light', bg: '#f6f6f3', paper: '#ffffff', accent: '#fb7a2e', dark: false },
  { id: 'dark', name: 'Dark', bg: '#111827', paper: '#1f2937', accent: '#fb7a2e', dark: true },
  { id: 'sepia', name: 'Sepia', bg: '#f3ebdb', paper: '#fbf6ea', accent: '#c2410c', dark: false },
  { id: 'ocean', name: 'Ocean', bg: '#e8f1f6', paper: '#f7fbfd', accent: '#0ea5a4', dark: false },
  { id: 'forest', name: 'Forest', bg: '#eef3ea', paper: '#f8fbf5', accent: '#65a30d', dark: false },
  { id: 'contrast', name: 'High contrast', bg: '#ffffff', paper: '#ffffff', accent: '#ffd500', dark: false },
];

function setTheme(id) {
  const t = THEMES.find(x => x.id === id) || THEMES[0];
  document.documentElement.dataset.theme = t.id;
  settings.theme = t.id;
  saveSettings();
  $('#themeBtn').innerHTML = ic(t.dark ? 'sun' : 'moon');
}

// ---------- model ----------
let doc;
let view = { x: 0, y: 0, z: 1 };
let sel = new Set();
let selEdge = null;
let selSticky = null;
let tool = 'select';
let clipboard = null;

function newDoc(name = 'Untitled', mode = 'mind') {
  return {
    id: uid(),
    name,
    mode,
    nodes: [],
    edges: [],
    stickies: [],
    comments: [],
    view: { x: 0, y: 0, z: 1 },
    updatedAt: Date.now(),
  };
}

// Documents saved by the first version lack the newer arrays and fields.
function normalizeDoc(d) {
  d.nodes = Array.isArray(d.nodes) ? d.nodes : [];
  d.edges = Array.isArray(d.edges) ? d.edges : [];
  d.stickies = Array.isArray(d.stickies) ? d.stickies : [];
  d.comments = Array.isArray(d.comments) ? d.comments : [];
  d.view = d.view || { x: 0, y: 0, z: 1 };
  d.mode = d.mode === 'flow' ? 'flow' : 'mind';
  d.name = d.name || 'Untitled';
  d.id = d.id || uid();
  d.nodes.forEach(n => {
    n.icon = n.icon || '';
    n.image = n.image || '';
    n.url = n.url || '';
    n.notes = n.notes || '';
    n.fs = n.fs || 14;
  });
  return d;
}

function mkNode(x, y, text = 'Idea', o = {}) {
  return {
    id: uid(),
    x: Math.round(x),
    y: Math.round(y),
    w: o.w || 150,
    h: o.h || 56,
    text,
    shape: o.shape || (doc.mode === 'mind' ? 'round' : 'rect'),
    color: o.color || COLORS[Math.floor(Math.random() * 6)],
    parent: o.parent || null,
    collapsed: false,
    fs: o.fs || 14,
    url: o.url || '',
    notes: o.notes || '',
    icon: o.icon || '',
    image: o.image || '',
  };
}

function mkEdge(from, to, o = {}) {
  return {
    id: uid(),
    from,
    to,
    label: o.label || '',
    type: o.type || (doc.mode === 'mind' ? 'curve' : 'ortho'),
    arrow: o.arrow ?? (doc.mode === 'mind' ? 'none' : 'end'),
    dash: !!o.dash,
  };
}

function mkSticky(x, y, text = 'Sticky note', o = {}) {
  return {
    id: uid(),
    x: Math.round(x),
    y: Math.round(y),
    w: o.w || 170,
    h: o.h || 120,
    text,
    color: o.color || STICKY_COLORS[0],
  };
}

function mkComment(nodeId, text) {
  return { id: uid(), nodeId, text, author: settings.author || 'Me', at: Date.now(), resolved: false };
}

const N = id => doc.nodes.find(n => n.id === id);
const S = id => doc.stickies.find(s => s.id === id);
const E = id => doc.edges.find(e => e.id === id);
const children = id => doc.nodes.filter(n => n.parent === id);
const roots = () => doc.nodes.filter(n => !n.parent || !N(n.parent));

// parent id -> children, built once per render so large maps stay O(n).
function childMap() {
  const m = new Map();
  doc.nodes.forEach(n => {
    if (!n.parent) return;
    if (!m.has(n.parent)) m.set(n.parent, []);
    m.get(n.parent).push(n);
  });
  return m;
}

function hiddenIds() {
  const m = childMap();
  const h = new Set();
  const walk = id => (m.get(id) || []).forEach(c => {
    h.add(c.id);
    walk(c.id);
  });
  doc.nodes.forEach(n => {
    if (n.collapsed) walk(n.id);
  });
  return h;
}

function descendants(id, map = childMap()) {
  const out = [];
  const walk = i => (map.get(i) || []).forEach(c => {
    out.push(c.id);
    walk(c.id);
  });
  walk(id);
  return out;
}

function commentCounts() {
  const m = new Map();
  doc.comments.forEach(c => {
    if (!c.resolved) m.set(c.nodeId, (m.get(c.nodeId) || 0) + 1);
  });
  return m;
}

// ---------- history & persistence ----------
let hist = [];
let hi = -1;
let saveT = 0;
let changeCount = 0;

function serializeState() {
  return JSON.stringify({ nodes: doc.nodes, edges: doc.edges, stickies: doc.stickies, comments: doc.comments });
}

function snapshot() {
  hist = hist.slice(0, hi + 1);
  hist.push(serializeState());
  if (hist.length > 100) hist.shift();
  hi = hist.length - 1;
  updateUndo();
  save();
  changeCount++;
  if (settings.autoVersion > 0 && changeCount >= settings.autoVersion) {
    changeCount = 0;
    saveVersion('Auto');
  }
}

function restore(i) {
  const s = JSON.parse(hist[i]);
  doc.nodes = s.nodes;
  doc.edges = s.edges;
  doc.stickies = s.stickies || [];
  doc.comments = s.comments || [];
  hi = i;
  sel.clear();
  selEdge = null;
  selSticky = null;
  render();
  updateUndo();
  save();
}

function undo() {
  if (hi > 0) restore(hi - 1);
}

function redo() {
  if (hi < hist.length - 1) restore(hi + 1);
}

function updateUndo() {
  $('#undoBtn').disabled = hi <= 0;
  $('#redoBtn').disabled = hi >= hist.length - 1;
}

function setSaveStatus(label, color) {
  $('#stSave').innerHTML = `<i class="dotok" style="background:${color}"></i>${label}`;
}

function save() {
  doc.updatedAt = Date.now();
  doc.view = view;
  clearTimeout(saveT);
  setSaveStatus('Saving…', 'var(--warn)');
  saveT = setTimeout(flushSave, 250);
}

function flushSave() {
  saveT = 0;
  const ok = store.set('doc:' + doc.id, doc);
  const idx = store.get('docs', []);
  if (!idx.includes(doc.id)) {
    idx.unshift(doc.id);
    store.set('docs', idx);
  }
  store.set('cur', doc.id);
  if (!ok) {
    setSaveStatus('Storage full', 'var(--bad)');
    return;
  }
  setSaveStatus('Saved', 'var(--ok)');
}
// Write a debounced save immediately (before switching documents or leaving the page).
function flushPending() {
  if (!saveT || !doc) return;
  clearTimeout(saveT);
  flushSave();
}
window.addEventListener('pagehide', flushPending);

// TODO(student): real-time collaboration — broadcast snapshot diffs over WebSocket/WebRTC and merge with a CRDT (Yjs/Automerge) instead of localStorage only.

function resetScene() {
  gNodes.innerHTML = '';
  gEdges.innerHTML = '';
  gStickies.innerHTML = '';
  nodeEls.clear();
  edgeEls.clear();
  stickyEls.clear();
}

function activateDoc() {
  clearTimeout(fitTimer);
  stopViewAnim();
  view = doc.view || { x: 0, y: 0, z: 1 };
  sel.clear();
  selEdge = null;
  selSticky = null;
  hist = [];
  hi = -1;
  changeCount = 0;
  resetScene();
  snapshot();
  $('#docName').value = doc.name;
  setMode(doc.mode, false);
  render();
  fit();
  renderSide();
}

function loadDoc(id) {
  flushPending();
  const d = store.get('doc:' + id, null);
  if (!d) return false;
  doc = normalizeDoc(d);
  activateDoc();
  return true;
}
// TODO(student): cloud documents — sync `doc` to an account (Supabase/Firebase), add version history in the cloud and read-only share links.

function openNew(name, mode, build) {
  flushPending();
  doc = newDoc(name, mode);
  if (build) build(doc);
  doc.view = { x: 0, y: 0, z: 1 };
  activateDoc();
}

// ---------- geometry ----------
function toWorld(sx, sy) {
  const r = $('#wrap').getBoundingClientRect();
  return { x: (sx - r.left - view.x) / view.z, y: (sy - r.top - view.y) / view.z };
}

const toScreen = (wx, wy) => ({ x: wx * view.z + view.x, y: wy * view.z + view.y });
const center = n => ({ x: n.x + n.w / 2, y: n.y + n.h / 2 });

// Point on the node's bounding box in the direction of `toward`.
function anchor(n, toward) {
  const c = center(n);
  const dx = toward.x - c.x;
  const dy = toward.y - c.y;
  if (!dx && !dy) return c;
  const sx = n.w / 2 / Math.abs(dx || 1e-9);
  const sy = n.h / 2 / Math.abs(dy || 1e-9);
  const s = Math.min(sx, sy);
  return { x: c.x + dx * s, y: c.y + dy * s };
}

// In flowcharts the elbow follows the layout direction whenever the boxes do not overlap.
function orthoPath(a, b, ca, cb) {
  let horiz = Math.abs(cb.x - ca.x) > Math.abs(cb.y - ca.y);
  if (doc.mode === 'flow') {
    const vGap = b.y >= a.y + a.h || a.y >= b.y + b.h;
    const hGap = b.x >= a.x + a.w || a.x >= b.x + b.w;
    if (settings.flowDir === 'LR' && hGap) horiz = true;
    else if (settings.flowDir !== 'LR' && vGap) horiz = false;
  }
  if (horiz) {
    const x1 = ca.x < cb.x ? a.x + a.w : a.x;
    const x2 = ca.x < cb.x ? b.x : b.x + b.w;
    const mx = (x1 + x2) / 2;
    return `M${x1} ${ca.y}L${mx} ${ca.y}L${mx} ${cb.y}L${x2} ${cb.y}`;
  }
  const y1 = ca.y < cb.y ? a.y + a.h : a.y;
  const y2 = ca.y < cb.y ? b.y : b.y + b.h;
  const my = (y1 + y2) / 2;
  return `M${ca.x} ${y1}L${ca.x} ${my}L${cb.x} ${my}L${cb.x} ${y2}`;
}

// A lane is the free channel the layered layout reserved for an edge that skips layers.
// It stays valid only while both end nodes keep the box they had at layout time.
const laneKey = (a, b) => `${a.x},${a.y},${a.w},${a.h}|${b.x},${b.y},${b.w},${b.h}`;

// Leave/enter boxes on the lane's side so the edge does not share the centre port.
function lanePort(n, at, horizontal) {
  if (n.shape === 'diamond' || n.shape === 'circle') return horizontal ? n.y + n.h / 2 : n.x + n.w / 2;
  return horizontal ? clamp(at, n.y + n.h * 0.25, n.y + n.h * 0.75) : clamp(at, n.x + n.w * 0.25, n.x + n.w * 0.75);
}

function lanePath(a, b, lane) {
  if (lane.dir === 'LR') {
    const fwd = b.x > a.x;
    const sx = fwd ? a.x + a.w : a.x;
    const ex = fwd ? b.x : b.x + b.w;
    const g = Math.min(28, Math.abs(ex - sx) / 4) * (fwd ? 1 : -1);
    const sy = lanePort(a, lane.at, true);
    const ey = lanePort(b, lane.at, true);
    return `M${sx} ${sy}L${sx + g} ${sy}L${sx + g} ${lane.at}L${ex - g} ${lane.at}L${ex - g} ${ey}L${ex} ${ey}`;
  }
  const down = b.y > a.y;
  const sy = down ? a.y + a.h : a.y;
  const ey = down ? b.y : b.y + b.h;
  const g = Math.min(28, Math.abs(ey - sy) / 4) * (down ? 1 : -1);
  const sx = lanePort(a, lane.at, false);
  const ex = lanePort(b, lane.at, false);
  return `M${sx} ${sy}L${sx} ${sy + g}L${lane.at} ${sy + g}L${lane.at} ${ey - g}L${ex} ${ey - g}L${ex} ${ey}`;
}

// Midpoint of one of our own path strings (M/L polylines or a single cubic C).
function pathMid(d) {
  const v = (d.match(/-?\d*\.?\d+(?:e-?\d+)?/g) || []).map(Number);
  if (d.includes('C')) {
    return { x: (v[0] + 3 * v[2] + 3 * v[4] + v[6]) / 8, y: (v[1] + 3 * v[3] + 3 * v[5] + v[7]) / 8 };
  }
  const pts = [];
  for (let i = 0; i + 1 < v.length; i += 2) pts.push({ x: v[i], y: v[i + 1] });
  const segs = pts.slice(1).map((p, i) => Math.hypot(p.x - pts[i].x, p.y - pts[i].y));
  let left = segs.reduce((a, s) => a + s, 0) / 2;
  for (let i = 0; i < segs.length; i++) {
    if (left <= segs[i] && segs[i] > 0) {
      const t = left / segs[i];
      return { x: pts[i].x + (pts[i + 1].x - pts[i].x) * t, y: pts[i].y + (pts[i + 1].y - pts[i].y) * t };
    }
    left -= segs[i];
  }
  return pts[0] || { x: 0, y: 0 };
}

function edgePath(e) {
  const a = N(e.from);
  const b = N(e.to);
  if (!a || !b) return '';
  const ca = center(a);
  const cb = center(b);
  const p = anchor(a, cb);
  const q = anchor(b, ca);
  if (e.type === 'straight') return `M${p.x} ${p.y}L${q.x} ${q.y}`;
  if (e.type === 'ortho') {
    const useLane = doc.mode === 'flow' && e.lane && e.lane.key === laneKey(a, b);
    return useLane ? lanePath(a, b, e.lane) : orthoPath(a, b, ca, cb);
  }
  const dx = Math.abs(q.x - p.x) * 0.5 + 20;
  const c1x = p.x + (q.x > p.x ? dx : -dx);
  const c2x = q.x + (q.x > p.x ? -dx : dx);
  return `M${p.x} ${p.y}C${c1x} ${p.y} ${c2x} ${q.y} ${q.x} ${q.y}`;
}
// TODO(student): port-aware orthogonal routing — route around other nodes (A* on a grid) and keep edges out of each other's way.

function shapePath(n) {
  const { w, h } = n;
  switch (n.shape) {
    case 'diamond':
      return `<polygon class="shape" points="${w / 2},0 ${w},${h / 2} ${w / 2},${h} 0,${h / 2}"/>`;
    case 'pill':
      return `<rect class="shape" width="${w}" height="${h}" rx="${h / 2}"/>`;
    case 'round':
      return `<rect class="shape" width="${w}" height="${h}" rx="14"/>`;
    case 'circle':
      return `<ellipse class="shape" cx="${w / 2}" cy="${h / 2}" rx="${w / 2}" ry="${h / 2}"/>`;
    case 'para':
      return `<polygon class="shape" points="${h * 0.3},0 ${w},0 ${w - h * 0.3},${h} 0,${h}"/>`;
    case 'doc':
      return `<path class="shape" d="M0 0H${w}V${h - 10}Q${w * 0.75} ${h - 22} ${w / 2} ${h - 10}T0 ${h - 10}Z"/>`;
    case 'db':
      return `<path class="shape" d="M0 10a${w / 2} 10 0 0 1 ${w} 0v${h - 20}a${w / 2} 10 0 0 1 -${w} 0z"/><path class="shape" d="M0 10a${w / 2} 10 0 0 0 ${w} 0" fill="none"/>`;
    case 'note':
      return `<path class="shape" d="M0 0H${w - 14}L${w} 14V${h}H0Z"/><path d="M${w - 14} 0v14h14" fill="none" stroke-opacity=".5"/>`;
    default:
      return `<rect class="shape" width="${w}" height="${h}" rx="4"/>`;
  }
}

// Greedy word wrap sized by an average glyph width; max 6 lines.
function wrapText(text, w, fs, maxLines = 6) {
  const words = String(text).split(/\s+/);
  const lines = [];
  const maxC = Math.max(4, Math.floor((w - 20) / (fs * 0.55)));
  let cur = '';
  words.forEach(wd => {
    if ((cur + ' ' + wd).trim().length > maxC && cur) {
      lines.push(cur);
      cur = wd;
    } else {
      cur = (cur + ' ' + wd).trim();
    }
  });
  if (cur) lines.push(cur);
  return lines.slice(0, maxLines);
}

function bounds(items) {
  const xs = items.map(n => n.x);
  const ys = items.map(n => n.y);
  const xe = items.map(n => n.x + n.w);
  const ye = items.map(n => n.y + n.h);
  const x = Math.min(...xs);
  const y = Math.min(...ys);
  return { x, y, w: Math.max(...xe) - x, h: Math.max(...ye) - y };
}

// ---------- render (keyed patching so CSS transitions animate layout) ----------
const gNodes = $('#nodes');
const gEdges = $('#edges');
const gStickies = $('#stickies');
const gOv = $('#overlay');
const nodeEls = new Map();
const edgeEls = new Map();
const stickyEls = new Map();
let findIds = new Set();

function render() {
  const hidden = hiddenIds();
  const kids = childMap();
  $('#world').setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.z})`);
  renderNodes(hidden, kids);
  renderEdges(hidden);
  renderStickies();
  renderStatus();
  renderInspector();
  renderMinimap();
  if (side.open) renderSideSoon();
  else updateBadge();
}

// Cheap frame update used while panning or animating the view.
function applyView() {
  $('#world').setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.z})`);
  $('#zoomV').textContent = Math.round(view.z * 100) + '%';
  renderMinimap();
}

function renderStatus() {
  const extra = doc.stickies.length ? ` · ${doc.stickies.length} notes` : '';
  $('#stNodes').textContent = `${doc.nodes.length} nodes · ${doc.edges.length} edges${extra}`;
  $('#stSel').textContent = sel.size ? `${sel.size} selected` : selEdge ? 'edge selected' : selSticky ? 'note selected' : '';
  $('#stMode').textContent = doc.mode === 'mind' ? 'Mind map' : `Flowchart · ${settings.flowDir}`;
  $('#zoomV').textContent = Math.round(view.z * 100) + '%';
}

function renderNodes(hidden, kids) {
  const keep = new Set();
  const cCount = commentCounts();
  doc.nodes.forEach(n => {
    if (hidden.has(n.id)) return;
    keep.add(n.id);
    let g = nodeEls.get(n.id);
    if (!g) {
      g = document.createElementNS(SVGNS, 'g');
      g.setAttribute('class', 'node');
      g.dataset.id = n.id;
      g.style.transition = 'transform .35s var(--ease)';
      gNodes.append(g);
      nodeEls.set(n.id, g);
    }
    g.setAttribute('transform', `translate(${n.x},${n.y})`);
    g.classList.toggle('sel', sel.has(n.id));
    g.classList.toggle('hit', findIds.has(n.id));
    g.classList.toggle('dim', present.active && !present.focus.has(n.id));
    const kc = (kids.get(n.id) || []).length;
    const cc = cCount.get(n.id) || 0;
    // Only rebuild the inner markup when something visible changed.
    const sig = [n.text, n.w, n.h, n.shape, n.color, n.fs, n.url, n.icon, (n.image || '').length, n.collapsed, kc, cc, doc.mode, n.parent ? 1 : 0].join('|');
    if (g.dataset.sig !== sig) {
      g.dataset.sig = sig;
      g.innerHTML = nodeMarkup(n, kc, cc);
    }
  });
  nodeEls.forEach((g, id) => {
    if (keep.has(id)) return;
    g.remove();
    nodeEls.delete(id);
  });
}

function nodeMarkup(n, kidCount, commentCount) {
  const iconPad = n.icon ? 26 : 0;
  const capH = n.image ? Math.min(44, Math.round(n.h * 0.3)) : 0;
  const lines = wrapText(n.text, n.w - iconPad, n.fs, n.image ? 2 : 6);
  const lh = n.fs * 1.25;
  const cx = n.w / 2 + iconPad / 2;
  const cy = n.image ? n.h - capH / 2 : n.h / 2;
  const y0 = cy - ((lines.length - 1) * lh) / 2;
  const fill = `class="shape" fill="${n.color}" stroke="${DARK(n.color)}" stroke-width="1.5"`;
  let out = shapePath(n).replace(/class="shape"/g, fill);
  if (n.image) {
    out += `<image href="${n.image}" x="6" y="6" width="${n.w - 12}" height="${Math.max(10, n.h - capH - 10)}" preserveAspectRatio="xMidYMid meet"/>`;
  }
  if (n.icon) {
    out += `<use href="#i-${esc(n.icon)}" class="nicon" x="10" y="${cy - 9}" width="18" height="18"/>`;
  }
  const spans = lines.map((l, i) => `<tspan x="${cx}" dy="${i ? lh : 0}">${esc(l)}</tspan>`).join('');
  out += `<text x="${cx}" y="${y0}" text-anchor="middle" dominant-baseline="middle" font-size="${n.fs}" font-weight="${n.parent ? 500 : 600}" fill="#0f172a">${spans}</text>`;
  if (n.url) out += urlBadge(n);
  if (commentCount) out += commentBadge(n, commentCount);
  out += doc.mode === 'flow' ? portsMarkup(n) : collapseMarkup(n, kidCount);
  out += `<rect class="handle" x="${n.w - 6}" y="${n.h - 6}" width="10" height="10" rx="2"/>`;
  return out;
}

function urlBadge(n) {
  return `<a href="${esc(n.url)}" target="_blank" rel="noopener"><circle cx="${n.w - 10}" cy="10" r="7" fill="#2563eb"/><use href="#i-external" class="nicon" x="${n.w - 14.5}" y="5.5" width="9" height="9" style="stroke:#fff"/></a>`;
}

function commentBadge(n, count) {
  return `<g class="cbadge" data-cmt="${n.id}"><circle cx="${n.w - 2}" cy="-2" r="9" fill="#fb7a2e" stroke="#fff" stroke-width="1.5"/><text x="${n.w - 2}" y="-1" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">${count}</text></g>`;
}

function portsMarkup(n) {
  return `<circle class="port" data-side="t" cx="${n.w / 2}" cy="0" r="5"/><circle class="port" data-side="r" cx="${n.w}" cy="${n.h / 2}" r="5"/><circle class="port" data-side="b" cx="${n.w / 2}" cy="${n.h}" r="5"/><circle class="port" data-side="l" cx="0" cy="${n.h / 2}" r="5"/>`;
}

function collapseMarkup(n, kidCount) {
  if (!kidCount) return '';
  const cx = n.w + 12;
  const cy = n.h / 2;
  const fill = n.collapsed ? '#fb7a2e' : '#fff';
  const inner = n.collapsed
    ? `<text x="${cx}" y="${cy + 1}" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#0f172a" style="pointer-events:none">${kidCount}</text>`
    : `<path d="M${cx - 4} ${cy}h8" stroke="#0f172a" stroke-width="1.5" style="pointer-events:none"/>`;
  return `<g class="collapse" data-col="${n.id}"><circle cx="${cx}" cy="${cy}" r="8" fill="${fill}" stroke="#64748b"/>${inner}</g>`;
}

function renderEdges(hidden) {
  const keep = new Set();
  doc.edges.forEach(e => {
    const a = N(e.from);
    const b = N(e.to);
    if (!a || !b || hidden.has(e.from) || hidden.has(e.to)) return;
    keep.add(e.id);
    let g = edgeEls.get(e.id);
    if (!g) {
      g = document.createElementNS(SVGNS, 'g');
      g.setAttribute('class', 'edge');
      g.dataset.id = e.id;
      gEdges.append(g);
      edgeEls.set(e.id, g);
    }
    const isSel = selEdge === e.id;
    g.classList.toggle('sel', isSel);
    g.classList.toggle('hit', findIds.has(e.id));
    g.classList.toggle('dim', present.active && !(present.focus.has(e.from) && present.focus.has(e.to)));
    const sig = [e.label, e.arrow, e.dash, isSel].join('|');
    if (g.dataset.sig !== sig) {
      g.dataset.sig = sig;
      g.innerHTML = edgeMarkup(e);
    }
    setEdgeGeometry(g, e);
  });
  edgeEls.forEach((g, id) => {
    if (keep.has(id)) return;
    g.remove();
    edgeEls.delete(id);
  });
}

function edgeMarkup(e) {
  const mk = selEdge === e.id ? 'arrow-sel' : 'arrow';
  const end = e.arrow === 'end' || e.arrow === 'both' ? `marker-end="url(#${mk})"` : '';
  const start = e.arrow === 'both' ? `marker-start="url(#${mk})"` : '';
  const dash = e.dash ? 'stroke-dasharray="7 5"' : '';
  const label = e.label ? `<text text-anchor="middle">${esc(e.label)}</text>` : '';
  return `<path class="hit" d=""/><path class="line" d="" ${dash} ${end} ${start}/>${label}`;
}

// Geometry is applied separately so a move only touches two attributes.
function setEdgeGeometry(g, e) {
  const d = edgePath(e);
  const line = g.querySelector('.line');
  if (line.getAttribute('d') === d) return;
  line.setAttribute('d', d);
  g.querySelector('.hit').setAttribute('d', d);
  const t = g.querySelector('text');
  if (!t) return;
  // computed from the path string: the DOM length would lag behind the d transition
  const p = pathMid(d);
  t.setAttribute('x', p.x);
  t.setAttribute('y', p.y - 6);
}

function renderStickies() {
  const keep = new Set();
  doc.stickies.forEach(s => {
    keep.add(s.id);
    let g = stickyEls.get(s.id);
    if (!g) {
      g = document.createElementNS(SVGNS, 'g');
      g.setAttribute('class', 'sticky');
      g.dataset.sid = s.id;
      g.style.transition = 'transform .35s var(--ease)';
      gStickies.append(g);
      stickyEls.set(s.id, g);
    }
    g.setAttribute('transform', `translate(${s.x},${s.y})`);
    g.classList.toggle('sel', selSticky === s.id);
    g.classList.toggle('dim', present.active);
    const sig = [s.text, s.w, s.h, s.color].join('|');
    if (g.dataset.sig !== sig) {
      g.dataset.sig = sig;
      g.innerHTML = stickyMarkup(s);
    }
  });
  stickyEls.forEach((g, id) => {
    if (keep.has(id)) return;
    g.remove();
    stickyEls.delete(id);
  });
}

function stickyMarkup(s) {
  const fs = 13;
  const lh = fs * 1.35;
  const lines = wrapText(s.text, s.w, fs, Math.floor((s.h - 20) / lh));
  const spans = lines.map((l, i) => `<tspan x="12" dy="${i ? lh : 0}">${esc(l)}</tspan>`).join('');
  return `<rect class="paper" width="${s.w}" height="${s.h}" rx="4" fill="${s.color}" stroke="${DARK(s.color)}" stroke-opacity=".5" style="filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))"/><path d="M${s.w - 18} ${s.h}L${s.w} ${s.h - 18}V${s.h}Z" fill="rgba(0,0,0,.08)"/><text x="12" y="${12 + fs}" font-size="${fs}">${spans}</text><rect class="shandle" x="${s.w - 6}" y="${s.h - 6}" width="10" height="10" rx="2"/>`;
}

function renderMinimap() {
  const mm = $('#mm');
  if (!doc.nodes.length) {
    mm.innerHTML = '';
    return;
  }
  const bb = bounds(doc.nodes.concat(doc.stickies));
  const pad = 60;
  const r = $('#wrap').getBoundingClientRect();
  const vx = -view.x / view.z;
  const vy = -view.y / view.z;
  const vw = r.width / view.z;
  const vh = r.height / view.z;
  mm.setAttribute('viewBox', `${bb.x - pad} ${bb.y - pad} ${bb.w + pad * 2} ${bb.h + pad * 2}`);
  const notes = doc.stickies.map(s => `<rect x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}" fill="${s.color}" opacity=".8"/>`).join('');
  const rects = notes + doc.nodes.map(n => `<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="6" fill="${n.color}" stroke="${DARK(n.color)}"/>`).join('');
  const port = `<rect x="${vx}" y="${vy}" width="${vw}" height="${vh}" fill="rgba(37,99,235,.08)" stroke="#2563eb" stroke-width="${Math.max(2, (bb.w + pad * 2) / 160)}"/>`;
  mm.innerHTML = rects + port;
}

function fit() {
  stopViewAnim();
  const r = $('#wrap').getBoundingClientRect();
  const items = doc.nodes.concat(doc.stickies);
  if (!items.length) {
    view = { x: r.width / 2, y: r.height / 2, z: 1 };
    render();
    return;
  }
  const bb = bounds(items);
  const pad = 80;
  const z = clamp(Math.min((r.width - pad) / bb.w, (r.height - pad) / bb.h), 0.15, 2.5);
  view = { z, x: (r.width - bb.w * z) / 2 - bb.x * z, y: (r.height - bb.h * z) / 2 - bb.y * z };
  render();
}

function zoomAt(f, sx, sy) {
  stopViewAnim();
  const r = $('#wrap').getBoundingClientRect();
  const px = sx == null ? r.width / 2 : sx - r.left;
  const py = sy == null ? r.height / 2 : sy - r.top;
  const nz = clamp(view.z * f, 0.1, 4);
  view.x = px - (px - view.x) * (nz / view.z);
  view.y = py - (py - view.y) * (nz / view.z);
  view.z = nz;
  render();
  save();
}

// Tween the view to a target with ease-in-out; used by presentation and navigation.
let viewAnim = 0;

// Any direct view change (fit, zoom, pan, opening a document) wins over a running tween.
function stopViewAnim() {
  cancelAnimationFrame(viewAnim);
  viewAnim = 0;
}
function animateView(target, dur = 600, done) {
  cancelAnimationFrame(viewAnim);
  if (!settings.animations || matchMedia('(prefers-reduced-motion: reduce)').matches) dur = 0;
  const from = { ...view };
  const t0 = performance.now();
  const step = now => {
    const p = dur ? Math.min(1, (now - t0) / dur) : 1;
    const e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    view = {
      x: from.x + (target.x - from.x) * e,
      y: from.y + (target.y - from.y) * e,
      z: from.z + (target.z - from.z) * e,
    };
    applyView();
    if (p < 1) {
      viewAnim = requestAnimationFrame(step);
      return;
    }
    render();
    save();
    if (done) done();
  };
  viewAnim = requestAnimationFrame(step);
}

// View that frames a set of items with padding, clamped to sane zoom levels.
function viewFor(items, pad = 120, maxZ = 1.6) {
  const r = $('#wrap').getBoundingClientRect();
  const bb = bounds(items);
  const z = clamp(Math.min((r.width - pad) / bb.w, (r.height - pad) / bb.h), 0.15, maxZ);
  return { z, x: (r.width - bb.w * z) / 2 - bb.x * z, y: (r.height - bb.h * z) / 2 - bb.y * z };
}

function centerOn(n, animate = false) {
  const r = $('#wrap').getBoundingClientRect();
  const target = { z: view.z, x: r.width / 2 - (n.x + n.w / 2) * view.z, y: r.height / 2 - (n.y + n.h / 2) * view.z };
  if (animate) {
    animateView(target, 300);
    return;
  }
  view = target;
  render();
}

function ensureVisible(n) {
  const r = $('#wrap').getBoundingClientRect();
  const a = toScreen(n.x, n.y);
  const b = toScreen(n.x + n.w, n.y + n.h);
  const m = 40;
  if (a.x < m || a.y < m || b.x > r.width - m || b.y > r.height - m) centerOn(n, true);
}

// ---------- layout: mind-map tree ----------
const GAPX = 70;
const GAPY = 16;

const heightCache = new Map();
let fitTimer = 0;

// Height of a subtree (collapsed nodes count as leaves); memoised per layout run.
function subtreeHeight(n, map) {
  if (heightCache.has(n.id)) return heightCache.get(n.id);
  const kids = n.collapsed ? [] : map.get(n.id) || [];
  let h = n.h;
  if (kids.length) {
    const total = kids.reduce((a, c) => a + subtreeHeight(c, map), 0);
    h = Math.max(n.h, total + GAPY * (kids.length - 1));
  }
  heightCache.set(n.id, h);
  return h;
}

// Place a node and its descendants; dir = 1 grows to the right, -1 to the left.
function placeSubtree(n, x, yTop, dir, map) {
  const hgt = subtreeHeight(n, map);
  n.x = Math.round(dir > 0 ? x : x - n.w);
  n.y = Math.round(yTop + (hgt - n.h) / 2);
  if (n.collapsed) return;
  let cy = yTop;
  (map.get(n.id) || []).forEach(c => {
    const nx = dir > 0 ? n.x + n.w + GAPX : n.x - GAPX;
    placeSubtree(c, nx, cy, dir, map);
    cy += subtreeHeight(c, map) + GAPY;
  });
}

// Classic mind map: first half of a root's branches on the right, rest mirrored on the left.
function placeBalanced(root, yTop, map) {
  const kids = root.collapsed ? [] : map.get(root.id) || [];
  const half = Math.ceil(kids.length / 2);
  const right = kids.slice(0, half);
  const left = kids.slice(half);
  const sideHeight = list => list.reduce((a, c) => a + subtreeHeight(c, map), 0) + GAPY * Math.max(0, list.length - 1);
  const total = Math.max(root.h, sideHeight(right), sideHeight(left));
  root.x = 0;
  root.y = Math.round(yTop + (total - root.h) / 2);
  const placeSide = (list, dir) => {
    let cy = yTop + (total - sideHeight(list)) / 2;
    list.forEach(c => {
      const x = dir > 0 ? root.x + root.w + GAPX : root.x - GAPX;
      placeSubtree(c, x, cy, dir, map);
      cy += subtreeHeight(c, map) + GAPY;
    });
  };
  placeSide(right, 1);
  placeSide(left, -1);
  return total;
}

function treeLayout() {
  heightCache.clear();
  const map = childMap();
  let yCursor = 0;
  roots().forEach(r => {
    if (settings.mindStyle === 'both') {
      yCursor += placeBalanced(r, yCursor, map) + 60;
      return;
    }
    placeSubtree(r, 0, yCursor, 1, map);
    yCursor += subtreeHeight(r, map) + 60;
  });
}

// ---------- layout: layered (Sugiyama-style) for flowcharts ----------
// 1. make the graph acyclic by reversing back edges found with a DFS
function acyclicEdges() {
  const ids = new Set(doc.nodes.map(n => n.id));
  const out = new Map(doc.nodes.map(n => [n.id, []]));
  const list = [];
  doc.edges.forEach(e => {
    if (!ids.has(e.from) || !ids.has(e.to) || e.from === e.to) return;
    const rec = { from: e.from, to: e.to, ref: e };
    list.push(rec);
    out.get(e.from).push(rec);
  });
  const state = new Map();
  const visit = id => {
    state.set(id, 1);
    out.get(id).forEach(rec => {
      const st = state.get(rec.to) || 0;
      if (st === 1) {
        // back edge: flip it for layering purposes only
        const t = rec.to;
        rec.to = rec.from;
        rec.from = t;
      } else if (st === 0) {
        visit(rec.to);
      }
    });
    state.set(id, 2);
  };
  doc.nodes.forEach(n => {
    if (!state.get(n.id)) visit(n.id);
  });
  return list;
}

// 2. longest-path layering
function assignLayers(edges) {
  const layer = new Map(doc.nodes.map(n => [n.id, 0]));
  const indeg = new Map(doc.nodes.map(n => [n.id, 0]));
  edges.forEach(e => indeg.set(e.to, indeg.get(e.to) + 1));
  const queue = doc.nodes.filter(n => !indeg.get(n.id)).map(n => n.id);
  while (queue.length) {
    const id = queue.shift();
    edges.forEach(e => {
      if (e.from !== id) return;
      layer.set(e.to, Math.max(layer.get(e.to), layer.get(id) + 1));
      indeg.set(e.to, indeg.get(e.to) - 1);
      if (indeg.get(e.to) === 0) queue.push(e.to);
    });
  }
  return layer;
}

// 3. split edges that skip layers into chains of small dummy items
function buildLayerGraph(edges, layer) {
  const horizontal = settings.flowDir === 'LR';
  const items = new Map(doc.nodes.map(n => [n.id, { id: n.id, w: n.w, h: n.h, node: n, key: horizontal ? n.y : n.x }]));
  const segs = [];
  const chains = [];
  edges.forEach((e, k) => {
    const span = layer.get(e.to) - layer.get(e.from);
    if (span <= 1) {
      segs.push({ from: e.from, to: e.to });
      return;
    }
    const a = items.get(e.from);
    const b = items.get(e.to);
    const chain = { ref: e.ref, ids: [] };
    let prev = e.from;
    for (let s = 1; s < span; s++) {
      const id = `~${k}.${s}`;
      const key = a.key + ((b.key - a.key) * s) / span;
      items.set(id, { id, w: 24, h: 24, dummy: true, key });
      layer.set(id, layer.get(e.from) + s);
      segs.push({ from: prev, to: id });
      chain.ids.push(id);
      prev = id;
    }
    segs.push({ from: prev, to: e.to });
    chains.push(chain);
  });
  return { items, segs, chains };
}

function groupLayers(layer, items) {
  const byL = new Map();
  items.forEach(it => {
    const l = layer.get(it.id) || 0;
    if (!byL.has(l)) byL.set(l, []);
    byL.get(l).push(it);
  });
  const layers = [...byL.keys()].sort((a, b) => a - b).map(l => byL.get(l));
  // start from the current drawing order so repeated layouts are stable
  layers.forEach(ns => ns.sort((a, b) => a.key - b.key));
  return layers;
}

// 4. crossing reduction: barycenter sweeps, keeping the best ordering seen
function countCrossings(layers, edges) {
  const pos = new Map();
  const layerOf = new Map();
  layers.forEach((ns, l) => ns.forEach((n, i) => {
    pos.set(n.id, i);
    layerOf.set(n.id, l);
  }));
  let total = 0;
  for (let l = 0; l < layers.length - 1; l++) {
    const pairs = edges
      .filter(e => layerOf.get(e.from) === l && layerOf.get(e.to) === l + 1)
      .map(e => [pos.get(e.from), pos.get(e.to)]);
    for (let i = 0; i < pairs.length; i++) {
      for (let j = i + 1; j < pairs.length; j++) {
        if ((pairs[i][0] - pairs[j][0]) * (pairs[i][1] - pairs[j][1]) < 0) total++;
      }
    }
  }
  return total;
}

function barycenterSort(target, reference, edges, downward) {
  const refPos = new Map(reference.map((n, i) => [n.id, i]));
  const bary = new Map();
  target.forEach((n, i) => {
    const neighbours = edges
      .filter(e => (downward ? e.to === n.id : e.from === n.id))
      .map(e => refPos.get(downward ? e.from : e.to))
      .filter(p => p != null);
    const avg = neighbours.length ? neighbours.reduce((a, b) => a + b, 0) / neighbours.length : i;
    bary.set(n.id, avg);
  });
  target.sort((a, b) => bary.get(a.id) - bary.get(b.id));
}

function orderLayers(layers, edges) {
  let best = layers.map(ns => ns.slice());
  let bestCross = countCrossings(layers, edges);
  for (let sweep = 0; sweep < 8 && bestCross > 0; sweep++) {
    for (let l = 1; l < layers.length; l++) barycenterSort(layers[l], layers[l - 1], edges, true);
    for (let l = layers.length - 2; l >= 0; l--) barycenterSort(layers[l], layers[l + 1], edges, false);
    const c = countCrossings(layers, edges);
    if (c < bestCross) {
      bestCross = c;
      best = layers.map(ns => ns.slice());
    }
  }
  best.forEach((ns, i) => (layers[i] = ns));
  return bestCross;
}

// 5. coordinates: pack each layer, then alternate downward/upward passes that pull
//    every item toward the mean centre of its neighbours in the previous/next layer
function assignCoordinates(layers, edges, items) {
  const horizontal = settings.flowDir === 'LR';
  const gap = settings.nodeGap;
  const size = it => (horizontal ? it.h : it.w);
  const preds = new Map();
  const succs = new Map();
  const push = (m, k, v) => (m.has(k) ? m.get(k).push(v) : m.set(k, [v]));
  edges.forEach(e => {
    push(succs, e.from, e.to);
    push(preds, e.to, e.from);
  });
  const pos = new Map();
  layers.forEach(ns => {
    const total = ns.reduce((a, n) => a + size(n), 0) + gap * (ns.length - 1);
    let c = -total / 2;
    ns.forEach(n => {
      pos.set(n.id, c);
      c += size(n) + gap;
    });
  });
  for (let pass = 0; pass < 7; pass++) {
    const down = pass % 2 === 0;
    const order = down ? layers : layers.slice().reverse();
    order.forEach(ns => {
      const desired = ns.map(n => {
        const nb = (down ? preds : succs).get(n.id) || [];
        if (!nb.length) return pos.get(n.id);
        const mean = nb.reduce((a, id) => a + pos.get(id) + size(items.get(id)) / 2, 0) / nb.length;
        return mean - size(n) / 2;
      });
      let minC = -Infinity;
      ns.forEach((n, i) => {
        const c = Math.max(minC, desired[i]);
        pos.set(n.id, c);
        minC = c + size(n) + gap;
      });
    });
  }
  return pos;
}

// 6. write positions back; long edges remember the lane their dummies reserved
function applyCoordinates(layers, pos, chains) {
  const horizontal = settings.flowDir === 'LR';
  const centre = new Map();
  let depth = 0;
  layers.forEach(ns => {
    const real = ns.filter(n => !n.dummy);
    const thick = Math.max(56, ...real.map(n => (horizontal ? n.w : n.h)));
    ns.forEach(it => {
      centre.set(it.id, pos.get(it.id) + (horizontal ? it.h : it.w) / 2);
      if (it.dummy) return;
      const n = it.node;
      n.x = Math.round(horizontal ? depth + (thick - n.w) / 2 : pos.get(it.id));
      n.y = Math.round(horizontal ? pos.get(it.id) : depth + (thick - n.h) / 2);
    });
    depth += thick + settings.layerGap - 56;
  });
  doc.edges.forEach(e => delete e.lane);
  chains.forEach(ch => {
    const lane = ch.ids.reduce((a, id) => a + centre.get(id), 0) / ch.ids.length;
    const a = N(ch.ref.from);
    const b = N(ch.ref.to);
    ch.ref.lane = { at: Math.round(lane), key: laneKey(a, b), dir: horizontal ? 'LR' : 'TB' };
  });
}

function layeredLayout() {
  if (!doc.nodes.length) return { layers: 0, crossings: 0 };
  const edges = acyclicEdges();
  const layer = assignLayers(edges);
  const { items, segs, chains } = buildLayerGraph(edges, layer);
  const layers = groupLayers(layer, items);
  const crossings = orderLayers(layers, segs);
  const pos = assignCoordinates(layers, segs, items);
  applyCoordinates(layers, pos, chains);
  return { layers: layers.length, crossings, dummies: chains.reduce((a, c) => a + c.ids.length, 0) };
}

// Crossings of the current drawing (used by tests and the layout announcement).
function currentCrossings() {
  const edges = acyclicEdges();
  const layer = assignLayers(edges);
  const { items, segs } = buildLayerGraph(edges, layer);
  return countCrossings(groupLayers(layer, items), segs);
}

function autoLayout() {
  if (doc.mode === 'mind') {
    treeLayout();
  } else {
    const r = layeredLayout();
    if (r.layers > 1) announce(`${r.layers} layers, ${r.crossings} crossings`);
  }
  snapshot();
  render();
  // fit once the node transitions have settled
  clearTimeout(fitTimer);
  fitTimer = setTimeout(fit, 380);
}

// ---------- interactions ----------
const wrap = $('#wrap');
let drag = null; // {type:'move'|'marquee'|'pan'|'resize'|'resize-sticky'|'connect', ...}
let spaceDown = false;

const HINTS = {
  select: () => `${ic('cursor')} Drag to move · double-click to edit · <kbd>Tab</kbd> child · <kbd>Enter</kbd> sibling`,
  node: () => `${ic('plus')} Click on the canvas to add a node`,
  connect: () => `${ic('link')} Drag from one node to another to connect`,
  sticky: () => `${ic('sticky-note')} Click on the canvas to drop a sticky note`,
  pan: () => `${ic('hand')} Drag to pan · scroll to zoom`,
};

function setTool(tl) {
  tool = tl;
  $$('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === tl));
  const cls = { pan: 'pan', node: 'addnode', connect: 'connect', sticky: 'sticky' }[tl] || '';
  wrap.className = 'canvaswrap' + (cls ? ' ' + cls : '');
  $('#hint').innerHTML = HINTS[tl] ? HINTS[tl]() : '';
}
$$('[data-tool]').forEach(b => (b.onclick = () => setTool(b.dataset.tool)));

function nodeAt(x, y) {
  const hidden = hiddenIds();
  for (let i = doc.nodes.length - 1; i >= 0; i--) {
    const n = doc.nodes[i];
    if (hidden.has(n.id)) continue;
    if (x >= n.x && x <= n.x + n.w && y >= n.y && y <= n.y + n.h) return n;
  }
  return null;
}

function clearSelection() {
  sel.clear();
  selEdge = null;
  selSticky = null;
}

// -- pointer down: decide which gesture starts --
wrap.addEventListener('pointerdown', onPointerDown);
function onPointerDown(e) {
  if (e.target.closest('.float,.minimap,.hint,.findbar,.present-bar,.welcome,.editor')) return;
  if (present.active || e.button === 2) return;
  try {
    wrap.setPointerCapture(e.pointerId);
  } catch {
    /* older browsers */
  }
  closePop();
  const w = toWorld(e.clientX, e.clientY);
  const gNode = e.target.closest('g.node');
  const gEdge = e.target.closest('g.edge');
  const gSticky = e.target.closest('g.sticky');
  const col = e.target.closest('.collapse');
  if (col) {
    toggleCollapse(col.dataset.col);
    return;
  }
  if (e.button === 1 || tool === 'pan' || spaceDown) {
    stopViewAnim();
    drag = { type: 'pan', sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y };
    wrap.classList.add('panning');
    return;
  }
  if (tool === 'node') {
    addNodeAt(w, true);
    return;
  }
  if (tool === 'sticky') {
    addStickyAt(w, true);
    return;
  }
  if (gNode) {
    pressNode(N(gNode.dataset.id), e, w);
    return;
  }
  if (gSticky) {
    pressSticky(S(gSticky.dataset.sid), e, w);
    return;
  }
  if (gEdge) {
    selEdge = gEdge.dataset.id;
    sel.clear();
    selSticky = null;
    render();
    return;
  }
  if (!e.shiftKey) clearSelection();
  drag = { type: 'marquee', sx: w.x, sy: w.y, x: w.x, y: w.y };
  render();
}

function pressNode(n, e, w) {
  if (e.target.classList.contains('handle')) {
    drag = { type: 'resize', n, sx: w.x, sy: w.y, w: n.w, h: n.h };
    wrap.classList.add('dragging');
    return;
  }
  if (tool === 'connect' || e.target.classList.contains('port')) {
    drag = { type: 'connect', from: n, x: w.x, y: w.y };
    return;
  }
  if (e.shiftKey) {
    if (sel.has(n.id)) sel.delete(n.id);
    else sel.add(n.id);
  } else if (!sel.has(n.id)) {
    sel = new Set([n.id]);
  }
  selEdge = null;
  selSticky = null;
  beginMove(w);
  render();
}

function pressSticky(s, e, w) {
  selSticky = s.id;
  sel.clear();
  selEdge = null;
  if (e.target.classList.contains('shandle')) {
    drag = { type: 'resize-sticky', s, sx: w.x, sy: w.y, w: s.w, h: s.h };
    wrap.classList.add('dragging');
    render();
    return;
  }
  beginMove(w);
  render();
}

function beginMove(w) {
  const start = [...sel].map(id => ({ id, kind: 'node', x: N(id).x, y: N(id).y }));
  if (selSticky) start.push({ id: selSticky, kind: 'sticky', x: S(selSticky).x, y: S(selSticky).y });
  drag = { type: 'move', sx: w.x, sy: w.y, start, moved: false };
  wrap.classList.add('dragging');
}

// -- pointer move: update the active gesture --
wrap.addEventListener('pointermove', onPointerMove);
function onPointerMove(e) {
  const w = toWorld(e.clientX, e.clientY);
  $('#stPos').textContent = `${Math.round(w.x)}, ${Math.round(w.y)}`;
  if (!drag) return;
  const handlers = {
    pan: movePan,
    move: moveSelection,
    resize: moveResize,
    'resize-sticky': moveResizeSticky,
    marquee: moveMarquee,
    connect: moveConnect,
  };
  handlers[drag.type](e, w);
}

function movePan(e) {
  view.x = drag.vx + (e.clientX - drag.sx);
  view.y = drag.vy + (e.clientY - drag.sy);
  applyView();
}

const snapV = v => (settings.snap ? Math.round(v / settings.grid) * settings.grid : Math.round(v));

function moveSelection(e, w) {
  const dx = w.x - drag.sx;
  const dy = w.y - drag.sy;
  if (Math.abs(dx) + Math.abs(dy) > 2) drag.moved = true;
  drag.start.forEach(s => {
    const item = s.kind === 'node' ? N(s.id) : S(s.id);
    item.x = snapV(s.x + dx);
    item.y = snapV(s.y + dy);
    const g = s.kind === 'node' ? nodeEls.get(s.id) : stickyEls.get(s.id);
    if (!g) return;
    g.setAttribute('transform', `translate(${item.x},${item.y})`);
  });
  doc.edges.forEach(ed => {
    if (!sel.has(ed.from) && !sel.has(ed.to)) return;
    const g = edgeEls.get(ed.id);
    if (g) setEdgeGeometry(g, ed);
  });
}

function moveResize(e, w) {
  drag.n.w = Math.max(60, Math.round(drag.w + (w.x - drag.sx)));
  drag.n.h = Math.max(36, Math.round(drag.h + (w.y - drag.sy)));
  render();
}

function moveResizeSticky(e, w) {
  drag.s.w = Math.max(90, Math.round(drag.w + (w.x - drag.sx)));
  drag.s.h = Math.max(60, Math.round(drag.h + (w.y - drag.sy)));
  render();
}

function moveMarquee(e, w) {
  drag.x = w.x;
  drag.y = w.y;
  const x = Math.min(drag.sx, drag.x);
  const y = Math.min(drag.sy, drag.y);
  const ww = Math.abs(drag.x - drag.sx);
  const hh = Math.abs(drag.y - drag.sy);
  gOv.innerHTML = `<rect class="marquee" x="${x}" y="${y}" width="${ww}" height="${hh}"/>`;
}

function moveConnect(e, w) {
  const c = center(drag.from);
  gOv.innerHTML = `<path class="temp-edge" d="M${c.x} ${c.y}L${w.x} ${w.y}"/>`;
}

// -- pointer up: commit the gesture --
wrap.addEventListener('pointerup', onPointerUp);
wrap.addEventListener('pointercancel', onPointerUp);
function onPointerUp(e) {
  if (!drag) return;
  const w = toWorld(e.clientX, e.clientY);
  const d = drag;
  drag = null;
  wrap.classList.remove('panning', 'dragging');
  gOv.innerHTML = '';
  if (d.type === 'pan') {
    render();
    save();
    return;
  }
  if (d.type === 'move') {
    if (d.moved) snapshot();
    render();
    return;
  }
  if (d.type === 'resize' || d.type === 'resize-sticky') {
    snapshot();
    return;
  }
  if (d.type === 'marquee') {
    endMarquee(d);
    return;
  }
  if (d.type === 'connect') endConnect(d, w);
}

function endMarquee(d) {
  const x = Math.min(d.sx, d.x);
  const y = Math.min(d.sy, d.y);
  const x2 = Math.max(d.sx, d.x);
  const y2 = Math.max(d.sy, d.y);
  if (x2 - x > 4) {
    const hidden = hiddenIds();
    doc.nodes.forEach(n => {
      if (hidden.has(n.id)) return;
      if (n.x < x2 && n.x + n.w > x && n.y < y2 && n.y + n.h > y) sel.add(n.id);
    });
  }
  render();
}

function endConnect(d, w) {
  const target = nodeAt(w.x, w.y);
  if (target && target.id !== d.from.id) {
    const exists = doc.edges.some(ed => ed.from === d.from.id && ed.to === target.id);
    if (!exists) {
      const ed = mkEdge(d.from.id, target.id);
      doc.edges.push(ed);
      if (doc.mode === 'mind' && !target.parent) target.parent = d.from.id;
      selEdge = ed.id;
      sel.clear();
      snapshot();
    }
  } else if (!target && tool === 'connect') {
    // drag into empty space: create a connected child right there
    const n = mkNode(w.x - 75, w.y - 28, doc.mode === 'mind' ? 'New idea' : 'Step', {
      parent: doc.mode === 'mind' ? d.from.id : null,
      color: d.from.color,
    });
    doc.nodes.push(n);
    doc.edges.push(mkEdge(d.from.id, n.id));
    sel = new Set([n.id]);
    snapshot();
    startEdit(n);
  }
  render();
}

// Pointer capture retargets click/dblclick to #wrap, so resolve the real element under the pointer.
function hitTarget(e) {
  return document.elementFromPoint(e.clientX, e.clientY) || e.target;
}

// -- double-click: edit text, label a connector or add a node --
wrap.addEventListener('dblclick', e => {
  if (present.active) return;
  const hit = hitTarget(e);
  if (hit.closest('.float,.minimap,.findbar,.welcome,.editor')) return;
  const g = hit.closest('g.node');
  if (g) {
    startEdit(N(g.dataset.id));
    return;
  }
  const gs = hit.closest('g.sticky');
  if (gs) {
    startEdit(S(gs.dataset.sid), 'sticky');
    return;
  }
  const ge = hit.closest('g.edge');
  if (ge) {
    const ed = E(ge.dataset.id);
    const l = prompt('Edge label', ed.label || '');
    if (l != null) {
      ed.label = l.trim();
      snapshot();
      render();
    }
    return;
  }
  if (tool === 'select') addNodeAt(toWorld(e.clientX, e.clientY), true);
});

wrap.addEventListener('wheel', e => {
  e.preventDefault();
  if (present.active) return;
  zoomAt(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.clientX, e.clientY);
}, { passive: false });

// -- touch pinch zoom --
let pinch = null;
const touchDist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
wrap.addEventListener('touchstart', e => {
  if (e.touches.length === 2) pinch = { d: touchDist(e.touches), z: view.z };
}, { passive: true });
wrap.addEventListener('touchmove', e => {
  if (!pinch || e.touches.length !== 2) return;
  const d = touchDist(e.touches);
  const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
  const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
  zoomAt(((pinch.z * d) / pinch.d) / view.z, cx, cy);
}, { passive: true });
wrap.addEventListener('touchend', () => (pinch = null));
// TODO(student): touch gestures — two-finger pan, long-press context menu and haptic feedback on connect.

// -- drag & drop files: images become image nodes, .json/.mmd import documents --
wrap.addEventListener('dragover', e => {
  e.preventDefault();
  wrap.classList.add('dropping');
});
wrap.addEventListener('dragleave', () => wrap.classList.remove('dropping'));
wrap.addEventListener('drop', e => {
  e.preventDefault();
  wrap.classList.remove('dropping');
  const w = toWorld(e.clientX, e.clientY);
  [...e.dataTransfer.files].forEach((f, i) => {
    if (f.type.startsWith('image/')) {
      addImageNode(f, { x: w.x + i * 30, y: w.y + i * 30 });
    } else if (/\.json$/i.test(f.name)) {
      readFileText(f, txt => importJsonText(txt));
    } else if (/\.(mmd|mermaid|txt|md)$/i.test(f.name)) {
      readFileText(f, txt => importMermaid(txt));
    }
  });
});

function readFileText(f, cb) {
  const r = new FileReader();
  r.onload = ev => cb(String(ev.target.result));
  r.readAsText(f);
}

// ---------- node operations ----------
function addNodeAt(w, edit = false) {
  const n = mkNode(w.x - 75, w.y - 28, doc.mode === 'mind' ? 'New idea' : 'Step');
  doc.nodes.push(n);
  sel = new Set([n.id]);
  selEdge = null;
  selSticky = null;
  snapshot();
  render();
  if (tool !== 'select') setTool('select');
  if (edit) startEdit(n);
  return n;
}

function addChild(p, edit = true) {
  const kids = children(p.id);
  const n = mkNode(p.x + p.w + 70, p.y + kids.length * 70, 'New idea', {
    parent: p.id,
    color: p.parent ? p.color : COLORS[kids.length % COLORS.length],
  });
  p.collapsed = false;
  doc.nodes.push(n);
  doc.edges.push(mkEdge(p.id, n.id));
  sel = new Set([n.id]);
  selEdge = null;
  snapshot();
  if (doc.mode === 'mind') autoLayout();
  else render();
  if (edit) startEdit(n);
  return n;
}

function addSibling(s, edit = true) {
  const n = mkNode(s.x, s.y + s.h + 20, 'New idea', { parent: s.parent, color: s.color });
  doc.nodes.push(n);
  if (s.parent) doc.edges.push(mkEdge(s.parent, n.id));
  sel = new Set([n.id]);
  selEdge = null;
  snapshot();
  if (doc.mode === 'mind') autoLayout();
  else render();
  if (edit) startEdit(n);
  return n;
}

function toggleCollapse(id) {
  const n = N(id);
  if (!n) return;
  n.collapsed = !n.collapsed;
  snapshot();
  render();
}

function deleteNodes(ids) {
  const set = new Set(ids);
  doc.nodes.forEach(n => {
    if (set.has(n.parent)) n.parent = null;
  });
  doc.nodes = doc.nodes.filter(n => !set.has(n.id));
  doc.edges = doc.edges.filter(e => !set.has(e.from) && !set.has(e.to));
  doc.comments = doc.comments.filter(c => !set.has(c.nodeId));
  ids.forEach(id => sel.delete(id));
}

function deleteSel() {
  if (selEdge) {
    doc.edges = doc.edges.filter(e => e.id !== selEdge);
    selEdge = null;
  }
  if (selSticky) {
    doc.stickies = doc.stickies.filter(s => s.id !== selSticky);
    selSticky = null;
  }
  if (sel.size) {
    const count = sel.size;
    deleteNodes([...sel]);
    log(`Deleted ${count} node${count > 1 ? 's' : ''}`, 'trash');
  }
  snapshot();
  render();
}

function duplicate() {
  if (!sel.size) return;
  const map = {};
  const copies = [...sel].map(id => {
    const n = N(id);
    const c = { ...n, id: uid(), x: n.x + 30, y: n.y + 30 };
    map[id] = c.id;
    return c;
  });
  copies.forEach(c => {
    if (map[c.parent]) c.parent = map[c.parent];
  });
  doc.nodes.push(...copies);
  doc.edges
    .filter(e => map[e.from] && map[e.to])
    .forEach(e => doc.edges.push({ ...e, id: uid(), from: map[e.from], to: map[e.to] }));
  sel = new Set(copies.map(c => c.id));
  snapshot();
  render();
}

function copySel() {
  if (!sel.size) return;
  clipboard = {
    nodes: [...sel].map(id => ({ ...N(id) })),
    edges: doc.edges.filter(e => sel.has(e.from) && sel.has(e.to)).map(e => ({ ...e })),
  };
  toast(`Copied ${sel.size}`, 'copy');
}

function pasteSel() {
  if (!clipboard) return;
  const map = {};
  const ns = clipboard.nodes.map(n => {
    const c = { ...n, id: uid(), x: n.x + 40, y: n.y + 40 };
    map[n.id] = c.id;
    return c;
  });
  ns.forEach(c => (c.parent = map[c.parent] || null));
  doc.nodes.push(...ns);
  clipboard.edges.forEach(e => doc.edges.push({ ...e, id: uid(), from: map[e.from], to: map[e.to] }));
  sel = new Set(ns.map(n => n.id));
  snapshot();
  render();
}

function alignSelected() {
  if (sel.size < 2) {
    toast('Select 2+ nodes', 'info');
    return;
  }
  const ns = [...sel].map(N);
  const y = Math.round(ns.reduce((a, n) => a + n.y, 0) / ns.length);
  ns.sort((a, b) => a.x - b.x);
  let x = ns[0].x;
  ns.forEach(n => {
    n.y = y;
    n.x = x;
    x += n.w + settings.nodeGap;
  });
  snapshot();
  render();
}

// ---------- inline editor ----------
let editing = null;

function startEdit(target, kind = 'node') {
  if (!target) return;
  endEdit();
  const ta = document.createElement('textarea');
  ta.className = 'editor' + (kind === 'sticky' ? ' left' : '');
  ta.value = target.text;
  const s = toScreen(target.x, target.y);
  const fs = kind === 'sticky' ? 13 : target.fs;
  Object.assign(ta.style, {
    left: s.x + 'px',
    top: s.y + 'px',
    width: target.w * view.z + 'px',
    height: target.h * view.z + 'px',
    fontSize: fs * view.z + 'px',
  });
  wrap.append(ta);
  ta.focus();
  ta.select();
  editing = { target, ta };
  ta.addEventListener('blur', endEdit);
  ta.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && !ev.shiftKey) {
      ev.preventDefault();
      endEdit();
    }
    if (ev.key === 'Escape') {
      ta.value = target.text;
      endEdit();
    }
    ev.stopPropagation();
  });
}

function endEdit() {
  if (!editing) return;
  const { target, ta } = editing;
  editing = null;
  const v = ta.value.trim();
  ta.remove();
  if (v && v !== target.text) {
    target.text = v;
    snapshot();
  }
  render();
}

// ---------- keyboard ----------
document.addEventListener('keydown', onKeyDown);
document.addEventListener('keyup', e => {
  if (e.code !== 'Space') return;
  spaceDown = false;
  if (tool !== 'pan') wrap.classList.remove('pan');
});

function onKeyDown(e) {
  if (tourState.active && e.key === 'Escape') {
    endTour();
    return;
  }
  if (present.active) {
    presentKeys(e);
    return;
  }
  if (tourState.active || $('#scrim').classList.contains('on')) return;
  if (e.target.matches('input,textarea,select')) return;
  const k = e.key.toLowerCase();
  const mod = e.ctrlKey || e.metaKey;
  // structural keys only act on the canvas so Tab/Enter/Space still work on buttons
  const onCanvas = e.target === document.body || wrap.contains(e.target);
  if (!onCanvas && !mod && /^(tab|enter|delete|backspace|home|\[|\]| |arrow\w+)$/.test(k)) return;
  if (e.code === 'Space') {
    spaceDown = true;
    wrap.classList.add('pan');
    e.preventDefault();
    return;
  }
  if (mod) {
    modKeys(e, k);
    return;
  }
  if (e.altKey && k.startsWith('arrow')) {
    e.preventDefault();
    navigate(k.replace('arrow', ''));
    return;
  }
  if (k.startsWith('arrow') && sel.size) {
    e.preventDefault();
    nudge(k, e.shiftKey ? 24 : 4);
    return;
  }
  if (structureKeys(e, k)) return;
  toolKeys(e, k);
}

function modKeys(e, k) {
  const actions = {
    z: () => (e.shiftKey ? redo() : undo()),
    y: redo,
    a: () => {
      sel = new Set(doc.nodes.map(n => n.id));
      render();
    },
    d: duplicate,
    c: copySel,
    v: pasteSel,
    s: () => {
      save();
      toast('Saved');
    },
    f: () => openFind(),
    h: () => openFind(),
    k: () => openFind(),
  };
  if (!actions[k]) return;
  if (k !== 'c' && k !== 'v') e.preventDefault();
  actions[k]();
}

// Tab/Enter/Delete/F2 and selection stepping with [ and ]
function structureKeys(e, k) {
  if (k === 'delete' || k === 'backspace') {
    e.preventDefault();
    deleteSel();
    return true;
  }
  if (k === 'tab' && sel.size === 1) {
    e.preventDefault();
    addChild(N([...sel][0]));
    return true;
  }
  if (k === 'enter' && sel.size === 1) {
    e.preventDefault();
    addSibling(N([...sel][0]));
    return true;
  }
  if (k === 'f2' && sel.size === 1) {
    startEdit(N([...sel][0]));
    return true;
  }
  if (k === '[' || k === ']') {
    stepSelection(k === ']' ? 1 : -1);
    return true;
  }
  if (k === 'home') {
    const r = roots()[0] || doc.nodes[0];
    if (r) selectNode(r.id, true);
    return true;
  }
  if (k === 'escape') {
    if (find.open) closeFind();
    clearSelection();
    setTool('select');
    render();
    return true;
  }
  return false;
}

function toolKeys(e, k) {
  if (e.shiftKey && k === 'c' && sel.size === 1) {
    openCommentBox(N([...sel][0]));
    return;
  }
  const map = {
    v: () => setTool('select'),
    n: () => setTool('node'),
    c: () => setTool('connect'),
    s: () => setTool('sticky'),
    h: () => setTool('pan'),
    i: () => $('#imgFile').click(),
    f: fit,
    l: autoLayout,
    o: () => toggleSide(),
    p: () => startPresent(),
    '/': () => {
      e.preventDefault();
      $('#q').focus();
    },
    '+': () => zoomAt(1.2),
    '=': () => zoomAt(1.2),
    '-': () => zoomAt(1 / 1.2),
    '?': () => openHelp(),
  };
  if (map[k]) map[k]();
}

function nudge(k, d) {
  sel.forEach(id => {
    const n = N(id);
    if (k === 'arrowup') n.y -= d;
    if (k === 'arrowdown') n.y += d;
    if (k === 'arrowleft') n.x -= d;
    if (k === 'arrowright') n.x += d;
  });
  snapshot();
  render();
}

// ---------- keyboard-only node navigation (Alt + arrows, [ ], Home) ----------
function selectNode(id, reveal = false) {
  const n = N(id);
  if (!n) return;
  sel = new Set([id]);
  selEdge = null;
  selSticky = null;
  render();
  if (reveal) ensureVisible(n);
  announce(describeNode(n));
}

function describeNode(n) {
  const kids = children(n.id).length;
  const parent = n.parent && N(n.parent) ? `child of ${N(n.parent).text}` : 'root';
  return `${n.text}. ${parent}. ${kids} ${kids === 1 ? 'child' : 'children'}.`;
}

function navigate(dir) {
  const cur = sel.size === 1 ? N([...sel][0]) : null;
  if (!cur) {
    const first = roots()[0] || doc.nodes[0];
    if (first) selectNode(first.id, true);
    return;
  }
  let target = doc.mode === 'mind' ? treeNeighbor(cur, dir) : null;
  if (!target) target = spatialNeighbor(cur, dir);
  if (target) selectNode(target.id, true);
  else announce('No node in that direction');
}

// Mind maps: left = parent, right = first child, up/down = siblings.
function treeNeighbor(n, dir) {
  const kids = children(n.id);
  if (dir === 'right') {
    if (n.collapsed && kids.length) {
      n.collapsed = false;
      snapshot();
    }
    return kids[0] || null;
  }
  if (dir === 'left') return n.parent ? N(n.parent) : null;
  const sibs = n.parent ? children(n.parent) : roots();
  const i = sibs.findIndex(s => s.id === n.id);
  return dir === 'up' ? sibs[i - 1] || null : sibs[i + 1] || null;
}

// Flowcharts and free layouts: nearest visible node in that direction.
function spatialNeighbor(n, dir) {
  const hidden = hiddenIds();
  const c = center(n);
  const vec = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[dir];
  if (!vec) return null;
  let best = null;
  let bestScore = Infinity;
  doc.nodes.forEach(o => {
    if (o.id === n.id || hidden.has(o.id)) return;
    const oc = center(o);
    const dx = oc.x - c.x;
    const dy = oc.y - c.y;
    const along = dx * vec[0] + dy * vec[1];
    if (along <= 0) return;
    const across = Math.abs(dx * vec[1]) + Math.abs(dy * vec[0]);
    const score = along + across * 2.5;
    if (score < bestScore) {
      bestScore = score;
      best = o;
    }
  });
  return best;
}

function stepSelection(dir) {
  const hidden = hiddenIds();
  const order = doc.nodes.filter(n => !hidden.has(n.id));
  if (!order.length) return;
  const curId = sel.size === 1 ? [...sel][0] : null;
  const i = order.findIndex(n => n.id === curId);
  const next = order[(i + dir + order.length) % order.length];
  selectNode(next.id, true);
}

}

const PALETTE_SIZES = { diamond: [160, 90], circle: [100, 100] };

function renderPalette() {
  const items = doc.mode === 'flow' ? ['pill', 'rect', 'diamond', 'para', 'doc', 'db', 'circle', 'note'] : ['round', 'circle', 'note', 'rect'];
  $('#palette').innerHTML = items

function addShapeFromPalette(sh) {
  const r = wrap.getBoundingClientRect();
  const w = toWorld(r.left + r.width / 2 + (Math.random() - 0.5) * 120, r.top + r.height / 2 + (Math.random() - 0.5) * 80);
  const [pw, ph] = PALETTE_SIZES[sh] || [150, 56];
  const n = mkNode(w.x - pw / 2, w.y - ph / 2, SHAPES[sh], { shape: sh, w: pw, h: ph });
  doc.nodes.push(n);
  sel = new Set([n.id]);
  selEdge = null;
  snapshot();
  render();
  startEdit(n);
}

function shapeIcon(s) {
  const d = {

    diamond: '<polygon points="13,3 24,12 13,21 2,12"/>',
    para: '<polygon points="6,5 24,5 20,19 2,19"/>',
    doc: '<path d="M2 4h22v13q-5-5-11 0t-11 0z"/>',
    db: '<path d="M3 7a10 3 0 0 1 20 0v10a10 3 0 0 1-20 0z"/><path d="M3 7a10 3 0 0 0 20 0"/>',
    circle: '<circle cx="13" cy="12" r="9"/>',
    note: '<path d="M3 3h14l6 6v12H3z"/><path d="M17 3v6h6"/>',

// ---------- inspector ----------
function renderInspector() {
  const el = $('#inspector');
  if (selEdge) {
    const e = E(selEdge);
    if (!e) {
      selEdge = null;
      renderInspector();
      return;
    }
    edgePanel(el, e);
    return;
  }
  if (selSticky) {
    const s = S(selSticky);
    if (!s) {
      selSticky = null;
      renderInspector();
      return;
    }
    stickyPanel(el, s);
    return;
  }
  if (!sel.size) {
    documentPanel(el);
    return;
  }
  const ns = [...sel].map(N).filter(Boolean);
  if (!ns.length) {
    sel.clear();
    documentPanel(el);
    return;
  }
  nodePanel(el, ns);
}

// ---------- sticky notes ----------
function addStickyAt(w, edit = false) {
  const s = mkSticky(w.x - 85, w.y - 60, 'Sticky note', { color: STICKY_COLORS[doc.stickies.length % STICKY_COLORS.length] });
  doc.stickies.push(s);
  selSticky = s.id;
  sel.clear();
  selEdge = null;
  snapshot();
  render();
  setTool('select');
  log('Added a sticky note', 'sticky-note');
  if (edit) startEdit(s, 'sticky');
  return s;
}

function stickyToNode(s) {
  const n = mkNode(s.x, s.y, s.text, { shape: 'note', color: s.color, w: Math.max(150, s.w), h: Math.max(56, Math.min(s.h, 120)) });
  doc.nodes.push(n);
  doc.stickies = doc.stickies.filter(x => x.id !== s.id);
  selSticky = null;
  sel = new Set([n.id]);
  snapshot();
  render();
}

// ---------- comments ----------
function commentsFor(nodeId) {
  return doc.comments.filter(c => c.nodeId === nodeId).sort((a, b) => a.at - b.at);
}

function commentThread(n) {
  const list = commentsFor(n.id);
  const items = list
    .map(c => `<div class="cmt ${c.resolved ? 'resolved' : ''}" data-cid="${c.id}">
        <div class="who"><b>${esc(c.author)}</b><span>${ago(c.at)}</span></div>
        <div>${esc(c.text)}</div>
        <div class="acts"><button class="btn light sm" data-res="${c.id}">${ic(c.resolved ? 'refresh' : 'check')} ${c.resolved ? 'Reopen' : 'Resolve'}</button><button class="btn light sm" data-cdel="${c.id}" aria-label="delete comment">${ic('trash')}</button></div>
      </div>`)
    .join('');
  return `<h3 style="margin-top:6px">Comments (${list.filter(c => !c.resolved).length})</h3>
    <div id="cmtList">${items || '<p class="empty">No comments yet. Shift+C also opens this box.</p>'}</div>
    <div class="field"><label for="cmtText">Add a comment</label><textarea id="cmtText" placeholder="Write a note for a teammate or your supervisor…" style="min-height:52px"></textarea></div>
    <div class="row"><button class="btn sm" id="cmtAdd">${ic('message')} Comment</button></div>`;
}

function bindCommentThread(n) {
  const add = $('#cmtAdd');
  if (!add) return;
  add.onclick = () => {
    const t = $('#cmtText').value.trim();
    if (!t) return;

}

function addComment(nodeId, text) {
  const c = mkComment(nodeId, text);
  doc.comments.push(c);
  snapshot();
  render();
  log(`Commented on "${N(nodeId)?.text || 'node'}"`, 'message');
  return c;
}

function toggleComment(id) {
  const c = doc.comments.find(x => x.id === id);
  if (!c) return;
  c.resolved = !c.resolved;
  snapshot();
  render();
}

function deleteComment(id) {
  doc.comments = doc.comments.filter(x => x.id !== id);
  snapshot();
  render();
}

function openCommentBox(n) {
