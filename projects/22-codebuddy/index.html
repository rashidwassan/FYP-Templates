    if (s.pen) ops.push({ k: 'line', x1: s.x, y1: s.y, x2: nx, y2: ny, color: s.color, width: s.width, t: { x: nx, y: ny, h: s.h, visible: s.visible } });
    s.x = nx;
    s.y = ny;
    if (fillPts) fillPts.push([nx, ny]);
  };
  cmds.forEach(([c, ...a]) => {
    applyTurtleCmd(c, a, s, { go, ops, stats, snap, getFill: () => fillPts, setFill: v => (fillPts = v) });
    if (s.pen && ['fd', 'bk', 'circle', 'goto'].includes(c)) {
      stats.lines++;
      stats.colors.add(String(s.color).toLowerCase());
    }
    if (c === 'lt' || c === 'rt') stats.turn += Math.abs(Number(a[0]) || 0);
    ops.push({ k: 'pose', t: snap() });
    cmdToOp.push(ops.length);
  });
  return { ops, cmdToOp, stats: { lines: stats.lines, turn: stats.turn, colors: stats.colors.size } };
}

// One small handler per command code; s = turtle state, ctx = drawing helpers.
const TURTLE_OPS = {
  fd: (s, a, ctx) => ctx.go(Number(a[0]) || 0),
  bk: (s, a, ctx) => ctx.go(-(Number(a[0]) || 0)),
  lt: (s, a) => (s.h += Number(a[0]) || 0),
  rt: (s, a) => (s.h -= Number(a[0]) || 0),
  seth: (s, a) => (s.h = Number(a[0]) || 0),
  pu: s => (s.pen = false),
  pd: s => (s.pen = true),
  size: (s, a) => (s.width = Math.max(1, Number(a[0]) || 1)),
  hide: s => (s.visible = false),
  show: s => (s.visible = true),
  color: (s, a) => {
    s.color = turtleColor(a, s.color);
    if (a.length === 2) s.fill = String(a[1]);
    else if (a.length === 1) s.fill = s.color;
  },
  fill: (s, a) => (s.fill = turtleColor(a, s.fill)),
  bg: (s, a, ctx) => ctx.ops.push({ k: 'bg', color: String(a[0] || '') }),
  circle: (s, a, ctx) => turtleCircle(Number(a[0]) || 0, a[1] == null ? 360 : Number(a[1]), s, ctx),
  goto: (s, a, ctx) => turtleGoto(Number(a[0]) || 0, Number(a[1]) || 0, s, ctx),
  home: (s, a, ctx) => {
    turtleGoto(0, 0, s, ctx);
    s.h = 0;
  },
  dot: (s, a, ctx) => ctx.ops.push({ k: 'dot', x: s.x, y: s.y, size: Number(a[0]) || Math.max(s.width + 4, s.width * 2), color: a[1] ? String(a[1]) : s.color }),
  write: (s, a, ctx) => ctx.ops.push({ k: 'text', x: s.x, y: s.y, text: String(a[0] ?? ''), color: s.color }),
  bfill: (s, a, ctx) => ctx.setFill([[s.x, s.y]]),
  efill: (s, a, ctx) => {
    const pts = ctx.getFill();
    if (pts && pts.length > 2) ctx.ops.push({ k: 'fill', pts, color: s.fill });
    ctx.setFill(null);
  },
  clear: (s, a, ctx) => ctx.ops.push({ k: 'clear' }),
  reset: (s, a, ctx) => {
    ctx.ops.push({ k: 'clear' });
    Object.assign(s, { x: 0, y: 0, h: 0, pen: true, color: '#1d2b3a', width: 2 });
  },
};

function applyTurtleCmd(c, a, s, ctx) {
  if (TURTLE_OPS[c]) TURTLE_OPS[c](s, a, ctx);
}

// Same stepping as CPython's turtle.circle so shapes match full Python.
function turtleCircle(radius, extent, s, ctx) {
  const frac = Math.abs(extent) / 360;
  const steps = 1 + Math.floor(Math.min(11 + Math.abs(radius) / 6, 59) * frac);
  let w = extent / steps;
  let w2 = w / 2;
  let l = 2 * radius * Math.sin((w2 * Math.PI) / 180);
  if (radius < 0) {
    l = -l;
    w = -w;
    w2 = -w2;
  }
  s.h += w2;
  for (let i = 0; i < steps; i++) {
    ctx.go(l);
    s.h += w;
  }
  s.h -= w2;
}

function turtleGoto(x, y, s, ctx) {
  const dx = x - s.x;
  const dy = y - s.y;
  const keep = s.h;
  s.h = (Math.atan2(dy, dx) * 180) / Math.PI;
  ctx.go(Math.hypot(dx, dy));
  s.h = keep;
}

class TurtleCanvas {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.model = buildTurtleModel([]);
    this.shown = 0;
    this.speed = 'normal';
    this.grid = true;
    this.raf = 0;
  }

  palette() {
    const css = getComputedStyle(document.documentElement);
    return { bg: css.getPropertyValue('--ed-bg').trim() || '#fff', line: css.getPropertyValue('--line').trim() || '#ddd', ink: css.getPropertyValue('--ink').trim(), sky: css.getPropertyValue('--sky').trim(), mint: css.getPropertyValue('--mint').trim() };
  }

  fit() {
    const rect = this.canvas.getBoundingClientRect();
    const w = Math.max(200, Math.round(rect.width || 360));
    const dpr = window.devicePixelRatio || 1;
    if (this.canvas.width !== Math.round(w * dpr)) {
      this.canvas.width = Math.round(w * dpr);
      this.canvas.height = Math.round(w * dpr);
    }
    this.scale = (w * dpr) / TURTLE_WORLD;
  }

  toPx(x, y) {
    const half = this.canvas.width / 2;
    return [half + x * this.scale, half - y * this.scale];
  }

  load(cmds, animate = true) {
    cancelAnimationFrame(this.raf);
    this.model = buildTurtleModel(cmds);
    if (!animate || this.speed === 'instant' || matchMedia('(prefers-reduced-motion: reduce)').matches) {
      this.drawUpTo(this.model.ops.length);
      return;
    }
    this.play();
  }

  play() {
    cancelAnimationFrame(this.raf);
    const perFrame = { slow: 1, normal: 4, fast: 18 }[this.speed] || 4;
    let n = 0;
    const tick = () => {
      n = Math.min(this.model.ops.length, n + perFrame);
      this.drawUpTo(n);
      if (n < this.model.ops.length) this.raf = requestAnimationFrame(tick);
    };
    tick();
  }

  // Visualiser: show the drawing made by the first `count` commands.
  showCommands(cmds, count) {
    cancelAnimationFrame(this.raf);
    this.model = buildTurtleModel(cmds);
    this.drawUpTo(count ? this.model.cmdToOp[count - 1] : 0);
  }

  drawUpTo(n) {
    this.fit();
    const c = this.ctx;
    const pal = this.palette();
    this.shown = n;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = pal.bg;
    c.fillRect(0, 0, this.canvas.width, this.canvas.height);
    if (this.grid) this.drawGrid(pal);
    let pose = { x: 0, y: 0, h: 0, visible: true };
    for (let i = 0; i < n; i++) {
      const op = this.model.ops[i];
      if (op.k === 'clear' || op.k === 'bg') this.clearTo(op, pal);
      else this.drawOp(op);
      if (op.t) pose = op.t;
    }
    if (pose.visible) this.drawSprite(pose, pal);
  }

  clearTo(op, pal) {
    const c = this.ctx;
    c.fillStyle = pal.bg;
    if (op.k === 'bg') c.fillStyle = op.color || pal.bg;
    c.fillRect(0, 0, this.canvas.width, this.canvas.height);
    if (this.grid && op.k === 'clear') this.drawGrid(pal);
  }

  drawGrid(pal) {
    const c = this.ctx;
    c.strokeStyle = pal.line;
    c.lineWidth = 1;
    for (let v = -200; v <= 200; v += 25) {
      const [x] = this.toPx(v, 0);
      const [, y] = this.toPx(0, v);
      c.globalAlpha = v === 0 ? 1 : 0.55;
      c.beginPath();
      c.moveTo(x, 0);
      c.lineTo(x, this.canvas.height);
      c.moveTo(0, y);
      c.lineTo(this.canvas.width, y);
      c.stroke();
    }
    c.globalAlpha = 1;
  }

  drawOp(op) {
    const c = this.ctx;
    if (op.k === 'line') {
      const [a, b] = this.toPx(op.x1, op.y1);
      const [x, y] = this.toPx(op.x2, op.y2);
      c.strokeStyle = op.color;
      c.lineWidth = Math.max(2, op.width) * this.scale * 1.1;
      c.lineCap = 'round';
      c.beginPath();
      c.moveTo(a, b);
      c.lineTo(x, y);
      c.stroke();
    } else if (op.k === 'fill') {
      c.fillStyle = op.color;
      c.beginPath();
      op.pts.forEach(([px, py], i) => (i ? c.lineTo(...this.toPx(px, py)) : c.moveTo(...this.toPx(px, py))));
      c.closePath();
      c.fill();
    } else if (op.k === 'dot') {
      c.fillStyle = op.color;
      c.beginPath();
      c.arc(...this.toPx(op.x, op.y), (op.size / 2) * this.scale, 0, Math.PI * 2);
      c.fill();
    } else if (op.k === 'text') {
      c.fillStyle = op.color;
      c.font = `${14 * this.scale}px Lexend, sans-serif`;
      c.fillText(op.text, ...this.toPx(op.x, op.y));
    }
  }

  drawSprite(pose, pal) {
    const c = this.ctx;
    const [x, y] = this.toPx(pose.x, pose.y);
    const r = 9 * this.scale;
    c.save();
    c.translate(x, y);
    c.rotate((-pose.h * Math.PI) / 180);
    c.fillStyle = pal.mint;
    c.strokeStyle = pal.ink;
    c.lineWidth = 1.6 * this.scale;
    c.beginPath();
    c.ellipse(0, 0, r, r * 0.78, 0, 0, Math.PI * 2);
    c.fill();
    c.stroke();
    c.beginPath();
    c.arc(r * 1.25, 0, r * 0.38, 0, Math.PI * 2);
    c.fill();
    c.stroke();
    c.restore();
  }

  toPNG() {
    return this.canvas.toDataURL('image/png');
  }
}

// =====================================================================
// Runners: JavaScript in a sandboxed Web Worker, Python via Pyodide
// (lazy) or Buddy's mini interpreter, plus automatic goal checks
// =====================================================================
const PYODIDE_BASE = 'https://cdn.jsdelivr.net/npm/pyodide@0.29.5/';
const MAX_OUTPUT_LINES = 4000;

// The worker gets its own copies of the value formatter and seeded random.
function jsWorkerSource(inputs, seed) {
  // TODO(student): replace the pre-filled Answers box with live input() using SharedArrayBuffer + Atomics (needs cross-origin isolation headers).
  const turtleDefs = Object.entries(TURTLE_ALIASES).map(([n, c]) => `turtle[${JSON.stringify(n)}] = __mk(${JSON.stringify(n)}, ${JSON.stringify(c)});`).join('\n');
  const globals = TURTLE_JS_NAMES.map(n => `self[${JSON.stringify(n)}] = turtle[${JSON.stringify(n)}];`).join('\n');
  return `
['fetch', 'XMLHttpRequest', 'WebSocket', 'EventSource', 'indexedDB', 'caches', 'importScripts'].forEach(k => {
  try { Object.defineProperty(self, k, { value: undefined, configurable: false, writable: false }); } catch (e) {}
});
const __post = self.postMessage.bind(self);
const __fmt = ${fmtJsValue.toString()};
let __lines = 0;
const __out = (k, s) => {
  __lines++;
  if (__lines > ${MAX_OUTPUT_LINES}) {
    if (__lines === ${MAX_OUTPUT_LINES + 1}) __post({ type: 'trunc' });
    return;
  }
  __post({ type: 'out', k, s });
};
const __log = (...a) => __out('out', a.map(x => __fmt(x, true)).join(' ') + '\\n');
['log', 'info', 'warn', 'error', 'debug'].forEach(k => (console[k] = __log));
const __inputs = ${JSON.stringify(inputs)};
let __ii = 0;
let __asks = 0;
self.ask = q => {
  __asks++;
  const has = __ii < __inputs.length;
  const a = has ? __inputs[__ii++] : '';
  if (!has) __post({ type: 'missing' });
  const p = q == null ? '' : String(q);
  if (p) __out('out', /\\s$/.test(p) ? p : p + ' ');
  __out('in', a + '\\n');
  return a;
};
self.prompt = self.ask;
self.alert = m => __out('out', String(m) + '\\n');
${seed !== '' && seed != null ? `Math.random = (${mulberry32.toString()})(${Number(seed) || 0});` : ''}
const __t = [];
let __tn = 0;
const __flush = () => {
  if (__t.length) __post({ type: 'turtle', cmds: __t.splice(0) });
};
const __needsNum = new Set(['fd', 'bk', 'lt', 'rt', 'seth', 'size', 'circle']);
const __mk = (name, code) => function (...a) {
  if (__needsNum.has(code) && (typeof a[0] !== 'number' || Number.isNaN(a[0]))) throw new TypeError(name + '() needs a number, but got ' + typeof a[0]);
  if (++__tn > 20000) throw new RangeError('Too many turtle moves (over 20,000)');
  __t.push([code, ...a.map(v => (typeof v === 'number' ? v : String(v)))]);
  if (__t.length >= 400) __flush();
};
self.turtle = {};
${turtleDefs}
${globals}
self.onmessage = e => {
  let fn;
  try {
    fn = new Function(e.data.code);
  } catch (err) {
    __post({ type: 'error', name: err.name, message: err.message, stack: '', syntax: true });
    __post({ type: 'done', asks: 0 });
    return;
  }
  try {
    fn.call(self);
  } catch (err) {
    __flush();
    __post({ type: 'error', name: (err && err.name) || 'Error', message: (err && err.message) || String(err), stack: (err && err.stack) || '' });
  }
  __flush();
  __post({ type: 'done', asks: __asks });
};
`;
}

// new Function puts the body after two header lines: "<anonymous>:3" is line 1.
function jsErrorLine(stack, code) {
  const m = /<anonymous>:(\d+):\d+/.exec(stack || '');
  if (!m) return 0;
  const lines = code.split('\n').length;
  return clamp(Number(m[1]) - 2, 1, lines);
}

function runJsWorker(code, { inputs = [], seed = '', timeLimit = 3000, onOut } = {}) {
  return new Promise(resolve => {
    const t0 = performance.now();
    const res = { ok: true, error: null, out: [], turtle: [], asks: 0, inputMissing: false, engine: 'js', truncated: false };
    let worker;
    try {
      const url = URL.createObjectURL(new Blob([jsWorkerSource(inputs, seed)], { type: 'text/javascript' }));
      worker = new Worker(url);
      URL.revokeObjectURL(url);
    } catch (err) {
      resolve({ ...res, ok: false, error: { type: 'Error', message: 'Web Workers are not available in this browser', line: 0 } });
      return;
    }
    const finish = () => {
      clearTimeout(timer);
      worker.terminate();
      runtime.stop = null;
      res.ms = Math.round(performance.now() - t0);
      resolve(res);
    };
    const timer = setTimeout(() => {
      res.ok = false;
      res.error = { type: 'Timeout', message: `Program ran longer than ${timeLimit / 1000} seconds`, line: guessLoopLine(code, 'js') };
      finish();
    }, timeLimit);
    runtime.stop = () => {
      res.ok = false;
      res.error = { type: 'Stopped', message: 'Stopped by you', line: 0 };
      finish();
    };
    worker.onmessage = e => handleJsMessage(e.data, res, code, onOut, finish);
    worker.onerror = e => {
      e.preventDefault();
      res.ok = false;
      res.error = { type: 'Error', message: String(e.message || 'Error').replace(/^Uncaught\s+/, ''), line: 0 };
      finish();
    };
    worker.postMessage({ code });
  });
}

function handleJsMessage(m, res, code, onOut, finish) {
  if (m.type === 'out') {
    pushChunk(res.out, m.k, m.s);
    if (onOut) onOut(m.k, m.s);
  } else if (m.type === 'turtle') {
    res.turtle.push(...m.cmds);
  } else if (m.type === 'missing') {
    res.inputMissing = true;
  } else if (m.type === 'trunc') {
    res.truncated = true;
  } else if (m.type === 'error') {
    res.ok = false;
    let line = m.syntax ? 0 : jsErrorLine(m.stack, code);
    if (m.syntax) line = syntaxLineFromMini(code, 'js');
    res.error = { type: m.name, message: m.message, line };
  } else if (m.type === 'done') {
    res.asks = m.asks;
    finish();
  }
}

// V8 does not report a line for SyntaxErrors from new Function; the mini parser usually agrees on where.
function syntaxLineFromMini(code, lang) {
  try {
    parseProgram(code, lang);
  } catch (e) {
    if (e instanceof MiniError) return e.line;
  }
  return 0;
}

function pushChunk(out, k, s) {
  const last = out[out.length - 1];
  if (last && last.k === k) last.s += s;
  else out.push({ k, s });
}

// ---------- Pyodide (full Python), loaded only when asked ----------
const pyodideState = { status: 'idle', worker: null, version: '', error: '', pending: null };

function pyWorkerSource() {
  const aliases = JSON.stringify(TURTLE_ALIASES);
  return `
let pyodide = null;
let cmds = [];
let inputs = [];
let ii = 0;
let asks = 0;
const shim = ${JSON.stringify(PY_TURTLE_SHIM)}.replace('__ALIASES__', ${JSON.stringify(aliases)});
self.onmessage = async e => {
  const m = e.data;
  if (m.type === 'init') {
    try {
      importScripts(m.base + 'pyodide.js');
      pyodide = await loadPyodide({ indexURL: m.base });
      pyodide.registerJsModule('_cb_turtle', { push: (c, ...a) => cmds.push([c, ...a.map(x => (typeof x === 'number' ? x : String(x)))]) });
      await pyodide.runPythonAsync(shim);
      postMessage({ type: 'ready', version: pyodide.version });
    } catch (err) {
      postMessage({ type: 'fail', message: String((err && err.message) || err) });
    }
    return;
  }
  cmds = [];
  inputs = m.inputs;
  ii = 0;
  asks = 0;
  const dec = new TextDecoder();
  const write = buf => {
    postMessage({ type: 'out', k: 'out', s: dec.decode(buf) });
    return buf.length;
  };
  pyodide.setStdout({ write });
  pyodide.setStderr({ write });
  pyodide.setStdin({ stdin: () => {
    asks++;
    const has = ii < inputs.length;
    const a = has ? inputs[ii++] : '';
    if (!has) postMessage({ type: 'missing' });
    postMessage({ type: 'out', k: 'in', s: a + '\\n' });
    return a + '\\n';
  } });
  const ns = pyodide.globals.get('dict')();
  try {
    if (m.seed !== '' && m.seed != null) await pyodide.runPythonAsync('import random\\nrandom.seed(' + Number(m.seed) + ')', { globals: ns });
    await pyodide.runPythonAsync(m.code, { globals: ns });
  } catch (err) {
    const text = String((err && err.message) || err);
    const lines = [...text.matchAll(/File "<exec>", line (\\d+)/g)];
    const last = text.trim().split('\\n').pop();
    const mm = /^(\\w+(?:Error|Exception|Interrupt|Exit)?):?\\s*(.*)$/.exec(last) || [];
    postMessage({ type: 'error', name: mm[1] || 'Error', message: mm[2] || last, line: lines.length ? Number(lines[lines.length - 1][1]) : 0 });
  }
  ns.destroy();
  postMessage({ type: 'turtle', cmds });
  postMessage({ type: 'done', asks });
};
`;
}

// The same turtle names as JavaScript, bridged into a Python "turtle" module.
const PY_TURTLE_SHIM = `
import sys, types, json, _cb_turtle
_aliases = json.loads('__ALIASES__')
_m = types.ModuleType('turtle')
def _mk(code):
    def f(*args):
        _cb_turtle.push(code, *args)
    return f
for _n, _c in _aliases.items():
    setattr(_m, _n, _mk(_c))
class Turtle:
    pass
for _n, _c in _aliases.items():
    setattr(Turtle, _n, (lambda c: lambda self, *a: _cb_turtle.push(c, *a))(_c))
class _Screen:
    def bgcolor(self, *a):
        _cb_turtle.push('bg', *a)
    def __getattr__(self, name):
        return lambda *a, **k: None
_m.Turtle = Turtle
_m.Pen = Turtle
_m.Screen = lambda: _Screen()
_m.title = lambda *a, **k: None
_m.setup = lambda *a, **k: None
_m.tracer = lambda *a, **k: None
_m.__all__ = list(_aliases) + ['Turtle', 'Pen', 'Screen']
sys.modules['turtle'] = _m
`;

function loadPyodideEngine() {
  if (pyodideState.status === 'ready') return Promise.resolve(true);
  if (pyodideState.pending) return pyodideState.pending;
  if (!navigator.onLine) {
    pyodideState.status = 'failed';
    pyodideState.error = 'offline';
    return Promise.resolve(false);
  }
  pyodideState.status = 'loading';
  updateEngineChip();
  pyodideState.pending = new Promise(resolve => {
    const url = URL.createObjectURL(new Blob([pyWorkerSource()], { type: 'text/javascript' }));
    const w = new Worker(url);
    URL.revokeObjectURL(url);
    const fail = msg => {
      clearTimeout(timer);
      w.terminate();
      Object.assign(pyodideState, { status: 'failed', error: msg, worker: null, pending: null });
      updateEngineChip();
      resolve(false);
    };
    const timer = setTimeout(() => fail('timeout'), 90000);
    w.onerror = e => {
      e.preventDefault();
      fail(String(e.message || 'error'));
    };
    w.onmessage = e => {
      if (e.data.type === 'fail') fail(e.data.message);
      if (e.data.type !== 'ready') return;
      clearTimeout(timer);
      Object.assign(pyodideState, { status: 'ready', worker: w, version: e.data.version, pending: null, error: '' });
      updateEngineChip();
      resolve(true);
    };
    w.postMessage({ type: 'init', base: PYODIDE_BASE });
  });
  return pyodideState.pending;
}

function runPyodide(code, { inputs = [], seed = '', timeLimit = 3000, onOut } = {}) {
  return new Promise(resolve => {
    const t0 = performance.now();
    const w = pyodideState.worker;
    const res = { ok: true, error: null, out: [], turtle: [], asks: 0, inputMissing: false, engine: 'pyodide' };
    const finish = () => {
      clearTimeout(timer);
      w.onmessage = null;
      runtime.stop = null;
      res.ms = Math.round(performance.now() - t0);
      resolve(res);
    };
    const kill = (type, message, line) => {
      w.terminate();
      Object.assign(pyodideState, { status: 'idle', worker: null });
      updateEngineChip();
      res.ok = false;
      res.error = { type, message, line };
      finish();
    };
    const timer = setTimeout(() => kill('Timeout', `Program ran longer than ${timeLimit / 1000} seconds`, guessLoopLine(code, 'py')), timeLimit + 1500);
    runtime.stop = () => kill('Stopped', 'Stopped by you', 0);
    w.onmessage = e => {
      const m = e.data;
      if (m.type === 'out') {
        pushChunk(res.out, m.k, m.s);
        if (onOut) onOut(m.k, m.s);
      } else if (m.type === 'turtle') res.turtle = m.cmds;
      else if (m.type === 'missing') res.inputMissing = true;
      else if (m.type === 'error') {
        res.ok = false;
        res.error = { type: m.name, message: m.message, line: m.line };
      } else if (m.type === 'done') {
        res.asks = m.asks;
        finish();
      }
    };
    w.postMessage({ type: 'run', code, inputs, seed });
  });
}

// ---------- one entry point for the IDE, blocks page and tests ----------
const runtime = { busy: false, stop: null };

function pythonEngineChoice() {
  const pref = settings().pyEngine;
  if (pref === 'mini') return 'mini';
  if (pref === 'full') return 'full';
  return pyodideState.status === 'ready' ? 'full' : 'mini';
}

async function runProgram(code, lang, opts = {}) {
  const base = { inputs: opts.inputs || [], seed: opts.seed ?? '', timeLimit: opts.timeLimit || 3000, onOut: opts.onOut };
  if (lang === 'js') return runJsWorker(code, base);
  let notice = '';
  if (pythonEngineChoice() === 'full') {
    const ok = await loadPyodideEngine();
    if (ok) return runPyodide(code, base);
    notice = 'pyOffline';
  }
  const res = runMini(code, 'py', base);
  if (base.onOut) res.out.forEach(c => base.onOut(c.k, c.s));
  return { ...res, notice };
}

// ---------- goal checks ----------
const outputText = res => res.out.map(c => c.s).join('');
// Goals judge what the program printed, so typed answers count only as line breaks.
const printedText = res => res.out.map(c => (c.k === 'in' ? '\n' : c.s)).join('');

function stripComments(code, lang) {
  return scanCode(code, lang).filter(t => t.t !== 'comment').map(t => t.v).join('');
}

function checkGoal(goal, res, code, lang) {
  const c = goal.check;
  const text = printedText(res);
  const plain = stripComments(code, lang);
  switch (c.k) {
    case 'ok':
      return res.ok;
    case 'out':
      return text.toLowerCase().includes(c.has.toLowerCase());
    case 'outRe':
      return new RegExp(c.re, 'i').test(text);
    case 'lines':
      return text.split('\n').filter(l => l.trim()).length >= c.min;
    case 'code':
      return new RegExp(c[lang], 'm').test(plain);
    case 'codeMax': {
      const n = (plain.match(new RegExp(c.re, 'g')) || []).length;
      return n >= 1 && n <= c.max;
    }
    case 'asks':
      return res.asks >= c.min;
    default:
      return checkTurtleGoal(c, res);
  }
}

function checkTurtleGoal(c, res) {
  const stats = buildTurtleModel(res.turtle || []).stats;
  if (c.k === 'colors') return stats.colors >= c.min;
  if (c.k === 'turtle') return stats.lines >= (c.lines || 0) && stats.turn >= (c.turn || 0);
  return false;
}

function evaluateGoals(goals, res, code, lang) {
  const results = goals.map(g => checkGoal(g, res, code, lang));
  return { results, all: res.ok && results.every(Boolean) };
}

// A while loop whose condition never changes inside the body is the usual cause of a timeout.
function guessLoopLine(code, lang) {
  let prog;
  try {
    prog = parseProgram(code, lang);
  } catch {
    return 0;
  }
  const loops = [];
  const walk = body => body.forEach(s => {
    if (s.k === 'while') loops.push(s);
    ['body', 'orelse'].forEach(k => s[k] && walk(s[k]));
  });
  walk(prog.body);
  const suspicious = loops.find(l => {
    const used = exprNames(l.test);
    const changed = assignedNames(l.body);
    return ![...used].some(n => changed.has(n));
  });
  return (suspicious || loops[0] || { line: 0 }).line;
}

function exprNames(e, out = new Set()) {
  if (!e || typeof e !== 'object') return out;
  if (e.k === 'name') out.add(e.id);
  Object.values(e).forEach(v => {
    if (v && typeof v === 'object') exprNames(v, out);
  });
  return out;
}

function assignedNames(body, out = new Set()) {
  const visit = n => {
    if (!n || typeof n !== 'object') return;
    if ((n.k === 'assign' || n.k === 'update') && n.target && n.target.k === 'name') out.add(n.target.id);
    if (n.k === 'call' && n.fn && n.fn.k === 'member' && n.fn.obj.k === 'name') out.add(n.fn.obj.id);
    if (n.k === 'foreach') n.targets.forEach(t => out.add(t));
    Object.values(n).forEach(v => (Array.isArray(v) ? v.forEach(visit) : visit(v)));
  };
  body.forEach(visit);
  return out;
}

// =====================================================================
// Explain this error: catalogue lookup, "did you mean", one-click fixes
// =====================================================================
function levenshtein(a, b) {
  const row = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let prev = row[0];
    row[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const tmp = row[j];
      row[j] = Math.min(row[j] + 1, row[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = tmp;
    }
  }
  return row[b.length];
}

function knownNames(code, lang) {
  const names = new Set(BUILTIN_NAMES[lang]);
  if (lang === 'js') ['log', 'length', 'push', 'pop', 'toUpperCase', 'toLowerCase', 'includes', 'join'].forEach(n => names.add(n));
  else ['append', 'upper', 'lower', 'split', 'strip'].forEach(n => names.add(n));
  Object.keys(TURTLE_ALIASES).forEach(n => names.add(n));
  scanCode(code, lang).forEach(t => t.t === 'name' && names.add(t.v));
  return [...names];
}

// Closest known name to a misspelt one ("scor" -> "score", "Print" -> "print").
function closestName(bad, code, lang) {
  const last = bad.split('.').pop();
  let best = null;
  let bestD = 3;
  knownNames(code, lang).forEach(n => {
    if (n === last) return;
    const d = n.toLowerCase() === last.toLowerCase() ? 0.5 : levenshtein(n, last);
    if (d < bestD && d <= Math.max(1, Math.floor(last.length / 3))) {
      best = n;
      bestD = d;
    }
  });
  return best;
}

function findCatalogEntry(err, lang) {
  const key = `${err.type}: ${err.message}`;
  return ERROR_CATALOG.find(e => (e.lang === lang || e.lang === 'any') && (e.type ? e.type === err.type : e.re.test(key))) || ERROR_FALLBACK;
}

function errorSuggestion(entry, groups, code, lang) {
  if (entry.id === 'js-ref' || entry.id === 'py-name' || entry.id === 'js-notfn') {
    const name = closestName(groups[1] || '', code, lang);
    if (!name) return null;
    return { name, en: ` Did you mean ${name}?`, ur: ` کیا آپ کا مطلب ${name} تھا؟` };
  }
  if (entry.id === 'py-attr') {
    const map = { push: 'append', length: 'len(...)', toUpperCase: 'upper', toLowerCase: 'lower', includes: 'in', size: 'len(...)' };
    const alt = map[groups[2]];
    if (alt) return { name: alt, en: ` In Python use ${alt}.`, ur: ` پائتھن میں ${alt} استعمال کریں۔` };
  }
  return null;
}

// Everything the error card needs, in both languages.
function explainError(err, lang, code) {
  const entry = findCatalogEntry(err, lang);
  const groups = (entry.re && entry.re.exec(`${err.type}: ${err.message}`)) || [];
  const sug = errorSuggestion(entry, groups, code, lang);
  const fill = (txt, l) => txt.replace(/\{(\d)\}/g, (m, i) => groups[i] ?? '').replace('{s}', sug ? sug[l] : '');
  const pick = field => ({ en: fill(entry[field].en, 'en'), ur: fill(entry[field].ur, 'ur') });
  const fixed = entry.fix && AUTOFIX[entry.fix] ? AUTOFIX[entry.fix](code, err, { lang, suggest: sug && sug.name, groups }) : null;
  return {
    id: entry.id,
    title: pick('title'),
    what: pick('what'),
    how: pick('how'),
    line: err.line || 0,
    fixedCode: fixed && fixed !== code ? fixed : null,
    raw: `${err.type}: ${err.message}`,
  };
}

// ---------- one-click fixes (each returns new code or null) ----------
const lineAt = (code, n) => code.split('\n')[n - 1] ?? null;
function withLine(code, n, fn) {
  const lines = code.split('\n');
  if (!n || n > lines.length) return null;
  const out = fn(lines[n - 1], lines);
  if (out == null || out === lines[n - 1]) return null;
  lines[n - 1] = out;
  return lines.join('\n');
}
const indentOf = s => (s.match(/^[ \t]*/) || [''])[0];
const splitComment = (s, lang) => {
  const m = lang === 'py' ? /\s*#.*$/.exec(s) : /\s*\/\/.*$/.exec(s);
  return m ? [s.slice(0, m.index), s.slice(m.index)] : [s, ''];
};

const AUTOFIX = {
  rename(code, err, ctx) {
    const bad = (ctx.groups[1] || '').split('.').pop();
    if (!ctx.suggest || !bad || /[^\w$]/.test(ctx.suggest)) return null;
    return withLine(code, err.line, l => l.replace(new RegExp(`\\b${bad.replace(/\$/g, '\\$')}\\b`), ctx.suggest));
  },
  colon(code, err, ctx) {
    return withLine(code, err.line, l => {
      const [body, comment] = splitComment(l, ctx.lang);
      return /:\s*$/.test(body) ? null : body.trimEnd() + ':' + comment;
    });
  },
  doubleEq(code, err) {
    return withLine(code, err.line, l => l.replace(/([^=!<>])=([^=])/, '$1==$2'));
  },
  printParens(code, err) {
    return withLine(code, err.line, l => l.replace(/\bprint\s+(.+?)\s*$/, 'print($1)'));
  },
  closeQuote(code, err) {
    return withLine(code, err.line, l => {
      const q = (l.match(/["'`]/) || [])[0];
      if (!q || (l.split(q).length - 1) % 2 === 0) return null;
      const m = /(\)+;?)\s*$/.exec(l);
      return m ? l.slice(0, m.index) + q + m[1] : l + q;
    });
  },
  closeBracket(code, err, ctx) {
    if (/end of input/.test(err.message)) {
      const missing = (code.match(/\{/g) || []).length - (code.match(/\}/g) || []).length;
      return missing > 0 ? code.replace(/\s*$/, '') + '\n}'.repeat(missing) + '\n' : null;
    }
    return withLine(code, err.line, l => {
      const [body, comment] = splitComment(l, ctx.lang);
      const opens = (body.match(/\(/g) || []).length - (body.match(/\)/g) || []).length;
      if (opens <= 0) return null;
      const semi = /;\s*$/.test(body);
      return body.replace(/;?\s*$/, '') + ')'.repeat(opens) + (semi ? ';' : '') + comment;
    });
  },
  indentNext(code, err) {
    const lines = code.split('\n');
    const header = lines.slice(0, err.line - 1).reverse().find(l => l.trim());
    if (!header) return null;
    return withLine(code, err.line, l => indentOf(header) + '    ' + l.trimStart());
  },
  dedent(code, err) {
    const prev = code.split('\n').slice(0, err.line - 1).reverse().find(l => l.trim());
    const target = prev ? indentOf(prev) + (/:\s*(#.*)?$/.test(prev) ? '    ' : '') : '';
    return withLine(code, err.line, l => target + l.trimStart());
  },
  constToLet(code, err) {
    const m = /^\s*(\w+)\s*(?:[-+*/%]?=|\+\+|--)/.exec(lineAt(code, err.line) || '');
    if (!m) return null;
    const re = new RegExp(`\\bconst(\\s+${m[1]}\\b)`);
    return re.test(code) ? code.replace(re, 'let$1') : null;
  },
  dropDecl(code, err) {
    return withLine(code, err.line, l => l.replace(/^(\s*)(let|const|var)\s+/, '$1'));
  },
  strWrap(code, err) {
    return withLine(code, err.line, l => {
      const a = l.replace(/((["'])[^"']*\2\s*\+\s*)([A-Za-z_]\w*)(?!\s*\()/, '$1str($3)');
      return a !== l ? a : l.replace(/(?<![\w"'])([A-Za-z_]\w*)(\s*\+\s*["'])/, 'str($1)$2');
    });
  },
  intInput(code, err) {
    const direct = withLine(code, err.line, l => (/(?<!int\()input\(/.test(l) ? l.replace(/(?<!int\()(input\([^()]*\))/, 'int($1)') : null));
    if (direct) return direct;
    const names = (lineAt(code, err.line) || '').match(/[A-Za-z_]\w*/g) || [];
    const lines = code.split('\n');
    const idx = lines.findIndex(l => names.some(n => new RegExp(`^\\s*${n}\\s*=\\s*input\\(`).test(l)));
    if (idx < 0) return null;
    lines[idx] = lines[idx].replace(/=\s*(input\([^()]*\))/, '= int($1)');
    return lines.join('\n');
  },
  pyMethod(code, err) {
    return withLine(code, err.line, l => l
      .replace(/\.push\(/, '.append(')
      .replace(/\.toUpperCase\(\)/, '.upper()')
      .replace(/\.toLowerCase\(\)/, '.lower()')
      .replace(/([A-Za-z_]\w*)\.length\b/, 'len($1)'));
  },
  addGlobal(code, err, ctx) {
    const name = ctx.groups[1] || ctx.groups[2];
    const lines = code.split('\n');
    for (let i = err.line - 2; i >= 0; i--) {
      if (!/^\s*def\s+\w+/.test(lines[i])) continue;
      const body = lines.slice(i + 1).find(l => l.trim()) || '';
      lines.splice(i + 1, 0, indentOf(body) + 'global ' + name);
      return lines.join('\n');
    }
    return null;
  },
};

// =====================================================================
// Lint: friendly warnings found without running (used by the mentor)
// =====================================================================
function lintCode(code, lang) {
  const out = [];
  const add = (line, en, ur) => out.push({ line, en, ur });
  const lines = code.split('\n');
  if (!stripComments(code, lang).trim()) add(0, 'The editor is empty — start with one print line.', 'ایڈیٹر خالی ہے — ایک پرنٹ لائن سے شروع کریں۔');
  lines.forEach((raw, i) => lintLine(raw, i + 1, lang, add));
  lintBrackets(code, lang, add);
  lintFunctions(code, lang, add);
  const loopLine = guessLoopLine(code, lang);
  if (loopLine && /while/.test(lines[loopLine - 1] || '') && infiniteLoopSuspect(code, lang)) {
    add(loopLine, `Line ${loopLine}: this while loop never changes what it checks, so it may never stop.`, `لائن ${loopLine}: یہ while لوپ اپنی شرط والی چیز نہیں بدلتا، اس لیے شاید کبھی نہ رکے۔`);
  }
  if (lang === 'py') lintPythonInput(code, add);
  return out;
}

function lintLine(raw, n, lang, add) {
  const [line] = splitComment(raw, lang);
  if (!line.trim()) return;
  if (lang === 'py' && /^\s*(if|elif|else|for|while|def)\b/.test(line) && !/:\s*$/.test(line)) {
    add(n, `Line ${n}: lines starting with ${line.trim().split(/\W/)[0]} need a colon at the end.`, `لائن ${n}: ${line.trim().split(/\W/)[0]} سے شروع ہونے والی لائن کے آخر میں کولن چاہیے۔`);
  }
  const condRe = lang === 'py' ? /^\s*(if|elif|while)\b[^=!<>]*[^=!<>]=[^=]/ : /\b(if|while)\s*\([^)]*[^=!<>]=[^=]/;
  if (condRe.test(line)) add(n, `Line ${n}: one = stores a value. To compare, use ${lang === 'py' ? '==' : '==='}.`, `لائن ${n}: ایک = ویلیو رکھتا ہے۔ موازنے کے لیے ${lang === 'py' ? '==' : '==='} لکھیں۔`);
  const caps = lang === 'py' ? /\b(Print|Input|Range|Len|Int|Str)\s*\(/ : /\b(Console\.log|console\.Log|consol\.log|Console\.Log)\b/;
  const m = caps.exec(line);
  if (m) add(n, `Line ${n}: "${m[1]}" should be all lower-case letters.`, `لائن ${n}: "${m[1]}" چھوٹے حروف میں ہونا چاہیے۔`);
  if (/[\u201C\u201D\u2018\u2019]/.test(line)) add(n, `Line ${n}: curly quotes do not work in code — use straight " quotes.`, `لائن ${n}: ٹیڑھی کوٹس کوڈ میں نہیں چلتیں — سیدھی " کوٹس لگائیں۔`);
}

function lintBrackets(code, lang, add) {
  const toks = scanCode(code, lang);
  const bad = toks.find(t => t.bad);
  if (bad) add(bad.line, `Line ${bad.line}: a text is missing its closing quote.`, `لائن ${bad.line}: ٹیکسٹ کی بند کرنے والی کوٹ غائب ہے۔`);
  const stack = [];
  for (const t of toks) {
    if (t.t !== 'op') continue;
    if (OPENERS.includes(t.v)) stack.push(t);
    else if (CLOSERS_STR.includes(t.v)) {
      const open = stack.pop();
      if (!open || PAIRS[open.v] !== t.v) {
        add(t.line, `Line ${t.line}: this "${t.v}" has no matching opening bracket.`, `لائن ${t.line}: اس "${t.v}" کی کھلنے والی بریکٹ نہیں۔`);
        return;
      }
    }
  }
  if (stack.length) {
    const open = stack.pop();
    add(open.line, `Line ${open.line}: "${open.v}" is opened but never closed.`, `لائن ${open.line}: "${open.v}" کھلی ہے مگر بند نہیں ہوئی۔`);
  }
}

function lintFunctions(code, lang, add) {
  const defRe = lang === 'py' ? /^\s*def\s+(\w+)/gm : /\bfunction\s+(\w+)/g;
  for (const m of code.matchAll(defRe)) {
    const uses = (code.match(new RegExp(`\\b${m[1]}\\b`, 'g')) || []).length;
    const line = code.slice(0, m.index).split('\n').length + (code[m.index] === '\n' ? 1 : 0);
    if (uses < 2) add(line, `Line ${line}: the function ${m[1]} is never called. Write ${m[1]}(...) to run it.`, `لائن ${line}: فنکشن ${m[1]} کبھی بلایا نہیں گیا۔ اسے چلانے کے لیے ${m[1]}(...) لکھیں۔`);
  }
}

function infiniteLoopSuspect(code, lang) {
  try {
    const prog = parseProgram(code, lang);
    let suspect = false;
    const walk = body => body.forEach(s => {
      if (s.k === 'while' && !(s.test.k === 'bool' && s.test.v === true)) {
        const used = exprNames(s.test);
        const changed = assignedNames(s.body);
        if (used.size && ![...used].some(n => changed.has(n))) suspect = true;
      }
      ['body', 'orelse'].forEach(k => s[k] && walk(s[k]));
    });
    walk(prog.body);
    return suspect;
  } catch {
    return false;
  }
}

// x = input(...) later used with < > or range(x) without int().
function lintPythonInput(code, add) {
  const lines = code.split('\n');
  lines.forEach((l, i) => {
    const m = /^\s*(\w+)\s*=\s*input\(/.exec(l);
    if (!m) return;
    const used = lines.slice(i + 1).findIndex(x => new RegExp(`(\\b${m[1]}\\s*[<>]|[<>]=?\\s*${m[1]}\\b|range\\(\\s*${m[1]}\\s*\\)|${m[1]}\\s*[-*/]\\s*\\d)`).test(x));
    if (used >= 0) {
      const n = i + 2 + used;
      add(n, `Line ${n}: ${m[1]} came from input(), so it is text. Use int(input(...)) on line ${i + 1}.`, `لائن ${n}: ${m[1]} input() سے آیا ہے، یعنی ٹیکسٹ ہے۔ لائن ${i + 1} پر int(input(...)) لکھیں۔`);
    }
  });
}

// =====================================================================
// State: settings, learner profiles, progress, badges, streaks, inbox
// Storage keys (prefix cb:): settings · profiles · active · classes ·
// inbox · code:<pid> · play:<pid> · chat:<pid> · blocks · seeded

const profiles = () => store.get('profiles', []);
const saveProfiles = list => store.set('profiles', list);

function activeProfile() {
  const list = profiles();
  const id = store.get('active', null);
  return list.find(p => p.id === id) || list[0] || null;
}

function updateProfile(fn) {
  const list = profiles();
  const p = list.find(x => x.id === (activeProfile() || {}).id);

  fn(p);
  saveProfiles(list);
  return p;
}

// ---------- progress ----------
const isDone = (p, id, lang = null) => !!(p && p.done[id] && (lang ? p.done[id][lang] : Object.keys(p.done[id]).length));
const unitLessons = unitId => LESSONS.filter(l => l.unit === unitId);
const lessonsDone = p => LESSONS.filter(l => isDone(p, l.id)).length;
const projectsDone = p => PROJECTS.filter(x => isDone(p, x.id)).length;
const unitDone = (p, unitId) => unitLessons(unitId).every(l => isDone(p, l.id));
const unitProgress = (p, unitId) => unitLessons(unitId).filter(l => isDone(p, l.id)).length;

function markActivity(p) {
  const day = todayIso();
  p.days[day] = (p.days[day] || 0) + 1;
}

function streak(p) {
  if (!p) return 0;
  let n = 0;
  let ts = Date.now();
  if (!p.days[isoDay(ts)]) ts -= DAY;
  while (p.days[isoDay(ts)]) {
    n++;
    ts -= DAY;
  }
  return n;
}

function bestStreak(p) {
  const days = Object.keys(p.days).sort();
  let best = 0;
  let run = 0;
  let prev = null;
  days.forEach(d => {
    const t = new Date(d + 'T12:00:00').getTime();
    run = prev && Math.round((t - prev) / DAY) === 1 ? run + 1 : 1;
    best = Math.max(best, run);
    prev = t;
  });
  return best;
}

// Award any badges whose rule now passes; returns the new ones.
function awardBadges(p) {
  const fresh = BADGES.filter(b => !p.badges[b.id] && b.test(p));
  fresh.forEach(b => (p.badges[b.id] = Date.now()));
  return fresh;
}

// Deterministic activity so the teacher view and charts look the same on every first open.
function demoLearner(name, classCode, i, rnd) {
  const now = Date.now();
  const p = newProfile(name, { classCode, demo: true, color: AVATAR_COLORS[i % AVATAR_COLORS.length], created: now - (30 + i) * DAY });
  const count = i === 0 ? 7 : Math.floor(2 + rnd() * 20);
  LESSONS.slice(0, count).forEach((l, k) => {
    const ts = now - (count - k) * DAY * (0.8 + rnd());
    const both = rnd() > 0.6 || (i === 0 && k < 3);
    p.done[l.id] = rnd() > 0.5 || i === 0 ? { py: ts } : { js: ts };
    if (both) p.done[l.id] = { js: ts, py: ts + 36e5 };
  });
  PROJECTS.slice(0, count > 14 ? Math.floor(rnd() * 4) : 0).forEach(x => (p.done[x.id] = { py: now - rnd() * 10 * DAY }));
  const recent = i === 0 ? 4 : Math.floor(rnd() * 6);
  for (let d = 0; d < recent; d++) p.days[isoDay(now - d * DAY)] = 1 + Math.floor(rnd() * 5);
  for (let d = 0; d < 30; d++) {
    if (rnd() > 0.55) p.days[isoDay(now - (recent + 2 + d) * DAY)] = 1 + Math.floor(rnd() * 4);
  }
  p.stats = {
    runs: count * 6 + Math.floor(rnd() * 20),
    errors: Math.floor(count * (0.6 + rnd())),
    fixes: Math.floor(count * 0.7 + rnd() * 3),
    steps: Math.floor(rnd() * 90),
    turtleLines: Math.floor(count * 12 * rnd()),
    mentor: Math.floor(rnd() * 8),
    blocks: rnd() > 0.6 ? 1 : 0,
  };
  if (i === 0) Object.assign(p.stats, { runs: 46, errors: 12, fixes: 7, steps: 38, turtleLines: 64, mentor: 3, blocks: 0 });
  awardBadges(p);
  return p;
}

const S = {

const rich = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const T = o => (o ? o[lang] || o.en : '');

function findDoc(doc) {
  if (doc.kind === 'lesson') return LESSONS.find(l => l.id === doc.id) || null;
  if (doc.kind === 'project') return PROJECTS.find(p => p.id === doc.id) || null;
  return playPrograms().find(p => p.id === doc.id) || null;
}

// Uniform view of any document for the editor, rail and goal checks.
function docMeta(doc) {
  const d = findDoc(doc);
  if (!d) return null;
  if (doc.kind === 'play') {
    return { kind: 'play', id: d.id, title: d.name, fixedLang: d.lang, starter: () => d.code, solution: null, goals: [], hints: [], inputs: d.inputs || '', turtle: /\b(forward|circle|left|right)\s*\(/.test(d.code) };
  }
  return {
    kind: doc.kind, id: d.id, title: T(d.title), raw: d,
    starter: l => d.starter[l], solution: l => d.solution[l],
    goals: d.goals, hints: d.hints || [], inputs: d.inputs || '', turtle: !!d.turtle,
  };
}

const playKey = () => 'play:' + ((activeProfile() || {}).id || 'none');
const playPrograms = () => store.get(playKey(), []);
const savePlayPrograms = list => store.set(playKey(), list);

function nextLessonId(p) {
  const next = LESSONS.find(l => !isDone(p, l.id));
  return (next || LESSONS[LESSONS.length - 1]).id;
}

// ---------- opening a document ----------
function openDoc(doc) {
  const meta = docMeta(doc);
  if (!meta) {
    go('#learn/' + nextLessonId(activeProfile()));
    return;
  }
  flushSave();
  S.doc = { kind: doc.kind, id: doc.id };
  if (meta.fixedLang) S.lang = meta.fixedLang;
  S.lastRun = null;
  S.goalState = null;
  stopVisualiser();
  loadEditorCode();
  renderRail();
  renderToolbar();
  renderOutputPane();
  renderStepsPane();
  renderBuddyPane();
  setSideTab(S.sideTab);
  updateStatus();
}

function loadEditorCode() {
  const meta = docMeta(S.doc);
  const saved = meta.kind === 'play' ? meta.starter() : savedCode(S.doc, S.lang);
  S.editor.setValue(saved ?? meta.starter(S.lang) ?? '', S.lang);
  S.editor.setLabel(t('editorLabel', { lang: S.lang === 'py' ? 'Python' : 'JavaScript' }));
  const inputs = store.get(codeKey(), {})[docKey(S.doc, 'inputs')];
  $('#inputsTa').value = inputs ?? meta.inputs;
  $('#inputsBox').open = !!(inputs ?? meta.inputs);
}

function persistCode() {
  const code = S.editor.value;
  if (S.doc.kind === 'play') {
    const list = playPrograms();
    const prog = list.find(p => p.id === S.doc.id);
    if (prog && prog.code !== code) {
      prog.code = code;
      prog.updated = Date.now();
      savePlayPrograms(list);
    }
  } else {
    saveCode(S.doc, S.lang, code);
  }
  updateStatus(true);
}

function flushSave() {
  if (!S.saveTimer) return;
  clearTimeout(S.saveTimer);
  S.saveTimer = 0;
  persistCode();
}

function scheduleSave() {
  clearTimeout(S.saveTimer);
  updateStatus(false);
  S.saveTimer = setTimeout(() => {
    S.saveTimer = 0;
    persistCode();
  }, 500);
}

function setCodeLang(l) {
  if (l === S.lang || S.doc.kind === 'play') return;
  flushSave();
  S.lang = l;
  saveSettings({ codeLang: l });
  S.lastRun = null;
  S.goalState = null;
  stopVisualiser();
  loadEditorCode();
  renderRail();
  renderToolbar();
  renderOutputPane();
  renderStepsPane();
  updateStatus();
}

// ---------- rail ----------

  const rail = $('#rail');
  if (S.doc.kind === 'lesson') rail.innerHTML = lessonCardHTML() + unitsHTML();
  else if (S.doc.kind === 'project') rail.innerHTML = projectCardHTML() + projectListHTML();

}

async function deleteProgram() {
  const list = playPrograms();
  if (list.length < 2) return;
  const prog = list.find(p => p.id === S.doc.id);
  const ok = await confirmModal({ title: t('deleteProgram'), body: esc(t('deleteProgramBody', { name: prog.name })), ok: t('delete'), danger: true });
  if (!ok) return;
  S.saveTimer = 0;
  const rest = list.filter(p => p.id !== prog.id);
  savePlayPrograms(rest);
  go('#play/' + rest[0].id);
}

function ensurePlayProgram() {
  const list = playPrograms();
  if (list.length) return list.sort((a, b) => b.updated - a.updated)[0].id;
  const prog = { id: 'g' + uid(), name: t('myProgram'), lang: S.lang, updated: Date.now(), code: S.lang === 'py' ? 'print("Hello!")\n' : 'console.log("Hello!");\n' };
  savePlayPrograms([prog]);
  return prog.id;
}

const looksLikeTurtle = code => /\b(forward|backward|left|right|circle|penup|pendown|goto)\s*\(/.test(code);

function consoleHTML(chunks) {
  if (!chunks.length) return `<span class="c-sys">${t('noOutput')}</span>`;
  return chunks.map(c => `<span class="${c.k === 'in' ? 'c-in' : ''}">${esc(c.s)}</span>`).join('');
}

function appendConsole(k, s) {
  const con = $('#console');
  if (!con) return;
  if (con.dataset.fresh === '1') {
    con.innerHTML = '';
    con.dataset.fresh = '0';
  }
  const span = document.createElement('span');
  span.className = (k === 'in' ? 'c-in ' : '') + 'c-new';
  span.textContent = s;
  con.append(span);
}

function parseInputs() {
  const raw = $('#inputsTa').value.replace(/\r/g, '');
  if (!raw.trim()) return [];
  return raw.replace(/\n$/, '').split('\n');
}

function setRunning(on) {
  runtime.busy = on;
  $('#runBtn').disabled = on;
  $('#stepBtn').disabled = on;
  $('#stopBtn').classList.toggle('hidden', !on);
  $('#runBtn').classList.toggle('hidden', on);
}

async function runCurrent() {
  if (runtime.busy) return;
  flushSave();
  stopVisualiser();
  const code = S.editor.value;
  const lang = S.lang;
  setRunning(true);
  setSideTab('out');
  if (window.innerWidth <= 920) setMobilePane('out');
  $('#console').innerHTML = `<span class="c-sys">${t('running')}</span>`;
  $('#console').dataset.fresh = '1';
  $('#errorCard').innerHTML = '';
  $('#resultCard').innerHTML = '';
  $('#runNotice').innerHTML = '';
  S.editor.setMarks({ err: null, step: null });
  const s = settings();
  const res = await runProgram(code, lang, { inputs: parseInputs(), seed: s.seed, timeLimit: s.timeLimit * 1000, onOut: appendConsole });
  setRunning(false);
  showRunResult(res, code, lang);
}

function stopCurrent() {
  if (runtime.stop) runtime.stop();
}

function showRunResult(res, code, lang) {
  const prev = S.lastRun;
  S.lastRun = { res, code, lang };
  $('#console').innerHTML = consoleHTML(res.out) + `<span class="c-sys">\n${esc(runSummary(res))}</span>`;
  const meta = docMeta(S.doc);
  if (res.turtle.length || meta.turtle) {
    $('#turtleCard').classList.remove('hidden');
    S.turtle.load(res.turtle);
  }
  renderRunNotice(res);
  if (!res.ok && res.error.type !== 'Stopped') renderErrorCard(res.error, code, lang);
  if (res.error && res.error.line) S.editor.setMarks({ err: res.error.line });
  const goals = meta.goals;
  S.goalState = goals.length ? evaluateGoals(goals, res, code, lang) : null;
  if (goals.length) renderResultCard(meta);
  recordRun(res, prev, meta);
  setSideTab('out');
  renderBuddyMood(res);
  announce(res.ok ? t('ranOk') : t('ranError', { msg: res.error.message }));
}

// Stats, streaks, completion and badges after every run.
function recordRun(res, prev, meta) {
  const win = S.goalState && S.goalState.all;
  const newly = [];
  let finished = false;
  const p = updateProfile(x => {
    x.stats.runs++;
    if (!res.ok && res.error.type !== 'Stopped') x.stats.errors++;
    if (res.ok && prev && !prev.res.ok && prev.lang === S.lang) x.stats.fixes++;
    x.stats.turtleLines += buildTurtleModel(res.turtle).stats.lines;
    markActivity(x);
    if (win && !isDone(x, meta.id, S.lang)) {
      x.done[meta.id] = { ...(x.done[meta.id] || {}), [S.lang]: Date.now() };
      finished = true;
    }
    newly.push(...awardBadges(x));
  });
  if (finished) celebrateDone(meta);
  newly.forEach(b => {
    toast(t('badgeEarned', { name: T(b.title) }), 'ok');
    addInbox('badge', { en: `Badge earned: ${b.title.en}`, ur: `بیج ملا: ${b.title.ur}` }, b.desc);
  });
  if (finished || newly.length) renderRail();
  return p;
}

function celebrateDone(meta) {
  const title = { en: `${meta.kind === 'project' ? 'Project' : 'Lesson'} complete: ${meta.raw.title.en}`, ur: `${meta.kind === 'project' ? 'پروجیکٹ' : 'سبق'} مکمل: ${meta.raw.title.ur}` };
  addInbox('lesson', title, { en: `Finished in ${S.lang === 'py' ? 'Python' : 'JavaScript'}. Great work!`, ur: `${S.lang === 'py' ? 'پائتھن' : 'جاوا اسکرپٹ'} میں مکمل۔ شاباش!` });
  addLog('done', title);
  toast(T(title), 'ok');
}

function openFind() {

}

function runFind() {

  $('#findCount').textContent = $('#findInput').value ? t('findCount', { i: n ? cur + 1 : 0, n }) : '';
}

function bindFind() {
  $('#findInput').oninput = runFind;

    if (e.key === 'Enter') {
      e.preventDefault();
      S.editor.findStep(e.shiftKey ? -1 : 1);
      $('#findCount').textContent = t('findCount', { i: S.editor.findState.cur + 1, n: S.editor.findState.matches.length });
    }
    if (e.key === 'Escape') closeFind();

  $('#findNext').onclick = () => {
    S.editor.findStep(1);
    runFindCount();
  };
  $('#findPrev').onclick = () => {
    S.editor.findStep(-1);

  };

function runFindCount() {

  $('#findCount').textContent = t('findCount', { i: f.matches.length ? f.cur + 1 : 0, n: f.matches.length });

function closeFind() {
  $('#findBar').classList.add('hidden');
  S.editor.clearFind();
  S.editor.ta.focus();
}

// =====================================================================
// Step-through visualiser: records every step with the mini interpreter,
// then scrubs back and forth through variables, call stack and loops
// =====================================================================
const V = { i: 0, timer: 0, stale: false, turtle: null, speed: 'normal', seen: 0 };
const STEP_DELAY = { slow: 1000, normal: 520, fast: 160 };

function startVisualiser() {
  // TODO(student): trace full Python with sys.settrace inside Pyodide so stepping works beyond the mini-Python subset.
  if (runtime.busy) return;
  flushSave();
  stopPlaying();
  const s = settings();
  S.trace = traceMini(S.editor.value, S.lang, { inputs: parseInputs(), seed: s.seed === '' ? 7 : s.seed, timeLimit: s.timeLimit * 1000, maxSnaps: 1500 });
  V.i = 0;
  V.stale = false;
  setSideTab('steps');
  if (window.innerWidth <= 920) setMobilePane('out');
  renderStepsPane();
  showStep(0);
}

function stopVisualiser() {
  stopPlaying();
  S.trace = null;
  V.stale = false;
  if (S.editor) S.editor.setMarks({ step: null });
}

function stopPlaying() {
  clearInterval(V.timer);
  V.timer = 0;
}

function markTraceStale() {
  if (V.stale) return;
  V.stale = true;
  stopPlaying();
  S.editor.setMarks({ step: null });
  const note = $('#visStale');
  if (note) note.classList.remove('hidden');
}

function renderStepsPane() {
  const pane = $('#paneSteps');
  if (!S.trace) {
    pane.innerHTML = `<div class="empty">${buddySVG('think', 86)}<h3 style="margin:8px 0 6px">${t('stepsTitle')}</h3><p>${t('stepsIntro')}</p>
      <button type="button" class="btn sun" id="visStart">${ic('footsteps')} ${t('startStepping')}</button><p class="small" style="margin-top:12px">${t('stepsNote')}</p></div>`;
    $('#visStart').onclick = startVisualiser;
    return;
  }
  const n = S.trace.snaps.length;
  pane.innerHTML = `
    <div class="note hidden" id="visStale" style="margin-bottom:10px">${ic('alert')}<span>${t('visStale')} <button type="button" class="btn xs sun" id="visRestart2">${ic('refresh')} ${t('restart')}</button></span></div>
    ${S.trace.truncated ? `<div class="note sky" style="margin-bottom:10px">${ic('info')}<span>${t('visTruncated', { n })}</span></div>` : ''}
    <div class="vis-controls">
      <button type="button" class="iconbtn" id="visFirst" aria-label="${esc(t('restart'))}">${ic('rotate')}</button>
      <button type="button" class="iconbtn" id="visBack" aria-label="${esc(t('stepBack'))}">${ic('chevron-left', 'flip')}</button>
      <button type="button" class="btn sun sm" id="visPlay">${ic('play')} ${t('play')}</button>
      <button type="button" class="iconbtn" id="visNext" aria-label="${esc(t('stepNext'))}">${ic('chevron-right', 'flip')}</button>
      <input type="range" id="visRange" min="0" max="${n - 1}" value="0" aria-label="${esc(t('stepSlider'))}">
      <select id="visSpeed" aria-label="${esc(t('speed'))}" style="width:auto;min-height:36px">${['slow', 'normal', 'fast'].map(k => `<option value="${k}" ${V.speed === k ? 'selected' : ''}>${t('speed_' + k)}</option>`).join('')}</select>
    </div>
    <div class="vis-status" id="visStatus" aria-live="polite"></div>
    <div class="vis-event" id="visEvent"></div>
    <div class="vis-block"><h4>${ic('layers')} ${t('variables')}</h4><div id="visVars"></div></div>
    <div class="vis-block"><h4>${ic('list')} ${t('callStack')}</h4><div class="frames" id="visFrames"></div></div>
    <div class="vis-block"><h4>${ic('repeat')} ${t('loops')}</h4><div class="loops" id="visLoops"></div></div>
    <div class="vis-block"><h4>${ic('terminal')} ${t('outputSoFar')}</h4><div class="vis-out" id="visOut"></div></div>
    ${S.trace.turtle.length ? `<div class="vis-block"><h4>${ic('turtle')} ${t('turtle')}</h4><div class="turtle-card" style="margin:0"><canvas id="visCanvas" width="300" height="300" role="img" aria-label="${esc(t('turtleCanvas'))}"></canvas></div></div>` : ''}`;
  V.turtle = $('#visCanvas') ? new TurtleCanvas($('#visCanvas')) : null;
  bindStepsPane();
}

function bindStepsPane() {
  $('#visFirst').onclick = () => showStep(0);
  $('#visBack').onclick = () => stepBy(-1);
  $('#visNext').onclick = () => stepBy(1);
  $('#visPlay').onclick = togglePlay;
  $('#visRange').oninput = e => showStep(Number(e.target.value));
  $('#visSpeed').onchange = e => {
    V.speed = e.target.value;
    if (V.timer) {
      stopPlaying();
      togglePlay();
    }
  };
  $('#visRestart2').onclick = startVisualiser;
}

function stepBy(d) {
  if (!S.trace || V.stale) return;
  if (d > 0 && V.i < S.trace.snaps.length - 1) countStepSeen();
  showStep(clamp(V.i + d, 0, S.trace.snaps.length - 1));
}

function togglePlay() {
  if (V.timer) {
    stopPlaying();
    $('#visPlay').innerHTML = `${ic('play')} ${t('play')}`;
    return;
  }
  if (V.i >= S.trace.snaps.length - 1) showStep(0);
  $('#visPlay').innerHTML = `${ic('pause')} ${t('pause')}`;
  V.timer = setInterval(() => {
    if (V.i >= S.trace.snaps.length - 1) {
      togglePlay();
      return;
    }
    stepBy(1);
  }, STEP_DELAY[V.speed]);
}

function countStepSeen() {
  V.seen++;
  if (V.seen % 5 !== 0) return;
  const fresh = [];
  updateProfile(p => {
    p.stats.steps += 5;
    fresh.push(...awardBadges(p));
  });
  fresh.forEach(b => toast(t('badgeEarned', { name: T(b.title) }), 'ok'));
}

function showStep(i) {
  const tr = S.trace;
  if (!tr || !tr.snaps.length) return;
  V.i = i;
  const snap = tr.snaps[i];
  const prev = i > 0 ? tr.snaps[i - 1] : null;
  const lines = S.editor.value.split('\n');
  $('#visRange').value = i;
  $('#visStatus').innerHTML = `<span class="chip sun tnum">${t('stepOf', { i: i + 1, n: tr.snaps.length })}</span>${snap.end ? `<span class="chip ${snap.error ? 'coral' : 'mint'}">${snap.error ? t('stoppedError') : t('finished')}</span>` : `<span class="chip tnum">${t('lineN', { n: snap.line })}</span>`}`;
  $('#visEvent').innerHTML = stepEventHTML(snap, prev, lines);
  $('#visVars').innerHTML = varsTableHTML(snap, prev);
  $('#visFrames').innerHTML = snap.frames.slice().reverse().map((f, k) => `<div class="frame ${k === 0 ? 'now' : ''}">${ic(k === 0 ? 'play' : 'layers')}<b>${esc(f.name)}</b><span class="muted small tnum">${t('lineN', { n: f.line })}</span></div>`).join('');
  $('#visLoops').innerHTML = snap.loops.length ? snap.loops.map(l => `<div class="loop"><div class="between"><span>${ic('repeat')} <b>${esc(l.kind)}</b> · ${t('lineN', { n: l.line })}</span><span class="tnum">${l.total != null ? t('roundOf', { i: l.count, n: l.total }) : t('roundN', { i: l.count })}</span></div>${l.total ? `<div class="bar"><i style="width:${pct(l.count, l.total)}%"></i></div>` : ''}</div>`).join('') : `<p class="muted small" style="margin:0">${t('noLoops')}</p>`;
  $('#visOut').textContent = tr.outText.slice(0, snap.outLen) || '';
  if (V.turtle) V.turtle.showCommands(tr.turtle, snap.turtleLen);
  S.editor.setMarks({ step: snap.end ? null : snap.line, err: snap.end && snap.error ? snap.error.line : null });
}

function stepEventHTML(snap, prev, lines) {
  const parts = [];
  if (prev) {
    const ran = `<code>${esc((lines[prev.line - 1] || '').trim())}</code>`;
    parts.push(t('lineRan', { n: prev.line, code: ran }));
    describeChanges(snap, prev).forEach(x => parts.push(x));
  } else {
    parts.push(t('visStartMsg'));
  }
  if (snap.end) {
    if (snap.error) parts.push(`<b style="color:var(--coral-deep)">${esc(snap.error.type)}: ${esc(snap.error.message)}</b>`);
    else parts.push(`<b>${t('programDone')}</b>`);
  } else {
    parts.push(t('nextLine', { n: snap.line, code: `<code>${esc((lines[snap.line - 1] || '').trim())}</code>` }));
  }
  return parts.join('<br>');
}

function describeChanges(snap, prev) {
  const out = [];
  const top = snap.frames[snap.frames.length - 1];
  const prevTop = prev.frames[prev.frames.length - 1];
  if (snap.frames.length > prev.frames.length) out.push(t('calledFn', { name: `<b>${esc(top.name)}</b>` }));
  if (snap.frames.length < prev.frames.length) out.push(t('returnedFn', { name: `<b>${esc(prevTop.name)}</b>` }));
  if (snap.frames.length === prev.frames.length) {
    const before = new Map(prevTop.vars.map(v => [v[0], v[1]]));
    top.vars.forEach(([name, val]) => {
      if (!before.has(name)) out.push(t('madeVar', { name: `<b>${esc(name)}</b>`, val: `<code>${esc(val)}</code>` }));
      else if (before.get(name) !== val) out.push(t('changedVar', { name: `<b>${esc(name)}</b>`, a: `<code>${esc(before.get(name))}</code>`, b: `<code>${esc(val)}</code>` }));
    });
  }
  if (snap.outLen > prev.outLen) out.push(t('printedSomething'));
  return out;
}

function varsTableHTML(snap, prev) {
  const top = snap.frames[snap.frames.length - 1];
  const globals = snap.frames.length > 1 ? snap.frames[0] : null;
  const prevTop = prev ? prev.frames[prev.frames.length - 1] : null;
  const before = prevTop && prevTop.name === top.name ? new Map(prevTop.vars.map(v => [v[0], v[1]])) : null;
  const rows = vars => vars.map(([n, v, type]) => {
    const cls = before && !before.has(n) ? 'added' : before && before.get(n) !== v ? 'changed' : '';
    return `<tr class="${cls}"><td>${esc(n)}</td><td>${esc(v)}</td><td>${esc(type)}</td></tr>`;
  }).join('');
  const table = (title, vars) => `${title ? `<p class="small muted" style="margin:4px 0">${title}</p>` : ''}<table class="vtable"><thead><tr><th>${t('name')}</th><th>${t('value')}</th><th>${t('type')}</th></tr></thead><tbody>${rows(vars)}</tbody></table>`;
  if (!top.vars.length && !(globals && globals.vars.length)) return `<p class="muted small" style="margin:0">${t('noVars')}</p>`;
  let html = table(globals ? t('insideFn', { name: esc(top.name) }) : '', top.vars);
  if (globals) html += table(t('globalVars'), globals.vars);
  return html;
}

const say = (en, ur) => (lang === 'ur' ? ur : en);
const chatKey = () => 'chat:' + ((activeProfile() || {}).id || 'none');
const chatHistory = () => store.get(chatKey(), []);
const saveChat = list => store.set(chatKey(), list.slice(-40));
let buddyMood = 'wave';

function mentorContext() {
  const meta = docMeta(S.doc);
  const run = S.lastRun && S.lastRun.lang === S.lang && S.lastRun.code === S.editor.value ? S.lastRun : null;
  return { lang: S.lang, code: S.editor.value, meta, run, goals: S.goalState, cursorLine: S.editor.cursor().line };
}

const INTENTS = [
  ['greet', /^(hi|hello|hey|salam|salaam|assalam|aoa|ہیلو|سلام|السلام)/i],
  ['thanks', /(thank|shukriya|shukria|jazak|شکریہ)/i],
  ['solution', /(answer|solution|full code|give me the code|jawab|hal\b|حل|جواب)/i],
  ['line', /(line|لائن)\s*(\d+)/i],
  ['error', /(error|wrong|not work|doesn.?t work|isn.?t working|why|bug|broken|crash|ghalat|kaam nahi|chal nahi|غلط|ایرر|کیوں|نہیں چل)/i],
  ['hint', /(hint|help|stuck|next|what now|what do i do|madad|kya karun|kia karun|مدد|اشارہ|کیا کروں|اگلا)/i],
];

function detectIntent(q) {
  const hit = INTENTS.find(([, re]) => re.test(q));
  if (hit) return hit[0];
  return glossaryMatch(q) ? 'concept' : 'other';
}

function glossaryMatch(q) {
  const text = q.toLowerCase();
  let best = null;
  let bestScore = 0;
  GLOSSARY.forEach(g => {
    const score = g.words.reduce((n, w) => n + (new RegExp(`(^|[^\\p{L}])${w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}([^\\p{L}]|$)`, 'u').test(text) ? w.length : 0), 0);
    if (score > bestScore) {
      best = g;
      bestScore = score;
    }
  });
  return best;
}

// Builds Buddy's answer from the code, the last run, the goals and the lesson hints.
function offlineReply(q, ctx) {
  const intent = detectIntent(q);
  const handlers = { greet: replyGreet, thanks: replyThanks, solution: replySolution, line: replyLine, error: replyError, hint: replyHint, concept: replyConcept };
  return (handlers[intent] || replyOther)(q, ctx);
}

function replyGreet() {
  const p = activeProfile();
  return { mood: 'wave', text: say(`Salaam ${p.name.split(' ')[0]}! Press Run to try your code, or ask me "give me a hint", "why is it not working?" or "what is a loop?".`, `السلام علیکم ${p.name.split(' ')[0]}! کوڈ آزمانے کے لیے Run دبائیں، یا مجھ سے پوچھیں "اشارہ دو"، "یہ کیوں نہیں چل رہا؟" یا "لوپ کیا ہے؟"۔`) };
}

function replyThanks() {
  return { mood: 'happy', text: say('You are welcome! Keep going — every bug you fix makes you a better coder.', 'کوئی بات نہیں! لگے رہیں — ہر درست کی ہوئی غلطی آپ کو بہتر کوڈر بناتی ہے۔') };
}

function replySolution(q, ctx) {
  const asks = (S.solutionAsks = (S.solutionAsks || 0) + 1);
  const steps = ctx.meta.hints.length ? ctx.meta.hints.map((h, i) => `${i + 1}. ${T(h)}`).join('\n') : (ctx.meta.raw && ctx.meta.raw.steps ? ctx.meta.raw.steps.map((s, i) => `${i + 1}. ${T(s)}`).join('\n') : '');
  const base = say('I will not paste the answer — you will remember it better if you build it. Here is the plan:', 'میں پورا جواب نہیں دوں گا — خود بنائیں گے تو بہتر یاد رہے گا۔ یہ رہا منصوبہ:');
  const later = asks > 1 && ctx.meta.solution ? say('\n\nStill stuck? The "Show solution" button in the lesson card shows a working version.', '\n\nاب بھی مشکل ہے؟ سبق کارڈ میں "حل دکھائیں" بٹن ایک چلتا ہوا ورژن دکھاتا ہے۔') : '';
  return { mood: 'think', text: `${base}\n${steps || say('Break the goal into small steps and test after each one.', 'مقصد کو چھوٹے قدموں میں بانٹیں اور ہر قدم کے بعد آزمائیں۔')}${later}` };
}

function replyLine(q, ctx) {
  const m = /(?:line|لائن)\s*(\d+)/i.exec(q);
  const n = m ? Number(m[1]) : ctx.cursorLine;
  const src = ctx.code.split('\n')[n - 1];
  if (src == null || !src.trim()) return { mood: 'think', text: say(`Line ${n} is empty.`, `لائن ${n} خالی ہے۔`) };
  return { mood: 'happy', text: `${say(`Line ${n}:`, `لائن ${n}:`)} \`${src.trim()}\`\n${describeLine(src, ctx.lang)}` };
}

// Plain-language description of one line, using the parser when it can.
function describeLine(src, l) {
  let node = null;
  try {
    node = parseProgram(src.trim().replace(/[:{]\s*$/, l === 'py' ? ':\n    pass' : '{}'), l).body[0];
  } catch {
    node = null;
  }
  if (!node) {
    if (/^\s*(}|else\b)/.test(src)) return say('This closes or continues a block above it.', 'یہ اوپر والے بلاک کو بند یا جاری رکھتی ہے۔');
    return say('I could not read this line on its own — check its brackets and quotes.', 'میں یہ لائن اکیلے نہیں پڑھ سکا — اس کی بریکٹس اور کوٹس چیک کریں۔');
  }
  const kinds = {
    assign: () => say(`It stores a value in the box called ${exprText(node.target)}${node.op !== '=' ? ` (changing it with ${node.op})` : ''}.`, `یہ ${exprText(node.target)} نامی ڈبے میں ویلیو رکھتی ہے${node.op !== '=' ? ` (${node.op} سے بدل کر)` : ''}۔`),
    if: () => say('It asks a question. The indented lines below only run when the answer is true.', 'یہ ایک سوال پوچھتی ہے۔ نیچے والی لائنیں صرف تب چلیں گی جب جواب سچ ہو۔'),
    while: () => say('It repeats the lines inside while the question stays true. Make sure something inside changes!', 'جب تک سوال سچ رہے، یہ اندر والی لائنیں دہراتی ہے۔ یقینی بنائیں کہ اندر کچھ بدلے!'),
    for: () => say('It is a counting loop: start, keep going while true, then step.', 'یہ گنتی والا لوپ ہے: شروع، جب تک سچ ہو چلتے رہو، پھر قدم۔'),
    foreach: () => say(`It repeats once for every item, putting each one in ${node.targets.join(', ')}.`, `یہ ہر چیز کے لیے ایک بار دہراتی ہے، ہر چیز کو ${node.targets.join('، ')} میں رکھ کر۔`),
    func: () => say(`It defines a function called ${node.name}. It does nothing until you call ${node.name}(...).`, `یہ ${node.name} نام کا فنکشن بناتی ہے۔ جب تک ${node.name}(...) نہ بلائیں یہ کچھ نہیں کرتا۔`),
    return: () => say('It sends an answer back to whoever called the function.', 'یہ فنکشن بلانے والے کو جواب واپس بھیجتی ہے۔'),
    import: () => say(`It brings in the ${node.mod} toolbox.`, `یہ ${node.mod} کا ٹول باکس لاتی ہے۔`),
    expr: () => describeCall(node.e),
  };
  return (kinds[node.k] || (() => say('It is an instruction for the computer.', 'یہ کمپیوٹر کے لیے ایک ہدایت ہے۔')))();
}

function describeCall(e) {
  if (e.k !== 'call') return say('It works out a value.', 'یہ ایک ویلیو نکالتی ہے۔');
  const name = exprText(e.fn);
  if (/^(print|console\.log)$/.test(name)) return say('It shows something in the Output box.', 'یہ آؤٹ پٹ باکس میں کچھ دکھاتی ہے۔');
  if (TURTLE_ALIASES[name.split('.').pop()]) return say(`It tells the turtle to ${name.split('.').pop()}.`, `یہ کچھوے کو ${name.split('.').pop()} کا حکم دیتی ہے۔`);
  if (/^(ask|input|prompt)$/.test(name)) return say('It asks a question and waits for an answer.', 'یہ سوال پوچھ کر جواب کا انتظار کرتی ہے۔');
  return say(`It calls (runs) ${name}.`, `یہ ${name} کو بلاتی (چلاتی) ہے۔`);
}

function replyError(q, ctx) {
  if (ctx.run && !ctx.run.res.ok && ctx.run.res.error.type !== 'Stopped') {
    const x = explainError(ctx.run.res.error, ctx.lang, ctx.code);
    const cur = lang === 'ur' ? 'ur' : 'en';
    const where = x.line ? say(`Look at line ${x.line}. `, `لائن ${x.line} دیکھیں۔ `) : '';
    return { mood: 'oops', text: `${x.title[cur]}\n${where}${x.what[cur]}\n${x.how[cur]}${x.fixedCode ? say('\nThere is an "Apply fix" button in the Output tab.', '\nآؤٹ پٹ ٹیب میں "درستی لگائیں" کا بٹن موجود ہے۔') : ''}` };
  }
  const lint = lintCode(ctx.code, ctx.lang);
  if (lint.length) return { mood: 'think', text: say('I spotted something before running:\n', 'چلانے سے پہلے مجھے یہ نظر آیا:\n') + lint.slice(0, 3).map(f => '- ' + say(f.en, f.ur)).join('\n') };
  if (!ctx.run) return { mood: 'think', text: say('Press Run first so I can see what happens. Then ask me again!', 'پہلے Run دبائیں تاکہ میں دیکھ سکوں کیا ہوتا ہے۔ پھر دوبارہ پوچھیں!') };
  return replyHint(q, ctx);
}

function replyHint(q, ctx) {
  const goals = ctx.meta.goals;
  if (ctx.run && ctx.goals && !ctx.goals.all && ctx.run.res.ok) {
    const i = ctx.goals.results.findIndex(r => !r);
    const hint = ctx.meta.hints[Math.min(i, ctx.meta.hints.length - 1)];
    return { mood: 'think', text: `${say('Almost! This goal is not done yet:', 'تقریباً! یہ مقصد ابھی باقی ہے:')} "${T(goals[i])}"${hint ? '\n' + say('Hint: ', 'اشارہ: ') + T(hint) : ''}` };
  }
  if (ctx.goals && ctx.goals.all) return { mood: 'wow', text: say('All goals done! Try changing numbers or words to make it your own, then go to the next lesson.', 'تمام مقاصد مکمل! اسے اپنا بنانے کے لیے نمبر یا الفاظ بدلیں، پھر اگلے سبق پر جائیں۔') };
  const lint = lintCode(ctx.code, ctx.lang);
  if (lint.length) return { mood: 'think', text: say(lint[0].en, lint[0].ur) };
  const hint = ctx.meta.hints[0];
  if (hint) return { mood: 'think', text: say('Start here: ', 'یہاں سے شروع کریں: ') + T(hint) + say('\nThen press Run and I will check your goals.', '\nپھر Run دبائیں، میں آپ کے مقاصد چیک کروں گا۔') };
  return { mood: 'happy', text: say('Try a small change, press Run, and see what happens. Small steps win!', 'چھوٹی سی تبدیلی کریں، Run دبائیں اور دیکھیں کیا ہوتا ہے۔ چھوٹے قدم جیتتے ہیں!') };
}

function replyConcept(q, ctx) {
  const g = glossaryMatch(q);
  return { mood: 'happy', text: `${T(g)}\n\`\`\`\n${g.ex[ctx.lang]}\n\`\`\`` };
}

function replyOther(q, ctx) {
  const lint = lintCode(ctx.code, ctx.lang);
  const extra = lint.length ? '\n' + say('By the way: ', 'ویسے: ') + say(lint[0].en, lint[0].ur) : '';
  return { mood: 'think', text: say('I am a coding helper, so I know about your program, errors, hints and ideas like variables, loops and functions. Try one of the buttons below!', 'میں کوڈنگ کا مددگار ہوں، اس لیے آپ کے پروگرام، غلطیوں، اشاروں اور ویری ایبلز، لوپس اور فنکشنز کے بارے میں جانتا ہوں۔ نیچے والا کوئی بٹن آزمائیں!') + extra };
}

function chatTextHTML(text) {
  const parts = String(text).split(/```(?:\w+)?\n?/);
  return parts.map((p, i) => (i % 2 ? `<pre>${esc(p.replace(/\n$/, ''))}</pre>` : rich(p))).join('');
}

function renderChat() {
  const list = chatHistory();
  const chat = $('#chat');
  if (!chat) return;
  if (!list.length) {
    chat.innerHTML = `<div class="msg bot"><span class="who">${buddySVG('wave', 34)}</span><div class="bubble">${chatTextHTML(t('buddyHello'))}</div></div>`;
    return;
  }
  chat.innerHTML = list.map(m => `<div class="msg ${m.who}">${m.who === 'bot' ? `<span class="who">${buddySVG(m.mood || 'happy', 34)}</span>` : ''}<div class="bubble">${chatTextHTML(m.text)}${m.who === 'bot' ? `<span class="src">${esc(t('src_' + (m.src || 'offline')))}</span>` : ''}</div></div>`).join('');
  const pane = $('#paneBuddy');
  pane.scrollTop = pane.scrollHeight;
}

function setBuddyMood(mood) {
  buddyMood = mood;
  const face = $('#buddyFace');
  if (face) face.innerHTML = buddySVG(mood, 56, mood === 'wow' ? 'cheer' : '');
}

function renderBuddyMood(res) {
  const win = S.goalState && S.goalState.all;
  setBuddyMood(!res.ok ? 'oops' : win ? 'wow' : 'happy');
}

function pushChat(msg) {
  const list = chatHistory();
  list.push({ ...msg, ts: Date.now() });
  saveChat(list);
  renderChat();
}

async function mentorAsk(question) {
  const q = String(question || '').trim();
  if (!q) return;
  if (S.sideTab !== 'buddy') setSideTab('buddy');
  pushChat({ who: 'me', text: q });
  const fresh = [];
  updateProfile(p => {
    p.stats.mentor++;
    markActivity(p);
    fresh.push(...awardBadges(p));
  });
  fresh.forEach(b => toast(t('badgeEarned', { name: T(b.title) }), 'ok'));
  const ctx = mentorContext();
  if (aiActive()) {
    await askLiveAi(q, ctx);
    return;
  }
  const r = offlineReply(q, ctx);
  setBuddyMood(r.mood);
  pushChat({ who: 'bot', text: r.text, mood: r.mood, src: 'offline' });
  // TODO(student): read Buddy's replies aloud with the Web Speech API (Urdu voice where available) for younger learners.
}

async function askLiveAi(q, ctx) {
  const chat = $('#chat');
  const live = document.createElement('div');
  live.className = 'msg bot';
  live.innerHTML = `<span class="who">${buddySVG('think', 34)}</span><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>`;
  chat.append(live);
  let streamed = '';
  try {
    const r = await aiMentorReply(q, ctx, delta => {
      streamed += delta;
      live.querySelector('.bubble').innerHTML = chatTextHTML(streamed);
    });
    if (r.refusal) pushChat({ who: 'bot', text: t('aiRefusal'), mood: 'think', src: 'notice' });
    else pushChat({ who: 'bot', text: r.text || t('aiEmpty'), mood: 'happy', src: 'ai' });
    setBuddyMood('happy');
  } catch (err) {
    const info = err && err.info ? err.info : { code: 'unknown', message: String((err && err.message) || err) };
    pushChat({ who: 'bot', text: t('aiErr_' + info.code, { status: info.status ?? '', msg: info.message ?? '' }) + '\n' + t('aiFallback'), mood: 'oops', src: 'notice' });
    const r = offlineReply(q, ctx);
    pushChat({ who: 'bot', text: r.text, mood: r.mood, src: 'offline' });
  }
}

function updateTokenNote() {
  const note = $('#tokenNote');
  if (!note) return;
  if (!aiActive()) {
    note.textContent = '';
    return;
  }
  const est = estimateTokens(KID_SAFE_SYSTEM + mentorContextText(mentorContext()) + chatHistory().map(m => m.text).join(''));
  const model = AI_MODELS.find(m => m.id === settings().ai.model) || AI_MODELS[0];
  note.textContent = t('tokenEstimate', { n: est.toLocaleString('en-PK'), cost: ((est / 1e6) * model.inUsd).toFixed(4) });
}

const AI_SDK_URL = 'https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.131.0/+esm';
const AI_MODELS = [
  { id: 'claude-opus-5-5', name: 'Claude Opus 5.5', inUsd: 4, outUsd: 20 },
  { id: 'claude-sonnet-5-5', name: 'Claude Sonnet 5.5', inUsd: 2, outUsd: 10 },
  { id: 'claude-haiku-5-5', name: 'Claude Haiku 5.5', inUsd: 0.1, outUsd: 0.5 },
];

const KID_SAFE_SYSTEM = `You are Buddy, a friendly robot coding mentor inside CodeBuddy, a learning app for children (about 9 to 16 years old) and other beginners in Pakistan.
How you help:
- Explain in short, simple sentences (at most 120 words) with a warm, encouraging tone. Celebrate effort.
- Guide with hints and questions. Do not write the whole solution for a lesson or project; show at most 3 lines of code at a time, and only for the step the learner is on.
- Use the learner's language: JavaScript or Python, beginner features only (print/console.log, variables, if, loops, functions, lists, turtle).
- When there is an error, say which line, what it means in plain words, and one small fix to try.
- If the learner writes in Urdu or Roman Urdu, reply in the same style; keep code and keywords in English.
Safety rules:
- Talk only about coding, this app and learning. For anything else, kindly steer back to the lesson.
- Never ask for or repeat personal information (full name, school, address, phone, photos, passwords). If the learner shares some, remind them not to share personal details online.
- No scary, violent, adult, hateful or dangerous content, and no links to websites.
- If the learner seems upset or unsafe, say kindly that they should talk to a parent, teacher or another trusted adult.`;

let anthropicModule = null;

async function loadAiSdk() {
  if (anthropicModule) return anthropicModule;
  const { default: Anthropic } = await import('https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.131.0/+esm');
  anthropicModule = Anthropic;
  return Anthropic;
}

// The key stays in sessionStorage unless the learner ticks "remember on this device".
function aiKey() {
  return session.get('aikey') || store.get('aikey', '') || '';
}

function setAiKey(key, remember) {
  session.set('aikey', key || null);
  if (remember && key) store.set('aikey', key);
  else store.remove('aikey');
}

const aiActive = () => settings().ai.enabled && !!aiKey();

async function aiClient() {
  // TODO(student): route Live AI through your own server proxy so the key never reaches the browser; add per-class rate limits and logging there.
  const Anthropic = await loadAiSdk();
  const client = new Anthropic({ apiKey: aiKey(), dangerouslyAllowBrowser: true });
  return { client, Anthropic };
}

// Server-side fallback is available on Opus 5.5 and Sonnet 5.5, not on Haiku 5.5.
function aiFallbackParams(model) {
  if (model === 'claude-opus-5-5' || model === 'claude-sonnet-5-5') return { betas: ['server-side-fallback-2026-07-01'], fallbacks: 'default' };
  return {};
}

function buildAiParams({ model, system, messages }) {
  const fb = aiFallbackParams(model);
  return { model, max_tokens: 16000, system, messages, output_config: { effort: 'low' }, ...fb };
}

// Alternating user/assistant turns that start and end with the user (never a prefilled assistant turn).
function buildAiMessages(history, question, contextText) {
  const turns = history
    .filter(m => m.src !== 'notice' && (m.who === 'me' || m.src === 'ai'))
    .slice(-8)
    .map(m => ({ role: m.who === 'me' ? 'user' : 'assistant', content: m.text }));
  if (turns.length && turns[turns.length - 1].role === 'user' && turns[turns.length - 1].content === question) turns.pop();
  turns.push({ role: 'user', content: `${contextText}\n\nLearner's message: ${question}` });
  const merged = [];
  turns.forEach(m => {
    const last = merged[merged.length - 1];
    if (last && last.role === m.role) last.content += '\n\n' + m.content;
    else merged.push({ ...m });
  });
  while (merged.length && merged[0].role !== 'user') merged.shift();
  return merged;
}

function mentorContextText(ctx) {
  const lines = [`App language: ${lang === 'ur' ? 'Urdu' : 'English'}. Code language: ${ctx.lang === 'py' ? 'Python' : 'JavaScript'}.`];
  if (ctx.meta) lines.push(`Current ${ctx.meta.kind}: ${ctx.meta.title}.`);
  if (ctx.meta && ctx.meta.goals.length) lines.push('Goals: ' + ctx.meta.goals.map((g, i) => `${g.en}${ctx.goals ? (ctx.goals.results[i] ? ' [done]' : ' [not yet]') : ''}`).join('; '));
  lines.push('Code:\n```\n' + ctx.code.slice(0, 6000) + '\n```');
  if (ctx.run) {
    const out = outputText(ctx.run.res).slice(0, 1500);
    lines.push('Last output:\n```\n' + out + '\n```');
    if (ctx.run.res.error) lines.push(`Last error: ${ctx.run.res.error.type}: ${ctx.run.res.error.message} (line ${ctx.run.res.error.line || '?'})`);
  }
  return lines.join('\n');
}

function aiReadMessage(msg) {
  if (msg.stop_reason === 'refusal') return { refusal: true, text: '' };
  const text = msg.content.filter(block => block.type === 'text').map(block => block.text).join('');
  return { refusal: false, text, usage: msg.usage };
}

async function aiCreate(client, params) {
  const msg = await client.beta.messages.create(params);
  return aiReadMessage(msg);
}

async function aiStream(client, params, onText) {
  const stream = client.beta.messages.stream(params);
  for await (const event of stream) {
    if (event.type === 'content_block_delta' && event.delta.type === 'text_delta') onText(event.delta.text);
  }
  const msg = await stream.finalMessage();
  return aiReadMessage(msg);
}

// Most specific first; APIConnectionError is checked before the general APIError.
function aiErrorInfo(err, Anthropic) {
  if (Anthropic && err instanceof Anthropic.AuthenticationError) return { code: 'auth' };
  if (Anthropic && err instanceof Anthropic.NotFoundError) return { code: 'model' };
  if (Anthropic && err instanceof Anthropic.RateLimitError) return { code: 'rate' };
  if (Anthropic && err instanceof Anthropic.APIConnectionError) return { code: 'offline' };
  if (Anthropic && err instanceof Anthropic.APIError) return { code: 'api', status: err.status, message: err.message };
  return { code: 'unknown', message: String((err && err.message) || err) };
}

async function aiCountTokens(client, { model, system, messages }) {

const BLOCK_COLORS = ['tomato', 'orange', 'gold', 'seagreen', 'teal', 'royalblue', 'purple', 'hotpink', 'black'];
const COMPARE_MAP = { eq: ['==', '==='], ne: ['!=', '!=='], lt: ['<', '<'], gt: ['>', '>'], le: ['<=', '<='], ge: ['>=', '>='] };
const BK = { target: { parent: 'root', branch: 'body', index: null }, drag: null };
