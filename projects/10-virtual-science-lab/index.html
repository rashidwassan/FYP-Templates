<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual Science Lab</title>
<meta name="description" content="Eight interactive physics and chemistry simulations for schools without laboratories: pendulum, projectile, Ohm's law, waves, lenses, titration, gas laws and osmosis, with live graphs, bilingual theory, auto-checked worksheets and printable lab reports.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f4f1;--paper:#fff;--ink:#15161a;--muted:#6b6e78;--line:#dcdde3;--graphite:#23252d;--graphite-2:#2f323c;--graphite-3:#3b3f4b;--acid:#c8e24a;--acid-deep:#8da315;--acid-soft:#f1f7d3;
  --blue:#3b82f6;--blue-soft:#dbeafe;--red:#ef4444;--red-soft:#fee2e2;--amber:#f59e0b;--amber-soft:#fef3c7;--violet:#8b5cf6;--violet-soft:#ede9fe;--green:#22c55e;--green-soft:#dcfce7;
  --radius:16px;--shadow:0 16px 40px -28px rgba(21,22,26,.35);--font:"Figtree",system-ui,sans-serif;--display:"Space Grotesk","Figtree",sans-serif;--font-ur:"Noto Nastaliq Urdu",serif;--ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--display);line-height:1.15;letter-spacing:-.01em}
.ur{font-family:var(--font-ur);line-height:1.9;direction:rtl;text-align:right}
.muted{color:var(--muted)} .hidden{display:none!important}
.ic{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.enter{animation:fadeUp .35s var(--ease) both}
.stagger>*{animation:fadeUp .45s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
/* shell */
.shell{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
.side{background:var(--graphite);color:#e9eaee;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brand .logo{width:40px;height:40px;border-radius:12px;background:var(--acid);display:grid;place-items:center;color:var(--graphite);flex:none}
.brand h1{font-size:1.05rem;color:#fff} .brand small{display:block;font-size:.72rem;color:#aab0bf;font-family:var(--font)}
.side h3{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:#8d93a3;margin:12px 8px 4px;font-family:var(--font)}
.exp{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;color:#d7dae2;cursor:pointer;border:1px solid transparent;transition:background .2s,transform .15s}
.exp:hover{background:var(--graphite-2)} .exp.on{background:var(--graphite-3);border-color:#4a4f5e;color:#fff}
.exp .icw{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--graphite-2);color:var(--acid);flex:none}
.exp.on .icw{background:var(--acid);color:var(--graphite)}
.exp b{display:block;font-size:.92rem;font-weight:600} .exp small{color:#9aa0b0;font-size:.74rem}
.exp .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:#4a4f5e} .exp .dot.done{background:var(--acid)}
.side .foot{margin-top:auto;display:grid;gap:8px;padding-top:12px}
.sbtn{border:1px solid #4a4f5e;background:var(--graphite-2);color:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center;font-weight:600}
/* main */
main{padding:20px 22px 60px;max-width:1240px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.head h2{font-size:1.6rem} .head p{margin:4px 0 0;color:var(--muted);max-width:720px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.74rem;font-weight:700;background:var(--paper);border:1px solid var(--line);color:var(--muted)}
.pill.phys{color:#2563eb} .pill.chem{color:#b45309} .pill.bio{color:#15803d}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.stage{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);position:relative}
.stage canvas{display:block;width:100%;height:auto}
.transport{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:#fafaf8;flex-wrap:wrap}
.btn{border:0;border-radius:11px;padding:9px 14px;font-weight:700;cursor:pointer;background:var(--graphite);color:#fff;display:inline-flex;align-items:center;gap:8px;transition:transform .15s var(--ease),box-shadow .15s}
.btn:hover{transform:translateY(-1px)} .btn:active{transform:scale(.98)}
.btn.acid{background:var(--acid);color:var(--graphite)} .btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)} .btn.sm{padding:6px 10px;font-size:.84rem;border-radius:9px} .btn:disabled{opacity:.45;cursor:not-allowed}
.speed{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);margin-left:auto}
.speed input{width:90px;accent-color:var(--acid-deep)}
/* controls */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.panel h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-family:var(--font);margin-bottom:10px}
.ctl{margin-bottom:12px}
.ctl label{display:flex;justify-content:space-between;font-size:.86rem;font-weight:600;margin-bottom:4px}
.ctl label span.v{font-family:var(--display);color:var(--acid-deep);font-variant-numeric:tabular-nums}
.ctl input[type=range]{width:100%;accent-color:var(--acid-deep)}
.ctl select{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}
.reads{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.read{background:var(--bg);border-radius:12px;padding:10px 12px}
.read .l{font-size:.72rem;color:var(--muted);font-weight:600} .read .v{font-family:var(--display);font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums;transition:color .2s}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
/* tabs */
.tabs{display:flex;gap:4px;margin:16px 0 10px;border-bottom:1px solid var(--line);overflow:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acid)}
.tabpane{display:none} .tabpane.on{display:block}
.graphwrap{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
.graphwrap canvas{width:100%;height:260px;display:block}
.theory{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr 1fr;gap:18px}
.theory .f{font-family:var(--display);font-size:1.15rem;background:var(--acid-soft);border-radius:10px;padding:8px 12px;display:inline-block;margin:6px 0}
.q{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:36px 1fr;gap:12px}
.q .n{width:32px;height:32px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700;font-family:var(--display)}
.q.ok{border-color:var(--green)} .q.ok .n{background:var(--green-soft);color:#15803d} .q.bad{border-color:var(--red)} .q.bad .n{background:var(--red-soft);color:#b91c1c}
.q input[type=number]{width:140px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.q .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:600}
.opt.on{background:var(--graphite);color:#fff;border-color:var(--graphite)}
.score{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.ring{width:64px;height:64px}
.report{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.report table{width:100%;border-collapse:collapse;font-size:.9rem} .report td,.report th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.report input[type=text]{border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:260px}
.todo{border:1px dashed var(--graphite);border-radius:12px;padding:12px 14px;background:var(--paper)}
.todo h4{font-size:.95rem;display:flex;gap:8px;align-items:center;margin-bottom:4px;font-family:var(--font)} .tag{font-size:.68rem;background:var(--graphite);color:var(--acid);border-radius:6px;padding:2px 6px;font-weight:700}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.list{display:grid;gap:10px}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:grid;gap:8px;z-index:60}
.toast{background:var(--graphite);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;animation:fadeUp .25s var(--ease);display:flex;gap:8px;align-items:center}
.toast.ok{background:#15803d} .toast.bad{background:#b91c1c}
.mobilebar{display:none;gap:6px;overflow:auto;padding:0 0 10px;scrollbar-width:none}
.mobilebar::-webkit-scrollbar{display:none}
.mobilebar .exp{flex:none;background:var(--paper);color:var(--ink);border:1px solid var(--line);padding:7px 10px}
.mobilebar .exp .icw{background:var(--bg);color:var(--acid-deep)} .mobilebar .exp.on{background:var(--graphite);color:#fff} .mobilebar .exp.on .icw{background:var(--acid);color:var(--graphite)} .mobilebar .exp small,.mobilebar .exp .dot{display:none}
@media (max-width:1000px){.shell{grid-template-columns:minmax(0,1fr)}main{min-width:0}.side{display:none}.mobilebar{display:flex}.lab{grid-template-columns:minmax(0,1fr)}.theory{grid-template-columns:1fr}main{padding:14px 14px 60px}}
@media print{body *{visibility:hidden}.report,.report *{visibility:visible}.report{position:absolute;left:0;top:0;width:100%;border:0;box-shadow:none}}
</style>
</head>

<script>
'use strict';
/* =====================================================================
   Virtual Science Lab — single file
   utils · i18n · simulation runner (fixed-step loop, DPR canvas, graph) ·
   8 experiments (pendulum, projectile, ohm, waves, lens, titration, gas, osmosis) ·
   worksheets (auto-check) · lab report · about.   Student hooks: TODO(student)
   ===================================================================== */
const NS = 'vlab:';
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const store = { get(k, d) { try { const v = localStorage.getItem(NS + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(NS + k, JSON.stringify(v)); } catch {} } };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = n => `<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const toast = (m, type = '', icon = '') => { const t = document.createElement('div'); t.className = 'toast ' + type; t.innerHTML = (icon ? ic(icon) : '') + esc(m); $('#toasts').append(t); setTimeout(() => t.remove(), 2600); };
const fmt = (v, d = 2) => Number.isFinite(v) ? (Math.abs(v) >= 1000 ? v.toFixed(0) : v.toFixed(d)) : '—';
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- i18n ----------
const TXT = {
  en: { title: 'Virtual Science Lab', tagline: 'Experiments for schools without labs', about: 'About', reset: 'Reset', params: 'Parameters', readouts: 'Measurements', play: 'Run', pause: 'Pause', physics: 'Physics', chemistry: 'Chemistry', biology: 'Biology',
    t_graph: 'Graph', t_theory: 'Theory', t_ws: 'Worksheet', t_report: 'Lab report', t_about: 'About', formula: 'Key relation', check: 'Check', correct: 'Correct', wrong: 'Not yet — try again', hint: 'Hint', score: 'Worksheet score', unit: 'unit', yourAnswer: 'Your answer',
